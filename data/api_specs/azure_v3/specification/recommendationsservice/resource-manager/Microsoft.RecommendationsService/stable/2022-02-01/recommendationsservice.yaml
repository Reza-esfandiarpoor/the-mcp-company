servers:
- url: https://management.azure.com
components:
  parameters:
    AccountNameParameter:
      description: The name of the RecommendationsService Account resource.
      name: accountName
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ModelingNameParameter:
      description: The name of the Modeling resource.
      name: modelingName
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ServiceEndpointNameParameter:
      description: The name of the ServiceEndpoint resource.
      name: serviceEndpointName
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation.
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription.
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group. The name is case insensitive.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
    LocationParameter:
      name: location
      in: path
      required: true
      description: The name of Azure region.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
    OperationIdParameter:
      name: operationId
      in: path
      required: true
      description: The ID of an ongoing async operation.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow.
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: Impersonate your user account.
  schemas:
    Tags:
      description: Resource tags.
      type: object
      readOnly: false
      additionalProperties:
        type: string
    EndpointAuthentication:
      description: Service endpoints authentication details.
      type: object
      properties:
        aadTenantID:
          description: AAD tenant ID.
          type: string
        principalID:
          description: AAD principal ID.
          type: string
        principalType:
          description: AAD principal type.
          type: string
          enum:
          - Application
          - User
          x-ms-enum:
            name: principalType
            modelAsString: true
    EndpointAuthenticationsList:
      description: The list of service endpoints authentication details.
      type: array
      items:
        $ref: '#/components/schemas/EndpointAuthentication'
      x-ms-identifiers: []
    CorsRule:
      description: CORS details.
      type: object
      required:
      - allowedOrigins
      properties:
        allowedOrigins:
          description: The origin domains that are permitted to make a request against
            the service via CORS.
          type: array
          items:
            type: string
          minItems: 1
        allowedMethods:
          description: The methods (HTTP request verbs) that the origin domain may
            use for a CORS request.
          type: array
          items:
            type: string
        allowedHeaders:
          description: The request headers that the origin domain may specify on the
            CORS request.
          type: array
          items:
            type: string
        exposedHeaders:
          description: The response headers to expose to CORS clients.
          type: array
          items:
            type: string
        maxAgeInSeconds:
          description: The number of seconds that the client/browser should cache
            a preflight response.
          type: integer
          format: int32
          minimum: 0
    CorsRuleList:
      description: The list of CORS details.
      type: array
      items:
        $ref: '#/components/schemas/CorsRule'
      x-ms-identifiers: []
    AccountResource:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        properties:
          description: Account resource properties.
          type: object
          properties:
            configuration:
              description: Account configuration. This can only be set at RecommendationsService
                Account creation.
              type: string
              x-ms-mutability:
              - read
              - create
              enum:
              - Free
              - Capacity
              x-ms-enum:
                name: AccountConfiguration
                modelAsString: true
            endpointAuthentications:
              $ref: '#/components/schemas/EndpointAuthenticationsList'
            cors:
              $ref: '#/components/schemas/CorsRuleList'
            reportsConnectionString:
              description: Connection string to write Accounts reports to.
              type: string
            provisioningState:
              description: The resource provisioning state.
              type: string
              readOnly: true
        systemData:
          $ref: '#/components/schemas/systemData'
      description: Account resource details.
    AccountResourceList:
      description: The list of RecommendationsService Account resources.
      type: object
      properties:
        nextLink:
          description: The link used to get the next page of RecommendationsService
            Account resources list.
          type: string
        value:
          description: The list of RecommendationsService Account resources.
          type: array
          items:
            $ref: '#/components/schemas/AccountResource'
    AccountPatchResource:
      description: Account resource patch details.
      type: object
      properties:
        tags:
          $ref: '#/components/schemas/Tags'
        properties:
          description: Account resource patch properties.
          type: object
          properties:
            endpointAuthentications:
              $ref: '#/components/schemas/EndpointAuthenticationsList'
            cors:
              $ref: '#/components/schemas/CorsRuleList'
            reportsConnectionString:
              description: Connection string to write Accounts reports to.
              type: string
    ModelingInputData:
      description: The configuration to raw CDM data to be used as Modeling resource
        input.
      type: object
      properties:
        connectionString:
          description: Connection string to raw input data.
          type: string
    ModelingResource:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        properties:
          description: Modeling resource properties.
          type: object
          properties:
            features:
              description: Modeling features controls the set of supported scenarios\models
                being computed. This can only be set at Modeling creation.
              type: string
              x-ms-mutability:
              - read
              - create
              enum:
              - Basic
              - Standard
              - Premium
              x-ms-enum:
                name: ModelingFeatures
                modelAsString: true
            frequency:
              description: Modeling frequency controls the modeling compute frequency.
              type: string
              x-ms-mutability:
              - read
              - create
              enum:
              - Low
              - Medium
              - High
              x-ms-enum:
                name: ModelingFrequency
                modelAsString: true
            size:
              description: Modeling size controls the maximum supported input data
                size.
              type: string
              x-ms-mutability:
              - read
              - create
              enum:
              - Small
              - Medium
              - Large
              x-ms-enum:
                name: ModelingSize
                modelAsString: true
            inputData:
              $ref: '#/components/schemas/ModelingInputData'
            provisioningState:
              description: The resource provisioning state.
              type: string
              readOnly: true
        systemData:
          $ref: '#/components/schemas/systemData'
      description: Modeling resource details.
    ModelingResourceList:
      description: The list of Modeling resources.
      type: object
      properties:
        nextLink:
          description: The link used to get the next page of Modeling resources list.
          type: string
        value:
          description: The list of Modeling resources.
          type: array
