                                be created
                            description:
                              type: string
                              description: Description of the extension type
                            publisher:
                              type: string
                              description: Name of the publisher for the Extension
                                Type
                            planInfo:
                              description: Plan information only for the Marketplace
                                Extension Type.
                              type: object
                              properties:
                                publisherId:
                                  type: string
                                  description: Publisher ID of the Marketplace Extension
                                    Type.
                                planId:
                                  type: string
                                  description: Plan ID of the Marketplace Extension
                                    Type.
                                offerId:
                                  type: string
                                  description: Offer or Product ID of the Marketplace
                                    Extension Type.
                            supportedClusterTypes:
                              description: Cluster Types supported for this Extension
                                Type.
                              type: array
                              items:
                                type: string
                            supportedScopes:
                              description: Supported Kubernetes Scopes for this Extension
                                Type.
                              type: object
                              properties:
