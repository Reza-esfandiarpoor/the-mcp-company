                                    properties:
                                      type: object
                                      x-ms-client-flatten: true
                                      description: Extension scope settings
                                      properties:
                                        allowMultipleInstances:
                                          type: boolean
                                          description: Describes if multiple instances
                                            of the extension are allowed
                                        defaultReleaseNamespace:
                                          type: string
                                          description: Default extension release namespace
                                  title: Resource
                                  description: Common fields that are returned in
                                    the response for all Azure Resource Manager resources
                                  x-ms-azure-resource: true
                      title: Resource
