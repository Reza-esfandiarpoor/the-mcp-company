openapi: 3.0.0
info:
  version: 2024-11-01-preview
  title: ExtensionTypesClient
  description: Use these APIs to view extension type resources through ARM, for Kubernetes
    Clusters.
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.KubernetesConfiguration/locations/{location}/extensionTypes:
    get:
      tags:
      - ExtensionTypes
      - ClusterExtensionTypes
      description: List all Extension Types for the location.
      operationId: ExtensionTypes_LocationList
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: location
        in: path
        description: The name of Azure region.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
      - name: publisherId
        in: query
        description: Filter results by Publisher ID of a marketplace extension type
        required: false
        schema:
          type: string
      - name: offerId
        in: query
        description: Filter results by Offer or Product ID of a marketplace extension
          type
        required: false
        schema:
          type: string
      - name: planId
        in: query
        description: Filter results by Plan ID of a marketplace extension type
        required: false
        schema:
          type: string
      - name: releaseTrain
        in: query
        description: Filter results by release train (default value is stable)
        required: false
        schema:
          type: string
      - name: clusterType
        in: query
        description: Filter results by the cluster type for extension types
        required: false
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: List Extension Types. It contains a list of ExtensionType
                  objects and a URL link to get the next set of results.
                type: object
                properties:
                  value:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          type: object
                          properties:
                            isSystemExtension:
                              type: boolean
                              description: Is this Extension Type a system extension.
                            isManagedIdentityRequired:
                              type: boolean
