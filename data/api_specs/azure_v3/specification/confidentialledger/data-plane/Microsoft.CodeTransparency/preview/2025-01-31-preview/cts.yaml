                            unspecified.  When "kid" values are used within a JWK
                            Set, different

                            keys within the JWK Set SHOULD use distinct "kid" values.  (One

                            example in which different keys might use the same "kid"
                            value is if

                            they have different "kty" (key type) values but are considered
                            to be

                            equivalent alternatives by the application using them.)  The
                            "kid"

                            value is a case-sensitive string.'
                        kty:
                          type: string
                          description: 'The "kty" (key type) parameter identifies
                            the cryptographic algorithm

                            family used with the key, such as "RSA" or "EC". "kty"
                            values should

                            either be registered in the IANA "JSON Web Key Types"
                            registry

                            established by [JWA] or be a value that contains a Collision-

                            Resistant Name.  The "kty" value is a case-sensitive string.'
                        n:
                          type: string
                          description: RSA modulus, in Base64
                        p:
