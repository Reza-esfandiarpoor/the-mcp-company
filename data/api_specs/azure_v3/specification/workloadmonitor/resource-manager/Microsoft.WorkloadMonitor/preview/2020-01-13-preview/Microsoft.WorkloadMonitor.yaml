  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{providerName}/{resourceCollectionName}/{resourceName}/providers/Microsoft.WorkloadMonitor/monitors
  : get:
      summary: 'Get the current health status of all monitors of a virtual machine.
        Optional parameters: $expand (retrieve the monitor''s evidence and configuration)
        and $filter (filter by monitor name).'
      operationId: HealthMonitors_List
      x-ms-pageable:
        nextLinkName: nextLink
