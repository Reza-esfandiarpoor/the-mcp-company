        description: 'The provider name (ex: Microsoft.Compute for virtual machines).'
        x-ms-parameter-location: method
        schema:
          type: string
      - in: path
        name: resourceCollectionName
        required: true
        description: 'The resource collection name (ex: virtualMachines for virtual
          machines).'
        x-ms-parameter-location: method
        schema:
          type: string
      - in: path
        name: resourceName
        required: true
        description: The name of the virtual machine.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: $filter
        in: query
        description: 'Optionally filter by monitor name. Example: $filter=monitorName
          eq ''logical-disks|C:|disk-free-space-mb.'''
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      - name: $expand
        in: query
        description: "Optionally expand the monitor\u2019s evidence and/or configuration.\
          \ Example: $expand=evidence,configuration."
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: The health monitors matching the specified criteria.
          content:
            application/json:
              schema:
                title: Information about the current health statuses of the monitors.
                type: object
                readOnly: true
                properties:
                  value:
                    description: Array of health monitors of the virtual machine.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          description: The resource Id.
                          type: string
                        name:
                          readOnly: true
                          description: The resource name.
                          type: string
                        type:
                          readOnly: true
                          description: The resource type.
                          type: string
                        properties:
                          description: Properties of the monitor's health status.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            monitorName:
                              description: Human-readable name of the monitor.
                              type: string
                            monitorType:
                              description: Type of the monitor.
                              type: string
                            monitoredObject:
                              description: Dynamic monitored object of the monitor.
                              type: string
                            parentMonitorName:
                              description: Name of the parent monitor.
                              type: string
                            previousMonitorState:
                              description: Previous health state of the monitor.
                              title: One of health states - healthy, critical, warning,
                                unknown, none, disabled.
                              type: string
                              readOnly: true
                              enum:
                              - Healthy
                              - Critical
                              - Warning
                              - Unknown
                              - Disabled
                              - None
                              x-ms-enum:
                                name: HealthState
                                modelAsString: true
                            currentMonitorState:
                              description: Current health state of the monitor.
                              title: One of health states - healthy, critical, warning,
                                unknown, none, disabled.
                              type: string
                              readOnly: true
                              enum:
                              - Healthy
                              - Critical
                              - Warning
                              - Unknown
                              - Disabled
                              - None
                              x-ms-enum:
                                name: HealthState
                                modelAsString: true
                            evaluationTimestamp:
                              description: Timestamp of the monitor's last health
                                evaluation.
                              type: string
                            currentStateFirstObservedTimestamp:
                              description: Timestamp of the monitor's last health
                                state change.
                              type: string
                            lastReportedTimestamp:
                              description: Timestamp of the monitor's last reported
                                health state.
                              type: string
                            evidence:
                              description: Evidence validating the monitor's current
                                health state.
                              type: object
                            monitorConfiguration:
                              description: The configuration settings at the time
                                of the monitor's health evaluation.
                              type: object
                      description: The resource model definition for the ARM proxy
                        resource, 'microsoft.workloadmonitor/monitors'.
                      x-ms-azure-resource: true
                      title: "Information about the monitor\u2019s current health\
                        \ status."
