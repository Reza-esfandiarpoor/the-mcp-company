openapi: 3.0.0
info:
  version: 2025-04-01
  title: RedisEnterpriseManagementClient
  description: REST API for managing Redis Enterprise resources in Azure.
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.Cache/operations:
    get:
      tags:
      - Operations
      description: Lists all of the available REST API operations of the Microsoft.Cache
        provider.
      operationId: Operations_List
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success. The response describes the list of operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Cache/locations/{location}/operationsStatus/{operationId}:
    get:
      tags:
      - OperationsStatus
      operationId: OperationsStatus_Get
      description: Gets the status of operation.
      parameters:
      - $ref: '#/components/parameters/LocationParameter'
      - $ref: '#/components/parameters/OperationIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Success. The detailed status of the operation is in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redisEnterprise/{clusterName}:
    put:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_Create
      description: Creates or updates an existing (overwrite/recreate, with potential
        downtime) cache cluster
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: original-uri
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cluster'
        description: Parameters supplied to the Create Redis Enterprise operation.
        required: true
      responses:
        '200':
          description: The cluster was/is being updated. Check provisioningState and
            resourceState to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '201':
          description: The cluster was/is being created. Check provisioningState and
            resourceState to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_Update
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      description: Updates an existing Redis Enterprise cluster
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterUpdate'
        description: Parameters supplied to the Update Redis Enterprise operation.
        required: true
      responses:
        '200':
          description: The cluster was/is being updated. Check provisioningState and
            resourceState to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '202':
          description: The cluster update operation was started. GET the URL in the
            Azure-AsyncOperation or Location headers to retrieve updated status.
          headers:
            Location:
              description: Location URI to poll for result
              schema:
                type: string
                format: uri
            Azure-AsyncOperation:
              description: Azure-AsyncOperation URI to poll for result
              schema:
                type: string
                format: uri
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_Delete
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      description: Deletes a Redis Enterprise cache cluster.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The cluster was successfully deleted.
        '202':
          description: The cluster delete operation was successfully started. GET
            the URL in the Azure-AsyncOperation or Location headers to retrieve updated
            status.
          headers:
            Location:
              description: Location URI to poll for result
              schema:
                type: string
                format: uri
            Azure-AsyncOperation:
              description: Azure-AsyncOperation URI to poll for result
              schema:
                type: string
                format: uri
        '204':
          description: The cluster was successfully deleted.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_Get
      description: Gets information about a Redis Enterprise cluster
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The request succeeded, response body contains the requested
            details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redisEnterprise:
    get:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_ListByResourceGroup
      description: Lists all Redis Enterprise clusters in a resource group.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The list of Redis Enterprise clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Cache/redisEnterprise:
    get:
      tags:
      - RedisEnterprise
      operationId: RedisEnterprise_List
      description: Lists all Redis Enterprise clusters in the specified subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The list of Redis Enterprise clusters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redisEnterprise/{clusterName}/databases
  : get:
      tags:
      - RedisEnterprise
      - Databases
      operationId: Databases_ListByCluster
      description: Gets all databases in the specified Redis Enterprise cluster.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      responses:
        '200':
          description: The list of databases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redisEnterprise/{clusterName}/databases/{databaseName}
  : put:
      tags:
      - RedisEnterprise
      - Databases
      operationId: Databases_Create
      description: Creates a database
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: original-uri
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/DatabaseNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Database'
        description: Parameters supplied to the create or update database operation.
        required: true
      responses:
        '200':
          description: The database was/is being updated. Check provisioningState
            and resourceState for detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '201':
          description: The database was/is being created. Check provisioningState
            and resourceState for detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - RedisEnterprise
      - Databases
      operationId: Databases_Update
      description: Updates a database
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/DatabaseNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdate'
        description: Parameters supplied to the create or update database operation.
        required: true
      responses:
        '200':
          description: The database was/is being updated. Check provisioningState
            and resourceState for detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '202':
          description: The database update operation was successfully started. GET
            the URL in the Azure-AsyncOperation or Location headers to retrieve updated
            status.
          headers:
            Location:
              description: Location URI to poll for result
              schema:
                type: string
                format: uri
            Azure-AsyncOperation:
              description: Azure-AsyncOperation URI to poll for result
              schema:
                type: string
                format: uri
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - RedisEnterprise
      - Databases
      operationId: Databases_Get
      description: Gets information about a database in a Redis Enterprise cluster.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/DatabaseNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successfully found the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - RedisEnterprise
      - Databases
      operationId: Databases_Delete
      description: Deletes a single database
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ClusterNameParameter'
      - $ref: '#/components/parameters/DatabaseNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successfully deleted the database.
        '202':
          description: The database delete operation started. GET the URL in the Azure-AsyncOperation
            or Location headers to retrieve updated status.
          headers:
            Location:
              description: Location URI to poll for result
              schema:
                type: string
                format: uri
            Azure-AsyncOperation:
              description: Azure-AsyncOperation URI to poll for result
              schema:
                type: string
                format: uri
        '204':
          description: Successfully deleted the database.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redisEnterprise/{clusterName}/databases/{databaseName}/listKeys
