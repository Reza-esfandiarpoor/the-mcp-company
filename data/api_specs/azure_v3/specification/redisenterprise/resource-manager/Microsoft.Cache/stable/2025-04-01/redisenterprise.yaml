servers:
- url: https://management.azure.com
components:
  parameters:
    ClusterNameParameter:
      name: clusterName
      in: path
      required: true
      description: The name of the Redis Enterprise cluster. Name must be 1-60 characters
        long. Allowed characters(A-Z, a-z, 0-9) and hyphen(-). There can be no leading
        nor trailing nor consecutive hyphens
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(?=.{1,60}$)[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
    DatabaseNameParameter:
      name: databaseName
      in: path
      required: true
      description: The name of the Redis Enterprise database.
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(?=.{1,60}$)[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
    AccessPolicyAssignmentNameParameter:
      name: accessPolicyAssignmentName
      in: path
      required: true
      description: The name of the Redis Enterprise database access policy assignment.
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{1,60}$
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    LocationParameter:
      name: location
      in: path
      description: The name of Azure region.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
    OperationIdParameter:
      name: operationId
      in: path
      description: The ID of an ongoing async operation.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription.
      required: true
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
    PrivateEndpointConnectionName:
      name: privateEndpointConnectionName
      in: path
      required: true
      description: The name of the private endpoint connection associated with the
        Azure resource
      x-ms-parameter-location: method
      schema:
        type: string
    parameters-SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription. The value must be an UUID.
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Kind:
      type: string
      readOnly: true
      description: Distinguishes the kind of cluster. Read-only.
      enum:
      - v1
      - v2
      x-ms-enum:
        name: Kind
        modelAsString: true
    Sku:
      description: SKU parameters supplied to the create Redis Enterprise cluster
        operation.
      type: object
      properties:
        name:
          type: string
          description: 'The level of Redis Enterprise cluster to deploy. Possible
            values: (''Balanced_B5'', ''MemoryOptimized_M10'', ''ComputeOptimized_X5'',
            etc.). For more information on SKUs see the latest pricing documentation.
            Note that additional SKUs may become supported in the future.'
          enum:
          - Enterprise_E1
          - Enterprise_E5
          - Enterprise_E10
          - Enterprise_E20
          - Enterprise_E50
          - Enterprise_E100
          - Enterprise_E200
          - Enterprise_E400
          - EnterpriseFlash_F300
          - EnterpriseFlash_F700
          - EnterpriseFlash_F1500
          - Balanced_B0
          - Balanced_B1
          - Balanced_B3
          - Balanced_B5
          - Balanced_B10
          - Balanced_B20
          - Balanced_B50
          - Balanced_B100
          - Balanced_B150
          - Balanced_B250
          - Balanced_B350
          - Balanced_B500
          - Balanced_B700
          - Balanced_B1000
          - MemoryOptimized_M10
          - MemoryOptimized_M20
          - MemoryOptimized_M50
          - MemoryOptimized_M100
          - MemoryOptimized_M150
          - MemoryOptimized_M250
          - MemoryOptimized_M350
          - MemoryOptimized_M500
          - MemoryOptimized_M700
          - MemoryOptimized_M1000
          - MemoryOptimized_M1500
          - MemoryOptimized_M2000
          - ComputeOptimized_X3
          - ComputeOptimized_X5
          - ComputeOptimized_X10
          - ComputeOptimized_X20
          - ComputeOptimized_X50
          - ComputeOptimized_X100
          - ComputeOptimized_X150
          - ComputeOptimized_X250
          - ComputeOptimized_X350
          - ComputeOptimized_X500
          - ComputeOptimized_X700
          - FlashOptimized_A250
          - FlashOptimized_A500
          - FlashOptimized_A700
          - FlashOptimized_A1000
          - FlashOptimized_A1500
          - FlashOptimized_A2000
          - FlashOptimized_A4500
          x-ms-enum:
            name: SkuName
            modelAsString: true
        capacity:
          type: integer
          format: int32
          description: This property is only used with Enterprise and EnterpriseFlash
            SKUs. Determines the size of the cluster. Valid values are (2, 4, 6, ...)
            for Enterprise SKUs and (3, 9, 15, ...) for EnterpriseFlash SKUs.
      required:
      - name
    ProvisioningState:
      type: string
      readOnly: true
      description: Current provisioning status
      enum:
      - Succeeded
      - Failed
      - Canceled
      - Creating
      - Updating
      - Deleting
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    ResourceState:
      type: string
      readOnly: true
      description: Current resource status
      enum:
      - Running
      - Creating
      - CreateFailed
      - Updating
      - UpdateFailed
      - Deleting
      - DeleteFailed
      - Enabling
      - EnableFailed
      - Disabling
      - DisableFailed
      - Disabled
      - Scaling
      - ScalingFailed
      - Moving
      x-ms-enum:
        name: ResourceState
        modelAsString: true
    Cluster:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/Kind'
        sku:
          $ref: '#/components/schemas/Sku'
        zones:
          type: array
          items:
            type: string
          description: The Availability Zones where this cluster will be deployed.
        identity:
          $ref: '#/components/schemas/ManagedServiceIdentity'
        properties:
          $ref: '#/components/schemas/ClusterProperties'
      required:
      - sku
      description: Describes the Redis Enterprise cluster
    ClusterUpdate:
      description: A partial update to the Redis Enterprise cluster
      type: object
      properties:
        sku:
          $ref: '#/components/schemas/Sku'
        properties:
          $ref: '#/components/schemas/ClusterProperties'
        identity:
          $ref: '#/components/schemas/ManagedServiceIdentity'
        tags:
          type: object
          additionalProperties:
            type: string
          x-ms-mutability:
          - read
          - create
          - update
          description: Resource tags.
    ClusterProperties:
      title: Redis Enterprise cluster properties
      description: Properties of Redis Enterprise clusters, as opposed to general
        resource properties like location, tags
      type: object
      properties:
        highAvailability:
          type: string
          description: Enabled by default. If highAvailability is disabled, the data
            set is not replicated. This affects the availability SLA, and increases
            the risk of data loss.
          enum:
          - Enabled
          - Disabled
          x-ms-enum:
            name: HighAvailability
            modelAsString: true
        minimumTlsVersion:
          type: string
          description: The minimum TLS version for the cluster to support, e.g. '1.2'.
            Newer versions can be added in the future. Note that TLS 1.0 and TLS 1.1
            are now completely obsolete -- you cannot use them. They are mentioned
            only for the sake of consistency with old API versions.
          enum:
          - '1.0'
          - '1.1'
          - '1.2'
          x-ms-enum:
            name: TlsVersion
            modelAsString: true
        encryption:
          type: object
          description: Encryption-at-rest configuration for the cluster.
          properties:
            customerManagedKeyEncryption:
              type: object
              description: All Customer-managed key encryption properties for the
                resource. Set this to an empty object to use Microsoft-managed key
                encryption.
              properties:
                keyEncryptionKeyIdentity:
                  type: object
                  description: All identity configuration for Customer-managed key
                    settings defining which identity should be used to auth to Key
                    Vault.
                  properties:
                    userAssignedIdentityResourceId:
                      type: string
                      description: 'User assigned identity to use for accessing key
                        encryption key Url. Ex: /subscriptions/<sub uuid>/resourceGroups/<resource
                        group>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myId.'
                    identityType:
                      type: string
                      enum:
                      - systemAssignedIdentity
                      - userAssignedIdentity
                      description: Only userAssignedIdentity is supported in this
                        API version; other types may be supported in the future
                      x-ms-enum:
                        name: CmkIdentityType
                        modelAsString: true
                keyEncryptionKeyUrl:
                  type: string
                  description: 'Key encryption key Url, versioned only. Ex: https://contosovault.vault.azure.net/keys/contosokek/562a4bb76b524a1493a6afe8e536ee78'
        hostName:
          type: string
          readOnly: true
          description: DNS name of the cluster endpoint
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        redundancyMode:
          type: string
          readOnly: true
          description: Explains the current redundancy strategy of the cluster, which
            affects the expected SLA.
          enum:
          - None
          - LR
          - ZR
          x-ms-enum:
            name: RedundancyMode
            modelAsString: true
            values:
            - name: None
              value: None
              description: No redundancy. Availability loss will occur.
            - name: LR
              value: LR
              description: Local redundancy with high availability.
            - name: ZR
              value: ZR
              description: Zone redundant. Higher availability.
        resourceState:
          $ref: '#/components/schemas/ResourceState'
        redisVersion:
          type: string
          readOnly: true
          description: Version of redis the cluster supports, e.g. '6'
        privateEndpointConnections:
          type: array
          readOnly: true
          description: List of private endpoint connections associated with the specified
            Redis Enterprise cluster
          items:
            $ref: '#/components/schemas/PrivateEndpointConnection'
    ClusterList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Cluster'
          description: List of clusters.
        nextLink:
          type: string
          readOnly: true
          description: The URI to fetch the next page of results.
      description: The response of a list-all operation.
    Database:
      $ref: '#/components/schemas/ProxyResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DatabaseProperties'
      description: Describes a database on the Redis Enterprise cluster
    DatabaseUpdate:
      description: A partial update to the Redis Enterprise database
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/DatabaseProperties'
    DatabaseProperties:
      title: Redis Enterprise database properties
      description: Properties of Redis Enterprise databases, as opposed to general
        resource properties like location, tags
      type: object
      properties:
        clientProtocol:
          type: string
          description: Specifies whether redis clients can connect using TLS-encrypted
            or plaintext redis protocols. Default is TLS-encrypted.
          enum:
          - Encrypted
          - Plaintext
          x-ms-enum:
            name: Protocol
            modelAsString: true
        port:
          type: integer
          format: int32
          x-ms-mutability:
          - read
          - create
          description: TCP port of the database endpoint. Specified at create time.
            Defaults to an available port.
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        resourceState:
          $ref: '#/components/schemas/ResourceState'
        clusteringPolicy:
          type: string
          description: Clustering policy - default is OSSCluster. This property must
            be chosen at create time, and cannot be changed without deleting the database.
          enum:
          - EnterpriseCluster
          - OSSCluster
          x-ms-mutability:
          - read
          - create
          x-ms-enum:
            name: ClusteringPolicy
            modelAsString: true
            values:
            - value: EnterpriseCluster
              name: EnterpriseCluster
              description: Enterprise clustering policy uses only the classic redis
                protocol, which does not support redis cluster commands.
            - value: OSSCluster
              name: OSSCluster
              description: OSS clustering policy follows the redis cluster specification,
                and requires all clients to support redis clustering.
        evictionPolicy:
          type: string
          description: Redis eviction policy - default is VolatileLRU
          enum:
          - AllKeysLFU
          - AllKeysLRU
          - AllKeysRandom
          - VolatileLRU
          - VolatileLFU
          - VolatileTTL
          - VolatileRandom
          - NoEviction
          x-ms-enum:
            name: EvictionPolicy
            modelAsString: true
        persistence:
          $ref: '#/components/schemas/Persistence'
        modules:
          type: array
          description: Optional set of redis modules to enable in this database -
            modules can only be added at creation time.
          items:
            $ref: '#/components/schemas/Module'
          x-ms-mutability:
          - read
          - create
          x-ms-identifiers:
          - name
        geoReplication:
          type: object
          description: Optional set of properties to configure geo replication for
            this database.
          x-ms-mutability:
          - read
          - create
          properties:
            groupNickname:
              type: string
              description: Name for the group of linked database resources
              x-ms-mutability:
              - read
              - create
            linkedDatabases:
              type: array
              description: List of database resources to link with this database
              items:
                $ref: '#/components/schemas/LinkedDatabase'
        redisVersion:
          type: string
          readOnly: true
          description: Version of Redis the database is running on, e.g. '6.0'
        deferUpgrade:
          type: string
          description: 'Option to defer upgrade when newest version is released -
            default is NotDeferred. Learn more: https://aka.ms/redisversionupgrade'
          enum:
          - Deferred
          - NotDeferred
          x-ms-enum:
            name: DeferUpgradeSetting
            modelAsString: true
        accessKeysAuthentication:
          type: string
          description: This property can be Enabled/Disabled to allow or deny access
            with the current access keys. Can be updated even after database is created.
          enum:
          - Disabled
          - Enabled
          x-ms-enum:
            name: accessKeysAuthentication
            modelAsString: true
    DatabaseList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Database'
          description: List of databases
        nextLink:
          type: string
          readOnly: true
          description: The URI to fetch the next page of results.
      description: The response of a list-all operation.
    AccessPolicyAssignmentProperties:
      title: Redis Enterprise database access policy assignment properties
      description: Properties of Redis Enterprise database access policy assignment.
      type: object
      properties:
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        accessPolicyName:
          type: string
          description: Name of access policy under specific access policy assignment.
            Only "default" policy is supported for now.
          pattern: ^([a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]|[a-zA-Z0-9])$
        user:
          type: object
          properties:
            objectId:
              type: string
              description: The object ID of the user.
          description: The user associated with the access policy.
      required:
      - user
      - accessPolicyName
    AccessPolicyAssignment:
      $ref: '#/components/schemas/definitions-ProxyResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/AccessPolicyAssignmentProperties'
      description: Describes the access policy assignment of Redis Enterprise database
    AccessPolicyAssignmentList:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/AccessPolicyAssignment'
          description: List of access policy assignments.
        nextLink:
          type: string
          readOnly: true
          description: The URI to fetch the next page of results.
      description: The response of a list-all operation.
    Persistence:
      title: Persistence settings
