info:
  title: ExternalIdentities
  version: 2021-04-01
  description: Manage the Azure resource for an Azure Active Directory B2C tenant
    and guestUsages resource for External Identities in Azure AD
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.AzureActiveDirectory/checkNameAvailability:
    post:
      tags:
      - B2CTenants
      operationId: B2CTenants_CheckNameAvailability
      description: Checks the availability and validity of a domain name for the tenant.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials which uniquely identify Microsoft Azure
          subscription. The subscription ID forms part of the URI for every service
          call.
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Version of the API to be used with the client request.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The information required to check the availability of the
                name for the tenant.
              required:
              - name
              - countryCode
              properties:
                name:
                  type: string
                  description: The domain name to check for availability.
                countryCode:
                  type: string
                  description: Country code of Azure tenant (e.g. 'US'). Refer to
                    [aka.ms/B2CDataResidency](https://aka.ms/B2CDataResidency) to
                    see valid country codes and corresponding data residency locations.
                    If you do not see a country code in an valid data residency location,
                    choose one from the list.
      responses:
        '200':
          description: The result of checking for the name availability.
          content:
            application/json:
              schema:
                description: Response of the CheckNameAvailability operation.
                type: object
                properties:
                  message:
                    type: string
                    description: Description of the reason if name is not available.
                  nameAvailable:
                    type: boolean
                    description: True if the name is available and can be used to
                      create a new tenant. Otherwise false.
                  reason:
                    description: Describes the reason for the 'nameAvailable' value.
                    type: string
                    enum:
                    - AlreadyExists
                    - Invalid
                    x-ms-enum:
                      name: NameAvailabilityReasonType
                      modelAsString: true
                      values:
                      - value: AlreadyExists
                        description: The name is already in use and is therefore unavailable.
                      - value: Invalid
                        description: "The name provided does not match the resource\
                          \ provider\u2019s naming requirements (incorrect length,\
                          \ unsupported characters, etc.)."
        default:
          description: Error response describing why the operation failed.
          content:
