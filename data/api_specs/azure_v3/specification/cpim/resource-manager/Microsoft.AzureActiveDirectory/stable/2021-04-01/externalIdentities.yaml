                    readOnly: true
                    items:
                      type: object
                      required:
                      - location
                      - sku
                      x-ms-azure-resource: true
                      properties:
                        type:
                          type: string
                          description: The type of the B2C tenant resource.
                          readOnly: true
                          enum:
                          - Microsoft.AzureActiveDirectory/b2cDirectories
                          x-ms-enum:
                            name: TypeValue
                            modelAsString: true
                            values:
                            - value: Microsoft.AzureActiveDirectory/b2cDirectories
                              description: The resource type for Azure AD B2C tenant
                                resource.
                        sku:
                          description: SKU properties of the Azure AD B2C tenant.
                            Learn more about Azure AD B2C billing at [aka.ms/b2cBilling](https://aka.ms/b2cBilling).
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the SKU for the tenant.
                              enum:
                              - Standard
                              - PremiumP1
                              - PremiumP2
                              x-ms-enum:
                                name: B2CResourceSKUName
                                modelAsString: true
                                values:
                                - value: Standard
