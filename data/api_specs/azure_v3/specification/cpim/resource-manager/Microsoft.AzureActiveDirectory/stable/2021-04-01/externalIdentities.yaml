                                    Azure subscription and uses number of authentications
                                    based billing.
                                - value: PremiumP2
                                  description: Azure AD B2C usage is billed to a linked
                                    Azure subscription and uses number of authentications
                                    based billing.
                            tier:
                              type: string
                              description: The tier of the tenant.
                              enum:
                              - A0
                              x-ms-enum:
                                name: B2CResourceSKUTier
                                modelAsString: true
                                values:
                                - value: A0
                                  description: The SKU tier used for all Azure AD
                                    B2C tenants.
                        properties:
                          x-ms-client-flatten: true
                          description: The Azure AD B2C tenant resource properties
                          type: object
                          properties:
                            billingConfig:
                              type: object
                              description: The billing configuration for the tenant.
                              properties:
                                billingType:
                                  type: string
                                  description: The type of billing. Will be MAU for
                                    all new customers. If 'Auths', it can be updated
                                    to 'MAU'. Cannot be changed if value is 'MAU'.
                                    Learn more about Azure AD B2C billing at [aka.ms/b2cBilling](https://aka.ms/b2cbilling).
                                  enum:
                                  - MAU
                                  - Auths
                                  x-ms-enum:
                                    name: BillingType
                                    modelAsString: true
                                    values:
                                    - value: MAU
                                      description: Azure AD B2C usage is billed to
                                        a linked Azure subscription and uses a monthly
                                        active users (MAU) billing model.
                                    - value: Auths
                                      description: Azure AD B2C usage is billed to
                                        a linked Azure subscription and uses number
                                        of authentications based billing.
                                effectiveStartDateUtc:
                                  type: string
                                  readOnly: true
                                  description: The data from which the billing type
                                    took effect
                            tenantId:
                              type: string
                              description: An identifier of the Azure AD B2C tenant.
                        id:
                          type: string
                          readOnly: true
