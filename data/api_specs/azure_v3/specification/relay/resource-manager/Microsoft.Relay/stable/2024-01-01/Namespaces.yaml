  /subscriptions/{subscriptionId}/providers/Microsoft.Relay/checkNameAvailability:
    post:
      tags:
      - Namespaces
      operationId: Namespaces_CheckNameAvailability
      description: Check the specified namespace name availability.
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials which uniquely identify the Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The namespace name to check for availability. The namespace
                    name can contain only letters, numbers, and hyphens. The namespace
                    must start with a letter, and it must end with a letter or number.
              required:
              - name
              description: Description of the check name availability request properties.
        description: Parameters to check availability of the specified namespace name.
        required: true
      responses:
        '200':
          description: Check availability returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    readOnly: true
                    description: The detailed info regarding the reason associated
                      with the namespace.
                  nameAvailable:
                    type: boolean
                    description: Value indicating namespace is available. Returns
                      true if the namespace is available; otherwise, false.
                  reason:
                    description: The reason for unavailability of a namespace.
                    type: string
                    enum:
                    - None
                    - InvalidName
                    - SubscriptionIsDisabled
                    - NameInUse
                    - NameInLockdown
                    - TooManyNamespaceInCurrentSubscription
                    x-ms-enum:
                      name: UnavailableReason
                      modelAsString: true
                description: Description of the check name availability request properties.
