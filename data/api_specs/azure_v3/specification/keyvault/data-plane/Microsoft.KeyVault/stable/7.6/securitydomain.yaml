            application/json:
              schema:
                type: object
                description: The Security Domain.
                properties:
                  value:
                    type: string
                    description: The Security Domain.
                required:
                - value
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                type: object
                description: The key vault error exception.
                properties:
                  error:
                    description: The key vault server error.
                    readOnly: true
                    type: object
                    properties:
                      code:
                        type: string
                        description: The error code.
                        readOnly: true
                      message:
                        type: string
                        description: The error message.
                        readOnly: true
                      innererror:
                        description: The key vault server error.
                        readOnly: true
                        x-ms-client-name: innerError
                        type: object
                        properties:
                          code:
                            type: string
                            description: The error code.
                            readOnly: true
                          message:
                            type: string
                            description: The error message.
                            readOnly: true
                          innererror:
                            description: The key vault server error.
                            readOnly: true
                            x-ms-client-name: innerError
                            type: object
                            properties:
                              code:
                                type: string
                                description: The error code.
                                readOnly: true
                              message:
                                type: string
                                description: The error message.
                                readOnly: true
                            nullable: true
                        nullable: true
                    nullable: true
