paths:
  /securitydomain/download:
    post:
      operationId: HSMSecurityDomain_Download
      description: Retrieves the Security Domain from the managed HSM. Calling this
        endpoint can be used to activate a provisioned managed HSM resource.
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        x-ms-parameter-location: method
        x-ms-client-name: apiVersion
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The Security Domain download operation requires customer
                to provide N certificates (minimum 3 and maximum 10) containing a
                public key in JWK format.
              properties:
                certificates:
                  type: array
                  description: Certificates needed from customer.
                  minItems: 3
                  maxItems: 10
                  items:
                    type: object
                    description: A JSON Web Key (JWK) for use in a security domain
                      operation.
                    properties:
                      kid:
                        type: string
                        description: Key identifier.
                      kty:
                        type: string
                        description: JsonWebKey Key Type (kty), as defined in https://tools.ietf.org/html/draft-ietf-jose-json-web-algorithms-40.
                          For Security Domain this value must be RSA.
                      key_ops:
                        type: array
                        description: Supported key operations.
                        items:
                          type: string
                      n:
                        type: string
                        description: RSA modulus.
                      e:
                        type: string
                        description: RSA public exponent.
                      x5c:
                        type: array
                        description: X509 certificate chain parameter.
                        items:
                          type: string
                      use:
                        type: string
                        description: Public Key Use Parameter. This is optional and
                          if present must be enc.
                      x5t:
                        type: string
                        description: X509 certificate SHA1 thumbprint. This is optional.
                      x5t#S256:
                        type: string
                        description: X509 certificate SHA256 thumbprint.
                      alg:
                        type: string
                        description: Algorithm intended for use with the key.
                    required:
                    - kid
                    - kty
                    - key_ops
                    - n
                    - e
                    - x5c
                    - x5t#S256
                    - alg
                required:
                  type: integer
                  format: int32
                  description: Customer to specify the number of certificates (minimum
                    2 and maximum 10) to restore Security Domain.
                  default: 2
                  minimum: 2
                  maximum: 10
              required:
              - certificates
        description: The Security Domain download operation requires customer to provide
          N certificates (minimum 3 and maximum 10) containing a public key in JWK
          format.
        required: true
