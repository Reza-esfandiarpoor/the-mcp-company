components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client API version.
      x-ms-parameter-location: client
      schema:
        type: string
  schemas:
    StorageRestoreParameters:
      properties:
        value:
          type: string
          x-ms-client-name: storageBundleBackup
          format: base64url
          description: The backup blob associated with a storage account.
      description: The secret restore parameters.
      required:
      - value
    StorageAccountAttributes:
      properties:
        enabled:
          type: boolean
          description: the enabled state of the object.
        created:
          type: integer
          format: unixtime
          readOnly: true
          description: Creation time in UTC.
        updated:
          type: integer
          format: unixtime
          readOnly: true
          description: Last updated time in UTC.
        recoverableDays:
          type: integer
          format: int32
          readOnly: true
          description: softDelete data retention days. Value should be >=7 and <=90
            when softDelete enabled, otherwise 0.
        recoveryLevel:
          type: string
          description: Reflects the deletion recovery level currently in effect for
            storage accounts in the current vault. If it contains 'Purgeable' the
            storage account can be permanently deleted by a privileged user; otherwise,
            only the system can purge the storage account, at the end of the retention
            interval.
          enum:
          - Purgeable
          - Recoverable+Purgeable
          - Recoverable
          - Recoverable+ProtectedSubscription
          - CustomizedRecoverable+Purgeable
          - CustomizedRecoverable
          - CustomizedRecoverable+ProtectedSubscription
          x-ms-enum:
            name: DeletionRecoveryLevel
            modelAsString: true
            values:
            - value: Purgeable
              description: Denotes a vault state in which deletion is an irreversible
                operation, without the possibility for recovery. This level corresponds
                to no protection being available against a Delete operation; the data
                is irretrievably lost upon accepting a Delete operation at the entity
                level or higher (vault, resource group, subscription etc.)
            - value: Recoverable+Purgeable
              description: Denotes a vault state in which deletion is recoverable,
                and which also permits immediate and permanent deletion (i.e. purge).
                This level guarantees the recoverability of the deleted entity during
                the retention interval (90 days), unless a Purge operation is requested,
                or the subscription is cancelled. System wil permanently delete it
                after 90 days, if not recovered
            - value: Recoverable
              description: Denotes a vault state in which deletion is recoverable
                without the possibility for immediate and permanent deletion (i.e.
                purge). This level guarantees the recoverability of the deleted entity
                during the retention interval(90 days) and while the subscription
                is still available. System wil permanently delete it after 90 days,
                if not recovered
            - value: Recoverable+ProtectedSubscription
              description: Denotes a vault and subscription state in which deletion
                is recoverable within retention interval (90 days), immediate and
                permanent deletion (i.e. purge) is not permitted, and in which the
                subscription itself  cannot be permanently canceled. System wil permanently
                delete it after 90 days, if not recovered
            - value: CustomizedRecoverable+Purgeable
              description: Denotes a vault state in which deletion is recoverable,
                and which also permits immediate and permanent deletion (i.e. purge
                when 7<= SoftDeleteRetentionInDays < 90). This level guarantees the
                recoverability of the deleted entity during the retention interval,
                unless a Purge operation is requested, or the subscription is cancelled.
            - value: CustomizedRecoverable
              description: Denotes a vault state in which deletion is recoverable
                without the possibility for immediate and permanent deletion (i.e.
                purge when 7<= SoftDeleteRetentionInDays < 90).This level guarantees
                the recoverability of the deleted entity during the retention interval
                and while the subscription is still available.
            - value: CustomizedRecoverable+ProtectedSubscription
              description: Denotes a vault and subscription state in which deletion
                is recoverable, immediate and permanent deletion (i.e. purge) is not
                permitted, and in which the subscription itself cannot be permanently
                canceled when 7<= SoftDeleteRetentionInDays < 90. This level guarantees
                the recoverability of the deleted entity during the retention interval,
                and also reflects the fact that the subscription itself cannot be
                cancelled.
          readOnly: true
          nullable: false
      description: The storage account management attributes.
