openapi: 3.0.0
info:
  title: KeyVaultClient
  description: The key vault client performs cryptographic key operations and vault
    operations against the Key Vault service.
  version: '7.6'
servers:
- url: '{vaultBaseUrl}'
  variables:
    vaultBaseUrl:
      description: The vault name, for example https://myvault.vault.azure.net.
      x-ms-skip-url-encoding: true
      default: none
paths:
  /storage:
    get:
      tags:
      - Storage
      operationId: GetStorageAccounts
      description: List storage accounts managed by the specified key vault. This
        operation requires the storage/list permission.
      parameters:
      - name: maxresults
        in: query
        required: false
        description: Maximum number of results to return in a page. If not specified
          the service will return up to 25 results.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 25
      - name: api-version
        in: query
        required: true
        description: Client API version.
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: A response message containing a list of storage accounts along
            with a link to the next page of storage accounts.
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      properties:
                        id:
                          type: string
                          description: Storage identifier.
                          readOnly: true
                        resourceId:
                          type: string
                          description: Storage account resource Id.
                          readOnly: true
                        attributes:
                          description: The storage account management attributes.
                          readOnly: true
                          properties:
                            enabled:
                              type: boolean
                              description: the enabled state of the object.
                            created:
                              type: integer
                              format: unixtime
                              readOnly: true
                              description: Creation time in UTC.
                            updated:
                              type: integer
                              format: unixtime
                              readOnly: true
                              description: Last updated time in UTC.
                            recoverableDays:
                              type: integer
                              format: int32
                              readOnly: true
                              description: softDelete data retention days. Value should
                                be >=7 and <=90 when softDelete enabled, otherwise
                                0.
                            recoveryLevel:
                              type: string
                              description: Reflects the deletion recovery level currently
                                in effect for storage accounts in the current vault.
                                If it contains 'Purgeable' the storage account can
                                be permanently deleted by a privileged user; otherwise,
                                only the system can purge the storage account, at
                                the end of the retention interval.
                              enum:
                              - Purgeable
                              - Recoverable+Purgeable
                              - Recoverable
                              - Recoverable+ProtectedSubscription
                              - CustomizedRecoverable+Purgeable
                              - CustomizedRecoverable
                              - CustomizedRecoverable+ProtectedSubscription
                              x-ms-enum:
                                name: DeletionRecoveryLevel
                                modelAsString: true
                                values:
                                - value: Purgeable
                                  description: Denotes a vault state in which deletion
                                    is an irreversible operation, without the possibility
                                    for recovery. This level corresponds to no protection
                                    being available against a Delete operation; the
                                    data is irretrievably lost upon accepting a Delete
                                    operation at the entity level or higher (vault,
                                    resource group, subscription etc.)
                                - value: Recoverable+Purgeable
                                  description: Denotes a vault state in which deletion
                                    is recoverable, and which also permits immediate
                                    and permanent deletion (i.e. purge). This level
                                    guarantees the recoverability of the deleted entity
                                    during the retention interval (90 days), unless
                                    a Purge operation is requested, or the subscription
                                    is cancelled. System wil permanently delete it
                                    after 90 days, if not recovered
                                - value: Recoverable
                                  description: Denotes a vault state in which deletion
                                    is recoverable without the possibility for immediate
                                    and permanent deletion (i.e. purge). This level
                                    guarantees the recoverability of the deleted entity
                                    during the retention interval(90 days) and while
                                    the subscription is still available. System wil
                                    permanently delete it after 90 days, if not recovered
                                - value: Recoverable+ProtectedSubscription
                                  description: Denotes a vault and subscription state
                                    in which deletion is recoverable within retention
                                    interval (90 days), immediate and permanent deletion
                                    (i.e. purge) is not permitted, and in which the
                                    subscription itself  cannot be permanently canceled.
                                    System wil permanently delete it after 90 days,
                                    if not recovered
                                - value: CustomizedRecoverable+Purgeable
                                  description: Denotes a vault state in which deletion
                                    is recoverable, and which also permits immediate
                                    and permanent deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                                    < 90). This level guarantees the recoverability
                                    of the deleted entity during the retention interval,
                                    unless a Purge operation is requested, or the
                                    subscription is cancelled.
                                - value: CustomizedRecoverable
                                  description: Denotes a vault state in which deletion
                                    is recoverable without the possibility for immediate
                                    and permanent deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                                    < 90).This level guarantees the recoverability
                                    of the deleted entity during the retention interval
                                    and while the subscription is still available.
                                - value: CustomizedRecoverable+ProtectedSubscription
                                  description: Denotes a vault and subscription state
                                    in which deletion is recoverable, immediate and
                                    permanent deletion (i.e. purge) is not permitted,
                                    and in which the subscription itself cannot be
                                    permanently canceled when 7<= SoftDeleteRetentionInDays
                                    < 90. This level guarantees the recoverability
                                    of the deleted entity during the retention interval,
                                    and also reflects the fact that the subscription
                                    itself cannot be cancelled.
                              readOnly: true
                              nullable: false
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: Application specific metadata in the form of
                            key-value pairs.
                          readOnly: true
                      description: The storage account item containing storage account
                        metadata.
                    readOnly: true
                    description: A response message containing a list of storage accounts
                      in the key vault along with a link to the next page of storage
                      accounts.
                  nextLink:
                    type: string
                    readOnly: true
                    description: The URL to get the next set of storage accounts.
                description: The storage accounts list result.
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                properties:
                  error:
                    readOnly: true
                    properties:
                      code:
                        type: string
                        readOnly: true
                        description: The error code.
                      message:
                        type: string
                        readOnly: true
                        description: The error message.
                      innererror:
                        x-ms-client-name: innerError
                        readOnly: true
                        properties:
                          code:
                            type: string
                            readOnly: true
                            description: The error code.
                          message:
                            type: string
                            readOnly: true
                            description: The error message.
                          innererror:
                            x-ms-client-name: innerError
                            readOnly: true
                            properties:
                              code:
                                type: string
                                readOnly: true
                                description: The error code.
                              message:
                                type: string
                                readOnly: true
                                description: The error message.
                            description: The key vault server error.
                            nullable: true
                        description: The key vault server error.
                        nullable: true
                    description: The key vault server error.
                    nullable: true
                description: The key vault error exception.
      x-ms-pageable:
        nextLinkName: nextLink
  /deletedstorage:
    get:
      tags:
      - DeletedStorage
      operationId: GetDeletedStorageAccounts
      summary: Lists deleted storage accounts for the specified vault.
      description: The Get Deleted Storage Accounts operation returns the storage
        accounts that have been deleted for a vault enabled for soft-delete. This
        operation requires the storage/list permission.
      parameters:
      - name: maxresults
        in: query
        required: false
        description: Maximum number of results to return in a page. If not specified
          the service will return up to 25 results.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 25
      - name: api-version
        in: query
        required: true
        description: Client API version.
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: A response message containing a list of deleted storage accounts
            in the vault, along with a link to the next page of deleted storage accounts.
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Storage identifier.
                          readOnly: true
                        resourceId:
                          type: string
                          description: Storage account resource Id.
                          readOnly: true
                        attributes:
                          description: The storage account management attributes.
                          readOnly: true
                          properties:
                            enabled:
                              type: boolean
                              description: the enabled state of the object.
                            created:
                              type: integer
                              format: unixtime
                              readOnly: true
                              description: Creation time in UTC.
                            updated:
                              type: integer
                              format: unixtime
                              readOnly: true
                              description: Last updated time in UTC.
                            recoverableDays:
                              type: integer
                              format: int32
                              readOnly: true
                              description: softDelete data retention days. Value should
                                be >=7 and <=90 when softDelete enabled, otherwise
                                0.
                            recoveryLevel:
                              type: string
                              description: Reflects the deletion recovery level currently
                                in effect for storage accounts in the current vault.
                                If it contains 'Purgeable' the storage account can
                                be permanently deleted by a privileged user; otherwise,
                                only the system can purge the storage account, at
                                the end of the retention interval.
                              enum:
                              - Purgeable
                              - Recoverable+Purgeable
                              - Recoverable
                              - Recoverable+ProtectedSubscription
                              - CustomizedRecoverable+Purgeable
                              - CustomizedRecoverable
                              - CustomizedRecoverable+ProtectedSubscription
                              x-ms-enum:
                                name: DeletionRecoveryLevel
                                modelAsString: true
                                values:
                                - value: Purgeable
                                  description: Denotes a vault state in which deletion
                                    is an irreversible operation, without the possibility
                                    for recovery. This level corresponds to no protection
                                    being available against a Delete operation; the
                                    data is irretrievably lost upon accepting a Delete
                                    operation at the entity level or higher (vault,
                                    resource group, subscription etc.)
                                - value: Recoverable+Purgeable
                                  description: Denotes a vault state in which deletion
                                    is recoverable, and which also permits immediate
                                    and permanent deletion (i.e. purge). This level
                                    guarantees the recoverability of the deleted entity
                                    during the retention interval (90 days), unless
                                    a Purge operation is requested, or the subscription
                                    is cancelled. System wil permanently delete it
                                    after 90 days, if not recovered
                                - value: Recoverable
                                  description: Denotes a vault state in which deletion
                                    is recoverable without the possibility for immediate
                                    and permanent deletion (i.e. purge). This level
                                    guarantees the recoverability of the deleted entity
                                    during the retention interval(90 days) and while
                                    the subscription is still available. System wil
                                    permanently delete it after 90 days, if not recovered
                                - value: Recoverable+ProtectedSubscription
                                  description: Denotes a vault and subscription state
                                    in which deletion is recoverable within retention
                                    interval (90 days), immediate and permanent deletion
                                    (i.e. purge) is not permitted, and in which the
                                    subscription itself  cannot be permanently canceled.
                                    System wil permanently delete it after 90 days,
                                    if not recovered
                                - value: CustomizedRecoverable+Purgeable
                                  description: Denotes a vault state in which deletion
                                    is recoverable, and which also permits immediate
                                    and permanent deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                                    < 90). This level guarantees the recoverability
                                    of the deleted entity during the retention interval,
                                    unless a Purge operation is requested, or the
                                    subscription is cancelled.
                                - value: CustomizedRecoverable
                                  description: Denotes a vault state in which deletion
                                    is recoverable without the possibility for immediate
                                    and permanent deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                                    < 90).This level guarantees the recoverability
                                    of the deleted entity during the retention interval
                                    and while the subscription is still available.
                                - value: CustomizedRecoverable+ProtectedSubscription
                                  description: Denotes a vault and subscription state
                                    in which deletion is recoverable, immediate and
                                    permanent deletion (i.e. purge) is not permitted,
                                    and in which the subscription itself cannot be
                                    permanently canceled when 7<= SoftDeleteRetentionInDays
                                    < 90. This level guarantees the recoverability
                                    of the deleted entity during the retention interval,
                                    and also reflects the fact that the subscription
                                    itself cannot be cancelled.
                              readOnly: true
                              nullable: false
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: Application specific metadata in the form of
                            key-value pairs.
                          readOnly: true
                        recoveryId:
                          type: string
                          description: The url of the recovery object, used to identify
                            and recover the deleted storage account.
                        scheduledPurgeDate:
                          type: integer
                          format: unixtime
                          readOnly: true
                          description: The time when the storage account is scheduled
                            to be purged, in UTC
                        deletedDate:
                          type: integer
                          format: unixtime
                          readOnly: true
                          description: The time when the storage account was deleted,
                            in UTC
                      description: The storage account item containing storage account
                        metadata.
                    readOnly: true
                    description: A response message containing a list of the deleted
                      storage accounts in the vault along with a link to the next
                      page of deleted storage accounts
                  nextLink:
                    type: string
                    readOnly: true
                    description: The URL to get the next set of deleted storage accounts.
                description: The deleted storage account list result
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                properties:
                  error:
                    readOnly: true
