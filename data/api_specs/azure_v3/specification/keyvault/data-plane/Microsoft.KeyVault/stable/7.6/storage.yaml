  /deletedstorage/{storage-account-name}:
    get:
      tags:
      - DeletedStorage
      operationId: GetDeletedStorageAccount
      summary: Gets the specified deleted storage account.
      description: The Get Deleted Storage Account operation returns the specified
        deleted storage account along with its attributes. This operation requires
        the storage/get permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: api-version
        in: query
        required: true
        description: Client API version.
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: The deleted storage account and information on when it will
            be purged, and how to recover the deleted storage account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The storage account id.
                    readOnly: true
                  resourceId:
                    type: string
                    description: The storage account resource id.
                    readOnly: true
                  activeKeyName:
                    type: string
                    description: The current active storage account key name.
                    readOnly: true
                  autoRegenerateKey:
                    type: boolean
                    description: whether keyvault should manage the storage account
                      for the user.
                    readOnly: true
                  regenerationPeriod:
                    type: string
                    description: The key regeneration time duration specified in ISO-8601
                      format.
                    readOnly: true
                  attributes:
                    description: The storage account attributes.
                    readOnly: true
                    properties:
                      enabled:
                        type: boolean
                        description: the enabled state of the object.
                      created:
                        type: integer
                        format: unixtime
                        readOnly: true
                        description: Creation time in UTC.
                      updated:
                        type: integer
                        format: unixtime
                        readOnly: true
                        description: Last updated time in UTC.
                      recoverableDays:
                        type: integer
                        format: int32
                        readOnly: true
                        description: softDelete data retention days. Value should
                          be >=7 and <=90 when softDelete enabled, otherwise 0.
                      recoveryLevel:
                        type: string
                        description: Reflects the deletion recovery level currently
                          in effect for storage accounts in the current vault. If
                          it contains 'Purgeable' the storage account can be permanently
                          deleted by a privileged user; otherwise, only the system
                          can purge the storage account, at the end of the retention
                          interval.
                        enum:
                        - Purgeable
                        - Recoverable+Purgeable
                        - Recoverable
                        - Recoverable+ProtectedSubscription
                        - CustomizedRecoverable+Purgeable
                        - CustomizedRecoverable
                        - CustomizedRecoverable+ProtectedSubscription
                        x-ms-enum:
                          name: DeletionRecoveryLevel
                          modelAsString: true
                          values:
                          - value: Purgeable
                            description: Denotes a vault state in which deletion is
                              an irreversible operation, without the possibility for
                              recovery. This level corresponds to no protection being
                              available against a Delete operation; the data is irretrievably
                              lost upon accepting a Delete operation at the entity
                              level or higher (vault, resource group, subscription
                              etc.)
                          - value: Recoverable+Purgeable
                            description: Denotes a vault state in which deletion is
                              recoverable, and which also permits immediate and permanent
                              deletion (i.e. purge). This level guarantees the recoverability
                              of the deleted entity during the retention interval
                              (90 days), unless a Purge operation is requested, or
                              the subscription is cancelled. System wil permanently
                              delete it after 90 days, if not recovered
                          - value: Recoverable
                            description: Denotes a vault state in which deletion is
                              recoverable without the possibility for immediate and
                              permanent deletion (i.e. purge). This level guarantees
                              the recoverability of the deleted entity during the
                              retention interval(90 days) and while the subscription
                              is still available. System wil permanently delete it
                              after 90 days, if not recovered
                          - value: Recoverable+ProtectedSubscription
                            description: Denotes a vault and subscription state in
                              which deletion is recoverable within retention interval
                              (90 days), immediate and permanent deletion (i.e. purge)
                              is not permitted, and in which the subscription itself  cannot
                              be permanently canceled. System wil permanently delete
                              it after 90 days, if not recovered
                          - value: CustomizedRecoverable+Purgeable
                            description: Denotes a vault state in which deletion is
                              recoverable, and which also permits immediate and permanent
                              deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                              < 90). This level guarantees the recoverability of the
                              deleted entity during the retention interval, unless
                              a Purge operation is requested, or the subscription
                              is cancelled.
                          - value: CustomizedRecoverable
                            description: Denotes a vault state in which deletion is
                              recoverable without the possibility for immediate and
                              permanent deletion (i.e. purge when 7<= SoftDeleteRetentionInDays
                              < 90).This level guarantees the recoverability of the
                              deleted entity during the retention interval and while
                              the subscription is still available.
                          - value: CustomizedRecoverable+ProtectedSubscription
                            description: Denotes a vault and subscription state in
                              which deletion is recoverable, immediate and permanent
                              deletion (i.e. purge) is not permitted, and in which
                              the subscription itself cannot be permanently canceled
                              when 7<= SoftDeleteRetentionInDays < 90. This level
                              guarantees the recoverability of the deleted entity
                              during the retention interval, and also reflects the
                              fact that the subscription itself cannot be cancelled.
                        readOnly: true
                        nullable: false
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: Application specific metadata in the form of key-value
                      pairs
                    readOnly: true
                  recoveryId:
                    type: string
                    description: The url of the recovery object, used to identify
                      and recover the deleted storage account.
                  scheduledPurgeDate:
                    type: integer
                    format: unixtime
                    readOnly: true
                    description: The time when the storage account is scheduled to
                      be purged, in UTC
                  deletedDate:
                    type: integer
                    format: unixtime
                    readOnly: true
                    description: The time when the storage account was deleted, in
                      UTC
                description: A Storage account bundle consists of key vault storage
                  account details plus its attributes.
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                properties:
                  error:
                    readOnly: true
                    properties:
                      code:
                        type: string
                        readOnly: true
                        description: The error code.
                      message:
                        type: string
                        readOnly: true
                        description: The error message.
                      innererror:
                        x-ms-client-name: innerError
                        readOnly: true
                        properties:
                          code:
                            type: string
                            readOnly: true
                            description: The error code.
                          message:
                            type: string
                            readOnly: true
                            description: The error message.
                          innererror:
                            x-ms-client-name: innerError
                            readOnly: true
                            properties:
                              code:
                                type: string
                                readOnly: true
                                description: The error code.
                              message:
                                type: string
                                readOnly: true
                                description: The error message.
                            description: The key vault server error.
                            nullable: true
                        description: The key vault server error.
                        nullable: true
                    description: The key vault server error.
                    nullable: true
                description: The key vault error exception.
    delete:
      tags:
      - DeletedStorage
      operationId: PurgeDeletedStorageAccount
      summary: Permanently deletes the specified storage account.
      description: The purge deleted storage account operation removes the secret
        permanently, without the possibility of recovery. This operation can only
        be performed on a soft-delete enabled vault. This operation requires the storage/purge
        permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: api-version
        in: query
        required: true
        description: Client API version.
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '204':
          description: No content signaling that the storage account was purged forever.
        default:
          description: Key Vault error response describing why the operation failed.
          content:
            application/json:
              schema:
                properties:
                  error:
                    readOnly: true
                    properties:
                      code:
                        type: string
                        readOnly: true
                        description: The error code.
                      message:
                        type: string
                        readOnly: true
                        description: The error message.
                      innererror:
                        x-ms-client-name: innerError
                        readOnly: true
                        properties:
                          code:
                            type: string
                            readOnly: true
                            description: The error code.
                          message:
                            type: string
                            readOnly: true
                            description: The error message.
                          innererror:
                            x-ms-client-name: innerError
                            readOnly: true
                            properties:
                              code:
                                type: string
                                readOnly: true
                                description: The error code.
                              message:
                                type: string
                                readOnly: true
                                description: The error message.
                            description: The key vault server error.
                            nullable: true
                        description: The key vault server error.
                        nullable: true
                    description: The key vault server error.
                    nullable: true
                description: The key vault error exception.
  /deletedstorage/{storage-account-name}/recover:
    post:
      tags:
      - DeletedStorage
      operationId: RecoverDeletedStorageAccount
      summary: Recovers the deleted storage account.
      description: Recovers the deleted storage account in the specified vault. This
        operation can only be performed on a soft-delete enabled vault. This operation
        requires the storage/recover permission.
      parameters:
      - name: storage-account-name
        in: path
        required: true
        description: The name of the storage account.
        schema:
          type: string
          pattern: ^[0-9a-zA-Z]+$
      - name: api-version
        in: query
        required: true
        description: Client API version.
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: A storage bundle of the original storage account and its attributes.
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: string
                    description: The storage account id.
                    readOnly: true
                  resourceId:
                    type: string
                    description: The storage account resource id.
                    readOnly: true
                  activeKeyName:
                    type: string
                    description: The current active storage account key name.
                    readOnly: true
                  autoRegenerateKey:
                    type: boolean
                    description: whether keyvault should manage the storage account
                      for the user.
                    readOnly: true
                  regenerationPeriod:
                    type: string
                    description: The key regeneration time duration specified in ISO-8601
                      format.
                    readOnly: true
                  attributes:
                    description: The storage account attributes.
                    readOnly: true
                    properties:
                      enabled:
                        type: boolean
                        description: the enabled state of the object.
                      created:
                        type: integer
                        format: unixtime
                        readOnly: true
                        description: Creation time in UTC.
                      updated:
                        type: integer
                        format: unixtime
                        readOnly: true
                        description: Last updated time in UTC.
                      recoverableDays:
                        type: integer
                        format: int32
                        readOnly: true
                        description: softDelete data retention days. Value should
                          be >=7 and <=90 when softDelete enabled, otherwise 0.
                      recoveryLevel:
                        type: string
                        description: Reflects the deletion recovery level currently
                          in effect for storage accounts in the current vault. If
                          it contains 'Purgeable' the storage account can be permanently
                          deleted by a privileged user; otherwise, only the system
                          can purge the storage account, at the end of the retention
                          interval.
