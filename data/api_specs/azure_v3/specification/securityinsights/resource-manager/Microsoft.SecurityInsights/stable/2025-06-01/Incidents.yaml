                          often be able to control the resource after this stage.
                        value: Exploitation
                      - description: Persistence is any access, action, or configuration
                          change to a system that gives an adversary a persistent
                          presence on that system. Adversaries will often need to
                          maintain access to systems through interruptions such as
                          system restarts, loss of credentials, or other failures
