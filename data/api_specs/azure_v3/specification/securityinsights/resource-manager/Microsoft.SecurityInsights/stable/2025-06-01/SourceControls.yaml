      description: Gets a list of repositories metadata.
      operationId: SourceControl_listRepositories
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - description: The name of the workspace.
        in: path
        name: workspaceName
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]+[A-Za-z0-9]$
      requestBody:
        content:
          application/json:
            schema:
              required:
              - repositoryAccess
              description: Credentials to access repository.
              type: object
              properties:
                properties:
                  description: RepositoryAccess properties
                  x-ms-client-flatten: true
                  type: object
                  required:
                  - repositoryAccess
                  properties:
                    repositoryAccess:
                      description: RepositoryAccess properties
                      x-ms-client-flatten: true
                      type: object
                      required:
                      - kind
                      properties:
                        kind:
                          description: The kind of repository access credentials
                          enum:
                          - OAuth
                          - PAT
                          - App
                          type: string
                          x-ms-enum:
                            modelAsString: true
                            name: RepositoryAccessKind
                            values:
                            - value: OAuth
                            - value: PAT
                            - value: App
                        code:
                          x-ms-secret: true
                          type: string
                          description: OAuth Code. Required when `kind` is `OAuth`
                        state:
                          x-ms-secret: true
                          type: string
                          description: OAuth State. Required when `kind` is `OAuth`
                        clientId:
                          type: string
                          description: OAuth ClientId. Required when `kind` is `OAuth`
                        token:
                          x-ms-secret: true
                          type: string
                          description: Personal Access Token. Required when `kind`
                            is `PAT`
                        installationId:
                          type: string
