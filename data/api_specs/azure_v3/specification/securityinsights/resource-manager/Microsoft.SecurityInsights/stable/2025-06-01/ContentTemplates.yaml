        in: query
        name: $count
        required: false
        x-ms-parameter-location: method
        schema:
          type: boolean
      - description: Returns only the first n results. Optional.
        in: query
        name: $top
        required: false
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
      - description: Used to skip n elements in the OData query (offset). Returns
