      content:
        application/json:
          schema:
            type: object
        application/merge-patch+json:
          schema:
            type: object
      description: Device properties patch.
      required: true
    Devices_ReplaceComponentPropertiesBody:
      content:
        application/json:
          schema:
            description: Property values associated with the device.
            type: object
            additionalProperties: true
      description: Device properties.
      required: true
    Devices_RunCommandBody:
      content:
        application/json:
          schema:
            description: The device command definition.
            type: object
            properties:
              id:
                description: The request ID of the device command execution.
                type: string
                readOnly: true
              connectionTimeout:
                description: Connection timeout in seconds to wait for a disconnected
                  device to come online. Defaults to 0 seconds.
                type: integer
                format: int32
                minimum: 0
                maximum: 30
              responseTimeout:
                description: Response timeout in seconds to wait for a command completion
                  on a device. Defaults to 30 seconds.
                type: integer
                format: int32
                minimum: 5
                maximum: 30
              request:
                description: The payload for the device command, support any primitive
                  types or object.
              response:
                description: The payload of the device command response, support any
                  primitive types or object.
                readOnly: true
              responseCode:
                description: The status code of the device command response.
                type: integer
                format: int32
                readOnly: true
