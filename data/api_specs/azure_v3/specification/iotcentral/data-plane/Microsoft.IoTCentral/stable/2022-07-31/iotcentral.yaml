openapi: 3.0.0
info:
  title: Azure IoT Central
  description: Azure IoT Central is a service that makes it easy to connect, monitor,
    and manage your IoT devices at scale.
  version: 2022-07-31
servers:
- url: /api
- url: https://{subdomain}.{baseDomain}/api
  variables:
    baseDomain:
      description: The base domain for all Azure IoT Central service requests.
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: azureiotcentral.com
    subdomain:
      description: The application subdomain.
      x-ms-parameter-location: client
      default: none
security:
- azure_auth:
  - user_impersonation
paths:
  /apiTokens:
    get:
      operationId: ApiTokens_List
      summary: Get the list of API tokens in an application. The token value will
        never be returned for security reasons.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      x-ms-pageable:
        nextLinkName: nextLink
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: The paged results of API tokens.
                type: object
                properties:
                  value:
                    description: The collection of API tokens.
                    type: array
                    items:
                      type: object
                      properties:
                        roles:
                          description: List of role assignments that specify the permissions
                            to access the application.
                          type: array
                          items:
                            description: The role assignment definition.
                            type: object
                            properties:
                              role:
                                description: ID of the role for this role assignment.
                                type: string
                              organization:
                                description: ID of the organization for this role
                                  assignment.
                                type: string
                            required:
                            - role
                          minItems: 1
                        id:
                          description: Unique ID of the API token.
                          type: string
                          readOnly: true
                        token:
                          description: Value of the API token.
                          type: string
                          readOnly: true
                        expiry:
                          description: String-formatted date representing the time
                            when the token expires.
                          type: string
                          format: date-time
                      required:
                      - roles
                      description: The permission definition.
                  nextLink:
                    description: URL to get the next page of API tokens.
                    type: string
                required:
                - value
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
                  error:
                    description: Error details for current request.
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message details.
                      requestId:
                        type: string
                        description: Correlation Id for current request.
                      time:
                        type: string
                        format: date-time-rfc1123
                        description: The time that error request failed.
                    required:
                    - code
                    - message
                required:
                - error
  /apiTokens/{tokenId}:
    get:
      operationId: ApiTokens_Get
      summary: Get an API token by ID.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      - in: path
        name: tokenId
        description: Unique ID for the API token.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    description: List of role assignments that specify the permissions
                      to access the application.
                    type: array
                    items:
                      description: The role assignment definition.
                      type: object
                      properties:
                        role:
                          description: ID of the role for this role assignment.
                          type: string
                        organization:
                          description: ID of the organization for this role assignment.
                          type: string
                      required:
                      - role
                    minItems: 1
                  id:
                    description: Unique ID of the API token.
                    type: string
                    readOnly: true
                  token:
                    description: Value of the API token.
                    type: string
                    readOnly: true
                  expiry:
                    description: String-formatted date representing the time when
                      the token expires.
                    type: string
                    format: date-time
                required:
                - roles
                description: The permission definition.
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
                  error:
                    description: Error details for current request.
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message details.
                      requestId:
                        type: string
                        description: Correlation Id for current request.
                      time:
                        type: string
                        format: date-time-rfc1123
                        description: The time that error request failed.
                    required:
                    - code
                    - message
                required:
                - error
    put:
      operationId: ApiTokens_Create
      summary: Create a new API token in the application to use in the IoT Central
        public API. The token value will be returned in the response, and won't be
        returned again in subsequent requests.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      - in: path
        name: tokenId
        description: Unique ID for the API token.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  description: List of role assignments that specify the permissions
                    to access the application.
                  type: array
                  items:
                    description: The role assignment definition.
                    type: object
                    properties:
                      role:
                        description: ID of the role for this role assignment.
                        type: string
                      organization:
                        description: ID of the organization for this role assignment.
                        type: string
                    required:
                    - role
                  minItems: 1
                id:
                  description: Unique ID of the API token.
                  type: string
                  readOnly: true
                token:
                  description: Value of the API token.
                  type: string
                  readOnly: true
                expiry:
                  description: String-formatted date representing the time when the
                    token expires.
                  type: string
                  format: date-time
              required:
              - roles
              description: The permission definition.
        description: API token body.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    description: List of role assignments that specify the permissions
                      to access the application.
                    type: array
                    items:
                      description: The role assignment definition.
                      type: object
                      properties:
                        role:
                          description: ID of the role for this role assignment.
                          type: string
                        organization:
                          description: ID of the organization for this role assignment.
                          type: string
                      required:
                      - role
                    minItems: 1
                  id:
                    description: Unique ID of the API token.
                    type: string
                    readOnly: true
                  token:
                    description: Value of the API token.
                    type: string
                    readOnly: true
                  expiry:
                    description: String-formatted date representing the time when
                      the token expires.
                    type: string
                    format: date-time
                required:
                - roles
                description: The permission definition.
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
                  error:
                    description: Error details for current request.
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message details.
                      requestId:
                        type: string
                        description: Correlation Id for current request.
                      time:
                        type: string
                        format: date-time-rfc1123
                        description: The time that error request failed.
                    required:
                    - code
                    - message
                required:
                - error
    delete:
      operationId: ApiTokens_Remove
      summary: Delete an API token.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      - in: path
        name: tokenId
        description: Unique ID for the API token.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Success
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
                  error:
                    description: Error details for current request.
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message details.
                      requestId:
                        type: string
                        description: Correlation Id for current request.
                      time:
                        type: string
                        format: date-time-rfc1123
                        description: The time that error request failed.
                    required:
                    - code
                    - message
                required:
                - error
  /deviceGroups:
    get:
      operationId: DeviceGroups_List
      summary: Get the list of device groups in an application.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      x-ms-pageable:
        nextLinkName: nextLink
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: The paged results of device groups.
                type: object
                properties:
                  value:
                    description: The collection of device groups.
                    type: array
                    items:
                      description: The device group definition.
                      type: object
                      properties:
                        id:
                          description: Unique ID of the device group.
                          type: string
                          readOnly: true
                        displayName:
                          description: Display name of the device group.
                          type: string
                        filter:
                          description: Query defining which devices should be in this
                            group, [Query Language Reference](https://aka.ms/iotcquery).
                          type: string
                        description:
                          description: Short summary of device group.
                          type: string
                        etag:
                          description: ETag used to prevent conflict in device group
                            updates.
                          type: string
                        organizations:
                          description: List of organization IDs of the device group,
                            only one organization is supported today, multiple organizations
                            will be supported soon.
                          type: array
                          items:
                            type: string
                      required:
                      - displayName
                      - filter
                  nextLink:
                    description: URL to get the next page of device groups.
                    type: string
                required:
                - value
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
                  error:
                    description: Error details for current request.
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Error message details.
                      requestId:
                        type: string
                        description: Correlation Id for current request.
                      time:
                        type: string
                        format: date-time-rfc1123
                        description: The time that error request failed.
                    required:
                    - code
                    - message
                required:
                - error
  /deviceGroups/{deviceGroupId}:
