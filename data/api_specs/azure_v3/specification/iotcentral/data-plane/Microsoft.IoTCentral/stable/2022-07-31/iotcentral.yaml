  /jobs:
    get:
      operationId: Jobs_List
      summary: Get the list of jobs in an application
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      x-ms-pageable:
        nextLinkName: nextLink
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: The paged results of jobs.
                type: object
                properties:
                  value:
                    description: The collection of jobs.
                    type: array
                    items:
                      description: The job definition.
                      type: object
                      properties:
                        id:
                          description: Unique ID of the job.
                          type: string
                          readOnly: true
                        scheduledJobId:
                          description: Id of the scheduled job definition that created
                            this job.
                          type: string
                        displayName:
                          description: Display name of the job.
                          type: string
                        description:
                          description: Detailed description of the job.
                          type: string
                        group:
                          description: The ID of the device group on which to execute
                            the job.
                          type: string
                        batch:
                          description: The batching configuration for the job.
                          type: object
                          properties:
                            type:
                              description: Whether batching is done on a specified
                                number of devices or a percentage of the total devices.
                              type: string
                              enum:
                              - number
                              - percentage
                              x-ms-enum:
                                name: JobBatchType
                                modelAsString: false
                                values:
                                - value: number
                                  name: Number
                                  description: Job Batching based on number of devices.
                                - value: percentage
                                  name: Percentage
                                  description: Job Batching based percentage of total
                                    applied devices.
                            value:
                              description: The number or percentage of devices on
                                which batching is done.
                              type: number
                          required:
                          - type
                          - value
                        cancellationThreshold:
                          description: The cancellation threshold for the job.
                          type: object
                          properties:
                            type:
                              description: Whether the cancellation threshold is per
                                a specified number of devices or a percentage of the
                                total devices.
                              type: string
                              enum:
                              - number
                              - percentage
                              x-ms-enum:
                                name: JobCancellationThresholdType
                                modelAsString: false
                                values:
                                - value: number
                                  name: Number
                                  description: Job cancellation threshold based on
                                    specified number of devices.
                                - value: percentage
                                  name: Percentage
                                  description: Job cancellation threshold based on
                                    percentage of total devices.
                            value:
                              description: The number or percentage of devices on
                                which the cancellation threshold is applied.
                              type: number
                            batch:
                              description: Whether the cancellation threshold applies
                                per-batch or to the overall job.
                              type: boolean
                          required:
                          - type
                          - value
                        data:
                          description: The capabilities being updated by the job and
                            the values with which they are being updated.
                          type: array
                          items:
                            description: The job data definition.
                            type: object
                            properties:
                              type:
                                description: Type of the job data.
                                type: string
                            required:
                            - type
                            discriminator:
                              propertyName: type
                          minItems: 1
                        start:
                          description: The start time of the job
                          type: string
                          format: date-time
                          readOnly: true
                        end:
                          description: The end time of the job
                          type: string
                          format: date-time
                          readOnly: true
                        progress:
                          description: The progress statistics of the job.
                          readOnly: true
                          type: object
                          properties:
                            total:
                              description: The total number of entities targeted by
                                the job.
                              type: integer
                              format: int32
                            pending:
                              description: The number of entities for which the job
                                is not yet running.
                              type: integer
                              format: int32
                            completed:
                              description: The number of entities for which the job
                                has completed.
                              type: integer
                              format: int32
                            failed:
                              description: The number of entities for which the job
                                has failed.
                              type: integer
                              format: int32
                        status:
                          description: Indicates whether the job is starting, running,
                            etc.
                          type: string
                          readOnly: true
                        organizations:
                          description: List of organizations of the job, only one
                            organization is supported today, multiple organizations
                            will be supported soon.
                          type: array
                          items:
                            type: string
                          minItems: 1
                          maxItems: 1
                      required:
                      - group
                      - data
                  nextLink:
                    description: URL to get the next page of jobs.
                    type: string
