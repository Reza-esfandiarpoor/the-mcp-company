  /deviceGroups/{deviceGroupId}/devices:
    get:
      operationId: DeviceGroups_GetDevices
      summary: Get the devices of a device group
      description: Get the list of devices by device group ID.
      parameters:
      - in: query
        name: api-version
        description: The version of the API being called.
        x-ms-parameter-location: client
        required: true
        schema:
          type: string
      - in: path
        name: deviceGroupId
        description: Unique ID for the device group.
        x-ms-parameter-location: method
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9_-]*$
      x-ms-pageable:
        nextLinkName: nextLink
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: The paged results of devices belonging to the device
                  group.
                type: object
                properties:
                  value:
                    description: The collection of devices belonging to the device
                      group.
                    type: array
                    items:
                      description: The device definition.
                      type: object
                      properties:
                        id:
                          description: Unique ID of the device.
                          type: string
                          readOnly: true
                        etag:
                          description: ETag used to prevent conflict in device updates.
                          type: string
                        displayName:
                          description: Display name of the device.
                          type: string
                        template:
                          description: The device template definition for the device.
                          type: string
                        enabled:
                          description: Whether the device connection to IoT Central
                            has been enabled.
                          type: boolean
                        provisioned:
                          description: Whether resources have been allocated for the
                            device.
                          type: boolean
                          readOnly: true
                        simulated:
                          description: Whether the device is simulated.
                          type: boolean
                        organizations:
                          description: List of organization IDs that the device is
                            a part of, only one organization is supported today, multiple
                            organizations will be supported soon.
                          type: array
                          items:
                            type: string
                  nextLink:
                    description: URL to get the next page of devices in the group.
                    type: string
                required:
                - value
        default:
          description: An error response received from the IoT Central Service.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                description: The response error definition.
                type: object
                properties:
