      description: Name of this device command.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    ComponentName:
      in: path
      name: componentName
      description: Name of the device component.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    DeviceGroupId:
      in: path
      name: deviceGroupId
      description: Unique ID for the device group.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        maxLength: 255
        pattern: ^[a-zA-Z0-9_-]*$
    DeviceId:
      in: path
      name: deviceId
      description: Unique ID of the device.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    DeviceTemplateId:
      in: path
      name: deviceTemplateId
      description: Unique [Digital Twin Model Identifier](https://github.com/Azure/opendigitaltwins-dtdl/blob/master/DTDL/v2/dtdlv2.md#digital-twin-model-identifier)
        of the device template.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    EnrollmentGroupId:
      in: path
      name: enrollmentGroupId
      description: Unique ID of the enrollment group.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        maxLength: 255
        pattern: ^[a-zA-Z0-9-]*$
    Entry:
      in: path
      name: entry
      description: Entry of certificate only support primary and secondary.
      x-ms-parameter-location: method
      x-ms-enum:
        name: CertificateEntry
        modelAsString: false
        values:
        - value: primary
          name: Primary
          description: The entry of primary certificate
        - value: secondary
          name: Secondary
          description: The entry of secondary certificate
      required: true
      schema:
        type: string
        enum:
        - primary
        - secondary
    JobId:
      in: path
      name: jobId
      description: Unique ID of the job.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        maxLength: 255
        pattern: ^[a-zA-Z0-9_-]*$
    ModuleName:
      in: path
      name: moduleName
      description: Name of the device module.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    OrganizationId:
      in: path
      name: organizationId
      description: Unique ID for the organization.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        maxLength: 48
        pattern: ^(?!-)[a-z0-9-]{1,48}[a-z0-9]$
    RelationshipId:
      in: path
      name: relationshipId
      description: Unique ID of a relationship between devices.
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    ScheduledJobId:
      in: path
      name: scheduledJobId
