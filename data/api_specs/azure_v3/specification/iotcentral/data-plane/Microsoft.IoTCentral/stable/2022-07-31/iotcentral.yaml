      - in: path
        name: deviceGroupId
        description: Unique ID for the device group.
        x-ms-parameter-location: method
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[a-zA-Z0-9_-]*$
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: The device group definition.
                type: object
                properties:
                  id:
                    description: Unique ID of the device group.
                    type: string
                    readOnly: true
                  displayName:
                    description: Display name of the device group.
                    type: string
                  filter:
                    description: Query defining which devices should be in this group,
                      [Query Language Reference](https://aka.ms/iotcquery).
                    type: string
                  description:
                    description: Short summary of device group.
                    type: string
                  etag:
                    description: ETag used to prevent conflict in device group updates.
                    type: string
                  organizations:
                    description: List of organization IDs of the device group, only
                      one organization is supported today, multiple organizations
                      will be supported soon.
                    type: array
                    items:
                      type: string
                required:
                - displayName
                - filter
        default:
