openapi: 3.0.0
info:
  version: 2023-10-31
  title: Azure Digital Twins API
  description: A service for managing and querying digital twins and digital twin
    models.
security:
- oauth2: []
paths:
  /models:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Models
      description: "Uploads one or more models. When any error occurs, no models are
        uploaded.\nStatus codes:\n* 201 Created\n* 400 Bad Request\n  * DTDLParserError
        - The models provided are not valid DTDL.\n  * InvalidArgument - The model
        id is invalid.\n  * LimitExceeded - The maximum number of model ids allowed
        in 'dependenciesFor' has been reached.\n  * ModelVersionNotSupported - The
        version of DTDL used is not supported.\n* 409 Conflict\n  * ModelAlreadyExists
        - The model provided already exists."
      operationId: DigitalTwinModels_Add
      parameters:
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: object
        description: An array of models to add.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPagedDigitalTwinsModelDataCollection'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Models
      description: "Retrieves model metadata and, optionally, model definitions.\nStatus
        codes:\n* 200 OK\n* 400 Bad Request\n  * InvalidArgument - The model id is
        invalid.\n  * LimitExceeded - The maximum number of model ids allowed in 'dependenciesFor'
        has been reached.\n* 404 Not Found\n  * ModelNotFound - The model was not
        found."
      x-ms-pageable:
        nextLinkName: nextLink
      operationId: DigitalTwinModels_List
      parameters:
      - name: dependenciesFor
        in: query
        description: If specified, only return the set of the specified models along
          with their dependencies. If omitted, all models are retrieved.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/includeModelDefinition'
      - $ref: '#/components/parameters/max-items-per-page'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDigitalTwinsModelDataCollection'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{id}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Models
      description: "Retrieves model metadata and optionally the model definition.\nStatus
        codes:\n* 200 OK\n* 400 Bad Request\n  * InvalidArgument - The model id is
        invalid.\n  * MissingArgument - The model id was not provided.\n* 404 Not
        Found\n  * ModelNotFound - The model was not found."
      operationId: DigitalTwinModels_GetById
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/includeModelDefinition'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwinsModelData'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Models
      description: "Updates the metadata for a model.\nStatus codes:\n* 204 No Content\n*
        400 Bad Request\n  * InvalidArgument - The model id is invalid.\n  * JsonPatchInvalid
        - The JSON Patch provided is invalid.\n  * MissingArgument - The model id
        was not provided.\n* 404 Not Found\n  * ModelNotFound - The model was not
        found.\n* 409 Conflict\n  * ModelReferencesNotDecommissioned - The model refers
        to models that are not decommissioned."
      operationId: DigitalTwinModels_Update
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
        description: An update specification described by JSON Patch. Only the decommissioned
          property can be replaced.
        required: true
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Models
      operationId: DigitalTwinModels_Delete
      description: "Deletes a model. A model can only be deleted if no other models
        reference it.\nStatus codes:\n* 204 No Content\n* 400 Bad Request\n  * InvalidArgument
        - The model id is invalid.\n  * MissingArgument - The model id was not provided.\n*
        404 Not Found\n  * ModelNotFound - The model was not found.\n* 409 Conflict\n
        \ * ModelReferencesNotDeleted - The model refers to models that are not deleted."
      parameters:
      - $ref: '#/components/parameters/modelId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /query:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Query
      operationId: Query_QueryTwins
      description: "Executes a query that allows traversing relationships and filtering
        by property values.\nStatus codes:\n* 200 OK\n* 400 Bad Request\n  * BadRequest
        - The continuation token is invalid.\n  * SqlQueryError - The query contains
        some errors.\n  * TimeoutError - The query execution timed out after 60 seconds.
        Try simplifying the query or adding conditions to reduce the result size.\n
        * 429 Too Many Requests\n  * QuotaReachedError - The maximum query rate limit
        has been reached."
      parameters:
      - $ref: '#/components/parameters/max-items-per-page'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuerySpecification'
        description: The query specification to execute.
        required: true
      responses:
        '200':
          description: Success
          headers:
            query-charge:
              description: The query charge.
              schema:
                type: number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Twins
      operationId: DigitalTwins_GetById
      description: "Retrieves a digital twin.\nStatus codes:\n* 200 OK\n* 400 Bad
        Request\n  * InvalidArgument - The digital twin id is invalid.\n* 404 Not
        Found\n  * DigitalTwinNotFound - The digital twin was not found."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwin'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Twins
      operationId: DigitalTwins_Add
      description: "Adds or replaces a digital twin.\nStatus codes:\n* 200 OK\n* 400
        Bad Request\n  * InvalidArgument - The digital twin id or payload is invalid.\n
        \ * ModelDecommissioned - The model for the digital twin is decommissioned.\n
        \ * TwinLimitReached - The maximum number of digital twins allowed has been
        reached.\n  * ValidationFailed - The digital twin payload is not valid.\n*
        412 Precondition Failed\n  * PreconditionFailed - The precondition check (If-Match
        or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/if-none-match-star'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The digital twin instance being added. If provided, the $dtId
          property is ignored.
        required: true
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigitalTwin'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Twins
      operationId: DigitalTwins_Delete
      description: "Deletes a digital twin. All relationships referencing the digital
        twin must already be deleted.\nStatus codes:\n* 204 No Content\n* 400 Bad
        Request\n  * InvalidArgument - The digital twin id is invalid.\n  * RelationshipsNotDeleted
        - The digital twin contains relationships.\n* 404 Not Found\n  * DigitalTwinNotFound
        - The digital twin was not found.\n* 412 Precondition Failed\n  * PreconditionFailed
        - The precondition check (If-Match or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/if-match'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Twins
      operationId: DigitalTwins_Update
      description: "Updates a digital twin.\nStatus codes:\n* 204 No Content\n* 400
        Bad Request\n  * InvalidArgument - The digital twin id or payload is invalid.\n
        \ * JsonPatchInvalid - The JSON Patch provided is invalid.\n  * ValidationFailed
        - Applying the patch results in an invalid digital twin.\n* 404 Not Found\n
        \ * DigitalTwinNotFound - The digital twin was not found.\n* 412 Precondition
        Failed\n  * PreconditionFailed - The precondition check (If-Match or If-None-Match)
        failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/if-match'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        $ref: '#/components/requestBodies/DigitalTwins_UpdatePatchdocument'
      responses:
        '204':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/relationships/{relationshipId}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Twins
      operationId: DigitalTwins_GetRelationshipById
      description: "Retrieves a relationship between two digital twins.\nStatus codes:\n*
        200 OK\n* 400 Bad Request\n  * InvalidArgument - The digital twin id or relationship
        id is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound - The digital twin
        was not found.\n  * RelationshipNotFound - The relationship was not found."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/relationshipId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Twins
      operationId: DigitalTwins_AddRelationship
      description: "Adds a relationship between two digital twins.\nStatus codes:\n*
        200 OK\n* 400 Bad Request\n  * InvalidArgument - The digital twin id, relationship
        id, or payload is invalid.\n  * InvalidRelationship - The relationship is
        invalid.\n  * OperationNotAllowed - The relationship cannot connect to the
        same digital twin.\n  * ValidationFailed - The relationship content is invalid.\n*
        404 Not Found\n  * DigitalTwinNotFound - The digital twin was not found.\n
        \ * TargetTwinNotFound - The digital twin target of the relationship was not
        found.\n* 412 Precondition Failed\n  * PreconditionFailed - The precondition
        check (If-Match or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/relationshipId'
      - $ref: '#/components/parameters/if-none-match-star'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The data for the relationship.
        required: true
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Twins
      operationId: DigitalTwins_DeleteRelationship
      description: "Deletes a relationship between two digital twins.\nStatus codes:\n*
        204 No Content\n* 400 Bad Request\n  * InvalidArgument - The digital twin
        id or relationship id is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound
        - The digital twin was not found.\n  * RelationshipNotFound - The relationship
        was not found.\n* 412 Precondition Failed\n  * PreconditionFailed - The precondition
        check (If-Match or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/relationshipId'
      - $ref: '#/components/parameters/if-match'
      - $ref: '#/components/parameters/api-version'
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Twins
      operationId: DigitalTwins_UpdateRelationship
      description: "Updates the properties on a relationship between two digital twins.\nStatus
        codes:\n* 204 No Content\n* 400 Bad Request\n  * InvalidArgument - The digital
        twin id or relationship id is invalid.\n  * InvalidRelationship - The relationship
        is invalid.\n  * JsonPatchInvalid - The JSON Patch provided is invalid.\n
        \ * ValidationFailed - The relationship content is invalid.\n* 404 Not Found\n
        \ * DigitalTwinNotFound - The digital twin was not found.\n  * RelationshipNotFound
        - The relationship was not found.\n* 409 Conflict\n  * RelationshipAlreadyExists
        - The relationship already exists.\n* 412 Precondition Failed\n  * PreconditionFailed
        - The precondition check (If-Match or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/relationshipId'
      - $ref: '#/components/parameters/if-match'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
        description: JSON Patch description of the update to the relationship properties.
        required: true
      responses:
        '204':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/relationships:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Twins
      operationId: DigitalTwins_ListRelationships
      description: "Retrieves the relationships from a digital twin.\nStatus codes:\n*
        200 OK\n* 400 Bad Request\n  * InvalidArgument - The digital twin id is invalid.\n*
        404 Not Found\n  * DigitalTwinNotFound - The digital twin was not found."
      x-ms-pageable:
        nextLinkName: nextLink
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - name: relationshipName
        description: The name of the relationship.
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipCollection'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/incomingrelationships:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Twins
      operationId: DigitalTwins_ListIncomingRelationships
      description: "Retrieves all incoming relationship for a digital twin.\nStatus
        codes:\n* 200 OK\n* 400 Bad Request\n  * InvalidArgument - The digital twin
        id is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound - The digital twin
        was not found."
      x-ms-pageable:
        nextLinkName: nextLink
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingRelationshipCollection'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/telemetry:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Twins
      operationId: DigitalTwins_SendTelemetry
      description: "Sends telemetry on behalf of a digital twin.\nStatus codes:\n*
        204 No Content\n* 400 Bad Request\n  * InvalidArgument - The digital twin
        id or message id is invalid.\n  * ValidationFailed - The telemetry content
        is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound - The digital twin was
        not found."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - name: Message-Id
        in: header
        description: A unique message identifier (in the scope of the digital twin
          id) that is commonly used for de-duplicating messages.
        required: true
        schema:
          type: string
      - name: Telemetry-Source-Time
        in: header
        description: An RFC 3339 timestamp that identifies the time the telemetry
          was measured.
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The telemetry measurements to send from the digital twin.
        required: true
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/components/{componentPath}/telemetry:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    post:
      tags:
      - Twins
      operationId: DigitalTwins_SendComponentTelemetry
      description: "Sends telemetry on behalf of a component in a digital twin.\nStatus
        codes:\n* 204 No Content\n* 400 Bad Request\n  * InvalidArgument - The digital
        twin id, message id, or component path is invalid.\n  * ValidationFailed -
        The telemetry content is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound
        - The digital twin was not found.\n  * ComponentNotFound - The component path
        was not found."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/componentPath'
      - name: Message-Id
        in: header
        description: A unique message identifier (in the scope of the digital twin
          id) that is commonly used for de-duplicating messages.
        required: true
        schema:
          type: string
      - name: Telemetry-Source-Time
        in: header
        description: An RFC 3339 timestamp that identifies the time the telemetry
          was measured.
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/api-version'
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The telemetry measurements to send from the digital twin's component.
        required: true
      responses:
        '204':
          description: Success
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /digitaltwins/{id}/components/{componentPath}:
    parameters:
    - $ref: '#/components/parameters/traceparent'
    - $ref: '#/components/parameters/tracestate'
    get:
      tags:
      - Twins
      operationId: DigitalTwins_GetComponent
      description: "Retrieves a component from a digital twin.\nStatus codes:\n* 200
        OK\n* 400 Bad Request\n  * InvalidArgument - The digital twin id or component
        path is invalid.\n* 404 Not Found\n  * DigitalTwinNotFound - The digital twin
        was not found.\n  * ComponentNotFound - The component path was not found."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/componentPath'
      - $ref: '#/components/parameters/api-version'
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Weak Etag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        default:
          description: Default response.
          headers:
            x-ms-error-code:
              description: Error code for specific error that occurred.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Twins
      operationId: DigitalTwins_UpdateComponent
      description: "Updates a component on a digital twin.\nStatus codes:\n* 204 No
        Content\n* 400 Bad Request\n  * InvalidArgument - The digital twin id, component
        path, or payload is invalid.\n  * JsonPatchInvalid - The JSON Patch provided
        is invalid.\n  * ValidationFailed - Applying the patch results in an invalid
        digital twin.\n* 404 Not Found\n  * DigitalTwinNotFound - The digital twin
        was not found.\n* 412 Precondition Failed\n  * PreconditionFailed - The precondition
        check (If-Match or If-None-Match) failed."
      parameters:
      - $ref: '#/components/parameters/digitalTwinId'
      - $ref: '#/components/parameters/componentPath'
      - $ref: '#/components/parameters/if-match'
      - $ref: '#/components/parameters/api-version'
      requestBody:
        $ref: '#/components/requestBodies/DigitalTwins_UpdatePatchdocument'
      responses:
        '204':
          description: Success
          headers:
