openapi: 3.0.0
info:
  version: 1.1.0
  title: Azure Video Analyzer for Edge
  description: Azure Video Analyzer resources which can be utilized when performing
    direct method calls through Azure IoT Edge.
  contact:
    email: videoanalyzerhelp@microsoft.com
security:
- sharedAccessSignature: []
paths: {}
components:
  securitySchemes:
    sharedAccessSignature:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    LivePipeline:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Live pipeline unique identifier.
        systemData:
          description: Read-only system metadata associated with this object.
          type: object
          properties:
            createdAt:
              type: string
              format: date-time
              description: Date and time when this resource was first created. Value
                is represented in UTC according to the ISO8601 date format.
            lastModifiedAt:
              type: string
              format: date-time
              description: Date and time when this resource was last modified. Value
                is represented in UTC according to the ISO8601 date format.
        properties:
          description: Live pipeline properties.
          type: object
          properties:
            description:
              type: string
              description: An optional description of the live pipeline.
            topologyName:
              type: string
              description: The reference to an existing pipeline topology defined
                for real-time content processing. When activated, this live pipeline
                will process content according to the pipeline topology definition.
            parameters:
              type: array
              description: List of the instance level parameter values for the user-defined
                topology parameters. A pipeline can only define or override parameters
                values for parameters which have been declared in the referenced topology.
                Topology parameters without a default value must be defined. Topology
                parameters with a default value can be optionally be overridden.
              items:
                type: object
                required:
                - name
                properties:
                  name:
                    type: string
                    description: Name of the parameter declared in the pipeline topology.
                  value:
                    type: string
                    description: Parameter value to be applied on this specific live
                      pipeline.
                description: Defines the parameter value of an specific pipeline topology
                  parameter. See pipeline topology parameters for more information.
            state:
              type: string
              description: Current pipeline state (read-only).
              enum:
              - inactive
              - activating
              - active
              - deactivating
              x-ms-enum:
                name: livePipelineState
                values:
                - value: inactive
                  description: The live pipeline is idle and not processing media.
                - value: activating
                  description: The live pipeline is transitioning into the active
                    state.
                - value: active
                  description: The live pipeline is active and able to process media.
                    If your data source is not available, for instance, if your RTSP
                    camera is powered off or unreachable, the pipeline will still
                    be active and periodically retrying the connection. Your Azure
                    subscription will be billed for the duration in which the live
                    pipeline is in the active state.
                - value: deactivating
                  description: The live pipeline is transitioning into the inactive
                    state.
                modelAsString: true
      description: Live Pipeline represents an unique instance of a pipeline topology
        which is used for real-time content ingestion and analysis.
    LivePipelineProperties:
      type: object
      properties:
        description:
          type: string
          description: An optional description of the live pipeline.
        topologyName:
          type: string
          description: The reference to an existing pipeline topology defined for
            real-time content processing. When activated, this live pipeline will
            process content according to the pipeline topology definition.
        parameters:
          type: array
          description: List of the instance level parameter values for the user-defined
            topology parameters. A pipeline can only define or override parameters
            values for parameters which have been declared in the referenced topology.
            Topology parameters without a default value must be defined. Topology
            parameters with a default value can be optionally be overridden.
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Name of the parameter declared in the pipeline topology.
              value:
                type: string
                description: Parameter value to be applied on this specific live pipeline.
            description: Defines the parameter value of an specific pipeline topology
              parameter. See pipeline topology parameters for more information.
        state:
          type: string
          description: Current pipeline state (read-only).
          enum:
          - inactive
          - activating
          - active
          - deactivating
          x-ms-enum:
            name: livePipelineState
            values:
            - value: inactive
              description: The live pipeline is idle and not processing media.
            - value: activating
              description: The live pipeline is transitioning into the active state.
            - value: active
              description: The live pipeline is active and able to process media.
                If your data source is not available, for instance, if your RTSP camera
                is powered off or unreachable, the pipeline will still be active and
                periodically retrying the connection. Your Azure subscription will
                be billed for the duration in which the live pipeline is in the active
                state.
            - value: deactivating
              description: The live pipeline is transitioning into the inactive state.
            modelAsString: true
      description: Live pipeline properties.
    ParameterDefinition:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the parameter declared in the pipeline topology.
        value:
          type: string
          description: Parameter value to be applied on this specific live pipeline.
      description: Defines the parameter value of an specific pipeline topology parameter.
        See pipeline topology parameters for more information.
    LivePipelineCollection:
      type: object
      properties:
        value:
          type: array
          description: List of live pipelines.
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Live pipeline unique identifier.
              systemData:
                description: Read-only system metadata associated with this object.
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                    description: Date and time when this resource was first created.
                      Value is represented in UTC according to the ISO8601 date format.
                  lastModifiedAt:
                    type: string
                    format: date-time
                    description: Date and time when this resource was last modified.
                      Value is represented in UTC according to the ISO8601 date format.
              properties:
                description: Live pipeline properties.
                type: object
                properties:
                  description:
                    type: string
                    description: An optional description of the live pipeline.
                  topologyName:
                    type: string
                    description: The reference to an existing pipeline topology defined
                      for real-time content processing. When activated, this live
                      pipeline will process content according to the pipeline topology
                      definition.
                  parameters:
                    type: array
                    description: List of the instance level parameter values for the
                      user-defined topology parameters. A pipeline can only define
                      or override parameters values for parameters which have been
                      declared in the referenced topology. Topology parameters without
                      a default value must be defined. Topology parameters with a
                      default value can be optionally be overridden.
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          description: Name of the parameter declared in the pipeline
                            topology.
                        value:
                          type: string
                          description: Parameter value to be applied on this specific
                            live pipeline.
                      description: Defines the parameter value of an specific pipeline
                        topology parameter. See pipeline topology parameters for more
                        information.
                  state:
                    type: string
                    description: Current pipeline state (read-only).
                    enum:
                    - inactive
                    - activating
                    - active
                    - deactivating
                    x-ms-enum:
                      name: livePipelineState
                      values:
                      - value: inactive
                        description: The live pipeline is idle and not processing
                          media.
                      - value: activating
                        description: The live pipeline is transitioning into the active
                          state.
                      - value: active
                        description: The live pipeline is active and able to process
                          media. If your data source is not available, for instance,
                          if your RTSP camera is powered off or unreachable, the pipeline
                          will still be active and periodically retrying the connection.
                          Your Azure subscription will be billed for the duration
                          in which the live pipeline is in the active state.
                      - value: deactivating
                        description: The live pipeline is transitioning into the inactive
                          state.
                      modelAsString: true
            description: Live Pipeline represents an unique instance of a pipeline
              topology which is used for real-time content ingestion and analysis.
        '@continuationToken':
          type: string
          description: A continuation token to be used in subsequent calls when enumerating
            through the collection. This is returned when the collection results won't
            fit in a single response.
      description: A collection of live pipelines.
    PipelineTopologyCollection:
      type: object
      properties:
        value:
          type: array
          description: List of pipeline topologies.
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: Pipeline topology unique identifier.
              systemData:
                description: Read-only system metadata associated with this object.
                type: object
                properties:
                  createdAt:
                    type: string
                    format: date-time
                    description: Date and time when this resource was first created.
                      Value is represented in UTC according to the ISO8601 date format.
                  lastModifiedAt:
                    type: string
                    format: date-time
                    description: Date and time when this resource was last modified.
                      Value is represented in UTC according to the ISO8601 date format.
              properties:
                description: Pipeline topology properties.
                type: object
                properties:
                  description:
                    type: string
                    description: An optional description of the pipeline topology.
                      It is recommended that the expected use of the topology to be
                      described here.
                  parameters:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - type
                      properties:
                        name:
                          type: string
                          description: Name of the parameter.
