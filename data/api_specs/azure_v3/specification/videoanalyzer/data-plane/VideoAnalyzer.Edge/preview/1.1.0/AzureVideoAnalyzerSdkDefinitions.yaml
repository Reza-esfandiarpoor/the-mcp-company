                          description: The name of the upstream node in the pipeline
                            which output is used as input of the current node.
                        outputSelectors:
                          type: array
                          description: Allows for the selection of specific data streams
                            (eg. video only) from another node.
                          items:
                            type: object
                            properties:
                              property:
                                type: string
                                description: The property of the data stream to be
                                  used as the selection criteria.
                                enum:
                                - mediaType
                                x-ms-enum:
                                  name: outputSelectorProperty
                                  values:
                                  - value: mediaType
                                    description: 'The stream''s MIME type or subtype:
                                      audio, video or application'
                                  modelAsString: true
                              operator:
                                type: string
