openapi: 3.0.0
info:
  version: 1.1.0
  title: Azure Video Analyzer for Edge
  description: Azure Video Analyzer helpers for IoT Edge direct method calls.
  contact:
    email: videoanalyzerhelp@microsoft.com
security:
- sharedAccessSignature: []
paths: {}
components:
  securitySchemes:
    sharedAccessSignature:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    MethodRequest:
      type: object
      required:
      - methodName
      properties:
        methodName:
          type: string
          description: Direct method method name.
          readOnly: true
        '@apiVersion':
          type: string
          description: Video Analyzer API version.
          enum:
          - '1.1'
          x-ms-enum:
            name: apiVersionEnum
            modelAsString: false
          x-ms-client-default: '1.1'
      discriminator:
        propertyName: methodName
      description: Base class for direct method calls.
    PipelineTopologySetRequest:
      type: object
      properties:
        methodName:
          type: string
          description: Direct method method name.
          readOnly: true
        '@apiVersion':
          type: string
          description: Video Analyzer API version.
          enum:
          - '1.1'
          x-ms-enum:
            name: apiVersionEnum
            modelAsString: false
          x-ms-client-default: '1.1'
        pipelineTopology:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Pipeline topology unique identifier.
            systemData:
              description: Read-only system metadata associated with this object.
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                  description: Date and time when this resource was first created.
                    Value is represented in UTC according to the ISO8601 date format.
                lastModifiedAt:
                  type: string
                  format: date-time
                  description: Date and time when this resource was last modified.
                    Value is represented in UTC according to the ISO8601 date format.
            properties:
              description: Pipeline topology properties.
              type: object
              properties:
                description:
                  type: string
                  description: An optional description of the pipeline topology. It
                    is recommended that the expected use of the topology to be described
                    here.
                parameters:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - type
                    properties:
                      name:
                        type: string
                        description: Name of the parameter.
                        maxLength: 64
                      type:
                        type: string
                        description: Type of the parameter.
                        enum:
                        - string
                        - secretString
                        - int
                        - double
                        - bool
                        x-ms-enum:
                          name: parameterType
                          values:
                          - value: string
                            description: The parameter's value is a string.
                          - value: secretString
                            description: The parameter's value is a string that holds
                              sensitive information.
                          - value: int
                            description: The parameter's value is a 32-bit signed
                              integer.
                          - value: double
                            description: The parameter's value is a 64-bit double-precision
                              floating point.
                          - value: bool
                            description: The parameter's value is a boolean value
                              that is either true or false.
                          modelAsString: true
                      description:
                        type: string
                        description: Description of the parameter.
                      default:
                        type: string
                        description: The default value for the parameter to be used
                          if the live pipeline does not specify a value.
                    description: Single topology parameter declaration. Declared parameters
                      can and must be referenced throughout the topology and can optionally
                      have default values to be used when they are not defined in
                      the pipeline instances.
                  description: List of the topology parameter declarations. Parameters
                    declared here can be referenced throughout the topology nodes
                    through the use of "${PARAMETER_NAME}" string pattern. Parameters
                    can have optional default values and can later be defined in individual
                    instances of the pipeline.
                sources:
                  type: array
                  items:
                    type: object
                    required:
                    - '@type'
                    - name
                    discriminator:
                      propertyName: '@type'
                    properties:
                      '@type':
                        type: string
                        description: Type discriminator for the derived types.
                      name:
                        type: string
                        description: Node name. Must be unique within the topology.
                    description: Base class for topology source nodes.
                  description: List of the topology source nodes. Source nodes enable
                    external data to be ingested by the pipeline.
                processors:
                  type: array
                  items:
                    type: object
                    required:
                    - '@type'
                    - inputs
                    - name
                    discriminator:
                      propertyName: '@type'
                    properties:
                      '@type':
                        type: string
                        description: Type discriminator for the derived types.
                      name:
                        type: string
                        description: Node name. Must be unique within the topology.
                      inputs:
                        type: array
                        description: An array of upstream node references within the
                          topology to be used as inputs for this node.
                        items:
                          type: object
                          required:
                          - nodeName
                          properties:
                            nodeName:
                              type: string
                              description: The name of the upstream node in the pipeline
                                which output is used as input of the current node.
                            outputSelectors:
                              type: array
                              description: Allows for the selection of specific data
                                streams (eg. video only) from another node.
                              items:
                                type: object
                                properties:
                                  property:
                                    type: string
                                    description: The property of the data stream to
                                      be used as the selection criteria.
                                    enum:
                                    - mediaType
                                    x-ms-enum:
                                      name: outputSelectorProperty
                                      values:
                                      - value: mediaType
                                        description: 'The stream''s MIME type or subtype:
                                          audio, video or application'
                                      modelAsString: true
                                  operator:
                                    type: string
                                    description: The operator to compare properties
                                      by.
                                    enum:
                                    - is
                                    - isNot
                                    x-ms-enum:
                                      name: outputSelectorOperator
                                      values:
                                      - value: is
                                        description: The property is of the type defined
                                          by value.
                                      - value: isNot
                                        description: The property is not of the type
                                          defined by value.
                                      modelAsString: true
                                  value:
                                    type: string
                                    description: Value to compare against.
                                description: Allows for the selection of particular
                                  streams from another node.
                          description: Describes an input signal to be used on a pipeline
                            node.
                    description: Base class for topology processor nodes.
                  description: List of the topology processor nodes. Processor nodes
                    enable pipeline data to be analyzed, processed or transformed.
                sinks:
                  type: array
                  items:
                    type: object
                    required:
                    - '@type'
                    - inputs
                    - name
                    discriminator:
                      propertyName: '@type'
                    properties:
                      '@type':
                        type: string
                        description: Type discriminator for the derived types.
                      name:
                        type: string
                        description: Node name. Must be unique within the topology.
                      inputs:
                        type: array
                        description: An array of upstream node references within the
                          topology to be used as inputs for this node.
                        items:
                          type: object
                          required:
                          - nodeName
                          properties:
                            nodeName:
                              type: string
                              description: The name of the upstream node in the pipeline
                                which output is used as input of the current node.
                            outputSelectors:
                              type: array
                              description: Allows for the selection of specific data
                                streams (eg. video only) from another node.
                              items:
                                type: object
                                properties:
                                  property:
                                    type: string
                                    description: The property of the data stream to
                                      be used as the selection criteria.
                                    enum:
                                    - mediaType
                                    x-ms-enum:
                                      name: outputSelectorProperty
                                      values:
                                      - value: mediaType
                                        description: 'The stream''s MIME type or subtype:
                                          audio, video or application'
                                      modelAsString: true
                                  operator:
                                    type: string
                                    description: The operator to compare properties
                                      by.
                                    enum:
                                    - is
                                    - isNot
                                    x-ms-enum:
                                      name: outputSelectorOperator
                                      values:
                                      - value: is
                                        description: The property is of the type defined
                                          by value.
                                      - value: isNot
                                        description: The property is not of the type
                                          defined by value.
                                      modelAsString: true
                                  value:
                                    type: string
                                    description: Value to compare against.
                                description: Allows for the selection of particular
                                  streams from another node.
                          description: Describes an input signal to be used on a pipeline
                            node.
                    description: Base class for topology sink nodes.
                  description: List of the topology sink nodes. Sink nodes allow pipeline
                    data to be stored or exported.
          description: "Pipeline topology describes the processing steps to be applied\
            \ when processing media for a particular outcome. The topology should\
            \ be defined according to the scenario to be achieved and can be reused\
            \ across many pipeline instances which share the same processing characteristics.\
            \ For instance, a pipeline topology which acquires data from a RTSP camera,\
            \ process it with an specific AI model and stored the data on the cloud\
            \ can be reused across many different cameras, as long as the same processing\
            \ should be applied across all the cameras. Individual instance properties\
            \ can be defined through the use of user-defined parameters, which allow\
            \ for a topology to be parameterized, thus allowing individual pipelines\
            \ to refer to different values, such as individual cameras RTSP endpoints\
            \ and credentials. Overall a topology is composed of the following:\r\n\
            \r\n  - Parameters: list of user defined parameters that can be references\
            \ across the topology nodes.\r\n  - Sources: list of one or more data\
            \ sources nodes such as an RTSP source which allows for media to be ingested\
            \ from cameras.\r\n  - Processors: list of nodes which perform data analysis\
            \ or transformations.\r\n  -Sinks: list of one or more data sinks which\
            \ allow for data to be stored or exported to other destinations."
      required:
      - methodName
      - pipelineTopology
      description: Base class for direct method calls.
      discriminator:
        propertyName: methodName
      x-ms-discriminator-value: pipelineTopologySet
