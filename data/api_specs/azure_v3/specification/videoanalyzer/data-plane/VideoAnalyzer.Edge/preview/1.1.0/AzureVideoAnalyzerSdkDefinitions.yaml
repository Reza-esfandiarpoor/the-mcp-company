    LivePipelineSetRequest:
      type: object
      properties:
        methodName:
          type: string
          description: Direct method method name.
          readOnly: true
        '@apiVersion':
          type: string
          description: Video Analyzer API version.
          enum:
          - '1.1'
          x-ms-enum:
            name: apiVersionEnum
            modelAsString: false
          x-ms-client-default: '1.1'
        livePipeline:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Live pipeline unique identifier.
            systemData:
              description: Read-only system metadata associated with this object.
              type: object
              properties:
                createdAt:
                  type: string
                  format: date-time
                  description: Date and time when this resource was first created.
                    Value is represented in UTC according to the ISO8601 date format.
                lastModifiedAt:
                  type: string
                  format: date-time
                  description: Date and time when this resource was last modified.
                    Value is represented in UTC according to the ISO8601 date format.
            properties:
              description: Live pipeline properties.
              type: object
              properties:
                description:
                  type: string
                  description: An optional description of the live pipeline.
                topologyName:
                  type: string
                  description: The reference to an existing pipeline topology defined
                    for real-time content processing. When activated, this live pipeline
                    will process content according to the pipeline topology definition.
                parameters:
                  type: array
                  description: List of the instance level parameter values for the
                    user-defined topology parameters. A pipeline can only define or
                    override parameters values for parameters which have been declared
                    in the referenced topology. Topology parameters without a default
                    value must be defined. Topology parameters with a default value
                    can be optionally be overridden.
                  items:
                    type: object
                    required:
                    - name
                    properties:
                      name:
                        type: string
                        description: Name of the parameter declared in the pipeline
                          topology.
                      value:
                        type: string
                        description: Parameter value to be applied on this specific
                          live pipeline.
                    description: Defines the parameter value of an specific pipeline
                      topology parameter. See pipeline topology parameters for more
                      information.
                state:
                  type: string
                  description: Current pipeline state (read-only).
                  enum:
                  - inactive
                  - activating
                  - active
                  - deactivating
                  x-ms-enum:
                    name: livePipelineState
                    values:
                    - value: inactive
                      description: The live pipeline is idle and not processing media.
                    - value: activating
                      description: The live pipeline is transitioning into the active
                        state.
                    - value: active
                      description: The live pipeline is active and able to process
                        media. If your data source is not available, for instance,
                        if your RTSP camera is powered off or unreachable, the pipeline
                        will still be active and periodically retrying the connection.
                        Your Azure subscription will be billed for the duration in
                        which the live pipeline is in the active state.
                    - value: deactivating
                      description: The live pipeline is transitioning into the inactive
                        state.
                    modelAsString: true
          description: Live Pipeline represents an unique instance of a pipeline topology
            which is used for real-time content ingestion and analysis.
      required:
      - methodName
      - livePipeline
      description: Base class for direct method calls.
      discriminator:
