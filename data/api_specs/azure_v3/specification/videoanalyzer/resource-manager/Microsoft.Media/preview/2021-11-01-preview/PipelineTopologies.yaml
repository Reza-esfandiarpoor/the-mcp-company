    put:
      summary: Creates or updates a pipeline topology.
      description: Creates a new pipeline topology or updates an existing one, with
        the given name. A pipeline topology describes the processing steps to be applied
        when processing content for a particular outcome. The topology should be defined
        according to the scenario to be achieved and can be reused across many pipeline
        instances which share the same processing characteristics.
