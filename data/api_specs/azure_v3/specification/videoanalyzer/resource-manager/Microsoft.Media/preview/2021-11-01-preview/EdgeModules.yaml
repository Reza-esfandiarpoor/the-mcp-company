    put:
      summary: Creates a new edge module or updates an existing one.
      description: Creates a new edge module or updates an existing one. An edge module
        resource enables a single instance of an Azure Video Analyzer IoT edge module
        to interact with the Video Analyzer Account. This is used for authorization
        and also to make sure that the particular edge module instance only has access
        to the data it requires from the Azure Video Analyzer service. A new edge
        module resource should be created for every new instance of an Azure Video
        Analyzer edge module deployed to you Azure IoT edge environment. Edge module
        resources can be deleted if the specific module is not in use anymore.
      operationId: EdgeModules_CreateOrUpdate
