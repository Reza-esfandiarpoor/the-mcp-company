  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Media/videoAnalyzers/{accountName}/edgeModules/{edgeModuleName}/listProvisioningToken
  : post:
      summary: Creates a new provisioning token.
      description: Creates a new provisioning token. A provisioning token allows for
        a single instance of Azure Video analyzer IoT edge module to be initialized
        and authorized to the cloud account. The provisioning token itself is short
        lived and it is only used for the initial handshake between IoT edge module
        and the cloud. After the initial handshake, the IoT edge module will agree
        on a set of authentication keys which will be auto-rotated as long as the
        module is able to periodically connect to the cloud. A new provisioning token
        can be generated for the same IoT edge module in case the module state lost
        or reset.
      operationId: EdgeModules_ListProvisioningToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  expirationDate:
                    type: string
                    format: date-time
                    description: The expiration date of the registration token. The
                      Azure Video Analyzer IoT edge module must be initialized and
                      connected to the Internet prior to the token expiration date.
                    readOnly: true
                    nullable: false
                  token:
                    type: string
                    description: The token blob to be provided to the Azure Video
                      Analyzer IoT edge module through the Azure IoT Edge module twin
                      properties.
                    readOnly: true
                type: object
                description: Provisioning token properties. A provisioning token allows
                  for a single instance of Azure Video analyzer IoT edge module to
