openapi: 3.0.0
info:
  title: MobileNetworkManagementClient
  description: The resources in this API specification will be used to manage service
    resources
  version: 2024-04-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MobileNetwork/mobileNetworks/{mobileNetworkName}/services/{serviceName}
  : delete:
      tags:
      - Service
      operationId: Services_Delete
      description: Deletes the specified service.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: mobileNetworkName
        in: path
        required: true
        description: The name of the mobile network.
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
      - name: serviceName
        in: path
        required: true
        description: The name of the service. You must not use any of the following
          reserved strings - `default`, `requested` or `service`
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 64
          pattern: ^(?!(default|requested|service)$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Delete successful.
        '202':
          description: Accepted. Sets 'Deleting' provisioningState until the operation
            completes. Returns an operation URI that can be queried to find the current
            state of the operation.
        '204':
          description: Request successful. Resource does not exist.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: The error code.
                        readOnly: true
                      message:
                        type: string
                        description: The error message.
                        readOnly: true
                      target:
                        type: string
                        description: The error target.
                        readOnly: true
                      details:
                        type: array
                        description: The error details.
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              type: string
                              description: The error code.
                              readOnly: true
                            message:
                              type: string
                              description: The error message.
                              readOnly: true
                            target:
                              type: string
                              description: The error target.
                              readOnly: true
                            details:
                              type: array
                              description: The error details.
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    type: string
                                    description: The error code.
                                    readOnly: true
                                  message:
                                    type: string
                                    description: The error message.
                                    readOnly: true
                                  target:
                                    type: string
                                    description: The error target.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers:
                              - message
                              - target
                            additionalInfo:
                              type: array
                              description: The error additional info.
                              items:
                                type: object
                                description: The resource management error additional
                                  info.
                                properties:
                                  type:
                                    type: string
                                    description: The additional info type.
                                    readOnly: true
                                  info:
                                    type: object
                                    description: The additional info.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers: []
                        readOnly: true
                        x-ms-identifiers:
                        - message
                        - target
                      additionalInfo:
                        type: array
                        description: The error additional info.
                        items:
                          type: object
                          description: The resource management error additional info.
                          properties:
                            type:
                              type: string
                              description: The additional info type.
                              readOnly: true
                            info:
                              type: object
                              description: The additional info.
                              readOnly: true
                        readOnly: true
                        x-ms-identifiers: []
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
    get:
      tags:
      - Service
      operationId: Services_Get
      description: Gets information about the specified service.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: mobileNetworkName
        in: path
        required: true
        description: The name of the mobile network.
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
      - name: serviceName
        in: path
        required: true
        description: The name of the service. You must not use any of the following
          reserved strings - `default`, `requested` or `service`
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 64
          pattern: ^(?!(default|requested|service)$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Request successful. The operation returns the resulting service
            resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: arm-id
                    description: Fully qualified resource ID for the resource. E.g.
                      "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
                    readOnly: true
                  name:
                    type: string
                    description: The name of the resource
                    readOnly: true
                  type:
                    type: string
                    description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                      or "Microsoft.Storage/storageAccounts"
                    readOnly: true
                  systemData:
                    description: Azure Resource Manager metadata containing createdBy
                      and modifiedBy information.
                    readOnly: true
                    type: object
                    properties:
                      createdBy:
                        type: string
                        description: The identity that created the resource.
                      createdByType:
                        type: string
                        description: The type of identity that created the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      createdAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource creation (UTC).
                      lastModifiedBy:
                        type: string
                        description: The identity that last modified the resource.
                      lastModifiedByType:
                        type: string
                        description: The type of identity that last modified the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      lastModifiedAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource last modification (UTC)
                  tags:
                    type: object
                    description: Resource tags.
                    additionalProperties:
                      type: string
                    x-ms-mutability:
                    - read
                    - create
                    - update
                  location:
                    type: string
                    description: The geo-location where the resource lives
                    x-ms-mutability:
                    - read
                    - create
                  properties:
                    x-ms-client-flatten: true
                    description: Service Properties.
                    type: object
                    properties:
                      provisioningState:
                        description: The provisioning state of the service resource.
                        type: string
                        readOnly: true
                        enum:
                        - Unknown
                        - Succeeded
                        - Accepted
                        - Deleting
                        - Failed
                        - Canceled
                        - Deleted
                        x-ms-enum:
                          name: ProvisioningState
                          modelAsString: true
                          values:
                          - value: Unknown
                          - value: Succeeded
                          - value: Accepted
                          - value: Deleting
                          - value: Failed
                          - value: Canceled
                          - value: Deleted
                      servicePrecedence:
                        description: A precedence value that is used to decide between
                          services when identifying the QoS values to use for a particular
                          SIM. A lower value means a higher priority. This value should
                          be unique among all services configured in the mobile network.
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 255
                      serviceQosPolicy:
                        description: The QoS policy to use for packets matching this
                          service. This can be overridden for particular flows using
                          the ruleQosPolicy field in a PccRuleConfiguration. If this
                          field is null then the UE's SIM policy will define the QoS
                          settings.
                        type: object
                        properties:
                          5qi:
                            description: 5G QoS Flow Indicator value. The 5QI identifies
                              a specific QoS forwarding treatment to be provided to
                              a flow. See 3GPP TS23.501 section 5.7.2.1 for a full
                              description of the 5QI parameter, and table 5.7.4-1
                              for the definition the 5QI values.
                            default: 9
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 127
                          allocationAndRetentionPriorityLevel:
                            description: QoS Flow allocation and retention priority
                              (ARP) level. Flows with higher priority preempt flows
                              with lower priority, if the settings of `preemptionCapability`
                              and `preemptionVulnerability` allow it. 1 is the highest
                              level of priority. If this field is not specified then
                              `5qi` is used to derive the ARP value. See 3GPP TS23.501
                              section 5.7.2.2 for a full description of the ARP parameters.
                            default: 9
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 15
                          preemptionCapability:
                            description: QoS Flow preemption capability. The preemption
                              capability of a QoS Flow controls whether it can preempt
                              another QoS Flow with a lower priority level. See 3GPP
                              TS23.501 section 5.7.2.2 for a full description of the
                              ARP parameters.
                            default: NotPreempt
                            type: string
                            enum:
                            - NotPreempt
                            - MayPreempt
                            x-ms-enum:
                              name: PreemptionCapability
                              modelAsString: true
                              values:
                              - value: NotPreempt
                                description: Cannot preempt
                              - value: MayPreempt
                                description: May preempt
                          preemptionVulnerability:
                            description: QoS Flow preemption vulnerability. The preemption
                              vulnerability of a QoS Flow controls whether it can
                              be preempted by a QoS Flow with a higher priority level.
                              See 3GPP TS23.501 section 5.7.2.2 for a full description
                              of the ARP parameters.
                            default: Preemptable
                            type: string
                            enum:
                            - NotPreemptable
                            - Preemptable
                            x-ms-enum:
                              name: PreemptionVulnerability
                              modelAsString: true
                              values:
                              - value: NotPreemptable
                                description: Cannot be preempted
                              - value: Preemptable
                                description: May be preempted
                          maximumBitRate:
                            description: The maximum bit rate (MBR) for all service
                              data flows that use this data flow policy rule or service.
                            type: object
                            properties:
                              uplink:
                                description: Uplink bit rate.
                                type: string
                                pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                              downlink:
                                description: Downlink bit rate.
                                type: string
                                pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                            required:
                            - uplink
                            - downlink
                        required:
                        - maximumBitRate
                      pccRules:
                        description: The set of data flow policy rules that make up
                          this service.
                        type: array
                        items:
                          description: Data flow policy rule configuration
                          type: object
                          properties:
                            ruleName:
                              description: The name of the rule. This must be unique
                                within the parent service. You must not use any of
                                the following reserved strings - `default`, `requested`
                                or `service`.
                              type: string
                              pattern: ^(?!(default|requested|service)$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
                              maxLength: 64
                            rulePrecedence:
                              description: A precedence value that is used to decide
                                between data flow policy rules when identifying the
                                QoS values to use for a particular SIM. A lower value
                                means a higher priority. This value should be unique
                                among all data flow policy rules configured in the
                                mobile network.
                              type: integer
                              format: int32
                              minimum: 0
                              maximum: 255
                            ruleQosPolicy:
                              type: object
                              properties:
                                5qi:
                                  description: 5G QoS Flow Indicator value. The 5QI
                                    identifies a specific QoS forwarding treatment
                                    to be provided to a flow. See 3GPP TS23.501 section
                                    5.7.2.1 for a full description of the 5QI parameter,
                                    and table 5.7.4-1 for the definition the 5QI values.
                                  default: 9
                                  type: integer
                                  format: int32
                                  minimum: 1
                                  maximum: 127
                                allocationAndRetentionPriorityLevel:
                                  description: QoS Flow allocation and retention priority
                                    (ARP) level. Flows with higher priority preempt
                                    flows with lower priority, if the settings of
                                    `preemptionCapability` and `preemptionVulnerability`
                                    allow it. 1 is the highest level of priority.
                                    If this field is not specified then `5qi` is used
                                    to derive the ARP value. See 3GPP TS23.501 section
                                    5.7.2.2 for a full description of the ARP parameters.
                                  default: 9
                                  type: integer
                                  format: int32
                                  minimum: 1
                                  maximum: 15
                                preemptionCapability:
                                  description: QoS Flow preemption capability. The
                                    preemption capability of a QoS Flow controls whether
                                    it can preempt another QoS Flow with a lower priority
                                    level. See 3GPP TS23.501 section 5.7.2.2 for a
                                    full description of the ARP parameters.
                                  default: NotPreempt
                                  type: string
                                  enum:
                                  - NotPreempt
                                  - MayPreempt
                                  x-ms-enum:
                                    name: PreemptionCapability
                                    modelAsString: true
                                    values:
                                    - value: NotPreempt
                                      description: Cannot preempt
                                    - value: MayPreempt
                                      description: May preempt
                                preemptionVulnerability:
                                  description: QoS Flow preemption vulnerability.
                                    The preemption vulnerability of a QoS Flow controls
                                    whether it can be preempted by a QoS Flow with
                                    a higher priority level. See 3GPP TS23.501 section
                                    5.7.2.2 for a full description of the ARP parameters.
                                  default: Preemptable
                                  type: string
                                  enum:
                                  - NotPreemptable
                                  - Preemptable
                                  x-ms-enum:
                                    name: PreemptionVulnerability
                                    modelAsString: true
                                    values:
                                    - value: NotPreemptable
                                      description: Cannot be preempted
                                    - value: Preemptable
                                      description: May be preempted
                                maximumBitRate:
                                  description: The maximum bit rate (MBR) for all
                                    service data flows that use this data flow policy
                                    rule or service.
                                  type: object
                                  properties:
                                    uplink:
                                      description: Uplink bit rate.
                                      type: string
                                      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                                    downlink:
                                      description: Downlink bit rate.
                                      type: string
                                      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                                  required:
                                  - uplink
                                  - downlink
                                guaranteedBitRate:
                                  description: The guaranteed bit rate (GBR) for all
                                    service data flows that use this data flow policy
                                    rule. This is an optional setting. If you do not
                                    provide a value, there will be no GBR set for
                                    the data flow policy rule that uses this QoS definition.
                                  type: object
                                  properties:
                                    uplink:
                                      description: Uplink bit rate.
                                      type: string
                                      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                                    downlink:
                                      description: Downlink bit rate.
                                      type: string
                                      pattern: ^\d+(\.\d+)? (bps|Kbps|Mbps|Gbps|Tbps)$
                                  required:
                                  - uplink
                                  - downlink
                              required:
                              - maximumBitRate
                              description: QoS policy
                            trafficControl:
                              description: Determines whether flows that match this
                                data flow policy rule are permitted.
                              default: Enabled
                              type: string
                              enum:
                              - Enabled
                              - Blocked
                              x-ms-enum:
                                name: TrafficControlPermission
                                modelAsString: true
                                values:
                                - value: Enabled
                                  description: Traffic matching this rule is allowed
                                    to flow.
                                - value: Blocked
                                  description: Traffic matching this rule is not allowed
                                    to flow.
                            serviceDataFlowTemplates:
                              description: The set of data flow templates to use for
                                this data flow policy rule.
                              type: array
                              items:
                                description: Data flow template
                                type: object
                                properties:
                                  templateName:
                                    description: The name of the data flow template.
                                      This must be unique within the parent data flow
                                      policy rule. You must not use any of the following
                                      reserved strings - `default`, `requested` or
                                      `service`.
                                    type: string
                                    pattern: ^(?!(default|requested|service)$)[a-zA-Z0-9][a-zA-Z0-9_-]*$
                                    maxLength: 64
                                  direction:
                                    description: The direction of this flow.
                                    type: string
                                    enum:
                                    - Uplink
                                    - Downlink
                                    - Bidirectional
                                    x-ms-enum:
                                      name: SdfDirection
                                      modelAsString: true
                                      values:
                                      - value: Uplink
                                        description: Traffic flowing from the UE to
                                          the data network.
                                      - value: Downlink
                                        description: Traffic flowing from the data
                                          network to the UE.
                                      - value: Bidirectional
                                        description: Traffic flowing both to and from
                                          the UE.
                                  protocol:
                                    description: A list of the allowed protocol(s)
                                      for this flow. If you want this flow to be able
                                      to use any protocol within the internet protocol
                                      suite, use the value `ip`. If you only want
                                      to allow a selection of protocols, you must
                                      use the corresponding IANA Assigned Internet
                                      Protocol Number for each protocol, as described
                                      in https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml.
                                      For example, for UDP, you must use 17. If you
                                      use the value `ip` then you must leave the field
                                      `port` unspecified.
                                    type: array
                                    items:
                                      type: string
                                      pattern: ^(ip|[0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
                                    minItems: 1
                                    uniqueItems: true
                                  remoteIpList:
                                    description: The remote IP address(es) to which
                                      UEs will connect for this flow. If you want
                                      to allow connections on any IP address, use
                                      the value `any`. Otherwise, you must provide
                                      each of the remote IP addresses to which the
                                      packet core instance will connect for this flow.
                                      You must provide each IP address in CIDR notation,
                                      including the netmask (for example, 192.0.2.54/24).
                                    type: array
                                    items:
                                      type: string
                                      pattern: ^(any|(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2])))$
                                      description: IPv4 address mask or value `any`
                                    minItems: 1
                                    uniqueItems: true
                                  ports:
                                    description: 'The port(s) to which UEs will connect
                                      for this flow. You can specify zero or more
                                      ports or port ranges. If you specify one or
                                      more ports or port ranges then you must specify
                                      a value other than `ip` in the `protocol` field.
                                      This is an optional setting. If you do not specify
                                      it then connections will be allowed on all ports.
                                      Port ranges must be specified as <FirstPort>-<LastPort>.
                                      For example: [`8080`, `8082-8085`].'
                                    type: array
                                    items:
                                      type: string
                                      pattern: ^([1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])(-([1-9]|[1-9][0-9]{1,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?$
                                    uniqueItems: true
                                required:
                                - templateName
                                - direction
                                - protocol
                                - remoteIpList
                              minItems: 1
                              maxItems: 15
                              uniqueItems: true
                              x-ms-identifiers:
                              - templateName
                          required:
                          - ruleName
                          - rulePrecedence
                          - serviceDataFlowTemplates
                        minItems: 1
                        uniqueItems: true
                        x-ms-identifiers:
                        - ruleName
                    required:
                    - servicePrecedence
                    - pccRules
                required:
                - location
                - properties
                title: Resource
                description: Common fields that are returned in the response for all
                  Azure Resource Manager resources
                x-ms-azure-resource: true
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: The error code.
                        readOnly: true
                      message:
                        type: string
                        description: The error message.
                        readOnly: true
                      target:
                        type: string
                        description: The error target.
                        readOnly: true
                      details:
                        type: array
                        description: The error details.
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              type: string
                              description: The error code.
                              readOnly: true
                            message:
                              type: string
                              description: The error message.
                              readOnly: true
                            target:
                              type: string
                              description: The error target.
                              readOnly: true
                            details:
                              type: array
                              description: The error details.
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    type: string
                                    description: The error code.
                                    readOnly: true
                                  message:
                                    type: string
                                    description: The error message.
                                    readOnly: true
                                  target:
                                    type: string
                                    description: The error target.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers:
                              - message
                              - target
                            additionalInfo:
                              type: array
                              description: The error additional info.
                              items:
                                type: object
                                description: The resource management error additional
                                  info.
                                properties:
                                  type:
                                    type: string
                                    description: The additional info type.
                                    readOnly: true
                                  info:
                                    type: object
                                    description: The additional info.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers: []
                        readOnly: true
                        x-ms-identifiers:
                        - message
                        - target
                      additionalInfo:
                        type: array
                        description: The error additional info.
                        items:
                          type: object
                          description: The resource management error additional info.
                          properties:
                            type:
                              type: string
                              description: The additional info type.
                              readOnly: true
                            info:
                              type: object
                              description: The additional info.
                              readOnly: true
                        readOnly: true
                        x-ms-identifiers: []
    put:
      tags:
      - Service
      operationId: Services_CreateOrUpdate
      description: Creates or updates a service. Must be created in the same location
        as its parent mobile network.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: mobileNetworkName
        in: path
        required: true
        description: The name of the mobile network.
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
      - name: serviceName
        in: path
        required: true
        description: The name of the service. You must not use any of the following
          reserved strings - `default`, `requested` or `service`
        x-ms-parameter-location: method
        schema:
