    put:
      tags:
      - SIMPolicy
      operationId: SimPolicies_CreateOrUpdate
      description: Creates or updates a SIM policy. Must be created in the same location
        as its parent mobile network.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
