                        - read
                        description: The international mobile subscriber identity
                          (IMSI) for the SIM.
                      integratedCircuitCardIdentifier:
                        type: string
                        pattern: ^[0-9]{10,20}$
                        description: The integrated circuit card ID (ICCID) for the
                          SIM.
                      deviceType:
                        type: string
                        description: An optional free-form text field that can be
                          used to record the device type this SIM is associated with,
                          for example 'Video camera'. The Azure portal allows SIMs
                          to be grouped and filtered based on this value.
                      simPolicy:
                        description: The SIM policy used by this SIM. The SIM policy
                          must be in the same location as the SIM.
                        type: object
                        properties:
                          id:
                            type: string
                            pattern: ^/[sS][uU][bB][sS][cC][rR][iI][pP][tT][iI][oO][nN][sS]/[^/?#]+/[rR][eE][sS][oO][uU][rR][cC][eE][gG][rR][oO][uU][pP][sS]/[^/?#]+/[pP][rR][oO][vV][iI][dD][eE][rR][sS]/[mM][iI][cC][rR][oO][sS][oO][fF][tT]\.[mM][oO][bB][iI][lL][eE][nN][eE][tT][wW][oO][rR][kK]/[mM][oO][bB][iI][lL][eE][nN][eE][tT][wW][oO][rR][kK][sS]/[^/?#]+/[sS][iI][mM][pP][oO][lL][iI][cC][iI][eE][sS]/[^/?#]+$
