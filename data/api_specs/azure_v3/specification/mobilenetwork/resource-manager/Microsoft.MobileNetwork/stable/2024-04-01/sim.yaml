                              required for enabling is present.
                          - value: Enabled
                            description: The SIM is enabled.
                          - value: Invalid
                            description: The SIM cannot be enabled because some of
                              the associated configuration is invalid.
                      siteProvisioningState:
                        readOnly: true
                        description: A dictionary of sites to the provisioning state
                          of this SIM on that site.
                        type: object
                        additionalProperties:
                          type: string
                          readOnly: true
                          description: The provisioning state of a resource e.g. SIM/SIM
