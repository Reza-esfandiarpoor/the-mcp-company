                        required:
                        - id
                        x-ms-azure-resource: true
                      staticIpConfiguration:
                        type: array
                        items:
                          type: object
                          description: Static IP configuration for a SIM, scoped to
                            a particular attached data network and slice.
                          properties:
                            attachedDataNetwork:
                              description: The attached data network on which the
                                static IP address will be used. The combination of
                                attached data network and slice defines the network
                                scope of the IP address. The attached data network
                                must be in the same location as the SIM.
                              type: object
                              properties:
                                id:
                                  type: string
                                  pattern: ^/[sS][uU][bB][sS][cC][rR][iI][pP][tT][iI][oO][nN][sS]/[^/?#]+/[rR][eE][sS][oO][uU][rR][cC][eE][gG][rR][oO][uU][pP][sS]/[^/?#]+/[pP][rR][oO][vV][iI][dD][eE][rR][sS]/[mM][iI][cC][rR][oO][sS][oO][fF][tT]\.[mM][oO][bB][iI][lL][eE][nN][eE][tT][wW][oO][rR][kK]/[pP][aA][cC][kK][eE][tT][cC][oO][rR][eE][cC][oO][nN][tT][rR][oO][lL][pP][lL][aA][nN][eE][sS]/[^/?#]+/[pP][aA][cC][kK][eE][tT][cC][oO][rR][eE][dD][aA][tT][aA][pP][lL][aA][nN][eE][sS]/[^/?#]+/[aA][tT][tT][aA][cC][hH][eE][dD][dD][aA][tT][aA][nN][eE][tT][wW][oO][rR][kK][sS]/[^/?#]+$
                                  description: Attached data network resource ID.
                              required:
                              - id
                              x-ms-azure-resource: true
                            slice:
                              description: The network slice on which the static IP
                                address will be used. The combination of attached
                                data network and slice defines the network scope of
                                the IP address. The slice must be in the same location
                                as the SIM.
                              type: object
                              properties:
                                id:
                                  type: string
                                  pattern: ^/[sS][uU][bB][sS][cC][rR][iI][pP][tT][iI][oO][nN][sS]/[^/?#]+/[rR][eE][sS][oO][uU][rR][cC][eE][gG][rR][oO][uU][pP][sS]/[^/?#]+/[pP][rR][oO][vV][iI][dD][eE][rR][sS]/[mM][iI][cC][rR][oO][sS][oO][fF][tT]\.[mM][oO][bB][iI][lL][eE][nN][eE][tT][wW][oO][rR][kK]/[mM][oO][bB][iI][lL][eE][nN][eE][tT][wW][oO][rR][kK][sS]/[^/?#]+/[sS][lL][iI][cC][eE][sS]/[^/?#]+$
                                  description: Slice resource ID.
                              required:
                              - id
                              x-ms-azure-resource: true
                            staticIp:
                              type: object
                              description: The static IP configuration for the SIM
                                to use at the defined network scope.
                              properties:
                                ipv4Address:
                                  description: The IPv4 address assigned to the SIM
                                    at this network scope. This address must be in
                                    the userEquipmentStaticAddressPoolPrefix defined
                                    in the attached data network.
                                  type: string
                                  pattern: ^(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$
                        minItems: 1
                        uniqueItems: true
                        description: A list of static IP addresses assigned to this
                          SIM. Each address is assigned at a defined network scope,
                          made up of {attached data network, slice}.
                        x-ms-identifiers:
                        - attachedDataNetwork
                        - slice
                      vendorName:
                        readOnly: true
                        type: string
                        description: The name of the SIM vendor who provided this
                          SIM, if any.
                      vendorKeyFingerprint:
                        readOnly: true
                        type: string
