    get:
      operationId: AvailableEndpointServices_List
      description: List what values of endpoint services are available for use.
      parameters:
      - name: location
        in: path
        required: true
        description: The location to check available endpoint services.
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: The subscription credentials which uniquely identify the Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      responses:
        '200':
          description: Request successful. Returns list of available endpoint services.
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Resource ID.
                        name:
                          type: string
                          description: Name of the endpoint service.
                          readOnly: true
                        type:
                          type: string
                          description: Type of the endpoint service.
                          readOnly: true
                      description: Reference to another subresource.
                      x-ms-azure-resource: true
                    description: List of available endpoint services in a region.
                  nextLink:
                    type: string
                    description: The URL to get the next set of results.
                description: Response for the ListAvailableEndpointServices API service
                  call.
