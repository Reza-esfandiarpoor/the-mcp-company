servers:
- url: https://management.azure.com
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client API version.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The subscription credentials which uniquely identify the Microsoft
        Azure subscription. The subscription ID forms part of the URI for every service
        call.
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ApplicationGatewayOnDemandProbe:
      properties:
        protocol:
          $ref: '#/components/schemas/ApplicationGatewayProtocol'
        host:
          type: string
          description: Host name to send the probe to.
        path:
          type: string
          description: Relative path of probe. Valid path starts from '/'. Probe is
            sent to <Protocol>://<host>:<port><path>.
        timeout:
          type: integer
          format: int32
          description: The probe timeout in seconds. Probe marked as failed if valid
            response is not received with this timeout period. Acceptable values are
            from 1 second to 86400 seconds.
        pickHostNameFromBackendHttpSettings:
          type: boolean
          description: Whether the host header should be picked from the backend http
            settings. Default value is false.
        match:
          $ref: '#/components/schemas/ApplicationGatewayProbeHealthResponseMatch'
        backendAddressPool:
          $ref: '#/components/schemas/SubResource'
        backendHttpSettings:
          $ref: '#/components/schemas/SubResource'
      description: Details of on demand test probe request.
    ApplicationGatewayBackendHealthOnDemand:
      properties:
        backendAddressPool:
          $ref: '#/components/schemas/ApplicationGatewayBackendAddressPool'
        backendHealthHttpSettings:
          $ref: '#/components/schemas/ApplicationGatewayBackendHealthHttpSettings'
      description: Result of on demand test probe.
    ApplicationGatewayBackendHealth:
      properties:
        backendAddressPools:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationGatewayBackendHealthPool'
          description: A list of ApplicationGatewayBackendHealthPool resources.
      description: Response for ApplicationGatewayBackendHealth API service call.
    ApplicationGatewayBackendHealthPool:
      properties:
