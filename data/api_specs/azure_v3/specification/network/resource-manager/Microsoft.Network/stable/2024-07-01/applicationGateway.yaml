        required: true
        description: The name of the application gateway.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationGateway'
        description: Parameters supplied to the create or update application gateway
          operation.
        required: true
      responses:
        '200':
          description: Update successful. The operation returns the resulting ApplicationGateway
            resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationGateway'
        '201':
          description: Create successful. The operation returns the resulting ApplicationGateway
            resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationGateway'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudError'
