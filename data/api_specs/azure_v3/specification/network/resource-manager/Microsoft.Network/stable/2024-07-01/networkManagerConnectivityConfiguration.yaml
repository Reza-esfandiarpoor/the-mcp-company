openapi: 3.0.0
info:
  title: ConnectivityConfiguration
  description: The Microsoft Azure Virtual Network Manager Connectivity Configuration
    API provides a RESTful set of web services that interact with Microsoft Azure
    Network Manager service to manage your network resources.
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/networkManagers/{networkManagerName}/connectivityConfigurations/{configurationName}
  : parameters:
    - name: api-version
      in: query
      required: true
      description: Client API version.
      schema:
        type: string
    - name: subscriptionId
      in: path
      required: true
      description: The subscription credentials which uniquely identify the Microsoft
        Azure subscription. The subscription ID forms part of the URI for every service
        call.
      schema:
        type: string
    - name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group.
      x-ms-parameter-location: method
      schema:
        type: string
    - name: networkManagerName
      in: path
      required: true
      description: The name of the network manager.
      x-ms-parameter-location: method
      schema:
        type: string
    - name: configurationName
      in: path
      required: true
      description: The name of the network manager connectivity configuration.
      x-ms-parameter-location: method
      schema:
        type: string
    get:
      tags:
      - ConnectivityConfigurations
      operationId: ConnectivityConfigurations_Get
      description: Gets a Network Connectivity Configuration, specified by the resource
        group, network manager name, and connectivity Configuration name
      responses:
        '200':
          description: Get successful. The operation returns the specified Managed
            Network Connectivity Configuration resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    readOnly: true
                    type: string
                    description: Resource ID.
                  name:
                    readOnly: true
                    type: string
                    description: Resource name.
                  type:
                    readOnly: true
                    type: string
                    description: Resource type.
                  etag:
                    readOnly: true
                    type: string
                    description: A unique read-only string that changes whenever the
                      resource is updated.
                  properties:
                    x-ms-client-flatten: true
                    description: Properties of a network manager connectivity configuration
                    type: object
                    properties:
                      description:
                        type: string
                        description: A description of the connectivity configuration.
                      connectivityTopology:
                        type: string
                        enum:
                        - HubAndSpoke
                        - Mesh
                        x-ms-enum:
                          name: ConnectivityTopology
                          modelAsString: true
                        description: Connectivity topology type.
                      hubs:
                        type: array
                        x-ms-identifiers:
                        - resourceId
                        items:
                          type: object
                          properties:
                            resourceId:
                              type: string
                              description: Resource Id.
                            resourceType:
                              type: string
                              description: Resource Type.
                          description: Hub Item.
                        description: List of hubItems
                      isGlobal:
                        type: string
                        enum:
                        - 'False'
                        - 'True'
                        x-ms-enum:
                          name: IsGlobal
                          modelAsString: true
                        description: Flag if global mesh is supported.
                      connectivityCapabilities:
                        type: object
                        description: Collection of additional settings to enhance
                          specific topology behaviors of the connectivity configuration
                          resource.
                        properties:
                          connectedGroupPrivateEndpointsScale:
                            type: string
                            enum:
                            - Standard
                            - HighScale
                            x-ms-enum:
                              name: ConnectedGroupPrivateEndpointsScale
                              modelAsString: true
                              values:
                              - value: Standard
                                description: Default. Allows for up to 2K private
                                  endpoints in the connected group.
                              - value: HighScale
                                description: Allows for up to 20K private endpoints
                                  in the connected group.
                            description: Option indicating the scale of private endpoints
                              allowed in the connected group of the connectivity configuration.
                            default: Standard
                          connectedGroupAddressOverlap:
                            type: string
                            enum:
                            - Allowed
                            - Disallowed
                            x-ms-enum:
                              name: ConnectedGroupAddressOverlap
                              modelAsString: true
                              values:
                              - value: Allowed
                                description: Default. Allows connected group members
                                  to have overlapping IP address space.
                              - value: Disallowed
                                description: Strictly disallows connected group members
                                  from having overlapping IP address space. Prevents
                                  the addition of a virtual network with overlapping
                                  address to the connected group, blocks peering between
                                  a virtual network and a connected group member if
                                  any connected group member has an overlapping range,
                                  and restricts address space modifications that would
                                  introduce overlap.
                            description: Behavior to handle overlapped IP address
                              space among members of the connected group of the connectivity
                              configuration.
                            default: Allowed
                          peeringEnforcement:
                            type: string
                            enum:
                            - Unenforced
                            - Enforced
                            x-ms-enum:
                              name: PeeringEnforcement
                              modelAsString: true
                              values:
                              - value: Unenforced
                                description: Default. Peerings created by the connectivity
                                  configuration may be modified or deleted outside
                                  of the network manager.
                              - value: Enforced
                                description: Peerings created by the connectivity
                                  configuration will not be modifiable or deletable
                                  outside of the network manager.
                            description: Option indicating enforcement of peerings
                              created by the connectivity configuration.
                            default: Unenforced
                        required:
