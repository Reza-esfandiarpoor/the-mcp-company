                                    type: string
                                    enum:
                                    - None
                                    - DirectlyConnected
                                    x-ms-enum:
                                      name: GroupConnectivity
                                      modelAsString: true
                                    description: Group connectivity type.
                                description: Connectivity group item.
                                required:
