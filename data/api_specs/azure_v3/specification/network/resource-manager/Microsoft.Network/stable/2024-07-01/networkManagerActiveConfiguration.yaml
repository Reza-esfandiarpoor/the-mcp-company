info:
  title: NetworkManagerActiveConfiguration
  description: The Microsoft Azure Network Manager Active Configuration API provides
    a RESTful set of web services that interact with Microsoft Azure Network Manager
    service to list all active configuration by network manager.
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/networkManagers/{networkManagerName}/listActiveConnectivityConfigurations
