                    query call (together with the same query and scopes used in the
                    current request) to retrieve the next page of data.
                  type: string
              description: Effective Virtual Networks Parameter.
        description: Active Configuration Parameter.
        required: true
      operationId: ListActiveConnectivityConfigurations
      description: Lists active connectivity configurations in a network manager.
      responses:
        '200':
          description: Post successful. The operation returns the specified Managed
            Network active connectivity configuration resource.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Connectivity configuration ID.
                        properties:
                          x-ms-client-flatten: true
                          description: Properties of a network manager connectivity
                            configuration
                          type: object
                          properties:
                            description:
                              type: string
                              description: A description of the connectivity configuration.
                            connectivityTopology:
                              type: string
                              enum:
                              - HubAndSpoke
                              - Mesh
                              x-ms-enum:
                                name: ConnectivityTopology
                                modelAsString: true
                              description: Connectivity topology type.
                            hubs:
                              type: array
                              x-ms-identifiers:
                              - resourceId
                              items:
                                type: object
                                properties:
                                  resourceId:
                                    type: string
                                    description: Resource Id.
                                  resourceType:
                                    type: string
                                    description: Resource Type.
                                description: Hub Item.
                              description: List of hubItems
                            isGlobal:
                              type: string
                              enum:
                              - 'False'
                              - 'True'
                              x-ms-enum:
                                name: IsGlobal
                                modelAsString: true
                              description: Flag if global mesh is supported.
                            connectivityCapabilities:
                              type: object
                              description: Collection of additional settings to enhance
                                specific topology behaviors of the connectivity configuration
                                resource.
                              properties:
                                connectedGroupPrivateEndpointsScale:
                                  type: string
                                  enum:
                                  - Standard
                                  - HighScale
                                  x-ms-enum:
                                    name: ConnectedGroupPrivateEndpointsScale
                                    modelAsString: true
                                    values:
                                    - value: Standard
                                      description: Default. Allows for up to 2K private
                                        endpoints in the connected group.
                                    - value: HighScale
                                      description: Allows for up to 20K private endpoints
                                        in the connected group.
                                  description: Option indicating the scale of private
                                    endpoints allowed in the connected group of the
                                    connectivity configuration.
                                  default: Standard
                                connectedGroupAddressOverlap:
                                  type: string
                                  enum:
                                  - Allowed
                                  - Disallowed
                                  x-ms-enum:
                                    name: ConnectedGroupAddressOverlap
                                    modelAsString: true
                                    values:
                                    - value: Allowed
                                      description: Default. Allows connected group
                                        members to have overlapping IP address space.
                                    - value: Disallowed
                                      description: Strictly disallows connected group
                                        members from having overlapping IP address
                                        space. Prevents the addition of a virtual
                                        network with overlapping address to the connected
                                        group, blocks peering between a virtual network
                                        and a connected group member if any connected
                                        group member has an overlapping range, and
                                        restricts address space modifications that
                                        would introduce overlap.
                                  description: Behavior to handle overlapped IP address
                                    space among members of the connected group of
                                    the connectivity configuration.
                                  default: Allowed
                                peeringEnforcement:
                                  type: string
                                  enum:
                                  - Unenforced
                                  - Enforced
                                  x-ms-enum:
                                    name: PeeringEnforcement
                                    modelAsString: true
                                    values:
                                    - value: Unenforced
                                      description: Default. Peerings created by the
                                        connectivity configuration may be modified
                                        or deleted outside of the network manager.
                                    - value: Enforced
                                      description: Peerings created by the connectivity
                                        configuration will not be modifiable or deletable
                                        outside of the network manager.
                                  description: Option indicating enforcement of peerings
                                    created by the connectivity configuration.
                                  default: Unenforced
                              required:
