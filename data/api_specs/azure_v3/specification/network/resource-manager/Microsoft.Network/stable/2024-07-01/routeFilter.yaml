openapi: 3.0.0
info:
  title: NetworkManagementClient
  description: The Microsoft Azure Network management API provides a RESTful set of
    web services that interact with Microsoft Azure Networks service to manage your
    network resources. The API has entities that capture the relationship between
    an end user and the Microsoft Azure Networks service.
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/routeFilters/{routeFilterName}
  : delete:
      tags:
      - RouteFilters
      operationId: RouteFilters_Delete
      description: Deletes the specified route filter.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: routeFilterName
        in: path
        required: true
        description: The name of the route filter.
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: The subscription credentials which uniquely identify the Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      responses:
        '200':
          description: Delete successful.
        '202':
          description: Accepted and the operation will complete asynchronously.
          headers:
            Location:
              description: 'URL for determining when an operation has completed. Send
                a GET request to the URL in Location header.

                The URI should return a 202 until the operation reaches a terminal
                state and 200 once it reaches a terminal state.


                For more info: https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#202-accepted-and-location-headers'
              schema:
                type: string
            Azure-AsyncOperation:
              description: 'URL for checking the ongoing status of the operation.

                To get the status of the asynchronous operation, send a GET request
                to the URL in Azure-AsyncOperation header value.


                For more info: https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/Addendum.md#asynchronous-operations'
              schema:
                type: string
        '204':
          description: Delete successful.
        default:
          description: Error response describing why the operation failed.
