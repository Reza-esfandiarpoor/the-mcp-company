                              - 'True'
                              x-ms-enum:
                                name: DeleteExistingPeering
                                modelAsString: true
                              description: Flag if need to remove current existing
                                peerings.
                            resourceGuid:
                              type: string
                              readOnly: true
                              description: Unique identifier for this resource.
                          required:
                          - connectivityTopology
                          - appliesToGroups
                        configurationGroups:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Network group ID.
                              properties:
                                x-ms-client-flatten: true
                                description: The network configuration group properties
                                type: object
                                properties:
                                  description:
                                    type: string
                                    description: A description of the network group.
                                  memberType:
                                    description: The type of the group member.
                                    type: string
                                    enum:
                                    - VirtualNetwork
                                    - Subnet
                                    x-ms-enum:
                                      name: GroupMemberType
                                      modelAsString: true
                                  provisioningState:
                                    readOnly: true
                                    description: The provisioning state of the scope
                                      assignment resource.
                                    type: string
                                    enum:
                                    - Succeeded
                                    - Updating
                                    - Deleting
                                    - Failed
                                    x-ms-enum:
                                      name: ProvisioningState
                                      modelAsString: true
                                  resourceGuid:
                                    type: string
                                    readOnly: true
                                    description: Unique identifier for this resource.
                            description: The network configuration group resource
                          description: Effective configuration groups.
                      description: The network manager effective connectivity configuration
                    description: Gets a page of NetworkManagerEffectiveConnectivityConfiguration
                  skipToken:
                    description: When present, the value can be passed to a subsequent
                      query call (together with the same query and scopes used in
                      the current request) to retrieve the next page of data.
                    type: string
                description: Result of the request to list networkManagerEffectiveConnectivityConfiguration.
