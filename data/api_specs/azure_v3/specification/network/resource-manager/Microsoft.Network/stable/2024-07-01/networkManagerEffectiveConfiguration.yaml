openapi: 3.0.0
info:
  title: NetworkManagerEffectiveConfiguration
  description: The Microsoft Azure Network Manager effective configuration API provides
    a RESTful set of web services that interact with Microsoft Azure Networks service
    to manage your network resources. The API has entities that capture the relationship
    between an end user and the Microsoft Azure Networks service.
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
