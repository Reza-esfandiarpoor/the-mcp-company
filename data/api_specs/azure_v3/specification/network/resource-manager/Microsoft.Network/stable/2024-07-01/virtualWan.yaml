servers:
- url: https://management.azure.com
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client API version.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The subscription credentials which uniquely identify the Microsoft
        Azure subscription. The subscription ID forms part of the URI for every service
        call.
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    VirtualWanProperties:
      properties:
        disableVpnEncryption:
          type: boolean
          description: Vpn encryption to be disabled or not.
        virtualHubs:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/SubResource'
          description: List of VirtualHubs in the VirtualWAN.
        vpnSites:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/SubResource'
          description: List of VpnSites in the VirtualWAN.
        allowBranchToBranchTraffic:
          type: boolean
          description: True if branch to branch traffic is allowed.
        allowVnetToVnetTraffic:
          type: boolean
          description: True if Vnet to Vnet traffic is allowed.
        office365LocalBreakoutCategory:
          $ref: '#/components/schemas/OfficeTrafficCategory'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        type:
          type: string
          description: The type of the VirtualWAN.
      description: Parameters for VirtualWAN.
    VirtualWAN:
      $ref: '#/components/schemas/Resource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/VirtualWanProperties'
        etag:
          type: string
          readOnly: true
          description: A unique read-only string that changes whenever the resource
            is updated.
      required:
      - location
      description: VirtualWAN Resource.
    ListVirtualWANsResult:
      description: Result of the request to list VirtualWANs. It contains a list of
        VirtualWANs and a URL nextLink to get the next set of results.
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/VirtualWAN'
          description: List of VirtualWANs.
        nextLink:
          type: string
          description: URL to get the next set of operation list results if there
            are any.
    VpnSiteProperties:
      properties:
        virtualWan:
          $ref: '#/components/schemas/SubResource'
        deviceProperties:
          $ref: '#/components/schemas/DeviceProperties'
        ipAddress:
          type: string
          description: The ip-address for the vpn-site.
        siteKey:
          type: string
          description: The key for vpn-site that can be used for connections.
        addressSpace:
          $ref: '#/components/schemas/AddressSpace'
        bgpProperties:
          $ref: '#/components/schemas/BgpSettings'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        isSecuritySite:
          type: boolean
          description: IsSecuritySite flag.
        vpnSiteLinks:
          type: array
          description: List of all vpn site links.
          items:
            $ref: '#/components/schemas/VpnSiteLink'
        o365Policy:
          $ref: '#/components/schemas/O365PolicyProperties'
      description: Parameters for VpnSite.
    VpnSite:
      $ref: '#/components/schemas/Resource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/VpnSiteProperties'
        etag:
          type: string
          readOnly: true
          description: A unique read-only string that changes whenever the resource
            is updated.
      required:
      - location
      description: VpnSite Resource.
    ListVpnSitesResult:
