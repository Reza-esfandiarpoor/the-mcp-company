          description: The ip-address for the vpn-site-link.
        fqdn:
          type: string
          description: FQDN of vpn-site-link.
        bgpProperties:
          $ref: '#/components/schemas/VpnLinkBgpSettings'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
      description: Parameters for VpnSite.
    VpnSiteLink:
      $ref: '#/components/schemas/SubResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/VpnSiteLinkProperties'
        etag:
          type: string
          readOnly: true
          description: A unique read-only string that changes whenever the resource
            is updated.
        name:
          type: string
          description: The name of the resource that is unique within a resource group.
