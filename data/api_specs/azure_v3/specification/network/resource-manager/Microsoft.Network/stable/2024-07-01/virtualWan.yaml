            or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualWAN'
        '201':
          description: Create successful. The operation returns the resulting VirtualWAN
            resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualWAN'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
