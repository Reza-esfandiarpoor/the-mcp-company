      - name: VirtualWANName
        in: path
        required: true
        description: The name of the VirtualWAN being deleted.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. VirtualWAN deleted.
        '202':
          description: Request received successfully. VirtualWAN deletion is in progress;
