      required:
      - outputBlobSasUrl
      description: List of Vpn-Sites.
    VirtualHubProperties:
      properties:
        virtualWan:
          $ref: '#/components/schemas/SubResource'
        vpnGateway:
          $ref: '#/components/schemas/SubResource'
        p2SVpnGateway:
          $ref: '#/components/schemas/SubResource'
        expressRouteGateway:
          $ref: '#/components/schemas/SubResource'
        azureFirewall:
          $ref: '#/components/schemas/SubResource'
        securityPartnerProvider:
          $ref: '#/components/schemas/SubResource'
        addressPrefix:
          type: string
          description: Address-prefix for this VirtualHub.
        routeTable:
          $ref: '#/components/schemas/VirtualHubRouteTable'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
        securityProviderName:
          type: string
          description: The Security Provider name.
        virtualHubRouteTableV2s:
          type: array
          description: List of all virtual hub route table v2s associated with this
            VirtualHub.
          items:
            $ref: '#/components/schemas/VirtualHubRouteTableV2'
        sku:
          type: string
          description: The sku of this VirtualHub.
        routingState:
          $ref: '#/components/schemas/RoutingState'
        bgpConnections:
          type: array
          readOnly: true
          description: List of references to Bgp Connections.
          items:
            $ref: '#/components/schemas/SubResource'
        ipConfigurations:
          type: array
          readOnly: true
          description: List of references to IpConfigurations.
          items:
            $ref: '#/components/schemas/SubResource'
        routeMaps:
