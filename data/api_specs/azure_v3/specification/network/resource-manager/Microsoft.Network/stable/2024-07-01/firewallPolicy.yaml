                          identity.
                      tenantId:
                        readOnly: true
                        type: string
                        description: The tenant id of the system assigned identity.
                          This property will only be provided for a system assigned
                          identity.
                      type:
                        type: string
                        description: The type of identity used for the resource. The
                          type 'SystemAssigned, UserAssigned' includes both an implicitly
                          created identity and a set of user assigned identities.
                          The type 'None' will remove any identities from the virtual
                          machine.
                        enum:
                        - SystemAssigned
                        - UserAssigned
                        - SystemAssigned, UserAssigned
                        - None
                        x-ms-enum:
                          name: ResourceIdentityType
                          modelAsString: false
                      userAssignedIdentities:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            principalId:
                              readOnly: true
                              type: string
                              description: The principal id of user assigned identity.
                            clientId:
                              readOnly: true
                              type: string
                              description: The client id of user assigned identity.
                        description: 'The list of user identities associated with
                          resource. The user identity dictionary key references will
                          be ARM resource ids in the form: ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}''.'
                description: Common resource representation.
                x-ms-azure-resource: true
