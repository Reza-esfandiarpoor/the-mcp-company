                            items:
                              type: string
                          fqdns:
                            type: array
                            description: List of FQDNs for the ThreatIntel Whitelist.
                            items:
                              type: string
                      insights:
                        description: Insights on Firewall Policy.
                        type: object
                        properties:
                          isEnabled:
                            type: boolean
                            description: A flag to indicate if the insights are enabled
                              on the policy.
                          retentionDays:
                            type: integer
                            format: int32
                            description: Number of days the insights should be enabled
                              on the policy.
                          logAnalyticsResources:
                            description: Workspaces needed to configure the Firewall
