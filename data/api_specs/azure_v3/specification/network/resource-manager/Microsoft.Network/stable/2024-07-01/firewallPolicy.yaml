                            - Disabled
                            x-ms-enum:
                              name: AutoLearnPrivateRangesMode
                              modelAsString: true
                      sql:
                        description: SQL Settings definition.
                        type: object
                        properties:
                          allowSqlRedirect:
                            type: boolean
                            description: A flag to indicate if SQL Redirect traffic
                              filtering is enabled. Turning on the flag requires no
                              rule using port 11000-11999.
                      dnsSettings:
                        description: DNS Proxy Settings definition.
                        type: object
                        properties:
                          servers:
                            type: array
                            description: List of Custom DNS Servers.
                            items:
                              type: string
                          enableProxy:
                            type: boolean
                            description: Enable DNS Proxy on Firewalls attached to
                              the Firewall Policy.
                          requireProxyForNetworkRules:
                            type: boolean
                            description: FQDNs in Network Rules are supported when
                              set to true.
                            nullable: true
                      explicitProxy:
                        description: Explicit Proxy Settings definition.
                        type: object
                        properties:
                          enableExplicitProxy:
                            type: boolean
                            description: When set to true, explicit proxy mode is
                              enabled.
                            nullable: true
                          httpPort:
                            type: integer
                            format: int32
                            maximum: 64000
                            exclusiveMaximum: false
                            minimum: 0
                            exclusiveMinimum: false
                            description: Port number for explicit proxy http protocol,
                              cannot be greater than 64000.
                          httpsPort:
                            type: integer
                            format: int32
                            maximum: 64000
                            exclusiveMaximum: false
                            minimum: 0
                            exclusiveMinimum: false
                            description: Port number for explicit proxy https protocol,
                              cannot be greater than 64000.
                          enablePacFile:
                            type: boolean
                            description: When set to true, pac file port and url needs
                              to be provided.
                            nullable: true
                          pacFilePort:
                            type: integer
                            format: int32
                            maximum: 64000
                            exclusiveMaximum: false
                            minimum: 0
                            exclusiveMinimum: false
                            description: Port number for firewall to serve PAC file.
                          pacFile:
                            type: string
                            description: SAS URL for PAC file.
                      intrusionDetection:
                        description: The configuration for Intrusion detection.
                        type: object
                        properties:
                          mode:
                            description: Intrusion detection general state. When attached
                              to a parent policy, the firewall's effective IDPS mode
                              is the stricter mode of the two.
                            type: string
                            enum:
                            - 'Off'
                            - Alert
                            - Deny
                            x-ms-enum:
                              name: FirewallPolicyIntrusionDetectionStateType
                              modelAsString: true
                          profile:
                            description: IDPS profile name. When attached to a parent
                              policy, the firewall's effective profile is the profile
                              name of the parent policy.
                            type: string
                            enum:
                            - Basic
                            - Standard
                            - Advanced
                            - Extended
                            x-ms-enum:
                              name: FirewallPolicyIntrusionDetectionProfileType
                              modelAsString: true
                          configuration:
                            description: Intrusion detection configuration properties.
                            type: object
                            properties:
