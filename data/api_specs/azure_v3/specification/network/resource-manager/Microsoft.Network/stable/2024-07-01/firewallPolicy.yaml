                                type: array
                                description: List of specific signatures states.
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Signature id.
                                    mode:
                                      description: The signature state.
                                      type: string
                                      enum:
                                      - 'Off'
                                      - Alert
                                      - Deny
                                      x-ms-enum:
                                        name: FirewallPolicyIntrusionDetectionStateType
                                        modelAsString: true
                                  description: Intrusion detection signatures specification
                                    states.
                              bypassTrafficSettings:
                                type: array
                                description: List of rules for traffic to bypass.
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: Name of the bypass traffic rule.
                                    description:
                                      type: string
                                      description: Description of the bypass traffic
                                        rule.
                                    protocol:
                                      type: string
                                      description: The rule bypass protocol.
                                      enum:
                                      - TCP
                                      - UDP
                                      - ICMP
                                      - ANY
                                      x-ms-enum:
                                        name: FirewallPolicyIntrusionDetectionProtocol
                                        modelAsString: true
                                    sourceAddresses:
                                      type: array
                                      description: List of source IP addresses or
                                        ranges for this rule.
                                      items:
                                        type: string
                                    destinationAddresses:
                                      type: array
                                      description: List of destination IP addresses
                                        or ranges for this rule.
                                      items:
                                        type: string
                                    destinationPorts:
                                      type: array
                                      description: List of destination ports or ranges.
                                      items:
                                        type: string
                                    sourceIpGroups:
                                      type: array
                                      description: List of source IpGroups for this
                                        rule.
                                      items:
                                        type: string
                                    destinationIpGroups:
                                      type: array
                                      description: List of destination IpGroups for
                                        this rule.
                                      items:
                                        type: string
                                  description: Intrusion detection bypass traffic
                                    specification.
                                x-ms-identifiers: []
                              privateRanges:
                                type: array
                                description: IDPS Private IP address ranges are used
                                  to identify traffic direction (i.e. inbound, outbound,
                                  etc.). By default, only ranges defined by IANA RFC
                                  1918 are considered private IP addresses. To modify
                                  default ranges, specify your Private IP address
                                  ranges with this property
                                items:
                                  type: string
                                x-ms-identifiers: []
                      transportSecurity:
                        description: TLS Configuration definition.
                        type: object
                        properties:
                          certificateAuthority:
