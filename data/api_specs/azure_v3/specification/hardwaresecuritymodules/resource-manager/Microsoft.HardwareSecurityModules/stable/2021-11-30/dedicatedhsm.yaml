openapi: 3.0.0
info:
  title: Azure Dedicated HSM Resource Provider
  description: The Azure management API provides a RESTful set of web services that
    interact with Azure Dedicated HSM RP.
  version: 2021-11-30
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.HardwareSecurityModules/operations:
    get:
      tags:
      - DedicatedHsmOperations
      operationId: Operations_List
      description: Get a list of Dedicated HSM operations.
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Result of the request to list Dedicated HSM Provider
                  operations. It contains a list of operations.
                properties:
                  value:
                    type: array
                    items:
                      description: REST API operation
                      type: object
                      properties:
                        name:
                          description: The name of the Dedicated HSM Resource Provider
                            Operation.
                          type: string
                        isDataAction:
                          description: Gets or sets a value indicating whether it
                            is a data plane action
                          type: boolean
                          readOnly: true
                        origin:
                          description: The origin of the operation
                          type: string
                        display:
                          properties:
                            provider:
                              description: The Resource Provider of the operation
                              type: string
                            resource:
                              description: Resource on which the operation is performed.
                              type: string
                            operation:
                              description: 'Operation type: Read, write, delete, etc.'
                              type: string
                            description:
                              description: The object that represents the operation.
                              type: string
                          description: The display string.
                          type: object
                    x-ms-identifiers:
                    - name
                    description: List of Dedicated HSM Resource Provider operations.
        default:
          description: The error response describing why the operation failed.
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: The error detail of the operation if any.
                    readOnly: true
                    properties:
                      code:
                        type: string
                        readOnly: true
                        description: The error code.
                      message:
                        type: string
                        readOnly: true
                        description: The error message.
                      innererror:
                        description: Contains more specific error that narrows down
                          the cause. May be null.
                        x-ms-client-name: innerError
                        readOnly: true
                        properties:
                          code:
                            type: string
                            readOnly: true
                            description: The error code.
                          message:
                            type: string
                            readOnly: true
                            description: The error message.
                          innererror:
                            description: Contains more specific error that narrows
                              down the cause. May be null.
                            x-ms-client-name: innerError
                            readOnly: true
                            properties:
                              code:
                                type: string
                                readOnly: true
                                description: The error code.
                              message:
                                type: string
                                readOnly: true
                                description: The error message.
                            type: object
                        type: object
                    type: object
                description: The error exception.
                type: object
      x-ms-pageable: {}
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.HardwareSecurityModules/dedicatedHSMs/{name}
  : put:
      tags:
      - DedicatedHsms
      operationId: DedicatedHsm_CreateOrUpdate
      x-ms-long-running-operation: true
      description: Create or Update a dedicated HSM in the specified subscription.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the Resource Group to which the resource belongs.
        schema:
          type: string
      - name: name
        in: path
        required: true
        description: Name of the dedicated Hsm
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{3,24}$
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
