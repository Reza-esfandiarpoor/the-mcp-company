                          description: The dedicated HSM is a Safenet Luna Network
                            HSM A790 device.
                        - value: payShield10K_LMK1_CPS60
                          description: The dedicated HSM is a payShield 10K, model
                            PS10-D, 10Gb Ethernet Hardware Platform device with 1
                            local master key which supports up to 60 calls per second.
                        - value: payShield10K_LMK1_CPS250
                          description: The dedicated HSM is a payShield 10K, model
                            PS10-D, 10Gb Ethernet Hardware Platform device with 1
                            local master key which supports up to 250 calls per second.
