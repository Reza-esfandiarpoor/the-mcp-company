                properties:
                  x-ms-client-flatten: true
                  description: Properties of the dedicated HSM
                  properties:
                    networkProfile:
                      description: Specifies the network interfaces of the dedicated
                        hsm.
                      properties:
                        subnet:
                          description: Specifies the identifier of the subnet.
                          properties:
                            id:
                              type: string
                              description: The ARM resource id in the form of /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/...
                          type: object
                        networkInterfaces:
                          type: array
                          items:
                            properties:
                              id:
                                readOnly: true
                                type: string
                                description: The ARM resource id in the form of /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/...
                              privateIpAddress:
                                type: string
                                description: Private Ip address of the interface
                            description: The network interface definition.
                            type: object
                          description: Specifies the list of resource Ids for the
                            network interfaces associated with the dedicated HSM.
                      type: object
                    managementNetworkProfile:
                      description: Specifies the management network interfaces of
