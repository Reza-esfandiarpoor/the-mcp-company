      operationId: PolicySetDefinitions_Delete
      summary: Deletes a policy set definition.
      description: This operation deletes the policy set definition in the given subscription
        with the given name.
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: policySetDefinitionName
        in: path
        required: true
        description: The name of the policy set definition to delete.
        schema:
          type: string
          pattern: ^[^<>*%&:\?.+/]*[^<>*%&:\?.+/ ]+$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
        '204':
