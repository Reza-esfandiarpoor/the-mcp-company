        description: 'The filter to apply on the operation. Valid values for $filter
          are: ''atExactScope()'', ''policyType -eq {value}'' or ''category eq ''{value}''''.
          If $filter is not provided, no filtering is performed. If $filter=atExactScope()
          is provided, the returned list only includes all policy set definitions
          that at the given scope. If $filter=''policyType -eq {value}'' is provided,
          the returned list only includes all policy set definitions whose type match
          the {value}. Possible policyType values are NotSpecified, BuiltIn, Custom,
          and Static. If $filter=''category -eq {value}'' is provided, the returned
          list only includes all policy set definitions whose category match the {value}.'
