  ? /providers/Microsoft.Management/managementGroups/{managementGroupId}/providers/Microsoft.Authorization/policySetDefinitions
  : get:
      tags:
      - PolicySetDefinitions
      operationId: PolicySetDefinitions_ListByManagementGroup
      summary: Retrieves all policy set definitions in management group.
      description: 'This operation retrieves a list of all the policy set definitions
        in a given management group that match the optional given $filter. Valid values
        for $filter are: ''atExactScope()'', ''policyType -eq {value}'' or ''category
        eq ''{value}''''. If $filter is not provided, the unfiltered list includes
        all policy set definitions associated with the management group, including
        those that apply directly or from management groups that contain the given
        management group. If $filter=atExactScope() is provided, the returned list
        only includes all policy set definitions that at the given management group.
        If $filter=''policyType -eq {value}'' is provided, the returned list only
        includes all policy set definitions whose type match the {value}. Possible
        policyType values are NotSpecified, BuiltIn and Custom. If $filter=''category
        -eq {value}'' is provided, the returned list only includes all policy set
        definitions whose category match the {value}.'
      parameters:
      - name: managementGroupId
        in: path
        required: true
        description: The ID of the management group.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: $filter
        in: query
        required: false
        description: 'The filter to apply on the operation. Valid values for $filter
          are: ''atExactScope()'', ''policyType -eq {value}'' or ''category eq ''{value}''''.
          If $filter is not provided, no filtering is performed. If $filter=atExactScope()
          is provided, the returned list only includes all policy set definitions
          that at the given scope. If $filter=''policyType -eq {value}'' is provided,
          the returned list only includes all policy set definitions whose type match
          the {value}. Possible policyType values are NotSpecified, BuiltIn, Custom,
          and Static. If $filter=''category -eq {value}'' is provided, the returned
          list only includes all policy set definitions whose category match the {value}.'
        x-ms-parameter-location: method
        schema:
          type: string
        allowReserved: true
