        are: ''atScope()'', ''atExactScope()'' or ''policyDefinitionId eq ''{value}''''.
        If $filter is not provided, no filtering is performed. If $filter=atScope()
        is provided, the returned list only includes all policy assignments that apply
        to the scope, which is everything in the unfiltered list except those applied
        to sub scopes contained within the given scope. If $filter=atExactScope()
        is provided, the returned list only includes all policy assignments that at
        the given scope. If $filter=policyDefinitionId eq ''{value}'' is provided,
        the returned list includes all policy assignments of the policy definition
        whose id is {value}.'
