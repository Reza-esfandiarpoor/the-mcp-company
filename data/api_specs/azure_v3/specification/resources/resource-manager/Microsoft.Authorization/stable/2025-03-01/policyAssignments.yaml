                                      - value: resourceType
                                        description: The selector kind to filter policies
                                          by the resource type.
                                      - value: resourceWithoutLocation
                                        description: The selector kind to filter policies
                                          by the resource without location.
                                      - value: policyDefinitionReferenceId
                                        description: The selector kind to filter policies
