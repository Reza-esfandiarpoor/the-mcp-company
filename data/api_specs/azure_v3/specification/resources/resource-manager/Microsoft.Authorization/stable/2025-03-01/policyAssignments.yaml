                                  in:
                                    type: array
                                    items:
                                      type: string
                                    description: The list of values to filter in.
                                  notIn:
                                    type: array
                                    items:
                                      type: string
                                    description: The list of values to filter out.
                              x-ms-identifiers: []
                              description: The list of the selector expressions.
                        x-ms-identifiers: []
                        description: The resource selector list to filter policies
                          by resource properties.
                      overrides:
                        type: array
                        items:
