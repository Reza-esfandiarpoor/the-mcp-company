  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Authorization/policyAssignments:
    get:
      tags:
      - PolicyAssignments
      operationId: PolicyAssignments_ListForResourceGroup
      summary: Retrieves all policy assignments that apply to a resource group.
      description: 'This operation retrieves the list of all policy assignments associated
        with the given resource group in the given subscription that match the optional
        given $filter. Valid values for $filter are: ''atScope()'', ''atExactScope()''
        or ''policyDefinitionId eq ''{value}''''. If $filter is not provided, the
        unfiltered list includes all policy assignments associated with the resource
        group, including those that apply directly or apply from containing scopes,
        as well as any applied to resources contained within the resource group. If
        $filter=atScope() is provided, the returned list includes all policy assignments
        that apply to the resource group, which is everything in the unfiltered list
        except those applied to resources contained within the resource group. If
        $filter=atExactScope() is provided, the returned list only includes all policy
        assignments that at the resource group. If $filter=policyDefinitionId eq ''{value}''
        is provided, the returned list includes all policy assignments of the policy
        definition whose id is {value} that apply to the resource group.'
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group that contains policy assignments.
        schema:
          type: string
          minLength: 1
          maxLength: 90
          pattern: ^[-\w\._\(\)]+$
      - name: $filter
        in: query
        required: false
        description: 'The filter to apply on the operation. Valid values for $filter
          are: ''atScope()'', ''atExactScope()'' or ''policyDefinitionId eq ''{value}''''.
          If $filter is not provided, no filtering is performed. If $filter=atScope()
          is provided, the returned list only includes all policy assignments that
          apply to the scope, which is everything in the unfiltered list except those
          applied to sub scopes contained within the given scope. If $filter=atExactScope()
          is provided, the returned list only includes all policy assignments that
          at the given scope. If $filter=policyDefinitionId eq ''{value}'' is provided,
          the returned list includes all policy assignments of the policy definition
          whose id is {value}.'
        x-ms-parameter-location: method
        schema:
          type: string
        allowReserved: true
      - name: $expand
        in: query
        required: false
        description: Comma-separated list of additional properties to be included
          in the response. Supported values are 'LatestDefinitionVersion, EffectiveDefinitionVersion'.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: $top
        in: query
        required: false
        description: Maximum number of records to return. When the $top filter is
          not provided, it will return 500 records.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK - Returns an array of policy assignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        properties:
                          x-ms-client-flatten: true
                          description: Properties for the policy assignment.
                          type: object
                          properties:
                            displayName:
                              type: string
                              description: The display name of the policy assignment.
                            policyDefinitionId:
                              type: string
                              description: The ID of the policy definition or policy
                                set definition being assigned.
                            definitionVersion:
                              type: string
                              description: The version of the policy definition to
                                use.
                            latestDefinitionVersion:
                              type: string
                              description: The latest version of the policy definition
                                available. This is only present if requested via the
                                $expand query parameter.
                              readOnly: true
                            effectiveDefinitionVersion:
                              type: string
                              description: The effective version of the policy definition
                                in use. This is only present if requested via the
                                $expand query parameter.
                              readOnly: true
                            scope:
