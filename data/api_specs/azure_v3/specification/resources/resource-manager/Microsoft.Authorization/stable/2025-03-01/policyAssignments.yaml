                                    description: The list of values to filter out.
                              x-ms-identifiers: []
                              description: The list of the selector expressions.
                        x-ms-identifiers: []
                        description: The policy property value override.
                      assignmentType:
                        type: string
                        description: The type of policy assignment. Possible values
                          are NotSpecified, System, SystemHidden, and Custom. Immutable.
                        enum:
                        - NotSpecified
                        - System
                        - SystemHidden
