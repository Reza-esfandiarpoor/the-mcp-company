                        - Default
                        - DoNotEnforce
                        - Enroll
                        x-ms-enum:
                          name: enforcementMode
                          modelAsString: true
                          values:
                          - value: Default
                            description: The policy effect is enforced during resource
                              creation or update.
                          - value: DoNotEnforce
                            description: The policy effect is not enforced during
                              resource creation or update.
                          - value: Enroll
                            description: The policy effect is not enforced during
                              resource creation or update until the resource or scope
                              of the resource is enrolled to the assignment instance.
                              Enrollment occurs upon deployment of the policy enrollment
                              resource.
