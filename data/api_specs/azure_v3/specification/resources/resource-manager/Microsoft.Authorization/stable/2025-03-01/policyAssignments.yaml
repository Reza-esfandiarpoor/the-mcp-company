                          type: object
                          properties:
                            kind:
                              type: string
                              description: The override kind.
                              enum:
                              - policyEffect
                              - definitionVersion
                              x-ms-enum:
                                name: OverrideKind
                                modelAsString: true
                                values:
                                - value: policyEffect
                                  description: It will override the policy effect
                                    type.
                                - value: definitionVersion
                                  description: It will override the definition version
                                    property value of the policy assignment.
                            value:
                              type: string
                              description: The value to override the policy property.
                            selectors:
                              type: array
                              items:
                                description: The selector expression.
                                type: object
                                properties:
                                  kind:
                                    type: string
                                    description: The selector kind.
                                    enum:
                                    - resourceLocation
                                    - resourceType
                                    - resourceWithoutLocation
                                    - policyDefinitionReferenceId
                                    x-ms-enum:
