                        type: string
                        description: The version of the policy definition to use.
                      latestDefinitionVersion:
                        type: string
                        description: The latest version of the policy definition available.
                          This is only present if requested via the $expand query
                          parameter.
                        readOnly: true
                      effectiveDefinitionVersion:
                        type: string
                        description: The effective version of the policy definition
                          in use. This is only present if requested via the $expand
                          query parameter.
                        readOnly: true
                      scope:
                        type: string
                        description: The scope for the policy assignment.
                        readOnly: true
                      notScopes:
                        type: array
                        items:
                          type: string
                        description: The policy's excluded scopes.
                      parameters:
                        description: The parameter values for the assigned policy
                          rule. The keys are the parameter names.
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value:
