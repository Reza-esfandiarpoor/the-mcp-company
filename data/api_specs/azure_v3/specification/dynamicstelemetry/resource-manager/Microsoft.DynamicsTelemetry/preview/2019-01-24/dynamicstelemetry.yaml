openapi: 3.0.0
info:
  title: Dynamics Telemetry
  version: 2019-01-24
servers:
- url: https://management.azure.com
paths:
  /providers/Microsoft.DynamicsTelemetry/operations:
    get:
      tags:
      - Operations
      operationId: Operations_List
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: List of supported operations.
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - isDataAction
                  properties:
                    origin:
                      type: string
                    name:
                      type: string
                    display:
                      type: object
                      additionalProperties: false
                      properties:
                        provider:
                          type: string
                        resource:
                          type: string
                        operation:
                          type: string
                        description:
                          type: string
                        publisher:
                          type: string
                    properties:
                      type: object
                      additionalProperties: false
                      properties:
                        serviceSpecification:
                          type: object
                          additionalProperties: false
                          properties:
                            logSpecifications:
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  name:
                                    type: string
                                  displayName:
                                    type: string
                                  blobDuration:
                                    type: string
                                    format: duration
                    isDataAction:
                      type: boolean
        '204':
          description: No Content
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    OperationList:
      type: array
      description: List of supported operations.
      items:
        type: object
        additionalProperties: false
        required:
        - isDataAction
        properties:
          origin:
            type: string
          name:
            type: string
          display:
            type: object
            additionalProperties: false
            properties:
              provider:
                type: string
              resource:
                type: string
              operation:
                type: string
              description:
                type: string
              publisher:
                type: string
          properties:
            type: object
            additionalProperties: false
            properties:
              serviceSpecification:
                type: object
                additionalProperties: false
                properties:
                  logSpecifications:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string
                        blobDuration:
                          type: string
                          format: duration
          isDataAction:
            type: boolean
    Operation:
      type: object
      additionalProperties: false
      required:
      - isDataAction
      properties:
        origin:
          type: string
        name:
          type: string
        display:
          type: object
          additionalProperties: false
          properties:
            provider:
              type: string
            resource:
              type: string
            operation:
              type: string
            description:
              type: string
            publisher:
              type: string
        properties:
          type: object
          additionalProperties: false
          properties:
            serviceSpecification:
              type: object
              additionalProperties: false
              properties:
                logSpecifications:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                      displayName:
                        type: string
                      blobDuration:
                        type: string
                        format: duration
        isDataAction:
          type: boolean
    Display:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
        resource:
          type: string
        operation:
          type: string
        description:
          type: string
        publisher:
          type: string
    Properties:
      type: object
      additionalProperties: false
      properties:
        serviceSpecification:
          type: object
          additionalProperties: false
          properties:
            logSpecifications:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  name:
                    type: string
                  displayName:
                    type: string
                  blobDuration:
                    type: string
                    format: duration
    ServiceSpecification:
      type: object
      additionalProperties: false
      properties:
        logSpecifications:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              displayName:
                type: string
              blobDuration:
                type: string
                format: duration
    LogSpecification:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        displayName:
          type: string
        blobDuration:
          type: string
          format: duration
