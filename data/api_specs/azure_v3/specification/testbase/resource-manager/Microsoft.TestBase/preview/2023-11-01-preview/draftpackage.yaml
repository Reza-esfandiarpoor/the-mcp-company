openapi: 3.0.0
info:
  title: Test Base
  description: Use these REST APIs for performing operations on Test Base Draft Packages,
    which are used to facilitate the creation and update of Test Base Package.
  version: 2023-11-01-preview
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.TestBase/testBaseAccounts/{testBaseAccountName}/draftPackages
  : get:
      tags:
      - Test Base Draft Package
      operationId: DraftPackages_ListByTestBaseAccount
      description: Lists all the draft packages under a test base account.
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: testBaseAccountName
        in: path
        required: true
        x-ms-parameter-location: method
        description: The resource name of the Test Base Account.
        schema:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9_]|([-. ][A-Za-z0-9]))+$
      - name: packageName
        in: query
        x-ms-parameter-location: method
        description: Parameter used to filter draft packages by linked Test Base Package.
        schema:
          type: string
      - name: editPackage
        in: query
        required: false
        x-ms-parameter-location: method
        description: Parameter used to filter draft packages by editPackage property.
        schema:
          type: boolean
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
