                                  description: The datetime of when the error occured
                                  type: string
                                  format: date-time
                                code:
                                  description: The code that corresponds to the type
                                    of operation failure
                                  type: string
                                message:
                                  description: The operation failure message
                                  type: string
                                action:
                                  description: The operation action that failed
                                  type: string
                            connectionProfile:
                              description: Profile for information about connecting
                                to the virtual machine.
                              readOnly: true
                              type: object
                              properties:
                                privateIpAddress:
                                  description: The private IP address of the virtual
                                    machine.
                                  type: string
                                  readOnly: true
                                sshAuthority:
                                  description: Port and host name separated by semicolon
                                    for connecting via SSH protocol to the virtual
                                    machine.
                                  type: string
                                  readOnly: true
                                sshInBrowserUrl:
                                  description: URL for connecting via SSH protocol
                                    to the virtual machine in browser.
                                  readOnly: true
                                  type: string
                                  minLength: 3
                                  maxLength: 2000
                                rdpAuthority:
                                  description: Port and host name separated by semicolon
                                    for connecting via RDP protocol to the virtual
                                    machine.
                                  type: string
                                  readOnly: true
                                rdpInBrowserUrl:
                                  description: URL for connecting via RDP protocol
                                    to the virtual machine in browser.
                                  readOnly: true
                                  type: string
                                  minLength: 3
                                  maxLength: 2000
                                adminUsername:
                                  description: The username used to log on to the
                                    virtual machine as admin.
                                  type: string
                                  readOnly: true
                                nonAdminUsername:
                                  description: The username used to log on to the
                                    virtual machine as non-admin, if one exists.
                                  type: string
                                  readOnly: true
                            claimedByUserId:
                              description: The lab user ID (not the PUID!) of who
                                claimed the virtual machine.
                              type: string
                              readOnly: true
                            vmType:
                              description: The type of this VM resource
