                                  - Daily
                                  - Weekly
                                  x-ms-enum:
                                    name: RecurrenceFrequency
                                    modelAsString: false
                                    values:
                                    - value: Daily
                                      description: Schedule will run every days.
                                    - value: Weekly
                                      description: Schedule will run every week on
                                        days specified in weekDays.
                                weekDays:
                                  description: The week days the schedule runs. Used
                                    for when the Frequency is set to Weekly.
                                  type: array
                                  items:
                                    maxItems: 7
                                    type: string
                                    enum:
                                    - Sunday
                                    - Monday
                                    - Tuesday
                                    - Wednesday
                                    - Thursday
                                    - Friday
                                    - Saturday
                                    description: Days of the week.
                                    x-ms-enum:
                                      name: WeekDay
                                      modelAsString: false
                                      values:
                                      - value: Sunday
                                        description: Schedule will run on Sunday
                                      - value: Monday
                                        description: Schedule will run on Monday
                                      - value: Tuesday
                                        description: Schedule will run on Tuesday
                                      - value: Wednesday
                                        description: Schedule will run on Wednesday
                                      - value: Thursday
                                        description: Schedule will run on Thursday
                                      - value: Friday
                                        description: Schedule will run on Friday
                                      - value: Saturday
                                        description: Schedule will run on Saturday
                                interval:
