                                    on. For example, interval = 2 and RecurrenceFrequency.Daily
                                    will run every 2 days. When no interval is supplied,
                                    an interval of 1 is used.
                                  type: integer
                                  format: int32
                                  minimum: 1
                                  maximum: 365
                                expirationDate:
                                  description: When the recurrence will expire. This
