                                  - read
                                  - create
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: The name of the SKU. Ex - P3. It
                                        is typically a letter+number code
                                    tier:
                                      type: string
                                      enum:
                                      - Free
                                      - Basic
                                      - Standard
                                      - Premium
                                      x-ms-enum:
                                        name: SkuTier
                                        modelAsString: false
                                      description: This field is required to be implemented
                                        by the Resource Provider if the service has
                                        more than one tier, but is not required on
                                        a PUT.
                                    size:
                                      type: string
                                      description: 'The SKU size. When the name field
                                        is the combination of tier and some other
                                        value, this would be the standalone code. '
                                    family:
                                      type: string
                                      description: If the service has different generations
                                        of hardware, for the same SKU, then that can
                                        be captured here.
                                    capacity:
                                      type: integer
                                      format: int32
                                      description: If the SKU supports scale out/in
                                        then the capacity integer should be included.
