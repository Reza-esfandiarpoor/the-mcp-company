                                    after a user disconnects if this behavior is enabled.
                                  type: string
                                  format: duration
                                noConnectDelay:
                                  description: The amount of time a VM will stay running
                                    before it is shutdown if no connection is made
                                    and this behavior is enabled.
                                  type: string
                                  format: duration
                                idleDelay:
                                  description: The amount of time a VM will idle before
                                    it is shutdown if this behavior is enabled.
                                  type: string
                                  format: duration
