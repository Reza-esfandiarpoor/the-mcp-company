                                  type: string
                                  enum:
                                  - Enabled
                                  - Disabled
                                  x-ms-enum:
                                    name: EnableState
                                    modelAsString: false
                                shutdownWhenNotConnected:
                                  description: Whether a VM will get shutdown when
                                    it hasn't been connected to after a period of
                                    time.
                                  default: Disabled
                                  type: string
                                  enum:
                                  - Enabled
                                  - Disabled
                                  x-ms-enum:
                                    name: EnableState
                                    modelAsString: false
                                shutdownOnIdle:
                                  description: Whether a VM will get shutdown when
                                    it has idled for a period of time.
                                  default: None
                                  type: string
                                  enum:
                                  - None
                                  - UserAbsence
                                  - LowUsage
