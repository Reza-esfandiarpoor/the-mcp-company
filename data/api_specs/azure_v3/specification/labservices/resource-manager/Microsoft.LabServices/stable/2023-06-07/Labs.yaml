                                      type: string
                                      minLength: 3
                                      maxLength: 2000
                                    offer:
                                      description: The image offer if applicable.
                                      type: string
                                    publisher:
                                      description: The image publisher
                                      type: string
                                    sku:
                                      description: The image SKU
                                      type: string
                                    version:
