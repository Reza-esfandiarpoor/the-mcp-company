                  default: None
                  type: string
                  enum:
                  - Public
                  - Private
                  - None
                  x-ms-enum:
                    name: ConnectionType
                    modelAsString: false
                webRdpAccess:
                  description: The enabled access level for Web Access over RDP.
                  default: None
                  type: string
                  enum:
                  - Public
                  - Private
                  - None
                  x-ms-enum:
                    name: ConnectionType
                    modelAsString: false
                clientSshAccess:
                  description: The enabled access level for Client Access over SSH.
                  default: None
