              description: The allowed regions for the lab creator to use when creating
                labs using this lab plan.
              type: array
              items:
                type: string
            sharedGalleryId:
              description: Resource ID of the Shared Image Gallery attached to this
                lab plan. When saving a lab template virtual machine image it will
                be persisted in this gallery. Shared images from the gallery can be
                made available to use when creating new labs.
              type: string
              minLength: 3
              maxLength: 2000
            supportInfo:
              description: Support contact information and instructions for users
                of the lab plan. This information is displayed to lab owners and virtual
                machine users for all labs in the lab plan.
              type: object
              properties:
                url:
                  description: Support web address.
                  type: string
                  minLength: 3
                  maxLength: 2000
                email:
                  description: Support contact email address.
                  type: string
                  minLength: 6
                  maxLength: 254
                phone:
                  description: Support contact phone number.
                  type: string
                  minLength: 1
                  maxLength: 31
                instructions:
                  description: Support instructions.
                  type: string
            linkedLmsInstance:
              description: Base Url of the lms instance this lab plan can link lab
                rosters against.
              type: string
              minLength: 3
              maxLength: 2000
            provisioningState:
              description: Current provisioning state of the lab plan.
              readOnly: true
              type: string
              enum:
              - Creating
              - Updating
              - Deleting
              - Succeeded
              - Failed
              - Locked
              x-ms-enum:
                name: ProvisioningState
                modelAsString: false
                values:
