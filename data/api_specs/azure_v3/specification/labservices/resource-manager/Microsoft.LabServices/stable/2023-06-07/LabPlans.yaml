                  description: Whether shutdown on disconnect is enabled
                  default: Disabled
                  type: string
                  enum:
                  - Enabled
                  - Disabled
                  x-ms-enum:
                    name: EnableState
                    modelAsString: false
                shutdownWhenNotConnected:
                  description: Whether a VM will get shutdown when it hasn't been
                    connected to after a period of time.
                  default: Disabled
                  type: string
                  enum:
                  - Enabled
                  - Disabled
                  x-ms-enum:
                    name: EnableState
                    modelAsString: false
                shutdownOnIdle:
                  description: Whether a VM will get shutdown when it has idled for
                    a period of time.
                  default: None
                  type: string
                  enum:
                  - None
                  - UserAbsence
                  - LowUsage
                  x-ms-enum:
                    name: shutdownOnIdleMode
                    modelAsString: false
                    values:
                    - value: None
                      description: The VM won't be shut down when it is idle.
                    - value: UserAbsence
                      description: The VM will be considered as idle when there is
                        no keyboard or mouse input.
                    - value: LowUsage
                      description: The VM will be considered as idle when user is
                        absent and the resource (CPU and disk) consumption is low.
                disconnectDelay:
                  description: The amount of time a VM will stay running after a user
                    disconnects if this behavior is enabled.
                  type: string
                  format: duration
                noConnectDelay:
                  description: The amount of time a VM will stay running before it
                    is shutdown if no connection is made and this behavior is enabled.
                  type: string
                  format: duration
                idleDelay:
                  description: The amount of time a VM will idle before it is shutdown
                    if this behavior is enabled.
                  type: string
                  format: duration
            defaultNetworkProfile:
              description: The lab plan network profile. To enforce lab network policies
                they must be defined here and cannot be changed when there are existing
                labs associated with this lab plan.
              type: object
              properties:
                subnetId:
                  description: The external subnet resource id
                  type: string
                  minLength: 3
                  maxLength: 2000
