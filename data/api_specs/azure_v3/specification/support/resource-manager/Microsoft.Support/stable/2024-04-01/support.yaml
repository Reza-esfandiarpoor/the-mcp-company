  /subscriptions/{subscriptionId}/providers/Microsoft.Support/checkNameAvailability:
    post:
      tags:
      - SupportTickets
      description: Check the availability of a resource name. This API should be used
        to check the uniqueness of the name for support ticket creation for the selected
        subscription.
      operationId: SupportTickets_CheckNameAvailability
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              description: Input of CheckNameAvailability API.
              type: object
              required:
              - name
              - type
              properties:
                name:
                  description: The resource name to validate.
                  type: string
                type:
                  type: string
                  enum:
                  - Microsoft.Support/supportTickets
                  - Microsoft.Support/communications
                  x-ms-enum:
                    name: Type
                    modelAsString: false
                  description: The type of resource.
        description: Input to check.
        required: true
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                description: Output of check name availability API.
                type: object
                properties:
                  nameAvailable:
                    description: Indicates whether the name is available.
                    readOnly: true
                    type: boolean
                  reason:
                    description: The reason why the name is not available.
                    readOnly: true
                    type: string
                  message:
                    description: The detailed error message describing why the name
                      is not available.
                    readOnly: true
                    type: string
