          type: string
      - name: api-version
        in: query
        required: true
        description: Version of the API to be used with the client request. Current
          version is 2021-10-01
        schema:
          type: string
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                description: The ID of the canceled subscription
                type: object
                properties:
                  subscriptionId:
                    description: The ID of the canceled subscription
                    type: string
                    readOnly: true
        default:
          description: Describes the error if the operation is not successful.
          content:
            application/json:
