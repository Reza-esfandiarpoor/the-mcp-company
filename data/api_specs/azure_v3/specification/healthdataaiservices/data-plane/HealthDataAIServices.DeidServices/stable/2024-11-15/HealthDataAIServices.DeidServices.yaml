        - name: HealthPlan
          value: HealthPlan
          description: Health Plan ID Numbers.
        - name: Hospital
          value: Hospital
          description: Hospital Name.
        - name: IDNum
          value: IDNum
          description: Id Number, eg. passport number.
        - name: IPAddress
          value: IPAddress
          description: IP Address.
        - name: License
          value: License
          description: License, eg. Driver's license or medical license.
        - name: LocationOther
          value: LocationOther
          description: Location Other, eg. Golden Gate Park.
        - name: MedicalRecord
          value: MedicalRecord
          description: Medical Record Number.
        - name: Organization
          value: Organization
          description: Organization, eg. Microsoft.
        - name: Patient
          value: Patient
          description: Patient Name.
        - name: Phone
          value: Phone
          description: Phone Number.
        - name: Profession
          value: Profession
          description: Profession.
        - name: SocialSecurity
