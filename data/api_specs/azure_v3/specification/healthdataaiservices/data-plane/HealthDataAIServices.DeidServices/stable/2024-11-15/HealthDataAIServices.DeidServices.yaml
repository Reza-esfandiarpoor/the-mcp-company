      required:
      - location
      - etag
    DeidentificationJob:
      type: object
      description: A job containing a batch of documents to de-identify.
      properties:
        name:
          type: string
          description: The name of a job.
          minLength: 3
          maxLength: 36
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9-_]+[a-zA-Z0-9]$
          readOnly: true
        operation:
          type: string
          description: Operation to perform on the input documents.
          default: Surrogate
          enum:
          - Redact
          - Surrogate
          - Tag
          x-ms-enum:
            name: DeidentificationOperationType
            modelAsString: true
            values:
            - name: Redact
              value: Redact
              description: Redact Operation will remove all entities of PHI and replace
                them with a placeholder value.
            - name: Surrogate
              value: Surrogate
              description: Surrogation Operation will replace all entities of PHI
                with a surrogate value.
            - name: Tag
              value: Tag
              description: Tag Operation will detect all entities of PHI, their type,
                and return their locations in the document.
        sourceLocation:
          $ref: '#/components/schemas/SourceStorageLocation'
        targetLocation:
          $ref: '#/components/schemas/TargetStorageLocation'
        customizations:
          $ref: '#/components/schemas/DeidentificationJobCustomizationOptions'
        status:
          $ref: '#/components/schemas/Azure.Core.Foundations.OperationState'
        error:
          $ref: '#/components/schemas/Azure.Core.Foundations.Error'
        lastUpdatedAt:
          type: string
          format: date-time
          description: 'Date and time when the job was completed.


            If the job is canceled, this is the time when the job was canceled.


            If the job failed, this is the time when the job failed.'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: Date and time when the job was created.
          readOnly: true
        startedAt:
          type: string
          format: date-time
          description: Date and time when the job was started.
          readOnly: true
        summary:
          $ref: '#/components/schemas/DeidentificationJobSummary'
      required:
      - name
      - sourceLocation
      - targetLocation
      - status
      - lastUpdatedAt
      - createdAt
    DeidentificationJobCustomizationOptions:
      type: object
      description: Customizations options to override default service behaviors for
        job usage.
      properties:
        redactionFormat:
          type: string
          description: "Format of the redacted output. Only valid when Operation is
            Redact. \nPlease refer to https://learn.microsoft.com/azure/healthcare-apis/deidentification/redaction-format
            for more details."
          minLength: 1
          maxLength: 16
        surrogateLocale:
          type: string
          description: Locale in which the output surrogates are written.
          default: en-US
    DeidentificationJobSummary:
      type: object
      description: Summary metrics of a job.
      properties:
        successful:
          type: integer
          format: int32
          description: Number of documents that have completed.
        failed:
          type: integer
          format: int32
          description: Number of documents that have failed.
        canceled:
          type: integer
          format: int32
          description: Number of documents that have been canceled.
        total:
          type: integer
          format: int32
          description: Number of documents total.
        bytesProcessed:
          type: integer
          format: int64
          description: Number of bytes processed.
      required:
      - successful
      - failed
      - canceled
      - total
      - bytesProcessed
