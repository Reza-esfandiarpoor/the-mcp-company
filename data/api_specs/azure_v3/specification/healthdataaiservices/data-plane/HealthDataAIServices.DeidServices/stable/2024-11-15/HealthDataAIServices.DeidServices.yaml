    PhiCategory:
      type: string
      description: List of PHI Entities.
      enum:
      - Unknown
      - Account
      - Age
      - BioID
      - City
      - CountryOrRegion
      - Date
      - Device
      - Doctor
      - Email
      - Fax
      - HealthPlan
      - Hospital
      - IDNum
      - IPAddress
      - License
      - LocationOther
      - MedicalRecord
      - Organization
      - Patient
      - Phone
      - Profession
      - SocialSecurity
      - State
      - Street
      - Url
      - Username
      - Vehicle
      - Zip
      x-ms-enum:
        name: PhiCategory
        modelAsString: true
        values:
        - name: Unknown
          value: Unknown
          description: Unknown PHI Type.
        - name: Account
          value: Account
          description: Account Number.
        - name: Age
          value: Age
          description: Age.
        - name: BioID
          value: BioID
