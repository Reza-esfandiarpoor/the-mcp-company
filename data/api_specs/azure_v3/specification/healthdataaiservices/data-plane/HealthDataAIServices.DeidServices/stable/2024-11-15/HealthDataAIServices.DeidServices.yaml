    Azure.Core.eTag:
      type: string
      description: 'The ETag (or entity tag) HTTP response header is an identifier
        for a specific version of a resource.

        It lets caches be more efficient and save bandwidth, as a web server does
        not need to resend a full response if the content was not changed.


        It is a string of ASCII characters placed between double quotes, like "675af34563dc-tr34".'
    DeidentificationContent:
      type: object
      description: Request body for de-identification operation.
      properties:
        inputText:
          type: string
          description: Input text to de-identify.
          maxLength: 48000
        operation:
          type: string
          description: Operation to perform on the input documents.
          default: Surrogate
          enum:
          - Redact
          - Surrogate
          - Tag
          x-ms-enum:
            name: DeidentificationOperationType
            modelAsString: true
            values:
            - name: Redact
              value: Redact
              description: Redact Operation will remove all entities of PHI and replace
                them with a placeholder value.
            - name: Surrogate
              value: Surrogate
              description: Surrogation Operation will replace all entities of PHI
                with a surrogate value.
            - name: Tag
              value: Tag
              description: Tag Operation will detect all entities of PHI, their type,
                and return their locations in the document.
        customizations:
          $ref: '#/components/schemas/DeidentificationCustomizationOptions'
      required:
      - inputText
    DeidentificationCustomizationOptions:
      type: object
