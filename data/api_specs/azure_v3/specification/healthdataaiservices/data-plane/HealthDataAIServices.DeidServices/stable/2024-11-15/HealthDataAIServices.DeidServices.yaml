      - utf16
      - codePoint
    TargetStorageLocation:
      type: object
      description: Storage location.
      properties:
        location:
          type: string
          format: uri
          description: URL to storage location.
        prefix:
          type: string
          description: 'Replaces the input prefix of a file path with the output prefix,
            preserving the rest of the path structure.


            Example:

            File full path: documents/user/note.txt

            Input Prefix: "documents/user/"

            Output Prefix: "output_docs/"


            Output file: "output_docs/note.txt"'
          maxLength: 1024
        overwrite:
          type: boolean
          description: When set to true during a job, the service will overwrite the
            output location if it already exists.
          default: false
      required:
      - location
      - prefix
