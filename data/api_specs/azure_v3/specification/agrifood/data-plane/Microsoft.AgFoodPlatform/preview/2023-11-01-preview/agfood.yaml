              $ref: '#/components/schemas/ApplicationData'
        description: Application data resource payload to create or update.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationData'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationData'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - ApplicationData
      description: Deletes a specified application data resource under a particular
        party.
      operationId: ApplicationData_Delete
      parameters:
      - in: path
        name: partyId
        description: ID of the associated party resource.
        required: true
        schema:
          type: string
      - in: path
        name: applicationDataId
        description: ID of the application data.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
