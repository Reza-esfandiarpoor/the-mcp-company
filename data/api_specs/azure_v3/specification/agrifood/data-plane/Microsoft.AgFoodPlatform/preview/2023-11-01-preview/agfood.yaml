        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - ApplicationData
      description: Creates or updates an application data resource under a particular
        party.
      operationId: ApplicationData_CreateOrUpdate
      parameters:
      - in: path
        name: partyId
        description: ID of the associated party.
        required: true
        schema:
          type: string
      - in: path
        name: applicationDataId
        description: ID of the application data resource.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
