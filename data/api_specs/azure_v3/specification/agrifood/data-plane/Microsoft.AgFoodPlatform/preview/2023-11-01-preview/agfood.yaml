          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Attachments
      description: Deletes a specified attachment resource under a particular party.
      operationId: Attachments_Delete
      parameters:
      - in: path
        name: partyId
        description: Id of the party.
