openapi: 3.0.0
info:
  title: Microsoft Azure Data Manager for Agriculture Data Plane Service
  description: APIs documentation for Microsoft Azure Data Manager for Agriculture
    DataPlane Service.
  version: 2023-11-01-preview
security:
- Bearer: []
paths:
  /application-data:search:
    post:
      tags:
      - ApplicationData
      description: Search for ApplicationData across all parties by intersecting geometry.
      operationId: ApplicationData_Search
      parameters:
      - in: query
        name: skipToken
        description: Skip token for getting next set of results.
        schema:
          type: string
      - in: query
        name: maxPageSize
        description: Maximum number of items needed (inclusive). Minimum = 10, Maximum
          = 1000, Default Value = 50.
        schema:
          type: integer
          format: int32
          minimum: 10
          maximum: 1000
          default: 50
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchApplicationDataQuery'
        description: Query filters.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDataMetaDataListResponse'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /application-data/cascade-delete/{jobId}:
    put:
      tags:
      - ApplicationData
      description: Create cascade delete job for application data resource.
      operationId: ApplicationData_CreateCascadeDeleteJob
      parameters:
      - in: path
        name: jobId
        description: Job Id supplied by end user.
        required: true
        schema:
          type: string
      - in: query
        name: partyId
        description: Id of the party.
        required: true
        schema:
          type: string
      - in: query
        name: applicationDataId
        description: Id of the application data.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CascadeDeleteJob'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
    get:
      tags:
      - ApplicationData
      description: Get cascade delete job for application data resource.
      operationId: ApplicationData_GetCascadeDeleteJobDetails
      parameters:
      - in: path
        name: jobId
        description: Id of the job.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CascadeDeleteJob'
        default:
          description: Error
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /parties/{partyId}/application-data/{applicationDataId}:
    get:
      tags:
      - ApplicationData
      description: Get a specified application data resource under a particular party.
      operationId: ApplicationData_Get
      parameters:
      - in: path
        name: partyId
        description: ID of the associated party resource.
        required: true
        schema:
          type: string
      - in: path
        name: applicationDataId
        description: ID of the application data resource.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
