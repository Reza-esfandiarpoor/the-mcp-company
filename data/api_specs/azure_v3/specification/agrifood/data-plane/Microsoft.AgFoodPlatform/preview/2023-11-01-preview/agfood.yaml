        name: api-version
        description: The requested API version
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: File to be uploaded.
                  type: string
                  format: binary
                resourceId:
                  description: Associated Resource id for this attachment.
                  type: string
                resourceType:
                  description: Associated Resource type for this attachment.
                  type: string
                originalFileName:
                  description: Original File Name for this attachment.
                  type: string
                id:
                  description: Unique id.
                  type: string
                status:
                  description: Status of the resource.
                  type: string
                  minLength: 0
                  maxLength: 100
                createdDateTime:
                  description: Date when resource was created.
                  type: string
                  format: date-time
                modifiedDateTime:
                  description: Date when resource was last modified.
                  type: string
                  format: date-time
                source:
                  description: Source of the resource.
                  type: string
                  minLength: 2
                  maxLength: 100
                name:
                  description: Name to identify resource.
                  type: string
                  minLength: 0
                  maxLength: 100
                description:
                  description: Textual description of resource.
                  type: string
                  minLength: 0
                  maxLength: 500
                createdBy:
                  description: Created by user/tenant id.
                  type: string
                modifiedBy:
                  description: Modified by user/tenant id.
                  type: string
                eTag:
                  description: The ETag value to implement optimistic concurrency.
                  type: string
