openapi: 3.0.0
info:
  title: InstanceMetadataClient
  description: The Azure Instance Metadata Client
  version: 2023-07-01
servers:
- url: http://169.254.169.254/metadata
- url: https://169.254.169.254/metadata
paths:
  /versions:
    get:
      operationId: GetVersions
      description: Get supported API versions.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: This is the response from the GetVersions operation.
                properties:
                  apiVersions:
                    type: array
                    description: List of API versions supported.
                    items:
                      type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: This is the response from an operation in the case an
                  error occurs.
                type: object
                properties:
                  error:
                    description: Error message indicating why the operation failed.
                    type: string
  /instance:
    get:
      operationId: Instances_GetMetadata
      description: Get Instance Metadata for the Virtual Machine.
      parameters:
      - name: api-version
        in: query
        description: Version of the API to be used with the client request.
        required: true
        schema:
          type: string
      - name: Metadata
        in: header
        description: This must be set to 'true'.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: This is the response from the Instance_GetMetadata operation.
                properties:
                  compute:
                    description: Compute Metadata
                    type: object
                    properties:
                      azEnvironment:
                        type: string
                        description: This is the name of the environment in which
                          the VM is running.
                      evictionPolicy:
                        type: string
                        description: Describes how the VM will be evicted if space
                          needs to be freed up. Only applicable to Spot VMs. For a
                          non-spot VM, this will be an empty string.
                      extendedLocation:
                        type: object
                        description: Describes the extended location of the VM
                        properties:
                          type:
                            type: string
                            description: The type of the extended location of the
                              VM
                          name:
                            type: string
                            description: The name of the extended location of the
                              VM
                      isHostCompatibilityLayerVm:
                        type: string
                        description: Identifies if the VM runs on the Host Compatibility
                          Layer.
                      licenseType:
                        type: string
                        description: Type of license for Azure Hybrid Benefit. Note
                          that this is only present for AHB-enabled VMs.
                      location:
                        type: string
                        description: This is the Azure Region in which the VM is running.
                      name:
                        type: string
                        description: This is the name of the VM.
                      offer:
                        type: string
                        description: This is the offer information for the VM image.
                          This value is only present for images deployed from the
                          Azure Image Gallery.
                      osProfile:
                        type: object
                        description: This contains the data about the OS.
                        properties:
                          adminUsername:
                            type: string
                            description: This is admin account.
                          computerName:
                            type: string
                            description: This is the name of the VM.
                          disablePasswordAuthentication:
                            type: string
                            description: This specifies whether or not password authentication
                              is disabled. Note that this is present only for Linux
                              VMs. For a Windows VM, this value will be the empty
                              string.
                      osType:
                        type: string
                        description: This value indicates the type of OS the VM is
                          running, either Linux or Windows.
                      placementGroupId:
                        type: string
                        description: This is the placement group of your Virtual Machine
                          Scale Set.
                      plan:
                        type: object
                        description: This contains the data about the plan.
                        properties:
                          name:
                            type: string
                            description: This is the Plan ID.
                          publisher:
                            type: string
                            description: This is the publisher ID.
                          product:
                            type: string
                            description: This is the product of the image from the
                              Marketplace.
                      publicKeys:
                        type: array
                        items:
                          type: object
                          description: This contains the data about the public key.
                          properties:
                            path:
                              type: string
                              description: This specifies the full path on the VM
                                where the SSH public key is stored.
                            keyData:
                              type: string
                              description: This is the SSH public key certificate
                                used to authenticate with the VM.
                        description: This is information about the SSH certificate
                      platformFaultDomain:
                        type: string
                        description: This is the fault domain the VM resides in.
                      platformSubFaultDomain:
                        type: string
                        description: This is the sub fault domain the VM resides in,
                          if applicable.
                      platformUpdateDomain:
                        type: string
                        description: This is the update domain the VM resides in.
                      priority:
                        type: string
                        description: This is the priority of the VM.
                      provider:
                        type: string
                        description: This is the provider of the VM.
                      publisher:
                        type: string
                        description: This is the publisher of the VM image.
                      resourceGroupName:
                        type: string
                        description: This is the resource group for the VM.
                      resourceId:
                        type: string
                        description: This is the fully qualified ID for the VM.
                      securityProfile:
                        description: This contains the data about the security profile
                          associated with the VM.
                        type: object
                        properties:
                          secureBootEnabled:
                            type: string
                            description: Identifies if UEFI secure boot is enabled
                              on the VM
                          virtualTpmEnabled:
                            type: string
                            description: Identifies if the virtual Trusted Platform
                              Module (TPM) is enabled on the VM
                          encryptionAtHost:
                            type: string
                            description: Identifies if encryption at host is enabled
                              on the VM
                          securityType:
                            type: string
                            description: Identifies if the VM is a Trusted VM or a
                              Confidential VM
                      host:
                        description: This contains the data about the host of VM.
                        type: object
                        properties:
                          id:
                            type: string
                            description: This is the name of the host of VM. Note
                              that a VM will either have a host or a hostGroup but
                              not both
                      hostGroup:
                        description: This contains the data about the host group of
                          VM.
                        type: object
                        properties:
                          id:
                            type: string
                            description: This is the name of the host group of VM.
                              Note that a VM will either have a host or a hostGroup
                              but not both
                      sku:
                        type: string
                        description: This is the specific SKU for the VM image.
                      storageProfile:
                        type: object
                        description: This contains the data about the storage disks
                          associated with the VM.
                        properties:
                          imageReference:
                            type: object
                            description: Image information
                            properties:
                              id:
                                type: string
                                description: This is the resource ID.
                              offer:
                                type: string
                                description: This is the offer of the platform or
                                  marketplace image.
                              publisher:
                                type: string
                                description: This is the image publisher.
                              sku:
                                type: string
                                description: This is the image SKU.
                              version:
                                type: string
                                description: This is the version of the platform or
                                  marketplace image.
                              communityGalleryImageId:
                                type: string
                                description: This is the resource ID when using a
                                  community image.
                              sharedGalleryImageId:
                                type: string
                                description: This is the resource ID when using a
                                  direct shared image.
                              exactVersion:
                                type: string
                                description: This is the version of the community
                                  or direct shared image.
                          osDisk:
                            type: object
                            description: OS disk information
                            properties:
                              caching:
                                type: string
                                description: This is the caching requirements.
                              createOption:
                                type: string
                                description: This is information about how the VM
                                  was created.
                              diffDiskSettings:
                                type: object
                                description: This is the ephemeral disk settings.
                                properties:
                                  option:
                                    type: string
                                    description: This specifies the ephemeral disk
                                      settings.
                              diskSizeGB:
                                type: string
                                description: This is the size of the disk in GB.
                              encryptionSettings:
                                type: object
                                description: This is the encryption settings for the
                                  disk.
                                properties:
                                  enabled:
                                    type: string
                                    description: This specifies whether or not disk
                                      encryption is enabled on the VM.
                                  diskEncryptionKey:
                                    type: object
                                    description: This is the key used for encrypting
                                      the disk.
                                    properties:
                                      sourceVault:
                                        type: object
                                        description: This specifies keyvault used
                                          to store the encryption key.
                                        properties:
                                          id:
                                            type: string
                                            description: This specifies the resource
                                              ID of the keyvault.
                                      secretUrl:
                                        type: string
                                        description: This specifies the secret Url
                                          of the key stored in keyvault.
                                  keyEncryptionKey:
                                    type: object
                                    description: This is the key used for encrypting
                                      the disk encryption key.
                                    properties:
                                      sourceVault:
                                        type: object
                                        description: This specifies keyvault used
                                          to store the encryption key.
                                        properties:
                                          id:
                                            type: string
                                            description: This specifies the resource
                                              ID of the keyvault.
                                      keyUrl:
                                        type: string
                                        description: This specifies the secret Url
                                          of the key stored in keyvault.
                              image:
                                type: object
                                description: This is the source user image virtual
                                  hard disk.
                                properties:
                                  uri:
                                    type: string
                                    description: This is the uri of the virtual hard
                                      disk.
                              managedDisk:
                                type: object
                                description: This is managed disk parameters.
                                properties:
                                  id:
                                    type: string
                                    description: This is the resource ID.
                                  storageAccountType:
                                    type: string
                                    description: This is the storage account type
                                      for the managed disk.
                              name:
                                type: string
                                description: This is the disk name.
                              osType:
                                type: string
                                description: This is the type of OS included in the
                                  disk.
                              vhd:
                                type: object
                                description: This is the virtual hard disk.
                                properties:
                                  uri:
                                    type: string
                                    description: This is the uri of the virtual hard
                                      disk.
                              writeAcceleratorEnabled:
                                type: string
                                description: This specifies whether or not writeAccelerator
                                  is enabled on the disk.
                          dataDisks:
                            type: array
                            description: Data disk information
                            items:
                              type: object
                              description: This contains information about the data
                                disk.
                              properties:
                                bytesPerSecondThrottle:
                                  type: string
                                  description: Disk read/write quota in bytes; only
                                    populated for Ultra Disks
                                caching:
                                  type: string
                                  description: This is the caching requirements.
                                createOption:
                                  type: string
                                  description: This is information about how the VM
                                    was created.
                                diskCapacityBytes:
                                  type: string
                                  description: Size of disk in bytes; only populated
                                    for Ultra Disks
                                diskSizeGB:
                                  type: string
                                  description: This is the size of the disk in GB.
                                image:
                                  type: object
                                  description: This is the source user image virtual
                                    hard disk.
                                  properties:
                                    uri:
                                      type: string
                                      description: This is the uri of the virtual
                                        hard disk.
                                isSharedDisk:
                                  type: string
                                  description: Identifies if the disk is shared between
                                    resources; only populated for Ultra Disks
                                isUltraDisk:
                                  type: string
                                  description: Identifies if the data disk is an Ultra
                                    Disk
                                lun:
                                  type: string
                                  description: This is the logical unit number of
                                    the disk.
                                managedDisk:
                                  type: object
                                  description: This is managed disk parameters.
                                  properties:
                                    id:
                                      type: string
                                      description: This is the resource ID.
                                    storageAccountType:
                                      type: string
                                      description: This is the storage account type
                                        for the managed disk.
                                name:
                                  type: string
                                  description: This is the disk name.
                                opsPerSecondThrottle:
                                  type: string
                                  description: Disk read/write quota in IOPS; only
                                    populated for Ultra Disks
                                vhd:
                                  type: object
                                  description: This is the virtual hard disk.
                                  properties:
                                    uri:
                                      type: string
                                      description: This is the uri of the virtual
                                        hard disk.
                                writeAcceleratorEnabled:
                                  type: string
                                  description: This specifies whether or not writeAccelerator
                                    is enabled on the disk.
                          resourceDisk:
                            type: object
                            description: This contains data for the size of local
                              temp disk of the VM, if it exists.
                            properties:
                              size:
                                type: string
                                description: The size of the local temp disk of the
                                  VM if it exists, in kilobytes. If the VM has no
                                  local temp disk, this value is 0.
                      subscriptionId:
                        type: string
                        description: This is the Azure subscription for the VM.
                      tags:
                        type: string
                        description: This is the list of tags for your VM.
                      tagsList:
                        type: array
                        items:
                          type: object
                          description: This contains the properties of the tags in
                            a tagsList.
                          properties:
                            name:
                              type: string
                              description: This is the name of the tag. It is equivalent
                                to the key in the key-value pair format.
                            value:
                              type: string
                              description: This is the value of the tag. It is, as
                                expected, equivalent to the value in the key-value
                                pair format.
                        description: This is the list of tags for your VM formatted
                          as a JSON array for easier programmatic parsing.
                      userData:
                        type: string
                        description: The set of data specified when the VM was created
                          for use during or after provisioning (Base64 encoded)
                      version:
                        type: string
                        description: This is the version of the VM image.
                      virtualMachineScaleSet:
                        type: object
                        description: Information about the VMSS the VM belongs to
                          (if applicable)
                        properties:
                          id:
                            type: string
                            description: This is the ID of the VMSS the VM belongs
                              to (if applicable)
                      vmId:
                        type: string
                        description: This is the unique identifier for the VM.
                      vmScaleSetName:
                        type: string
                        description: This is the resource name of the VMSS.
                      vmSize:
                        type: string
                        description: This is the size of the VM.
                      zone:
                        type: string
                        description: This is the availability zone of the VM.
                      additionalCapabilities:
                        type: object
                        description: These are additional capabilities defined for
                          VM.
                        properties:
                          hibernationEnabled:
                            type: string
                            description: This specifies if hibernation is enabled
                              for VM.
                  network:
                    description: Network Metadata
                    type: object
                    properties:
                      interface:
                        type: array
                        description: This contains data about the network interface.
                        items:
                          type: object
                          description: This contains data about the network interface.
                          properties:
                            ipv4:
                              type: object
                              description: This contains the IPv4 address.
                              properties:
                                ipAddress:
                                  type: array
                                  description: This is the IP address
                                  items:
                                    type: object
                                    description: This contains the IPv4 properties.
                                    properties:
                                      privateIpAddress:
                                        type: string
                                        description: This is the private IP address
                                          assigned to the interface.
                                      publicIpAddress:
                                        type: string
                                        description: This is the public IP address
                                          assigned to the interface.
                                subnet:
                                  type: array
                                  description: This is the subnet
                                  items:
                                    type: object
                                    description: This contains the subnet properties.
                                    properties:
                                      address:
                                        type: string
                                        description: This is the address range of
                                          the subnet.
                                      prefix:
                                        type: string
                                        description: This is the prefix of the subnet.
                            ipv6:
                              type: object
                              description: This contains the IPv6 address.
                              properties:
                                ipAddress:
                                  type: array
                                  description: This is the IP address
                                  items:
                                    type: object
                                    description: This contains the IPv6 properties.
                                    properties:
                                      privateIpAddress:
                                        type: string
                                        description: This is the private IPv6 address
                                          assigned to the interface.
                            macAddress:
                              type: string
                              description: This is the MAC address of the interface.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: This is the response from an operation in the case an
                  error occurs.
                type: object
                properties:
                  error:
                    description: Error message indicating why the operation failed.
                    type: string
  /attested/document:
    get:
      operationId: Attested_GetDocument
      description: Get Attested Data for the Virtual Machine.
      parameters:
      - name: api-version
        in: query
        description: Version of the API to be used with the client request.
        required: true
        schema:
          type: string
      - name: nonce
        in: query
        required: false
        description: This is a string of up to 32 random alphanumeric characters.
        schema:
          type: string
      - name: Metadata
        in: header
        description: This must be set to 'true'.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: This is the response from the Attested_GetDocument operation.
                properties:
                  signature:
                    type: string
                    description: This is the encoded string containing the VM ID,
                      SKU, plan information, public key, timestamp, and nonce value.
                  encoding:
                    type: string
                    description: This is the encoding scheme of the signature.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: This is the response from an operation in the case an
                  error occurs.
                type: object
                properties:
                  error:
                    description: Error message indicating why the operation failed.
                    type: string
  /identity/oauth2/token:
    get:
      tags:
      - Get token
      description: Get a Token from Azure AD
      operationId: Identity_GetToken
      security:
      - {}
      - basic_auth: []
      parameters:
      - name: Metadata
        in: header
        description: This must be set to 'true'.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - 'true'
      - name: resource
        in: query
        description: This is the urlencoded identifier URI of the sink resource for
          the requested Azure AD token. The resulting token contains the corresponding
          aud for this resource.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Version of the API to be used with the client request.
        required: true
        schema:
          type: string
      - name: client_id
        in: query
        description: This identifies, by Azure AD client id, a specific explicit identity
          to use when authenticating to Azure AD. Mutually exclusive with object_id
          and msi_res_id.
        required: false
        schema:
          type: string
      - name: object_id
        in: query
        description: This identifies, by Azure AD object id, a specific explicit identity
          to use when authenticating to Azure AD. Mutually exclusive with client_id
          and msi_res_id.
        required: false
        schema:
          type: string
      - name: msi_res_id
        in: query
        description: This identifies, by urlencoded ARM resource id, a specific explicit
          identity to use when authenticating to Azure AD. Mutually exclusive with
          client_id and object_id.
        required: false
        schema:
          type: string
      - name: authority
        in: query
        description: This indicates the authority to request AAD tokens from. Defaults
          to the known authority of the identity to be used.
        required: false
        schema:
          type: string
      - name: bypass_cache
        in: query
        description: If provided, the value must be 'true'. This indicates to the
          server that the token must be retrieved from Azure AD and cannot be retrieved
          from an internal cache.
        required: false
        x-ms-enum:
          name: BypassCache
          modelAsString: true
        schema:
          type: string
          enum:
          - 'true'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: This is the response from the Identity_GetToken operation.
                properties:
                  access_token:
                    type: string
                    description: This is the requested access token. The app can use
                      this token to authenticate to the sink resource.
                  expires_in:
                    type: string
                    description: This is how long the access token is valid (in seconds).
                  expires_on:
                    type: string
                    description: This is the time when the access token expires. The
                      date is represented as the number of seconds from 1970-01-01T0:0:0Z
                      UTC until the expiration time. This value is used to determine
                      the lifetime of cached tokens.
                  ext_expires_in:
                    type: string
                    description: This indicates the extended lifetime of the token
                      (in seconds).
                  not_before:
                    type: string
                    description: This is the time when the access token becomes effective.
                      The date is represented as the number of seconds from 1970-01-01T0:0:0Z
                      UTC until the expiration time.
                  resource:
                    type: string
                    description: This is the app ID URI of the sink resource.
                  token_type:
                    type: string
                    description: This indicates the token type value.
                  client_id:
                    type: string
                    description: This is the client_id specified in the request, if
                      any.
                  object_id:
                    type: string
                    description: This is the object_id specified in the request, if
                      any.
                  msi_res_id:
                    type: string
                    description: This is the msi_res_id specified in the request,
                      if any.
        default:
          headers:
            Www-Authenticate:
              description: This is the response header containing a challenge for
                the Basic scheme with a realm value
              schema:
                type: string
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                description: This is the response from an Identity operation in the
                  case an error occurs.
                properties:
                  error:
                    type: string
                    description: Error code
                    enum:
                    - invalid_request
                    - unauthorized_client
                    - access_denied
                    - unsupported_response_type
                    - invalid_scope
                    - server_error
                    - service_unavailable
                    - bad_request
                    - forbidden
                    - not_found
                    - method_not_allowed
                    - too_many_requests
                    x-ms-enum:
                      name: Error
                      modelAsString: true
                  error_description:
                    type: string
                    description: Error message indicating why the operation failed.
  /identity/info:
    get:
      tags:
      - Get metadata information
      description: Get information about AAD Metadata
      operationId: Identity_GetInfo
      parameters:
      - name: Metadata
        in: header
        description: This must be set to 'true'.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - 'true'
      - name: api-version
        in: query
        description: Version of the API to be used with the client request.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                description: This is the response from the Identity_GetInfo operation.
                properties:
                  tenantId:
                    type: string
                    description: This is the AAD tenantId of the identity of the system
                      assigned managed identity.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                description: This is the response from an Identity operation in the
                  case an error occurs.
                properties:
                  error:
                    type: string
                    description: Error code
                    enum:
                    - invalid_request
                    - unauthorized_client
                    - access_denied
                    - unsupported_response_type
                    - invalid_scope
                    - server_error
                    - service_unavailable
                    - bad_request
                    - forbidden
                    - not_found
                    - method_not_allowed
                    - too_many_requests
                    x-ms-enum:
                      name: Error
                      modelAsString: true
                  error_description:
                    type: string
                    description: Error message indicating why the operation failed.
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of the API to be used with the client request.
      required: true
      schema:
        type: string
    MetadataParameter:
      name: Metadata
      in: header
      description: This must be set to 'true'.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - 'true'
  securitySchemes:
    basic_auth:
      type: http
      description: A Basic authentication flow
      scheme: basic
  schemas:
    Compute:
      type: object
      properties:
        azEnvironment:
          type: string
          description: This is the name of the environment in which the VM is running.
        evictionPolicy:
          type: string
          description: Describes how the VM will be evicted if space needs to be freed
            up. Only applicable to Spot VMs. For a non-spot VM, this will be an empty
            string.
        extendedLocation:
          type: object
          description: Describes the extended location of the VM
          properties:
            type:
              type: string
              description: The type of the extended location of the VM
            name:
              type: string
              description: The name of the extended location of the VM
        isHostCompatibilityLayerVm:
          type: string
          description: Identifies if the VM runs on the Host Compatibility Layer.
        licenseType:
          type: string
          description: Type of license for Azure Hybrid Benefit. Note that this is
            only present for AHB-enabled VMs.
        location:
          type: string
          description: This is the Azure Region in which the VM is running.
        name:
          type: string
          description: This is the name of the VM.
        offer:
          type: string
          description: This is the offer information for the VM image. This value
            is only present for images deployed from the Azure Image Gallery.
        osProfile:
          type: object
          description: This contains the data about the OS.
