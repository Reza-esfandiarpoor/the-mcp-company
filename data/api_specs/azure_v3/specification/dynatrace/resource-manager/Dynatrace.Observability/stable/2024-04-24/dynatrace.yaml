                                      subscription.
                                    type: string
                                  tagRules:
                                    type: object
                                    properties:
                                      logRules:
                                        description: Set of rules for sending logs
                                          for the Monitor resource.
                                        type: object
                                        properties:
                                          sendAadLogs:
                                            description: Flag specifying if AAD logs
                                              should be sent for the Monitor resource.
                                            type: string
                                            enum:
                                            - Enabled
                                            - Disabled
                                            x-ms-enum:
                                              name: SendAadLogsStatus
                                              modelAsString: true
                                          sendSubscriptionLogs:
                                            description: Flag specifying if subscription
                                              logs should be sent for the Monitor
                                              resource.
                                            type: string
                                            enum:
                                            - Enabled
                                            - Disabled
                                            x-ms-enum:
                                              name: SendSubscriptionLogsStatus
                                              modelAsString: true
                                          sendActivityLogs:
                                            description: Flag specifying if activity
                                              logs from Azure resources should be
                                              sent for the Monitor resource.
                                            type: string
                                            enum:
                                            - Enabled
                                            - Disabled
                                            x-ms-enum:
                                              name: SendActivityLogsStatus
                                              modelAsString: true
                                          filteringTags:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                name:
