                                        - Creating
                                        - Updating
                                        - Deleting
                                        - Succeeded
                                        - Failed
                                        - Canceled
                                        - Deleted
                                        - NotSpecified
                                        x-ms-enum:
                                          name: ProvisioningState
                                          modelAsString: true
                                    description: Properties for the Tag rules resource
