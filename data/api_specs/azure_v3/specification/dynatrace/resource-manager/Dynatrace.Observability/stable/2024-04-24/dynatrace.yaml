                                                  description: The name (also known
                                                    as the key) of the tag.
                                                value:
                                                  type: string
                                                  description: The value of the tag.
                                                action:
                                                  description: Valid actions for a
                                                    filtering tag. Exclusion takes
                                                    priority over inclusion.
                                                  type: string
                                                  enum:
                                                  - Include
                                                  - Exclude
                                                  x-ms-enum:
                                                    name: TagAction
                                                    modelAsString: true
