components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client Api Version.
      schema:
        type: string
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: Subscription credentials which uniquely identify Microsoft Azure
        subscription. The subscription ID forms part of the URI for every service
        call.
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    DisallowedConfiguration:
      properties:
        vmDiskType:
          type: string
          description: VM disk types which are disallowed.
          enum:
          - None
          - Unmanaged
          x-ms-enum:
            name: VmDiskTypes
            modelAsString: true
      description: Specifies the disallowed configuration for a virtual machine image.
    VirtualMachineImageResource:
      type: object
      properties:
        id:
          type: string
          description: Resource Id
        name:
          type: string
          description: The name of the resource.
        location:
          type: string
          description: The supported Azure location of the resource.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Specifies the tags that are assigned to the virtual machine.
            For more information about using tags, see [Using tags to organize your
            Azure resources](https://docs.microsoft.com/azure/azure-resource-manager/resource-group-using-tags.md).
        extendedLocation:
          description: The extended location of the Virtual Machine.
          type: object
          properties:
            name:
              type: string
              description: The name of the extended location.
            type:
              description: The type of the extended location.
              type: string
              enum:
              - EdgeZone
              x-ms-enum:
                name: ExtendedLocationTypes
                modelAsString: true
      required:
      - name
      - location
      description: Virtual machine image resource information.
    PurchasePlan:
      properties:
        publisher:
          type: string
          description: The publisher ID.
        name:
          type: string
          description: The plan ID.
        product:
          type: string
          description: Specifies the product of the image from the marketplace. This
            is the same value as Offer under the imageReference element.
      required:
      - publisher
      - name
      - product
      description: Used for establishing the purchase context of any 3rd Party artifact
        through MarketPlace.
    OSDiskImage:
      properties:
        operatingSystem:
          type: string
          description: The operating system of the osDiskImage.
          enum:
          - Windows
          - Linux
          x-ms-enum:
            name: OperatingSystemTypes
            modelAsString: false
      required:
      - operatingSystem
      description: Contains the os disk image information.
    DataDiskImage:
      properties:
        lun:
          readOnly: true
          type: integer
          format: int32
          description: Specifies the logical unit number of the data disk. This value
            is used to identify data disks within the VM and therefore must be unique
            for each data disk attached to a VM.
      description: Contains the data disk images information.
    AutomaticOSUpgradeProperties:
      properties:
        automaticOSUpgradeSupported:
          type: boolean
          description: Specifies whether automatic OS upgrade is supported on the
            image.
      required:
      - automaticOSUpgradeSupported
      description: Describes automatic OS upgrade properties on the image.
    ImageDeprecationStatus:
      type: object
      properties:
        imageState:
          type: string
          description: Describes the state of the image.
          enum:
          - Active
          - ScheduledForDeprecation
          - Deprecated
          x-ms-enum:
            name: ImageState
            modelAsString: true
        scheduledDeprecationTime:
          type: string
          format: date-time
          description: The time, in future, at which this image will be marked as
            deprecated. This scheduled time is chosen by the Publisher.
        alternativeOption:
          type: object
          properties:
            type:
              type: string
              description: Describes the type of the alternative option.
              enum:
              - None
              - Offer
              - Plan
              x-ms-enum:
                name: AlternativeType
                modelAsString: true
            value:
              type: string
              description: Indicates the alternative option value specified by the
