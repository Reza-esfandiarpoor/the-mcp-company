                          - name
                          description: List of instance view of the dedicated hosts
                            under the dedicated host group.
                    supportAutomaticPlacement:
                      type: boolean
                      description: 'Specifies whether virtual machines or virtual
                        machine scale sets can be placed automatically on the dedicated
                        host group. Automatic placement means resources are allocated
                        on dedicated hosts, that are chosen by Azure, under the dedicated
                        host group. The value is defaulted to ''false'' when not provided.
                        Minimum api-version: 2020-06-01.'
                    additionalCapabilities:
                      type: object
                      properties:
                        ultraSSDEnabled:
                          type: boolean
                          description: 'The flag that enables or disables a capability
                            to have UltraSSD Enabled Virtual Machines on Dedicated
                            Hosts of the Dedicated Host Group. For the Virtual Machines
                            to be UltraSSD Enabled, UltraSSDEnabled flag for the resource
                            needs to be set true as well. The value is defaulted to
                            ''false'' when not provided. Please refer to https://docs.microsoft.com/en-us/azure/virtual-machines/disks-enable-ultra-ssd
                            for more details on Ultra SSD feature. **Note:** The ultraSSDEnabled
                            setting can only be enabled for Host Groups that are created
                            as zonal. Minimum api-version: 2022-03-01.'
                      description: 'Enables or disables a capability on the dedicated
                        host group. Minimum api-version: 2022-03-01.'
