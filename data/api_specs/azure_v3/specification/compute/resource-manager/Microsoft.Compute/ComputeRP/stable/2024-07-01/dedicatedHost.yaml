                        type: object
                        properties:
                          id:
                            readOnly: true
                            type: string
                            description: Resource Id
                      readOnly: true
                      description: A list of references to all dedicated hosts in
                        the dedicated host group.
                    instanceView:
                      readOnly: true
                      description: The dedicated host group instance view, which has
                        the list of instance view of the dedicated hosts under the
                        dedicated host group.
                      properties:
                        hosts:
                          type: array
                          items:
                            type: object
                            properties:
                              assetId:
                                readOnly: true
                                type: string
                                description: Specifies the unique id of the dedicated
                                  physical machine on which the dedicated host resides.
                              availableCapacity:
                                description: Unutilized capacity of the dedicated
                                  host.
                                properties:
                                  allocatableVMs:
                                    type: array
                                    items:
                                      properties:
                                        vmSize:
                                          type: string
                                          description: VM size in terms of which the
                                            unutilized capacity is represented.
                                        count:
                                          type: number
                                          format: double
                                          description: Maximum number of VMs of size
                                            vmSize that can fit in the dedicated host's
                                            remaining capacity.
                                      description: Represents the dedicated host unutilized
                                        capacity in terms of a specific VM size.
                                    x-ms-identifiers: []
                                    description: The unutilized capacity of the dedicated
                                      host represented in terms of each VM size that
                                      is allowed to be deployed to the dedicated host.
                              statuses:
                                type: array
                                items:
                                  properties:
                                    code:
                                      type: string
                                      description: The status code.
                                    level:
                                      type: string
                                      description: The level code.
                                      enum:
                                      - Info
                                      - Warning
                                      - Error
                                      x-ms-enum:
                                        name: StatusLevelTypes
                                        modelAsString: false
                                    displayStatus:
                                      type: string
                                      description: The short localizable label for
                                        the status.
                                    message:
                                      type: string
                                      description: The detailed status message, including
                                        for alerts and error messages.
                                    time:
                                      type: string
                                      format: date-time
                                      description: The time of the status.
                                  type: object
                                  description: Instance view status.
