    get:
      tags:
      - VirtualMachineRunCommands
      operationId: VirtualMachineRunCommands_List
      description: Lists all available run commands for a subscription in a location.
      parameters:
      - name: location
        in: path
        required: true
        description: The location upon which run commands is queried.
        schema:
          type: string
          pattern: ^[-\w\._]+$
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials which uniquely identify Microsoft Azure
          subscription. The subscription ID forms part of the URI for every service
          call.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      properties:
                        $schema:
                          type: string
                          description: The VM run command schema.
                        id:
                          type: string
                          description: The VM run command id.
                        osType:
                          type: string
                          description: The Operating System type.
                          enum:
