                          type: array
                          readOnly: true
                          items:
                            type: string
                          description: The api versions that support this SKU.
                        costs:
                          type: array
                          readOnly: true
                          items:
                            properties:
                              meterID:
                                type: string
                                readOnly: true
                                description: Used for querying price from commerce.
                              quantity:
                                type: integer
                                readOnly: true
                                format: int64
