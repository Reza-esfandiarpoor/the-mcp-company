openapi: 3.0.0
info:
  title: ComputeManagementClient
  description: The Compute Management Client.
  version: 2019-04-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Compute/skus:
    get:
      tags:
      - Skus
      - AvailabilitySets
      operationId: ResourceSkus_List
      description: Gets the list of Microsoft.Compute SKUs available for your Subscription.
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials which uniquely identify Microsoft Azure
          subscription. The subscription ID forms part of the URI for every service
          call.
        schema:
          type: string
      - name: $filter
        in: query
        required: false
        description: The filter to apply on the operation. Only **location** filter
          is supported currently.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      properties:
                        resourceType:
                          readOnly: true
                          type: string
                          description: The type of resource the SKU applies to.
                        name:
                          readOnly: true
                          type: string
                          description: The name of SKU.
                        tier:
                          readOnly: true
                          type: string
                          description: Specifies the tier of virtual machines in a
                            scale set.<br /><br /> Possible Values:<br /><br /> **Standard**<br
                            /><br /> **Basic**
                        size:
                          readOnly: true
                          type: string
                          description: The Size of the SKU.
                        family:
                          readOnly: true
                          type: string
                          description: The Family of this particular SKU.
                        kind:
                          readOnly: true
                          type: string
                          description: The Kind of resources that are supported in
                            this SKU.
                        capacity:
                          readOnly: true
                          description: Specifies the number of virtual machines in
                            the scale set.
                          properties:
                            minimum:
                              type: integer
                              readOnly: true
                              format: int64
                              description: The minimum capacity.
                            maximum:
                              type: integer
                              readOnly: true
                              format: int64
                              description: The maximum capacity that can be set.
                            default:
                              type: integer
                              readOnly: true
                              format: int64
                              description: The default capacity.
                            scaleType:
                              type: string
                              readOnly: true
                              description: The scale type applicable to the sku.
                              enum:
                              - Automatic
                              - Manual
                              - None
                              x-ms-enum:
                                name: ResourceSkuCapacityScaleType
                                modelAsString: false
                        locations:
                          type: array
                          readOnly: true
                          items:
                            type: string
                          description: The set of locations that the SKU is available.
                        locationInfo:
                          type: array
                          readOnly: true
                          items:
                            properties:
                              location:
                                readOnly: true
                                type: string
                                description: Location of the SKU
                              zones:
                                readOnly: true
                                type: array
                                items:
                                  type: string
                                description: List of availability zones where the
                                  SKU is supported.
                              zoneDetails:
                                readOnly: true
                                type: array
                                items:
                                  properties:
                                    name:
                                      type: array
                                      readOnly: true
                                      items:
                                        type: string
                                      description: The set of zones that the SKU is
                                        available in with the specified capabilities.
                                    capabilities:
                                      type: array
                                      readOnly: true
                                      items:
                                        properties:
                                          name:
                                            type: string
                                            readOnly: true
                                            description: An invariant to describe
                                              the feature.
                                          value:
                                            type: string
                                            readOnly: true
                                            description: An invariant if the feature
                                              is measured by quantity.
                                        description: Describes The SKU capabilities
                                          object.
                                      description: A list of capabilities that are
                                        available for the SKU in the specified list
                                        of zones.
                                  description: Describes The zonal capabilities of
                                    a SKU.
                                description: Details of capabilities available to
                                  a SKU in specific zones.
                          description: A list of locations and availability zones
                            in those locations where the SKU is available.
