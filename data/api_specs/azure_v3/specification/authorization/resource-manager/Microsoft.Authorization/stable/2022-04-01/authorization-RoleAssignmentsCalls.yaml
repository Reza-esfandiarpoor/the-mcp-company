                            scope:
                              readOnly: true
                              type: string
                              description: The role assignment scope.
                            roleDefinitionId:
                              type: string
                              description: The role definition ID.
                            principalId:
                              type: string
                              description: The principal ID.
                            principalType:
                              type: string
                              description: The principal type of the assigned principal
                                ID.
                              enum:
                              - User
                              - Group
                              - ServicePrincipal
                              - ForeignGroup
                              - Device
                              default: User
                              x-ms-enum:
                                name: PrincipalType
                                modelAsString: true
                            description:
                              type: string
                              description: Description of role assignment
                            condition:
