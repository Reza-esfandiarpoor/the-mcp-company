                name: ApprovalMode
                modelAsString: true
            approvalStages:
              type: array
              items:
                description: The approval stage.
                type: object
                properties:
                  approvalStageTimeOutInDays:
                    type: integer
                    format: int32
                    description: The time in days when approval request would be timed
