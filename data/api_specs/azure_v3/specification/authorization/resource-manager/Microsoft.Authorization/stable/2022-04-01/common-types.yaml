                  isApproverJustificationRequired:
                    type: boolean
                    description: Determines whether approver need to provide justification
                      for his decision.
                  escalationTimeInMinutes:
                    type: integer
                    format: int32
                    description: The time in minutes when the approval request would
                      be escalated if the primary approver does not approve
                  primaryApprovers:
                    type: array
                    description: The primary approver of the request.
                    items:
                      description: The detail of a user.
                      type: object
                      properties:
                        userType:
