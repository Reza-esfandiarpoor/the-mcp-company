                            modelAsString: true
                        isBackup:
                          type: boolean
                          description: The value indicating whether the user is a
                            backup fallback approver
                        id:
                          type: string
                          description: The object id of the user.
                        description:
                          type: string
                          description: The description of the user.
                  isEscalationEnabled:
                    type: boolean
                    description: The value determine whether escalation feature is
