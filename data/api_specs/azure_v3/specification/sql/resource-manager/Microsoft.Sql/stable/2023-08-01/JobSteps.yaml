                                    of the T-SQL script to execute.
                                  type: string
                            output:
                              description: Output destination properties of the job
                                step.
                              required:
                              - serverName
                              - databaseName
                              - tableName
                              type: object
                              properties:
                                type:
                                  description: The output destination type.
                                  default: SqlDatabase
                                  enum:
                                  - SqlDatabase
                                  type: string
                                  x-ms-enum:
                                    name: JobStepOutputType
                                    modelAsString: true
