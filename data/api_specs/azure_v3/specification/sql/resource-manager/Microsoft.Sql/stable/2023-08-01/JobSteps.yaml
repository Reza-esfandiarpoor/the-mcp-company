                                  default: 1
                                  type: integer
                                maximumRetryIntervalSeconds:
                                  format: int32
                                  description: The maximum amount of time to wait
                                    between retries for job step execution.
                                  default: 120
                                  type: integer
                                retryIntervalBackoffMultiplier:
                                  format: float
                                  description: The backoff multiplier for the time
                                    between retries.
                                  default: 2
                                  type: number
                      description: ARM resource.
