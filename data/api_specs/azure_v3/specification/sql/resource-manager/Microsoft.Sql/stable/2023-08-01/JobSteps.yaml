                              description: The job step's index within the job. If
                                not specified when creating the job step, it will
                                be created as the last step. If not specified when
                                updating the job step, the step id is not modified.
                              type: integer
                            targetGroup:
                              description: The resource ID of the target group that
                                the job step will be executed on.
                              type: string
                            credential:
                              description: The resource ID of the job credential that
                                will be used to connect to the targets.
                              type: string
                            action:
