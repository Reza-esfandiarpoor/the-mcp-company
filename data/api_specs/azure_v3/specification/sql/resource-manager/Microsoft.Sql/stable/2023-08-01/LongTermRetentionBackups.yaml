      operationId: LongTermRetentionBackups_ListByLocation
      parameters:
      - name: locationName
        in: path
        description: The location of the database
        required: true
        schema:
          type: string
      - name: onlyLatestPerDatabase
        in: query
        description: Whether or not to only get the latest backup for each database.
        required: false
        schema:
          type: boolean
      - name: databaseState
        in: query
        description: Whether to query against just live databases, just deleted databases,
          or all databases.
        required: false
        x-ms-enum:
          name: databaseState
          modelAsString: true
        schema:
          type: string
          enum:
          - All
          - Live
          - Deleted
      - name: subscriptionId
