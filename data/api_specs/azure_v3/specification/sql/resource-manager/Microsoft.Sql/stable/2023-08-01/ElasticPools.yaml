            \ The user specified an invalid sku.\n\n * 400 InvalidTierSkuCombination\
            \ - The specified tier does not support the specified sku.\n\n * 400 ServerQuotaExceeded\
            \ - The server reached its limit for allowed Database Throughput Unit.\n\
            \n * 400 ElasticPoolAlreadyExists - The server already contains an elastic\
            \ pool with the specified name.\n\n * 400 SubscriptionVcoreQuotaExceeded\
            \ - Could not perform the operation because subscription would exceed\
