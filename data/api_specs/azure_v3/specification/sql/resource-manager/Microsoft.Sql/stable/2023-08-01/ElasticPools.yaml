                          readOnly: true
                        type:
                          description: Resource type.
                          type: string
                          readOnly: true
                        location:
                          description: Resource location.
                          type: string
                          x-ms-mutability:
                          - read
                          - create
                        tags:
                          description: Resource tags.
                          type: object
                          additionalProperties:
                            type: string
                        sku:
                          description: "The elastic pool SKU.\r\n\r\nThe list of SKUs\
                            \ may vary by region and support offer. To determine the\
                            \ SKUs (including the SKU name, tier/edition, family,\
                            \ and capacity) that are available to your subscription\
                            \ in an Azure region, use the `Capabilities_ListByLocation`\
                            \ REST API or the following command:\r\n\r\n```azurecli\r\
                            \naz sql elastic-pool list-editions -l <location> -o table\r\
                            \n````\r\n"
