openapi: 3.0.0
info:
  version: 2023-08-01
  title: SqlManagementClient
  description: The Azure SQL Database management API provides a RESTful set of web
    APIs that interact with Azure SQL Database services to manage your databases.
    The API enables users to create, retrieve, update, and delete databases, servers,
    and other entities.
servers:
- url: https://management.azure.com
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Sql/locations/{locationName}/capabilities:
    get:
      tags:
      - LocationCapabilities
      description: Gets the subscription capabilities available for the specified
        location.
      operationId: Capabilities_ListByLocation
      parameters:
      - name: locationName
        in: path
        description: The location name whose capabilities are retrieved.
        required: true
        schema:
          type: string
      - name: include
        in: query
        description: If specified, restricts the response to only include the selected
          item.
        required: false
        x-ms-enum:
          name: CapabilityGroup
          modelAsString: true
        schema:
          type: string
          enum:
          - supportedEditions
          - supportedElasticPoolEditions
          - supportedManagedInstanceVersions
          - supportedInstancePoolEditions
          - supportedManagedInstanceEditions
          - supportedJobAgentVersions
      - name: subscriptionId
        in: path
        description: The subscription ID that identifies an Azure subscription.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for the request.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the subscription location capabilities.
          content:
            application/json:
              schema:
                description: The location capability.
                type: object
                properties:
                  name:
                    description: The location name.
                    type: string
                    readOnly: true
                  supportedServerVersions:
                    description: The list of supported server versions.
                    type: array
