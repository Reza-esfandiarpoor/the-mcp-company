            application/json:
              schema:
                description: A list of managed instance's DTCs.
                type: object
                properties:
                  value:
                    description: Array of results.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          description: Resource ID.
                          type: string
                          readOnly: true
                        name:
                          description: Resource name.
                          type: string
                          readOnly: true
                        type:
                          description: Resource type.
                          type: string
                          readOnly: true
                        properties:
                          description: Resource properties.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            dtcEnabled:
                              description: Active status of managed instance DTC.
                              type: boolean
                            securitySettings:
                              description: Security settings of managed instance DTC.
                              type: object
                              properties:
                                transactionManagerCommunicationSettings:
                                  description: Transaction Manager communication settings
                                    of managed instance DTC.
                                  type: object
                                  properties:
                                    allowInboundEnabled:
                                      description: Allow Inbound traffic to managed
                                        instance DTC.
                                      type: boolean
                                    allowOutboundEnabled:
                                      description: Allow Outbound traffic of managed
                                        instance DTC.
                                      type: boolean
                                    authentication:
                                      description: Authentication type of managed
                                        instance DTC.
                                      type: string
