                              description: External dns suffix search list of managed
                                instance DTC.
                              type: array
                              items:
                                type: string
                            dtcHostNameDnsSuffix:
                              description: Host name dns suffix of managed instance
                                DTC.
                              type: string
                              readOnly: true
                            provisioningState:
                              description: Provisioning state of managed instance
                                DTC.
                              enum:
                              - Created
                              - InProgress
                              - Succeeded
                              - Failed
                              - Canceled
                              type: string
                              readOnly: true
                              x-ms-enum:
