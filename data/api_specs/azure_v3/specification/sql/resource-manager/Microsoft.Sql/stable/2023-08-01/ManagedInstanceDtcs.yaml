                                  description: Allow XA Transactions to managed instance
                                    DTC.
                                  type: boolean
                                snaLu6point2TransactionsEnabled:
                                  description: Allow SNA LU 6.2 Transactions to managed
                                    instance DTC.
                                  type: boolean
                                xaTransactionsDefaultTimeout:
                                  format: int32
                                  description: Default timeout for XA Transactions
                                    (in seconds).
                                  type: integer
                                xaTransactionsMaximumTimeout:
                                  format: int32
                                  description: Maximum timeout for XA Transactions
                                    (in seconds).
                                  type: integer
