openapi: 3.0.0
info:
  version: 2023-08-01
  title: SqlManagementClient
  description: The Azure SQL Database management API provides a RESTful set of web
    APIs that interact with Azure SQL Database services to manage your databases.
    The API enables users to create, retrieve, update, and delete databases, servers,
    and other entities.
servers:
- url: https://management.azure.com
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Sql/instancePools/{instancePoolName}/usages
  : get:
      tags:
      - Usages
      description: Gets all instance pool usage metrics
      operationId: Usages_ListByInstancePool
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group that contains the resource. You
          can obtain this value from the Azure Resource Manager API or the portal.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: instancePoolName
        in: path
        description: The name of the instance pool to be retrieved.
        required: true
        schema:
          type: string
      - name: expandChildren
        in: query
        description: Optional request parameter to include managed instance usages
          within the instance pool.
        required: false
        schema:
          type: boolean
      - name: subscriptionId
        in: path
        description: The subscription ID that identifies an Azure subscription.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for the request.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the instance pool usages.
          content:
            application/json:
              schema:
                description: A list of usages.
                type: object
                properties:
                  value:
                    description: Array of results.
                    type: array
                    items:
                      description: ARM usage.
                      type: object
                      properties:
                        id:
                          description: Resource ID.
                          type: string
                          readOnly: true
                        name:
                          description: Resource name.
                          readOnly: true
                          type: object
                          properties:
                            value:
                              description: Usage name value
                              type: string
                            localizedValue:
                              description: Usage name localized value.
                              type: string
                        type:
                          description: Resource type.
                          type: string
                          readOnly: true
                        unit:
                          description: Usage unit.
                          type: string
                          readOnly: true
                        currentValue:
                          format: int32
                          description: Usage current value.
                          type: integer
                          readOnly: true
                        limit:
                          format: int32
                          description: Usage limit.
                          type: integer
                          readOnly: true
                        requestedLimit:
                          format: int32
                          description: Usage requested limit.
                          type: integer
                          readOnly: true
                    readOnly: true
                  nextLink:
                    description: Link to retrieve next page of results.
                    type: string
                    readOnly: true
        default:
          description: "*** Error Responses: ***\n\n * 400 InstancePoolWrongUsageName\
            \ - Request for an instance pool's usage has an unsupported usage name\n\
            \n * 400 InstancePoolManagedInstanceInfoUnavailable - Information for\
            \ managed instances inside this instance pool is not available\n\n * 404\
            \ InstancePoolNotFound - An instance pool cannot be found"
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
