openapi: 3.0.0
info:
  title: BlueprintClient
  description: Azure Blueprints Client provides access to blueprint definitions, assignments,
    and artifacts, and related blueprint operations.
  version: 2018-11-01-preview
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /{resourceScope}/providers/Microsoft.Blueprint/blueprintAssignments/{assignmentName}:
    put:
      tags:
      - Assignment
      operationId: Assignments_CreateOrUpdate
      description: Create or update a blueprint assignment.
      parameters:
      - name: api-version
        in: query
        required: true
        x-ms-parameter-location: client
        description: Client API Version.
        schema:
          type: string
      - name: resourceScope
        in: path
        required: true
        description: 'The scope of the resource. Valid scopes are: management group
          (format: ''/providers/Microsoft.Management/managementGroups/{managementGroup}''),
          subscription (format: ''/subscriptions/{subscriptionId}'').'
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: assignmentName
        in: path
        required: true
        x-ms-parameter-location: method
        description: Name of the blueprint assignment.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  readOnly: true
                  type: string
                  description: String Id used to locate any resource on Azure.
                type:
                  readOnly: true
                  type: string
                  description: Type of this resource.
                name:
                  readOnly: true
                  type: string
                  description: Name of this resource.
                location:
                  type: string
                  description: The location of this blueprint assignment.
                  x-ms-mutability:
                  - read
                  - create
                identity:
                  description: Managed identity for this blueprint assignment.
                  type: object
                  properties:
                    type:
                      type: string
                      description: Type of the managed identity.
                      enum:
                      - None
                      - SystemAssigned
                      - UserAssigned
                      x-ms-enum:
                        name: ManagedServiceIdentityType
                        modelAsString: true
                    principalId:
                      type: string
                      description: Azure Active Directory principal ID associated
                        with this Identity.
                    tenantId:
                      type: string
                      description: ID of the Azure Active Directory.
                    userAssignedIdentities:
                      type: object
                      description: The list of user-assigned managed identities associated
                        with the resource. Key is the Azure resource Id of the managed
                        identity.
                      additionalProperties:
                        description: User-assigned managed identity.
                        type: object
                        properties:
                          principalId:
                            type: string
                            description: Azure Active Directory principal ID associated
                              with this Identity.
                          clientId:
                            type: string
                            description: Client App Id associated with this identity.
                  required:
                  - type
                properties:
                  type: object
                  properties:
                    displayName:
                      type: string
                      description: One-liner string explain this resource.
                      maxLength: 256
                    description:
                      type: string
                      description: Multi-line explain this resource.
                      maxLength: 500
                    blueprintId:
                      type: string
                      description: ID of the published version of a blueprint definition.
                    scope:
                      type: string
                      description: 'The target subscription scope of the blueprint
                        assignment (format: ''/subscriptions/{subscriptionId}'').
                        For management group level assignments, the property is required.'
                    parameters:
                      type: object
                      description: Blueprint assignment parameter values.
                      additionalProperties:
                        description: Key/Value pair of parameter fulfillment.
                        type: object
                        properties:
                          value:
                            type: object
                            description: Parameter value. Any valid JSON value is
                              allowed including objects, arrays, strings, numbers
                              and booleans.
                          reference:
                            type: object
                            description: Parameter value as reference type.
                            properties:
                              keyVault:
                                description: Specifies the reference to a given Azure
                                  Key Vault.
                                type: object
                                properties:
                                  id:
                                    description: Azure resource ID of the Key Vault.
                                    type: string
                                required:
                                - id
                              secretName:
                                description: Name of the secret.
                                type: string
                              secretVersion:
                                description: The version of the secret to use. If
                                  left blank, the latest version of the secret is
                                  used.
                                type: string
                            required:
                            - keyVault
                            - secretName
                    resourceGroups:
                      description: Names and locations of resource group placeholders.
                      type: object
                      additionalProperties:
                        description: Represents an Azure resource group.
                        type: object
                        properties:
                          name:
                            type: string
                            description: Name of the resource group.
                            minLength: 1
                            maxLength: 90
                          location:
                            type: string
                            description: Location of the resource group.
                    status:
                      type: object
                      properties:
                        timeCreated:
                          type: string
                          format: date-time
                          readOnly: true
                          description: Creation time of this blueprint definition.
                        lastModified:
                          type: string
                          format: date-time
                          readOnly: true
                          description: Last modified time of this blueprint definition.
                        managedResources:
                          type: array
                          description: List of resources that were created by the
                            blueprint assignment.
                          readOnly: true
                          items:
                            type: string
                      description: Shared status properties between all blueprint
                        resources.
                      readOnly: true
                    locks:
                      description: Defines how resources deployed by a blueprint assignment
                        are locked.
                      type: object
                      properties:
                        mode:
                          type: string
                          description: Lock mode.
                          enum:
                          - None
                          - AllResourcesReadOnly
                          - AllResourcesDoNotDelete
                          x-ms-enum:
                            name: AssignmentLockMode
                            modelAsString: true
                        excludedPrincipals:
                          type: array
                          description: List of AAD principals excluded from blueprint
                            locks. Up to 5 principals are permitted.
                          items:
                            type: string
                        excludedActions:
                          type: array
                          description: "List\_of\_management\_operations\_that\_are\_\
                            excluded\_from\_blueprint\_locks.\_Up\_to\_200\_actions\_\
                            are\_permitted. If the lock mode is set to 'AllResourcesReadOnly',\
                            \ then the following actions are automatically appended\
                            \ to 'excludedActions': '*/read', 'Microsoft.Network/virtualNetworks/subnets/join/action'\
                            \ and 'Microsoft.Authorization/locks/delete'. If the lock\
                            \ mode is set to 'AllResourcesDoNotDelete', then the following\
                            \ actions are automatically appended to 'excludedActions':\
                            \ 'Microsoft.Authorization/locks/delete'. Duplicate actions\
                            \ will get removed."
                          items:
                            type: string
