                      type: string
                      readOnly: true
                      description: State of the blueprint assignment.
                      enum:
                      - creating
                      - validating
                      - waiting
                      - deploying
                      - cancelling
                      - locking
                      - succeeded
                      - failed
                      - canceled
                      - deleting
                      x-ms-enum:
                        name: AssignmentProvisioningState
                        modelAsString: true
