                        enum:
                        - BuiltInRole
                        - CustomRole
                        description: Indicates whether the Role Definition was built-in
                          or user created.
                        x-ms-enum:
                          name: MongoRoleDefinitionType
                          modelAsString: false
                      databaseName:
                        type: string
                        description: The database name for which access is being granted
                          for this Role Definition.
