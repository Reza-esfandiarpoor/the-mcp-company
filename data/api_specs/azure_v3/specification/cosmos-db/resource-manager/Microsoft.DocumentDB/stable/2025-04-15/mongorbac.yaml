                                  description: The database name the role is applied.
                                collection:
                                  type: string
                                  description: The collection name the role is applied.
                              description: An Azure Cosmos DB Mongo DB Resource.
                            actions:
                              type: array
                              items:
                                type: string
                              description: An array of actions that are allowed.
                          description: The set of data plane operations permitted
                            through this Role Definition.
                        description: A set of privileges contained by the Role Definition.
                          This will allow application of this Role Definition on the
                          entire database account or any underlying Database / Collection.
                          Scopes higher than Database are not enforceable as privilege.
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            db:
                              type: string
                              description: The database name the role is applied.
                            role:
                              type: string
                              description: The role name.
