  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/cassandraClusters/{clusterName}
  : get:
      operationId: CassandraClusters_Get
      description: Get the properties of a managed Cassandra cluster.
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: clusterName
        in: path
        required: true
        x-ms-parameter-location: method
        description: Managed Cassandra cluster name.
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
