                              properties:
                                _rid:
                                  type: string
                                  readOnly: true
                                  description: A system generated property. A unique
                                    identifier.
                                operationType:
                                  type: string
                                  readOnly: true
                                  description: The operation type of this database
                                    event.
                                  enum:
                                  - Create
                                  - Replace
                                  - Delete
                                  - Recreate
                                  - SystemOperation
                                  x-ms-enum:
                                    name: OperationType
                                    modelAsString: true
                                canUndelete:
                                  type: string
                                  readOnly: true
                                  description: A state of this database to identify
                                    if this database is restorable in same account.
                                canUndeleteReason:
                                  type: string
                                  readOnly: true
                                  description: The reason why this database can not
                                    be restored in same account.
                                eventTimestamp:
                                  type: string
                                  readOnly: true
                                  description: The time when this database event happened.
                                ownerId:
                                  type: string
                                  readOnly: true
                                  description: The name of the SQL database.
                                ownerResourceId:
                                  type: string
                                  readOnly: true
                                  description: The resource ID of the SQL database.
                                database:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: Name of the Cosmos DB SQL database
                                    restoreParameters:
                                      type: object
                                      properties:
                                        restoreSource:
                                          type: string
                                          description: 'The id of the restorable database
                                            account from which the restore has to
                                            be initiated. For example: /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts/{restorableDatabaseAccountName}'
                                        restoreTimestampInUtc:
                                          type: string
                                          format: date-time
                                          description: Time to which the account has
                                            to be restored (ISO-8601 format).
                                        restoreWithTtlDisabled:
                                          type: boolean
                                          description: Specifies whether the restored
                                            account will have Time-To-Live disabled
                                            upon the successful restore.
                                      description: Parameters to indicate the information
                                        about the restore.
                                      x-ms-mutability:
