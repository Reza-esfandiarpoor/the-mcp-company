openapi: 3.0.0
info:
  title: Cosmos DB
  description: Azure Cosmos DB Database Service Resource Provider REST API
  version: 2025-04-15
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts:
    get:
      operationId: RestorableDatabaseAccounts_ListByLocation
      description: Lists all the restorable Azure Cosmos DB database accounts available
        under the subscription and in a region.  This call requires 'Microsoft.DocumentDB/locations/restorableDatabaseAccounts/read'
        permission.
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: location
        in: path
        required: true
        x-ms-parameter-location: method
        description: Cosmos DB region, with spaces between words and each word capitalized.
        schema:
          type: string
      responses:
        '200':
          description: The operation completed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    readOnly: true
                    type: array
                    items:
                      description: A Azure Cosmos DB restorable database account.
                      type: object
                      properties:
                        properties:
                          type: object
                          x-ms-client-flatten: true
                          description: The properties of a restorable database account.
                          properties:
                            accountName:
                              type: string
                              description: The name of the global database account
                            creationTime:
                              type: string
                              format: date-time
                              description: The creation time of the restorable database
                                account (ISO-8601 format).
                            deletionTime:
                              type: string
                              format: date-time
                              description: The time at which the restorable database
                                account has been deleted (ISO-8601 format).
                            oldestRestorableTime:
                              type: string
                              format: date-time
                              description: The least recent time at which the database
                                account can be restored to (ISO-8601 format).
                            apiType:
                              type: string
                              readOnly: true
                              description: The API type of the restorable database
                                account.
                              enum:
                              - MongoDB
                              - Gremlin
                              - Cassandra
                              - Table
                              - Sql
                              - GremlinV2
                              x-ms-enum:
                                name: ApiType
                                modelAsString: true
                            restorableLocations:
                              type: array
                              readOnly: true
                              description: List of regions where the of the database
                                account can be restored from.
                              items:
                                type: object
                                description: Properties of the regional restorable
                                  account.
                                properties:
                                  locationName:
                                    type: string
                                    readOnly: true
                                    description: The location of the regional restorable
                                      account.
                                  regionalDatabaseAccountInstanceId:
                                    type: string
                                    readOnly: true
                                    description: The instance id of the regional restorable
                                      account.
                                  creationTime:
                                    type: string
                                    readOnly: true
                                    format: date-time
                                    description: The creation time of the regional
                                      restorable database account (ISO-8601 format).
                                  deletionTime:
                                    type: string
                                    readOnly: true
                                    format: date-time
                                    description: The time at which the regional restorable
                                      database account has been deleted (ISO-8601
                                      format).
                        id:
                          readOnly: true
                          type: string
                          description: The unique resource identifier of the ARM resource.
                        name:
                          readOnly: true
                          type: string
                          description: The name of the ARM resource.
                        type:
                          readOnly: true
                          type: string
                          description: The type of Azure resource.
                        location:
                          type: string
                          description: The location of the resource group to which
                            the resource belongs.
                    description: List of restorable database accounts and their properties.
                description: The List operation response, that contains the restorable
                  database accounts and their properties.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                x-ms-external: true
                description: An error response from the service.
                properties:
                  error:
                    properties:
                      code:
                        description: Error code.
                        type: string
                      message:
                        description: Error message indicating why the operation failed.
                        type: string
                    description: Error Response.
      x-ms-pageable: {}
