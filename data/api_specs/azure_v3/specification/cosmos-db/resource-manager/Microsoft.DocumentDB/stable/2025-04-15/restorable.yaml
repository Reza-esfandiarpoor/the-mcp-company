  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DocumentDB/databaseAccounts/{accountName}/sqlDatabases/{databaseName}/containers/{containerName}/retrieveContinuousBackupInformation
  : post:
      operationId: SqlResources_RetrieveContinuousBackupInformation
      description: Retrieves continuous backup information for a container resource.
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group. The name is case insensitive.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: accountName
        in: path
        required: true
        x-ms-parameter-location: method
        description: Cosmos DB database account name.
        schema:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*
      - name: databaseName
        in: path
        required: true
        x-ms-parameter-location: method
        description: Cosmos DB database name.
        schema:
          type: string
      - name: containerName
        in: path
        required: true
        x-ms-parameter-location: method
        description: Cosmos DB container name.
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Properties of the regional restorable account.
              properties:
                location:
                  type: string
                  description: The name of the continuous backup restore location.
        description: The name of the continuous backup restore location.
        required: true
      responses:
        '200':
          description: The Sql container retrieve backup information operation completed
            successfully.
          content:
            application/json:
              schema:
                description: Backup information of a resource.
                type: object
                properties:
                  continuousBackupInformation:
                    description: Information about the status of continuous backups.
                    type: object
                    readOnly: true
                    properties:
                      latestRestorableTimestamp:
                        type: string
                        description: The latest restorable timestamp for a resource.
        '202':
          description: The sql container retrieve backup information operation will
            complete asynchronously.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                x-ms-external: true
                description: An error response from the service.
                properties:
                  error:
                    properties:
                      code:
                        description: Error code.
                        type: string
                      message:
                        description: Error message indicating why the operation failed.
                        type: string
                    description: Error Response.
  ? /subscriptions/{subscriptionId}/providers/Microsoft.DocumentDB/locations/{location}/restorableDatabaseAccounts/{instanceId}/restorableSqlDatabases
