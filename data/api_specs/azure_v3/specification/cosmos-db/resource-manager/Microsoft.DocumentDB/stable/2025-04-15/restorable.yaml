                                    _users:
                                      type: string
                                      readOnly: true
                                      description: A system generated property that
                                        specifies the addressable path of the users
                                        resource.
                                    _self:
                                      type: string
                                      readOnly: true
                                      description: A system generated property that
                                        specifies the addressable path of the database
