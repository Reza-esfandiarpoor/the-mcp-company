                              to allow 10% of applications to be unhealthy, this value
                              would be 10.


                              The percentage represents the maximum tolerated percentage
                              of applications that can be unhealthy before the cluster
                              is considered in error.

                              If the percentage is respected but there is at least
                              one unhealthy application, the health is evaluated as
                              Warning.

                              This is calculated by dividing the number of unhealthy
                              applications over the total number of application instances
                              in the cluster, excluding applications of application
                              types that are included in the ApplicationTypeHealthPolicyMap.

