    ApplicationHealthPolicy:
      type: object
      description: 'Defines a health policy used to evaluate the health of an application
        or one of its children entities.

        '
      required:
      - considerWarningAsError
      - maxPercentUnhealthyDeployedApplications
      properties:
        considerWarningAsError:
          type: boolean
          description: Indicates whether warnings are treated with the same severity
            as errors.
        maxPercentUnhealthyDeployedApplications:
          type: integer
          format: int32
          description: 'The maximum allowed percentage of unhealthy deployed applications.
            Allowed values are Byte values from zero to 100.

            The percentage represents the maximum tolerated percentage of deployed
            applications that can be unhealthy before the application is considered
            in error.

            This is calculated by dividing the number of unhealthy deployed applications
            over the number of nodes where the application is currently deployed on
            in the cluster.

            The computation rounds up to tolerate one failure on small numbers of
            nodes. Default percentage is zero.

            '
        defaultServiceTypeHealthPolicy:
          description: The health policy used by default to evaluate the health of
            a service type.
          type: object
          required:
          - maxPercentUnhealthyServices
          - maxPercentUnhealthyPartitionsPerService
          - maxPercentUnhealthyReplicasPerPartition
          properties:
            maxPercentUnhealthyServices:
              type: integer
              format: int32
              description: 'The maximum allowed percentage of unhealthy services.


                The percentage represents the maximum tolerated percentage of services
                that can be unhealthy before the application is considered in error.

                If the percentage is respected but there is at least one unhealthy
                service, the health is evaluated as Warning.

                This is calculated by dividing the number of unhealthy services of
                the specific service type over the total number of services of the
                specific service type.

                The computation rounds up to tolerate one failure on small numbers
                of services.

                '
              minimum: 0
              maximum: 100
            maxPercentUnhealthyPartitionsPerService:
              type: integer
              format: int32
              description: 'The maximum allowed percentage of unhealthy partitions
                per service.


                The percentage represents the maximum tolerated percentage of partitions
                that can be unhealthy before the service is considered in error.

                If the percentage is respected but there is at least one unhealthy
                partition, the health is evaluated as Warning.

