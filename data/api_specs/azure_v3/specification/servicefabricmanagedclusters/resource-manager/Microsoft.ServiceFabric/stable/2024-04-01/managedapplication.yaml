                      lastModifiedByType:
                        type: string
                        description: The type of identity that last modified the resource.
                      lastModifiedAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource last modification (UTC).
                  properties:
                    type: object
                    properties:
                      placementConstraints:
                        type: string
                        description: 'The placement constraints as a string. Placement
                          constraints are boolean expressions on node properties and
                          allow for restricting a service to particular nodes based
                          on the service requirements. For example, to place a service
                          on nodes where NodeType is blue specify the following: "NodeColor
                          == blue)".'
                      correlationScheme:
                        type: array
                        items:
                          type: object
                          description: Creates a particular correlation between services.
                          required:
                          - scheme
                          - serviceName
                          properties:
                            scheme:
                              description: The ServiceCorrelationScheme which describes
                                the relationship between this service and the service
                                specified via ServiceName.
                              type: string
                              enum:
                              - AlignedAffinity
                              - NonAlignedAffinity
                              x-ms-enum:
                                name: ServiceCorrelationScheme
                                modelAsString: true
                                values:
                                - value: AlignedAffinity
                                  description: Aligned affinity ensures that the primaries
                                    of the partitions of the affinitized services
                                    are collocated on the same nodes. This is the
                                    default and is the same as selecting the Affinity
                                    scheme. The value is 0.
                                - value: NonAlignedAffinity
                                  description: Non-Aligned affinity guarantees that
                                    all replicas of each service will be placed on
                                    the same nodes. Unlike Aligned Affinity, this
                                    does not guarantee that replicas of particular
                                    role will be collocated. The value is 1.
                            serviceName:
