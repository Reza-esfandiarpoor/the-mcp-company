              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Azure resource identifier.
                    readOnly: true
                  name:
                    type: string
                    description: Azure resource name.
                    readOnly: true
                  type:
                    type: string
                    description: Azure resource type.
                    readOnly: true
                  location:
                    type: string
                    description: Resource location depends on the parent resource.
                    x-ms-mutability:
                    - create
                    - read
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: Azure resource tags.
                    x-ms-mutability:
                    - create
                    - read
                  systemData:
                    description: Metadata pertaining to creation and last modification
                      of the resource.
                    type: object
                    readOnly: true
                    properties:
