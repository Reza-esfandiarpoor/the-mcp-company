                                    which indicates that a particular fault or upgrade
                                    domain cannot be used for placement of this service.
                                    The value is 0.
                                - value: RequiredDomain
                                  description: Indicates that the ServicePlacementPolicyDescription
                                    is of type ServicePlacementRequireDomainDistributionPolicyDescription
