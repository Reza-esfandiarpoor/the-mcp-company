  securitySchemes:
    azure_auth:
      description: Azure Active Directory OAuth2 Flow
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    RuntimeFailureAction:
      type: string
      description: 'The compensating action to perform when a Monitored upgrade encounters
        monitoring policy or health policy violations.

        Rollback specifies that the upgrade will start rolling back automatically.

        Manual indicates that the upgrade will switch to UnmonitoredManual upgrade
        mode.

        '
      enum:
      - Rollback
      - Manual
      x-ms-enum:
        name: FailureAction
        modelAsString: true
        values:
        - value: Rollback
          description: The upgrade will start rolling back automatically. The value
            is 0
        - value: Manual
          description: The upgrade will switch to UnmonitoredManual upgrade mode.
            The value is 1
    RuntimeResumeApplicationUpgradeParameters:
      type: object
      properties:
        upgradeDomainName:
          description: The upgrade domain name. Expected to be the next upgrade domain
            if the application is upgrading.
          type: string
      description: Parameters for Resume Upgrade action. The upgrade domain name must
        be specified.
    RuntimeUpgradeMode:
      type: string
      description: The mode used to monitor health during a rolling upgrade. The values
        are UnmonitoredAuto, UnmonitoredManual, Monitored, and UnmonitoredDeferred.
      enum:
      - UnmonitoredAuto
      - UnmonitoredManual
      - Monitored
      default: Monitored
      x-ms-enum:
        name: UpgradeMode
        modelAsString: true
        values:
        - value: UnmonitoredAuto
          description: The upgrade will proceed automatically without performing any
            health monitoring. The value is 0
        - value: UnmonitoredManual
          description: The upgrade will stop after completing each upgrade domain,
            giving the opportunity to manually monitor health before proceeding. The
            value is 1
        - value: Monitored
          description: The upgrade will stop after completing each upgrade domain
            and automatically monitor health before proceeding. The value is 2
    AddRemoveIncrementalNamedPartitionScalingMechanism:
      type: object
      properties:
        kind:
          description: Specifies the mechanism associated with this scaling policy.
          type: string
          enum:
          - ScalePartitionInstanceCount
          - AddRemoveIncrementalNamedPartition
          x-ms-enum:
            name: ServiceScalingMechanismKind
            modelAsString: true
            values:
            - value: ScalePartitionInstanceCount
              description: Represents a scaling mechanism for adding or removing instances
                of stateless service partition. The value is 0.
            - value: AddRemoveIncrementalNamedPartition
              description: Represents a scaling mechanism for adding or removing named
                partitions of a stateless service. The value is 1.
