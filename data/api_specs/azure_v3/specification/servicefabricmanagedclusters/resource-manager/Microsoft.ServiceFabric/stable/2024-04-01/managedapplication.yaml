    ServiceTypeHealthPolicy:
      type: object
      description: 'Represents the health policy used to evaluate the health of services
        belonging to a service type.

        '
      required:
      - maxPercentUnhealthyServices
      - maxPercentUnhealthyPartitionsPerService
      - maxPercentUnhealthyReplicasPerPartition
      properties:
        maxPercentUnhealthyServices:
          type: integer
          format: int32
          description: 'The maximum allowed percentage of unhealthy services.


            The percentage represents the maximum tolerated percentage of services
            that can be unhealthy before the application is considered in error.

            If the percentage is respected but there is at least one unhealthy service,
            the health is evaluated as Warning.

            This is calculated by dividing the number of unhealthy services of the
            specific service type over the total number of services of the specific
            service type.

            The computation rounds up to tolerate one failure on small numbers of
            services.

            '
          minimum: 0
          maximum: 100
        maxPercentUnhealthyPartitionsPerService:
          type: integer
          format: int32
          description: 'The maximum allowed percentage of unhealthy partitions per
            service.


            The percentage represents the maximum tolerated percentage of partitions
            that can be unhealthy before the service is considered in error.

            If the percentage is respected but there is at least one unhealthy partition,
            the health is evaluated as Warning.

            The percentage is calculated by dividing the number of unhealthy partitions
            over the total number of partitions in the service.

            The computation rounds up to tolerate one failure on small numbers of
            partitions.

            '
          minimum: 0
          maximum: 100
        maxPercentUnhealthyReplicasPerPartition:
          type: integer
          format: int32
          description: 'The maximum allowed percentage of unhealthy replicas per partition.


            The percentage represents the maximum tolerated percentage of replicas
            that can be unhealthy before the partition is considered in error.

            If the percentage is respected but there is at least one unhealthy replica,
            the health is evaluated as Warning.

            The percentage is calculated by dividing the number of unhealthy replicas
            over the total number of replicas in the partition.

            The computation rounds up to tolerate one failure on small numbers of
            replicas.

            '
          minimum: 0
          maximum: 100
    ServiceTypeHealthPolicyMap:
      type: object
      description: 'Defines a ServiceTypeHealthPolicy per service type name.


        The entries in the map replace the default service type health policy for
        each specified service type.

        For example, in an application that contains both a stateless gateway service
        type and a stateful engine service type, the health policies for the stateless
        and stateful services can be configured differently.

        With policy per service type, there''s more granular control of the health
        of the service.


        If no policy is specified for a service type name, the DefaultServiceTypeHealthPolicy
        is used for evaluation.

        '
      additionalProperties:
        type: object
        description: 'Represents the health policy used to evaluate the health of
          services belonging to a service type.

          '
        required:
        - maxPercentUnhealthyServices
        - maxPercentUnhealthyPartitionsPerService
        - maxPercentUnhealthyReplicasPerPartition
        properties:
          maxPercentUnhealthyServices:
            type: integer
            format: int32
            description: 'The maximum allowed percentage of unhealthy services.


              The percentage represents the maximum tolerated percentage of services
              that can be unhealthy before the application is considered in error.

              If the percentage is respected but there is at least one unhealthy service,
              the health is evaluated as Warning.

              This is calculated by dividing the number of unhealthy services of the
              specific service type over the total number of services of the specific
              service type.

              The computation rounds up to tolerate one failure on small numbers of
              services.

              '
            minimum: 0
            maximum: 100
          maxPercentUnhealthyPartitionsPerService:
            type: integer
            format: int32
            description: 'The maximum allowed percentage of unhealthy partitions per
              service.


              The percentage represents the maximum tolerated percentage of partitions
              that can be unhealthy before the service is considered in error.

              If the percentage is respected but there is at least one unhealthy partition,
              the health is evaluated as Warning.

              The percentage is calculated by dividing the number of unhealthy partitions
              over the total number of partitions in the service.

              The computation rounds up to tolerate one failure on small numbers of
              partitions.

              '
            minimum: 0
            maximum: 100
          maxPercentUnhealthyReplicasPerPartition:
            type: integer
            format: int32
            description: 'The maximum allowed percentage of unhealthy replicas per
              partition.


              The percentage represents the maximum tolerated percentage of replicas
              that can be unhealthy before the partition is considered in error.

              If the percentage is respected but there is at least one unhealthy replica,
              the health is evaluated as Warning.

              The percentage is calculated by dividing the number of unhealthy replicas
              over the total number of replicas in the partition.

              The computation rounds up to tolerate one failure on small numbers of
              replicas.

              '
            minimum: 0
            maximum: 100
