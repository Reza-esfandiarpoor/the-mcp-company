        forceRestart:
          type: boolean
          description: If true, then processes are forcefully restarted during upgrade
            even when the code version has not changed (the upgrade only changes configuration
            or data).
          default: false
        rollingUpgradeMonitoringPolicy:
          type: object
          description: The policy used for monitoring the application upgrade
          required:
          - failureAction
          - healthCheckWaitDuration
          - healthCheckStableDuration
          - healthCheckRetryTimeout
          - upgradeTimeout
          - upgradeDomainTimeout
          properties:
            failureAction:
              type: string
              description: The compensating action to perform when a Monitored upgrade
                encounters monitoring policy or health policy violations. Invalid
                indicates the failure action is invalid. Rollback specifies that the
                upgrade will start rolling back automatically. Manual indicates that
                the upgrade will switch to UnmonitoredManual upgrade mode.
              enum:
              - Rollback
              - Manual
              x-ms-enum:
                name: FailureAction
                modelAsString: true
                values:
                - value: Rollback
                  description: Indicates that a rollback of the upgrade will be performed
                    by Service Fabric if the upgrade fails.
                - value: Manual
                  description: Indicates that a manual repair will need to be performed
                    by the administrator if the upgrade fails. Service Fabric will
                    not proceed to the next upgrade domain automatically.
            healthCheckWaitDuration:
              type: string
              x-ms-format: duration-constant
              description: The amount of time to wait after completing an upgrade
                domain before applying health policies. It is interpreted as a string
                representing an ISO 8601 duration with following format "hh:mm:ss.fff".
            healthCheckStableDuration:
              type: string
              x-ms-format: duration-constant
              description: The amount of time that the application or cluster must
                remain healthy before the upgrade proceeds to the next upgrade domain.
                It is interpreted as a string representing an ISO 8601 duration with
                following format "hh:mm:ss.fff".
            healthCheckRetryTimeout:
              type: string
              description: The amount of time to retry health evaluation when the
                application or cluster is unhealthy before FailureAction is executed.
                It is interpreted as a string representing an ISO 8601 duration with
                following format "hh:mm:ss.fff".
            upgradeTimeout:
              type: string
              description: The amount of time the overall upgrade has to complete
                before FailureAction is executed. Cannot be larger than 12 hours.
                It is interpreted as a string representing an ISO 8601 duration with
                following format "hh:mm:ss.fff".
            upgradeDomainTimeout:
              type: string
              description: The amount of time each upgrade domain has to complete
                before FailureAction is executed. Cannot be larger than 12 hours.
                It is interpreted as a string representing an ISO 8601 duration with
                following format "hh:mm:ss.fff".
        instanceCloseDelayDuration:
          type: integer
          format: int64
          description: Duration in seconds, to wait before a stateless instance is
            closed, to allow the active requests to drain gracefully. This would be
            effective when the instance is closing during the application/cluster
            upgrade, only for those instances which have a non-zero delay duration
            configured in the service description.
        upgradeMode:
          type: string
          description: The mode used to monitor health during a rolling upgrade. The
            values are Monitored, and UnmonitoredAuto.
          enum:
          - Monitored
          - UnmonitoredAuto
          x-ms-enum:
            name: RollingUpgradeMode
            modelAsString: true
            values:
            - value: Monitored
              description: The upgrade will stop after completing each upgrade domain
                and automatically monitor health before proceeding. The value is 0.
            - value: UnmonitoredAuto
              description: The upgrade will proceed automatically without performing
                any health monitoring. The value is 1.
        upgradeReplicaSetCheckTimeout:
          type: integer
          format: int64
          description: The maximum amount of time to block processing of an upgrade
            domain and prevent loss of availability when there are unexpected issues.
            When this timeout expires, processing of the upgrade domain will proceed
            regardless of availability loss issues. The timeout is reset at the start
            of each upgrade domain. Valid values are between 0 and 42949672925 inclusive.
            (unsigned 32-bit integer).
