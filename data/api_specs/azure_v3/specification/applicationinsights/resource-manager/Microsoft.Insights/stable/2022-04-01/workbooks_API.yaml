        schema:
          type: string
          enum:
          - workbook
          - TSG
          - performance
          - retention
      - name: tags
        in: query
        required: false
        description: Tags presents on each workbook returned.
        x-ms-parameter-location: method
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: canFetchContent
        in: query
        required: false
        description: Flag indicating whether or not to return the full content for
          each applicable workbook. If false, only return summary content for workbooks.
