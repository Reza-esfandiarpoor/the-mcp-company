openapi: 3.0.0
info:
  title: ApplicationInsightsManagementClient
  description: Azure workbook resource type.
  version: 2022-04-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Insights/workbooks:
