                                tags field
                            userId:
                              type: string
                              description: Unique user id of the specific user that
                                owns this workbook.
                              readOnly: true
                            sourceId:
                              type: string
                              description: ResourceId for a source resource.
                            storageUri:
                              type: string
                              description: The resourceId to the storage account when
                                bring your own storage is used
                              nullable: true
                            description:
                              type: string
                              description: The description of the workbook.
                              nullable: true
                            revision:
                              type: string
                              description: The unique revision id for this workbook
