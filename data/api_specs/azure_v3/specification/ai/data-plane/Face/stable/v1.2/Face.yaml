  /facelists/{faceListId}/persistedfaces?_overload=addFaceListFace:
    post:
      operationId: FaceListOperations_AddFaceListFace
      summary: Add a face to a specified Face List, up to 1,000 faces.
      description: "To deal with an image containing multiple faces, input face can\
        \ be specified as an image with a targetFace rectangle. It returns a persistedFaceId\
        \ representing the added face. No image will be stored. Only the extracted\
        \ face feature(s) will be stored on server until \"Delete Face List Face\"\
        \ or \"Delete Face List\" is called.\n\nNote that persistedFaceId is different\
        \ from faceId generated by \"Detect\".\n\n>\n*\n  * Higher face image quality\
        \ means better recognition precision. Please consider high-quality faces:\
        \ frontal, clear, and face size is 200x200 pixels (100 pixels between eyes)\
        \ or bigger.\n  * JPEG, PNG, GIF (the first frame), and BMP format are supported.\
        \ The allowed image file size is from 1KB to 6MB.\n  * \"targetFace\" rectangle\
        \ should contain one face. Zero or multiple faces will be regarded as an error.\
        \ If the provided \"targetFace\" rectangle is not returned from \"Detect\"\
        , there's no guarantee to detect and add the face successfully.\n  * Out of\
        \ detectable face size (36x36 - 4096x4096 pixels), large head-pose, or large\
        \ occlusions will cause failures.\n  * The minimum detectable face size is\
        \ 36x36 pixels in an image no larger than 1920x1080 pixels. Images with dimensions\
        \ higher than 1920x1080 pixels will need a proportionally larger minimum face\
        \ size.\n  * Different 'detectionModel' values can be provided. To use and\
        \ compare different detection models, please refer to [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-detection-model)."
      parameters:
      - name: faceListId
        in: path
        description: Valid character is letter in lower case or digit or '-' or '_',
          maximum length is 64.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
      - $ref: '#/components/parameters/AddFaceOptions.targetFace'
      - $ref: '#/components/parameters/AddFaceOptions.detectionModel'
      - $ref: '#/components/parameters/AddFaceOptions.userData'
      requestBody:
        $ref: '#/components/requestBodies/FaceListOperations_AddFaceListFaceImagecontent'
      responses:
        '200':
          description: A successful call returns a new persistedFaceId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddFaceResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceErrorResponse'
  /findsimilars?_overload=findSimilarFromFaceList:
    post:
      operationId: FaceRecognitionOperations_FindSimilarFromFaceList
      summary: Given query face's faceId, to search the similar-looking faces from
        a Face List. A 'faceListId' is created by Create Face List.
      description: 'Depending on the input the returned similar faces list contains
        faceIds or persistedFaceIds ranked by similarity.


        Find similar has two working modes, "matchPerson" and "matchFace". "matchPerson"
        is the default mode that it tries to find faces of the same person as possible
        by using internal same-person thresholds. It is useful to find a known person''s
        other photos. Note that an empty list will be returned if no faces pass the
        internal thresholds. "matchFace" mode ignores same-person thresholds and returns
        ranked similar faces anyway, even the similarity is low. It can be used in
        the cases like searching celebrity-looking faces.


        The ''recognitionModel'' associated with the query faceId should be the same
        as the ''recognitionModel'' used by the target Face List.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceId:
                  $ref: '#/components/schemas/Azure.Core.uuid'
                maxNumOfCandidatesReturned:
                  type: integer
                  format: int32
                  description: The number of top similar faces returned. The valid
                    range is [1, 1000]. Default value is 20.
                  default: 20
                  minimum: 1
                  maximum: 1000
                mode:
                  type: string
                  description: Similar face searching mode. It can be 'matchPerson'
                    or 'matchFace'. Default value is 'matchPerson'.
                  default: matchPerson
                  enum:
                  - matchPerson
                  - matchFace
                  x-ms-enum:
                    name: FindSimilarMatchMode
                    modelAsString: true
                    values:
                    - name: matchPerson
                      value: matchPerson
                      description: Match person.
                    - name: matchFace
                      value: matchFace
                      description: Match face.
                faceListId:
                  type: string
                  description: An existing user-specified unique candidate Face List,
                    created in "Create Face List". Face List contains a set of persistedFaceIds
                    which are persisted and will never expire.
              required:
              - faceId
              - faceListId
        required: true
      responses:
        '200':
          description: A successful call returns an array of the most similar faces
            represented in faceId if the input parameter is faceIds or persistedFaceId
            if the input parameter is faceListId or largeFaceListId.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FindSimilarResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceErrorResponse'
