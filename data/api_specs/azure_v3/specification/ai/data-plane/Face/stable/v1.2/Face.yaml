                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
  /identify:
    post:
      operationId: FaceRecognitionOperations_IdentifyFromPersonGroup
      summary: 1-to-many identification to find the closest matches of the specific
        query person face from a Person Group.
      description: 'For each face in the faceIds array, Face Identify will compute
        similarities between the query face and all the faces in the Person Group
        (given by personGroupId), and return candidate person(s) for that face ranked
        by similarity confidence. The Person Group should be trained to make it ready
        for identification. See more in "Train Person Group".

        > [!NOTE]

        >

        > *

        >   * The algorithm allows more than one face to be identified independently
        at the same request, but no more than 10 faces.

        >   * Each person could have more than one face, but no more than 248 faces.

        >   * Higher face image quality means better identification precision. Please
        consider high-quality faces: frontal, clear, and face size is 200x200 pixels
        (100 pixels between eyes) or bigger.

        >   * Number of candidates returned is restricted by maxNumOfCandidatesReturned
        and confidenceThreshold. If no person is identified, the returned candidates
        will be an empty array.

        >   * Try "Find Similar" when you need to find similar faces from a Face List/Large
        Face List instead of a Person Group.

        >   * The ''recognitionModel'' associated with the query faces'' faceIds should
        be the same as the ''recognitionModel'' used by the target Person Group.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceIds:
                  type: array
                  description: Array of query faces faceIds, created by the "Detect".
                    Each of the faces are identified independently. The valid number
                    of faceIds is between [1, 10].
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uuid
                    description: Universally Unique Identifier
                personGroupId:
                  type: string
                  description: personGroupId of the target Person Group, created by
                    "Create Person Group". Parameter personGroupId and largePersonGroupId
                    should not be provided at the same time.
                maxNumOfCandidatesReturned:
                  type: integer
                  format: int32
                  description: The range of maxNumOfCandidatesReturned is between
                    1 and 100. Default value is 10.
                  default: 10
                  minimum: 1
                  maximum: 100
                confidenceThreshold:
                  type: number
                  format: float
                  description: Customized identification confidence threshold, in
                    the range of [0, 1]. Advanced user can tweak this value to override
                    default internal threshold for better precision on their scenario
                    data. Note there is no guarantee of this threshold value working
                    on other data and after algorithm updates.
                  minimum: 0
                  maximum: 1
              required:
              - faceIds
              - personGroupId
        required: true
      responses:
        '200':
          description: A successful call returns the identified candidate person(s)
            for each query face.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Identify result.
                  properties:
                    faceId:
                      description: faceId of the query face.
                      type: string
                      format: uuid
                    candidates:
                      type: array
                      description: Identified person candidates for that face (ranked
                        by confidence). Array size should be no larger than input
                        maxNumOfCandidatesReturned. If no person is identified, will
                        return an empty array.
                      items:
                        type: object
                        description: Candidate for identify call.
                        properties:
                          personId:
                            description: personId of candidate person.
                            type: string
                            format: uuid
                          confidence:
                            type: number
                            format: float
                            description: Confidence value of the candidate. The higher
                              confidence, the more similar. Range between [0,1].
                            minimum: 0
                            maximum: 1
                        required:
                        - personId
                        - confidence
                  required:
                  - faceId
                  - candidates
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
  /largefacelists:
    get:
      operationId: FaceListOperations_GetLargeFaceLists
      summary: List Large Face Lists' information of largeFaceListId, name, userData
        and recognitionModel.
      description: "To get face information inside largeFaceList use \"Get Large Face\
        \ List Face\".\n\nLarge Face Lists are stored in alphabetical order of largeFaceListId.\n\
        >\n*\n  * \"start\" parameter (string, optional) specifies an ID value from\
        \ which returned entries will have larger IDs based on string comparison.\
        \ Setting \"start\" to an empty value indicates that entries should be returned\
        \ starting from the first item.\n  * \"top\" parameter (int, optional) determines\
        \ the maximum number of entries to be returned, with a limit of up to 1000\
        \ entries per call. To retrieve additional entries beyond this limit, specify\
        \ \"start\" with the personId of the last entry returned in the current call.\n\
        \n> [!TIP]\n>\n> * For example, there are total 5 items with their IDs: \"\
        itemId1\", ..., \"itemId5\".\n>   * \"start=&top=\" will return all 5 items.\n\
        >   * \"start=&top=2\" will return \"itemId1\", \"itemId2\".\n>   * \"start=itemId2&top=3\"\
        \ will return \"itemId3\", \"itemId4\", \"itemId5\"."
      parameters:
      - name: start
        in: query
        description: List resources greater than the "start". It contains no more
          than 64 characters. Default is empty.
        required: false
        schema:
          type: string
      - name: top
        in: query
        description: The number of items to list, ranging in [1, 1000]. Default is
          1000.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 1000
      - name: returnRecognitionModel
        in: query
        description: Return 'recognitionModel' or not. The default value is false.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A successful call returns an array of Large Face Lists and
            their information (largeFaceListId, name and userData).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Large face list is a list of faces, up to 1,000,000
                    faces.
                  properties:
                    name:
                      type: string
                      description: User defined name, maximum length is 128.
                      minLength: 1
                      maxLength: 128
                    userData:
                      type: string
                      description: Optional user defined data. Length should not exceed
                        16K.
                      maxLength: 16384
                    recognitionModel:
                      description: Name of recognition model. Recognition model is
                        used when the face features are extracted and associated with
                        detected faceIds.
                      type: string
                      enum:
                      - recognition_01
                      - recognition_02
                      - recognition_03
                      - recognition_04
                      x-ms-enum:
                        name: RecognitionModel
                        modelAsString: true
                        values:
                        - name: recognition_01
                          value: recognition_01
                          description: The default recognition model for "Detect".
                            All those faceIds created before 2019 March are bonded
                            with this recognition model.
                        - name: recognition_02
                          value: recognition_02
                          description: Recognition model released in 2019 March.
                        - name: recognition_03
                          value: recognition_03
                          description: Recognition model released in 2020 May.
                        - name: recognition_04
                          value: recognition_04
                          description: Recognition model released in 2021 February.
                            It's recommended to use this recognition model for better
                            recognition accuracy.
                    largeFaceListId:
                      description: Valid character is letter in lower case or digit
                        or '-' or '_', maximum length is 64.
                      readOnly: true
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^[a-z0-9-_]+$
                  required:
                  - name
                  - largeFaceListId
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
