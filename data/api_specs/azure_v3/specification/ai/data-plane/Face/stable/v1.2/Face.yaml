    post:
      operationId: FaceListOperations_AddLargeFaceListFaceFromUrl
      summary: Add a face to a specified Large Face List, up to 1,000,000 faces.
      description: "To deal with an image containing multiple faces, input face can\
        \ be specified as an image with a targetFace rectangle. It returns a persistedFaceId\
        \ representing the added face. No image will be stored. Only the extracted\
        \ face feature(s) will be stored on server until \"Delete Large Face List\
        \ Face\" or \"Delete Large Face List\" is called.\n\nNote that persistedFaceId\
        \ is different from faceId generated by \"Detect\".\n\n>\n*\n  * Higher face\
        \ image quality means better recognition precision. Please consider high-quality\
        \ faces: frontal, clear, and face size is 200x200 pixels (100 pixels between\
        \ eyes) or bigger.\n  * JPEG, PNG, GIF (the first frame), and BMP format are\
        \ supported. The allowed image file size is from 1KB to 6MB.\n  * \"targetFace\"\
        \ rectangle should contain one face. Zero or multiple faces will be regarded\
        \ as an error. If the provided \"targetFace\" rectangle is not returned from\
        \ \"Detect\", there's no guarantee to detect and add the face successfully.\n\
        \  * Out of detectable face size (36x36 - 4096x4096 pixels), large head-pose,\
        \ or large occlusions will cause failures.\n  * The minimum detectable face\
        \ size is 36x36 pixels in an image no larger than 1920x1080 pixels. Images\
        \ with dimensions higher than 1920x1080 pixels will need a proportionally\
        \ larger minimum face size.\n  * Different 'detectionModel' values can be\
        \ provided. To use and compare different detection models, please refer to\
        \ [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-detection-model).\n\
        \n> [!NOTE]\n>\n> *\n>   * Free-tier subscription quota: 1,000 faces per Large\
        \ Face List.\n>   * S0-tier subscription quota: 1,000,000 faces per Large\
        \ Face List."
      parameters:
