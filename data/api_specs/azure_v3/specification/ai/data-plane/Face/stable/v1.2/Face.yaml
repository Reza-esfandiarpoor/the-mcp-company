  /verify:
    post:
      operationId: FaceRecognitionOperations_VerifyFaceToFace
      summary: Verify whether two faces belong to a same person.
      description: '> [!NOTE]

        >

        > *

        >   * Higher face image quality means better identification precision. Please
        consider high-quality faces: frontal, clear, and face size is 200x200 pixels
        (100 pixels between eyes) or bigger.

        >   * For the scenarios that are sensitive to accuracy please make your own
        judgment.

        >   * The ''recognitionModel'' associated with the both faces should be the
        same.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceId1:
                  description: The faceId of one face, come from "Detect".
                  type: string
                  format: uuid
                faceId2:
                  description: The faceId of another face, come from "Detect".
                  type: string
                  format: uuid
              required:
              - faceId1
              - faceId2
        required: true
      responses:
        '200':
          description: A successful call returns the verification result.
          content:
            application/json:
              schema:
                type: object
                description: Verify result.
                properties:
                  isIdentical:
                    type: boolean
                    description: True if the two faces belong to the same person or
                      the face belongs to the person, otherwise false.
                  confidence:
                    type: number
                    format: float
                    description: A number indicates the similarity confidence of whether
                      two faces belong to the same person, or whether the face belongs
                      to the person. By default, isIdentical is set to True if similarity
                      confidence is greater than or equal to 0.5. This is useful for
                      advanced users to override 'isIdentical' and fine-tune the result
                      on their own data.
                    minimum: 0
                    maximum: 1
                required:
                - isIdentical
                - confidence
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
components:
  parameters:
    AddFaceOptions.detectionModel:
      name: detectionModel
      in: query
      description: The 'detectionModel' associated with the detected faceIds. Supported
        'detectionModel' values include 'detection_01', 'detection_02' and 'detection_03'.
        The default value is 'detection_01'.
      required: false
      x-ms-enum:
        name: DetectionModel
        modelAsString: true
        values:
        - name: detection_01
          value: detection_01
          description: The default detection model. Recommend for near frontal face
            detection. For scenarios with exceptionally large angle (head-pose) faces,
            occluded faces or wrong image orientation, the faces in such cases may
            not be detected.
        - name: detection_02
          value: detection_02
          description: Detection model released in 2019 May with improved accuracy
            especially on small, side and blurry faces.
        - name: detection_03
          value: detection_03
          description: Detection model released in 2021 February with improved accuracy
            especially on small faces.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - detection_01
        - detection_02
        - detection_03
        default: detection_01
    AddFaceOptions.targetFace:
      name: targetFace
      in: query
      description: A face rectangle to specify the target face to be added to a person,
        in the format of 'targetFace=left,top,width,height'.
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int32
        minItems: 4
        maxItems: 4
    AddFaceOptions.userData:
      name: userData
      in: query
      description: User-provided data attached to the face. The size limit is 1K.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 1024
  requestBodies:
    FaceListOperations_UpdateFaceListBody:
      content:
        application/json:
          schema:
            type: object
            description: User defined fields for object update.
            properties:
              name:
                type: string
                description: User defined name, maximum length is 128.
                minLength: 1
                maxLength: 128
              userData:
                type: string
                description: Optional user defined data. Length should not exceed
                  16K.
                maxLength: 16384
      required: true
    FaceListOperations_AddFaceListFaceFromUrlBody:
      content:
        application/json:
          schema:
            type: object
            description: Add face from url request.
            properties:
              url:
                type: string
                format: uri
                description: URL of input image.
            required:
            - url
      required: true
    FaceListOperations_UpdateLargeFaceListFaceBody:
      content:
        application/json:
          schema:
            type: object
            description: User defined data for persisted face.
            properties:
              userData:
                type: string
                description: User-provided data attached to the face. The length limit
                  is 1K.
                maxLength: 1024
      required: true
    PersonGroupOperations_CreateLargePersonGroupPersonBody:
      content:
        application/json:
          schema:
            type: object
            description: User defined fields for object creation.
            properties:
              name:
                type: string
                description: User defined name, maximum length is 128.
                minLength: 1
                maxLength: 128
              userData:
                type: string
                description: Optional user defined data. Length should not exceed
                  16K.
                maxLength: 16384
            required:
            - name
      required: true
    FaceListOperations_CreateFaceListBody:
      content:
        application/json:
          schema:
            type: object
            description: Model for creating face collection.
            properties:
              name:
                type: string
                description: User defined name, maximum length is 128.
                minLength: 1
                maxLength: 128
              userData:
                type: string
                description: Optional user defined data. Length should not exceed
                  16K.
                maxLength: 16384
              recognitionModel:
                type: string
                description: The 'recognitionModel' associated with this face list.
                  Supported 'recognitionModel' values include 'recognition_01', 'recognition_02,
                  'recognition_03', and 'recognition_04'. The default value is 'recognition_01'.
                  'recognition_04' is recommended since its accuracy is improved on
                  faces wearing masks compared with 'recognition_03', and its overall
                  accuracy is improved compared with 'recognition_01' and 'recognition_02'.
                default: recognition_01
                enum:
                - recognition_01
                - recognition_02
                - recognition_03
                - recognition_04
                x-ms-enum:
                  name: RecognitionModel
                  modelAsString: true
                  values:
                  - name: recognition_01
                    value: recognition_01
                    description: The default recognition model for "Detect". All those
                      faceIds created before 2019 March are bonded with this recognition
                      model.
                  - name: recognition_02
                    value: recognition_02
                    description: Recognition model released in 2019 March.
                  - name: recognition_03
                    value: recognition_03
                    description: Recognition model released in 2020 May.
                  - name: recognition_04
                    value: recognition_04
                    description: Recognition model released in 2021 February. It's
                      recommended to use this recognition model for better recognition
                      accuracy.
            required:
            - name
