  /findsimilars:
    post:
      operationId: FaceRecognitionOperations_FindSimilar
      summary: Given query face's faceId, to search the similar-looking faces from
        a faceId array. A faceId array contains the faces created by Detect.
      description: 'Depending on the input the returned similar faces list contains
        faceIds or persistedFaceIds ranked by similarity.


        Find similar has two working modes, "matchPerson" and "matchFace". "matchPerson"
        is the default mode that it tries to find faces of the same person as possible
        by using internal same-person thresholds. It is useful to find a known person''s
        other photos. Note that an empty list will be returned if no faces pass the
        internal thresholds. "matchFace" mode ignores same-person thresholds and returns
        ranked similar faces anyway, even the similarity is low. It can be used in
        the cases like searching celebrity-looking faces.


        The ''recognitionModel'' associated with the query faceId should be the same
        as the ''recognitionModel'' used by the target faceId array.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceId:
                  description: faceId of the query face. User needs to call "Detect"
                    first to get a valid faceId. Note that this faceId is not persisted
                    and will expire 24 hours after the detection call.
                  type: string
                  format: uuid
                maxNumOfCandidatesReturned:
                  type: integer
                  format: int32
                  description: The number of top similar faces returned. The valid
                    range is [1, 1000]. Default value is 20.
                  default: 20
                  minimum: 1
                  maximum: 1000
                mode:
                  type: string
                  description: Similar face searching mode. It can be 'matchPerson'
                    or 'matchFace'. Default value is 'matchPerson'.
                  default: matchPerson
                  enum:
                  - matchPerson
                  - matchFace
                  x-ms-enum:
                    name: FindSimilarMatchMode
                    modelAsString: true
                    values:
                    - name: matchPerson
                      value: matchPerson
                      description: Match person.
                    - name: matchFace
                      value: matchFace
                      description: Match face.
                faceIds:
                  type: array
                  description: An array of candidate faceIds. All of them are created
                    by "Detect" and the faceIds will expire 24 hours after the detection
                    call. The number of faceIds is limited to 1000.
                  items:
                    type: string
                    format: uuid
                    description: Universally Unique Identifier
              required:
              - faceId
              - faceIds
        required: true
      responses:
        '200':
          description: A successful call returns an array of the most similar faces
            represented in faceId if the input parameter is faceIds or persistedFaceId
            if the input parameter is faceListId or largeFaceListId.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Response body for find similar face operation.
                  properties:
                    confidence:
                      type: number
                      format: float
                      description: Confidence value of the candidate. The higher confidence,
                        the more similar. Range between [0,1].
                      minimum: 0
                      maximum: 1
                    faceId:
                      description: faceId of candidate face when find by faceIds.
                        faceId is created by "Detect" and will expire 24 hours after
                        the detection call.
                      type: string
                      format: uuid
                    persistedFaceId:
                      description: persistedFaceId of candidate face when find by
                        faceListId or largeFaceListId. persistedFaceId in face list/large
                        face list is persisted and will not expire.
                      type: string
                      format: uuid
                  required:
                  - confidence
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
  /group:
    post:
      operationId: FaceRecognitionOperations_Group
      summary: Divide candidate faces into groups based on face similarity.
      description: ">\n*\n  * The output is one or more disjointed face groups and\
        \ a messyGroup. A face group contains faces that have similar looking, often\
        \ of the same person. Face groups are ranked by group size, i.e. number of\
        \ faces. Notice that faces belonging to a same person might be split into\
        \ several groups in the result.\n  * MessyGroup is a special face group containing\
        \ faces that cannot find any similar counterpart face from original faces.\
        \ The messyGroup will not appear in the result if all faces found their counterparts.\n\
        \  * Group API needs at least 2 candidate faces and 1000 at most. We suggest\
        \ to try \"Verify Face To Face\" when you only have 2 candidate faces.\n \
        \ * The 'recognitionModel' associated with the query faces' faceIds should\
        \ be the same."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceIds:
                  type: array
                  description: Array of candidate faceIds created by "Detect". The
                    maximum is 1000 faces.
                  items:
                    type: string
                    format: uuid
                    description: Universally Unique Identifier
              required:
              - faceIds
        required: true
      responses:
        '200':
          description: A successful call returns one or more groups of similar faces
            (rank by group size) and a messyGroup.
          content:
            application/json:
              schema:
                type: object
                description: Response body for group face operation.
                properties:
                  groups:
                    type: array
                    description: A partition of the original faces based on face similarity.
                      Groups are ranked by number of faces.
                    items:
                      type: array
                      items:
                        type: string
                        format: uuid
                        description: Universally Unique Identifier
                  messyGroup:
                    type: array
                    description: Face ids array of faces that cannot find any similar
                      faces from original faces.
                    items:
                      type: string
                      format: uuid
                      description: Universally Unique Identifier
                required:
                - groups
                - messyGroup
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
