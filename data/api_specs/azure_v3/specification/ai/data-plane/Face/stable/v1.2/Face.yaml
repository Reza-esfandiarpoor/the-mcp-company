  /detect?_overload=detectFromSessionImageId:
    post:
      operationId: FaceDetectionOperations_DetectFromSessionImageId
      summary: Detect human faces in an image, return face rectangles, and optionally
        with faceIds, landmarks, and attributes.
      description: "> [!IMPORTANT]\n> Microsoft has retired or limited facial recognition\
        \ capabilities that can be used to try to infer emotional states and identity\
        \ attributes which, if misused, can subject people to stereotyping, discrimination\
        \ or unfair denial of services. The retired capabilities are emotion and gender.\
        \ The limited capabilities are age, smile, facial hair, hair and makeup. Email\
        \ [Azure Face API](mailto:azureface@microsoft.com) if you have a responsible\
        \ use case that would benefit from the use of any of the limited capabilities.\
        \ Read more about this decision [here](https://azure.microsoft.com/blog/responsible-ai-investments-and-safeguards-for-facial-recognition/).\n\
        \n*\n  * No image will be stored. Only the extracted face feature(s) will\
        \ be stored on server. The faceId is an identifier of the face feature and\
        \ will be used in \"Identify\", \"Verify\", and \"Find Similar\". The stored\
        \ face features will expire and be deleted at the time specified by faceIdTimeToLive\
        \ after the original detection call.\n  * Optional parameters include faceId,\
        \ landmarks, and attributes. Attributes include headPose, glasses, occlusion,\
        \ accessories, blur, exposure, noise, mask, and qualityForRecognition. Some\
        \ of the results returned for specific attributes may not be highly accurate.\n\
        \  * JPEG, PNG, GIF (the first frame), and BMP format are supported. The allowed\
        \ image file size is from 1KB to 6MB.\n  * The minimum detectable face size\
        \ is 36x36 pixels in an image no larger than 1920x1080 pixels. Images with\
        \ dimensions higher than 1920x1080 pixels will need a proportionally larger\
        \ minimum face size.\n  * Up to 100 faces can be returned for an image. Faces\
        \ are ranked by face rectangle size from large to small.\n  * For optimal\
        \ results when querying \"Identify\", \"Verify\", and \"Find Similar\" ('returnFaceId'\
        \ is true), please use faces that are: frontal, clear, and with a minimum\
        \ size of 200x200 pixels (100 pixels between eyes).\n  * Different 'detectionModel'\
        \ values can be provided. The availability of landmarks and supported attributes\
        \ depends on the detection model specified. To use and compare different detection\
        \ models, please refer to [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-detection-model).\n\
        \  * Different 'recognitionModel' values are provided. If follow-up operations\
        \ like \"Verify\", \"Identify\", \"Find Similar\" are needed, please specify\
        \ the recognition model with 'recognitionModel' parameter. The default value\
        \ for 'recognitionModel' is 'recognition_01', if latest model needed, please\
        \ explicitly specify the model you need in this parameter. Once specified,\
        \ the detected faceIds will be associated with the specified recognition model.\
        \ More details, please refer to [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-recognition-model)."
      parameters:
      - name: detectionModel
        in: query
        description: The 'detectionModel' associated with the detected faceIds. Supported
          'detectionModel' values include 'detection_01', 'detection_02' and 'detection_03'.
          The default value is 'detection_01'. 'detection_03' is recommended since
          its accuracy is improved on smaller faces (64x64 pixels) and rotated face
          orientations.
        required: false
        x-ms-enum:
          name: DetectionModel
          modelAsString: true
          values:
          - name: detection_01
            value: detection_01
            description: The default detection model. Recommend for near frontal face
              detection. For scenarios with exceptionally large angle (head-pose)
              faces, occluded faces or wrong image orientation, the faces in such
              cases may not be detected.
          - name: detection_02
            value: detection_02
            description: Detection model released in 2019 May with improved accuracy
              especially on small, side and blurry faces.
          - name: detection_03
            value: detection_03
            description: Detection model released in 2021 February with improved accuracy
              especially on small faces.
        schema:
          type: string
          enum:
          - detection_01
          - detection_02
          - detection_03
          default: detection_01
      - name: recognitionModel
        in: query
        description: The 'recognitionModel' associated with the detected faceIds.
          Supported 'recognitionModel' values include 'recognition_01', 'recognition_02',
          'recognition_03' or 'recognition_04'. The default value is 'recognition_01'.
          'recognition_04' is recommended since its accuracy is improved on faces
          wearing masks compared with 'recognition_03', and its overall accuracy is
          improved compared with 'recognition_01' and 'recognition_02'.
        required: false
        x-ms-enum:
          name: RecognitionModel
          modelAsString: true
          values:
          - name: recognition_01
            value: recognition_01
            description: The default recognition model for "Detect". All those faceIds
              created before 2019 March are bonded with this recognition model.
          - name: recognition_02
            value: recognition_02
            description: Recognition model released in 2019 March.
          - name: recognition_03
            value: recognition_03
            description: Recognition model released in 2020 May.
          - name: recognition_04
            value: recognition_04
            description: Recognition model released in 2021 February. It's recommended
              to use this recognition model for better recognition accuracy.
        schema:
          type: string
          enum:
          - recognition_01
          - recognition_02
          - recognition_03
          - recognition_04
          default: recognition_01
      - name: returnFaceId
        in: query
        description: Return faceIds of the detected faces or not. The default value
          is true.
        required: false
        schema:
          type: boolean
          default: true
      - name: returnFaceAttributes
        in: query
        description: Analyze and return the one or more specified face attributes
          in the comma-separated string like 'returnFaceAttributes=headPose,glasses'.
          Face attribute analysis has additional computational and time cost.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - headPose
            - glasses
            - occlusion
            - accessories
            - blur
            - exposure
            - noise
            - mask
            - qualityForRecognition
            - age
            - smile
            - facialHair
            - hair
            x-ms-enum:
              name: FaceAttributeType
              modelAsString: true
              values:
              - name: headPose
                value: headPose
                description: 3-D roll/yaw/pitch angles for face direction.
              - name: glasses
                value: glasses
                description: Glasses type. Values include 'NoGlasses', 'ReadingGlasses',
                  'Sunglasses', 'SwimmingGoggles'.
              - name: occlusion
                value: occlusion
                description: Whether each facial area is occluded, including forehead,
                  eyes and mouth.
              - name: accessories
                value: accessories
                description: Accessories around face, including 'headwear', 'glasses'
                  and 'mask'. Empty array means no accessories detected. Note this
                  is after a face is detected. Large mask could result in no face
                  to be detected.
              - name: blur
                value: blur
                description: Face is blurry or not. Level returns 'Low', 'Medium'
                  or 'High'. Value returns a number between [0,1], the larger the
                  blurrier.
              - name: exposure
                value: exposure
                description: Face exposure level. Level returns 'GoodExposure', 'OverExposure'
                  or 'UnderExposure'.
              - name: noise
                value: noise
                description: Noise level of face pixels. Level returns 'Low', 'Medium'
                  and 'High'. Value returns a number between [0,1], the larger the
                  noisier
              - name: mask
                value: mask
                description: Whether each face is wearing a mask. Mask type returns
                  'noMask', 'faceMask', 'otherMaskOrOcclusion', or 'uncertain'. Value
                  returns a boolean 'noseAndMouthCovered' indicating whether nose
                  and mouth are covered.
              - name: qualityForRecognition
                value: qualityForRecognition
                description: The overall image quality regarding whether the image
                  being used in the detection is of sufficient quality to attempt
                  face recognition on. The value is an informal rating of low, medium,
                  or high. Only 'high' quality images are recommended for person enrollment
                  and quality at or above 'medium' is recommended for identification
                  scenarios. The attribute is only available when using recognition
                  models recognition_03 or recognition_04.
              - name: age
                value: age
                description: Age in years.
              - name: smile
                value: smile
                description: Smile intensity, a number between [0,1].
              - name: facialHair
                value: facialHair
                description: Properties describing facial hair attributes.
              - name: hair
                value: hair
                description: Properties describing hair attributes.
      - name: returnFaceLandmarks
        in: query
        description: Return face landmarks of the detected faces or not. The default
          value is false.
        required: false
        schema:
          type: boolean
          default: false
      - name: returnRecognitionModel
        in: query
        description: Return 'recognitionModel' or not. The default value is false.
          This is only applicable when returnFaceId = true.
        required: false
        schema:
          type: boolean
          default: false
      - name: faceIdTimeToLive
        in: query
        description: The number of seconds for the face ID being cached. Supported
          range from 60 seconds up to 86400 seconds. The default value is 86400 (24
          hours).
        required: false
        schema:
          type: integer
          format: int32
          minimum: 60
          maximum: 86400
          default: 86400
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionImageId:
                  type: string
                  description: Id of session image.
              required:
              - sessionImageId
        required: true
      responses:
        '200':
          description: A successful call returns an array of face entries ranked by
