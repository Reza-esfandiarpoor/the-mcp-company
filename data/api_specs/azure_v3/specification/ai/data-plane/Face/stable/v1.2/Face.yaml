  /largepersongroups/{largePersonGroupId}/persons/{personId}/persistedfaces:
    post:
      operationId: PersonGroupOperations_AddLargePersonGroupPersonFaceFromUrl
      summary: Add a face to a person into a Large Person Group for face identification
        or verification.
      description: "To deal with an image containing multiple faces, input face can\
        \ be specified as an image with a targetFace rectangle. It returns a persistedFaceId\
        \ representing the added face. No image will be stored. Only the extracted\
        \ face feature(s) will be stored on server until \"Delete Large Person Group\
        \ Person Face\", \"Delete Large Person Group Person\" or \"Delete Large Person\
        \ Group\" is called.\n\nNote that persistedFaceId is different from faceId\
        \ generated by \"Detect\".\n\n>\n*\n  * Each person entry can hold up to 248\
        \ faces.\n  * Higher face image quality means better recognition precision.\
        \ Please consider high-quality faces: frontal, clear, and face size is 200x200\
        \ pixels (100 pixels between eyes) or bigger.\n  * JPEG, PNG, GIF (the first\
        \ frame), and BMP format are supported. The allowed image file size is from\
        \ 1KB to 6MB.\n  * \"targetFace\" rectangle should contain one face. Zero\
        \ or multiple faces will be regarded as an error. If the provided \"targetFace\"\
        \ rectangle is not returned from \"Detect\", there's no guarantee to detect\
        \ and add the face successfully.\n  * Out of detectable face size (36x36 -\
        \ 4096x4096 pixels), large head-pose, or large occlusions will cause failures.\n\
        \  * The minimum detectable face size is 36x36 pixels in an image no larger\
        \ than 1920x1080 pixels. Images with dimensions higher than 1920x1080 pixels\
        \ will need a proportionally larger minimum face size.\n  * Different 'detectionModel'\
        \ values can be provided. To use and compare different detection models, please\
        \ refer to [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-detection-model)."
      parameters:
      - name: largePersonGroupId
        in: path
        description: ID of the container.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
      - name: personId
        in: path
        description: ID of the person.
        required: true
        schema:
          type: string
          format: uuid
      - name: targetFace
        in: query
        description: A face rectangle to specify the target face to be added to a
          person, in the format of 'targetFace=left,top,width,height'.
        required: false
        x-ms-parameter-location: method
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
          minItems: 4
          maxItems: 4
      - name: detectionModel
        in: query
        description: The 'detectionModel' associated with the detected faceIds. Supported
          'detectionModel' values include 'detection_01', 'detection_02' and 'detection_03'.
          The default value is 'detection_01'.
        required: false
        x-ms-enum:
          name: DetectionModel
          modelAsString: true
          values:
          - name: detection_01
            value: detection_01
            description: The default detection model. Recommend for near frontal face
              detection. For scenarios with exceptionally large angle (head-pose)
              faces, occluded faces or wrong image orientation, the faces in such
              cases may not be detected.
          - name: detection_02
            value: detection_02
            description: Detection model released in 2019 May with improved accuracy
              especially on small, side and blurry faces.
          - name: detection_03
            value: detection_03
            description: Detection model released in 2021 February with improved accuracy
              especially on small faces.
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - detection_01
          - detection_02
          - detection_03
          default: detection_01
      - name: userData
        in: query
        description: User-provided data attached to the face. The size limit is 1K.
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
          maxLength: 1024
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Add face from url request.
              properties:
                url:
                  type: string
                  format: uri
                  description: URL of input image.
              required:
              - url
        required: true
      responses:
        '200':
          description: A successful call returns a new persistedFaceId.
          content:
            application/json:
              schema:
                type: object
                description: Response body for adding face.
                properties:
                  persistedFaceId:
                    description: Persisted Face ID of the added face, which is persisted
                      and will not expire. Different from faceId which is created
                      in "Detect" and will expire in 24 hours after the detection
                      call.
                    type: string
                    format: uuid
                required:
                - persistedFaceId
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
