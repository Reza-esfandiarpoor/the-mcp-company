      description: Add face from url request.
      properties:
        url:
          type: string
          format: uri
          description: URL of input image.
      required:
      - url
    AddFaceResult:
      type: object
      description: Response body for adding face.
      properties:
        persistedFaceId:
          description: Persisted Face ID of the added face, which is persisted and
