  /detectLiveness-sessions:
    post:
      operationId: LivenessSessionOperations_CreateLivenessSession
      summary: Create a new detect liveness session.
      description: "A session is best for client device scenarios where developers\
        \ want to authorize a client device to perform only a liveness detection without\
        \ granting full access to their resource. Created sessions have a limited\
        \ life span and only authorize clients to perform the desired action before\
        \ access is expired.\n\nPermissions includes...\n>\n*\n  * A token lifetime\
        \ of 10 minutes.\n\n> [!NOTE]\n> Client access can be revoked by deleting\
        \ the session using the Delete Liveness Session operation. To retrieve a result,\
        \ use the Get Liveness Session. To audit the individual requests that a client\
        \ has made to your resource, use the List Liveness Session Audit Entries."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request model for creating liveness session.
              properties:
                livenessOperationMode:
                  description: Type of liveness mode the client should follow.
                  type: string
                  enum:
                  - Passive
                  - PassiveActive
                  x-ms-enum:
                    name: LivenessOperationMode
                    modelAsString: true
                    values:
                    - name: Passive
                      value: Passive
                      description: 'Utilizes a passive liveness technique that requires
                        no additional actions from the user. Requires normal indoor
                        lighting and high screen brightness for optimal performance.
                        And thus, this mode has a narrow operational envelope and
                        will not be suitable for scenarios that requires the end-user''s
                        to be in bright lighting conditions. Note: this is the only
                        supported mode for the Mobile (iOS and Android) solution.'
                    - name: PassiveActive
                      value: PassiveActive
                      description: This mode utilizes a hybrid passive or active liveness
                        technique that necessitates user cooperation. It is optimized
                        to require active motion only under suboptimal lighting conditions.
                        Unlike the passive mode, this mode has no lighting restrictions,
                        and thus offering a broader operational envelope. This mode
                        is preferable on Web based solutions due to the lack of automatic
                        screen brightness control available on browsers which hinders
                        the Passive mode's operational envelope on Web based solutions.
                deviceCorrelationIdSetInClient:
                  type: boolean
                  description: Whether or not to allow client to set their own 'deviceCorrelationId'
                    via the Vision SDK. Default is false, and 'deviceCorrelationId'
                    must be set in this request body.
                enableSessionImage:
                  type: boolean
                  description: Whether or not store the session image.
                livenessModelVersion:
                  description: The model version used for liveness classification.
                    This is an optional parameter, and if this is not specified, then
                    the latest supported model version will be chosen
                  type: string
                  enum:
                  - 2024-11-15
                  x-ms-enum:
                    name: LivenessModel
                    modelAsString: true
                    values:
                    - name: v2024_11_15
                      value: 2024-11-15
                deviceCorrelationId:
                  type: string
                  description: Unique Guid per each end-user device. This is to provide
                    rate limiting and anti-hammering. If 'deviceCorrelationIdSetInClient'
                    is true in this request, this 'deviceCorrelationId' must be null.
                authTokenTimeToLiveInSeconds:
                  type: integer
                  format: int32
                  description: Seconds the session should last for. Range is 60 to
                    86400 seconds. Default value is 600.
                  default: 600
                  minimum: 60
                  maximum: 86400
              required:
              - livenessOperationMode
        description: Body parameter.
        required: true
      responses:
        '200':
          description: A successful call create a session for a client device and
            provide an authorization token for use by the client application for a
            limited purpose and time.
          content:
            application/json:
              schema:
                type: object
                description: Session result of detect liveness.
                properties:
                  sessionId:
                    type: string
                    description: The unique ID to reference this session.
                    readOnly: true
                  authToken:
                    type: string
                    description: Bearer token to provide authentication for the Vision
                      SDK running on a client application. This Bearer token has limited
                      permissions to perform only the required action and expires
                      after the TTL time. It is also auditable.
                  status:
                    description: The current status of the session.
                    type: string
                    enum:
                    - NotStarted
                    - Running
                    - Succeeded
                    - Failed
                    - Canceled
                    x-ms-enum:
                      name: OperationState
                      modelAsString: true
                      values:
                      - name: NotStarted
                        value: NotStarted
                        description: The operation has not started.
                      - name: Running
                        value: Running
                        description: The operation is in progress.
                      - name: Succeeded
                        value: Succeeded
                        description: The operation has completed successfully.
                      - name: Failed
                        value: Failed
                        description: The operation has failed.
                      - name: Canceled
                        value: Canceled
                        description: The operation has been canceled by the user.
                  modelVersion:
                    description: The model version used for liveness classification.
                      This is an optional parameter, and if this is not specified,
                      then the latest supported model version will be chosen
                    type: string
                    enum:
                    - 2024-11-15
                    x-ms-enum:
                      name: LivenessModel
                      modelAsString: true
                      values:
                      - name: v2024_11_15
                        value: 2024-11-15
                  results:
                    description: The results of the liveness session.
                    type: object
                    properties:
                      attempts:
                        type: array
                        description: The attempts data of underlying liveness call
                          with the session.
                        items:
                          type: object
                          description: The liveness session attempt.
                          properties:
                            attemptId:
                              type: integer
                              format: int32
                              description: The attempt ID, start from 1.
                            attemptStatus:
                              description: The status of the attempt.
                              type: string
                              enum:
                              - NotStarted
                              - Running
                              - Succeeded
                              - Failed
                              - Canceled
                              x-ms-enum:
                                name: OperationState
                                modelAsString: true
                                values:
                                - name: NotStarted
                                  value: NotStarted
                                  description: The operation has not started.
                                - name: Running
                                  value: Running
                                  description: The operation is in progress.
                                - name: Succeeded
                                  value: Succeeded
                                  description: The operation has completed successfully.
                                - name: Failed
                                  value: Failed
                                  description: The operation has failed.
                                - name: Canceled
                                  value: Canceled
                                  description: The operation has been canceled by
                                    the user.
                            result:
                              description: The result of the liveness call, will be
                                null if there is error.
                              type: object
                              properties:
                                livenessDecision:
                                  description: The liveness classification for the
                                    target face.
                                  type: string
                                  enum:
                                  - uncertain
                                  - realface
                                  - spoofface
                                  x-ms-enum:
                                    name: LivenessDecision
                                    modelAsString: true
                                    values:
                                    - name: uncertain
                                      value: uncertain
                                      description: The algorithm could not classify
                                        the target face as either real or spoof.
                                    - name: realFace
                                      value: realface
                                      description: The algorithm has classified the
                                        target face as real.
                                    - name: spoofFace
                                      value: spoofface
                                      description: The algorithm has classified the
                                        target face as a spoof.
                                targets:
                                  description: Targets used for liveness classification.
                                  type: object
                                  properties:
                                    color:
                                      description: The target from color image used
                                        for liveness classification.
                                      type: object
                                      properties:
                                        faceRectangle:
                                          description: The face region where the liveness
                                            classification was made on.
                                          type: object
                                          properties:
                                            top:
                                              type: integer
                                              format: int32
                                              description: The distance from the top
                                                edge if the image to the top edge
                                                of the rectangle, in pixels.
                                            left:
                                              type: integer
                                              format: int32
                                              description: The distance from the left
                                                edge if the image to the left edge
                                                of the rectangle, in pixels.
                                            width:
                                              type: integer
                                              format: int32
                                              description: The width of the rectangle,
                                                in pixels.
                                            height:
                                              type: integer
                                              format: int32
                                              description: The height of the rectangle,
                                                in pixels.
                                          required:
                                          - top
                                          - left
                                          - width
                                          - height
                                      required:
                                      - faceRectangle
                                  required:
                                  - color
                                digest:
                                  type: string
                                  description: The server calculated digest for this
                                    request. If the client reported digest differs
                                    from the server calculated digest, then the message
                                    integrity between the client and service has been
                                    compromised and the result should not be trusted.
                                    For more information, see how to guides on how
                                    to leverage this value to secure your end-to-end
                                    solution.
                                sessionImageId:
                                  type: string
                                  description: The image ID of the session request.
                              required:
                              - targets
                              - digest
                            error:
                              description: The error of the liveness call, will be
                                null if there is result.
                              type: object
                              properties:
                                code:
                                  type: string
                                  description: The error code.
                                message:
                                  type: string
                                  description: The error message.
                                targets:
                                  description: Targets used for liveness classification.
                                  type: object
                                  properties:
                                    color:
                                      description: The target from color image used
                                        for liveness classification.
                                      type: object
                                      properties:
                                        faceRectangle:
                                          description: The face region where the liveness
                                            classification was made on.
                                          type: object
                                          properties:
                                            top:
                                              type: integer
                                              format: int32
                                              description: The distance from the top
                                                edge if the image to the top edge
                                                of the rectangle, in pixels.
                                            left:
                                              type: integer
                                              format: int32
                                              description: The distance from the left
                                                edge if the image to the left edge
                                                of the rectangle, in pixels.
                                            width:
                                              type: integer
                                              format: int32
                                              description: The width of the rectangle,
                                                in pixels.
                                            height:
                                              type: integer
                                              format: int32
                                              description: The height of the rectangle,
                                                in pixels.
                                          required:
                                          - top
                                          - left
                                          - width
                                          - height
                                      required:
                                      - faceRectangle
                                  required:
                                  - color
                              required:
                              - code
                              - message
                              - targets
                          required:
                          - attemptId
                          - attemptStatus
                    required:
                    - attempts
                required:
                - sessionId
                - authToken
                - status
                - results
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: A response containing error details.
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        type: string
                        description: One of a server-defined set of error codes.
                      message:
                        type: string
                        description: A human-readable representation of the error.
                    required:
                    - code
                    - message
                required:
                - error
