                        width:
                          type: integer
                          format: int32
                          description: The width of the rectangle, in pixels.
                        height:
                          type: integer
                          format: int32
                          description: The height of the rectangle, in pixels.
                      required:
                      - top
                      - left
                      - width
                      - height
                    faceLandmarks:
                      description: An array of 27-point face landmarks pointing to
