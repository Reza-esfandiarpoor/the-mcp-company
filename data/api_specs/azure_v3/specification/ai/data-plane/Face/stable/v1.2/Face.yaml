  /identify?_overload=identifyFromPersonDirectory:
    post:
      operationId: FaceRecognitionOperations_IdentifyFromPersonDirectory
      summary: 1-to-many identification to find the closest matches of the specific
        query person face from a person directory personIds array.
      description: 'For each face in the faceIds array, Face Identify will compute
        similarities between the query face and all the faces in the Person Directory
        Persons (given by personIds), and return candidate person(s) for that face
        ranked by similarity confidence.

        Passing personIds with an array with one element "*" can perform the operation
        over entire person directory.

        > [!NOTE]

        >

        > *

        >   * The algorithm allows more than one face to be identified independently
        at the same request, but no more than 10 faces.

        >   * Each person could have more than one face, but no more than 248 faces.

        >   * Higher face image quality means better identification precision. Please
        consider high-quality faces: frontal, clear, and face size is 200x200 pixels
        (100 pixels between eyes) or bigger.

        >   * Number of candidates returned is restricted by maxNumOfCandidatesReturned
        and confidenceThreshold. If no person is identified, the returned candidates
        will be an empty array.

        >   * The Identify operation can only match faces obtained with the same recognition
        model, that is associated with the query faces.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                faceIds:
                  type: array
                  description: Array of query faces faceIds, created by the "Detect".
                    Each of the faces are identified independently. The valid number
                    of faceIds is between [1, 10].
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/Azure.Core.uuid'
                personIds:
                  type: array
                  description: Array of personIds created in Person Directory "Create
                    Person". The valid number of personIds is between [1,30].
                  minItems: 1
                  maxItems: 30
                  items:
                    $ref: '#/components/schemas/Azure.Core.uuid'
                maxNumOfCandidatesReturned:
                  type: integer
                  format: int32
                  description: The range of maxNumOfCandidatesReturned is between
                    1 and 100. Default value is 10.
                  default: 10
                  minimum: 1
                  maximum: 100
                confidenceThreshold:
                  type: number
                  format: float
                  description: Customized identification confidence threshold, in
                    the range of [0, 1]. Advanced user can tweak this value to override
                    default internal threshold for better precision on their scenario
                    data. Note there is no guarantee of this threshold value working
                    on other data and after algorithm updates.
                  minimum: 0
                  maximum: 1
              required:
              - faceIds
              - personIds
        required: true
      responses:
        '200':
          description: A successful call returns the identified candidate person(s)
            for each query face.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentificationResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceErrorResponse'
  /largefacelists/{largeFaceListId}/persistedfaces?_overload=addLargeFaceListFace:
    post:
      operationId: FaceListOperations_AddLargeFaceListFace
      summary: Add a face to a specified Large Face List, up to 1,000,000 faces.
      description: "To deal with an image containing multiple faces, input face can\
        \ be specified as an image with a targetFace rectangle. It returns a persistedFaceId\
        \ representing the added face. No image will be stored. Only the extracted\
        \ face feature(s) will be stored on server until \"Delete Large Face List\
        \ Face\" or \"Delete Large Face List\" is called.\n\nNote that persistedFaceId\
        \ is different from faceId generated by \"Detect\".\n\n>\n*\n  * Higher face\
        \ image quality means better recognition precision. Please consider high-quality\
        \ faces: frontal, clear, and face size is 200x200 pixels (100 pixels between\
        \ eyes) or bigger.\n  * JPEG, PNG, GIF (the first frame), and BMP format are\
        \ supported. The allowed image file size is from 1KB to 6MB.\n  * \"targetFace\"\
        \ rectangle should contain one face. Zero or multiple faces will be regarded\
        \ as an error. If the provided \"targetFace\" rectangle is not returned from\
        \ \"Detect\", there's no guarantee to detect and add the face successfully.\n\
        \  * Out of detectable face size (36x36 - 4096x4096 pixels), large head-pose,\
        \ or large occlusions will cause failures.\n  * The minimum detectable face\
        \ size is 36x36 pixels in an image no larger than 1920x1080 pixels. Images\
        \ with dimensions higher than 1920x1080 pixels will need a proportionally\
        \ larger minimum face size.\n  * Different 'detectionModel' values can be\
        \ provided. To use and compare different detection models, please refer to\
        \ [here](https://learn.microsoft.com/azure/ai-services/computer-vision/how-to/specify-detection-model).\n\
        \n> [!NOTE]\n>\n> *\n>   * Free-tier subscription quota: 1,000 faces per Large\
        \ Face List.\n>   * S0-tier subscription quota: 1,000,000 faces per Large\
        \ Face List."
      parameters:
      - name: largeFaceListId
        in: path
        description: Valid character is letter in lower case or digit or '-' or '_',
          maximum length is 64.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
      - $ref: '#/components/parameters/AddFaceOptions.targetFace'
      - $ref: '#/components/parameters/AddFaceOptions.detectionModel'
      - $ref: '#/components/parameters/AddFaceOptions.userData'
      requestBody:
        $ref: '#/components/requestBodies/FaceListOperations_AddFaceListFaceImagecontent'
      responses:
        '200':
          description: A successful call returns a new persistedFaceId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddFaceResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceErrorResponse'
