    FaceList:
      type: object
      description: Face list is a list of faces, up to 1,000 faces.
      properties:
        name:
          type: string
          description: User defined name, maximum length is 128.
          minLength: 1
          maxLength: 128
        userData:
          type: string
          description: Optional user defined data. Length should not exceed 16K.
          maxLength: 16384
        recognitionModel:
          description: Name of recognition model. Recognition model is used when the
            face features are extracted and associated with detected faceIds.
          type: string
          enum:
          - recognition_01
          - recognition_02
          - recognition_03
          - recognition_04
          x-ms-enum:
            name: RecognitionModel
            modelAsString: true
            values:
            - name: recognition_01
              value: recognition_01
              description: The default recognition model for "Detect". All those faceIds
                created before 2019 March are bonded with this recognition model.
            - name: recognition_02
              value: recognition_02
              description: Recognition model released in 2019 March.
            - name: recognition_03
              value: recognition_03
              description: Recognition model released in 2020 May.
            - name: recognition_04
              value: recognition_04
              description: Recognition model released in 2021 February. It's recommended
                to use this recognition model for better recognition accuracy.
        faceListId:
          description: Valid character is letter in lower case or digit or '-' or
            '_', maximum length is 64.
          readOnly: true
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-_]+$
        persistedFaces:
          type: array
          description: Face ids of registered faces in the face list.
          items:
            type: object
            description: Face resource for face list.
            properties:
              persistedFaceId:
                description: Face ID of the face.
                readOnly: true
                type: string
                format: uuid
              userData:
                type: string
                description: User-provided data attached to the face. The length limit
                  is 1K.
                maxLength: 1024
            required:
            - persistedFaceId
      required:
      - name
      - faceListId
