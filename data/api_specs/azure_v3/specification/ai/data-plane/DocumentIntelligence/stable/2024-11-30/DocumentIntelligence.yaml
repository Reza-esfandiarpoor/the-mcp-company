      description: List of additional fields to extract.  Ex. "NumberOfGuests,StoreNumber"
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    DocumentModelAnalyzeRequestParams.stringIndexType:
      name: stringIndexType
      in: query
      description: Method used to compute string offset and length.
      required: false
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - name: textElements
          value: textElements
          description: 'User-perceived display character, or grapheme cluster, as
