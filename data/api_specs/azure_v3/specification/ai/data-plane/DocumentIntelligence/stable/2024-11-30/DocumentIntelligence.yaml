      required: false
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(\d+(-\d+)?)(,\s*(\d+(-\d+)?))*$
    DocumentModelAnalyzeRequestParams.queryFields:
      name: queryFields
