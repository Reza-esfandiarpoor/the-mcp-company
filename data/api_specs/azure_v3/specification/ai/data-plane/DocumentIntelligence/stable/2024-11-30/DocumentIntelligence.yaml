      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
    DocumentClassifierAnalyzeRequestParams.classifierId:
      name: classifierId
      in: path
      description: Unique document classifier name.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    DocumentClassifierAnalyzeRequestParams.pages:
      name: pages
      in: query
      description: 1-based page numbers to analyze.  Ex. "1-3,5,7-9"
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(\d+(-\d+)?)(,\s*(\d+(-\d+)?))*$
    DocumentClassifierAnalyzeRequestParams.split:
      name: split
      in: query
      description: Document splitting mode.
      required: false
      x-ms-enum:
        name: SplitMode
        modelAsString: true
        values:
        - name: auto
          value: auto
          description: Automatically split file into documents.
        - name: none
          value: none
          description: Treat the entire file as a single document.
        - name: perPage
          value: perPage
          description: Treat each page in the file as a separate document.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - auto
        - none
        - perPage
        default: none
    DocumentClassifierAnalyzeRequestParams.stringIndexType:
      name: stringIndexType
      in: query
      description: Method used to compute string offset and length.
      required: false
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - name: textElements
          value: textElements
          description: 'User-perceived display character, or grapheme cluster, as
            defined by Unicode

            8.0.0.'
        - name: unicodeCodePoint
          value: unicodeCodePoint
          description: Character unit represented by a single unicode code point.  Used
            by Python 3.
        - name: utf16CodeUnit
          value: utf16CodeUnit
          description: 'Character unit represented by a 16-bit Unicode code unit.  Used
            by JavaScript,

            Java, and .NET.'
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - textElements
        - unicodeCodePoint
        - utf16CodeUnit
        default: textElements
    DocumentModelAnalyzeRequestParams.features:
      name: features
      in: query
      description: List of optional analysis features.
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - ocrHighResolution
          - languages
          - barcodes
          - formulas
          - keyValuePairs
          - styleFont
          - queryFields
          x-ms-enum:
            name: DocumentAnalysisFeature
            modelAsString: true
            values:
            - name: ocrHighResolution
              value: ocrHighResolution
              description: Perform OCR at a higher resolution to handle documents
                with fine print.
            - name: languages
              value: languages
              description: Enable the detection of the text content language.
            - name: barcodes
              value: barcodes
              description: Enable the detection of barcodes in the document.
            - name: formulas
              value: formulas
              description: Enable the detection of mathematical expressions in the
                document.
            - name: keyValuePairs
              value: keyValuePairs
              description: Enable the detection of general key value pairs (form fields)
                in the document.
            - name: styleFont
              value: styleFont
              description: Enable the recognition of various font styles.
            - name: queryFields
              value: queryFields
              description: Enable the extraction of additional fields via the queryFields
                query parameter.
    DocumentModelAnalyzeRequestParams.locale:
      name: locale
      in: query
      description: 'Locale hint for text recognition and document analysis.  Value
        may contain only

        the language code (ex. "en", "fr") or BCP 47 language tag (ex. "en-US").'
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    DocumentModelAnalyzeRequestParams.modelId:
      name: modelId
      in: path
      description: Unique document model name.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    DocumentModelAnalyzeRequestParams.output:
      name: output
      in: query
      description: Additional outputs to generate during analysis.
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - pdf
          - figures
          x-ms-enum:
            name: AnalyzeOutputOption
            modelAsString: true
            values:
            - name: pdf
              value: pdf
              description: Generate searchable PDF output.
            - name: figures
              value: figures
              description: Generate cropped images of detected figures.
    DocumentModelAnalyzeRequestParams.outputContentFormat:
      name: outputContentFormat
      in: query
      description: Format of the analyze result top-level content.
      required: false
      x-ms-enum:
        name: DocumentContentFormat
        modelAsString: true
        values:
        - name: text
          value: text
          description: Plain text representation of the document content without any
