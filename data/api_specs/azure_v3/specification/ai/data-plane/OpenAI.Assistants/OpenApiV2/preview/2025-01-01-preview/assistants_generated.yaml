openapi: 3.0.0
info:
  title: Azure OpenAI
  version: 2025-01-01-preview
  description: Azure OpenAI APIs for Assistants.
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: An OpenAI endpoint supporting assistants functionality.
      default: none
security:
- ApiKeyAuth: []
- OAuth2Auth:
  - https://cognitiveservices.azure.com/.default
tags: []
paths:
  /assistants:
    get:
      operationId: ListAssistants
      description: Gets a list of assistants that were previously created.
      parameters:
      - name: limit
        in: query
        description: A limit on the number of objects to be returned. Limit can range
          between 1 and 100, and the default is 20.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - name: order
        in: query
        description: Sort order by the created_at timestamp of the objects. asc for
          ascending order and desc for descending order.
        required: false
        x-ms-enum:
          name: ListSortOrder
          modelAsString: true
          values:
          - name: ascending
            value: asc
            description: Specifies an ascending sort order.
          - name: descending
            value: desc
            description: Specifies a descending sort order.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: after
        in: query
        description: A cursor for use in pagination. after is an object ID that defines
          your place in the list. For instance, if you make a list request and receive
          100 objects, ending with obj_foo, your subsequent call can include after=obj_foo
          in order to fetch the next page of the list.
        required: false
        schema:
          type: string
      - name: before
        in: query
        description: A cursor for use in pagination. before is an object ID that defines
          your place in the list. For instance, if you make a list request and receive
          100 objects, starting with obj_foo, your subsequent call can include before=obj_foo
          in order to fetch the previous page of the list.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The requested list of assistants.
          content:
            application/json:
              schema:
                type: object
                description: The response data for a requested list of items.
                properties:
                  object:
                    type: string
                    description: The object type, which is always list.
                    enum:
                    - list
                    x-ms-enum:
                      modelAsString: false
                  data:
                    type: array
                    description: The requested list of items.
                    items:
                      type: object
                      description: Represents an assistant that can call the model
                        and use tools.
                      properties:
                        id:
                          type: string
                          description: The identifier, which can be referenced in
                            API endpoints.
                        object:
                          type: string
                          description: The object type, which is always assistant.
                          enum:
                          - assistant
                          x-ms-enum:
                            modelAsString: false
                        created_at:
                          type: integer
                          format: unixtime
                          description: The Unix timestamp, in seconds, representing
                            when this object was created.
                          x-ms-client-name: createdAt
                        name:
                          type: string
                          description: The name of the assistant.
                          nullable: true
                        description:
                          type: string
                          description: The description of the assistant.
                          nullable: true
                        model:
                          type: string
                          description: The ID of the model to use.
                        instructions:
                          type: string
                          description: The system instructions for the assistant to
                            use.
                          nullable: true
                        tools:
                          type: array
                          description: The collection of tools enabled for the assistant.
                          default: []
                          items:
                            type: object
                            description: An abstract representation of an input tool
                              definition that an assistant can use.
                            properties:
                              type:
                                type: string
                                description: The object type.
                            discriminator:
                              propertyName: type
                            required:
                            - type
                        tool_resources:
                          description: 'A set of resources that are used by the assistant''s
                            tools. The resources are specific to the type of tool.
                            For example, the `code_interpreter`

                            tool requires a list of file IDs, while the `file_search`
                            tool requires a list of vector store IDs.'
                          x-ms-client-name: toolResources
                          type: object
                          properties:
                            code_interpreter:
                              description: Resources to be used by the `code_interpreter
                                tool` consisting of file IDs.
                              x-ms-client-name: codeInterpreter
                              type: object
                              properties:
                                file_ids:
                                  type: array
                                  description: 'A list of file IDs made available
                                    to the `code_interpreter` tool. There can be a
                                    maximum of 20 files

                                    associated with the tool.'
                                  default: []
                                  maxItems: 20
                                  items:
                                    type: string
                                  x-ms-client-name: fileIds
                              required:
                              - file_ids
                            file_search:
                              description: Resources to be used by the `file_search`
                                tool consisting of vector store IDs.
                              x-ms-client-name: fileSearch
                              type: object
                              properties:
                                vector_store_ids:
                                  type: array
                                  description: 'The ID of the vector store attached
                                    to this assistant. There can be a maximum of 1
                                    vector

                                    store attached to the assistant.'
                                  maxItems: 1
                                  items:
                                    type: string
                                  x-ms-client-name: vectorStoreIds
                          nullable: true
                        temperature:
                          type: number
                          format: float
                          description: 'What sampling temperature to use, between
                            0 and 2. Higher values like 0.8 will make the output more
                            random,

                            while lower values like 0.2 will make it more focused
                            and deterministic.'
                          default: 1
                          nullable: true
                        top_p:
                          type: number
                          format: float
                          description: 'An alternative to sampling with temperature,
                            called nucleus sampling, where the model considers the
                            results of the tokens with top_p probability mass.

                            So 0.1 means only the tokens comprising the top 10% probability
                            mass are considered.


                            We generally recommend altering this or temperature but
                            not both.'
                          default: 1
                          x-ms-client-name: topP
                          nullable: true
                        response_format:
                          description: The response format of the tool calls used
                            by this assistant.
                          x-ms-client-name: responseFormat
                          nullable: true
                        metadata:
                          type: object
                          description: A set of up to 16 key/value pairs that can
                            be attached to an object, used for storing additional
                            information about that object in a structured format.
                            Keys may be up to 64 characters in length and values may
                            be up to 512 characters in length.
                          additionalProperties:
                            type: string
                          nullable: true
                      required:
                      - id
                      - object
                      - created_at
                      - name
                      - description
                      - model
                      - instructions
                      - tools
                      - tool_resources
                      - temperature
                      - top_p
                      - metadata
                  first_id:
                    type: string
                    description: The first ID represented in this list.
                    x-ms-client-name: firstId
                  last_id:
                    type: string
                    description: The last ID represented in this list.
                    x-ms-client-name: lastId
                  has_more:
                    type: boolean
                    description: A value indicating whether there are additional values
