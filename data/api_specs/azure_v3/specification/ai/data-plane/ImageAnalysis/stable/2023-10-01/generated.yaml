servers:
- url: '{endpoint}/computervision'
  variables:
    endpoint:
      description: 'Azure AI Computer Vision endpoint (protocol and hostname, for
        example:

        https://<resource-name>.cognitiveservices.azure.com).'
      format: uri
      x-ms-skip-url-encoding: true
      default: none
components:
  parameters:
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
  securitySchemes:
    AadOauth2Auth:
      type: oauth2
      description: The Azure Active Directory OAuth2 Flow
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/token
          scopes:
            https://cognitiveservices.azure.com/.default: ''
    ApiKeyAuth:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
  schemas:
    Azure.Core.Foundations.Error:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this
            reported error.
          items:
            $ref: '#/components/schemas/Azure.Core.Foundations.Error'
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
      required:
      - code
      - message
    Azure.Core.Foundations.ErrorResponse:
      type: object
      description: A response containing error details.
      properties:
        error:
          $ref: '#/components/schemas/Azure.Core.Foundations.Error'
      required:
      - error
    Azure.Core.Foundations.InnerError:
      type: object
      description: An object containing more specific information about the error.
        As per Azure REST API guidelines - https://aka.ms/AzureRestApiGuidelines#handling-errors.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
    CaptionResult:
      type: object
      description: Represents a generated phrase that describes the content of the
        whole image.
      properties:
        confidence:
          type: number
          format: float
          description: 'A score, in the range of 0 to 1 (inclusive), representing
            the confidence that this description is accurate.

            Higher values indicating higher confidence.'
          minimum: 0
          maximum: 1
        text:
          type: string
          description: The text of the caption.
          minLength: 1
      required:
      - confidence
      - text
    CropRegion:
      type: object
      description: 'A region at the desired aspect ratio that can be used as image
        thumbnail.

        The region preserves as much content as possible from the analyzed image,
        with priority given to detected faces.'
      properties:
        aspectRatio:
          type: number
          format: float
          description: 'The aspect ratio of the crop region.

            Aspect ratio is calculated by dividing the width of the region in pixels
            by its height in pixels.

            The aspect ratio will be in the range 0.75 to 1.8 (inclusive) if provided
            by the developer during the analyze call.

            Otherwise, it will be in the range 0.5 to 2.0 (inclusive).'
          minimum: 0
        boundingBox:
          $ref: '#/components/schemas/ImageBoundingBox'
      required:
      - aspectRatio
      - boundingBox
    DenseCaption:
      type: object
      description: Represents a generated phrase that describes the content of the
        whole image or a region in the image
      properties:
        confidence:
          type: number
          format: float
          description: 'A score, in the range of 0 to 1 (inclusive), representing
            the confidence that this description is accurate.

            Higher values indicating higher confidence.'
          minimum: 0
          maximum: 1
        text:
          type: string
          description: The text of the caption.
          minLength: 1
        boundingBox:
          $ref: '#/components/schemas/ImageBoundingBox'
      required:
      - confidence
      - text
      - boundingBox
    DenseCaptionsResult:
      type: object
      description: 'Represents a list of up to 10 image captions for different regions
        of the image.

        The first caption always applies to the whole image.'
      properties:
        values:
          type: array
          description: The list of image captions.
          minItems: 1
          items:
            $ref: '#/components/schemas/DenseCaption'
      required:
      - values
    DetectedObject:
      type: object
      description: Represents a physical object detected in an image.
      properties:
        boundingBox:
          $ref: '#/components/schemas/ImageBoundingBox'
        tags:
          type: array
          description: A single-item list containing the object information.
          minItems: 0
          items:
            $ref: '#/components/schemas/DetectedTag'
      required:
      - boundingBox
      - tags
    DetectedPerson:
      type: object
      description: Represents a person detected in an image.
      properties:
        boundingBox:
          $ref: '#/components/schemas/ImageBoundingBox'
        confidence:
          type: number
          format: float
          description: 'A score, in the range of 0 to 1 (inclusive), representing
            the confidence that this detection was accurate.

            Higher values indicating higher confidence.'
          minimum: 0
          maximum: 1
          readOnly: true
      required:
      - boundingBox
      - confidence
    DetectedTag:
      type: object
      description: 'A content entity observation in the image. A tag can be a physical
        object, living being, scenery, or action

        that appear in the image.'
      properties:
        confidence:
          type: number
          format: float
          description: 'A score, in the range of 0 to 1 (inclusive), representing
            the confidence that this entity was observed.

            Higher values indicating higher confidence.'
          minimum: 0
          maximum: 1
        name:
          type: string
          description: Name of the entity.
          minLength: 1
      required:
      - confidence
      - name
    DetectedTextBlock:
      type: object
      description: Represents a single block of detected text in the image.
      properties:
        lines:
          type: array
          description: A list of text lines in this block.
          minItems: 1
          items:
            $ref: '#/components/schemas/DetectedTextLine'
      required:
      - lines
    DetectedTextLine:
      type: object
      description: Represents a single line of text in the image.
      properties:
        text:
          type: string
          description: Text content of the detected text line.
          minLength: 1
        boundingPolygon:
          type: array
          description: A bounding polygon around the text line. At the moment only
            quadrilaterals are supported (represented by 4 image points).
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/ImagePoint'
        words:
          type: array
          description: A list of words in this line.
          minItems: 1
          items:
            $ref: '#/components/schemas/DetectedTextWord'
      required:
      - text
      - boundingPolygon
      - words
    DetectedTextWord:
      type: object
      description: "A word object consisting of a contiguous sequence of characters.
        For non-space delimited languages,\r\nsuch as Chinese, Japanese, and Korean,
        each character is represented as its own word."
      properties:
        text:
          type: string
          description: Text content of the word.
          minLength: 1
        boundingPolygon:
          type: array
          description: A bounding polygon around the word. At the moment only quadrilaterals
            are supported (represented by 4 image points).
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/ImagePoint'
        confidence:
          type: number
          format: float
          description: The level of confidence that the word was detected. Confidence
            scores span the range of 0.0 to 1.0 (inclusive), with higher values indicating
            a higher confidence of detection.
          minimum: 0
          maximum: 1
      required:
      - text
      - boundingPolygon
      - confidence
    ImageAnalysisResult:
      type: object
      description: Represents the outcome of an Image Analysis operation.
      properties:
        captionResult:
          $ref: '#/components/schemas/CaptionResult'
        denseCaptionsResult:
          $ref: '#/components/schemas/DenseCaptionsResult'
        metadata:
          $ref: '#/components/schemas/ImageMetadata'
        modelVersion:
          type: string
          description: The cloud AI model used for the analysis
        objectsResult:
          $ref: '#/components/schemas/ObjectsResult'
        peopleResult:
          $ref: '#/components/schemas/PeopleResult'
        readResult:
          $ref: '#/components/schemas/ReadResult'
        smartCropsResult:
          $ref: '#/components/schemas/SmartCropsResult'
        tagsResult:
          $ref: '#/components/schemas/TagsResult'
      required:
      - metadata
      - modelVersion
    ImageBoundingBox:
      type: object
      description: A basic rectangle specifying a sub-region of the image.
      properties:
        x:
          type: integer
          format: int32
          description: X-coordinate of the top left point of the area, in pixels.
          minimum: 0
        y:
          type: integer
          format: int32
          description: Y-coordinate of the top left point of the area, in pixels.
          minimum: 0
        w:
          type: integer
          format: int32
          description: Width of the area, in pixels.
          minimum: 0
          x-ms-client-name: width
        h:
          type: integer
          format: int32
          description: Height of the area, in pixels.
          minimum: 0
          x-ms-client-name: height
      required:
      - x
      - y
      - w
      - h
    ImageMetadata:
      type: object
      description: Metadata associated with the analyzed image.
      properties:
        height:
          type: integer
          format: int32
          description: The height of the image in pixels.
          minimum: 1
        width:
          type: integer
          format: int32
          description: The width of the image in pixels.
          minimum: 1
      required:
      - height
      - width
    ImagePoint:
      type: object
      description: Represents the coordinates of a single pixel in the image.
      properties:
        x:
          type: integer
          format: int32
          description: The horizontal x-coordinate of this point, in pixels. Zero
            values corresponds to the left-most pixels in the image.
          minimum: 0
        y:
          type: integer
          format: int32
          description: The vertical y-coordinate of this point, in pixels. Zero values
            corresponds to the top-most pixels in the image.
          minimum: 0
      required:
      - x
      - y
    ImageUrl:
      type: object
      description: An object holding the publicly reachable URL of an image to analyze.
      properties:
        url:
          type: string
          format: uri
          description: Publicly reachable URL of an image to analyze.
      required:
      - url
    ObjectsResult:
      type: object
      description: Represents a list of physical object detected in an image and their
        location.
      properties:
        values:
          type: array
          description: A list of physical object detected in an image and their location.
          minItems: 0
          items:
            $ref: '#/components/schemas/DetectedObject'
      required:
      - values
    PeopleResult:
      type: object
      description: Represents a list of people detected in an image and their location.
      properties:
        values:
          type: array
          description: A list of people detected in an image and their location.
          minItems: 0
          items:
            $ref: '#/components/schemas/DetectedPerson'
      required:
      - values
    ReadResult:
      type: object
      description: The results of a Read (OCR) operation.
      properties:
        blocks:
          type: array
          description: A list of text blocks in the image. At the moment only one
            block is returned, containing all the text detected in the image.
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/DetectedTextBlock'
      required:
      - blocks
    SmartCropsResult:
      type: object
      description: 'Smart cropping result. A list of crop regions at the desired as
        aspect ratios (if provided) that can be used as image thumbnails.

        These regions preserve as much content as possible from the analyzed image,
        with priority given to detected faces.'
      properties:
        values:
          type: array
          description: A list of crop regions.
          minItems: 1
          items:
            $ref: '#/components/schemas/CropRegion'
      required:
      - values
    TagsResult:
      type: object
      description: 'A list of entities observed in the image. Tags can be physical
        objects, living being, scenery, or actions

        that appear in the image.'
      properties:
        values:
          type: array
          description: A list of tags.
          minItems: 0
          items:
            $ref: '#/components/schemas/DetectedTag'
      required:
      - values
