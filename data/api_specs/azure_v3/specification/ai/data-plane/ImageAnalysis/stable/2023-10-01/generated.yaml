openapi: 3.0.0
info:
  title: Image Analysis
  version: 2023-10-01
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- ApiKeyAuth: []
- AadOauth2Auth:
  - https://cognitiveservices.azure.com/.default
tags: []
paths:
  /imageanalysis:analyze:
    post:
      operationId: AnalyzeFromImageData
      description: Performs a single Image Analysis operation
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: features
        in: query
        description: 'A list of visual features to analyze.

          Seven visual features are supported: Caption, DenseCaptions, Read (OCR),
          Tags, Objects, SmartCrops, and People.

          At least one visual feature must be specified.'
        required: true
        x-ms-client-name: visualFeatures
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - tags
            - caption
            - denseCaptions
            - objects
            - read
            - smartCrops
            - people
            x-ms-enum:
              name: VisualFeatures
              modelAsString: true
              values:
              - name: tags
                value: tags
                description: Extract content tags for thousands of recognizable objects,
                  living beings, scenery, and actions that appear in the image.
              - name: caption
                value: caption
                description: Generate a human-readable caption sentence that describes
                  the content of the image.
              - name: denseCaptions
                value: denseCaptions
                description: Generate human-readable caption sentences for up to 10
                  different regions in the image, including one for the whole image.
              - name: objects
                value: objects
                description: Object detection. This is similar to tags, but focused
                  on detecting physical objects in the image and returning their location.
              - name: read
                value: read
                description: Extract printed or handwritten text from the image. Also
                  known as Optical Character Recognition (OCR).
              - name: smartCrops
                value: smartCrops
                description: Find representative sub-regions of the image for thumbnail
                  generation, at desired aspect ratios, with priority given to detected
                  faces.
              - name: people
                value: people
                description: Detect people in the image and return their location.
          minItems: 1
      - name: language
        in: query
        description: 'The desired language for result generation (a two-letter language
          code).

          If this option is not specified, the default value ''en'' is used (English).

          See https://aka.ms/cv-languages for a list of supported languages.'
        required: false
        schema:
          type: string
          minLength: 2
          default: en
      - name: gender-neutral-caption
        in: query
        description: "Boolean flag for enabling gender-neutral captioning for Caption
          and Dense Captions features.\nBy default captions may contain gender terms
          (for example: 'man', 'woman', or 'boy', 'girl'). \nIf you set this to \"true\",
          those will be replaced with gender-neutral terms (for example: 'person'
          or 'child')."
        required: false
        x-ms-client-name: genderNeutralCaption
        schema:
          type: boolean
          default: false
      - name: smartcrops-aspect-ratios
        in: query
        description: 'A list of aspect ratios to use for smart cropping.

          Aspect ratios are calculated by dividing the target crop width in pixels
          by the height in pixels.

          Supported values are between 0.75 and 1.8 (inclusive).

          If this parameter is not specified, the service will return one crop region
          with an aspect

          ratio it sees fit between 0.5 and 2.0 (inclusive).'
        required: false
        x-ms-client-name: smartCropsAspectRatios
        style: form
        explode: false
        schema:
          type: array
          items:
            type: number
            format: float
      - name: model-version
        in: query
        description: 'The version of cloud AI-model used for analysis.

          The format is the following: ''latest'' (default value) or ''YYYY-MM-DD''
          or ''YYYY-MM-DD-preview'', where ''YYYY'', ''MM'', ''DD'' are the year,
          month and day associated with the model.

          This is not commonly set, as the default always gives the latest AI model
          with recent improvements.

          If however you would like to make sure analysis results do not change over
          time, set this value to a specific model version.'
        required: false
        x-ms-client-name: modelVersion
        schema:
          type: string
          minLength: 6
          maxLength: 18
          pattern: ^(latest|\d{4}-\d{2}-\d{2})(-preview)?$
          default: latest
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: The image to be analyzed
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysisResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
