          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    AwsRdsDBSnapshotProperties:
      type: object
      description: Definition of awsRdsDBSnapshot
      properties:
        allocatedStorage:
          type: integer
          format: int32
          description: <p>Specifies the allocated storage size in gibibytes (GiB).</p>
        availabilityZone:
          type: string
          description: <p>Specifies the name of the Availability Zone the DB instance
            was located in at the time of the DB snapshot.</p>
        dbInstanceIdentifier:
          type: string
          description: <p>Specifies the DB instance identifier of the DB instance
            this DB snapshot was created from.</p>
        dbSnapshotArn:
          type: string
          description: <p>The Amazon Resource Name (ARN) for the DB snapshot.</p>
        dbSnapshotIdentifier:
          type: string
          description: <p>Specifies the identifier for the DB snapshot.</p>
        dbSystemId:
          type: string
          description: <p>The Oracle system identifier (SID), which is the name of
            the Oracle database instance that manages your database files. The Oracle
            SID is also the name of your CDB.</p>
        dbiResourceId:
          type: string
          description: <p>The identifier for the source DB instance, which can't be
            changed and which is unique to an Amazon Web Services Region.</p>
        dedicatedLogVolume:
          type: boolean
          description: <p>Indicates whether the DB instance has a dedicated log volume
            (DLV) enabled.</p>
        encrypted:
          type: boolean
          description: <p>Indicates whether the DB snapshot is encrypted.</p>
        engine:
          type: string
          description: <p>Specifies the name of the database engine.</p>
        engineVersion:
          type: string
          description: <p>Specifies the version of the database engine.</p>
        iamDatabaseAuthenticationEnabled:
          type: boolean
          description: <p>Indicates whether mapping of Amazon Web Services Identity
            and Access Management (IAM) accounts to database accounts is enabled.</p>
        instanceCreateTime:
          type: string
          format: date-time
          description: <p>Specifies the time in Coordinated Universal Time (UTC) when
            the DB instance, from which the snapshot was taken, was created.</p>
        iops:
          type: integer
          format: int32
          description: <p>Specifies the Provisioned IOPS (I/O operations per second)
            value of the DB instance at the time of the snapshot.</p>
        kmsKeyId:
          type: string
          description: <p>If <code>Encrypted</code> is true, the Amazon Web Services
            KMS key identifier for the encrypted DB snapshot.</p> <p>The Amazon Web
            Services KMS key identifier is the key ARN, key ID, alias ARN, or alias
            name for the KMS key.</p>
        licenseModel:
          type: string
          description: <p>License model information for the restored DB instance.</p>
        masterUsername:
          type: string
          description: <p>Provides the master username for the DB snapshot.</p>
        multiTenant:
          type: boolean
          description: <p>Indicates whether the snapshot is of a DB instance using
            the multi-tenant configuration (TRUE) or the single-tenant configuration
            (FALSE).</p>
        optionGroupName:
          type: string
          description: <p>Provides the option group name for the DB snapshot.</p>
        originalSnapshotCreateTime:
          type: string
          format: date-time
          description: <p>Specifies the time of the CreateDBSnapshot operation in
            Coordinated Universal Time (UTC). Doesn't change when the snapshot is
            copied.</p>
        percentProgress:
          type: integer
          format: int32
          description: <p>The percentage of the estimated data that has been transferred.</p>
        port:
          type: integer
          format: int32
          description: <p>Specifies the port that the database engine was listening
            on at the time of the snapshot.</p>
        processorFeatures:
          type: array
          description: <p>The number of CPU cores and the number of threads per core
            for the DB instance class of the DB instance when the DB snapshot was
            created.</p>
          items:
            type: object
            description: Definition of ProcessorFeature
            properties:
              name:
                type: string
                description: <p>The name of the processor feature. Valid names are
                  <code>coreCount</code> and <code>threadsPerCore</code>.</p>
              value:
                type: string
                description: <p>The value of a processor feature name.</p>
          x-ms-identifiers: []
        snapshotCreateTime:
          type: string
          format: date-time
          description: <p>Specifies when the snapshot was taken in Coordinated Universal
            Time (UTC). Changes for the copy when the snapshot is copied.</p>
        snapshotDatabaseTime:
          type: string
          format: date-time
          description: <p>The timestamp of the most recent transaction applied to
            the database that you're backing up. Thus, if you restore a snapshot,
            SnapshotDatabaseTime is the most recent transaction in the restored DB
            instance. In contrast, originalSnapshotCreateTime specifies the system
            time that the snapshot completed.</p> <p>If you back up a read replica,
            you can determine the replica lag by comparing SnapshotDatabaseTime with
            originalSnapshotCreateTime. For example, if originalSnapshotCreateTime
            is two hours later than SnapshotDatabaseTime, then the replica lag is
            two hours.</p>
        snapshotTarget:
          type: string
          description: '<p>Specifies where manual snapshots are stored: Amazon Web
            Services Outposts or the Amazon Web Services Region.</p>'
        snapshotType:
          type: string
          description: <p>Provides the type of the DB snapshot.</p>
        sourceDBSnapshotIdentifier:
          type: string
          description: <p>The DB snapshot Amazon Resource Name (ARN) that the DB snapshot
            was copied from. It only has a value in the case of a cross-account or
            cross-Region copy.</p>
        sourceRegion:
          type: string
          description: <p>The Amazon Web Services Region that the DB snapshot was
