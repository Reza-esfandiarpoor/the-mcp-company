    AwsDaxClusterProperties:
      type: object
      description: Definition of awsDaxCluster
      properties:
        activeNodes:
          type: integer
          format: int32
          description: <p>The number of nodes in the cluster that are active (i.e.,
            capable of serving requests).</p>
        clusterArn:
          type: string
          description: <p>The Amazon Resource Name (ARN) that uniquely identifies
            the cluster. </p>
        clusterDiscoveryEndpoint:
          description: <p>The endpoint for this DAX cluster, consisting of a DNS name,
            a port number, and a URL. Applications should use the URL to configure
            the DAX client to find their cluster.</p>
          type: object
          properties:
            address:
              type: string
              description: <p>The DNS hostname of the endpoint.</p>
            port:
              type: integer
              format: int32
              description: <p>The port number that applications should use to connect
                to the endpoint.</p>
            url:
              type: string
              description: <p>The URL that applications should use to connect to the
                endpoint. The default ports are 8111 for the 'dax' protocol and 9111
                for the 'daxs' protocol.</p>
        clusterEndpointEncryptionType:
          description: <p>The type of encryption supported by the cluster's endpoint.
            Values are:</p> <ul> <li> <p> <code>NONE</code> for no encryption</p>
            <p> <code>TLS</code> for Transport Layer Security</p> </li> </ul>
          type: object
          properties:
            value:
              description: Property value
              type: string
              enum:
              - NONE
              - TLS
              x-ms-enum:
                name: ClusterEndpointEncryptionType
                modelAsString: true
                values:
                - name: NONE
                  value: NONE
                  description: ClusterEndpointEncryptionType enum NONE
                - name: TLS
                  value: TLS
                  description: ClusterEndpointEncryptionType enum TLS
        clusterName:
          type: string
          description: <p>The name of the DAX cluster.</p>
        description:
          type: string
          description: <p>The description of the cluster.</p>
        iamRoleArn:
          type: string
          description: <p>A valid Amazon Resource Name (ARN) that identifies an IAM
            role. At runtime, DAX will assume this role and use the role's permissions
            to access DynamoDB on your behalf.</p>
        nodeIdsToRemove:
          type: array
          description: <p>A list of nodes to be removed from the cluster.</p>
          items:
            type: string
        nodeType:
          type: string
          description: <p>The node type for the nodes in the cluster. (All nodes in
            a DAX cluster are of the same type.)</p>
        nodes:
          type: array
          description: <p>A list of nodes that are currently in the cluster.</p>
          items:
            type: object
            description: Definition of Node
            properties:
              availabilityZone:
                type: string
                description: <p>The Availability Zone (AZ) in which the node has been
                  deployed.</p>
              endpoint:
                description: <p>The endpoint for the node, consisting of a DNS name
                  and a port number. Client applications can connect directly to a
                  node endpoint, if desired (as an alternative to allowing DAX client
                  software to intelligently route requests and responses to nodes
                  in the DAX cluster.</p>
                type: object
                properties:
