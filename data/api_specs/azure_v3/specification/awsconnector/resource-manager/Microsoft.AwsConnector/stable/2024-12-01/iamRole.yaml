                additionalProperties: {}
              policyName:
                type: string
                description: The friendly name (not ARN) identifying the policy.
          x-ms-identifiers: []
        roleId:
          type: string
          description: Property roleId
        roleName:
          type: string
          description: 'A name for the IAM role, up to 64 characters in length. For
            valid values, see the ``RoleName`` parameter for the [CreateRole](https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateRole.html)
            action in the *User Guide*. This parameter allows (per its [regex pattern](https://docs.aws.amazon.com/http://wikipedia.org/wiki/regex))
            a string of characters consisting of upper and lowercase alphanumeric
            characters with no spaces. You can also include any of the following characters:
            _+=,.@-. The role name must be unique within the account. Role names are
            not distinguished by case. For example, you cannot create roles named
            both ''Role1'' and ''role1''. If you don''t specify a name, CFN generates
            a unique physical ID and uses that ID for the role name. If you specify
            a name, you must specify the ``CAPABILITY_NAMED_IAM`` value to acknowledge
            your template''s capabilities. For more information, see [Acknowledging
            Resources in Templates](https://docs.aws.amazon.com/AWSCloudFormation/latest/Use'
        tags:
          type: array
          description: A list of tags that are attached to the role. For more information
            about tagging, see [Tagging IAM resources](https://docs.aws.amazon.com/IAM/latest/UserGuide/id_tags.html)
            in the *IAM User Guide*.
          items:
            type: object
            description: Definition of Tag
            properties:
              key:
                type: string
                description: The key name that can be used to look up or retrieve
                  the associated value. For example, ``Department`` or ``Cost Center``
                  are common choices.
              value:
                type: string
                description: The value associated with this tag. For example, tags
                  with a key name of ``Department`` could have values such as ``Human
                  Resources``, ``Accounting``, and ``Support``. Tags with a key name
                  of ``Cost Center`` might have values that consist of the number
                  associated with the different cost centers in your company. Typically,
                  many resources have tags with the same key name but with different
                  values.   AWS always interprets the tag ``Value`` as a single string.
                  If you need to store an array, you can store comma-separated values
                  in the string. However, you must interpret the value in your code.
