          type: object
          description: The trust policy that is associated with this role. Trust policies
            define which entities can assume the role. You can associate only one
            trust policy with a role. For an example of a policy that can be used
            to assume a role, see [Template Examples](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-iam-role.html#aws-resource-iam-role--examples).
