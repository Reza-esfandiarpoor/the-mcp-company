                                    property for any future updates to the DB cluster.
                                    When you specify this property for an update,
                                    the DB cluster is not restored from the snapshot
                                    again, and the data in the database is not changed.
                                    However, if you don't specify the SnapshotIdentifier
                                    property, an empty DB cluster is created, and
                                    the original DB cluster is deleted. If you specify
                                    a property that is different from the previous
                                    snapshot restore property, the DB cluster is restored
