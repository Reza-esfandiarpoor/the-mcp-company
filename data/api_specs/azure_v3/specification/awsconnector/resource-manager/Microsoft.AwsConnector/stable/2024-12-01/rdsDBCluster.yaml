                must be a time in Universal Coordinated Time (UTC) format. An example:
                2015-03-07T23:45:00Z'
            restoreType:
              type: string
              description: The type of restore to be performed. You can specify one
                of the following values:full-copy - The new DB cluster is restored
                as a full copy of the source DB cluster.copy-on-write - The new DB
                cluster is restored as a clone of the source DB cluster.
