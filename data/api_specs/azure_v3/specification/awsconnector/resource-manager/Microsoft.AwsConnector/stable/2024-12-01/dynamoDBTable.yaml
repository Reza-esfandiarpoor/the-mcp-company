            data items across partitions, based on their partition key values. The
            sort key of an item is also known as its *range attribute*. The term ''range
            attribute'' derives from the way DynamoDB stores items with the same partition
            key physically close together, in sorted order by the sort key value.'
          items:
            type: object
            description: Definition of KeySchema
            properties:
              attributeName:
                type: string
                description: The name of a key attribute.
              keyType:
                type: string
                description: 'The role that this key attribute will assume:  +   ``HASH``
                  - partition key  +   ``RANGE`` - sort key    The partition key of
                  an item is also known as its *hash attribute*. The term ''hash attribute''
                  derives from DynamoDB''s usage of an internal hash function to evenly
                  distribute data items across partitions, based on their partition
                  key values. The sort key of an item is also known as its *range
                  attribute*. The term ''range attribute'' derives from the way DynamoDB
                  stores items with the same partition key physically close together,
                  in sorted order by the sort key value.'
          x-ms-identifiers: []
        projection:
          description: Represents attributes that are copied (projected) from the
            table into the local secondary index. These are in addition to the primary
            key attributes and index key attributes, which are automatically projected.
            Represents attributes that are copied (projected) from the table into
            an index. These are in addition to the primary key attributes and index
            key attributes, which are automatically projected.
          type: object
          properties:
            nonKeyAttributes:
              type: array
              description: Represents the non-key attribute names which will be projected
                into the index. For local secondary indexes, the total count of ``NonKeyAttributes``
                summed across all of the local secondary indexes, must not exceed
                100. If you project the same attribute into two different indexes,
                this counts as two distinct attributes when determining the total.
              items:
                type: string
            projectionType:
              type: string
              description: 'The set of attributes that are projected into the index:  +   ``KEYS_ONLY``
                - Only the index and primary keys are projected into the index.  +   ``INCLUDE``
                - In addition to the attributes described in ``KEYS_ONLY``, the secondary
                index will include other non-key attributes that you specify.  +   ``ALL``
                - All of the table attributes are projected into the index.   When
                using the DynamoDB console, ``ALL`` is selected by default.'
