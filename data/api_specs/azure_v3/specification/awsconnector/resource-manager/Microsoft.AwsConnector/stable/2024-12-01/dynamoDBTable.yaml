          scopes:
            user_impersonation: impersonate your user account
  schemas:
    AttributeDefinition:
      type: object
      description: Definition of AttributeDefinition
      properties:
        attributeName:
          type: string
          description: A name for the attribute.
        attributeType:
          type: string
          description: 'The data type for the attribute, where:  +   ``S`` - the attribute
            is of type String  +   ``N`` - the attribute is of type Number  +   ``B``
            - the attribute is of type Binary'
    AwsDynamoDBTableProperties:
      type: object
      description: Definition of awsDynamoDBTable
      properties:
        arn:
          type: string
          description: Property arn
        attributeDefinitions:
          type: array
          description: 'A list of attributes that describe the key schema for the
            table and indexes. This property is required to create a DDB table. Update
            requires: [Some interruptions](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-updating-stacks-update-behaviors.html#update-some-interrupt).
            Replacement if you edit an existing AttributeDefinition.'
          items:
            type: object
            description: Definition of AttributeDefinition
            properties:
              attributeName:
                type: string
                description: A name for the attribute.
              attributeType:
                type: string
                description: 'The data type for the attribute, where:  +   ``S`` -
                  the attribute is of type String  +   ``N`` - the attribute is of
                  type Number  +   ``B`` - the attribute is of type Binary'
          x-ms-identifiers: []
        billingMode:
          type: string
          description: 'Specify how you are charged for read and write throughput
            and how you manage capacity. Valid values include:  +   ``PROVISIONED``
            - We recommend using ``PROVISIONED`` for predictable workloads. ``PROVISIONED``
            sets the billing mode to [Provisioned Mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadWriteCapacityMode.html#HowItWorks.ProvisionedThroughput.Manual).  +   ``PAY_PER_REQUEST``
            - We recommend using ``PAY_PER_REQUEST`` for unpredictable workloads.
            ``PAY_PER_REQUEST`` sets the billing mode to [On-Demand Mode](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadWriteCapacityMode.html#HowItWorks.OnDemand).   If
            not specified, the default is ``PROVISIONED``.'
        contributorInsightsSpecification:
          description: The settings used to enable or disable CloudWatch Contributor
            Insights for the specified table. The settings used to enable or disable
            CloudWatch Contributor Insights.
          type: object
          properties:
            enabled:
              type: boolean
              description: Indicates whether CloudWatch Contributor Insights are to
                be enabled (true) or disabled (false).
        deletionProtectionEnabled:
          type: boolean
          description: Determines if a table is protected from deletion. When enabled,
            the table cannot be deleted by any user or process. This setting is disabled
            by default. For more information, see [Using deletion protection](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithTables.Basics.html#WorkingWithTables.Basics.DeletionProtection)
            in the *Developer Guide*.
        globalSecondaryIndexes:
          type: array
          description: 'Global secondary indexes to be created on the table. You can
            create up to 20 global secondary indexes.  If you update a table to include
            a new global secondary index, CFNlong initiates the index creation and
            then proceeds with the stack update. CFNlong doesn''t wait for the index
            to complete creation because the backfilling phase can take a long time,
            depending on the size of the table. You can''t use the index or update
            the table until the index''s status is ``ACTIVE``. You can track its status
            by using the DynamoDB [DescribeTable](https://docs.aws.amazon.com/cli/latest/reference/dynamodb/describe-table.html)
            command. If you add or delete an index during an update, we recommend
            that you don''t update any other resources. If your stack fails to update
            and is rolled back while adding a new index, you must manually delete
            the index.  Updates are not supported. The following are exceptions:  +  If
            you update either the contributor insights specification or the provisioned
            throughput values of global secondary indexes, you can update the table
            without interruption.  +  You can delete or add one global secondary index
            without interruption. If you do both in the same update (for example,
            by changing the index''s logical ID), the update fails.'
          items:
            type: object
            description: Definition of GlobalSecondaryIndex
            properties:
              contributorInsightsSpecification:
                description: The settings used to enable or disable CloudWatch Contributor
                  Insights for the specified global secondary index. The settings
                  used to enable or disable CloudWatch Contributor Insights.
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: Indicates whether CloudWatch Contributor Insights
                      are to be enabled (true) or disabled (false).
              indexName:
                type: string
                description: The name of the global secondary index. The name must
                  be unique among all other indexes on this table.
              keySchema:
                type: array
                description: 'The complete key schema for a global secondary index,
                  which consists of one or more pairs of attribute names and key types:  +   ``HASH``
                  - partition key  +   ``RANGE`` - sort key    The partition key of
                  an item is also known as its *hash attribute*. The term ''hash attribute''
                  derives from DynamoDB''s usage of an internal hash function to evenly
                  distribute data items across partitions, based on their partition
                  key values. The sort key of an item is also known as its *range
                  attribute*. The term ''range attribute'' derives from the way DynamoDB
                  stores items with the same partition key physically close together,
                  in sorted order by the sort key value.'
                items:
                  type: object
                  description: Definition of KeySchema
                  properties:
                    attributeName:
                      type: string
                      description: The name of a key attribute.
                    keyType:
                      type: string
                      description: 'The role that this key attribute will assume:  +   ``HASH``
                        - partition key  +   ``RANGE`` - sort key    The partition
                        key of an item is also known as its *hash attribute*. The
                        term ''hash attribute'' derives from DynamoDB''s usage of
                        an internal hash function to evenly distribute data items
                        across partitions, based on their partition key values. The
                        sort key of an item is also known as its *range attribute*.
                        The term ''range attribute'' derives from the way DynamoDB
                        stores items with the same partition key physically close
                        together, in sorted order by the sort key value.'
                x-ms-identifiers: []
              projection:
                description: Represents attributes that are copied (projected) from
                  the table into the global secondary index. These are in addition
                  to the primary key attributes and index key attributes, which are
                  automatically projected. Represents attributes that are copied (projected)
                  from the table into an index. These are in addition to the primary
                  key attributes and index key attributes, which are automatically
                  projected.
                type: object
                properties:
                  nonKeyAttributes:
                    type: array
                    description: Represents the non-key attribute names which will
                      be projected into the index. For local secondary indexes, the
                      total count of ``NonKeyAttributes`` summed across all of the
                      local secondary indexes, must not exceed 100. If you project
                      the same attribute into two different indexes, this counts as
                      two distinct attributes when determining the total.
                    items:
                      type: string
                  projectionType:
                    type: string
                    description: 'The set of attributes that are projected into the
                      index:  +   ``KEYS_ONLY`` - Only the index and primary keys
                      are projected into the index.  +   ``INCLUDE`` - In addition
                      to the attributes described in ``KEYS_ONLY``, the secondary
                      index will include other non-key attributes that you specify.  +   ``ALL``
                      - All of the table attributes are projected into the index.   When
                      using the DynamoDB console, ``ALL`` is selected by default.'
              provisionedThroughput:
                description: Represents the provisioned throughput settings for the
                  specified global secondary index. For current minimum and maximum
                  provisioned throughput values, see [Service, Account, and Table
                  Quotas](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Limits.html)
                  in the *Amazon DynamoDB Developer Guide*. Throughput for the specified
                  table, which consists of values for ``ReadCapacityUnits`` and ``WriteCapacityUnits``.
                  For more information about the contents of a provisioned throughput
                  structure, see [Table ProvisionedThroughput](https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_ProvisionedThroughput.html).
                type: object
                properties:
                  readCapacityUnits:
                    type: integer
                    format: int32
                    description: The maximum number of strongly consistent reads consumed
                      per second before DynamoDB returns a ``ThrottlingException``.
                      For more information, see [Specifying Read and Write Requirements](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProvisionedThroughput.html)
                      in the *Amazon DynamoDB Developer Guide*. If read/write capacity
                      mode is ``PAY_PER_REQUEST`` the value is set to 0.
                  writeCapacityUnits:
                    type: integer
                    format: int32
                    description: The maximum number of writes consumed per second
                      before DynamoDB returns a ``ThrottlingException``. For more
