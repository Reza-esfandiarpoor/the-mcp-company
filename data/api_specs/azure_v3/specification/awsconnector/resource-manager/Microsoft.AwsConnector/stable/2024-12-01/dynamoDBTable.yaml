                                resourcePolicy:
                                  description: "A resource-based policy document that\
                                    \ contains permissions to add to the specified\
                                    \ table. In a CFNshort template, you can provide\
                                    \ the policy in JSON or YAML format because CFNshort\
                                    \ converts YAML to JSON before submitting it to\
                                    \ DDB. For more information about resource-based\
                                    \ policies, see [Using resource-based policies\
                                    \ for](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html)\
                                    \ and [Resource-based policy examples](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-examples.html).\
                                    \ When you attach a resource-based policy while\
                                    \ creating a table, the policy creation is *strongly\
                                    \ consistent*. For information about the considerations\
                                    \ that you should keep in mind while attaching\
                                    \ a resource-based policy, see [Resource-based\
                                    \ policy considerations](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-considerations.html).\
                                    \ Creates or updates a resource-based policy document\
                                    \ that contains the permissions for DDB resources,\
                                    \ such as a table, its indexes, and stream. Resource-based\
                                    \ policies let you define access permissions by\
                                    \ specifying who has access to each resource,\
                                    \ and the actions they are allowed to perform\
                                    \ on each resource. In a CFNshort template, you\
                                    \ can provide the policy in JSON or YAML format\
                                    \ because CFNshort converts YAML to JSON before\
                                    \ submitting it to DDB. For more information about\
                                    \ resource-based policies, see [Using resource-based\
                                    \ policies for](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html)\
                                    \ and [Resource-based policy examples](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-examples.html).\
                                    \ While defining resource-based policies in your\
                                    \ CFNshort templates, the following considerations\
                                    \ apply:  +  The maximum size supported for a\
                                    \ resource-based policy document in JSON format\
                                    \ is 20 KB. DDB counts whitespaces when calculating\
                                    \ the size of a policy against this limit.   +\
                                    \  Resource-based policies don't support [drift\
                                    \ detection](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html#).\
                                    \ If you update a policy outside of the CFNshort\
                                    \ stack template, you'll need to update the CFNshort\
                                    \ stack with the changes.  +  Resource-based policies\
                                    \ don't support out-of-band changes. If you add,\
