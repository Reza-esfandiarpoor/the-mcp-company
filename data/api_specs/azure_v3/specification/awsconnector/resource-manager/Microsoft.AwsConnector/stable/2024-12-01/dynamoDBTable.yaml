    StreamSpecification:
      type: object
      description: Definition of StreamSpecification
      properties:
        resourcePolicy:
          description: "Creates or updates a resource-based policy document that contains\
            \ the permissions for DDB resources, such as a table's streams. Resource-based\
            \ policies let you define access permissions by specifying who has access\
            \ to each resource, and the actions they are allowed to perform on each\
            \ resource. In a CFNshort template, you can provide the policy in JSON\
            \ or YAML format because CFNshort converts YAML to JSON before submitting\
            \ it to DDB. For more information about resource-based policies, see [Using\
            \ resource-based policies for](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html)\
            \ and [Resource-based policy examples](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-examples.html).\
            \ Creates or updates a resource-based policy document that contains the\
            \ permissions for DDB resources, such as a table, its indexes, and stream.\
            \ Resource-based policies let you define access permissions by specifying\
            \ who has access to each resource, and the actions they are allowed to\
            \ perform on each resource. In a CFNshort template, you can provide the\
            \ policy in JSON or YAML format because CFNshort converts YAML to JSON\
            \ before submitting it to DDB. For more information about resource-based\
            \ policies, see [Using resource-based policies for](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html)\
            \ and [Resource-based policy examples](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-examples.html).\
            \ While defining resource-based policies in your CFNshort templates, the\
            \ following considerations apply:  +  The maximum size supported for a\
            \ resource-based policy document in JSON format is 20 KB. DDB counts whitespaces\
            \ when calculating the size of a policy against this limit.   +  Resource-based\
            \ policies don't support [drift detection](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html#).\
            \ If you update a policy outside of the CFNshort stack template, you'll\
            \ need to update the CFNshort stack with the changes.  +  Resource-based\
            \ policies don't support out-of-band changes. If you add, update, or delete\
            \ a policy outside of the CFNshort template, the change won't be overwritten\
            \ if there are no changes to the policy within the template. For example,\
            \ say that your template contains a resource-based policy, which you later\
            \ update outside of the template. If you don't make any changes to the\
            \ policy in the template, the updated policy in DDB won\u2019t be synced\
            \ with the policy in the template. Conversely, say that your template\
            \ doesn\u2019t contain a resource-based policy, but you add a policy outside\
            \ of the template. This policy won\u2019t be removed from DDB as long\
            \ as you don\u2019t add it to the template. When you add a policy to the\
            \ template and update the stack, the existing policy in DDB will be updated\
            \ to match the one defined in the template.   For a full list of all considerations,\
            \ see [Resource-based policy considerations](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-considerations.html)."
          type: object
          properties:
            policyDocument:
              description: A resource-based policy document that contains permissions
                to add to the specified DDB table, index, or both. In a CFNshort template,
                you can provide the policy in JSON or YAML format because CFNshort
                converts YAML to JSON before submitting it to DDB. For more information
                about resource-based policies, see [Using resource-based policies
                for](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/access-control-resource-based.html)
                and [Resource-based policy examples](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/rbac-examples.html).
        streamViewType:
          type: string
          description: 'When an item in the table is modified, ``StreamViewType``
            determines what information is written to the stream for this table. Valid
            values for ``StreamViewType`` are:  +   ``KEYS_ONLY`` - Only the key attributes
            of the modified item are written to the stream.  +   ``NEW_IMAGE`` - The
            entire item, as it appears after it was modified, is written to the stream.  +   ``OLD_IMAGE``
            - The entire item, as it appeared before it was modified, is written to
            the stream.  +   ``NEW_AND_OLD_IMAGES`` - Both the new and the old item
            images of the item are written to the stream.'
    Tag:
      type: object
