                is supported. Amazon EMR chooses the Availability Zone with the best
                fit from among the list of <code>RequestedEc2AvailabilityZones</code>,
                and then launches all cluster instances within that Availability Zone.
                If you do not specify this value, Amazon EMR chooses the Availability
                Zone for you. <code>RequestedEc2SubnetIDs</code> and <code>RequestedEc2AvailabilityZones</code>
