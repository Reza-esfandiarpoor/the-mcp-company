                exist within the same VPC. Amazon EMR chooses the Amazon EC2 subnet
                with the best fit from among the list of <code>RequestedEc2SubnetIds</code>,
                and then launches all cluster instances within that Subnet. If this
                value is not specified, and the account and Region support EC2-Classic
                networks, the cluster launches instances in the EC2-Classic network
                and uses <code>RequestedEc2AvailabilityZones</code> instead of this
                setting. If EC2-Classic is not supported, and no Subnet is specified,
