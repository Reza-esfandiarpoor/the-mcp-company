          description: Describes the protection on the file system. Describes the
            protection on the file system.
          type: object
          properties:
            replicationOverwriteProtection:
              description: "The status of the file system's replication overwrite\
                \ protection.  +   ``ENABLED`` \u2013 The file system cannot be used\
                \ as the destination file system in a replication configuration. The\
                \ file system is writeable. Replication overwrite protection is ``ENABLED``\
                \ by default.   +   ``DISABLED`` \u2013 The file system can be used\
                \ as the destination file system in a replication configuration. The\
                \ file system is read-only and can only be modified by EFS replication.\
                \  +   ``REPLICATING`` \u2013 The file system is being used as the\
                \ destination file system in a replication configuration. The file\
                \ system is read-only and is only modified only by EFS replication.\
                \   If the replication configuration is deleted, the file system's\
                \ replication overwrite protection is re-enabled, the file system\
                \ becomes writeable."
