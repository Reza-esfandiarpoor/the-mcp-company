            system''s ``LifecycleConfiguration`` object. A ``LifecycleConfiguration``
            object informs Lifecycle management of the following:  +  When to move
            files in the file system from primary storage to IA storage.  + When to
            move files in the file system from primary storage or IA storage to Archive
