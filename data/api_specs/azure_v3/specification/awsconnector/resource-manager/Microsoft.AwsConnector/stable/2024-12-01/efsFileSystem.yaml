          type: string
          description: Property fileSystemId
        fileSystemPolicy:
          description: The ``FileSystemPolicy`` for the EFS file system. A file system
            policy is an IAM resource policy used to control NFS access to an EFS
            file system. For more information, see [Using to control NFS access to
            Amazon EFS](https://docs.aws.amazon.com/efs/latest/ug/iam-access-control-nfs-efs.html)
            in the *Amazon EFS User Guide*.
