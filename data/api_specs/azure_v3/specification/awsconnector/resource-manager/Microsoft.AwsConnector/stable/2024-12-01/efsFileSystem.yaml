      description: Definition of awsEfsFileSystem
      properties:
        arn:
          type: string
          description: Property arn
        availabilityZoneName:
          type: string
          description: For One Zone file systems, specify the AWS Availability Zone
            in which to create the file system. Use the format ``us-east-1a`` to specify
            the Availability Zone. For more information about One Zone file systems,
