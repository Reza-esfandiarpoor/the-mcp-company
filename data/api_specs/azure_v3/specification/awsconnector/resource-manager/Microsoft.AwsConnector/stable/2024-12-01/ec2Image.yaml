                                            type: integer
                                            format: int32
                                            description: '<p>The throughput that the
                                              volume supports, in MiB/s.</p> <p>This
                                              parameter is valid only for <code>gp3</code>
                                              volumes.</p> <p>Valid Range: Minimum
