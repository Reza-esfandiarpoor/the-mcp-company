                                        <code>false</code> (unencrypted).</p> </li>
                                        <li> <p>If you are creating a block device
                                        mapping from an <b>existing encrypted or unencrypted
                                        snapshot</b>, you must omit this parameter.
                                        If you include this parameter, the request
                                        will fail, regardless of the value that you
