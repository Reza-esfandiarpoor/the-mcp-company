                                  type: boolean
                                  description: <p>Indicates whether the encryption
                                    state of an EBS volume is changed while being
                                    restored from a backing snapshot. The effect of
                                    setting the encryption state to <code>true</code>
                                    depends on the volume origin (new or from a snapshot),
                                    starting encryption state, ownership, and whether
                                    encryption by default is enabled. For more information,
                                    see <a href='https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html#encryption-parameters'>Amazon
                                    EBS encryption</a> in the <i>Amazon EBS User Guide</i>.</p>
                                    <p>In no case can you remove encryption from an
                                    encrypted volume.</p> <p>Encrypted volumes can
                                    only be attached to instances that support Amazon
                                    EBS encryption. For more information, see <a href='https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption-requirements.html#ebs-encryption_supported_instances'>Supported
                                    instance types</a>.</p> <p>This parameter is not
                                    returned by <a>DescribeImageAttribute</a>.</p>
                                    <p>For <a>CreateImage</a> and <a>RegisterImage</a>,
                                    whether you can include this parameter, and the
                                    allowed values differ depending on the type of
                                    block device mapping you are creating.</p> <ul>
                                    <li> <p>If you are creating a block device mapping
                                    for a <b>new (empty) volume</b>, you can include
                                    this parameter, and specify either <code>true</code>
                                    for an encrypted volume, or <code>false</code>
                                    for an unencrypted volume. If you omit this parameter,
                                    it defaults to <code>false</code> (unencrypted).</p>
                                    </li> <li> <p>If you are creating a block device
                                    mapping from an <b>existing encrypted or unencrypted
                                    snapshot</b>, you must omit this parameter. If
                                    you include this parameter, the request will fail,
                                    regardless of the value that you specify.</p>
                                    </li> <li> <p>If you are creating a block device
                                    mapping from an <b>existing unencrypted volume</b>,
                                    you can include this parameter, but you must specify
                                    <code>false</code>. If you specify <code>true</code>,
                                    the request will fail. In this case, we recommend
                                    that you omit the parameter.</p> </li> <li> <p>If
                                    you are creating a block device mapping from an
                                    <b>existing encrypted volume</b>, you can include
