    BlockDeviceMapping:
      type: object
      description: Definition of BlockDeviceMapping
      properties:
        deviceName:
          type: string
          description: <p>The device name (for example, <code>/dev/sdh</code> or <code>xvdh</code>).</p>
        ebs:
          description: <p>Parameters used to automatically set up EBS volumes when
            the instance is launched.</p>
          type: object
          properties:
            deleteOnTermination:
              type: boolean
              description: <p>Indicates whether the EBS volume is deleted on instance
                termination. For more information, see <a href='https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/terminating-instances.html#preserving-volumes-on-termination'>Preserving
                Amazon EBS volumes on instance termination</a> in the <i>Amazon EC2
                User Guide</i>.</p>
            encrypted:
              type: boolean
              description: <p>Indicates whether the encryption state of an EBS volume
                is changed while being restored from a backing snapshot. The effect
                of setting the encryption state to <code>true</code> depends on the
                volume origin (new or from a snapshot), starting encryption state,
                ownership, and whether encryption by default is enabled. For more
                information, see <a href='https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption.html#encryption-parameters'>Amazon
                EBS encryption</a> in the <i>Amazon EBS User Guide</i>.</p> <p>In
                no case can you remove encryption from an encrypted volume.</p> <p>Encrypted
                volumes can only be attached to instances that support Amazon EBS
                encryption. For more information, see <a href='https://docs.aws.amazon.com/ebs/latest/userguide/ebs-encryption-requirements.html#ebs-encryption_supported_instances'>Supported
                instance types</a>.</p> <p>This parameter is not returned by <a>DescribeImageAttribute</a>.</p>
                <p>For <a>CreateImage</a> and <a>RegisterImage</a>, whether you can
                include this parameter, and the allowed values differ depending on
                the type of block device mapping you are creating.</p> <ul> <li> <p>If
                you are creating a block device mapping for a <b>new (empty) volume</b>,
                you can include this parameter, and specify either <code>true</code>
                for an encrypted volume, or <code>false</code> for an unencrypted
                volume. If you omit this parameter, it defaults to <code>false</code>
                (unencrypted).</p> </li> <li> <p>If you are creating a block device
                mapping from an <b>existing encrypted or unencrypted snapshot</b>,
                you must omit this parameter. If you include this parameter, the request
                will fail, regardless of the value that you specify.</p> </li> <li>
                <p>If you are creating a block device mapping from an <b>existing
                unencrypted volume</b>, you can include this parameter, but you must
                specify <code>false</code>. If you specify <code>true</code>, the
                request will fail. In this case, we recommend that you omit the parameter.</p>
                </li> <li> <p>If you are creating a block device mapping from an <b>existing
                encrypted volume</b>, you can include this parameter, and specify
                either <code>true</code> or <code>false</code>. However, if you specify
                <code>false</code>, the parameter is ignored and the block device
                mapping is always encrypted. In this case, we recommend that you omit
                the parameter.</p> </li> </ul>
            iops:
              type: integer
              format: int32
              description: '<p>The number of I/O operations per second (IOPS). For
                <code>gp3</code>, <code>io1</code>, and <code>io2</code> volumes,
                this represents the number of IOPS that are provisioned for the volume.
                For <code>gp2</code> volumes, this represents the baseline performance
                of the volume and the rate at which the volume accumulates I/O credits
                for bursting.</p> <p>The following are the supported values for each
                volume type:</p> <ul> <li> <p> <code>gp3</code>: 3,000 - 16,000 IOPS</p>
                </li> <li> <p> <code>io1</code>: 100 - 64,000 IOPS</p> </li> <li>
                <p> <code>io2</code>: 100 - 256,000 IOPS</p> </li> </ul> <p>For <code>io2</code>
                volumes, you can achieve up to 256,000 IOPS on <a href=''https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html#ec2-nitro-instances''>instances
                built on the Nitro System</a>. On other instances, you can achieve
                performance up to 32,000 IOPS.</p> <p>This parameter is required for
                <code>io1</code> and <code>io2</code> volumes. The default for <code>gp3</code>
                volumes is 3,000 IOPS.</p>'
            kmsKeyId:
              type: string
              description: <p>Identifier (key ID, key alias, ID ARN, or alias ARN)
                for a customer managed CMK under which the EBS volume is encrypted.</p>
                <p>This parameter is only supported on <code>BlockDeviceMapping</code>
                objects called by <a href='https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_RunInstances.html'>RunInstances</a>,
