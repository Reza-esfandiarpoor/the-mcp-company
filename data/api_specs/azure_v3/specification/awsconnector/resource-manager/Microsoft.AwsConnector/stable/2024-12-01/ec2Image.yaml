                and <a href='https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_RequestSpotInstances.html'>RequestSpotInstances</a>.</p>
            outpostArn:
              type: string
              description: <p>The ARN of the Outpost on which the snapshot is stored.</p>
                <p>This parameter is not supported when using <a href='https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_CreateImage.html'>CreateImage</a>.</p>
            snapshotId:
              type: string
              description: <p>The ID of the snapshot.</p>
            throughput:
              type: integer
              format: int32
              description: '<p>The throughput that the volume supports, in MiB/s.</p>
                <p>This parameter is valid only for <code>gp3</code> volumes.</p>
                <p>Valid Range: Minimum value of 125. Maximum value of 1000.</p>'
            volumeSize:
              type: integer
              format: int32
              description: '<p>The size of the volume, in GiBs. You must specify either
                a snapshot ID or a volume size. If you specify a snapshot, the default
