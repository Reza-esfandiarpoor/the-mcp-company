                      description: VolumeType enum io1
                    - name: Io2
                      value: io2
                      description: VolumeType enum io2
                    - name: Sc1
                      value: sc1
                      description: VolumeType enum sc1
                    - name: St1
                      value: st1
                      description: VolumeType enum st1
                    - name: Standard
                      value: standard
                      description: VolumeType enum standard
        noDevice:
          type: string
          description: <p>To omit the device from the block device mapping, specify
            an empty string. When this property is specified, the device is removed
            from the block device mapping regardless of the assigned value.</p>
        virtualName:
          type: string
          description: '<p>The virtual device name (<code>ephemeral</code>N). Instance
            store volumes are numbered starting from 0. An instance type with 2 available
            instance store volumes can specify mappings for <code>ephemeral0</code>
