                                        <p>Valid Range: Minimum value of 125. Maximum
                                        value of 1000.</p>'
                                    volumeSize:
                                      type: integer
                                      format: int32
                                      description: '<p>The size of the volume, in
                                        GiBs. You must specify either a snapshot ID
                                        or a volume size. If you specify a snapshot,
