                                            type: integer
                                            format: int32
                                            description: '<p>The size of the volume,
                                              in GiBs. You must specify either a snapshot
                                              ID or a volume size. If you specify
                                              a snapshot, the default is the snapshot
                                              size. You can specify a volume size
                                              that is equal to or larger than the
                                              snapshot size.</p> <p>The following
                                              are the supported sizes for each volume
                                              type:</p> <ul> <li> <p> <code>gp2</code>
                                              and <code>gp3</code>: 1 - 16,384 GiB</p>
                                              </li> <li> <p> <code>io1</code>: 4 -
                                              16,384 GiB</p> </li> <li> <p> <code>io2</code>:
                                              4 - 65,536 GiB</p> </li> <li> <p> <code>st1</code>
                                              and <code>sc1</code>: 125 - 16,384 GiB</p>
                                              </li> <li> <p> <code>standard</code>:
