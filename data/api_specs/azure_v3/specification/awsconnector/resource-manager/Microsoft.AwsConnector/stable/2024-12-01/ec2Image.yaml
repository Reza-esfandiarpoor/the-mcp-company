                                    In this case, we recommend that you omit the parameter.</p>
                                    </li> </ul>
                                iops:
                                  type: integer
                                  format: int32
                                  description: '<p>The number of I/O operations per
                                    second (IOPS). For <code>gp3</code>, <code>io1</code>,
                                    and <code>io2</code> volumes, this represents
                                    the number of IOPS that are provisioned for the
                                    volume. For <code>gp2</code> volumes, this represents
                                    the baseline performance of the volume and the
                                    rate at which the volume accumulates I/O credits
                                    for bursting.</p> <p>The following are the supported
                                    values for each volume type:</p> <ul> <li> <p>
                                    <code>gp3</code>: 3,000 - 16,000 IOPS</p> </li>
                                    <li> <p> <code>io1</code>: 100 - 64,000 IOPS</p>
                                    </li> <li> <p> <code>io2</code>: 100 - 256,000
                                    IOPS</p> </li> </ul> <p>For <code>io2</code> volumes,
                                    you can achieve up to 256,000 IOPS on <a href=''https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-types.html#ec2-nitro-instances''>instances
                                    built on the Nitro System</a>. On other instances,
                                    you can achieve performance up to 32,000 IOPS.</p>
                                    <p>This parameter is required for <code>io1</code>
                                    and <code>io2</code> volumes. The default for
                                    <code>gp3</code> volumes is 3,000 IOPS.</p>'
                                kmsKeyId:
                                  type: string
                                  description: <p>Identifier (key ID, key alias, ID
