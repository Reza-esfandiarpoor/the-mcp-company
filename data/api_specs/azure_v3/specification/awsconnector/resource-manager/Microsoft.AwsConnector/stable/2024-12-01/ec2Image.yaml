                                          instance store volumes can specify mappings
                                          for <code>ephemeral0</code> and <code>ephemeral1</code>.
                                          The number of available instance store volumes
                                          depends on the instance type. After you
                                          connect to the instance, you must mount
                                          the volume.</p> <p>NVMe instance store volumes
                                          are automatically enumerated and assigned
                                          a device name. Including them in your block
                                          device mapping has no effect.</p> <p>Constraints:
                                          For M3 instances, you must specify instance
                                          store volumes in the block device mapping
                                          for the instance. When you launch an M3
                                          instance, we ignore any instance store volumes
                                          specified in the block device mapping for
                                          the AMI.</p>'
