                - name: Kernel
                  value: kernel
                  description: ImageTypeValues enum kernel
                - name: Machine
                  value: machine
                  description: ImageTypeValues enum machine
                - name: Ramdisk
                  value: ramdisk
                  description: ImageTypeValues enum ramdisk
        imdsSupport:
          description: <p>If <code>v2.0</code>, it indicates that IMDSv2 is specified
            in the AMI. Instances launched from this AMI will have <code>HttpTokens</code>
