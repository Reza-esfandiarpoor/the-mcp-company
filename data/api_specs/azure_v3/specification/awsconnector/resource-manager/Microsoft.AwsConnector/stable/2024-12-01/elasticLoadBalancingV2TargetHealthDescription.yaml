            health checks required to determine its health status.</p> </li> </ul>
            <p>If the target state is <code>unhealthy</code>, the reason code can
            be one of the following values:</p> <ul> <li> <p> <code>Target.ResponseCodeMismatch</code>
            - The health checks did not return an expected HTTP code. Applies only
            to Application Load Balancers and Gateway Load Balancers.</p> </li> <li>
            <p> <code>Target.Timeout</code> - The health check requests timed out.
            Applies only to Application Load Balancers and Gateway Load Balancers.</p>
            </li> <li> <p> <code>Target.FailedHealthChecks</code> - The load balancer
            received an error while establishing a connection to the target or the
            target response was malformed.</p> </li> <li> <p> <code>Elb.InternalError</code>
            - The health checks failed due to an internal error. Applies only to Application
            Load Balancers.</p> </li> </ul> <p>If the target state is <code>unused</code>,
