                                        the specified Availability Zone value is only
                                        applicable when cross-zone load balancing
                                        is off. Otherwise the parameter is ignored
                                        and treated as <code>all</code>.</p> <p>This
                                        parameter is not supported if the target type
                                        of the target group is <code>instance</code>
                                        or <code>alb</code>.</p> <p>If the target
                                        type is <code>ip</code> and the IP address
                                        is in a subnet of the VPC for the target group,
                                        the Availability Zone is automatically detected
                                        and this parameter is optional. If the IP
                                        address is outside the VPC, this parameter
                                        is required.</p> <p>For Application Load Balancer
                                        target groups with cross-zone load balancing
                                        off, if the target type is <code>ip</code>
                                        and the IP address is outside of the VPC for
                                        the target group, this should be an Availability
                                        Zone inside the VPC for the target group.</p>
