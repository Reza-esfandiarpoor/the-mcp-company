                                        - The target is in the process of being registered
                                        with the load balancer.</p> </li> <li> <p>
                                        <code>Elb.InitialHealthChecking</code> - The
                                        load balancer is still sending the target
                                        the minimum number of health checks required
                                        to determine its health status.</p> </li>
                                        </ul> <p>If the target state is <code>unhealthy</code>,
                                        the reason code can be one of the following
                                        values:</p> <ul> <li> <p> <code>Target.ResponseCodeMismatch</code>
                                        - The health checks did not return an expected
                                        HTTP code. Applies only to Application Load
                                        Balancers and Gateway Load Balancers.</p>
                                        </li> <li> <p> <code>Target.Timeout</code>
                                        - The health check requests timed out. Applies
                                        only to Application Load Balancers and Gateway
                                        Load Balancers.</p> </li> <li> <p> <code>Target.FailedHealthChecks</code>
                                        - The load balancer received an error while
                                        establishing a connection to the target or
                                        the target response was malformed.</p> </li>
                                        <li> <p> <code>Elb.InternalError</code> -
                                        The health checks failed due to an internal
                                        error. Applies only to Application Load Balancers.</p>
                                        </li> </ul> <p>If the target state is <code>unused</code>,
                                        the reason code can be one of the following
                                        values:</p> <ul> <li> <p> <code>Target.NotRegistered</code>
                                        - The target is not registered with the target
                                        group.</p> </li> <li> <p> <code>Target.NotInUse</code>
                                        - The target group is not used by any load
                                        balancer or the target is in an Availability
                                        Zone that is not enabled for its load balancer.</p>
                                        </li> <li> <p> <code>Target.InvalidState</code>
                                        - The target is in the stopped or terminated
                                        state.</p> </li> <li> <p> <code>Target.IpUnusable</code>
                                        - The target IP address is reserved for use
                                        by a load balancer.</p> </li> </ul> <p>If
                                        the target state is <code>draining</code>,
                                        the reason code can be the following value:</p>
                                        <ul> <li> <p> <code>Target.DeregistrationInProgress</code>
                                        - The target is in the process of being deregistered
                                        and the deregistration delay period has not
                                        expired.</p> </li> </ul> <p>If the target
                                        state is <code>unavailable</code>, the reason
                                        code can be the following value:</p> <ul>
                                        <li> <p> <code>Target.HealthCheckDisabled</code>
                                        - Health checks are disabled for the target
                                        group. Applies only to Application Load Balancers.</p>
                                        </li> <li> <p> <code>Elb.InternalError</code>
                                        - Target health is unavailable due to an internal
                                        error. Applies only to Network Load Balancers.</p>
                                        </li> </ul>
