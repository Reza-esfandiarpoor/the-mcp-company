            the aws-managed-key, use ``alias/aws/ebs``.  +  Key ARN. For example,
            arn:aws:kms:us-east-1:012345678910:key/1234abcd-12ab-34cd-56ef-1234567890ab.  +  Alias
            ARN. For example, arn:aws:kms:us-east-1:012345678910:alias/ExampleAlias.'
        multiAttachEnabled:
          type: boolean
          description: Indicates whether Amazon EBS Multi-Attach is enabled. CFNlong
            does not currently support updating a single-attach volume to be multi-attach
            enabled, updating a multi-attach enabled volume to be single-attach, or
            updating the size or number of I/O operations per second (IOPS) of a multi-attach
