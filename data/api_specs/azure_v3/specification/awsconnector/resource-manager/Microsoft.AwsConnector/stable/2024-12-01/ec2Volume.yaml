            for each volume type:  +   ``gp2`` and ``gp3``: 1 - 16,384 GiB  +   ``io1``:
            4 - 16,384 GiB  +   ``io2``: 4 - 65,536 GiB  +   ``st1`` and ``sc1``:
            125 - 16,384 GiB  +   ``standard``: 1 - 1024 GiB'
        snapshotId:
          type: string
          description: The snapshot from which to create the volume. You must specify
