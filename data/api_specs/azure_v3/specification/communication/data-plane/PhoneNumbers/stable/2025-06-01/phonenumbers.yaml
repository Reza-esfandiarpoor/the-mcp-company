      required:
      - phoneNumber
      type: object
      properties:
        phoneNumber:
          description: E.164 formatted string representation of the phone number
          type: string
        nationalFormat:
          description: National format of the phone number
          type: string
        internationalFormat:
          description: International format of the phone number
          type: string
        isoCountryCode:
          description: ISO 3166-1 two character ('alpha-2') code associated with the
            phone number.
          type: string
        numberType:
          description: Type of service associated with the phone number
          enum:
          - unknown
          - other
          - geographic
          - mobile
          type: string
          x-ms-enum:
            name: OperatorNumberType
            modelAsString: true
        operatorDetails:
          $ref: '#/components/schemas/OperatorDetails'
    OperatorInformationOptions:
      description: Represents options to modify a search request for operator information
      type: object
      properties:
        includeAdditionalOperatorDetails:
          description: 'Includes the fields operatorDetails, numberType, and isoCountryCode
            in the response.  Please note: use of this option will result in additional
            costs'
          type: boolean
    OperatorInformationRequest:
      description: Represents a search request for operator information for the given
        phone numbers.
      required:
      - phoneNumbers
      type: object
      properties:
        phoneNumbers:
          description: Phone number(s) whose operator information is being requested
          type: array
          items:
            type: string
        options:
          $ref: '#/components/schemas/OperatorInformationOptions'
    OperatorInformationResult:
      description: Represents a search result containing format and operator information
        associated with the requested phone numbers
      type: object
      properties:
        values:
          description: "Results of a search.\r\nThis array will have one entry per
            requested phone number which will contain the relevant operator information."
          type: array
          items:
            $ref: '#/components/schemas/OperatorInformation'
    PhoneNumberAdministrativeDivision:
      description: Represents an administrative division. e.g. state or province.
      required:
