        nextLink:
          description: Represents the URL link to the next page of phone number results.
          type: string
    PhoneNumbersBrowseRequest:
      description: The parameters for the browse operation.
      required:
      - phoneNumberType
      type: object
      properties:
        phoneNumberType:
          description: Represents the number type of the offering.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        capabilities:
          $ref: '#/components/schemas/PhoneNumberBrowseCapabilitiesRequest'
        assignmentType:
          description: Represents the assignment type of the offering. Also known
            as the use case.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        phoneNumberPrefixes:
          description: The phone number prefix to match. If specified, the search
            will be limited to phone numbers that start with the any of the given
            prefixes.
          type: array
          items:
            type: string
    PhoneNumberBrowseCapabilitiesRequest:
      description: The minimum desired capabilities for the browse operation request.
      type: object
      properties:
        calling:
          description: Capability value for calling.
          enum:
          - none
          - inbound
          - outbound
          - inbound+outbound
          type: string
          x-ms-enum:
            name: PhoneNumberCapabilityType
            modelAsString: true
        sms:
          description: Capability value for SMS.
          enum:
          - none
          - inbound
          - outbound
          - inbound+outbound
          type: string
          x-ms-enum:
            name: PhoneNumberCapabilityType
            modelAsString: true
    PhoneNumbersBrowseResult:
      required:
      - phoneNumbers
      type: object
      description: The result of a phone number browse operation.
      properties:
        phoneNumbers:
          description: The phone numbers that are available for purchase.
          type: array
          items:
            $ref: '#/components/schemas/AvailablePhoneNumber'
    AvailablePhoneNumber:
      required:
      - countryCode
      - capabilities
      - phoneNumberType
      - assignmentType
      type: object
      description: Represents a phone number available in inventory
      properties:
        id:
          description: The id of the phone number.
          type: string
          readOnly: true
        countryCode:
          description: The ISO 3166-2 country code, e.g. US.
          type: string
        phoneNumber:
          description: The phone number in E.164 format, e.g. +11234567890.
          type: string
          readOnly: true
        capabilities:
          $ref: '#/components/schemas/PhoneNumberCapabilities'
        phoneNumberType:
          description: Represents the number type of the offering.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        assignmentType:
          description: Represents the assignment type of the offering. Also known
            as the use case.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        cost:
          $ref: '#/components/schemas/PhoneNumberCost'
          type: object
          description: The incurred cost for this phone number.
          readOnly: true
        status:
          readOnly: true
          description: 'Represents the status of the phone number. Possible values
            include: ''available'', ''reserved'', ''expired'', ''error'', ''purchased''.'
          type: string
          enum:
          - available
          - reserved
          - expired
          - error
          - purchased
          x-ms-enum:
            name: AvailablePhoneNumberStatus
            modelAsString: true
        isAgreementToNotResellRequired:
          description: Indicates if do not resell agreement is required. If true,
            the phone number cannot be acquired unless the customer provides explicit
            agreement to not resell it.
          type: boolean
          readOnly: true
        error:
          $ref: '#/components/schemas/AvailablePhoneNumberError'
