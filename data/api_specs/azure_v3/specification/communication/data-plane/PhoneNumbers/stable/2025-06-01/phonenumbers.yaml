      type: object
      description: Contains error details in case of failure when reserving, releasing
        or purchasing the phone number. Note that this is ignored by the service when
        present in requests.
      properties:
        code:
          readOnly: true
          type: string
          description: The error code indicating the reason why the operation performed
            on the phone number failed.
        message:
          readOnly: true
          type: string
          description: The error message describing the failure that occurred.
    PhoneNumbersReservations:
      required:
      - reservations
      type: object
      description: Represents a list of phone numbers reservations. Note that the
        phone numbers from each reservation are not included.
      properties:
        reservations:
          description: Represents a list of phone numbers reservations. Note that
            the phone numbers from each reservation are not included.
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumbersReservation'
        nextLink:
          description: Represents the URL link to the next page of phone number results.
          type: string
    PhoneNumbersReservation:
      type: object
      description: Represents a reservation for phone numbers. A reservation is a
        temporary hold on phone numbers that can later be purchased. The reservation
        has a limited lifetime after which the phone numbers are released if not purchased.
        Reservations older than 1 month are automatically deleted.
      properties:
        id:
          description: The id of the reservation.
          type: string
          format: uuid
          readOnly: true
        expiresAt:
          description: The time at which the reservation will expire. If a reservation
            is not purchased before this time, all of the reserved phone numbers will
            be released and made available for others to purchase.
          type: string
          format: date-time
          readOnly: true
        phoneNumbers:
          type: object
          description: A dictionary containing the reservation phone numbers. The
            key is the ID of the phone number (digits only) and values are AvailablePhoneNumber
            objects. Not populated when retrieving PhoneNumbersReservation collections.
          additionalProperties:
            $ref: '#/components/schemas/AvailablePhoneNumber'
        status:
          type: string
          description: 'Represents the status of the reservation. Possible values
            include: ''active'', ''submitted'', ''completed'', ''expired''.'
          readOnly: true
          enum:
          - active
          - submitted
          - completed
          - expired
          x-ms-enum:
            name: ReservationStatus
            modelAsString: true
    PhoneNumbersReservationPurchaseRequest:
      description: The phone number search purchase request.
      type: object
      properties:
        agreeToNotResell:
          description: The agreement to not resell the phone numbers. Defaults to
            false if not provided.
          type: boolean
