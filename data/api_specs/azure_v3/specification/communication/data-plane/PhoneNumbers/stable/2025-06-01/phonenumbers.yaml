          type: string
        countryCode:
          description: The ISO 3166-2 code of the phone number's country, e.g. US.
          type: string
        phoneNumberType:
          description: The phone number's type, e.g. geographic, tollFree, mobile.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        capabilities:
          $ref: '#/components/schemas/PhoneNumberCapabilities'
        assignmentType:
          description: The assignment type of the phone number. A phone number can
            be assigned to a person, or to an application.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        purchaseDate:
          format: date-time
          description: The date and time that the phone number was purchased.
          type: string
