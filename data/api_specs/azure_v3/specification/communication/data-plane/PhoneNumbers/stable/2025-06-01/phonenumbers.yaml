          type: string
        abbreviatedName:
          description: Represents the abbreviated name of the administrative division
            of the locality. e.g. state or province abbreviation such as WA (Washington).
          type: string
    PhoneNumberAreaCode:
      description: Represents an Area Code.
      type: object
      properties:
        areaCode:
          description: An area code.
          type: string
    PhoneNumberAreaCodes:
      description: The list of available area codes.
      required:
      - areaCodes
      type: object
      properties:
        areaCodes:
          description: Represents a list of available toll-free area codes.
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberAreaCode'
        nextLink:
          description: Represents the URL link to the next page.
          type: string
    PhoneNumberCapabilities:
      description: Capabilities of a phone number.
      required:
      - calling
      - sms
      type: object
      properties:
        calling:
          description: Capability value for calling.
          enum:
