          $ref: '#/components/schemas/PhoneNumberAdministrativeDivision'
    PhoneNumberOffering:
      description: Represents a phone number capability offering
      required:
      - cost
      type: object
      properties:
        phoneNumberType:
          description: Represents the number type of the offering.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        assignmentType:
          description: Represents the assignment type of the offering.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        availableCapabilities:
          $ref: '#/components/schemas/PhoneNumberCapabilities'
        cost:
          $ref: '#/components/schemas/PhoneNumberCost'
    PhoneNumberOperation:
      required:
      - createdDateTime
      - id
      - operationType
      - status
      type: object
      properties:
        operationType:
          description: The type of operation, e.g. Search
          enum:
          - purchase
          - releasePhoneNumber
          - search
          - updatePhoneNumberCapabilities
          - reservationPurchase
          type: string
          x-ms-enum:
            name: PhoneNumberOperationType
            modelAsString: true
        status:
          description: Status of operation.
          enum:
          - notStarted
          - running
          - succeeded
          - failed
          type: string
          x-ms-enum:
            name: PhoneNumberOperationStatus
            modelAsString: true
        resourceLocation:
          description: URL for retrieving the result of the operation, if any.
          type: string
        createdDateTime:
          format: date-time
          description: The date that the operation was created.
          type: string
        error:
          $ref: '#/components/schemas/CommunicationError'
        id:
          description: Id of operation.
          type: string
        lastActionDateTime:
          format: date-time
          description: The most recent date that the operation was changed.
          type: string
          readOnly: true
    PhoneNumberPurchaseRequest:
      description: The phone number search purchase request.
      type: object
      properties:
        searchId:
          description: The search id.
          type: string
        agreeToNotResell:
          description: The agreement to not resell the phone numbers. Defaults to
            false if not provided.
          type: boolean
    PhoneNumberSearchRequest:
      description: Represents a phone number search request to find phone numbers.
        Found phone numbers are temporarily held for a following purchase.
      required:
      - assignmentType
      - capabilities
      - phoneNumberType
      type: object
      properties:
        phoneNumberType:
          description: The type of phone numbers to search for, e.g. geographic, tollFree,
            mobile.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        assignmentType:
          description: The assignment type of the phone numbers to search for. A phone
            number can be assigned to a person, or to an application.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        capabilities:
          $ref: '#/components/schemas/PhoneNumberCapabilities'
        areaCode:
          description: The area code of the desired phone number, e.g. 425.
          type: string
        quantity:
          format: int32
          description: The quantity of desired phone numbers. The default value is
            1.
          default: 1
          maximum: 2147483647
          minimum: 1
          type: integer
    PhoneNumberSearchResult:
      description: The result of a phone number search operation.
      required:
      - assignmentType
      - capabilities
      - cost
      - phoneNumbers
      - phoneNumberType
      - searchExpiresBy
      - searchId
      type: object
      properties:
        searchId:
          description: The search id.
          type: string
        phoneNumbers:
          description: The phone numbers that are available. Can be fewer than the
            desired search quantity.
          type: array
          items:
            type: string
        phoneNumberType:
          description: The phone number's type, e.g. geographic, tollFree, mobile.
          enum:
          - geographic
          - tollFree
          - mobile
          type: string
          x-ms-enum:
            name: PhoneNumberType
            modelAsString: true
        assignmentType:
          description: Phone number's assignment type.
          enum:
          - person
          - application
          type: string
          x-ms-enum:
            name: PhoneNumberAssignmentType
            modelAsString: true
        capabilities:
          $ref: '#/components/schemas/PhoneNumberCapabilities'
        cost:
          $ref: '#/components/schemas/PhoneNumberCost'
        searchExpiresBy:
          format: date-time
          description: The date that this search result expires and phone numbers
            are no longer on hold. A search result expires in less than 15min, e.g.
            2020-11-19T16:31:49.048Z.
          type: string
        isAgreementToNotResellRequired:
          description: Indicates if do not resell agreement is required. If true,
            the phone numbers cannot be acquired unless the customer provides explicit
            agreement to not resell them.
          type: boolean
        errorCode:
          format: int32
          description: The error code of the search.
          type: integer
        error:
          description: Mapping Error Messages to Codes
          enum:
          - NoError
          - UnknownErrorCode
          - OutOfStock
          - AuthorizationDenied
          - MissingAddress
          - InvalidAddress
          - InvalidOfferModel
          - NotEnoughLicenses
          - NoWallet
          - NotEnoughCredit
          - NumbersPartiallyAcquired
          - AllNumbersNotAcquired
          - ReservationExpired
          - PurchaseFailed
          - BillingUnavailable
          - ProvisioningFailed
          - UnknownSearchError
          type: string
          x-ms-enum:
            name: Error
            modelAsString: true
    PurchasedPhoneNumber:
