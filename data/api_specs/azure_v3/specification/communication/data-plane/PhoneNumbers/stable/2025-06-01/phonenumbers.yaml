            name: BillingFrequency
            modelAsString: true
    PhoneNumberCountries:
      description: Represents a wrapper around a list of countries.
      type: object
      properties:
        countries:
          description: Represents the underlying list of countries.
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberCountry'
        nextLink:
          description: Represents the URL link to the next page
          type: string
    PhoneNumberCountry:
      description: Represents a country.
      required:
      - countryCode
      - localizedName
      type: object
      properties:
        localizedName:
          description: Represents the name of the country.
          type: string
        countryCode:
          description: Represents the abbreviated name of the country.
          type: string
    PhoneNumberLocalities:
      description: Represents a wrapper around a list of cities or towns.
      type: object
      properties:
        phoneNumberLocalities:
          description: Represents the underlying list of localities, e.g. cities or
            town.
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberLocality'
        nextLink:
          description: Represents the URL link to the next page.
          type: string
    PhoneNumberLocality:
      description: Represents a locality.
      required:
      - localizedName
      type: object
      properties:
        localizedName:
          description: Represents the localized name of the locality.
          type: string
