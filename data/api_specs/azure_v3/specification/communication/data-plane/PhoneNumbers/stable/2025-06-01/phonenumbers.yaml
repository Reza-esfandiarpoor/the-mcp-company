openapi: 3.0.0
info:
  title: PhoneNumbersClient
  description: The phone numbers client uses Azure Communication Services to purchase
    and manage phone numbers.
  version: 2025-06-01
paths:
  /availablePhoneNumbers/countries/{countryCode}/areaCodes:
    get:
      tags:
      - Browse for available countries, cities and area codes
      summary: Gets the list of available area codes.
      operationId: PhoneNumbers_ListAreaCodes
      parameters:
      - in: path
        name: countryCode
        description: The ISO 3166-2 country code, e.g. US.
        required: true
        schema:
          type: string
      - in: query
        name: phoneNumberType
        description: Filter by numberType, e.g. Geographic, TollFree, Mobile.
        required: true
        x-ms-enum:
          name: PhoneNumberType
          modelAsString: true
        schema:
          type: string
          enum:
          - geographic
          - tollFree
          - mobile
      - in: query
        name: skip
        description: An optional parameter for how many entries to skip, for pagination
          purposes. The default value is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: maxPageSize
        description: An optional parameter for how many entries to return, for pagination
          purposes. The default value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      - in: query
        name: assignmentType
        description: Filter by assignmentType, e.g. Person, Application.
        x-ms-enum:
          name: PhoneNumberAssignmentType
          modelAsString: true
        schema:
          type: string
          enum:
          - person
          - application
      - in: query
        name: locality
        description: The name of locality or town in which to search for the area
          code. This is required if the number type is Geographic.
        schema:
          type: string
      - in: query
        name: administrativeDivision
        description: The name of the state or province in which to search for the
          area code.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: accept-language
        description: The locale to display in the localized fields in the response.
          e.g. 'en-US'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberAreaCodes'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: areaCodes
  /availablePhoneNumbers/countries:
    get:
      tags:
      - Browse for available countries, cities and area codes
      summary: Gets the list of supported countries.
      operationId: PhoneNumbers_ListAvailableCountries
      parameters:
      - in: query
        name: skip
        description: An optional parameter for how many entries to skip, for pagination
          purposes. The default value is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: maxPageSize
        description: An optional parameter for how many entries to return, for pagination
          purposes. The default value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: accept-language
        description: The locale to display in the localized fields in the response.
          e.g. 'en-US'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCountries'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: countries
  /availablePhoneNumbers/countries/{countryCode}/:browse:
    post:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Browses for available phone numbers to purchase.
      description: Browses for available phone numbers to purchase. The response will
        be a randomized list of phone numbers available to purchase matching the browsing
        criteria. This operation is not paginated. Since the results are randomized,
        repeating the same request will not guarantee the same results.
      operationId: PhoneNumbers_BrowseAvailableNumbers
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/CountryCodeParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumbersBrowseRequest'
        description: An object defining the criteria to browse for available phone
          numbers.
        required: true
      responses:
        '200':
          description: A randomized list of phone numbers available to purchase matching
            the browsing criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersBrowseResult'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /availablePhoneNumbers/countries/{countryCode}/localities:
    get:
      tags:
      - Browse for available countries, cities and area codes
      summary: Gets the list of cities or towns with available phone numbers.
      operationId: PhoneNumbers_ListAvailableLocalities
      parameters:
      - in: path
        name: countryCode
        description: The ISO 3166-2 country code, e.g. US.
        required: true
        schema:
          type: string
      - in: query
        name: skip
        description: An optional parameter for how many entries to skip, for pagination
          purposes. The default value is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: maxPageSize
        description: An optional parameter for how many entries to return, for pagination
          purposes. The default value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      - in: query
        name: administrativeDivision
        description: An optional parameter for the name of the state or province in
          which to search for the area code.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: accept-language
        description: The locale to display in the localized fields in the response.
          e.g. 'en-US'
        schema:
          type: string
      - in: query
        name: phoneNumberType
        description: Filter by numberType, e.g. Geographic, TollFree, Mobile.
        x-ms-enum:
          name: PhoneNumberType
          modelAsString: true
        schema:
          type: string
          enum:
          - geographic
          - tollFree
          - mobile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberLocalities'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: phoneNumberLocalities
  /availablePhoneNumbers/countries/{countryCode}/offerings:
    get:
      tags:
      - Browse for available countries, cities and area codes
      summary: List available offerings of capabilities with rates for the given country.
      operationId: PhoneNumbers_ListOfferings
      parameters:
      - in: path
        name: countryCode
        description: The ISO 3166-2 country code, e.g. US.
        required: true
        schema:
          type: string
      - in: query
        name: skip
        description: An optional parameter for how many entries to skip, for pagination
          purposes. The default value is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: maxPageSize
        description: An optional parameter for how many entries to return, for pagination
          purposes. The default value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      - in: query
        name: phoneNumberType
        description: Filter by numberType, e.g. Geographic, TollFree, Mobile.
        x-ms-enum:
          name: PhoneNumberType
          modelAsString: true
        schema:
          type: string
          enum:
          - geographic
          - tollFree
          - mobile
      - in: query
        name: assignmentType
        description: Filter by assignmentType, e.g. Person, Application.
        x-ms-enum:
          name: PhoneNumberAssignmentType
          modelAsString: true
        schema:
          type: string
          enum:
          - person
          - application
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: accept-language
        description: The locale to display in the localized fields in the response.
          e.g. 'en-US'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferingsResponse'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: phoneNumberOfferings
  /availablePhoneNumbers/reservations:
    get:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Lists all reservations.
      description: Retrieves a paginated list of all phone number reservations. Note
        that the reservations will not be populated with the phone numbers associated
        with them.
      operationId: PhoneNumbers_ListReservations
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/MaxPageSizeParameter'
      responses:
        '200':
          description: A collection of Phone Number Reservations, and an optional
            link to the next page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersReservations'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: reservations
  /availablePhoneNumbers/reservations/{reservationId}:
    patch:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Creates or updates a reservation by its ID.
      description: Adds and removes phone numbers from the reservation with the given
        ID. The response will be the updated state of the reservation. Phone numbers
        can be reserved by including them in the payload. If a number is already in
        the reservation, it will be ignored. To remove a phone number, set it explicitly
        to null in the request payload. This operation is idempotent. If a reservation
        with the same ID already exists, it will be updated, otherwise a new one is
        created. Only reservations with 'active' status can be updated. Updating a
        reservation will extend the expiration time of the reservation to 15 minutes
        after the last change, up to a maximum of 2 hours from creation time. Partial
        success is possible, in which case the response will have a 207 status code.
      operationId: PhoneNumbers_CreateOrUpdateReservation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ReservationIdParameter'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PhoneNumbersReservation'
        description: A representation of the desired state of the reservation.
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: Reservation successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersReservation'
        '201':
          description: Reservation successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersReservation'
        '207':
          description: Reservation operation partially succeeded. This can happen
            when the operation (create or update) is processed successfully, but it
            failed for at least one of the phone numbers in the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersReservation'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    get:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Gets a reservation by its ID.
      description: Retrieves the reservation with the given ID, including all of the
        phone numbers associated with it.
      operationId: PhoneNumbers_GetReservation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ReservationIdParameter'
      responses:
        '200':
          description: Successfully retrieved the reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersReservation'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    delete:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Deletes a reservation by its ID.
      description: Deletes the reservation with the given ID. Any phone number in
        the reservation will be released and made available for others to purchase.
        Only reservations with 'active' status can be deleted.
      operationId: PhoneNumbers_DeleteReservation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ReservationIdParameter'
      responses:
        '204':
          description: Reservation successfully deleted.
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /availablePhoneNumbers/reservations/{reservationId}/:purchase:
    post:
      tags:
      - Browse, reserve and purchase available phone numbers
      summary: Starts the purchase of all phone numbers in the reservation.
      description: Starts a long running operation to purchase all of the phone numbers
        in the reservation. Purchase can only be started for active reservations that
        at least one phone number. If any of the phone numbers in the reservation
        is from a country where reselling is not permitted, do not resell agreement
        is required. The response will include an 'Operation-Location' header that
        can be used to query the status of the operation.
      operationId: PhoneNumbers_PurchaseReservation
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/ReservationIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumbersReservationPurchaseRequest'
      responses:
        '202':
          description: The service has accepted the request and will start processing
            later. It will return 'Accepted' immediately and include an 'Operation-Location'
            header. Client side should further query the operation status using the
            URL specified in 'Operation-Location' header.
          headers:
            Operation-Location:
              description: URL to query for status of the operation.
              schema:
                type: string
            operation-id:
              description: The operation id.
              schema:
                type: string
            reservation-purchase-id:
              description: The reservation purchase operation id.
              schema:
                type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-long-running-operation: true
  /availablePhoneNumbers/countries/{countryCode}/:search:
    post:
      tags:
      - Find and purchase available phone numbers
      summary: Search for available phone numbers to purchase.
      operationId: PhoneNumbers_SearchAvailablePhoneNumbers
      parameters:
      - in: path
        name: countryCode
        description: The ISO 3166-2 country code, e.g. US.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberSearchRequest'
        description: The phone number search request.
        required: true
      responses:
        '202':
          description: The service has accepted the request and will start processing
            later. It will return 'Accepted' immediately and include an 'Operation-Location'
            and 'Location' headers. Client side should further query the operation
            status using the URL specified in 'Operation-Location' header. When operation
            completes successfully query final result using URL specified in 'Location'
            header.
          headers:
            Location:
              description: URL to retrieve the final result after operation completes.
              schema:
                type: string
            Operation-Location:
              description: URL to query for status of the operation.
              schema:
                type: string
            operation-id:
              description: The operation id.
              schema:
                type: string
            search-id:
              description: The search operation id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberSearchResult'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
  /availablePhoneNumbers/searchResults/{searchId}:
    get:
      tags:
      - Find and purchase available phone numbers
      summary: Gets a phone number search result by search id.
      operationId: PhoneNumbers_GetSearchResult
      parameters:
      - in: path
        name: searchId
        description: The search Id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberSearchResult'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /availablePhoneNumbers/:purchase:
    post:
      tags:
      - Find and purchase available phone numbers
      summary: Purchases phone numbers.
      operationId: PhoneNumbers_PurchasePhoneNumbers
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberPurchaseRequest'
        description: The phone number purchase request
        required: true
      responses:
        '202':
          description: The service has accepted the request and will start processing
            later. It will return 'Accepted' immediately and include an 'Operation-Location'
            header. Client side should further query the operation status using the
            URL specified in 'Operation-Location' header.
          headers:
            Operation-Location:
              description: URL to query for status of the operation.
              schema:
                type: string
            operation-id:
              description: The operation id.
              schema:
                type: string
            purchase-id:
              description: The purchase operation id.
              schema:
                type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-long-running-operation: true
  /phoneNumbers/operations/{operationId}:
    get:
      tags:
      - Long running operations
      summary: Gets an operation by its id.
      operationId: PhoneNumbers_GetOperation
      parameters:
      - in: path
        name: operationId
        description: The id of the operation
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: When the operation is completed, query the final result of
            the operation using the URL specified in the 'Location' attribute in the
            response header.
          headers:
            Location:
              description: Url to retrieve the final result after operation completes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberOperation'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    delete:
      tags:
      - Long running operations
      summary: Cancels an operation by its id.
      operationId: PhoneNumbers_CancelOperation
      parameters:
      - in: path
        name: operationId
        description: The id of the operation
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: No Content
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /phoneNumbers/{phoneNumber}/capabilities:
    patch:
      tags:
      - Manage purchased phone numbers
      summary: Updates the capabilities of a phone number.
      operationId: PhoneNumbers_UpdateCapabilities
      parameters:
      - in: path
        name: phoneNumber
        description: The phone number id in E.164 format. The leading plus can be
          either + or encoded as %2B, e.g. +11234567890.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/PhoneNumberCapabilitiesRequest'
        description: Defines the update capabilities request.
      responses:
        '202':
          description: The service has accepted the request and will start processing
            later. It will return 'Accepted' immediately and include an 'Operation-Location'
            and 'Location' headers. Client side should further query the operation
            status using the URL specified in 'Operation-Location' header. When operation
            completes successfully query final result using URL specified in 'Location'
            header.
          headers:
            Location:
              description: URL to retrieve the final result after operation completes.
              schema:
                type: string
            Operation-Location:
              description: URL to query for status of the operation.
              schema:
                type: string
            operation-id:
              description: The operation id.
              schema:
                type: string
            capabilities-id:
              description: The capabilities operation id.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasedPhoneNumber'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
  /phoneNumbers/{phoneNumber}:
    get:
      tags:
      - Manage purchased phone numbers
      summary: Gets the details of the given purchased phone number.
      operationId: PhoneNumbers_GetByNumber
      parameters:
      - in: path
        name: phoneNumber
        description: The purchased phone number whose details are to be fetched in
          E.164 format, e.g. +11234567890.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasedPhoneNumber'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    delete:
      tags:
      - Manage purchased phone numbers
      summary: Releases a purchased phone number.
      operationId: PhoneNumbers_ReleasePhoneNumber
      parameters:
      - in: path
        name: phoneNumber
        description: Phone number to be released, e.g. +11234567890.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '202':
          description: The service has accepted the request and will start processing
            later. It will return 'Accepted' immediately and include an 'Operation-Location'
            header. Client side should further query the operation status using the
            URL specified in 'Operation-Location' header.
          headers:
            Operation-Location:
              description: URL to query for status of the operation.
              schema:
                type: string
            operation-id:
              description: The operation id.
              schema:
                type: string
            release-id:
              description: The release operation id.
              schema:
                type: string
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-long-running-operation: true
  /phoneNumbers:
    get:
      tags:
      - Manage purchased phone numbers
      summary: Gets the list of all purchased phone numbers.
      operationId: PhoneNumbers_ListPhoneNumbers
      parameters:
      - in: query
        name: skip
        description: An optional parameter for how many entries to skip, for pagination
          purposes. The default value is 0.
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: top
        description: An optional parameter for how many entries to return, for pagination
          purposes. The default value is 100.
        schema:
          type: integer
          format: int32
          default: 100
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasedPhoneNumbers'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: phoneNumbers
  /operatorInformation/:search:
    post:
      tags:
      - Obtain operator information for requested numbers
      summary: Searches for number format and operator information for a given list
        of phone numbers.
      operationId: PhoneNumbers_OperatorInformationSearch
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorInformationRequest'
        description: The phone number(s) whose number format and operator information
          should be searched
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorInformationResult'
        default:
          description: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: The communication resource, for example https://resourcename.communication.azure.com
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      format: url
      default: none
components:
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    Endpoint:
      in: path
      name: endpoint
      description: The communication resource, for example https://resourcename.communication.azure.com
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      schema:
        type: string
        format: url
    CountryCodeParameter:
      in: path
      name: countryCode
      description: The ISO 3166-2 country code, e.g. US.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    MaxPageSizeParameter:
      in: query
      name: maxPageSize
      description: An optional parameter for how many entries to return, for pagination
        purposes. The default value is 100.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 100
    ReservationIdParameter:
      in: path
      name: reservationId
      description: The id of the reservation.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        format: uuid
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    OfferingsResponse:
      description: Represents a wrapper around a list of offerings.
      type: object
