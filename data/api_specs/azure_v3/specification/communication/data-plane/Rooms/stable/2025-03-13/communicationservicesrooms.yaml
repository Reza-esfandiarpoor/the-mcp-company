openapi: 3.0.0
info:
  title: Azure Communication Room Service
  description: Azure Communication Room Service
  version: 2025-03-13
security:
- Authorization: []
paths:
  /rooms:
    post:
      tags:
      - Rooms
      summary: Creates a new room.
      operationId: Rooms_Create
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - in: header
        name: Repeatability-Request-ID
        description: If specified, the client directs that the request is repeatable;
          that is, that the client can make the request multiple times with the same
          Repeatability-Request-ID and get back an appropriate response without the
          server executing the request multiple times. The value of the Repeatability-Request-ID
          is an opaque string representing a client-generated, globally unique for
          all time, identifier for the request. It is recommended to use version 4
          (random) UUIDs.
        schema:
          type: string
          format: uuid
      - in: header
        name: Repeatability-First-Sent
        description: If Repeatability-Request-ID header is specified, then Repeatability-First-Sent
          header must also be specified. The value should be the date and time at
          which the request was first created, expressed using the IMF-fixdate form
          of HTTP-date.
        schema:
          type: string
          format: date-time-rfc1123
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
        description: The create room request body.
        required: true
      responses:
        '201':
          description: Request successful. The action returns a new room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomModel'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    get:
      tags:
      - Rooms
      summary: Retrieves all created rooms.
      operationId: Rooms_List
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns a collection of rooms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsCollection'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /rooms/{roomId}:
    get:
      tags:
      - Rooms
      summary: Retrieves an existing room by id.
      operationId: Rooms_Get
      parameters:
      - in: path
        name: roomId
        description: The id of the room requested.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns a room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomModel'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    patch:
      tags:
      - Rooms
      summary: Update a room with given changes.
      operationId: Rooms_Update
      parameters:
      - in: path
        name: roomId
        description: The id of the room requested.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
        description: The update room request.
        required: true
      responses:
        '200':
          description: Request successful. The action returns an updated room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomModel'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    delete:
      tags:
      - Rooms
      summary: Delete a room.
      operationId: Rooms_Delete
      parameters:
      - in: path
        name: roomId
        description: The id of the room to be deleted.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '204':
          description: The room was successfully deleted.
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /rooms/{roomId}/participants:
    get:
      tags:
      - Participants
      summary: Get participants in a room.
      operationId: Participants_List
      parameters:
      - in: path
        name: roomId
        description: The id of the room to get participants from.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns the participants of
            the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsCollection'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
    patch:
      tags:
      - Participants
      summary: Update participants in a room.
      operationId: Participants_Update
      parameters:
      - in: path
        name: roomId
        description: The id of the room to update the participants in.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateParticipantsRequest'
        description: An updated set of participants of the room.
        required: true
      responses:
        '200':
          description: The participants were successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateParticipantsResult'
        default:
          description: Error response
          headers:
            x-ms-error-code:
              x-ms-client-name: ErrorCode
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: The endpoint of the Azure Communication resource.
      format: url
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
components:
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    Endpoint:
      in: path
      name: endpoint
      description: The endpoint of the Azure Communication resource.
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      schema:
        type: string
        format: url
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
      description: An authentication string containing a signature generated using
        HMAC-SHA256 scheme.
  schemas:
    CommunicationError:
      description: The Communication Services error.
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
        target:
          type: string
          readOnly: true
          description: The error target.
        details:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
          description: Further details about specific errors that led to this error.
        innererror:
          $ref: '#/components/schemas/CommunicationError'
    CommunicationErrorResponse:
      description: The Communication Services error.
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/CommunicationError'
    CreateRoomRequest:
      description: Request payload for creating new room.
      type: object
      properties:
        validFrom:
          format: date-time
          description: 'The timestamp from when the room is open for joining. The
            timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`. The default value
            is the current date time.'
          type: string
        validUntil:
          format: date-time
          description: 'The timestamp from when the room can no longer be joined.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`. The default
            value is the current date time plus 180 days.'
          type: string
        pstnDialOutEnabled:
          description: Set this flag to true if, at the time of the call, dial out
            to a PSTN number is enabled in a particular room. By default, this flag
            is set to false.
          type: boolean
        participants:
          description: (Optional) Participants to be invited to the room.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParticipantProperties'
    ParticipantProperties:
      required:
      - role
      type: object
      properties:
        role:
          $ref: '#/components/schemas/Role'
    ParticipantsCollection:
      description: A collection of participants in a room.
      required:
      - value
      type: object
      properties:
        value:
          description: A collection of participants.
          type: array
          items:
            $ref: '#/components/schemas/RoomParticipant'
        nextLink:
          description: If there are more participants that can be retrieved, the next
            link will be populated.
          type: string
    Role:
      description: The role of a room participant. The default value is Attendee.
      enum:
      - Presenter
      - Attendee
      - Consumer
      - Collaborator
      type: string
      x-ms-enum:
        name: Role
        modelAsString: true
    RoomModel:
      description: The meeting room.
      type: object
      required:
      - createdAt
      - id
      - validFrom
      - validUntil
      - pstnDialOutEnabled
      properties:
        id:
          description: Unique identifier of a room. This id is server generated.
          type: string
        createdAt:
          format: date-time
          description: 'The timestamp when the room was created at the server. The
            timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        validFrom:
          format: date-time
          description: 'The timestamp from when the room is open for joining. The
            timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        validUntil:
          format: date-time
          description: 'The timestamp from when the room can no longer be joined.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        pstnDialOutEnabled:
          description: Set this flag to true if, at the time of the call, dial out
            to a PSTN number is enabled in a particular room. By default, this flag
            is set to false.
          type: boolean
    RoomParticipant:
      description: A participant of the room.
      required:
      - rawId
      - role
      type: object
      properties:
        rawId:
          description: Raw ID representation of the communication identifier. Please
            refer to the following document for additional information on Raw ID.
            <br> https://learn.microsoft.com/azure/communication-services/concepts/identifiers?pivots=programming-language-rest#raw-id-representation
          type: string
        role:
          $ref: '#/components/schemas/Role'
    RoomsCollection:
      description: A collection of rooms.
      required:
      - value
      type: object
      properties:
        value:
          description: A collection of rooms.
          type: array
          items:
            $ref: '#/components/schemas/RoomModel'
        nextLink:
          description: If there are more rooms that can be retrieved, the next link
            will be populated.
          type: string
    UpdateParticipantsRequest:
      description: Participants to be updated in the room.
      type: object
      properties:
        participants:
          description: Participants to be updated.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ParticipantProperties'
    UpdateParticipantsResult:
      description: Request response for updating participants.
      type: object
    UpdateRoomRequest:
      description: Request payload for updating a room.
      type: object
      properties:
        validFrom:
          format: date-time
          description: '(Optional) The timestamp from when the room is open for joining.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        validUntil:
          format: date-time
          description: '(Optional) The timestamp from when the room can no longer
            be joined. The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        pstnDialOutEnabled:
          description: (Optional) Set this flag to true if, at the time of the call,
            dial out to a PSTN number is enabled in a particular room. By default,
            this flag is set to false.
          type: boolean
