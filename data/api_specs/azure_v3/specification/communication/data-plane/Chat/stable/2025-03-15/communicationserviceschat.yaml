servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: The endpoint of the Azure Communication resource.
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
components:
  parameters:
    ApiVersionParameter:
      in: query
      name: api-version
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    Endpoint:
      in: path
      name: endpoint
      description: The endpoint of the Azure Communication resource.
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    Authorization:
      type: apiKey
      name: Authorization
      in: header
      description: An ACS (Azure Communication Services) user access token.
  schemas:
    CommunicationUserIdentifierModel:
      description: A user that got created with an Azure Communication Services resource.
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: The Id of the communication user.
    CommunicationCloudEnvironment:
      $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
    MicrosoftTeamsUserIdentifierModel:
      description: A Microsoft Teams user.
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          description: The Id of the Microsoft Teams user. If not anonymous, this
            is the Entra ID object Id of the user.
        isAnonymous:
          type: boolean
          description: True if the Microsoft Teams user is anonymous. By default false
            if missing.
        cloud:
          $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
    MicrosoftTeamsAppIdentifierModel:
      description: A Microsoft Teams application.
      type: object
      required:
      - appId
      properties:
        appId:
          type: string
          description: The Id of the Microsoft Teams application.
        cloud:
          $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
    CommunicationIdentifierModel:
      description: 'Identifies a participant in Azure Communication services. A participant
        is, for example, a phone number or an Azure communication user. This model
        is polymorphic: Apart from kind and rawId, at most one further property may
        be set which must match the kind enum value.'
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CommunicationIdentifierModelKind'
        rawId:
          type: string
          description: Raw Id of the identifier. Optional in requests, required in
            responses.
        communicationUser:
          $ref: '#/components/schemas/CommunicationUserIdentifierModel'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
        microsoftTeamsUser:
          $ref: '#/components/schemas/MicrosoftTeamsUserIdentifierModel'
        microsoftTeamsApp:
          $ref: '#/components/schemas/MicrosoftTeamsAppIdentifierModel'
        teamsExtensionUser:
          $ref: '#/components/schemas/TeamsExtensionUserIdentifierModel'
    ChatMessageReadReceipt:
      description: A chat message read receipt indicates the time a chat message was
        read by a recipient.
      required:
      - chatMessageId
      - readOn
      - senderCommunicationIdentifier
      type: object
      properties:
        senderCommunicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        chatMessageId:
          description: Id of the chat message that has been read. This id is generated
            by the server.
          type: string
        readOn:
          format: date-time
          description: 'The time at which the message was read. The timestamp is in
            RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
    ChatMessageReadReceiptsCollection:
      description: A paged collection of chat message read receipts.
      required:
      - value
      type: object
      properties:
        value:
          description: Collection of chat message read receipts.
          type: array
          items:
            $ref: '#/components/schemas/ChatMessageReadReceipt'
        nextLink:
          description: If there are more chat message read receipts that can be retrieved,
            the next link will be populated.
          type: string
          readOnly: true
    CommunicationError:
      description: The Communication Services error.
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
        target:
          type: string
          readOnly: true
          description: The error target.
        details:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
          description: Further details about specific errors that led to this error.
        innererror:
          $ref: '#/components/schemas/CommunicationError'
    CommunicationErrorResponse:
      description: The Communication Services error.
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/CommunicationError'
    SendReadReceiptRequest:
      description: Request payload for sending a read receipt.
      required:
      - chatMessageId
      type: object
      properties:
        chatMessageId:
          description: Id of the latest chat message read by the user.
          type: string
    ChatMessageType:
      description: The chat message type.
      enum:
      - text
      - html
      - topicUpdated
      - participantAdded
      - participantRemoved
      type: string
      x-ms-enum:
        name: ChatMessageType
        modelAsString: true
    SendChatMessageRequest:
      description: Details of the message to send.
      required:
      - content
      type: object
      properties:
        content:
          description: Chat message content.
          type: string
        senderDisplayName:
          description: The display name of the chat message sender. This property
            is used to populate sender name for push notifications.
          type: string
        type:
          $ref: '#/components/schemas/ChatMessageType'
        metadata:
          description: Message metadata.
          type: object
          additionalProperties:
            type: string
    SendChatMessageResult:
      description: Result of the send message operation.
      required:
      - id
      type: object
      properties:
        id:
          description: A server-generated message id.
          type: string
    ChatParticipant:
      description: A participant of the chat thread.
      required:
      - communicationIdentifier
      type: object
      properties:
        communicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        displayName:
          description: Display name for the chat participant.
          type: string
        shareHistoryTime:
          format: date-time
          description: 'Time from which the chat history is shared with the participant.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        metadata:
          description: Contextual metadata for the chat participant. The metadata
            consists of name/value pairs. The total size of all metadata pairs can
            be up to 1KB in size.
          type: object
          additionalProperties:
            type: string
    ChatAttachmentType:
      description: The type of attachment.
      enum:
      - image
      - file
      type: string
      x-ms-enum:
        name: ChatAttachmentType
        modelAsString: true
    ChatAttachment:
      description: An attachment in a chat message.
      required:
      - id
      - attachmentType
      type: object
      properties:
        id:
          description: Id of the attachment
          type: string
        attachmentType:
          $ref: '#/components/schemas/ChatAttachmentType'
        name:
          description: The name of the attachment content.
          type: string
        url:
          description: The URL where the attachment can be downloaded
          type: string
          format: uri
        previewUrl:
          description: The URL where the preview of attachment can be downloaded
          type: string
          format: uri
    ChatMessageContent:
      description: Content of a chat message.
      type: object
      properties:
        message:
          description: Chat message content for messages of types text or html.
          type: string
        topic:
          description: Chat message content for messages of type topicUpdated.
          type: string
        participants:
          description: Chat message content for messages of types participantAdded
            or participantRemoved.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
        attachments:
          description: List of attachments for this message
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        initiatorCommunicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
    ChatMessage:
      description: Chat message.
      required:
      - createdOn
      - id
      - sequenceId
      - type
      - version
      type: object
      properties:
        id:
          description: The id of the chat message. This id is server generated.
          type: string
        type:
          $ref: '#/components/schemas/ChatMessageType'
        sequenceId:
          description: Sequence of the chat message in the conversation.
          type: string
        version:
          description: Version of the chat message.
          type: string
        content:
          $ref: '#/components/schemas/ChatMessageContent'
        senderDisplayName:
          description: The display name of the chat message sender. This property
            is used to populate sender name for push notifications.
          type: string
        createdOn:
          format: date-time
          description: 'The timestamp when the chat message arrived at the server.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        senderCommunicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        deletedOn:
          format: date-time
          description: 'The timestamp (if applicable) when the message was deleted.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        editedOn:
          format: date-time
          description: 'The last timestamp (if applicable) when the message was edited.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        metadata:
          description: Message metadata.
          type: object
          additionalProperties:
            type: string
    ChatMessagesCollection:
      description: Collection of chat messages for a particular chat thread.
      required:
      - value
      type: object
      properties:
        value:
          description: Collection of chat messages.
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        nextLink:
          description: If there are more chat messages that can be retrieved, the
            next link will be populated.
          type: string
          readOnly: true
    UpdateChatMessageRequest:
      description: Request payload for updating a chat message.
      type: object
      properties:
        content:
          description: Chat message content.
          type: string
        metadata:
          description: Message metadata.
          type: object
          additionalProperties:
            type: string
    ChatParticipantsCollection:
      description: Collection of participants belong to a particular thread.
      required:
      - value
      type: object
      properties:
        value:
          description: Chat participants.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
        nextLink:
          description: If there are more chat participants that can be retrieved,
            the next link will be populated.
          type: string
          readOnly: true
    AddChatParticipantsRequest:
      description: Participants to be added to the thread.
      required:
      - participants
      type: object
      properties:
        participants:
          description: Participants to add to a chat thread.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
    AddChatParticipantsResult:
      description: Result of the add chat participants operation.
      type: object
      properties:
        invalidParticipants:
          description: The participants that failed to be added to the chat thread.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
    CreateChatThreadRequest:
      description: Request payload for creating a chat thread.
      required:
      - topic
      type: object
      properties:
        topic:
          description: The chat thread topic.
          type: string
        participants:
          description: Participants to be added to the chat thread.
          type: array
          items:
            $ref: '#/components/schemas/ChatParticipant'
        metadata:
          description: Contextual metadata for the thread. The metadata consists of
            name/value pairs. The total size of all metadata pairs can be up to 1KB
            in size.
          type: object
          additionalProperties:
            type: string
        retentionPolicy:
          $ref: '#/components/schemas/ChatRetentionPolicy'
    ChatThreadProperties:
      description: Chat thread.
      required:
      - createdByCommunicationIdentifier
      - createdOn
      - id
      - topic
      type: object
      properties:
        id:
          description: Chat thread id.
          type: string
        topic:
          description: Chat thread topic.
          type: string
        createdOn:
          format: date-time
          description: 'The timestamp when the chat thread was created. The timestamp
            is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        createdByCommunicationIdentifier:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        deletedOn:
          format: date-time
          description: 'The timestamp when the chat thread was deleted. The timestamp
            is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        metadata:
          description: Contextual metadata for the thread. The metadata consists of
            name/value pairs. The total size of all metadata pairs can be up to 1KB
            in size.
          type: object
          additionalProperties:
            type: string
        retentionPolicy:
          $ref: '#/components/schemas/ChatRetentionPolicy'
    CreateChatThreadResult:
      description: Result of the create chat thread operation.
      type: object
      properties:
        chatThread:
          $ref: '#/components/schemas/ChatThreadProperties'
        invalidParticipants:
          description: The participants that failed to be added to the chat thread.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
    ChatThreadItem:
      description: Summary information of a chat thread.
      required:
      - id
      - topic
      type: object
      properties:
        id:
          description: Chat thread id.
          type: string
        topic:
          description: Chat thread topic.
          type: string
        deletedOn:
          format: date-time
          description: 'The timestamp when the chat thread was deleted. The timestamp
            is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
        lastMessageReceivedOn:
          format: date-time
          description: 'The timestamp when the last message arrived at the server.
            The timestamp is in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
          type: string
          readOnly: true
    ChatThreadsItemCollection:
      description: Collection of chat threads.
      required:
      - value
      type: object
      properties:
        value:
          description: Collection of chat threads.
          type: array
          items:
            $ref: '#/components/schemas/ChatThreadItem'
        nextLink:
          description: If there are more chat threads that can be retrieved, the next
            link will be populated.
          type: string
          readOnly: true
    UpdateChatThreadRequest:
      description: Request payload for updating a chat thread.
      type: object
      properties:
        topic:
          description: Chat thread topic.
          type: string
        metadata:
          description: Contextual metadata for the thread. The metadata consists of
            name/value pairs. The total size of all metadata pairs can be up to 1KB
            in size.
          type: object
          additionalProperties:
            type: string
        retentionPolicy:
          $ref: '#/components/schemas/ChatRetentionPolicy'
    SendTypingNotificationRequest:
      description: Request payload for typing notifications.
      type: object
      properties:
        senderDisplayName:
          description: The display name of the typing notification sender. This property
            is used to populate sender name for push notifications.
          type: string
    ChatRetentionPolicy:
      description: Data retention policy for auto deletion.
      type: object
      discriminator:
        propertyName: kind
      properties:
        kind:
          description: Retention Policy Type
          enum:
          - threadCreationDate
          - none
          type: string
          x-ms-enum:
            name: RetentionPolicyKind
            modelAsString: true
            values:
            - value: threadCreationDate
              description: Thread retention policy based on thread creation date.
            - value: none
              description: No thread retention policy
      required:
      - kind
    ThreadCreationDateRetentionPolicy:
      $ref: '#/components/schemas/ChatRetentionPolicy'
      type: object
      properties:
        deleteThreadAfterDays:
          type: integer
          format: int32
          description: Indicates how many days after the thread creation the thread
            will be deleted.
      required:
      - deleteThreadAfterDays
      description: Thread retention policy based on thread creation date.
      x-ms-discriminator-value: threadCreationDate
    NoneRetentionPolicy:
      $ref: '#/components/schemas/ChatRetentionPolicy'
      type: object
      description: No thread retention policy.
      x-ms-discriminator-value: none
    CommunicationIdentifierModelKind:
      description: The identifier kind, for example 'communicationUser' or 'phoneNumber'.
      type: string
      enum:
      - unknown
      - communicationUser
      - phoneNumber
      - microsoftTeamsUser
      - microsoftTeamsApp
      - teamsExtensionUser
      x-ms-enum:
        name: CommunicationIdentifierModelKind
        modelAsString: true
    PhoneNumberIdentifierModel:
      description: A phone number.
      type: object
      required:
      - value
      properties:
        value:
          type: string
          description: The phone number, usually in E.164 format.
        isAnonymous:
          type: boolean
          description: True if the phone number is anonymous. By default false if
            missing. If the phone number is anonymous, the value will be the string
            'anonymous'.
        assertedId:
          type: string
          description: The asserted Id of the phone number. An asserted Id gets generated
            when the same phone number joins the same call more than once.
    CommunicationCloudEnvironmentModel:
      description: The cloud that the identifier belongs to.
      type: string
      enum:
      - public
      - dod
      - gcch
      x-ms-enum:
        name: CommunicationCloudEnvironmentModel
        modelAsString: true
    TeamsExtensionUserIdentifierModel:
      description: A Microsoft Teams Phone user who is using a Communication Services
        resource to extend their Teams Phone set up.
      type: object
      required:
      - userId
      - tenantId
      - resourceId
      properties:
        userId:
          type: string
          description: The Id of the Microsoft Teams Extension user, i.e. the Entra
            ID object Id of the user.
        tenantId:
          type: string
          description: The tenant Id of the Microsoft Teams Extension user.
        resourceId:
          type: string
          description: The Communication Services resource Id.
        cloud:
          $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
