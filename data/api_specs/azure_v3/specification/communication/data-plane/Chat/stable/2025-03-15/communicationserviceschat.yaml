          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /chat/threads/{chatThreadId}/participants/:remove:
    post:
      tags:
      - Participants
      summary: Remove a participant from a thread.
      operationId: ChatThread_RemoveChatParticipant
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to remove the participant from.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentifierModel'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CommunicationIdentifierModel'
        description: Id of the thread participant to remove from the thread.
        required: true
      responses:
        '204':
          description: Request successful.
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /chat/threads/{chatThreadId}/participants/:add:
    post:
      tags:
      - Participants
      summary: Adds thread participants to a thread. If participants already exist,
        no change occurs.
      operationId: ChatThread_AddChatParticipants
      parameters:
      - in: path
        name: chatThreadId
        description: Id of the thread to add participants to.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChatParticipantsRequest'
        description: Thread participants to be added to the thread.
        required: true
      responses:
        '201':
          description: The participants were successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddChatParticipantsResult'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /chat/threads:
    post:
      tags:
      - Threads
      summary: Creates a chat thread.
      operationId: Chat_CreateChatThread
      parameters:
      - in: header
        name: repeatability-request-id
        description: If specified, the client directs that the request is repeatable;
          that is, that the client can make the request multiple times with the same
          Repeatability-Request-Id and get back an appropriate response without the
          server executing the request multiple times. The value of the Repeatability-Request-Id
          is an opaque string representing a client-generated, globally unique for
          all time, identifier for the request. It is recommended to use version 4
          (random) UUIDs.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatThreadRequest'
        description: Request payload for creating a chat thread.
        required: true
      responses:
        '201':
          description: Thread created, the `Location` header would contain the URL
            for the newly created thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatThreadResult'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    get:
      tags:
      - Threads
      summary: Gets the list of chat threads of a user.
      operationId: Chat_ListChatThreads
      parameters:
      - in: query
        name: maxPageSize
        description: The maximum number of chat threads returned per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: startTime
        description: 'The earliest point in time to get chat threads up to. The timestamp
          should be in RFC3339 format: `yyyy-MM-ddTHH:mm:ssZ`.'
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns a `GetThreadsResponse`
            resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatThreadsItemCollection'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
