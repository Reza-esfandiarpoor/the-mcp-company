  /chat/threads/{chatThreadId}/participants:
    get:
      tags:
      - Participants
      summary: Gets the participants of a thread.
      operationId: ChatThread_ListChatParticipants
      parameters:
      - in: path
        name: chatThreadId
        description: Thread id to get participants for.
        required: true
        schema:
          type: string
      - in: query
        name: maxPageSize
        description: The maximum number of participants to be returned per page.
        schema:
          type: integer
          format: int32
      - in: query
        name: skip
        description: Skips participants up to a specified position in response.
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request successful. The action returns the participants of
            a thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatParticipantsCollection'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
