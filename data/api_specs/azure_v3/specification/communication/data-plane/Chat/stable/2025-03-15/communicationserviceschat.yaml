  /chat/threads/{chatThreadId}/typing:
    post:
      tags:
      - TypingNotifications
      summary: Posts a typing event to a thread, on behalf of a user.
      operationId: ChatThread_SendTypingNotification
      parameters:
      - in: path
        name: chatThreadId
        description: Id of the thread.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTypingNotificationRequest'
        description: Details of the typing notification request.
      responses:
        '200':
          description: Request successful.
        '401':
          description: Unauthorized.
