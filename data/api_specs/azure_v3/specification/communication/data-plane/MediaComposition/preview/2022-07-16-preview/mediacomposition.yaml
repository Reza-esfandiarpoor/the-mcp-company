openapi: 3.0.0
info:
  title: Azure Communication Media Composition Service
  description: Azure Communication Media Composition Service
  version: 2022-07-16-preview
paths:
  /mediaCompositions/{mediaCompositionId}:
    get:
      tags:
      - MediaComposition
      summary: Gets a media composition
      operationId: MediaComposition_Get
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaComposition'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    put:
      tags:
      - MediaComposition
      summary: Creates a new media composition
      operationId: MediaComposition_Create
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaComposition'
        description: The media composition object to create
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaComposition'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    patch:
      tags:
      - MediaComposition
      summary: Updates an existing media composition
      operationId: MediaComposition_Update
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/MediaComposition'
        description: The media composition object to update
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaComposition'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
    delete:
      tags:
      - MediaComposition
      summary: Deletes a media composition
      operationId: MediaComposition_Delete
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /mediaCompositions/{mediaCompositionId}:start:
    post:
      tags:
      - MediaComposition
      summary: Starts the composition
      operationId: MediaComposition_Start
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionStreamState'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
  /mediaCompositions/{mediaCompositionId}:stop:
    post:
      tags:
      - MediaComposition
      summary: Stops the composition
      operationId: MediaComposition_Stop
      parameters:
      - in: path
        name: mediaCompositionId
        description: The media composition id
        required: true
        schema:
          type: string
          maxLength: 256
          pattern: ^[0-9a-zA-Z-]+$
      - in: query
        name: api-version
        description: The API version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionStreamState'
        '400':
          description: Bad Request.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '401':
          description: Unauthorized.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '403':
          description: Forbidden.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '429':
          description: Too many requests.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        '503':
          description: Service unavailable.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
        default:
          description: Failure
          headers:
            x-ms-error-code:
              description: The error code.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationErrorResponse'
components:
  schemas:
    ActivePresenter:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        call:
          description: The id of the teams meeting or call
          type: string
      required:
      - call
      x-ms-discriminator-value: activePresenter
    AudiencePosition:
      description: Position of the audience streams
      enum:
      - top
      - right
      - bottom
      - left
      type: string
      x-ms-enum:
        name: AudiencePosition
        modelAsString: true
    AutoGridInputGroup:
      $ref: '#/components/schemas/InputGroup'
      type: object
      properties:
        inputIds:
          description: Input and input group ids to be included in this input group.
          type: array
          items:
            type: string
      required:
      - inputIds
      x-ms-discriminator-value: autoGridBased
    AutoGridLayout:
      $ref: '#/components/schemas/Layout'
      type: object
      properties:
        inputIds:
          description: Input ids to be included in the layout
          type: array
          items:
            type: string
        highlightDominantSpeaker:
          description: Toggle dominant speaker highlighting
          type: boolean
      required:
      - inputIds
      description: Configure the autogrid layout
      x-ms-discriminator-value: autoGrid
    CommunicationError:
      description: The Communication Services error.
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: The error code.
        message:
          type: string
          description: The error message.
        target:
          type: string
          readOnly: true
          description: The error target.
        details:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationError'
          readOnly: true
          description: Further details about specific errors that led to this error.
        innererror:
          $ref: '#/components/schemas/CommunicationError'
    CommunicationErrorResponse:
      description: The Communication Services error.
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/CommunicationError'
    CommunicationIdentifierModel:
      description: 'Identifies a participant in Azure Communication services. A participant
        is, for example, a phone number or an Azure communication user. This model
        is polymorphic: Apart from kind and rawId, at most one further property may
        be set which must match the kind enum value.'
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CommunicationIdentifierModelKind'
        rawId:
          type: string
          description: Raw Id of the identifier. Optional in requests, required in
            responses.
        communicationUser:
          $ref: '#/components/schemas/CommunicationUserIdentifierModel'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
        microsoftTeamsUser:
          $ref: '#/components/schemas/MicrosoftTeamsUserIdentifierModel'
    CompositionStreamState:
      description: Provides the state of the media composition
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StreamStatus'
    CustomLayout:
      $ref: '#/components/schemas/Layout'
      type: object
      properties:
        layers:
          description: Configure layer to control the z-position of input groups
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Layer'
        inputGroups:
          description: Configure input groups of the layout
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InputGroup'
      required:
      - inputGroups
      description: Configure custom layout
      x-ms-discriminator-value: custom
    DominantSpeaker:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        call:
          description: The id of the teams meeting or call
          type: string
      required:
      - call
      x-ms-discriminator-value: dominantSpeaker
    GridInputGroup:
      $ref: '#/components/schemas/InputGroup'
      type: object
      properties:
        inputIds:
          description: Input and input group ids to be included in this input group.
          type: array
          items:
            type: array
            items:
              type: string
        rows:
          format: int32
          description: Number of rows
          type: integer
        columns:
          format: int32
          description: Number of columns
          type: integer
      required:
      - columns
      - inputIds
      - rows
      description: Configure grid-based input group to be used in custom layouts
      x-ms-discriminator-value: gridBased
    GridLayout:
      $ref: '#/components/schemas/Layout'
      type: object
      properties:
        rows:
          format: int32
          description: Number of rows
          type: integer
        columns:
          format: int32
          description: Number of columns
          type: integer
        inputIds:
          description: Input ids to be included in the layout.
          type: array
          items:
            type: array
            items:
              type: string
      required:
      - columns
      - inputIds
      - rows
      description: Configure the grid layout
      x-ms-discriminator-value: grid
    GroupCallInput:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        id:
          description: Group call identifier
          type: string
      required:
      - id
      description: Group call to be used as an input
      x-ms-discriminator-value: groupCall
    GroupCallOutput:
      $ref: '#/components/schemas/MediaOutput'
      type: object
      properties:
        id:
          description: Group call identifier
          type: string
      required:
      - id
      description: Group call to be used as an output
      x-ms-discriminator-value: groupCall
    Image:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        uri:
          description: Url of the image file
          type: string
      required:
      - uri
      description: An image input
      x-ms-discriminator-value: image
    InputGroup:
      description: Configure input group to be used in custom layouts
      required:
      - kind
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/InputGroupType'
        position:
          $ref: '#/components/schemas/Position'
        width:
          description: The width of the input group container. Can be defined as pixels
            or percentage.
          pattern: ^\s*\d+(\.\d+)?(%|px)?\s*$
          type: string
        height:
          description: The height of the input group container. Can be defined as
            pixels or percentage.
          pattern: ^\s*\d+(\.\d+)?(%|px)?\s*$
          type: string
        layer:
          description: The layer this input group should appear on
          type: string
        scalingMode:
          $ref: '#/components/schemas/ScalingMode'
      discriminator:
        propertyName: kind
    InputGroupType:
      description: Kind of input group
      enum:
      - gridBased
      - autoGridBased
      type: string
      x-ms-enum:
        name: InputGroupType
        modelAsString: true
    Layer:
      description: Configure layer to control the z-position of input groups
      required:
      - zIndex
      type: object
      properties:
        zIndex:
          format: int32
          description: The z position of the layer
          type: integer
        visibility:
          $ref: '#/components/schemas/LayerVisibility'
    LayerVisibility:
      description: The visibility of the layer
      enum:
      - visible
      - hidden
      type: string
      x-ms-enum:
        name: LayerVisibility
        modelAsString: true
    Layout:
      description: Configure a layout
      required:
      - kind
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/LayoutType'
        resolution:
          $ref: '#/components/schemas/Resolution'
        placeholderImageUri:
          description: Set global placeholder image
          type: string
        scalingMode:
          $ref: '#/components/schemas/ScalingMode'
      discriminator:
        propertyName: kind
    LayoutType:
      description: Kind of layout
      enum:
      - custom
      - grid
      - autoGrid
      - presentation
      - presenter
      type: string
      x-ms-enum:
        name: LayoutType
        modelAsString: true
    MediaComposition:
      description: Body of a media composition
      type: object
      properties:
        id:
          description: Id of the media composition
          type: string
        layout:
          $ref: '#/components/schemas/Layout'
        inputs:
          description: Inputs used in the composition
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MediaInput'
        outputs:
          description: Outputs used in the composition
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MediaOutput'
        streamState:
          $ref: '#/components/schemas/CompositionStreamState'
    MediaInput:
      description: Media input to be used in the composition
      required:
      - kind
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MediaInputType'
        placeholderImageUri:
          description: Image url to be used if participant has no video stream
          type: string
      discriminator:
        propertyName: kind
    MediaInputType:
      description: Kind of media input
      enum:
      - participant
      - screenShare
      - dominantSpeaker
      - activePresenter
      - image
      - groupCall
      - room
      - teamsMeeting
      - srt
      - rtmp
      type: string
      x-ms-enum:
        name: MediaInputType
        modelAsString: true
    MediaOutput:
      description: Media output to be used in the composition
      required:
      - kind
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MediaOutputType'
      discriminator:
        propertyName: kind
    MediaOutputType:
      description: Kind of media output
      enum:
      - groupCall
      - room
      - teamsMeeting
      - srt
      - rtmp
      type: string
      x-ms-enum:
        name: MediaOutputType
        modelAsString: true
    Participant:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        call:
          description: The id of the teams meeting or call
          type: string
      required:
      - call
      - id
      x-ms-discriminator-value: participant
    Position:
      description: The (x,y) position on scene or input group
      required:
      - x
      - y
      type: object
      properties:
        x:
          format: int32
          description: The x-position
          type: integer
        y:
          format: int32
          description: The y-position
          type: integer
    PresentationLayout:
      $ref: '#/components/schemas/Layout'
      type: object
      properties:
        presenterId:
          description: Id of the presenter input
          type: string
        audienceIds:
          description: Input ids to be included in the audience of layout
          type: array
          items:
            type: string
        audiencePosition:
          $ref: '#/components/schemas/AudiencePosition'
      required:
      - audienceIds
      - presenterId
      description: Configure the presentation layout
      x-ms-discriminator-value: presentation
    PresenterLayout:
      $ref: '#/components/schemas/Layout'
      type: object
      properties:
        presenterId:
          description: Id of the presenter input
          type: string
        supportId:
          description: Id of the support input
          type: string
        supportPosition:
          $ref: '#/components/schemas/SupportPosition'
        supportAspectRatio:
          format: double
          description: Aspect ratio of the support stream.
          type: number
      required:
      - presenterId
      - supportId
      description: Configure the presenter layout
      x-ms-discriminator-value: presenter
    Resolution:
      description: The dimensions of the scene or objects in the scene
      required:
      - height
      - width
      type: object
      properties:
        width:
          format: int32
          description: Width of the object
          type: integer
        height:
          format: int32
          description: Height of the object
          type: integer
    RoomInput:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        id:
          description: Room identifier
          type: string
      required:
      - id
      description: A Room to be used as an input
      x-ms-discriminator-value: room
    RoomOutput:
      $ref: '#/components/schemas/MediaOutput'
      type: object
      properties:
        id:
          description: Room identifier
          type: string
      required:
      - id
      description: A Room to be used as an output
      x-ms-discriminator-value: room
    RtmpInput:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        streamKey:
          description: Stream key of the stream
          type: string
        resolution:
          $ref: '#/components/schemas/Resolution'
        streamUrl:
          description: The url of the stream
          type: string
        mode:
          $ref: '#/components/schemas/RtmpMode'
      required:
      - resolution
      - streamKey
      - streamUrl
      description: Rtmp stream to be used as an input
      x-ms-discriminator-value: rtmp
    RtmpMode:
      description: Rtmp mode
      enum:
      - push
      - pull
      type: string
      x-ms-enum:
        name: RtmpMode
        modelAsString: true
    RtmpOutput:
      $ref: '#/components/schemas/MediaOutput'
      type: object
      properties:
        streamKey:
          description: Stream key of the stream
          type: string
        resolution:
          $ref: '#/components/schemas/Resolution'
        streamUrl:
          description: The url of the stream
          type: string
        mode:
          $ref: '#/components/schemas/RtmpMode'
      required:
      - resolution
      - streamKey
      - streamUrl
      description: Rtmp stream to be used as an output
      x-ms-discriminator-value: rtmp
    ScalingMode:
      description: The scaling mode for the view of a video stream in a cell.
      enum:
      - stretch
      - crop
      - fit
      type: string
      x-ms-enum:
        name: ScalingMode
        modelAsString: true
    ScreenShare:
      $ref: '#/components/schemas/MediaInput'
      type: object
      properties:
        call:
          description: The id of the teams meeting or call
          type: string
      required:
      - call
      x-ms-discriminator-value: screenShare
    SrtInput:
      $ref: '#/components/schemas/MediaInput'
