openapi: 3.0.0
info:
  title: CommunicationMessagesClient
  version: 2024-08-30
  description: Azure Communication Messages Service
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- AadOauth2Auth:
  - https://communication.azure.com/.default
- ApiKeyAuth: []
tags:
- name: Template
- name: Notifications
- name: Stream
paths:
  /messages/channels/{channelId}/templates:
    get:
      operationId: TemplateOperations_ListTemplates
      tags:
      - Template
      description: List all templates for given Azure Communication Services channel
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: channelId
        in: path
        description: The registration ID of the channel.
        required: true
        schema:
          type: string
          format: uuid
      - name: maxpagesize
        in: query
        description: Number of objects to return per page.
        required: false
        schema:
          type: integer
          format: int32
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageTemplateItem'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /messages/notifications:send:
    post:
      operationId: NotificationMessagesOperations_Send
      tags:
      - Notifications
      description: Sends a notification message from Business to User.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityRequestId'
      - $ref: '#/components/parameters/Azure.Core.RepeatabilityRequestHeaders.repeatabilityFirstSent'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationContent'
        description: Details of the message to send.
        required: true
        x-ms-parameter-location: method
      responses:
        '202':
          description: The request has been accepted for processing, but processing
            has not yet completed.
          headers:
            Repeatability-Result:
              description: Indicates whether the repeatable request was accepted or
                rejected.
              x-ms-enum:
                name: RepeatabilityResult
                modelAsString: false
                values:
                - name: accepted
                  value: accepted
                  description: If the request was accepted and the server guarantees
                    that the server state reflects a single execution of the operation.
                - name: rejected
                  value: rejected
                  description: 'If the request was rejected because the combination
                    of Repeatability-First-Sent and Repeatability-Request-ID were
                    invalid

                    or because the Repeatability-First-Sent value was outside the
                    range of values held by the server.'
              schema:
                type: string
                enum:
                - accepted
                - rejected
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /messages/streams/{id}:
    get:
      operationId: StreamOperations_GetMedia
      tags:
      - Stream
      description: Download the Media payload from a User to Business message.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: id
        in: path
        description: The stream ID.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
