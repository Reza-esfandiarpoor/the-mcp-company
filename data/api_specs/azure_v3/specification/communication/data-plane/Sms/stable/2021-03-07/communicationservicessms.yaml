openapi: 3.0.0
info:
  title: Azure Communication SMS Service
  description: Azure Communication SMS Service
  version: 2021-03-07
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: The communication resource, for example https://my-resource.communication.azure.com
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
paths:
  /sms:
    post:
      tags:
      - Sms
      summary: Sends a SMS message from a phone number that belongs to the authenticated
        account.
      operationId: Sms_Send
      parameters:
      - name: api-version
        in: query
        description: Version of API to invoke.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Represents the properties of a send message request.
              required:
              - message
              - smsRecipients
              - from
              type: object
              properties:
                from:
                  description: The sender's phone number in E.164 format that is owned
                    by the authenticated account.
                  type: string
                smsRecipients:
                  description: The recipient's phone number in E.164 format. In this
                    version, a minimum of 1 and upto 100 recipients in the list are
                    supported.
                  maxLength: 100
                  minLength: 1
                  type: array
                  items:
                    description: Recipient details for sending SMS messages.
                    required:
                    - to
                    type: object
                    properties:
                      to:
                        description: The recipient's phone number in E.164 format.
                        type: string
                      repeatabilityRequestId:
                        description: If specified, the client directs that the request
                          is repeatable; that is, the client can make the request
                          multiple times with the same Repeatability-Request-ID and
                          get back an appropriate response without the server executing
                          the request multiple times. The value of the Repeatability-Request-ID
                          is an opaque string representing a client-generated, 36-character
                          hexadecimal case-insensitive encoding of a UUID (GUID),
                          identifier for the request.
                        type: string
                      repeatabilityFirstSent:
                        description: MUST be sent by clients to specify that a request
                          is repeatable. Repeatability-First-Sent is used to specify
                          the date and time at which the request was first created.eg-
                          Tue, 26 Mar 2019 16:06:51 GMT
                        type: string
                message:
                  description: The contents of the message that will be sent to the
                    recipient. The allowable content is defined by RFC 5724.
                  maxLength: 2048
                  minLength: 0
                  type: string
                smsSendOptions:
                  description: Optional configuration for sending SMS messages.
                  required:
                  - enableDeliveryReport
                  type: object
                  properties:
                    enableDeliveryReport:
                      description: Enable this flag to receive a delivery report for
                        this message on the Azure Resource EventGrid.
                      type: boolean
                    tag:
                      description: Use this field to provide metadata that will then
                        be sent back in the corresponding Delivery Report.
                      type: string
        description: Represents the body of the send message request.
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                description: Response for a successful or multi status send Sms request.
                required:
                - value
                type: object
                properties:
                  value:
                    type: array
                    items:
                      description: Response for a single recipient.
                      required:
                      - httpStatusCode
                      - to
                      - successful
                      type: object
                      properties:
                        to:
                          description: The recipient's phone number in E.164 format.
                          type: string
                        messageId:
                          description: The identifier of the outgoing Sms message.
                            Only present if message processed.
                          type: string
                        httpStatusCode:
                          description: HTTP Status code.
                          type: integer
                        repeatabilityResult:
                          description: The result of a repeatable request with one
                            of the case-insensitive values accepted or rejected.
                          type: string
                          enum:
                          - accepted
                          - rejected
                        successful:
                          description: Indicates if the message is processed successfully
                            or not.
                          type: boolean
                        errorMessage:
                          description: Optional error message in case of 4xx/5xx/repeatable
                            errors.
                          type: string
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    SmsRecipient:
      description: Recipient details for sending SMS messages.
      required:
      - to
      type: object
      properties:
        to:
          description: The recipient's phone number in E.164 format.
          type: string
        repeatabilityRequestId:
          description: If specified, the client directs that the request is repeatable;
            that is, the client can make the request multiple times with the same
            Repeatability-Request-ID and get back an appropriate response without
            the server executing the request multiple times. The value of the Repeatability-Request-ID
            is an opaque string representing a client-generated, 36-character hexadecimal
            case-insensitive encoding of a UUID (GUID), identifier for the request.
          type: string
        repeatabilityFirstSent:
          description: MUST be sent by clients to specify that a request is repeatable.
            Repeatability-First-Sent is used to specify the date and time at which
            the request was first created.eg- Tue, 26 Mar 2019 16:06:51 GMT
          type: string
    SmsSendOptions:
      description: Optional configuration for sending SMS messages.
      required:
      - enableDeliveryReport
      type: object
      properties:
        enableDeliveryReport:
          description: Enable this flag to receive a delivery report for this message
            on the Azure Resource EventGrid.
          type: boolean
        tag:
          description: Use this field to provide metadata that will then be sent back
            in the corresponding Delivery Report.
          type: string
    SendMessageRequest:
      description: Represents the properties of a send message request.
      required:
      - message
      - smsRecipients
      - from
      type: object
      properties:
        from:
          description: The sender's phone number in E.164 format that is owned by
            the authenticated account.
          type: string
        smsRecipients:
          description: The recipient's phone number in E.164 format. In this version,
            a minimum of 1 and upto 100 recipients in the list are supported.
          maxLength: 100
          minLength: 1
          type: array
          items:
            description: Recipient details for sending SMS messages.
            required:
            - to
            type: object
            properties:
              to:
                description: The recipient's phone number in E.164 format.
                type: string
              repeatabilityRequestId:
                description: If specified, the client directs that the request is
                  repeatable; that is, the client can make the request multiple times
                  with the same Repeatability-Request-ID and get back an appropriate
                  response without the server executing the request multiple times.
                  The value of the Repeatability-Request-ID is an opaque string representing
                  a client-generated, 36-character hexadecimal case-insensitive encoding
                  of a UUID (GUID), identifier for the request.
                type: string
              repeatabilityFirstSent:
                description: MUST be sent by clients to specify that a request is
                  repeatable. Repeatability-First-Sent is used to specify the date
                  and time at which the request was first created.eg- Tue, 26 Mar
                  2019 16:06:51 GMT
                type: string
        message:
          description: The contents of the message that will be sent to the recipient.
            The allowable content is defined by RFC 5724.
          maxLength: 2048
          minLength: 0
          type: string
        smsSendOptions:
          description: Optional configuration for sending SMS messages.
          required:
          - enableDeliveryReport
          type: object
          properties:
            enableDeliveryReport:
              description: Enable this flag to receive a delivery report for this
                message on the Azure Resource EventGrid.
              type: boolean
            tag:
              description: Use this field to provide metadata that will then be sent
                back in the corresponding Delivery Report.
              type: string
    SmsSendResponse:
      description: Response for a successful or multi status send Sms request.
      required:
      - value
      type: object
      properties:
        value:
          type: array
          items:
            description: Response for a single recipient.
            required:
            - httpStatusCode
            - to
            - successful
            type: object
            properties:
              to:
                description: The recipient's phone number in E.164 format.
                type: string
              messageId:
                description: The identifier of the outgoing Sms message. Only present
                  if message processed.
                type: string
              httpStatusCode:
                description: HTTP Status code.
                type: integer
              repeatabilityResult:
                description: The result of a repeatable request with one of the case-insensitive
                  values accepted or rejected.
                type: string
                enum:
                - accepted
                - rejected
              successful:
                description: Indicates if the message is processed successfully or
                  not.
                type: boolean
              errorMessage:
                description: Optional error message in case of 4xx/5xx/repeatable
                  errors.
                type: string
    SmsSendResponseItem:
      description: Response for a single recipient.
      required:
      - httpStatusCode
      - to
      - successful
      type: object
      properties:
        to:
          description: The recipient's phone number in E.164 format.
          type: string
        messageId:
          description: The identifier of the outgoing Sms message. Only present if
            message processed.
          type: string
        httpStatusCode:
          description: HTTP Status code.
          type: integer
        repeatabilityResult:
          description: The result of a repeatable request with one of the case-insensitive
            values accepted or rejected.
          type: string
          enum:
          - accepted
          - rejected
        successful:
          description: Indicates if the message is processed successfully or not.
          type: boolean
        errorMessage:
          description: Optional error message in case of 4xx/5xx/repeatable errors.
          type: string
