        - name: webhook
          value: webhook
          description: Discriminator value for WebhookRouterRule.
    RouterWorker:
      type: object
      description: An entity for jobs to be routed to.
      properties:
        etag:
          $ref: '#/components/schemas/Azure.Core.eTag'
        id:
          type: string
          description: Id of a worker.
          readOnly: true
        state:
          $ref: '#/components/schemas/RouterWorkerState'
        queues:
          type: array
          description: Collection of queue(s) that this worker can receive work from.
          items:
            type: string
        capacity:
          type: integer
          format: int32
          description: The total capacity score this worker has to manage multiple
            concurrent jobs.
        labels:
          type: object
          description: A set of key/value pairs that are identifying attributes used
            by the rules engines to make decisions. Values must be primitive values
            - number, string, boolean.
          additionalProperties: {}
        tags:
          type: object
          description: A set of non-identifying attributes attached to this worker.
            Values must be primitive values - number, string, boolean.
          additionalProperties: {}
        channels:
          type: array
          description: Collection of channel(s) this worker can handle and their impact
            on the workers capacity.
          items:
            $ref: '#/components/schemas/RouterChannel'
        offers:
          type: array
          description: A list of active offers issued to this worker.
          items:
            $ref: '#/components/schemas/RouterJobOffer'
          readOnly: true
        assignedJobs:
          type: array
          description: A list of assigned jobs attached to this worker.
          items:
            $ref: '#/components/schemas/RouterWorkerAssignment'
          readOnly: true
        loadRatio:
          type: number
          format: double
          description: A value indicating the workers capacity. A value of '1' means
            all capacity is consumed. A value of '0' means no capacity is currently
            consumed.
          readOnly: true
        availableForOffers:
          type: boolean
          description: A flag indicating this worker is open to receive offers or
            not.
      required:
      - etag
      - id
    RouterWorkerAssignment:
