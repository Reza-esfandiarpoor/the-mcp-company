    RouterWorkerSelector:
      type: object
      description: Describes a condition that must be met against a set of labels
        for worker selection.
      properties:
        key:
          type: string
          description: The label key to query against.
        labelOperator:
          $ref: '#/components/schemas/LabelOperator'
        value:
          description: The value to compare against the actual label value with the
            given operator. Values must be primitive values - number, string, boolean.
        expiresAfterSeconds:
          type: number
          format: double
          description: Describes how long this label selector is valid in seconds.
        expedite:
          type: boolean
          description: Pushes a job to the front of the queue as long as this selector
            is active.
        status:
          $ref: '#/components/schemas/RouterWorkerSelectorStatus'
        expiresAt:
          type: string
          format: date-time
          description: The time at which this worker selector expires in UTC.
          readOnly: true
      required:
      - key
      - labelOperator
    RouterWorkerSelectorStatus:
      type: string
      description: Describes the status of a worker selector.
      enum:
      - active
      - expired
      x-ms-enum:
        name: RouterWorkerSelectorStatus
        modelAsString: true
        values:
        - name: active
          value: active
          description: Worker selector is valid.
        - name: expired
          value: expired
          description: Worker selector is not valid.
    RouterWorkerState:
      type: string
      description: Enums for worker states.
      enum:
      - active
      - draining
      - inactive
      x-ms-enum:
        name: RouterWorkerState
        modelAsString: true
        values:
        - name: active
          value: active
          description: Worker is active and available to take offers.
        - name: draining
          value: draining
          description: Worker is not active, if there are existing offers they are
            being revoked. No new offers are sent.
        - name: inactive
          value: inactive
          description: Worker is not active. No new offers are sent.
