    ScoringRuleOptions:
      type: object
      description: Encapsulates all options that can be passed as parameters for scoring
        rule with BestWorkerMode.
      properties:
        batchSize:
          type: integer
          format: int32
          description: Set batch size when 'isBatchScoringEnabled' is set to true.
            Defaults to 20 if not configured.
          default: 20
        scoringParameters:
          type: array
          description: 'List of extra parameters from a job that will be sent as part
            of the payload to scoring rule. If not set, a job''s labels (sent in the
            payload as `job`) and a job''s worker selectors (sent in the payload as
            `selectors`) are added to the payload of the scoring rule by default.
            Note: Worker labels are always sent with scoring payload.'
          default:
          - jobLabels
          - workerSelectors
          items:
            $ref: '#/components/schemas/ScoringRuleParameterSelector'
        isBatchScoringEnabled:
          type: boolean
          description: 'If set to true, will score workers in batches, and the parameter
            name of the worker labels will be sent as `workers`. By default, set to
            false and the parameter name for the worker labels will be sent as `worker`.
            Note: If enabled, use ''batchSize'' to set batch size.'
          default: false
        descendingOrder:
          type: boolean
          description: If false, will sort scores by ascending order. By default,
            set to true.
          default: true
    ScoringRuleParameterSelector:
      type: string
      description: Supported parameters for scoring workers used with BestWorkerMode.
      enum:
      - jobLabels
      - workerSelectors
      x-ms-enum:
        name: ScoringRuleParameterSelector
        modelAsString: true
        values:
        - name: jobLabels
          value: jobLabels
          description: Parameter to add job labels to scoring payload.  Property is
            sent as `job`.
        - name: workerSelectors
          value: workerSelectors
          description: Parameter to add worker selectors from a job to scoring payload.  Property
            is sent as `selectors`.
