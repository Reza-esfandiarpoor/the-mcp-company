        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/recordings:
    post:
      tags:
      - Recording
      summary: Start recording of the call.
      operationId: ServerCalls_StartRecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCallRecordingRequest'
        description: The request body of start call recording request.
        required: true
      responses:
        '200':
          description: Returns the start call recording response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCallRecordingResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}:
    get:
      tags:
      - Recording
      summary: Get call recording properties.
      operationId: ServerCalls_GetRecordingProperties
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the recording state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallRecordingProperties'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Recording
      summary: Stop recording the call.
      operationId: ServerCalls_StopRecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the stop call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}/:pause:
    post:
      tags:
      - Recording
      summary: Pause recording the call.
      operationId: ServerCalls_PauseRecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the pause call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/recordings/{recordingId}/:resume:
    post:
      tags:
      - Recording
      summary: Resume recording the call.
      operationId: ServerCalls_ResumeRecording
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - name: recordingId
        in: path
        description: The recording id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Returns the resume call recording response.
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/:join:
    post:
      tags:
      - ServerCall
      summary: Join a call.
      description: Join a call.
      operationId: ServerCalls_JoinCall
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinCallRequest'
        description: The join call request.
        required: true
      responses:
        '202':
          description: Returns the join call response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinCallResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /calling/serverCalls/{serverCallId}/:playAudio:
    post:
      tags:
      - ServerCall
      summary: Play audio in the call.
      description: Play audio in the call.
      operationId: ServerCalls_PlayAudio
      parameters:
      - name: serverCallId
        in: path
        description: The server call id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/PlayAudioRequest'
      responses:
        '202':
          description: Returns the play audio response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayAudioResult'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: The endpoint of the Azure Communication resource.
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Version of API to invoke.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    Endpoint:
      name: endpoint
      in: path
      description: The endpoint of the Azure Communication resource.
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      schema:
        type: string
  responses:
    '400':
      description: BadRequest
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '401':
      description: Unauthorized
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '403':
      description: Forbidden
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '404':
      description: NotFound
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
    '500':
      description: InternalServerError
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommunicationErrorResponse'
  requestBodies:
    PlayAudioRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlayAudioRequest'
      description: Play audio request.
      required: true
  schemas:
    MediaType:
      enum:
      - audio
      - video
      type: string
      x-ms-enum:
        name: MediaType
        modelAsString: true
    EventSubscriptionType:
      enum:
      - participantsUpdated
      - dtmfReceived
      type: string
      x-ms-enum:
        name: EventSubscriptionType
        modelAsString: true
    CreateCallRequest:
      description: The request payload for create call.
      required:
      - targets
      - source
      - callbackUri
      type: object
      properties:
        alternateCallerId:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
        targets:
          description: The targets of the call.
          type: array
          items:
            $ref: '#/components/schemas/CommunicationIdentifierModel'
        source:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        subject:
          description: The subject.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
        requestedMediaTypes:
          description: The requested modalities.
          type: array
          items:
            $ref: '#/components/schemas/MediaType'
        requestedCallEvents:
          description: The requested call events to subscribe to.
          type: array
          items:
            $ref: '#/components/schemas/EventSubscriptionType'
    PhoneNumberIdentifier:
      $ref: '#/components/schemas/PhoneNumberIdentifierModel'
    CommunicationIdentifier:
      $ref: '#/components/schemas/CommunicationIdentifierModel'
    CommunicationUserIdentifier:
      $ref: '#/components/schemas/CommunicationUserIdentifierModel'
    CommunicationCloudEnvironment:
      $ref: '#/components/schemas/CommunicationCloudEnvironmentModel'
    MicrosoftTeamsUserIdentifier:
      $ref: '#/components/schemas/MicrosoftTeamsUserIdentifierModel'
    CreateCallResult:
      description: The response payload of the create call operation.
      type: object
      properties:
        callConnectionId:
          description: The call connection id.
          type: string
    PlayAudioRequest:
      description: The request payload for playing audio.
      type: object
      properties:
        audioFileUri:
          description: "The media resource uri of the play audio request. \r\nCurrently
            only Wave file (.wav) format audio prompts are supported.\r\nMore specifically,
            the audio content in the wave file must be mono (single-channel),\r\n16-bit
            samples with a 16,000 (16KHz) sampling rate."
          type: string
        loop:
          description: The flag indicating whether audio file needs to be played in
            loop or not.
          type: boolean
        operationContext:
          description: The value to identify context of the operation.
          type: string
        audioFileId:
          description: An id for the media in the AudioFileUri, using which we cache
            the media resource.
          type: string
        callbackUri:
          description: The callback Uri to receive PlayAudio status notifications.
          type: string
    OperationStatus:
      description: The status of the operation
      enum:
      - notStarted
      - running
      - completed
      - failed
      type: string
      x-ms-enum:
        name: OperationStatus
        modelAsString: true
    PlayAudioResult:
      description: The response payload for play audio operation.
      required:
      - status
      type: object
      properties:
        operationId:
          description: The operation id.
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        operationContext:
          description: The operation context provided by client.
          type: string
        resultInfo:
          $ref: '#/components/schemas/ResultInfo'
    ResultInfo:
      description: Result info class to be used to report result status for actions/operations.
      required:
      - code
      - subcode
      type: object
      properties:
        code:
          format: int32
          description: The result code associated with the operation.
          type: integer
        subcode:
          format: int32
          description: The subcode that further classifies the result.
          type: integer
        message:
          description: The message is a detail explanation of subcode.
          type: string
    CancelAllMediaOperationsRequest:
      description: The request payload for cancel all media operations
      type: object
      properties:
        operationContext:
          description: The context for this operation.
          type: string
    CancelAllMediaOperationsResult:
      description: The response payload of the cancel all media operations.
      required:
      - status
      type: object
      properties:
        operationId:
          description: The operation id.
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        operationContext:
          description: The operation context provided by client.
          type: string
        resultInfo:
          $ref: '#/components/schemas/ResultInfo'
    AddParticipantRequest:
      description: The add participant request.
      type: object
      properties:
        alternateCallerId:
          $ref: '#/components/schemas/PhoneNumberIdentifierModel'
        participant:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        operationContext:
          description: The operation context.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
    AddParticipantResult:
      description: The add participant result
      type: object
      properties:
        participantId:
          description: The id of the added participant.
          type: string
    RecordingContentType:
      description: The content type of a call recording.
      enum:
      - audio
      - audioVideo
      type: string
      x-ms-enum:
        name: RecordingContentType
        modelAsString: true
    RecordingChannelType:
      description: The channel type of a call recording.
      enum:
      - mixed
      - unmixed
      type: string
      x-ms-enum:
        name: RecordingChannelType
        modelAsString: true
    RecordingFormatType:
      description: The media container format type of a call recording.
      enum:
      - wav
      - mp3
      - mp4
      type: string
      x-ms-enum:
        name: RecordingFormatType
        modelAsString: true
    StartCallRecordingRequest:
      description: The request payload start call recording operation.
      type: object
      properties:
        recordingStateCallbackUri:
          description: The uri to send notifications to.
          type: string
        recordingContentType:
          $ref: '#/components/schemas/RecordingContentType'
        recordingChannelType:
          $ref: '#/components/schemas/RecordingChannelType'
        recordingFormatType:
          $ref: '#/components/schemas/RecordingFormatType'
    StartCallRecordingResult:
      description: The response payload of start call recording operation.
      type: object
      properties:
        recordingId:
          description: The recording id of the started recording
          type: string
    CallRecordingState:
      description: The state of the recording
      enum:
      - active
      - inactive
      type: string
      x-ms-enum:
        name: CallRecordingState
        modelAsString: true
    CallRecordingProperties:
      description: The response payload of get call recording properties operation.
      required:
      - recordingState
      type: object
      properties:
        recordingState:
          $ref: '#/components/schemas/CallRecordingState'
    JoinCallRequest:
      description: The request payload for join call.
      required:
      - source
      - callbackUri
      type: object
      properties:
        source:
          $ref: '#/components/schemas/CommunicationIdentifierModel'
        subject:
          description: The subject.
          type: string
        callbackUri:
          description: The callback URI.
          type: string
        requestedMediaTypes:
          description: The requested modalities.
          type: array
          items:
            $ref: '#/components/schemas/MediaType'
        requestedCallEvents:
          description: The requested call events to subscribe to.
          type: array
          items:
            $ref: '#/components/schemas/EventSubscriptionType'
    JoinCallResult:
      description: The response payload of the join call operation.
      type: object
      properties:
        callConnectionId:
          description: The call connection id.
          type: string
    CallConnectionState:
      description: The call connection state.
      enum:
      - incoming
      - connecting
      - connected
      - disconnecting
      - disconnected
      type: string
      x-ms-enum:
        name: CallConnectionState
        modelAsString: true
    CallConnectionStateChangedEvent:
      description: The call connection state changed event.
      required:
      - callConnectionState
      type: object
      properties:
        serverCallId:
          description: The server call.id.
          type: string
        callConnectionId:
          description: The call connection id.
          type: string
        callConnectionState:
          $ref: '#/components/schemas/CallConnectionState'
    CallRecordingStateChangeEvent:
      description: The call recording state change event.
      required:
      - state
      - startDateTime
      type: object
      properties:
        recordingId:
          description: The call recording id
          type: string
        state:
          $ref: '#/components/schemas/CallRecordingState'
        startDateTime:
          format: date-time
          description: The time of the recording started
          type: string
        serverCallId:
          description: The server call.id.
          type: string
    AddParticipantResultEvent:
      required:
      - status
      type: object
      properties:
        resultInfo:
          $ref: '#/components/schemas/ResultInfo'
        operationContext:
          description: The operation context.
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
    ParticipantsUpdatedEvent:
      description: The participant update event
      type: object
      properties:
        callConnectionId:
          description: The call connection id.
          type: string
        participants:
          description: The list of participants.
          type: array
          items:
