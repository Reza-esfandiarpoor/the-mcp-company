                    total size of an email request (which includes attachments) to
                    10MB.
                  type: array
                  items:
                    description: Attachment to the email.
                    type: object
                    required:
                    - name
                    - contentType
                    - contentInBase64
                    properties:
                      name:
                        description: Name of the attachment
                        type: string
                      contentType:
                        description: MIME type of the content being attached.
                        type: string
                      contentInBase64:
                        description: Base64 encoded contents of the attachment
                        type: string
                        format: byte
                replyTo:
                  description: Email addresses where recipients' replies will be sent
                    to.
                  type: array
                  items:
                    description: An object representing the email address and its
                      display name
