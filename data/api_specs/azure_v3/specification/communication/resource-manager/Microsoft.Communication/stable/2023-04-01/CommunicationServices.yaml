  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Communication/communicationServices/{communicationServiceName}/linkNotificationHub
  : post:
      description: Links an Azure Notification Hub to this communication service.
      operationId: CommunicationServices_LinkNotificationHub
      summary: Link Notification Hub
      tags:
      - CommunicationServices
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: communicationServiceName
        in: path
        description: The name of the CommunicationService resource.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[-\w]+$
      requestBody:
        content:
          application/json:
            schema:
              description: Description of an Azure Notification Hub to link to the
                communication service
              required:
              - resourceId
              - connectionString
              type: object
              properties:
                resourceId:
                  description: The resource ID of the notification hub
                  type: string
                connectionString:
                  description: Connection string for the notification hub
                  type: string
        description: Parameters supplied to the operation.
      responses:
        '200':
          description: Success. The notification hub has been linked.
          content:
            application/json:
              schema:
                description: A notification hub that has been linked to the communication
                  service
                type: object
                properties:
                  resourceId:
                    description: The resource ID of the notification hub
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
