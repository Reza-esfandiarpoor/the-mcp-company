  /subscriptions/{subscriptionId}/providers/Microsoft.Communication/checkNameAvailability:
    post:
      description: Checks that the CommunicationService name is valid and is not already
        in use.
      operationId: CommunicationServices_CheckNameAvailability
      summary: Check Name Availability
      tags:
      - CommunicationServices
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the resource for which availability needs
                    to be checked.
                type:
                  type: string
                  description: The resource type.
              description: The check availability request body.
              required:
              - type
              - name
        description: Parameters supplied to the operation.
        required: true
      responses:
        '200':
          description: Success. The response describes the name availability.
          content:
            application/json:
              schema:
                type: object
                description: The check availability result.
                properties:
                  nameAvailable:
                    type: boolean
                    description: Indicates if the resource name is available.
                  reason:
                    type: string
                    description: The reason why the given name is not available.
                    enum:
                    - Invalid
                    - AlreadyExists
                    x-ms-enum:
                      name: CheckNameAvailabilityReason
                      modelAsString: true
                  message:
                    type: string
                    description: Detailed reason why the given name is available.
        default:
          description: Error response describing why the operation failed.
