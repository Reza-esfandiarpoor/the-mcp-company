- url: https://management.azure.com
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription.
      required: true
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
    LocationParameter:
      name: location
      in: path
      description: The name of Azure region.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
  requestBodies:
    VaultExtendedInfoResource:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VaultExtendedInfoResource'
      description: Details of ResourceExtendedInfo
      required: true
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    AlertsState:
      type: string
      enum:
      - Enabled
      - Disabled
      x-ms-enum:
        name: AlertsState
        modelAsString: true
        values:
        - name: Enabled
          value: Enabled
        - name: Disabled
          value: Disabled
    AssociatedIdentity:
      type: object
      description: Identity details to be used for an operation
      properties:
        operationIdentityType:
          $ref: '#/components/schemas/IdentityType'
        userAssignedIdentity:
          type: string
          description: User assigned identity to be used for an operation if operationIdentityType
            is UserAssigned.
    AuthType:
      type: string
      description: Specifies the authentication type.
      enum:
      - Invalid
      - ACS
      - AAD
      - AccessControlService
      - AzureActiveDirectory
      x-ms-enum:
        name: AuthType
        modelAsString: true
        values:
        - name: Invalid
          value: Invalid
        - name: ACS
          value: ACS
        - name: AAD
          value: AAD
        - name: AccessControlService
          value: AccessControlService
        - name: AzureActiveDirectory
          value: AzureActiveDirectory
    AzureMonitorAlertSettings:
      type: object
      description: Settings for Azure Monitor based alerts
      properties:
        alertsForAllJobFailures:
          $ref: '#/components/schemas/AlertsState'
        alertsForAllReplicationIssues:
          $ref: '#/components/schemas/AlertsState'
        alertsForAllFailoverIssues:
          $ref: '#/components/schemas/AlertsState'
    BCDRSecurityLevel:
      type: string
      description: Security levels of Recovery Services Vault for business continuity
        and disaster recovery
      enum:
      - Poor
      - Fair
      - Good
      - Excellent
      x-ms-enum:
        name: BCDRSecurityLevel
        modelAsString: true
        values:
        - name: Poor
          value: Poor
        - name: Fair
          value: Fair
        - name: Good
          value: Good
        - name: Excellent
          value: Excellent
    BackupStorageVersion:
      type: string
      description: Backup storage version
      enum:
      - V1
      - V2
      - Unassigned
      x-ms-enum:
        name: BackupStorageVersion
        modelAsString: true
        values:
        - name: V1
          value: V1
        - name: V2
          value: V2
        - name: Unassigned
          value: Unassigned
    CapabilitiesProperties:
      type: object
      description: Capabilities information
      properties:
        dnsZones:
          type: array
          items:
            $ref: '#/components/schemas/DNSZone'
          x-ms-identifiers: []
    CapabilitiesResponse:
      $ref: '#/components/schemas/ResourceCapabilitiesBase'
      type: object
      properties:
