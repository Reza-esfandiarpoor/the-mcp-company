      description: Capabilities properties in response
      properties:
        dnsZones:
          type: array
          items:
            $ref: '#/components/schemas/DNSZoneResponse'
          x-ms-identifiers: []
    CertificateRequest:
      type: object
      description: Details of the certificate to be uploaded to the vault.
      properties:
        properties:
          $ref: '#/components/schemas/RawCertificateData'
