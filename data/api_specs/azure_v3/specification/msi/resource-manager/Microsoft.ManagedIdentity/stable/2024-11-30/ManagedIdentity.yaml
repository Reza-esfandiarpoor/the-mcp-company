      name: $top
      in: query
      required: false
      description: Number of records to return.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        minimum: 1
    SkipTokenParameter:
      in: query
      name: $skiptoken
      description: A skip token is used to continue retrieving items after an operation
        returns a partial result. If a previous response contains a nextLink element,
        the value of the nextLink element will include a skipToken parameter that
        specifies a starting point to use for subsequent calls.
      x-ms-parameter-location: method
      schema:
        type: string
    FederatedIdentityCredentialResourceNameParameter:
      name: federatedIdentityCredentialResourceName
      in: path
      description: The name of the federated identity credential resource.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]{1}[a-zA-Z0-9-_]{2,119}$
    parameters-SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription. The value must be an UUID.
      required: true
      schema:
        type: string
        format: uuid
    parameters-ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
