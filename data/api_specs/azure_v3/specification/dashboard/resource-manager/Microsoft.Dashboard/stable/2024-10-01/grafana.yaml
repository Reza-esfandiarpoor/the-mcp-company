  /subscriptions/{subscriptionId}/providers/Microsoft.Dashboard/grafana:
    get:
      tags:
      - GrafanaResource
      summary: List all resources of workspaces for Grafana under the specified subscription.
      operationId: Grafana_List
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK. Return all resources of workspaces for Grafana under the
            specified subscription.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      description: The grafana resource type.
                      x-ms-azure-resource: true
                      properties:
                        id:
                          description: ARM id of the grafana resource
                          type: string
                          readOnly: true
                        name:
                          description: Name of the grafana resource.
                          type: string
                          readOnly: true
                        type:
                          description: The type of the grafana resource.
                          type: string
                          readOnly: true
                        sku:
                          description: The Sku of the grafana resource.
                          required:
                          - name
