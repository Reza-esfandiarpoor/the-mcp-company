  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Dashboard/grafana:
    get:
      tags:
      - GrafanaResource
      summary: List all resources of workspaces for Grafana under the specified resource
        group.
      operationId: Grafana_ListByResourceGroup
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK. Return all resources of workspaces for Grafana under the
            given resource group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      description: The grafana resource type.
                      x-ms-azure-resource: true
                      properties:
                        id:
                          description: ARM id of the grafana resource
                          type: string
                          readOnly: true
                        name:
                          description: Name of the grafana resource.
                          type: string
                          readOnly: true
                        type:
                          description: The type of the grafana resource.
                          type: string
                          readOnly: true
                        sku:
                          description: The Sku of the grafana resource.
                          required:
                          - name
                          type: object
                          properties:
                            name:
                              type: string
                        properties:
                          description: Properties specific to the grafana resource.
                          type: object
                          properties:
                            provisioningState:
                              description: Provisioning state of the resource.
                              enum:
                              - Accepted
