  : patch:
      tags:
      - SubscriptionQuotaAllocation
      summary: Request to assign quota from group quota to a specific Subscription.
        This request will use Asynchronous pattern with 202 response and status polling
        API.
      description: Request to assign quota from group quota to a specific Subscription.
        The assign GroupQuota to subscriptions or reduce the quota allocated to subscription
        to give back the unused quota ( quota >= usages) to the groupQuota. So, this
        API can be used to assign Quota to subscriptions and assign back unused quota
        to group quota, which can be assigned to another subscriptions in the GroupQuota.
        User can collect unused quotas from multiple subscriptions within the groupQuota
        and assign the groupQuota to the subscription, where it's needed.
      operationId: GroupQuotaSubscriptionAllocationRequest_Update
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - name: managementGroupId
        in: path
        required: true
        description: Management Group Id.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 3
          maxLength: 63
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: groupQuotaName
        in: path
        required: true
        description: The GroupQuota name. The name should be unique for the provided
          context tenantId/MgId.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z][a-z0-9]*$
