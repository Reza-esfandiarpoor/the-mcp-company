paths:
  /providers/Microsoft.StreamAnalytics/operations:
    get:
      tags:
      - Operations
      operationId: Operations_List
      description: Lists all of the available Stream Analytics related operations.
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Successfully listed the available operations.
          content:
            application/json:
              schema:
                type: object
                description: Result of the request to list Stream Analytics operations.
                  It contains a list of operations and a URL link to get the next
                  set of results.
                properties:
                  value:
                    description: List of Stream Analytics operations supported by
                      the Microsoft.StreamAnalytics resource provider.
                    type: array
                    readOnly: true
                    items:
                      description: A Stream Analytics REST API operation
                      type: object
                      properties:
                        name:
                          description: The name of the operation being performed on
                            this particular object.
                          type: string
                          readOnly: true
                        isDataAction:
                          description: Indicates whether the operation is a data action
                          type: boolean
                        display:
                          type: object
                          description: Contains the localized display information
                            for this particular operation / action.
                          readOnly: true
                          properties:
                            provider:
                              description: The localized friendly form of the resource
                                provider name.
                              type: string
                              readOnly: true
                            resource:
                              description: The localized friendly form of the resource
                                type related to this action/operation.
                              type: string
                              readOnly: true
                            operation:
                              description: The localized friendly name for the operation.
                              type: string
                              readOnly: true
                            description:
                              description: The localized friendly description for
                                the operation.
                              type: string
                              readOnly: true
                    x-ms-identifiers:
                    - name
                  nextLink:
                    description: URL to get the next set of operation list results
                      if there are any.
                    type: string
                    readOnly: true
        default:
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
