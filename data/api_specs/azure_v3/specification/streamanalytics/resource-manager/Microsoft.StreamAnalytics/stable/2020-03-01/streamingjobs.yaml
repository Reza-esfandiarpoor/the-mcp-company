          the current record set. Specify the last-seen ETag value to prevent accidentally
          overwriting concurrent changes.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        x-ms-client-name: IfNoneMatch
        description: Set to '*' to allow a new streaming job to be created, but to
          prevent updating an existing record set. Other values will result in a 412
          Pre-condition Failed response.
        schema:
          type: string
