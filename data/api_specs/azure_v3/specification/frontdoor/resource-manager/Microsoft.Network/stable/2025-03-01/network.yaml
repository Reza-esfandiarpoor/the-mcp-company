openapi: 3.0.0
info:
  title: NetworkManagementClient
  description: The Microsoft Azure Network management API provides a RESTful set of
    web services that interact with Microsoft Azure Networks service to manage your
    network resources. The API has entities that capture the relationship between
    an end user and the Microsoft Azure Networks service.
  version: 2025-03-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths: {}
components:
  parameters:
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The subscription credentials which uniquely identify the Microsoft
        Azure subscription. The subscription ID forms part of the URI for every service
        call.
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: Client API version.
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ErrorDetails:
      properties:
        code:
          type: string
        target:
          type: string
        message:
          type: string
    Error:
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type: string
        details:
          type: array
          items:
            properties:
              code:
                type: string
              target:
                type: string
              message:
                type: string
        innerError:
          type: string
    AzureAsyncOperationResult:
      properties:
        status:
          type: string
          description: Status of the Azure async operation.
          enum:
          - InProgress
          - Succeeded
          - Failed
          x-ms-enum:
            name: NetworkOperationStatus
            modelAsString: true
        error:
          properties:
            code:
              type: string
            message:
              type: string
            target:
              type: string
            details:
              type: array
              items:
                properties:
                  code:
                    type: string
                  target:
                    type: string
                  message:
                    type: string
            innerError:
              type: string
      description: The response body contains the status of the specified asynchronous
        operation, indicating whether it has succeeded, is in progress, or has failed.
        Note that this status is distinct from the HTTP status code returned for the
        Get Operation Status operation itself. If the asynchronous operation succeeded,
        the response body includes the HTTP status code for the successful request.
        If the asynchronous operation failed, the response body includes the HTTP
        status code for the failed request and error information regarding the failure.
    Resource:
      properties:
        id:
          readOnly: true
          type: string
          description: Resource ID.
        name:
          readOnly: true
          type: string
          description: Resource name.
        type:
          readOnly: true
          type: string
          description: Resource type.
        location:
          type: string
          description: Resource location.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
      description: Common resource representation.
      x-ms-azure-resource: true
    SubResource:
      properties:
        id:
          type: string
          description: Resource ID.
      description: Reference to another subresource.
      x-ms-azure-resource: true
    TagsObject:
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Resource tags.
      description: Tags object for patch operations.
