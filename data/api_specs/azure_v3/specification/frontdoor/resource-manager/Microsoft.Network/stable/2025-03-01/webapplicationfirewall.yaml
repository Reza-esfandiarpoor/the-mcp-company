                                                    x-ms-enum:
                                                      name: ManagedRuleExclusionMatchVariable
                                                      modelAsString: true
                                                  selectorMatchOperator:
                                                    type: string
                                                    enum:
                                                    - Equals
                                                    - Contains
                                                    - StartsWith
                                                    - EndsWith
                                                    - EqualsAny
                                                    description: Comparison operator
                                                      to apply to the selector when
                                                      specifying which elements in
                                                      the collection this exclusion
                                                      applies to.
                                                    x-ms-enum:
                                                      name: ManagedRuleExclusionSelectorMatchOperator
                                                      modelAsString: true
                                                  selector:
                                                    type: string
                                                    description: Selector value for
                                                      which elements in the collection
                                                      this exclusion applies to.
                                              description: Describes the exclusions
                                                that are applied to all rules in the
                                                group.
                                            rules:
                                              description: List of rules that will
                                                be disabled. If none specified, all
                                                rules in the group will be disabled.
                                              type: array
                                              items:
                                                description: Defines a managed rule
                                                  group override setting.
                                                required:
                                                - ruleId
