                                                    enum:
                                                    - RequestHeaderNames
                                                    - RequestCookieNames
                                                    - QueryStringArgNames
                                                    - RequestBodyPostArgNames
                                                    - RequestBodyJsonArgNames
                                                    description: The variable type
