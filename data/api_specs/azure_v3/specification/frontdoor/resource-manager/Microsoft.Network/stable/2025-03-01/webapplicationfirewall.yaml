                                    represents redirect URL for the client.
                                  type: string
                                customBlockResponseStatusCode:
                                  description: If the action type is block, customer
                                    can override the response status code.
                                  type: integer
                                customBlockResponseBody:
                                  description: If the action type is block, customer
                                    can override the response body. The body must
                                    be specified in base64 encoding.
                                  type: string
                                  pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$
                                requestBodyCheck:
                                  description: Describes if policy managed rules will
                                    inspect the request body content.
                                  type: string
                                  enum:
                                  - Disabled
                                  - Enabled
                                  x-ms-enum:
                                    name: PolicyRequestBodyCheck
                                    modelAsString: true
