                                              from the logs.
                                            x-ms-enum:
                                              name: scrubbingRuleEntryMatchVariable
                                              modelAsString: true
                                          selectorMatchOperator:
                                            type: string
                                            enum:
                                            - EqualsAny
                                            - Equals
