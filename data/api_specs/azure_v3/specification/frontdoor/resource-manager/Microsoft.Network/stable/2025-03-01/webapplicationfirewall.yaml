                                      type: array
                                      items:
                                        description: Defines the contents of the log
                                          scrubbing rules.
                                        type: object
                                        required:
                                        - matchVariable
                                        - selectorMatchOperator
                                        properties:
                                          matchVariable:
                                            type: string
                                            enum:
                                            - RequestIPAddress
                                            - RequestUri
                                            - QueryStringArgNames
                                            - RequestHeaderNames
                                            - RequestCookieNames
                                            - RequestBodyPostArgNames
                                            - RequestBodyJsonArgNames
