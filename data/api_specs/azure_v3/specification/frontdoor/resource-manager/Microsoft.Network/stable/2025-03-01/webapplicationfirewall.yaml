                                  description: Defines the JavaScript challenge cookie
                                    validity lifetime in minutes. This setting is
                                    only applicable to Premium_AzureFrontDoor. Value
                                    must be an integer between 5 and 1440 with the
                                    default value being 30.
                                  type: integer
                                  format: int32
                                  minimum: 5
                                  maximum: 1440
                                captchaExpirationInMinutes:
                                  description: Defines the Captcha cookie validity
                                    lifetime in minutes. This setting is only applicable
                                    to Premium_AzureFrontDoor. Value must be an integer
                                    between 5 and 1440 with the default value being
                                    30.
                                  type: integer
                                  format: int32
                                  minimum: 5
                                  maximum: 1440
