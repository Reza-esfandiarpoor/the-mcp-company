                                              operate on the selector to specify which
                                              elements in the collection this rule
                                              applies to.
                                            x-ms-enum:
                                              name: ' scrubbingRuleEntryMatchOperator'
                                              modelAsString: true
                                          selector:
                                            type: string
                                            description: When matchVariable is a collection,
                                              operator used to specify which elements
                                              in the collection this rule applies
                                              to.
                                          state:
                                            type: string
                                            enum:
                                            - Enabled
                                            - Disabled
                                            description: Defines the state of a log
                                              scrubbing rule. Default value is enabled.
                                            x-ms-enum:
                                              name: ' scrubbingRuleEntryState'
                                              modelAsString: true
                                      x-ms-identifiers: []
                                      description: List of log scrubbing rules applied
                                        to the Web Application Firewall logs.
