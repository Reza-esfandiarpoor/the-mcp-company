                                                          enum:
                                                          - RequestHeaderNames
                                                          - RequestCookieNames
                                                          - QueryStringArgNames
                                                          - RequestBodyPostArgNames
                                                          - RequestBodyJsonArgNames
                                                          description: The variable
                                                            type to be excluded.
                                                          x-ms-enum:
                                                            name: ManagedRuleExclusionMatchVariable
                                                            modelAsString: true
                                                        selectorMatchOperator:
                                                          type: string
                                                          enum:
                                                          - Equals
                                                          - Contains
                                                          - StartsWith
                                                          - EndsWith
                                                          - EqualsAny
                                                          description: Comparison
                                                            operator to apply to the
                                                            selector when specifying
                                                            which elements in the
                                                            collection this exclusion
                                                            applies to.
                                                          x-ms-enum:
                                                            name: ManagedRuleExclusionSelectorMatchOperator
                                                            modelAsString: true
                                                        selector:
                                                          type: string
                                                          description: Selector value
                                                            for which elements in
                                                            the collection this exclusion
