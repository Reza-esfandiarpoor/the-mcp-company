                  value:
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Resource ID.
                        name:
                          readOnly: true
                          type: string
                          description: Resource name.
                        type:
                          readOnly: true
                          type: string
                          description: Resource type.
                        location:
                          type: string
                          description: Resource location.
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: Resource tags.
                        properties:
                          x-ms-client-flatten: true
                          description: Properties of the web application firewall
                            policy.
                          properties:
                            policySettings:
                              description: Describes settings for the policy.
                              properties:
                                enabledState:
                                  description: Describes if the policy is in enabled
                                    or disabled state. Defaults to Enabled if not
                                    specified.
                                  type: string
                                  enum:
                                  - Disabled
                                  - Enabled
