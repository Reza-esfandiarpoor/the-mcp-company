                              description: Describes custom rules inside the policy.
                              properties:
                                rules:
                                  description: List of rules
                                  type: array
                                  items:
                                    description: Defines contents of a web application
                                      rule
                                    required:
                                    - priority
                                    - ruleType
                                    - matchConditions
                                    - action
                                    properties:
                                      name:
                                        type: string
                                        description: Describes the name of the rule.
                                        maxLength: 128
                                      priority:
                                        description: Describes priority of the rule.
                                          Rules with a lower value will be evaluated
                                          before rules with a higher value.
                                        type: integer
                                      enabledState:
                                        description: Describes if the custom rule
                                          is in enabled or disabled state. Defaults
                                          to Enabled if not specified.
                                        type: string
                                        enum:
                                        - Disabled
                                        - Enabled
                                        x-ms-enum:
                                          name: CustomRuleEnabledState
                                          modelAsString: true
                                      ruleType:
                                        description: Describes type of rule.
                                        type: string
                                        enum:
                                        - MatchRule
                                        - RateLimitRule
                                        x-ms-enum:
                                          name: RuleType
                                          modelAsString: true
                                      rateLimitDurationInMinutes:
                                        description: Time window for resetting the
                                          rate limit count. Default is 1 minute.
                                        type: integer
                                        minimum: 0
                                        maximum: 5
                                      rateLimitThreshold:
                                        description: Number of allowed requests per
                                          client within the time window.
                                        type: integer
                                        minimum: 0
                                      groupBy:
                                        description: Describes the list of variables
                                          to group the rate limit requests
                                        type: array
                                        items:
                                          description: Describes the variables available
                                            to group the rate limit requests
                                          required:
                                          - variableName
                                          type: object
                                          properties:
                                            variableName:
                                              description: Describes the supported
                                                variable for group by
                                              type: string
                                              enum:
                                              - SocketAddr
                                              - GeoLocation
                                              - None
                                              x-ms-enum:
                                                name: VariableName
                                                modelAsString: true
                                        x-ms-identifiers: []
                                      matchConditions:
                                        description: List of match conditions.
                                        type: array
                                        items:
                                          description: Define a match condition.
                                          required:
                                          - matchVariable
                                          - operator
                                          - matchValue
                                          properties:
                                            matchVariable:
                                              description: Request variable to compare
                                                with.
                                              type: string
                                              enum:
                                              - RemoteAddr
                                              - RequestMethod
                                              - QueryString
                                              - PostArgs
                                              - RequestUri
                                              - RequestHeader
                                              - RequestBody
                                              - Cookies
                                              - SocketAddr
                                              x-ms-enum:
                                                name: MatchVariable
                                                modelAsString: true
                                            selector:
                                              description: Match against a specific
                                                key from the QueryString, PostArgs,
                                                RequestHeader or Cookies variables.
                                                Default is null.
                                              type: string
                                            operator:
                                              description: Comparison type to use
                                                for matching with the variable value.
                                              type: string
                                              enum:
                                              - Any
                                              - IPMatch
                                              - GeoMatch
                                              - Equal
                                              - Contains
                                              - LessThan
                                              - GreaterThan
                                              - LessThanOrEqual
                                              - GreaterThanOrEqual
                                              - BeginsWith
                                              - EndsWith
                                              - RegEx
                                              x-ms-enum:
                                                name: Operator
                                                modelAsString: true
                                            negateCondition:
                                              description: Describes if the result
                                                of this condition should be negated.
                                              type: boolean
                                            matchValue:
                                              description: List of possible match
                                                values.
                                              type: array
                                              items:
                                                type: string
                                            transforms:
                                              description: List of transforms.
                                              type: array
                                              items:
                                                description: Describes what transforms
                                                  applied before matching.
                                                type: string
                                                enum:
                                                - Lowercase
                                                - Uppercase
                                                - Trim
                                                - UrlDecode
                                                - UrlEncode
                                                - RemoveNulls
                                                x-ms-enum:
                                                  name: TransformType
                                                  modelAsString: true
                                      action:
                                        description: Describes what action to be applied
                                          when rule matches.
                                        type: string
                                        enum:
                                        - Allow
                                        - Block
                                        - Log
                                        - Redirect
                                        - AnomalyScoring
                                        - JSChallenge
                                        - CAPTCHA
