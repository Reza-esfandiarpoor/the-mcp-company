          description: 'Whether dev/test is enabled. When the dev field is set to
            true, the resource is used for dev/test purpose. '
        size:
          type: string
          description: 'The SKU size. When the name field is the combination of tier
            and some other value, this would be the standalone code. '
        family:
          type: string
          description: If the service has different generations of hardware, for the
            same SKU, then that can be captured here.
        capacity:
          type: integer
          format: int32
          description: If the SKU supports scale out/in then the capacity integer
            should be included. If scale out/in is not possible for the resource this
            may be omitted.
