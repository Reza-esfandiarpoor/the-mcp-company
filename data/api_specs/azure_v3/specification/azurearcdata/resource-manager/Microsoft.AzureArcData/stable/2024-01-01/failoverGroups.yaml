                  or "Microsoft.Storage/storageAccounts"
                readOnly: true
              systemData:
                type: object
                description: Azure Resource Manager metadata containing createdBy
                  and modifiedBy information.
                readOnly: true
                properties:
                  createdBy:
                    type: string
                    description: The identity that created the resource.
                  createdByType:
                    type: string
                    description: The type of identity that created the resource.
                    enum:
                    - User
                    - Application
                    - ManagedIdentity
                    - Key
                    x-ms-enum:
                      name: createdByType
                      modelAsString: true
                  createdAt:
                    type: string
                    format: date-time
                    description: The timestamp of resource creation (UTC).
                  lastModifiedBy:
                    type: string
                    description: The identity that last modified the resource.
                  lastModifiedByType:
                    type: string
                    description: The type of identity that last modified the resource.
                    enum:
                    - User
                    - Application
                    - ManagedIdentity
                    - Key
                    x-ms-enum:
                      name: createdByType
                      modelAsString: true
                  lastModifiedAt:
                    type: string
                    format: date-time
                    description: The timestamp of resource last modification (UTC)
              properties:
                description: 'null'
                x-ms-client-flatten: false
                type: object
                properties:
                  provisioningState:
                    type: string
                    enum:
                    - Succeeded
                    - Failed
                    - Canceled
                    - Accepted
                    x-ms-enum:
                      name: provisioningState
                      modelAsString: true
                    description: The provisioning state of the failover group resource.
                    readOnly: true
                  partnerManagedInstanceId:
                    type: string
                    description: The resource ID of the partner SQL managed instance.
                  spec:
                    description: The specifications of the failover group resource.
                    x-ms-client-flatten: false
                    type: object
                    properties:
                      sharedName:
                        type: string
                        description: The shared name of the failover group for this
                          SQL managed instance. Both SQL managed instance and its
                          partner have to use the same shared name.
                      sourceMI:
                        type: string
                        description: The name of the SQL managed instance with this
                          failover group role.
                      partnerMI:
                        type: string
                        description: The name of the partner SQL managed instance.
                      partnerMirroringURL:
                        type: string
                        description: The mirroring endpoint URL of the partner SQL
                          managed instance.
                      partnerMirroringCert:
                        type: string
                        description: The mirroring endpoint public certificate for
                          the partner SQL managed instance. Only PEM format is supported.
                      partnerSyncMode:
                        type: string
                        enum:
                        - async
                        - sync
                        x-ms-enum:
                          name: failoverGroupPartnerSyncMode
                          modelAsString: true
                        default: async
                        description: The partner sync mode of the SQL managed instance.
                      role:
                        type: string
                        enum:
                        - primary
                        - secondary
                        - force-primary-allow-data-loss
                        - force-secondary
                        x-ms-enum:
                          name: instanceFailoverGroupRole
                          modelAsString: true
                        default: primary
                        description: The role of the SQL managed instance in this
                          failover group.
                    additionalProperties: {}
                    required:
                    - role
                  status:
                    type: object
                    description: The status of the failover group custom resource.
                additionalProperties: {}
                required:
                - partnerManagedInstanceId
                - spec
