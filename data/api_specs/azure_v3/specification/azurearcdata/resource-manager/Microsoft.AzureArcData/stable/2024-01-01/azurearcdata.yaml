            \n * 409 OperationInProgress - Operation in progress on resource already.\n\
            \n * 409 OperationCanceled - Operation Cancelled.\n\n * 500 RPGenericSystem\
            \ - System Failure when calling other Resource Provider.\n\n * 500 UnExpectedErrorOccurred\
