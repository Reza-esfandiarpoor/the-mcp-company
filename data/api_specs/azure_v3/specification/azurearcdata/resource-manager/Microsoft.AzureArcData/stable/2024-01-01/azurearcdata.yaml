openapi: 3.0.0
info:
  version: 2024-01-01
  title: AzureArcDataManagementClient
  description: The AzureArcData management API provides a RESTful set of web APIs
    to manage Azure Data Services on Azure Arc Resources.
servers:
- url: https://management.azure.com
paths:
  /providers/Microsoft.AzureArcData/operations:
    get:
      tags:
      - Operations
      description: Lists all of the available Azure Data Services on Azure Arc API
        operations.
      operationId: Operations_List
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for the request
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved operations.
          content:
            application/json:
              schema:
                description: Result of the request to list Azure Data Services on
                  Azure Arc operations.
                type: object
                properties:
                  value:
                    description: Array of results.
                    type: array
                    items:
                      description: Azure Data Services on Azure Arc operation definition.
                      type: object
                      properties:
                        name:
                          description: The name of the operation being performed on
                            this particular object.
                          type: string
                        display:
                          description: The localized display information for this
                            particular operation / action.
