                          description: The intended executor of the operation.
                          enum:
                          - user
                          - system
                          type: string
                          readOnly: true
                          x-ms-enum:
                            name: OperationOrigin
                            modelAsString: true
                        isDataAction:
                          description: Indicates whether the operation is a data action
                          type: boolean
                        properties:
                          description: Additional descriptions for the operation.
                          type: object
                          additionalProperties: {}
                          readOnly: true
                          x-ms-client-flatten: false
                      required:
                      - name
                      - display
                      - isDataAction
                    x-ms-identifiers:
                    - name
                    readOnly: true
                  nextLink:
                    description: Link to retrieve next page of results.
                    type: string
                    readOnly: true
        default:
          description: "*** Error Responses: ***\n\n * 400 InvalidParameterValue -\
            \ An invalid value was given to parameter.\n\n * 400 InvalidCrossSubscriptionVmMove\
            \ - Invalid cross subscription move of resource.\n\n * 400 RPGenericUser\
            \ - User Failure when calling other Resource Provider.\n\n * 400 InvalidArgument\
            \ - Invalid argument '{0}'.\n\n * 400 ArgumentNotInRange - Argument '{0}'\
            \ not in range.\n\n * 400 ResourceNotProvisioned - As the resource: {0}\
            \ is not in a provisioned state, the request cannot be proceeded forward\n\
            \n * 400 InvalidRgResourceId - Invalid Resourcegroup resource id specified.\n\
            \n * 403 AccessDenied - Access denied.\n\n * 404 ResourceNotFound - The\
