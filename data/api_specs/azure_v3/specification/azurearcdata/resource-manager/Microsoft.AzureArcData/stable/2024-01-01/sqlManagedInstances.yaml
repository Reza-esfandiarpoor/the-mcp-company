openapi: 3.0.0
info:
  version: 2024-01-01
  title: AzureArcDataManagementClient
  description: The AzureArcData management API provides a RESTful set of web APIs
    to manage Azure Data Services on Azure Arc Resources.
paths: {}
components:
  parameters:
    apiVersion:
      name: api-version
      in: query
      required: true
      description: The API version to use for the request
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    SqlManagedInstance:
      type: object
      properties:
        id:
          type: string
          description: Fully qualified resource ID for the resource. Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
          readOnly: true
        name:
          type: string
          description: The name of the resource
          readOnly: true
        type:
          type: string
          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
            or "Microsoft.Storage/storageAccounts"
