  /subscriptions/{subscriptionId}/providers/Microsoft.VideoIndexer/checkNameAvailability:
    post:
      tags:
      - NameAvailability
      operationId: Accounts_CheckNameAvailability
      description: Checks that the Video Indexer account name is valid and is not
        already in use.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The VideoIndexer account name.
                type:
                  type: string
                  enum:
                  - Microsoft.VideoIndexer/accounts
                  x-ms-enum:
                    name: Type
                    modelAsString: true
                  description: The type of resource, Microsoft.VideoIndexer/accounts
              required:
              - name
              - type
              description: The parameters used to check the availability of the Video
                Indexer account name.
        description: The name of the Video Indexer account. Name must be unique globally
        required: true
      responses:
        '200':
          description: OK - Operation to check the Video Indexer account name availability
            was successful. Ok does not indicate the name is available, the body of
            the response does.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nameAvailable:
                    readOnly: true
                    type: boolean
                    description: Gets a boolean value that indicates whether the name
                      is available for you to use. If true, the name is available.
                      If false, the name has already been taken.
                  reason:
                    readOnly: true
                    type: string
                    description: Gets the reason that a Video Indexer account name
                      could not be used. The Reason element is only returned if NameAvailable
                      is false.
                    enum:
                    - AlreadyExists
                    x-ms-enum:
                      name: Reason
                      modelAsString: true
                  message:
                    readOnly: true
                    type: string
                    description: Gets an error message explaining the Reason value
                      in more detail.
                description: The CheckNameAvailability operation response.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
