  /subscriptions/{subscriptionId}/providers/Microsoft.CodeSigning/checkNameAvailability:
    post:
      operationId: CodeSigningAccounts_CheckNameAvailability
      tags:
      - CodeSigningAccounts
      description: Checks that the trusted signing account name is valid and is not
        already in use.
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The parameters used to check the availability of the trusted
                signing account name.
              properties:
                name:
                  type: string
                  description: Trusted signing account name.
              required:
              - name
        description: The CheckAvailability request
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                description: The CheckNameAvailability operation response.
                properties:
                  nameAvailable:
                    type: boolean
                    description: A boolean value that indicates whether the name is
                      available for you to use. If true, the name is available. If
                      false, the name has already been taken or is invalid and cannot
                      be used.
                    readOnly: true
                  reason:
                    description: The reason that a trusted signing account name could
                      not be used. The Reason element is only returned if nameAvailable
                      is false.
                    readOnly: true
                    type: string
                    enum:
                    - AccountNameInvalid
                    - AlreadyExists
                    x-ms-enum:
                      name: NameUnavailabilityReason
                      modelAsString: true
                      values:
                      - name: AccountNameInvalid
                        value: AccountNameInvalid
                        description: Account name is invalid
                      - name: AlreadyExists
                        value: AlreadyExists
                        description: Account name already exists
                  message:
                    type: string
                    description: An error message explaining the Reason value in more
                      detail.
                    readOnly: true
