          required:
          - type
          - referenceName
        policy:
          description: Activity policy.
          type: object
          properties:
            timeout:
              type: object
              description: 'Specifies the timeout for the activity to run. The default
                timeout is 7 days. Type: string (or Expression with resultType string),
                pattern: ((\d+)\.)?(\d\d):(60|([0-5][0-9])):(60|([0-5][0-9])).'
            retry:
              type: object
              description: 'Maximum ordinary retry attempts. Default is 0. Type: integer
                (or Expression with resultType integer), minimum: 0.'
            retryIntervalInSeconds:
              type: integer
              description: Interval between each retry attempt (in seconds). The default
                is 30 sec.
              minimum: 30
              maximum: 86400
            secureOutput:
              type: boolean
              description: When set to true, Output from activity is considered as
                secure and will not be logged to monitoring.
