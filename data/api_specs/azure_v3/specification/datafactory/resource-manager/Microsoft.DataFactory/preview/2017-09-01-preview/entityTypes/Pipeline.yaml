openapi: 3.0.0
info:
  title: DataFactoryManagementClient
  version: 2017-09-01-preview
paths: {}
components:
  schemas:
    Pipeline:
      description: A data factory pipeline.
      type: object
      properties:
        description:
          description: The description of the pipeline.
          type: string
        activities:
          type: array
          description: List of activities in pipeline.
          items:
            discriminator:
              propertyName: type
            description: A pipeline activity.
            type: object
            properties:
              name:
                description: Activity name.
                type: string
              type:
                type: string
                description: Type of activity.
              description:
                description: Activity description.
                type: string
              dependsOn:
                type: array
                description: Activity depends on condition.
                items:
                  description: Activity dependency information.
                  type: object
                  properties:
                    activity:
                      description: Activity name.
                      type: string
                    dependencyConditions:
                      type: array
                      description: Match-Condition for the dependency.
                      items:
                        type: string
                        enum:
                        - Succeeded
                        - Failed
                        - Skipped
                        - Completed
                        x-ms-enum:
                          name: DependencyCondition
                          modelAsString: true
                  additionalProperties:
                    type: object
                  required:
                  - activity
                  - dependencyConditions
            additionalProperties:
              type: object
            required:
            - name
            - type
        parameters:
          description: List of parameters for pipeline.
          type: object
          additionalProperties:
            description: Definition of a single parameter for an entity.
            type: object
            properties:
              type:
                type: string
                description: Parameter type.
                enum:
                - Object
                - String
                - Int
                - Float
                - Bool
                - Array
                - SecureString
                x-ms-enum:
                  name: ParameterType
                  modelAsString: true
              defaultValue:
                type: object
                description: Default value of parameter.
            required:
            - type
        concurrency:
          type: integer
          minimum: 1
          description: The max number of concurrent runs for the pipeline.
        annotations:
          description: List of tags that can be used for describing the Pipeline.
          type: array
          items:
            type: object
    Activity:
      discriminator:
        propertyName: type
      description: A pipeline activity.
      type: object
      properties:
        name:
          description: Activity name.
          type: string
        type:
          type: string
          description: Type of activity.
        description:
