              description: The path of the container/folder that will trigger the
                pipeline.
              type: string
            maxConcurrency:
              description: The max number of parallel files to handle when it is triggered.
              type: integer
            linkedService:
              description: The Azure Storage linked service reference.
              properties:
                type:
