                  name:
                    type: string
                    description: Reference name.
                required:
                - type
                - referenceName
              parameters:
                description: Pipeline parameters.
                type: object
                additionalProperties:
                  type: object
          description: Pipelines that need to be started.
        typeProperties:
          description: Blob Events Trigger properties.
          x-ms-client-flatten: true
          properties:
            blobPathBeginsWith:
              description: 'The blob path must begin with the pattern provided for
                trigger to fire. For example, ''/records/blobs/december/'' will only
                fire the trigger for blobs in the december folder under the records
                container. At least one of these must be provided: blobPathBeginsWith,
                blobPathEndsWith.'
              type: string
            blobPathEndsWith:
              description: 'The blob path must end with the pattern provided for trigger
                to fire. For example, ''december/boxes.csv'' will only fire the trigger
                for blobs named boxes in a december folder. At least one of these
                must be provided: blobPathBeginsWith, blobPathEndsWith.'
              type: string
            ignoreEmptyBlobs:
              description: If set to true, blobs with zero bytes will be ignored.
              type: boolean
            events:
              description: The type of events that cause this trigger to fire.
              type: array
              items:
                type: string
                enum:
                - Microsoft.Storage.BlobCreated
                - Microsoft.Storage.BlobDeleted
                x-ms-enum:
                  name: BlobEventTypes
                  modelAsString: true
            scope:
              description: The ARM resource ID of the Storage Account.
              type: string
          required:
          - events
          - scope
