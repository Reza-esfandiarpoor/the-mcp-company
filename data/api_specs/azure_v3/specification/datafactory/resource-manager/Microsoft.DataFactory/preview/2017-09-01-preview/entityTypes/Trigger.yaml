    TumblingWindowTrigger:
      type: object
      properties:
        type:
          type: string
          description: Trigger type.
        description:
          description: Trigger description.
          type: string
        runtimeState:
          description: Indicates if trigger is running or not. Updated when Start/Stop
            APIs are called on the Trigger.
          readOnly: true
          type: string
          enum:
          - Started
          - Stopped
          - Disabled
          x-ms-enum:
            name: TriggerRuntimeState
            modelAsString: true
        pipeline:
          description: Pipeline for which runs are created when an event is fired
            for trigger window that is ready.
          properties:
            pipelineReference:
              description: Pipeline reference.
              properties:
                type:
                  type: string
                  description: Pipeline reference type.
                  enum:
                  - PipelineReference
                referenceName:
                  type: string
                  description: Reference pipeline name.
                name:
                  type: string
                  description: Reference name.
              required:
              - type
              - referenceName
            parameters:
              description: Pipeline parameters.
              type: object
              additionalProperties:
                type: object
        typeProperties:
          description: Tumbling Window Trigger properties.
          x-ms-client-flatten: true
          properties:
            frequency:
              description: The frequency of the time windows.
              type: string
              enum:
              - Minute
              - Hour
              x-ms-enum:
                name: TumblingWindowFrequency
                modelAsString: true
            interval:
              type: integer
              format: int32
              description: The interval of the time windows. The minimum interval
                allowed is 15 Minutes.
            startTime:
              type: string
              format: date-time
              description: The start time for the time period for the trigger during
                which events are fired for windows that are ready. Only UTC time is
                currently supported.
            endTime:
              type: string
              format: date-time
              description: The end time for the time period for the trigger during
                which events are fired for windows that are ready. Only UTC time is
                currently supported.
            delay:
              type: object
              description: 'Specifies how long the trigger waits past due time before
                triggering new run. It doesn''t alter window start and end time. The
                default is 0. Type: string (or Expression with resultType string),
                pattern: ((\d+)\.)?(\d\d):(60|([0-5][0-9])):(60|([0-5][0-9])).'
            maxConcurrency:
              description: The max number of parallel time windows (ready for execution)
                for which a new run is triggered.
              type: integer
              minimum: 1
              maximum: 50
            retryPolicy:
              description: Retry policy that will be applied for failed pipeline runs.
              properties:
                count:
                  type: object
                  description: 'Maximum ordinary retry attempts. Default is 0. Type:
                    integer (or Expression with resultType integer), minimum: 0.'
                intervalInSeconds:
                  description: Interval between retries in seconds. Default is 30.
                  type: integer
                  minimum: 30
                  maximum: 86400
          required:
          - frequency
          - interval
          - startTime
          - maxConcurrency
      required:
      - type
      - pipeline
      - typeProperties
      additionalProperties:
        type: object
      description: Azure data factory nested object which contains information about
        creating pipeline run
      discriminator:
        propertyName: type
    TumblingWindowFrequency:
      description: Enumerates possible frequency option for the tumbling window trigger.
      type: string
      enum:
      - Minute
      - Hour
      x-ms-enum:
        name: TumblingWindowFrequency
        modelAsString: true
    RetryPolicy:
      description: Execution policy for an activity.
      properties:
        count:
          type: object
          description: 'Maximum ordinary retry attempts. Default is 0. Type: integer
            (or Expression with resultType integer), minimum: 0.'
        intervalInSeconds:
          description: Interval between retries in seconds. Default is 30.
          type: integer
          minimum: 30
          maximum: 86400
    PipelineReference:
