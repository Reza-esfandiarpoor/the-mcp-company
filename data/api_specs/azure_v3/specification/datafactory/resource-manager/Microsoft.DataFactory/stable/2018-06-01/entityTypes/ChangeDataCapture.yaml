openapi: 3.0.0
info:
  title: DataFactoryManagementClient
  version: 2018-06-01
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ChangeDataCapture:
      description: A Azure Data Factory object which automatically detects data changes
        at the source and then sends the updated data to the destination.
      type: object
      properties:
        folder:
          description: The folder that this CDC is in. If not specified, CDC will
            appear at the root level.
          type: object
          properties:
            name:
              description: The name of the folder that this CDC is in.
              type: string
        description:
          description: The description of the change data capture.
          type: string
        sourceConnectionsInfo:
          description: List of sources connections that can be used as sources in
            the CDC.
          type: array
          items:
            type: object
            description: A object which contains list of tables and connection details
              for a source connection.
            properties:
              sourceEntities:
                description: List of source tables for a source connection.
                type: array
                items:
                  type: object
                  description: CDC table details.
                  properties:
                    name:
                      description: Name of the table.
                      type: string
                    properties:
                      description: Table properties.
                      type: object
                      x-ms-client-flatten: true
                      properties:
                        schema:
                          description: List of columns for the source table.
                          type: array
                          items:
                            type: object
                            description: Schema of a CDC table in terms of column
                              names and their corresponding data types.
                            properties:
                              name:
                                description: Name of the column.
                                type: string
                              dataType:
                                description: Data type of the column.
                                type: string
                          x-ms-identifiers:
                          - name
                        dslConnectorProperties:
                          description: List of name/value pairs for connection properties.
                          type: array
                          items:
                            type: object
                            description: Connector properties of a CDC table in terms
                              of name / value pairs.
                            properties:
                              name:
                                description: Name of the property.
                                type: string
                              value:
                                description: Value of the property.
                                type: object
                          x-ms-identifiers: []
                x-ms-identifiers:
                - name
              connection:
                type: object
                description: Source connection details.
                properties:
                  linkedService:
                    description: Linked service reference.
                    type: object
                    properties:
                      type:
                        type: string
                        description: Linked service reference type.
                        enum:
                        - LinkedServiceReference
                        x-ms-enum:
                          name: Type
                          modelAsString: true
                      referenceName:
                        type: string
                        description: Reference LinkedService name.
                      parameters:
                        description: Arguments for LinkedService.
                        type: object
                        additionalProperties:
                          type: object
                    required:
                    - type
                    - referenceName
                  linkedServiceType:
                    description: 'Type of the linked service e.g.: AzureBlobFS.'
                    type: string
                  type:
                    description: Type of connection via linked service or dataset.
                    type: string
                    enum:
                    - linkedservicetype
                    x-ms-enum:
                      name: ConnectionType
                      modelAsString: true
                  isInlineDataset:
                    description: A boolean indicating whether linked service is of
                      type inline dataset. Currently only inline datasets are supported.
                    type: boolean
                  commonDslConnectorProperties:
                    description: List of name/value pairs for connection properties.
                    type: array
                    items:
                      type: object
                      description: Connector properties of a CDC table in terms of
                        name / value pairs.
                      properties:
                        name:
                          description: Name of the property.
                          type: string
                        value:
                          description: Value of the property.
                          type: object
                    x-ms-identifiers: []
                required:
                - type
          x-ms-identifiers: []
        targetConnectionsInfo:
          description: List of target connections that can be used as sources in the
            CDC.
          type: array
          items:
            type: object
            description: A object which contains list of tables and connection details
