                  commonDslConnectorProperties:
                    description: List of name/value pairs for connection properties.
                    type: array
                    items:
                      type: object
                      description: Connector properties of a CDC table in terms of
                        name / value pairs.
                      properties:
                        name:
                          description: Name of the property.
                          type: string
                        value:
                          description: Value of the property.
                          type: object
                    x-ms-identifiers: []
                required:
                - type
              dataMapperMappings:
                description: List of table mappings.
                type: array
                items:
                  type: object
                  description: Source and target table mapping details.
                  properties:
                    targetEntityName:
                      description: Name of the target table
                      type: string
                    sourceEntityName:
                      description: Name of the source table
                      type: string
                    sourceConnectionReference:
                      description: The connection reference for the source connection.
                      type: object
                      properties:
                        connectionName:
                          description: Name of the connection
                          type: string
                        type:
                          description: Type of connection via linked service or dataset.
                          type: string
                          enum:
                          - linkedservicetype
                          x-ms-enum:
                            name: ConnectionType
                            modelAsString: true
                    attributeMappingInfo:
                      description: This holds the user provided attribute mapping
                        information.
                      type: object
                      properties:
                        attributeMappings:
                          description: List of attribute mappings.
                          type: array
                          items:
                            type: object
                            description: Source and target column mapping details.
                            properties:
                              name:
                                description: Name of the target column.
                                type: string
                              type:
                                description: 'Type of the CDC attribute mapping. Note:
                                  ''Advanced'' mapping type is also saved as ''Derived''.'
                                type: string
                                enum:
                                - Direct
                                - Derived
                                - Aggregate
                                x-ms-enum:
                                  name: MappingType
                                  modelAsString: true
                              functionName:
                                description: Name of the function used for 'Aggregate'
                                  and 'Derived' (except 'Advanced') type mapping.
                                type: string
                              expression:
                                description: Expression used for 'Aggregate' and 'Derived'
                                  type mapping.
                                type: string
                              attributeReference:
                                description: Reference of the source column used in
                                  the mapping. It is used for 'Direct' mapping type
                                  only.
                                type: object
                                properties:
                                  name:
                                    description: Name of the column.
                                    type: string
                                  entity:
                                    description: Name of the table.
                                    type: string
                                  entityConnectionReference:
                                    description: The connection reference for the
                                      connection.
                                    type: object
                                    properties:
                                      connectionName:
                                        description: Name of the connection
                                        type: string
                                      type:
                                        description: Type of connection via linked
                                          service or dataset.
                                        type: string
                                        enum:
                                        - linkedservicetype
                                        x-ms-enum:
                                          name: ConnectionType
                                          modelAsString: true
                              attributeReferences:
                                description: List of references for source columns.
                                  It is used for 'Derived' and 'Aggregate' type mappings
                                  only.
                                type: array
                                items:
                                  type: object
                                  description: Attribute reference details for the
                                    referred column.
                                  properties:
                                    name:
                                      description: Name of the column.
                                      type: string
                                    entity:
                                      description: Name of the table.
                                      type: string
                                    entityConnectionReference:
                                      description: The connection reference for the
                                        connection.
                                      type: object
                                      properties:
                                        connectionName:
                                          description: Name of the connection
                                          type: string
                                        type:
                                          description: Type of connection via linked
                                            service or dataset.
                                          type: string
                                          enum:
                                          - linkedservicetype
                                          x-ms-enum:
                                            name: ConnectionType
                                            modelAsString: true
                                x-ms-identifiers:
                                - name
                          x-ms-identifiers:
                          - name
                    sourceDenormalizeInfo:
                      description: This holds the source denormalization information
                        used while joining multiple sources.
                      type: object
                x-ms-identifiers:
                - targetEntityName
                - sourceEntityName
              relationships:
                description: List of relationship info among the tables.
                type: array
                items:
                  type: object
                x-ms-identifiers: []
          x-ms-identifiers: []
        policy:
          description: CDC policy
          type: object
          properties:
            mode:
              description: 'Mode of running the CDC: batch vs continuous.'
              type: string
            recurrence:
              description: Defines the frequency and interval for running the CDC
                for batch mode.
              type: object
              properties:
                frequency:
                  description: Frequency of period in terms of 'Hour', 'Minute' or
                    'Second'.
                  type: string
                  enum:
                  - Hour
                  - Minute
                  - Second
                  x-ms-enum:
                    name: FrequencyType
                    modelAsString: true
                interval:
                  description: Actual interval value as per chosen frequency.
                  type: integer
                  format: int32
        allowVNetOverride:
          description: A boolean to determine if the vnet configuration needs to be
            overwritten.
          type: boolean
        status:
          description: Status of the CDC as to if it is running or stopped.
          type: string
      required:
      - sourceConnectionsInfo
      - targetConnectionsInfo
      - policy
