                  value:
                    type: array
                    items:
                      properties:
                        '@search.score':
                          type: number
                          format: double
                          readOnly: true
                          x-ms-client-name: Score
                          description: The relevance score of the document compared
                            to other documents returned by the query.
                          nullable: false
                        '@search.highlights':
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                          readOnly: true
                          x-ms-client-name: Highlights
                          description: Text fragments from the document that indicate
                            the matching search terms, organized by each applicable
                            field; null if hit highlighting was not enabled for the
                            query.
                      additionalProperties: true
                      description: Contains a document found by a search query, plus
