openapi: 3.0.0
info:
  title: SearchIndexClient
  description: Client that can be used to query an index and upload, merge, or delete
    documents.
  version: 2019-05-06
  x-ms-code-generation-settings:
    useDateTimeOffset: true
    syncMethods: None
servers:
- url: https://{searchServiceName}.{searchDnsSuffix}/indexes('{indexName}')
  variables:
    searchServiceName:
      x-ms-skip-url-encoding: true
      description: The name of the search service.
      x-ms-parameter-location: client
      default: none
    searchDnsSuffix:
      default: search.windows.net
      x-ms-skip-url-encoding: true
      description: The DNS suffix of the search service. The default is search.windows.net.
      x-ms-parameter-location: client
    indexName:
      x-ms-skip-url-encoding: false
      description: The name of the index.
      x-ms-parameter-location: client
      default: none
paths:
  /docs/$count:
    get:
      tags:
      - Documents
      operationId: Documents_Count
      externalDocs:
        url: https://docs.microsoft.com/rest/api/searchservice/Count-Documents
      description: Queries the number of documents in the index.
      parameters:
      - name: client-request-id
        in: header
        required: false
        description: The tracking ID sent with the request to help with debugging.
        x-ms-client-request-id: true
        x-ms-parameter-grouping:
          name: search-request-options
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      x-ms-request-id: request-id
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                format: int64
  /docs:
    get:
      tags:
      - Documents
      operationId: Documents_SearchGet
      externalDocs:
        url: https://docs.microsoft.com/rest/api/searchservice/Search-Documents
      description: Searches for documents in the index.
      parameters:
      - name: search
        in: query
        description: A full-text search query expression; Use "*" or omit this parameter
          to match all documents.
        x-ms-client-name: SearchText
        schema:
          type: string
      - name: $count
        in: query
        description: A value that specifies whether to fetch the total count of results.
          Default is false. Setting this value to true may have a performance impact.
          Note that the count returned is an approximation.
        x-nullable: false
        x-ms-client-name: IncludeTotalResultCount
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: boolean
      - name: facet
        in: query
        description: The list of facet expressions to apply to the search query. Each
          facet expression contains a field name, optionally followed by a comma-separated
          list of name:value pairs.
        x-ms-client-name: Facets
        x-ms-parameter-grouping:
          name: SearchParameters
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: $filter
        in: query
        description: The OData $filter expression to apply to the search query.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
      - name: highlight
        in: query
        description: The list of field names to use for hit highlights. Only searchable
          fields can be used for hit highlighting.
        x-ms-client-name: HighlightFields
        x-ms-parameter-grouping:
          name: SearchParameters
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: highlightPostTag
        in: query
        description: A string tag that is appended to hit highlights. Must be set
          with highlightPreTag. Default is &lt;/em&gt;.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
      - name: highlightPreTag
        in: query
        description: A string tag that is prepended to hit highlights. Must be set
          with highlightPostTag. Default is &lt;em&gt;.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
      - name: minimumCoverage
        in: query
        description: A number between 0 and 100 indicating the percentage of the index
          that must be covered by a search query in order for the query to be reported
          as a success. This parameter can be useful for ensuring search availability
          even for services with only one replica. The default is 100.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: number
          format: double
      - name: $orderby
        in: query
        description: The list of OData $orderby expressions by which to sort the results.
          Each expression can be either a field name or a call to either the geo.distance()
          or the search.score() functions. Each expression can be followed by asc
          to indicate ascending, and desc to indicate descending. The default is ascending
          order. Ties will be broken by the match scores of documents. If no OrderBy
          is specified, the default sort order is descending by document match score.
          There can be at most 32 $orderby clauses.
        x-ms-client-name: OrderBy
        x-ms-parameter-grouping:
          name: SearchParameters
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: queryType
        in: query
        x-ms-enum:
          name: QueryType
          modelAsString: false
        x-nullable: false
        description: A value that specifies the syntax of the search query. The default
          is 'simple'. Use 'full' if your query uses the Lucene query syntax.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
          enum:
          - simple
          - full
      - name: scoringParameter
        in: query
        x-ms-client-name: ScoringParameters
        description: The list of parameter values to be used in scoring functions
          (for example, referencePointParameter) using the format name-values. For
          example, if the scoring profile defines a function with a parameter called
          'mylocation' the parameter string would be "mylocation--122.2,44.8" (without
          the quotes).
        x-ms-parameter-grouping:
          name: SearchParameters
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: scoringProfile
        in: query
        description: The name of a scoring profile to evaluate match scores for matching
          documents in order to sort the results.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
      - name: searchFields
        in: query
        description: The list of field names to which to scope the full-text search.
          When using fielded search (fieldName:searchExpression) in a full Lucene
          query, the field names of each fielded search expression take precedence
          over any field names listed in this parameter.
        x-ms-parameter-grouping:
          name: SearchParameters
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: searchMode
        in: query
        x-ms-enum:
          name: SearchMode
          modelAsString: false
        x-nullable: false
        description: A value that specifies whether any or all of the search terms
          must be matched in order to count the document as a match.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: string
          enum:
          - any
          - all
      - name: $select
        in: query
        description: The list of fields to retrieve. If unspecified, all fields marked
          as retrievable in the schema are included.
        x-ms-parameter-grouping:
          name: SearchParameters
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: $skip
        in: query
        description: The number of search results to skip. This value cannot be greater
          than 100,000. If you need to scan documents in sequence, but cannot use
          $skip due to this limitation, consider using $orderby on a totally-ordered
          key and $filter with a range query instead.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: integer
          format: int32
      - name: $top
        in: query
        description: The number of search results to retrieve. This can be used in
          conjunction with $skip to implement client-side paging of search results.
          If results are truncated due to server-side paging, the response will include
          a continuation token that can be used to issue another Search request for
          the next page of results.
        x-ms-parameter-grouping:
          name: SearchParameters
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      - name: client-request-id
        in: header
        required: false
        description: The tracking ID sent with the request to help with debugging.
        x-ms-client-request-id: true
        x-ms-parameter-grouping:
          name: search-request-options
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      x-ms-request-id: request-id
      responses:
        '200':
          description: Response containing documents that match the search criteria.
          content:
            application/json:
              schema:
                properties:
                  '@odata.count':
                    type: integer
                    format: int64
                    readOnly: true
                    x-ms-client-name: Count
                    description: The total count of results found by the search operation,
                      or null if the count was not requested. If present, the count
                      may be greater than the number of results in this response.
                      This can happen if you use the $top or $skip parameters, or
                      if Azure Cognitive Search can't return all the requested documents
                      in a single Search response.
                  '@search.coverage':
                    type: number
                    format: double
                    readOnly: true
                    x-ms-client-name: Coverage
                    description: A value indicating the percentage of the index that
                      was included in the query, or null if minimumCoverage was not
                      specified in the request.
                  '@search.facets':
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        properties:
                          count:
                            type: integer
                            format: int64
                            readOnly: true
                            description: The approximate count of documents falling
                              within the bucket described by this facet.
                        additionalProperties: true
                        description: A single bucket of a facet query result. Reports
                          the number of documents with a field value falling within
                          a particular range or having a particular value or interval.
                    readOnly: true
                    x-ms-client-name: Facets
                    description: The facet query results for the search operation,
                      organized as a collection of buckets for each faceted field;
                      null if the query did not include any facet expressions.
                  '@search.nextPageParameters':
