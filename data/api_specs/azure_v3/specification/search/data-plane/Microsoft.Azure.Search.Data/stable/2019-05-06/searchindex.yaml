                    readOnly: true
                    x-ms-client-name: Results
                    description: The sequence of results returned by the query.
                  '@odata.nextLink':
                    type: string
                    readOnly: true
                    x-ms-client-name: NextLink
                    description: Continuation URL returned when Azure Cognitive Search
                      can't return all the requested results in a single Search response.
                      You can use this URL to formulate another GET or POST Search
                      request to get the next part of the search response. Make sure
                      to use the same verb (GET or POST) as the request that produced
