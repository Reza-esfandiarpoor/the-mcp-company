            or locally, for lower latency. The default is 'local'. Use 'global' to
            aggregate scoring statistics globally before scoring. Using global scoring
            statistics can increase latency of search queries.
          type: string
          enum:
          - local
          - global
          x-ms-enum:
            name: ScoringStatistics
            modelAsString: false
            values:
            - value: local
              name: Local
              description: The scoring statistics will be calculated locally for lower
                latency.
            - value: global
              name: Global
              description: The scoring statistics will be calculated globally for
                more consistent scoring.
        sessionId:
          type: string
          description: A value to be used to create a sticky session, which can help
            getting more consistent results. As long as the same sessionId is used,
            a best-effort attempt will be made to target the same replica set. Be
            wary that reusing the same sessionID values repeatedly can interfere with
            the load balancing of the requests across replicas and adversely affect
            the performance of the search service. The value used as sessionId cannot
            start with a '_' character.
        scoringParameters:
          type: array
          items:
            type: string
          description: The list of parameter values to be used in scoring functions
            (for example, referencePointParameter) using the format name-values. For
            example, if the scoring profile defines a function with a parameter called
            'mylocation' the parameter string would be "mylocation--122.2,44.8" (without
            the quotes).
        scoringProfile:
          type: string
          description: The name of a scoring profile to evaluate match scores for
            matching documents in order to sort the results.
        search:
          type: string
          description: A full-text search query expression; Use "*" or omit this parameter
            to match all documents.
          x-ms-client-name: SearchText
        searchFields:
          type: string
          description: The comma-separated list of field names to which to scope the
            full-text search. When using fielded search (fieldName:searchExpression)
            in a full Lucene query, the field names of each fielded search expression
            take precedence over any field names listed in this parameter.
        searchMode:
          description: A value that specifies whether any or all of the search terms
            must be matched in order to count the document as a match.
          type: string
          enum:
          - any
          - all
          x-ms-enum:
            name: SearchMode
            modelAsString: false
            values:
            - value: any
              name: Any
              description: Any of the search terms must be matched in order to count
                the document as a match.
            - value: all
              name: All
              description: All of the search terms must be matched in order to count
                the document as a match.
        select:
          type: string
          description: The comma-separated list of fields to retrieve. If unspecified,
            all fields marked as retrievable in the schema are included.
        skip:
          type: integer
          format: int32
          description: The number of search results to skip. This value cannot be
            greater than 100,000. If you need to scan documents in sequence, but cannot
            use skip due to this limitation, consider using orderby on a totally-ordered
            key and filter with a range query instead.
        top:
          type: integer
          format: int32
          description: The number of search results to retrieve. This can be used
            in conjunction with $skip to implement client-side paging of search results.
            If results are truncated due to server-side paging, the response will
            include a continuation token that can be used to issue another Search
            request for the next page of results.
        semanticConfiguration:
          type: string
          description: The name of a semantic configuration that will be used when
            processing documents for queries of type semantic.
        semanticErrorHandling:
          description: Allows the user to choose whether a semantic call should fail
            completely (default / current behavior), or to return partial results.
          type: string
          enum:
          - partial
          - fail
          x-ms-enum:
            name: SemanticErrorMode
            modelAsString: true
            values:
            - value: partial
              name: Partial
              description: If the semantic processing fails, partial results still
                return. The definition of partial results depends on what semantic
                step failed and what was the reason for failure.
            - value: fail
              name: Fail
              description: If there is an exception during the semantic processing
                step, the query will fail and return the appropriate HTTP code depending
                on the error.
        semanticMaxWaitInMilliseconds:
          type: integer
          format: int32
          minimum: 700
          description: Allows the user to set an upper bound on the amount of time
            it takes for semantic enrichment to finish processing before the request
            fails.
          nullable: true
        semanticQuery:
          type: string
          description: Allows setting a separate search query that will be solely
            used for semantic reranking, semantic captions and semantic answers. Is
            useful for scenarios where there is a need to use different queries between
            the base retrieval and ranking phase, and the L2 semantic phase.
        answers:
          description: A value that specifies whether answers should be returned as
            part of the search response.
          type: string
          enum:
          - none
          - extractive
          x-ms-enum:
            name: QueryAnswerType
            modelAsString: true
            values:
            - value: none
              name: None
              description: Do not return answers for the query.
            - value: extractive
              name: Extractive
              description: Extracts answer candidates from the contents of the documents
                returned in response to a query expressed as a question in natural
                language.
        captions:
          description: A value that specifies whether captions should be returned
            as part of the search response.
          type: string
          enum:
          - none
          - extractive
          x-ms-enum:
            name: QueryCaptionType
            modelAsString: true
            values:
            - value: none
              name: None
              description: Do not return captions for the query.
            - value: extractive
              name: Extractive
              description: Extracts captions from the matching documents that contain
                passages relevant to the search query.
        vectorQueries:
          type: array
          items:
            type: object
            discriminator:
              propertyName: kind
            properties:
              kind:
                description: The kind of vector query being performed.
                type: string
                enum:
                - vector
                - text
                x-ms-enum:
                  name: VectorQueryKind
                  modelAsString: true
                  values:
                  - value: vector
                    name: Vector
                    description: Vector query where a raw vector value is provided.
                  - value: text
                    name: Text
                    description: Vector query where a text value that needs to be
                      vectorized is provided.
                nullable: false
              k:
                type: integer
                format: int32
                description: Number of nearest neighbors to return as top hits.
              fields:
                type: string
                description: Vector Fields of type Collection(Edm.Single) to be included
                  in the vector searched.
              exhaustive:
                type: boolean
                description: When true, triggers an exhaustive k-nearest neighbor
                  search across all vectors within the vector index. Useful for scenarios
                  where exact matches are critical, such as determining ground truth
                  values.
              oversampling:
                type: number
                format: double
                description: Oversampling factor. Minimum value is 1. It overrides
                  the 'defaultOversampling' parameter configured in the index definition.
                  It can be set only when 'rerankWithOriginalVectors' is true. This
                  parameter is only permitted when a compression method is used on
                  the underlying vector field.
              weight:
                type: number
                format: float
                description: 'Relative weight of the vector query when compared to
                  other vector query and/or the text query within the same search
                  request. This value is used when combining the results of multiple
                  ranking lists produced by the different vector queries and/or the
                  results retrieved through the text query. The higher the weight,
                  the higher the documents that matched that query will be in the
                  final ranking. Default is 1.0 and the value needs to be a positive
                  number larger than zero. '
            required:
            - kind
            description: The query parameters for vector and hybrid search queries.
          description: The query parameters for vector and hybrid search queries.
        vectorFilterMode:
          description: Determines whether or not filters are applied before or after
            the vector search is performed. Default is 'preFilter' for new indexes.
          type: string
          enum:
          - postFilter
          - preFilter
          x-ms-enum:
            name: VectorFilterMode
            modelAsString: true
            values:
            - value: postFilter
              name: PostFilter
              description: The filter will be applied after the candidate set of vector
                results is returned. Depending on the filter selectivity, this can
                result in fewer results than requested by the parameter 'k'.
            - value: preFilter
              name: PreFilter
              description: The filter will be applied before the search query.
      description: Parameters for filtering, sorting, faceting, paging, and other
        search query behaviors.
    SuggestRequest:
      properties:
        filter:
          externalDocs:
            url: https://learn.microsoft.com/rest/api/searchservice/OData-Expression-Syntax-for-Azure-Search
          type: string
          description: An OData expression that filters the documents considered for
            suggestions.
        fuzzy:
          type: boolean
          description: A value indicating whether to use fuzzy matching for the suggestion
            query. Default is false. When set to true, the query will find suggestions
            even if there's a substituted or missing character in the search text.
            While this provides a better experience in some scenarios, it comes at
            a performance cost as fuzzy suggestion searches are slower and consume
            more resources.
          x-ms-client-name: UseFuzzyMatching
        highlightPostTag:
          type: string
          description: A string tag that is appended to hit highlights. Must be set
            with highlightPreTag. If omitted, hit highlighting of suggestions is disabled.
        highlightPreTag:
          type: string
          description: A string tag that is prepended to hit highlights. Must be set
            with highlightPostTag. If omitted, hit highlighting of suggestions is
            disabled.
        minimumCoverage:
          type: number
          format: double
          description: A number between 0 and 100 indicating the percentage of the
            index that must be covered by a suggestion query in order for the query
            to be reported as a success. This parameter can be useful for ensuring
            search availability even for services with only one replica. The default
            is 80.
        orderby:
          x-ms-client-name: OrderBy
          type: string
          description: The comma-separated list of OData $orderby expressions by which
            to sort the results. Each expression can be either a field name or a call
            to either the geo.distance() or the search.score() functions. Each expression
            can be followed by asc to indicate ascending, or desc to indicate descending.
            The default is ascending order. Ties will be broken by the match scores
            of documents. If no $orderby is specified, the default sort order is descending
            by document match score. There can be at most 32 $orderby clauses.
        search:
          type: string
          description: The search text to use to suggest documents. Must be at least
            1 character, and no more than 100 characters.
          x-ms-client-name: SearchText
        searchFields:
          type: string
          description: The comma-separated list of field names to search for the specified
            search text. Target fields must be included in the specified suggester.
        select:
          type: string
          description: The comma-separated list of fields to retrieve. If unspecified,
            only the key field will be included in the results.
        suggesterName:
          type: string
          description: The name of the suggester as specified in the suggesters collection
            that's part of the index definition.
        top:
          type: integer
          format: int32
          description: The number of suggestions to retrieve. This must be a value
            between 1 and 100. The default is 5.
      required:
      - search
      - suggesterName
      description: Parameters for filtering, sorting, fuzzy matching, and other suggestions
        query behaviors.
    AutocompleteRequest:
      properties:
        search:
          type: string
          description: The search text on which to base autocomplete results.
          x-ms-client-name: SearchText
        autocompleteMode:
          description: Specifies the mode for Autocomplete. The default is 'oneTerm'.
            Use 'twoTerms' to get shingles and 'oneTermWithContext' to use the current
            context while producing auto-completed terms.
          type: string
          enum:
          - oneTerm
          - twoTerms
          - oneTermWithContext
          x-ms-enum:
            name: AutocompleteMode
            modelAsString: false
            values:
            - value: oneTerm
              name: OneTerm
              description: Only one term is suggested. If the query has two terms,
                only the last term is completed. For example, if the input is 'washington
                medic', the suggested terms could include 'medicaid', 'medicare',
                and 'medicine'.
            - value: twoTerms
              name: TwoTerms
              description: Matching two-term phrases in the index will be suggested.
                For example, if the input is 'medic', the suggested terms could include
                'medicare coverage' and 'medical assistant'.
            - value: oneTermWithContext
              name: OneTermWithContext
              description: Completes the last term in a query with two or more terms,
                where the last two terms are a phrase that exists in the index. For
                example, if the input is 'washington medic', the suggested terms could
                include 'washington medicaid' and 'washington medical'.
        filter:
          externalDocs:
            url: https://learn.microsoft.com/rest/api/searchservice/OData-Expression-Syntax-for-Azure-Search
          type: string
          description: An OData expression that filters the documents used to produce
            completed terms for the Autocomplete result.
        fuzzy:
          type: boolean
          description: A value indicating whether to use fuzzy matching for the autocomplete
            query. Default is false. When set to true, the query will autocomplete
            terms even if there's a substituted or missing character in the search
            text. While this provides a better experience in some scenarios, it comes
            at a performance cost as fuzzy autocomplete queries are slower and consume
            more resources.
          x-ms-client-name: UseFuzzyMatching
        highlightPostTag:
          type: string
          description: A string tag that is appended to hit highlights. Must be set
            with highlightPreTag. If omitted, hit highlighting is disabled.
        highlightPreTag:
          type: string
          description: A string tag that is prepended to hit highlights. Must be set
            with highlightPostTag. If omitted, hit highlighting is disabled.
        minimumCoverage:
          type: number
          format: double
          description: A number between 0 and 100 indicating the percentage of the
            index that must be covered by an autocomplete query in order for the query
            to be reported as a success. This parameter can be useful for ensuring
            search availability even for services with only one replica. The default
            is 80.
        searchFields:
          type: string
          description: The comma-separated list of field names to consider when querying
            for auto-completed terms. Target fields must be included in the specified
            suggester.
        suggesterName:
          type: string
          description: The name of the suggester as specified in the suggesters collection
            that's part of the index definition.
        top:
          type: integer
          format: int32
          description: The number of auto-completed terms to retrieve. This must be
            a value between 1 and 100. The default is 5.
      required:
      - search
      - suggesterName
      description: Parameters for fuzzy matching, and other autocomplete query behaviors.
    AutocompleteResult:
      properties:
        '@search.coverage':
          type: number
          format: double
          readOnly: true
          x-ms-client-name: Coverage
          description: A value indicating the percentage of the index that was considered
            by the autocomplete request, or null if minimumCoverage was not specified
            in the request.
        value:
          type: array
          readOnly: true
          items:
            properties:
              text:
                type: string
                readOnly: true
                description: The completed term.
              queryPlusText:
                type: string
                readOnly: true
                description: The query along with the completed term.
            required:
            - text
            - queryPlusText
            description: The result of Autocomplete requests.
          description: The list of returned Autocompleted items.
          x-ms-client-name: Results
      required:
      - value
      description: The result of Autocomplete query.
    AutocompleteItem:
      properties:
        text:
          type: string
          readOnly: true
          description: The completed term.
        queryPlusText:
          type: string
          readOnly: true
          description: The query along with the completed term.
      required:
      - text
      - queryPlusText
      description: The result of Autocomplete requests.
    AnswerResult:
      x-ms-client-name: QueryAnswerResult
      properties:
        score:
          type: number
          format: double
          readOnly: true
          description: The score value represents how relevant the answer is to the
            query relative to other answers returned for the query.
        key:
          type: string
          readOnly: true
          description: The key of the document the answer was extracted from.
        text:
          type: string
          readOnly: true
          description: The text passage extracted from the document contents as the
            answer.
        highlights:
          type: string
          readOnly: true
          description: Same text passage as in the Text property with highlighted
            text phrases most relevant to the query.
          nullable: true
      additionalProperties: true
      description: An answer is a text passage extracted from the contents of the
        most relevant documents that matched the query. Answers are extracted from
        the top search results. Answer candidates are scored and the top answers are
        selected.
    CaptionResult:
      x-ms-client-name: QueryCaptionResult
      properties:
        text:
          type: string
          readOnly: true
          description: A representative text passage extracted from the document most
            relevant to the search query.
        highlights:
          type: string
          readOnly: true
          description: Same text passage as in the Text property with highlighted
            phrases most relevant to the query.
          nullable: true
      additionalProperties: true
      description: Captions are the most representative passages from the document
        relatively to the search query. They are often used as document summary. Captions
        are only returned for queries of type `semantic`.
    SemanticPartialResponseReason:
      type: string
      enum:
      - maxWaitExceeded
      - capacityOverloaded
      - transient
      x-ms-enum:
        name: SemanticErrorReason
        modelAsString: true
        values:
        - value: maxWaitExceeded
          name: MaxWaitExceeded
          description: If `semanticMaxWaitInMilliseconds` was set and the semantic
            processing duration exceeded that value. Only the base results were returned.
        - value: capacityOverloaded
          name: CapacityOverloaded
          description: The request was throttled. Only the base results were returned.
        - value: transient
          name: Transient
          description: At least one step of the semantic process failed.
      description: Reason that a partial response was returned for a semantic ranking
        request.
    SemanticPartialResponseType:
      type: string
      enum:
      - baseResults
      - rerankedResults
      x-ms-enum:
        name: SemanticSearchResultsType
        modelAsString: true
        values:
        - value: baseResults
          name: BaseResults
          description: Results without any semantic enrichment or reranking.
        - value: rerankedResults
          name: RerankedResults
          description: Results have been reranked with the reranker model and will
            include semantic captions. They will not include any answers, answers
            highlights or caption highlights.
      description: Type of partial response that was returned for a semantic ranking
        request.
    SemanticErrorHandling:
      type: string
      enum:
      - partial
      - fail
      x-ms-enum:
        name: SemanticErrorMode
        modelAsString: true
        values:
        - value: partial
          name: Partial
          description: If the semantic processing fails, partial results still return.
            The definition of partial results depends on what semantic step failed
            and what was the reason for failure.
        - value: fail
          name: Fail
          description: If there is an exception during the semantic processing step,
            the query will fail and return the appropriate HTTP code depending on
            the error.
      description: Allows the user to choose whether a semantic call should fail completely,
        or to return partial results.
    Answers:
      type: string
      enum:
      - none
      - extractive
      x-ms-enum:
        name: QueryAnswerType
        modelAsString: true
        values:
        - value: none
          name: None
          description: Do not return answers for the query.
        - value: extractive
          name: Extractive
          description: Extracts answer candidates from the contents of the documents
            returned in response to a query expressed as a question in natural language.
      description: This parameter is only valid if the query type is `semantic`. If
        set, the query returns answers extracted from key passages in the highest
        ranked documents. The number of answers returned can be configured by appending
        the pipe character `|` followed by the `count-<number of answers>` option
        after the answers parameter value, such as `extractive|count-3`. Default count
        is 1. The confidence threshold can be configured by appending the pipe character
        `|` followed by the `threshold-<confidence threshold>` option after the answers
        parameter value, such as `extractive|threshold-0.9`. Default threshold is
        0.7.
    Captions:
      type: string
      enum:
      - none
      - extractive
      x-ms-enum:
        name: QueryCaptionType
        modelAsString: true
        values:
        - value: none
          name: None
          description: Do not return captions for the query.
        - value: extractive
          name: Extractive
          description: Extracts captions from the matching documents that contain
            passages relevant to the search query.
      description: This parameter is only valid if the query type is `semantic`. If
        set, the query returns captions extracted from key passages in the highest
        ranked documents. When Captions is set to `extractive`, highlighting is enabled
        by default, and can be configured by appending the pipe character `|` followed
        by the `highlight-<true/false>` option, such as `extractive|highlight-true`.
        Defaults to `None`.
