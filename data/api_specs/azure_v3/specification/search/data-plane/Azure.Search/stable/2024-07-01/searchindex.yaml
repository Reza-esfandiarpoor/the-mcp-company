        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                search:
                  type: string
                  description: The search text on which to base autocomplete results.
                  x-ms-client-name: SearchText
                autocompleteMode:
                  description: Specifies the mode for Autocomplete. The default is
                    'oneTerm'. Use 'twoTerms' to get shingles and 'oneTermWithContext'
                    to use the current context while producing auto-completed terms.
                  type: string
                  enum:
                  - oneTerm
                  - twoTerms
                  - oneTermWithContext
                  x-ms-enum:
                    name: AutocompleteMode
                    modelAsString: false
                    values:
                    - value: oneTerm
                      name: OneTerm
                      description: Only one term is suggested. If the query has two
                        terms, only the last term is completed. For example, if the
                        input is 'washington medic', the suggested terms could include
                        'medicaid', 'medicare', and 'medicine'.
                    - value: twoTerms
                      name: TwoTerms
                      description: Matching two-term phrases in the index will be
                        suggested. For example, if the input is 'medic', the suggested
                        terms could include 'medicare coverage' and 'medical assistant'.
                    - value: oneTermWithContext
                      name: OneTermWithContext
                      description: Completes the last term in a query with two or
                        more terms, where the last two terms are a phrase that exists
                        in the index. For example, if the input is 'washington medic',
                        the suggested terms could include 'washington medicaid' and
                        'washington medical'.
                filter:
                  externalDocs:
                    url: https://learn.microsoft.com/rest/api/searchservice/OData-Expression-Syntax-for-Azure-Search
                  type: string
                  description: An OData expression that filters the documents used
                    to produce completed terms for the Autocomplete result.
                fuzzy:
                  type: boolean
                  description: A value indicating whether to use fuzzy matching for
                    the autocomplete query. Default is false. When set to true, the
                    query will autocomplete terms even if there's a substituted or
                    missing character in the search text. While this provides a better
                    experience in some scenarios, it comes at a performance cost as
                    fuzzy autocomplete queries are slower and consume more resources.
                  x-ms-client-name: UseFuzzyMatching
                highlightPostTag:
                  type: string
                  description: A string tag that is appended to hit highlights. Must
                    be set with highlightPreTag. If omitted, hit highlighting is disabled.
                highlightPreTag:
                  type: string
                  description: A string tag that is prepended to hit highlights. Must
                    be set with highlightPostTag. If omitted, hit highlighting is
                    disabled.
                minimumCoverage:
                  type: number
                  format: double
                  description: A number between 0 and 100 indicating the percentage
                    of the index that must be covered by an autocomplete query in
                    order for the query to be reported as a success. This parameter
                    can be useful for ensuring search availability even for services
                    with only one replica. The default is 80.
                searchFields:
                  type: string
                  description: The comma-separated list of field names to consider
                    when querying for auto-completed terms. Target fields must be
                    included in the specified suggester.
                suggesterName:
                  type: string
                  description: The name of the suggester as specified in the suggesters
                    collection that's part of the index definition.
                top:
                  type: integer
                  format: int32
                  description: The number of auto-completed terms to retrieve. This
                    must be a value between 1 and 100. The default is 5.
              required:
              - search
              - suggesterName
              description: Parameters for fuzzy matching, and other autocomplete query
                behaviors.
