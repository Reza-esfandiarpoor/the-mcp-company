openapi: 3.0.0
info:
  title: SearchIndexClient
  description: Client that can be used to query an index and upload, merge, or delete
    documents.
  version: 2024-07-01
  x-ms-code-generation-settings:
    useDateTimeOffset: true
    syncMethods: None
servers:
- url: '{endpoint}/indexes(''{indexName}'')'
  variables:
    endpoint:
      x-ms-skip-url-encoding: true
      description: The endpoint URL of the search service.
      x-ms-parameter-location: client
      default: none
    indexName:
      x-ms-skip-url-encoding: false
      description: The name of the index.
      x-ms-parameter-location: client
      default: none
paths:
  /docs/$count:
    get:
      tags:
      - Documents
      operationId: Documents_Count
      externalDocs:
        url: https://learn.microsoft.com/rest/api/searchservice/Count-Documents
      description: Queries the number of documents in the index.
      parameters:
      - name: x-ms-client-request-id
        in: header
        required: false
        description: The tracking ID sent with the request to help with debugging.
        x-ms-client-request-id: true
        x-ms-parameter-grouping:
          name: request-options
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      x-ms-request-id: request-id
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                format: int64
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        readOnly: true
                        type: string
                        description: The error code.
                      message:
                        readOnly: true
                        type: string
                        description: The error message.
                      target:
                        readOnly: true
                        type: string
                        description: The error target.
                      details:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              readOnly: true
                              type: string
                              description: The error code.
                            message:
                              readOnly: true
                              type: string
                              description: The error message.
                            target:
                              readOnly: true
                              type: string
                              description: The error target.
                            details:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    readOnly: true
                                    type: string
                                    description: The error code.
                                  message:
                                    readOnly: true
                                    type: string
                                    description: The error message.
                                  target:
                                    readOnly: true
                                    type: string
                                    description: The error target.
                              x-ms-identifiers: []
                              description: The error details.
                            additionalInfo:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    readOnly: true
                                    type: string
                                    description: The additional info type.
                                  info:
                                    readOnly: true
                                    type: object
                                    description: The additional info.
                                description: The resource management error additional
                                  info.
                              x-ms-identifiers: []
                              description: The error additional info.
                        x-ms-identifiers: []
                        description: The error details.
                      additionalInfo:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              readOnly: true
                              type: string
                              description: The additional info type.
                            info:
                              readOnly: true
                              type: object
                              description: The additional info.
                          description: The resource management error additional info.
                        x-ms-identifiers: []
                        description: The error additional info.
  /docs:
    get:
      tags:
      - Documents
      operationId: Documents_SearchGet
      externalDocs:
        url: https://learn.microsoft.com/rest/api/searchservice/Search-Documents
      description: Searches for documents in the index.
      parameters:
      - name: search
        in: query
        description: A full-text search query expression; Use "*" or omit this parameter
          to match all documents.
        x-ms-client-name: SearchText
        schema:
          type: string
      - name: $count
        in: query
        description: A value that specifies whether to fetch the total count of results.
          Default is false. Setting this value to true may have a performance impact.
          Note that the count returned is an approximation.
        x-nullable: false
        x-ms-client-name: IncludeTotalResultCount
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: boolean
      - name: facet
        in: query
        description: The list of facet expressions to apply to the search query. Each
          facet expression contains a field name, optionally followed by a comma-separated
          list of name:value pairs.
        x-ms-client-name: Facets
        x-ms-parameter-grouping:
          name: SearchOptions
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: $filter
        in: query
        description: The OData $filter expression to apply to the search query.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: highlight
        in: query
        description: The list of field names to use for hit highlights. Only searchable
          fields can be used for hit highlighting.
        x-ms-client-name: HighlightFields
        x-ms-parameter-grouping:
          name: SearchOptions
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: highlightPostTag
        in: query
        description: A string tag that is appended to hit highlights. Must be set
          with highlightPreTag. Default is &lt;/em&gt;.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: highlightPreTag
        in: query
        description: A string tag that is prepended to hit highlights. Must be set
          with highlightPostTag. Default is &lt;em&gt;.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: minimumCoverage
        in: query
        description: A number between 0 and 100 indicating the percentage of the index
          that must be covered by a search query in order for the query to be reported
          as a success. This parameter can be useful for ensuring search availability
          even for services with only one replica. The default is 100.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: number
          format: double
      - name: $orderby
        in: query
        description: The list of OData $orderby expressions by which to sort the results.
          Each expression can be either a field name or a call to either the geo.distance()
          or the search.score() functions. Each expression can be followed by asc
          to indicate ascending, and desc to indicate descending. The default is ascending
          order. Ties will be broken by the match scores of documents. If no OrderBy
          is specified, the default sort order is descending by document match score.
          There can be at most 32 $orderby clauses.
        x-ms-client-name: OrderBy
        x-ms-parameter-grouping:
          name: SearchOptions
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: queryType
        in: query
        x-ms-enum:
          name: QueryType
          modelAsString: false
          values:
          - value: simple
            name: Simple
            description: Uses the simple query syntax for searches. Search text is
              interpreted using a simple query language that allows for symbols such
              as +, * and "". Queries are evaluated across all searchable fields by
              default, unless the searchFields parameter is specified.
          - value: full
            name: Full
            description: Uses the full Lucene query syntax for searches. Search text
              is interpreted using the Lucene query language which allows field-specific
              and weighted searches, as well as other advanced features.
          - value: semantic
            name: Semantic
            description: Best suited for queries expressed in natural language as
              opposed to keywords. Improves precision of search results by re-ranking
              the top search results using a ranking model trained on the Web corpus.
        x-nullable: false
        description: A value that specifies the syntax of the search query. The default
          is 'simple'. Use 'full' if your query uses the Lucene query syntax.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - simple
          - full
          - semantic
      - name: scoringParameter
        in: query
        x-ms-client-name: ScoringParameters
        description: The list of parameter values to be used in scoring functions
          (for example, referencePointParameter) using the format name-values. For
          example, if the scoring profile defines a function with a parameter called
          'mylocation' the parameter string would be "mylocation--122.2,44.8" (without
          the quotes).
        x-ms-parameter-grouping:
          name: SearchOptions
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: scoringProfile
        in: query
        description: The name of a scoring profile to evaluate match scores for matching
          documents in order to sort the results.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: searchFields
        in: query
        description: The list of field names to which to scope the full-text search.
          When using fielded search (fieldName:searchExpression) in a full Lucene
          query, the field names of each fielded search expression take precedence
          over any field names listed in this parameter.
        x-ms-parameter-grouping:
          name: SearchOptions
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: searchMode
        in: query
        x-ms-enum:
          name: SearchMode
          modelAsString: false
          values:
          - value: any
            name: Any
            description: Any of the search terms must be matched in order to count
              the document as a match.
          - value: all
            name: All
            description: All of the search terms must be matched in order to count
              the document as a match.
        x-nullable: false
        description: A value that specifies whether any or all of the search terms
          must be matched in order to count the document as a match.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - any
          - all
      - name: scoringStatistics
        in: query
        x-ms-enum:
          name: ScoringStatistics
          modelAsString: false
          values:
          - value: local
            name: Local
            description: The scoring statistics will be calculated locally for lower
              latency.
          - value: global
            name: Global
            description: The scoring statistics will be calculated globally for more
              consistent scoring.
        x-nullable: false
        description: A value that specifies whether we want to calculate scoring statistics
          (such as document frequency) globally for more consistent scoring, or locally,
          for lower latency.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - local
          - global
      - name: sessionId
        in: query
        description: A value to be used to create a sticky session, which can help
          to get more consistent results. As long as the same sessionId is used, a
          best-effort attempt will be made to target the same replica set. Be wary
          that reusing the same sessionID values repeatedly can interfere with the
          load balancing of the requests across replicas and adversely affect the
          performance of the search service. The value used as sessionId cannot start
          with a '_' character.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: $select
        in: query
        description: The list of fields to retrieve. If unspecified, all fields marked
          as retrievable in the schema are included.
        x-ms-parameter-grouping:
          name: SearchOptions
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: $skip
        in: query
        description: The number of search results to skip. This value cannot be greater
          than 100,000. If you need to scan documents in sequence, but cannot use
          $skip due to this limitation, consider using $orderby on a totally-ordered
          key and $filter with a range query instead.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: integer
          format: int32
      - name: $top
        in: query
        description: The number of search results to retrieve. This can be used in
          conjunction with $skip to implement client-side paging of search results.
          If results are truncated due to server-side paging, the response will include
          a continuation token that can be used to issue another Search request for
          the next page of results.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: integer
          format: int32
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      - name: x-ms-client-request-id
        in: header
        required: false
        description: The tracking ID sent with the request to help with debugging.
        x-ms-client-request-id: true
        x-ms-parameter-grouping:
          name: request-options
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: semanticConfiguration
        in: query
        description: The name of the semantic configuration that lists which fields
          should be used for semantic ranking, captions, highlights, and answers
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      - name: semanticErrorHandling
        in: query
        x-ms-enum:
          name: SemanticErrorMode
          modelAsString: true
          values:
          - value: partial
            name: Partial
            description: If the semantic processing fails, partial results still return.
              The definition of partial results depends on what semantic step failed
              and what was the reason for failure.
          - value: fail
            name: Fail
            description: If there is an exception during the semantic processing step,
              the query will fail and return the appropriate HTTP code depending on
              the error.
        description: Allows the user to choose whether a semantic call should fail
          completely, or to return partial results (default).
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - partial
          - fail
      - name: semanticMaxWaitInMilliseconds
        in: query
        description: Allows the user to set an upper bound on the amount of time it
          takes for semantic enrichment to finish processing before the request fails.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: integer
          format: int32
          minimum: 700
      - name: answers
        in: query
        x-ms-enum:
          name: QueryAnswerType
          modelAsString: true
          values:
          - value: none
            name: None
            description: Do not return answers for the query.
          - value: extractive
            name: Extractive
            description: Extracts answer candidates from the contents of the documents
              returned in response to a query expressed as a question in natural language.
        description: This parameter is only valid if the query type is `semantic`.
          If set, the query returns answers extracted from key passages in the highest
          ranked documents. The number of answers returned can be configured by appending
          the pipe character `|` followed by the `count-<number of answers>` option
          after the answers parameter value, such as `extractive|count-3`. Default
          count is 1. The confidence threshold can be configured by appending the
          pipe character `|` followed by the `threshold-<confidence threshold>` option
          after the answers parameter value, such as `extractive|threshold-0.9`. Default
          threshold is 0.7.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - none
          - extractive
      - name: captions
        in: query
        x-ms-enum:
          name: QueryCaptionType
          modelAsString: true
          values:
          - value: none
            name: None
            description: Do not return captions for the query.
          - value: extractive
            name: Extractive
            description: Extracts captions from the matching documents that contain
              passages relevant to the search query.
        description: This parameter is only valid if the query type is `semantic`.
          If set, the query returns captions extracted from key passages in the highest
          ranked documents. When Captions is set to `extractive`, highlighting is
          enabled by default, and can be configured by appending the pipe character
          `|` followed by the `highlight-<true/false>` option, such as `extractive|highlight-true`.
          Defaults to `None`.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
          enum:
          - none
          - extractive
      - name: semanticQuery
        in: query
        description: Allows setting a separate search query that will be solely used
          for semantic reranking, semantic captions and semantic answers. Is useful
          for scenarios where there is a need to use different queries between the
          base retrieval and ranking phase, and the L2 semantic phase.
        x-ms-parameter-grouping:
          name: SearchOptions
        schema:
          type: string
      x-ms-request-id: request-id
      responses:
        '200':
          description: Response containing documents that match the search criteria.
          content:
            application/json:
              schema:
                properties:
                  '@odata.count':
                    type: integer
                    format: int64
                    readOnly: true
                    x-ms-client-name: Count
                    description: The total count of results found by the search operation,
                      or null if the count was not requested. If present, the count
                      may be greater than the number of results in this response.
                      This can happen if you use the $top or $skip parameters, or
                      if the query can't return all the requested documents in a single
                      response.
                  '@search.coverage':
                    type: number
                    format: double
                    readOnly: true
                    x-ms-client-name: Coverage
                    description: A value indicating the percentage of the index that
                      was included in the query, or null if minimumCoverage was not
                      specified in the request.
                  '@search.facets':
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        properties:
                          count:
                            type: integer
                            format: int64
                            readOnly: true
                            description: The approximate count of documents falling
                              within the bucket described by this facet.
                        additionalProperties: true
                        description: A single bucket of a facet query result. Reports
                          the number of documents with a field value falling within
                          a particular range or having a particular value or interval.
                    readOnly: true
                    x-ms-client-name: Facets
                    description: The facet query results for the search operation,
                      organized as a collection of buckets for each faceted field;
                      null if the query did not include any facet expressions.
                  '@search.answers':
                    type: array
                    items:
                      x-ms-client-name: QueryAnswerResult
                      properties:
                        score:
                          type: number
                          format: double
                          readOnly: true
                          description: The score value represents how relevant the
                            answer is to the query relative to other answers returned
                            for the query.
                        key:
                          type: string
                          readOnly: true
                          description: The key of the document the answer was extracted
                            from.
                        text:
                          type: string
                          readOnly: true
                          description: The text passage extracted from the document
                            contents as the answer.
                        highlights:
                          type: string
                          readOnly: true
                          description: Same text passage as in the Text property with
                            highlighted text phrases most relevant to the query.
                          nullable: true
                      additionalProperties: true
                      description: An answer is a text passage extracted from the
                        contents of the most relevant documents that matched the query.
                        Answers are extracted from the top search results. Answer
                        candidates are scored and the top answers are selected.
                    readOnly: true
                    x-ms-client-name: Answers
                    description: The answers query results for the search operation;
                      null if the answers query parameter was not specified or set
                      to 'none'.
                    nullable: true
                  '@search.nextPageParameters':
                    readOnly: true
                    x-ms-client-name: NextPageParameters
                    description: Continuation JSON payload returned when the query
                      can't return all the requested results in a single response.
                      You can use this JSON along with @odata.nextLink to formulate
                      another POST Search request to get the next part of the search
                      response.
                    properties:
                      count:
                        type: boolean
                        description: A value that specifies whether to fetch the total
                          count of results. Default is false. Setting this value to
                          true may have a performance impact. Note that the count
                          returned is an approximation.
                        x-ms-client-name: IncludeTotalResultCount
                      facets:
                        externalDocs:
                          url: https://learn.microsoft.com/rest/api/searchservice/Search-Documents
                        type: array
                        items:
                          type: string
                        description: The list of facet expressions to apply to the
                          search query. Each facet expression contains a field name,
                          optionally followed by a comma-separated list of name:value
                          pairs.
                      filter:
                        externalDocs:
                          url: https://learn.microsoft.com/rest/api/searchservice/OData-Expression-Syntax-for-Azure-Search
                        type: string
                        description: The OData $filter expression to apply to the
                          search query.
                      highlight:
                        type: string
                        description: The comma-separated list of field names to use
                          for hit highlights. Only searchable fields can be used for
                          hit highlighting.
                        x-ms-client-name: HighlightFields
                      highlightPostTag:
                        type: string
                        description: A string tag that is appended to hit highlights.
                          Must be set with highlightPreTag. Default is &lt;/em&gt;.
                      highlightPreTag:
                        type: string
                        description: A string tag that is prepended to hit highlights.
                          Must be set with highlightPostTag. Default is &lt;em&gt;.
                      minimumCoverage:
                        type: number
                        format: double
                        description: A number between 0 and 100 indicating the percentage
                          of the index that must be covered by a search query in order
                          for the query to be reported as a success. This parameter
                          can be useful for ensuring search availability even for
                          services with only one replica. The default is 100.
                      orderby:
                        x-ms-client-name: OrderBy
                        type: string
                        description: The comma-separated list of OData $orderby expressions
                          by which to sort the results. Each expression can be either
                          a field name or a call to either the geo.distance() or the
                          search.score() functions. Each expression can be followed
                          by asc to indicate ascending, or desc to indicate descending.
                          The default is ascending order. Ties will be broken by the
                          match scores of documents. If no $orderby is specified,
                          the default sort order is descending by document match score.
                          There can be at most 32 $orderby clauses.
                      queryType:
                        description: A value that specifies the syntax of the search
                          query. The default is 'simple'. Use 'full' if your query
                          uses the Lucene query syntax.
                        type: string
                        enum:
                        - simple
                        - full
                        - semantic
                        x-ms-enum:
                          name: QueryType
                          modelAsString: false
                          values:
                          - value: simple
                            name: Simple
                            description: Uses the simple query syntax for searches.
                              Search text is interpreted using a simple query language
                              that allows for symbols such as +, * and "". Queries
                              are evaluated across all searchable fields by default,
                              unless the searchFields parameter is specified.
                          - value: full
                            name: Full
                            description: Uses the full Lucene query syntax for searches.
                              Search text is interpreted using the Lucene query language
                              which allows field-specific and weighted searches, as
                              well as other advanced features.
                          - value: semantic
                            name: Semantic
                            description: Best suited for queries expressed in natural
                              language as opposed to keywords. Improves precision
                              of search results by re-ranking the top search results
                              using a ranking model trained on the Web corpus.
                      scoringStatistics:
                        description: A value that specifies whether we want to calculate
                          scoring statistics (such as document frequency) globally
                          for more consistent scoring, or locally, for lower latency.
                          The default is 'local'. Use 'global' to aggregate scoring
                          statistics globally before scoring. Using global scoring
                          statistics can increase latency of search queries.
                        type: string
                        enum:
                        - local
                        - global
                        x-ms-enum:
                          name: ScoringStatistics
                          modelAsString: false
                          values:
                          - value: local
                            name: Local
                            description: The scoring statistics will be calculated
                              locally for lower latency.
                          - value: global
                            name: Global
                            description: The scoring statistics will be calculated
                              globally for more consistent scoring.
                      sessionId:
                        type: string
                        description: A value to be used to create a sticky session,
                          which can help getting more consistent results. As long
                          as the same sessionId is used, a best-effort attempt will
                          be made to target the same replica set. Be wary that reusing
                          the same sessionID values repeatedly can interfere with
                          the load balancing of the requests across replicas and adversely
                          affect the performance of the search service. The value
                          used as sessionId cannot start with a '_' character.
                      scoringParameters:
                        type: array
                        items:
                          type: string
                        description: The list of parameter values to be used in scoring
                          functions (for example, referencePointParameter) using the
                          format name-values. For example, if the scoring profile
                          defines a function with a parameter called 'mylocation'
                          the parameter string would be "mylocation--122.2,44.8" (without
                          the quotes).
                      scoringProfile:
                        type: string
                        description: The name of a scoring profile to evaluate match
                          scores for matching documents in order to sort the results.
                      search:
                        type: string
                        description: A full-text search query expression; Use "*"
                          or omit this parameter to match all documents.
                        x-ms-client-name: SearchText
                      searchFields:
                        type: string
                        description: The comma-separated list of field names to which
                          to scope the full-text search. When using fielded search
                          (fieldName:searchExpression) in a full Lucene query, the
                          field names of each fielded search expression take precedence
                          over any field names listed in this parameter.
                      searchMode:
                        description: A value that specifies whether any or all of
                          the search terms must be matched in order to count the document
                          as a match.
                        type: string
                        enum:
                        - any
                        - all
                        x-ms-enum:
                          name: SearchMode
                          modelAsString: false
                          values:
                          - value: any
                            name: Any
                            description: Any of the search terms must be matched in
                              order to count the document as a match.
                          - value: all
                            name: All
                            description: All of the search terms must be matched in
                              order to count the document as a match.
                      select:
                        type: string
                        description: The comma-separated list of fields to retrieve.
                          If unspecified, all fields marked as retrievable in the
                          schema are included.
                      skip:
                        type: integer
                        format: int32
                        description: The number of search results to skip. This value
