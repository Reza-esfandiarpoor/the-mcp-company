          type: string
      responses:
        '200':
          description: Success. The response describes the list of operations.
          content:
            application/json:
              schema:
                description: The result of the request to list REST API operations.
                  It contains a list of operations and a URL to get the next set of
                  results.
                properties:
                  value:
                    type: array
                    items:
                      description: Describes a REST API operation.
                      type: object
                      properties:
                        name:
                          description: The name of the operation. This name is of
                            the form {provider}/{resource}/{operation}.
                          readOnly: true
                          type: string
                        display:
                          description: The object that describes the operation.
                          readOnly: true
                          properties:
                            provider:
                              description: The friendly name of the resource provider.
                              readOnly: true
                              type: string
                            operation:
                              description: 'The operation type: read, write, delete,
                                listKeys/action, etc.'
                              readOnly: true
                              type: string
                            resource:
                              description: The resource type on which the operation
                                is performed.
                              readOnly: true
                              type: string
                            description:
                              description: The friendly name of the operation.
                              readOnly: true
