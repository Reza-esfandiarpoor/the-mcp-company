        in: query
        required: true
        description: The API version to use for each request.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: The unique identifier for a Microsoft Azure subscription. You
          can obtain this value from the Azure Resource Manager API, command line
          tools, or the portal.
        schema:
          type: string
      responses:
        '200':
          description: The admin keys were successfully retrieved and are in the response.
            You can use either the primary or secondary key as the value of the 'api-key'
            parameter in the data plane REST API or an Azure SDK to perform any operations
            on your search service, including privileged operations. Privileged operations
            include managing resources like indexes and data sources as well as uploading,
            modifying, or deleting data in your indexes.
          content:
            application/json:
              schema:
                properties:
                  primaryKey:
                    readOnly: true
                    type: string
                    description: The primary admin API key of the search service.
                  secondaryKey:
                    readOnly: true
                    type: string
                    description: The secondary admin API key of the search service.
                description: Response containing the primary and secondary admin API
                  keys for a given search service.
