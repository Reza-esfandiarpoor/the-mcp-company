        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  readOnly: true
                  type: string
                  description: Fully qualified resource ID for the resource. Ex -
                    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                name:
                  readOnly: true
                  type: string
                  description: The name of the resource
                type:
                  readOnly: true
                  type: string
                  description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                    or "Microsoft.Storage/storageAccounts"
                properties:
                  x-ms-client-flatten: true
                  description: Properties of the search service.
                  properties:
                    replicaCount:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 12
                      default: 1
                      description: The number of replicas in the search service. If
                        specified, it must be a value between 1 and 12 inclusive for
                        standard SKUs or between 1 and 3 inclusive for basic SKU.
                    partitionCount:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 12
                      default: 1
                      description: The number of partitions in the search service;
                        if specified, it can be 1, 2, 3, 4, 6, or 12. Values greater
                        than 1 are only valid for standard SKUs. For 'standard3' services
                        with hostingMode set to 'highDensity', the allowed values
                        are between 1 and 3.
                    hostingMode:
                      type: string
                      default: default
                      description: Applicable only for the standard3 SKU. You can
                        set this property to enable up to 3 high density partitions
                        that allow up to 1000 indexes, which is much higher than the
                        maximum indexes allowed for any other SKU. For the standard3
                        SKU, the value is either 'default' or 'highDensity'. For all
                        other SKUs, this value must be 'default'.
                      enum:
                      - default
                      - highDensity
