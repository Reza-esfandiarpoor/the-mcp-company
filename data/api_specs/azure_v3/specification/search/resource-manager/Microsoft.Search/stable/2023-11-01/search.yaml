  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Search/searchServices/{searchServiceName}/deleteQueryKey/{key}
  : delete:
      tags:
      - QueryKeys
      operationId: QueryKeys_Delete
      description: Deletes the specified query key. Unlike admin keys, query keys
        are not regenerated. The process for regenerating a query key is to delete
        and then recreate it.
      externalDocs:
        url: https://aka.ms/search-manage
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group within the current subscription.
          You can obtain this value from the Azure Resource Manager API or the portal.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: searchServiceName
        in: path
        required: true
        description: The name of the search service associated with the specified
          resource group.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: key
        in: path
        required: true
        description: The query key to be deleted. Query keys are identified by value,
          not by name.
        schema:
          type: string
      - name: x-ms-client-request-id
        x-ms-client-name: clientRequestId
        in: header
        required: false
        description: A client-generated GUID value that identifies this request. If
          specified, this will be included in response information as a way to track
          the request.
        x-ms-client-request-id: true
        x-ms-parameter-grouping:
          name: search-management-request-options
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: api-version
        in: query
        required: true
        description: The API version to use for each request.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: The unique identifier for a Microsoft Azure subscription. You
          can obtain this value from the Azure Resource Manager API, command line
          tools, or the portal.
        schema:
          type: string
      responses:
        '200':
          description: The query key was successfully deleted.
        '204':
          description: The query key was successfully deleted.
        '404':
          description: The subscription, resource group, search service, or query
            key could not be found.
        default:
          description: 'HTTP 409 (Conflict): The specified subscription is disabled.'
