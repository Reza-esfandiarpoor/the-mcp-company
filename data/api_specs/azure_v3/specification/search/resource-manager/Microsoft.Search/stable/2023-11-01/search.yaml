                            description: The search service is running and no provisioning
                              operations are underway.
                          - value: provisioning
                            name: Provisioning
                            description: The search service is being provisioned or
                              scaled up or down.
                          - value: deleting
                            name: Deleting
                            description: The search service is being deleted.
                          - value: degraded
                            name: Degraded
                            description: The search service is degraded because underlying
                              search units are not healthy.
                          - value: disabled
                            name: Disabled
                            description: The search service is disabled and all API
                              requests will be rejected.
                          - value: error
                            name: Error
                            description: The search service is in error state, indicating
                              either a failure to provision or to be deleted.
