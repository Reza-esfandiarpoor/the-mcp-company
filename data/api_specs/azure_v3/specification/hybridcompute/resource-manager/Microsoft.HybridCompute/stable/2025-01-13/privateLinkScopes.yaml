          description: Allows Azure Arc agents to communicate with Azure Arc services
            over both public (internet) and private endpoints.
        - value: Disabled
          description: Does not allow Azure Arc agents to communicate with Azure Arc
            services over public (internet) endpoints. The agents must use the private
            link.
