                                  - Failed
                                  x-ms-enum:
                                    name: PrivateEndpointConnectionProvisioningState
                                    modelAsString: true
                              required:
                              - privateLinkServiceConnectionState
                            identity:
                              description: The identity of the resource.
                              type: object
                              properties:
                                principalId:
                                  type: string
