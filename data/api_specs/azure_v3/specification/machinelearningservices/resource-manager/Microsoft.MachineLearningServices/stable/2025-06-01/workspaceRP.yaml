                        type: string
                        description: The error code.
                        readOnly: true
                      message:
                        type: string
                        description: The error message.
                        readOnly: true
                      target:
                        type: string
                        description: The error target.
                        readOnly: true
                      details:
                        type: array
                        description: The error details.
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              type: string
                              description: The error code.
                              readOnly: true
                            message:
                              type: string
                              description: The error message.
                              readOnly: true
                            target:
                              type: string
                              description: The error target.
                              readOnly: true
                            details:
                              type: array
                              description: The error details.
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    type: string
                                    description: The error code.
                                    readOnly: true
                                  message:
                                    type: string
                                    description: The error message.
                                    readOnly: true
                                  target:
                                    type: string
                                    description: The error target.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers:
                              - message
                              - target
                            additionalInfo:
                              type: array
                              description: The error additional info.
                              items:
                                type: object
                                description: The resource management error additional
                                  info.
                                properties:
                                  type:
                                    type: string
                                    description: The additional info type.
                                    readOnly: true
                                  info:
                                    type: object
                                    description: The additional info.
                                    readOnly: true
                              readOnly: true
                              x-ms-identifiers: []
                        readOnly: true
                        x-ms-identifiers:
                        - message
                        - target
                      additionalInfo:
                        type: array
                        description: The error additional info.
                        items:
                          type: object
                          description: The resource management error additional info.
                          properties:
                            type:
                              type: string
                              description: The additional info type.
                              readOnly: true
                            info:
                              type: object
                              description: The additional info.
                              readOnly: true
                        readOnly: true
                        x-ms-identifiers: []
      x-ms-pageable: {}
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearningServices/workspaces/{workspaceName}
  : get:
      tags:
      - Workspaces
      description: Gets the properties of the specified machine learning workspace.
      operationId: Workspaces_Get
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: workspaceName
        description: Name of Azure Machine Learning workspace.
        in: path
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{2,32}$
      responses:
        '200':
          description: The request was successful; the request was well-formed and
            received properly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Fully qualified resource ID for the resource. Ex
                      - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                    readOnly: true
                  name:
                    type: string
                    description: The name of the resource
                    readOnly: true
                  type:
                    type: string
                    description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                      or "Microsoft.Storage/storageAccounts"
                    readOnly: true
                  systemData:
                    type: object
                    description: Azure Resource Manager metadata containing createdBy
                      and modifiedBy information.
                    readOnly: true
                    properties:
                      createdBy:
                        type: string
                        description: The identity that created the resource.
                      createdByType:
                        type: string
                        description: The type of identity that created the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      createdAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource creation (UTC).
                      lastModifiedBy:
                        type: string
                        description: The identity that last modified the resource.
                      lastModifiedByType:
                        type: string
                        description: The type of identity that last modified the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      lastModifiedAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource last modification (UTC)
                  properties:
                    description: The properties of the machine learning workspace.
                    x-ms-client-flatten: true
                    type: object
                    properties:
                      workspaceId:
                        description: The immutable id associated with this workspace.
                        type: string
                        readOnly: true
                      description:
                        description: The description of this workspace.
                        type: string
                      friendlyName:
                        description: The friendly name for this workspace. This name
                          in mutable
                        type: string
                      keyVault:
                        description: ARM id of the key vault associated with this
                          workspace. This cannot be changed once the workspace has
                          been created
                        type: string
                      applicationInsights:
                        description: ARM id of the application insights associated
                          with this workspace.
                        type: string
                      containerRegistry:
                        description: ARM id of the container registry associated with
                          this workspace.
                        type: string
                        nullable: true
                      storageAccount:
                        description: ARM id of the storage account associated with
                          this workspace. This cannot be changed once the workspace
                          has been created
                        type: string
                      discoveryUrl:
                        description: Url for the discovery service to identify regional
                          endpoints for machine learning experimentation services
                        type: string
                      provisioningState:
                        type: string
                        enum:
                        - Unknown
                        - Updating
                        - Creating
                        - Deleting
                        - Succeeded
                        - Failed
                        - Canceled
                        x-ms-enum:
                          name: ProvisioningState
                          modelAsString: true
                        readOnly: true
                        description: The current deployment state of workspace resource.
                          The provisioningState is to indicate states for resource
                          provisioning.
                      encryption:
                        description: The encryption settings of Azure ML workspace.
                        properties:
                          status:
                            description: Indicates whether or not the encryption is
                              enabled for the workspace.
                            enum:
                            - Enabled
                            - Disabled
                            type: string
                            x-ms-enum:
                              name: EncryptionStatus
                              modelAsString: true
                          identity:
                            description: The identity that will be used to access
                              the key vault for encryption at rest.
                            type: object
                            properties:
                              userAssignedIdentity:
                                description: The ArmId of the user assigned identity
                                  that will be used to access the customer managed
                                  key vault
                                type: string
                          keyVaultProperties:
                            description: Customer Key vault properties.
                            properties:
                              keyVaultArmId:
                                description: The ArmId of the keyVault where the customer
                                  owned encryption key is present.
                                type: string
                              keyIdentifier:
                                description: Key vault uri to access the encryption
                                  key.
                                type: string
                              identityClientId:
                                description: For future use - The client id of the
                                  identity which will be used to access key vault.
                                type: string
                            required:
                            - keyIdentifier
                            - keyVaultArmId
                            type: object
                        required:
                        - status
                        - keyVaultProperties
                        type: object
                      hbiWorkspace:
                        type: boolean
                        description: The flag to signal HBI data in the workspace
                          and reduce diagnostic data collected by the service
                        default: false
                      serviceProvisionedResourceGroup:
                        type: string
                        description: The name of the managed resource group created
                          by workspace RP in customer subscription if the workspace
                          is CMK workspace
                        readOnly: true
                      privateLinkCount:
                        type: integer
                        format: int32
                        description: Count of private connections in the workspace
                        readOnly: true
                      provisionNetworkNow:
                        description: Set to trigger the provisioning of the managed
                          VNet with the default Options when creating a Workspace
                          with the managed VNet enabled, or else it does nothing.
                        type: boolean
                      imageBuildCompute:
                        description: The compute name for image build
                        type: string
                      allowPublicAccessWhenBehindVnet:
                        type: boolean
                        description: The flag to indicate whether to allow public
                          access when behind VNet.
                        default: false
                      publicNetworkAccess:
                        type: string
                        description: Whether requests from Public Network are allowed.
                        enum:
                        - Enabled
                        - Disabled
                        x-ms-enum:
                          modelAsString: true
                          name: PublicNetworkAccess
