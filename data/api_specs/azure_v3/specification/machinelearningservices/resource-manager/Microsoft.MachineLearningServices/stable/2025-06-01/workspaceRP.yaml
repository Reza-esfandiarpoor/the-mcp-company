                                  description: The tenant ID of the system assigned
                                    identity. This property will only be provided
                                    for a system assigned identity.
                                  readOnly: true
                                type:
                                  type: string
                                  description: Type of managed service identity (where
                                    both SystemAssigned and UserAssigned types are
                                    allowed).
                                  enum:
                                  - None
                                  - SystemAssigned
                                  - UserAssigned
                                  - SystemAssigned,UserAssigned
                                  x-ms-enum:
