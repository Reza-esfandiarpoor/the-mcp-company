  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.MachineLearningServices/workspaces/{workspaceName}/computes
  : get:
      tags:
      - OperationalizationClusters
      - MachineLearningComputes
      x-ms-pageable:
        nextLinkName: nextLink
      operationId: Compute_List
      description: Gets computes in specified workspace.
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: workspaceName
        description: Name of Azure Machine Learning workspace.
        in: path
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{2,32}$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: $skip
        description: Continuation token for pagination.
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: The response includes a paginated array of Machine Learning
            computes and a URI to the next set of results, if any. For the more information
            the limits of the number of items in a resource group, see https://azure.microsoft.com/en-us/documentation/articles/azure-subscription-service-limits/.
          content:
            application/json:
              schema:
                type: object
                description: Paginated list of Machine Learning compute objects wrapped
                  in ARM resource envelope.
                properties:
                  value:
                    type: array
                    description: An array of Machine Learning compute objects wrapped
