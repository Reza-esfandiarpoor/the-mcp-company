                          description: The name of the virtual machine size.
                          readOnly: true
                        family:
                          type: string
                          title: Virtual Machine family name
                          description: The family name of the virtual machine size.
                          readOnly: true
                        vCPUs:
                          type: integer
                          format: int32
                          title: Number of vPUs
                          description: The number of vCPUs supported by the virtual
                            machine size.
                          readOnly: true
                        gpus:
                          type: integer
                          format: int32
                          title: Number of gPUs
                          description: The number of gPUs supported by the virtual
                            machine size.
                          readOnly: true
                        osVhdSizeMB:
                          type: integer
                          format: int32
                          title: OS VHD Disk size
                          description: The OS VHD disk size, in MB, allowed by the
                            virtual machine size.
                          readOnly: true
                        maxResourceVolumeMB:
                          type: integer
                          format: int32
                          title: Resource volume size
                          description: The resource volume size, in MB, allowed by
                            the virtual machine size.
                          readOnly: true
                        memoryGB:
                          type: number
                          format: double
                          title: Memory size
                          description: The amount of memory, in GB, supported by the
                            virtual machine size.
                          readOnly: true
                        lowPriorityCapable:
                          type: boolean
                          title: Low priority capable
                          description: Specifies if the virtual machine size supports
                            low priority VMs.
                          readOnly: true
                        premiumIO:
                          type: boolean
                          title: Premium IO supported
                          description: Specifies if the virtual machine size supports
                            premium IO.
                          readOnly: true
                        estimatedVMPrices:
                          title: Estimated VM prices
                          description: The estimated price information for using a
                            VM.
                          type: object
                          properties:
                            billingCurrency:
                              type: string
                              title: Billing currency
                              description: 'Three lettered code specifying the currency
                                of the VM price. Example: USD'
                              enum:
                              - USD
                              x-ms-enum:
                                name: BillingCurrency
                                modelAsString: true
                            unitOfMeasure:
                              type: string
                              title: Unit of time measure
                              description: 'The unit of time measurement for the specified
                                VM price. Example: OneHour'
                              enum:
                              - OneHour
                              x-ms-enum:
                                name: UnitOfMeasure
                                modelAsString: true
                            values:
                              type: array
                              items:
                                type: object
                                properties:
                                  retailPrice:
                                    type: number
                                    format: double
                                    title: Retail price
                                    description: The price charged for using the VM.
                                  osType:
                                    type: string
                                    title: OS type
                                    description: Operating system type used by the
                                      VM.
                                    enum:
                                    - Linux
                                    - Windows
                                    x-ms-enum:
                                      name: VMPriceOSType
                                      modelAsString: true
                                  vmTier:
                                    type: string
                                    title: VM tier
                                    description: The type of the VM.
                                    enum:
                                    - Standard
                                    - LowPriority
                                    - Spot
                                    x-ms-enum:
                                      name: VMTier
                                      modelAsString: true
                                required:
                                - retailPrice
                                - osType
                                - vmTier
                                description: The estimated price info for using a
                                  VM of a particular OS type, tier, etc.
                              x-ms-identifiers: []
                              title: List of estimated VM prices.
                              description: The list of estimated prices for using
                                a VM of a particular OS type, tier, etc.
                          required:
                          - billingCurrency
                          - unitOfMeasure
                          - values
                        supportedComputeTypes:
                          type: array
                          items:
                            type: string
                          title: Supported Compute Types
                          description: Specifies the compute types supported by the
                            virtual machine size.
                      description: Describes the properties of a VM size.
