  /$batch:
    post:
      operationId: Query_Batch
      summary: Execute a batch of Analytics queries
      description: 'Executes a batch of Analytics queries for data.

        [Here](https://learn.microsoft.com/azure/azure-monitor/logs/api/batch-queries)

        is an example for using POST with an Analytics query.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: An array of requests.
              properties:
                requests:
                  type: array
                  description: An single request in a batch.
                  items:
                    type: object
                    description: A single request in a batch.
                    properties:
                      id:
                        type: string
                        description: Unique ID corresponding to each request in the
                          batch.
                      headers:
                        type: object
                        description: 'Headers of the request. Can use prefer header
                          to set server timeout and to

                          query statistics and visualization information.'
                        additionalProperties:
                          type: string
                      body:
                        description: 'The Analytics query. Learn more about the

                          [Analytics query syntax](https://azure.microsoft.com/documentation/articles/app-insights-analytics-reference/)'
                        type: object
                        properties:
                          query:
                            type: string
                            description: The query to execute.
                          timespan:
                            type: string
                            description: 'Optional. The timespan over which to query
                              data. This is an ISO8601 time period

                              value.  This timespan is applied in addition to any
                              that are specified in the

                              query expression.'
                          workspaces:
                            type: array
                            description: A list of workspaces to query in addition
                              to the primary workspace.
                            items:
                              type: string
                        required:
                        - query
                      path:
                        type: string
                        description: The query path of a single request in a batch.
                      method:
                        type: string
                        description: The method of a single request in a batch, defaults
                          to GET
                        default: GET
                      workspace:
                        type: string
