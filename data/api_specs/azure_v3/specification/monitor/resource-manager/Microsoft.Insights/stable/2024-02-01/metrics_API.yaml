            format. Defaults to PT1M. Special case for ''FULL'' value that returns
            single datapoint for entire time span requested.

            *Examples: PT15M, PT1H, P1D, FULL*'
          type: string
        metricNames:
          description: The names of the metrics (comma separated) to retrieve.
          type: string
        aggregation:
          description: The list of aggregation types (comma separated) to retrieve.
          type: string
        filter:
          description: "The **$filter** is used to reduce the set of metric data returned.<br>Example:<br>Metric\
            \ contains metadata A, B and C.<br>- Return all time series of C where\
            \ A = a1 and B = b1 or b2<br>**$filter=A eq \u2018a1\u2019 and B eq \u2018\
            b1\u2019 or B eq \u2018b2\u2019 and C eq \u2018*\u2019**<br>- Invalid\
            \ variant:<br>**$filter=A eq \u2018a1\u2019 and B eq \u2018b1\u2019 and\
            \ C eq \u2018*\u2019 or B = \u2018b2\u2019**<br>This is invalid because\
            \ the logical or operator cannot separate two different metadata names.<br>-\
            \ Return all time series where A = a1, B = b1 and C = c1:<br>**$filter=A\
            \ eq \u2018a1\u2019 and B eq \u2018b1\u2019 and C eq \u2018c1\u2019**<br>-\
            \ Return all time series where A = a1<br>**$filter=A eq \u2018a1\u2019\
            \ and B eq \u2018*\u2019 and C eq \u2018*\u2019**."
          type: string
        top:
          description: 'The maximum number of records to retrieve.

            Valid only if $filter is specified.

            Defaults to 10.'
          type: integer
          format: int32
        orderBy:
          description: 'The aggregation to use for sorting results and the direction
            of the sort.

            Only one order can be specified.

            Examples: sum asc.'
          type: string
        rollUpBy:
          description: Dimension name(s) to rollup results by. For example if you
            only want to see metric values with a filter like 'City eq Seattle or
            City eq Tacoma' but don't want to see separate values for each city, you
            can specify 'RollUpBy=City' to see the results for Seattle and Tacoma
