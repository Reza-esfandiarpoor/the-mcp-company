openapi: 3.0.0
info:
  title: MonitorManagementClient
  x-ms-code-generation-settings:
    name: MonitorManagementClient
  description: Azure Monitor API reference for Private Links Scopes management.
  version: 2021-09-01
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Insights/privateLinkScopes:
    get:
      description: Gets a list of all Azure Monitor PrivateLinkScopes within a subscription.
      operationId: PrivateLinkScopes_List
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: A list containing 0 or more Azure Monitor PrivateLinkScope
            definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScopeListResult'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes:
    get:
      description: Gets a list of Azure Monitor PrivateLinkScopes within a resource
        group.
      operationId: PrivateLinkScopes_ListByResourceGroup
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: A list containing 0 or more Azure Monitor PrivateLinkScope
            definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScopeListResult'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}:
    delete:
      description: Deletes a Azure Monitor PrivateLinkScope.
      operationId: PrivateLinkScopes_Delete
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      responses:
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        '204':
          description: The specified PrivateLinkScope does not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    get:
      description: Returns a Azure Monitor PrivateLinkScope.
      operationId: PrivateLinkScopes_Get
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      responses:
        '200':
          description: An Azure Monitor PrivateLinkScope definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      description: 'Creates (or updates) a Azure Monitor PrivateLinkScope. Note: You
        cannot specify a different value for InstrumentationKey nor AppId in the Put
        operation.'
      operationId: PrivateLinkScopes_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        description: Properties that need to be specified to create or update a Azure
          Monitor PrivateLinkScope.
        required: true
      responses:
        '200':
          description: Successful request when creating or updating a Azure Monitor
            PrivateLinkScope. The updated PrivateLinkScope is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        '201':
          description: Successful request when creating or updating a Azure Monitor
            PrivateLinkScope. The updated PrivateLinkScope was created and is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      description: Updates an existing PrivateLinkScope's tags. To update other fields
        use the CreateOrUpdate method.
      operationId: PrivateLinkScopes_UpdateTags
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagsResource'
        description: Updated tag information to set into the PrivateLinkScope instance.
        required: true
      responses:
        '200':
          description: Updating the Azure Monitor PrivateLinkScope's tags was successful.
            PrivateLinkScope tags are updated and returned with the rest of the PrivateLinkScope's
            object properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopeOperationStatuses/{asyncOperationId}
  : get:
      tags:
      - asyncOperations
      operationId: PrivateLinkScopeOperationStatus_Get
      description: Get the status of an azure asynchronous operation associated with
        a private link scope operation.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: asyncOperationId
        in: path
        required: true
        description: The operation Id.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK. Operation status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/privateLinkResources
  : get:
      tags:
      - PrivateLinkResources
      description: Gets the private link resources that need to be created for a Azure
        Monitor PrivateLinkScope.
      operationId: PrivateLinkResources_ListByPrivateLinkScope
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      responses:
        '200':
          description: Successfully retrieved private link resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkResourceListResult'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/privateLinkResources/{groupName}
  : get:
      tags:
      - PrivateLinkResources
      description: Gets the private link resources that need to be created for a Azure
        Monitor PrivateLinkScope.
      operationId: PrivateLinkResources_Get
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - $ref: '#/components/parameters/GroupNameParameter'
      responses:
        '200':
          description: Successfully retrieved a specified private link resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateLinkResource'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/privateEndpointConnections/{privateEndpointConnectionName}
  : get:
      tags:
      - PrivateEndpointConnections
      description: Gets a private endpoint connection.
      operationId: PrivateEndpointConnections_Get
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: privateEndpointConnectionName
        in: path
        description: The name of the private endpoint connection.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved a specified private endpoint connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnection'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - PrivateEndpointConnections
      description: Approve or reject a private endpoint connection with a given name.
      operationId: PrivateEndpointConnections_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: privateEndpointConnectionName
        in: path
        description: The name of the private endpoint connection.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateEndpointConnection'
        required: true
      responses:
        '200':
          description: Successfully approved or rejected private endpoint connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnection'
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    delete:
      tags:
      - PrivateEndpointConnections
      description: Deletes a private endpoint connection with a given name.
      operationId: PrivateEndpointConnections_Delete
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: privateEndpointConnectionName
        in: path
        description: The name of the private endpoint connection.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted private endpoint connection.
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        '204':
          description: Private endpoint connection does not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/privateEndpointConnections
  : get:
      tags:
      - PrivateEndpointConnections
      description: Gets all private endpoint connections on a private link scope.
      operationId: PrivateEndpointConnections_ListByPrivateLinkScope
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      responses:
        '200':
          description: Successfully retrieved private endpoint connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointConnectionListResult'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/scopedResources/{name}
  : get:
      tags:
      - PrivateLinkScopedResources
      description: Gets a scoped resource in a private link scope.
      operationId: PrivateLinkScopedResources_Get
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: name
        in: path
        description: The name of the scoped resource object.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved a scoped resource in a private link
            scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedResource'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - PrivateLinkScopedResources
      description: Add an Azure monitor scoped resource in the private link scope.
      operationId: PrivateLinkScopedResources_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: name
        in: path
        description: The name of the scoped resource object.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScopedResource'
        required: true
      responses:
        '200':
          description: Successfully create or updated a new azure monitor scoped resource
            in a private link scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedResource'
        '201':
          description: Successfully created a new azure monitor scoped resource in
            a private link scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedResource'
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    delete:
      tags:
      - PrivateLinkScopedResources
      description: Deletes an Azure monitor scoped resource with a given name.
      operationId: PrivateLinkScopedResources_Delete
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      - name: name
        in: path
        description: The name of the scoped resource object.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted scoped resource.
        '202':
          description: Accepted
          headers:
            Location:
              schema:
                type: string
        '204':
          description: Scoped resource does not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Insights/privateLinkScopes/{scopeName}/scopedResources
  : get:
      tags:
      - PrivateLinkScopedResources
      description: Gets all scoped resources on a private link scope.
      operationId: PrivateLinkScopedResources_ListByPrivateLinkScope
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/PrivateLinkScopeName'
      responses:
        '200':
          description: Successfully retrieved scoped resources in a private link scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopedResourceListResult'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
servers:
- url: https://management.azure.com
components:
  parameters:
    PrivateLinkScopeName:
      name: scopeName
      in: path
      required: true
      description: The name of the Azure Monitor PrivateLinkScope resource.
      x-ms-parameter-location: method
      schema:
        type: string
    GroupNameParameter:
      name: groupName
      in: path
      description: The name of the private link resource.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      required: true
      description: The API version to use for this operation.
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      required: true
      description: The ID of the target subscription.
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      required: true
      description: The name of the resource group. The name is case insensitive.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    OperationStatus:
      description: The status of operation.
      type: object
      properties:
        id:
          type: string
          description: The operation Id.
        name:
          type: string
          description: The operation name.
        startTime:
          type: string
          format: date-time
          description: Start time of the job in standard ISO8601 format.
          nullable: true
        endTime:
          type: string
          format: date-time
          description: End time of the job in standard ISO8601 format.
          nullable: true
        status:
          type: string
          description: The status of the operation.
        error:
          $ref: '#/components/schemas/ErrorDetail'
    TagsResource:
      properties:
        tags:
          additionalProperties:
            type: string
          description: Resource tags
          type: object
      description: A container holding only the Tags for a resource, allowing the
        user to update the tags on a PrivateLinkScope instance.
      type: object
    AzureMonitorPrivateLinkScope:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/AzureMonitorPrivateLinkScopeProperties'
        systemData:
          $ref: '#/components/schemas/systemData'
      required:
      - properties
      description: An Azure Monitor PrivateLinkScope definition.
    AzureMonitorPrivateLinkScopeProperties:
      description: Properties that define a Azure Monitor PrivateLinkScope resource.
      type: object
      properties:
        provisioningState:
          type: string
          description: 'Current state of this PrivateLinkScope: whether or not is
            has been provisioned within the resource group it is defined. Users cannot
            change this value but are able to read from it. Values will include Provisioning
            ,Succeeded, Canceled and Failed.'
          readOnly: true
        privateEndpointConnections:
          readOnly: true
          description: List of private endpoint connections.
          type: array
          items:
            $ref: '#/components/schemas/PrivateEndpointConnection'
        accessModeSettings:
          $ref: '#/components/schemas/AccessModeSettings'
      required:
      - accessModeSettings
    AccessModeSettings:
      type: object
      description: Properties that define the scope private link mode settings.
      properties:
        queryAccessMode:
          $ref: '#/components/schemas/AccessMode'
        ingestionAccessMode:
          $ref: '#/components/schemas/AccessMode'
        exclusions:
          description: List of exclusions that override the default access mode settings
            for specific private endpoint connections.
          type: array
          items:
            $ref: '#/components/schemas/AccessModeSettingsExclusion'
          x-ms-identifiers: []
      required:
      - queryAccessMode
      - ingestionAccessMode
    AccessModeSettingsExclusion:
      type: object
      description: Properties that define the scope private link mode settings exclusion
        item. This setting applies to a specific private endpoint connection and overrides
        the default settings for that private endpoint connection.
      properties:
        privateEndpointConnectionName:
          description: The private endpoint connection name associated to the private
            endpoint on which we want to apply the specific access mode settings.
          type: string
        queryAccessMode:
          $ref: '#/components/schemas/AccessMode'
        ingestionAccessMode:
          $ref: '#/components/schemas/AccessMode'
    AccessMode:
      description: Access mode types.
      type: string
      enum:
      - Open
      - PrivateOnly
      x-ms-enum:
        name: AccessMode
        modelAsString: true
    AzureMonitorPrivateLinkScopeListResult:
      description: Describes the list of Azure Monitor PrivateLinkScope resources.
      type: object
      required:
      - value
      properties:
        value:
          type: array
          description: List of Azure Monitor PrivateLinkScope definitions.
          items:
            $ref: '#/components/schemas/AzureMonitorPrivateLinkScope'
        nextLink:
          type: string
          description: The URI to get the next set of Azure Monitor PrivateLinkScope
            definitions if too many PrivateLinkScopes where returned in the result
            set.
    ScopedResourceListResult:
      description: A list of scoped resources in a private link scope.
      type: object
      properties:
        value:
          description: Array of results.
          type: array
          items:
            $ref: '#/components/schemas/ScopedResource'
          readOnly: true
        nextLink:
          description: Link to retrieve next page of results.
          type: string
          readOnly: true
    ScopedResource:
      $ref: '#/components/schemas/ProxyResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/ScopedResourceProperties'
        systemData:
          $ref: '#/components/schemas/systemData'
      description: A private link scoped resource
    ScopedResourceProperties:
      description: Properties of a private link scoped resource.
      type: object
      properties:
        linkedResourceId:
          description: The resource id of the scoped Azure monitor resource.
          type: string
        provisioningState:
          type: string
          description: State of the Azure monitor resource.
          readOnly: true
          enum:
          - Succeeded
          - Provisioning
          - Failed
          - Canceled
          x-ms-enum:
            name: ScopedResourceProvisioningState
            modelAsString: true
    ErrorDetail:
      description: The error detail.
      type: object
      properties:
        code:
          readOnly: true
          type: string
          description: The error code.
        message:
          readOnly: true
          type: string
          description: The error message.
        target:
          readOnly: true
          type: string
          description: The error target.
        details:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers:
          - message
          - target
          description: The error details.
        additionalInfo:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          description: The error additional info.
    ErrorAdditionalInfo:
      type: object
      properties:
        type:
          readOnly: true
          type: string
          description: The additional info type.
        info:
          readOnly: true
          type: object
          description: The additional info.
      description: The resource management error additional info.
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Resource:
      title: Resource
      description: Common fields that are returned in the response for all Azure Resource
        Manager resources
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Fully qualified resource ID for the resource. Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
        name:
          readOnly: true
          type: string
          description: The name of the resource
        type:
          readOnly: true
          type: string
          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
            or "Microsoft.Storage/storageAccounts"
      x-ms-azure-resource: true
    TrackedResource:
      $ref: '#/components/schemas/Resource'
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          x-ms-mutability:
          - read
          - create
          - update
          description: Resource tags.
        location:
          type: string
          x-ms-mutability:
          - read
          - create
          description: The geo-location where the resource lives
      required:
      - location
      title: Tracked Resource
      description: The resource model definition for an Azure Resource Manager tracked
        top level resource which has 'tags' and a 'location'
    PrivateEndpoint:
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: The ARM identifier for Private Endpoint
      description: The Private Endpoint resource.
    PrivateEndpointServiceConnectionStatus:
      type: string
      description: The private endpoint connection status.
      enum:
      - Pending
      - Approved
      - Rejected
      x-ms-enum:
        name: PrivateEndpointServiceConnectionStatus
        modelAsString: true
    PrivateLinkServiceConnectionState:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PrivateEndpointServiceConnectionStatus'
