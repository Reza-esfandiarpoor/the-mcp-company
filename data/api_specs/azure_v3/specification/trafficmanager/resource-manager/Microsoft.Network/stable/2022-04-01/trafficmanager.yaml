                name:
                  type: string
                  description: The name of the resource
                type:
                  type: string
                  description: The type of the resource. Ex- Microsoft.Network/trafficManagerProfiles.
                properties:
                  x-ms-client-flatten: true
                  description: The properties of the Traffic Manager endpoint.
                  properties:
                    targetResourceId:
                      type: string
                      description: The Azure Resource URI of the of the endpoint.
                        Not applicable to endpoints of type 'ExternalEndpoints'.
                    target:
                      type: string
                      description: The fully-qualified DNS name or IP address of the
                        endpoint. Traffic Manager returns this value in DNS responses
                        to direct traffic to this endpoint.
                    endpointStatus:
                      type: string
                      description: The status of the endpoint. If the endpoint is
                        Enabled, it is probed for endpoint health and is included
                        in the traffic routing method.
                      enum:
                      - Enabled
                      - Disabled
                      x-ms-enum:
                        name: EndpointStatus
                        modelAsString: true
                    weight:
                      type: integer
                      format: int64
                      description: The weight of this endpoint when using the 'Weighted'
                        traffic routing method. Possible values are from 1 to 1000.
                    priority:
                      type: integer
                      format: int64
                      description: The priority of this endpoint when using the 'Priority'
                        traffic routing method. Possible values are from 1 to 1000,
                        lower values represent higher priority. This is an optional
                        parameter.  If specified, it must be specified on all endpoints,
                        and no two endpoints can share the same priority value.
                    endpointLocation:
                      type: string
                      description: Specifies the location of the external or nested
                        endpoints when using the 'Performance' traffic routing method.
                    endpointMonitorStatus:
                      type: string
                      description: The monitoring status of the endpoint.
                      enum:
                      - CheckingEndpoint
                      - Online
                      - Degraded
                      - Disabled
                      - Inactive
                      - Stopped
                      - Unmonitored
                      x-ms-enum:
                        name: EndpointMonitorStatus
                        modelAsString: true
                    minChildEndpoints:
                      type: integer
                      format: int64
                      description: The minimum number of endpoints that must be available
                        in the child profile in order for the parent profile to be
                        considered available. Only applicable to endpoint of type
                        'NestedEndpoints'.
