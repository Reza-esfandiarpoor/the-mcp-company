openapi: 3.0.0
info:
  version: 2025-01-01
  title: AdvisorManagementClient
  description: REST APIs for Azure Advisor
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.Advisor/metadata/{name}:
    get:
      tags:
      - Metadata
      summary: Gets the metadata entity.
      operationId: RecommendationMetadata_Get
      parameters:
      - name: name
        in: path
        description: Name of metadata entity.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The version of the API to be used with the client request.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Successfully retrieved metadata entities
          content:
            application/json:
              schema:
                description: The metadata entity contract.
                type: object
                properties:
                  id:
                    description: The resource Id of the metadata entity.
                    type: string
                  type:
                    description: The type of the metadata entity.
                    type: string
                  name:
                    description: The name of the metadata entity.
                    type: string
                  properties:
                    description: The metadata entity properties.
                    x-ms-client-flatten: true
                    type: object
                    properties:
                      displayName:
                        description: The display name.
                        type: string
                      dependsOn:
                        description: The list of keys on which this entity depends
                          on.
                        type: array
                        items:
                          type: string
                      applicableScenarios:
                        description: The list of scenarios applicable to this metadata
                          entity.
                        type: array
                        items:
                          enum:
                          - Alerts
                          type: string
                          x-ms-enum:
                            name: Scenario
                            modelAsString: true
                      supportedValues:
                        description: The list of supported values.
                        type: array
                        items:
                          description: The metadata supported value detail.
                          type: object
                          properties:
                            id:
                              description: The id.
                              type: string
                            displayName:
                              description: The display name.
                              type: string
        '404':
          description: Client sent unknown metadata name
          x-ms-error-response: true
          content:
            application/json:
              schema:
                description: ARM error response body.
                type: object
                properties:
                  message:
                    description: Gets or sets the string that describes the error
                      in detail and provides debugging information.
                    type: string
                  code:
                    description: Gets or sets the string that can be used to programmatically
                      identify the error.
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: ARM error response body.
                    type: object
                    properties:
                      message:
                        description: Gets or sets the string that describes the error
                          in detail and provides debugging information.
                        type: string
                      code:
                        description: Gets or sets the string that can be used to programmatically
                          identify the error.
                        type: string
  /providers/Microsoft.Advisor/metadata:
    get:
      tags:
      - Metadata
      summary: Gets the list of metadata entities.
      operationId: RecommendationMetadata_List
      parameters:
      - name: api-version
        in: query
        description: The version of the API to be used with the client request.
        required: true
        schema:
          type: string
      - name: $filter
        in: query
        description: "The filter to apply to the recommendation metadata.<br>Filter\
          \ can be applied to properties ['[recommendationCategory](#category)', '[recommendationSubCategory](#recommendationSubCategory)',\
          \ 'RetirementDate'] with operators ['eq', 'and', 'le', 'ge'].<br><br>\u26A0\
          \ **Note:** `recommendationControl` is a legacy filter property and will\
          \ be deprecated in the future. Please use `recommendationSubCategory` for\
          \ filtering recommendation subcategory.<br><br>Valid options for recommendationSubCategory:\
          \ ['BusinessContinuity', 'DisasterRecovery', 'HighAvailability', 'MonitoringAndAlerting',\
          \ 'Other', 'Personalized', 'PrioritizedRecommendations', 'Scalability',\
          \ 'ServiceUpgradeAndRetirement', 'Validation']<br><br>Example:<br>- $filter=recommendationCategory\
          \ eq 'HighAvailability' and recommendationSubCategory eq 'ServiceUpgradeAndRetirement'\
          \ and retirementDate ge '2024-01-01' and retirementDate le '2028-01-01'"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK. Successfully retrieved metadata entities
          content:
            application/json:
              schema:
                description: The list of metadata entities
                type: object
                properties:
                  value:
                    description: The list of metadata entities.
                    type: array
                    items:
                      description: The metadata entity contract.
                      type: object
                      properties:
                        id:
                          description: The resource Id of the metadata entity.
                          type: string
                        type:
                          description: The type of the metadata entity.
                          type: string
                        name:
                          description: The name of the metadata entity.
                          type: string
                        properties:
                          description: The metadata entity properties.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            displayName:
                              description: The display name.
                              type: string
                            dependsOn:
                              description: The list of keys on which this entity depends
                                on.
                              type: array
                              items:
                                type: string
                            applicableScenarios:
                              description: The list of scenarios applicable to this
                                metadata entity.
                              type: array
                              items:
                                enum:
                                - Alerts
                                type: string
                                x-ms-enum:
                                  name: Scenario
                                  modelAsString: true
                            supportedValues:
                              description: The list of supported values.
                              type: array
                              items:
                                description: The metadata supported value detail.
                                type: object
                                properties:
                                  id:
                                    description: The id.
                                    type: string
                                  displayName:
                                    description: The display name.
                                    type: string
                  nextLink:
                    description: The link used to get the next page of metadata.
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: ARM error response body.
                    type: object
                    properties:
                      message:
                        description: Gets or sets the string that describes the error
                          in detail and provides debugging information.
                        type: string
                      code:
                        description: Gets or sets the string that can be used to programmatically
                          identify the error.
                        type: string
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Advisor/configurations:
    get:
      tags:
      - Configurations
      summary: Retrieve Azure Advisor configurations.
      description: Retrieve Azure Advisor configurations and also retrieve configurations
        of contained resource groups.
      operationId: Configurations_ListBySubscription
      parameters:
      - name: api-version
        in: query
        description: The version of the API to be used with the client request.
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The Azure subscription ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. Successfully retrieved zero or more configurations.
          content:
            application/json:
              schema:
                description: The list of Advisor configurations.
                type: object
                properties:
                  value:
                    description: The list of configurations.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: arm-id
                          description: Fully qualified resource ID for the resource.
                            E.g. "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
                          readOnly: true
                        name:
                          type: string
                          description: The name of the resource
                          readOnly: true
                        type:
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                          readOnly: true
                        systemData:
                          type: object
                          description: Azure Resource Manager metadata containing
                            createdBy and modifiedBy information.
                          readOnly: true
                          properties:
                            createdBy:
                              type: string
                              description: The identity that created the resource.
                            createdByType:
                              type: string
                              description: The type of identity that created the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
                                (UTC)
                        properties:
                          description: The Advisor configuration data structure.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            exclude:
                              description: 'Exclude the resource from Advisor evaluations.
                                Valid values: False (default) or True.'
                              type: boolean
                            lowCpuThreshold:
                              description: 'Minimum percentage threshold for Advisor
                                low CPU utilization evaluation. Valid only for subscriptions.
                                Valid values: 5 (default), 10, 15 or 20.'
                              enum:
                              - '5'
                              - '10'
                              - '15'
                              - '20'
                              type: string
                              x-ms-enum:
                                name: CpuThreshold
                                modelAsString: true
                            duration:
                              description: 'Minimum duration for Advisor low CPU utilization
                                evaluation. Valid only for subscriptions. Valid values:
                                7 (default), 14, 21, 30, 60 or 90.'
                              enum:
                              - '7'
                              - '14'
                              - '21'
                              - '30'
                              - '60'
                              - '90'
                              type: string
                              x-ms-enum:
                                name: Duration
                                modelAsString: true
                            digests:
                              description: Advisor digest configuration. Valid only
                                for subscriptions
                              type: array
                              items:
                                description: Advisor Digest configuration entity
                                type: object
                                properties:
                                  name:
                                    description: Name of digest configuration. Value
                                      is case-insensitive and must be unique within
                                      a subscription.
                                    type: string
                                  actionGroupResourceId:
                                    description: Action group resource id used by
                                      digest.
                                    type: string
                                  frequency:
                                    format: int32
                                    description: Frequency that digest will be triggered,
                                      in days. Value must be between 7 and 30 days
                                      inclusive.
                                    type: integer
                                  categories:
                                    description: Categories to send digest for. If
                                      categories are not provided, then digest will
                                      be sent for all categories.
                                    type: array
                                    items:
                                      enum:
                                      - HighAvailability
                                      - Security
                                      - Performance
                                      - Cost
                                      - OperationalExcellence
                                      type: string
                                      x-ms-enum:
                                        name: Category
                                        modelAsString: true
                                  language:
                                    description: Language for digest content body.
                                      Value must be ISO 639-1 code for one of Azure
                                      portal supported languages. Otherwise, it will
                                      be converted into one. Default value is English
                                      (en).
                                    type: string
                                  state:
                                    description: State of digest configuration.
                                    enum:
                                    - Active
                                    - Disabled
                                    type: string
                                    x-ms-enum:
                                      name: DigestConfigState
                                      modelAsString: true
                              x-ms-identifiers:
                              - name
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                  nextLink:
                    description: The link used to get the next page of configurations.
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: ARM error response body.
                    type: object
                    properties:
                      message:
                        description: Gets or sets the string that describes the error
                          in detail and provides debugging information.
                        type: string
                      code:
                        description: Gets or sets the string that can be used to programmatically
                          identify the error.
                        type: string
      deprecated: false
      x-ms-pageable:
        nextLinkName: nextLink
