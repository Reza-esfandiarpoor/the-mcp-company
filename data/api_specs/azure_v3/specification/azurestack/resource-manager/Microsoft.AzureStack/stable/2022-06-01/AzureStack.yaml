  /subscriptions/{subscriptionId}/providers/Microsoft.AzureStack/generateDeploymentLicense:
    post:
      tags:
      - AzureStack
      description: Creates a license that can be used to deploy an Azure Stack device.
      operationId: DeploymentLicense_Create
      parameters:
      - name: subscriptionId
        in: path
        description: Subscription credentials that uniquely identify Microsoft Azure
          subscription. The subscription ID forms part of the URI for every service
          call.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Client API Version.
        required: true
        schema:
          type: string
          default: 2017-06-01
      requestBody:
        content:
          application/json:
            schema:
              description: Request details for generating a deployment license.
              type: object
              properties:
                verificationVersion:
                  description: Signing verification public key version.
                  type: string
        description: Request body for creating a deployment license.
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: A license that can be used to deploy an Azure Stack device.
                type: object
                properties:
                  temporaryLicenseChain:
                    description: A license chain that can be used to temporarily activate
                      an Azure Stack device.
                    type: array
                    items:
                      description: An intermediate or leaf license item.
                      type: string
                  signature:
                    description: Signature of the license chain.
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Error response indicates that the service is not able
                  to process the incoming request. The reason is provided in the error
                  message.
                type: object
                properties:
                  error:
