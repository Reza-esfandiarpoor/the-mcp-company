openapi: 3.0.0
info:
  version: 2022-06-01
  title: Azure Stack Azure Bridge Client
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.AzureStack/operations:
    get:
      description: Returns the list of supported REST operations.
      tags:
      - AzureStack
      operationId: Operations_List
      parameters:
      - name: api-version
        in: query
        description: Client API Version.
        required: true
        schema:
          type: string
          default: 2017-06-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: List of Operations
                properties:
                  value:
                    description: Array of operations
                    type: array
                    items:
                      description: Describes the supported REST operation.
                      properties:
                        name:
                          description: The name of the operation being performed on
                            this particular object.
                          type: string
                        display:
                          description: Contains the localized display information
                            for this particular operation or action.
                          properties:
                            provider:
                              description: The localized, friendly version of the
                                resource provider name.
                              type: string
                            resource:
                              description: The localized, friendly version of the
                                resource type related to this action or operation;
                                the resource type should match the public documentation
                                for the resource provider.
                              type: string
                            operation:
                              description: The localized, friendly name for the operation.
                                Use the name as it will displayed to the user.
                              type: string
                            description:
                              description: The localized, friendly description for
                                the operation. The description will be displayed to
                                the user. It should be thorough and concise for used
                                in both tooltips and detailed views.
                              type: string
                        origin:
                          description: The intended executor of the operation.
                          type: string
                    x-ms-identifiers:
                    - name
                  nextLink:
                    description: URI to the next page of operations.
                    type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Error response indicates that the service is not able
                  to process the incoming request. The reason is provided in the error
                  message.
                type: object
                properties:
                  error:
                    description: The details of the error.
                    properties:
                      code:
                        description: Error code.
                        type: string
                        readOnly: true
                      message:
                        description: Error message indicating why the operation failed.
                        type: string
                        readOnly: true
                      target:
                        description: The target of the particular error.
                        type: string
                        readOnly: true
      x-ms-pageable:
        nextLinkName: nextLink
