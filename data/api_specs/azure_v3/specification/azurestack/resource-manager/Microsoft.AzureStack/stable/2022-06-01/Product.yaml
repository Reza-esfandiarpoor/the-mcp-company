          content:
            application/json:
              schema:
                description: Extended description about the product required for installing
                  it into Azure Stack.
                type: object
                properties:
                  galleryPackageBlobSasUri:
                    description: The URI to the .azpkg file that provides information
                      required for showing product in the gallery.
                    type: string
                    readOnly: true
                  productKind:
                    description: Specifies the kind of the product (virtualMachine
                      or virtualMachineExtension).
                    type: string
                    readOnly: true
                  properties:
                    type: object
                    properties:
