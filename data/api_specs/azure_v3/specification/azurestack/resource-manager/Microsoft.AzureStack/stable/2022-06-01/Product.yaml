                        description: Specifies kind of compute role included in the
                          package.
                        readOnly: true
                        type: string
                        enum:
                        - None
                        - IaaS
                        - PaaS
                        x-ms-enum:
                          name: ComputeRole
                          modelAsString: true
                      isSystemExtension:
                        description: Specifies if product is a Virtual Machine Extension.
                        type: boolean
                        readOnly: true
                      sourceBlob:
                        description: Specifies a download location where content can
                          be downloaded from.
                        x-ms-client-flatten: true
                        readOnly: true
                        type: object
                        properties:
                          uri:
                            description: The URI.
                            type: string
                            readOnly: true
                      supportMultipleExtensions:
                        description: Indicates if specified product supports multiple
                          extensions.
                        type: boolean
                        readOnly: true
                      version:
                        description: Specifies product version.
                        type: string
                        readOnly: true
                      vmOsType:
                        description: Specifies operating system used by the product.
                        readOnly: true
                        type: string
                        enum:
                        - None
                        - Windows
                        - Linux
                        x-ms-enum:
                          name: OperatingSystem
                          modelAsString: true
                      vmScaleSetEnabled:
                        description: Indicates if virtual machine Scale Set is enabled
                          in the specified product.
                        type: boolean
                        readOnly: true
                      osDiskImage:
                        description: OS disk image used by product.
                        readOnly: true
                        type: object
                        properties:
                          operatingSystem:
                            description: OS operating system type.
                            readOnly: true
                            type: string
                            enum:
                            - None
                            - Windows
                            - Linux
                            x-ms-enum:
                              name: OperatingSystem
                              modelAsString: true
                          sourceBlobSasUri:
                            description: SAS key for source blob.
                            type: string
                            readOnly: true
                      dataDiskImages:
                        description: List of attached data disks.
                        type: array
                        items:
                          description: Data disk image.
                          type: object
                          properties:
                            lun:
                              description: The LUN.
                              type: integer
                              format: int32
                              readOnly: true
                            sourceBlobSasUri:
                              description: SAS key for source blob.
