openapi: 3.0.0
info:
  version: 2018-01-01
  title: Schema of Azure API Center service events published to Azure Event Grid
  description: Describes the schema of the Azure API Center service events published
    to Azure Event Grid. This corresponds to the Data property of an EventGridEvent.
paths: {}
components:
  schemas:
    ApiCenterApiDefinitionAddedEventData:
      description: Schema of the data property of an EventGridEvent for a Microsoft.ApiCenter.ApiDefinitionAdded
        event.
      type: object
      properties:
        title:
          type: string
          description: API definition title.
        description:
          type: string
          description: API definition description.
        specification:
          type: object
          description: API specification details.
          properties:
            name:
              type: string
              description: Specification name.
            version:
              type: string
              description: Specification version.
    ApiCenterApiDefinitionUpdatedEventData:
      description: Schema of the data property of an EventGridEvent for a Microsoft.ApiCenter.ApiDefinitionUpdated
        event.
      type: object
      properties:
        title:
          type: string
          description: API definition title.
        description:
          type: string
          description: API definition description.
        specification:
          type: object
          description: API specification details.
          properties:
            name:
              type: string
              description: Specification name.
            version:
              type: string
              description: Specification version.
    ApiCenterApiSpecification:
      type: object
      description: API specification details.
      properties:
        name:
          type: string
          description: Specification name.
        version:
          type: string
          description: Specification version.
