      tags:
      - WorkspaceCollections
      operationId: WorkspaceCollections_migrate
      description: Migrates an existing Power BI Workspace Collection to a different
        resource group and/or subscription.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Gets subscription credentials which uniquely identify a Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      - name: resourceGroupName
        in: path
        description: Azure resource group
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetResourceGroup:
                  type: string
                  description: Name of the resource group the Power BI workspace collections
                    will be migrated to.
                resources:
                  type: array
                  items:
                    type: string
        description: Workspace migration request
        required: true
      responses:
        '200':
          description: Migration completed successfully
        default:
          description: Default Response. It will be deserialized as per the Error
            definition specified in the schema. Exception will be thrown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  target:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        target:
                          type: string
                    x-ms-identifiers:
                    - code
