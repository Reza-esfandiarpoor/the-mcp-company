                  default: Microsoft.PowerBI/workspaceCollections
        description: Check name availability request
        required: true
      responses:
        '200':
          description: Request completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  nameAvailable:
                    type: boolean
                    description: Specifies a Boolean value that indicates whether
                      the specified Power BI Workspace Collection name is available
