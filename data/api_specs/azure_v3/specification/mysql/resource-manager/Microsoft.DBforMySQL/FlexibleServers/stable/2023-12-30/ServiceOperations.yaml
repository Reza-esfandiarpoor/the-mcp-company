openapi: 3.0.0
info:
  title: MySQLManagementClient
  description: The Microsoft Azure management API provides create, read, update, and
    delete functionality for Azure MySQL resources including servers, databases, firewall
    rules and configurations.
  version: 2023-12-30
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/capabilities:
    get:
      tags:
      - LocationBasedCapabilities
      operationId: LocationBasedCapabilities_List
      description: Get capabilities at specified location in a given subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/capabilitySets:
    get:
      tags:
      - LocationBasedCapability
      operationId: LocationBasedCapabilitySet_List
      description: Get capabilities at specified location in a given subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitySetsList'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/capabilitySets/{capabilitySetName}:
    get:
      tags:
      - LocationBasedCapability
      operationId: LocationBasedCapabilitySet_Get
      description: Get capabilities at specified location in a given subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      - name: capabilitySetName
        in: path
        required: true
        description: Name of capability set
        schema:
          type: string
          pattern: ^[a-z0-9][-a-z0-9]*(?<!-)$
          default: default
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capability'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/checkVirtualNetworkSubnetUsage:
    post:
      tags:
      - CheckVirtualNetworkSubnetUsage
      operationId: CheckVirtualNetworkSubnetUsage_Execute
      description: Get virtual network subnet usage for a given vNet resource id.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualNetworkSubnetUsageParameter'
        description: The required parameters for creating or updating a server.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualNetworkSubnetUsageResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/checkNameAvailability:
    post:
      tags:
      - CheckNameAvailability
      operationId: CheckNameAvailability_Execute
      description: Check the availability of name for server
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      requestBody:
        $ref: '#/components/requestBodies/NameAvailabilityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameAvailability'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/checkNameAvailability:
    post:
      tags:
      - CheckNameAvailability
      operationId: CheckNameAvailabilityWithoutLocation_Execute
      description: Check the availability of name for server
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        $ref: '#/components/requestBodies/NameAvailabilityRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameAvailability'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/operationResults/{operationId}:
    get:
      tags:
      - OperationResults
      summary: Get the operation result for a long running operation.
      operationId: OperationResults_Get
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      - $ref: '#/components/parameters/OperationIdParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusExtendedResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforMySQL/locations/{locationName}/operationProgress/{operationId}:
    get:
      tags:
      - OperationProgress
      summary: Get the operation result for a long running operation.
      operationId: OperationProgress_Get
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/LocationNameParameter'
      - $ref: '#/components/parameters/parameters-OperationIdParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationProgressResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers/Microsoft.DBforMySQL/getPrivateDnsZoneSuffix:
    post:
      tags:
      - GetPrivateDnsZoneSuffix
      operationId: GetPrivateDnsZoneSuffix_Execute
      description: Get private DNS zone suffix in the cloud.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrivateDnsZoneSuffixResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers/Microsoft.DBforMySQL/operations:
    get:
      tags:
      - Operations
      operationId: Operations_List
      description: Lists all of the available REST API operations.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
servers:
- url: https://management.azure.com
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription. The value must be an UUID.
      required: true
      schema:
        type: string
        format: uuid
    LocationNameParameter:
      name: locationName
      in: path
      required: true
      description: The name of the location.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        pattern: ^[ \w]+$
    OperationIdParameter:
      name: operationId
      in: path
      required: true
      description: The operation Id.
      x-ms-parameter-location: method
      schema:
        type: string
    parameters-OperationIdParameter:
      name: operationId
      in: path
      description: The ID of an ongoing async operation.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
  requestBodies:
    NameAvailabilityRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NameAvailabilityRequest'
      description: The required parameters for checking if server name is available.
      required: true
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    VirtualNetworkSubnetUsageParameter:
      type: object
      properties:
        virtualNetworkResourceId:
          type: string
          description: Virtual network resource id.
      description: Virtual network subnet usage parameter
    DelegatedSubnetUsage:
      type: object
      properties:
        subnetName:
          type: string
          readOnly: true
          description: name of the subnet
        usage:
          type: integer
          format: int64
          readOnly: true
          description: Number of used delegated subnets
      description: Delegated subnet usage data.
    VirtualNetworkSubnetUsageResult:
      type: object
      properties:
        location:
          type: string
          readOnly: true
          description: The location name.
        subscriptionId:
          type: string
          readOnly: true
          description: The subscription id.
        delegatedSubnetsUsage:
          description: A list of delegated subnet usage
          type: array
          items:
            $ref: '#/components/schemas/DelegatedSubnetUsage'
          x-ms-identifiers: []
          readOnly: true
      description: Virtual network subnet usage data.
    SkuCapability:
      type: object
      properties:
        name:
          type: string
          description: vCore name
          readOnly: true
        vCores:
          type: integer
          format: int64
          description: supported vCores
          readOnly: true
        supportedIops:
          type: integer
          format: int64
          description: supported IOPS
          readOnly: true
        supportedMemoryPerVCoreMB:
          type: integer
          format: int64
          description: supported memory per vCore in MB
          readOnly: true
      description: Sku capability
    SkuCapabilityV2:
      type: object
      properties:
        name:
          type: string
          description: vCore name
          readOnly: true
        vCores:
          type: integer
          format: int64
          description: supported vCores
          readOnly: true
        supportedIops:
          type: integer
          format: int64
          description: supported IOPS
          readOnly: true
        supportedMemoryPerVCoreMB:
          type: integer
          format: int64
          description: supported memory per vCore in MB
          readOnly: true
        supportedZones:
          type: array
          items:
            type: string
          description: Supported zones
          readOnly: true
        supportedHAMode:
          type: array
          items:
            type: string
          description: Supported high availability mode
          readOnly: true
      description: Sku capability
    ServerVersionCapability:
      type: object
      properties:
        name:
          type: string
          description: server version
          readOnly: true
        supportedSkus:
          description: A list of supported Skus
          type: array
          items:
            $ref: '#/components/schemas/SkuCapability'
          x-ms-identifiers: []
          readOnly: true
      description: Server version capabilities.
    ServerVersionCapabilityV2:
      type: object
      properties:
        name:
          type: string
          description: server version
          readOnly: true
      description: Server version capabilities.
    StorageEditionCapability:
      type: object
      properties:
        name:
          type: string
          description: storage edition name
          readOnly: true
        minStorageSize:
          type: integer
          format: int64
          description: The minimal supported storage size.
          readOnly: true
        maxStorageSize:
          type: integer
          format: int64
          description: The maximum supported storage size.
          readOnly: true
        minBackupRetentionDays:
          type: integer
          format: int64
          description: Minimal backup retention days
          readOnly: true
        maxBackupRetentionDays:
          type: integer
          format: int64
          description: Maximum backup retention days
          readOnly: true
        minBackupIntervalHours:
          type: integer
          format: int64
          description: Minimal backup interval hours
          readOnly: true
        maxBackupIntervalHours:
          type: integer
          format: int64
          description: Maximum backup interval hours
          readOnly: true
      description: storage edition capability
    ServerEditionCapability:
      type: object
      properties:
        name:
          type: string
          description: Server edition name
          readOnly: true
        supportedStorageEditions:
          description: A list of supported storage editions
          type: array
          items:
            $ref: '#/components/schemas/StorageEditionCapability'
          x-ms-identifiers: []
          readOnly: true
        supportedServerVersions:
          description: A list of supported server versions.
          type: array
          items:
            $ref: '#/components/schemas/ServerVersionCapability'
          x-ms-identifiers: []
          readOnly: true
      description: Server edition capabilities.
    ServerEditionCapabilityV2:
      type: object
      properties:
        name:
          type: string
          description: Server edition name
          readOnly: true
        defaultSku:
          type: string
          description: Default Sku name
          readOnly: true
        defaultStorageSize:
          type: integer
          format: int32
          description: Default storage size
          readOnly: true
        supportedStorageEditions:
          description: A list of supported storage editions
          type: array
          items:
            $ref: '#/components/schemas/StorageEditionCapability'
          x-ms-identifiers: []
          readOnly: true
        supportedSkus:
          description: A list of supported Skus
          type: array
          items:
            $ref: '#/components/schemas/SkuCapabilityV2'
          x-ms-identifiers: []
          readOnly: true
      description: Server edition capabilities.
    CapabilityProperties:
      type: object
      properties:
        zone:
          type: string
          description: zone name
          readOnly: true
        supportedHAMode:
          type: array
          items:
            type: string
          description: Supported high availability mode
          readOnly: true
        supportedGeoBackupRegions:
          type: array
          items:
            type: string
          description: supported geo backup regions
          readOnly: true
        supportedFlexibleServerEditions:
          description: A list of supported flexible server editions.
          type: array
          items:
            $ref: '#/components/schemas/ServerEditionCapability'
          x-ms-identifiers: []
          readOnly: true
      description: Location capabilities.
    CapabilityPropertiesV2:
      type: object
      properties:
        supportedGeoBackupRegions:
          type: array
          items:
            type: string
          description: supported geo backup regions
          readOnly: true
        supportedFlexibleServerEditions:
          description: A list of supported flexible server editions.
          type: array
          items:
            $ref: '#/components/schemas/ServerEditionCapabilityV2'
          x-ms-identifiers: []
          readOnly: true
        supportedServerVersions:
          description: A list of supported server versions.
          type: array
          items:
            $ref: '#/components/schemas/ServerVersionCapabilityV2'
          x-ms-identifiers: []
          readOnly: true
      description: Location capability.
    Capability:
      $ref: '#/components/schemas/ProxyResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/CapabilityPropertiesV2'
      description: Represents a location capability set.
    CapabilitiesListResult:
      type: object
      properties:
        value:
          description: A list of supported capabilities.
          type: array
          items:
            $ref: '#/components/schemas/CapabilityProperties'
          x-ms-identifiers: []
          readOnly: true
        nextLink:
          description: Link to retrieve next page of results.
          type: string
          readOnly: true
      description: location capability
    CapabilitySetsList:
      type: object
      properties:
        value:
          description: A list of supported capability sets.
          type: array
          items:
            $ref: '#/components/schemas/Capability'
          x-ms-identifiers: []
          readOnly: true
        nextLink:
          description: Link to retrieve next page of results.
          type: string
          readOnly: true
      description: location capability set
    GetPrivateDnsZoneSuffixResponse:
      type: object
      properties:
        privateDnsZoneSuffix:
          type: string
          description: Represents the private DNS zone suffix.
      description: The response of get private dns zone suffix.
    NameAvailabilityRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Resource name to verify.
        type:
          type: string
          description: Resource type used for verification.
      description: Request from client to check resource name availability.
    NameAvailability:
      type: object
      properties:
        message:
          type: string
          description: Error Message.
        nameAvailable:
          type: boolean
          description: Indicates whether the resource name is available.
        reason:
          type: string
          description: Reason for name being unavailable.
      description: Represents a resource name availability.
    OperationDisplay:
      type: object
      properties:
        provider:
          type: string
          description: Operation resource provider name.
        resource:
          type: string
          description: Resource on which the operation is performed.
        operation:
          type: string
          description: Localized friendly name for the operation.
        description:
          type: string
          description: Operation description.
      description: Display metadata associated with the operation.
    Operation:
      type: object
      properties:
        name:
          type: string
          description: The name of the operation being performed on this particular
            object.
        display:
          $ref: '#/components/schemas/OperationDisplay'
        origin:
          type: string
          description: The intended executor of the operation.
        properties:
          type: object
          additionalProperties:
            type: object
          x-ms-client-flatten: false
          description: Additional descriptions for the operation.
      description: REST API operation definition.
    OperationListResult:
      description: A list of resource provider operations.
      type: object
      properties:
        value:
          description: Collection of available operation details
          uniqueItems: false
          type: array
          x-ms-identifiers: []
          items:
            $ref: '#/components/schemas/Operation'
        nextLink:
          description: URL client should use to fetch the next page (per server side
            paging).
          type: string
    ErrorDetail:
      type: object
      description: The error detail.
      properties:
        code:
          type: string
          description: The error code.
          readOnly: true
        message:
          type: string
          description: The error message.
          readOnly: true
        target:
          type: string
          description: The error target.
          readOnly: true
        details:
          type: array
          description: The error details.
          items:
            $ref: '#/components/schemas/ErrorDetail'
          readOnly: true
          x-ms-identifiers:
          - message
          - target
        additionalInfo:
          type: array
          description: The error additional info.
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          readOnly: true
          x-ms-identifiers: []
    ErrorAdditionalInfo:
      type: object
      description: The resource management error additional info.
      properties:
        type:
          type: string
          description: The additional info type.
          readOnly: true
        info:
          type: object
          description: The additional info.
          readOnly: true
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    systemData:
      type: object
      description: Metadata pertaining to creation and last modification of the resource.
      properties:
        createdBy:
          type: string
          description: The identity that created the resource.
        createdByType:
          type: string
          description: The type of identity that created the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          x-ms-enum:
            name: createdByType
            modelAsString: true
        createdAt:
          type: string
          format: date-time
          description: The timestamp of resource creation (UTC).
        lastModifiedBy:
          type: string
          description: The identity that last modified the resource.
        lastModifiedByType:
          type: string
          description: The type of identity that last modified the resource.
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          x-ms-enum:
            name: createdByType
            modelAsString: true
        lastModifiedAt:
          type: string
          format: date-time
          description: The timestamp of resource last modification (UTC)
      readOnly: true
    Resource:
      type: object
      title: Resource
      description: Common fields that are returned in the response for all Azure Resource
        Manager resources
      properties:
        id:
          type: string
          format: arm-id
          description: Fully qualified resource ID for the resource. E.g. "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
          readOnly: true
        name:
          type: string
          description: The name of the resource
          readOnly: true
        type:
          type: string
          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
            or "Microsoft.Storage/storageAccounts"
          readOnly: true
        systemData:
          $ref: '#/components/schemas/systemData'
      x-ms-azure-resource: true
    ProxyResource:
      $ref: '#/components/schemas/Resource'
      type: object
      title: Proxy Resource
      description: The resource model definition for a Azure Resource Manager proxy
        resource. It will not have tags and a location
    OperationStatusResult:
      type: object
      description: The current status of an async operation.
      properties:
        id:
          type: string
          format: arm-id
          description: Fully qualified ID for the async operation.
        resourceId:
          type: string
          format: arm-id
          description: Fully qualified ID of the resource against which the original
            async operation was started.
          readOnly: true
        name:
          type: string
          description: Name of the async operation.
        status:
          type: string
          description: Operation status.
        percentComplete:
          type: number
          description: Percent of the operation that is complete.
          minimum: 0
          maximum: 100
        startTime:
          type: string
          format: date-time
          description: The start time of the operation.
        endTime:
          type: string
          format: date-time
          description: The end time of the operation.
        operations:
          type: array
          description: The operations list.
          items:
            $ref: '#/components/schemas/OperationStatusResult'
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - status
    extendedData:
      type: object
      additionalProperties: true
      description: A name-value pair that represents extended info.
    OperationStatusExtendedResult:
      $ref: '#/components/schemas/OperationStatusResult'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/extendedData'
      description: Represents Operation Results API Response
    OperationProgressResponseType:
      description: Represents the response properties specific to the operation
      type: object
      discriminator:
        propertyName: objectType
      required:
      - objectType
      properties:
        objectType:
          description: Identifies the type of source operation
          type: string
          enum:
          - BackupAndExportResponse
          - ImportFromStorageResponse
          x-ms-enum:
            name: ObjectType
            modelAsString: true
    OperationProgressResult:
      $ref: '#/components/schemas/OperationStatusResult'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/OperationProgressResponseType'
      description: Represents Operation Results API Response
