                            readOnly: true
                            type: object
                            properties:
                              createdBy:
                                type: string
                                description: The identity that created the resource.
                              createdByType:
                                type: string
                                description: The type of identity that created the
                                  resource.
                                enum:
                                - User
                                - Application
                                - ManagedIdentity
                                - Key
                                x-ms-enum:
                                  name: createdByType
                                  modelAsString: true
                              createdAt:
                                type: string
                                format: date-time
                                description: The timestamp of resource creation (UTC).
                              lastModifiedBy:
                                type: string
                                description: The identity that last modified the resource.
                              lastModifiedByType:
                                type: string
                                description: The type of identity that last modified
                                  the resource.
                                enum:
                                - User
                                - Application
                                - ManagedIdentity
                                - Key
                                x-ms-enum:
                                  name: createdByType
                                  modelAsString: true
                              lastModifiedAt:
                                type: string
                                format: date-time
                                description: The timestamp of resource last modification
                                  (UTC)
                          properties:
                            description: Resource properties.
                            x-ms-client-flatten: true
                            type: object
                            properties:
                              groupIds:
                                type: array
                                description: The group ids for the private endpoint
                                  resource.
                                items:
                                  type: string
                                readOnly: true
                              privateEndpoint:
                                description: The private endpoint resource.
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: The ARM identifier for private endpoint.
                                    readOnly: true
                              privateLinkServiceConnectionState:
                                description: A collection of information about the
                                  state of the connection between service consumer
                                  and provider.
                                type: object
                                properties:
                                  status:
                                    description: Indicates whether the connection
                                      has been Approved/Rejected/Removed by the owner
                                      of the service.
                                    type: string
                                    enum:
                                    - Pending
                                    - Approved
                                    - Rejected
                                    x-ms-enum:
                                      name: PrivateEndpointServiceConnectionStatus
                                      modelAsString: true
                                  description:
                                    type: string
                                    description: The reason for approval/rejection
                                      of the connection.
                                  actionsRequired:
                                    type: string
                                    description: A message indicating if changes on
                                      the service provider require any updates on
                                      the consumer.
                              provisioningState:
                                description: The provisioning state of the private
                                  endpoint connection resource.
                                type: string
                                enum:
                                - Succeeded
                                - Creating
                                - Deleting
                                - Failed
                                x-ms-enum:
                                  name: PrivateEndpointConnectionProvisioningState
                                  modelAsString: true
                                readOnly: true
                            required:
                            - privateLinkServiceConnectionState
                        title: Resource
                        description: Common fields that are returned in the response
                          for all Azure Resource Manager resources
                        x-ms-azure-resource: true
                      description: PrivateEndpointConnections related properties of
                        a server.
                      readOnly: true
                    maintenanceWindow:
                      description: Maintenance window of a server.
                      x-ms-mutability:
                      - update
                      - read
                      type: object
                      properties:
                        customWindow:
                          type: string
                          description: indicates whether custom window is enabled
                            or disabled
                        startHour:
                          type: integer
                          format: int32
                          description: start hour for maintenance window
                        startMinute:
                          type: integer
                          format: int32
                          description: start minute for maintenance window
                        dayOfWeek:
                          type: integer
                          format: int32
                          description: day of week for maintenance window
                    importSourceProperties:
                      description: Source properties for import from storage.
                      type: object
                      properties:
                        storageType:
                          type: string
                          enum:
                          - AzureBlob
                          x-ms-enum:
                            name: ImportSourceStorageType
                            modelAsString: true
                          description: Storage type of import source.
                          x-ms-mutability:
                          - create
                          - read
                        storageUrl:
                          type: string
                          description: Uri of the import source storage.
                          x-ms-mutability:
                          - create
                          - read
                        sasToken:
                          type: string
                          x-ms-secret: true
                          description: Sas token for accessing source storage. Read
                            and list permissions are required for sas token.
                          x-ms-mutability:
                          - create
                        dataDirPath:
                          type: string
                          description: Relative path of data directory in storage.
                          x-ms-mutability:
                          - create
                          - read
              required:
              - location
              title: Resource
              description: Common fields that are returned in the response for all
                Azure Resource Manager resources
              x-ms-azure-resource: true
        description: The required parameters for creating or updating a server.
        required: true
      responses:
