openapi: 3.0.0
info:
  title: MySQLManagementClient
  description: The Microsoft Azure management API provides create, read, update, and
    delete functionality for Azure MySQL resources including servers, databases, firewall
    rules and configurations.
  version: 2023-12-30
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DBforMySQL/flexibleServers/{serverName}
  : put:
      tags:
      - Servers
      operationId: Servers_Create
      description: Creates a new server or updates an existing server. The update
        action will overwrite the existing server.
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serverName
        in: path
        required: true
        description: The name of the server.
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-z0-9][-a-z0-9]*(?<!-)$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: arm-id
                  description: Fully qualified resource ID for the resource. E.g.
                    "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
                  readOnly: true
                name:
                  type: string
                  description: The name of the resource
                  readOnly: true
                type:
                  type: string
                  description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                    or "Microsoft.Storage/storageAccounts"
                  readOnly: true
                systemData:
                  description: Azure Resource Manager metadata containing createdBy
                    and modifiedBy information.
                  readOnly: true
                  type: object
                  properties:
                    createdBy:
                      type: string
                      description: The identity that created the resource.
                    createdByType:
                      type: string
                      description: The type of identity that created the resource.
                      enum:
                      - User
                      - Application
                      - ManagedIdentity
                      - Key
                      x-ms-enum:
                        name: createdByType
                        modelAsString: true
                    createdAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource creation (UTC).
                    lastModifiedBy:
                      type: string
                      description: The identity that last modified the resource.
                    lastModifiedByType:
                      type: string
                      description: The type of identity that last modified the resource.
                      enum:
                      - User
                      - Application
                      - ManagedIdentity
                      - Key
                      x-ms-enum:
                        name: createdByType
                        modelAsString: true
                    lastModifiedAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource last modification (UTC)
                tags:
                  type: object
                  description: Resource tags.
                  additionalProperties:
                    type: string
                  x-ms-mutability:
                  - read
                  - create
                  - update
                location:
                  type: string
                  description: The geo-location where the resource lives
                  x-ms-mutability:
                  - read
                  - create
                identity:
                  description: The cmk identity for the server.
                  x-ms-client-flatten: true
                  type: object
                  properties:
                    principalId:
                      type: string
                      description: ObjectId from the KeyVault
                      readOnly: true
                    tenantId:
                      type: string
                      description: TenantId from the KeyVault
                      readOnly: true
                    type:
                      type: string
                      description: Type of managed service identity.
                      enum:
                      - UserAssigned
                      x-ms-enum:
                        name: ManagedServiceIdentityType
                        modelAsString: true
                    userAssignedIdentities:
                      type: object
                      additionalProperties:
                        type: object
                        description: ''
                        items:
                          type: object
                          properties:
                            principalId:
                              description: Principal Id of user assigned identity
                              type: string
                              x-ms-client-name: PrincipalId
                              readOnly: true
                            clientId:
                              description: Client Id of user assigned identity
                              type: string
                              x-ms-client-name: ClientId
                              readOnly: true
                          description: Metadata of user assigned identity.
                      description: Metadata of user assigned identity.
                sku:
                  description: The SKU (pricing tier) of the server.
                  type: object
                  properties:
                    name:
                      type: string
                      description: The name of the sku, e.g. Standard_D32s_v3.
                    tier:
                      type: string
                      description: The tier of the particular SKU, e.g. GeneralPurpose.
                      enum:
                      - Burstable
                      - GeneralPurpose
                      - MemoryOptimized
                      x-ms-enum:
                        name: ServerSkuTier
                        modelAsString: true
                  required:
                  - name
                  - tier
                properties:
                  x-ms-client-flatten: true
                  description: Properties of the server.
                  type: object
                  properties:
                    administratorLogin:
                      type: string
                      description: The administrator's login name of a server. Can
                        only be specified when the server is being created (and is
                        required for creation).
                      x-ms-mutability:
                      - create
                      - read
                    administratorLoginPassword:
                      type: string
                      x-ms-secret: true
                      format: password
                      description: The password of the administrator login (required
                        for server creation).
                      x-ms-mutability:
                      - create
                      - update
                    version:
                      description: Server version.
                      type: string
                      enum:
                      - '5.7'
                      - 8.0.21
                      x-ms-enum:
                        name: ServerVersion
                        modelAsString: true
                    availabilityZone:
                      type: string
                      description: availability Zone information of the server.
                      x-ms-mutability:
                      - create
                      - read
                    createMode:
                      type: string
                      description: The mode to create a new MySQL server.
                      enum:
                      - Default
                      - PointInTimeRestore
                      - Replica
                      - GeoRestore
                      x-ms-enum:
                        name: CreateMode
                        modelAsString: true
                      x-ms-mutability:
                      - create
                    sourceServerResourceId:
                      type: string
                      description: The source MySQL server id.
                      x-ms-mutability:
                      - create
                      - read
                    restorePointInTime:
                      type: string
                      format: date-time
                      description: Restore point creation time (ISO8601 format), specifying
                        the time to restore from.
                      x-ms-mutability:
                      - create
                    replicationRole:
                      description: The replication role.
                      type: string
                      enum:
                      - None
                      - Source
                      - Replica
                      x-ms-enum:
                        name: ReplicationRole
                        modelAsString: true
                    replicaCapacity:
                      type: integer
                      format: int32
                      minimum: 0
                      readOnly: true
                      description: The maximum number of replicas that a primary server
                        can have.
                    dataEncryption:
                      description: The Data Encryption for CMK.
                      type: object
                      properties:
                        primaryUserAssignedIdentityId:
                          type: string
                          description: Primary user identity resource id
                        primaryKeyURI:
                          type: string
                          description: Primary key uri
                        geoBackupUserAssignedIdentityId:
                          type: string
                          description: Geo backup user identity resource id as identity
                            can't cross region, need identity in same region as geo
                            backup
                        geoBackupKeyURI:
                          type: string
                          description: Geo backup key uri as key vault can't cross
                            region, need cmk in same region as geo backup
                        type:
                          type: string
                          description: The key type, AzureKeyVault for enable cmk,
                            SystemManaged for disable cmk.
                          enum:
                          - AzureKeyVault
                          - SystemManaged
                          x-ms-enum:
                            name: DataEncryptionType
                            modelAsString: false
                    state:
                      type: string
                      readOnly: true
                      description: The state of a server.
                      enum:
                      - Ready
                      - Dropping
                      - Disabled
                      - Starting
                      - Stopping
                      - Stopped
                      - Updating
                      x-ms-enum:
                        name: ServerState
                        modelAsString: true
                    fullyQualifiedDomainName:
                      type: string
                      description: The fully qualified domain name of a server.
                      readOnly: true
                    storage:
                      description: Storage related properties of a server.
                      type: object
                      properties:
                        storageSizeGB:
                          type: integer
                          format: int32
                          description: Max storage size allowed for a server.
                        iops:
                          type: integer
                          format: int32
                          description: Storage IOPS for a server.
                        autoGrow:
                          description: Enable Storage Auto Grow or not.
                          default: Disabled
                          type: string
                          enum:
                          - Enabled
                          - Disabled
                          x-ms-enum:
                            name: EnableStatusEnum
                            modelAsString: true
                        logOnDisk:
                          description: Enable Log On Disk or not.
                          default: Disabled
                          type: string
                          enum:
                          - Enabled
                          - Disabled
                          x-ms-enum:
                            name: EnableStatusEnum
                            modelAsString: true
                        storageSku:
                          type: string
                          readOnly: true
                          description: The sku name of the server storage.
                        autoIoScaling:
                          description: Enable IO Auto Scaling or not.
                          default: Enabled
                          type: string
                          enum:
                          - Enabled
                          - Disabled
                          x-ms-enum:
                            name: EnableStatusEnum
                            modelAsString: true
                    backup:
                      description: Backup related properties of a server.
                      type: object
                      properties:
                        backupRetentionDays:
                          type: integer
                          format: int32
                          description: Backup retention days for the server.
                        backupIntervalHours:
                          type: integer
                          format: int32
                          description: Backup interval hours for the server.
                        geoRedundantBackup:
                          description: Whether or not geo redundant backup is enabled.
                          default: Disabled
                          type: string
                          enum:
                          - Enabled
                          - Disabled
                          x-ms-enum:
                            name: EnableStatusEnum
                            modelAsString: true
                        earliestRestoreDate:
                          type: string
                          format: date-time
                          readOnly: true
                          description: Earliest restore point creation time (ISO8601
                            format)
                    highAvailability:
                      description: High availability related properties of a server.
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                          - Disabled
                          - ZoneRedundant
                          - SameZone
                          x-ms-enum:
                            name: HighAvailabilityMode
                            modelAsString: true
                          description: High availability mode for a server.
                        state:
                          type: string
                          readOnly: true
                          description: The state of server high availability.
                          enum:
                          - NotEnabled
                          - CreatingStandby
                          - Healthy
                          - FailingOver
                          - RemovingStandby
                          x-ms-enum:
                            name: HighAvailabilityState
                            modelAsString: true
                        standbyAvailabilityZone:
                          type: string
                          description: Availability zone of the standby server.
                    network:
                      description: Network related properties of a server.
                      x-ms-mutability:
                      - create
                      - read
                      type: object
                      properties:
                        publicNetworkAccess:
                          description: Whether or not public network access is allowed
                            for this server. Value is 'Disabled' when server has VNet
                            integration.
                          type: string
                          enum:
                          - Enabled
                          - Disabled
                          x-ms-enum:
                            name: EnableStatusEnum
                            modelAsString: true
                        delegatedSubnetResourceId:
                          type: string
                          description: Delegated subnet resource id used to setup
                            vnet for a server.
                        privateDnsZoneResourceId:
                          type: string
                          description: Private DNS zone resource id.
                    privateEndpointConnections:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: arm-id
                            description: Fully qualified resource ID for the resource.
                              E.g. "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
                            readOnly: true
                          name:
                            type: string
                            description: The name of the resource
                            readOnly: true
                          type:
                            type: string
                            description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
