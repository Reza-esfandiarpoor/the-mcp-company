                            x-ms-enum:
                              name: EnableStatusEnum
                              modelAsString: true
                          storageSku:
                            type: string
                            readOnly: true
                            description: The sku name of the server storage.
                          autoIoScaling:
                            description: Enable IO Auto Scaling or not.
                            default: Enabled
                            type: string
                            enum:
                            - Enabled
                            - Disabled
                            x-ms-enum:
                              name: EnableStatusEnum
                              modelAsString: true
                      backup:
