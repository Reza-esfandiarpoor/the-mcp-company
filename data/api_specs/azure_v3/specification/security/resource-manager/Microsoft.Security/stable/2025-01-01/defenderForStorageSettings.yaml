  /{resourceId}/providers/Microsoft.Security/defenderForStorageSettings/{settingName}/startMalwareScan:
    post:
      tags:
      - DefenderForStorage
      - Antimalware
      - Scan
      description: Initiate a Defender for Storage malware scan for the specified
        storage account.
      operationId: DefenderForStorage_StartMalwareScan
      parameters:
      - name: api-version
        in: query
        required: true
        description: API version for the operation
        schema:
          type: string
      - name: resourceId
        in: path
        required: true
        description: The identifier of the resource.
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: settingName
        in: path
        required: true
