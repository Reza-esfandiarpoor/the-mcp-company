          name: settingName
          modelAsString: true
          values:
          - value: current
            description: Name of the Defender for Storage Settings name.
        description: Defender for Storage setting name.
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-z][a-z0-9]*$
          enum:
          - current
      responses:
        '200':
          description: The status of the malware scan operation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  properties:
                    type: object
                    properties:
                      scanId:
                        type: string
                        description: The identifier of the scan.
                      scanStatus:
                        type: string
                        description: A status code of the scan operation.
                      scanStatusMessage:
                        type: string
                        description: A description of the status of the scan.
                      scanStartTime:
                        type: string
                        description: The time at which the scan had been initiated.
                      scanEndTime:
                        type: string
                        description: The time at which the scan has ended. Only available
                          for a scan which has terminated.
                      scanSummary:
                        type: object
                        description: A summary of the scan results.
                        properties:
                          blobs:
                            type: object
                            description: A summary of the scan results of the blobs
                              that were scanned.
                            properties:
                              totalBlobsScanned:
                                type: integer
                                format: int64
                                description: The total number of blobs that were scanned.
                              maliciousBlobsCount:
                                type: integer
                                format: int64
                                description: The number of malicious blobs that were
                                  detected during the scan.
                              skippedBlobsCount:
                                type: integer
                                format: int64
                                description: The number of blobs that were skipped.
                              failedBlobsCount:
                                type: integer
                                format: int64
                                description: The number of failed blob scans.
                              scannedBlobsInGB:
                                type: number
                                format: double
                                description: The number of gigabytes of data that
                                  were scanned.
                          estimatedScanCostUSD:
                            type: number
                            format: double
                            description: The estimated cost of the scan. Only available
                              for a scan which has terminated.
                description: Describes the state of a malware scan operation.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                x-ms-external: true
                type: object
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
