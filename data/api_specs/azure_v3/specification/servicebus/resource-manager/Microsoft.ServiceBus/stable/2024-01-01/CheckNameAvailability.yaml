        description: Subscription credentials that uniquely identify a Microsoft Azure
          subscription. The subscription ID forms part of the URI for every service
          call.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The Name to check the namespace name availability and
                    The namespace name can contain only letters, numbers, and hyphens.
                    The namespace must start with a letter, and it must end with a
                    letter or number.
              required:
              - name
              description: Description of a Check Name availability request properties.
        description: Parameters to check availability of the given namespace name
        required: true
      responses:
        '200':
          description: check availability returned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    readOnly: true
                    type: string
                    description: The detailed info regarding the reason associated
                      with the namespace.
                  nameAvailable:
                    type: boolean
                    description: Value indicating namespace is availability, true
                      if the namespace is available; otherwise, false.
                  reason:
                    description: The reason for unavailability of a namespace.
                    type: string
                    enum:
                    - None
                    - InvalidName
                    - SubscriptionIsDisabled
                    - NameInUse
                    - NameInLockdown
                    - TooManyNamespaceInCurrentSubscription
                    x-ms-enum:
                      name: UnavailableReason
                      modelAsString: false
                description: Description of a Check Name availability request properties.
