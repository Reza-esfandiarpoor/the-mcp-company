paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.ServiceBus/CheckNameAvailability:
    post:
      tags:
      - Namespaces
      operationId: Namespaces_CheckNameAvailability
      description: Check the give namespace name availability.
      parameters:
      - name: api-version
