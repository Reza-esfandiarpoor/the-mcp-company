  /subscriptions/{subscriptionId}/providers/Microsoft.Web/checknameavailability:
    post:
      summary: Check if a resource name is available.
      description: Description for Check if a resource name is available.
      operationId: CheckNameAvailability
      parameters:
      - name: subscriptionId
        in: path
        description: Your Azure subscription ID. This is a GUID-formatted string (e.g.
          00000000-0000-0000-0000-000000000000).
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        in: query
        description: API Version
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Resource name availability request content.
              required:
              - name
              - type
              type: object
              properties:
                name:
                  description: Resource name to verify.
                  type: string
                type:
                  description: Resource type used for verification.
                  enum:
                  - Site
                  - Slot
                  - HostingEnvironment
                  - PublishingUser
                  - Microsoft.Web/sites
                  - Microsoft.Web/sites/slots
                  - Microsoft.Web/hostingEnvironments
                  - Microsoft.Web/publishingUsers
                  type: string
                  x-ms-enum:
                    name: CheckNameResourceTypes
                    modelAsString: true
                isFqdn:
                  description: Is fully qualified domain name.
                  type: boolean
                environmentId:
                  description: Azure Resource Manager ID of the customer's selected
                    Container Apps Environment on which to host the Function app.
                    This must be of the form /subscriptions/{subscriptionId}/resourceGroups/{resourceGroup}/providers/Microsoft.App/managedEnvironments/{managedEnvironmentName}
                  type: string
        description: Name availability request.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Information regarding availability of a resource name.
                type: object
                properties:
                  nameAvailable:
                    description: <code>true</code> indicates name is valid and available.
                      <code>false</code> indicates the name is invalid, unavailable,
                      or both.
                    type: boolean
                  reason:
                    description: <code>Invalid</code> indicates the name provided
                      does not match Azure App Service naming requirements. <code>AlreadyExists</code>
                      indicates that the name is already in use and is therefore unavailable.
                    enum:
                    - Invalid
                    - AlreadyExists
                    type: string
                    x-ms-enum:
                      name: InAvailabilityReasonType
                      modelAsString: true
                  message:
                    description: If reason == invalid, provide the user with the reason
                      why the given name is invalid, and provide the resource naming
                      requirements so that the user can select a valid name. If reason
                      == AlreadyExists, explain that resource name is already in use,
                      and direct them to select a different name.
                    type: string
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                description: App Service error response.
                type: object
                properties:
                  error:
                    description: Error model.
                    type: object
                    properties:
                      code:
