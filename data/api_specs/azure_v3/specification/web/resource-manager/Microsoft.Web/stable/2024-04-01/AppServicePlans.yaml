        headers:
          description: "IP restriction rule headers.\nX-Forwarded-Host (https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Forwarded-Host#Examples).\
            \ \nThe matching logic is ..\n- If the property is null or empty (default),\
            \ all hosts(or lack of) are allowed.\n- A value is compared using ordinal-ignore-case\
            \ (excluding port number).\n- Subdomain wildcards are permitted but don't\
            \ match the root domain. For example, *.contoso.com matches the subdomain\
            \ foo.contoso.com\n but not the root domain contoso.com or multi-level\
            \ foo.bar.contoso.com\n- Unicode host names are allowed but are converted\
            \ to Punycode for matching.\n\nX-Forwarded-For (https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Forwarded-For#Examples).\n\
            The matching logic is ..\n- If the property is null or empty (default),\
            \ any forwarded-for chains (or lack of) are allowed.\n- If any address\
            \ (excluding port number) in the chain (comma separated) matches the CIDR\
            \ defined by the property.\n\nX-Azure-FDID and X-FD-HealthProbe.\nThe\
            \ matching logic is exact match."
          type: object
          additionalProperties:
            type: array
            items:
              type: string
