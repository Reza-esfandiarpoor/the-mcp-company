openapi: 3.0.0
info:
  version: 2024-04-01
  title: WebApps API Client
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Web/sites:
    get:
      tags:
      - WebApps
      summary: Get all apps for a subscription.
      description: Description for Get all apps for a subscription.
      operationId: WebApps_List
      parameters:
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAppCollection'
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Web/sites:
    get:
      tags:
      - WebApps
      summary: Gets all web, mobile, and API apps in the specified resource group.
      description: Description for Gets all web, mobile, and API apps in the specified
        resource group.
      operationId: WebApps_ListByResourceGroup
      parameters:
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - name: includeSlots
        in: query
        description: Specify <strong>true</strong> to include deployment slots in
          results. The default is false, which only gives you the production slot
          of all apps.
        schema:
          type: boolean
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAppCollection'
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Web/sites/{name}:
    get:
      tags:
      - WebApps
      summary: Gets the details of a web, mobile, or API app.
      description: Description for Gets the details of a web, mobile, or API app.
      operationId: WebApps_Get
      parameters:
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - name: name
        in: path
        description: Name of the app.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          description: Not found.
          x-ms-error-response: true
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
    put:
      tags:
      - WebApps
      summary: Creates a new web, mobile, or API app in an existing resource group,
        or updates an existing app.
      description: Description for Creates a new web, mobile, or API app in an existing
        resource group, or updates an existing app.
      operationId: WebApps_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - name: name
        in: path
        description: Unique name of the app to create or update. To create or update
          a deployment slot, use the {slot} parameter.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/Site'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '202':
          description: Asynchronous operation in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
      x-ms-long-running-operation: true
    delete:
      tags:
      - WebApps
      summary: Deletes a web, mobile, or API app, or one of the deployment slots.
      description: Description for Deletes a web, mobile, or API app, or one of the
        deployment slots.
      operationId: WebApps_Delete
      parameters:
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - name: name
        in: path
        description: Name of the app to delete.
        required: true
        schema:
          type: string
      - name: deleteMetrics
        in: query
        description: If true, web app metrics are also deleted.
        schema:
          type: boolean
      - name: deleteEmptyServerFarm
        in: query
        description: Specify false if you want to keep empty App Service plan. By
          default, empty App Service plan is deleted.
        schema:
          type: boolean
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      responses:
        '200':
          description: Successfully deleted web app.
        '204':
          description: Successfully deleted web app.
        '404':
          description: Web app not found.
          x-ms-error-response: true
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
    patch:
      tags:
      - WebApps
      summary: Creates a new web, mobile, or API app in an existing resource group,
        or updates an existing app.
      description: Description for Creates a new web, mobile, or API app in an existing
        resource group, or updates an existing app.
      operationId: WebApps_Update
      parameters:
      - $ref: '#/components/parameters/resourceGroupNameParameter'
      - name: name
        in: path
        description: Unique name of the app to create or update. To create or update
          a deployment slot, use the {slot} parameter.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/subscriptionIdParameter'
      - $ref: '#/components/parameters/apiVersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/SitePatchResource'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '202':
          description: Asynchronous operation in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        default:
          description: App Service error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultErrorResponse'
