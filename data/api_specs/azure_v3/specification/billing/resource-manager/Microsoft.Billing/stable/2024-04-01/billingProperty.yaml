        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: BillingProperty_Get
      parameters:
      - in: path
        name: subscriptionId
        description: The ID that uniquely identifies a billing subscription.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
          pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
      - in: query
        name: includeBillingCountry
        description: A flag that specifies whether or not to include billing country.
        schema:
          type: boolean
          default: false
      - in: query
        name: includeTransitionStatus
        description: A flag that specifies whether or not to include transition status
          for billing accounts with agreement type Microsoft Customer Agreement.
