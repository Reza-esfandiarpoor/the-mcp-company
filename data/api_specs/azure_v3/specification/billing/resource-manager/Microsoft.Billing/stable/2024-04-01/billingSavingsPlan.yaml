                          where the savings plan is applied. Present only for Field-led
                          or Customer-led customers.
                      customerId:
                        type: string
                        readOnly: true
                        description: Fully-qualified identifier of the customer where
                          the savings plan is applied. Present only for Partner-led
                          customers.
                      billingAccountId:
                        type: string
                        readOnly: true
                        description: Fully-qualified identifier of the billing account
                          where the savings plan is applied.
