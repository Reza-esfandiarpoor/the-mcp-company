      description: Common fields that are returned in the response for all Azure Resource
        Manager resources
      x-ms-azure-resource: true
    Amount:
      description: The amount.
      type: object
      properties:
        currency:
          description: The currency for the amount value.
          type: string
          readOnly: true
        value:
          description: The amount value. For example, if the currency is USD, then
            a value of 600 would be $600.00.
          type: number
          readOnly: true
      readOnly: true
    AddressDetails:
      description: Address details.
      required:
      - addressLine1
      - country
      type: object
      properties:
        addressLine1:
          description: Address line 1.
          minLength: 1
          type: string
        addressLine2:
          description: Address line 2.
          type: string
        addressLine3:
          description: Address line 3.
          type: string
        city:
          description: Address city.
          type: string
        companyName:
          description: Company name. Optional for MCA Individual (Pay-as-you-go).
          type: string
        country:
          description: Country code uses ISO 3166-1 Alpha-2 format.
          minLength: 1
          type: string
        district:
          description: Address district.
          type: string
        email:
          description: Email address.
          type: string
        firstName:
          description: First name. Optional for MCA Enterprise.
          type: string
        lastName:
          description: Last name. Optional for MCA Enterprise.
          type: string
        middleName:
          description: Middle name.
          type: string
        phoneNumber:
          description: Phone number.
          type: string
        postalCode:
          description: Postal code.
          type: string
        region:
          description: Address region.
          type: string
        isValidAddress:
          description: Indicates if the address is incomplete.
          type: boolean
    AzurePlan:
      description: Details of the Azure plan.
      type: object
      properties:
        productId:
          description: The ID that uniquely identifies a product.
          type: string
        skuId:
          description: The ID that uniquely identifies a sku.
          type: string
        skuDescription:
          description: The sku description.
          type: string
    IndirectRelationshipInfo:
      description: Identifies the billing profile that is linked to another billing
        profile in indirect purchase motion.
      type: object
      properties:
        billingAccountName:
          description: The billing account name of the partner or the customer for
            an indirect motion.
          type: string
        billingProfileName:
          description: The billing profile name of the partner or the customer for
            an indirect motion.
          type: string
        displayName:
          description: The display name of the partner or customer for an indirect
