openapi: 3.0.0
info:
  title: BillingManagementClient
  description: Documentation for Microsoft.Billing.
  contact:
    name: Microsoft.Billing
    url: https://learn.microsoft.com/en-us/rest/api/billing/
    email: pacebpexphot@microsoft.com
  version: 2024-04-01
paths: {}
components:
  parameters:
    billingAccountName:
      in: path
      name: billingAccountName
      description: The ID that uniquely identifies a billing account.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
    apiVersionParameter:
      in: query
      name: api-version
      description: The version of the API to be used with the client request. The
        current version is 2024-04-01.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    associatedTenantName:
      in: path
      name: associatedTenantName
      description: The ID that uniquely identifies a tenant.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
    filter:
      in: query
      name: filter
      description: The filter query option allows clients to filter a collection of
        resources that are addressed by a request URL.
      x-ms-parameter-location: method
      schema:
        type: string
    orderBy:
      in: query
      name: orderBy
      description: The orderby query option allows clients to request resources in
        a particular order.
      x-ms-parameter-location: method
      schema:
        type: string
    top:
      in: query
      name: top
      description: The top query option requests the number of items in the queried
        collection to be included in the result. The maximum supported value for top
        is 50.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int64
    skip:
      in: query
      name: skip
      description: The skip query option requests the number of items in the queried
        collection that are to be skipped and not included in the result.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int64
    count:
      in: query
      name: count
      description: The count query option allows clients to request a count of the
        matching resources included with the resources in the response.
      x-ms-parameter-location: method
      schema:
        type: boolean
    search:
      in: query
      name: search
      description: The search query option allows clients to request items within
        a collection matching a free-text search expression. search is only supported
        for string fields.
      x-ms-parameter-location: method
      schema:
        type: string
    billingProfileName:
      in: path
      name: billingProfileName
      description: The ID that uniquely identifies a billing profile.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z\d-_]{1,128}$
    customerName:
      in: path
      name: customerName
      description: The ID that uniquely identifies a customer.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z\d-_]{1,128}$
    invoiceSectionName:
      in: path
      name: invoiceSectionName
      description: The ID that uniquely identifies an invoice section.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z\d-_]{1,128}$
    departmentName:
      in: path
      name: departmentName
      description: The name of the department.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z\d-_]{1,128}$
    enrollmentAccountName:
      in: path
      name: enrollmentAccountName
      description: The name of the enrollment account.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-zA-Z\d-_]{1,128}$
    subscriptionId:
      in: path
      name: subscriptionId
      description: The ID that uniquely identifies a billing subscription.
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
    billingRequestName:
      in: path
      name: billingRequestName
      description: The ID that uniquely identifies a billing request.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
    billingRoleAssignmentName:
      in: path
      name: billingRoleAssignmentName
      description: The ID that uniquely identifies a role assignment.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{8}[-]?([a-fA-F0-9]{4}[-]?){3}[a-fA-F0-9]{12}(_[a-fA-F0-9]{8}[-]?([a-fA-F0-9]{4}[-]?){3}[a-fA-F0-9]{12})?$
    roleDefinitionName:
      in: path
      name: roleDefinitionName
      description: The ID that uniquely identifies a role definition.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
    invoiceName:
      in: path
      name: invoiceName
      description: The ID that uniquely identifies an invoice.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(H[0-9]-[A-Z0-9]+)$|^(?:([GHT]|HT){1}[A-Z0-9]{9})$|^(?:[D]{1}[A-Z0-9]{9})$|^(?:E{1}[B-Z0-9]{1}[A-Z0-9]{8})$|^(?:EA[A-Z0-9]{8})$
    productName:
      in: path
      name: productName
      description: The ID that uniquely identifies a product.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}$
