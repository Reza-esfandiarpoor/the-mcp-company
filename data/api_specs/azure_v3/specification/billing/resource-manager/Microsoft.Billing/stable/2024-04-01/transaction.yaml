info:
  title: BillingManagementClient
  description: Documentation for Microsoft.Billing.
  contact:
    name: Microsoft.Billing
    url: https://learn.microsoft.com/en-us/rest/api/billing/
    email: pacebpexphot@microsoft.com
  version: 2024-04-01
servers:
- url: https://management.azure.com
paths:
  ? /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/billingProfiles/{billingProfileName}/customers/{customerName}/transactions
  : get:
      tags:
      - Transaction
      description: Lists the billed or unbilled transactions by customer id for given
        start date and end date. Transactions include purchases, refunds and Azure
        usage charges. Unbilled transactions are listed under pending invoice Id and
        do not include tax. Tax is added to the amount once an invoice is generated.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: Transactions_ListByCustomer
      parameters:
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: path
        name: billingProfileName
        description: The ID that uniquely identifies a billing profile.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z\d-_]{1,128}$
      - in: path
        name: customerName
        description: The ID that uniquely identifies a customer.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z\d-_]{1,128}$
      - in: query
        name: periodStartDate
        description: The start date to fetch the transactions. The date should be
          specified in MM-DD-YYYY format.
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: periodEndDate
        description: The end date to fetch the transactions. The date should be specified
          in MM-DD-YYYY format.
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: type
        description: The type of transaction.
        required: true
        x-ms-enum:
          name: TransactionType
          modelAsString: true
        schema:
          type: string
          enum:
          - Other
          - Billed
          - Unbilled
      - in: query
