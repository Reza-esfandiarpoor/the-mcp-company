  /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/billingProfiles/{billingProfileName}/transactions:
    get:
      tags:
      - Transaction
      description: Lists the billed or unbilled transactions by billing profile name
        for given start and end date. Transactions include purchases, refunds and
        Azure usage charges. Unbilled transactions are listed under pending invoice
        Id and do not include tax. Tax is added to the amount once an invoice is generated.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: Transactions_ListByBillingProfile
      parameters:
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: path
        name: billingProfileName
        description: The ID that uniquely identifies a billing profile.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z\d-_]{1,128}$
      - in: query
        name: periodStartDate
        description: The start date to fetch the transactions. The date should be
          specified in MM-DD-YYYY format.
        required: true
        schema:
