  /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/downloadDocuments:
    post:
      tags:
      - Invoice
      description: Gets a URL to download multiple invoice documents (invoice pdf,
        tax receipts, credit notes) as a zip file. The operation is supported for
        billing accounts with agreement type Microsoft Partner Agreement or Microsoft
        Customer Agreement.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: Invoices_DownloadDocumentsByBillingAccount
      parameters:
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: query
        name: api-version
        description: The version of the API to be used with the client request. The
          current version is 2024-04-01.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                description: A list of download details for individual documents.
                type: object
                properties:
                  documentName:
                    description: The ID that uniquely identifies an invoice document.
                      This ID may be an identifier for an invoice PDF, a credit note,
                      or a tax receipt. If omitted, the most recent invoice PDF for
                      the invoice will be returned.
                    type: string
                  invoiceName:
                    description: The ID that uniquely identifies an invoice.
                    type: string
              x-ms-identifiers: []
        description: A list of download details for individual documents.
        required: true
      responses:
        '200':
          description: A secure URL that can be used to download a an entity until
            the URL expires.
          content:
            application/json:
              schema:
                description: A secure URL that can be used to download a an entity
                  until the URL expires.
                type: object
                properties:
                  expiryTime:
                    description: The time in UTC when the download URL will expire.
                    type: string
                    readOnly: true
                  url:
                    description: The URL to the PDF or .zip file.
