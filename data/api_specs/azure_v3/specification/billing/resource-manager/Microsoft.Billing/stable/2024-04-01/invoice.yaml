paths:
  /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/billingProfiles/{billingProfileName}/invoices:
    get:
      tags:
      - Invoice
      description: Lists the invoices for a billing profile for a given start date
        and end date. The operation is supported for billing accounts with agreement
        type Microsoft Partner Agreement or Microsoft Customer Agreement.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: Invoices_ListByBillingProfile
      parameters:
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: path
        name: billingProfileName
        description: The ID that uniquely identifies a billing profile.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z\d-_]{1,128}$
      - in: query
        name: periodStartDate
        description: The start date of the billing period for which the invoice is
          generated. The date is in MM-DD-YYYY format.
        schema:
          type: string
          format: date
      - in: query
        name: periodEndDate
        description: The end date of the billing period for which the invoice is generated.
          The date is in MM-DD-YYYY format.
        schema:
