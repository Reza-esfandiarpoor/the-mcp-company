  /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/billingProfiles/{billingProfileName}/reservations:
    get:
      tags:
      - Reservations
      operationId: Reservations_ListByBillingProfile
      description: Lists the reservations for a billing profile and the roll up counts
        of reservations group by provisioning state.
      parameters:
      - in: query
        name: api-version
        description: The version of the API to be used with the client request. The
          current version is 2024-04-01.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: path
        name: billingProfileName
        description: The ID that uniquely identifies a billing profile.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z\d-_]{1,128}$
      - in: query
        name: filter
        description: The filter query option allows clients to filter a collection
          of resources that are addressed by a request URL.
        x-ms-parameter-location: method
        schema:
          type: string
      - in: query
        name: orderBy
        description: The orderby query option allows clients to request resources
          in a particular order.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: skiptoken
        description: The number of reservations to skip from the list before returning
          results
        in: query
        x-ms-parameter-location: method
        required: false
        schema:
          type: number
      - name: refreshSummary
        description: To indicate whether to refresh the roll up counts of the reservations
          group by provisioning states
        in: query
        x-ms-parameter-location: method
        required: false
        schema:
          type: string
      - name: selectedState
        description: The selected provisioning state
        in: query
        x-ms-parameter-location: method
        required: false
        schema:
          type: string
      - name: take
        description: The number of reservations to return in API response.
        in: query
        x-ms-parameter-location: method
        required: false
        schema:
          type: number
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
