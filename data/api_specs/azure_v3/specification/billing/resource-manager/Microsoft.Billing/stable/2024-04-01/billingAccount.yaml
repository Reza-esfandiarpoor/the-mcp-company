  /providers/Microsoft.Billing/billingAccounts:
    get:
      tags:
      - BillingAccount
      description: Lists the billing accounts that a user has access to.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: BillingAccounts_List
      parameters:
      - in: query
        name: includeAll
        description: 'When true, results will include Billing Accounts that the user
          does not have a direct role assignment on if the user has one of the following
          AAD roles: Global Administrator, Global Reader, Billing Administrator.'
        schema:
          type: boolean
          default: false
      - in: query
        name: includeAllWithoutBillingProfiles
        description: 'When true, results will include Billing Accounts that are not
          fully created if the user has one of the following AAD roles: Global Administrator,
          Global Reader, Billing Administrator.'
        schema:
          type: boolean
          default: false
      - in: query
        name: includeDeleted
        description: When true, results will include any billing accounts in a deleted
          state.
        schema:
          type: boolean
          default: false
      - in: query
        name: includePendingAgreement
        description: Includes billing accounts with agreement pending signature that
          the user has access to.
        schema:
          type: boolean
          default: false
      - in: query
        name: includeResellee
        description: Includes the customer's billing account of Microsoft Partner
          Agreement that the user has access to.
