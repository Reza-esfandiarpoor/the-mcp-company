  /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/addPaymentTerms:
    post:
      tags:
      - BillingAccount
      description: Adds payment terms to all the billing profiles under the billing
        account. Currently, payment terms can be added only on billing accounts that
        have Agreement Type as 'Microsoft Customer Agreement' and AccountType as 'Enterprise'.
        This action needs pre-authorization and only Field Sellers are authorized
        to add the payment terms and is not a self-serve action.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: BillingAccounts_AddPaymentTerms
      parameters:
      - in: path
        name: billingAccountName
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^([0-9]+|([Pp][Cc][Nn]\.[A-Za-z0-9]+)|[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}(:[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}_[0-9]{4}(-[0-9]{2}){2})?)$
      - in: query
        name: api-version
