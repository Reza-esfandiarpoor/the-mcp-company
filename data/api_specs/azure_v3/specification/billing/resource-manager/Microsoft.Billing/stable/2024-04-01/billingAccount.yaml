        content:
          application/json:
            schema:
              type: array
              items:
                description: The properties of payment term.
                type: object
                properties:
                  term:
                    description: Represents duration in netXX format. Always in days.
                    type: string
                  startDate:
                    format: date-time
                    description: The date on when the defined 'Payment Term' will
                      be effective from and is always in UTC.
                    type: string
                  endDate:
                    format: date-time
                    description: The date on when the defined 'Payment Term' will
                      end and is always in UTC.
                    type: string
                  isDefault:
                    description: Indicates payment term is the standard payment term.
                    type: boolean
                    readOnly: true
              x-ms-identifiers: []
        description: The properties of payment term.
        required: true
