servers:
- url: https://management.azure.com
paths:
  ? /providers/Microsoft.Billing/billingAccounts/{billingAccountName}/billingProfiles/{billingProfileName}/billingSubscriptions/{billingSubscriptionName}
  : get:
      tags:
      - BillingSubscription
      description: Gets a subscription by its billing profile and ID. The operation
        is supported for billing accounts with agreement type Enterprise Agreement.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/billing/
      operationId: BillingSubscriptions_GetByBillingProfile
      parameters:
      - name: billingAccountName
        in: path
        description: The ID that uniquely identifies a billing account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: billingProfileName
        in: path
        description: The ID that uniquely identifies a billing profile.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: billingSubscriptionName
        in: path
        description: The ID that uniquely identifies a subscription.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - in: query
        name: api-version
        description: The version of the API to be used with the client request. The
          current version is 2024-04-01.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - in: query
        name: expand
