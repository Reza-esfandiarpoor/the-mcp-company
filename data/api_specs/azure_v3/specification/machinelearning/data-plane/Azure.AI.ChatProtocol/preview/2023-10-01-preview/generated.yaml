info:
  title: Azure ML Chat
  version: 2023-10-01-preview
  description: Azure APIs for the Azure Chat protocol.
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      default: none
security:
- ApiKeyAuth: []
- OAuth2Auth: []
tags: []
paths:
  /{operationRoute}:
    post:
      operationId: Chat_CreateStreaming
      description: Creates a new streaming chat completion.
      parameters:
      - name: operationRoute
        in: path
        description: The route where the endpoint exposes the chat operations.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          default: chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The configuration for a streaming chat completion request.
              properties:
                messages:
                  type: array
                  description: The collection of context messages associated with
                    this completion request.
                  items:
                    type: object
                    description: A single, role-attributed message within a chat completion
                      interaction.
                    properties:
                      kind:
                        description: The type of the message. If not specified, the
                          message is assumed to be text.
                        type: string
                        enum:
                        - text
                        x-ms-enum:
                          name: MessageKind
                          modelAsString: true
                          values:
                          - name: text
                            value: text
                            description: The message context is text.
                      role:
                        description: The role associated with the message.
                        type: string
                        enum:
                        - user
                        - system
                        - assistant
                        x-ms-enum:
                          name: ChatRole
                          modelAsString: true
                          values:
                          - name: user
                            value: user
                            description: The role that provides input to the completion.
                          - name: system
                            value: system
                            description: The role that instructs or configures the
                              behavior of the assistant.
                          - name: assistant
                            value: assistant
                            description: The role that provides responses to the system-instructed,
                              user-prompted input.
                      sessionState:
                        description: 'Field that allows the chat app to store and
                          retrieve data, the structure of such data is dependant on
                          the backend

                          being used. The client must send back the data in this field
                          unchanged in subsequent requests, until the chat app

                          sends a new one. The data in this field can be used to implement
                          stateful services, such as remembering previous

                          conversations or user preferences.'
                    discriminator:
                      propertyName: kind
                    required:
                    - kind
                    - role
                stream:
                  type: boolean
                  description: Indicates whether the completion is a streaming or
                    non-streaming completion.
                  enum:
                  - true
                sessionState:
                  description: 'Field that allows the chat app to store and retrieve
                    data, the structure of such data is dependant on the backend

                    being used. The client must send back the data in this field unchanged
                    in subsequent requests, until the chat app

                    sends a new one. The data in this field can be used to implement
                    stateful services, such as remembering previous

                    conversations or user preferences.'
                context:
                  type: object
                  description: 'Context allows the chat app to receive extra parameters
                    from the client, such as temperature, functions, or

                    customer_info. These parameters are specific to the chat app and
                    not understood by the generic clients.'
                  additionalProperties: {}
              required:
              - messages
              - stream
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                description: A single response to a streaming completion request.
                properties:
                  choices:
                    type: array
                    description: The collection of choice deltas received in this
                      chunk.
                    items:
                      type: object
                      description: The representation of an incremental choice received
                        in a streaming completion.
                      properties:
                        index:
                          type: integer
                          format: int64
                          description: The index of the of the chat choice, relative
                            to the other choices in the same completion.
                        delta:
                          description: The partial message received for this choice.
                          type: object
                          properties:
                            kind:
                              description: The type of the message. If not specified,
                                the message is assumed to be text.
                              type: string
                              enum:
                              - text
                              x-ms-enum:
                                name: MessageKind
                                modelAsString: true
                                values:
                                - name: text
                                  value: text
                                  description: The message context is text.
                            role:
                              description: The role associated with the message.
                              type: string
                              enum:
                              - user
                              - system
                              - assistant
                              x-ms-enum:
                                name: ChatRole
                                modelAsString: true
                                values:
                                - name: user
                                  value: user
                                  description: The role that provides input to the
                                    completion.
                                - name: system
                                  value: system
                                  description: The role that instructs or configures
                                    the behavior of the assistant.
                                - name: assistant
                                  value: assistant
                                  description: The role that provides responses to
                                    the system-instructed, user-prompted input.
                            sessionState:
                              description: 'Field that allows the chat app to store
                                and retrieve data, the structure of such data is dependant
                                on the backend

                                being used. The client must send back the data in
                                this field unchanged in subsequent requests, until
                                the chat app

                                sends a new one. The data in this field can be used
                                to implement stateful services, such as remembering
                                previous

                                conversations or user preferences.'
                          discriminator:
                            propertyName: kind
                          required:
                          - kind
                        sessionState:
                          description: 'Field that allows the chat app to store and
                            retrieve data, the structure of such data is dependant
                            on the backend

                            being used. The client must send back the data in this
                            field unchanged in subsequent requests, until the chat
                            app

                            sends a new one. The data in this field can be used to
                            implement stateful services, such as remembering previous

                            conversations or user preferences.'
                        context:
                          type: object
                          description: 'Context allows the chat app to receive extra
                            parameters from the client, such as temperature, functions,
                            or

                            customer_info. These parameters are specific to the chat
                            app and not understood by the generic clients.'
                          additionalProperties: {}
                        finishReason:
                          description: The reason this chat completion completed its
                            generation.
                          type: string
                          enum:
                          - stop
                          - length
                          x-ms-enum:
                            name: FinishReason
                            modelAsString: true
                            values:
                            - name: stopped
                              value: stop
                              description: Completion ended normally.
                            - name: tokenLimitReached
                              value: length
                              description: The completion exhausted available tokens
                                before generation could complete.
                      required:
                      - index
                      - delta
                required:
                - choices
