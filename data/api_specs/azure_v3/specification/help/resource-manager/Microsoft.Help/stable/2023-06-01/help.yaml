  /{scope}/providers/Microsoft.Help/checkNameAvailability:
    post:
      tags:
      - diagnostics
      description: This API is used to check the uniqueness of a resource name used
        for a diagnostic check.
      operationId: Diagnostics_CheckNameAvailability
      parameters:
      - name: scope
        in: path
        required: true
        description: This is an extension resource provider and only resource level
          extension is supported at the moment.
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        x-ms-parameter-location: client
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The check availability request body.
              properties:
                name:
                  type: string
                  description: The name of the resource for which availability needs
                    to be checked.
                type:
                  type: string
                  description: The resource type.
        description: The required parameters for availability check.
      responses:
        '200':
          description: Response for the availability of the requested resource name.
          content:
            application/json:
              schema:
                description: Response for whether the requested resource name is available
                  or not.
                type: object
                properties:
                  nameAvailable:
                    description: Returns true or false depending on the availability
                      of the name
                    type: boolean
                  reason:
                    description: Reason for why value is not available. This field
                      is returned if nameAvailable is false.
                    type: string
                  message:
                    description: Gets an error message explaining the 'reason' value
                      with more details. This field is returned iif nameAvailable
                      is false.
                    type: string
