  /{scope}/providers/Microsoft.Help/diagnostics/{diagnosticsResourceName}:
    put:
      tags:
      - diagnostics
      description: "Diagnostics tells you precisely the root cause of the issue and\
        \ how to address it. You can get diagnostics once you discover and identify\
        \ the relevant solution for your Azure issue.<br/><br/> You can create diagnostics\
        \ using the \u2018solutionId\u2019  from Solution Discovery API response and\
        \ \u2018additionalParameters\u2019 <br/><br/> <b>Note: </b>\u2018requiredParameterSets\u2019\
        \ from Solutions Discovery API response must be passed via \u2018additionalParameters\u2019\
        \ as an input to Diagnostics API"
