  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Maps/accounts/{accountName}/listSas:
    post:
      tags:
      - Accounts
      description: "Create and list an account shared access signature token. Use\
        \ this SAS token for authentication to Azure Maps REST APIs through various\
        \ Azure Maps SDKs. As prerequisite to create a SAS Token. \n\nPrerequisites:\n\
        1. Create or have an existing User Assigned Managed Identity in the same Azure\
        \ region as the account. \n2. Create or update an Azure Map account with the\
        \ same Azure region as the User Assigned Managed Identity is placed."
      operationId: Accounts_ListSas
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group. The name is case insensitive.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: accountName
        in: path
        description: The name of the Maps Account.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Parameters used to create an account Shared Access Signature
                (SAS) token. The REST API access control is provided by Azure Maps
                Role Based Access (RBAC) identity and access.
              type: object
              properties:
                signingKey:
                  type: string
                  description: The Map account key to use for signing. Picking `primaryKey`
                    or `secondaryKey` will use the Map account Shared Keys, and using
                    `managedIdentity` will use the auto-renewed private key to sign
                    the SAS.
                  enum:
                  - primaryKey
                  - secondaryKey
                  - managedIdentity
                  x-ms-enum:
                    name: SigningKey
                    modelAsString: true
                principalId:
                  description: The principal Id also known as the object Id of a User
                    Assigned Managed Identity currently assigned to the Map Account.
                    To assign a Managed Identity of the account, use operation Create
                    or Update an assign a User Assigned Identity resource Id.
                  type: string
                regions:
                  type: array
                  items:
                    type: string
                  description: 'Optional, allows control of which region locations
                    are permitted access to Azure Maps REST APIs with the SAS token.
                    Example: "eastus", "westus2". Omitting this parameter will allow
                    all region locations to be accessible.'
                maxRatePerSecond:
                  type: integer
                  minimum: 0
                  maximum: 500
                  default: 500
                  format: int32
                  exclusiveMinimum: true
                  description: Required parameter which represents the desired maximum
                    request per second to allowed for the given SAS token. This does
                    not guarantee perfect accuracy in measurements but provides application
                    safe guards of abuse with eventual enforcement.
                start:
                  description: The date time offset of when the token validity begins.
                    For example "2017-05-24T10:42:03.1567373Z". Maximum duration allowed
                    is 24 hours between `start` and `expiry`.
                  type: string
                expiry:
                  description: The date time offset of when the token validity expires.
                    For example "2017-05-24T10:42:03.1567373Z". Maximum duration allowed
                    is 24 hours between `start` and `expiry`.
                  type: string
              required:
              - signingKey
              - principalId
              - maxRatePerSecond
              - start
              - expiry
