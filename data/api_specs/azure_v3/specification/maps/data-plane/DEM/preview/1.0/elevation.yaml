  /elevation/lattice/{format}:
    get:
      summary: Get Elevation Data at Equally Spaced Locations Within a Bounding Box
      description: ">[!Important]\n>The Azure Maps Elevation services and Render V2\
        \ DEM tiles have been retired and will no longer be available and supported\
        \ after 5 May 2023. All other Azure Maps APIs, Services and TilesetIDs are\
        \ unaffected by this retirement. For more details, see [Elevation Services\
        \ Retirement](https://azure.microsoft.com/en-us/updates/azure-maps-elevation-apis-and-render-v2-dem-tiles-will-be-retired-on-5-may-2023/).\n\
        \n\n**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\
        \nThe Get Data for Bounding Box API provides elevation data at equally spaced\
        \ locations within a bounding box. A bounding box is defined by the coordinates\
        \ for two corners (southwest, northeast) and then subsequently  divided into\
        \ rows and columns.\n\n Elevations are returned for the vertices of the grid\
        \ created by the rows and  columns. Up to 2,000 elevations can be returned\
        \ in a single request. The returned elevation values are ordered,  starting\
        \ at the southwest corner, and then proceeding west to east along the row.\
        \ At the end of the row,  it moves north to the next row, and repeats the\
        \ process until it reaches the far northeast corner."
      operationId: Elevation_GetDataForBoundingBox
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Indicates the account intended for use with the Microsoft Entra
          ID security model. This unique ID for the Azure Maps account can be obtained
          from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
          For more information on using Microsoft Entra ID security in Azure Maps,
          see [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
          default: '1.0'
      - name: format
        description: Desired format of the response. Only `json` format is supported.
        in: path
        required: true
        x-ms-enum:
          name: JsonFormat
          modelAsString: true
          values:
          - value: json
            description: '[The JavaScript Object Notation Data Interchange Format](https://tools.ietf.org/html/rfc8259)'
        x-ms-client-default: json
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - json
      - name: bounds
        in: query
        description: 'The string that represents the rectangular area of a bounding
          box. The bounds parameter is defined by the 4 bounding box coordinates,
          with WGS84 longitude and latitude of the southwest corner followed by  WGS84
          longitude and latitude of the northeast corner. The string is presented
          in the following  format: `[SouthwestCorner_Longitude, SouthwestCorner_Latitude,
          NortheastCorner_Longitude,  NortheastCorner_Latitude]`.'
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
      - name: rows
        in: query
        description: 'Specifies the number of rows to use to divide the bounding box
          area into a grid. The number of vertices (rows x columns) in the grid should
          be less than 2,000. '
        required: true
        schema:
          type: integer
          minimum: 2
          maximum: 1000
      - name: columns
        in: query
        description: 'Specifies the number of columns to use to divide the bounding
          box area into a grid. The number of vertices (rows x columns) in the grid
          should be less than 2,000. '
        required: true
        schema:
          type: integer
          minimum: 2
          maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The response from a successful Get Data for Bounding
                  Box API.
                properties:
                  data:
                    x-ms-client-name: elevations
                    description: The response for point/points elevation API. The
                      result will be in same sequence of points listed in request.
                    type: array
                    readOnly: true
                    items:
                      type: object
                      description: The elevation data.
                      properties:
                        coordinate:
                          description: A location represented as a latitude and longitude.
                          type: object
                          properties:
                            latitude:
                              description: Latitude property
                              type: number
                              format: double
                            longitude:
                              description: Longitude property
                              type: number
                              format: double
                        elevationInMeter:
                          description: The elevation value in meters.
                          type: number
                          readOnly: true
        default:
