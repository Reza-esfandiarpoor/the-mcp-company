openapi: 3.0.0
info:
  title: Azure Maps Elevation API
  version: '1.0'
  description: The Azure Maps Elevation API provides an HTTP interface to query elevation
    data on the  surface of the Earth. Elevation data can be retrieved at specific
    locations by sending  lat/lon coordinates, by defining an ordered set of vertices
    that form a Polyline and a  number of sample points along the length of a Polyline,
    or by defining a bounding box  that consists of equally spaced vertices as rows
    and columns. The vertical datum is EPSG:3855.  This datum uses the EGM2008 geoid
    model applied to the WGS84 ellipsoid as its zero height  reference surface. The
    vertical unit is measured in meters, the spatial resolution of the  elevation
    data is 0.8 arc-second for global coverage (~24 meters).
servers:
- url: https://atlas.microsoft.com
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- SharedKey: []
- SasToken: []
paths:
  /elevation/point/{format}:
    get:
      summary: Get Elevation Data on One or More Points
      description: ">[!Important]\n>The Azure Maps Elevation services and Render V2\
        \ DEM tiles have been retired and will no longer be available and supported\
        \ after 5 May 2023. All other Azure Maps APIs, Services and TilesetIDs are\
        \ unaffected by this retirement. For more details, see [Elevation Services\
        \ Retirement](https://azure.microsoft.com/en-us/updates/azure-maps-elevation-apis-and-render-v2-dem-tiles-will-be-retired-on-5-may-2023/).\n\
        \n\n**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\
        \n The Get Data for Points API provides elevation data for one or more points.\
        \  A point is defined in lat,long coordinate format.\n\n Due to the URL character\
        \  length limit of 2048, it's not possible to pass more than 100 coordinates\
        \  as a pipeline delimited string in a URL GET request. If you intend to pass\
        \  more than 100 coordinates as a pipeline delimited string, use the [POST\
        \ Data\n For Points](https://docs.microsoft.com/rest/api/maps/elevation/postdataforpoints).\n\
        \n The result will be in the same sequence of points listed in the request."
      operationId: Elevation_GetDataForPoints
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Indicates the account intended for use with the Microsoft Entra
          ID security model. This unique ID for the Azure Maps account can be obtained
          from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
          For more information on using Microsoft Entra ID security in Azure Maps,
          see [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
          default: '1.0'
      - name: format
        description: Desired format of the response. Only `json` format is supported.
        in: path
        required: true
        x-ms-enum:
          name: JsonFormat
          modelAsString: true
          values:
          - value: json
            description: '[The JavaScript Object Notation Data Interchange Format](https://tools.ietf.org/html/rfc8259)'
        x-ms-client-default: json
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - json
      - name: points
        in: query
        description: 'The string representation of a list of points. A point is defined
          in lon/lat WGS84 coordinate reference system format.  If multiple points
          are requested, each of the points in a list should be separated by the pipe
          (''|'') character.  The maximum number of points that can be requested in
          a single request is 2,000. The resolution of the elevation  data will be
          the highest for a single point and will decrease if multiple points are
          spread further apart. '
        required: true
        style: pipeDelimited
        schema:
          type: array
          items:
            type: string
            pattern: \s*[-]?\d+[.]\d+\s*[,]\s*[-]?\d+[.]\d+\s*
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The response from a successful Get Data for Bounding
                  Box API.
                properties:
                  data:
                    x-ms-client-name: elevations
                    description: The response for point/points elevation API. The
                      result will be in same sequence of points listed in request.
                    type: array
                    readOnly: true
                    items:
                      type: object
                      description: The elevation data.
                      properties:
                        coordinate:
                          description: A location represented as a latitude and longitude.
                          type: object
                          properties:
                            latitude:
                              description: Latitude property
                              type: number
                              format: double
                            longitude:
                              description: Longitude property
                              type: number
                              format: double
                        elevationInMeter:
                          description: The elevation value in meters.
                          type: number
                          readOnly: true
        default:
          description: An unexpected error occurred.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        readOnly: true
                        type: string
                        description: The error code.
                      message:
                        readOnly: true
                        type: string
                        description: The error message.
                      target:
                        readOnly: true
                        type: string
                        description: The error target.
                      details:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              readOnly: true
                              type: string
                              description: The error code.
                            message:
                              readOnly: true
                              type: string
                              description: The error message.
                            target:
                              readOnly: true
                              type: string
                              description: The error target.
                            details:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    readOnly: true
                                    type: string
                                    description: The error code.
                                  message:
                                    readOnly: true
                                    type: string
                                    description: The error message.
                                  target:
                                    readOnly: true
                                    type: string
                                    description: The error target.
                              x-ms-identifiers: []
                              description: The error details.
                            additionalInfo:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    readOnly: true
                                    type: string
                                    description: The additional info type.
                                  info:
                                    readOnly: true
                                    type: object
                                    description: The additional info.
                                description: The resource management error additional
                                  info.
                              x-ms-identifiers: []
                              description: The error additional info.
                        x-ms-identifiers: []
                        description: The error details.
                      additionalInfo:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              readOnly: true
                              type: string
                              description: The additional info type.
                            info:
                              readOnly: true
                              type: object
                              description: The additional info.
                          description: The resource management error additional info.
                        x-ms-identifiers: []
                        description: The error additional info.
