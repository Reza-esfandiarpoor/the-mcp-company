  /elevation/line/{format}:
    get:
      summary: Get Elevation Data Along a Polyline
      description: ">[!Important]\n>The Azure Maps Elevation services and Render V2\
        \ DEM tiles have been retired and will no longer be available and supported\
        \ after 5 May 2023. All other Azure Maps APIs, Services and TilesetIDs are\
        \ unaffected by this retirement. For more details, see [Elevation Services\
        \ Retirement](https://azure.microsoft.com/en-us/updates/azure-maps-elevation-apis-and-render-v2-dem-tiles-will-be-retired-on-5-may-2023/).\n\
        \n\n**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\
        \n The Get Data for Polyline API provides elevation data along a polyline.\n\
        \n A polyline is defined by passing in between 2 and N endpoint coordinates\
        \ separated by a pipe ('|') character. In addition to passing in endpoints,\
        \ customers can specify the number of sample points that will be used to divide\
        \ polyline into equally spaced segments.\n\n Elevation data at both start\
        \ and endpoints, as well as equally spaced points along the polyline will\
        \ be returned. The results will be listed in the direction from the first\
        \ endpoint towards the last endpoint. A line between two endpoints is a straight\
        \ Cartesian line, the  shortest line between those two points in the coordinate\
        \ reference system. Note that the point is  chosen based on Euclidean distance\
        \ and may markedly differ from the geodesic path along the curved  surface\
        \ of the reference ellipsoid."
      operationId: Elevation_GetDataForPolyline
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Indicates the account intended for use with the Microsoft Entra
          ID security model. This unique ID for the Azure Maps account can be obtained
          from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
          For more information on using Microsoft Entra ID security in Azure Maps,
          see [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
          default: '1.0'
      - name: format
        description: Desired format of the response. Only `json` format is supported.
        in: path
        required: true
        x-ms-enum:
          name: JsonFormat
          modelAsString: true
          values:
          - value: json
            description: '[The JavaScript Object Notation Data Interchange Format](https://tools.ietf.org/html/rfc8259)'
        x-ms-client-default: json
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - json
      - name: lines
        in: query
        description: "The string representation of a polyline path. A polyline is\
          \ defined by endpoint coordinates,  with each endpoint separated by a pipe\
          \ ('|') character. The polyline should be defined in the  following format:\
          \ `[longitude_point1, latitude_point1 | longitude_point2, latitude_point2,\
          \ ...,  longitude_pointN, latitude_pointN]`.\n\n The longitude and latitude\
          \ values refer to the World Geodetic  System (WGS84) coordinate reference\
          \ system. The resolution of the data used to compute the  elevation depends\
          \ on the distance between the endpoints."
        required: true
        x-ms-skip-url-encoding: false
        style: pipeDelimited
        schema:
          type: array
          items:
            type: string
            pattern: \s*[-]?\d+[.]\d+\s*[,]\s*[-]?\d+[.]\d+\s*
      - name: samples
        in: query
        description: The samples parameter specifies the number of equally spaced
          points at which elevation values  should be provided along a polyline path.
          The number of samples should range from 2 to 2,000. Default value is 10.
        schema:
          type: integer
          minimum: 2
          maximum: 2000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The response from a successful Get Data for Bounding
                  Box API.
                properties:
                  data:
                    x-ms-client-name: elevations
                    description: The response for point/points elevation API. The
                      result will be in same sequence of points listed in request.
                    type: array
                    readOnly: true
                    items:
                      type: object
                      description: The elevation data.
                      properties:
                        coordinate:
                          description: A location represented as a latitude and longitude.
                          type: object
                          properties:
                            latitude:
                              description: Latitude property
                              type: number
                              format: double
                            longitude:
                              description: Longitude property
                              type: number
                              format: double
                        elevationInMeter:
                          description: The elevation value in meters.
                          type: number
                          readOnly: true
        default:
          description: An unexpected error occurred.
          x-ms-error-response: true
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
                  error:
                    description: The error object.
                    type: object
                    properties:
                      code:
                        readOnly: true
                        type: string
                        description: The error code.
                      message:
                        readOnly: true
                        type: string
                        description: The error message.
                      target:
                        readOnly: true
                        type: string
                        description: The error target.
                      details:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          description: The error detail.
                          properties:
                            code:
                              readOnly: true
                              type: string
                              description: The error code.
                            message:
                              readOnly: true
                              type: string
                              description: The error message.
                            target:
                              readOnly: true
                              type: string
                              description: The error target.
                            details:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                description: The error detail.
                                properties:
                                  code:
                                    readOnly: true
                                    type: string
                                    description: The error code.
                                  message:
                                    readOnly: true
                                    type: string
                                    description: The error message.
                                  target:
                                    readOnly: true
                                    type: string
                                    description: The error target.
                              x-ms-identifiers: []
                              description: The error details.
                            additionalInfo:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    readOnly: true
                                    type: string
                                    description: The additional info type.
                                  info:
                                    readOnly: true
                                    type: object
                                    description: The additional info.
                                description: The resource management error additional
                                  info.
                              x-ms-identifiers: []
                              description: The error additional info.
                        x-ms-identifiers: []
                        description: The error details.
                      additionalInfo:
                        readOnly: true
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              readOnly: true
                              type: string
                              description: The additional info type.
                            info:
