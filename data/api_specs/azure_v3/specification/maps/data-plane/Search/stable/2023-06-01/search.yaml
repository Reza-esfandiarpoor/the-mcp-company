                      adminDistricts:
                        description: The subdivision name in the country or region
                          for an address. This element is typically treated as the
                          first order administrative subdivision, but in some cases
                          it also contains the second, third, or fourth order subdivision
                          in a country, dependency, or region.
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: "The name for the corresponding adminDistrict\
                                \ field, \nFor adminDistrict[0], this could be full\
                                \ name of state such as Washington, \nFor adminDistrict[1],\
