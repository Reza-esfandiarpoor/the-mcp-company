                                          unless a user location indicates that the
                                          user is in or very close to Paris, TX or
                                          the map view indicates that the user is
                                          searching in that area.'
                                      - value: Medium
                                        description: 'In some situations, the returned
                                          match may not be at the same level as the
                                          information provided in the request. For
                                          example, a request may specify address information
                                          and the geocode service may only be able
                                          to match a postal code. In this case, if
                                          the geocode service has a confidence that
                                          the postal code matches the data, the confidence
                                          is set to `Medium` and the match code is
                                          set to `UpHierarchy` to specify that it
                                          could not match all of the information and
                                          had to search up-hierarchy.


                                          If the location information in the query
                                          is ambiguous, and there is no additional
                                          information to rank the locations (such
                                          as user location or the relative importance
                                          of the location), the confidence is set
                                          to `Medium`. For example, a location query
