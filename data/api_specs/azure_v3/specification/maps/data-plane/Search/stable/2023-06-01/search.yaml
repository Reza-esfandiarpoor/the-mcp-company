                            type: string
                  geocodePoints:
                    description: A collection of geocode points that differ in how
                      they were calculated and their suggested use.
                    type: array
                    items:
                      type: object
                      properties:
                        geometry:
                          type: object
                          properties:
                            type:
                              description: Specifies the `GeoJSON` type. Must be one
