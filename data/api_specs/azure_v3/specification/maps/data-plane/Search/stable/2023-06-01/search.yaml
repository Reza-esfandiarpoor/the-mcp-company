                        confidence:
                          description: "The level of confidence that the geocoded\
                            \ location result is a match. Use this value with the\
                            \ match code to determine for more complete information\
                            \ about the match.\n\nThe confidence of a geocoded location\
                            \ is based on many factors including the relative importance\
