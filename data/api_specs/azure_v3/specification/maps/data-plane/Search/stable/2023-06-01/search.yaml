                                - value: FeatureCollection
                                  description: '`GeoJSON FeatureCollection` object.'
                                  name: GeoJsonFeatureCollection
                            bbox:
                              x-ms-client-name: boundingBox
                              description: Bounding box. Projection used - EPSG:3857.
                                Please refer to [RFC 7946](https://datatracker.ietf.org/doc/html/rfc7946#section-5)
