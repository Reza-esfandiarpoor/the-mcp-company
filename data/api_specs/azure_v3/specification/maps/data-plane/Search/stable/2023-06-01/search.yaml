                          - Medium
                          - Low
                          x-ms-enum:
                            name: ConfidenceEnum
                            modelAsString: true
                            values:
                            - value: High
                              description: 'If the confidence is set to `High`, one
                                or more strong matches were found. Multiple `High`
                                confidence matches are sorted in ranked order by importance
                                when applicable. For example, landmarks have importance
                                but addresses do not.


                                If a request includes a location or a view, then the
                                ranking may change appropriately. For example, a location
                                query for "Paris" returns "Paris, France" and "Paris,
                                TX" both with `High` confidence. "Paris, France" is
                                always ranked first due to importance unless a user
                                location indicates that the user is in or very close
                                to Paris, TX or the map view indicates that the user
                                is searching in that area.'
                            - value: Medium
                              description: 'In some situations, the returned match
                                may not be at the same level as the information provided
                                in the request. For example, a request may specify
                                address information and the geocode service may only
                                be able to match a postal code. In this case, if the
                                geocode service has a confidence that the postal code
                                matches the data, the confidence is set to `Medium`
                                and the match code is set to `UpHierarchy` to specify
                                that it could not match all of the information and
                                had to search up-hierarchy.


                                If the location information in the query is ambiguous,
                                and there is no additional information to rank the
                                locations (such as user location or the relative importance
                                of the location), the confidence is set to `Medium`.
                                For example, a location query for "148th Ave, Bellevue"
                                may return "148th Ave SE" and "148th Ave NE" both
                                with `Medium` confidence.


                                If the location information in the query does not
                                provide enough information to geocode a specific location,
                                a less precise location value may be returned and
                                the confidence is set to `Medium`. For example, if
                                an address is provided, but a match is not found for
                                the house number, the geocode result with a Roadblock
                                entity type may be returned.'
                            - value: Low
                        matchCodes:
                          description: 'One or more match code values that represent
                            the geocoding level for each location in the response.


                            For example, a geocoded location with match codes of `Good`
                            and `Ambiguous` means that more than one geocode location
                            was found for the location information and that the geocode
                            service did not have search up-hierarchy to find a match.


                            Similarly, a geocoded location with match codes of `Ambiguous`
                            and `UpHierarchy` implies that a geocode location could
                            not be found that matched all the provided location information,
                            so the geocode service had to search up-hierarchy and
                            found multiple matches at that level. An example of up
                            an `Ambiguous` and `UpHierarchy` result is when you provide
                            complete address information, but the geocode service
                            cannot locate a match for the street address and instead
                            returns information for more than one RoadBlock value.


                            The possible values are:


                            `Good`: The location has only one match or all returned
                            matches are considered strong matches. For example, a
                            query for New York returns several Good matches.


                            `Ambiguous`: The location is one of a set of possible
