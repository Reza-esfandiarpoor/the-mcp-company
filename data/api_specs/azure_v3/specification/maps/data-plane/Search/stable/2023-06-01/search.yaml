components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    Top:
      name: top
      in: query
      description: 'Maximum number of responses that will be returned. Default: 5,
        minimum: 1 and maximum: 20.'
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 20
        default: 5
    Accept-Language:
      name: Accept-Language
      in: header
      description: "Language in which search results should be returned. \n\nPlease\
        \ refer to [Supported Languages](/azure/azure-maps/supported-languages) for\
        \ details."
      required: false
      x-ms-parameter-location: client
      schema:
        type: string
    Coordinates:
      name: coordinates
      in: query
      description: "A point on the earth specified as a longitude and latitude. When\
        \ you specify this parameter, the user\u2019s location is taken into account\
        \ and the results returned may be more relevant to the user. Example: &coordinates=lon,lat"
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: number
          format: double
        minItems: 2
        maxItems: 2
    Bbox:
      name: bbox
      in: query
      description: 'A rectangular area on the earth defined as a bounding box object.
        The sides of the rectangles are defined by longitude and latitude values.
        When you specify this parameter, the geographical area is taken into account
        when computing the results of a location query.


        Example: lon1,lat1,lon2,lat2'
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: number
          format: double
        minItems: 4
        maxItems: 4
    View:
      name: view
      in: query
      description: "A string that represents an [ISO 3166-1 Alpha-2 region/country\
        \ code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2). This will alter\
        \ Geopolitical disputed borders and labels to align with the specified user\
        \ region. By default, the View parameter is set to \u201CAuto\u201D even if\
        \ you haven\u2019t defined it in the request.\n\nPlease refer to [Supported\
        \ Views](https://aka.ms/AzureMapsLocalizationViews) for details and to see\
        \ the available Views."
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    BoundaryResultType:
      name: resultType
      in: query
      description: The geopolitical concept to return a boundary for. If not specified,
        the default is `countryRegion` result type.
      required: false
      x-ms-enum:
        name: BoundaryResultTypeEnum
        modelAsString: true
        values:
        - name: countryRegion
          value: countryRegion
          description: Country or region.
        - name: adminDistrict
          value: adminDistrict
          description: First administrative level within the country/region level,
            such as a state or a province.
        - name: adminDistrict2
          value: adminDistrict2
          description: Second administrative level within the country/region level,
            such as a county.
        - name: postalCode
          value: postalCode
          description: The smallest post code category, such as a zip code.
        - name: postalCode2
          value: postalCode2
          description: The next largest post code category after postalCode that is
            created by aggregating postalCode areas.
        - name: postalCode3
          value: postalCode3
          description: The next largest post code category after postalCode2 that
            is created by aggregating postalCode2 areas.
        - name: postalCode4
          value: postalCode4
          description: The next largest post code category after postalCode3 that
            is created by aggregating postalCode3 areas.
        - name: neighborhood
          value: neighborhood
          description: A section of a populated place that is typically well-known,
            but often with indistinct boundaries.
        - name: locality
          value: locality
          description: A concentrated area of human settlement, such as a city, town
            or village.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - countryRegion
        - adminDistrict
        - adminDistrict2
        - postalCode
        - postalCode2
        - postalCode3
        - postalCode4
        - neighborhood
        - locality
        default: countryRegion
    Resolution:
      name: resolution
      in: query
      description: Resolution determines the amount of points to send back. If not
        specified, the default is medium resolution.
      required: false
      x-ms-enum:
        name: ResolutionEnum
        modelAsString: true
        values:
        - name: small
          value: small
          description: Return the boundary geometry with the least amount of points.
        - name: medium
          value: medium
          description: Return the boundary geometry with more or the same amount of
            points as small.
        - name: large
          value: large
          description: Return the boundary geometry with more or the same amount of
            points as medium.
        - name: huge
          value: huge
          description: Return the boundary geometry with more or the same amount of
            points as large.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - small
        - medium
        - large
        - huge
        default: medium
    ReverseGeocodingResultTypes:
      name: resultTypes
      in: query
      description: 'Specify entity types that you want in the response. Only the types
        you specify will be returned. If the point cannot be mapped to the entity
        types you specify, no location information is returned in the response.

        Default value is all possible entities.

        A comma separated list of entity types selected from the following options.


        - Address

        - Neighborhood

        - PopulatedPlace

        - Postcode1

        - AdminDivision1

        - AdminDivision2

        - CountryRegion


        These entity types are ordered from the most specific entity to the least
        specific entity. When entities of more than one entity type are found, only
        the most specific entity is returned. For example, if you specify Address
        and AdminDistrict1 as entity types and entities were found for both types,
        only the Address entity information is returned in the response.'
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - Address
          - Neighborhood
          - PopulatedPlace
          - Postcode1
          - AdminDivision1
          - AdminDivision2
          - CountryRegion
          x-ms-enum:
            name: ReverseGeocodingResultTypeEnum
            modelAsString: true
            values:
            - name: Address
              value: Address
            - name: Neighborhood
              value: Neighborhood
            - name: PopulatedPlace
              value: PopulatedPlace
            - name: Postcode1
              value: Postcode1
            - name: AdminDivision1
              value: AdminDivision1
            - name: AdminDivision2
              value: AdminDivision2
            - name: CountryRegion
              value: CountryRegion
