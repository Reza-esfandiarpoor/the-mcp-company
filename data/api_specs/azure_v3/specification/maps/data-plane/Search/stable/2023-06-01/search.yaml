  /reverseGeocode:
    get:
      summary: Use to get a street address and location info from longitude and latitude
        coordinates.
      description: '


        The `Get Reverse Geocoding` API is an HTTP `GET` request used to translate
        a coordinate (example: 37.786505, -122.3862) into a human understandable street
        address. Useful in tracking applications where you receive a GPS feed from
        the device or asset and wish to know the address associated with the coordinates.
        This endpoint will return address information for a given coordinate.'
      operationId: Search_GetReverseGeocoding
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Specifies which account is intended for usage in conjunction
          with the Azure AD security model.  It represents a unique ID for the Azure
          Maps account and can be retrieved from the Azure Maps management  plane
          Account API. To use Azure AD security in Azure Maps see the following [articles](https://aka.ms/amauthdetails)
          for guidance.
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: "Language in which search results should be returned. \n\nPlease\
          \ refer to [Supported Languages](/azure/azure-maps/supported-languages)\
          \ for details."
        required: false
        x-ms-parameter-location: client
        schema:
          type: string
      - name: coordinates
        in: query
        description: 'The coordinates of the location that you want to reverse geocode.
          Example: &coordinates=lon,lat'
        required: true
        x-ms-parameter-location: method
