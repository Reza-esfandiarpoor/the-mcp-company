                                        description: 'If the confidence is set to
                                          `High`, one or more strong matches were
                                          found. Multiple `High` confidence matches
                                          are sorted in ranked order by importance
                                          when applicable. For example, landmarks
                                          have importance but addresses do not.


                                          If a request includes a location or a view,
                                          then the ranking may change appropriately.
                                          For example, a location query for "Paris"
                                          returns "Paris, France" and "Paris, TX"
                                          both with `High` confidence. "Paris, France"
