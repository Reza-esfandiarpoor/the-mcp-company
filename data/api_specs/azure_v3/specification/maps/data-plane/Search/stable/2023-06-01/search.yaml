  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Microsoft Entra OAuth 2.0](/azure/active-directory/develop/v1-overview)\
        \ Flows. When paired with [Azure role-based access](/azure/role-based-access-control/overview)\
        \ control it can be used to control access to Azure Maps REST APIs. Azure\
        \ role-based access controls are used to designate access to one or more Azure\
        \ Maps resource account or sub-resources. Any user, group, or service principal\
        \ can be granted access via a  built-in role or a custom role composed of\
        \ one or more permissions to Azure Maps REST APIs.\n\nTo implement scenarios,\
        \ we recommend viewing [authentication concepts](https://aka.ms/amauth). In\
        \ summary, this security definition provides a solution for modeling application(s)\
        \ via objects capable of access control on specific APIs and scopes.\n\n>\
        \ [!NOTE]\n> * This security definition **requires** the use of the `x-ms-client-id`\
        \ header to indicate which Azure Maps resource the application is requesting\
        \ access to. This can be acquired from the [Maps management API](https://aka.ms/amauthdetails).\n\
        > * The `Authorization URL` is specific to the Azure public cloud instance.\
        \ Sovereign clouds have unique Authorization URLs and Microsoft Entra ID configurations.\
        \ \n> * The Azure role-based access control is configured from the [Azure\
        \ management plane](https://aka.ms/amrbac) via Azure portal, PowerShell, CLI,\
        \ Azure SDKs, or REST APIs.\n> * Usage of the [Azure Maps Web SDK](https://aka.ms/amaadmc)\
        \ allows for configuration based setup of an application for multiple use\
        \ cases.\n> *  For more information on Microsoft identity platform, see [Microsoft\
        \ identity platform overview](/entra/identity-platform/v2-overview).\n\n"
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    AzureKey:
      type: apiKey
      description: "This is a shared key that is provisioned when creating an [Azure\
        \ Maps resource](https://aka.ms/amauth) through the Azure management plane\
        \  via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n\n With this\
        \ key, any application is authorized to access  all REST APIs. In other words,\
        \ these can currently be treated as master keys to the account which they\
        \ are issued for.\n\n For publicly exposed applications, our recommendation\
        \ is to use server-to-server access of Azure Maps REST APIs where this key\
        \ can be  securely stored."
      name: subscription-key
      in: header
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List\
        \ SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through\
        \ the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,\
        \ or REST APIs.\n\n With this token, any application is authorized to access\
        \ with Azure role-based access controls and fine-grain control to the expiration,\
        \ rate, and region(s) of use for the particular token. In other words, the\
        \ SAS Token can be used to allow applications to control access in a more\
        \ secured way than the shared key.\n\n For publicly exposed applications,\
        \ our recommendation is to configure a specific list of allowed origins on\
        \ the [Map account resource](https://aka.ms/amauth) to limit rendering abuse\
        \ and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    UsageType:
      type: string
      enum:
      - Display
      - Route
      x-ms-enum:
        name: UsageTypeEnum
        modelAsString: true
        values:
        - value: Display
        - value: Route
    GeocodePoints:
      description: A collection of geocode points that differ in how they were calculated
        and their suggested use.
      type: array
      items:
        type: object
        properties:
          geometry:
            type: object
            properties:
              type:
                description: Specifies the `GeoJSON` type. Must be one of the nine
                  valid GeoJSON object types - Point, MultiPoint, LineString, MultiLineString,
                  Polygon, MultiPolygon, GeometryCollection, Feature and FeatureCollection.
                type: string
                enum:
                - Point
                - MultiPoint
                - LineString
                - MultiLineString
                - Polygon
                - MultiPolygon
                - GeometryCollection
                - Feature
                - FeatureCollection
                x-ms-enum:
                  name: GeoJsonObjectType
                  modelAsString: false
                  values:
                  - value: Point
                    description: '`GeoJSON Point` geometry.'
                    name: GeoJsonPoint
                  - value: MultiPoint
                    description: '`GeoJSON MultiPoint` geometry.'
                    name: GeoJsonMultiPoint
                  - value: LineString
                    description: '`GeoJSON LineString` geometry.'
                    name: GeoJsonLineString
                  - value: MultiLineString
                    description: '`GeoJSON MultiLineString` geometry.'
                    name: GeoJsonMultiLineString
                  - value: Polygon
                    description: '`GeoJSON Polygon` geometry.'
                    name: GeoJsonPolygon
                  - value: MultiPolygon
                    description: '`GeoJSON MultiPolygon` geometry.'
                    name: GeoJsonMultiPolygon
                  - value: GeometryCollection
                    description: '`GeoJSON GeometryCollection` geometry.'
                    name: GeoJsonGeometryCollection
                  - value: Feature
                    description: '`GeoJSON Feature` object.'
                    name: GeoJsonFeature
                  - value: FeatureCollection
                    description: '`GeoJSON FeatureCollection` object.'
                    name: GeoJsonFeatureCollection
              bbox:
                x-ms-client-name: boundingBox
                description: Bounding box. Projection used - EPSG:3857. Please refer
                  to [RFC 7946](https://datatracker.ietf.org/doc/html/rfc7946#section-5)
                  for details.
                type: array
                items:
                  type: number
                  format: double
              coordinates:
                description: A `Position` is an array of numbers with two or more
                  elements. The first two elements are _longitude_ and _latitude_,
                  precisely in that order. _Altitude/Elevation_ is an optional third
                  element. Please refer to [RFC 7946](https://tools.ietf.org/html/rfc7946#section-3.1.1)
                  for details.
                type: array
                items:
                  type: number
                  format: double
            required:
            - type
            - coordinates
            description: A valid `GeoJSON` object. Please refer to [RFC 7946](https://tools.ietf.org/html/rfc7946#section-3)
              for details.
            discriminator:
              propertyName: type
            x-ms-discriminator-value: Point
          calculationMethod:
            description: The method that was used to compute the geocode point.
            type: string
            enum:
            - Interpolation
            - InterpolationOffset
            - Parcel
            - Rooftop
            x-ms-enum:
              name: CalculationMethodEnum
              modelAsString: true
              values:
              - value: Interpolation
                description: The geocode point was matched to a point on a road using
                  interpolation.
              - value: InterpolationOffset
                description: The geocode point was matched to a point on a road using
                  interpolation with an additional offset to shift the point to the
                  side of the street.
              - value: Parcel
                description: The geocode point was matched to the center of a parcel.
              - value: Rooftop
                description: The geocode point was matched to the rooftop of a building.
          usageTypes:
            description: 'The best use for the geocode point.

              Each geocode point is defined as a `Route` point, a `Display` point
              or both.

              Use `Route` points if you are creating a route to the location. Use
              `Display` points if you are showing the location on a map. For example,
              if the location is a park, a `Route` point may specify an entrance to
              the park where you can enter with a car, and a `Display` point may be
              a point that specifies the center of the park.'
            type: array
            items:
              type: string
              enum:
              - Display
              - Route
              x-ms-enum:
                name: UsageTypeEnum
                modelAsString: true
                values:
                - value: Display
                - value: Route
