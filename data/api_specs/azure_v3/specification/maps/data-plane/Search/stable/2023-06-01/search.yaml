  /reverseGeocode:batch:
    post:
      summary: Use to send a batch of queries to the [Reverse Geocoding](/rest/api/maps/search/get-reverse-geocoding)
        API in a single request.
      description: "\n\nThe `Get Reverse Geocoding Batch` API is an HTTP `POST` request\
        \ that sends batches of up to **100** queries to [Reverse Geocoding](/rest/api/maps/search/get-reverse-geocoding)\
        \ API using a single request.\n\n### Submit Synchronous Batch Request\nThe\
        \ Synchronous API is recommended for lightweight batch requests. When the\
        \ service receives a request, it will respond as soon as the batch items are\
        \ calculated and there will be no possibility to retrieve the results later.\
        \ The Synchronous API will return a timeout error (a 408 response) if the\
        \ request takes longer than 60 seconds. The number of batch items is limited\
        \ to **100** for this API.\n```\nPOST https://atlas.microsoft.com/reverseGeocode:batch?api-version=2023-06-01\n\
        ```\n### POST Body for Batch Request\nTo send the _reverse geocoding_ queries\
        \ you will use a `POST` request where the request body will contain the `batchItems`\
        \ array in `json` format and the `Content-Type` header will be set to `application/json`.\
        \ Here's a sample request body containing 2 _reverse geocoding_ queries:\n\
        \n\n```\n{\n  \"batchItems\": [\n    {\n      \"coordinates\": [-122.128275,\
        \ 47.639429],\n      \"resultTypes\": [\"Address\", \"PopulatedPlace\"]\n\
        \    },\n    {\n      \"coordinates\": [-122.341979399674, 47.6095253501216]\n\
        \    }\n  ]\n}\n```\n\nA _reverse geocoding_ batchItem object can accept any\
        \ of the supported _reverse geocoding_ [URI parameters](/rest/api/maps/search/get-reverse-geocoding#uri-parameters).\n\
        \n\nThe batch should contain at least **1** query.\n\n\n### Batch Response\
        \ Model\nThe batch response contains a `summary` component that indicates\
        \ the `totalRequests` that were part of the original batch request and `successfulRequests`\
        \ i.e. queries which were executed successfully. The batch response also includes\
        \ a `batchItems` array which contains a response for each and every query\
        \ in the batch request. The `batchItems` will contain the results in the exact\
        \ same order the original queries were sent in the batch request. Each item\
        \ is of one of the following types:\n\n  - [`GeocodingResponse`](/rest/api/maps/search/get-reverse-geocoding#geocodingresponse)\
        \ - If the query completed successfully.\n\n  - `Error` - If the query failed.\
        \ The response will contain a `code` and a `message` in this case.\n\n\n"
      operationId: Search_GetReverseGeocodingBatch
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Specifies which account is intended for usage in conjunction
          with the Azure AD security model.  It represents a unique ID for the Azure
          Maps account and can be retrieved from the Azure Maps management  plane
          Account API. To use Azure AD security in Azure Maps see the following [articles](https://aka.ms/amauthdetails)
          for guidance.
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: "Language in which search results should be returned. \n\nPlease\
          \ refer to [Supported Languages](/azure/azure-maps/supported-languages)\
          \ for details."
        required: false
        x-ms-parameter-location: client
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: The list of reverse geocoding queries/requests to process.
                The list can contain a max of 100 queries and must contain at least
                1 query.
              type: object
              properties:
                batchItems:
                  description: The list of queries to process.
                  type: array
                  items:
                    description: Batch Query object
                    type: object
                    properties:
                      optionalId:
                        description: id of the request which would show in corresponding
                          batchItem
                        type: string
                      coordinates:
                        description: 'The coordinates of the location that you want
                          to reverse geocode. Example: [lon,lat]'
                        type: array
                        items:
                          type: number
                          format: double
                        minItems: 2
                        maxItems: 2
                      resultTypes:
                        description: 'Specify entity types that you want in the response.
                          Only the types you specify will be returned. If the point
                          cannot be mapped to the entity types you specify, no location
                          information is returned in the response.

                          Default value is all possible entities.

                          A comma separated list of entity types selected from the
                          following options.


                          - Address

                          - Neighborhood

                          - PopulatedPlace

                          - Postcode1

                          - AdminDivision1

                          - AdminDivision2

                          - CountryRegion


                          These entity types are ordered from the most specific entity
                          to the least specific entity. When entities of more than
                          one entity type are found, only the most specific entity
                          is returned. For example, if you specify Address and AdminDistrict1
                          as entity types and entities were found for both types,
                          only the Address entity information is returned in the response.'
                        type: array
                        items:
                          type: string
                          enum:
                          - Address
                          - Neighborhood
                          - PopulatedPlace
                          - Postcode1
                          - AdminDivision1
                          - AdminDivision2
                          - CountryRegion
                          x-ms-enum:
                            name: ResultTypeEnum
                            modelAsString: true
                            values:
                            - name: Address
                              value: Address
                            - name: Neighborhood
                              value: Neighborhood
                            - name: PopulatedPlace
                              value: PopulatedPlace
                            - name: Postcode1
                              value: Postcode1
                            - name: AdminDivision1
                              value: AdminDivision1
                            - name: AdminDivision2
                              value: AdminDivision2
                            - name: CountryRegion
                              value: CountryRegion
