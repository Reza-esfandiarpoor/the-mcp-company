  /geocode:batch:
    post:
      summary: Use to send a batch of queries to the [Geocoding](/rest/api/maps/search/get-geocoding)
        API in a single request.
      description: "\n\nThe `Get Geocoding Batch` API is an HTTP `POST` request that\
        \ sends batches of up to **100** queries to the [Geocoding](/rest/api/maps/search/get-geocoding)\
        \ API in a single request. \n\n### Submit Synchronous Batch Request\nThe Synchronous\
        \ API is recommended for lightweight batch requests. When the service receives\
        \ a request, it will respond as soon as the batch items are calculated and\
        \ there will be no possibility to retrieve the results later. The Synchronous\
        \ API will return a timeout error (a 408 response) if the request takes longer\
        \ than 60 seconds. The number of batch items is limited to **100** for this\
        \ API.\n```\nPOST https://atlas.microsoft.com/geocode:batch?api-version=2023-06-01\n\
        ```\n### POST Body for Batch Request\nTo send the _geocoding_ queries you\
        \ will use a `POST` request where the request body will contain the `batchItems`\
        \ array in `json` format and the `Content-Type` header will be set to `application/json`.\
        \ Here's a sample request body containing 2 _geocoding_ queries:\n\n\n```\n\
        {\n  \"batchItems\": [\n    {\n      \"addressLine\": \"One, Microsoft Way,\
        \ Redmond, WA 98052\",\n      \"top\": 2\n    },\n    {\n      \"addressLine\"\
        : \"Pike Pl\",\n      \"adminDistrict\": \"WA\",\n      \"locality\": \"Seattle\"\
        ,\n      \"top\": 3\n    }\n  ]\n}\n```\n\nA _geocoding_ batchItem object\
        \ can accept any of the supported _geocoding_ [URI parameters](/rest/api/maps/search/get-geocoding#uri-parameters).\n\
        \n\nThe batch should contain at least **1** query.\n\n\n### Batch Response\
        \ Model\nThe batch response contains a `summary` component that indicates\
        \ the `totalRequests` that were part of the original batch request and `successfulRequests`\
        \ i.e. queries which were executed successfully. The batch response also includes\
        \ a `batchItems` array which contains a response for each and every query\
        \ in the batch request. The `batchItems` will contain the results in the exact\
        \ same order the original queries were sent in the batch request. Each item\
        \ is of one of the following types:\n\n  - [`GeocodingResponse`](/rest/api/maps/search/get-geocoding#geocodingresponse)\
        \ - If the query completed successfully.\n\n  - `Error` - If the query failed.\
        \ The response will contain a `code` and a `message` in this case.\n\n\n"
