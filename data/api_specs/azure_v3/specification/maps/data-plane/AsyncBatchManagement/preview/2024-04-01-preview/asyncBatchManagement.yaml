openapi: 3.0.0
info:
  title: Azure Maps Asynchronous Batch Management Service
  version: 2024-04-01-preview
  description: Azure Maps Asynchronous Batch Management REST APIs
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- AzureKey: []
- SasToken: []
paths:
  /asyncBatch/operations/{operationId}:
    get:
      description: Get the status of an asynchronous batch operation by its operation
        ID.
      operationId: AsynchronousBatchManagement_GetOperation
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncBatchOperation'
        default:
          description: An unexpected error occurred.
          headers:
            x-ms-error-code:
              description: Error code of the error that occurred.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /asyncBatch/operations:
    get:
      description: List the status of all asynchronous batch operations available
        to the user.
      operationId: AsynchronousBatchManagement_ListAllOperations
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncBatchOperationsList'
        default:
          description: An unexpected error occurred.
          headers:
            x-ms-error-code:
              description: Error code of the error that occurred.
              schema:
                type: string
          x-ms-error-response: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
servers:
- url: https://{geography}.atlas.microsoft.com
  variables:
    geography:
      description: This parameter specifies where the Azure Maps Creator resource
        is located.  Valid values are us and eu.
      default: us
      enum:
      - us
      - eu
      x-ms-enum:
        name: GeographicResourceLocation
        modelAsString: true
        values:
        - value: us
          description: Used to access an Azure Maps Creator resource in the United
            States
        - value: eu
          description: Used to access an Azure Maps Creator resource in Europe
      x-ms-parameter-location: client
components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    OperationId:
      name: operationId
      description: System generated unique identifier for the asynchronous batch operation
        after it has been submitted.
      in: path
      required: true
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
    ClientId:
      name: x-ms-client-id
      x-ms-client-name: clientId
      description: Specifies which account is intended for usage in conjunction with
        the Azure AD security model.  It represents a unique ID for the Azure Maps
        account and can be retrieved from the Azure Maps management  plane Account
        API. To use Azure AD security in Azure Maps see the following [articles](https://aka.ms/amauthdetails)
        for guidance.
      in: header
      x-ms-parameter-location: client
      schema:
        type: string
  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Microsoft Entra OAuth 2.0](/azure/active-directory/develop/v1-overview)
        Flows. When paired with [Azure role-based access](/azure/role-based-access-control/overview)
        control it can be used to control access to Azure Maps REST APIs. Azure role-based
        access controls are used to designate access to one or more Azure Maps resource
        account or sub-resources. Any user, group, or service principal can be granted
        access via a  built-in role or a custom role composed of one or more permissions
        to Azure Maps REST APIs.\n\nTo implement scenarios, we recommend viewing [authentication
        concepts](https://aka.ms/amauth). In summary, this security definition provides
        a solution for modeling application(s) via objects capable of access control
        on specific APIs and scopes.\n\n> [!NOTE]\n> * This security definition **requires**
        the use of the `x-ms-client-id` header to indicate which Azure Maps resource
        the application is requesting access to. This can be acquired from the [Maps
        management API](https://aka.ms/amauthdetails).\n> * The `Authorization URL`
        is specific to the Azure public cloud instance. Sovereign clouds have unique
        Authorization URLs and Microsoft Entra ID configurations. \n> * The Azure
        role-based access control is configured from the [Azure management plane](https://aka.ms/amrbac)
        via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n> * Usage of
        the [Azure Maps Web SDK](https://aka.ms/amaadmc) allows for configuration
        based setup of an application for multiple use cases.\n> *  For more information
        on Microsoft identity platform, see [Microsoft identity platform overview](/entra/identity-platform/v2-overview).\n\n"
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    AzureKey:
      type: apiKey
      description: "This is a shared key that is provisioned when creating an [Azure
        Maps resource](https://aka.ms/amauth) through the Azure management plane  via
        Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n\n With this key,
        any application is authorized to access  all REST APIs. In other words, these
        can currently be treated as master keys to the account which they are issued
        for.\n\n For publicly exposed applications, our recommendation is to use server-to-server
        access of Azure Maps REST APIs where this key can be  securely stored."
      name: subscription-key
      in: header
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List
        SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through
        the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,
        or REST APIs.\n\n With this token, any application is authorized to access
        with Azure role-based access controls and fine-grain control to the expiration,
        rate, and region(s) of use for the particular token. In other words, the SAS
        Token can be used to allow applications to control access in a more secured
        way than the shared key.\n\n For publicly exposed applications, our recommendation
        is to configure a specific list of allowed origins on the [Map account resource](https://aka.ms/amauth)
        to limit rendering abuse and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    AsyncBatchOperationResult:
      type: object
      description: The result of the asynchronous batch operation.
      properties:
        outputBlobUrl:
          type: string
          format: uri
          description: URL to the output blob containing the batch results.
      required:
      - outputBlobUrl
    AsyncBatchOperation:
      type: object
      description: This object is returned from a successful Get Operation request.
      properties:
        operationId:
          description: Unique identifier for the asynchronous batch operation.
          type: string
        operationType:
          type: string
          description: Type of asynchronous batch operation
          enum:
          - Geocode
          - ReverseGeocode
          - RouteDirections
          x-ms-enum:
            name: OperationTypeEnum
            modelAsString: true
            values:
            - value: Geocode
              description: Forward geocode asynchronous batch job.
            - value: ReverseGeocode
              description: Reverse geocode asynchronous batch job.
            - value: RouteDirections
              description: Route directions asynchronous batch job.
        inputBlobUrl:
          description: The URL to the input blob containing the batch of queries.
            This should be a valid URL pointing to a blob of an Azure Storage Account
          type: string
          format: uri
        outputStorageUrl:
          description: The URL that points to a blob storage where the batch results
            will be stored.
          type: string
          format: uri
        msiClientId:
          type: string
          description: Client ID of a user-assigned managed identity. This is used
            for authentication and authorization purposes. If the managed identity
            is system-assigned, this field can be null.
        createdDateTime:
          type: string
          format: date-time
          description: Timestamp when the operation was created.
        lastActionDateTime:
          type: string
          format: date-time
          description: Timestamp when the operation status was updated.
        percentComplete:
          type: integer
          format: int32
          description: Percentage indicating the completion status of the operation.
        totalItemCount:
          type: integer
          format: int32
          description: Total number of items in the batch operation.
        status:
          type: string
          description: Current status of the batch operation.
          enum:
          - NotStarted
          - Running
          - Succeeded
          - Failed
          - Canceled
          x-ms-enum:
            name: StatusEnum
            modelAsString: true
            values:
            - value: NotStarted
              description: The operation has not started yet.
            - value: Running
              description: The operation is running.
            - value: Succeeded
              description: The operation has completed successfully.
            - value: Failed
              description: The operation has failed.
            - value: Canceled
              description: The operation has been canceled.
        result:
          $ref: '#/components/schemas/AsyncBatchOperationResult'
        error:
          type: object
          description: The error detail.
          properties:
            code:
              readOnly: true
              type: string
              description: The error code.
            message:
              readOnly: true
              type: string
              description: The error message.
      required:
      - operationId
      - operationType
      - inputBlobUrl
      - outputStorageUrl
      - createdDateTime
      - lastActionDateTime
      - percentComplete
      - totalItemCount
      - status
    AsyncBatchOperationsList:
      description: This object is returned from a successful Get Specific Operations
        request.
      type: object
      properties:
        value:
          description: Array containing the details of operations
          type: array
          items:
            $ref: '#/components/schemas/AsyncBatchOperation'
        nextLink:
          type: string
          format: uri
          description: The is the link to the next page of the features returned.
            If it's the last page, this is null.
      required:
      - value
    ErrorDetail:
      type: object
      description: The error detail.
      properties:
        code:
          readOnly: true
          type: string
          description: The error code.
        message:
          readOnly: true
          type: string
          description: The error message.
        target:
          readOnly: true
          type: string
          description: The error target.
        details:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers: []
          description: The error details.
        additionalInfo:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          description: The error additional info.
    ErrorAdditionalInfo:
      type: object
      properties:
        type:
          readOnly: true
          type: string
          description: The additional info type.
        info:
          readOnly: true
          type: object
          description: The additional info.
      description: The resource management error additional info.
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
