  /timezone/enumWindows/{format}:
    get:
      summary: Use to get the list of Windows Time Zone IDs.
      description: '


        The `Get Windows Time Zones` API is an HTTP `GET` request that returns a full
        list of Windows Time Zone IDs.'
      operationId: Timezone_GetTimezoneEnumWindows
      x-ms-client-name: GetWindowsTimezoneIds
      parameters:
      - name: x-ms-client-id
        x-ms-client-name: clientId
        description: Indicates the account intended for use with the Microsoft Entra
          ID security model. This unique ID for the Azure Maps account can be obtained
          from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
          For more information on using Microsoft Entra ID security in Azure Maps,
          see [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
        in: header
        x-ms-parameter-location: client
        schema:
          type: string
      - name: api-version
        description: Version number of Azure Maps API.
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
          default: '1.0'
      - name: format
        description: Desired format of the response. Only `json` format is supported.
        in: path
        required: true
        x-ms-enum:
          name: JsonFormat
          modelAsString: true
          values:
          - value: json
            description: '[The JavaScript Object Notation Data Interchange Format](https://tools.ietf.org/html/rfc8259)'
        x-ms-client-default: json
        x-ms-parameter-location: method
        schema:
          type: string
          enum:
          - json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: This object is returned from a successful Timezone Enum
                  Windows call
                type: array
                items:
                  type: object
                  properties:
                    WindowsId:
                      description: Windows Id property
                      type: string
                      readOnly: true
                    Territory:
                      description: Territory property
                      type: string
                      readOnly: true
                    IanaIds:
                      description: IanaIds array
                      type: array
                      items:
                        type: string
                        readOnly: true
        default:
