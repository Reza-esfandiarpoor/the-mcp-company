openapi: 3.0.0
info:
  title: Azure Maps Dataset Service
  version: 2023-07-01
  description: APIs for managing datasets from uploaded data in Azure Maps.
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- SharedKey: []
- SasToken: []
paths:
  /datasets:
    post:
      description: 'This API allows the caller to create a dataset from data that
        was uploaded to the [Azure Maps Data Service](https://docs.microsoft.com/rest/api/maps/data-v2)
        and converted using the [Azure Maps Conversion Service](https://docs.microsoft.com/rest/api/maps/2023-07-01/conversion).


        ### Submit Create Request


        To create your dataset, issue a `POST` request with the required parameters.
        The Create API is a [long-running operation](https://aka.ms/am-creator-lrt-v2).'
      operationId: Dataset_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ConversionIdQuery'
      - $ref: '#/components/parameters/AppendDatasetId'
      - $ref: '#/components/parameters/DatasetDescription'
      responses:
        '202':
          $ref: '#/components/responses/202AsyncV2'
        default:
          $ref: '#/components/responses/default'
    get:
      description: "This API allows the caller to fetch a list of all previously successfully
        created datasets.\n\n### Submit List Request\n\nTo list all your datasets,
        issue a `GET` request with no additional parameters.\n\n\n### List Data Response\n\nHere's
        a sample response returning the `timestamp`, `datasetId`, `description`, `datasetSources`,
        and `ontology` of 2 dataset resources:\n\n\n```json\n{\n  \"datasets\": [\n
        \   {\n      \"timestamp\": \"2020-01-01T22:50:48.123Z\",\n      \"datasetId\":
        \"f6495f62-94f8-0ec2-c252-45626f82fcb2\",\n      \"description\": \"Some description
        or comment for the dataset.\",\n      \"datasetSources\": {\n        \"conversionIds\":
        [\n          \"15d21452-c9bb-27b6-5e79-743ca5c3205d\"\n        ],\n      },\n
        \     \"ontology\": \"facility-2.0\",\n      \"featureCounts\": {\n        \"directoryInfo\":
        2,\n        \"category\": 10,\n        \"facility\": 1,\n        \"level\":
        3,\n        \"unit\": 183,\n        \"zone\": 3,\n        \"verticalPenetration\":
        6,\n        \"opening\": 48,\n        \"areaElement\": 108\n      }\n    },\n
        \   {\n      \"timestamp\": \"2020-01-01T22:57:53.123Z\",\n      \"datasetId\":
        \"8b1288fa-1958-4a2b-b68e-13a7i5af7d7c\",\n      \"description\": \"Create
        from upload '0c1288fa-2058-4a1b-b68d-13a5f5af7d7c'.\",\n      \"datasetSources\":
        {\n        \"conversionIds\": [\n          \"0c1288fa-2058-4a1b-b68d-13a5f5af7d7c\"\n
        \       ],\n        \"appendDatasetId\": \"46d1edb6-d29e-4786-9589-dbd4efd7a977\"\n
        \     },\n      \"ontology\": \"custom\",\n      \"featureCounts\": {\n        \"directoryInfo\":
        2,\n        \"category\": 10,\n        \"facility\": 1,\n        \"level\":
        3,\n        \"unit\": 183,\n        \"zone\": 3,\n        \"verticalPenetration\":
        6,\n        \"opening\": 48,\n        \"areaElement\": 108\n      }\n    }\n
        \ ]\n}\n```"
      operationId: Dataset_List
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      x-ms-pageable:
        itemName: datasets
        nextLinkName: nextLink
      responses:
        '200':
          description: The dataset request completed successfully. The response body
            contains the previously created dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResult'
        default:
          $ref: '#/components/responses/default'
  /datasets/{datasetId}:
    get:
      description: "This API allows the caller to fetch a previously successfully
        created dataset.\n\n### Submit Get Details Request\n\nTo get the details for
        a previously created dataset, you will issue a `GET` request with the `datasetId`
        in the path.\n\n### Get Details Response\n\nHere's a sample response returning
        the `timestamp`, `datasetId`, `description`, `datasetSources`, and `ontology`
        of a dataset resource:\n\n```json\n{\n   \"timestamp\": \"2020-01-01T22:50:48.123Z\",\n
        \  \"datasetId\": \"f6495f62-94f8-0ec2-c252-45626f82fcb2\",\n   \"description\":
        \"Some description or comment for the dataset.\",\n   \"datasetSources\":
        {\n     \"conversionIds\": [\n       \"0c1288fa-2058-4a1b-b68d-13a5f5af7d7c\"\n
        \    ],\n     \"appendDatasetId\": \"46d1edb6-d29e-4786-9589-dbd4efd7a977\"\n
        \  },\n   \"ontology\": \"facility-2.0\",\n   \"featureCounts\": {\n     \"directoryInfo\":
        2,\n     \"category\": 10,\n     \"facility\": 1,\n     \"level\": 3,\n     \"unit\":
        183,\n     \"zone\": 3,\n     \"verticalPenetration\": 6,\n     \"opening\":
        48,\n     \"areaElement\": 108\n   }\n }\n```"
      operationId: Dataset_Get
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: The get dataset request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          $ref: '#/components/responses/default'
    delete:
      description: 'You can use this API to delete old/unused datasets to create space
        for new Creator content.


        ### Submit Delete Request


        To delete your content you will issue a `DELETE` request where the path will
        contain the `datasetId` of the dataset to delete.'
      operationId: Dataset_Delete
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '204':
          description: The dataset delete request completed successfully. The resource
            referenced by the `datasetId` was deleted from the server.
        default:
          $ref: '#/components/responses/default'
  /datasets/operations/{operationId}:
    get:
      description: 'This API allows the caller to view the current progress of a dataset
        operation and the path is obtained from a call to the Create API.


        ### Submit Operations Request


        To view the current progress of a dataset operation, you will use a `GET`
        request where the `operationId` is the ID representing the operation.


        ### Operation Response


        While in progress, a `200-OK` http status code will be returned with no extra
        headers. If the operation succeeds, a `200-OK` http status code with Resource-Location
        header will be returned.'
      operationId: Dataset_GetOperation
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetOperationId'
      responses:
        '200':
          description: The operation is running or complete. If the operation was
            successful, use the Resource-Location header to obtain the path to the
            result.
          headers:
            Resource-Location:
              description: If successful, a URI where details on the newly created
                resource can be found.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LongRunningOperationResult'
        default:
          $ref: '#/components/responses/default'
servers:
- url: https://{geography}.atlas.microsoft.com
  variables:
    geography:
      description: This parameter specifies where the Azure Maps Creator resource
        is located.  Valid values are us and eu.
      default: us
      enum:
      - us
      - eu
      x-ms-enum:
        name: GeographicResourceLocation
        modelAsString: true
        values:
        - value: us
          description: Used to access an Azure Maps Creator resource in the United
            States
        - value: eu
          description: Used to access an Azure Maps Creator resource in Europe
      x-ms-parameter-location: client
components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    ConversionIdQuery:
      name: conversionId
      description: ID to create the dataset. The `conversionId` must be obtained from
        a successful call to the Conversion Service [Convert API](https://docs.microsoft.com/rest/api/maps/2023-07-01/conversion/convert).
        Only one conversionId can be provided per API call.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    DatasetDescription:
      name: description
      description: The description to be given to the dataset.
      in: query
      x-ms-parameter-location: method
      schema:
        type: string
    DatasetId:
      name: datasetId
      in: path
      description: The identifier for the dataset to query from.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    AppendDatasetId:
      name: datasetId
      in: query
      description: The ID of the dataset to append with.
      x-ms-parameter-location: method
      schema:
        type: string
    DatasetOperationId:
      name: operationId
      in: path
      description: The ID to query the status for the dataset create/import request.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ClientId:
      name: x-ms-client-id
      x-ms-client-name: clientId
      description: Indicates the account intended for use with the Microsoft Entra
        ID security model. This unique ID for the Azure Maps account can be obtained
        from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
        For more information on using Microsoft Entra ID security in Azure Maps, see
        [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
      in: header
      x-ms-parameter-location: client
      schema:
        type: string
  responses:
    default:
      description: An unexpected error occurred.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    202AsyncV2:
      description: 'Request Accepted: The request has been accepted for processing.
        Please use the URL in the Operation-Location Header to obtain status.'
      headers:
        Operation-Location:
          description: New URL to check for the results of the long-running operation.
          schema:
            type: string
  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Azure Active Directory OAuth2](https://docs.microsoft.com/azure/active-directory/develop/v1-overview)
        Flows. When paired with [Azure role-based access](https://docs.microsoft.com/azure/role-based-access-control/overview)
        control it can be used to control access to Azure Maps REST APIs. Azure role-based
        access controls are used to designate access to one or more Azure Maps resource
        account or sub-resources. Any user, group, or service principal can be granted
        access via a  built-in role or a custom role composed of one or more permissions
        to Azure Maps REST APIs.\n\nTo implement scenarios, we recommend viewing [authentication
        concepts](https://aka.ms/amauth). In summary, this security definition provides
        a solution for modeling application(s) via objects capable of access control
        on specific APIs and scopes.\n\n#### Notes\n* This security definition **requires**
        the use of the `x-ms-client-id` header to indicate which Azure Maps resource
        the application is requesting access to. This can be acquired from the [Maps
        management API](https://aka.ms/amauthdetails).\n* \nThe `Authorization URL`
        is specific to the Azure public cloud instance. Sovereign clouds have unique
        Authorization URLs and Azure Active directory configurations. \n* \nThe Azure
        role-based access control is configured from the [Azure management plane](https://aka.ms/amrbac)
        via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n* \nUsage of
        the [Azure Maps Web SDK](https://aka.ms/amaadmc) allows for configuration
        based setup of an application for multiple use cases.\n* Currently, Azure
        Active Directory [v1.0 or v2.0](https://docs.microsoft.com/azure/active-directory/develop/azure-ad-endpoint-comparison)
        supports Work, School, and Guests but does not support Personal accounts."
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    SharedKey:
      type: apiKey
      description: "This is a shared key that is provisioned when you [Create an Azure
        Maps account](https://docs.microsoft.com/azure/azure-maps/quick-demo-map-app#create-an-azure-maps-account)
        in the Azure portal or using PowerShell, CLI, Azure SDKs, or REST API.\n\n
        With this key, any application can access all REST API. In other words, this
        key can be used as a master key in the account that they are issued in.\n\n
        For publicly exposed applications, our recommendation is to use the [confidential
        client applications](https://docs.microsoft.com/azure/azure-maps/authentication-best-practices#confidential-client-applications)
        approach to access Azure Maps REST APIs so your key can be securely stored."
      name: subscription-key
      in: query
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List
        SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through
        the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,
        or REST APIs.\n\n With this token, any application is authorized to access
        with Azure role-based access controls and fine-grain control to the expiration,
        rate, and region(s) of use for the particular token. In other words, the SAS
        Token can be used to allow applications to control access in a more secured
        way than the shared key.\n\n For publicly exposed applications, our recommendation
        is to configure a specific list of allowed origins on the [Map account resource](https://aka.ms/amauth)
        to limit rendering abuse and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    DatasetListResult:
      description: The response model for the Dataset List API. The response body
        will contain a list of all the previously created datasets.
      type: object
      properties:
        datasets:
          description: A list of all the previously created datasets.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Dataset'
        nextLink:
          description: If present, the location of the next page of data.
          type: string
          readOnly: true
    Dataset:
      description: Detail information for the dataset.
      type: object
      properties:
        created:
          description: The created timestamp for the dataset.
          type: string
          format: date-time
          readOnly: true
        datasetId:
          description: The id for the dataset.
          type: string
          readOnly: true
        ontology:
          $ref: '#/components/schemas/Ontology'
        description:
          description: The description for the dataset.
          type: string
          readOnly: true
        datasetSources:
          $ref: '#/components/schemas/DatasetSources'
        featureCounts:
          description: The feature counts for the dataset.
          type: object
          readOnly: true
    DatasetSources:
      description: Information about the details of the create request for the dataset.
      type: object
      properties:
        conversionIds:
          description: The `conversionIds` used to create the dataset.
          type: array
          readOnly: true
          items:
            type: string
        appendDatasetId:
          description: The dataset that was appended to create the current dataset.
          type: string
          readOnly: true
    ErrorDetail:
      type: object
      description: The error detail.
      properties:
        code:
          readOnly: true
          type: string
          description: The error code.
        message:
          readOnly: true
          type: string
          description: The error message.
        target:
          readOnly: true
          type: string
          description: The error target.
        details:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers: []
          description: The error details.
        additionalInfo:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          description: The error additional info.
    ErrorAdditionalInfo:
      type: object
      properties:
        type:
          readOnly: true
          type: string
          description: The additional info type.
        info:
          readOnly: true
          type: object
          description: The additional info.
      description: The resource management error additional info.
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Ontology:
      type: string
      description: The ontology version of this dataset.
      readOnly: true
    LongRunningOperationResult:
      description: The response model for a Long-Running Operations API.
      type: object
      properties:
        operationId:
          description: The Id for this long-running operation.
          type: string
        status:
          description: The status state of the request.
          type: string
          enum:
          - NotStarted
          - Running
          - Failed
          - Succeeded
          x-ms-enum:
            name: LroStatus
            modelAsString: true
            values:
            - value: NotStarted
              description: The request has not started processing yet.
            - value: Running
              description: The request has started processing.
            - value: Failed
              description: The request has one or more failures.
            - value: Succeeded
              description: The request has successfully completed.
          readOnly: true
        created:
          description: The created timestamp.
          type: string
          format: date-time
          readOnly: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
        warning:
          $ref: '#/components/schemas/ErrorDetail'
