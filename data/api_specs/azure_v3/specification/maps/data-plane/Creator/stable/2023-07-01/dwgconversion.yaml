openapi: 3.0.0
info:
  title: Azure Maps Conversion Service
  version: 2023-07-01
  description: APIs for converting DWG Packages in Azure Maps.
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- SharedKey: []
- SasToken: []
paths:
  /conversions:
    post:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nCreator
        makes it possible to develop applications based on your private indoor map
        data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator.\n\nThe
        Conversion API lets the caller import a set of DWG design files as a zipped
        [Drawing Package](https://aka.ms/am-drawing-package) into Azure Maps. The
        [Drawing Package](https://aka.ms/am-drawing-package) should first be uploaded
        using the [Azure Maps Data Service](https://docs.microsoft.com/rest/api/maps/data).
        Once uploaded, use the `udid` returned by the [Data Upload API](https://docs.microsoft.com/rest/api/maps/data-v2/upload)
        to call this Conversion API.\n\n## Convert DWG package\n\nThe Conversion API
        performs a [long-running operation](https://aka.ms/am-creator-lrt-v2).\n\n##
        Debug DWG package issues\n\n\nDuring the Conversion process, if there are
        any issues with the DWG package [errors and warnings](https://aka.ms/am-conversion-errors)
        are provided in the response along with a *diagnostic package* to visualize
        and diagnose these issues. In case any issues are encountered with your DWG
        package, the Conversion operation status process as detailed [here](https://aka.ms/am-creator-lrt-v2)
        returns the location of the *diagnostic package* that can be downloaded by
        the caller to help them visualize and diagnose these issues. The *diagnostic
        package* location can be found in the properties section of the conversion
        operation status response and looks like the following:\n\n```json\n{\n \"properties\":
        {\n \"diagnosticPackageLocation\": \"https://us.atlas.microsoft.com/mapdata/{DiagnosticPackageId}?api-version=1.0\"
        \n } \n}\n```\n\nThe *diagnostic package* can be downloaded by executing a
        `HTTP GET` request on the `diagnosticPackageLocation`.\nFor more details on
        how to use the tool to visualize and diagnose all the errors and warnings
        see [Drawing Error Visualizer](https://aka.ms/am-drawing-errors-visualizer).
        <br>\n\nA conversion operation will be marked as *success* if there are zero
        or more warnings but will be marked as *failed* if any errors are encountered. "
      operationId: Conversion_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/UdidQuery'
      - $ref: '#/components/parameters/DwgPackageVersion'
      - $ref: '#/components/parameters/DescriptionDwgConversion'
      responses:
        '202':
          $ref: '#/components/responses/202AsyncV2'
        default:
          $ref: '#/components/responses/default'
    get:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nCreator
        makes it possible to develop applications based on your private indoor map
        data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator.\n\nThis
        API allows the caller to fetch a list of all successful data conversions submitted
        previously using the [Conversion API](https://docs.microsoft.com/rest/api/maps/v2/conversion/convert).
        \  \n\n### Submit List Request\n\nTo list all successful conversions you will
        issue a `GET` request with no additional parameters.\n\n### List Data Response\n\nThe
        Conversion List API returns the complete list of all conversion details in
        `json` format.<br>\n\nHere is a sample response returning the details of two
        successful conversion requests:  \n\n<br>\n\n```json\n{\n    \"conversions\":
        \n    [\n        {\n            \"conversionId\": \"54398242-ea6c-1f31-4fa6-79b1ae0fc24d\",\n
        \           \"udid\": \"31838736-8b84-11ea-bc55-0242ac130003\",\n            \"created\":
        \"5/19/2020 9:00:00 AM +00:00\",\n            \"description\": \"User provided
        description.\",\n            \"featureCounts\": {\n                \"DIR\":
        1,\n                \"LVL\": 3,\n                \"FCL\": 1,\n                \"UNIT\":
        150,\n                \"CTG\": 8,\n                \"AEL\": 0,\n                \"OPN\":
        10\n            }\n        },\n        {\n            \"conversionId\": \"2acf7d32-8b84-11ea-bc55-0242ac130003\",\n
        \           \"udid\": \"1214bc58-8b84-11ea-bc55-0242ac1300039\",\n            \"created\":
        \"5/19/2020 9:00:00 AM +00:00\",\n            \"description\": \"User provided
        description.\",\n            \"featureCounts\": {\n                \"DIR\":
        1,\n                \"LVL\": 3,\n                \"FCL\": 1,\n                \"UNIT\":
        150,\n                \"CTG\": 8,\n                \"AEL\": 0,\n                \"OPN\":
        10\n            }\n        }\n    ]\n}\n```\n\n<br>"
      operationId: Conversion_List
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      x-ms-pageable:
        itemName: conversions
        nextLinkName: nextLink
      responses:
        '200':
          description: List request completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionListResult'
        default:
          $ref: '#/components/responses/default'
  /conversions/{conversionId}:
    get:
      description: '**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).


        Creator makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator.


        This API allows the caller to fetch a successful data conversion submitted
        previously using the [Conversion API](https://docs.microsoft.com/rest/api/maps/v2/conversion/convert).  '
      operationId: Conversion_Get
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ConversionId'
      responses:
        '200':
          description: Returns details of the specified conversion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
        default:
          $ref: '#/components/responses/default'
    delete:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nCreator
        makes it possible to develop applications based on your private indoor map
        data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator.\n\nThis
        API allows the caller to delete any data conversions created previously using
        the [Conversion API](https://docs.microsoft.com/rest/api/maps/v2/conversion/convert).\n\n###
        Submit Delete Request\n\nTo delete your conversion data you will issue a `DELETE`
        request where the path will contain the `conversionId` of the data to delete.\n\n###
        Conversion Delete Response\n\nThe Conversion Delete API returns a HTTP `204
        No Content` response with an empty body, if the converted data resources were
        deleted successfully.<br>    \nA HTTP `400 Bad Request` error response will
        be returned if no resource associated with the passed-in `conversionId` is
        found.    "
      operationId: Conversion_Delete
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ConversionId'
      responses:
        '204':
          description: Conversion delete request completed successfully. The content
            for `conversionId` was deleted on the server.
        default:
          $ref: '#/components/responses/default'
  /conversions/operations/{operationId}:
    get:
      description: This path will be obtained from a call to POST /conversions.  While
        in progress, an http200 will be returned with no extra headers -  followed
        by an http200 with Resource-Location header once successfully completed.
      operationId: Conversion_GetOperation
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/ConversionOperationId'
      responses:
        '200':
          description: The operation is running or complete. If the operation was
            successful, use the Resource-Location header to obtain the path to the
            result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LongRunningOperationResult'
        default:
          $ref: '#/components/responses/default'
servers:
- url: https://{geography}.atlas.microsoft.com
  variables:
    geography:
      description: This parameter specifies where the Azure Maps Creator resource
        is located.  Valid values are us and eu.
      default: us
      enum:
      - us
      - eu
      x-ms-enum:
        name: GeographicResourceLocation
        modelAsString: true
        values:
        - value: us
          description: Used to access an Azure Maps Creator resource in the United
            States
        - value: eu
          description: Used to access an Azure Maps Creator resource in Europe
      x-ms-parameter-location: client
components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    UdidQuery:
      name: udid
      description: The unique data id for the content. The `udid` must have been obtained
        from a successful [Data Upload API](https://docs.microsoft.com/rest/api/maps/data-v2/upload-preview)
        call.
      in: query
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ConversionId:
      name: conversionId
      description: The conversion id for the content. The `conversionId` must have
        been obtained from a successful [Conversion API](https://docs.microsoft.com/rest/api/maps/v2/conversion/convert)
        call.
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    DwgPackageVersion:
      name: dwgPackageVersion
      description: The drawing package version.
      in: query
      required: true
      x-ms-enum:
        name: DwgPackageVersion
        modelAsString: true
        values:
        - value: '1.0'
          description: The drawing package version 1.0. Please refer to this [article](https://docs.microsoft.com/azure/azure-maps/drawing-requirements?pivots=1.0)
            for more information.
        - value: '2.0'
          description: The drawing package version 2.0. Please refer to this [article](https://docs.microsoft.com/azure/azure-maps/drawing-requirements?pivots=2.0)
            for more information.
      x-ms-client-default: '1.0'
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - '1.0'
        - '2.0'
    DescriptionDwgConversion:
      name: description
      description: User provided description of the content being converted.
      in: query
      x-ms-parameter-location: method
      schema:
        type: string
    ConversionOperationId:
      name: operationId
      in: path
      description: The ID to query the status for the Conversion create/import request.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ClientId:
      name: x-ms-client-id
      x-ms-client-name: clientId
      description: Indicates the account intended for use with the Microsoft Entra
        ID security model. This unique ID for the Azure Maps account can be obtained
        from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
        For more information on using Microsoft Entra ID security in Azure Maps, see
        [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
      in: header
      x-ms-parameter-location: client
      schema:
        type: string
  responses:
    default:
      description: An unexpected error occurred.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    202AsyncV2:
      description: 'Request Accepted: The request has been accepted for processing.
        Please use the URL in the Operation-Location Header to obtain status.'
      headers:
        Operation-Location:
          description: New URL to check for the results of the long-running operation.
          schema:
            type: string
  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Azure Active Directory OAuth2](https://docs.microsoft.com/azure/active-directory/develop/v1-overview)
        Flows. When paired with [Azure role-based access](https://docs.microsoft.com/azure/role-based-access-control/overview)
        control it can be used to control access to Azure Maps REST APIs. Azure role-based
        access controls are used to designate access to one or more Azure Maps resource
        account or sub-resources. Any user, group, or service principal can be granted
        access via a  built-in role or a custom role composed of one or more permissions
        to Azure Maps REST APIs.\n\nTo implement scenarios, we recommend viewing [authentication
        concepts](https://aka.ms/amauth). In summary, this security definition provides
        a solution for modeling application(s) via objects capable of access control
        on specific APIs and scopes.\n\n#### Notes\n* This security definition **requires**
        the use of the `x-ms-client-id` header to indicate which Azure Maps resource
        the application is requesting access to. This can be acquired from the [Maps
        management API](https://aka.ms/amauthdetails).\n* \nThe `Authorization URL`
        is specific to the Azure public cloud instance. Sovereign clouds have unique
        Authorization URLs and Azure Active directory configurations. \n* \nThe Azure
        role-based access control is configured from the [Azure management plane](https://aka.ms/amrbac)
        via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n* \nUsage of
        the [Azure Maps Web SDK](https://aka.ms/amaadmc) allows for configuration
        based setup of an application for multiple use cases.\n* Currently, Azure
        Active Directory [v1.0 or v2.0](https://docs.microsoft.com/azure/active-directory/develop/azure-ad-endpoint-comparison)
        supports Work, School, and Guests but does not support Personal accounts."
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    SharedKey:
      type: apiKey
      description: "This is a shared key that is provisioned when you [Create an Azure
        Maps account](https://docs.microsoft.com/azure/azure-maps/quick-demo-map-app#create-an-azure-maps-account)
        in the Azure portal or using PowerShell, CLI, Azure SDKs, or REST API.\n\n
        With this key, any application can access all REST API. In other words, this
        key can be used as a master key in the account that they are issued in.\n\n
        For publicly exposed applications, our recommendation is to use the [confidential
        client applications](https://docs.microsoft.com/azure/azure-maps/authentication-best-practices#confidential-client-applications)
        approach to access Azure Maps REST APIs so your key can be securely stored."
      name: subscription-key
      in: query
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List
        SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through
        the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,
        or REST APIs.\n\n With this token, any application is authorized to access
        with Azure role-based access controls and fine-grain control to the expiration,
        rate, and region(s) of use for the particular token. In other words, the SAS
        Token can be used to allow applications to control access in a more secured
        way than the shared key.\n\n For publicly exposed applications, our recommendation
        is to configure a specific list of allowed origins on the [Map account resource](https://aka.ms/amauth)
        to limit rendering abuse and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    ConversionListResult:
      description: The response model for the Conversion List API.
      type: object
      properties:
        conversions:
          description: A list of all the previously submitted conversion requests.
          type: array
          items:
            $ref: '#/components/schemas/Conversion'
        nextLink:
          description: If present, the location of the next page of data.
          type: string
    Conversion:
      description: Detail information for the conversion requests.
      type: object
      properties:
        conversionId:
          description: A unique id that represents the artifact of a _successfully_
            completed conversion process.
          type: string
        ontology:
          $ref: '#/components/schemas/Ontology'
        udid:
          description: The unique id of the content provided to create this conversion.
          type: string
        created:
          description: The date and time of this conversion.
          type: string
        description:
          description: User provided description of the content being converted.
          type: string
        featureCounts:
          description: A summary of feature counts in this conversion.
          additionalProperties:
            type: integer
            format: int64
          type: object
    ErrorDetail:
      type: object
      description: The error detail.
      properties:
        code:
          readOnly: true
          type: string
          description: The error code.
        message:
          readOnly: true
          type: string
          description: The error message.
        target:
          readOnly: true
          type: string
          description: The error target.
        details:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers: []
          description: The error details.
        additionalInfo:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          description: The error additional info.
    ErrorAdditionalInfo:
      type: object
      properties:
        type:
          readOnly: true
          type: string
          description: The additional info type.
        info:
          readOnly: true
          type: object
          description: The additional info.
      description: The resource management error additional info.
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Ontology:
      type: string
      description: The ontology version of this dataset.
      readOnly: true
    LongRunningOperationResult:
      description: The response model for a Long-Running Operations API.
      type: object
      properties:
        operationId:
          description: The Id for this long-running operation.
          type: string
        status:
          description: The status state of the request.
          type: string
          enum:
          - NotStarted
          - Running
          - Failed
          - Succeeded
          x-ms-enum:
            name: LroStatus
            modelAsString: true
            values:
            - value: NotStarted
              description: The request has not started processing yet.
            - value: Running
              description: The request has started processing.
            - value: Failed
              description: The request has one or more failures.
            - value: Succeeded
              description: The request has successfully completed.
          readOnly: true
        created:
          description: The created timestamp.
          type: string
          format: date-time
          readOnly: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
        warning:
          $ref: '#/components/schemas/ErrorDetail'
