openapi: 3.0.0
info:
  title: Azure Maps Style Service
  version: 2023-07-01
  description: This is an extension of the Azure Maps Tileset API to serve custom
    styles. It will allow a client to create a list of map styling information which
    can be combined with tilesetIds to create map configurations that can be consumed
    directly by front-end services (map control web & mobile SDKs, styling tools like
    [Maputnik](https://maputnik.github.io/editor/)).
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- SharedKey: []
- SasToken: []
paths:
  /styles:
    post:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nThe
        Style Create request allows the caller to create an Azure Maps style.\n\nCreator
        makes it possible to develop applications based on your private indoor map
        data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator.\n\n##
        Submit Create Request\n\nTo create your style you will make a `POST` request
        with an azure maps style. \n\nThe Create Style API is a [long-running operation](https://aka.ms/am-creator-lrt-v2)."
      operationId: Style_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DescriptionStyle'
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/zip:
            schema:
              type: object
        description: "The style content to be uploaded. If JSON data format is provided,
          then the request body should follow [Layers specification](https://maplibre.org/maplibre-gl-js-docs/style-spec/layers)
          in MapLibre Style specification. If ZIP data format is provided, you should
          also provide the sprite sheets and associated index files which contains
          icons used in the style configuration json file. The zip file should contain
          five files, including two sprite sheet PNG files, two JSON sprite index
          files with matching filenames to their corresponding PNG files, and one
          JSON style file. Ensure that the filenames are appropriately descriptive
          to convey their purpose and maintain consistency between the associated
          files. \n\n Note: The embedded JSON size limit is 1 MB and zip file size
          limit is 23 MB.\n\n\n Learn more about how to use [MapLibre sprite](https://maplibre.org/maplibre-style-spec/sprite)
          here."
        required: true
      responses:
        '202':
          $ref: '#/components/responses/202AsyncV2'
        default:
          $ref: '#/components/responses/default'
    get:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nThe
        Style List request allows the caller to fetch a list of all styles created.
        The default indoor style `microsoft-maps:indoor_2022-01-01` and `microsoft-maps:indoor_dark_2022-01-01`
        will not show in the list response. But you can still use it as your own style
        by the predefined alias.\n\n  Creator makes it possible to develop applications
        based on your private indoor map data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator. \n<br>"
      operationId: Style_List
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      x-ms-pageable:
        itemName: styles
        nextLinkName: nextLink
      responses:
        '200':
          description: List style request completed successfully. The response body
            contains a list of all styles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleListResult'
        default:
          $ref: '#/components/responses/default'
  /styles/{styleId}:
    get:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nThe
        Style Get request allows the caller to get a style. Customers can get two
        predefined default styles using alias `microsoft-maps:indoor_2022-01-01` for
        indoor light and `microsoft-maps:indoor_dark_2022-01-01` for indoor dark.
        \ \n\n Creator makes it possible to develop applications based on your private
        indoor map data using Azure Maps API and SDK. [This](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps)
        article introduces concepts and tools that apply to Azure Maps Creator."
      operationId: Style_Get
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/StyleId'
      responses:
        '200':
          description: Get style request completed successfully. The response body
            contains a zip file with style content.
          headers:
            Content-Type:
              description: The content-type for the response.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: object
                format: file
                readOnly: true
        default:
          $ref: '#/components/responses/default'
    delete:
      description: "**Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).\n\nThe
        Style Delete request allows the caller to remove a style from their Azure
        Maps account.<br> \n\n### Submit Delete Request\n\nAn `HTTP DELETE` request
        with the `styleId` in the path of the request is required to remove an existing
        style from your Azure Maps account.<br>    \n\n#### Delete request \"Successful\"\n\nThe
        Style Delete API returns a HTTP `204 No Content` response with an empty body,
        if the style was deleted successfully.<br>    \n\n#### Delete request \"Failed\"\n\nA
        HTTP `400 Bad Request` error response will be returned if the style with the
        passed-in `styleId` is not found. \n\nHere is a sample error response:\n\n<br>\n\n```json\n{\n
        \ \"error\": {\n      \"code\": \"400 BadRequest\",\n      \"message\": \"Bad
        request - Style Id: d85b5b27-5fc4-4599-8b50-47160e90f8ce does not exist.\"\n
        \ }\n}\n```"
      operationId: Style_Delete
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/StyleId'
      responses:
        '204':
          description: Style delete request completed successfully.
        default:
          $ref: '#/components/responses/default'
  /styles/operations/{operationId}:
    get:
      description: The Style Get Operation request is obtained from the call to create
        a style. It is returned in the response headers Resource-Location key once
        the creation process has completed successfully.
      operationId: Style_GetOperation
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/StyleOperationId'
      responses:
        '200':
          description: The operation is running or complete. If the operation was
            successful, use the Resource-Location header to obtain the path to the
            result.
          headers:
            Resource-Location:
              description: If successful, a URI where details on the newly created
                resource can be found.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LongRunningOperationResult'
        default:
          $ref: '#/components/responses/default'
servers:
- url: https://{geography}.atlas.microsoft.com
  variables:
    geography:
      description: This parameter specifies where the Azure Maps Creator resource
        is located.  Valid values are us and eu.
      default: us
      enum:
      - us
      - eu
      x-ms-enum:
        name: GeographicResourceLocation
        modelAsString: true
        values:
        - value: us
          description: Used to access an Azure Maps Creator resource in the United
            States
        - value: eu
          description: Used to access an Azure Maps Creator resource in Europe
      x-ms-parameter-location: client
components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    StyleId:
      name: styleId
      description: The Style Id.
      in: path
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    DescriptionStyle:
      name: description
      description: User provided description of the style. Maximum length 1024 characters.
      in: query
      x-ms-parameter-location: method
      schema:
        type: string
    StyleOperationId:
      name: operationId
      in: path
      description: The ID to query the status for the style create request.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ClientId:
      name: x-ms-client-id
      x-ms-client-name: clientId
      description: Indicates the account intended for use with the Microsoft Entra
        ID security model. This unique ID for the Azure Maps account can be obtained
        from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
        For more information on using Microsoft Entra ID security in Azure Maps, see
        [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
      in: header
      x-ms-parameter-location: client
      schema:
        type: string
  responses:
    default:
      description: An unexpected error occurred.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    202AsyncV2:
      description: 'Request Accepted: The request has been accepted for processing.
        Please use the URL in the Operation-Location Header to obtain status.'
      headers:
        Operation-Location:
          description: New URL to check for the results of the long-running operation.
          schema:
            type: string
  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Azure Active Directory OAuth2](https://docs.microsoft.com/azure/active-directory/develop/v1-overview)
        Flows. When paired with [Azure role-based access](https://docs.microsoft.com/azure/role-based-access-control/overview)
        control it can be used to control access to Azure Maps REST APIs. Azure role-based
        access controls are used to designate access to one or more Azure Maps resource
        account or sub-resources. Any user, group, or service principal can be granted
        access via a  built-in role or a custom role composed of one or more permissions
        to Azure Maps REST APIs.\n\nTo implement scenarios, we recommend viewing [authentication
        concepts](https://aka.ms/amauth). In summary, this security definition provides
        a solution for modeling application(s) via objects capable of access control
        on specific APIs and scopes.\n\n#### Notes\n* This security definition **requires**
        the use of the `x-ms-client-id` header to indicate which Azure Maps resource
        the application is requesting access to. This can be acquired from the [Maps
        management API](https://aka.ms/amauthdetails).\n* \nThe `Authorization URL`
        is specific to the Azure public cloud instance. Sovereign clouds have unique
        Authorization URLs and Azure Active directory configurations. \n* \nThe Azure
        role-based access control is configured from the [Azure management plane](https://aka.ms/amrbac)
        via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n* \nUsage of
        the [Azure Maps Web SDK](https://aka.ms/amaadmc) allows for configuration
        based setup of an application for multiple use cases.\n* Currently, Azure
        Active Directory [v1.0 or v2.0](https://docs.microsoft.com/azure/active-directory/develop/azure-ad-endpoint-comparison)
        supports Work, School, and Guests but does not support Personal accounts."
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    SharedKey:
      type: apiKey
      description: "This is a shared key that is provisioned when you [Create an Azure
        Maps account](https://docs.microsoft.com/azure/azure-maps/quick-demo-map-app#create-an-azure-maps-account)
        in the Azure portal or using PowerShell, CLI, Azure SDKs, or REST API.\n\n
        With this key, any application can access all REST API. In other words, this
        key can be used as a master key in the account that they are issued in.\n\n
        For publicly exposed applications, our recommendation is to use the [confidential
        client applications](https://docs.microsoft.com/azure/azure-maps/authentication-best-practices#confidential-client-applications)
        approach to access Azure Maps REST APIs so your key can be securely stored."
      name: subscription-key
      in: query
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List
        SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through
        the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,
        or REST APIs.\n\n With this token, any application is authorized to access
        with Azure role-based access controls and fine-grain control to the expiration,
        rate, and region(s) of use for the particular token. In other words, the SAS
        Token can be used to allow applications to control access in a more secured
        way than the shared key.\n\n For publicly exposed applications, our recommendation
        is to configure a specific list of allowed origins on the [Map account resource](https://aka.ms/amauth)
        to limit rendering abuse and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    StyleListResult:
      description: The response model for the Style List API. Returns a list of all
        styles.
      type: object
      properties:
        styles:
          description: A list of all styles.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StyleListItem'
        nextLink:
          description: If present, the location of the next page of data.
          type: string
          readOnly: true
    StyleListItem:
      description: Detail information for the data.
      type: object
      properties:
        styleId:
          description: The unique style id for the style.
          type: string
          readOnly: true
        description:
          description: The description the caller provided when creating the style.
            Maximum length 1024 characters.
          type: string
          readOnly: true
        created:
          description: The creation date and time of this style. As defined by `date-time`
            - [RFC3339](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14)
          type: string
          format: date-time
          readOnly: true
    StyleLayerObject:
      description: A layer object.
      type: object
      properties:
        id:
          description: The unique id for the layer.
          type: string
          readOnly: true
        type:
          description: The type of the layer.
          type: string
          readOnly: true
        source-layer:
          description: The source layer.
          type: string
          readOnly: true
        source:
          description: The source.
          type: string
          readOnly: true
        layout:
          description: The layout of the layer.
          type: object
          readOnly: true
        paint:
          description: The paint configuration of the layer.
          type: object
          readOnly: true
    Style:
      description: Detail information for the data.
      type: object
      properties:
        id:
          description: The unique style id for the style.
          type: string
          readOnly: true
        version:
          description: The version of the style.
          type: number
          readOnly: true
        created:
          description: The creation date and time of this style.
          type: string
          readOnly: true
        description:
          description: The description the caller provided when creating the style.
            Maximum length 1024 characters.
          type: string
          readOnly: true
        sources:
          description: Data source specifications.
          type: object
          readOnly: true
        sprite:
          description: A base URL for retrieving the sprite image and metadata.
          type: string
          readOnly: true
        layers:
          description: A style's layers property lists all the layers available in
            that style
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/StyleLayerObject'
    ErrorDetail:
      type: object
      description: The error detail.
      properties:
        code:
          readOnly: true
          type: string
          description: The error code.
        message:
          readOnly: true
          type: string
          description: The error message.
        target:
          readOnly: true
          type: string
          description: The error target.
        details:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          x-ms-identifiers: []
          description: The error details.
        additionalInfo:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/ErrorAdditionalInfo'
          x-ms-identifiers: []
          description: The error additional info.
    ErrorAdditionalInfo:
      type: object
      properties:
        type:
          readOnly: true
          type: string
          description: The additional info type.
        info:
          readOnly: true
          type: object
          description: The additional info.
      description: The resource management error additional info.
    ErrorResponse:
      type: object
      title: Error response
      description: Common error response for all Azure Resource Manager APIs to return
        error details for failed operations. (This also follows the OData error response
        format.).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    LongRunningOperationResult:
      description: The response model for a Long-Running Operations API.
      type: object
      properties:
        operationId:
          description: The Id for this long-running operation.
          type: string
        status:
          description: The status state of the request.
          type: string
          enum:
          - NotStarted
          - Running
          - Failed
          - Succeeded
          x-ms-enum:
            name: LroStatus
            modelAsString: true
            values:
            - value: NotStarted
              description: The request has not started processing yet.
            - value: Running
              description: The request has started processing.
            - value: Failed
              description: The request has one or more failures.
            - value: Succeeded
              description: The request has successfully completed.
          readOnly: true
        created:
          description: The created timestamp.
          type: string
          format: date-time
          readOnly: true
        error:
          $ref: '#/components/schemas/ErrorDetail'
        warning:
          $ref: '#/components/schemas/ErrorDetail'
