openapi: 3.0.0
info:
  title: Azure Maps Features Service
  version: 2023-07-01
  description: Azure Maps Features REST APIs
security:
- AADToken:
  - https://atlas.microsoft.com/.default
- SharedKey: []
- SasToken: []
paths:
  /features/datasets/{datasetId}:
    get:
      description: 'The Get Landing Page API provides links to the API definition,
        the Conformance statements, and the metadata about the feature data in this
        dataset.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetLandingPage
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/api:
    get:
      description: 'The Get API Definition API provides a description of the capabilities
        of the Features service. It can be used by developers to understand the API
        or by development tools to support the implementation of servers and clients.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetApiDefinition
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDefinitionResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/conformance:
    get:
      description: 'The Get Conformance API lists all requirements classes specified
        in the standard that the server conforms to.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_ListConformance
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConformanceResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/collections:
    get:
      description: 'The Get Collections API provides a list of all the collections
        in a given dataset.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetCollections
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/collections/{collectionId}:
    get:
      description: 'The Get Collection API returns the collection identified by the
        provided id in the given dataset.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetCollection
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/collections/{collectionId}/definition:
    get:
      description: 'The Collection Definition API provides the detailed data model
        of a given collection.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetCollectionDefinition
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDefinitionResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/collections/{collectionId}/items:
    get:
      description: 'The Get Features API returns the list of features in the given
        collection.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_GetItems
      parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/LimitFeatures'
      - $ref: '#/components/parameters/Bbox'
      - $ref: '#/components/parameters/Filter'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedGeoJsonFeatureCollection'
        default:
          $ref: '#/components/responses/default'
    post:
      description: 'This Post Feature API conforms with the **drafted** [Open Geospatial
        Consortium API - Features - Part 4: Create, Replace, Update and Delete](http://docs.opengeospatial.org/DRAFTS/20-002.html)
        document. This API creates a feature with the provided attributes in the given
        collection.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_Create
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      requestBody:
        $ref: '#/components/requestBodies/Features_CreateFeature'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFeatureResult'
        default:
          $ref: '#/components/responses/default'
  /features/datasets/{datasetId}/collections/{collectionId}/items/{featureId}:
    get:
      description: 'The Get Feature API returns the feature identified by the provided
        id in the given collection.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_Get
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/FeatureId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureResult'
        default:
          $ref: '#/components/responses/default'
    put:
      description: 'This Put Feature API conforms with the **drafted** [Open Geospatial
        Consortium API - Features - Part 4: Create, Replace, Update and Delete](http://docs.opengeospatial.org/DRAFTS/20-002.html)
        document. This API **replaces** the feature identified by the provided id
        in the given collection, i.e., the request body overwrites all the existing
        attributes of a feature.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_Replace
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/FeatureId'
      requestBody:
        $ref: '#/components/requestBodies/Features_CreateFeature'
      responses:
        '204':
          description: Feature Updated.
        default:
          $ref: '#/components/responses/default'
    patch:
      description: 'This Patch Feature API conforms with the **drafted** [Open Geospatial
        Consortium API - Features - Part 4: Create, Replace, Update and Delete](http://docs.opengeospatial.org/DRAFTS/20-002.html)
        document. This API **updates** attributes by performing a merge patch on the
        feature identified by the provided id in the given collection. It allows for
        the update of individual feature attributes without implicitly overwriting
        excluded attributes in the request body.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_Update
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/FeatureId'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/FeatureAttributes'
        description: The geometry and properties of a feature.
        required: true
        x-ms-parameter-location: client
      responses:
        '204':
          description: Feature Updated.
        default:
          $ref: '#/components/responses/default'
    delete:
      description: 'This Delete Feature API conforms with the **drafted** [Open Geospatial
        Consortium API - Features - Part 4: Create, Replace, Update and Delete](http://docs.opengeospatial.org/DRAFTS/20-002.html)
        document. This API deletes the feature identified by the provided id in the
        given collection. Please note that if other existing features are dependent
        on the requested feature for deletion, the delete request will fail until
        the dependent features are deleted first.


        The Features API is a part of [Creator](https://docs.microsoft.com/azure/azure-maps/creator-indoor-maps),
        which makes it possible to develop applications based on your private indoor
        map data using Azure Maps API and SDK. Features GET APIs follow the [Open
        Geospatial Consortium API - Features - Part 1: Core corrigendum](http://www.opengis.net/doc/IS/ogcapi-features-1/1.0.1)
        standard to query [Datasets](https://docs.microsoft.com/rest/api/maps-creator/dataset).
        Datasets consist of multiple feature collections, which are a grouping of
        [features](https://tools.ietf.org/html/rfc7946#section-3.2) defined by a common
        schema.


        **Applies to:** see pricing [tiers](https://aka.ms/AzureMapsPricingTier).'
      operationId: Features_Delete
      parameters:
      - $ref: '#/components/parameters/ApiVersion'
      - $ref: '#/components/parameters/DatasetId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/FeatureId'
      responses:
        '204':
          description: Feature Deleted.
        default:
          $ref: '#/components/responses/default'
servers:
- url: https://{geography}.atlas.microsoft.com
  variables:
    geography:
      description: This parameter specifies where the Azure Maps Creator resource
        is located.  Valid values are us and eu.
      default: us
      enum:
      - us
      - eu
      x-ms-enum:
        name: GeographicResourceLocation
        modelAsString: true
        values:
        - value: us
          description: Used to access an Azure Maps Creator resource in the United
            States
        - value: eu
          description: Used to access an Azure Maps Creator resource in Europe
      x-ms-parameter-location: client
components:
  parameters:
    ApiVersion:
      name: api-version
      description: Version number of Azure Maps API.
      in: query
      required: true
      x-ms-parameter-location: client
      schema:
        type: string
    LimitFeatures:
      name: limit
      in: query
      description: 'The optional limit parameter limits the number of features that
        are presented in the response document.

        Only features that are on the first level of the collection in the response
        document are counted. Nested objects contained within the explicitly requested
        features shall not be counted.

        * Minimum = 1 * Maximum = 500 * Default = 10'
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 5000
    Filter:
      name: filter
      in: query
      description: 'Filter expression to search for features with specific property
        values in a given collection. Only feature properties of scalar type and equals
        operator are supported.

        This is a special parameter where the parameter name is a case sensitive property
        name. The scheme for this parameter is {property name}={property value}. Unless
        "filter" is one of the property names in the collection, "filter" should not
        be used as a parameter name. To search for features with "name" property value
        "21N13", use "name=21N13".

        Multiple filters are supported and should be represented as multiple query
        parameters. E.g., <property1>=<value1>&<property2>=<value2> String values
        are case sensitive.'
      x-ms-parameter-location: method
      schema:
        type: string
    Bbox:
      name: bbox
      x-ms-client-name: boundingBox
      in: query
      description: 'Only features that have a geometry that intersects the supplied
        bounding box are selected.

        * Lower left corner, coordinate axis 1 * Lower left corner, coordinate axis
        2 * Upper right corner, coordinate axis 1 * Upper right corner, coordinate
        axis 2

        The coordinate reference system of the values is WGS84 longitude/latitude
        (http://www.opengis.net/def/crs/OGC/1.3/CRS84) unless a different coordinate
        reference system is specified in the parameter `bbox-crs`.

        For WGS84 longitude/latitude the values are in most cases the sequence of
        minimum longitude, minimum latitude, maximum longitude and maximum latitude.
        However, in cases where the box spans the antimeridian the first value (west-most
        box edge) is larger than the third value (east-most box edge).'
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: number
          format: double
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: Identifier (name) of a specific collection.
      x-ms-parameter-location: method
      schema:
        type: string
    FeatureId:
      name: featureId
      in: path
      description: Case sensitive identifier of a specific feature.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    ClientId:
      name: x-ms-client-id
      x-ms-client-name: clientId
      description: Indicates the account intended for use with the Microsoft Entra
        ID security model. This unique ID for the Azure Maps account can be obtained
        from the [Azure Maps management plane Account API](/rest/api/maps-management/accounts).
        For more information on using Microsoft Entra ID security in Azure Maps, see
        [Manage authentication in Azure Maps](/azure/azure-maps/how-to-manage-authentication).
      in: header
      x-ms-parameter-location: client
      schema:
        type: string
    DatasetId:
      name: datasetId
      in: path
      description: The identifier for the dataset to query from.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
  responses:
    default:
      description: An unexpected error occurred.
      x-ms-error-response: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  requestBodies:
    Features_CreateFeature:
      content:
        application/geo+json:
          schema:
            $ref: '#/components/schemas/FeatureType'
            type: object
      description: A valid `GeoJSON Feature` object type. Please refer to [RFC 7946](https://tools.ietf.org/html/rfc7946#section-3.2)
        for details.
      required: true
      x-ms-parameter-location: client
  securitySchemes:
    AADToken:
      type: oauth2
      description: "These are the [Azure Active Directory OAuth2](https://docs.microsoft.com/azure/active-directory/develop/v1-overview)
        Flows. When paired with [Azure role-based access](https://docs.microsoft.com/azure/role-based-access-control/overview)
        control it can be used to control access to Azure Maps REST APIs. Azure role-based
        access controls are used to designate access to one or more Azure Maps resource
        account or sub-resources. Any user, group, or service principal can be granted
        access via a  built-in role or a custom role composed of one or more permissions
        to Azure Maps REST APIs.\n\nTo implement scenarios, we recommend viewing [authentication
        concepts](https://aka.ms/amauth). In summary, this security definition provides
        a solution for modeling application(s) via objects capable of access control
        on specific APIs and scopes.\n\n#### Notes\n* This security definition **requires**
        the use of the `x-ms-client-id` header to indicate which Azure Maps resource
        the application is requesting access to. This can be acquired from the [Maps
        management API](https://aka.ms/amauthdetails).\n* \nThe `Authorization URL`
        is specific to the Azure public cloud instance. Sovereign clouds have unique
        Authorization URLs and Azure Active directory configurations. \n* \nThe Azure
        role-based access control is configured from the [Azure management plane](https://aka.ms/amrbac)
        via Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n* \nUsage of
        the [Azure Maps Web SDK](https://aka.ms/amaadmc) allows for configuration
        based setup of an application for multiple use cases.\n* Currently, Azure
        Active Directory [v1.0 or v2.0](https://docs.microsoft.com/azure/active-directory/develop/azure-ad-endpoint-comparison)
        supports Work, School, and Guests but does not support Personal accounts."
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://atlas.microsoft.com/.default: https://atlas.microsoft.com/.default
    SharedKey:
      type: apiKey
      description: "This is a shared key that is provisioned when creating an [Azure
        Maps resource](https://aka.ms/amauth) through the Azure management plane  via
        Azure portal, PowerShell, CLI, Azure SDKs, or REST APIs.\n\n With this key,
        any application is authorized to access  all REST APIs. In other words, these
        can currently be treated as master keys to the account which they are issued
        for.\n\n For publicly exposed applications, our recommendation is to use server-to-server
        access of Azure Maps REST APIs where this key can be securely stored."
      name: subscription-key
      in: query
    SasToken:
      type: apiKey
      description: "This is a shared access signature token is created from the List
        SAS operation on the [Azure Maps resource](https://aka.ms/amauth) through
        the Azure management plane via Azure portal, PowerShell, CLI, Azure SDKs,
        or REST APIs.\n\n With this token, any application is authorized to access
        with Azure role-based access controls and fine-grain control to the expiration,
        rate, and region(s) of use for the particular token. In other words, the SAS
        Token can be used to allow applications to control access in a more secured
        way than the shared key.\n\n For publicly exposed applications, our recommendation
        is to configure a specific list of allowed origins on the [Map account resource](https://aka.ms/amauth)
        to limit rendering abuse and regularly renew the SAS Token."
      name: SAS Token
      in: header
  schemas:
    LandingPageResult:
      description: Response after a successful request to the landing page.
      type: object
      required:
      - links
      properties:
        ontology:
          $ref: '#/components/schemas/Ontology'
        links:
          description: Links to other Features endpoints.
          type: array
          items:
            $ref: '#/components/schemas/FeaturesEndpointLink'
    ApiDefinitionResult:
      description: Response after a successful request to get the API definition.
      type: object
      required:
      - openapi
      - info
      - paths
      - components
      - tags
      properties:
