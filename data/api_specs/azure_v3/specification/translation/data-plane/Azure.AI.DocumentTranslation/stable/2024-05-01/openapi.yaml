  /document/batches/{id}/documents:
    get:
      operationId: DocumentTranslationOperations_GetDocumentsStatus
      summary: Returns the status for all documents in a batch document translation
        request
      description: "Returns the status for all documents in a batch document translation
        request.\n \n\n          \nIf the number of documents in the response exceeds
        our paging limit,\nserver-side paging is used.\nPaginated responses indicate
        a partial result and\ninclude a continuation token in the response. The absence
        of a continuation\ntoken means that no additional pages are available.\n            \ntop,
        skip\nand maxpagesize query parameters can be used to specify a number of
        results to\nreturn and an offset for the collection.\n            \ntop indicates
        the total\nnumber of records the user wants to be returned across all pages.\nskip\nindicates
        the number of records to skip from the list of document status held\nby the
        server based on the sorting method specified.  By default, we sort by\ndescending
        start time.\nmaxpagesize is the maximum items returned in a page. \nIf more
        items are requested via top (or top is not specified and there are\nmore items
        to be returned), @nextLink will contain the link to the next page.\n \n\n
        \         \norderby query parameter can be used to sort the returned list
        (ex\n\"orderby=createdDateTimeUtc asc\" or \"orderby=createdDateTimeUtc\ndesc\").\nThe
        default sorting is descending by createdDateTimeUtc.\nSome query\nparameters
        can be used to filter the returned list (ex:\n\"status=Succeeded,Cancelled\")
        will only return succeeded and cancelled\ndocuments.\ncreatedDateTimeUtcStart
        and createdDateTimeUtcEnd can be used\ncombined or separately to specify a
        range of datetime to filter the returned\nlist by.\nThe supported filtering
        query parameters are (status, ids,\ncreatedDateTimeUtcStart, createdDateTimeUtcEnd).\n
        \           \nWhen both top\nand skip are included, the server should first
        apply skip and then top on\nthe collection.\nNote: If the server can't honor
        top and/or skip, the server\nmust return an error to the client informing
        about it instead of just ignoring\nthe query options.\nThis reduces the risk
        of the client making assumptions about\nthe data returned."
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.id'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.top'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.skip'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.maxpagesize'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.ids'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.statuses'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.createdDateTimeUtcStart'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.createdDateTimeUtcEnd'
      - $ref: '#/components/parameters/GetDocumentsStatusOptions.orderby'
