  /document:translate:
    post:
      operationId: DocumentTranslationOperations_DocumentTranslate
      summary: Submit a single document translation request to the Document Translation
        service
      description: Use this API to submit a single translation request to the Document
        Translation Service.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/DocumentTranslateBody.sourceLanguage'
      - $ref: '#/components/parameters/DocumentTranslateBody.targetLanguage'
      - $ref: '#/components/parameters/DocumentTranslateBody.category'
      - $ref: '#/components/parameters/DocumentTranslateBody.allowFallback'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  description: Document to be translated in the form
                  type: string
                  format: binary
                glossary:
                  description: 'Glossary-translation memory will be used during translation
                    in the form. '
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - document
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
