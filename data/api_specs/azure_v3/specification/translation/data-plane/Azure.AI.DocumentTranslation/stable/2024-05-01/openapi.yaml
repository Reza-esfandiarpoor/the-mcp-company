paths:
  /document/batches:
    get:
      operationId: DocumentTranslationOperations_GetTranslationsStatus
      summary: Returns a list of batch requests submitted and the status for each
        request
      description: "Returns a list of batch requests submitted and the status for
        each\nrequest.\nThis list only contains batch requests submitted by the user
        (based on\nthe resource).\n            \nIf the number of requests exceeds
        our paging limit,\nserver-side paging is used. Paginated responses indicate
        a partial result and\ninclude a continuation token in the response.\nThe absence
        of a continuation\ntoken means that no additional pages are available.\n            \ntop,
        skip\nand maxpagesize query parameters can be used to specify a number of
        results to\nreturn and an offset for the collection.\n            \ntop indicates
        the total\nnumber of records the user wants to be returned across all pages.\nskip\nindicates
        the number of records to skip from the list of batches based on the\nsorting
        method specified.  By default, we sort by descending start\ntime.\nmaxpagesize
        is the maximum items returned in a page.  If more items are\nrequested via
        top (or top is not specified and there are more items to be\nreturned), @nextLink
        will contain the link to the next page.\n           \n\norderby query parameter
        can be used to sort the returned list (ex\n\"orderby=createdDateTimeUtc asc\"
        or \"orderby=createdDateTimeUtc\ndesc\").\nThe default sorting is descending
        by createdDateTimeUtc.\nSome query\nparameters can be used to filter the returned
        list (ex:\n\"status=Succeeded,Cancelled\") will only return succeeded and
        cancelled\noperations.\ncreatedDateTimeUtcStart and createdDateTimeUtcEnd
        can be used\ncombined or separately to specify a range of datetime to filter
        the returned\nlist by.\nThe supported filtering query parameters are (status,
        ids,\ncreatedDateTimeUtcStart, createdDateTimeUtcEnd).\n            \nThe
        server honors\nthe values specified by the client. However, clients must be
        prepared to handle\nresponses that contain a different page size or contain
        a continuation token.\n \n\n          \nWhen both top and skip are included,
        the server should first apply\nskip and then top on the collection.\nNote:
        If the server can't honor top\nand/or skip, the server must return an error
        to the client informing about it\ninstead of just ignoring the query options.\nThis
        reduces the risk of the client\nmaking assumptions about the data returned."
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.top'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.skip'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.maxpagesize'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.ids'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.statuses'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.createdDateTimeUtcStart'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.createdDateTimeUtcEnd'
      - $ref: '#/components/parameters/GetTranslationsStatusOptions.orderby'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationsStatus'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
    post:
      operationId: DocumentTranslationOperations_StartTranslation
      summary: Submit a document translation request to the Document Translation service
      description: "Use this API to submit a bulk (batch) translation request to the
        Document\nTranslation service.\nEach request can contain multiple documents
        and must\ncontain a source and destination container for each document.\n
        \           \nThe\nprefix and suffix filter (if supplied) are used to filter
        folders. The prefix\nis applied to the subpath after the container name.\n
        \           \nGlossaries /\nTranslation memory can be included in the request
        and are applied by the\nservice when the document is translated.\n            \nIf
        the glossary is\ninvalid or unreachable during translation, an error is indicated
        in the\ndocument status.\nIf a file with the same name already exists at the\ndestination,
        it will be overwritten. The targetUrl for each target language\nmust be unique."
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTranslationDetails'
        description: Translation job submission batch request
        required: true
        x-ms-parameter-location: method
      responses:
        '202':
          description: The request has been accepted for processing, but processing
            has not yet completed.
          headers:
            Operation-Location:
              description: Link to the translation operation status
              schema:
                type: string
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-long-running-operation-options:
        final-state-via: operation-location
        final-state-schema: '#/definitions/TranslationStatus'
      x-ms-long-running-operation: true
  /document/batches/{id}:
    get:
      operationId: DocumentTranslationOperations_GetTranslationStatus
      summary: Returns the status for a document translation request
      description: 'Returns the status for a document translation request.

        The status includes the

        overall request status, as well as the status for documents that are being

        translated as part of that request.'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: id
        in: path
        description: Format - uuid.  The operation id
        required: true
        x-ms-client-name: translationId
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationStatus'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
    delete:
      operationId: DocumentTranslationOperations_CancelTranslation
      summary: Cancel a currently processing or queued translation
      description: 'Cancel a currently processing or queued translation.

        A translation will not be

        cancelled if it is already completed or failed or cancelling. A bad request

        will be returned.

        All documents that have completed translation will not be

        cancelled and will be charged.

        All pending documents will be cancelled if

        possible.'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: id
        in: path
        description: Format - uuid.  The operation-id
        required: true
        x-ms-client-name: translationId
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
