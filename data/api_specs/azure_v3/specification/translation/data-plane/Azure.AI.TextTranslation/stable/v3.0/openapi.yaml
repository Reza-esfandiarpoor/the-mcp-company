    DictionaryExample:
      type: object
      description: Dictionary Example
      properties:
        sourcePrefix:
          type: string
          description: 'The string to concatenate before the value of sourceTerm to
            form a complete example.

            Do not add a space character, since it is already there when it should
            be.

            This value may be an empty string.'
        sourceTerm:
          type: string
          description: 'A string equal to the actual term looked up. The string is
            added with sourcePrefix

            and sourceSuffix to form the complete example. Its value is separated
            so it can be

            marked in a user interface, e.g., by bolding it.'
        sourceSuffix:
          type: string
          description: 'The string to concatenate after the value of sourceTerm to
            form a complete example.

            Do not add a space character, since it is already there when it should
            be.

            This value may be an empty string.'
        targetPrefix:
          type: string
          description: A string similar to sourcePrefix but for the target.
        targetTerm:
          type: string
          description: A string similar to sourceTerm but for the target.
        targetSuffix:
          type: string
          description: A string similar to sourceSuffix but for the target.
      required:
      - sourcePrefix
      - sourceTerm
      - sourceSuffix
      - targetPrefix
      - targetTerm
      - targetSuffix
