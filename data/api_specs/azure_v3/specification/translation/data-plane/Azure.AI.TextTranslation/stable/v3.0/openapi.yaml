                      \ one, or multiple words in the other language, and the aligned\
                      \ words may \nbe non-contiguous. When no alignment information\
                      \ is available, the alignment element will be empty."
                required:
                - proj
              sentLen:
                description: Sentence boundaries in the input and output texts.
                type: object
                properties:
                  srcSentLen:
                    type: array
                    description: "An integer array representing the lengths of the\
                      \ sentences in the input text. \nThe length of the array is\
                      \ the number of sentences, and the values are the length of\
                      \ each sentence."
                    items:
                      type: integer
                      format: int32
                  transSentLen:
                    type: array
                    description: "An integer array representing the lengths of the\
                      \ sentences in the translated text. \nThe length of the array\
                      \ is the number of sentences, and the values are the length\
                      \ of each sentence."
                    items:
                      type: integer
                      format: int32
                required:
                - srcSentLen
                - transSentLen
            required:
