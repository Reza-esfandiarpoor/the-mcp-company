                      required:
                      - name
                      - nativeName
                      - dir
                      - translations
        default:
          description: An unexpected error response.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Representation of the Error Response from Translator
                  Service.
                properties:
                  error:
                    description: Error details.
                    type: object
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: Number identifier of the error.
                      message:
                        type: string
                        description: Human readable error description.
                    required:
                    - code
                    - message
                required:
                - error
  /translate:
    post:
      operationId: Translate
      summary: Translate Text
      description: Translate Text
      parameters:
      - name: X-ClientTraceId
        in: header
        description: A client-generated GUID to uniquely identify the request.
        required: false
        x-ms-client-name: clientTraceId
        schema:
          type: string
      - name: to
        in: query
        description: "Specifies the language of the output text. The target language\
          \ must be one of the supported languages included \nin the translation scope.\
          \ For example, use to=de to translate to German.\nIt's possible to translate\
          \ to multiple languages simultaneously by repeating the parameter in the\
          \ query string. \nFor example, use to=de&to=it to translate to German and\
          \ Italian."
        required: true
        x-ms-parameter-location: method
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: from
        in: query
        description: "Specifies the language of the input text. Find which languages\
          \ are available to translate from by \nlooking up supported languages using\
          \ the translation scope. If the from parameter isn't specified, \nautomatic\
          \ language detection is applied to determine the source language.\n\nYou\
          \ must use the from parameter rather than autodetection when using the dynamic\
          \ dictionary feature. \nNote: the dynamic dictionary feature is case-sensitive."
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      - name: textType
        in: query
        description: "Defines whether the text being translated is plain text or HTML\
          \ text. Any HTML needs to be a well-formed, \ncomplete element. Possible\
          \ values are: plain (default) or html."
        required: false
        x-ms-enum:
          name: TextType
