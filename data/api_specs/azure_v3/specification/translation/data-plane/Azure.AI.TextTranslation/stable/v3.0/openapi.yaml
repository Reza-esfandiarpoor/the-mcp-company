    BackTranslation:
      type: object
      description: Back Translation
      properties:
        normalizedText:
          type: string
          description: 'A string giving the normalized form of the source term that
            is a back-translation of the target.

            This value should be used as input to lookup examples.'
        displayText:
          type: string
          description: 'A string giving the source term that is a back-translation
            of the target in a form best

            suited for end-user display.'
        numExamples:
          type: integer
          format: int32
          description: 'An integer representing the number of examples that are available
            for this translation pair.

            Actual examples must be retrieved with a separate call to lookup examples.
            The number is mostly

            intended to facilitate display in a UX. For example, a user interface
            may add a hyperlink

            to the back-translation if the number of examples is greater than zero
            and show the back-translation

            as plain text if there are no examples. Note that the actual number of
            examples returned

            by a call to lookup examples may be less than numExamples, because additional
            filtering may be

            applied on the fly to remove "bad" examples.'
        frequencyCount:
          type: integer
          format: int32
          description: 'An integer representing the frequency of this translation
            pair in the data. The main purpose of this

            field is to provide a user interface with a means to sort back-translations
            so the most frequent terms are first.'
      required:
      - normalizedText
      - displayText
      - numExamples
      - frequencyCount
