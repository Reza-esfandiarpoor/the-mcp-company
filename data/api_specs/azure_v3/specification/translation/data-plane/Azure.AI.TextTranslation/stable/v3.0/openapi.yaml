    DictionaryLookupItem:
      type: object
      description: Dictionary Lookup Element
      properties:
        normalizedSource:
          type: string
          description: 'A string giving the normalized form of the source term.

            For example, if the request is "JOHN", the normalized form will be "john".

            The content of this field becomes the input to lookup examples.'
        displaySource:
          type: string
          description: 'A string giving the source term in a form best suited for
            end-user display.

            For example, if the input is "JOHN", the display form will reflect the
            usual

            spelling of the name: "John".'
        translations:
          type: array
          description: A list of translations for the source term.
          items:
            type: object
            description: Translation source term.
            properties:
              normalizedTarget:
                type: string
                description: 'A string giving the normalized form of this term in
                  the target language.

                  This value should be used as input to lookup examples.'
              displayTarget:
                type: string
                description: 'A string giving the term in the target language and
                  in a form best suited

                  for end-user display. Generally, this will only differ from the
                  normalizedTarget

                  in terms of capitalization. For example, a proper noun like "Juan"
                  will have

                  normalizedTarget = "juan" and displayTarget = "Juan".'
              posTag:
                type: string
                description: A string associating this term with a part-of-speech
                  tag.
              confidence:
                type: number
                format: float
                description: "A value between 0.0 and 1.0 which represents the \"\
                  confidence\" \n(or perhaps more accurately, \"probability in the\
                  \ training data\") of that translation pair. \nThe sum of confidence\
                  \ scores for one source word may or may not sum to 1.0."
              prefixWord:
                type: string
                description: "A string giving the word to display as a prefix of the\
                  \ translation. Currently,\nthis is the gendered determiner of nouns,\
                  \ in languages that have gendered determiners.\nFor example, the\
                  \ prefix of the Spanish word \"mosca\" is \"la\", since \"mosca\"\
                  \ is a feminine noun in Spanish. \nThis is only dependent on the\
                  \ translation, and not on the source. \nIf there is no prefix, it\
                  \ will be the empty string."
              backTranslations:
                type: array
                description: 'A list of "back translations" of the target. For example,
                  source words that the target can translate to.

                  The list is guaranteed to contain the source word that was requested
                  (e.g., if the source word being

                  looked up is "fly", then it is guaranteed that "fly" will be in
                  the backTranslations list).

                  However, it is not guaranteed to be in the first position, and often
                  will not be.'
                items:
                  type: object
                  description: Back Translation
                  properties:
                    normalizedText:
                      type: string
                      description: 'A string giving the normalized form of the source
                        term that is a back-translation of the target.

                        This value should be used as input to lookup examples.'
                    displayText:
                      type: string
                      description: 'A string giving the source term that is a back-translation
                        of the target in a form best

                        suited for end-user display.'
                    numExamples:
                      type: integer
                      format: int32
                      description: 'An integer representing the number of examples
                        that are available for this translation pair.

                        Actual examples must be retrieved with a separate call to
                        lookup examples. The number is mostly

                        intended to facilitate display in a UX. For example, a user
                        interface may add a hyperlink

                        to the back-translation if the number of examples is greater
                        than zero and show the back-translation

                        as plain text if there are no examples. Note that the actual
                        number of examples returned

                        by a call to lookup examples may be less than numExamples,
                        because additional filtering may be

                        applied on the fly to remove "bad" examples.'
                    frequencyCount:
                      type: integer
                      format: int32
                      description: 'An integer representing the frequency of this
                        translation pair in the data. The main purpose of this

                        field is to provide a user interface with a means to sort
                        back-translations so the most frequent terms are first.'
                  required:
                  - normalizedText
                  - displayText
                  - numExamples
                  - frequencyCount
            required:
            - normalizedTarget
            - displayTarget
            - posTag
            - confidence
            - prefixWord
            - backTranslations
      required:
      - normalizedSource
      - displaySource
      - translations
