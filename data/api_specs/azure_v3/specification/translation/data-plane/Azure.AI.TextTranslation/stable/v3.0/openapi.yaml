openapi: 3.0.0
info:
  title: Text Translation
  version: '3.0'
  description: 'Text translation is a cloud-based REST API feature of the Translator
    service that uses neural

    machine translation technology to enable quick and accurate source-to-target text
    translation

    in real time across all supported languages.


    The following methods are supported by the Text Translation feature:


    Languages. Returns a list of languages supported by Translate, Transliterate,
    and Dictionary Lookup operations.


    Translate. Renders single source-language text to multiple target-language texts
    with a single request.


    Transliterate. Converts characters or letters of a source language to the corresponding
    characters or letters of a target language.


    Detect. Returns the source code language code and a boolean variable denoting
    whether the detected language is supported for text translation and transliteration.


    Dictionary lookup. Returns equivalent words for the source term in the target
    language.


    Dictionary example Returns grammatical structure and context examples for the
    source term and target term pair.'
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
servers:
- url: '{Endpoint}'
  variables:
    Endpoint:
      description: "Supported Text Translation endpoints (protocol and hostname, for\
        \ example:\n    https://api.cognitive.microsofttranslator.com)."
      format: uri
      x-ms-skip-url-encoding: true
      default: none
tags: []
paths:
  /breaksentence:
    post:
      operationId: FindSentenceBoundaries
      summary: Find Sentence Boundaries
      description: Find Sentence Boundaries
      parameters:
      - name: X-ClientTraceId
        in: header
        description: A client-generated GUID to uniquely identify the request.
        required: false
        x-ms-client-name: clientTraceId
        schema:
          type: string
      - name: language
        in: query
        description: "Language tag identifying the language of the input text. \n\
          If a code isn't specified, automatic language detection will be applied."
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      - name: script
        in: query
        description: "Script tag identifying the script used by the input text. \n\
          If a script isn't specified, the default script of the language will be\
          \ assumed."
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        description: Mandatory API version parameter
        required: true
        x-ms-client-name: apiVersion
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Element containing the text for translation.
                properties:
                  text:
                    type: string
                    description: Text to translate.
                required:
                - text
        description: Defines the content of the request
        required: true
      responses:
        '200':
          description: Response for the Break SEntence API.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Item containing break sentence result.
                  properties:
                    detectedLanguage:
                      description: The detectedLanguage property is only present in
                        the result object when language auto-detection is requested.
                      type: object
                      properties:
                        language:
                          type: string
                          description: A string representing the code of the detected
                            language.
                        score:
                          type: number
                          format: float
                          description: 'A float value indicating the confidence in
                            the result.

                            The score is between zero and one and a low score indicates
                            a low confidence.'
                      required:
                      - language
                      - score
                    sentLen:
                      type: array
                      description: 'An integer array representing the lengths of the
                        sentences in the input text.

                        The length of the array is the number of sentences, and the
                        values are the length of each sentence.'
                      items:
                        type: integer
                        format: int32
                  required:
                  - sentLen
        default:
          description: An unexpected error response.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Representation of the Error Response from Translator
                  Service.
                properties:
                  error:
                    description: Error details.
                    type: object
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: Number identifier of the error.
                      message:
                        type: string
                        description: Human readable error description.
                    required:
                    - code
                    - message
                required:
                - error
  /dictionary/examples:
    post:
      operationId: LookupDictionaryExamples
      summary: Lookup Dictionary Examples
      description: Lookup Dictionary Examples
      parameters:
      - name: X-ClientTraceId
        in: header
        description: A client-generated GUID to uniquely identify the request.
        required: false
        x-ms-client-name: clientTraceId
        schema:
          type: string
      - name: from
        in: query
        description: 'Specifies the language of the input text.

          The source language must be one of the supported languages included in the
          dictionary scope.'
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: to
        in: query
        description: 'Specifies the language of the output text.

          The target language must be one of the supported languages included in the
          dictionary scope.'
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        description: Mandatory API version parameter
        required: true
        x-ms-client-name: apiVersion
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: Text to translate.
                  translation:
                    type: string
                    description: "A string specifying the translated text previously\
                      \ returned by the Dictionary lookup operation. \nThis should\
                      \ be the value from the normalizedTarget field in the translations\
                      \ list of the Dictionary \nlookup response. The service will\
                      \ return examples for the specific source-target word-pair."
                required:
                - text
                - translation
                description: Element containing the text for translation.
        description: Defines the content of the request
        required: true
      responses:
        '200':
          description: Response for the dictionary examples API.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Dictionary Example element
                  properties:
                    normalizedSource:
                      type: string
                      description: 'A string giving the normalized form of the source
                        term. Generally, this should be identical

                        to the value of the Text field at the matching list index
                        in the body of the request.'
                    normalizedTarget:
                      type: string
                      description: 'A string giving the normalized form of the target
                        term. Generally, this should be identical

                        to the value of the Translation field at the matching list
                        index in the body of the request.'
                  required:
                  - normalizedSource
                  - normalizedTarget
                  - examples
        default:
          description: An unexpected error response.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Representation of the Error Response from Translator
                  Service.
                properties:
                  error:
                    description: Error details.
                    type: object
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: Number identifier of the error.
                      message:
                        type: string
                        description: Human readable error description.
                    required:
                    - code
                    - message
                required:
                - error
  /dictionary/lookup:
    post:
      operationId: LookupDictionaryEntries
      summary: Lookup Dictionary Entries
      description: Lookup Dictionary Entries
      parameters:
      - name: X-ClientTraceId
        in: header
        description: A client-generated GUID to uniquely identify the request.
        required: false
        x-ms-client-name: clientTraceId
        schema:
          type: string
      - name: from
        in: query
        description: 'Specifies the language of the input text.

          The source language must be one of the supported languages included in the
          dictionary scope.'
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: to
        in: query
        description: 'Specifies the language of the output text.

          The target language must be one of the supported languages included in the
          dictionary scope.'
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        description: Mandatory API version parameter
        required: true
        x-ms-client-name: apiVersion
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Element containing the text for translation.
                properties:
                  text:
                    type: string
                    description: Text to translate.
                required:
                - text
        description: Defines the content of the request
        required: true
      responses:
        '200':
          description: Response for the dictionary lookup API.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Dictionary Lookup Element
                  properties:
                    normalizedSource:
                      type: string
                      description: 'A string giving the normalized form of the source
                        term.

                        For example, if the request is "JOHN", the normalized form
                        will be "john".

                        The content of this field becomes the input to lookup examples.'
                    displaySource:
                      type: string
                      description: 'A string giving the source term in a form best
                        suited for end-user display.

                        For example, if the input is "JOHN", the display form will
                        reflect the usual

                        spelling of the name: "John".'
                    translations:
                      type: array
                      description: A list of translations for the source term.
                      items:
                        type: object
                        description: Translation source term.
                        properties:
                          normalizedTarget:
                            type: string
                            description: 'A string giving the normalized form of this
                              term in the target language.

                              This value should be used as input to lookup examples.'
                          displayTarget:
                            type: string
                            description: 'A string giving the term in the target language
                              and in a form best suited

                              for end-user display. Generally, this will only differ
                              from the normalizedTarget

                              in terms of capitalization. For example, a proper noun
                              like "Juan" will have

                              normalizedTarget = "juan" and displayTarget = "Juan".'
                          posTag:
                            type: string
                            description: A string associating this term with a part-of-speech
                              tag.
                          confidence:
                            type: number
                            format: float
                            description: "A value between 0.0 and 1.0 which represents\
                              \ the \"confidence\" \n(or perhaps more accurately,\
                              \ \"probability in the training data\") of that translation\
                              \ pair. \nThe sum of confidence scores for one source\
                              \ word may or may not sum to 1.0."
                          prefixWord:
                            type: string
                            description: "A string giving the word to display as a\
                              \ prefix of the translation. Currently,\nthis is the\
                              \ gendered determiner of nouns, in languages that have\
                              \ gendered determiners.\nFor example, the prefix of\
                              \ the Spanish word \"mosca\" is \"la\", since \"mosca\"\
                              \ is a feminine noun in Spanish. \nThis is only dependent\
                              \ on the translation, and not on the source. \nIf there\
                              \ is no prefix, it will be the empty string."
                          backTranslations:
                            type: array
                            description: 'A list of "back translations" of the target.
                              For example, source words that the target can translate
                              to.

                              The list is guaranteed to contain the source word that
                              was requested (e.g., if the source word being

                              looked up is "fly", then it is guaranteed that "fly"
                              will be in the backTranslations list).

                              However, it is not guaranteed to be in the first position,
                              and often will not be.'
                            items:
                              type: object
                              description: Back Translation
                              properties:
                                normalizedText:
                                  type: string
                                  description: 'A string giving the normalized form
                                    of the source term that is a back-translation
                                    of the target.

                                    This value should be used as input to lookup examples.'
                                displayText:
                                  type: string
                                  description: 'A string giving the source term that
                                    is a back-translation of the target in a form
                                    best

                                    suited for end-user display.'
                                numExamples:
                                  type: integer
                                  format: int32
                                  description: 'An integer representing the number
                                    of examples that are available for this translation
                                    pair.

                                    Actual examples must be retrieved with a separate
                                    call to lookup examples. The number is mostly

                                    intended to facilitate display in a UX. For example,
                                    a user interface may add a hyperlink

                                    to the back-translation if the number of examples
                                    is greater than zero and show the back-translation

                                    as plain text if there are no examples. Note that
                                    the actual number of examples returned

                                    by a call to lookup examples may be less than
                                    numExamples, because additional filtering may
                                    be

                                    applied on the fly to remove "bad" examples.'
                                frequencyCount:
                                  type: integer
                                  format: int32
                                  description: 'An integer representing the frequency
                                    of this translation pair in the data. The main
                                    purpose of this

                                    field is to provide a user interface with a means
                                    to sort back-translations so the most frequent
                                    terms are first.'
                              required:
                              - normalizedText
                              - displayText
                              - numExamples
                              - frequencyCount
                        required:
                        - normalizedTarget
                        - displayTarget
                        - posTag
                        - confidence
                        - prefixWord
                        - backTranslations
                  required:
                  - normalizedSource
                  - displaySource
                  - translations
        default:
          description: An unexpected error response.
          headers:
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Representation of the Error Response from Translator
                  Service.
                properties:
                  error:
                    description: Error details.
                    type: object
                    properties:
                      code:
                        type: integer
                        format: int32
                        description: Number identifier of the error.
                      message:
                        type: string
                        description: Human readable error description.
                    required:
                    - code
                    - message
                required:
                - error
  /languages:
    get:
      operationId: GetSupportedLanguages
      summary: Gets the set of languages currently supported by other operations of
        the Translator.
      description: Gets the set of languages currently supported by other operations
        of the Translator.
      parameters:
      - name: X-ClientTraceId
        in: header
        description: A client-generated GUID to uniquely identify the request.
        required: false
        x-ms-client-name: clientTraceId
        schema:
          type: string
      - name: scope
        in: query
        description: "A comma-separated list of names defining the group of languages\
          \ to return.\nAllowed group names are: `translation`, `transliteration`\
          \ and `dictionary`.\nIf no scope is given, then all groups are returned,\
          \ which is equivalent to passing \n`scope=translation,transliteration,dictionary`.\
          \ To decide which set of supported languages \nis appropriate for your scenario,\
          \ see the description of the [response object](#response-body)."
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: "The language to use for user interface strings. Some of the\
          \ fields in the response are names of languages or \nnames of regions. Use\
          \ this parameter to define the language in which these names are returned.\
          \ \nThe language is specified by providing a well-formed BCP 47 language\
          \ tag. For instance, use the value `fr` \nto request names in French or\
          \ use the value `zh-Hant` to request names in Chinese Traditional.\nNames\
          \ are provided in the English language when a target language is not specified\
          \ or when localization \nis not available."
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: acceptLanguage
        schema:
          type: string
          default: en
      - name: If-None-Match
        in: header
        description: "Passing the value of the ETag response header in an If-None-Match\
          \ field will allow the service to optimize the response. \nIf the resource\
          \ has not been modified, the service will return status code 304 and an\
          \ empty response body."
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: ifNoneMatch
        schema:
          type: string
      - name: api-version
        in: query
        description: Mandatory API version parameter
        required: true
        x-ms-client-name: apiVersion
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          headers:
            ETag:
              description: "Current value of the entity tag for the requested groups\
                \ of supported languages. \nTo make subsequent requests more efficient,\
                \ the client may send the `ETag` value in an \n`If-None-Match` header\
                \ field."
              schema:
                type: string
            X-RequestId:
              description: Value generated by the service to identify the request.
                It is used for troubleshooting purposes.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Response for the languages API.
                properties:
                  translation:
                    type: object
                    description: Languages that support translate API.
                    additionalProperties:
                      type: object
                      description: 'The value of the translation property is a dictionary
                        of (key, value) pairs. Each key is a BCP 47 language tag.

                        A key identifies a language for which text can be translated
                        to or translated from.'
                      properties:
                        name:
                          type: string
                          description: Display name of the language in the locale
                            requested via Accept-Language header.
                        nativeName:
                          type: string
                          description: Display name of the language in the locale
                            native for this language.
                        dir:
                          description: Directionality, which is rtl for right-to-left
                            languages or ltr for left-to-right languages.
                          type: string
                          enum:
                          - ltr
                          - rtl
                          x-ms-enum:
                            name: LanguageDirectionality
                            modelAsString: false
                            values:
                            - name: LeftToRight
                              value: ltr
                              description: Language is written left to right.
                            - name: RightToLeft
                              value: rtl
                              description: Language is written right to left.
                      required:
                      - name
                      - nativeName
                      - dir
                  transliteration:
                    type: object
                    description: Languages that support transliteration API.
                    additionalProperties:
                      type: object
                      description: "The value of the transliteration property is a\
                        \ dictionary of (key, value) pairs. \nEach key is a BCP 47\
                        \ language tag. A key identifies a language for which text\
                        \ can be converted from one script \nto another script."
                      properties:
                        name:
                          type: string
                          description: Display name of the language in the locale
                            requested via Accept-Language header.
                        nativeName:
                          type: string
                          description: Display name of the language in the locale
                            native for this language.
                        scripts:
                          type: array
                          description: List of scripts to convert from.
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                description: Code identifying the script.
                              name:
                                type: string
                                description: Display name of the script in the locale
                                  requested via Accept-Language header.
                              nativeName:
                                type: string
                                description: Display name of the language in the locale
                                  native for the language.
                              dir:
                                description: Directionality, which is rtl for right-to-left
                                  languages or ltr for left-to-right languages.
                                type: string
                                enum:
                                - ltr
                                - rtl
                                x-ms-enum:
                                  name: LanguageDirectionality
                                  modelAsString: false
                                  values:
                                  - name: LeftToRight
                                    value: ltr
                                    description: Language is written left to right.
                                  - name: RightToLeft
                                    value: rtl
                                    description: Language is written right to left.
                              toScripts:
                                type: array
                                description: List of scripts available to convert
                                  text to.
                                items:
                                  type: object
                                  description: Common properties of language script
                                  properties:
                                    code:
                                      type: string
                                      description: Code identifying the script.
                                    name:
                                      type: string
                                      description: Display name of the script in the
                                        locale requested via Accept-Language header.
                                    nativeName:
                                      type: string
                                      description: Display name of the language in
                                        the locale native for the language.
                                    dir:
                                      description: Directionality, which is rtl for
                                        right-to-left languages or ltr for left-to-right
                                        languages.
                                      type: string
                                      enum:
                                      - ltr
                                      - rtl
                                      x-ms-enum:
                                        name: LanguageDirectionality
                                        modelAsString: false
                                        values:
                                        - name: LeftToRight
                                          value: ltr
                                          description: Language is written left to
                                            right.
                                        - name: RightToLeft
                                          value: rtl
                                          description: Language is written right to
                                            left.
                                  required:
                                  - code
                                  - name
                                  - nativeName
                                  - dir
                            required:
                            - code
                            - name
                            - nativeName
                            - dir
                            - toScripts
                            description: Common properties of language script
                      required:
                      - name
                      - nativeName
                      - scripts
                  dictionary:
                    type: object
                    description: Languages that support dictionary API.
                    additionalProperties:
                      type: object
                      description: Properties ot the source dictionary language
                      properties:
                        name:
                          type: string
                          description: Display name of the language in the locale
                            requested via Accept-Language header.
                        nativeName:
                          type: string
                          description: Display name of the language in the locale
                            native for this language.
                        dir:
                          description: Directionality, which is rtl for right-to-left
                            languages or ltr for left-to-right languages.
                          type: string
                          enum:
                          - ltr
                          - rtl
                          x-ms-enum:
                            name: LanguageDirectionality
                            modelAsString: false
                            values:
                            - name: LeftToRight
                              value: ltr
                              description: Language is written left to right.
                            - name: RightToLeft
                              value: rtl
                              description: Language is written right to left.
                        translations:
                          type: array
                          description: List of languages with alterative translations
                            and examples for the query expressed in the source language.
                          items:
                            type: object
                            description: Properties of the target dictionary language
                            properties:
                              name:
                                type: string
                                description: Display name of the language in the locale
                                  requested via Accept-Language header.
                              nativeName:
                                type: string
                                description: Display name of the language in the locale
                                  native for this language.
                              dir:
                                description: Directionality, which is rtl for right-to-left
                                  languages or ltr for left-to-right languages.
                                type: string
                                enum:
                                - ltr
                                - rtl
                                x-ms-enum:
                                  name: LanguageDirectionality
                                  modelAsString: false
                                  values:
                                  - name: LeftToRight
                                    value: ltr
                                    description: Language is written left to right.
                                  - name: RightToLeft
                                    value: rtl
                                    description: Language is written right to left.
                              code:
                                type: string
                                description: Language code identifying the target
                                  language.
