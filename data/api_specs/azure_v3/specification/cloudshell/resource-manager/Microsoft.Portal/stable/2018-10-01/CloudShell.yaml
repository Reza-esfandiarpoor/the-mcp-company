                x-ms-azure-resource: true
                type: object
                properties:
                  properties:
                    description: The cloud shell user settings properties.
                    type: object
                    required:
                    - preferredOsType
                    - preferredLocation
                    - storageProfile
                    - terminalSettings
                    - preferredShellType
