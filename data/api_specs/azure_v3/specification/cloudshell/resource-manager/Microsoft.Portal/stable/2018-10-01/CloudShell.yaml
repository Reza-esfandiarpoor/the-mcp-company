                            description: Full resource ID of storage account.
                          fileShareName:
                            type: string
                            description: Name of the mounted file share. 63 characters
                              or less, lowercase alphabet, numbers, and -
                          diskSizeInGB:
                            type: integer
                            format: int32
                            description: Size of file share
                      terminalSettings:
                        description: Settings for terminal appearance.
                        type: object
                        properties:
                          fontSize:
                            type: string
