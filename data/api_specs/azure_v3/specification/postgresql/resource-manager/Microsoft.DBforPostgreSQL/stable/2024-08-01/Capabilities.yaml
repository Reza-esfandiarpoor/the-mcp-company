openapi: 3.0.0
info:
  title: PostgreSQLManagementClient
  description: The Azure Database for PostgreSQL management API provides create, read,
    update, and delete functionality for Azure PostgreSQL resources including servers,
    databases, firewall rules, network configuration, security alert policies, log
    files and configurations with new business model.
  version: 2024-08-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.DBforPostgreSQL/locations/{locationName}/capabilities:
    get:
      tags:
      - LocationBasedCapabilities
      operationId: LocationBasedCapabilities_Execute
      description: Lists the capabilities available in a given location for a specific
        subscription.
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: locationName
        in: path
        required: true
        description: The name of the location.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          pattern: ^[-\w\._]+$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    description: List of supported capabilities.
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          description: The status of the capability.
                          enum:
                          - Visible
                          - Available
                          - Default
                          - Disabled
