        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serverName
        in: path
        required: true
        description: The name of the server.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                restartWithFailover:
                  type: boolean
                  description: Indicates if restart the PostgreSQL database engine
                    should failover or switch over from primary to standby. This only
                    works if flexible server has high availability enabled.
                failoverMode:
                  type: string
                  description: Failover mode.
                  enum:
                  - PlannedFailover
                  - ForcedFailover
                  - PlannedSwitchover
                  - ForcedSwitchover
                  x-ms-enum:
                    name: FailoverMode
                    modelAsString: true
              description: PostgreSQL database engine restart parameters.
        description: Parameters to restart a flexible server.
