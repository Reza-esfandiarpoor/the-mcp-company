openapi: 3.0.0
info:
  version: 2025-05-01
  title: PeeringManagementClient
  description: APIs to manage Peering resources through the Azure Resource Manager.
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Peering/cdnPeeringPrefixes:
    get:
      tags:
      - CdnPeeringPrefixes
      description: Lists all of the advertised prefixes for the specified peering
        location
      operationId: CdnPeeringPrefixes_List
      parameters:
      - name: peeringLocation
        in: query
        description: The peering location.
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The Azure subscription ID.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The client API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: The paginated list of CDN peering prefixes.
                type: object
                properties:
                  value:
                    description: The list of CDN peering prefixes.
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: The name of the resource.
                          type: string
                          readOnly: true
                        id:
                          description: The ID of the resource.
                          type: string
                          readOnly: true
                        type:
                          description: The type of the resource.
                          type: string
                          readOnly: true
                        properties:
                          description: The properties that define a cdn peering prefix.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            prefix:
                              description: The prefix.
                              type: string
                              readOnly: true
                            azureRegion:
                              description: The Azure region.
                              type: string
                              readOnly: true
                            azureService:
                              description: The Azure service.
                              type: string
                              readOnly: true
                            isPrimaryRegion:
                              description: The flag that indicates whether or not
                                this is the primary region.
                              type: boolean
                              readOnly: true
                            bgpCommunity:
                              description: The BGP Community
                              type: string
                              readOnly: true
                      description: The ARM resource class.
                      x-ms-azure-resource: true
                    x-ms-identifiers: []
                  nextLink:
                    description: The link to fetch the next page of CDN peering prefixes.
                    type: string
        default:
          description: Error response describing why the operation has failed.
          content:
            application/json:
              schema:
                description: The error response that indicates why an operation has
                  failed.
                type: object
                properties:
                  error:
                    description: The error detail that describes why an operation
                      has failed.
                    type: object
                    properties:
                      code:
                        description: The error code.
                        type: string
                        readOnly: true
                      message:
                        description: The error message.
                        type: string
                        readOnly: true
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Peering/checkServiceProviderAvailability:
    post:
      tags:
      - CheckServiceProviderAvailability
      description: Checks if the peering service provider is present within 1000 miles
        of customer's location
      operationId: CheckServiceProviderAvailability
      parameters:
      - name: subscriptionId
        in: path
        description: The Azure subscription ID.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The client API version.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Class for CheckServiceProviderAvailabilityInput
              type: object
              properties:
                peeringServiceLocation:
                  description: Gets or sets the peering service location.
                  type: string
                peeringServiceProvider:
                  description: Gets or sets the peering service provider.
                  type: string
        description: The CheckServiceProviderAvailabilityInput indicating customer
          location and service provider.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                enum:
                - Available
                - Unavailable
                type: string
        default:
          description: Error response describing why the operation has failed.
          content:
            application/json:
              schema:
                description: The error response that indicates why an operation has
                  failed.
                type: object
                properties:
                  error:
                    description: The error detail that describes why an operation
                      has failed.
                    type: object
                    properties:
                      code:
                        description: The error code.
                        type: string
                        readOnly: true
                      message:
                        description: The error message.
                        type: string
                        readOnly: true
  /subscriptions/{subscriptionId}/providers/Microsoft.Peering/legacyPeerings:
    get:
      tags:
      - LegacyPeerings
      description: Lists all of the legacy peerings under the given subscription matching
        the specified kind and location.
      operationId: LegacyPeerings_List
      parameters:
      - name: peeringLocation
        in: query
        description: The location of the peering.
        required: true
        schema:
          type: string
      - name: kind
        in: query
        description: The kind of the peering.
        required: true
        x-ms-enum:
          name: LegacyPeeringsKind
          modelAsString: true
        schema:
          type: string
          enum:
          - Direct
          - Exchange
      - name: asn
        in: query
        description: The ASN number associated with a legacy peering.
        required: false
        schema:
          type: integer
          format: int32
      - name: directPeeringType
        in: query
        description: The direct peering type.
        required: false
        x-ms-enum:
          name: directPeeringType
          modelAsString: true
        schema:
          type: string
          enum:
          - Edge
          - Transit
          - Cdn
          - Internal
          - Ix
          - IxRs
          - Voice
          - EdgeZoneForOperators
          - PeerProp
      - name: subscriptionId
        in: path
        description: The Azure subscription ID.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The client API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: The paginated list of peerings.
                type: object
                properties:
                  value:
                    description: The list of peerings.
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: The name of the resource.
                          type: string
                          readOnly: true
                        id:
                          description: The ID of the resource.
                          type: string
                          readOnly: true
                        type:
                          description: The type of the resource.
                          type: string
                          readOnly: true
                        sku:
                          description: The SKU that defines the tier and kind of the
                            peering.
                          type: object
                          properties:
                            name:
                              description: The name of the peering SKU.
                              type: string
                            tier:
                              description: The tier of the peering SKU.
                              enum:
                              - Basic
                              - Premium
                              type: string
                              readOnly: true
                              x-ms-enum:
                                name: tier
                                modelAsString: true
                            family:
                              description: The family of the peering SKU.
                              enum:
                              - Direct
                              - Exchange
                              type: string
                              readOnly: true
                              x-ms-enum:
                                name: family
                                modelAsString: true
                            size:
                              description: The size of the peering SKU.
                              enum:
                              - Free
                              - Metered
                              - Unlimited
                              type: string
                              readOnly: true
                              x-ms-enum:
                                name: size
                                modelAsString: true
                        kind:
                          description: The kind of the peering.
                          enum:
                          - Direct
                          - Exchange
                          type: string
                          x-ms-enum:
                            name: kind
                            modelAsString: true
                        properties:
                          description: The properties that define a peering.
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            direct:
                              description: The properties that define a direct peering.
                              type: object
                              properties:
                                connections:
                                  description: The set of connections that constitute
                                    a direct peering.
                                  type: array
                                  items:
                                    description: The properties that define a direct
                                      connection.
                                    type: object
                                    properties:
                                      bandwidthInMbps:
                                        format: int32
                                        description: The bandwidth of the connection.
                                        type: integer
                                      provisionedBandwidthInMbps:
                                        format: int32
                                        description: The bandwidth that is actually
                                          provisioned.
                                        type: integer
                                        readOnly: true
                                      sessionAddressProvider:
                                        description: The field indicating if Microsoft
                                          provides session ip addresses.
                                        enum:
                                        - Microsoft
                                        - Peer
                                        type: string
                                        x-ms-enum:
                                          name: sessionAddressProvider
                                          modelAsString: true
                                      useForPeeringService:
                                        description: The flag that indicates whether
                                          or not the connection is used for peering
                                          service.
                                        type: boolean
                                      microsoftTrackingId:
                                        description: The ID used within Microsoft's
                                          peering provisioning system to track the
                                          connection
                                        type: string
                                        readOnly: true
                                      peeringDBFacilityId:
                                        format: int32
                                        description: The PeeringDB.com ID of the facility
                                          at which the connection has to be set up.
                                        type: integer
                                      connectionState:
                                        description: The state of the connection.
                                        enum:
                                        - None
                                        - PendingApproval
                                        - Approved
                                        - ProvisioningStarted
                                        - ProvisioningFailed
                                        - ProvisioningCompleted
                                        - Validating
                                        - Active
                                        - TypeChangeRequested
                                        - TypeChangeInProgress
                                        - ExternalBlocker
                                        type: string
                                        readOnly: true
                                        x-ms-enum:
                                          name: connectionState
                                          modelAsString: true
                                      bgpSession:
                                        description: The BGP session associated with
                                          the connection.
                                        type: object
                                        properties:
                                          sessionPrefixV4:
                                            description: The IPv4 prefix that contains
                                              both ends' IPv4 addresses.
                                            type: string
                                          sessionPrefixV6:
                                            description: The IPv6 prefix that contains
                                              both ends' IPv6 addresses.
                                            type: string
                                          microsoftSessionIPv4Address:
                                            description: The IPv4 session address
                                              on Microsoft's end.
                                            type: string
                                          microsoftSessionIPv6Address:
                                            description: The IPv6 session address
                                              on Microsoft's end.
                                            type: string
                                          peerSessionIPv4Address:
                                            description: The IPv4 session address
                                              on peer's end.
                                            type: string
                                          peerSessionIPv6Address:
                                            description: The IPv6 session address
                                              on peer's end.
                                            type: string
                                          sessionStateV4:
                                            description: The state of the IPv4 session.
                                            enum:
                                            - None
                                            - Idle
                                            - Connect
                                            - Active
                                            - OpenSent
                                            - OpenConfirm
                                            - OpenReceived
                                            - Established
                                            - PendingAdd
                                            - PendingUpdate
                                            - PendingRemove
                                            type: string
                                            readOnly: true
                                            x-ms-enum:
                                              name: sessionStateV4
                                              modelAsString: true
                                          sessionStateV6:
                                            description: The state of the IPv6 session.
                                            enum:
                                            - None
                                            - Idle
                                            - Connect
                                            - Active
                                            - OpenSent
                                            - OpenConfirm
                                            - OpenReceived
                                            - Established
                                            - PendingAdd
                                            - PendingUpdate
                                            - PendingRemove
                                            type: string
                                            readOnly: true
                                            x-ms-enum:
                                              name: sessionStateV6
                                              modelAsString: true
                                          maxPrefixesAdvertisedV4:
                                            format: int32
                                            description: The maximum number of prefixes
                                              advertised over the IPv4 session.
                                            type: integer
                                          maxPrefixesAdvertisedV6:
                                            format: int32
                                            description: The maximum number of prefixes
                                              advertised over the IPv6 session.
                                            type: integer
                                          md5AuthenticationKey:
                                            description: The MD5 authentication key
                                              of the session.
                                            type: string
                                      connectionIdentifier:
                                        description: The unique identifier (GUID)
                                          for the connection.
                                        type: string
                                      errorMessage:
                                        description: The error message related to
                                          the connection state, if any.
                                        type: string
                                        readOnly: true
                                  x-ms-identifiers: []
                                useForPeeringService:
                                  description: The flag that indicates whether or
                                    not the peering is used for peering service.
                                  type: boolean
                                  readOnly: true
                                peerAsn:
                                  description: The reference of the peer ASN.
                                  type: object
                                  properties:
                                    id:
                                      description: The identifier of the referenced
                                        resource.
                                      type: string
                                directPeeringType:
                                  description: The type of direct peering.
                                  enum:
                                  - Edge
                                  - Transit
                                  - Cdn
                                  - Internal
                                  - Ix
                                  - IxRs
                                  - Voice
                                  - EdgeZoneForOperators
                                  - PeerProp
                                  type: string
                                  x-ms-enum:
                                    name: directPeeringType
                                    modelAsString: true
                            exchange:
                              description: The properties that define an exchange
                                peering.
                              type: object
                              properties:
                                connections:
                                  description: The set of connections that constitute
                                    an exchange peering.
                                  type: array
                                  items:
                                    description: The properties that define an exchange
                                      connection.
                                    type: object
                                    properties:
                                      peeringDBFacilityId:
                                        format: int32
                                        description: The PeeringDB.com ID of the facility
                                          at which the connection has to be set up.
                                        type: integer
                                      connectionState:
                                        description: The state of the connection.
                                        enum:
                                        - None
                                        - PendingApproval
                                        - Approved
                                        - ProvisioningStarted
                                        - ProvisioningFailed
                                        - ProvisioningCompleted
                                        - Validating
                                        - Active
                                        - TypeChangeRequested
                                        - TypeChangeInProgress
                                        - ExternalBlocker
                                        type: string
                                        readOnly: true
                                        x-ms-enum:
                                          name: connectionState
                                          modelAsString: true
                                      bgpSession:
                                        description: The BGP session associated with
                                          the connection.
                                        type: object
                                        properties:
                                          sessionPrefixV4:
                                            description: The IPv4 prefix that contains
                                              both ends' IPv4 addresses.
                                            type: string
                                          sessionPrefixV6:
                                            description: The IPv6 prefix that contains
                                              both ends' IPv6 addresses.
                                            type: string
                                          microsoftSessionIPv4Address:
                                            description: The IPv4 session address
                                              on Microsoft's end.
                                            type: string
                                          microsoftSessionIPv6Address:
                                            description: The IPv6 session address
                                              on Microsoft's end.
                                            type: string
                                          peerSessionIPv4Address:
                                            description: The IPv4 session address
                                              on peer's end.
                                            type: string
                                          peerSessionIPv6Address:
                                            description: The IPv6 session address
                                              on peer's end.
                                            type: string
                                          sessionStateV4:
                                            description: The state of the IPv4 session.
                                            enum:
                                            - None
                                            - Idle
                                            - Connect
                                            - Active
                                            - OpenSent
                                            - OpenConfirm
                                            - OpenReceived
                                            - Established
                                            - PendingAdd
                                            - PendingUpdate
                                            - PendingRemove
                                            type: string
                                            readOnly: true
                                            x-ms-enum:
                                              name: sessionStateV4
                                              modelAsString: true
                                          sessionStateV6:
                                            description: The state of the IPv6 session.
                                            enum:
                                            - None
                                            - Idle
                                            - Connect
                                            - Active
                                            - OpenSent
                                            - OpenConfirm
                                            - OpenReceived
                                            - Established
                                            - PendingAdd
                                            - PendingUpdate
                                            - PendingRemove
                                            type: string
                                            readOnly: true
                                            x-ms-enum:
                                              name: sessionStateV6
                                              modelAsString: true
                                          maxPrefixesAdvertisedV4:
                                            format: int32
                                            description: The maximum number of prefixes
                                              advertised over the IPv4 session.
                                            type: integer
                                          maxPrefixesAdvertisedV6:
                                            format: int32
                                            description: The maximum number of prefixes
                                              advertised over the IPv6 session.
                                            type: integer
                                          md5AuthenticationKey:
                                            description: The MD5 authentication key
                                              of the session.
                                            type: string
                                      connectionIdentifier:
                                        description: The unique identifier (GUID)
                                          for the connection.
                                        type: string
                                      errorMessage:
                                        description: The error message related to
                                          the connection state, if any.
                                        type: string
                                        readOnly: true
                                  x-ms-identifiers: []
                                peerAsn:
                                  description: The reference of the peer ASN.
                                  type: object
                                  properties:
                                    id:
                                      description: The identifier of the referenced
                                        resource.
                                      type: string
                            connectivityProbes:
                              description: The connectivity probes associated with
                                the peering.
                              type: array
                              items:
                                description: "Represents a connectivity probe, a configuration\
                                  \ peers can add to direct and exchange peerings\
                                  \ to create ping tests. These ping\r\ntests will\
                                  \ allow us to generate availability, jitter, and\
                                  \ latency data for traffic (using ICMP or TCP) from\
                                  \ Azure to an endpoint\r\nIP address given by the\
                                  \ customer. This data will be emitted such that\
                                  \ the peer can view these metrics in the Azure portal\
                                  \ in the\r\nConnectivity probe blade of their peering."
                                type: object
                                properties:
                                  endpoint:
                                    description: The endpoint IP address where traffic
                                      will be sent to from Azure for the connectivity
                                      probe.
                                    type: string
                                    x-ms-mutability:
                                    - read
                                    - create
                                  azureRegion:
                                    description: The Azure region where traffic will
                                      originate from for the connectivity probe.
                                    type: string
                                    x-ms-mutability:
                                    - read
                                    - create
                                  protocol:
                                    description: The protocol of the traffic that
                                      will be sent for the connectivity probe.
                                    enum:
                                    - None
                                    - ICMP
                                    - TCP
                                    type: string
                                    x-ms-enum:
                                      name: protocol
                                      modelAsString: true
                                  prefixesToAccesslist:
                                    description: "Set to contain the prefixes that\
                                      \ agents in Azure will send traffic from. For\
                                      \ peers to allow into their\r\nnetwork the connectivity\
                                      \ probe traffic can reach their endpoint for\
                                      \ the connectivity probe."
                                    type: array
                                    items:
                                      type: string
                                    readOnly: true
                                    x-ms-identifiers: []
                              x-ms-identifiers: []
                            peeringLocation:
                              description: The location of the peering.
                              type: string
                            provisioningState:
                              description: The provisioning state of the resource.
                              enum:
                              - Succeeded
                              - Updating
                              - Deleting
                              - Failed
                              - Canceled
                              type: string
                              readOnly: true
                              x-ms-enum:
                                name: provisioningState
                                modelAsString: true
                        location:
                          description: The location of the resource.
                          type: string
                          x-ms-mutability:
                          - read
                          - create
                        tags:
                          description: The resource tags.
                          type: object
                          additionalProperties:
                            type: string
                      description: The ARM resource class.
                      x-ms-azure-resource: true
                      required:
                      - sku
                      - kind
                      - location
                    x-ms-identifiers: []
                  nextLink:
                    description: The link to fetch the next page of peerings.
                    type: string
        default:
          description: Error response describing why the operation has failed.
          content:
            application/json:
              schema:
                description: The error response that indicates why an operation has
                  failed.
                type: object
                properties:
                  error:
                    description: The error detail that describes why an operation
                      has failed.
                    type: object
                    properties:
                      code:
                        description: The error code.
                        type: string
                        readOnly: true
                      message:
                        description: The error message.
                        type: string
                        readOnly: true
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Peering/lookingGlass:
    post:
      tags:
      - LookingGlass
      description: Run looking glass functionality
      operationId: LookingGlass_Invoke
      parameters:
      - name: command
        in: query
        description: 'The command to be executed: ping, traceroute, bgpRoute.'
        required: true
        x-ms-enum:
          name: LookingGlassCommand
          modelAsString: true
        schema:
          type: string
          enum:
          - Traceroute
          - Ping
          - BgpRoute
      - name: sourceType
        in: query
        description: 'The type of the source: Edge site or Azure Region.'
        required: true
        x-ms-enum:
          name: LookingGlassSourceType
          modelAsString: true
        schema:
          type: string
          enum:
          - EdgeSite
          - AzureRegion
      - name: sourceLocation
        in: query
        description: The location of the source.
        required: true
        schema:
          type: string
      - name: destinationIP
        in: query
        description: The IP address of the destination.
        required: true
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The Azure subscription ID.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The client API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Looking glass output model
                type: object
                properties:
                  command:
                    description: Invoked command
                    enum:
                    - Traceroute
                    - Ping
                    - BgpRoute
                    type: string
                    x-ms-enum:
                      name: command
                      modelAsString: true
                  output:
                    description: Output of the command
                    type: string
        default:
          description: Error response describing why the operation has failed.
          content:
            application/json:
              schema:
                description: The error response that indicates why an operation has
                  failed.
                type: object
                properties:
                  error:
                    description: The error detail that describes why an operation
                      has failed.
                    type: object
                    properties:
                      code:
                        description: The error code.
                        type: string
                        readOnly: true
                      message:
                        description: The error message.
                        type: string
                        readOnly: true
  /providers/Microsoft.Peering/operations:
    get:
      tags:
      - Operations
      description: Lists all of the available API operations for peering resources.
      operationId: Operations_List
      parameters:
      - name: api-version
        in: query
        description: The client API version.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: The paginated list of peering API operations.
                type: object
                properties:
                  value:
                    description: The list of peering API operations.
                    type: array
                    items:
                      description: The peering API operation.
                      type: object
                      properties:
                        name:
                          description: The name of the operation.
                          type: string
                          readOnly: true
                        display:
                          description: The information related to the operation.
                          readOnly: true
                          type: object
                          properties:
                            provider:
                              description: The name of the resource provider.
                              type: string
                              readOnly: true
                            resource:
                              description: The type of the resource.
                              type: string
                              readOnly: true
                            operation:
                              description: The name of the operation.
                              type: string
                              readOnly: true
                            description:
                              description: The description of the operation.
                              type: string
                              readOnly: true
                        isDataAction:
                          description: The flag that indicates whether the operation
                            applies to data plane.
                          type: boolean
                          readOnly: true
                        properties:
                          description: The properties of the operation.
                          readOnly: true
                          x-ms-client-flatten: true
                          type: object
                          properties:
                            serviceSpecification:
                              description: Service specification payload.
                              readOnly: true
                              type: object
                              properties:
                                metricSpecifications:
                                  description: Specifications of the Metrics for Azure
                                    Monitoring.
                                  type: array
                                  items:
                                    description: Specifications of the Metrics for
                                      Azure Monitoring.
                                    type: object
                                    properties:
                                      name:
                                        description: Name of the metric.
                                        type: string
                                        readOnly: true
                                      displayName:
                                        description: Localized friendly display name
                                          of the metric.
                                        type: string
                                        readOnly: true
                                      displayDescription:
                                        description: Localized friendly description
                                          of the metric.
                                        type: string
                                        readOnly: true
                                      unit:
                                        description: Unit that makes sense for the
                                          metric.
                                        type: string
                                        readOnly: true
                                      aggregationType:
                                        description: 'Aggregation type will be set
                                          to one of the values: Average, Minimum,
                                          Maximum, Total, Count.'
                                        type: string
                                        readOnly: true
                                      supportedTimeGrainTypes:
                                        description: Supported time grain types for
                                          the metric.
                                        type: array
                                        items:
                                          type: string
                                        readOnly: true
                                        x-ms-identifiers: []
                                      dimensions:
                                        description: Dimensions of the metric.
                                        type: array
                                        items:
                                          description: Dimensions of the metric.
                                          type: object
                                          properties:
                                            name:
                                              description: Name of the dimension.
                                              type: string
                                              readOnly: true
                                            displayName:
