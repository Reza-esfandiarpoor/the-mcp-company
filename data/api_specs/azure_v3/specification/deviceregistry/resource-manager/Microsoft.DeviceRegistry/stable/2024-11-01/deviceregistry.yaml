servers:
- url: https://management.azure.com
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription. The value must be an UUID.
      required: true
      schema:
        type: string
        format: uuid
    LocationParameter:
      name: location
      in: path
      description: The name of the Azure region.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
    OperationIdParameter:
      name: operationId
      in: path
      description: The ID of an ongoing async operation.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Asset:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/AssetProperties'
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
      required:
      - extendedLocation
      description: Asset definition.
    AssetEndpointProfile:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/AssetEndpointProfileProperties'
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
      required:
      - extendedLocation
      description: Asset Endpoint Profile definition.
    AssetEndpointProfileListResult:
      type: object
      description: The response of a AssetEndpointProfile list operation.
      properties:
        value:
          type: array
          description: The AssetEndpointProfile items on this page
          items:
            $ref: '#/components/schemas/AssetEndpointProfile'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    AssetEndpointProfileProperties:
      type: object
      description: Defines the Asset Endpoint Profile properties.
      properties:
        uuid:
          type: string
          description: Globally unique, immutable, non-reusable id.
          readOnly: true
        targetAddress:
          type: string
          format: uri
          description: The local valid URI specifying the network address/DNS name
            of a southbound device. The scheme part of the targetAddress URI specifies
            the type of the device. The additionalConfiguration field holds further
            connector type specific configuration.
        endpointProfileType:
          type: string
          description: Defines the configuration for the connector type that is being
            used with the endpoint profile.
        authentication:
          $ref: '#/components/schemas/Authentication'
        additionalConfiguration:
          type: string
          description: Stringified JSON that contains connectivity type specific further
            configuration (e.g. OPC UA, Modbus, ONVIF).
        discoveredAssetEndpointProfileRef:
          type: string
          description: Reference to a discovered asset endpoint profile. Populated
            only if the asset endpoint profile has been created from discovery flow.
            Discovered asset endpoint profile name must be provided.
          x-ms-mutability:
          - read
          - create
        status:
          $ref: '#/components/schemas/AssetEndpointProfileStatus'
        provisioningState:
          $ref: '#/components/schemas/ProvisioningState'
      required:
      - targetAddress
      - endpointProfileType
    AssetEndpointProfileStatus:
      type: object
      description: Defines the asset endpoint profile status properties.
      properties:
        errors:
          type: array
          description: Array object to transfer and persist errors that originate
            from the Edge.
          items:
            $ref: '#/components/schemas/AssetEndpointProfileStatusError'
          readOnly: true
          x-ms-identifiers: []
    AssetEndpointProfileStatusError:
      type: object
      description: Defines the asset endpoint profile status error properties.
      properties:
        code:
          type: integer
          format: int32
          description: 'Error code for classification of errors (ex: 400, 404, 500,
            etc.).'
          readOnly: true
        message:
          type: string
          description: "Human readable helpful error message to provide additional
            context for error (ex: \u201CtargetAddress 'foo' is not a valid url\u201D)."
          readOnly: true
    AssetEndpointProfileUpdate:
      type: object
      description: The type used for update operations of the AssetEndpointProfile.
      properties:
        tags:
          type: object
          description: Resource tags.
          additionalProperties:
            type: string
        properties:
          $ref: '#/components/schemas/AssetEndpointProfileUpdateProperties'
    AssetEndpointProfileUpdateProperties:
      type: object
      description: The updatable properties of the AssetEndpointProfile.
      properties:
        targetAddress:
          type: string
          format: uri
          description: The local valid URI specifying the network address/DNS name
            of a southbound device. The scheme part of the targetAddress URI specifies
            the type of the device. The additionalConfiguration field holds further
            connector type specific configuration.
        endpointProfileType:
          type: string
          description: Defines the configuration for the connector type that is being
            used with the endpoint profile.
        authentication:
          $ref: '#/components/schemas/AuthenticationUpdate'
        additionalConfiguration:
          type: string
          description: Stringified JSON that contains connectivity type specific further
            configuration (e.g. OPC UA, Modbus, ONVIF).
    AssetListResult:
      type: object
      description: The response of a Asset list operation.
      properties:
        value:
          type: array
          description: The Asset items on this page
          items:
            $ref: '#/components/schemas/Asset'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    AssetProperties:
      type: object
      description: Defines the asset properties.
      properties:
        uuid:
          type: string
          description: Globally unique, immutable, non-reusable id.
          readOnly: true
        enabled:
          type: boolean
          description: Enabled/Disabled status of the asset.
        externalAssetId:
          type: string
          description: Asset id provided by the customer.
          x-ms-mutability:
          - read
          - create
        displayName:
          type: string
          description: Human-readable display name.
        description:
          type: string
          description: Human-readable description of the asset.
        assetEndpointProfileRef:
          type: string
          description: A reference to the asset endpoint profile (connection information)
            used by brokers to connect to an endpoint that provides data points for
            this asset. Must provide asset endpoint profile name.
          x-ms-mutability:
          - read
          - create
        version:
          type: integer
          format: int64
          description: An integer that is incremented each time the resource is modified.
          readOnly: true
        manufacturer:
          type: string
          description: Asset manufacturer name.
        manufacturerUri:
          type: string
          description: Asset manufacturer URI.
        model:
          type: string
          description: Asset model name.
        productCode:
          type: string
          description: Asset product code.
        hardwareRevision:
          type: string
          description: Revision number of the hardware.
        softwareRevision:
          type: string
          description: Revision number of the software.
        documentationUri:
          type: string
          description: Reference to the documentation.
        serialNumber:
          type: string
          description: Asset serial number.
        attributes:
          type: object
          description: A set of key-value pairs that contain custom attributes set
            by the customer.
          additionalProperties: {}
        discoveredAssetRefs:
          type: array
          description: Reference to a list of discovered assets. Populated only if
            the asset has been created from discovery flow. Discovered asset names
            must be provided.
          items:
            type: string
          x-ms-mutability:
          - read
          - create
        defaultDatasetsConfiguration:
          type: string
          description: Stringified JSON that contains connector-specific default configuration
            for all datasets. Each dataset can have its own configuration that overrides
            the default settings here.
        defaultEventsConfiguration:
          type: string
          description: Stringified JSON that contains connector-specific default configuration
            for all events. Each event can have its own configuration that overrides
            the default settings here.
        defaultTopic:
          $ref: '#/components/schemas/Topic'
        datasets:
          type: array
          description: Array of datasets that are part of the asset. Each dataset
            describes the data points that make up the set.
          items:
            $ref: '#/components/schemas/Dataset'
