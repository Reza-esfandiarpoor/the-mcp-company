                                    type: string
                                    readOnly: true
                                  policyDefinitionReferenceId:
                                    description: The reference identifier of a specific
                                      policy definition within a policy set definition.
                                    type: string
                                    readOnly: true
                                  policyAssignmentId:
                                    description: The resource identifier of the policy
                                      assignment.
                                    type: string
                                    readOnly: true
