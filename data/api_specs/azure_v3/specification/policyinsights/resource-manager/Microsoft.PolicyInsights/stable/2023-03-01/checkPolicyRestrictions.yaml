          application/json:
            schema:
              description: The check policy restrictions parameters describing the
                resource that is being evaluated.
              properties:
                resourceDetails:
                  description: The information about the resource that will be evaluated.
                  properties:
                    resourceContent:
                      description: The resource content. This should include whatever
                        properties are already known and can be a partial set of all
                        resource properties.
                      type: object
                    apiVersion:
                      description: The api-version of the resource content.
                      type: string
                    scope:
                      description: The scope where the resource is being created.
                        For example, if the resource is a child resource this would
                        be the parent resource's resource ID.
                      type: string
                  required:
                  - resourceContent
                pendingFields:
                  description: The list of fields and values that should be evaluated
                    for potential restrictions.
                  type: array
                  items:
                    description: A field that should be evaluated against Azure Policy
                      to determine restrictions.
