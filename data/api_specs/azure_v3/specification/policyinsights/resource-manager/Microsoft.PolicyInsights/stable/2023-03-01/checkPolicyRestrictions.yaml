                          property like 'name' or 'type' or an Azure Policy field
                          alias.
                        type: string
                      values:
                        description: The list of potential values for the field that
                          should be evaluated against Azure Policy.
                        type: array
                        items:
                          type: string
                    required:
                    - field
                includeAuditEffect:
                  description: Whether to include policies with the 'audit' effect
                    in the results. Defaults to false.
                  type: boolean
                  default: false
              required:
              - resourceDetails
        description: The check policy restrictions parameters.
        required: true
      responses:
        '200':
          description: The restrictions that will be placed on the resource by Azure
            Policy.
