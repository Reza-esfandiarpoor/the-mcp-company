                    type: string
                    readOnly: true
                  message:
                    description: The error message.
                    type: string
                    readOnly: true
                  details:
                    description: The error details.
                    type: string
                    readOnly: true
      deprecated: false
    delete:
      tags:
      - DpsCertificate
      operationId: DpsCertificate_Delete
      summary: Delete the Provisioning Service Certificate.
      description: Deletes the specified certificate associated with the Provisioning
        Service
      parameters:
      - name: subscriptionId
        in: path
        description: The subscription identifier.
        required: true
        schema:
          type: string
      - name: resourceGroupName
        in: path
        required: true
        description: Resource group identifier.
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        description: ETag of the certificate
        schema:
          type: string
      - name: provisioningServiceName
        in: path
        required: true
        description: The name of the provisioning service.
        schema:
          type: string
      - name: certificateName
        in: path
        required: true
        description: This is a mandatory field, and is the logical name of the certificate
          that the provisioning service will access by.
        schema:
          type: string
      - name: certificate.name
        in: query
        required: false
        description: This is optional, and it is the Common Name of the certificate.
        schema:
          type: string
      - name: certificate.rawBytes
        in: query
        required: false
        description: Raw data within the certificate.
        schema:
          type: string
          format: byte
      - name: certificate.isVerified
        in: query
        required: false
        description: Indicates if certificate has been verified by owner of the private
          key.
        schema:
          type: boolean
      - name: certificate.purpose
        in: query
        required: false
        description: A description that mentions the purpose of the certificate.
        x-ms-enum:
          name: CertificatePurpose
          modelAsString: true
        schema:
          type: string
          enum:
          - clientAuthentication
          - serverAuthentication
      - name: certificate.created
        in: query
        description: Time the certificate is created.
        required: false
        schema:
          type: string
          format: date-time
      - name: certificate.lastUpdated
        in: query
        required: false
        description: Time the certificate is last updated.
        schema:
          type: string
          format: date-time
      - name: certificate.hasPrivateKey
        in: query
        required: false
        description: Indicates if the certificate contains a private key.
        schema:
          type: boolean
      - name: certificate.nonce
        in: query
        required: false
        description: Random number generated to indicate Proof of Possession.
        schema:
          type: string
      - name: api-version
        in: query
        description: The version of the API.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK.
        '204':
          description: No content.
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                description: Error details.
                type: object
                properties:
                  code:
                    description: The error code.
                    format: int32
                    type: integer
                    readOnly: true
                  httpStatusCode:
                    description: The HTTP status code.
                    type: string
                    readOnly: true
                  message:
                    description: The error message.
                    type: string
                    readOnly: true
                  details:
                    description: The error details.
                    type: string
                    readOnly: true
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Devices/provisioningServices/{provisioningServiceName}
  : get:
      tags:
      - IotDpsResource
      summary: Get the non-security related metadata of the provisioning service.
      description: Get the metadata of the provisioning service without SAS keys.
      operationId: IotDpsResource_Get
      parameters:
      - name: provisioningServiceName
        in: path
        required: true
        description: Name of the provisioning service to retrieve.
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The subscription identifier.
        required: true
        schema:
          type: string
      - name: resourceGroupName
        in: path
        required: true
        description: Resource group name.
        schema:
          type: string
      - name: api-version
        in: query
        description: The version of the API.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Provisioning service description with no keys is included in
            the response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    readOnly: true
                    type: string
                    description: The resource identifier.
                  name:
                    readOnly: true
                    type: string
                    description: The resource name.
                    pattern: ^(?![0-9]+$)(?!-)[a-zA-Z0-9-]{2,49}[a-zA-Z0-9]$
                  type:
                    readOnly: true
                    type: string
                    description: The resource type.
                  location:
                    type: string
                    description: The resource location.
                  resourcegroup:
                    type: string
                    description: The resource group of the resource.
                  subscriptionid:
                    type: string
                    description: The subscription id of the resource.
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                    description: The resource tags.
                  etag:
                    description: The Etag field is *not* required. If it is provided
                      in the response body, it must also be provided as a header per
                      the normal ETag convention.
                    type: string
                  properties:
                    description: Service specific properties for a provisioning service
                    type: object
                    properties:
                      state:
                        description: Current state of the provisioning service.
                        enum:
                        - Activating
                        - Active
                        - Deleting
                        - Deleted
                        - ActivationFailed
                        - DeletionFailed
                        - Transitioning
                        - Suspending
                        - Suspended
                        - Resuming
                        - FailingOver
                        - FailoverFailed
                        type: string
                        x-ms-enum:
                          name: state
                          modelAsString: true
                      publicNetworkAccess:
                        type: string
                        description: Whether requests from Public Network are allowed
                        enum:
                        - Enabled
                        - Disabled
                        x-ms-enum:
                          modelAsString: true
                          name: PublicNetworkAccess
                      ipFilterRules:
                        description: The IP filter rules.
                        type: array
                        items:
                          description: The IP filter rules for a provisioning Service.
                          type: object
                          properties:
                            filterName:
                              description: The name of the IP filter rule.
                              type: string
                            action:
                              description: The desired action for requests captured
                                by this rule.
                              enum:
                              - Accept
                              - Reject
                              type: string
                              x-ms-enum:
                                name: IpFilterActionType
                                modelAsString: false
                            ipMask:
                              description: A string that contains the IP address range
                                in CIDR notation for the rule.
                              type: string
                            target:
                              description: Target for requests captured by this rule.
                              enum:
                              - all
                              - serviceApi
                              - deviceApi
                              type: string
                              x-ms-enum:
                                name: IpFilterTargetType
                                modelAsString: false
                          required:
                          - filterName
                          - action
                          - ipMask
                      privateEndpointConnections:
                        description: Private endpoint connections created on this
                          IotHub
                        type: array
                        items:
                          description: The private endpoint connection of a provisioning
                            service
                          x-ms-azure-resource: true
                          type: object
                          properties:
                            id:
                              readOnly: true
                              type: string
                              description: The resource identifier.
                            name:
                              readOnly: true
                              type: string
                              description: The resource name.
                              pattern: ^(?![0-9]+$)(?!-)[a-zA-Z0-9-]{2,49}[a-zA-Z0-9]$
                            type:
                              readOnly: true
                              type: string
                              description: The resource type.
                            properties:
                              description: The properties of a private endpoint connection
                              type: object
                              properties:
                                privateEndpoint:
                                  description: The private endpoint property of a
                                    private endpoint connection
                                  type: object
                                  properties:
                                    id:
                                      readOnly: true
                                      type: string
                                      description: The resource identifier.
                                privateLinkServiceConnectionState:
                                  description: The current state of a private endpoint
                                    connection
                                  type: object
                                  properties:
                                    status:
                                      description: The status of a private endpoint
                                        connection
                                      enum:
                                      - Pending
                                      - Approved
                                      - Rejected
                                      - Disconnected
                                      type: string
                                      x-ms-enum:
                                        name: PrivateLinkServiceConnectionStatus
                                        modelAsString: true
                                    description:
                                      type: string
                                      description: The description for the current
                                        state of a private endpoint connection
                                    actionsRequired:
                                      type: string
                                      description: Actions required for a private
                                        endpoint connection
                                  required:
                                  - status
                                  - description
                              required:
                              - privateLinkServiceConnectionState
                            systemData:
                              readOnly: true
                              description: Metadata pertaining to creation and last
                                modification of the resource.
                              type: object
                              properties:
                                createdBy:
                                  type: string
                                  description: The identity that created the resource.
                                createdByType:
                                  type: string
                                  description: The type of identity that created the
                                    resource.
                                  enum:
                                  - User
                                  - Application
                                  - ManagedIdentity
                                  - Key
                                  x-ms-enum:
                                    name: createdByType
                                    modelAsString: true
                                createdAt:
                                  type: string
                                  format: date-time
                                  description: The timestamp of resource creation
                                    (UTC).
                                lastModifiedBy:
                                  type: string
                                  description: The identity that last modified the
                                    resource.
                                lastModifiedByType:
                                  type: string
                                  description: The type of identity that last modified
                                    the resource.
                                  enum:
                                  - User
                                  - Application
                                  - ManagedIdentity
                                  - Key
                                  x-ms-enum:
                                    name: createdByType
                                    modelAsString: true
                                lastModifiedAt:
                                  type: string
                                  format: date-time
                                  description: The timestamp of resource last modification
                                    (UTC)
                          required:
                          - properties
                      provisioningState:
                        description: The ARM provisioning state of the provisioning
                          service.
                        type: string
                      iotHubs:
                        type: array
                        description: List of IoT hubs associated with this provisioning
                          service.
                        items:
                          type: object
                          description: Description of the IoT hub.
                          properties:
                            applyAllocationPolicy:
                              description: flag for applying allocationPolicy or not
                                for a given iot hub.
                              type: boolean
                            allocationWeight:
                              description: weight to apply for a given iot h.
                              format: int32
                              type: integer
                            name:
                              type: string
                              readOnly: true
                              description: Host name of the IoT hub.
                            connectionString:
                              type: string
                              description: Connection string of the IoT hub.
                            location:
                              type: string
                              description: ARM region of the IoT hub.
                          required:
                          - connectionString
                          - location
                      allocationPolicy:
                        enum:
                        - Hashed
                        - GeoLatency
                        - Static
                        type: string
                        description: Allocation policy to be used by this provisioning
                          service.
                        x-ms-enum:
                          name: AllocationPolicy
                          modelAsString: true
                      serviceOperationsHostName:
                        description: Service endpoint for provisioning service.
                        type: string
                        readOnly: true
                      deviceProvisioningHostName:
                        type: string
                        description: Device endpoint for this provisioning service.
                        readOnly: true
                      idScope:
                        type: string
                        description: Unique identifier of this provisioning service.
                        readOnly: true
                      authorizationPolicies:
                        description: List of authorization keys for a provisioning
                          service.
                        type: array
                        items:
                          type: object
                          description: Description of the shared access key.
                          properties:
                            keyName:
                              type: string
                              description: Name of the key.
                            primaryKey:
                              type: string
                              description: Primary SAS key value.
                            secondaryKey:
                              type: string
                              description: Secondary SAS key value.
                            rights:
                              description: Rights that this key has.
                              enum:
                              - ServiceConfig
                              - EnrollmentRead
                              - EnrollmentWrite
                              - DeviceConnect
                              - RegistrationStatusRead
                              - RegistrationStatusWrite
                              type: string
                              x-ms-enum:
                                name: AccessRightsDescription
                                modelAsString: true
                          required:
                          - keyName
                          - rights
                      enableDataResidency:
                        type: boolean
                        description: 'Optional.

                          Indicates if the DPS instance has Data Residency enabled,
                          removing the cross geo-pair disaster recovery.'
                      portalOperationsHostName:
                        type: string
                        description: Portal endpoint to enable CORS for this provisioning
