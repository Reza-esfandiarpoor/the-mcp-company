                      - ManagedIdentity
                      - Key
                      x-ms-enum:
                        name: createdByType
                        modelAsString: true
                    createdAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource creation (UTC).
                    lastModifiedBy:
                      type: string
                      description: The identity that last modified the resource.
                    lastModifiedByType:
                      type: string
                      description: The type of identity that last modified the resource.
                      enum:
                      - User
                      - Application
                      - ManagedIdentity
                      - Key
                      x-ms-enum:
                        name: createdByType
                        modelAsString: true
                    lastModifiedAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource last modification (UTC)
              x-ms-azure-resource: true
        description: The certificate body.
        required: true
      responses:
        '200':
          description: If certificate already exist and update was successful, the
            operation returns HTTP status code of 201 (OK).
          content:
            application/json:
              schema:
                description: The X509 Certificate.
                type: object
                properties:
                  properties:
                    description: properties of a certificate
                    type: object
                    properties:
                      subject:
                        description: The certificate's subject name.
                        type: string
                        readOnly: true
                      expiry:
                        description: The certificate's expiration date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                      thumbprint:
                        description: The certificate's thumbprint.
                        type: string
                        readOnly: true
                      isVerified:
                        description: Determines whether certificate has been verified.
                        type: boolean
                      certificate:
                        description: base-64 representation of X509 certificate .cer
                          file or just .pem file content.
                        type: string
                        format: byte
                      created:
                        description: The certificate's creation date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                      updated:
                        description: The certificate's last update date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                  id:
                    readOnly: true
                    type: string
                    description: The resource identifier.
                  name:
                    description: The name of the certificate.
                    type: string
                    readOnly: true
                  etag:
                    description: The entity tag.
                    type: string
                    readOnly: true
                  type:
                    readOnly: true
                    type: string
                    description: The resource type.
                  systemData:
                    readOnly: true
                    description: Metadata pertaining to creation and last modification
                      of the resource.
                    type: object
                    properties:
                      createdBy:
                        type: string
                        description: The identity that created the resource.
                      createdByType:
                        type: string
                        description: The type of identity that created the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      createdAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource creation (UTC).
                      lastModifiedBy:
                        type: string
                        description: The identity that last modified the resource.
                      lastModifiedByType:
                        type: string
                        description: The type of identity that last modified the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      lastModifiedAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource last modification (UTC)
                x-ms-azure-resource: true
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                description: Error details.
                type: object
