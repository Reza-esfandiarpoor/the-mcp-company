openapi: 3.0.0
info:
  version: 2022-12-12
  x-ms-code-generation-settings:
    host: management.azure.com
  title: iotDpsClient
  description: API for using the Azure IoT Hub Device Provisioning Service features.
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.Devices/operations:
    get:
      tags:
      - Operations
      operationId: Operations_List
      description: Lists all of the available Microsoft.Devices REST API operations.
      parameters:
      - name: api-version
        in: query
        description: The version of the API.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                description: Result of the request to list provisioning service operations.
                  It contains a list of operations and a URL link to get the next
                  set of results.
                properties:
                  value:
                    description: Provisioning service operations supported by the
                      Microsoft.Devices resource provider.
                    type: array
                    readOnly: true
                    items:
                      description: Provisioning Service REST API operation.
                      type: object
                      properties:
                        name:
                          readOnly: true
                          type: string
                          description: 'Operation name: {provider}/{resource}/{read
                            | write | action | delete}'
                        display:
                          description: The object that represents the operation.
                          properties:
                            provider:
                              readOnly: true
                              type: string
                              description: 'Service provider: Microsoft Devices.'
                            resource:
                              readOnly: true
                              type: string
                              description: 'Resource Type: ProvisioningServices.'
                            operation:
                              readOnly: true
                              type: string
                              description: Name of the operation.
                  nextLink:
                    readOnly: true
                    type: string
                    description: URL to get the next set of operation list results
                      if there are any.
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                description: Error details.
                type: object
                properties:
                  code:
                    description: The error code.
                    format: int32
                    type: integer
                    readOnly: true
                  httpStatusCode:
                    description: The HTTP status code.
                    type: string
                    readOnly: true
                  message:
                    description: The error message.
                    type: string
                    readOnly: true
                  details:
                    description: The error details.
                    type: string
                    readOnly: true
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Devices/provisioningServices/{provisioningServiceName}/certificates/{certificateName}
  : get:
      tags:
      - DpsCertificate
      operationId: DpsCertificate_Get
      description: Get the certificate from the provisioning service.
      parameters:
      - name: certificateName
        in: path
        required: true
        description: Name of the certificate to retrieve.
        schema:
          type: string
      - name: subscriptionId
        in: path
        description: The subscription identifier.
        required: true
        schema:
          type: string
      - name: resourceGroupName
        in: path
        required: true
        description: Resource group identifier.
        schema:
          type: string
      - name: provisioningServiceName
        in: path
        required: true
        description: Name of the provisioning service the certificate is associated
          with.
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: ETag of the certificate.
        schema:
          type: string
      - name: api-version
        in: query
        description: The version of the API.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Metadata for the specified certificate.
          content:
            application/json:
              schema:
                description: The X509 Certificate.
                type: object
                properties:
                  properties:
                    description: properties of a certificate
                    type: object
                    properties:
                      subject:
                        description: The certificate's subject name.
                        type: string
                        readOnly: true
                      expiry:
                        description: The certificate's expiration date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                      thumbprint:
                        description: The certificate's thumbprint.
                        type: string
                        readOnly: true
                      isVerified:
                        description: Determines whether certificate has been verified.
                        type: boolean
                      certificate:
                        description: base-64 representation of X509 certificate .cer
                          file or just .pem file content.
                        type: string
                        format: byte
                      created:
                        description: The certificate's creation date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                      updated:
                        description: The certificate's last update date and time.
                        type: string
                        format: date-time-rfc1123
                        readOnly: true
                  id:
                    readOnly: true
                    type: string
                    description: The resource identifier.
                  name:
                    description: The name of the certificate.
                    type: string
                    readOnly: true
                  etag:
                    description: The entity tag.
                    type: string
                    readOnly: true
                  type:
                    readOnly: true
                    type: string
                    description: The resource type.
                  systemData:
                    readOnly: true
                    description: Metadata pertaining to creation and last modification
                      of the resource.
                    type: object
                    properties:
                      createdBy:
                        type: string
                        description: The identity that created the resource.
                      createdByType:
                        type: string
                        description: The type of identity that created the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      createdAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource creation (UTC).
                      lastModifiedBy:
                        type: string
                        description: The identity that last modified the resource.
                      lastModifiedByType:
                        type: string
                        description: The type of identity that last modified the resource.
                        enum:
                        - User
                        - Application
                        - ManagedIdentity
                        - Key
                        x-ms-enum:
                          name: createdByType
                          modelAsString: true
                      lastModifiedAt:
                        type: string
                        format: date-time
                        description: The timestamp of resource last modification (UTC)
                x-ms-azure-resource: true
        default:
          description: Default error response.
          content:
            application/json:
              schema:
                description: Error details.
                type: object
                properties:
                  code:
                    description: The error code.
                    format: int32
                    type: integer
                    readOnly: true
                  httpStatusCode:
                    description: The HTTP status code.
                    type: string
                    readOnly: true
                  message:
                    description: The error message.
                    type: string
                    readOnly: true
                  details:
                    description: The error details.
                    type: string
                    readOnly: true
    put:
      tags:
