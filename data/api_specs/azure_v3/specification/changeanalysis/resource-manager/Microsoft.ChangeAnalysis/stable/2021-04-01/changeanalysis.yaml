          type: string
          format: date-time
      - in: query
        name: $skipToken
        description: A skip token is used to continue retrieving items after an operation
          returns a partial result. If a previous response contains a nextLink element,
          the value of the nextLink element will include a skipToken parameter that
          specifies a starting point to use for subsequent calls.
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: The request was successful; the request was well-formed and
            received properly.
          content:
            application/json:
              schema:
                description: The list of detected changes.
                type: object
                properties:
                  value:
                    description: The list of changes.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          description: The properties of a change.
                          type: object
                          properties:
                            resourceId:
                              description: The resource id that the change is attached
                                to.
                              type: string
                            timeStamp:
                              format: date-time
                              description: The time when the change is detected.
                              type: string
                            initiatedByList:
                              description: "The list of identities who might initiated\
                                \ the change.\r\nThe identity could be user name (email\
                                \ address) or the object ID of the Service Principal."
                              type: array
                              items:
                                type: string
                            changeType:
                              description: The type of the change.
                              enum:
                              - Add
                              - Remove
                              - Update
                              type: string
                              x-ms-enum:
                                name: ChangeType
                                modelAsString: true
                            propertyChanges:
                              description: The list of detailed changes at json property
                                level.
                              type: array
                              items:
                                description: Data of a property change.
                                type: object
                                properties:
                                  changeType:
                                    description: The type of the change.
                                    enum:
                                    - Add
                                    - Remove
                                    - Update
                                    type: string
                                    x-ms-enum:
                                      name: ChangeType
                                      modelAsString: true
                                  changeCategory:
                                    description: The change category.
                                    enum:
                                    - User
                                    - System
                                    type: string
                                    x-ms-enum:
                                      name: ChangeCategory
                                      modelAsString: false
                                  jsonPath:
                                    description: The json path of the changed property.
                                    type: string
                                  displayName:
                                    description: The enhanced display name of the
                                      json path. E.g., the json path value[0].properties
                                      will be translated to something meaningful like
                                      slots["Staging"].properties.
                                    type: string
                                  level:
                                    enum:
                                    - Noisy
                                    - Normal
                                    - Important
                                    type: string
                                    x-ms-enum:
                                      name: Level
                                      modelAsString: true
                                  description:
                                    description: The description of the changed property.
                                    type: string
                                  oldValue:
                                    description: The value of the property before
                                      the change.
                                    type: string
                                  newValue:
                                    description: The value of the property after the
                                      change.
                                    type: string
                                  isDataMasked:
                                    description: The boolean indicating whether the
                                      oldValue and newValue are masked. The values
                                      are masked if it contains sensitive information
                                      that the user doesn't have access to.
                                    type: boolean
                              x-ms-identifiers: []
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
