  /{resourceId}/providers/Microsoft.ChangeAnalysis/resourceChanges:
    post:
      tags:
      - ResourceChanges
      summary: List the changes of a resource within the specified time range. Customer
        data will be masked if the user doesn't have access.
      operationId: ResourceChanges_List
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - in: path
        name: resourceId
        description: The identifier of the resource.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - in: query
        name: $startTime
        description: Specifies the start time of the changes request.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          format: date-time
      - in: query
        name: $endTime
        description: Specifies the end time of the changes request.
        required: true
        x-ms-parameter-location: method
