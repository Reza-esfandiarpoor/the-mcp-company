  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.DataLakeAnalytics/accounts/{accountName}
  : put:
      tags:
      - Accounts
      operationId: Accounts_Create
      description: Creates the specified Data Lake Analytics account. This supplies
        the user with computation services for Data Lake Analytics workloads.
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: Get subscription credentials which uniquely identify Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      - name: resourceGroupName
        in: path
        required: true
        x-ms-parameter-location: method
        description: The name of the Azure resource group.
        schema:
          type: string
      - name: accountName
        in: path
        required: true
        x-ms-parameter-location: method
        description: The name of the Data Lake Analytics account.
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: Client Api Version.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - location
              - properties
              properties:
                location:
                  type: string
                  description: The resource location.
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: The resource tags.
                properties:
                  x-ms-client-flatten: true
                  description: The Data Lake Analytics account properties to use for
                    creating.
                  required:
                  - defaultDataLakeStoreAccount
                  - dataLakeStoreAccounts
                  properties:
                    defaultDataLakeStoreAccount:
                      type: string
                      description: The default Data Lake Store account associated
                        with this account.
                    dataLakeStoreAccounts:
                      type: array
                      items:
                        required:
                        - name
                        properties:
                          name:
                            type: string
                            description: The unique name of the Data Lake Store account
                              to add.
                          properties:
                            x-ms-client-flatten: true
                            description: The Data Lake Store account properties to
                              use when adding a new Data Lake Store account.
                            properties:
                              suffix:
                                type: string
                                description: The optional suffix for the Data Lake
                                  Store account.
                        description: The parameters used to add a new Data Lake Store
                          account while creating a new Data Lake Analytics account.
                      description: The list of Data Lake Store accounts associated
                        with this account.
                      x-ms-identifiers:
                      - name
                    storageAccounts:
                      type: array
                      items:
                        required:
                        - name
                        - properties
                        properties:
                          name:
                            type: string
                            description: The unique name of the Azure Storage account
                              to add.
                          properties:
