                      x-ms-identifiers:
                      - name
                    computePolicies:
                      type: array
                      items:
                        required:
                        - name
                        - properties
                        properties:
                          name:
                            type: string
                            description: The unique name of the compute policy to
                              create.
                          properties:
                            x-ms-client-flatten: true
                            description: The compute policy properties to use when
                              creating a new compute policy.
                            required:
