                            description: The Azure Storage account properties to use
                              when adding a new Azure Storage account.
                            required:
                            - accessKey
                            properties:
                              accessKey:
                                type: string
                                description: The access key associated with this Azure
                                  Storage account that will be used to connect to
                                  it.
                              suffix:
                                type: string
                                default: azuredatalakestore.net
                                description: The optional suffix for the storage account.
                        description: The parameters used to add a new Azure Storage
                          account while creating a new Data Lake Analytics account.
                      description: The list of Azure Blob Storage accounts associated
