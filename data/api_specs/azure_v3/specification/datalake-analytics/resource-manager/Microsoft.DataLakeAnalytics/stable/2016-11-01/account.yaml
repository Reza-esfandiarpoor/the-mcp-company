                                - Group
                                - ServicePrincipal
                                x-ms-enum:
                                  name: AADObjectType
                                  modelAsString: true
                                description: The type of AAD object the object identifier
                                  refers to.
                              maxDegreeOfParallelismPerJob:
                                type: integer
                                format: int32
                                minimum: 1
                                description: The maximum degree of parallelism per
                                  job this user can use to submit jobs. This property,
                                  the min priority per job property, or both must
                                  be passed.
                              minPriorityPerJob:
                                type: integer
                                format: int32
                                minimum: 1
                                description: The minimum priority per job this user
                                  can use to submit jobs. This property, the max degree
                                  of parallelism per job property, or both must be
                                  passed.
                        description: The parameters used to create a new compute policy
                          while creating a new Data Lake Analytics account.
                      description: The list of compute policies associated with this
                        account.
                      x-ms-identifiers:
                      - name
                    firewallRules:
                      type: array
                      items:
                        required:
                        - name
                        - properties
                        properties:
                          name:
                            type: string
                            description: The unique name of the firewall rule to create.
                          properties:
                            x-ms-client-flatten: true
                            description: The firewall rule properties to use when
                              creating a new firewall rule.
                            required:
                            - startIpAddress
                            - endIpAddress
                            properties:
                              startIpAddress:
                                type: string
                                description: The start IP address for the firewall
                                  rule. This can be either ipv4 or ipv6. Start and
                                  End should be in the same protocol.
                              endIpAddress:
                                type: string
                                description: The end IP address for the firewall rule.
                                  This can be either ipv4 or ipv6. Start and End should
                                  be in the same protocol.
                        description: The parameters used to create a new firewall
                          rule while creating a new Data Lake Analytics account.
                      description: The list of firewall rules associated with this
                        account.
                      x-ms-identifiers:
                      - name
                    firewallState:
                      type: string
                      enum:
                      - Enabled
                      - Disabled
                      default: Disabled
                      x-ms-enum:
                        name: FirewallState
                        modelAsString: false
                      description: The current state of the IP address firewall for
                        this account.
                    firewallAllowAzureIps:
                      type: string
                      enum:
                      - Enabled
                      - Disabled
                      default: Disabled
                      x-ms-enum:
                        name: FirewallAllowAzureIpsState
                        modelAsString: false
                      description: The current state of allowing or disallowing IPs
                        originating within Azure through the firewall. If the firewall
                        is disabled, this is not enforced.
                    newTier:
                      type: string
                      enum:
                      - Consumption
                      - Commitment_100AUHours
                      - Commitment_500AUHours
                      - Commitment_1000AUHours
                      - Commitment_5000AUHours
                      - Commitment_10000AUHours
                      - Commitment_50000AUHours
                      - Commitment_100000AUHours
                      - Commitment_500000AUHours
                      default: Consumption
                      x-ms-enum:
                        name: TierType
                        modelAsString: false
                      description: The commitment tier for the next month.
                    maxJobCount:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 3
                      description: The maximum supported jobs running under the account
                        at the same time.
                    maxDegreeOfParallelism:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 30
                      description: The maximum supported degree of parallelism for
                        this account.
                    maxDegreeOfParallelismPerJob:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 32
                      description: The maximum supported degree of parallelism per
                        job for this account.
                    minPriorityPerJob:
                      type: integer
                      format: int32
                      minimum: 1
                      description: The minimum supported priority per job for this
                        account.
                    queryStoreRetention:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 180
                      default: 30
                      description: The number of days that job metadata is retained.
              description: The parameters to use for creating a Data Lake Analytics
