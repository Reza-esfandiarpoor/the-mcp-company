                              type: string
                              description: The identity that created the resource.
                            createdByType:
                              type: string
                              description: The type of identity that created the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
                                (UTC)
                        tags:
                          type: object
                          description: Resource tags.
                          additionalProperties:
                            type: string
                          x-ms-mutability:
                          - read
                          - create
                          - update
                        location:
                          type: string
                          description: The geo-location where the resource lives
                          x-ms-mutability:
                          - read
                          - create
                        properties:
                          description: The properties of a SCOM instance resource
                          type: object
                          properties:
                            productVersion:
                              description: SCOM product version to be installed on
                                instance
                              type: string
                              readOnly: true
                            vNetSubnetId:
                              description: Virtual Network subnet id on which Aquila
                                instance will be provisioned
                              type: string
                            managementEndpoints:
                              description: List of management server endpoints
                              readOnly: true
                              type: array
                              items:
                                description: The properties of management server
                                type: object
                                properties:
                                  serverName:
                                    description: Management server Name
                                    type: string
                                    readOnly: true
                                  vmResId:
                                    description: Azure VM Resource Id of the Management
                                      server.
                                    type: string
                                    readOnly: true
                                  fqdn:
                                    description: Management server Fully Qualified
                                      Domain Name.
                                    type: string
                                    readOnly: true
                                  serverRoles:
                                    description: Represent whether the Server is a
                                      Management Server and/or Web Console Server.
                                    type: string
                                    readOnly: true
                                  healthState:
                                    description: Management server health state.
                                    type: string
                                    readOnly: true
                              x-ms-identifiers: []
                            databaseInstance:
                              description: The database instance where the SCOM Operational
                                and Warehouse databases will be stored.
                              type: object
                              properties:
                                databaseInstanceId:
                                  description: Resource Id of existing database instance
                                  type: string
                                databaseFqdn:
                                  description: Fully qualified domain name of existing
                                    database instance
                                  type: string
                                  readOnly: true
                                dwDatabaseName:
                                  description: Name of warehouse database on database
                                    instance
                                  type: string
                                  readOnly: true
                                operationalDatabaseId:
                                  description: Resource Id of operational database
                                    on database instance
                                  type: string
                                  readOnly: true
                                dwDatabaseId:
                                  description: Resource Id of warehouse database on
                                    database instance
                                  type: string
                                  readOnly: true
                            domainController:
                              description: Domain controller details
                              type: object
                              properties:
                                domainName:
                                  description: Fully qualified domain name
                                  type: string
                                dnsServer:
                                  description: 'IP address of DNS server '
                                  type: string
                                ouPath:
                                  description: Organizational Unit path in which the
                                    SCOM servers will be present
                                  type: string
                                  default: ''
                            domainUserCredentials:
                              description: Domain user which will be used to join
                                VMs to domain and login to VMs.
                              type: object
                              properties:
                                keyVaultUrl:
                                  description: Key vault url to get the domain username
                                    and password
                                  type: string
                                userNameSecret:
                                  description: 'Domain user name secret '
                                  type: string
                                passwordSecret:
                                  description: 'Domain Password secret '
                                  type: string
                            gmsaDetails:
                              description: Gmsa Details for load balancer and vmss
                              type: object
                              properties:
                                loadBalancerIP:
                                  description: Frontend IP configuration for Load
                                    Balancer, which should be an available IP in customer
                                    VNet
                                  type: string
                                gmsaAccount:
                                  description: gMSA account under which context all
                                    Management Server services will run
                                  type: string
                                managementServerGroupName:
                                  description: OnPrem AD Computer Group where we will
                                    join VMs for ease of management
                                  type: string
                                dnsName:
                                  description: Frontend DNS name for Load Balancer
                                    which will be used by Agents to initiate communication
                                  type: string
                            azureHybridBenefit:
                              description: The properties to enable Azure Hybrid benefit
                                for various SCOM infrastructure license.
                              type: object
                              properties:
                                scomLicenseType:
                                  description: SCOM license type. Maximize savings
                                    by using license you already own
                                  type: string
                                  enum:
                                  - None
                                  - AzureHybridBenefit
                                  x-ms-enum:
                                    name: hybridLicenseType
                                    modelAsString: true
                                windowsServerLicenseType:
                                  description: Specifies that the image or disk that
                                    is being used was licensed on-premises. <br><br>
                                    For more information, see [Azure Hybrid Use Benefit
                                    for Windows Server](https://docs.microsoft.com/azure/virtual-machines/virtual-machines-windows-hybrid-use-benefit-licensing?toc=%2fazure%2fvirtual-machines%2fwindows%2ftoc.json)
                                  type: string
                                  enum:
                                  - None
                                  - AzureHybridBenefit
                                  x-ms-enum:
                                    name: hybridLicenseType
                                    modelAsString: true
                                sqlServerLicenseType:
                                  description: SQL Server license type. Maximize savings
                                    by using Azure Hybrid Benefit for SQL Server with
                                    license you already own
                                  type: string
                                  enum:
                                  - None
                                  - AzureHybridBenefit
                                  x-ms-enum:
                                    name: hybridLicenseType
                                    modelAsString: true
                            provisioningState:
                              description: Gets or sets the provisioning state.
                              type: string
                              readOnly: true
                            logAnalyticsProperties:
                              description: Details of Log Analytics workspace and
                                data being ingested.
                              readOnly: true
                              type: object
                              properties:
                                workspaceId:
                                  description: The resource ID of the Log Analytics
                                    workspace to be used.
                                  type: string
                                dataTypes:
                                  description: The types of data to be ingested to
                                    Log Analytics workspace.
                                  type: array
                                  items:
                                    type: string
                                    enum:
                                    - State
                                    - Performance
                                    - Event
                                    - Audit
                                    x-ms-enum:
                                      name: DataType
                                      modelAsString: true
                                importData:
                                  description: A one-time optional parameter to import
                                    data of last 7 days.
                                  default: false
                                  type: boolean
                            operationsStatus:
                              description: Gets status of current and latest SCOM
                                managed instance operations.
                              readOnly: true
                              type: array
                              items:
                                description: Gets status of current and latest SCOM
                                  managed instance operation.
                                type: object
                                properties:
                                  operationName:
                                    description: Operation Name
                                    type: string
                                    readOnly: true
                                  operationState:
                                    description: Operation status
                                    type: string
                                    readOnly: true
                                  id:
                                    description: Operation id
                                    type: string
                                    readOnly: true
                              x-ms-identifiers:
                              - id
