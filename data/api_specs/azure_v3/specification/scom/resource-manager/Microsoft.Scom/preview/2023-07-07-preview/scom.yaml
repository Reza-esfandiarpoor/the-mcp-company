                          description: The Azure Active Directory identity of the
                            SCOM instance
                          x-ms-mutability:
                          - create
                          - read
                          type: object
                          properties:
                            type:
                              description: The identity type
                              enum:
                              - None
                              - UserAssigned
                              - SystemAssigned
                              - SystemAssigned,UserAssigned
                              type: string
                              x-ms-enum:
                                name: ManagedIdentityType
                                modelAsString: true
                            principalId:
                              description: System Assigned Identity ObjectId.
                              type: string
                              readOnly: true
                            tenantId:
                              description: The Azure Active Directory tenant id.
                              type: string
                              readOnly: true
