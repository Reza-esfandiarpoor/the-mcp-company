  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Scom/managedInstances:
    get:
      operationId: Instances_ListByResourceGroup
      description: Lists all SCOM managed instances in a resource group
      x-ms-pageable:
        nextLinkName: nextLink
      tags:
      - SCOM instance
      parameters:
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group. The name is case insensitive.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Operation completed successfully.
          content:
            application/json:
              schema:
                description: A paged list of SCOM managed instances
                type: object
                properties:
                  value:
                    description: The items on the page
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: arm-id
                          description: Fully qualified resource ID for the resource.
