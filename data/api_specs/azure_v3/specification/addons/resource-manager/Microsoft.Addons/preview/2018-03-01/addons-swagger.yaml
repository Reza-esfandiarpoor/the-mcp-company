      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials that uniquely identify the Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      - name: providerName
        in: path
        required: true
        description: The support plan type. For now the only valid type is "canonical".
        x-ms-parameter-location: method
        schema:
          type: string
      - name: planTypeName
        in: path
        required: true
        description: The Canonical support plan type.
        x-ms-enum:
          name: PlanTypeName
          modelAsString: true
        x-ms-parameter-location: method
