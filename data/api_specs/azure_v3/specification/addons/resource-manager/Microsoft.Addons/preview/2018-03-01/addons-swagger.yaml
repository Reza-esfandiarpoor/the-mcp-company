openapi: 3.0.0
info:
  title: Azure Addons Resource Provider
  description: The service for managing third party addons.
  version: 2018-03-01
servers:
- url: https://management.azure.com
paths:
  /providers/Microsoft.Addons/operations:
    get:
      tags:
      - Operations
      operationId: Operations_List
      description: Lists all of the available Addons RP operations.
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      responses:
        '200':
          description: List all the operations.
          content:
            application/json:
              schema:
                type: object
                description: List of supported operations.
                properties:
                  value:
                    type: array
                    description: List of supported operations.
                    items:
                      type: object
                      description: Definition object with the name and properties
                        of an operation.
                      properties:
                        name:
                          type: string
                          description: Name of the operation.
                        display:
                          description: Display object with properties of the operation.
                          type: object
                          properties:
                            provider:
                              type: string
                              description: Resource provider of the operation.
                            resource:
                              type: string
                              description: Resource for the operation.
                            operation:
                              type: string
                              description: Short description of the operation.
                            description:
                              type: string
                              description: Description of the operation.
                    x-ms-identifiers:
                    - name
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                title: Error
                description: Error description and code explaining why an operation
                  failed.
                required:
                - message
                - code
                properties:
                  message:
                    type: string
                    description: Description of the error.
                  code:
                    type: string
                    description: Service specific error code which serves as the substatus
                      for the HTTP error code.
  /subscriptions/{subscriptionId}/providers/Microsoft.Addons/supportProviders/{providerName}/supportPlanTypes/{planTypeName}:
    get:
      tags:
      - AddonDetails
      operationId: SupportPlanTypes_Get
      description: Returns whether or not the canonical support plan of type {type}
        is enabled for the subscription.
