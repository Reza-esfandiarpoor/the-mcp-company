          type: string
          enum:
          - Essential
          - Standard
          - Advanced
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The status of the Canonical support plan.
                required:
                - properties
                properties:
                  id:
                    readOnly: true
                    type: string
                    description: The id of the ARM resource, e.g. "/subscriptions/{id}/providers/Microsoft.Addons/supportProvider/{supportProviderName}/supportPlanTypes/{planTypeName}".
                  name:
                    readOnly: true
                    type: string
                    description: The name of the Canonical support plan, i.e. "essential",
                      "standard" or "advanced".
                  type:
