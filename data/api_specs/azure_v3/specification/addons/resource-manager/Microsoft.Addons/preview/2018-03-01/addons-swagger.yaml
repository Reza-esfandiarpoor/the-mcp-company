  /subscriptions/{subscriptionId}/providers/Microsoft.Addons/supportProviders/canonical/listSupportPlanInfo:
    post:
      tags:
      - AddonStatus
      operationId: SupportPlanTypes_ListInfo
      description: Returns the canonical support plan information for all types for
        the subscription.
      parameters:
      - name: api-version
        in: query
        required: true
        description: Client API version.
        schema:
          type: string
      - name: subscriptionId
        in: path
        required: true
        description: Subscription credentials that uniquely identify the Microsoft
          Azure subscription. The subscription ID forms part of the URI for every
          service call.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                title: Canonical Support Plan Info
                description: The status of all Canonical support plans for a subscription.
                items:
                  type: object
                  description: Definition object with the properties of a canonical
                    plan
                  properties:
                    supportPlanType:
                      type: string
                      description: Support plan type.
                      enum:
                      - essential
                      - standard
                      - advanced
                      x-ms-enum:
                        name: SupportPlanType
                        modelAsString: true
                    enabled:
                      type: boolean
                      description: Flag to indicate if this support plan type is currently
                        enabled for the subscription.
                    oneTimeCharge:
                      type: string
                      description: The one time charge status for the subscription.
                      enum:
                      - 'no'
                      - onEnabled
                      - onReenabled
                      x-ms-enum:
                        name: OneTimeCharge
                        modelAsString: true
                x-ms-identifiers: []
        '404':
          description: Not Found
