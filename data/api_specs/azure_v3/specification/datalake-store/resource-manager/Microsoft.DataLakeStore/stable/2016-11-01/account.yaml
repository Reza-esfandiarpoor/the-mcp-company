                        name: EncryptionIdentityType
                        modelAsString: false
                      description: The type of encryption being used. Currently the
                        only supported type is 'SystemAssigned'.
                    principalId:
                      readOnly: true
                      type: string
                      format: uuid
                      description: The principal identifier associated with the encryption.
                    tenantId:
                      readOnly: true
                      type: string
                      format: uuid
                      description: The tenant identifier associated with the encryption.
                properties:
                  x-ms-client-flatten: true
                  description: The Data Lake Store account properties to use for creating.
                  properties:
                    defaultGroup:
                      type: string
