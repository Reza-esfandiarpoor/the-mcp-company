                      enum:
                      - Consumption
                      - Commitment_1TB
                      - Commitment_10TB
                      - Commitment_100TB
                      - Commitment_500TB
                      - Commitment_1PB
                      - Commitment_5PB
                      x-ms-enum:
                        name: TierType
                        modelAsString: false
                      description: The commitment tier to use for next month.
