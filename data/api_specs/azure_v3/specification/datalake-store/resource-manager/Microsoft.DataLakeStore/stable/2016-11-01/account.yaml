                          properties:
                            x-ms-client-flatten: true
                            description: The trusted identity provider properties
                              to use when creating a new trusted identity provider.
                            required:
                            - idProvider
                            properties:
                              idProvider:
                                type: string
                                description: The URL of this trusted identity provider.
                        description: The parameters used to create a new trusted identity
                          provider while creating a new Data Lake Store account.
                      description: The list of trusted identity providers associated
