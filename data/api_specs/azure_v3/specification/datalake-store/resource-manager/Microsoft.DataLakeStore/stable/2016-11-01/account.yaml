        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved the list of accounts.
          content:
            application/json:
              schema:
                properties:
                  value:
                    readOnly: true
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: The resource identifier.
                        name:
                          readOnly: true
                          type: string
                          description: The resource name.
                        type:
                          readOnly: true
