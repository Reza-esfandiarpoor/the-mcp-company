    AtlasClassificationDef:
      type: object
      $ref: '#/components/schemas/AtlasStructDef'
      properties:
        entityTypes:
          type: array
          description: 'Specifying a list of entityType names in the classificationDef,
            ensures that classifications can

            only be applied to those entityTypes.

            <ul>

            <li>Any subtypes of the entity types inherit the restriction</li>

            <li>Any classificationDef subtypes inherit the parents entityTypes restrictions</li>

            <li>Any classificationDef subtypes can further restrict the parents entityTypes
            restrictions by specifying a subset of the entityTypes</li>

            <li>An empty entityTypes list when there are no parent restrictions means
            there are no restrictions</li>

            <li>An empty entityTypes list when there are parent restrictions means
            that the subtype picks up the parents restrictions</li>

            <li>If a list of entityTypes are supplied, where one inherits from another,
            this will be rejected. This should encourage cleaner classificationsDefs</li>

            </ul>'
