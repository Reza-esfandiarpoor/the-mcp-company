openapi: 3.0.0
info:
  title: Purview Catalog Service REST API Document
  description: Purview Catalog Service is a fully managed cloud service whose users
    can discover the data sources they need and understand the data sources they find.
    At the same time, Data Catalog helps organizations get more value from their existing
    investments. This spec defines REST API of Purview Catalog Service.
  version: 2023-02-01-preview
security:
- azure_auth:
  - user_impersonation
paths:
  /atlas/v2/entity:
    post:
      tags:
      - Entity
      description: 'Create or update an entity in Atlas.

        Existing entity is matched using its unique guid if supplied or by its unique
        attributes eg: qualifiedName.

        Map and array of collections are not well supported. E.g., array<array<int>>,
        array<map<string, int>>.

        For each contact type, the maximum number of contacts is 20.'
      operationId: Entity_CreateOrUpdate
      parameters:
      - $ref: '#/components/parameters/businessAttributeUpdateBehavior'
      requestBody:
        $ref: '#/components/requestBodies/AtlasEntityWithExtInfo'
      responses:
        '200':
          description: Created with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/bulk:
    get:
      tags:
      - Entity
      description: List entities in bulk identified by its GUIDs.
      operationId: Entity_ListByGuids
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to list.
        required: true
        x-ms-client-name: guids
        explode: true
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - $ref: '#/components/parameters/excludeRelationshipTypes'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Entity
      description: 'Create or update entities in Atlas in bulk.

        Existing entity is matched using its unique guid if supplied or by its unique
        attributes eg: qualifiedName.

        Map and array of collections are not well supported. E.g., array<array<int>>,
        array<map<string, int>>.

        For each contact type, the maximum number of contacts is 20.'
      operationId: Entity_CreateOrUpdateEntities
      parameters:
      - $ref: '#/components/parameters/businessAttributeUpdateBehavior'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        description: An array of entities to create or update.
        required: true
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Entity
      description: Delete a list of entities in bulk identified by their GUIDs or
        unique attributes.
      operationId: Entity_DeleteByGuids
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to delete.
        required: true
        x-ms-client-name: guids
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/bulk/classification:
    post:
      tags:
      - Entity
      description: Associate a classification to multiple entities in bulk.
      operationId: Entity_AddClassification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationAssociateRequest'
        description: The request to associate a classification to multiple entities.
        required: true
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}:
    get:
      tags:
      - Entity
      operationId: Entity_GetByGuid
      description: Get complete definition of an entity given its GUID.
      parameters:
      - $ref: '#/components/parameters/guid'
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Entity
      description: 'Update entity partially - create or update entity attribute identified
        by its GUID.

        Supports only primitive attribute type and entity references.

        It does not support updating complex types like arrays, and maps.

        Null updates are not possible.'
      operationId: Entity_PartialUpdateEntityAttributeByGuid
      parameters:
      - $ref: '#/components/parameters/guid'
      - name: name
        in: query
        description: The name of the attribute.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The value of the attribute.
        required: true
      responses:
        '200':
          description: Updated with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Entity
      description: Delete an entity identified by its GUID.
      operationId: Entity_DeleteByGuid
      parameters:
      - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/classification/{classificationName}:
    get:
      tags:
      - Entity
      description: List classifications for a given entity represented by a GUID.
      operationId: Entity_GetClassification
      parameters:
      - $ref: '#/components/parameters/guid'
      - $ref: '#/components/parameters/classificationName'
      responses:
        '200':
          description: The classification for the given entity GUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasClassification'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Entity
      description: Delete a given classification from an existing entity represented
        by a GUID.
      operationId: Entity_DeleteClassification
      parameters:
      - $ref: '#/components/parameters/guid'
      - $ref: '#/components/parameters/classificationName'
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/classifications:
    get:
      tags:
      - Entity
      description: List classifications for a given entity represented by a GUID.
      operationId: Entity_GetClassifications
      parameters:
      - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: An array of classifications for the given entity GUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasClassifications'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Entity
      description: Add classifications to an existing entity represented by a GUID.
      operationId: Entity_AddClassifications
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: An array of classifications.
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classifications to be added.
        required: true
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Entity
      description: Update classifications to an existing entity represented by a guid.
      operationId: Entity_UpdateClassifications
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: An array of classifications.
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classifications to be updated.
        required: true
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/uniqueAttribute/type/{typeName}:
    get:
      tags:
      - Entity
      description: "Get complete definition of an entity given its type and unique
        attribute.\nIn addition to the typeName path parameter, attribute key-value
        pair(s) can be provided in the following format:\nattr:\\<attrName>=<attrValue>.
        \nNOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.\nThe
        REST request would look something like this:\nGET /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue."
      operationId: Entity_GetByUniqueAttributes
      parameters:
      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: AtlasEntityWithExtInfo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Entity
      description: 'Update entity partially - Allow a subset of attributes to be updated
        on

        an entity which is identified by its type and unique attribute  eg: Referenceable.qualifiedName.

        Null updates are not possible.

        In addition to the typeName path parameter, attribute key-value pair(s) can
        be provided in the following format:

        attr:<attrName>=<attrValue>.

        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.

        The REST request would look something like this:

        PUT /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: Entity_PartialUpdateEntityByUniqueAttributes
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/AtlasEntityWithExtInfo'
      responses:
        '200':
          description: Updated with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Entity
      description: 'Delete an entity identified by its type and unique attributes.

        In addition to the typeName path parameter, attribute key-value pair(s) can
        be provided in the following format:

        attr:\<attrName>=\<attrValue>.

        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.

        The REST request would look something like this:

        DELETE /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      operationId: Entity_DeleteByUniqueAttribute
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Deleted with EntityMutationResponse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/uniqueAttribute/type/{typeName}/classification/{classificationName}:
    delete:
      tags:
      - Entity
      description: Delete a given classification from an entity identified by its
        type and unique attributes.
      operationId: Entity_DeleteClassificationByUniqueAttribute
      parameters:
      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/classificationName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/uniqueAttribute/type/{typeName}/classifications:
    post:
      tags:
      - Entity
      description: Add classification to the entity identified by its type and unique
        attributes.
      operationId: Entity_AddClassificationsByUniqueAttribute
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: An array of classification.
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classification to be added.
        required: true
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Entity
      description: Update classification on an entity identified by its type and unique
        attributes.
      operationId: Entity_UpdateClassificationsByUniqueAttribute
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: An array of classification.
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classification to be updated.
        required: true
      responses:
        '204':
          description: No Content.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/bulk/setClassifications:
    post:
      tags:
      - Entity
      description: Set classifications on entities in bulk.
      operationId: Entity_SetClassifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityHeaders'
        description: Atlas entity headers.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: Response that indicates each classification mutation
                  result.
                items:
                  type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/bulk/uniqueAttribute/type/{typeName}:
    get:
      tags:
      - Entity
      description: 'Bulk API to retrieve list of entities identified by its unique
        attributes.


        In addition to the typeName path parameter, attribute key-value pair(s) can
        be provided in the following format


        typeName=\<typeName>&attr_1:\<attrName>=\<attrValue>&attr_2:\<attrName>=\<attrValue>&attr_3:\<attrName>=\<attrValue>


        NOTE: The attrName should be an unique attribute for the given entity-type


        The REST request would look something like this


        GET /v2/entity/bulk/uniqueAttribute/type/hive_db?attr_1:qualifiedName=db1@cl1&attr_2:qualifiedName=db2@cl1

        Note: at least one unique attribute must be provided.'
      operationId: Entity_GetEntitiesByUniqueAttributes
      parameters:
      - $ref: '#/components/parameters/typeName'
      - $ref: '#/components/parameters/minExtInfo'
      - $ref: '#/components/parameters/ignoreRelationships'
      - name: attr_N:qualifiedName
        in: query
        description: Qualified name of an entity. E.g. to find 2 entities you can
          set attrs_1:qualifiedName=db1@cl1&attrs_2:qualifiedName=db2@cl1. (This is
          only an example. qualifiedName can be changed to other unique attributes)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/header:
    get:
      tags:
      - Entity
      description: Get entity header given its GUID.
      operationId: Entity_GetHeader
      parameters:
      - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: AtlasEntityHeader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityHeader'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/businessmetadata:
    delete:
      tags:
      - Entity
      description: Remove business metadata from an entity.
      operationId: Entity_DeleteBusinessMetadata
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        content:
          application/json:
            schema:
              description: BusinessMetadata
              type: object
              additionalProperties:
                type: object
        description: BusinessMetadata
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Entity
      description: Add business metadata to an entity.
      operationId: Entity_AddOrUpdateBusinessMetadata
      parameters:
      - $ref: '#/components/parameters/guid'
      - in: query
        name: isOverwrite
        description: Whether to overwrite the existing business metadata on the entity
          or not, default is false.
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        description: Business Metadata
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/businessmetadata/{bmName}:
    delete:
      tags:
      - Entity
      description: Delete business metadata attributes from an entity.
      operationId: Entity_DeleteBusinessMetadataAttributes
      parameters:
      - name: bmName
        in: path
        description: BusinessMetadata name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/guid'
      requestBody:
        $ref: '#/components/requestBodies/Entity_DeleteBusinessMetadataAttributesBody'
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Entity
      description: Add or update business metadata attributes
      operationId: Entity_AddOrUpdateBusinessMetadataAttributes
      parameters:
      - name: bmName
        in: path
        description: BusinessMetadata name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/guid'
      requestBody:
        $ref: '#/components/requestBodies/Entity_DeleteBusinessMetadataAttributesBody'
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/businessmetadata/import/template:
    get:
      tags:
      - Entity
      description: Get the sample Template for uploading/creating bulk BusinessMetaData
      operationId: Entity_GetSampleBusinessMetadataTemplate
      responses:
        '200':
          description: Template File
          content:
            application/octet-stream:
              schema:
                description: Template File
                type: string
                format: binary
        default:
          description: Error response describing why the operation failed.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/businessmetadata/import:
    post:
      tags:
      - Entity
      description: Upload the file for creating Business Metadata in BULK
      operationId: Entity_ImportBusinessMetadata
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                uploadedInputStream:
                  description: InputStream of file
                  type: string
                  format: binary
      responses:
        '200':
          description: If Business Metadata creation was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/guid/{guid}/labels:
    delete:
      tags:
      - Entity
      description: delete given labels to a given entity
      operationId: Entity_DeleteLabels
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        $ref: '#/components/requestBodies/Entity_DeleteLabelsBody'
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Entity
      description: Set labels to a given entity
      operationId: Entity_SetLabels
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        content:
          application/json:
            schema:
              description: set of labels to be set to the entity
              type: array
              items:
                type: string
        description: set of labels to be set to the entity
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Entity
      description: add given labels to a given entity
      operationId: Entity_AddLabel
      parameters:
      - $ref: '#/components/parameters/guid'
      requestBody:
        $ref: '#/components/requestBodies/Entity_AddLabelBody'
      responses:
        '204':
          description: Success
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /atlas/v2/entity/uniqueAttribute/type/{typeName}/labels:
    delete:
      tags:
      - Entity
      operationId: Entity_DeleteLabelsByUniqueAttribute
      description: 'Delete given labels to a given entity identified by its type and
        unique attributes, if labels is null/empty, no labels will be removed. If
        any labels in labels set are non-existing labels, they will be ignored, only
        existing labels will be removed. In addition to the typeName path parameter,
        attribute key-value pair(s) can be provided in the following format: attr:<attrName>=<attrValue>.
        NOTE: The attrName and attrValue should be unique across entities, eg. qualifiedName.
        The REST request would look something like this: DELETE /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue. '
      parameters:
      - $ref: '#/components/parameters/typeName'
      - name: attr:qualifiedName
        in: query
        description: The qualified name of the entity. (This is only an example. qualifiedName
          can be changed to other unique attributes)
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Entity_DeleteLabelsBody'
      responses:
        '204':
          description: Success
        default:
