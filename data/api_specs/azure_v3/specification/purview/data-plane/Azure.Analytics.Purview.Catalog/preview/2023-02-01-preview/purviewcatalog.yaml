        relationshipCategory:
          $ref: '#/components/schemas/RelationshipCategory'
        relationshipLabel:
          type: string
          description: The label of the relationship.
      title: AtlasRelationshipDef
      description: "AtlasRelationshipDef is a TypeDef that defines a relationship.\n<p>\nAs
        with other typeDefs the AtlasRelationshipDef has a name. Once created the
        RelationshipDef has a guid.\nThe name and the guid are the 2 ways that the
        RelationshipDef is identified.\n<p>\nRelationshipDefs have 2 ends, each of
        which specify cardinality, an EntityDef type name and name and optionally\nwhether
        the end is a container.\n<p>\nRelationshipDefs can have AttributeDefs - though
        only primitive types are allowed. <br>\nRelationshipDefs have a relationshipCategory
        specifying the UML type of relationship required <br>\nThe way EntityDefs
        and RelationshipDefs are intended to be used is that EntityDefs will define
        AttributeDefs these AttributeDefs\nwill not specify an EntityDef type name
        as their types.\n<p>\nRelationshipDefs introduce new attributes to the entity
        instances. For example\n<p>\nEntityDef A might have attributes attr1,attr2,attr3
        <br>\nEntityDef B might have attributes attr4,attr5,attr6 <br>\nRelationshipDef
        AtoB might define 2 ends <br>\n\n<pre>\n   end1:  type A, name attr7\n   end2:
        \ type B, name attr8  </pre>\n\n<p>\nWhen an instance of EntityDef A is created,
        it will have attributes attr1,attr2,attr3,attr7 <br>\nWhen an instance of
        EntityDef B is created, it will have attributes attr4,attr5,attr6,attr8\n<p>\nIn
        this way relationshipDefs can be authored separately from entityDefs and can
        inject relationship attributes into\nthe entity instances"
    AtlasRelationshipEndDef:
      type: object
      properties:
        cardinality:
          $ref: '#/components/schemas/Cardinality'
        description:
          type: string
          description: The description of the relationship end definition.
        isContainer:
          type: boolean
          description: Determines if it is container.
        isLegacyAttribute:
          type: boolean
          description: Determines if it is a legacy attribute.
        name:
          type: string
          description: The name of the relationship end definition.
        type:
          type: string
          description: The type of the relationship end.
      title: AtlasRelationshipEndDef
      description: 'The relationshipEndDef represents an end of the relationship.
        The end of the relationship is defined by a type, an

        attribute name, cardinality and whether it  is the container end of the relationship.'
