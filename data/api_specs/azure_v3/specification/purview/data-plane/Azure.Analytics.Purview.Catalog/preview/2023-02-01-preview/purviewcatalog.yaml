          description: The GUID of the record.
        name:
          type: string
          description: The name of the record.
        qualifiedName:
          type: string
          description: The qualified name of the record.
        entityType:
          type: string
          description: The type name of the asset.
        description:
          type: string
          description: The description of the asset.
        endorsement:
          type: array
          description: The endorsement of the asset.
          items:
            type: string
        owner:
          type: string
          description: The owner of the record. This is an Atlas native attribute.
        classification:
          type: array
          description: The classifications of the record.
          items:
            type: string
        label:
          type: array
          description: The labels of the asset.
          items:
            type: string
        term:
          type: array
          description: The terms assigned to the asset.
          items:
            $ref: '#/components/schemas/TermSearchResultValue'
        contact:
          type: array
          description: The contacts of the asset.
          items:
            $ref: '#/components/schemas/ContactSearchResultValue'
        assetType:
          type: array
          description: The asset types of the asset.
          items:
            type: string
        glossaryType:
          type: string
          description: The type name of the term. Could be AtlasGlossary, AtlasGlossaryTerm
            or AtlasGlossaryCategory.
        glossary:
          type: string
          description: The glossary name of the term.
        termStatus:
          type: string
          description: The status of the term.
        termTemplate:
          type: array
          description: The term template names used by the term.
          items:
            type: string
        longDescription:
          type: string
          description: The definition of the term.
      title: SearchResultValue
      description: The value item of the search result.
    SearchHighlights:
      type: object
      description: A highlight list that consists of index fields id ,qualifiedName,
        name, description, entityType. When the keyword appears in those fields, the
        value of the field, attached with emphasis mark, is returned as an element
        of @search.highlights.
      properties:
        id:
          type: array
          items:
            type: string
        qualifiedName:
          type: array
          items:
            type: string
        name:
          type: array
          items:
            type: string
        description:
          type: array
          items:
            type: string
        entityType:
          type: array
          items:
            type: string
      title: SearchHighlights
    TermSearchResultValue:
      type: object
      properties:
        name:
          type: string
          description: The name of the term.
        glossaryName:
          type: string
          description: The name of the glossary which contains the term.
        guid:
          type: string
          description: The GUID of the term.
      title: Context
      description: The context.
    ContactSearchResultValue:
      type: object
      properties:
        id:
          type: string
          description: The GUID of the contact.
        info:
          type: string
          description: The description of the contact.
        contactType:
          type: string
          description: The type of the contact. It can be Expert or Owner for an entity.
            It can be Expert or Steward for a glossary term.
      title: contact
      description: The contact in the search and suggest result.
    AutoCompleteRequest:
      type: object
      properties:
        keywords:
          type: string
          description: The keywords applied to all fields that support autocomplete
            operation. It must be at least 1 character, and no more than 100 characters.
        limit:
          type: integer
          format: int32
          description: The number of autocomplete results we hope to return. The default
            value is 50. The value must be a number between 1 and 100.
        filter:
          type: object
          description: The filter for the autocomplete request.
      title: AutoCompleteRequest
      description: The query of autocomplete request.
    AutoCompleteResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/AutoCompleteResultValue'
      title: AutoCompleteResult
      description: The result of the autocomplete request.
    AutoCompleteResultValue:
      type: object
      properties:
        text:
          type: string
          description: The completed term or phrase.
        queryPlusText:
          type: string
          description: The completed search query text.
      title: AutoCompleteResultValue
      description: The value item of the autocomplete suggest.
    SearchRequest:
      type: object
      properties:
        keywords:
          type: string
          description: The keywords applied to all searchable fields.
        offset:
          type: integer
          format: int32
          description: The offset. The default value is 0. The maximum value is 100000.
        limit:
          type: integer
          format: int32
          description: The limit of the number of the search result. default value
            is 50; maximum value is 1000.
        orderby:
          type: array
          description: The sort order of search results, can specify multiple fields.
          items:
            $ref: '#/components/schemas/SearchOrderItem'
        filter:
          type: object
          description: The filter for the search. See examples for the usage of supported
            filters.
        facets:
          type: array
          items:
            $ref: '#/components/schemas/SearchFacetItem'
        taxonomySetting:
          type: object
          properties:
            assetTypes:
              type: array
              items:
                type: string
            facet:
              $ref: '#/components/schemas/SearchFacetItem'
      title: SearchRequest
      description: The search query of advanced search request.
    BrowseRequest:
      type: object
      properties:
        entityType:
          type: string
          description: The entity type to browse as the root level entry point.
        path:
          type: string
          description: The path to browse the next level child entities.
        limit:
          type: integer
          format: int32
          description: The number of browse items we hope to return. The maximum value
            is 10000.
        offset:
          type: integer
          format: int32
          description: The offset. The default value is 0. The maximum value is 100000.
      title: BrowseRequest
      description: The criteria of browse request.
    SuggestRequest:
      type: object
      properties:
        keywords:
          type: string
          description: The keywords applied to all fields that support suggest operation.
            It must be at least 1 character, and no more than 100 characters. In the
            index schema we defined a default suggester which lists all the supported
            fields and specifies a search mode.
        limit:
          type: integer
          format: int32
          description: The number of suggestions we hope to return. The default value
            is 5. The value must be a number between 1 and 100.
        filter:
          type: object
          description: The filter for the search.
      title: SuggestRequest
      description: The query of suggest request.
