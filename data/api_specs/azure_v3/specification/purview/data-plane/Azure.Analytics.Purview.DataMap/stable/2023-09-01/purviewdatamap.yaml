              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/uniqueAttribute/type/{typeName}:
    get:
      operationId: Entity_GetByUniqueAttributes
      description: 'Get complete definition of an entity given its type and unique
        attribute.


        In

        addition to the typeName path parameter, attribute key-value pair(s) can be

        provided in the following format:

        attr:\<attrName>=<attrValue>.


        NOTE: The

        attrName and attrValue should be unique across entities, eg.

        qualifiedName.


        The REST request would look something like this:

        GET

        /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      parameters:
      - name: typeName
        in: path
        description: The name of the type.
        required: true
        schema:
          type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      - name: attr:qualifiedName
        in: query
        description: 'The qualified name of the entity. (This is only an example.
          qualifiedName can

          be changed to other unique attributes)'
        required: false
        x-ms-client-name: attribute
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    put:
      operationId: Entity_PartialUpdateByUniqueAttributes
      description: 'Update entity partially - Allow a subset of attributes to be updated
        on an

        entity which is identified by its type and unique attribute eg:

        Referenceable.qualifiedName. Null updates are not possible.


        In addition to the

        typeName path parameter, attribute key-value pair(s) can be provided in the

        following format:


        attr:<attrName>=<attrValue>.

        NOTE: The attrName and

        attrValue should be unique across entities, eg. qualifiedName.


        The REST

        request would look something like this:

        PUT

        /v2/entity/uniqueAttribute/type/aType?attr:aTypeAttribute=someValue.'
      parameters:
      - name: typeName
        in: path
        description: The name of the type.
        required: true
        schema:
          type: string
      - name: attr:qualifiedName
        in: query
        description: 'The qualified name of the entity. (This is only an example.
          qualifiedName can

          be changed to other unique attributes)'
        required: false
        x-ms-client-name: attribute
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/AtlasEntityWithExtInfo'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_DeleteByUniqueAttribute
      description: 'Delete an entity identified by its type and unique attributes.

        In addition to

        the typeName path parameter, attribute key-value pair(s) can be provided in
        the

        following format:

        attr:\<attrName>=\<attrValue>.

        NOTE: The attrName and

        attrValue should be unique across entities, eg. qualifiedName.


        The REST

