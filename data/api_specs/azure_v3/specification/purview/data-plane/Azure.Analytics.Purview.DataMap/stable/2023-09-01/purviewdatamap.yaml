          - name: Both
            value: BOTH
            description: both
        schema:
          type: string
          enum:
          - INPUT
          - OUTPUT
          - BOTH
      - name: attr:qualifiedName
        in: query
        description: 'The qualified name of the entity. (This is only an example.
