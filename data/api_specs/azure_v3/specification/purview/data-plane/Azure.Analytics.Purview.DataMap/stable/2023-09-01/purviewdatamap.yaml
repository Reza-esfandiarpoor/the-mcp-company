        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    post:
      operationId: Entity_SetLabels
      description: Set labels to a given entity.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
        description: set of labels to be set to the entity
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
