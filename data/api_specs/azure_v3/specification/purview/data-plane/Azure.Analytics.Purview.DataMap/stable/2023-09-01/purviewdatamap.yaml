openapi: 3.0.0
info:
  title: Azure Analytics Purview Data Map
  version: 2023-09-01
  description: 'Purview Data Map Service is a fully managed cloud service whose users
    can

    discover the data sources they need and understand the data sources they find.

    At the same time, Data Map helps organizations get more value from their

    existing investments. This spec defines REST API of Purview Data Map Service.'
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- OAuth2Auth:
  - https://purview.azure.net/.default
tags: []
paths:
  /atlas/v2/entity:
    post:
      operationId: Entity_CreateOrUpdate
      description: 'Create or update an entity.

        Existing entity is matched using its unique guid if

        supplied or by its unique attributes eg: qualifiedName.

        Map and array of

        collections are not well supported. E.g., array<array<int>>, array<map<string,

        int>>.

        For each contact type, the maximum number of contacts is 20.'
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: businessAttributeUpdateBehavior
        in: query
        description: 'Used to define the update behavior for business attributes when
          updating

          entities.'
        required: false
        x-ms-enum:
          name: BusinessAttributeUpdateBehavior
          modelAsString: true
          values:
          - name: Ignore
            value: ignore
            description: Ignore the business attribute payload for update.
          - name: Replace
            value: replace
            description: Replace all the business attributes using the payload.
          - name: Merge
            value: merge
            description: Merge the business attributes. Business attributes will not
              be updated if not provided.
        schema:
          type: string
          enum:
          - ignore
          - replace
          - merge
      - name: collectionId
        in: query
        description: 'The collection where entities will be moved to. Only specify
          a value if you

          need to move an entity to another collection.'
        required: false
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/AtlasEntityWithExtInfo'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/bulk:
    get:
      operationId: Entity_ListByGuids
      description: List entities in bulk identified by its GUIDs.
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: guid
        in: query
        description: An array of GUIDs of entities to list.
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    post:
      operationId: Entity_BulkCreateOrUpdate
      description: 'Create or update entities in bulk.

        Existing entity is matched using its unique

        guid if supplied or by its unique attributes eg: qualifiedName.

        Map and array

        of collections are not well supported. E.g., array<array<int>>,

        array<map<string, int>>.

        For each contact type, the maximum number of contacts

        is 20.'
      parameters:
      - $ref: '#/components/parameters/AtlasApiVersionParameter'
      - name: collectionId
        in: query
        description: 'The collection where entities will be moved to. Only specify
          a value if you

          need to move an entity to another collection.'
        required: false
        schema:
          type: string
      - name: businessAttributeUpdateBehavior
        in: query
        description: 'Used to define the update behavior for business attributes when
          updating

          entities.'
        required: false
        x-ms-enum:
          name: BusinessAttributeUpdateBehavior
          modelAsString: true
          values:
          - name: Ignore
            value: ignore
            description: Ignore the business attribute payload for update.
          - name: Replace
            value: replace
            description: Replace all the business attributes using the payload.
          - name: Merge
            value: merge
            description: Merge the business attributes. Business attributes will not
              be updated if not provided.
        schema:
          type: string
          enum:
          - ignore
          - replace
          - merge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_BulkDelete
      description: 'Delete a list of entities in bulk identified by their GUIDs or
        unique

        attributes.'
      parameters:
      - name: guid
        in: query
        description: An array of GUIDs of entities to delete.
        required: true
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/bulk/classification:
    post:
      operationId: Entity_AddClassification
      description: Associate a classification to multiple entities in bulk.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationAssociateOptions'
        description: Body parameter.
        required: true
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/bulk/setClassifications:
    post:
      operationId: Entity_BulkSetClassifications
      description: Set classifications on entities in bulk.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtlasEntityHeaders'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/bulk/uniqueAttribute/type/{typeName}:
    get:
      operationId: Entity_ListByUniqueAttributes
      description: 'Bulk API to retrieve list of entities identified by its unique
        attributes.

        In

        addition to the typeName path parameter, attribute key-value pair(s) can be

        provided in the following

        format


        typeName=\<typeName>&attr_1:\<attrName>=\<attrValue>&attr_2:\<attrName>=\<attrValue>&attr_3:\<attrName>=\<attrValue>


        NOTE:

        The attrName should be an unique attribute for the given entity-type.

        The REST

        request would look something like this


        GET

        /v2/entity/bulk/uniqueAttribute/type/hive_db?attr_1:qualifiedName=db1@cl1&attr_2:qualifiedName=db2@cl1


        Note:

        at least one unique attribute must be provided.'
      parameters:
      - name: typeName
        in: path
        description: The name of the type.
        required: true
        schema:
          type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      - name: attr_N:qualifiedName
        in: query
        description: 'Qualified name of an entity. E.g. to find 2 entities you can
          set

          attrs_1:qualifiedName=db1@cl1&attrs_2:qualifiedName=db2@cl1. (This is only
          an

          example. qualifiedName can be changed to other unique attributes)'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntitiesWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/businessmetadata/import:
    post:
      operationId: Entity_ImportBusinessMetadata
      description: Upload the file for creating Business Metadata in BULK
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: InputStream of file
                  type: string
                  format: binary
              required:
              - file
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/businessmetadata/import/template:
    get:
      operationId: Entity_GetSampleBusinessMetadataTemplate
      description: Get the sample Template for uploading/creating bulk BusinessMetaData
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        default:
          description: An unexpected error response.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}:
    get:
      operationId: Entity_Get
      description: Get complete definition of an entity given its GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: minExtInfo
        in: query
        description: Whether to return minimal information for referred entities.
        required: false
        schema:
          type: boolean
      - name: ignoreRelationships
        in: query
        description: Whether to ignore relationship attributes.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityWithExtInfo'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    put:
      operationId: Entity_PartialUpdateAttributeByGuid
      description: 'Update entity partially - create or update entity attribute identified
        by its

        GUID.

        Supports only primitive attribute type and entity references.

        It does not support updating complex types like arrays, and maps.

        Null updates are not possible.'
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: The name of the attribute.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        description: The value of the attribute.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_Delete
      description: Delete an entity identified by its GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityMutationResult'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/businessmetadata:
    post:
      operationId: Entity_AddOrUpdateBusinessMetadata
      description: Add business metadata to an entity.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: isOverwrite
        in: query
        description: 'Whether to overwrite the existing business metadata on the entity
          or not,

          default is false.'
        required: false
        x-ms-client-name: overwrite
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                additionalProperties: {}
                type: object
        description: BusinessMetadata payload
        required: true
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_RemoveBusinessMetadata
      description: Remove business metadata from an entity.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                additionalProperties: {}
                type: object
        description: Business metadata payload
        required: true
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/businessmetadata/{businessMetadataName}:
    post:
      operationId: Entity_AddOrUpdateBusinessMetadataAttributes
      description: Add or update business metadata attributes.
      parameters:
      - name: businessMetadataName
        in: path
        description: BusinessMetadata name
        required: true
        schema:
          type: string
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Entity_AddOrUpdateBusinessMetadataAttributesBody'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_RemoveBusinessMetadataAttributes
      description: Delete business metadata attributes from an entity.
      parameters:
      - name: businessMetadataName
        in: path
        description: BusinessMetadata name
        required: true
        schema:
          type: string
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/Entity_AddOrUpdateBusinessMetadataAttributesBody'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/classification/{classificationName}:
    get:
      operationId: Entity_GetClassification
      description: Get classification for a given entity represented by a GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: classificationName
        in: path
        description: The name of the classification.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasClassification'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    delete:
      operationId: Entity_RemoveClassification
      description: Delete a given classification from an existing entity represented
        by a GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      - name: classificationName
        in: path
        description: The name of the classification.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/classifications:
    get:
      operationId: Entity_GetClassifications
      description: List classifications for a given entity represented by a GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasClassifications'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    put:
      operationId: Entity_UpdateClassifications
      description: Update classifications to an existing entity represented by a guid.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classifications to be updated.
        required: true
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
    post:
      operationId: Entity_AddClassifications
      description: Add classifications to an existing entity represented by a GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AtlasClassification'
        description: An array of classifications to be added.
        required: true
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/header:
    get:
      operationId: Entity_GetHeader
      description: Get entity header given its GUID.
      parameters:
      - name: guid
        in: path
        description: The globally unique identifier of the entity.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasEntityHeader'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtlasErrorResponse'
  /atlas/v2/entity/guid/{guid}/labels:
