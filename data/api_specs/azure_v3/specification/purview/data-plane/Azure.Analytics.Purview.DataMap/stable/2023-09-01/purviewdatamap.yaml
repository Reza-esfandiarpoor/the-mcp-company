    AtlasRelationshipDef:
      type: object
      description: "AtlasRelationshipDef is a TypeDef that defines a relationship.\nAs
        with other typeDefs the AtlasRelationshipDef has a name. Once created the\nRelationshipDef
        has a guid.\nThe name and the guid are the 2 ways that the\nRelationshipDef
        is identified.\nRelationshipDefs have 2 ends, each of which\nspecify cardinality,
        an EntityDef type name and name and optionally\nwhether the\nend is a container.\nRelationshipDefs
        can have AttributeDefs - though only\nprimitive types are allowed. \nRelationshipDefs
        have a relationshipCategory\nspecifying the UML type of relationship required
        \nThe way EntityDefs and\nRelationshipDefs are intended to be used is that
        EntityDefs will define\nAttributeDefs these AttributeDefs\nwill not specify
        an EntityDef type name as\ntheir types.\nRelationshipDefs introduce new attributes
        to the entity\ninstances. For example\nEntityDef A might have attributes attr1,attr2,attr3\n\nEntityDef
        B might have attributes attr4,attr5,attr6 \nRelationshipDef\nAtoB might define
        2 ends \n\nend1:  type A, name attr7\nend2:  type B, name attr8 \n\nWhen an
        instance of EntityDef A is created, it\nwill have attributes attr1,attr2,attr3,attr7
        \nWhen an instance of EntityDef\nB is created, it will have attributes attr4,attr5,attr6,attr8\n\nIn
        this way\nrelationshipDefs can be authored separately from entityDefs and
        can inject\nrelationship attributes into\nthe entity instances"
      properties:
        category:
          $ref: '#/components/schemas/TypeCategory'
        createTime:
          type: integer
          format: int64
          description: The created time of the record.
        createdBy:
          type: string
          description: The user who created the record.
        dateFormatter:
          $ref: '#/components/schemas/DateFormat'
        description:
          type: string
          description: The description of the type definition.
        guid:
          type: string
          description: The GUID of the type definition.
        name:
          type: string
          description: The name of the type definition.
        options:
          type: object
          description: The options for the type definition.
          additionalProperties:
            type: string
        serviceType:
          type: string
          description: The service type.
        typeVersion:
          type: string
          description: The version of the type.
        updateTime:
          type: integer
          format: int64
          description: The update time of the record.
        updatedBy:
          type: string
          description: The user who updated the record.
        version:
          type: integer
          format: int64
          description: The version of the record.
        lastModifiedTS:
          type: string
          description: ETag for concurrency control.
        attributeDefs:
          type: array
          description: An array of attribute definitions.
          items:
            $ref: '#/components/schemas/AtlasAttributeDef'
        endDef1:
          $ref: '#/components/schemas/AtlasRelationshipEndDef'
        endDef2:
          $ref: '#/components/schemas/AtlasRelationshipEndDef'
        relationshipCategory:
          $ref: '#/components/schemas/RelationshipCategory'
        relationshipLabel:
          type: string
          description: The label of the relationship.
