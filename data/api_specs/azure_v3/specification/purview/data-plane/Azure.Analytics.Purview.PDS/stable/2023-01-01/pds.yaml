                    minLength: 1
                    type: string
                  value:
                    description: List of policy elements.
                    type: array
                    items:
                      description: Represents the policy element event model.
                      required:
                      - eventType
                      - id
                      - kind
                      - updatedAt
                      - version
                      type: object
                      properties:
                        id:
                          description: Id of the policy element.
                          minLength: 1
                          type: string
                        scopes:
                          description: List of scopes included in this policy.
                          type: array
                          items:
                            type: string
                        version:
                          format: int64
                          description: Current version of policy element. This is
                            auto incremented with each change. Starts with 1.
                          type: integer
                        elementJson:
                          description: Policy element serialized json payload.
                          type: string
                        kind:
                          description: Represents the kind of policy element.
                          enum:
                          - Policy
                          - PolicySet
                          - AttributeRule
                          type: string
                          x-ms-enum:
                            name: PolicyElementKind
                            modelAsString: true
                        updatedAt:
                          format: date-time
                          description: Time at which this policy element was last
                            updated.
                          type: string
                        eventType:
                          description: 'Type of event. Format: <RP-Name>/<Resource-Type>/<Action>.
                            For Example: Microsoft.Purview/PolicyElements/Delete.'
                          minLength: 1
                          type: string
        '304':
          description: Not Modified
        default:
          description: Error
          content:
            application/json:
              schema:
                description: Default error response model.
                required:
                - error
                type: object
                properties:
                  error:
                    description: Default error model.
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        description: Error code.
                        minLength: 1
                        type: string
                      message:
                        description: Error message.
                        minLength: 1
                        type: string
                      target:
                        description: Error description.
                        type: string
                      details:
                        description: Error details.
                        type: array
                        items:
                          description: Default error model.
                          required:
                          - code
                          - message
                          type: object
                          properties:
                            code:
                              description: Error code.
                              minLength: 1
                              type: string
                            message:
                              description: Error message.
                              minLength: 1
                              type: string
                            target:
                              description: Error description.
                              type: string
                            details:
                              description: Error details.
                              type: array
                              items:
                                description: Default error model.
                                required:
                                - code
                                - message
                                type: object
                                properties:
                                  code:
                                    description: Error code.
                                    minLength: 1
                                    type: string
                                  message:
                                    description: Error message.
                                    minLength: 1
                                    type: string
                                  target:
                                    description: Error description.
                                    type: string
