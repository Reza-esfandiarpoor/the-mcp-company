openapi: 3.0.0
info:
  title: Purview Distribution Service REST API Document
  description: Purview distribution service enables various Azure RPs to fetch the
    policies and attributes for data governance.
  version: 2023-01-01
servers:
- url: /pds
- url: '{endpoint}/pds'
  variables:
    endpoint:
      description: 'The endpoint of your Purview account. Example: https://{accountName}.purview.azure.com.'
      format: url
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- azure_auth:
  - user_impersonation
paths:
  /datasource-preferences:
    get:
      tags:
      - DatasourcePreferences
      description: Get Datasource Preferences for given scope.
      operationId: DatasourcePreferences_List
      parameters:
      - in: query
        name: scope
        description: Id for any resource managed by Purview.
        required: true
        schema:
          type: string
      - in: query
        name: api-version
        description: The api-version of the service.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: Response model for datasource preference API.
                type: object
                properties:
                  value:
                    description: Consent details.
                    type: array
                    items:
                      description: Consent details.
                      type: object
                      properties:
                        kind:
                          description: Consent kind.
                          type: string
                        status:
                          description: Consent status.
                          type: string
                        excludedScopes:
                          description: List of scopes opted out of this consent.
                          type: array
                          items:
                            type: string
                  accountInfo:
                    description: Details of the purview account governing the requested
                      resource.
                    type: object
                    properties:
                      id:
                        description: Id of the Purview account.
                        type: string
                      name:
                        description: Name of the Purview account.
                        type: string
                      location:
                        description: Location (Region) of the Purview account.
                        type: string
                      tenantId:
                        description: Tenant Id of the Purview account.
                        type: string
                      gatewayEndpoint:
                        description: Endpoint of the Purview account. This will be
                          used by the RPs to call Purview APIs.
                        type: string
                  frequency:
                    description: This is an ISO8601 time span value.
                    type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                description: Default error response model.
                required:
                - error
                type: object
                properties:
                  error:
                    description: Default error model.
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        description: Error code.
                        minLength: 1
                        type: string
                      message:
                        description: Error message.
                        minLength: 1
                        type: string
                      target:
                        description: Error description.
                        type: string
                      details:
                        description: Error details.
                        type: array
                        items:
                          description: Default error model.
                          required:
                          - code
                          - message
                          type: object
                          properties:
                            code:
                              description: Error code.
                              minLength: 1
                              type: string
                            message:
                              description: Error message.
                              minLength: 1
                              type: string
                            target:
                              description: Error description.
                              type: string
                            details:
                              description: Error details.
                              type: array
                              items:
                                description: Default error model.
                                required:
                                - code
                                - message
                                type: object
                                properties:
                                  code:
                                    description: Error code.
                                    minLength: 1
                                    type: string
                                  message:
                                    description: Error message.
                                    minLength: 1
                                    type: string
                                  target:
                                    description: Error description.
                                    type: string
  /policy-elements:
    get:
      tags:
      - PolicyElements
      description: Get policies for given scope.
      operationId: PolicyElements_List
      parameters:
      - in: query
        name: scope
        description: Id for any resource managed by Purview.
        required: true
        schema:
          type: string
      - in: query
        name: filter
        description: Filter supporting full OData syntax.
        schema:
          type: string
      - in: query
        name: api-version
        description: The api-version of the service.
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                description: Response model for policy bulk fetch API.
                type: object
                properties:
                  syncToken:
                    description: This sync token represents the latest checkpoint
                      for policies. Client need to pass this value while fetching
                      subsequent delta changes using policy-events API.
                    type: string
                  nextLink:
                    description: Link to fetch next set of policy elements.
                    type: string
                  value:
                    description: List of policy elements.
                    type: array
                    items:
                      description: Represents a policy, policy set or attribute rule.
                      required:
                      - id
                      - kind
                      - updatedAt
                      - version
                      type: object
                      properties:
                        id:
                          description: Id of the policy element.
                          minLength: 1
                          type: string
                        scopes:
                          description: List of scopes included in this policy.
                          type: array
                          items:
                            type: string
                        version:
                          format: int64
                          description: Current version of policy element. This is
                            auto incremented with each change. Starts with 1.
                          type: integer
                        elementJson:
                          description: Policy element serialized json payload.
                          type: string
                        kind:
                          description: Represents the kind of policy element.
                          enum:
                          - Policy
                          - PolicySet
                          - AttributeRule
                          type: string
                          x-ms-enum:
                            name: PolicyElementKind
                            modelAsString: true
                        updatedAt:
                          format: date-time
                          description: Time at which this policy element was last
                            updated.
                          type: string
        default:
          description: Error
          content:
            application/json:
              schema:
                description: Default error response model.
                required:
                - error
                type: object
                properties:
                  error:
                    description: Default error model.
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        description: Error code.
                        minLength: 1
                        type: string
                      message:
                        description: Error message.
                        minLength: 1
                        type: string
                      target:
                        description: Error description.
                        type: string
                      details:
                        description: Error details.
                        type: array
                        items:
                          description: Default error model.
                          required:
                          - code
                          - message
                          type: object
                          properties:
                            code:
                              description: Error code.
                              minLength: 1
                              type: string
                            message:
                              description: Error message.
                              minLength: 1
                              type: string
                            target:
                              description: Error description.
                              type: string
                            details:
                              description: Error details.
                              type: array
                              items:
                                description: Default error model.
                                required:
                                - code
                                - message
                                type: object
                                properties:
                                  code:
                                    description: Error code.
                                    minLength: 1
                                    type: string
                                  message:
                                    description: Error message.
                                    minLength: 1
                                    type: string
                                  target:
                                    description: Error description.
                                    type: string
      x-ms-pageable:
        nextLinkName: nextLink
  /policy-events:
