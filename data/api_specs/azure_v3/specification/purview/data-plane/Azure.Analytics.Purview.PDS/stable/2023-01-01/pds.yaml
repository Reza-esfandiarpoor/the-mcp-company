          type: string
        tenantId:
          description: Tenant Id of the Purview account.
          type: string
        gatewayEndpoint:
          description: Endpoint of the Purview account. This will be used by the RPs
            to call Purview APIs.
          type: string
    ConsentServiceModelSimplified:
      description: Consent details.
      type: object
      properties:
