                isEnabled:
                  type: boolean
                  description: Whether the workflow enabled or not.
                description:
                  type: string
                  description: Description of a workflow.
                actionDag:
                  type: object
                  description: The action DAG(Directed Acyclic Graph), it defines
                    actual flow.
              required:
              - triggers
              - name
              - isEnabled
              - description
        description: Check workflow payload.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      description: The detail of validation rule violated in a workflow.
                      properties:
                        severity:
                          type: string
                          description: The severity of the validation rule.
                          enum:
                          - error
                          - warning
                          x-ms-enum:
                            name: ValidationRuleSeverity
                            modelAsString: true
                        location:
                          type: object
                          description: The location where the violation happens.
                          properties:
                            type:
                              type: string
                              description: The validation violation location type.
                              enum:
                              - workflow
                              - action
                              - actionParameter
                              x-ms-enum:
                                name: ValidationRuleViolationLocation
                                modelAsString: true
                            actionName:
                              type: string
                              description: The name of the action where the violation
                                happens.
                            parameterKey:
                              type: string
                              description: The key of the action parameter where the
                                violation happens.
                          required:
                          - type
                        message:
                          type: string
                          description: The detail about how the validation rule is
                            violated.
                      required:
                      - severity
                      - location
                      - message
                    description: The value of violated validation rule list.
                required:
                - value
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Default error response model
