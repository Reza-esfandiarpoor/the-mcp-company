openapi: 3.0.0
info:
  title: Purview Workflow Service
  version: 2023-10-01-preview
  description: Workflows are automated, repeatable business processes which allow
    organizations to track changes, enforce policy compliance, and ensure quality
    data across their data landscape.Workflow service is a micro service within Microsoft
    Purview to validate and orchestrate CUD (create, update, delete) operations on
    their data entities. This spec defines REST API of Purview Workflow Service, which
    could used for creating Purview workflow client.
servers:
- url: https://purview.azure.com/workflow
- url: '{endpoint}/workflow'
  variables:
    endpoint:
      description: 'The account endpoint of your Purview account. Example: https://{accountName}.purview.azure.com/'
      x-ms-parameter-location: client
      format: url
      x-ms-skip-url-encoding: true
      default: none
security:
- azure_auth:
  - https://purview.azure.net/.default
paths:
  /workflows:
    get:
      tags:
      - Workflows
      description: List all workflows.
      operationId: Workflows_List
      x-ms-pageable:
        nextLinkName: nextLink
      parameters:
      - name: api-version
        description: Version of Purview APIs
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The workflow list.
                properties:
                  value:
                    type: array
                    items:
                      description: The workflow metadata, action DAGs are not included.
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of workflow.
                        triggers:
                          type: array
                          description: 'It describes under what condition a workflow
                            will run.  '
                          items:
                            type: object
                            description: Describes under what condition a workflow
                              will run.
                            properties:
                              type:
                                type: string
                                enum:
                                - when_term_creation_is_requested
                                - when_term_deletion_is_requested
                                - when_term_update_is_requested
                                - when_terms_import_is_requested
                                - when_data_access_grant_is_requested
                                - when_asset_update_is_requested
                                x-ms-enum:
                                  name: TriggerType
                                  modelAsString: true
                              underGlossaryHierarchy:
                                type: string
                                description: Glossary term hierarchy path.
                              underCollection:
                                type: string
                                description: The collection name.
                              underGlossary:
                                type: string
                                description: The glossary guid.
                            required:
                            - type
                        createdTime:
                          type: string
                          format: date-time
                          description: The created time of workflow.
                        createdBy:
                          type: string
                          description: The person who created the workflow.
                        lastUpdateTime:
                          type: string
                          format: date-time
                          description: The last update time.
                        updatedBy:
                          type: string
                          description: The person who updated the workflow.
                        name:
                          type: string
                          description: The name of a workflow.
                        isEnabled:
                          type: boolean
                          description: Whether the workflow is enabled or not.
                        description:
                          type: string
                          description: Description of a workflow.
                      required:
                      - id
                      - triggers
                      - name
                      - isEnabled
                      - description
                    description: The value of workflow list.
                  nextLink:
                    type: string
                    description: The URL to get the next set of results.
                required:
                - value
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Default error response model
                type: object
                properties:
                  error:
                    description: Default error model
                    type: object
                    properties:
                      code:
                        description: Gets or sets the code.
                        type: string
                      details:
                        description: Gets or sets the details.
                        uniqueItems: false
                        type: array
                        items:
                          description: Default error model
                          type: object
                          properties:
                            code:
                              description: Gets or sets the code.
                              type: string
                            details:
                              description: Gets or sets the details.
                              uniqueItems: false
                              type: array
                              items:
                                description: Default error model
                                type: object
                                properties:
                                  code:
                                    description: Gets or sets the code.
                                    type: string
                                required:
                                - code
                                - message
                              x-ms-identifiers:
                              - code
                            message:
                              description: Gets or sets the messages.
                              type: string
                            target:
                              description: Gets or sets the target.
                              type: string
                          required:
                          - code
                          - message
                        x-ms-identifiers:
                        - code
                      message:
                        description: Gets or sets the messages.
                        type: string
                      target:
                        description: Gets or sets the target.
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
