        in: path
        required: true
        description: The workflow id.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: api-version
        description: Version of Purview APIs
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Create or update workflow payload.
              properties:
