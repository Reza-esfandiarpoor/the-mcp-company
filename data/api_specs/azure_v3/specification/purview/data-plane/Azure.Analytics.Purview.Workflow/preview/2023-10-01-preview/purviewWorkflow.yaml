  /userrequests:
    post:
      tags:
      - UserRequests
      description: Submit a user request for requestor, a user  request describes
        user ask to do operation(s) on Purview. If any workflow's trigger matches
        with an operation in request, a run of the workflow is created.
      operationId: UserRequests_Submit
      parameters:
      - name: api-version
        description: Version of Purview APIs
        in: query
        required: true
        x-ms-parameter-location: client
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  description: The list of operations user want to submit, each operation
                    matches one Purview API call and will do the operation directly.
                  items:
                    type: object
                    description: The operation user wants to perform.
                    properties:
                      type:
                        type: string
                        description: The operation type.
                        enum:
                        - CreateTerm
                        - UpdateTerm
                        - DeleteTerm
                        - ImportTerms
                        - UpdateAsset
                        - GrantDataAccess
                        x-ms-enum:
                          name: OperationType
                          modelAsString: true
                      payload:
                        type: object
                        description: The payload of each operation which user want
                          to submit.
                    required:
                    - type
                    - payload
                comment:
                  type: string
                  description: The comment when submit a user request.
              required:
              - operations
        description: The payload of submitting a user request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Describes user ask to do operation(s) on Purview.
                type: object
                properties:
                  requestId:
                    type: string
                    format: uuid
                    description: The user request id.
                  requestor:
                    type: string
                    format: uuid
                    description: The person who submitted the user request.
                  operations:
                    type: array
                    description: The list of operations user want to submit, each
                      operation matches one Purview API call and will do the operation
                      directly.
                    items:
                      type: object
                      description: The operation user wants to perform.
                      properties:
                        type:
                          type: string
                          description: The operation type.
                          enum:
                          - CreateTerm
                          - UpdateTerm
                          - DeleteTerm
                          - ImportTerms
                          - UpdateAsset
                          - GrantDataAccess
                          x-ms-enum:
                            name: OperationType
                            modelAsString: true
                        payload:
                          type: object
                          description: The payload of each operation which user want
                            to submit.
                        workflowRunIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                            description: The workflow run id.
                      required:
                      - type
                      - payload
                  comment:
                    type: string
                    description: The comment when submit a user request.
                  status:
                    type: string
                    description: The status.
                    enum:
                    - NotStarted
                    - InProgress
                    - Failed
                    - Completed
                    - Canceling
                    - CancellationFailed
                    - Canceled
                    x-ms-enum:
                      name: UserRequestStatus
                      modelAsString: true
                required:
                - requestId
                - requestor
                - operations
                - status
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Default error response model
                type: object
                properties:
                  error:
                    description: Default error model
                    type: object
                    properties:
                      code:
                        description: Gets or sets the code.
                        type: string
                      details:
                        description: Gets or sets the details.
                        uniqueItems: false
                        type: array
                        items:
                          description: Default error model
                          type: object
                          properties:
                            code:
                              description: Gets or sets the code.
                              type: string
                            details:
                              description: Gets or sets the details.
                              uniqueItems: false
                              type: array
                              items:
                                description: Default error model
                                type: object
                                properties:
                                  code:
                                    description: Gets or sets the code.
                                    type: string
                                required:
                                - code
                                - message
                              x-ms-identifiers:
                              - code
                            message:
                              description: Gets or sets the messages.
                              type: string
                            target:
                              description: Gets or sets the target.
                              type: string
                          required:
                          - code
                          - message
                        x-ms-identifiers:
                        - code
                      message:
                        description: Gets or sets the messages.
                        type: string
                      target:
                        description: Gets or sets the target.
                        type: string
                    required:
                    - code
                    - message
                required:
                - error
