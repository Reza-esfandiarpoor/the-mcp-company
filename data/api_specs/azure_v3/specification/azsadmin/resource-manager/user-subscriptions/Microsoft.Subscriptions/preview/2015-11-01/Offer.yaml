openapi: 3.0.0
info:
  version: 2015-11-01
  title: SubscriptionClient
  description: The User Subscription Management Client.
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /delegatedProviders/{delegatedProviderId}/offers:
    get:
      description: Get the list of offers for the specified delegated provider.
      tags:
      - DelegatedProviderOffers
      operationId: DelegatedProviderOffers_List
      parameters:
      - name: delegatedProviderId
        in: path
        required: true
        description: Id of the delegated provider.
        schema:
          type: string
      - name: api-version
        in: query
        description: Client Api Version.
        required: true
        schema:
          type: string
          default: 2015-11-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: List of public offers.
                type: object
                properties:
                  value:
                    description: List of public offers.
                    type: array
                    items:
                      description: Represents an offering of services against which
                        a subscription can be created.
                      type: object
                      properties:
                        displayName:
                          description: Display name of offer.
                          type: string
                        description:
                          description: Description of offer.
                          type: string
                        name:
                          description: The name of the offer.
                          type: string
                        id:
                          description: The offer ID
                          type: string
                  nextLink:
                    type: string
                    description: URI to next page.
      x-ms-pageable:
        nextLinkName: nextLink
  /delegatedProviders/{delegatedProviderId}/offers/{offerName}:
    get:
      description: Get the specified offer for the delegated provider.
      tags:
      - DelegatedProviderOffers
      operationId: DelegatedProviderOffers_Get
      parameters:
      - name: delegatedProviderId
        in: path
        required: true
        description: Id of the delegated provider.
        schema:
          type: string
      - name: offerName
        in: path
        required: true
        description: Name of the offer.
        schema:
          type: string
      - name: api-version
        in: query
        description: Client Api Version.
        required: true
        schema:
          type: string
          default: 2015-11-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Represents an offering of services against which a subscription
                  can be created.
                type: object
                properties:
                  displayName:
                    description: Display name of offer.
                    type: string
                  description:
                    description: Description of offer.
                    type: string
                  name:
                    description: The name of the offer.
                    type: string
                  id:
                    description: The offer ID
                    type: string
  /offers:
    get:
      description: Get the list of public offers for the root provider.
      tags:
      - Offers
      operationId: Offers_List
      parameters:
      - name: api-version
        in: query
        description: Client Api Version.
        required: true
        schema:
          type: string
          default: 2015-11-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: List of public offers.
                type: object
                properties:
                  value:
                    description: List of public offers.
                    type: array
                    items:
                      description: Represents an offering of services against which
                        a subscription can be created.
                      type: object
                      properties:
                        displayName:
                          description: Display name of offer.
                          type: string
                        description:
                          description: Description of offer.
                          type: string
                        name:
                          description: The name of the offer.
                          type: string
                        id:
                          description: The offer ID
                          type: string
                  nextLink:
                    type: string
                    description: URI to next page.
      x-ms-pageable:
        nextLinkName: nextLink
components:
  parameters:
    ApiVersionParameter:
      name: api-version
      in: query
      description: Client Api Version.
      required: true
      schema:
        type: string
        default: 2015-11-01
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Offer:
      description: Represents an offering of services against which a subscription
        can be created.
      type: object
      properties:
        displayName:
          description: Display name of offer.
          type: string
        description:
          description: Description of offer.
          type: string
        name:
          description: The name of the offer.
          type: string
        id:
          description: The offer ID
          type: string
    OfferList:
      description: List of public offers.
      type: object
      properties:
        value:
          description: List of public offers.
          type: array
          items:
            description: Represents an offering of services against which a subscription
              can be created.
            type: object
            properties:
              displayName:
                description: Display name of offer.
                type: string
              description:
                description: Description of offer.
                type: string
              name:
                description: The name of the offer.
                type: string
              id:
                description: The offer ID
                type: string
        nextLink:
          type: string
          description: URI to next page.
