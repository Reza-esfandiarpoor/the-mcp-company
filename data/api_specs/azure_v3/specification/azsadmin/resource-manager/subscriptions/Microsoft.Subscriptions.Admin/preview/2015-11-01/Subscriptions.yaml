                                                  type: object
                                                  properties:
                                                    resource:
                                                      description: The resource identifier.
                                                        This should be the application
                                                        identifier of the resource
                                                        application.
                                                      type: string
                                                    client:
                                                      description: The client identifier.
                                                        This should be the application
                                                        identifier of the client application.
                                                      type: string
                                                    roleId:
                                                      description: The role identifier.
                                                        This should be the ID of the
                                                        AppRole exposed by the resource
                                                        application.
                                                      type: string
                                                status:
                                                  description: The health status for
                                                    the permission.
                                                  type: string
                                                  enum:
                                                  - Unknown
                                                  - Unhealthy
                                                  - Healthy
                                                  x-ms-enum:
                                                    name: HealthStatus
                                                    modelAsString: true
                                                    values:
                                                    - description: The health status
                                                        is unknown.
                                                      name: Unknown
                                                      value: Unknown
                                                    - description: The health status
                                                        is unhealthy, indicating something
                                                        is wrong or a sub-health status
                                                        is Unhealthy or Unknown.
                                                      name: Unhealthy
