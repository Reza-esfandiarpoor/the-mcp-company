        required: true
        schema:
          type: string
          default: 2015-11-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: The identity health check report action definition.
                type: object
                properties:
                  reportStartTimeUtc:
                    description: Start time of the report.
                    type: string
                    format: date-time
                  reportEndTimeUtc:
                    description: End time of the report.
                    type: string
                    format: date-time
                  status:
                    description: The roll-up health status for the directory.
                    type: string
                    enum:
                    - Unknown
                    - Unhealthy
                    - Healthy
                    x-ms-enum:
                      name: HealthStatus
                      modelAsString: true
                      values:
                      - description: The health status is unknown.
                        name: Unknown
                        value: Unknown
                      - description: The health status is unhealthy, indicating something
                          is wrong or a sub-health status is Unhealthy or Unknown.
                        name: Unhealthy
                        value: Unhealthy
                      - description: The health status is healthy, indicating nothing
                          is wrong.
                        name: Healthy
                        value: Healthy
                  directoryTenants:
                    description: List of directory tenant health reports.
                    properties:
                      value:
                        type: array
                        description: Directory tenant health report.
                        items:
                          description: A report of the health status of a directory
                            tenant and identity applications within.
                          type: object
                          properties:
                            tenantId:
                              description: The tenant unique identifier.
                              type: string
                            tenantName:
                              description: The directory tenant resource name.
                              type: string
                            status:
                              description: The roll-up health status for the directory.
                              type: string
                              enum:
                              - Unknown
                              - Unhealthy
                              - Healthy
                              x-ms-enum:
                                name: HealthStatus
                                modelAsString: true
                                values:
                                - description: The health status is unknown.
                                  name: Unknown
                                  value: Unknown
                                - description: The health status is unhealthy, indicating
                                    something is wrong or a sub-health status is Unhealthy
                                    or Unknown.
                                  name: Unhealthy
                                  value: Unhealthy
                                - description: The health status is healthy, indicating
                                    nothing is wrong.
                                  name: Healthy
                                  value: Healthy
                            applications:
                              description: List of the application health reports.
                              properties:
                                value:
                                  type: array
                                  description: A report of the health status of an
                                    identity applications.
                                  items:
                                    description: A report of the health status of
                                      an identity applications.
                                    type: object
                                    properties:
                                      appId:
                                        description: The application identifier.
                                        type: string
                                      servicePrincipalObjectId:
                                        description: The service principal identifier.
                                        type: string
                                      status:
                                        description: The roll-up health status for
                                          the application
                                        type: string
                                        enum:
                                        - Unknown
                                        - Unhealthy
                                        - Healthy
                                        x-ms-enum:
                                          name: HealthStatus
                                          modelAsString: true
                                          values:
                                          - description: The health status is unknown.
                                            name: Unknown
                                            value: Unknown
                                          - description: The health status is unhealthy,
                                              indicating something is wrong or a sub-health
                                              status is Unhealthy or Unknown.
                                            name: Unhealthy
                                            value: Unhealthy
                                          - description: The health status is healthy,
                                              indicating nothing is wrong.
                                            name: Healthy
                                            value: Healthy
                                      appRoleAssignments:
                                        description: List of AppRoleAssignment health
                                          reports for the application.
                                        properties:
                                          value:
                                            type: array
                                            description: A report of the health status
                                              of an AppRoleAssignment.
                                            items:
