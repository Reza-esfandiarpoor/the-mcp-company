                                                    scope:
                                                      description: The scope identifier.
                                                        This should be the scope value
                                                        of the OAUTH2PERMISSION exposed
                                                        by the resource application.
                                                      type: string
                                                status:
                                                  description: The health status for
                                                    the permission.
                                                  type: string
                                                  enum:
                                                  - Unknown
                                                  - Unhealthy
                                                  - Healthy
                                                  x-ms-enum:
                                                    name: HealthStatus
                                                    modelAsString: true
                                                    values:
                                                    - description: The health status
                                                        is unknown.
                                                      name: Unknown
                                                      value: Unknown
                                                    - description: The health status
                                                        is unhealthy, indicating something
