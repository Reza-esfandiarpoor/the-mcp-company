                                                      name: Healthy
                                                      value: Healthy
                                            x-ms-identifiers:
                                            - oAuth2PermissionGrant/resource
                                          nextLink:
                                            description: URI to the next page.
                                            type: string
                                      servicePrincipalTags:
                                        description: List of ServicePrincipalTag health
                                          reports for the application.
                                        properties:
                                          value:
                                            type: array
                                            description: A report of the health status
                                              of a tag on an identity application
                                              service principal.
                                            items:
                                              description: A report of the health
                                                status of a tag on an identity application
                                                service principal.
                                              type: object
                                              properties:
                                                servicePrincipalTag:
                                                  description: The tag.
                                                  type: string
                                                status:
                                                  description: The health status for
                                                    the tag.
                                                  type: string
                                                  enum:
                                                  - Unknown
                                                  - Unhealthy
                                                  - Healthy
                                                  x-ms-enum:
