  /subscriptions/{subscriptionId}/providers/Microsoft.Subscriptions.Admin/moveSubscriptions:
    post:
      description: Move subscriptions between delegated provider offers.
      tags:
      - Subscriptions
      operationId: Subscriptions_MoveSubscriptions
      parameters:
      - name: subscriptionId
        in: path
        description: Subscription credentials which uniquely identify Microsoft Azure
          subscription.The subscription ID forms part of the URI for every service
          call.
        required: true
        schema:
          type: string
      - name: api-version
        in: query
        description: Client Api Version.
        required: true
        schema:
          type: string
          default: 2015-11-01
      requestBody:
        content:
          application/json:
            schema:
              description: The move subscriptions action definition
              type: object
              required:
              - resources
              properties:
                targetDelegatedProviderOffer:
                  description: The delegated provider offer identifier (from the Admin
                    context) that the subscriptions to be moved to.
                  type: string
                resources:
                  description: A collection of subscriptions to move to the target
                    delegated provider offer.
                  type: array
                  items:
                    type: string
        description: Move subscriptions parameter.
        required: true
        x-ms-parameter-location: method
      responses:
        '202':
          description: Accepted -- Move subscriptions request accepted; operation
            will complete asynchronously.
        '204':
          description: No Content -- The subscriptions were successfully moved to
            the target delegated provider offer.
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                type: object
                description: Error response.
                properties:
