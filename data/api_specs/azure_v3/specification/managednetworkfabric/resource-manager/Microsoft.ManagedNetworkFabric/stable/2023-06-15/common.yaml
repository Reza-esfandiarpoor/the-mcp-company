openapi: 3.0.0
info:
  title: Azure Network Fabric Management Service API
  description: Self service experience for Azure Network Fabric API.
  version: 2023-06-15
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ProvisioningState:
      type: string
      readOnly: true
      description: The current provisioning state.
      enum:
      - Accepted
      - Succeeded
      - Updating
      - Deleting
      - Failed
      - Canceled
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    ConfigurationState:
      type: string
      description: Configuration state for the resource.
      readOnly: true
      enum:
      - Succeeded
      - Failed
      - Rejected
      - Accepted
      - Provisioned
      - ErrorProvisioning
      - Deprovisioning
      - Deprovisioned
      - ErrorDeprovisioning
      - DeferredControl
      - Provisioning
      - PendingCommit
      x-ms-enum:
        modelAsString: true
        name: ConfigurationState
    AdministrativeState:
      type: string
      description: State defined to represent administrative actions or post actions
        on a particular resource.
      enum:
      - Enabled
      - Disabled
      - MAT
      - RMA
      readOnly: true
      x-ms-enum:
        modelAsString: true
        name: AdministrativeState
    AnnotationResource:
      type: object
      description: Switch configuration entries require a description to discern between
        configuration groups.
      properties:
        annotation:
          type: string
          description: Switch configuration description.
    ExtendedLocation:
      type: object
      description: The extended location.
      properties:
        type:
          type: string
          description: The extended location type.
        name:
          type: string
          description: The extended location name.
    UpdateAdministrativeState:
      type: object
      properties:
        resourceIds:
          type: array
          description: Network Fabrics or Network Rack resource Id.
          items:
            description: Network Fabrics or Network Rack resource Id.
            type: string
        state:
          type: string
          description: Administrative state.
          enum:
          - Enable
          - Disable
          x-ms-enum:
            name: EnableDisableState
            modelAsString: true
      description: Update administrative state on list of resources.
    UpdateVersion:
      type: object
      description: Update version properties.
      properties:
        version:
          type: string
          description: Specify the version.
    EnableDisableOnResources:
      type: object
      description: Update administrative state on list of resources.
      properties:
        resourceIds:
          type: array
          description: Network Fabrics or Network Rack resource Id.
          items:
            description: Network Fabrics or Network Rack resource Id.
            type: string
