          description: List of vlan group names that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: Vlan group name.
    IpMatchCondition:
      type: object
      description: Defines the condition that can be filtered using the selected IPs.
      properties:
        type:
          type: string
          description: IP Address type that needs to be matched.
          minLength: 1
          enum:
          - SourceIP
          - DestinationIP
          x-ms-enum:
            modelAsString: true
            name: SourceDestinationType
        prefixType:
          type: string
          description: IP Prefix Type that needs to be matched.
          minLength: 1
          enum:
          - Prefix
          - LongestPrefix
          x-ms-enum:
            modelAsString: true
            name: PrefixType
        ipPrefixValues:
          type: array
          description: The list of IP Prefixes that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: The valid IP Prefix.
        ipGroupNames:
          type: array
          description: The List of IP Group Names that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: IP Group Name.
    CommonDynamicMatchConfiguration:
      type: object
      description: Dynamic match configuration object.
      properties:
        ipGroups:
          type: array
          description: List of IP Groups.
          minItems: 1
          items:
            description: IP Group
            type: object
            properties:
              name:
                type: string
                minLength: 1
                description: IP Group name.
              ipAddressType:
                description: IP Address type.
                type: string
                minLength: 1
                enum:
                - IPv4
                - IPv6
                x-ms-enum:
                  modelAsString: true
                  name: IPAddressType
              ipPrefixes:
                type: array
                description: List of IP Prefixes.
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  description: IP Prefix.
        vlanGroups:
          type: array
          description: List of vlan groups.
          minItems: 1
          items:
            description: Vlan group
            type: object
            properties:
              name:
                type: string
                minLength: 1
                description: Vlan group name.
              vlans:
                type: array
                description: List of vlans.
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  description: Vlan. It may be a single vlan or the range of the vlans.
        portGroups:
          type: array
          description: List of the port groups.
          minItems: 1
          items:
            description: Port Group
            type: object
            properties:
              name:
                type: string
                minLength: 1
                description: The name of the port group.
              ports:
                type: array
                description: List of the ports that need to be matched.
                minItems: 1
                items:
                  type: string
                  minLength: 1
                  description: Port Number. Inputs can be single port or the range
                    of ports.
    IpGroupProperties:
      type: object
      description: IP Group properties.
      properties:
        name:
          type: string
          minLength: 1
          description: IP Group name.
        ipAddressType:
          description: IP Address type.
          type: string
          minLength: 1
          enum:
          - IPv4
          - IPv6
          x-ms-enum:
            modelAsString: true
            name: IPAddressType
        ipPrefixes:
          type: array
