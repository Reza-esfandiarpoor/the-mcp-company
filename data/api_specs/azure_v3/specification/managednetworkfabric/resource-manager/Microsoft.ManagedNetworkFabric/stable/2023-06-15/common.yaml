            - type: Microsoft.ManagedNetworkFabric/routePolicies
    CommonMatchConditions:
      type: object
      description: Defines the common match conditions of the ACL and Network Tap
        Rule.
      properties:
        protocolTypes:
          type: array
          minItems: 1
          description: List of the protocols that need to be matched.
          items:
            type: string
            minLength: 1
            description: Specify the protocol that to needs to matched. Inputs can
              be <protocol-name> or <protocol-number> or <range of protocol numbers>.
        vlanMatchCondition:
          description: Vlan match condition that needs to be matched.
          type: object
          properties:
            vlans:
              type: array
              description: List of vlans that need to be matched.
              minItems: 1
              items:
                type: string
                minLength: 1
                description: Specify the Vlan. Inputs can be single vlan or the range
                  of vlans.
            innerVlans:
              type: array
              description: List of inner vlans that need to be matched.
              minItems: 1
              items:
                type: string
                minLength: 1
                description: Specify the inner vlan. Inputs can be single vlan or
                  the range of vlans.
            vlanGroupNames:
              type: array
              description: List of vlan group names that need to be matched.
              minItems: 1
              items:
                type: string
                minLength: 1
                description: Vlan group name.
        ipCondition:
          description: IP condition that needs to be matched.
          type: object
          properties:
            type:
              type: string
              description: IP Address type that needs to be matched.
              minLength: 1
              enum:
              - SourceIP
              - DestinationIP
              x-ms-enum:
                modelAsString: true
                name: SourceDestinationType
            prefixType:
              type: string
              description: IP Prefix Type that needs to be matched.
              minLength: 1
              enum:
              - Prefix
              - LongestPrefix
              x-ms-enum:
                modelAsString: true
                name: PrefixType
            ipPrefixValues:
              type: array
              description: The list of IP Prefixes that need to be matched.
              minItems: 1
              items:
                type: string
                minLength: 1
                description: The valid IP Prefix.
            ipGroupNames:
              type: array
              description: The List of IP Group Names that need to be matched.
              minItems: 1
              items:
                type: string
                minLength: 1
                description: IP Group Name.
    PortCondition:
      type: object
      description: Port condition that needs to be matched.
      properties:
        portType:
          type: string
          description: Port type that needs to be matched.
          minLength: 1
          enum:
          - SourcePort
          - DestinationPort
          x-ms-enum:
            modelAsString: true
            name: PortType
        layer4Protocol:
          type: string
          description: Layer4 protocol type that needs to be matched.
          minLength: 1
          enum:
          - TCP
          - UDP
          x-ms-enum:
            modelAsString: true
            name: Layer4Protocol
        ports:
          type: array
          description: List of the Ports that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: Port number that needs to be matched. Inputs can be <port-number>
              or <range-of-ports>
        portGroupNames:
          type: array
          description: List of the port Group Names that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: Port Group Name.
      required:
      - layer4Protocol
    VlanMatchCondition:
      type: object
      description: The vlan match conditions that need to be matched.
      properties:
        vlans:
          type: array
          description: List of vlans that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: Specify the Vlan. Inputs can be single vlan or the range
              of vlans.
        innerVlans:
          type: array
          description: List of inner vlans that need to be matched.
          minItems: 1
          items:
            type: string
            minLength: 1
            description: Specify the inner vlan. Inputs can be single vlan or the
