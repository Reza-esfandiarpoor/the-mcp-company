          maxLength: 90
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - description: Name of the Network Fabric Controller.
        in: path
        name: networkFabricControllerName
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
