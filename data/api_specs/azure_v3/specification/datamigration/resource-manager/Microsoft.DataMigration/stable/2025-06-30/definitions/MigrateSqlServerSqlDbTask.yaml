openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MigrateSqlServerSqlDbTaskInput:
      type: object
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        selectedDatabases:
          type: array
          description: Databases to migrate
          items:
            type: object
            description: Database specific information for SQL to Azure SQL DB migration
              task inputs
            properties:
              name:
                type: string
                description: Name of the database
              targetDatabaseName:
                type: string
                description: 'Name of target database. Note: Target database will
                  be truncated before starting migration.'
              makeSourceDbReadOnly:
                type: boolean
                description: Whether to set database read only before migration
              tableMap:
                type: object
                description: Mapping of source to target tables
                additionalProperties:
                  type: string
              schemaSetting:
                type: object
                description: Settings selected for DB schema migration.
              id:
                type: string
                description: id of the database
        validationOptions:
          description: "Options for enabling various post migration validations. Available\
            \ options, \n 1.) Data Integrity Check: Performs a checksum based comparison\
            \ on source and target tables after the migration to ensure the correctness\
            \ of the data. \n 2.) Schema Validation: Performs a thorough schema comparison\
            \ between the source and target tables and provides a list of differences\
            \ between the source and target database, 3.) Query Analysis: Executes\
            \ a set of queries picked up automatically either from the Query Plan\
            \ Cache or Query Store and execute them and compares the execution time\
            \ between the source and target database."
          type: object
          properties:
            enableSchemaValidation:
              type: boolean
              description: Allows to compare the schema information between source
                and target.
            enableDataIntegrityValidation:
              type: boolean
              description: Allows to perform a checksum based data integrity validation
                between source and target for the selected database / tables .
            enableQueryAnalysisValidation:
              type: boolean
              description: Allows to perform a quick and intelligent query analysis
                by retrieving queries from the source database and executes them in
                the target. The result will have execution statistics for executions
                in source and target databases for the extracted queries.
        startedOn:
          type: string
          description: Date and time relative to UTC when the migration was started
            on
        encryptedKeyForSecureFields:
          type: string
          description: encrypted key for secure fields
      required:
      - sourceConnectionInfo
      - targetConnectionInfo
      - selectedDatabases
      description: Base class for migration task input
    MigrateSqlServerSqlDbTaskOutput:
      type: object
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigrateSqlServerSqlDbTaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        durationInSeconds:
          type: integer
          format: int64
          description: Duration of task execution in seconds.
          readOnly: true
        status:
          description: Current status of migration
          readOnly: true
          type: string
          enum:
          - Default
          - Connecting
          - SourceAndTargetSelected
          - SelectLogins
          - Configured
          - Running
          - Error
          - Stopped
          - Completed
          - CompletedWithWarnings
          x-ms-enum:
            name: MigrationStatus
            modelAsString: true
        statusMessage:
          type: string
          description: Migration status message
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        databases:
          type: string
          description: Selected databases as a map from database name to database
            id
          additionalProperties:
            type: string
          readOnly: true
        databaseSummary:
          type: string
          description: Summary of database results in the migration
          additionalProperties:
            type: object
            properties:
              name:
                type: string
                description: Name of the item
                readOnly: true
              startedOn:
                type: string
                format: date-time
                description: Migration start time
                readOnly: true
              endedOn:
                type: string
                format: date-time
                description: Migration end time
                readOnly: true
              state:
                description: Current state of migration
                readOnly: true
                type: string
                enum:
                - None
                - InProgress
                - Failed
                - Warning
                - Completed
                - Skipped
                - Stopped
                x-ms-enum:
                  name: MigrationState
                  modelAsString: true
              statusMessage:
                type: string
                description: Status message
                readOnly: true
              itemsCount:
                type: integer
                format: int64
                description: Number of items
                readOnly: true
              itemsCompletedCount:
                type: integer
                format: int64
                description: Number of successfully completed items
                readOnly: true
              errorPrefix:
                type: string
                description: Wildcard string prefix to use for querying all errors
                  of the item
                readOnly: true
              resultPrefix:
                type: string
                description: Wildcard string prefix to use for querying all sub-tem
                  results of the item
                readOnly: true
              sizeMB:
                type: number
                format: double
                description: Size of the database in megabytes
                readOnly: true
            description: Basic summary of a data item migration
          readOnly: true
        migrationValidationResult:
          type: object
          description: Migration Validation Results
          properties:
            id:
              type: string
              description: Migration validation result identifier
              readOnly: true
            migrationId:
              type: string
              description: Migration Identifier
              readOnly: true
            summaryResults:
              type: object
              description: Validation summary results for each database
              additionalProperties:
                type: object
                description: Migration Validation Database level summary result
                properties:
                  id:
                    type: string
                    description: Result identifier
                    readOnly: true
                  migrationId:
                    type: string
                    description: Migration Identifier
                    readOnly: true
                  sourceDatabaseName:
                    type: string
                    description: Name of the source database
                    readOnly: true
                  targetDatabaseName:
                    type: string
                    description: Name of the target database
                    readOnly: true
                  startedOn:
                    type: string
                    format: date-time
                    description: Validation start time
                    readOnly: true
                  endedOn:
                    type: string
                    format: date-time
                    description: Validation end time
                    readOnly: true
                  status:
                    description: Current status of validation at the database level
                    readOnly: true
                    type: string
                    enum:
                    - Default
                    - NotStarted
                    - Initialized
                    - InProgress
                    - Completed
                    - CompletedWithIssues
                    - Stopped
                    - Failed
                    x-ms-enum:
                      name: ValidationStatus
                      modelAsString: true
            status:
              description: Current status of validation at the migration level. Status
                from the database validation result status will be aggregated here.
              readOnly: true
              type: string
              enum:
              - Default
              - NotStarted
              - Initialized
              - InProgress
              - Completed
              - CompletedWithIssues
              - Stopped
              - Failed
              x-ms-enum:
                name: ValidationStatus
                modelAsString: true
        migrationReportResult:
          type: object
          description: Migration Report Result, provides unique url for downloading
            your migration report.
          properties:
            id:
              type: string
              description: Migration validation result identifier
            reportUrl:
              type: string
              description: The url of the report.
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings.
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigrateSqlServerSqlDbTaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        databaseName:
          type: string
          description: Name of the item
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        stage:
          description: Migration stage that this database is in
          readOnly: true
          type: string
          enum:
          - None
          - Initialize
          - Backup
          - FileCopy
          - Restore
          - Completed
          x-ms-enum:
            name: DatabaseMigrationStage
            modelAsString: true
        statusMessage:
          type: string
          description: Status message
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        numberOfObjects:
          type: integer
          format: int64
          description: Number of objects
          readOnly: true
        numberOfObjectsCompleted:
          type: integer
          format: int64
          description: Number of successfully completed objects
          readOnly: true
        errorCount:
          type: integer
          format: int64
          description: Number of database/object errors.
          readOnly: true
        errorPrefix:
          type: string
          description: Wildcard string prefix to use for querying all errors of the
            item
          readOnly: true
        resultPrefix:
          type: string
          description: Wildcard string prefix to use for querying all sub-tem results
            of the item
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings.
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
        objectSummary:
          type: string
          description: Summary of object results in the migration
          additionalProperties:
            type: object
            description: Basic summary of a data item migration
            properties:
              name:
                type: string
                description: Name of the item
                readOnly: true
              startedOn:
                type: string
                format: date-time
                description: Migration start time
                readOnly: true
              endedOn:
                type: string
                format: date-time
                description: Migration end time
                readOnly: true
              state:
                description: Current state of migration
                readOnly: true
                type: string
                enum:
                - None
                - InProgress
                - Failed
                - Warning
                - Completed
                - Skipped
                - Stopped
                x-ms-enum:
                  name: MigrationState
                  modelAsString: true
              statusMessage:
                type: string
                description: Status message
                readOnly: true
              itemsCount:
                type: integer
                format: int64
                description: Number of items
                readOnly: true
              itemsCompletedCount:
                type: integer
                format: int64
                description: Number of successfully completed items
                readOnly: true
              errorPrefix:
                type: string
                description: Wildcard string prefix to use for querying all errors
                  of the item
                readOnly: true
              resultPrefix:
                type: string
                description: Wildcard string prefix to use for querying all sub-tem
                  results of the item
                readOnly: true
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    MigrateSqlServerSqlDbTaskOutputTableLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        objectName:
          type: string
          description: Name of the item
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        statusMessage:
          type: string
          description: Status message
          readOnly: true
        itemsCount:
          type: integer
          format: int64
          description: Number of items
          readOnly: true
        itemsCompletedCount:
          type: integer
          format: int64
          description: Number of successfully completed items
          readOnly: true
        errorPrefix:
          type: string
          description: Wildcard string prefix to use for querying all errors of the
            item
          readOnly: true
        resultPrefix:
          type: string
          description: Wildcard string prefix to use for querying all sub-tem results
            of the item
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: TableLevelOutput
    MigrateSqlServerSqlDbTaskOutputError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        error:
          description: Migration error
          readOnly: true
          type: object
          properties:
            message:
              type: string
              description: Error message
            actionableMessage:
              type: string
              description: Actionable steps for this exception
            filePath:
              type: string
              description: The path to the file where exception occurred
            lineNumber:
              type: string
              description: The line number where exception occurred
            hResult:
              type: integer
              description: Coded numerical value that is assigned to a specific exception
            stackTrace:
              type: string
              description: Stack trace
      required:
      - resultType
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: ErrorOutput
    DatabaseSummaryResult:
      type: object
      properties:
        name:
          type: string
          description: Name of the item
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        statusMessage:
          type: string
          description: Status message
          readOnly: true
        itemsCount:
          type: integer
          format: int64
          description: Number of items
          readOnly: true
        itemsCompletedCount:
          type: integer
          format: int64
          description: Number of successfully completed items
          readOnly: true
        errorPrefix:
          type: string
          description: Wildcard string prefix to use for querying all errors of the
            item
          readOnly: true
        resultPrefix:
          type: string
          description: Wildcard string prefix to use for querying all sub-tem results
            of the item
          readOnly: true
        sizeMB:
          type: number
          format: double
          description: Size of the database in megabytes
          readOnly: true
      description: Basic summary of a data item migration
    MigrateSqlServerSqlDbTaskOutputValidationResult:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        migrationId:
          type: string
          description: Migration Identifier
          readOnly: true
        summaryResults:
          type: object
          description: Validation summary results for each database
          additionalProperties:
            type: object
            description: Migration Validation Database level summary result
            properties:
              id:
                type: string
                description: Result identifier
                readOnly: true
              migrationId:
                type: string
                description: Migration Identifier
                readOnly: true
              sourceDatabaseName:
                type: string
                description: Name of the source database
                readOnly: true
              targetDatabaseName:
                type: string
                description: Name of the target database
                readOnly: true
              startedOn:
                type: string
                format: date-time
                description: Validation start time
                readOnly: true
              endedOn:
                type: string
                format: date-time
                description: Validation end time
                readOnly: true
              status:
                description: Current status of validation at the database level
                readOnly: true
                type: string
                enum:
                - Default
                - NotStarted
                - Initialized
                - InProgress
                - Completed
                - CompletedWithIssues
                - Stopped
                - Failed
                x-ms-enum:
                  name: ValidationStatus
                  modelAsString: true
        status:
          description: Current status of validation at the migration level. Status
            from the database validation result status will be aggregated here.
          readOnly: true
          type: string
          enum:
          - Default
          - NotStarted
          - Initialized
          - InProgress
          - Completed
          - CompletedWithIssues
          - Stopped
          - Failed
          x-ms-enum:
            name: ValidationStatus
            modelAsString: true
      required:
      - resultType
      description: Output for the task that migrates on-prem SQL Server databases
        to Azure SQL Database
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationValidationOutput
    MigrateSqlServerSqlDbTaskOutputDatabaseLevelValidationResult:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        migrationId:
          type: string
          description: Migration Identifier
          readOnly: true
        sourceDatabaseName:
          type: string
          description: Name of the source database
          readOnly: true
        targetDatabaseName:
          type: string
          description: Name of the target database
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Validation start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Validation end time
          readOnly: true
        dataIntegrityValidationResult:
          description: Provides data integrity validation result between the source
            and target tables that are migrated.
          readOnly: true
          type: object
          properties:
            failedObjects:
              type: object
              description: List of failed table names of source and target pair
              additionalProperties:
                type: string
            validationErrors:
              type: array
              description: List of errors that happened while performing data integrity
                validation
              properties:
                text:
                  type: string
                  description: Error Text
                severity:
                  type: string
                  description: Severity of the error
                  enum:
                  - Message
                  - Warning
                  - Error
                  x-ms-enum:
                    name: Severity
                    modelAsString: true
              items: {}
        schemaValidationResult:
          description: Provides schema comparison result between source and target
            database
          readOnly: true
          type: object
          properties:
            schemaDifferences:
              type: array
              description: List of schema differences between the source and target
                databases
              properties:
                objectName:
                  type: string
                  description: Name of the object that has the difference
                objectType:
                  type: object
                  description: Type of the object that has the difference. e.g (Table/View/StoredProcedure)
                  enum:
                  - StoredProcedures
                  - Table
                  - User
                  - View
                  - Function
                  x-ms-enum:
                    name: ObjectType
                    modelAsString: true
                updateAction:
                  type: string
                  description: Update action type with respect to target
                  enum:
                  - DeletedOnTarget
                  - ChangedOnTarget
                  - AddedOnTarget
                  x-ms-enum:
                    name: UpdateActionType
                    modelAsString: true
              items: {}
            validationErrors:
              type: array
              description: List of errors that happened while performing schema compare
                validation
              properties:
                text:
                  type: string
                  description: Error Text
                severity:
                  type: string
                  description: Severity of the error
                  enum:
                  - Message
                  - Warning
                  - Error
                  x-ms-enum:
                    name: Severity
                    modelAsString: true
              items: {}
            sourceDatabaseObjectCount:
              type: object
              description: Count of source database objects
              additionalProperties:
                type: integer
                format: int64
            targetDatabaseObjectCount:
              type: object
              description: Count of target database objects
              additionalProperties:
                type: integer
                format: int64
        queryAnalysisValidationResult:
          description: Results of some of the query execution result between source
            and target database
          readOnly: true
          type: object
          properties:
            queryResults:
              type: array
              description: List of queries executed and it's execution results in
                source and target
              properties:
                queryText:
                  type: string
                  description: Query text retrieved from the source server
                statementsInBatch:
                  type: integer
                  format: int64
                  description: Total no. of statements in the batch
                sourceResult:
                  type: object
                  description: Query analysis result from the source
                  properties:
                    executionCount:
                      type: integer
                      format: int64
                      description: No. of query executions
                    cpuTimeMs:
