openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToTargetAzureDbForPostgreSqlSyncTaskInput:
      type: object
      description: Input for the task that validates connection to Azure Database
        for PostgreSQL and target server requirements
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
      required:
      - sourceConnectionInfo
      - targetConnectionInfo
    ConnectToTargetAzureDbForPostgreSqlSyncTaskOutput:
      type: object
      description: Output for the task that validates connection to Azure Database
        for PostgreSQL and target server requirements
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        targetServerVersion:
          type: string
          description: Version of the target server
          readOnly: true
        databases:
          type: array
          description: List of databases on target server
          items:
            type: string
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        validationErrors:
          description: Validation errors associated with the task
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    PostgreSqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        serverName:
          type: string
          description: Name of the server
        dataSource:
          type: string
          description: 'Data source '
        serverVersion:
          type: string
          description: server version
        databaseName:
          type: string
          description: Name of the database
        port:
          type: integer
          description: Port for Server
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        additionalSettings:
          type: string
          description: Additional connection settings
        serverBrandVersion:
          type: string
          description: server brand version
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
      required:
      - type
      - serverName
      - port
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: PostgreSqlConnectionInfo
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
