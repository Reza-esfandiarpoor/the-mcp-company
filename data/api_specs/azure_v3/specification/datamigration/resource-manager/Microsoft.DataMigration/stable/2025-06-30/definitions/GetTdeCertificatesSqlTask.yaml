openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    GetTdeCertificatesSqlTaskInput:
      type: object
      description: Input for the task that gets TDE certificates in Base64 encoded
        format.
      properties:
        connectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        backupFileShare:
          description: Backup file share information for file share to be used for
            temporarily storing files.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        selectedCertificates:
          description: List containing certificate names and corresponding password
            to use for encrypting the exported certificate.
          type: array
          items:
            type: object
            description: Info for certificate to be exported for TDE enabled databases.
            properties:
              certificateName:
                type: string
                description: Name of certificate to be exported.
              password:
                type: string
                description: Password to use for encrypting the exported certificate.
            required:
            - certificateName
            - password
      required:
      - connectionInfo
      - backupFileShare
      - selectedCertificates
    GetTdeCertificatesSqlTaskOutput:
      type: object
      description: Output of the task that gets TDE certificates in Base64 encoded
        format.
      properties:
        base64EncodedCertificates:
          type: string
          description: Mapping from certificate name to base 64 encoded format.
          additionalProperties:
            type: array
            items:
              type: string
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    SelectedCertificateInput:
      type: object
      description: Info for certificate to be exported for TDE enabled databases.
      properties:
        certificateName:
          type: string
          description: Name of certificate to be exported.
        password:
          type: string
          description: Password to use for encrypting the exported certificate.
      required:
      - certificateName
      - password
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    SqlServerSourcePlatform:
      type: string
      description: An enumeration of source platform types
      enum:
      - SqlOnPrem
      x-ms-enum:
        name: SqlSourcePlatform
        modelAsString: true
    SqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
        serverName:
          type: string
          description: name of the server
        port:
          type: integer
          description: Port for Server
        serverVersion:
          type: string
          description: server version
        serverBrandVersion:
          type: string
          description: server brand version
        resourceId:
          type: string
          description: Represents the ID of an HTTP resource represented by an Azure
            resource provider.
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        additionalSettings:
          type: string
          description: Additional connection settings
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        platform:
          description: Server platform type for connection
          type: string
          enum:
          - SqlOnPrem
          x-ms-enum:
            name: SqlSourcePlatform
            modelAsString: true
      required:
      - type
      - dataSource
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: SqlConnectionInfo
    FileShare:
      type: object
      description: File share information with Path, Username, and Password.
      properties:
        userName:
          type: string
          description: User name credential to connect to the share location
        password:
          type: string
          description: Password credential used to connect to the share location.
        path:
          type: string
          description: The folder path for this share.
      required:
      - path
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
