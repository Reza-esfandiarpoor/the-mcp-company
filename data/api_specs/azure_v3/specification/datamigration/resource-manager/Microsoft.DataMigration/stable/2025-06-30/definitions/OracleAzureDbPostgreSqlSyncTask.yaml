openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToSourceOracleSyncTaskInput:
      type: object
      description: Input for the task that validates Oracle database connection
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: EZConnect or TNSName connection string.
            serverName:
              type: string
              description: name of the server
            serverVersion:
              type: string
              description: server version
            port:
              type: integer
              description: port for server
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: OracleConnectionInfo
      required:
      - sourceConnectionInfo
    ConnectToSourceOracleSyncTaskOutput:
      type: object
      description: Output for the task that validates Oracle database connection
      properties:
        sourceServerVersion:
          type: string
          description: Version of the source server
          readOnly: true
        databases:
          type: array
          description: List of schemas on source server
          items:
            type: string
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        validationErrors:
          description: Validation errors associated with the task
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ConnectToTargetOracleAzureDbForPostgreSqlSyncTaskInput:
      type: object
      description: Input for the task that validates connection to Azure Database
        for PostgreSQL and target server requirements for Oracle source.
      properties:
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
      required:
      - targetConnectionInfo
    ConnectToTargetOracleAzureDbForPostgreSqlSyncTaskOutput:
      type: object
      description: Output for the task that validates connection to Azure Database
        for PostgreSQL and target server requirements for Oracle source.
      properties:
        targetServerVersion:
          type: string
          description: Version of the target server
          readOnly: true
        databases:
          type: array
          description: List of databases on target server
          items:
            type: string
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        validationErrors:
          description: Validation errors associated with the task
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
        databaseSchemaMap:
          type: array
          description: Mapping of schemas per database
          items:
            type: object
            properties:
              database:
                type: string
              schemas:
                type: array
                items:
                  type: string
    GetUserTablesOracleTaskInput:
      type: object
      description: Input for the task that gets the list of tables contained within
        a provided list of Oracle schemas.
      properties:
        connectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: EZConnect or TNSName connection string.
            serverName:
              type: string
              description: name of the server
            serverVersion:
              type: string
              description: server version
            port:
              type: integer
              description: port for server
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: OracleConnectionInfo
        selectedSchemas:
          type: array
          description: List of Oracle schemas for which to collect tables
          items:
            type: string
      required:
      - connectionInfo
      - selectedSchemas
    GetUserTablesOracleTaskOutput:
      type: object
      description: Output for the task that gets the list of tables contained within
        a provided list of Oracle schemas.
      properties:
        schemaName:
          type: string
          description: The schema this result is for
          readOnly: true
        tables:
          type: array
          description: List of valid tables found for this schema
          items:
            type: object
            description: Table properties
            properties:
              hasRows:
                type: boolean
                description: Indicates whether table is empty or not
                readOnly: true
              name:
                type: string
                description: Schema-qualified name of the table
                readOnly: true
          readOnly: true
        validationErrors:
          description: Validation errors associated with the task
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    GetUserTablesPostgreSqlTaskInput:
      type: object
      description: Input for the task that gets the list of tables for a provided
        list of PostgreSQL databases.
      properties:
        connectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
        selectedDatabases:
          type: array
          description: List of PostgreSQL databases for which to collect tables
          items:
            type: string
      required:
      - connectionInfo
      - selectedDatabases
    GetUserTablesPostgreSqlTaskOutput:
      type: object
      description: Output for the task that gets the list of tables for a provided
        list of PostgreSQL databases.
      properties:
        databaseName:
          type: string
          description: The database this result is for
          readOnly: true
        tables:
          type: array
          description: List of valid tables found for this database
          items:
            type: object
            description: Table properties
            properties:
              hasRows:
                type: boolean
                description: Indicates whether table is empty or not
                readOnly: true
              name:
                type: string
                description: Schema-qualified name of the table
                readOnly: true
          readOnly: true
        validationErrors:
          description: Validation errors associated with the task
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ValidateOracleAzureDbPostgreSqlSyncTaskOutput:
      type: object
      description: Output for task that validates migration input for Oracle to Azure
        Database for PostgreSQL for online migrations
      properties:
        validationErrors:
          description: Errors associated with a selected database object
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    MigrateOracleAzureDbPostgreSqlSyncTaskInput:
      type: object
      description: Input for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      properties:
        selectedDatabases:
          type: array
          description: Databases to migrate
          items:
            type: object
            description: Database specific information for Oracle to Azure Database
              for PostgreSQL migration task inputs
            properties:
              caseManipulation:
                type: string
                description: 'How to handle object name casing: either Preserve or
                  ToLower'
              name:
                type: string
                description: Name of the migration pipeline
              schemaName:
                type: string
                description: Name of the source schema
              tableMap:
                type: object
                description: Mapping of source to target tables
                additionalProperties:
                  type: string
              targetDatabaseName:
                type: string
                description: 'Name of target database. Note: Target database will
                  be truncated before starting migration.'
              migrationSetting:
                type: object
                description: Migration settings which tune the migration behavior
                additionalProperties:
                  type: string
              sourceSetting:
                type: object
                description: Source settings to tune source endpoint migration behavior
                additionalProperties:
                  type: string
              targetSetting:
                type: object
                description: Target settings to tune target endpoint migration behavior
                additionalProperties:
                  type: string
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: EZConnect or TNSName connection string.
            serverName:
              type: string
              description: name of the server
            serverVersion:
              type: string
              description: server version
            port:
              type: integer
              description: port for server
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: OracleConnectionInfo
      required:
      - targetConnectionInfo
      - sourceConnectionInfo
      - selectedDatabases
    MigrateOracleAzureDbPostgreSqlSyncTaskOutput:
      type: object
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigrateOracleAzureDbPostgreSqlSyncTaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServer:
          type: string
          description: Source server name
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServer:
          type: string
          description: Target server name
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigrateOracleAzureDbPostgreSqlSyncTaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        databaseName:
          type: string
          description: Name of the database
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        migrationState:
          description: Migration state that this database is in
          readOnly: true
          type: string
          enum:
          - UNDEFINED
          - CONFIGURING
          - INITIALIAZING
          - STARTING
          - RUNNING
          - READY_TO_COMPLETE
          - COMPLETING
          - COMPLETE
          - CANCELLING
          - CANCELLED
          - FAILED
          - VALIDATING
          - VALIDATION_COMPLETE
          - VALIDATION_FAILED
          - RESTORE_IN_PROGRESS
          - RESTORE_COMPLETED
          - BACKUP_IN_PROGRESS
          - BACKUP_COMPLETED
          x-ms-enum:
            name: SyncDatabaseMigrationReportingState
            modelAsString: true
        incomingChanges:
          type: integer
          format: int64
          description: Number of incoming changes
          readOnly: true
        appliedChanges:
          type: integer
          format: int64
          description: Number of applied changes
          readOnly: true
        cdcInsertCounter:
          type: integer
          format: int64
          description: Number of cdc inserts
          readOnly: true
        cdcDeleteCounter:
          type: integer
          format: int64
          description: Number of cdc deletes
          readOnly: true
        cdcUpdateCounter:
          type: integer
          format: int64
          description: Number of cdc updates
          readOnly: true
        fullLoadCompletedTables:
          type: integer
          format: int64
          description: Number of tables completed in full load
          readOnly: true
        fullLoadLoadingTables:
          type: integer
          format: int64
          description: Number of tables loading in full load
          readOnly: true
        fullLoadQueuedTables:
          type: integer
          format: int64
          description: Number of tables queued in full load
          readOnly: true
        fullLoadErroredTables:
          type: integer
          format: int64
          description: Number of tables errored in full load
          readOnly: true
        initializationCompleted:
          type: boolean
          description: Indicates if initial load (full load) has been completed
          readOnly: true
        latency:
          type: integer
          format: int64
          description: CDC apply latency
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    MigrateOracleAzureDbPostgreSqlSyncTaskOutputTableLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        tableName:
          type: string
          description: Name of the table
          readOnly: true
        databaseName:
          type: string
          description: Name of the database
          readOnly: true
        cdcInsertCounter:
          type: integer
          format: int64
          description: Number of applied inserts
          readOnly: true
        cdcUpdateCounter:
          type: integer
          format: int64
          description: Number of applied updates
          readOnly: true
        cdcDeleteCounter:
          type: integer
          format: int64
          description: Number of applied deletes
          readOnly: true
        fullLoadEstFinishTime:
          type: string
          format: date-time
          description: Estimate to finish full load
          readOnly: true
        fullLoadStartedOn:
          type: string
          format: date-time
          description: Full load start time
          readOnly: true
        fullLoadEndedOn:
          type: string
          format: date-time
          description: Full load end time
          readOnly: true
        fullLoadTotalRows:
          type: integer
          format: int64
          description: Number of rows applied in full load
          readOnly: true
        state:
          description: Current state of the table migration
          readOnly: true
          type: string
          enum:
          - BEFORE_LOAD
          - FULL_LOAD
          - COMPLETED
          - CANCELED
          - ERROR
          - FAILED
          x-ms-enum:
            name: SyncTableMigrationState
            modelAsString: true
        totalChangesApplied:
          type: integer
          format: int64
          description: Total number of applied changes
          readOnly: true
        dataErrorsCounter:
          type: integer
          format: int64
          description: Number of data errors occurred
          readOnly: true
        lastModifiedTime:
          type: string
          format: date-time
          description: Last modified time on target
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: TableLevelOutput
    MigrateOracleAzureDbPostgreSqlSyncTaskOutputError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        error:
          description: Migration error
          readOnly: true
          type: object
          properties:
            message:
              type: string
              description: Error message
            actionableMessage:
              type: string
              description: Actionable steps for this exception
            filePath:
              type: string
              description: The path to the file where exception occurred
            lineNumber:
              type: string
              description: The line number where exception occurred
            hResult:
              type: integer
              description: Coded numerical value that is assigned to a specific exception
            stackTrace:
              type: string
              description: Stack trace
      required:
      - resultType
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: ErrorOutput
    MigrateOracleAzureDbPostgreSqlSyncTaskOutputDatabaseError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        errorMessage:
          type: string
          description: Error message
        events:
          type: array
          items:
            type: object
            description: Database migration errors for online migration
            properties:
              timestampString:
                type: string
                description: String value of timestamp.
                readOnly: true
              eventTypeString:
                description: Event type.
                type: string
                readOnly: true
              eventText:
                description: Event text.
                type: string
                readOnly: true
          description: List of error events.
      required:
      - resultType
      description: Output for the task that migrates Oracle databases to Azure Database
        for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelErrorOutput
    MigrateOracleAzureDbPostgreSqlSyncDatabaseInput:
      type: object
      description: Database specific information for Oracle to Azure Database for
        PostgreSQL migration task inputs
      properties:
        caseManipulation:
          type: string
          description: 'How to handle object name casing: either Preserve or ToLower'
        name:
          type: string
          description: Name of the migration pipeline
        schemaName:
          type: string
          description: Name of the source schema
        tableMap:
          type: object
          description: Mapping of source to target tables
          additionalProperties:
            type: string
        targetDatabaseName:
          type: string
          description: 'Name of target database. Note: Target database will be truncated
            before starting migration.'
        migrationSetting:
          type: object
          description: Migration settings which tune the migration behavior
          additionalProperties:
            type: string
        sourceSetting:
          type: object
          description: Source settings to tune source endpoint migration behavior
          additionalProperties:
            type: string
        targetSetting:
          type: object
          description: Target settings to tune target endpoint migration behavior
          additionalProperties:
            type: string
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    OracleConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: EZConnect or TNSName connection string.
        serverName:
