openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MigrateSqlServerSqlMITaskInput:
      type: object
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        selectedDatabases:
          description: Databases to migrate
          type: array
          items:
            type: object
            description: Database specific information for SQL to Azure SQL DB Managed
              Instance migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              restoreDatabaseName:
                type: string
                description: Name of the database at destination
              backupFileShare:
                description: Backup file share information for backing up this database.
                type: object
                properties:
                  userName:
                    type: string
                    description: User name credential to connect to the share location
                  password:
                    type: string
                    description: Password credential used to connect to the share
                      location.
                  path:
                    type: string
                    description: The folder path for this share.
                required:
                - path
              backupFilePaths:
                type: array
                description: The list of backup files to be used in case of existing
                  backups.
                items:
                  type: string
              id:
                type: string
                description: id of the database
            required:
            - name
            - restoreDatabaseName
        startedOn:
          type: string
          description: Date and time relative to UTC when the migration was started
            on
        selectedLogins:
          type: array
          description: Logins to migrate.
          items:
            type: string
        selectedAgentJobs:
          description: Agent Jobs to migrate.
          type: array
          items:
            type: string
        backupFileShare:
          description: Backup file share information for all selected databases.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        backupBlobShare:
          description: SAS URI of Azure Storage Account Container to be used for storing
            backup files.
          type: object
          properties:
            sasUri:
              type: string
              description: SAS URI of Azure Storage Account Container.
        backupMode:
          description: Backup Mode to specify whether to use existing backup or create
            new backup. If using existing backups, backup file paths are required
            to be provided in selectedDatabases.
          type: string
          enum:
          - CreateBackup
          - ExistingBackup
          x-ms-enum:
            name: BackupMode
            modelAsString: true
        aadDomainName:
          type: string
          description: Azure Active Directory domain name in the format of 'contoso.com'
            for federated Azure AD or 'contoso.onmicrosoft.com' for managed domain,
            required if and only if Windows logins are selected
        encryptedKeyForSecureFields:
          type: string
          description: encrypted key for secure fields
      required:
      - sourceConnectionInfo
      - targetConnectionInfo
      - selectedDatabases
      - backupBlobShare
      description: Base class for migration task input
    MigrateSqlServerSqlMITaskOutput:
      type: object
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigrateSqlServerSqlMITaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        status:
          description: Current status of migration
          readOnly: true
          type: string
          enum:
          - Default
          - Connecting
          - SourceAndTargetSelected
          - SelectLogins
          - Configured
          - Running
          - Error
          - Stopped
          - Completed
          - CompletedWithWarnings
          x-ms-enum:
            name: MigrationStatus
            modelAsString: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        agentJobs:
          type: string
          description: Selected agent jobs as a map from name to id
          additionalProperties:
            type: string
          readOnly: true
        logins:
          type: string
          description: Selected logins as a map from name to id
          additionalProperties:
            type: string
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        serverRoleResults:
          type: string
          description: Map of server role migration results.
          additionalProperties:
            type: object
            description: Server role migration result object.
            properties:
              name:
                type: string
                description: Name of server role.
                readOnly: true
              state:
                description: Current state of migration
                readOnly: true
                type: string
                enum:
                - None
                - InProgress
                - Failed
                - Warning
                - Completed
                - Skipped
                - Stopped
                x-ms-enum:
                  name: MigrationState
                  modelAsString: true
              exceptionsAndWarnings:
                description: Migration exceptions and warnings.
                type: array
                items:
                  type: object
                  description: Exception object for all custom exceptions
                  properties:
                    message:
                      type: string
                      description: Error message
                    actionableMessage:
                      type: string
                      description: Actionable steps for this exception
                    filePath:
                      type: string
                      description: The path to the file where exception occurred
                    lineNumber:
                      type: string
                      description: The line number where exception occurred
                    hResult:
                      type: integer
                      description: Coded numerical value that is assigned to a specific
                        exception
                    stackTrace:
                      type: string
                      description: Stack trace
                readOnly: true
          readOnly: true
        orphanedUsersInfo:
          type: array
          description: List of orphaned users.
          items:
            type: object
            description: Information of orphaned users on the SQL server database.
            properties:
              name:
                type: string
                description: Name of the orphaned user
              databaseName:
                type: string
                description: Parent database of the user
          readOnly: true
        databases:
          type: string
          description: Selected databases as a map from database name to database
            id
          additionalProperties:
            type: string
          readOnly: true
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings.
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigrateSqlServerSqlMITaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        databaseName:
          type: string
          description: Name of the database
          readOnly: true
        sizeMB:
          type: number
          format: double
          description: Size of the database in megabytes
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        stage:
          description: Current stage of migration
          readOnly: true
          type: string
          enum:
          - None
          - Initialize
          - Backup
          - FileCopy
          - Restore
          - Completed
          x-ms-enum:
            name: DatabaseMigrationStage
            modelAsString: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    MigrateSqlServerSqlMITaskOutputAgentJobLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        name:
          type: string
          description: Agent Job name.
          readOnly: true
        isEnabled:
          type: boolean
          description: The state of the original Agent Job.
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        exceptionsAndWarnings:
          description: Migration errors and warnings per job
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: AgentJobLevelOutput
    MigrateSqlServerSqlMITaskOutputLoginLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        loginName:
          type: string
          description: Login name.
          readOnly: true
        state:
          description: Current state of login
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        stage:
          description: Current stage of login
          readOnly: true
          type: string
          enum:
          - None
          - Initialize
          - LoginMigration
          - EstablishUserMapping
          - AssignRoleMembership
          - AssignRoleOwnership
          - EstablishServerPermissions
          - EstablishObjectPermissions
          - Completed
          x-ms-enum:
            name: LoginMigrationStage
            modelAsString: true
        startedOn:
          type: string
          format: date-time
          description: Login migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Login migration end time
          readOnly: true
        message:
          type: string
          description: Login migration progress message
          readOnly: true
        exceptionsAndWarnings:
          description: Login migration errors and warnings per login
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: LoginLevelOutput
    MigrateSqlServerSqlMITaskOutputError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        error:
          description: Migration error
          readOnly: true
          type: object
          properties:
            message:
              type: string
              description: Error message
            actionableMessage:
              type: string
              description: Actionable steps for this exception
            filePath:
              type: string
              description: The path to the file where exception occurred
            lineNumber:
              type: string
              description: The line number where exception occurred
            hResult:
              type: integer
              description: Coded numerical value that is assigned to a specific exception
            stackTrace:
              type: string
              description: Stack trace
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: ErrorOutput
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    SqlServerSourcePlatform:
      type: string
      description: An enumeration of source platform types
      enum:
      - SqlOnPrem
      x-ms-enum:
        name: SqlSourcePlatform
        modelAsString: true
    SqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
        serverName:
          type: string
          description: name of the server
        port:
          type: integer
          description: Port for Server
        serverVersion:
          type: string
          description: server version
        serverBrandVersion:
          type: string
          description: server brand version
        resourceId:
          type: string
          description: Represents the ID of an HTTP resource represented by an Azure
            resource provider.
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        additionalSettings:
          type: string
          description: Additional connection settings
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        platform:
          description: Server platform type for connection
          type: string
          enum:
          - SqlOnPrem
          x-ms-enum:
            name: SqlSourcePlatform
            modelAsString: true
      required:
      - type
      - dataSource
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: SqlConnectionInfo
    SqlMigrationTaskInput:
      type: object
      description: Base class for migration task input
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
