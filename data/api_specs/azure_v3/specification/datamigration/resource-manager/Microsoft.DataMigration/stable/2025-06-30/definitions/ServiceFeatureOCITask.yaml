openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    OracleOCIDriverInfo:
      type: object
      description: Information about an Oracle OCI driver.
      properties:
        driverName:
          type: string
          description: The name of the driver package
          readOnly: true
        driverSize:
          type: string
          description: The size in bytes of the driver package
          readOnly: true
        archiveChecksum:
          type: string
          description: The MD5 Base64 encoded checksum for the driver package.
          readOnly: true
        oracleChecksum:
          type: string
          description: The checksum for the driver package provided by Oracle.
          readOnly: true
        assemblyVersion:
          type: string
          description: Version listed in the OCI assembly 'oci.dll'
          readOnly: true
        supportedOracleVersions:
          type: array
          description: List of Oracle database versions supported by this driver.
            Only major minor of the version is listed.
          readOnly: true
          items:
            type: string
    CheckOCIDriverTaskInput:
      type: object
      description: Input for the service task to check for OCI drivers.
      properties:
        serverVersion:
          type: string
          description: Version of the source server to check against.  Optional.
    CheckOCIDriverTaskOutput:
      type: object
      description: Output for the service task to check for OCI drivers.
      properties:
        installedDriver:
          description: Information about the installed driver if found and valid.
          type: object
          properties:
            driverName:
              type: string
              description: The name of the driver package
              readOnly: true
            driverSize:
              type: string
              description: The size in bytes of the driver package
              readOnly: true
            archiveChecksum:
              type: string
              description: The MD5 Base64 encoded checksum for the driver package.
              readOnly: true
            oracleChecksum:
              type: string
              description: The checksum for the driver package provided by Oracle.
              readOnly: true
            assemblyVersion:
              type: string
              description: Version listed in the OCI assembly 'oci.dll'
              readOnly: true
            supportedOracleVersions:
              type: array
              description: List of Oracle database versions supported by this driver.
                Only major minor of the version is listed.
              readOnly: true
              items:
                type: string
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    UploadOCIDriverTaskInput:
      type: object
      description: Input for the service task to upload an OCI driver.
      properties:
        driverShare:
          description: File share information for the OCI driver archive.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
    UploadOCIDriverTaskOutput:
      type: object
      description: Output for the service task to upload an OCI driver.
      properties:
        driverPackageName:
          type: string
          description: The name of the driver package that was validated and uploaded.
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    InstallOCIDriverTaskInput:
      type: object
      description: Input for the service task to install an OCI driver.
      properties:
        driverPackageName:
          type: string
          description: Name of the uploaded driver package to install.
    InstallOCIDriverTaskOutput:
      type: object
      description: Output for the service task to install an OCI driver.
      properties:
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
    FileShare:
      type: object
      description: File share information with Path, Username, and Password.
      properties:
        userName:
          type: string
          description: User name credential to connect to the share location
        password:
          type: string
          description: Password credential used to connect to the share location.
        path:
          type: string
          description: The folder path for this share.
      required:
      - path
