openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToSourceMySqlTaskInput:
      type: object
      description: Input for the task that validates MySQL database connection
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            additionalSettings:
              type: string
              description: Additional connection settings
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MySqlConnectionInfo
        targetPlatform:
          description: Target Platform for the migration
          type: string
          enum:
          - SqlServer
          - AzureDbForMySQL
          x-ms-enum:
            name: MySqlTargetPlatformType
            modelAsString: true
        checkPermissionsGroup:
          description: Permission group for validations
          type: string
          enum:
          - Default
          - MigrationFromSqlServerToAzureDB
          - MigrationFromSqlServerToAzureMI
          - MigrationFromMySQLToAzureDBForMySQL
          - MigrationFromSqlServerToAzureVM
          x-ms-enum:
            name: ServerLevelPermissionsGroup
        isOfflineMigration:
          type: boolean
          description: Flag for whether or not the migration is offline
          default: false
      required:
      - sourceConnectionInfo
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    MySqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        serverName:
          type: string
          description: Name of the server
        dataSource:
          type: string
          description: 'Data source '
        port:
          type: integer
          description: Port for Server
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        additionalSettings:
          type: string
          description: Additional connection settings
      required:
      - type
      - serverName
      - port
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: MySqlConnectionInfo
    MySqlTargetPlatform:
      type: string
      description: An enumeration of possible target types when migrating from MySQL
      enum:
      - SqlServer
      - AzureDbForMySQL
      x-ms-enum:
        name: MySqlTargetPlatformType
        modelAsString: true
    ServerLevelPermissionsGroup:
      type: string
      description: Permission group for validations. These groups will run a set of
        permissions for validating user activity. Select the permission group for
        the activity that you are performing.
      enum:
      - Default
      - MigrationFromSqlServerToAzureDB
      - MigrationFromSqlServerToAzureMI
      - MigrationFromMySQLToAzureDBForMySQL
      - MigrationFromSqlServerToAzureVM
      x-ms-enum:
        name: ServerLevelPermissionsGroup
