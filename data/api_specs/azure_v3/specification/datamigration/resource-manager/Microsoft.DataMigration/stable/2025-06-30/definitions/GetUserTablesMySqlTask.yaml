openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    GetUserTablesMySqlTaskInput:
      type: object
      description: Input for the task that collects user tables for the given list
        of databases
      properties:
        connectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            additionalSettings:
              type: string
              description: Additional connection settings
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MySqlConnectionInfo
        selectedDatabases:
          type: array
          description: List of database names to collect tables for
          items:
            type: string
      required:
      - connectionInfo
      - selectedDatabases
    GetUserTablesMySqlTaskOutput:
      type: object
      description: Output of the task that collects user tables for the given list
        of databases
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        databasesToTables:
          type: string
          description: Mapping from database name to list of tables
          additionalProperties:
            type: array
            items:
              type: object
              description: Table properties
              properties:
                hasRows:
                  type: boolean
                  description: Indicates whether table is empty or not
                  readOnly: true
                name:
                  type: string
                  description: Schema-qualified name of the table
                  readOnly: true
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    MySqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        serverName:
          type: string
          description: Name of the server
        dataSource:
          type: string
          description: 'Data source '
        port:
          type: integer
          description: Port for Server
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        additionalSettings:
          type: string
          description: Additional connection settings
      required:
      - type
      - serverName
      - port
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: MySqlConnectionInfo
    DatabaseTable:
      type: object
      description: Table properties
      properties:
        hasRows:
          type: boolean
          description: Indicates whether table is empty or not
          readOnly: true
        name:
          type: string
          description: Schema-qualified name of the table
          readOnly: true
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
