                  'InvalidRequest' or 'InternalServerError'
              message:
                type: string
                description: The human-readable description of the error
              details:
                type: array
                items:
                  type: object
                  description: Error information in OData format.
                  properties:
                    code:
                      type: string
                      description: The machine-readable description of the error,
                        such as 'InvalidRequest' or 'InternalServerError'
                    message:
                      type: string
                      description: The human-readable description of the error
                    details:
                      type: array
                      items:
                        type: object
                        description: Error information in OData format.
                        properties:
                          code:
                            type: string
                            description: The machine-readable description of the error,
                              such as 'InvalidRequest' or 'InternalServerError'
                          message:
                            type: string
                            description: The human-readable description of the error
                      description: Inner errors that caused this error
                description: Inner errors that caused this error
          description: Array of errors. This is ignored if submitted.
