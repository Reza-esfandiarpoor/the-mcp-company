          - Queued
          - Running
          - Canceled
          - Succeeded
          - Failed
          - FailedInputValidation
          - Faulted
          x-ms-enum:
            name: TaskState
            modelAsString: true
          readOnly: true
        commands:
          description: Array of command properties.
          type: array
          items:
            type: object
            description: Base class for all types of DMS (classic) command properties.
              If command is not supported by current client, this object is returned.
            properties:
              commandType:
                enum:
                - Migrate.Sync.Complete.Database
                - Migrate.SqlServer.AzureDbSqlMi.Complete
                - cancel
                - finish
                - restart
                x-ms-enum:
                  name: CommandType
                  modelAsString: true
                description: Command type.
                type: string
              errors:
                type: array
                items:
                  type: object
                  description: Error information in OData format.
                  properties:
                    code:
                      type: string
                      description: The machine-readable description of the error,
                        such as 'InvalidRequest' or 'InternalServerError'
                    message:
                      type: string
                      description: The human-readable description of the error
                    details:
                      type: array
                      items:
                        type: object
                        description: Error information in OData format.
                        properties:
                          code:
                            type: string
                            description: The machine-readable description of the error,
                              such as 'InvalidRequest' or 'InternalServerError'
                          message:
                            type: string
                            description: The human-readable description of the error
                          details:
                            type: array
                            items:
                              type: object
                              description: Error information in OData format.
                              properties:
                                code:
                                  type: string
                                  description: The machine-readable description of
                                    the error, such as 'InvalidRequest' or 'InternalServerError'
                                message:
                                  type: string
                                  description: The human-readable description of the
                                    error
                            description: Inner errors that caused this error
                      description: Inner errors that caused this error
                description: Array of errors. This is ignored if submitted.
                readOnly: true
              state:
                type: string
                description: The state of the command. This is ignored if submitted.
                enum:
                - Unknown
                - Accepted
                - Running
                - Succeeded
                - Failed
                x-ms-enum:
                  name: CommandState
                  modelAsString: true
                readOnly: true
            required:
            - commandType
            discriminator:
              propertyName: commandType
          readOnly: true
        clientData:
          type: object
          description: Key value pairs of client data to attach meta data information
            to task
          additionalProperties:
            type: string
      required:
      - taskType
      discriminator:
        propertyName: taskType
