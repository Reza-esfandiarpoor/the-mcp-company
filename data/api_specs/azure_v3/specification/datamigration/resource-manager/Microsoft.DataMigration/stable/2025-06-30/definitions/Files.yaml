openapi: 3.0.0
info:
  title: Azure Data Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ProjectFileProperties:
      type: object
      description: Base class for file properties.
      properties:
        extension:
          description: Optional File extension. If submitted it should not have a
            leading period and must match the extension from filePath.
          type: string
        filePath:
          description: Relative path of this file resource. This property can be set
            when creating or updating the file resource.
          type: string
        lastModified:
          description: Modification DateTime.
          type: string
          format: date-time
          readOnly: true
        mediaType:
          description: File content type. This property can be modified to reflect
            the file content type.
          type: string
        size:
          description: File size.
          type: integer
          format: int64
          readOnly: true
    ProjectFile:
      type: object
      properties:
        id:
          readOnly: true
          type: string
          description: Resource ID.
        name:
          readOnly: true
          type: string
          description: Resource name.
        type:
          readOnly: true
          type: string
          description: Resource type.
        etag:
          type: string
          description: HTTP strong entity tag value. This is ignored if submitted.
        properties:
          description: Custom file properties
          type: object
          properties:
            extension:
              description: Optional File extension. If submitted it should not have
                a leading period and must match the extension from filePath.
              type: string
            filePath:
              description: Relative path of this file resource. This property can
                be set when creating or updating the file resource.
              type: string
            lastModified:
              description: Modification DateTime.
              type: string
              format: date-time
              readOnly: true
            mediaType:
              description: File content type. This property can be modified to reflect
                the file content type.
              type: string
            size:
              description: File size.
              type: integer
              format: int64
              readOnly: true
        systemData:
          description: Metadata pertaining to creation and last modification of the
            resource.
          readOnly: true
          type: object
          properties:
            createdBy:
              type: string
            createdByType:
              enum:
              - User
              - Application
              - ManagedIdentity
              - Key
              type: string
              x-ms-enum:
                name: createdByType
                modelAsString: true
            createdAt:
              format: date-time
              type: string
            lastModifiedBy:
              type: string
            lastModifiedByType:
              enum:
              - User
              - Application
              - ManagedIdentity
              - Key
              type: string
              x-ms-enum:
                name: createdByType
                modelAsString: true
            lastModifiedAt:
              format: date-time
              type: string
      description: ARM resource.
      x-ms-azure-resource: true
    FileList:
      type: object
      description: OData page of files
      properties:
        value:
          type: array
          description: List of files
          items:
            type: object
            properties:
              id:
                readOnly: true
                type: string
                description: Resource ID.
              name:
                readOnly: true
                type: string
                description: Resource name.
              type:
                readOnly: true
                type: string
                description: Resource type.
              etag:
                type: string
                description: HTTP strong entity tag value. This is ignored if submitted.
              properties:
                description: Custom file properties
                type: object
                properties:
                  extension:
                    description: Optional File extension. If submitted it should not
                      have a leading period and must match the extension from filePath.
                    type: string
                  filePath:
                    description: Relative path of this file resource. This property
                      can be set when creating or updating the file resource.
                    type: string
                  lastModified:
                    description: Modification DateTime.
                    type: string
                    format: date-time
                    readOnly: true
                  mediaType:
                    description: File content type. This property can be modified
                      to reflect the file content type.
                    type: string
                  size:
                    description: File size.
                    type: integer
                    format: int64
                    readOnly: true
              systemData:
                description: Metadata pertaining to creation and last modification
                  of the resource.
                readOnly: true
                type: object
                properties:
                  createdBy:
                    type: string
                  createdByType:
                    enum:
                    - User
                    - Application
                    - ManagedIdentity
                    - Key
                    type: string
                    x-ms-enum:
                      name: createdByType
                      modelAsString: true
                  createdAt:
                    format: date-time
                    type: string
                  lastModifiedBy:
                    type: string
                  lastModifiedByType:
                    enum:
                    - User
                    - Application
                    - ManagedIdentity
                    - Key
                    type: string
                    x-ms-enum:
                      name: createdByType
                      modelAsString: true
                  lastModifiedAt:
                    format: date-time
                    type: string
            description: ARM resource.
            x-ms-azure-resource: true
        nextLink:
          type: string
          description: URL to load the next page of files
    FileStorageInfo:
      type: object
      description: File storage information.
      properties:
        uri:
          description: A URI that can be used to access the file content.
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    Resource:
      description: ARM resource.
      properties:
        id:
          readOnly: true
          type: string
          description: Resource ID.
        name:
          readOnly: true
          type: string
          description: Resource name.
        type:
          readOnly: true
          type: string
          description: Resource type.
      x-ms-azure-resource: true
    SystemData:
      type: object
      readOnly: true
      properties:
        createdBy:
          type: string
        createdByType:
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          type: string
          x-ms-enum:
            name: createdByType
            modelAsString: true
        createdAt:
          format: date-time
          type: string
        lastModifiedBy:
          type: string
        lastModifiedByType:
          enum:
          - User
          - Application
          - ManagedIdentity
          - Key
          type: string
          x-ms-enum:
            name: createdByType
            modelAsString: true
        lastModifiedAt:
          format: date-time
          type: string
