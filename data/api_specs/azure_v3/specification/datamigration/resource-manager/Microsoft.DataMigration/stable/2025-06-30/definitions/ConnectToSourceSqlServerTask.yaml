openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToSourceSqlServerTaskInput:
      type: object
      description: Input for the task that validates connection to SQL Server and
        also validates source server requirements
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        checkPermissionsGroup:
          description: Permission group for validations
          type: string
          enum:
          - Default
          - MigrationFromSqlServerToAzureDB
          - MigrationFromSqlServerToAzureMI
          - MigrationFromMySQLToAzureDBForMySQL
          - MigrationFromSqlServerToAzureVM
          x-ms-enum:
            name: ServerLevelPermissionsGroup
        collectDatabases:
          type: boolean
          description: Flag for whether to collect databases from source server.
          default: true
        collectLogins:
          type: boolean
          description: Flag for whether to collect logins from source server.
          default: false
        collectAgentJobs:
          type: boolean
          description: Flag for whether to collect agent jobs from source server.
          default: false
        collectTdeCertificateInfo:
          type: boolean
          description: Flag for whether to collect TDE Certificate names from source
            server.
          default: false
        validateSsisCatalogOnly:
          type: boolean
          description: Flag for whether to validate SSIS catalog is reachable on the
            source server.
          default: false
        encryptedKeyForSecureFields:
          type: string
          description: encrypted key for secure fields
      required:
      - sourceConnectionInfo
    ConnectToSourceSqlServerTaskOutput:
      type: object
      description: Output for the task that validates connection to SQL Server and
        also validates source server requirements
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Type of result - database level or task level
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    ConnectToSourceSqlServerTaskOutputTaskLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Type of result - database level or task level
          type: string
        databases:
          type: string
          description: Source databases as a map from database name to database id
          additionalProperties:
            type: string
          readOnly: true
        logins:
          type: string
          description: Source logins as a map from login name to login id.
          additionalProperties:
            type: string
          readOnly: true
        agentJobs:
          type: string
          description: Source agent jobs as a map from agent job name to id.
          additionalProperties:
            type: string
          readOnly: true
        databaseTdeCertificateMapping:
          type: string
          description: Mapping from database name to TDE certificate name, if applicable
          additionalProperties:
            type: string
          readOnly: true
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for the task that validates connection to SQL Server and
        also validates source server requirements
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: TaskLevelOutput
    ConnectToSourceSqlServerTaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Type of result - database level or task level
          type: string
        name:
          type: string
          description: Database name
          readOnly: true
        sizeMB:
          type: number
          format: double
          description: Size of the file in megabytes
          readOnly: true
        databaseFiles:
          type: array
          description: The list of database files
          items:
            type: object
            description: Database file specific information
            properties:
              databaseName:
                type: string
                description: Name of the database
              id:
                type: string
                description: Unique identifier for database file
              logicalName:
                type: string
                description: Logical name of the file
              physicalFullName:
                type: string
                description: Operating-system full path of the file
              restoreFullName:
                type: string
                description: Suggested full path of the file for restoring
              fileType:
                description: Database file type
                type: string
                enum:
                - Rows
                - Log
                - Filestream
                - NotSupported
                - Fulltext
                x-ms-enum:
                  name: DatabaseFileType
                  modelAsString: true
              sizeMB:
                type: number
                format: double
                description: Size of the file in megabytes
          readOnly: true
        compatibilityLevel:
          description: SQL Server compatibility level of database
          readOnly: true
          type: string
          enum:
          - CompatLevel80
          - CompatLevel90
          - CompatLevel100
          - CompatLevel110
          - CompatLevel120
          - CompatLevel130
          - CompatLevel140
          x-ms-enum:
            name: DatabaseCompatLevel
            modelAsString: true
        databaseState:
          description: State of the database
          readOnly: true
          type: string
          enum:
          - Online
          - Restoring
          - Recovering
          - RecoveryPending
          - Suspect
          - Emergency
          - Offline
          - Copying
          - OfflineSecondary
          x-ms-enum:
            name: DatabaseState
            modelAsString: true
      required:
      - resultType
      description: Output for the task that validates connection to SQL Server and
        also validates source server requirements
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    ConnectToSourceSqlServerTaskOutputLoginLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Type of result - database level or task level
          type: string
        name:
          type: string
          description: Login name.
          readOnly: true
        loginType:
          description: The type of login.
          readOnly: true
          type: string
          enum:
          - WindowsUser
          - WindowsGroup
          - SqlLogin
          - Certificate
          - AsymmetricKey
          - ExternalUser
          - ExternalGroup
          x-ms-enum:
            name: LoginType
            modelAsString: true
        defaultDatabase:
          type: string
          description: The default database for the login.
          readOnly: true
        isEnabled:
          type: boolean
          description: The state of the login.
          readOnly: true
        migrationEligibility:
          description: Information about eligibility of login for migration.
          readOnly: true
          type: object
          properties:
            isEligibleForMigration:
              type: boolean
              description: Whether object is eligible for migration or not.
              readOnly: true
            validationMessages:
              description: Information about eligibility failure for the server object.
              type: array
              items:
                type: string
              readOnly: true
      required:
      - resultType
      description: Output for the task that validates connection to SQL Server and
        also validates source server requirements
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: LoginLevelOutput
    ConnectToSourceSqlServerTaskOutputAgentJobLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Type of result - database level or task level
          type: string
        name:
          type: string
          description: Agent Job name
          readOnly: true
        jobCategory:
          type: string
          description: The type of Agent Job.
          readOnly: true
        isEnabled:
          type: boolean
          description: The state of the original Agent Job.
          readOnly: true
        jobOwner:
          type: string
          description: The owner of the Agent Job
          readOnly: true
        lastExecutedOn:
          type: string
          format: date-time
          readOnly: true
          description: UTC Date and time when the Agent Job was last executed.
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
        migrationEligibility:
          description: Information about eligibility of agent job for migration.
          readOnly: true
          type: object
          properties:
            isEligibleForMigration:
              type: boolean
              description: Whether object is eligible for migration or not.
              readOnly: true
            validationMessages:
              description: Information about eligibility failure for the server object.
              type: array
              items:
                type: string
              readOnly: true
      required:
      - resultType
      description: Output for the task that validates connection to SQL Server and
        also validates source server requirements
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: AgentJobLevelOutput
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    SqlServerSourcePlatform:
      type: string
      description: An enumeration of source platform types
      enum:
      - SqlOnPrem
      x-ms-enum:
        name: SqlSourcePlatform
        modelAsString: true
    SqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
        serverName:
          type: string
          description: name of the server
        port:
          type: integer
          description: Port for Server
        serverVersion:
          type: string
          description: server version
        serverBrandVersion:
          type: string
          description: server brand version
        resourceId:
          type: string
          description: Represents the ID of an HTTP resource represented by an Azure
            resource provider.
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        additionalSettings:
          type: string
          description: Additional connection settings
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        platform:
          description: Server platform type for connection
          type: string
          enum:
          - SqlOnPrem
          x-ms-enum:
            name: SqlSourcePlatform
            modelAsString: true
      required:
      - type
      - dataSource
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: SqlConnectionInfo
    ServerLevelPermissionsGroup:
      type: string
      description: Permission group for validations. These groups will run a set of
        permissions for validating user activity. Select the permission group for
        the activity that you are performing.
      enum:
      - Default
      - MigrationFromSqlServerToAzureDB
      - MigrationFromSqlServerToAzureMI
      - MigrationFromMySQLToAzureDBForMySQL
      - MigrationFromSqlServerToAzureVM
      x-ms-enum:
        name: ServerLevelPermissionsGroup
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
    DatabaseFileType:
      type: string
      description: An enumeration of SQL Server database file types
      enum:
      - Rows
      - Log
      - Filestream
      - NotSupported
      - Fulltext
      x-ms-enum:
        name: DatabaseFileType
        modelAsString: true
    DatabaseFileInfo:
      type: object
      description: Database file specific information
      properties:
        databaseName:
          type: string
          description: Name of the database
        id:
          type: string
          description: Unique identifier for database file
        logicalName:
          type: string
          description: Logical name of the file
        physicalFullName:
          type: string
          description: Operating-system full path of the file
        restoreFullName:
          type: string
          description: Suggested full path of the file for restoring
        fileType:
          description: Database file type
          type: string
          enum:
          - Rows
          - Log
          - Filestream
          - NotSupported
          - Fulltext
          x-ms-enum:
            name: DatabaseFileType
            modelAsString: true
        sizeMB:
          type: number
          format: double
          description: Size of the file in megabytes
    DatabaseCompatLevel:
      type: string
      description: An enumeration of SQL Server database compatibility levels
      enum:
      - CompatLevel80
      - CompatLevel90
      - CompatLevel100
      - CompatLevel110
      - CompatLevel120
      - CompatLevel130
      - CompatLevel140
      x-ms-enum:
        name: DatabaseCompatLevel
        modelAsString: true
    DatabaseState:
      type: string
      description: An enumeration of SQL Server Database states
      enum:
      - Online
      - Restoring
      - Recovering
      - RecoveryPending
      - Suspect
      - Emergency
      - Offline
      - Copying
      - OfflineSecondary
      x-ms-enum:
        name: DatabaseState
        modelAsString: true
    LoginType:
      type: string
      description: Enum mapping of SMO LoginType.
      enum:
      - WindowsUser
      - WindowsGroup
      - SqlLogin
      - Certificate
      - AsymmetricKey
      - ExternalUser
      - ExternalGroup
      x-ms-enum:
        name: LoginType
        modelAsString: true
    MigrationEligibilityInfo:
      type: object
      description: Information about migration eligibility of a server object
      properties:
        isEligibleForMigration:
          type: boolean
          description: Whether object is eligible for migration or not.
          readOnly: true
        validationMessages:
          description: Information about eligibility failure for the server object.
          type: array
          items:
            type: string
          readOnly: true
