openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    AvailableServiceSku:
      type: object
      description: Describes the available service SKU.
      properties:
        resourceType:
          type: string
          description: The resource type, including the provider namespace
        sku:
          type: object
          description: SKU name, tier, etc.
          properties:
            name:
              type: string
              description: The name of the SKU
            family:
              type: string
              description: SKU family
            size:
              type: string
              description: SKU size
            tier:
              type: string
              description: The tier of the SKU, such as "Basic", "General Purpose",
                or "Business Critical"
        capacity:
          type: object
          description: A description of the scaling capacities of the SKU
          properties:
            minimum:
              type: integer
              description: The minimum capacity, usually 0 or 1.
            maximum:
              type: integer
              description: The maximum capacity
            default:
              type: integer
              description: The default capacity
            scaleType:
              type: string
              description: The scalability approach
              enum:
              - none
              - manual
              - automatic
              x-ms-enum:
                name: ServiceScalability
                modelAsString: true
    DataMigrationService:
      type: object
      properties:
        location:
          type: string
          x-ms-mutability:
          - read
          - create
        tags:
          type: object
          additionalProperties:
            type: string
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
        systemData:
          readOnly: true
          type: object
          properties:
            createdBy:
              type: string
            createdByType:
              enum:
              - User
              - Application
              - ManagedIdentity
              - Key
              type: string
              x-ms-enum:
                name: createdByType
                modelAsString: true
            createdAt:
              format: date-time
              type: string
            lastModifiedBy:
              type: string
            lastModifiedByType:
              enum:
              - User
              - Application
              - ManagedIdentity
              - Key
              type: string
              x-ms-enum:
                name: createdByType
                modelAsString: true
            lastModifiedAt:
              format: date-time
              type: string
          description: Metadata pertaining to creation and last modification of the
            resource.
        etag:
          type: string
          description: HTTP strong entity tag value. Ignored if submitted
        kind:
          type: string
          description: The resource kind. Only 'vm' (the default) is supported.
        properties:
          x-ms-client-flatten: true
          description: Custom service properties
          type: object
          properties:
            provisioningState:
              type: string
              readOnly: true
              description: The resource's provisioning state
              enum:
              - Accepted
              - Deleting
              - Deploying
              - Stopped
              - Stopping
              - Starting
              - FailedToStart
              - FailedToStop
              - Succeeded
              - Failed
              x-ms-enum:
                name: ServiceProvisioningState
                modelAsString: true
            publicKey:
              type: string
              description: The public key of the service, used to encrypt secrets
                sent to the service
            virtualSubnetId:
              type: string
              description: The ID of the Microsoft.Network/virtualNetworks/subnets
                resource to which the service should be joined
            virtualNicId:
              type: string
              description: The ID of the Microsoft.Network/networkInterfaces resource
                which the service have
            autoStopDelay:
              type: string
              description: The time delay before the service is auto-stopped when
                idle.
            deleteResourcesOnStop:
              type: boolean
              description: Whether service resources should be deleted when stopped.
                (Turned on by default)
        sku:
          description: Service SKU
          type: object
          properties:
            name:
              type: string
              description: The unique name of the SKU, such as 'P3'
            tier:
              type: string
              description: The tier of the SKU, such as 'Basic', 'General Purpose',
                or 'Business Critical'
            family:
              type: string
              description: The SKU family, used when the service has multiple performance
                classes within a tier, such as 'A', 'D', etc. for virtual machines
            size:
              type: string
              description: The size of the SKU, used when the name alone does not
                denote a service size or when a SKU has multiple performance classes
                within a family, e.g. 'A1' for virtual machines
            capacity:
              type: integer
              description: The capacity of the SKU, if it supports scaling
      x-ms-azure-resource: true
      description: An Azure Database Migration Service (classic) resource
    DataMigrationServiceList:
