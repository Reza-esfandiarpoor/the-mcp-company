                    - Stopped
                    - Stopping
                    - Starting
                    - FailedToStart
                    - FailedToStop
                    - Succeeded
                    - Failed
                    x-ms-enum:
                      name: ServiceProvisioningState
                      modelAsString: true
                  publicKey:
                    type: string
                    description: The public key of the service, used to encrypt secrets
