                  autoStopDelay:
                    type: string
                    description: The time delay before the service is auto-stopped
                      when idle.
                  deleteResourcesOnStop:
                    type: boolean
                    description: Whether service resources should be deleted when
                      stopped. (Turned on by default)
              sku:
                description: Service SKU
                type: object
                properties:
                  name:
                    type: string
                    description: The unique name of the SKU, such as 'P3'
                  tier:
                    type: string
                    description: The tier of the SKU, such as 'Basic', 'General Purpose',
                      or 'Business Critical'
                  family:
                    type: string
                    description: The SKU family, used when the service has multiple
                      performance classes within a tier, such as 'A', 'D', etc. for
                      virtual machines
                  size:
                    type: string
                    description: The size of the SKU, used when the name alone does
                      not denote a service size or when a SKU has multiple performance
                      classes within a family, e.g. 'A1' for virtual machines
                  capacity:
                    type: integer
                    description: The capacity of the SKU, if it supports scaling
            x-ms-azure-resource: true
            description: An Azure Database Migration Service (classic) resource
        nextLink:
          type: string
          description: URL to load the next page of services
    DataMigrationServiceProperties:
