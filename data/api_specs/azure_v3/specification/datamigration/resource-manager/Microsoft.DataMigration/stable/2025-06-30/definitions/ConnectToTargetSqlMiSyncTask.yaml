openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToTargetSqlMISyncTaskInput:
      type: object
      description: Input for the task that validates connection to Azure SQL Database
        Managed Instance online scenario.
      properties:
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            managedInstanceResourceId:
              type: string
              description: Resource id for Azure SQL database Managed instance
          required:
          - type
          - managedInstanceResourceId
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MiSqlConnectionInfo
        azureApp:
          description: Azure Active Directory Application the DMS (classic) instance
            will use to connect to the target instance of Azure SQL Database Managed
            Instance and the Azure Storage Account
          type: object
          properties:
            applicationId:
              type: string
              description: Application ID of the Azure Active Directory Application
            appKey:
              type: string
              description: Key used to authenticate to the Azure Active Directory
                Application
            tenantId:
              type: string
              description: Tenant id of the customer
            ignoreAzurePermissions:
              type: boolean
              description: Ignore checking azure permissions on the AAD app
      required:
      - targetConnectionInfo
      - azureApp
    ConnectToTargetSqlMISyncTaskOutput:
      type: object
      description: Output for the task that validates connection to Azure SQL Database
        Managed Instance.
      properties:
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    MiSqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        managedInstanceResourceId:
          type: string
          description: Resource id for Azure SQL database Managed instance
      required:
      - type
      - managedInstanceResourceId
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: MiSqlConnectionInfo
    AzureActiveDirectoryApp:
      type: object
      description: Azure Active Directory Application
      properties:
        applicationId:
          type: string
          description: Application ID of the Azure Active Directory Application
        appKey:
          type: string
          description: Key used to authenticate to the Azure Active Directory Application
        tenantId:
          type: string
          description: Tenant id of the customer
        ignoreAzurePermissions:
          type: boolean
          description: Ignore checking azure permissions on the AAD app
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
