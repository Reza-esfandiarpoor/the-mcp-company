openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MigrateSqlServerSqlMISyncTaskInput:
      type: object
      properties:
        selectedDatabases:
          description: Databases to migrate
          type: array
          items:
            type: object
            description: Database specific information for SQL to Azure SQL DB Managed
              Instance migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              restoreDatabaseName:
                type: string
                description: Name of the database at destination
              backupFileShare:
                description: Backup file share information for backing up this database.
                type: object
                properties:
                  userName:
                    type: string
                    description: User name credential to connect to the share location
                  password:
                    type: string
                    description: Password credential used to connect to the share
                      location.
                  path:
                    type: string
                    description: The folder path for this share.
                required:
                - path
              backupFilePaths:
                type: array
                description: The list of backup files to be used in case of existing
                  backups.
                items:
                  type: string
              id:
                type: string
                description: id of the database
            required:
            - name
            - restoreDatabaseName
        backupFileShare:
          description: Backup file share information for all selected databases.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        storageResourceId:
          type: string
          description: Fully qualified resourceId of storage
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            managedInstanceResourceId:
              type: string
              description: Resource id for Azure SQL database Managed instance
          required:
          - type
          - managedInstanceResourceId
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MiSqlConnectionInfo
        azureApp:
          description: Azure Active Directory Application the DMS (classic) instance
            will use to connect to the target instance of Azure SQL Database Managed
            Instance and the Azure Storage Account
          type: object
          properties:
            applicationId:
              type: string
              description: Application ID of the Azure Active Directory Application
            appKey:
              type: string
              description: Key used to authenticate to the Azure Active Directory
                Application
            tenantId:
              type: string
              description: Tenant id of the customer
            ignoreAzurePermissions:
              type: boolean
              description: Ignore checking azure permissions on the AAD app
        numberOfParallelDatabaseMigrations:
          type: number
          description: Number of database migrations to start in parallel
      required:
      - selectedDatabases
      - azureApp
      - sourceConnectionInfo
      - targetConnectionInfo
      - storageResourceId
      description: Input for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance online scenario.
    MigrateSqlServerSqlMISyncTaskOutput:
      type: object
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance using Log Replay Service.
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigrateSqlServerSqlMISyncTaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        databaseCount:
          type: integer
          description: Count of databases
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        sourceServerName:
          type: string
          description: Source server name
          readOnly: true
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        targetServerName:
          type: string
          description: Target server name
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        databaseErrorCount:
          type: integer
          description: Number of database level errors
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance using Log Replay Service.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigrateSqlServerSqlMISyncTaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        sourceDatabaseName:
          type: string
          description: Name of the database
          readOnly: true
        migrationState:
          description: Current state of database
          readOnly: true
          type: string
          enum:
          - UNDEFINED
          - INITIAL
          - FULL_BACKUP_UPLOAD_START
          - LOG_SHIPPING_START
          - UPLOAD_LOG_FILES_START
          - CUTOVER_START
          - POST_CUTOVER_COMPLETE
          - COMPLETED
          - CANCELLED
          - FAILED
          x-ms-enum:
            name: DatabaseMigrationState
            modelAsString: true
        startedOn:
          type: string
          format: date-time
          description: Database migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Database migration end time
          readOnly: true
        fullBackupSetInfo:
          type: object
          description: Details of full backup set
          readOnly: true
          properties:
            backupSetId:
              type: string
              description: Id for the set of backup files
            firstLsn:
              type: string
              description: First log sequence number of the backup file
            lastLsn:
              type: string
              description: Last log sequence number of the backup file
            lastModifiedTime:
              type: string
              format: date-time
              description: Last modified time of the backup file in share location
            backupType:
              description: Enum of the different backup types
              type: string
              enum:
              - Database
              - TransactionLog
              - File
              - DifferentialDatabase
              - DifferentialFile
              - Partial
              - DifferentialPartial
              x-ms-enum:
                name: BackupType
                modelAsString: true
            listOfBackupFiles:
              type: array
              items:
                type: object
                description: Information of the backup file
                properties:
                  fileLocation:
                    type: string
                    description: Location of the backup file in shared folder
                  familySequenceNumber:
                    type: integer
                    description: Sequence number of the backup file in the backup
                      set
                  status:
                    description: Status of the backup file during migration
                    type: string
                    enum:
                    - Arrived
                    - Queued
                    - Uploading
                    - Uploaded
                    - Restoring
                    - Restored
                    - Cancelled
                    x-ms-enum:
                      name: BackupFileStatus
                      modelAsString: true
                readOnly: true
              description: List of files in the backup set
            databaseName:
              type: string
              description: Name of the database to which the backup set belongs
            backupStartDate:
              type: string
              format: date-time
              description: Date and time that the backup operation began
            backupFinishedDate:
              type: string
              format: date-time
              description: Date and time that the backup operation finished
            isBackupRestored:
              type: boolean
              description: Whether the backup set is restored or not
        lastRestoredBackupSetInfo:
          type: object
          description: Last applied backup set information
          readOnly: true
          properties:
            backupSetId:
              type: string
              description: Id for the set of backup files
            firstLsn:
              type: string
              description: First log sequence number of the backup file
            lastLsn:
              type: string
              description: Last log sequence number of the backup file
            lastModifiedTime:
              type: string
              format: date-time
              description: Last modified time of the backup file in share location
            backupType:
              description: Enum of the different backup types
              type: string
              enum:
              - Database
              - TransactionLog
              - File
              - DifferentialDatabase
              - DifferentialFile
              - Partial
              - DifferentialPartial
              x-ms-enum:
                name: BackupType
                modelAsString: true
            listOfBackupFiles:
              type: array
              items:
                type: object
                description: Information of the backup file
                properties:
                  fileLocation:
                    type: string
                    description: Location of the backup file in shared folder
                  familySequenceNumber:
                    type: integer
                    description: Sequence number of the backup file in the backup
                      set
                  status:
                    description: Status of the backup file during migration
                    type: string
                    enum:
                    - Arrived
                    - Queued
                    - Uploading
                    - Uploaded
                    - Restoring
                    - Restored
                    - Cancelled
                    x-ms-enum:
                      name: BackupFileStatus
                      modelAsString: true
                readOnly: true
              description: List of files in the backup set
            databaseName:
              type: string
              description: Name of the database to which the backup set belongs
            backupStartDate:
              type: string
              format: date-time
              description: Date and time that the backup operation began
            backupFinishedDate:
              type: string
              format: date-time
              description: Date and time that the backup operation finished
            isBackupRestored:
              type: boolean
              description: Whether the backup set is restored or not
        activeBackupSets:
          description: Backup sets that are currently active (Either being uploaded
            or getting restored)
          type: array
          items:
            type: object
            description: Information of backup set
            properties:
              backupSetId:
                type: string
                description: Id for the set of backup files
              firstLsn:
                type: string
                description: First log sequence number of the backup file
              lastLsn:
                type: string
                description: Last log sequence number of the backup file
              lastModifiedTime:
                type: string
                format: date-time
                description: Last modified time of the backup file in share location
              backupType:
                description: Enum of the different backup types
                type: string
                enum:
                - Database
                - TransactionLog
                - File
                - DifferentialDatabase
                - DifferentialFile
                - Partial
                - DifferentialPartial
                x-ms-enum:
                  name: BackupType
                  modelAsString: true
              listOfBackupFiles:
                type: array
                items:
                  type: object
                  description: Information of the backup file
                  properties:
                    fileLocation:
                      type: string
                      description: Location of the backup file in shared folder
                    familySequenceNumber:
                      type: integer
                      description: Sequence number of the backup file in the backup
                        set
                    status:
                      description: Status of the backup file during migration
                      type: string
                      enum:
                      - Arrived
                      - Queued
                      - Uploading
                      - Uploaded
                      - Restoring
                      - Restored
                      - Cancelled
                      x-ms-enum:
                        name: BackupFileStatus
                        modelAsString: true
                  readOnly: true
                description: List of files in the backup set
              databaseName:
                type: string
                description: Name of the database to which the backup set belongs
              backupStartDate:
                type: string
                format: date-time
                description: Date and time that the backup operation began
              backupFinishedDate:
                type: string
                format: date-time
                description: Date and time that the backup operation finished
              isBackupRestored:
                type: boolean
                description: Whether the backup set is restored or not
            readOnly: true
          readOnly: true
        containerName:
          description: Name of container created in the Azure Storage account where
            backups are copied to
          type: string
          readOnly: true
        errorPrefix:
          description: prefix string to use for querying errors for this database
          type: string
          readOnly: true
        isFullBackupRestored:
          description: Whether full backup has been applied to the target database
            or not
          type: boolean
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance using Log Replay Service.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    MigrateSqlServerSqlMISyncTaskOutputError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        error:
          description: Migration error
          readOnly: true
          type: object
          properties:
            message:
              type: string
              description: Error message
            actionableMessage:
              type: string
              description: Actionable steps for this exception
            filePath:
              type: string
              description: The path to the file where exception occurred
            lineNumber:
              type: string
              description: The line number where exception occurred
            hResult:
              type: integer
              description: Coded numerical value that is assigned to a specific exception
            stackTrace:
              type: string
              description: Stack trace
      required:
      - resultType
      description: Output for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance using Log Replay Service.
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: ErrorOutput
    FileShare:
      type: object
      description: File share information with Path, Username, and Password.
      properties:
        userName:
          type: string
          description: User name credential to connect to the share location
        password:
          type: string
          description: Password credential used to connect to the share location.
        path:
          type: string
          description: The folder path for this share.
      required:
      - path
    MigrateSqlServerSqlMIDatabaseInput:
      type: object
      description: Database specific information for SQL to Azure SQL DB Managed Instance
        migration task inputs
      properties:
        name:
          type: string
          description: Name of the database
        restoreDatabaseName:
          type: string
          description: Name of the database at destination
        backupFileShare:
          description: Backup file share information for backing up this database.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        backupFilePaths:
          type: array
          description: The list of backup files to be used in case of existing backups.
          items:
            type: string
        id:
          type: string
          description: id of the database
      required:
      - name
      - restoreDatabaseName
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    SqlServerSourcePlatform:
      type: string
      description: An enumeration of source platform types
      enum:
      - SqlOnPrem
      x-ms-enum:
        name: SqlSourcePlatform
        modelAsString: true
    SqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
        serverName:
          type: string
          description: name of the server
        port:
          type: integer
          description: Port for Server
        serverVersion:
          type: string
          description: server version
        serverBrandVersion:
          type: string
          description: server brand version
        resourceId:
          type: string
          description: Represents the ID of an HTTP resource represented by an Azure
            resource provider.
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        additionalSettings:
          type: string
          description: Additional connection settings
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        platform:
          description: Server platform type for connection
          type: string
          enum:
          - SqlOnPrem
          x-ms-enum:
            name: SqlSourcePlatform
            modelAsString: true
      required:
      - type
      - dataSource
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: SqlConnectionInfo
    MiSqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        managedInstanceResourceId:
          type: string
          description: Resource id for Azure SQL database Managed instance
      required:
      - type
      - managedInstanceResourceId
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: MiSqlConnectionInfo
    AzureActiveDirectoryApp:
      type: object
      description: Azure Active Directory Application
      properties:
        applicationId:
          type: string
          description: Application ID of the Azure Active Directory Application
        appKey:
          type: string
          description: Key used to authenticate to the Azure Active Directory Application
        tenantId:
          type: string
          description: Tenant id of the customer
        ignoreAzurePermissions:
          type: boolean
          description: Ignore checking azure permissions on the AAD app
    SqlServerSqlMISyncTaskInput:
      type: object
      description: Input for task that migrates SQL Server databases to Azure SQL
