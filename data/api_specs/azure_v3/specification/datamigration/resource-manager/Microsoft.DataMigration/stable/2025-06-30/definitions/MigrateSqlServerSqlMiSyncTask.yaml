      properties:
        selectedDatabases:
          description: Databases to migrate
          type: array
          items:
            type: object
            description: Database specific information for SQL to Azure SQL DB Managed
              Instance migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              restoreDatabaseName:
                type: string
                description: Name of the database at destination
              backupFileShare:
                description: Backup file share information for backing up this database.
                type: object
                properties:
                  userName:
                    type: string
                    description: User name credential to connect to the share location
                  password:
                    type: string
                    description: Password credential used to connect to the share
                      location.
                  path:
                    type: string
                    description: The folder path for this share.
                required:
                - path
              backupFilePaths:
                type: array
                description: The list of backup files to be used in case of existing
                  backups.
                items:
                  type: string
              id:
                type: string
                description: id of the database
            required:
            - name
            - restoreDatabaseName
        backupFileShare:
          description: Backup file share information for all selected databases.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        storageResourceId:
          type: string
          description: Fully qualified resourceId of storage
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            managedInstanceResourceId:
              type: string
              description: Resource id for Azure SQL database Managed instance
          required:
          - type
          - managedInstanceResourceId
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MiSqlConnectionInfo
        azureApp:
          description: Azure Active Directory Application the DMS (classic) instance
            will use to connect to the target instance of Azure SQL Database Managed
            Instance and the Azure Storage Account
          type: object
          properties:
            applicationId:
              type: string
              description: Application ID of the Azure Active Directory Application
            appKey:
              type: string
              description: Key used to authenticate to the Azure Active Directory
                Application
            tenantId:
              type: string
              description: Tenant id of the customer
            ignoreAzurePermissions:
              type: boolean
              description: Ignore checking azure permissions on the AAD app
      required:
      - selectedDatabases
      - azureApp
      - sourceConnectionInfo
      - targetConnectionInfo
      - storageResourceId
    MigrationState:
      type: string
      description: Current state of migration
      enum:
      - None
      - InProgress
      - Failed
      - Warning
      - Completed
      - Skipped
      - Stopped
      x-ms-enum:
        name: MigrationState
        modelAsString: true
    DatabaseMigrationState:
      type: string
      description: Database level migration state.
      enum:
      - UNDEFINED
      - INITIAL
      - FULL_BACKUP_UPLOAD_START
      - LOG_SHIPPING_START
      - UPLOAD_LOG_FILES_START
      - CUTOVER_START
      - POST_CUTOVER_COMPLETE
      - COMPLETED
      - CANCELLED
      - FAILED
      x-ms-enum:
