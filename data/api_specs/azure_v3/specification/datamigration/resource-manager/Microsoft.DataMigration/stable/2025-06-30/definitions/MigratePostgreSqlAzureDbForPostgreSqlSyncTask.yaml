openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskInput:
      type: object
      description: Input for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      properties:
        selectedDatabases:
          type: array
          description: Databases to migrate
          items:
            type: object
            description: Database specific information for PostgreSQL to Azure Database
              for PostgreSQL migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              id:
                type: string
                description: Result identifier
                readOnly: true
              targetDatabaseName:
                type: string
                description: 'Name of target database. Note: Target database will
                  be truncated before starting migration.'
              migrationSetting:
                type: object
                description: Migration settings which tune the migration behavior
                additionalProperties: {}
              sourceSetting:
                type: object
                description: Source settings to tune source endpoint migration behavior
                additionalProperties:
                  type: string
              targetSetting:
                type: object
                description: Target settings to tune target endpoint migration behavior
                additionalProperties:
                  type: string
              selectedTables:
                type: array
                description: Tables selected for migration
                items:
                  type: object
                  description: Selected tables for the migration
                  properties:
                    name:
                      type: string
                      description: Name of the table to migrate
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            serverVersion:
              type: string
              description: server version
            databaseName:
              type: string
              description: Name of the database
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            additionalSettings:
              type: string
              description: Additional connection settings
            serverBrandVersion:
              type: string
              description: server brand version
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: PostgreSqlConnectionInfo
        encryptedKeyForSecureFields:
          type: string
          description: encrypted key for secure fields
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
      required:
      - targetConnectionInfo
      - sourceConnectionInfo
      - selectedDatabases
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutput:
      type: object
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServer:
          type: string
          description: Source server name
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServer:
          type: string
          description: Target server name
          readOnly: true
        sourceServerType:
          description: Source server type.
          readOnly: true
          type: string
          enum:
          - Access
          - DB2
          - MySQL
          - Oracle
          - SQL
          - Sybase
          - PostgreSQL
          - MongoDB
          - SQLRDS
          - MySQLRDS
          - PostgreSQLRDS
          x-ms-enum:
            name: ScenarioSource
            modelAsString: true
        targetServerType:
          description: Target server type.
          readOnly: true
          type: string
          enum:
          - SQLServer
          - SQLDB
          - SQLDW
          - SQLMI
          - AzureDBForMySql
          - AzureDBForPostgresSQL
          - MongoDB
          x-ms-enum:
            name: ScenarioTarget
            modelAsString: true
        state:
          description: Migration status
          readOnly: true
          type: string
          enum:
          - UNDEFINED
          - VALIDATING
          - PENDING
          - COMPLETE
          - ACTION_REQUIRED
          - FAILED
          x-ms-enum:
            name: ReplicateMigrationState
            modelAsString: true
        databaseCount:
          type: number
          description: Number of databases to include
      required:
      - resultType
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutputDatabaseLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        databaseName:
          type: string
          description: Name of the database
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        migrationState:
          description: Migration state that this database is in
          readOnly: true
          type: string
          enum:
          - UNDEFINED
          - CONFIGURING
          - INITIALIAZING
          - STARTING
          - RUNNING
          - READY_TO_COMPLETE
          - COMPLETING
          - COMPLETE
          - CANCELLING
          - CANCELLED
          - FAILED
          - VALIDATING
          - VALIDATION_COMPLETE
          - VALIDATION_FAILED
          - RESTORE_IN_PROGRESS
          - RESTORE_COMPLETED
          - BACKUP_IN_PROGRESS
          - BACKUP_COMPLETED
          x-ms-enum:
            name: SyncDatabaseMigrationReportingState
            modelAsString: true
        incomingChanges:
          type: integer
          format: int64
          description: Number of incoming changes
          readOnly: true
        appliedChanges:
          type: integer
          format: int64
          description: Number of applied changes
          readOnly: true
        cdcInsertCounter:
          type: integer
          format: int64
          description: Number of cdc inserts
          readOnly: true
        cdcDeleteCounter:
          type: integer
          format: int64
          description: Number of cdc deletes
          readOnly: true
        cdcUpdateCounter:
          type: integer
          format: int64
          description: Number of cdc updates
          readOnly: true
        fullLoadCompletedTables:
          type: integer
          format: int64
          description: Number of tables completed in full load
          readOnly: true
        fullLoadLoadingTables:
          type: integer
          format: int64
          description: Number of tables loading in full load
          readOnly: true
        fullLoadQueuedTables:
          type: integer
          format: int64
          description: Number of tables queued in full load
          readOnly: true
        fullLoadErroredTables:
          type: integer
          format: int64
          description: Number of tables errored in full load
          readOnly: true
        initializationCompleted:
          type: boolean
          description: Indicates if initial load (full load) has been completed
          readOnly: true
        latency:
          type: integer
          format: int64
          description: CDC apply latency
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutputTableLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        tableName:
          type: string
          description: Name of the table
          readOnly: true
        databaseName:
          type: string
          description: Name of the database
          readOnly: true
        cdcInsertCounter:
          type: integer
          format: int64
          description: Number of applied inserts
          readOnly: true
        cdcUpdateCounter:
          type: integer
          format: int64
          description: Number of applied updates
          readOnly: true
        cdcDeleteCounter:
          type: integer
          format: int64
          description: Number of applied deletes
          readOnly: true
        fullLoadEstFinishTime:
          type: string
          format: date-time
          description: Estimate to finish full load
          readOnly: true
        fullLoadStartedOn:
          type: string
          format: date-time
          description: Full load start time
          readOnly: true
        fullLoadEndedOn:
          type: string
          format: date-time
          description: Full load end time
          readOnly: true
        fullLoadTotalRows:
          type: integer
          format: int64
          description: Number of rows applied in full load
          readOnly: true
        state:
          description: Current state of the table migration
          readOnly: true
          type: string
          enum:
          - BEFORE_LOAD
          - FULL_LOAD
          - COMPLETED
          - CANCELED
          - ERROR
          - FAILED
          x-ms-enum:
            name: SyncTableMigrationState
            modelAsString: true
        totalChangesApplied:
          type: integer
          format: int64
          description: Total number of applied changes
          readOnly: true
        dataErrorsCounter:
          type: integer
          format: int64
          description: Number of data errors occurred
          readOnly: true
        lastModifiedTime:
          type: string
          format: date-time
          description: Last modified time on target
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: TableLevelOutput
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutputError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        error:
          description: Migration error
          readOnly: true
          type: object
          properties:
            message:
              type: string
              description: Error message
            actionableMessage:
              type: string
              description: Actionable steps for this exception
            filePath:
              type: string
              description: The path to the file where exception occurred
            lineNumber:
              type: string
              description: The line number where exception occurred
            hResult:
              type: integer
              description: Coded numerical value that is assigned to a specific exception
            stackTrace:
              type: string
              description: Stack trace
        events:
          type: array
          items:
            type: object
            description: Database migration errors for online migration
            properties:
              timestampString:
                type: string
                description: String value of timestamp.
                readOnly: true
              eventTypeString:
                description: Event type.
                type: string
                readOnly: true
              eventText:
                description: Event text.
                type: string
                readOnly: true
          description: List of error events
      required:
      - resultType
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: ErrorOutput
    MigratePostgreSqlAzureDbForPostgreSqlSyncTaskOutputDatabaseError:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        errorMessage:
          type: string
          description: Error message
        events:
          type: array
          items:
            type: object
            description: Database migration errors for online migration
            properties:
              timestampString:
                type: string
                description: String value of timestamp.
                readOnly: true
              eventTypeString:
                description: Event type.
                type: string
                readOnly: true
              eventText:
                description: Event text.
                type: string
                readOnly: true
          description: List of error events.
      required:
      - resultType
      description: Output for the task that migrates PostgreSQL databases to Azure
        Database for PostgreSQL for online migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelErrorOutput
    MigratePostgreSqlAzureDbForPostgreSqlSyncDatabaseInput:
      type: object
      description: Database specific information for PostgreSQL to Azure Database
        for PostgreSQL migration task inputs
      properties:
        name:
          type: string
          description: Name of the database
        id:
          type: string
          description: Result identifier
          readOnly: true
        targetDatabaseName:
          type: string
          description: 'Name of target database. Note: Target database will be truncated
            before starting migration.'
        migrationSetting:
          type: object
          description: Migration settings which tune the migration behavior
          additionalProperties: {}
        sourceSetting:
          type: object
          description: Source settings to tune source endpoint migration behavior
          additionalProperties:
            type: string
        targetSetting:
          type: object
          description: Target settings to tune target endpoint migration behavior
          additionalProperties:
            type: string
        selectedTables:
          type: array
          description: Tables selected for migration
          items:
            type: object
            description: Selected tables for the migration
            properties:
              name:
                type: string
                description: Name of the table to migrate
    MigratePostgreSqlAzureDbForPostgreSqlSyncDatabaseTableInput:
      type: object
      description: Selected tables for the migration
      properties:
        name:
          type: string
          description: Name of the table to migrate
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    PostgreSqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        serverName:
          type: string
          description: Name of the server
        dataSource:
          type: string
          description: 'Data source '
        serverVersion:
          type: string
          description: server version
        databaseName:
          type: string
          description: Name of the database
        port:
          type: integer
          description: Port for Server
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        additionalSettings:
          type: string
          description: Additional connection settings
        serverBrandVersion:
          type: string
          description: server brand version
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
      required:
      - type
      - serverName
      - port
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: PostgreSqlConnectionInfo
    ScenarioSource:
      type: string
      description: An enumeration of source type
      enum:
      - Access
      - DB2
      - MySQL
      - Oracle
      - SQL
      - Sybase
      - PostgreSQL
      - MongoDB
      - SQLRDS
      - MySQLRDS
      - PostgreSQLRDS
      x-ms-enum:
        name: ScenarioSource
        modelAsString: true
    ScenarioTarget:
      type: string
      description: An enumeration of target type
      enum:
      - SQLServer
      - SQLDB
      - SQLDW
      - SQLMI
      - AzureDBForMySql
      - AzureDBForPostgresSQL
      - MongoDB
      x-ms-enum:
        name: ScenarioTarget
        modelAsString: true
    ReplicateMigrationState:
      type: string
      description: Wrapper for replicate reported migration states.
      enum:
      - UNDEFINED
      - VALIDATING
      - PENDING
      - COMPLETE
      - ACTION_REQUIRED
      - FAILED
      x-ms-enum:
        name: ReplicateMigrationState
        modelAsString: true
    SyncDatabaseMigrationReportingState:
      type: string
      description: Enum of the different state of database level online migration.
      enum:
      - UNDEFINED
      - CONFIGURING
      - INITIALIAZING
      - STARTING
      - RUNNING
      - READY_TO_COMPLETE
      - COMPLETING
      - COMPLETE
      - CANCELLING
      - CANCELLED
      - FAILED
      - VALIDATING
      - VALIDATION_COMPLETE
      - VALIDATION_FAILED
      - RESTORE_IN_PROGRESS
      - RESTORE_COMPLETED
      - BACKUP_IN_PROGRESS
      - BACKUP_COMPLETED
      x-ms-enum:
        name: SyncDatabaseMigrationReportingState
        modelAsString: true
    SyncTableMigrationState:
      type: string
      description: Enum of the different state of table level online migration.
      enum:
      - BEFORE_LOAD
      - FULL_LOAD
      - COMPLETED
      - CANCELED
      - ERROR
      - FAILED
      x-ms-enum:
        name: SyncTableMigrationState
        modelAsString: true
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
    SyncMigrationDatabaseErrorEvent:
      type: object
      description: Database migration errors for online migration
      properties:
        timestampString:
          type: string
          description: String value of timestamp.
          readOnly: true
        eventTypeString:
          description: Event type.
          type: string
          readOnly: true
        eventText:
          description: Event text.
          type: string
          readOnly: true
