          readOnly: true
        lastStorageUpdate:
          type: string
          format: date-time
          description: Last time the storage was updated
          readOnly: true
        objectSummary:
          type: string
          description: Summary of object results in the migration
          additionalProperties:
            type: object
            description: Basic summary of a data item migration
            properties:
              name:
                type: string
                description: Name of the item
                readOnly: true
              startedOn:
                type: string
                format: date-time
                description: Migration start time
                readOnly: true
              endedOn:
                type: string
                format: date-time
                description: Migration end time
                readOnly: true
              state:
                description: Current state of migration
                readOnly: true
                type: string
                enum:
                - None
                - InProgress
                - Failed
                - Warning
                - Completed
                - Skipped
                - Stopped
                x-ms-enum:
                  name: MigrationState
                  modelAsString: true
              statusMessage:
                type: string
                description: Status message
                readOnly: true
              itemsCount:
                type: integer
                format: int64
                description: Number of items
                readOnly: true
              itemsCompletedCount:
                type: integer
                format: int64
                description: Number of successfully completed items
                readOnly: true
              errorPrefix:
                type: string
                description: Wildcard string prefix to use for querying all errors
                  of the item
                readOnly: true
              resultPrefix:
                type: string
                description: Wildcard string prefix to use for querying all sub-tem
                  results of the item
                readOnly: true
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates MySQL databases to Azure Database
        for MySQL for offline migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: DatabaseLevelOutput
