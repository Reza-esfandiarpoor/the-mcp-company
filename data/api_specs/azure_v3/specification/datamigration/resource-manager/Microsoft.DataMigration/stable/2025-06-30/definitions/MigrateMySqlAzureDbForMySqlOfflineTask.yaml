openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MigrateMySqlAzureDbForMySqlOfflineTaskInput:
      type: object
      description: Input for the task that migrates MySQL databases to Azure Database
        for MySQL for offline migrations
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            additionalSettings:
              type: string
              description: Additional connection settings
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MySqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            serverName:
              type: string
              description: Name of the server
            dataSource:
              type: string
              description: 'Data source '
            port:
              type: integer
              description: Port for Server
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            additionalSettings:
              type: string
              description: Additional connection settings
          required:
          - type
          - serverName
          - port
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MySqlConnectionInfo
        selectedDatabases:
          type: array
          description: Databases to migrate
          items:
            type: object
            description: Database specific information for offline MySQL to Azure
              Database for MySQL migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              targetDatabaseName:
                type: string
                description: 'Name of target database. Note: Target database will
                  be truncated before starting migration.'
              tableMap:
                type: object
                description: Mapping of source to target tables
                additionalProperties:
                  type: string
        makeSourceServerReadOnly:
          type: boolean
          description: Setting to set the source server read only
          default: false
        startedOn:
          type: string
          format: date-time
          description: Parameter to specify when the migration started
        optionalAgentSettings:
          type: object
          description: Optional parameters for fine tuning the data transfer rate
            during migration
          additionalProperties:
            type: string
        encryptedKeyForSecureFields:
          type: string
          description: encrypted key for secure fields
      required:
      - sourceConnectionInfo
      - targetConnectionInfo
      - selectedDatabases
    MigrateMySqlAzureDbForMySqlOfflineTaskOutput:
      type: object
      description: Output for the task that migrates MySQL databases to Azure Database
        for MySQL for offline migrations
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
      required:
      - resultType
      discriminator:
        propertyName: resultType
    MigrateMySqlAzureDbForMySqlOfflineTaskOutputMigrationLevel:
      type: object
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        resultType:
          description: Result type
          type: string
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        durationInSeconds:
          type: integer
          format: int64
          description: Duration of task execution in seconds.
          readOnly: true
        status:
          description: Current status of migration
          readOnly: true
          type: string
          enum:
          - Default
          - Connecting
          - SourceAndTargetSelected
          - SelectLogins
          - Configured
          - Running
          - Error
          - Stopped
          - Completed
          - CompletedWithWarnings
          x-ms-enum:
            name: MigrationStatus
            modelAsString: true
        statusMessage:
          type: string
          description: Migration status message
          readOnly: true
        message:
          type: string
          description: Migration progress message
          readOnly: true
        databases:
          type: string
          description: Selected databases as a map from database name to database
            id
          additionalProperties:
            type: string
        databaseSummary:
          type: string
          description: Summary of database results in the migration
          additionalProperties:
            type: object
            properties:
              name:
                type: string
                description: Name of the item
                readOnly: true
              startedOn:
                type: string
                format: date-time
                description: Migration start time
                readOnly: true
              endedOn:
                type: string
                format: date-time
                description: Migration end time
                readOnly: true
              state:
                description: Current state of migration
                readOnly: true
                type: string
                enum:
                - None
                - InProgress
                - Failed
                - Warning
                - Completed
                - Skipped
                - Stopped
                x-ms-enum:
                  name: MigrationState
                  modelAsString: true
              statusMessage:
                type: string
                description: Status message
                readOnly: true
              itemsCount:
                type: integer
                format: int64
                description: Number of items
                readOnly: true
              itemsCompletedCount:
                type: integer
                format: int64
                description: Number of successfully completed items
                readOnly: true
              errorPrefix:
                type: string
                description: Wildcard string prefix to use for querying all errors
                  of the item
                readOnly: true
              resultPrefix:
                type: string
                description: Wildcard string prefix to use for querying all sub-tem
                  results of the item
                readOnly: true
              sizeMB:
                type: number
                format: double
                description: Size of the database in megabytes
                readOnly: true
            description: Basic summary of a data item migration
          readOnly: true
        migrationReportResult:
          type: object
          description: Migration Report Result, provides unique url for downloading
            your migration report.
          properties:
            id:
              type: string
              description: Migration validation result identifier
            reportUrl:
              type: string
              description: The url of the report.
        sourceServerVersion:
          type: string
          description: Source server version
          readOnly: true
        sourceServerBrandVersion:
          type: string
          description: Source server brand version
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        exceptionsAndWarnings:
          description: Migration exceptions and warnings.
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
        lastStorageUpdate:
          type: string
          format: date-time
          description: Last time the storage was updated
          readOnly: true
      required:
      - resultType
      description: Output for the task that migrates MySQL databases to Azure Database
        for MySQL for offline migrations
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: MigrationLevelOutput
    MigrateMySqlAzureDbForMySqlOfflineTaskOutputDatabaseLevel:
      type: object
