openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Database:
      type: object
      description: Information about a single database
      properties:
        id:
          type: string
          description: Unique identifier for the database
        name:
          type: string
          description: Name of the database
        compatibilityLevel:
          description: SQL Server compatibility level of database
          type: string
          enum:
          - CompatLevel80
          - CompatLevel90
          - CompatLevel100
          - CompatLevel110
          - CompatLevel120
          - CompatLevel130
          - CompatLevel140
          x-ms-enum:
            name: DatabaseCompatLevel
            modelAsString: true
        collation:
          type: string
          description: Collation name of the database
        serverName:
          type: string
          description: Name of the server
        fqdn:
          type: string
          description: Fully qualified name
        installId:
          type: string
          description: Install id of the database
        serverVersion:
          type: string
          description: Version of the server
        serverEdition:
          type: string
          description: Edition of the server
        serverLevel:
          type: string
          description: Product level of the server (RTM, SP, CTP).
        serverDefaultDataPath:
          type: string
          description: Default path of the data files
        serverDefaultLogPath:
          type: string
          description: Default path of the log files
        serverDefaultBackupPath:
          type: string
          description: Default path of the backup folder
        serverCoreCount:
          type: integer
          description: Number of cores on the server
        serverVisibleOnlineCoreCount:
          type: integer
          description: Number of cores on the server that have VISIBLE ONLINE status
        databaseState:
          description: State of the database
          type: string
          enum:
          - Online
          - Restoring
          - Recovering
          - RecoveryPending
          - Suspect
          - Emergency
          - Offline
          - Copying
          - OfflineSecondary
          x-ms-enum:
            name: DatabaseState
            modelAsString: true
        serverId:
          type: string
          description: The unique Server Id
    DatabaseCompatLevel:
      type: string
      description: An enumeration of SQL Server database compatibility levels
      enum:
      - CompatLevel80
      - CompatLevel90
      - CompatLevel100
      - CompatLevel110
      - CompatLevel120
      - CompatLevel130
      - CompatLevel140
      x-ms-enum:
        name: DatabaseCompatLevel
        modelAsString: true
    DatabaseState:
      type: string
      description: An enumeration of SQL Server Database states
      enum:
      - Online
      - Restoring
      - Recovering
      - RecoveryPending
      - Suspect
      - Emergency
      - Offline
      - Copying
      - OfflineSecondary
      x-ms-enum:
        name: DatabaseState
        modelAsString: true
    DatabaseObjectType:
      type: string
      description: An enumeration of type of objects
      enum:
      - StoredProcedures
      - Table
      - User
      - View
      - Function
      x-ms-enum:
        name: ObjectType
        modelAsString: true
    ScenarioSource:
      type: string
      description: An enumeration of source type
      enum:
      - Access
      - DB2
      - MySQL
      - Oracle
      - SQL
      - Sybase
      - PostgreSQL
      - MongoDB
      - SQLRDS
      - MySQLRDS
      - PostgreSQLRDS
      x-ms-enum:
        name: ScenarioSource
        modelAsString: true
    ScenarioTarget:
      type: string
      description: An enumeration of target type
      enum:
      - SQLServer
      - SQLDB
      - SQLDW
      - SQLMI
      - AzureDBForMySql
      - AzureDBForPostgresSQL
      - MongoDB
      x-ms-enum:
        name: ScenarioTarget
        modelAsString: true
    ReplicateMigrationState:
      type: string
      description: Wrapper for replicate reported migration states.
      enum:
      - UNDEFINED
      - VALIDATING
      - PENDING
      - COMPLETE
      - ACTION_REQUIRED
      - FAILED
      x-ms-enum:
        name: ReplicateMigrationState
        modelAsString: true
    DatabaseObjectName:
      type: object
      description: A representation of the name of an object in a database
      properties:
        databaseName:
          type: string
          description: The unescaped name of the database containing the object
          readOnly: true
        objectName:
          type: string
          description: The unescaped name of the object
          readOnly: true
        schemaName:
          type: string
          description: The unescaped name of the schema containing the object
          readOnly: true
        objectType:
          description: Type of the object in the database
          type: string
          enum:
          - StoredProcedures
          - Table
          - User
          - View
          - Function
          x-ms-enum:
            name: ObjectType
            modelAsString: true
    DataItemMigrationSummaryResult:
      type: object
      description: Basic summary of a data item migration
      properties:
        name:
          type: string
          description: Name of the item
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        state:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - None
          - InProgress
          - Failed
          - Warning
          - Completed
          - Skipped
          - Stopped
          x-ms-enum:
            name: MigrationState
            modelAsString: true
        statusMessage:
          type: string
          description: Status message
          readOnly: true
        itemsCount:
          type: integer
          format: int64
          description: Number of items
          readOnly: true
        itemsCompletedCount:
          type: integer
          format: int64
          description: Number of successfully completed items
          readOnly: true
        errorPrefix:
          type: string
          description: Wildcard string prefix to use for querying all errors of the
            item
          readOnly: true
        resultPrefix:
          type: string
          description: Wildcard string prefix to use for querying all sub-tem results
            of the item
          readOnly: true
    DataMigrationProjectMetadata:
      type: object
      description: Common metadata for migration projects
      properties:
        sourceServerName:
          type: string
          description: Source server name
          readOnly: true
        sourceServerPort:
          type: string
          description: Source server port number
          readOnly: true
        sourceUsername:
          type: string
          description: Source username
          readOnly: true
        targetServerName:
          type: string
          description: Target server name
          readOnly: true
        targetUsername:
          type: string
          description: Target username
          readOnly: true
        targetDbName:
          type: string
          description: Target database name
          readOnly: true
        targetUsingWinAuth:
          type: boolean
          description: Whether target connection is Windows authentication
          readOnly: true
        selectedMigrationTables:
          type: array
          description: List of tables selected for migration
          readOnly: true
          items:
            type: object
            description: Metadata for tables selected in migration project
            properties:
              sourceTableName:
                type: string
                description: Source table name
                readOnly: true
              targetTableName:
                type: string
                description: Target table name
                readOnly: true
    DatabaseTable:
      type: object
      description: Table properties
      properties:
        hasRows:
          type: boolean
          description: Indicates whether table is empty or not
          readOnly: true
        name:
          type: string
          description: Schema-qualified name of the table
          readOnly: true
    GetProjectDetailsNonSqlTaskInput:
      type: object
      description: Input for the task that reads configuration from project artifacts
      properties:
        projectName:
          type: string
          description: Name of the migration project
        projectLocation:
          type: string
          description: A URL that points to the location to access project artifacts
      required:
      - projectName
      - projectLocation
    SqlServerSqlMISyncTaskInput:
      type: object
      description: Input for task that migrates SQL Server databases to Azure SQL
        Database Managed Instance online scenario.
      properties:
        selectedDatabases:
          description: Databases to migrate
          type: array
          items:
            type: object
            description: Database specific information for SQL to Azure SQL DB Managed
              Instance migration task inputs
            properties:
              name:
                type: string
                description: Name of the database
              restoreDatabaseName:
                type: string
                description: Name of the database at destination
              backupFileShare:
                description: Backup file share information for backing up this database.
                type: object
                properties:
                  userName:
                    type: string
                    description: User name credential to connect to the share location
                  password:
                    type: string
                    description: Password credential used to connect to the share
                      location.
                  path:
                    type: string
                    description: The folder path for this share.
                required:
                - path
              backupFilePaths:
                type: array
                description: The list of backup files to be used in case of existing
                  backups.
                items:
                  type: string
              id:
                type: string
                description: id of the database
            required:
            - name
            - restoreDatabaseName
        backupFileShare:
          description: Backup file share information for all selected databases.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
            password:
              type: string
              description: Password credential used to connect to the share location.
            path:
              type: string
              description: The folder path for this share.
          required:
          - path
        storageResourceId:
          type: string
          description: Fully qualified resourceId of storage
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            managedInstanceResourceId:
              type: string
              description: Resource id for Azure SQL database Managed instance
          required:
          - type
          - managedInstanceResourceId
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: MiSqlConnectionInfo
        azureApp:
          description: Azure Active Directory Application the DMS (classic) instance
            will use to connect to the target instance of Azure SQL Database Managed
            Instance and the Azure Storage Account
          type: object
          properties:
            applicationId:
              type: string
              description: Application ID of the Azure Active Directory Application
            appKey:
              type: string
              description: Key used to authenticate to the Azure Active Directory
                Application
            tenantId:
              type: string
              description: Tenant id of the customer
            ignoreAzurePermissions:
              type: boolean
              description: Ignore checking azure permissions on the AAD app
      required:
      - selectedDatabases
      - azureApp
      - sourceConnectionInfo
      - targetConnectionInfo
      - storageResourceId
    MigrationState:
      type: string
      description: Current state of migration
      enum:
      - None
      - InProgress
      - Failed
      - Warning
      - Completed
      - Skipped
      - Stopped
      x-ms-enum:
        name: MigrationState
        modelAsString: true
    MigrationStatus:
      type: string
      description: Current status of migration
      enum:
      - Default
      - Connecting
      - SourceAndTargetSelected
      - SelectLogins
      - Configured
      - Running
      - Error
      - Stopped
      - Completed
      - CompletedWithWarnings
      x-ms-enum:
        name: MigrationStatus
        modelAsString: true
    SqlMigrationTaskInput:
      type: object
      description: Base class for migration task input
      properties:
        sourceConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
      required:
      - sourceConnectionInfo
      - targetConnectionInfo
    MigrateSqlServerSqlDbDatabaseInput:
      type: object
      description: Database specific information for SQL to Azure SQL DB migration
        task inputs
      properties:
        name:
          type: string
          description: Name of the database
        targetDatabaseName:
          type: string
          description: 'Name of target database. Note: Target database will be truncated
            before starting migration.'
        makeSourceDbReadOnly:
          type: boolean
          description: Whether to set database read only before migration
        tableMap:
          type: object
          description: Mapping of source to target tables
          additionalProperties:
            type: string
        schemaSetting:
          type: object
          description: Settings selected for DB schema migration.
        id:
          type: string
          description: id of the database
    MigrateSqlServerSqlDbSyncDatabaseInput:
      type: object
      description: Database specific information for SQL to Azure SQL DB sync migration
        task inputs
      properties:
        id:
          type: string
          description: Unique identifier for database
        name:
          type: string
          description: Name of database
        targetDatabaseName:
          type: string
          description: Target database name
        schemaName:
          type: string
          description: Schema name to be migrated
        tableMap:
          type: object
          description: Mapping of source to target tables
          additionalProperties:
            type: string
        migrationSetting:
          type: object
          description: Migration settings which tune the migration behavior
          additionalProperties:
            type: string
        sourceSetting:
          type: object
          description: Source settings to tune source endpoint migration behavior
          additionalProperties:
            type: string
        targetSetting:
          type: object
          description: Target settings to tune target endpoint migration behavior
          additionalProperties:
            type: string
    MigrationTableMetadata:
      type: object
      description: Metadata for tables selected in migration project
      properties:
        sourceTableName:
          type: string
          description: Source table name
          readOnly: true
        targetTableName:
          type: string
          description: Target table name
          readOnly: true
    NonSqlMigrationTaskInput:
      type: object
      description: Base class for non sql migration task input
      properties:
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        targetDatabaseName:
          type: string
          description: Target database name
        projectName:
          type: string
          description: Name of the migration project
        projectLocation:
          type: string
          description: A URL that points to the drop location to access project artifacts
        selectedTables:
          type: array
          description: Metadata of the tables selected for migration
          items:
            type: object
            description: Defines metadata for table to be migrated
            properties:
              sourceName:
                type: string
                description: Source table name
      required:
      - targetConnectionInfo
      - targetDatabaseName
      - projectName
      - projectLocation
      - selectedTables
    NonSqlDataMigrationTable:
      type: object
      description: Defines metadata for table to be migrated
      properties:
        sourceName:
          type: string
          description: Source table name
    NonSqlMigrationTaskOutput:
      type: object
      description: Base class for non sql migration task output
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        startedOn:
          type: string
          format: date-time
          description: Migration start time
          readOnly: true
        endedOn:
          type: string
          format: date-time
          description: Migration end time
          readOnly: true
        status:
          description: Current state of migration
          readOnly: true
          type: string
          enum:
          - Default
          - Connecting
          - SourceAndTargetSelected
          - SelectLogins
          - Configured
          - Running
          - Error
          - Stopped
          - Completed
          - CompletedWithWarnings
          x-ms-enum:
            name: MigrationStatus
            modelAsString: true
        dataMigrationTableResults:
          type: string
          description: Results of the migration. The key contains the table name and
            the value the table result object
          additionalProperties:
            type: object
            description: Object used to report the data migration results of a table
            properties:
              resultCode:
                type: string
                description: Result code of the data migration
                enum:
                - Initial
                - Completed
                - ObjectNotExistsInSource
                - ObjectNotExistsInTarget
                - TargetObjectIsInaccessible
                - FatalError
                x-ms-enum:
                  name: DataMigrationResultCode
                  modelAsString: true
                readOnly: true
              sourceName:
                type: string
                description: Name of the source table
                readOnly: true
              targetName:
                type: string
                description: Name of the target table
                readOnly: true
              sourceRowCount:
                type: integer
                format: int64
                description: Number of rows in the source table
                readOnly: true
              targetRowCount:
                type: integer
                format: int64
                description: Number of rows in the target table
                readOnly: true
              elapsedTimeInMiliseconds:
                type: number
                format: double
                description: Time taken to migrate the data
                readOnly: true
              errors:
                type: array
                items:
                  type: object
                  description: Migration Task errors
                  properties:
                    message:
                      type: string
                      description: Error description
                      readOnly: true
                    type:
                      type: string
                      description: Error type
                      enum:
                      - Default
                      - Warning
                      - Error
                      x-ms-enum:
                        name: ErrorType
                        modelAsString: true
                description: List of errors, if any, during migration
                readOnly: true
          readOnly: true
        progressMessage:
          type: string
          description: Message about the progress of the migration
          readOnly: true
        sourceServerName:
          type: string
          description: Name of source server
          readOnly: true
        targetServerName:
          type: string
          description: Name of target server
          readOnly: true
    NonSqlDataMigrationTableResult:
      type: object
      description: Object used to report the data migration results of a table
      properties:
        resultCode:
          type: string
          description: Result code of the data migration
          enum:
          - Initial
          - Completed
          - ObjectNotExistsInSource
          - ObjectNotExistsInTarget
          - TargetObjectIsInaccessible
          - FatalError
          x-ms-enum:
            name: DataMigrationResultCode
            modelAsString: true
          readOnly: true
        sourceName:
          type: string
          description: Name of the source table
          readOnly: true
        targetName:
          type: string
          description: Name of the target table
          readOnly: true
        sourceRowCount:
          type: integer
          format: int64
          description: Number of rows in the source table
          readOnly: true
        targetRowCount:
          type: integer
          format: int64
          description: Number of rows in the target table
          readOnly: true
        elapsedTimeInMiliseconds:
          type: number
          format: double
          description: Time taken to migrate the data
          readOnly: true
        errors:
          type: array
          items:
            type: object
            description: Migration Task errors
            properties:
              message:
                type: string
                description: Error description
                readOnly: true
              type:
                type: string
                description: Error type
                enum:
                - Default
                - Warning
                - Error
                x-ms-enum:
                  name: ErrorType
                  modelAsString: true
          description: List of errors, if any, during migration
          readOnly: true
    DataMigrationError:
      type: object
      description: Migration Task errors
      properties:
        message:
          type: string
          description: Error description
          readOnly: true
        type:
          type: string
          description: Error type
          enum:
          - Default
          - Warning
          - Error
          x-ms-enum:
            name: ErrorType
            modelAsString: true
    ErrorType:
      type: string
      description: Error type
      enum:
      - Default
      - Warning
      - Error
      x-ms-enum:
        name: ErrorType
        modelAsString: true
    MigrateSqlServerSqlMIDatabaseInput:
      type: object
      description: Database specific information for SQL to Azure SQL DB Managed Instance
        migration task inputs
      properties:
        name:
          type: string
          description: Name of the database
        restoreDatabaseName:
          type: string
          description: Name of the database at destination
        backupFileShare:
          description: Backup file share information for backing up this database.
          type: object
          properties:
            userName:
              type: string
              description: User name credential to connect to the share location
