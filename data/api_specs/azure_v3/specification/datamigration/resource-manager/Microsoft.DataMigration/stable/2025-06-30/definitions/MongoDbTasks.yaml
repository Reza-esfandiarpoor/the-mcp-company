            - dataSize
            - documentCount
            - name
            - qualifiedName
            - databaseName
            - isCapped
            - isSystemCollection
            - isView
            - supportsSharding
            description: Describes a database or collection within a MongoDB data
              source
          description: A list of supported collections in a MongoDB database
        supportsSharding:
          type: boolean
          description: Whether the database has sharding enabled. Note that the migration
            task will enable sharding on the target if necessary.
      required:
