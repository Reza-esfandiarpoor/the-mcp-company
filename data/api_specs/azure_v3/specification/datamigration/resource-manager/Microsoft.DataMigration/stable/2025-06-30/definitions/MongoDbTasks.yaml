openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    MongoDbCancelCommand:
      type: object
      properties:
        commandType:
          enum:
          - Migrate.Sync.Complete.Database
          - Migrate.SqlServer.AzureDbSqlMi.Complete
          - cancel
          - finish
          - restart
          x-ms-enum:
            name: CommandType
            modelAsString: true
          description: Command type.
          type: string
        errors:
          type: array
          items:
            type: object
            description: Error information in OData format.
            properties:
              code:
                type: string
                description: The machine-readable description of the error, such as
                  'InvalidRequest' or 'InternalServerError'
              message:
                type: string
                description: The human-readable description of the error
              details:
                type: array
                items:
                  type: object
                  description: Error information in OData format.
                  properties:
                    code:
                      type: string
                      description: The machine-readable description of the error,
                        such as 'InvalidRequest' or 'InternalServerError'
                    message:
                      type: string
                      description: The human-readable description of the error
                    details:
                      type: array
                      items:
                        type: object
                        description: Error information in OData format.
                        properties:
                          code:
                            type: string
                            description: The machine-readable description of the error,
                              such as 'InvalidRequest' or 'InternalServerError'
                          message:
                            type: string
                            description: The human-readable description of the error
                      description: Inner errors that caused this error
                description: Inner errors that caused this error
          description: Array of errors. This is ignored if submitted.
          readOnly: true
        state:
          type: string
          description: The state of the command. This is ignored if submitted.
          enum:
          - Unknown
          - Accepted
          - Running
          - Succeeded
          - Failed
          x-ms-enum:
            name: CommandState
            modelAsString: true
          readOnly: true
        input:
          description: Command input
          type: object
          properties:
            objectName:
              type: string
              description: The qualified name of a database or collection to act upon,
                or null to act upon the entire migration
      required:
      - commandType
      description: Base class for all types of DMS (classic) command properties. If
        command is not supported by current client, this object is returned.
      discriminator:
        propertyName: commandType
      x-ms-discriminator-value: cancel
    MongoDbClusterInfo:
      type: object
      description: Describes a MongoDB data source
      properties:
        databases:
          type: array
          items:
            type: object
            properties:
              averageDocumentSize:
                type: integer
                format: int64
                description: The average document size, or -1 if the average size
                  is unknown
              dataSize:
                type: integer
                format: int64
                description: The estimated total data size, in bytes, or -1 if the
                  size is unknown.
              documentCount:
                type: integer
                format: int64
                description: The estimated total number of documents, or -1 if the
                  document count is unknown
              name:
                type: string
                description: The unqualified name of the database or collection
              qualifiedName:
                type: string
                description: The qualified name of the database or collection. For
                  a collection, this is the database-qualified name.
              collections:
                type: array
                items:
                  type: object
                  properties:
                    averageDocumentSize:
                      type: integer
                      format: int64
                      description: The average document size, or -1 if the average
                        size is unknown
                    dataSize:
                      type: integer
                      format: int64
                      description: The estimated total data size, in bytes, or -1
                        if the size is unknown.
                    documentCount:
                      type: integer
                      format: int64
                      description: The estimated total number of documents, or -1
                        if the document count is unknown
                    name:
                      type: string
                      description: The unqualified name of the database or collection
                    qualifiedName:
                      type: string
                      description: The qualified name of the database or collection.
                        For a collection, this is the database-qualified name.
                    databaseName:
                      type: string
                      description: The name of the database containing the collection
                    isCapped:
                      type: boolean
                      description: Whether the collection is a capped collection (i.e.
                        whether it has a fixed size and acts like a circular buffer)
                    isSystemCollection:
                      type: boolean
                      description: Whether the collection is system collection
                    isView:
                      type: boolean
                      description: Whether the collection is a view of another collection
                    shardKey:
                      description: The shard key on the collection, or null if the
                        collection is not sharded
                      type: object
                      properties:
                        fields:
                          type: array
                          items:
                            type: object
                            description: Describes a field reference within a MongoDB
                              shard key
                            properties:
                              name:
                                type: string
                                description: The name of the field
                              order:
                                type: string
                                description: The field ordering
                                enum:
                                - Forward
                                - Reverse
                                - Hashed
                                x-ms-enum:
                                  name: MongoDbShardKeyOrder
                                  modelAsString: true
                            required:
                            - name
                            - order
                          description: The fields within the shard key
                        isUnique:
                          type: boolean
                          description: Whether the shard key is unique
                      required:
                      - fields
                      - isUnique
                    supportsSharding:
                      type: boolean
                      description: Whether the database has sharding enabled. Note
                        that the migration task will enable sharding on the target
                        if necessary.
                    viewOf:
                      type: string
                      description: The name of the collection that this is a view
                        of, if IsView is true
                  required:
                  - averageDocumentSize
                  - dataSize
                  - documentCount
                  - name
                  - qualifiedName
                  - databaseName
                  - isCapped
                  - isSystemCollection
                  - isView
                  - supportsSharding
                  description: Describes a database or collection within a MongoDB
                    data source
                description: A list of supported collections in a MongoDB database
              supportsSharding:
                type: boolean
                description: Whether the database has sharding enabled. Note that
                  the migration task will enable sharding on the target if necessary.
            required:
            - averageDocumentSize
            - dataSize
            - documentCount
            - name
            - qualifiedName
            - collections
            - supportsSharding
            description: Describes a database or collection within a MongoDB data
              source
          description: A list of non-system databases in the cluster
        supportsSharding:
          type: boolean
          description: Whether the cluster supports sharded collections
        type:
          type: string
          description: The type of data source
          enum:
          - BlobContainer
          - CosmosDb
          - MongoDb
          x-ms-enum:
            name: MongoDbClusterType
            modelAsString: true
        version:
          type: string
          description: The version of the data source in the form x.y.z (e.g. 3.6.7).
            Not used if Type is BlobContainer.
      required:
      - databases
      - supportsSharding
      - type
      - version
    MongoDbCollectionInfo:
      type: object
      properties:
        averageDocumentSize:
          type: integer
          format: int64
          description: The average document size, or -1 if the average size is unknown
        dataSize:
          type: integer
          format: int64
          description: The estimated total data size, in bytes, or -1 if the size
            is unknown.
        documentCount:
          type: integer
          format: int64
          description: The estimated total number of documents, or -1 if the document
            count is unknown
        name:
          type: string
          description: The unqualified name of the database or collection
        qualifiedName:
          type: string
          description: The qualified name of the database or collection. For a collection,
            this is the database-qualified name.
        databaseName:
          type: string
          description: The name of the database containing the collection
        isCapped:
          type: boolean
          description: Whether the collection is a capped collection (i.e. whether
            it has a fixed size and acts like a circular buffer)
        isSystemCollection:
          type: boolean
          description: Whether the collection is system collection
        isView:
          type: boolean
          description: Whether the collection is a view of another collection
        shardKey:
          description: The shard key on the collection, or null if the collection
            is not sharded
          type: object
          properties:
            fields:
              type: array
              items:
                type: object
                description: Describes a field reference within a MongoDB shard key
                properties:
                  name:
                    type: string
                    description: The name of the field
                  order:
                    type: string
                    description: The field ordering
                    enum:
                    - Forward
                    - Reverse
                    - Hashed
                    x-ms-enum:
                      name: MongoDbShardKeyOrder
                      modelAsString: true
                required:
                - name
                - order
              description: The fields within the shard key
            isUnique:
              type: boolean
              description: Whether the shard key is unique
          required:
          - fields
          - isUnique
        supportsSharding:
          type: boolean
          description: Whether the database has sharding enabled. Note that the migration
            task will enable sharding on the target if necessary.
        viewOf:
          type: string
          description: The name of the collection that this is a view of, if IsView
            is true
      required:
      - averageDocumentSize
      - dataSize
      - documentCount
      - name
      - qualifiedName
      - databaseName
      - isCapped
      - isSystemCollection
      - isView
      - supportsSharding
      description: Describes a database or collection within a MongoDB data source
    MongoDbCollectionProgress:
      type: object
      properties:
        bytesCopied:
          type: integer
          format: int64
          description: The number of document bytes copied during the Copying stage
        documentsCopied:
          type: integer
          format: int64
          description: The number of documents copied during the Copying stage
        elapsedTime:
          type: string
          description: The elapsed time in the format [ddd.]hh:mm:ss[.fffffff] (i.e.
            TimeSpan format)
        errors:
          type: object
          description: The errors and warnings that have occurred for the current
            object. The keys are the error codes.
          additionalProperties:
            type: object
            description: Describes an error or warning that occurred during a MongoDB
              migration
            properties:
              code:
                type: string
                description: The non-localized, machine-readable code that describes
                  the error or warning
              count:
                type: integer
                format: int32
                description: The number of times the error or warning has occurred
              message:
                type: string
                description: The localized, human-readable message that describes
                  the error or warning
              type:
                type: string
                description: The type of error or warning
                enum:
                - Error
                - ValidationError
                - Warning
                x-ms-enum:
                  name: MongoDbErrorType
                  modelAsString: true
        eventsPending:
          type: integer
          format: int64
          description: The number of oplog events awaiting replay
        eventsReplayed:
          type: integer
          format: int64
          description: The number of oplog events replayed so far
        lastEventTime:
          type: string
          format: date-time
          description: The timestamp of the last oplog event received, or null if
            no oplog event has been received yet
        lastReplayTime:
          type: string
          format: date-time
          description: The timestamp of the last oplog event replayed, or null if
            no oplog event has been replayed yet
        name:
          type: string
          description: The name of the progress object. For a collection, this is
            the unqualified collection name. For a database, this is the database
            name. For the overall migration, this is null.
        qualifiedName:
          type: string
          description: The qualified name of the progress object. For a collection,
            this is the database-qualified name. For a database, this is the database
            name. For the overall migration, this is null.
        resultType:
          type: string
          description: The type of progress object
          enum:
          - Migration
          - Database
          - Collection
        state:
          type: string
          enum:
          - NotStarted
          - ValidatingInput
          - Initializing
          - Restarting
          - Copying
          - InitialReplay
          - Replaying
          - Finalizing
          - Complete
          - Canceled
          - Failed
          x-ms-enum:
            name: MongoDbMigrationState
            modelAsString: true
        totalBytes:
          type: integer
          format: int64
          description: The total number of document bytes on the source at the beginning
            of the Copying stage, or -1 if the total size was unknown
        totalDocuments:
          type: integer
          format: int64
          description: The total number of documents on the source at the beginning
            of the Copying stage, or -1 if the total count was unknown
      required:
      - bytesCopied
      - documentsCopied
      - elapsedTime
      - errors
      - eventsPending
      - eventsReplayed
      - resultType
      - state
      - totalBytes
      - totalDocuments
      description: Base class for MongoDB migration outputs
      discriminator:
        propertyName: resultType
      x-ms-discriminator-value: Collection
    MongoDbCollectionSettings:
      type: object
      description: Describes how an individual MongoDB collection should be migrated
      properties:
        canDelete:
          type: boolean
          description: Whether the migrator is allowed to drop the target collection
