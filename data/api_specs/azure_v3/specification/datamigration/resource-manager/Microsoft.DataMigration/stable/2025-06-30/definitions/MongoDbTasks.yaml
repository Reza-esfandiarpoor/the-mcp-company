              name:
                type: string
                description: The unqualified name of the database or collection
              qualifiedName:
                type: string
                description: The qualified name of the database or collection. For
                  a collection, this is the database-qualified name.
              databaseName:
                type: string
                description: The name of the database containing the collection
              isCapped:
                type: boolean
                description: Whether the collection is a capped collection (i.e. whether
