                type: object
                properties:
                  fields:
                    type: array
                    items:
                      type: object
                      description: Describes a field reference within a MongoDB shard
                        key
                      properties:
                        name:
                          type: string
                          description: The name of the field
                        order:
                          type: string
                          description: The field ordering
                          enum:
                          - Forward
