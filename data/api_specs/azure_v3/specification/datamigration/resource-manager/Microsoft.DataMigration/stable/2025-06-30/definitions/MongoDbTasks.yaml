              description: Whether the shard key is unique
          required:
          - fields
        targetRUs:
          type: integer
          format: int32
          description: The RUs that should be configured on a CosmosDB target, or
            null to use the default. This has no effect on non-CosmosDB targets.
    MongoDbCommandInput:
      type: object
      description: Describes the input to the 'cancel' and 'restart' MongoDB migration
        commands
      properties:
        objectName:
          type: string
          description: The qualified name of a database or collection to act upon,
            or null to act upon the entire migration
