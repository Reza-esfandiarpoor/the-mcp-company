openapi: 3.0.0
info:
  title: Azure Database Migration Service (classic) Resource Provider
  version: 2025-06-30
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ConnectToTargetSqlMITaskInput:
      type: object
      description: Input for the task that validates connection to Azure SQL Database
        Managed Instance.
      properties:
        targetConnectionInfo:
          type: object
          properties:
            type:
              type: string
              description: Type of connection info
            userName:
              type: string
              description: User name
            password:
              type: string
              description: Password credential.
            dataSource:
              type: string
              description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
            serverName:
              type: string
              description: name of the server
            port:
              type: integer
              description: Port for Server
            serverVersion:
              type: string
              description: server version
            serverBrandVersion:
              type: string
              description: server brand version
            resourceId:
              type: string
              description: Represents the ID of an HTTP resource represented by an
                Azure resource provider.
            authentication:
              description: Authentication type to use for connection
              type: string
              enum:
              - None
              - WindowsAuthentication
              - SqlAuthentication
              - ActiveDirectoryIntegrated
              - ActiveDirectoryPassword
              x-ms-enum:
                name: AuthenticationType
                modelAsString: true
            encryptConnection:
              type: boolean
              description: Whether to encrypt the connection
              default: true
            additionalSettings:
              type: string
              description: Additional connection settings
            trustServerCertificate:
              type: boolean
              description: Whether to trust the server certificate
              default: false
            platform:
              description: Server platform type for connection
              type: string
              enum:
              - SqlOnPrem
              x-ms-enum:
                name: SqlSourcePlatform
                modelAsString: true
          required:
          - type
          - dataSource
          description: Defines the connection properties of a server
          discriminator:
            propertyName: type
          x-ms-discriminator-value: SqlConnectionInfo
        collectLogins:
          type: boolean
          description: Flag for whether to collect logins from target SQL MI server.
          default: true
        collectAgentJobs:
          type: boolean
          description: Flag for whether to collect agent jobs from target SQL MI server.
          default: true
        validateSsisCatalogOnly:
          type: boolean
          description: Flag for whether to validate SSIS catalog is reachable on the
            target SQL MI server.
          default: false
      required:
      - targetConnectionInfo
    ConnectToTargetSqlMITaskOutput:
      type: object
      description: Output for the task that validates connection to Azure SQL Database
        Managed Instance.
      properties:
        id:
          type: string
          description: Result identifier
          readOnly: true
        targetServerVersion:
          type: string
          description: Target server version
          readOnly: true
        targetServerBrandVersion:
          type: string
          description: Target server brand version
          readOnly: true
        logins:
          type: array
          description: List of logins on the target server.
          items:
            type: string
          readOnly: true
        agentJobs:
          type: array
          description: List of agent jobs on the target server.
          items:
            type: string
          readOnly: true
        validationErrors:
          description: Validation errors
          type: array
          items:
            type: object
            description: Exception object for all custom exceptions
            properties:
              message:
                type: string
                description: Error message
              actionableMessage:
                type: string
                description: Actionable steps for this exception
              filePath:
                type: string
                description: The path to the file where exception occurred
              lineNumber:
                type: string
                description: The line number where exception occurred
              hResult:
                type: integer
                description: Coded numerical value that is assigned to a specific
                  exception
              stackTrace:
                type: string
                description: Stack trace
          readOnly: true
    ConnectionInfo:
      type: object
      description: Defines the connection properties of a server
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
      required:
      - type
      discriminator:
        propertyName: type
    AuthenticationType:
      type: string
      description: An enumeration of possible authentication types when connecting
      enum:
      - None
      - WindowsAuthentication
      - SqlAuthentication
      - ActiveDirectoryIntegrated
      - ActiveDirectoryPassword
      x-ms-enum:
        name: AuthenticationType
        modelAsString: true
    SqlServerSourcePlatform:
      type: string
      description: An enumeration of source platform types
      enum:
      - SqlOnPrem
      x-ms-enum:
        name: SqlSourcePlatform
        modelAsString: true
    SqlConnectionInfo:
      type: object
      properties:
        type:
          type: string
          description: Type of connection info
        userName:
          type: string
          description: User name
        password:
          type: string
          description: Password credential.
        dataSource:
          type: string
          description: Data source in the format Protocol:MachineName\SQLServerInstanceName,PortNumber
        serverName:
          type: string
          description: name of the server
        port:
          type: integer
          description: Port for Server
        serverVersion:
          type: string
          description: server version
        serverBrandVersion:
          type: string
          description: server brand version
        resourceId:
          type: string
          description: Represents the ID of an HTTP resource represented by an Azure
            resource provider.
        authentication:
          description: Authentication type to use for connection
          type: string
          enum:
          - None
          - WindowsAuthentication
          - SqlAuthentication
          - ActiveDirectoryIntegrated
          - ActiveDirectoryPassword
          x-ms-enum:
            name: AuthenticationType
            modelAsString: true
        encryptConnection:
          type: boolean
          description: Whether to encrypt the connection
          default: true
        additionalSettings:
          type: string
          description: Additional connection settings
        trustServerCertificate:
          type: boolean
          description: Whether to trust the server certificate
          default: false
        platform:
          description: Server platform type for connection
          type: string
          enum:
          - SqlOnPrem
          x-ms-enum:
            name: SqlSourcePlatform
            modelAsString: true
      required:
      - type
      - dataSource
      description: Defines the connection properties of a server
      discriminator:
        propertyName: type
      x-ms-discriminator-value: SqlConnectionInfo
    ReportableException:
      type: object
      description: Exception object for all custom exceptions
      properties:
        message:
          type: string
          description: Error message
        actionableMessage:
          type: string
          description: Actionable steps for this exception
        filePath:
          type: string
          description: The path to the file where exception occurred
        lineNumber:
          type: string
          description: The line number where exception occurred
        hResult:
          type: integer
          description: Coded numerical value that is assigned to a specific exception
        stackTrace:
          type: string
          description: Stack trace
