                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
                                (UTC)
                        tags:
                          type: object
                          description: Resource tags.
                          additionalProperties:
                            type: string
                          x-ms-mutability:
                          - read
                          - create
                          - update
                        location:
                          type: string
                          description: The geo-location where the resource lives
                          x-ms-mutability:
                          - read
                          - create
                        properties:
                          type: object
                          properties:
                            devBoxDefinitionType:
                              description: Indicates if the pool is created from an
                                existing Dev Box Definition or if one is provided
                                directly.
                              type: string
                              enum:
                              - Reference
                              - Value
                              x-ms-enum:
                                name: PoolDevBoxDefinitionType
                                modelAsString: true
                            devBoxDefinitionName:
                              description: Name of a Dev Box definition in parent
                                Project of this Pool. Will be ignored if devBoxDefinitionType
                                is Value.
                              type: string
                            devBoxDefinition:
                              description: A definition of the machines that are created
                                from this Pool. Will be ignored if devBoxDefinitionType
                                is Reference or not provided.
                              type: object
                              properties:
                                imageReference:
                                  description: Image reference information.
                                  type: object
                                  properties:
                                    id:
                                      description: Image ID, or Image version ID.
                                        When Image ID is provided, its latest version
                                        will be used.
                                      type: string
                                    exactVersion:
                                      type: string
                                      readOnly: true
                                      description: The actual version of the image
                                        after use. When id references a gallery image
                                        latest version, this will indicate the actual
                                        version in use.
                                sku:
                                  description: The SKU for Dev Boxes created from
                                    the Pool.
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: The name of the SKU. E.g. P3. It
                                        is typically a letter+number code
                                    tier:
                                      type: string
                                      description: This field is required to be implemented
                                        by the Resource Provider if the service has
                                        more than one tier, but is not required on
                                        a PUT.
