                                        name: SkuTier
                                        modelAsString: false
                                    size:
                                      type: string
                                      description: 'The SKU size. When the name field
                                        is the combination of tier and some other
                                        value, this would be the standalone code. '
                                    family:
                                      type: string
                                      description: If the service has different generations
                                        of hardware, for the same SKU, then that can
                                        be captured here.
                                    capacity:
                                      type: integer
                                      format: int32
                                      description: If the SKU supports scale out/in
                                        then the capacity integer should be included.
                                        If scale out/in is not possible for the resource
                                        this may be omitted.
                                  required:
                                  - name
                                activeImageReference:
                                  description: Image reference information for the
                                    currently active image (only populated during
                                    updates).
                                  readOnly: true
                                  type: object
                                  properties:
                                    id:
                                      description: Image ID, or Image version ID.
                                        When Image ID is provided, its latest version
                                        will be used.
                                      type: string
                                    exactVersion:
                                      type: string
                                      readOnly: true
                                      description: The actual version of the image
                                        after use. When id references a gallery image
                                        latest version, this will indicate the actual
                                        version in use.
                            networkConnectionName:
                              description: Name of a Network Connection in parent
                                Project of this Pool
                              type: string
                            licenseType:
                              description: Specifies the license type indicating the
                                caller has already acquired licenses for the Dev Boxes
                                that will be created.
                              enum:
                              - Windows_Client
                              type: string
                              x-ms-enum:
                                name: LicenseType
                                modelAsString: true
                            localAdministrator:
                              description: Indicates whether owners of Dev Boxes in
                                this pool are added as local administrators on the
                                Dev Box.
                              type: string
                              enum:
                              - Disabled
                              - Enabled
                              x-ms-enum:
                                name: LocalAdminStatus
                                modelAsString: true
                            stopOnDisconnect:
                              description: Stop on disconnect configuration settings
                                for Dev Boxes created in this pool.
                              type: object
                              properties:
                                status:
                                  description: Whether the feature to stop the Dev
                                    Box on disconnect once the grace period has lapsed
                                    is enabled.
                                  enum:
                                  - Enabled
                                  - Disabled
                                  type: string
                                  x-ms-enum:
                                    name: StopOnDisconnectEnableStatus
                                    modelAsString: true
                                gracePeriodMinutes:
                                  description: The specified time in minutes to wait
                                    before stopping a Dev Box once disconnect is detected.
                                  type: integer
                                  format: int32
                            stopOnNoConnect:
                              description: Stop on no connect configuration settings
                                for Dev Boxes created in this pool.
                              type: object
                              properties:
                                status:
                                  description: Enables the feature to stop a started
                                    Dev Box when it has not been connected to, once
                                    the grace period has lapsed.
                                  enum:
                                  - Enabled
                                  - Disabled
                                  type: string
                                  x-ms-enum:
                                    name: StopOnNoConnectEnableStatus
                                    modelAsString: true
                                gracePeriodMinutes:
                                  description: The specified time in minutes to wait
                                    before stopping a Dev Box if no connection is
                                    made.
                                  type: integer
                                  format: int32
                            singleSignOnStatus:
                              description: Indicates whether Dev Boxes in this pool
                                are created with single sign on enabled. The also
                                requires that single sign on be enabled on the tenant.
                              type: string
                              enum:
                              - Disabled
                              - Enabled
                              x-ms-enum:
                                name: SingleSignOnStatus
                                modelAsString: true
                            displayName:
                              type: string
                              description: The display name of the pool.
                            virtualNetworkType:
                              description: Indicates whether the pool uses a Virtual
                                Network managed by Microsoft or a customer provided
                                network.
                              type: string
                              enum:
                              - Managed
                              - Unmanaged
                              x-ms-enum:
                                name: VirtualNetworkType
                                modelAsString: true
                            managedVirtualNetworkRegions:
                              type: array
                              description: The regions of the managed virtual network
                                (required when managedNetworkType is Managed).
                              items:
                                type: string
                            healthStatus:
                              description: Overall health status of the Pool. Indicates
                                whether or not the Pool is available to create Dev
                                Boxes.
                              readOnly: true
                              enum:
                              - Unknown
                              - Pending
                              - Healthy
                              - Warning
                              - Unhealthy
                              type: string
                              x-ms-enum:
                                name: HealthStatus
                                modelAsString: true
                            healthStatusDetails:
                              description: Details on the Pool health status to help
                                diagnose issues. This is only populated when the pool
                                status indicates the pool is in a non-healthy state
                              type: array
                              items:
                                type: object
                                description: Pool health status detail.
                                properties:
                                  code:
                                    type: string
                                    description: An identifier for the issue.
                                    readOnly: true
                                  message:
                                    type: string
                                    description: A message describing the issue, intended
                                      to be suitable for display in a user interface
                                    readOnly: true
                              x-ms-identifiers:
                              - code
                              readOnly: true
                            devBoxCount:
                              description: Indicates the number of provisioned Dev
                                Boxes in this pool.
                              type: integer
                              format: int32
                              readOnly: true
                            provisioningState:
                              description: The provisioning state of the resource.
                              readOnly: true
                              type: string
                              enum:
                              - NotSpecified
                              - Accepted
                              - Running
                              - Creating
                              - Created
                              - Updating
                              - Updated
                              - Deleting
                              - Deleted
                              - Succeeded
                              - Failed
                              - Canceled
                              - MovingResources
                              - TransientFailure
                              - RolloutInProgress
                              - StorageProvisioningFailed
                              x-ms-enum:
                                name: ProvisioningState
                                modelAsString: true
                          description: Properties of a Pool. These properties can
                            be updated after the resource has been created.
                          required:
                          - devBoxDefinitionName
                          - networkConnectionName
                          - licenseType
                          - localAdministrator
                          x-ms-client-flatten: true
                      required:
                      - location
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                    readOnly: true
                  nextLink:
                    description: URL to get the next set of results if there are any.
                    type: string
                    readOnly: true
