        format: int32
    get:
      tags:
      - SKUs
      description: Lists the Microsoft.DevCenter SKUs available in a subscription
      operationId: Skus_ListBySubscription
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                description: Results of the Microsoft.DevCenter SKU list operation.
                type: object
                properties:
                  value:
                    description: Current page of results.
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: The name of the SKU. E.g. P3. It is typically
                            a letter+number code
                        tier:
                          type: string
                          description: This field is required to be implemented by
                            the Resource Provider if the service has more than one
                            tier, but is not required on a PUT.
                          enum:
                          - Free
                          - Basic
                          - Standard
                          - Premium
                          x-ms-enum:
                            name: SkuTier
                            modelAsString: false
                        size:
                          type: string
                          description: 'The SKU size. When the name field is the combination
                            of tier and some other value, this would be the standalone
                            code. '
                        family:
                          type: string
                          description: If the service has different generations of
                            hardware, for the same SKU, then that can be captured
                            here.
                        capacity:
                          type: integer
                          format: int32
                          description: If the SKU supports scale out/in then the capacity
                            integer should be included. If scale out/in is not possible
                            for the resource this may be omitted.
                        resourceType:
                          type: string
                          description: The name of the resource type
                          readOnly: true
                        locations:
                          description: SKU supported locations.
                          type: array
                          readOnly: true
                          items:
                            type: string
                        capabilities:
                          description: Collection of name/value pairs to describe
                            the SKU capabilities.
                          type: array
                          readOnly: true
                          items:
                            description: A name/value pair to describe a capability.
                            type: object
                            properties:
                              name:
                                description: Name of the capability.
                                type: string
                                readOnly: true
                              value:
                                description: Value of the capability.
                                type: string
                                readOnly: true
                          x-ms-identifiers: []
                      required:
                      - name
                      description: The resource model definition representing SKU
                    x-ms-identifiers: []
                    readOnly: true
                  nextLink:
                    description: URL to get the next set of results if there are any.
                    type: string
                    readOnly: true
