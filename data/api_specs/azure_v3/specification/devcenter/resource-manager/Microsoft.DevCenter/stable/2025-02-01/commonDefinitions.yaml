openapi: 3.0.0
info:
  version: 2025-02-01
  title: DevCenter
  description: DevCenter Management API
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths: {}
components:
  parameters:
    ProjectNameParameter:
      name: projectName
      in: path
      required: true
      description: The name of the project.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9-_.]{2,62}$
    TopParameter:
      name: $top
      in: query
      description: 'The maximum number of resources to return from the operation.
        Example: ''$top=10''.'
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Capability:
      description: A name/value pair to describe a capability.
      type: object
      properties:
        name:
          description: Name of the capability.
          type: string
          readOnly: true
        value:
          description: Value of the capability.
          type: string
          readOnly: true
    TrackedResourceUpdate:
      description: Base tracked resource type for PATCH updates
      type: object
      properties:
        tags:
          description: Resource tags.
          type: object
          additionalProperties:
            type: string
          x-ms-mutability:
          - read
          - create
          - update
        location:
          type: string
          x-ms-mutability:
          - read
          - create
          description: The geo-location where the resource lives
    Tags:
      type: object
      additionalProperties:
        type: string
      x-ms-mutability:
      - read
      - create
      - update
      description: Resource tags.
    DevCenterSku:
      type: object
      properties:
        name:
          type: string
          description: The name of the SKU. E.g. P3. It is typically a letter+number
            code
        tier:
          type: string
          description: This field is required to be implemented by the Resource Provider
            if the service has more than one tier, but is not required on a PUT.
          enum:
          - Free
          - Basic
          - Standard
          - Premium
          x-ms-enum:
            name: SkuTier
            modelAsString: false
        size:
          type: string
          description: 'The SKU size. When the name field is the combination of tier
            and some other value, this would be the standalone code. '
        family:
          type: string
          description: If the service has different generations of hardware, for the
            same SKU, then that can be captured here.
        capacity:
          type: integer
          format: int32
          description: If the SKU supports scale out/in then the capacity integer
            should be included. If scale out/in is not possible for the resource this
            may be omitted.
        resourceType:
          type: string
          description: The name of the resource type
          readOnly: true
        locations:
          description: SKU supported locations.
          type: array
          readOnly: true
          items:
            type: string
        capabilities:
          description: Collection of name/value pairs to describe the SKU capabilities.
          type: array
          readOnly: true
          items:
            description: A name/value pair to describe a capability.
            type: object
            properties:
              name:
                description: Name of the capability.
                type: string
                readOnly: true
              value:
                description: Value of the capability.
                type: string
                readOnly: true
          x-ms-identifiers: []
      required:
      - name
      description: The resource model definition representing SKU
    ProvisioningState:
      type: string
      description: Provisioning state of the resource.
      enum:
      - NotSpecified
      - Accepted
      - Running
      - Creating
      - Created
      - Updating
      - Updated
      - Deleting
      - Deleted
      - Succeeded
      - Failed
      - Canceled
      - MovingResources
      - TransientFailure
      - RolloutInProgress
      - StorageProvisioningFailed
      readOnly: true
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    SkuTier:
      type: string
      description: This field is required to be implemented by the Resource Provider
        if the service has more than one tier, but is not required on a PUT.
      enum:
      - Free
      - Basic
      - Standard
      - Premium
      x-ms-enum:
        name: SkuTier
        modelAsString: false
    Sku:
      type: object
      description: The resource model definition representing SKU
      properties:
        name:
          type: string
          description: The name of the SKU. E.g. P3. It is typically a letter+number
            code
        tier:
          type: string
          description: This field is required to be implemented by the Resource Provider
            if the service has more than one tier, but is not required on a PUT.
          enum:
          - Free
          - Basic
          - Standard
          - Premium
          x-ms-enum:
            name: SkuTier
            modelAsString: false
        size:
          type: string
          description: 'The SKU size. When the name field is the combination of tier
            and some other value, this would be the standalone code. '
        family:
          type: string
          description: If the service has different generations of hardware, for the
            same SKU, then that can be captured here.
        capacity:
          type: integer
          format: int32
          description: If the SKU supports scale out/in then the capacity integer
            should be included. If scale out/in is not possible for the resource this
            may be omitted.
      required:
      - name
