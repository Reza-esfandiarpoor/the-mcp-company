                    description: Describes the error object.
                    properties:
                      code:
                        readOnly: true
                        description: Error code
                        type: string
                      message:
                        readOnly: true
                        description: Error message indicating why the operation failed.
                        type: string
      x-ms-pageable:
        nextLinkName: nextLink
