    put:
      operationId: VirtualMachineInstances_CreateOrUpdate
      description: The operation to create or update a virtual machine instance. Please
        note some properties can be set only during virtual machine instance creation.
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      parameters:
      - in: path
        name: resourceUri
        description: The fully qualified Azure Resource manager identifier of the
          Hybrid Compute machine resource to be extended.
        required: true
        x-ms-skip-url-encoding: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
