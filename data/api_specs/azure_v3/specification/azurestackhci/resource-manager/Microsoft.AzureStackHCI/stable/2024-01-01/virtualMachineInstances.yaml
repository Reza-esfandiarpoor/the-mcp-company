                    createdAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource creation (UTC).
                    lastModifiedBy:
                      type: string
                      description: The identity that last modified the resource.
                    lastModifiedByType:
                      type: string
                      description: The type of identity that last modified the resource.
                      enum:
                      - User
                      - Application
                      - ManagedIdentity
                      - Key
                      x-ms-enum:
                        name: createdByType
                        modelAsString: true
                    lastModifiedAt:
                      type: string
                      format: date-time
                      description: The timestamp of resource last modification (UTC)
                properties:
                  x-ms-client-flatten: true
                  type: object
                  properties:
                    hardwareProfile:
                      type: object
                      properties:
                        vmSize:
                          type: string
                          enum:
                          - Default
                          - Standard_A2_v2
                          - Standard_A4_v2
                          - Standard_D2s_v3
                          - Standard_D4s_v3
                          - Standard_D8s_v3
                          - Standard_D16s_v3
                          - Standard_D32s_v3
                          - Standard_DS2_v2
                          - Standard_DS3_v2
                          - Standard_DS4_v2
                          - Standard_DS5_v2
                          - Standard_DS13_v2
                          - Standard_K8S_v1
                          - Standard_K8S2_v1
                          - Standard_K8S3_v1
                          - Standard_K8S4_v1
                          - Standard_NK6
                          - Standard_NK12
                          - Standard_NV6
                          - Standard_NV12
                          - Standard_K8S5_v1
                          - Custom
                          default: Default
                          x-ms-enum:
                            name: VmSizeEnum
                            modelAsString: true
                        processors:
                          type: integer
                          format: int32
                          description: number of processors for the virtual machine
                            instance
                        memoryMB:
                          type: integer
                          format: int64
                          description: RAM in MB for the virtual machine instance
                        dynamicMemoryConfig:
                          type: object
                          properties:
                            maximumMemoryMB:
                              type: integer
                              format: int64
                            minimumMemoryMB:
                              type: integer
                              format: int64
                            targetMemoryBuffer:
                              type: integer
