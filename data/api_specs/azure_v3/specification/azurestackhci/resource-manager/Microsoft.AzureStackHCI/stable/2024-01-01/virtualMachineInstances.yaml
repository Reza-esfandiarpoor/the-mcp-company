                  description: Defines the amount of extra memory that should be reserved
                    for a virtual machine instance at runtime, as a percentage of
                    the total memory that the virtual machine instance is thought
                    to need. This only applies to virtual systems with dynamic memory
                    enabled. This property can be in the range of 5 to 2000.
                  format: int32
          description: HardwareProfile - Specifies the hardware settings for the virtual
            machine instance.
        networkProfile:
          type: object
          properties:
            networkInterfaces:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: ID - Resource Id of the network interface
              description: NetworkInterfaces - list of network interfaces to be attached
                to the virtual machine instance
          description: NetworkProfile - describes the network configuration the virtual
            machine instance
        osProfile:
          type: object
