                                              description: The additional info.
                                              readOnly: true
                                        readOnly: true
                                        x-ms-identifiers: []
                                  readOnly: true
                                  x-ms-identifiers:
                                  - message
                                  - target
                                additionalInfo:
                                  type: array
                                  description: The error additional info.
                                  items:
                                    type: object
                                    description: The resource management error additional
