                                  type: string
                                squashUID:
                                  type: integer
                                  description: User ID to squash to.
                                  format: int64
                                squashGID:
                                  type: integer
                                  description: Group ID to squash to.
                                  format: int64
                                status:
                                  readOnly: true
                                  type: string
                                  description: AML file system squash status.
