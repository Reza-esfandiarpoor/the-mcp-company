                              description: Specifies encryption settings of the AML
                                file system.
                              properties:
                                keyEncryptionKey:
                                  description: Specifies the location of the encryption
                                    key in Key Vault.
                                  type: object
                                  properties:
                                    keyUrl:
                                      type: string
                                      description: The URL referencing a key encryption
                                        key in key vault.
                                    sourceVault:
                                      type: object
