                                  - Monday
                                  - Tuesday
                                  - Wednesday
                                  - Thursday
                                  - Friday
                                  - Saturday
                                  - Sunday
                                  x-ms-enum:
                                    name: MaintenanceDayOfWeekType
                                    modelAsString: false
                                  description: Day of the week on which the maintenance
                                    window will occur.
                                timeOfDayUTC:
                                  type: string
                                  pattern: ^([0-9]|0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]$
                                  description: The time of day (in UTC) to start the
                                    maintenance window.
                            hsm:
                              type: object
                              description: Hydration and archive settings and status
                              properties:
                                settings:
                                  description: Specifies HSM settings of the AML file
                                    system.
                                  x-ms-mutability:
                                  - read
                                  - create
                                  type: object
                                  properties:
                                    container:
