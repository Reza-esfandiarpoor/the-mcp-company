                                            type: string
                                            enum:
                                            - NotConfigured
                                            - Idle
                                            - InProgress
                                            - Canceled
                                            - Completed
                                            - Failed
                                            - Cancelling
                                            - FSScanInProgress
                                            x-ms-enum:
                                              name: ArchiveStatusType
                                              modelAsString: true
                                          lastCompletionTime:
                                            readOnly: true
                                            description: The time of the last completed
                                              archive operation
                                            type: string
                                            format: date-time
                                          lastStartedTime:
                                            readOnly: true
                                            description: The time the latest archive
                                              operation started
                                            type: string
                                            format: date-time
                                          percentComplete:
                                            readOnly: true
                                            description: The completion percentage
                                              of the archive operation
                                            type: integer
                                            format: int32
                                          errorCode:
                                            readOnly: true
                                            description: Server-defined error code
                                              for the archive operation
                                            type: string
                                          errorMessage:
                                            readOnly: true
                                            description: Server-defined error message
                                              for the archive operation
                                            type: string
                                  x-ms-identifiers:
                                  - filesystemPath
                            rootSquashSettings:
                              description: Specifies root squash settings of the AML
                                file system.
                              properties:
                                mode:
                                  type: string
                                  description: 'Squash mode of the AML file system.
                                    ''All'': User and Group IDs on files will be squashed
                                    to the provided values for all users on non-trusted
                                    systems. ''RootOnly'': User and Group IDs on files
                                    will be squashed to provided values for solely
                                    the root user on non-trusted systems. ''None'':
