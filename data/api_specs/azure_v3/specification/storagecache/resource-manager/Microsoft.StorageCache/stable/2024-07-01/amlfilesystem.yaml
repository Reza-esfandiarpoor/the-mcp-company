                                        Claim for the CSI driver, in Base64 encoded
                                        YAML
                                      readOnly: true
                                      type: string
                                    persistentVolume:
                                      description: Recommended AKS Persistent Volume
                                        for the CSI driver, in Base64 encoded YAML
                                      readOnly: true
                                      type: string
                                    storageClass:
                                      description: Recommended AKS Storage Class for
                                        the CSI driver, in Base64 encoded YAML
                                      readOnly: true
                                      type: string
                            throughputProvisionedMBps:
                              type: integer
                              format: int32
                              description: Throughput provisioned in MB per sec, calculated
                                as storageCapacityTiB * per-unit storage throughput
