openapi: 3.0.0
info:
  description: "Azure Managed Lustre provides a fully managed Lustre\xAE file system,\
    \ integrated with Blob storage, for use on demand. These operations create and\
    \ manage Azure Managed Lustre file systems."
  title: Managed Lustre client
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.StorageCache/amlFilesystems:
    get:
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: A list of AML file systems. Note that entity references might
            replace complete file system objects, as described in http://docs.oasis-open.org/odata/odata-json-format/v4.01/cs01/odata-json-format-v4.01-cs01.html#sec_EntityReference
          content:
            application/json:
              schema:
                description: Result of the request to list AML file systems. It contains
                  a list of AML file systems and a URL link to get the next set of
                  results.
                properties:
                  nextLink:
                    description: URL to get the next set of AML file system list results,
                      if there are any.
                    type: string
                  value:
                    description: List of AML file systems.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                          readOnly: true
                        name:
                          type: string
                          description: The name of the resource
                          readOnly: true
                        type:
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                          readOnly: true
                        systemData:
                          type: object
                          description: Azure Resource Manager metadata containing
                            createdBy and modifiedBy information.
                          readOnly: true
                          properties:
                            createdBy:
                              type: string
                              description: The identity that created the resource.
                            createdByType:
                              type: string
                              description: The type of identity that created the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
                                (UTC)
                        tags:
                          type: object
                          description: Resource tags.
                          additionalProperties:
                            type: string
                          x-ms-mutability:
                          - read
                          - create
                          - update
                        location:
                          type: string
                          description: The geo-location where the resource lives
                          x-ms-mutability:
                          - read
                          - create
                        identity:
                          description: The managed identity used by the AML file system,
                            if configured.
                          type: object
                          x-ms-mutability:
                          - read
                          - create
                          properties:
                            principalId:
                              readOnly: true
                              type: string
                              description: The principal ID for the user-assigned
                                identity of the resource.
                            tenantId:
                              readOnly: true
                              type: string
                              description: The tenant ID associated with the resource.
                            type:
                              type: string
                              description: The type of identity used for the resource.
                              enum:
                              - UserAssigned
                              - None
                              x-ms-enum:
                                name: AmlFilesystemIdentityType
                                modelAsString: false
                            userAssignedIdentities:
                              description: A dictionary where each key is a user assigned
                                identity resource ID, and each key's value is an empty
                                dictionary.
                              type: object
                              additionalProperties:
                                type: object
                                x-ms-client-name: userAssignedIdentitiesValue
                                properties:
                                  principalId:
                                    readOnly: true
                                    type: string
                                    description: The principal ID of the user-assigned
                                      identity.
                                  clientId:
                                    readOnly: true
                                    type: string
                                    description: The client ID of the user-assigned
                                      identity.
                        sku:
                          description: SKU for the resource.
                          x-ms-mutability:
                          - read
                          - create
                          properties:
                            name:
                              description: SKU name for this resource.
                              type: string
                          type: object
                        zones:
                          type: array
                          items:
                            type: string
                          description: Availability zones for resources. This field
