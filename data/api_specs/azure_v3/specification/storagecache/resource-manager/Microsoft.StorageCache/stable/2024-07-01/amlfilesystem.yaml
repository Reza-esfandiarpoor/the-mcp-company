                                  type: array
                                  readOnly: true
                                  description: Archive status
                                  items:
                                    description: Information about the AML file system
                                      archive
                                    type: object
                                    readOnly: true
                                    properties:
                                      filesystemPath:
                                        readOnly: true
                                        type: string
                                        description: Lustre file system path to archive
