          type: string
          minLength: 1
      responses:
        '200':
          description: A list of SKU descriptors.
          content:
            application/json:
              schema:
                type: object
                description: The response from the List Cache SKUs operation.
                properties:
                  nextLink:
                    description: The URI to fetch the next page of cache SKUs.
                    type: string
                  value:
                    description: The list of SKUs available for the subscription.
                    readOnly: true
                    items:
                      description: A resource SKU.
                      properties:
                        resourceType:
                          readOnly: true
                          type: string
                          description: The type of resource the SKU applies to.
                        capabilities:
                          description: A list of capabilities of this SKU, such as
                            throughput or ops/sec.
                          items:
                            description: A resource SKU capability.
                            properties:
                              name:
                                description: Name of a capability, such as ops/sec.
                                type: string
                              value:
                                description: Quantity, if the capability is measured
                                  by quantity.
                                type: string
                            type: object
                          type: array
                          x-ms-identifiers:
                          - name
                        locations:
                          readOnly: true
                          type: array
                          items:
                            type: string
                          description: The set of locations where the SKU is available.
                            This is the supported and registered Azure Geo Regions
                            (e.g., West US, East US, Southeast Asia, etc.).
                        locationInfo:
                          description: The set of locations where the SKU is available.
                          items:
                            description: Resource SKU location information.
                            properties:
                              location:
                                description: Location where this SKU is available.
                                type: string
                              zones:
                                description: Zones if any.
                                type: array
                                items:
                                  type: string
                            type: object
                          type: array
                          x-ms-identifiers: []
                        name:
                          description: The name of this SKU.
                          type: string
                        restrictions:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                readOnly: true
                                type: string
                                description: The type of restrictions. In this version,
                                  the only possible value for this is location.
                              values:
                                readOnly: true
                                type: array
                                items:
                                  type: string
                                description: The value of restrictions. If the restriction
                                  type is set to location, then this would be the
                                  different locations where the SKU is restricted.
                              reasonCode:
                                type: string
                                enum:
                                - QuotaId
                                - NotAvailableForSubscription
                                x-ms-enum:
                                  name: ReasonCode
                                  modelAsString: true
                                description: The reason for the restriction. As of
                                  now this can be "QuotaId" or "NotAvailableForSubscription".
                                  "QuotaId" is set when the SKU has requiredQuotas
                                  parameter as the subscription does not belong to
                                  that quota. "NotAvailableForSubscription" is related
                                  to capacity at the datacenter.
                            description: The restrictions preventing this SKU from
                              being used.
                          description: The restrictions preventing this SKU from being
                            used. This is empty if there are no restrictions.
                          x-ms-identifiers: []
                      type: object
                    type: array
                    x-ms-identifiers: []
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                x-ms-external: true
                description: An error response.
                properties:
                  error:
                    description: The body of the error.
                    properties:
                      code:
