openapi: 3.0.0
info:
  description: A Storage Cache provides scalable caching service for NAS clients,
    serving data from either NFSv3 or Blob at-rest storage (referred to as "Storage
    Targets"). These operations allow you to manage Caches.
  title: Storage Cache Mgmt Client
  version: 2024-07-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.StorageCache/operations:
    get:
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: The list of available Resource Provider operations.
          content:
            application/json:
              schema:
                description: Result of the request to list Resource Provider operations.
                  It contains a list of operations and a URL link to get the next
                  set of results.
                properties:
                  nextLink:
                    description: URL to get the next set of operation list results
                      if there are any.
                    type: string
                  value:
                    description: List of Resource Provider operations supported by
                      the Microsoft.StorageCache resource provider.
                    items:
                      description: 'REST API operation description: see https://github.com/Azure/azure-rest-api-specs/blob/master/documentation/openapi-authoring-automated-guidelines.md#r3023-operationsapiimplementation'
