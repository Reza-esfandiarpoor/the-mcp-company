                            description:
                              description: The description of the operation
                              type: string
                        origin:
                          description: Origin of the operation.
                          type: string
                        isDataAction:
                          description: The flag that indicates whether the operation
                            applies to data plane.
                          type: boolean
                        name:
                          description: 'Operation name: {provider}/{resource}/{operation}'
                          type: string
                        properties:
                          x-ms-client-flatten: true
                          description: Additional details about an operation.
                          type: object
                          properties:
                            serviceSpecification:
                              type: object
                              description: Specification of the all the metrics provided
                                for a resource type.
                              properties:
                                metricSpecifications:
                                  description: Details about operations related to
                                    metrics.
                                  type: array
                                  items:
                                    type: object
                                    description: Details about operation related to
                                      metrics.
                                    properties:
                                      name:
                                        type: string
                                        description: The name of the metric.
                                      displayName:
                                        type: string
                                        description: Localized display name of the
                                          metric.
                                      displayDescription:
                                        type: string
                                        description: The description of the metric.
                                      unit:
                                        type: string
                                        description: The unit that the metric is measured
                                          in.
                                      aggregationType:
                                        type: string
                                        description: The type of metric aggregation.
                                      supportedAggregationTypes:
                                        description: Support metric aggregation type.
                                        type: array
                                        items:
                                          enum:
                                          - NotSpecified
                                          - None
                                          - Average
                                          - Minimum
                                          - Maximum
                                          - Total
                                          - Count
                                          type: string
                                          x-ms-enum:
                                            name: MetricAggregationType
                                            modelAsString: true
                                      metricClass:
                                        description: Type of metrics.
                                        type: string
                                      dimensions:
                                        description: Dimensions of the metric
                                        type: array
                                        items:
                                          type: object
                                          description: Specifications of the Dimension
                                            of metrics.
                                          properties:
                                            name:
                                              type: string
                                              description: Name of the dimension
                                            displayName:
                                              type: string
                                              description: Localized friendly display
                                                name of the dimension
                                            internalName:
                                              type: string
                                              description: Internal name of the dimension.
                                            toBeExportedForShoebox:
                                              description: To be exported to shoe
                                                box.
                                              type: boolean
                                        x-ms-identifiers: []
                                  x-ms-identifiers:
                                  - name
                                logSpecifications:
                                  description: Details about operations related to
                                    logs.
                                  type: array
                                  items:
                                    type: object
                                    description: Details about operation related to
                                      logs.
                                    properties:
