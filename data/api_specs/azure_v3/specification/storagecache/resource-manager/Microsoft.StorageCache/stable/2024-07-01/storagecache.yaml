  /subscriptions/{subscriptionId}/providers/Microsoft.StorageCache/caches:
    get:
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: A list of cache objects. Note that entity references might
            replace complete cache objects, as described in http://docs.oasis-open.org/odata/odata-json-format/v4.01/cs01/odata-json-format-v4.01-cs01.html#sec_EntityReference
          content:
            application/json:
              schema:
                description: Result of the request to list caches. It contains a list
                  of caches and a URL link to get the next set of results.
                properties:
                  nextLink:
                    description: URL to get the next set of cache list results, if
                      there are any.
                    type: string
                  value:
                    description: List of Caches.
                    items:
                      description: 'A cache instance. Follows Azure Resource Manager
                        standards: https://github.com/Azure/azure-resource-manager-rpc/blob/master/v1.0/resource-api-reference.md'
                      properties:
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                          description: Resource tags.
                        id:
                          description: Resource ID of the cache.
                          readOnly: true
                          type: string
                        location:
                          description: Region name string.
                          type: string
                          x-ms-mutability:
                          - read
                          - create
                        name:
                          description: Name of cache.
                          readOnly: true
                          pattern: ^[-0-9a-zA-Z_]{1,80}$
                          type: string
                        type:
                          description: Type of the cache; Microsoft.StorageCache/Cache
                          readOnly: true
                          type: string
                        identity:
                          description: The identity of the cache, if configured.
                          type: object
                          x-ms-mutability:
                          - read
                          - create
                          properties:
                            principalId:
                              readOnly: true
                              type: string
                              description: The principal ID for the system-assigned
                                identity of the cache.
                            tenantId:
                              readOnly: true
                              type: string
                              description: The tenant ID associated with the cache.
                            type:
                              type: string
                              description: The type of identity used for the cache
                              enum:
                              - SystemAssigned
                              - UserAssigned
                              - SystemAssigned, UserAssigned
                              - None
                              x-ms-enum:
                                name: CacheIdentityType
                                modelAsString: false
                            userAssignedIdentities:
                              type: object
                              description: A dictionary where each key is a user assigned
                                identity resource ID, and each key's value is an empty
                                dictionary.
                              additionalProperties:
                                type: object
                                x-ms-client-name: userAssignedIdentitiesValue
                                properties:
                                  principalId:
                                    readOnly: true
                                    type: string
                                    description: The principal ID of the user-assigned
                                      identity.
                                  clientId:
                                    readOnly: true
                                    type: string
                                    description: The client ID of the user-assigned
                                      identity.
                        systemData:
                          readOnly: true
                          description: The system meta data relating to this resource.
                          type: object
                          properties:
