              type: string
            domainNetBiosName:
              description: The Active Directory domain's NetBIOS name.
              type: string
            cacheNetBiosName:
              description: The NetBIOS name to assign to the HPC Cache when it joins
                the Active Directory domain as a server. Length must 1-15 characters
                from the class [-0-9a-zA-Z].
              pattern: ^[-0-9a-zA-Z]{1,15}$
              type: string
            domainJoined:
              description: True if the HPC Cache is joined to the Active Directory
                domain.
              type: string
              readOnly: true
              enum:
              - 'Yes'
              - 'No'
              - Error
              x-ms-enum:
                name: DomainJoinedType
                modelAsString: true
            credentials:
              type: object
              description: Active Directory admin credentials used to join the HPC
                Cache to a domain.
              properties:
                username:
                  description: Username of the Active Directory domain administrator.
                    This value is stored encrypted and not returned on response.
                  type: string
                password:
                  description: Plain text password of the Active Directory domain
                    administrator. This value is stored encrypted and not returned
                    on response.
                  x-ms-secret: true
                  type: string
                  x-ms-mutability:
                  - read
                  - create
                  - update
              required:
              - username
          type: object
          required:
          - primaryDnsIpAddress
          - domainNetBiosName
          - domainName
          - cacheNetBiosName
        usernameDownload:
          description: Specifies settings for Extended Groups. Extended Groups allows
            users to be members of more than 16 groups.
          type: object
          properties:
            extendedGroups:
              type: boolean
              description: Whether or not Extended Groups is enabled.
            usernameSource:
              description: This setting determines how the cache gets username and
                group names for clients.
              enum:
              - AD
              - LDAP
              - File
              - None
              x-ms-enum:
                name: UsernameSource
                modelAsString: true
              type: string
              default: None
            groupFileURI:
              type: string
              description: The URI of the file containing group information (in /etc/group
                file format). This field must be populated when 'usernameSource' is
                set to 'File'.
            userFileURI:
              type: string
              description: The URI of the file containing user information (in /etc/passwd
                file format). This field must be populated when 'usernameSource' is
                set to 'File'.
            ldapServer:
              type: string
              description: The fully qualified domain name or IP address of the LDAP
                server to use.
            ldapBaseDN:
              type: string
              description: The base distinguished name for the LDAP domain.
            encryptLdapConnection:
              type: boolean
              description: Whether or not the LDAP connection should be encrypted.
              default: false
            requireValidCertificate:
              type: boolean
              description: Determines if the certificates must be validated by a certificate
                authority. When true, caCertificateURI must be provided.
              default: false
            autoDownloadCertificate:
              type: boolean
              description: Determines if the certificate should be automatically downloaded.
                This applies to 'caCertificateURI' only if 'requireValidCertificate'
                is true.
              default: false
            caCertificateURI:
              type: string
              description: The URI of the CA certificate to validate the LDAP secure
                connection. This field must be populated when 'requireValidCertificate'
                is set to true.
            usernameDownloaded:
              description: Indicates whether or not the HPC Cache has performed the
                username download successfully.
              type: string
              readOnly: true
              enum:
              - 'Yes'
              - 'No'
              - Error
              x-ms-enum:
                name: UsernameDownloadedType
                modelAsString: true
            credentials:
              type: object
              description: When present, these are the credentials for the secure
                LDAP connection.
              properties:
                bindDn:
                  type: string
                  description: The Bind Distinguished Name identity to be used in
                    the secure LDAP connection. This value is stored encrypted and
                    not returned on response.
                  x-ms-mutability:
                  - read
                  - create
                  - update
                bindPassword:
                  type: string
                  x-ms-secret: true
                  description: The Bind password to be used in the secure LDAP connection.
                    This value is stored encrypted and not returned on response.
