      description: Cache network settings.
      properties:
        mtu:
          description: The IPv4 maximum transmission unit configured for the subnet.
          type: integer
          format: int32
          minimum: 576
          maximum: 1500
          default: 1500
        utilityAddresses:
          description: Array of additional IP addresses used by this cache.
          readOnly: true
          items:
            type: string
          type: array
        dnsServers:
          description: DNS servers for the cache to use.  It will be set from the
            network configuration if no value is provided.
          type: array
          items:
            type: string
        dnsSearchDomain:
          description: DNS search domain
          type: string
        ntpServer:
          description: NTP server IP Address or FQDN for the cache to use. The default
            is time.windows.com.
          type: string
          default: time.windows.com
    CacheEncryptionSettings:
      type: object
      description: Cache encryption settings.
      properties:
        keyEncryptionKey:
          x-ms-secret: true
          description: Specifies the location of the key encryption key in key vault.
          type: object
          properties:
            keyUrl:
              type: string
              description: The URL referencing a key encryption key in key vault.
            sourceVault:
              type: object
              description: Describes a resource Id to source key vault.
              properties:
                id:
                  type: string
                  description: Resource Id.
          required:
          - keyUrl
          - sourceVault
        rotationToLatestKeyVersionEnabled:
          type: boolean
          description: Specifies whether the service will automatically rotate to
            the newest version of the key in the key vault.
    CacheSecuritySettings:
      type: object
      description: Cache security settings.
      properties:
        accessPolicies:
          description: NFS access policies defined for this cache.
          items:
            type: object
            description: A set of rules describing access policies applied to NFSv3
              clients of the cache.
            properties:
              name:
                description: Name identifying this policy. Access Policy names are
                  not case sensitive.
                type: string
              accessRules:
                description: The set of rules describing client accesses allowed under
                  this policy.
                type: array
                items:
                  type: object
                  description: Rule to place restrictions on portions of the cache
                    namespace being presented to clients.
                  properties:
                    scope:
                      description: Scope for this rule. The scope and filter determine
                        which clients match the rule.
                      type: string
                      enum:
                      - default
                      - network
                      - host
                      x-ms-enum:
                        name: NfsAccessRuleScope
                        modelAsString: true
                    filter:
                      description: Filter applied to the scope for this rule. The
                        filter's format depends on its scope. 'default' scope matches
                        all clients and has no filter value. 'network' scope takes
                        a filter in CIDR format (for example, 10.99.1.0/24). 'host'
                        takes an IP address or fully qualified domain name as filter.
                        If a client does not match any filter rule and there is no
                        default rule, access is denied.
                      type: string
                    access:
                      description: Access allowed by this rule.
                      type: string
                      enum:
                      - 'no'
                      - ro
                      - rw
                      x-ms-enum:
                        name: NfsAccessRuleAccess
                        modelAsString: true
                    suid:
                      description: Allow SUID semantics.
                      type: boolean
                    submountAccess:
                      description: For the default policy, allow access to subdirectories
                        under the root export. If this is set to no, clients can only
                        mount the path '/'. If set to yes, clients can mount a deeper
                        path, like '/a/b'.
                      type: boolean
                    rootSquash:
                      description: Map root accesses to anonymousUID and anonymousGID.
                      type: boolean
                    anonymousUID:
                      description: UID value that replaces 0 when rootSquash is true.
                        65534 will be used if not provided.
                      type: string
                    anonymousGID:
                      description: GID value that replaces 0 when rootSquash is true.
                        This will use the value of anonymousUID if not provided.
                      type: string
                  required:
                  - scope
                  - access
                x-ms-identifiers: []
            required:
            - name
            - accessRules
          type: array
          x-ms-identifiers:
          - name
    CacheDirectorySettings:
      description: Cache Directory Services settings.
      type: object
      properties:
        activeDirectory:
          description: Specifies settings for joining the HPC Cache to an Active Directory
            domain.
          properties:
            primaryDnsIpAddress:
              description: Primary DNS IP address used to resolve the Active Directory
                domain controller's fully qualified domain name.
