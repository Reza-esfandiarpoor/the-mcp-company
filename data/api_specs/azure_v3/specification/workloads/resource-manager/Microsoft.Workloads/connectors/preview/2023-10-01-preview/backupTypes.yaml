openapi: 3.0.0
info:
  version: 2023-10-01-preview
  title: Workloads Client
  description: The recovery services backup policy models required for connector service.
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    AzureIaaSVMProtectionPolicy:
      type: object
      properties:
        protectedItemsCount:
          format: int32
          description: Number of items associated with this policy.
          type: integer
        backupManagementType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        resourceGuardOperationRequests:
          description: ResourceGuard Operation Requests
          type: array
          items:
            type: string
        instantRPDetails:
          type: object
          description: Instant recovery point additional details.
          properties:
            azureBackupRGNamePrefix:
              description: Azure backup resource group name prefix.
              type: string
            azureBackupRGNameSuffix:
              description: Azure backup resource group name suffix.
              type: string
        schedulePolicy:
          description: Backup schedule specified as part of backup policy.
          required:
          - schedulePolicyType
          type: object
          properties:
            schedulePolicyType:
              description: This property will be used as the discriminator for deciding
                the specific types in the polymorphic chain of types.
              type: string
          discriminator:
            propertyName: schedulePolicyType
        retentionPolicy:
          description: Retention policy with the details on backup copy retention
            ranges.
          required:
          - retentionPolicyType
          type: object
          properties:
            retentionPolicyType:
              description: This property will be used as the discriminator for deciding
                the specific types in the polymorphic chain of types.
              type: string
          discriminator:
            propertyName: retentionPolicyType
        tieringPolicy:
          description: "Tiering policy to automatically move RPs to another tier\r\
            \nKey is Target Tier, defined in RecoveryPointTierType enum.\r\nTiering\
            \ policy specifies the criteria to move RP to the target tier."
          type: object
          additionalProperties:
            description: "Tiering Policy for a target tier.\r\nIf the policy is not\
              \ specified for a given target tier, service retains the existing configured\
              \ tiering policy for that tier"
            type: object
            properties:
              tieringMode:
                description: "Tiering Mode to control automatic tiering of recovery\
                  \ points. Supported values are:\r\n1. TierRecommended: Tier all\
                  \ recovery points recommended to be tiered\r\n2. TierAfter: Tier\
                  \ all recovery points after a fixed period, as specified in duration\
                  \ + durationType below.\r\n3. DoNotTier: Do not tier any recovery\
                  \ points"
                enum:
                - Invalid
                - TierRecommended
                - TierAfter
                - DoNotTier
                type: string
                x-ms-enum:
                  name: TieringMode
                  modelAsString: true
              duration:
                format: int32
                description: "Number of days/weeks/months/years to retain backups\
                  \ in current tier before tiering.\r\nUsed only if TieringMode is\
                  \ set to TierAfter"
                type: integer
              durationType:
                description: "Retention duration type: days/weeks/months/years\r\n\
                  Used only if TieringMode is set to TierAfter"
                enum:
                - Invalid
                - Days
                - Weeks
                - Months
                - Years
                type: string
                x-ms-enum:
                  name: RetentionDurationType
                  modelAsString: true
        instantRpRetentionRangeInDays:
          format: int32
          description: Instant RP retention policy range in days
          type: integer
        timeZone:
          description: 'Time zone optional input as string. For example: "Pacific
            Standard Time".'
          type: string
        policyType:
          description: The policy type.
          enum:
          - Invalid
          - V1
          - V2
          x-enum-descriptions:
          - Invalid Azure IaaS VM Protection Policy type
          - V1 Azure IaaS VM Protection Policy type
          - V2 Azure IaaS VM Protection Policy type
          type: string
          x-ms-enum:
            name: IAASVMPolicyType
            modelAsString: true
      required:
      - backupManagementType
      description: Base class for backup policy. Workload-specific backup policies
        are derived from this class.
      discriminator:
        propertyName: backupManagementType
      x-ms-discriminator-value: AzureIaasVM
    ProtectionPolicy:
      description: Base class for backup policy. Workload-specific backup policies
        are derived from this class.
      required:
      - backupManagementType
      type: object
      properties:
        protectedItemsCount:
          format: int32
          description: Number of items associated with this policy.
          type: integer
        backupManagementType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        resourceGuardOperationRequests:
          description: ResourceGuard Operation Requests
          type: array
          items:
            type: string
      discriminator:
        propertyName: backupManagementType
    InstantRPAdditionalDetails:
      type: object
      description: Instant recovery point additional details.
      properties:
        azureBackupRGNamePrefix:
          description: Azure backup resource group name prefix.
          type: string
        azureBackupRGNameSuffix:
          description: Azure backup resource group name suffix.
          type: string
    SchedulePolicy:
      description: Base class for backup schedule.
      required:
      - schedulePolicyType
      type: object
      properties:
        schedulePolicyType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
      discriminator:
        propertyName: schedulePolicyType
    RetentionPolicy:
      description: Base class for retention policy.
      required:
      - retentionPolicyType
      type: object
      properties:
        retentionPolicyType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
      discriminator:
        propertyName: retentionPolicyType
    AzureVmWorkloadProtectionPolicy:
      type: object
      properties:
        protectedItemsCount:
          format: int32
          description: Number of items associated with this policy.
          type: integer
        backupManagementType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        resourceGuardOperationRequests:
          description: ResourceGuard Operation Requests
          type: array
          items:
            type: string
        workLoadType:
          description: Type of workload for the backup management
          enum:
          - Invalid
          - VM
          - FileFolder
          - AzureSqlDb
          - SQLDB
          - Exchange
          - Sharepoint
          - VMwareVM
          - SystemState
          - Client
          - GenericDataSource
          - SQLDataBase
          - AzureFileShare
          - SAPHanaDatabase
          - SAPAseDatabase
          - SAPHanaDBInstance
          type: string
          x-ms-enum:
            name: WorkloadType
            modelAsString: true
        settings:
          description: Common settings for the backup management
          type: object
          properties:
            timeZone:
              description: 'TimeZone optional input as string. For example: TimeZone
                = "Pacific Standard Time".'
              type: string
            issqlcompression:
              description: SQL compression flag
              type: boolean
            isCompression:
              description: "Workload compression flag. This has been added so that\
                \ 'isSqlCompression'\r\nwill be deprecated once clients upgrade to\
                \ consider this flag."
              type: boolean
        subProtectionPolicy:
          description: List of sub-protection policies which includes schedule and
            retention
          type: array
          items:
            description: Sub-protection policy which includes schedule and retention
            type: object
            properties:
              policyType:
                description: Type of backup policy type
                enum:
                - Invalid
                - Full
                - Differential
                - Log
                - CopyOnlyFull
                - Incremental
                - SnapshotFull
                - SnapshotCopyOnlyFull
                type: string
                x-ms-enum:
                  name: PolicyType
                  modelAsString: true
              schedulePolicy:
                description: Backup schedule specified as part of backup policy.
                required:
                - schedulePolicyType
                type: object
                properties:
                  schedulePolicyType:
                    description: This property will be used as the discriminator for
                      deciding the specific types in the polymorphic chain of types.
                    type: string
                discriminator:
                  propertyName: schedulePolicyType
              retentionPolicy:
                description: Retention policy with the details on backup copy retention
                  ranges.
                required:
                - retentionPolicyType
                type: object
                properties:
                  retentionPolicyType:
                    description: This property will be used as the discriminator for
                      deciding the specific types in the polymorphic chain of types.
                    type: string
                discriminator:
                  propertyName: retentionPolicyType
              tieringPolicy:
                description: "Tiering policy to automatically move RPs to another\
                  \ tier.\r\nKey is Target Tier, defined in RecoveryPointTierType\
                  \ enum.\r\nTiering policy specifies the criteria to move RP to the\
                  \ target tier."
                type: object
                additionalProperties:
                  description: "Tiering Policy for a target tier.\r\nIf the policy\
                    \ is not specified for a given target tier, service retains the\
                    \ existing configured tiering policy for that tier"
                  type: object
                  properties:
                    tieringMode:
                      description: "Tiering Mode to control automatic tiering of recovery\
                        \ points. Supported values are:\r\n1. TierRecommended: Tier\
                        \ all recovery points recommended to be tiered\r\n2. TierAfter:\
                        \ Tier all recovery points after a fixed period, as specified\
                        \ in duration + durationType below.\r\n3. DoNotTier: Do not\
                        \ tier any recovery points"
                      enum:
                      - Invalid
                      - TierRecommended
                      - TierAfter
                      - DoNotTier
                      type: string
                      x-ms-enum:
                        name: TieringMode
                        modelAsString: true
                    duration:
                      format: int32
                      description: "Number of days/weeks/months/years to retain backups\
                        \ in current tier before tiering.\r\nUsed only if TieringMode\
                        \ is set to TierAfter"
                      type: integer
                    durationType:
                      description: "Retention duration type: days/weeks/months/years\r\
                        \nUsed only if TieringMode is set to TierAfter"
                      enum:
                      - Invalid
                      - Days
                      - Weeks
                      - Months
                      - Years
                      type: string
                      x-ms-enum:
                        name: RetentionDurationType
                        modelAsString: true
              snapshotBackupAdditionalDetails:
                description: Hana DB instance snapshot backup additional details.
                type: object
                properties:
                  instantRpRetentionRangeInDays:
                    format: int32
                    description: Retention range for instant Rp in days.
                    type: integer
                  instantRPDetails:
                    description: Instant RP details for the snapshot.
                    type: string
                  userAssignedManagedIdentityDetails:
                    description: User Assigned managed identity details used for snapshot
                      policy.
                    type: object
                    properties:
                      identityArmId:
                        type: string
                      identityName:
                        type: string
                      userAssignedIdentityProperties:
                        description: User assigned managed identity properties.
                        type: object
                        properties:
                          clientId:
                            type: string
                          principalId:
                            type: string
          x-ms-identifiers: []
        makePolicyConsistent:
          description: Fix the policy inconsistency
          type: boolean
      required:
      - backupManagementType
      description: Base class for backup policy. Workload-specific backup policies
        are derived from this class.
      discriminator:
        propertyName: backupManagementType
      x-ms-discriminator-value: AzureWorkload
    Settings:
      description: Common settings field for backup management
      type: object
      properties:
        timeZone:
          description: 'TimeZone optional input as string. For example: TimeZone =
            "Pacific Standard Time".'
          type: string
        issqlcompression:
          description: SQL compression flag
          type: boolean
        isCompression:
          description: "Workload compression flag. This has been added so that 'isSqlCompression'\r\
            \nwill be deprecated once clients upgrade to consider this flag."
          type: boolean
    SubProtectionPolicy:
      description: Sub-protection policy which includes schedule and retention
      type: object
      properties:
        policyType:
          description: Type of backup policy type
          enum:
          - Invalid
          - Full
          - Differential
          - Log
          - CopyOnlyFull
          - Incremental
          - SnapshotFull
          - SnapshotCopyOnlyFull
          type: string
          x-ms-enum:
            name: PolicyType
            modelAsString: true
        schedulePolicy:
          description: Backup schedule specified as part of backup policy.
          required:
          - schedulePolicyType
          type: object
          properties:
            schedulePolicyType:
              description: This property will be used as the discriminator for deciding
                the specific types in the polymorphic chain of types.
              type: string
          discriminator:
            propertyName: schedulePolicyType
        retentionPolicy:
          description: Retention policy with the details on backup copy retention
            ranges.
          required:
          - retentionPolicyType
          type: object
          properties:
            retentionPolicyType:
              description: This property will be used as the discriminator for deciding
                the specific types in the polymorphic chain of types.
              type: string
          discriminator:
            propertyName: retentionPolicyType
        tieringPolicy:
          description: "Tiering policy to automatically move RPs to another tier.\r\
            \nKey is Target Tier, defined in RecoveryPointTierType enum.\r\nTiering\
            \ policy specifies the criteria to move RP to the target tier."
          type: object
          additionalProperties:
            description: "Tiering Policy for a target tier.\r\nIf the policy is not\
              \ specified for a given target tier, service retains the existing configured\
              \ tiering policy for that tier"
            type: object
            properties:
              tieringMode:
                description: "Tiering Mode to control automatic tiering of recovery\
                  \ points. Supported values are:\r\n1. TierRecommended: Tier all\
                  \ recovery points recommended to be tiered\r\n2. TierAfter: Tier\
                  \ all recovery points after a fixed period, as specified in duration\
                  \ + durationType below.\r\n3. DoNotTier: Do not tier any recovery\
                  \ points"
                enum:
                - Invalid
                - TierRecommended
                - TierAfter
                - DoNotTier
                type: string
                x-ms-enum:
                  name: TieringMode
                  modelAsString: true
              duration:
                format: int32
                description: "Number of days/weeks/months/years to retain backups\
                  \ in current tier before tiering.\r\nUsed only if TieringMode is\
                  \ set to TierAfter"
                type: integer
              durationType:
                description: "Retention duration type: days/weeks/months/years\r\n\
                  Used only if TieringMode is set to TierAfter"
                enum:
                - Invalid
                - Days
                - Weeks
                - Months
                - Years
                type: string
                x-ms-enum:
                  name: RetentionDurationType
                  modelAsString: true
        snapshotBackupAdditionalDetails:
          description: Hana DB instance snapshot backup additional details.
          type: object
          properties:
            instantRpRetentionRangeInDays:
              format: int32
              description: Retention range for instant Rp in days.
              type: integer
            instantRPDetails:
              description: Instant RP details for the snapshot.
              type: string
            userAssignedManagedIdentityDetails:
              description: User Assigned managed identity details used for snapshot
                policy.
              type: object
              properties:
                identityArmId:
                  type: string
                identityName:
                  type: string
                userAssignedIdentityProperties:
                  description: User assigned managed identity properties.
                  type: object
                  properties:
                    clientId:
                      type: string
                    principalId:
                      type: string
    TieringPolicy:
      description: "Tiering Policy for a target tier.\r\nIf the policy is not specified\
        \ for a given target tier, service retains the existing configured tiering\
        \ policy for that tier"
      type: object
      properties:
        tieringMode:
          description: "Tiering Mode to control automatic tiering of recovery points.\
            \ Supported values are:\r\n1. TierRecommended: Tier all recovery points\
            \ recommended to be tiered\r\n2. TierAfter: Tier all recovery points after\
            \ a fixed period, as specified in duration + durationType below.\r\n3.\
            \ DoNotTier: Do not tier any recovery points"
          enum:
          - Invalid
          - TierRecommended
          - TierAfter
          - DoNotTier
          type: string
          x-ms-enum:
            name: TieringMode
            modelAsString: true
        duration:
          format: int32
          description: "Number of days/weeks/months/years to retain backups in current\
            \ tier before tiering.\r\nUsed only if TieringMode is set to TierAfter"
          type: integer
        durationType:
          description: "Retention duration type: days/weeks/months/years\r\nUsed only\
            \ if TieringMode is set to TierAfter"
          enum:
          - Invalid
          - Days
          - Weeks
          - Months
          - Years
          type: string
          x-ms-enum:
            name: RetentionDurationType
            modelAsString: true
    UserAssignedIdentityProperties:
      description: User assigned managed identity properties.
      type: object
      properties:
        clientId:
          type: string
        principalId:
          type: string
    UserAssignedManagedIdentityDetails:
      description: User assigned managed identity details.
      type: object
      properties:
        identityArmId:
          type: string
        identityName:
          type: string
        userAssignedIdentityProperties:
          description: User assigned managed identity properties.
          type: object
          properties:
            clientId:
              type: string
            principalId:
              type: string
    SimpleSchedulePolicy:
      type: object
      properties:
        schedulePolicyType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        scheduleRunFrequency:
          description: Frequency of the schedule operation of this policy.
          enum:
          - Invalid
          - Daily
          - Weekly
          - Hourly
          type: string
          x-ms-enum:
            name: ScheduleRunType
            modelAsString: true
        scheduleRunDays:
          description: List of days of week this schedule has to be run.
          type: array
          items:
            enum:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            type: string
            x-ms-enum:
              name: DayOfWeek
              modelAsString: false
        scheduleRunTimes:
          description: List of times of day this schedule has to be run.
          type: array
          items:
            format: date-time
            type: string
        hourlySchedule:
          description: Hourly Schedule of this Policy
          type: object
          properties:
            interval:
              format: int32
              description: "Interval at which backup needs to be triggered. For hourly\
                \ the value\r\n can be 4/6/8/12"
              type: integer
            scheduleWindowStartTime:
              format: date-time
              description: To specify start time of the backup window
              type: string
            scheduleWindowDuration:
              format: int32
              description: To specify duration of the backup window
              type: integer
        scheduleWeeklyFrequency:
          format: int32
          description: At every number weeks this schedule has to be run.
          type: integer
      required:
      - schedulePolicyType
      description: Base class for backup schedule.
      discriminator:
        propertyName: schedulePolicyType
      x-ms-discriminator-value: SimpleSchedulePolicy
    SimpleSchedulePolicyV2:
      type: object
      properties:
        schedulePolicyType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        scheduleRunFrequency:
          description: Frequency of the schedule operation of this policy.
          enum:
          - Invalid
          - Daily
          - Weekly
          - Hourly
          type: string
          x-ms-enum:
            name: ScheduleRunType
            modelAsString: true
        hourlySchedule:
          description: hourly schedule of this policy
          type: object
          properties:
            interval:
              format: int32
              description: "Interval at which backup needs to be triggered. For hourly\
                \ the value\r\n can be 4/6/8/12"
              type: integer
            scheduleWindowStartTime:
              format: date-time
              description: To specify start time of the backup window
              type: string
            scheduleWindowDuration:
              format: int32
              description: To specify duration of the backup window
              type: integer
        dailySchedule:
          description: Daily schedule of this policy
          type: object
          properties:
            scheduleRunTimes:
              description: List of times of day this schedule has to be run.
              type: array
              items:
                format: date-time
                type: string
        weeklySchedule:
          description: Weekly schedule of this policy
          type: object
          properties:
            scheduleRunDays:
              type: array
              description: Schedule run days.
              items:
                enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
                type: string
                x-ms-enum:
                  name: DayOfWeek
                  modelAsString: false
            scheduleRunTimes:
              description: List of times of day this schedule has to be run.
              type: array
              items:
                format: date-time
                type: string
      required:
      - schedulePolicyType
      description: Base class for backup schedule.
      discriminator:
        propertyName: schedulePolicyType
      x-ms-discriminator-value: SimpleSchedulePolicyV2
    SnapshotBackupAdditionalDetails:
      description: Snapshot Backup related fields for WorkloadType SAP Hana system
      type: object
      properties:
        instantRpRetentionRangeInDays:
          format: int32
          description: Retention range for instant Rp in days.
          type: integer
        instantRPDetails:
          description: Instant RP details for the snapshot.
          type: string
        userAssignedManagedIdentityDetails:
          description: User Assigned managed identity details used for snapshot policy.
          type: object
          properties:
            identityArmId:
              type: string
            identityName:
              type: string
            userAssignedIdentityProperties:
              description: User assigned managed identity properties.
              type: object
              properties:
                clientId:
                  type: string
                principalId:
                  type: string
    HourlySchedule:
      type: object
      description: Hourly schedule.
      properties:
        interval:
          format: int32
          description: "Interval at which backup needs to be triggered. For hourly\
            \ the value\r\n can be 4/6/8/12"
          type: integer
        scheduleWindowStartTime:
          format: date-time
          description: To specify start time of the backup window
          type: string
        scheduleWindowDuration:
          format: int32
          description: To specify duration of the backup window
          type: integer
    DailySchedule:
      type: object
      description: Daily schedule.
      properties:
        scheduleRunTimes:
          description: List of times of day this schedule has to be run.
          type: array
          items:
            format: date-time
            type: string
    WeeklySchedule:
      type: object
      description: Weekly schedule.
      properties:
        scheduleRunDays:
          type: array
          description: Schedule run days.
          items:
            enum:
            - Sunday
            - Monday
            - Tuesday
            - Wednesday
            - Thursday
            - Friday
            - Saturday
            type: string
            x-ms-enum:
              name: DayOfWeek
              modelAsString: false
        scheduleRunTimes:
          description: List of times of day this schedule has to be run.
          type: array
          items:
            format: date-time
            type: string
    LongTermRetentionPolicy:
      type: object
      properties:
        retentionPolicyType:
          description: This property will be used as the discriminator for deciding
            the specific types in the polymorphic chain of types.
          type: string
        dailySchedule:
          description: Daily retention schedule of the protection policy.
          type: object
          properties:
            retentionTimes:
              description: Retention times of retention policy.
              type: array
              items:
                format: date-time
                type: string
            retentionDuration:
              description: Retention duration of retention Policy.
              type: object
              properties:
                count:
                  format: int32
                  description: "Count of duration types. Retention duration is obtained\
                    \ by the counting the duration type Count times.\r\nFor example,\
                    \ when Count = 3 and DurationType = Weeks, retention duration\
                    \ will be three weeks."
                  type: integer
                durationType:
                  description: Retention duration type of retention policy.
                  enum:
                  - Invalid
                  - Days
                  - Weeks
                  - Months
                  - Years
                  type: string
                  x-ms-enum:
                    name: RetentionDurationType
                    modelAsString: true
        weeklySchedule:
          description: Weekly retention schedule of the protection policy.
          type: object
          properties:
            daysOfTheWeek:
              description: List of days of week for weekly retention policy.
              type: array
              items:
                enum:
                - Sunday
                - Monday
                - Tuesday
                - Wednesday
                - Thursday
                - Friday
                - Saturday
                type: string
                x-ms-enum:
                  name: DayOfWeek
                  modelAsString: false
            retentionTimes:
              description: Retention times of retention policy.
              type: array
              items:
                format: date-time
                type: string
            retentionDuration:
              description: Retention duration of retention Policy.
              type: object
              properties:
                count:
                  format: int32
                  description: "Count of duration types. Retention duration is obtained\
                    \ by the counting the duration type Count times.\r\nFor example,\
                    \ when Count = 3 and DurationType = Weeks, retention duration\
                    \ will be three weeks."
                  type: integer
                durationType:
                  description: Retention duration type of retention policy.
                  enum:
                  - Invalid
                  - Days
                  - Weeks
                  - Months
                  - Years
                  type: string
                  x-ms-enum:
                    name: RetentionDurationType
                    modelAsString: true
        monthlySchedule:
          description: Monthly retention schedule of the protection policy.
          type: object
          properties:
            retentionScheduleFormatType:
              description: Retention schedule format type for monthly retention policy.
              enum:
              - Invalid
              - Daily
              - Weekly
              type: string
              x-ms-enum:
                name: RetentionScheduleFormat
                modelAsString: true
            retentionScheduleDaily:
              description: Daily retention format for monthly retention policy.
              type: object
              properties:
                daysOfTheMonth:
                  description: List of days of the month.
                  type: array
                  items:
                    description: Day of the week.
                    type: object
                    properties:
                      date:
                        format: int32
                        description: Date of the month
                        type: integer
                      isLast:
                        description: Whether Date is last date of month
                        type: boolean
                  x-ms-identifiers: []
            retentionScheduleWeekly:
              description: Weekly retention format for monthly retention policy.
              type: object
              properties:
                daysOfTheWeek:
                  description: List of days of the week.
                  type: array
                  items:
                    enum:
                    - Sunday
                    - Monday
                    - Tuesday
                    - Wednesday
                    - Thursday
                    - Friday
                    - Saturday
                    type: string
                    x-ms-enum:
                      name: DayOfWeek
                      modelAsString: false
                weeksOfTheMonth:
                  description: List of weeks of month.
                  type: array
                  items:
                    enum:
                    - First
