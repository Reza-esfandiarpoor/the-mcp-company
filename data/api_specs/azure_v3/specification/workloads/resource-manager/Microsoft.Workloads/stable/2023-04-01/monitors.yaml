openapi: 3.0.0
info:
  title: Workloads Client
  description: The workload SAP monitor Client.
  version: 2023-04-01
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Workloads/monitors:
    get:
      tags:
      - Monitors
      operationId: monitors_List
      summary: Gets a list of SAP monitors in the specified subscription.
      description: Gets a list of SAP monitors in the specified subscription. The
        operations returns various properties of each SAP monitor.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors:
    get:
      tags:
      - Monitors
      operationId: monitors_ListByResourceGroup
      summary: Gets a list of SAP monitors
      description: Gets a list of SAP monitors in the specified resource group.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors/{monitorName}:
    get:
      tags:
      - Monitors
      operationId: monitors_Get
      summary: Gets properties of a SAP monitor.
      description: Gets properties of a SAP monitor for the specified subscription,
        resource group, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Monitors
      operationId: monitors_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Creates a SAP monitor.
      description: Creates a SAP monitor for the specified subscription, resource
        group, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
        description: Request body representing a SAP monitor
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: Created SAP monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '201':
          description: Creating SAP monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Monitors
      operationId: monitors_Delete
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Deletes a SAP monitor.
      description: Deletes a SAP monitor with the specified subscription, resource
        group, and SAP monitor name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: Delete SAP monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResult'
        '202':
          description: Deleting SAP monitor
        '204':
          description: No SAP monitor to delete
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Monitors
      operationId: monitors_Update
      summary: Patches the Tags field of a SAP monitor.
      description: Patches the Tags field of a SAP monitor for the specified subscription,
        resource group, and SAP monitor name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorRequest'
        description: The Update SAP workload monitor request body.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors/{monitorName}/providerInstances
  : get:
      tags:
      - ProviderInstances
      operationId: ProviderInstances_List
      summary: Gets a list of provider instances in the specified SAP monitor.
      description: Gets a list of provider instances in the specified SAP monitor.
        The operations returns various properties of each provider instances.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstanceListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors/{monitorName}/providerInstances/{providerInstanceName}
  : get:
      tags:
      - ProviderInstances
      operationId: ProviderInstances_Get
      summary: Gets properties of a provider instance.
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      description: Gets properties of a provider instance for the specified subscription,
        resource group, SAP monitor name, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      - $ref: '#/components/parameters/ProviderInstanceNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstance'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - ProviderInstances
      operationId: ProviderInstances_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Creates a provider instance.
      description: Creates a provider instance for the specified subscription, resource
        group, SAP monitor name, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      - $ref: '#/components/parameters/ProviderInstanceNameParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInstance'
        description: Request body representing a provider instance
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: Created provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstance'
        '201':
          description: Creating provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderInstance'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - ProviderInstances
      operationId: ProviderInstances_Delete
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      summary: Deletes a provider instance.
      description: Deletes a provider instance for the specified subscription, resource
        group, SAP monitor name, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      - $ref: '#/components/parameters/ProviderInstanceNameParameter'
      responses:
        '200':
          description: Deleted provider instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResult'
        '202':
          description: Deleting provider instance
        '204':
          description: No provider instance to delete
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors/{monitorName}/sapLandscapeMonitor/default
  : get:
      tags:
      - SapLandscapeMonitor
      operationId: SapLandscapeMonitor_Get
      summary: Gets configuration values for Single Pane Of Glass for SAP monitor.
      description: Gets configuration values for Single Pane Of Glass for SAP monitor
        for the specified subscription, resource group, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapLandscapeMonitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - SapLandscapeMonitor
      operationId: SapLandscapeMonitor_Create
      summary: Creates a SAP Landscape Monitor Dashboard.
      description: Creates a SAP Landscape Monitor Dashboard for the specified subscription,
        resource group, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      requestBody:
        $ref: '#/components/requestBodies/SapLandscapeMonitor'
      responses:
        '200':
          description: Updated SAP Landscape Monitor Dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapLandscapeMonitor'
        '201':
          description: Creating SAP Landscape Monitor Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapLandscapeMonitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - SapLandscapeMonitor
      operationId: SapLandscapeMonitor_Delete
      summary: Deletes a SAP Landscape Monitor Dashboard.
      description: Deletes a SAP Landscape Monitor Dashboard with the specified subscription,
        resource group, and SAP monitor name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: Delete SAP Landscape Monitor Dashboard
        '204':
          description: SAP Landscape Monitor Dashboard is already deleted or not found.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - SapLandscapeMonitor
      operationId: SapLandscapeMonitor_Update
      summary: Patches the SAP Landscape Monitor Dashboard.
      description: Patches the SAP Landscape Monitor Dashboard for the specified subscription,
        resource group, and SAP monitor name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      requestBody:
        $ref: '#/components/requestBodies/SapLandscapeMonitor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapLandscapeMonitor'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Workloads/monitors/{monitorName}/sapLandscapeMonitor
  : get:
      tags:
      - SapLandscapeMonitor
      operationId: SapLandscapeMonitor_List
      summary: Gets configuration values for Single Pane Of Glass for SAP monitor.
      description: Gets configuration values for Single Pane Of Glass for SAP monitor
        for the specified subscription, resource group, and resource name.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/monitorNameParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapLandscapeMonitorListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
servers:
- url: https://management.azure.com
components:
  parameters:
    monitorNameParameter:
      name: monitorName
      in: path
      required: true
      description: Name of the SAP monitor resource.
      x-ms-parameter-location: method
      schema:
        type: string
    ProviderInstanceNameParameter:
      name: providerInstanceName
      in: path
      required: true
      description: Name of the provider instance.
      x-ms-parameter-location: method
      schema:
        type: string
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription.
      required: true
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
  requestBodies:
    SapLandscapeMonitor:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SapLandscapeMonitor'
      description: Request body representing a configuration for Sap Landscape Monitor
        Dashboard
      required: true
      x-ms-parameter-location: method
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    SslPreference:
      description: Gets or sets certificate preference if secure communication is
        enabled.
      type: string
      enum:
      - Disabled
      - RootCertificate
      - ServerCertificate
      x-ms-enum:
        name: sslPreference
        modelAsString: true
    OperationsDisplayDefinition:
      description: Defines the workload operation.
      required:
      - description
      - operation
      - provider
      - resource
      type: object
      properties:
        provider:
          type: string
          description: Defines the workload provider.
        resource:
          type: string
          description: Defines the workload resource.
        operation:
          type: string
          description: Defines the workload operation.
        description:
          type: string
          description: Describes the workload operation.
    OperationsDefinition:
      required:
      - display
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the operation.
        isDataAction:
          type: boolean
          description: Indicates whether the operation applies to data-plane.
        origin:
          enum:
          - NotSpecified
          - User
          - System
          type: string
          description: Defines the workload operation origin.
          x-ms-enum:
            name: OperationProperties
            modelAsString: true
        display:
          $ref: '#/components/schemas/OperationsDisplayDefinition'
          description: Display information of the operation.
        actionType:
          enum:
          - NotSpecified
          - Internal
          x-ms-enum:
            name: WorkloadMonitorActionType
            modelAsString: true
          description: Defines the action type of workload operation.
          type: string
        properties:
          x-ms-client-flatten: true
          description: Defines the workload operation properties.
      description: Properties of an Operation.
    OperationsContent:
      $ref: '#/components/schemas/Resource'
      type: object
      properties:
        properties:
          $ref: '#/components/schemas/OperationsDefinition'
      description: Defines the workload operation content.
      x-ms-azure-resource: true
    OperationsDefinitionArrayResponseWithContinuation:
      type: object
      description: Defines the workload operation definition response.
      properties:
        value:
          description: Defines the workload operation definition response properties.
          type: array
          items:
            $ref: '#/components/schemas/OperationsDefinition'
          x-ms-identifiers: []
        nextLink:
          description: The URL to get to the next set of results, if there are any.
          type: string
    Error:
      description: Standard error object.
      type: object
      properties:
        code:
          description: Server-defined set of error codes.
          type: string
          readOnly: true
        message:
          description: Human-readable representation of the error.
          type: string
          readOnly: true
        target:
          description: Target of the error.
          type: string
          readOnly: true
        details:
          description: Array of details about specific errors that led to this reported
            error.
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
          x-ms-identifiers: []
        innerError:
          description: Object containing more specific information than  the current
            object about the error.
          type: object
          properties:
            innerError:
              $ref: '#/components/schemas/Error'
          readOnly: true
    ManagedRGConfiguration:
      description: Managed resource group configuration
      type: object
      properties:
        name:
          type: string
          description: Managed resource group name
    Tags:
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
          description: Tags field of the resource.
      description: Tags field of the resource.
    MonitorListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/Monitor'
          description: The list of SAP monitors.
        nextLink:
          type: string
          description: The URL to get the next set of SAP monitors.
      description: The response from the List SAP monitors operation.
    Monitor:
      $ref: '#/components/schemas/TrackedResource'
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/UserAssignedServiceIdentity'
        properties:
          $ref: '#/components/schemas/MonitorProperties'
      description: SAP monitor info on Azure (ARM properties and SAP monitor properties)
    MonitorProperties:
      type: object
      properties:
        provisioningState:
          readOnly: true
          type: string
          enum:
          - Accepted
          - Creating
          - Updating
          - Failed
          - Succeeded
          - Deleting
          - Migrating
          x-ms-enum:
            name: WorkloadMonitorProvisioningState
            modelAsString: true
          description: State of provisioning of the SAP monitor.
        errors:
          $ref: '#/components/schemas/Error'
          description: Defines the SAP monitor errors.
          readOnly: true
        appLocation:
          type: string
          description: The SAP monitor resources will be deployed in the SAP monitoring
            region. The subnet region should be same as the SAP monitoring region.
        routingPreference:
          type: string
          description: Sets the routing preference of the SAP monitor. By default
            only RFC1918 traffic is routed to the customer VNET.
          enum:
          - Default
          - RouteAll
          x-ms-enum:
            name: RoutingPreference
            modelAsString: true
        zoneRedundancyPreference:
          type: string
          description: Sets the preference for zone redundancy on resources created
            for the SAP monitor. By default resources will be created which do not
            support zone redundancy.
        managedResourceGroupConfiguration:
          $ref: '#/components/schemas/ManagedRGConfiguration'
        logAnalyticsWorkspaceArmId:
          type: string
          description: The ARM ID of the Log Analytics Workspace that is used for
            SAP monitoring.
        monitorSubnet:
          type: string
          description: The subnet which the SAP monitor will be deployed in
        msiArmId:
          readOnly: true
          type: string
          description: The ARM ID of the MSI used for SAP monitoring.
        storageAccountArmId:
          readOnly: true
          type: string
          description: The ARM ID of the Storage account used for SAP monitoring.
      description: Describes the properties of a SAP monitor.
    UpdateMonitorRequest:
      description: Defines the request body for updating SAP monitor resource.
      type: object
      properties:
        tags:
          description: Gets or sets the Resource tags.
          type: object
          additionalProperties:
            type: string
        identity:
          $ref: '#/components/schemas/UserAssignedServiceIdentity'
    ProviderInstanceListResult:
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/ProviderInstance'
          description: The list of provider instances.
        nextLink:
          type: string
          description: The URL to get the next set of provider instances.
      description: The response from the List provider instances operation.
    ProviderInstance:
      $ref: '#/components/schemas/ProxyResource'
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/UserAssignedServiceIdentity'
        properties:
          $ref: '#/components/schemas/ProviderInstanceProperties'
      description: A provider instance associated with SAP monitor.
    HanaDbProviderInstanceProperties:
      $ref: '#/components/schemas/ProviderSpecificProperties'
      type: object
      properties:
        hostname:
          description: Gets or sets the target virtual machine size.
          type: string
        dbName:
          description: Gets or sets the hana database name.
          type: string
        sqlPort:
          description: Gets or sets the database sql port.
          type: string
        instanceNumber:
          description: Gets or sets the database instance number.
          type: string
        dbUsername:
          description: Gets or sets the database user name.
          type: string
        dbPassword:
          description: Gets or sets the database password.
          type: string
          x-ms-secret: true
        dbPasswordUri:
          description: Gets or sets the key vault URI to secret with the database
            password.
          type: string
        sslCertificateUri:
          description: Gets or sets the blob URI to SSL certificate for the DB.
          type: string
        sslHostNameInCertificate:
          description: Gets or sets the hostname(s) in the SSL certificate.
          type: string
        sslPreference:
          $ref: '#/components/schemas/SslPreference'
        sapSid:
          description: Gets or sets the SAP System Identifier.
          type: string
      description: Gets or sets the provider properties.
      x-ms-discriminator-value: SapHana
    SapNetWeaverProviderInstanceProperties:
      $ref: '#/components/schemas/ProviderSpecificProperties'
      type: object
      properties:
        sapSid:
          description: Gets or sets the SAP System Identifier
          type: string
        sapHostname:
          description: Gets or sets the target virtual machine IP Address/FQDN.
          type: string
        sapInstanceNr:
          description: Gets or sets the instance number of SAP NetWeaver.
          type: string
        sapHostFileEntries:
          description: Gets or sets the list of HostFile Entries
          type: array
          items:
            type: string
        sapUsername:
          description: Gets or sets the SAP user name.
          type: string
        sapPassword:
          description: Sets the SAP password.
          type: string
          x-ms-secret: true
        sapPasswordUri:
          description: Gets or sets the key vault URI to secret with the SAP password.
          type: string
        sapClientId:
          description: Gets or sets the SAP Client ID.
          type: string
        sapPortNumber:
          description: Gets or sets the SAP HTTP port number.
          type: string
        sslCertificateUri:
          description: Gets or sets the blob URI to SSL certificate for the SAP system.
          type: string
        sslPreference:
          $ref: '#/components/schemas/SslPreference'
      description: Gets or sets the provider properties.
      x-ms-discriminator-value: SapNetWeaver
    PrometheusOSProviderInstanceProperties:
      $ref: '#/components/schemas/ProviderSpecificProperties'
      type: object
      properties:
        prometheusUrl:
          description: URL of the Node Exporter endpoint
          type: string
