openapi: 3.0.0
info:
  version: 2023-04-01
  title: Workloads Client
  description: Workloads client provides access to various workload operations
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    ManagedServiceIdentityType:
      description: Type of managed service identity (only None, UserAssigned types
        are allowed).
      enum:
      - None
      - UserAssigned
      type: string
      x-ms-enum:
        name: ManagedServiceIdentityType
        modelAsString: true
    UserAssignedServiceIdentity:
      description: A pre-created user assigned identity with appropriate roles assigned.
        To learn more on identity and roles required, visit the ACSS how-to-guide.
      type: object
      properties:
        type:
          description: Type of manage identity
          enum:
          - None
          - UserAssigned
          type: string
          x-ms-enum:
            name: ManagedServiceIdentityType
            modelAsString: true
        userAssignedIdentities:
          description: User assigned identities dictionary
          type: object
          title: User-Assigned Identities
          additionalProperties:
            type: object
            description: User assigned identity properties
            properties:
              principalId:
                type: string
                format: uuid
                description: The principal ID of the assigned identity.
                readOnly: true
              clientId:
                type: string
                format: uuid
                description: The client ID of the assigned identity.
                readOnly: true
      required:
      - type
    UserAssignedIdentity:
      type: object
      description: User assigned identity properties
      properties:
        principalId:
          type: string
          format: uuid
          description: The principal ID of the assigned identity.
          readOnly: true
        clientId:
          type: string
          format: uuid
          description: The client ID of the assigned identity.
          readOnly: true
    UserAssignedIdentities:
      type: object
      title: User-Assigned Identities
      description: 'The set of user assigned identities associated with the resource.
        The userAssignedIdentities dictionary keys will be ARM resource ids in the
        form: ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}.
        The dictionary values can be empty objects ({}) in requests.'
      additionalProperties:
        type: object
        description: User assigned identity properties
        properties:
          principalId:
            type: string
            format: uuid
            description: The principal ID of the assigned identity.
            readOnly: true
          clientId:
            type: string
            format: uuid
            description: The client ID of the assigned identity.
            readOnly: true
