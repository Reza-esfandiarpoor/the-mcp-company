        propertyName: osType
    OSProfile:
      type: object
      properties:
        adminUsername:
          type: string
          description: Specifies the name of the administrator account. <br><br> This
            property cannot be updated after the VM is created. <br><br> **Windows-only
            restriction:** Cannot end in "." <br><br> **Disallowed values:** "administrator",
            "admin", "user", "user1", "test", "user2", "test1", "user3", "admin1",
            "1", "123", "a", "actuser", "adm", "admin2", "aspnet", "backup", "console",
            "david", "guest", "john", "owner", "root", "server", "sql", "support",
            "support_388945a0", "sys", "test2", "test3", "user4", "user5". <br><br>
            **Minimum-length (Linux):** 1  character <br><br> **Max-length (Linux):**
            64 characters <br><br> **Max-length (Windows):** 20 characters.
        adminPassword:
          type: string
          x-ms-secret: true
          description: Specifies the password of the administrator account. <br><br>
            **Minimum-length (Windows):** 8 characters <br><br> **Minimum-length (Linux):**
            6 characters <br><br> **Max-length (Windows):** 123 characters <br><br>
            **Max-length (Linux):** 72 characters <br><br> **Complexity requirements:**
            3 out of 4 conditions below need to be fulfilled <br> Has lower characters
            <br>Has upper characters <br> Has a digit <br> Has a special character
            (Regex match [\W_]) <br><br> **Disallowed values:** "abc@123", "P@$$w0rd",
            "P@ssw0rd", "P@ssword123", "Pa$$word", "pass@word1", "Password!", "Password1",
            "Password22", "iloveyou!" <br><br> For resetting the password, see [How
            to reset the Remote Desktop service or its login password in a Windows
            VM](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/reset-rdp)
            <br><br> For resetting root password, see [Manage users, SSH, and check
            or repair disks on Azure Linux VMs using the VMAccess Extension](https://docs.microsoft.com/troubleshoot/azure/virtual-machines/troubleshoot-ssh-connection)
