      - SAPVirtualInstances
      operationId: SAPVirtualInstances_Create
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      description: Creates a Virtual Instance for SAP solutions (VIS) resource
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/SAPVirtualInstanceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAPVirtualInstance'
        description: Virtual Instance for SAP solutions resource request body.
      responses:
        '200':
          description: Describes the Virtual Instance for SAP solutions resource which
            is created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPVirtualInstance'
        '201':
          description: Describes the Virtual Instance for SAP solutions resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPVirtualInstance'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
