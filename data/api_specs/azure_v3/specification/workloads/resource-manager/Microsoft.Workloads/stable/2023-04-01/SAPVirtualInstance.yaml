openapi: 3.0.0
info:
  version: 2023-04-01
  title: Workloads Client
  description: Workloads client provides access to various workload operations.
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Workloads/locations/{location}/sapVirtualInstanceMetadata/default/getSizingRecommendations
  : post:
      tags:
      - SAPRecommendations
      description: Get SAP sizing recommendations by providing input SAPS for application
        tier and memory required for database tier
      operationId: SAPSizingRecommendations
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAPSizingRecommendationRequest'
        description: SAP Sizing Recommendation Request body
      responses:
        '200':
          description: SAP Sizing Recommendation Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPSizingRecommendationResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Workloads/locations/{location}/sapVirtualInstanceMetadata/default/getSapSupportedSku
  : post:
      tags:
      - SAPSupportedSku
      description: Get a list of SAP supported SKUs for ASCS, Application and Database
        tier.
      operationId: SAPSupportedSku
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAPSupportedSkusRequest'
        description: SAP Supported SKU Request body
      responses:
        '200':
          description: SAP Supported SKU Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPSupportedResourceSkusResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/providers/Microsoft.Workloads/locations/{location}/sapVirtualInstanceMetadata/default/getDiskConfigurations
  : post:
      tags:
      - SAPDiskConfigurations
      description: Get the SAP Disk Configuration Layout prod/non-prod SAP System.
      operationId: SAPDiskConfigurations
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/LocationParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SAPDiskConfigurationsRequest'
        description: SAP Disk Configurations Request body
      responses:
        '200':
