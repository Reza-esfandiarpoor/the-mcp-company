      tags:
      - SAPVirtualInstances
      operationId: SAPVirtualInstances_Get
      description: Gets a Virtual Instance for SAP solutions resource
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/SAPVirtualInstanceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Describes the Virtual Instance for SAP solutions resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPVirtualInstance'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - SAPVirtualInstances
      operationId: SAPVirtualInstances_Update
      description: Updates a Virtual Instance for SAP solutions resource
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/SAPVirtualInstanceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSAPVirtualInstanceRequest'
        description: Request body to update a Virtual Instance for SAP solutions resource.
      responses:
        '200':
          description: Describes the Virtual Instance for SAP solutions resource which
            is successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPVirtualInstance'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - SAPVirtualInstances
      operationId: SAPVirtualInstances_Delete
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      description: Deletes a Virtual Instance for SAP solutions resource and its child
        resources, that is the associated Central Services Instance, Application Server
        Instances and Database Instance.
      parameters:
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/SAPVirtualInstanceNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResult'
        '202':
          description: Accepted
        '204':
          description: NoContent
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
