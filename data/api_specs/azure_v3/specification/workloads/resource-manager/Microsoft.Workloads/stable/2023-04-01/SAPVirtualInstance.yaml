          type: string
          description: The image publisher.
        offer:
          type: string
          description: Specifies the offer of the platform image or marketplace image
            used to create the virtual machine.
        sku:
          type: string
          description: The image SKU.
        version:
          type: string
          description: Specifies the version of the platform image or marketplace
            image used to create the virtual machine. The allowed formats are Major.Minor.Build
            or 'latest'. Major, Minor, and Build are decimal numbers. Specify 'latest'
            to use the latest version of an image available at deploy time. Even if
