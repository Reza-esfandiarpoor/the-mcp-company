      $ref: '#/components/schemas/OSConfiguration'
      type: object
      properties: {}
      description: Specifies Windows operating system settings on the virtual machine.
      x-ms-discriminator-value: Windows
    SshPublicKey:
      type: object
      properties:
        keyData:
          type: string
          description: SSH public key certificate used to authenticate with the VM
            through ssh. The key needs to be at least 2048-bit and in ssh-rsa format.
            <br><br> For creating ssh keys, see [Create SSH keys on Linux and Mac
            for Linux VMs in Azure](https://docs.microsoft.com/azure/virtual-machines/linux/create-ssh-keys-detailed).
      description: Contains information about SSH certificate public key and the path
        on the Linux VM where the public key is placed.
    SshConfiguration:
      type: object
      properties:
        publicKeys:
          type: array
          items:
            $ref: '#/components/schemas/SshPublicKey'
          description: The list of SSH public keys used to authenticate with linux
            based VMs.
          x-ms-identifiers: []
      description: SSH configuration for Linux based VMs running on Azure
    LinuxConfiguration:
      $ref: '#/components/schemas/OSConfiguration'
      type: object
      properties:
        disablePasswordAuthentication:
          type: boolean
          description: Specifies whether password authentication should be disabled.
        ssh:
          $ref: '#/components/schemas/SshConfiguration'
        sshKeyPair:
          $ref: '#/components/schemas/SshKeyPair'
      description: Specifies the Linux operating system settings on the virtual machine.
        <br><br>For a list of supported Linux distributions, see [Linux on Azure-Endorsed
        Distributions](https://docs.microsoft.com/azure/virtual-machines/linux/endorsed-distros).
      x-ms-discriminator-value: Linux
    OSConfiguration:
      description: Defines the OS configuration.
      type: object
      required:
      - osType
      properties:
        osType:
          description: The OS Type
          enum:
          - Linux
          - Windows
