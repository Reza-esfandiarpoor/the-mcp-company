        description: The SAP Central Services Instance resource request body.
      responses:
        '200':
          description: Describes the SAP Central Services Instance resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPCentralServerInstance'
        '201':
          description: Describes the SAP Central Services Instance resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAPCentralServerInstance'
        default:
