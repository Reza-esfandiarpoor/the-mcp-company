                      name: CostDetailsStatusType
                      modelAsString: true
                      values:
                      - value: Completed
                        description: Operation is Completed.
                        name: CompletedCostDetailsStatusType
                      - value: NoDataFound
                        description: Operation is Completed and no cost data found.
                        name: NoDataFoundCostDetailsStatusType
                      - value: Failed
                        description: Operation Failed.
                        name: FailedCostDetailsStatusType
                  manifest:
                    x-ms-client-flatten: true
                    description: The manifest of the report generated by the operation.
                    type: object
                    properties:
                      manifestVersion:
                        description: The Manifest version.
                        type: string
                      dataFormat:
                        description: The data format of the report
                        type: string
                        enum:
                        - Csv
                        x-ms-enum:
                          name: CostDetailsDataFormat
                          modelAsString: true
                          values:
                          - value: Csv
                            description: Csv data format.
                            name: CsvCostDetailsDataFormat
                      byteCount:
                        description: The total number of bytes in all blobs.
                        format: int64
                        type: integer
                      blobCount:
                        description: The total number of blobs.
                        format: int32
                        type: integer
                      compressData:
                        description: Is the data in compressed format.
                        type: boolean
                      requestContext:
                        x-ms-client-flatten: true
                        description: The context of the Cost Details request.
                        type: object
                        properties:
                          requestScope:
                            description: The request scope of the request.
                            type: string
                          requestBody:
                            description: The request payload body provided in Cost
                              Details call
                            type: object
                            properties:
                              metric:
                                description: The type of the detailed report. By default
                                  ActualCost is provided
                                type: string
                                enum:
                                - ActualCost
                                - AmortizedCost
                                x-ms-enum:
                                  name: CostDetailsMetricType
                                  modelAsString: true
                                  values:
                                  - value: ActualCost
                                    description: Actual cost data.
                                    name: ActualCostCostDetailsMetricType
                                  - value: AmortizedCost
                                    description: Amortized cost data.
                                    name: AmortizedCostCostDetailsMetricType
                              timePeriod:
                                description: The specific date range of cost details
                                  requested for the report. This parameter cannot
                                  be used alongside either the invoiceId or billingPeriod
                                  parameters. If a timePeriod, invoiceId or billingPeriod
                                  parameter is not provided in the request body the
                                  API will return the current month's cost. API only
                                  allows data to be pulled for 1 month or less and
                                  no older than 13 months. If no timePeriod or billingPeriod
                                  or invoiceId is provided the API defaults to the
                                  open month time period
                                type: object
                                properties:
                                  start:
                                    description: The start date to pull data from.
                                      example format 2020-03-15
                                    type: string
                                  end:
                                    description: The end date to pull data to. example
                                      format 2020-03-15
                                    type: string
                                required:
                                - start
                                - end
                              billingPeriod:
                                description: This parameter can be used only by Enterprise
                                  Agreement customers. Use the YearMonth(e.g. 202008)
                                  format. This parameter cannot be used alongside
                                  either the invoiceId or timePeriod parameters. If
                                  a timePeriod, invoiceId or billingPeriod parameter
                                  is not provided in the request body the API will
                                  return the current month's cost.
                                type: string
                              invoiceId:
                                description: This parameter can only be used by Microsoft
                                  Customer Agreement customers. Additionally, it can
                                  only be used at the Billing Profile or Customer
                                  scope. This parameter cannot be used alongside either
                                  the billingPeriod or timePeriod parameters. If a
                                  timePeriod, invoiceId or billingPeriod parameter
                                  is not provided in the request body the API will
                                  return the current month's cost.
                                type: string
                      blobs:
                        description: List of blob information generated by this operation.
                        type: array
                        items:
                          description: The blob information generated by this operation.
                          type: object
                          properties:
                            blobLink:
                              description: Link to the blob to download file.
                              type: string
                            byteCount:
                              description: Bytes in the blob.
                              format: int64
                              type: integer
                        x-ms-identifiers:
                        - blobLink
                  validTill:
                    description: The time at which report URL becomes invalid/expires
                      in UTC e.g. 2020-12-08T05:55:59.4394737Z.
                    type: string
                    format: date-time
                  error:
                    description: The details of the error.
                    type: object
                    properties:
                      code:
                        description: Error code.
                        type: string
                        readOnly: true
                      message:
                        description: Error message indicating why the operation failed.
                        type: string
                        readOnly: true
        '202':
          description: Accepted. Request will be processed. Use the Location header
            to check the status.
          headers:
            Location:
              description: The URL to check the result of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: The amount of delay to use while the status of the operation
                is checked. The value is expressed in seconds.
              schema:
                type: integer
                format: int32
        '204':
          description: No Content. The request has succeeded but returned no results.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: "Error response indicates that the service is not able\
