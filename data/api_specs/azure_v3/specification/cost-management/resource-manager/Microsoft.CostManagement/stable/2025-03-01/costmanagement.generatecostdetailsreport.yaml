openapi: 3.0.0
info:
  version: 2025-03-01
  title: CostManagementClient
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /{scope}/providers/Microsoft.CostManagement/generateCostDetailsReport:
    post:
      tags:
      - CostDetails
      operationId: GenerateCostDetailsReport_CreateOperation
      description: This API is the replacement for all previously release Usage Details
        APIs. Request to generate a cost details report for the provided date range,
        billing period (Only enterprise customers) or Invoice Id asynchronously at
        a certain scope. The initial call to request a report will return a 202 with
        a 'Location' and 'Retry-After' header. The 'Location' header will provide
        the endpoint to poll to get the result of the report generation. The 'Retry-After'
        provides the duration to wait before polling for the generated report. A call
        to poll the report operation will provide a 202 response with a 'Location'
        header if the operation is still in progress. Once the report generation operation
        completes, the polling endpoint will provide a 200 response along with details
        on the report blob(s) that are available for download. The details on the
        file(s) available for download will be available in the polling response body.
        To Understand cost details (formerly known as usage details) fields found
        in files ,see https://learn.microsoft.com/en-us/azure/cost-management-billing/automate/understand-usage-details-fields
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - name: scope
        in: path
        required: true
        description: The ARM Resource ID for subscription, billing account, or other
          billing scopes.Currently Resource Group and Management Group are not supported.
          For details, see https://aka.ms/costmgmt/scopes.
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              description: The definition of a cost detailed report.
              type: object
              properties:
                metric:
                  description: The type of the detailed report. By default ActualCost
                    is provided
                  type: string
                  enum:
                  - ActualCost
                  - AmortizedCost
                  x-ms-enum:
                    name: CostDetailsMetricType
                    modelAsString: true
                    values:
                    - value: ActualCost
                      description: Actual cost data.
                      name: ActualCostCostDetailsMetricType
                    - value: AmortizedCost
                      description: Amortized cost data.
                      name: AmortizedCostCostDetailsMetricType
                timePeriod:
                  description: The specific date range of cost details requested for
                    the report. This parameter cannot be used alongside either the
                    invoiceId or billingPeriod parameters. If a timePeriod, invoiceId
                    or billingPeriod parameter is not provided in the request body
                    the API will return the current month's cost. API only allows
                    data to be pulled for 1 month or less and no older than 13 months.
                    If no timePeriod or billingPeriod or invoiceId is provided the
                    API defaults to the open month time period
                  type: object
                  properties:
                    start:
                      description: The start date to pull data from. example format
                        2020-03-15
                      type: string
                    end:
                      description: The end date to pull data to. example format 2020-03-15
                      type: string
                  required:
                  - start
                  - end
                billingPeriod:
                  description: This parameter can be used only by Enterprise Agreement
                    customers. Use the YearMonth(e.g. 202008) format. This parameter
                    cannot be used alongside either the invoiceId or timePeriod parameters.
                    If a timePeriod, invoiceId or billingPeriod parameter is not provided
                    in the request body the API will return the current month's cost.
                  type: string
                invoiceId:
                  description: This parameter can only be used by Microsoft Customer
                    Agreement customers. Additionally, it can only be used at the
                    Billing Profile or Customer scope. This parameter cannot be used
                    alongside either the billingPeriod or timePeriod parameters. If
                    a timePeriod, invoiceId or billingPeriod parameter is not provided
                    in the request body the API will return the current month's cost.
                  type: string
        description: Parameters supplied to the Create cost details operation.
        required: true
      responses:
        '200':
          description: Request processing completed.
          content:
            application/json:
              schema:
                description: The result of the long running operation for cost details
                  Api.
                type: object
                properties:
                  id:
                    description: The id of the long running operation.
                    type: string
                  name:
                    description: The name of the long running operation.
                    type: string
                  type:
                    description: The type of the long running operation.
                    type: string
                  status:
                    description: The status of the cost details operation
                    type: string
                    enum:
