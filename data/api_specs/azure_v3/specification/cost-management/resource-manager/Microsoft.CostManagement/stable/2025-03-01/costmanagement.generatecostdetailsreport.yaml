                  \ payload. \n\n * 400 Bad Request - Invalid request payload:  can\
                  \ only have either timePeriod or invoiceId or billingPeriod. API\
                  \ only allows data to be pulled for either timePeriod or invoiceId\
                  \ or billingPeriod. Customer should provide only one of these parameters.\
                  \ \n\n * 400 Bad Request - Start date must be after . API only allows\
                  \ data to be pulled no older than 13 months from now. \n\n * 400\
                  \ Bad Request - The maximum allowed date range is 1 months. API\
                  \ only allows data to be pulled for 1 month or less. \n\n * 429\
                  \ TooManyRequests - Request is throttled. Retry after waiting for\
                  \ the time specified in the \"retry-after\" header. \n\n * 503 ServiceUnavailable\
                  \ - Service is temporarily unavailable. Retry after waiting for\
                  \ the time specified in the \"Retry-After\" header."
                type: object
                properties:
                  error:
                    description: The details of the error.
                    type: object
                    properties:
