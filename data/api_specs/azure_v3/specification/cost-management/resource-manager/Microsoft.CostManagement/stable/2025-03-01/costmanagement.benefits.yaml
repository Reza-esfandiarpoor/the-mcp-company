openapi: 3.0.0
info:
  title: CostManagementClient
  description: CostManagement management client provides access to CostManagement
    resources for Azure Enterprise Subscriptions.
  version: 2025-03-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: Benefits API
  description: APIs for getting benefit recommendations and benefit utilization summaries.
paths:
  /{billingScope}/providers/Microsoft.CostManagement/benefitRecommendations:
    get:
      tags:
      - BenefitRecommendations
      description: List of recommendations for purchasing savings plan.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/CostManagement/
      operationId: BenefitRecommendations_List
      parameters:
      - name: $filter
        in: query
        description: 'Can be used to filter benefitRecommendations by: properties/scope
          with allowed values [''Single'', ''Shared''] and default value ''Shared'';
          and properties/lookBackPeriod with allowed values [''Last7Days'', ''Last30Days'',
          ''Last60Days''] and default value ''Last60Days''; properties/term with allowed
          values [''P1Y'', ''P3Y''] and default value ''P3Y''; properties/subscriptionId;
          properties/resourceGroup'
        x-ms-parameter-location: method
        schema:
          type: string
      - name: $orderby
        in: query
        description: 'May be used to order the recommendations by: properties/armSkuName.
          For the savings plan, the results are in order by default. There is no need
          to use this clause.'
        x-ms-parameter-location: method
        schema:
          type: string
      - name: $expand
        in: query
        description: 'May be used to expand the properties by: properties/usage, properties/allRecommendationDetails'
        x-ms-parameter-location: method
        schema:
          type: string
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: billingScope
        in: path
        description: The scope associated with benefit recommendation operations.
          This includes '/subscriptions/{subscriptionId}/' for subscription scope,
          '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}' for
          resource group scope, /providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
          for enterprise agreement scope, and '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}'
          for billing profile scope
        required: true
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    description: The list of benefit recommendations.
                    readOnly: true
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        kind:
                          description: Reservation or SavingsPlan.
                          type: string
                          enum:
                          - IncludedQuantity
                          - Reservation
                          - SavingsPlan
                          x-ms-enum:
                            name: benefitKind
                            modelAsString: true
                            values:
                            - value: IncludedQuantity
                              description: Benefit is IncludedQuantity.
                              name: IncludedQuantity
                            - value: Reservation
                              description: Benefit is Reservation.
                              name: Reservation
                            - value: SavingsPlan
                              description: Benefit is SavingsPlan.
                              name: SavingsPlan
                        properties:
                          type: object
                          description: The properties of the benefit recommendations.
                          discriminator:
                            propertyName: scope
                          properties:
                            firstConsumptionDate:
                              type: string
                              description: The first usage date used for looking back
                                for computing the recommendations.
                              readOnly: true
                              format: date-time
                            lastConsumptionDate:
                              type: string
                              description: The last usage date used for looking back
                                for computing the recommendations.
                              readOnly: true
                              format: date-time
                            lookBackPeriod:
                              description: The number of days of usage evaluated for
                                computing the recommendations.
                              type: string
                              enum:
                              - Last7Days
                              - Last30Days
                              - Last60Days
                              x-ms-enum:
                                name: lookBackPeriod
                                modelAsString: true
                                values:
                                - value: Last7Days
                                  description: 7 days used to look back.
                                  name: Last7Days
                                - value: Last30Days
                                  description: 30 days used to look back.
                                  name: Last30Days
                                - value: Last60Days
                                  description: 60 days used to look back.
                                  name: Last60Days
                            totalHours:
                              type: integer
                              format: int32
                              description: The total hours for which the cost is covered.
                                Its equal to number of records in a property 'properties/usage/charges'.
                              readOnly: true
                            usage:
                              type: object
                              description: On-demand charges between firstConsumptionDate
                                and lastConsumptionDate that were used for computing
                                benefit recommendations.
                              properties:
                                usageGrain:
                                  description: 'The grain of the usage. Supported
                                    values: ''Hourly'''
                                  type: string
                                  enum:
                                  - Hourly
                                  - Daily
                                  - Monthly
                                  x-ms-enum:
                                    name: grain
                                    modelAsString: true
                                    values:
                                    - value: Hourly
                                      description: Hourly grain corresponds to value
                                        per hour.
                                      name: Hourly
                                    - value: Daily
                                      description: Hourly grain corresponds to value
                                        per day.
                                      name: Daily
                                    - value: Monthly
                                      description: Hourly grain corresponds to value
                                        per month.
                                      name: Monthly
                                charges:
                                  type: array
                                  description: On-demand charges for each hour between
                                    firstConsumptionDate and lastConsumptionDate that
                                    were used for computing benefit recommendations.
                                  readOnly: true
                                  items:
                                    type: number
                                    format: decimal
                            armSkuName:
                              description: ARM SKU name. 'Compute_Savings_Plan' for
                                SavingsPlan.
                              type: string
                              readOnly: true
                            term:
                              description: Term period of the benefit. For example,
                                P1Y or P3Y.
                              type: string
                              enum:
                              - P1Y
                              - P3Y
                              x-ms-enum:
                                name: term
                                modelAsString: true
                                values:
                                - value: P1Y
                                  description: Benefit term is 1 year.
                                  name: P1Y
                                - value: P3Y
                                  description: Benefit term is 3 years.
                                  name: P3Y
                            commitmentGranularity:
                              description: 'Grain of the proposed commitment amount.
                                Supported values: ''Hourly'''
                              type: string
                              enum:
                              - Hourly
                              - Daily
                              - Monthly
                              x-ms-enum:
                                name: grain
                                modelAsString: true
                                values:
                                - value: Hourly
                                  description: Hourly grain corresponds to value per
                                    hour.
                                  name: Hourly
                                - value: Daily
                                  description: Hourly grain corresponds to value per
                                    day.
                                  name: Daily
                                - value: Monthly
                                  description: Hourly grain corresponds to value per
                                    month.
                                  name: Monthly
                            currencyCode:
                              type: string
                              description: An ISO 4217 currency code identifier for
                                the costs and savings amounts.
                              readOnly: true
                            costWithoutBenefit:
                              type: number
                              format: decimal
                              description: The current cost without benefit, corresponds
                                to 'totalHours' in the look-back period.
                              readOnly: true
                            recommendationDetails:
                              type: object
                              description: The details of the proposed recommendation.
                              properties:
                                overageCost:
                                  type: number
                                  format: decimal
                                  description: The difference between total cost and
                                    benefit cost for the 'totalHours' in the look-back
                                    period.
                                  readOnly: true
                                benefitCost:
                                  type: number
                                  format: decimal
                                  description: The estimated cost with benefit for
                                    the 'totalHours' in the look-back period. It's
                                    equal to (commitmentAmount * totalHours)
                                  readOnly: true
                                totalCost:
                                  type: number
                                  format: decimal
                                  description: Total cost, which is sum of benefit
                                    cost and overage cost.
                                  readOnly: true
                                savingsAmount:
                                  type: number
                                  format: decimal
                                  description: The amount saved for the 'totalHours'
                                    in the look-back period, by purchasing the recommended
                                    quantity of the benefit.
                                  readOnly: true
                                savingsPercentage:
                                  type: number
                                  format: decimal
                                  description: The savings in percentage for the 'totalHours'
                                    in the look-back period, by purchasing the recommended
                                    quantity of benefit.
                                  readOnly: true
                                coveragePercentage:
                                  description: Estimated benefit coverage percentage
                                    for the 'totalHours' in the look-back period,
                                    with this commitment.
                                  type: number
                                  format: decimal
                                  readOnly: true
                                commitmentAmount:
                                  description: The commitment amount at the commitmentGranularity.
                                  type: number
                                  format: decimal
                                  readOnly: true
                                averageUtilizationPercentage:
                                  description: Estimated average utilization percentage
                                    for the 'totalHours' in the look-back period,
                                    with this commitment.
                                  type: number
                                  format: decimal
                                  readOnly: true
                                wastageCost:
                                  description: Estimated unused portion of the 'benefitCost'.
                                  type: number
                                  format: decimal
                                  readOnly: true
                            allRecommendationDetails:
                              type: object
                              description: The list of all benefit recommendations
                                with the recommendation details.
                              readOnly: true
                              properties:
                                value:
                                  type: array
                                  description: The list of benefit recommendations
                                    with the recommendation details..
                                  readOnly: true
                                  items:
                                    description: Benefit recommendation details.
                                    type: object
                                    properties:
                                      overageCost:
                                        type: number
                                        format: decimal
                                        description: The difference between total
                                          cost and benefit cost for the 'totalHours'
                                          in the look-back period.
                                        readOnly: true
                                      benefitCost:
                                        type: number
                                        format: decimal
                                        description: The estimated cost with benefit
                                          for the 'totalHours' in the look-back period.
                                          It's equal to (commitmentAmount * totalHours)
                                        readOnly: true
                                      totalCost:
                                        type: number
                                        format: decimal
                                        description: Total cost, which is sum of benefit
                                          cost and overage cost.
                                        readOnly: true
                                      savingsAmount:
                                        type: number
                                        format: decimal
                                        description: The amount saved for the 'totalHours'
                                          in the look-back period, by purchasing the
                                          recommended quantity of the benefit.
                                        readOnly: true
                                      savingsPercentage:
                                        type: number
                                        format: decimal
                                        description: The savings in percentage for
                                          the 'totalHours' in the look-back period,
                                          by purchasing the recommended quantity of
                                          benefit.
                                        readOnly: true
                                      coveragePercentage:
                                        description: Estimated benefit coverage percentage
                                          for the 'totalHours' in the look-back period,
                                          with this commitment.
                                        type: number
                                        format: decimal
                                        readOnly: true
                                      commitmentAmount:
                                        description: The commitment amount at the
                                          commitmentGranularity.
                                        type: number
                                        format: decimal
                                        readOnly: true
                                      averageUtilizationPercentage:
                                        description: Estimated average utilization
                                          percentage for the 'totalHours' in the look-back
                                          period, with this commitment.
                                        type: number
                                        format: decimal
                                        readOnly: true
                                      wastageCost:
                                        description: Estimated unused portion of the
                                          'benefitCost'.
                                        type: number
                                        format: decimal
                                        readOnly: true
                                  x-ms-identifiers: []
                                nextLink:
                                  type: string
                                  description: The link (URL) to the next page of
                                    results.
                                  readOnly: true
                                  format: uri
                            scope:
                              description: Benefit scope. For example, Single or Shared.
                              type: string
                              enum:
                              - Single
                              - Shared
                              x-ms-enum:
                                name: scope
                                modelAsString: true
                                values:
                                - value: Single
                                  description: Single scope recommendation.
                                  name: Single
                                - value: Shared
                                  description: Shared scope recommendation.
                                  name: Shared
                          required:
                          - scope
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                  nextLink:
                    type: string
                    description: The link (URL) to the next page of results.
                    readOnly: true
                    format: uri
                description: Result of listing benefit recommendations.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: "Error response indicates that the service is not able\
