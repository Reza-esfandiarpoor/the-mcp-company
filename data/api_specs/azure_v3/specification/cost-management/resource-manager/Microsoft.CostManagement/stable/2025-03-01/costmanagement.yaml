  schemas:
    ReportConfigDefinition:
      description: The definition of a report config.
      type: object
      properties:
        type:
          description: The type of the report. Usage represents actual usage, forecast
            represents forecasted data and UsageAndForecast represents both usage
            and forecasted data. Actual usage and forecasted data can be differentiated
            based on dates.
          type: string
          enum:
          - Usage
          x-ms-enum:
            name: ReportType
            modelAsString: true
        timeframe:
          description: The time frame for pulling data for the report. If custom,
            then a specific time period must be provided.
          type: string
          enum:
          - WeekToDate
          - MonthToDate
          - YearToDate
          - Custom
          x-ms-enum:
            name: ReportTimeframeType
            modelAsString: true
        timePeriod:
          $ref: '#/components/schemas/ReportConfigTimePeriod'
        dataSet:
          $ref: '#/components/schemas/ReportConfigDataset'
        includeMonetaryCommitment:
          description: If true, report includes monetary commitment.
          type: boolean
      required:
      - type
      - timeframe
    ReportConfigTimePeriod:
      description: The start and end date for pulling data for the report.
      type: object
      properties:
        from:
          description: The start date to pull data from.
          type: string
          format: date-time
        to:
          description: The end date to pull data to.
          type: string
          format: date-time
      required:
      - from
      - to
    ReportConfigDataset:
      description: The definition of data present in the report.
      type: object
      properties:
        granularity:
          description: The granularity of rows in the report.
          type: string
          enum:
          - Daily
          - Monthly
          x-ms-enum:
            name: ReportGranularityType
            modelAsString: true
        configuration:
          $ref: '#/components/schemas/ReportConfigDatasetConfiguration'
        aggregation:
          type: object
          description: Dictionary of aggregation expression to use in the report.
            The key of each item in the dictionary is the alias for the aggregated
            column. Report can have up to 2 aggregation clauses.
          additionalProperties:
            $ref: '#/components/schemas/ReportConfigAggregation'
          x-ms-identifiers:
          - name
          maxItems: 2
        grouping:
          description: Array of group by expression to use in the report. Report can
            have up to 2 group by clauses.
          type: array
          items:
            $ref: '#/components/schemas/ReportConfigGrouping'
          x-ms-identifiers:
          - name
          - type
          maxItems: 2
        sorting:
          description: Array of order by expression to use in the report.
          type: array
          items:
            $ref: '#/components/schemas/ReportConfigSorting'
          x-ms-identifiers: []
        filter:
          $ref: '#/components/schemas/ReportConfigFilter'
    ReportConfigDatasetConfiguration:
      description: The configuration of dataset in the report.
      type: object
      properties:
        columns:
          description: Array of column names to be included in the report. Any valid
            report column name is allowed. If not provided, then report includes all
            columns.
          type: array
          items:
            type: string
    ReportConfigAggregation:
      description: The aggregation expression to be used in the report.
      type: object
      properties:
        name:
          description: The name of the column to aggregate.
          type: string
        function:
          description: The name of the aggregation function to use.
          type: string
          enum:
          - Sum
          x-ms-enum:
            name: FunctionType
            modelAsString: true
      required:
      - name
      - function
    ReportConfigSorting:
      description: The order by expression to be used in the report.
      type: object
      properties:
        direction:
          description: Direction of sort.
          type: string
          enum:
          - Ascending
          - Descending
          x-ms-enum:
            name: ReportConfigSortingType
            modelAsString: true
        name:
          description: The name of the column to sort.
          type: string
      required:
      - name
    ReportConfigGrouping:
      description: The group by expression to be used in the report.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ReportConfigColumnType'
        name:
          description: The name of the column to group. This version supports subscription
            lowest possible grain.
          type: string
      required:
      - type
      - name
    ReportConfigFilter:
      description: The filter expression to be used in the report.
      type: object
      properties:
        and:
          description: The logical "AND" expression. Must have at least 2 items.
          type: array
          items:
            $ref: '#/components/schemas/ReportConfigFilter'
          x-ms-identifiers: []
          minItems: 2
        or:
          description: The logical "OR" expression. Must have at least 2 items.
          type: array
          items:
            $ref: '#/components/schemas/ReportConfigFilter'
          x-ms-identifiers: []
          minItems: 2
        dimensions:
          $ref: '#/components/schemas/ReportConfigComparisonExpression'
        tags:
          $ref: '#/components/schemas/ReportConfigComparisonExpression'
    ReportConfigColumnType:
      description: The type of the column in the report.
      type: string
      enum:
      - TagKey
      - Dimension
      x-ms-enum:
        name: QueryColumnType
        modelAsString: true
        values:
        - value: TagKey
          description: The tag associated with the cost data.
        - value: Dimension
          description: The dimension of cost data.
    ReportConfigComparisonExpression:
      description: The comparison expression to be used in the report.
      type: object
      properties:
        name:
          description: The name of the column to use in comparison.
          type: string
        operator:
          description: The operator to use for comparison.
          type: string
          enum:
          - In
          - Contains
          x-ms-enum:
            name: OperatorType
            modelAsString: true
        values:
          description: Array of values to use for comparison
          type: array
          items:
            type: string
          minItems: 1
      required:
      - name
      - operator
      - values
