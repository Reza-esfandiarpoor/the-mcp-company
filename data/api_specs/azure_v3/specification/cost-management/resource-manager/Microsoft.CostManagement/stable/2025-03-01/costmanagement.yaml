  /{scope}/providers/Microsoft.CostManagement/forecast:
    post:
      tags:
      - Forecast
      operationId: Forecast_Usage
      description: Lists the forecast charges for scope defined.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      parameters:
      - name: $filter
        description: May be used to filter forecasts by properties/usageDate (Utc
          time), properties/chargeType or properties/grain. The filter supports 'eq',
          'lt', 'gt', 'le', 'ge', and 'and'. It does not currently support 'ne', 'or',
          or 'not'.
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/scopeForecastParameter'
      requestBody:
        $ref: '#/components/requestBodies/ForecastDefinition'
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResult'
        '204':
          description: No Content. Resource is not available.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers/Microsoft.CostManagement/{externalCloudProviderType}/{externalCloudProviderId}/forecast:
