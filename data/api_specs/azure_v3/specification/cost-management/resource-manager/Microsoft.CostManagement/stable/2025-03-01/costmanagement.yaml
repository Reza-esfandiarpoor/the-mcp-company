  ? /providers/Microsoft.Billing/billingAccounts/{billingAccountId}/providers/Microsoft.CostManagement/generateReservationDetailsReport
  : post:
      tags:
      - ReservedInstances
      operationId: GenerateReservationDetailsReport_ByBillingAccountId
      description: Generates the reservations details report for provided date range
        asynchronously based on enrollment id. The Reservation usage details can be
        viewed only by certain enterprise roles. For more details on the roles see,
        https://docs.microsoft.com/en-us/azure/cost-management-billing/manage/understand-ea-roles#usage-and-costs-access-by-role
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - $ref: '#/components/parameters/enrollmentIdParameter'
      - $ref: '#/components/parameters/startDateParameter'
      - $ref: '#/components/parameters/endDateParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request processing completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '202':
          description: Accepted. Request will be processed. Use the location header
            to check the status.
          headers:
            Location:
              description: The URL to check the status of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: The amount of delay to use while the status of the operation
                is checked. The value is expressed in seconds.
              schema:
                type: integer
                format: int32
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}/providers/Microsoft.CostManagement/generateReservationDetailsReport
  : post:
      tags:
      - ReservedInstances
      operationId: GenerateReservationDetailsReport_ByBillingProfileId
      description: Generates the reservations details report for provided date range
        asynchronously by billing profile. The Reservation usage details can be viewed
        by only certain enterprise roles by default. For more details on the roles
        see, https://docs.microsoft.com/en-us/azure/cost-management-billing/reservations/reservation-utilization#view-utilization-in-the-azure-portal-with-azure-rbac-access
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      parameters:
      - $ref: '#/components/parameters/billingAccountIdParameter'
      - $ref: '#/components/parameters/billingProfileIdParameter'
      - $ref: '#/components/parameters/startDateParameter'
      - $ref: '#/components/parameters/endDateParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Request processing completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
        '202':
          description: Accepted. Request will be processed. Use the Location header
            to check the status.
          headers:
            Location:
              description: The URL to check the status of the asynchronous operation.
              schema:
                type: string
            Retry-After:
              description: The amount of delay to use while the status of the operation
                is checked. The value is expressed in seconds.
              schema:
                type: integer
                format: int32
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
servers:
- url: https://management.azure.com
components:
  parameters:
    viewNameParameter:
      name: viewName
      in: path
      description: View name
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
    scopeViewParameter:
      name: scope
      in: path
      required: true
      description: The scope associated with view operations. This includes 'subscriptions/{subscriptionId}'
        for subscription scope, 'subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'
        for resourceGroup scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
        for Billing Account scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}'
        for Department scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}'
        for EnrollmentAccount scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}'
        for BillingProfile scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/invoiceSections/{invoiceSectionId}'
        for InvoiceSection scope, 'providers/Microsoft.Management/managementGroups/{managementGroupId}'
        for Management Group scope, 'providers/Microsoft.CostManagement/externalBillingAccounts/{externalBillingAccountName}'
        for External Billing Account scope and 'providers/Microsoft.CostManagement/externalSubscriptions/{externalSubscriptionName}'
        for External Subscription scope.
      x-ms-parameter-location: method
      schema:
        type: string
    scopeDimensionParameter:
      name: scope
      in: path
      required: true
      description: The scope associated with dimension operations. This includes '/subscriptions/{subscriptionId}/'
        for subscription scope, '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'
        for resourceGroup scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
        for Billing Account scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}'
        for Department scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}'
        for EnrollmentAccount scope, '/providers/Microsoft.Management/managementGroups/{managementGroupId}'
        for Management Group scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}'
        for billingProfile scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}/invoiceSections/{invoiceSectionId}'
        for invoiceSection scope, and 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/customers/{customerId}'
        specific for partners.
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
    scopeAlertParameter:
      name: scope
      in: path
      required: true
      description: The scope associated with alerts operations. This includes '/subscriptions/{subscriptionId}/'
        for subscription scope, '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'
        for resourceGroup scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
        for Billing Account scope and '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}'
        for Department scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}'
        for EnrollmentAccount scope, '/providers/Microsoft.Management/managementGroups/{managementGroupId}
        for Management Group scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}'
        for billingProfile scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}/invoiceSections/{invoiceSectionId}'
        for invoiceSection scope, and '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/customers/{customerId}'
        specific for partners.
      x-ms-parameter-location: method
      x-ms-skip-url-encoding: true
      schema:
        type: string
    scopeForecastParameter:
      name: scope
      in: path
      required: true
      description: The scope associated with forecast operations. This includes '/subscriptions/{subscriptionId}/'
        for subscription scope, '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'
        for resourceGroup scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
        for Billing Account scope and '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}'
        for Department scope, '/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}'
        for EnrollmentAccount scope, '/providers/Microsoft.Management/managementGroups/{managementGroupId}
