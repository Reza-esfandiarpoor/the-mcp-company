  /{scope}/providers/Microsoft.CostManagement/dimensions:
    get:
      tags:
      - Dimensions
      x-ms-odata: '#/components/schemas/Dimension'
      operationId: Dimensions_List
      description: Lists the dimensions by the defined scope.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      parameters:
      - $ref: '#/components/parameters/scopeDimensionParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: $filter
        description: May be used to filter dimensions by properties/category, properties/usageStart,
          properties/usageEnd. Supported operators are 'eq','lt', 'gt', 'le', 'ge'.
        in: query
        required: false
        schema:
          type: string
      - name: $expand
        description: May be used to expand the properties/data within a dimension
          category. By default, data is not included when listing dimensions.
        in: query
        required: false
        schema:
          type: string
      - name: $skiptoken
        description: Skiptoken is only used if a previous operation returned a partial
          result. If a previous response contains a nextLink element, the value of
          the nextLink element will include a skiptoken parameter that specifies a
          starting point to use for subsequent calls.
        in: query
        required: false
        schema:
          type: string
      - name: $top
        description: May be used to limit the number of results to the most recent
          N dimension data.
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DimensionsListResult'
        '204':
          description: No Content. Resource is not available.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable: {}
  /providers/Microsoft.CostManagement/{externalCloudProviderType}/{externalCloudProviderId}/dimensions:
    get:
      tags:
      - Dimensions
      x-ms-odata: '#/components/schemas/Dimension'
      operationId: Dimensions_ByExternalCloudProviderType
      description: Lists the dimensions by the external cloud provider type.
      externalDocs:
        url: https://docs.microsoft.com/en-us/rest/api/costmanagement/
      parameters:
      - $ref: '#/components/parameters/externalCloudProviderTypeParameter'
      - $ref: '#/components/parameters/externalCloudProviderIdParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
