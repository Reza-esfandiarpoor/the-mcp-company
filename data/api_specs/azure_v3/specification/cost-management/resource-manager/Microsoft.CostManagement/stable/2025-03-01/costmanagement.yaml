          application/json:
            schema:
              $ref: '#/components/schemas/DismissAlertPayload'
        description: Parameters supplied to the Dismiss Alert operation.
        required: true
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
