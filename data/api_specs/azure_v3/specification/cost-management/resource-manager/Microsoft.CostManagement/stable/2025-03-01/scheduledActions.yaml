                                    pattern: ^[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}$
                                  minItems: 1
                                  maxItems: 20
                                language:
                                  description: Locale of the email.
                                  type: string
                                message:
                                  description: Optional message to be added in the
                                    email. Length is limited to 250 characters.
                                  type: string
                                regionalFormat:
                                  description: Regional format used for formatting
                                    date/time and currency values in the email.
                                  type: string
                                subject:
                                  description: Subject of the email. Length is limited
                                    to 70 characters.
                                  type: string
