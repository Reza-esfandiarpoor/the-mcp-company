                            status:
                              description: Status of the scheduled action.
                              type: string
                              enum:
                              - Enabled
                              - Expired
                              - Disabled
                              x-ms-enum:
                                name: ScheduledActionStatus
                                modelAsString: true
                                values:
                                - value: Disabled
                                  description: Scheduled action is saved but will
