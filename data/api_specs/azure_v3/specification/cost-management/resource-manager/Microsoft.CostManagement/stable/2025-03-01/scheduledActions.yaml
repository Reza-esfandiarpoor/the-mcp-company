                                  type: integer
                                  description: UTC time at which cost analysis data
                                    will be emailed.
                                  format: int32
                                daysOfWeek:
                                  description: Day names in english on which cost
                                    analysis data will be emailed. This property is
                                    applicable when frequency is Weekly or Monthly.
                                  type: array
                                  items:
                                    type: string
                                    description: Days of Week.
                                    enum:
                                    - Monday
                                    - Tuesday
                                    - Wednesday
                                    - Thursday
                                    - Friday
                                    - Saturday
                                    - Sunday
                                    x-ms-enum:
                                      name: DaysOfWeek
                                      modelAsString: true
                                weeksOfMonth:
                                  description: Weeks in which cost analysis data will
                                    be emailed. This property is applicable when frequency
                                    is Monthly and used in combination with daysOfWeek.
                                  type: array
                                  items:
                                    type: string
                                    description: Weeks of month.
                                    enum:
                                    - First
                                    - Second
                                    - Third
                                    - Fourth
                                    - Last
                                    x-ms-enum:
                                      name: WeeksOfMonth
                                      modelAsString: true
                                dayOfMonth:
                                  type: integer
                                  description: UTC day on which cost analysis data
                                    will be emailed. Must be between 1 and 31. This
                                    property is applicable when frequency is Monthly
                                    and overrides weeksOfMonth or daysOfWeek.
                                  format: int32
                                startDate:
                                  description: The start date and time of the scheduled
                                    action (UTC).
                                  type: string
                                  format: date-time
                                endDate:
                                  description: The end date and time of the scheduled
                                    action (UTC).
                                  type: string
                                  format: date-time
                            scope:
                              description: For private scheduled action(Create or
                                Update), scope will be empty.<br /> For shared scheduled
                                action(Create or Update By Scope), Cost Management
                                scope can be 'subscriptions/{subscriptionId}' for
                                subscription scope, 'subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}'
                                for resourceGroup scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}'
                                for Billing Account scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}'
                                for Department scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}'
                                for EnrollmentAccount scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}'
                                for BillingProfile scope, 'providers/Microsoft.Billing/billingAccounts/{billingAccountId}/invoiceSections/{invoiceSectionId}'
                                for InvoiceSection scope, '/providers/Microsoft.CostManagement/externalBillingAccounts/{externalBillingAccountName}'
                                for ExternalBillingAccount scope, and '/providers/Microsoft.CostManagement/externalSubscriptions/{externalSubscriptionName}'
                                for ExternalSubscription scope.
