                          x-ms-client-flatten: true
                          title: Scheduled action properties
                          type: object
                          description: The properties of the scheduled action.
                          required:
                          - displayName
                          - notification
                          - schedule
                          - status
                          - viewId
                          properties:
                            displayName:
                              description: Scheduled action name.
                              type: string
                            fileDestination:
                              description: Destination format of the view data. This
                                is optional.
                              type: object
                              properties:
                                fileFormats:
                                  type: array
                                  description: Destination of the view data. Currently
                                    only CSV format is supported.
                                  items:
                                    type: string
                                    description: Destination of the view data. Currently
                                      only CSV format is supported.
                                    enum:
                                    - Csv
                                    x-ms-enum:
                                      name: FileFormat
