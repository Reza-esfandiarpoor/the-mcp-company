openapi: 3.0.0
info:
  title: CostManagementClient
  version: 2025-03-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.CostManagement/scheduledActions:
    get:
      tags:
      - ScheduledActions
      operationId: ScheduledActions_List
      description: List all private scheduled actions.
      externalDocs:
        url: https://docs.microsoft.com/rest/api/cost-management/
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: $filter
        description: May be used to filter scheduled actions by properties/viewId.
          Supported operator is 'eq'.
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK. The request has succeeded.
          content:
            application/json:
              schema:
                description: Scheduled actions list result. It contains a list of
                  scheduled actions.
                type: object
                properties:
                  value:
                    description: The list of scheduled actions.
                    type: array
                    readOnly: true
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        eTag:
                          type: string
                          readOnly: true
                          description: Resource Etag. For update calls, eTag is optional
                            and can be specified to achieve optimistic concurrency.
                            Fetch the resource's eTag by doing a 'GET' call first
                            and then including the latest eTag as part of the request
                            body or 'If-Match' header while performing the update.
                            For create calls, eTag is not required.
                        kind:
                          description: Kind of the scheduled action.
                          type: string
                          enum:
                          - Email
                          - InsightAlert
                          x-ms-enum:
                            name: ScheduledActionKind
                            modelAsString: true
                            values:
                            - value: Email
                              description: Cost analysis data will be emailed.
                              name: Email
                            - value: InsightAlert
                              description: Cost anomaly information will be emailed.
                                Available only on subscription scope at daily frequency.
                                If no anomaly is detected on the resource, an email
                                won't be sent.
                              name: InsightAlert
                        systemData:
                          description: Kind of the scheduled action.
                          type: object
                          readOnly: true
                          properties:
                            createdBy:
                              type: string
                              description: The identity that created the resource.
                            createdByType:
                              type: string
                              description: The type of identity that created the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
