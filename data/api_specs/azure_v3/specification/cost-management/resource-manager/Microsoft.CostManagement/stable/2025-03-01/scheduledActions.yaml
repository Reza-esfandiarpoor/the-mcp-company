                                      name: Daily
                                    - value: Weekly
                                      description: Cost analysis data will be emailed
                                        every week.
                                      name: Weekly
                                    - value: Monthly
                                      description: Cost analysis data will be emailed
                                        every month.
                                      name: Monthly
