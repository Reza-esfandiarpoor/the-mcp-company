                                                - ReservationScope
                                                - ResourceType
                                                - LookBackPeriod
                                                x-ms-enum:
                                                  name: FilterItemNames
                                                  modelAsString: true
                                              value:
                                                type: string
                                                description: Value to filter by. Currently
                                                  values supported per name are, for
                                                  'ReservationScope' supported values
                                                  are ['Single', 'Shared'], for 'LookBackPeriod'
                                                  supported values are ['Last7Days',
                                                  'Last30Days', 'Last60Days'] and
                                                  for 'ResourceType' supported values
                                                  are ['VirtualMachines', 'SQLDatabases',
                                                  'PostgreSQL', 'ManagedDisk', 'MySQL',
                                                  'RedHat', 'MariaDB', 'RedisCache',
                                                  'CosmosDB', 'SqlDataWarehouse',
                                                  'SUSELinux', 'AppService', 'BlockBlob',
                                                  'AzureDataExplorer', 'VMwareCloudSimple'].
