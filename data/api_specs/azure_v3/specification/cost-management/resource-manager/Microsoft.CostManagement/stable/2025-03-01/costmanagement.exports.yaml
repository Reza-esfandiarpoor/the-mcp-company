                              properties:
                                type:
                                  description: The type of the export. Note that 'Usage'
                                    is equivalent to 'ActualCost' and is applicable
                                    to exports that do not yet provide data for charges
                                    or amortization for service reservations.
                                  type: string
                                  enum:
