                              properties:
                                destination:
                                  description: Has destination for the export being
                                    delivered.
                                  type: object
                                  properties:
                                    type:
                                      description: The export delivery destination
                                        type. Currently only 'AzureBlob' is supported.
                                      type: string
                                      enum:
                                      - AzureBlob
                                      x-ms-enum:
                                        name: DestinationType
                                        modelAsString: true
                                    resourceId:
                                      description: The resource id of the storage
                                        account where exports will be delivered. This
                                        is not required if a sasToken and storageAccount
                                        are specified.
                                      type: string
                                    container:
                                      description: The name of the container where
                                        exports will be uploaded. If the container
                                        does not exist it will be created.
                                      type: string
                                    rootFolderPath:
                                      description: The name of the directory where
                                        exports will be uploaded.
                                      type: string
                                    sasToken:
                                      description: 'A SAS token for the storage account.
                                        For a restricted set of Azure customers this
                                        together with storageAccount can be specified
                                        instead of resourceId. Note: the value returned
                                        by the API for this property will always be
                                        obfuscated. Returning this same obfuscated
                                        value will not result in the SAS token being
                                        updated. To update this value a new SAS token
                                        must be specified.'
