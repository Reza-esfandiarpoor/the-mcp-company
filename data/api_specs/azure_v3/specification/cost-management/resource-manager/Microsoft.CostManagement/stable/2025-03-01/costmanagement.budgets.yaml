    Notification:
      description: "The notification associated with a budget.\n\n Supported for CategoryType(s):\
        \ Cost, ReservationUtilization."
      type: object
      properties:
        enabled:
          description: "The notification is enabled or not.\n\n Supported for CategoryType(s):\
            \ Cost, ReservationUtilization."
          type: boolean
        operator:
          description: "The comparison operator.\n\n Supported for CategoryType(s):\
            \ Cost, ReservationUtilization.\n\n Supported operators for **CategoryType:\
            \ Cost**\n- GreaterThan\n- GreaterThanOrEqualTo\n\n Supported operators\
            \ for **CategoryType: ReservationUtilization**\n- LessThan"
          type: string
          enum:
          - EqualTo
          - GreaterThan
          - GreaterThanOrEqualTo
          - LessThan
          x-ms-enum:
            name: BudgetNotificationOperatorType
            modelAsString: true
            values:
            - value: EqualTo
              description: "Notification will be triggered if the evaluated cost is\
                \ the same as threshold value. Note: It\u2019s not recommended to\
                \ use this OperatorType as there\u2019s low chance of cost being exactly\
                \ the same as threshold value, leading to missing of your alert. This\
                \ OperatorType will be deprecated in future.\n\n Supported for CategoryType(s):\
                \ Cost."
              name: EqualTo
            - value: GreaterThan
              description: "Notification will be triggered if the evaluated cost is\
                \ greater than the threshold value. Note: This is the recommended\
                \ OperatorType while configuring Budget Alert.\n\n Supported for CategoryType(s):\
                \ Cost."
              name: GreaterThan
            - value: GreaterThanOrEqualTo
              description: "Notification will be triggered if the evaluated cost is\
                \ greater than or equal to the threshold value.\n\n Supported for\
                \ CategoryType(s): Cost."
              name: GreaterThanOrEqualTo
            - value: LessThan
              description: "Notification will be triggered if any Reservations in\
                \ the scope of the Reservation Utilization Alert Rule have a utilization\
                \ less than the threshold percentage.\n\n Supported for CategoryType(s):\
                \ ReservationUtilization."
              name: LessThan
        threshold:
          description: "Threshold value associated with a notification. It is always\
            \ percent with a maximum of 2 decimal places.\n\n Supported for CategoryType(s):\
            \ Cost, ReservationUtilization.\n\n **CategoryType: Cost** - Must be between\
            \ 0 and 1000. Notification is sent when the cost exceeded the threshold.\n\
            \n **CategoryType: ReservationUtilization** - Must be between 0 and 100.\
            \ Notification is sent when a reservation has a utilization percentage\
            \ below the threshold."
          type: number
        frequency:
          description: "Frequency of a notification. Represents how long the notification\
            \ will be silent after triggering an alert for a threshold breach. If\
            \ not specified, the frequency will be set by default based on the timeGrain\
            \ (Weekly when timeGrain: Last7Days, Monthly when timeGrain: Last30Days).\n\
            \n Supported for CategoryType(s): ReservationUtilization."
          type: string
          enum:
          - Daily
          - Weekly
          - Monthly
          x-ms-enum:
            name: Frequency
            modelAsString: true
            values:
            - value: Daily
              description: After the threshold breaches and an Alert is fired, no
                further alerts will be sent until the next calendar day.
              name: Daily
            - value: Weekly
              description: After the threshold breaches and an Alert is fired, no
                further alerts will be sent for 7 calendar days.
              name: Weekly
            - value: Monthly
              description: After the threshold breaches and an Alert is fired, no
                further alerts will be sent for 30 calendar days.
              name: Monthly
        contactEmails:
          description: "Email addresses to send the notification to when the threshold\
            \ is breached. Must have at least one contact email or contact group specified\
            \ at the Subscription or Resource Group scopes. All other scopes must\
            \ have at least one contact email specified.\n\n Supported for CategoryType(s):\
            \ Cost, ReservationUtilization."
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 50
        contactRoles:
          description: "Subscription or Resource Group scopes only. Contact roles\
            \ to send the notification to when the threshold is breached.\n\n Supported\
            \ for CategoryType(s): Cost."
          type: array
          items:
            type: string
        contactGroups:
          description: "Subscription or Resource Group scopes only. Action groups\
            \ to send the notification to when the threshold is exceeded. Must be\
            \ provided as a fully qualified Azure resource id.\n\n Supported for CategoryType(s):\
            \ Cost."
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 50
        thresholdType:
          description: "The type of threshold.\n\n Supported for CategoryType(s):\
            \ Cost."
          type: string
          enum:
          - Actual
          - Forecasted
          x-ms-enum:
            name: ThresholdType
            modelAsString: true
            values:
            - value: Actual
              description: Actual costs budget alerts notify when the actual accrued
                cost exceeds the allocated budget.
              name: Actual
            - value: Forecasted
              description: Forecasted costs budget alerts provide advanced notification
                that your spending trends are likely to exceed your allocated budget,
                as it relies on forecasted cost predictions.
              name: Forecasted
          default: Actual
        locale:
          description: "Language in which the recipient will receive the notification,\
            \ \n\n Supported for CategoryType(s): Cost, ReservationUtilization."
          type: string
          enum:
          - en-us
          - ja-jp
          - zh-cn
          - de-de
          - es-es
          - fr-fr
          - it-it
          - ko-kr
          - pt-br
          - ru-ru
          - zh-tw
          - cs-cz
          - pl-pl
          - tr-tr
          - da-dk
          - en-gb
          - hu-hu
          - nb-no
          - nl-nl
          - pt-pt
          - sv-se
          x-ms-enum:
            name: CultureCode
            modelAsString: true
      required:
      - enabled
      - operator
      - threshold
      - contactEmails
