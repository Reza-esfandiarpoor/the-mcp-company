openapi: 3.0.0
info:
  title: CostManagementClient
  version: 2025-03-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: CostAllocationRules
  description: An API for creating and managing cost allocation rules within a billing
    account or enterprise enrollment. These rules can be used to reallocate cost between
    resources, filtered by Resource Group, Subscription, or Tag.
paths:
  /providers/Microsoft.Billing/billingAccounts/{billingAccountId}/providers/Microsoft.CostManagement/costAllocationRules:
    get:
      tags:
      - CostAllocationRules
      operationId: CostAllocationRules_List
      description: Get the list of all cost allocation rules for a billing account
        or enterprise enrollment.
      x-ms-pageable:
        nextLinkName: nextLink
      parameters:
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: billingAccountId
        in: path
        description: BillingAccount ID
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: List of cost allocation rules for the billing account or enterprise
            enrollment.
          content:
            application/json:
              schema:
                type: object
                description: Result of listing cost allocation rules. It contains
                  a list of available rules in the billing account or enterprise enrollment
                  provided.
                properties:
                  value:
                    description: The list of cost allocation rules.
                    type: array
                    items:
                      type: object
                      description: The cost allocation rule model definition
                      properties:
                        id:
                          type: string
                          readOnly: true
                          description: Azure Resource Manager Id for the rule. This
                            is a read ony value.
                        name:
                          type: string
                          readOnly: true
                          description: Name of the rule. This is a read only value.
                        type:
                          type: string
                          readOnly: true
                          description: Resource type of the rule. This is a read only
                            value of Microsoft.CostManagement/CostAllocationRule.
                        properties:
                          description: Cost allocation rule properties
                          type: object
                          additionalProperties: false
                          required:
                          - details
                          - status
                          properties:
                            description:
                              description: Description of a cost allocation rule.
                              type: string
                            details:
                              description: Resource information for the cost allocation
                                rule
                              type: object
                              properties:
                                sourceResources:
                                  description: Source resources for cost allocation.
                                    At this time, this list can contain no more than
                                    one element.
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      resourceType:
                                        description: Type of resources contained in
                                          this cost allocation rule
                                        type: string
                                        enum:
                                        - Dimension
                                        - Tag
