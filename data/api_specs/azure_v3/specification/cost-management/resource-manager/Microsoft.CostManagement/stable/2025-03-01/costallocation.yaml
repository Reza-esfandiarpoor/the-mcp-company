                                            name:
                                              description: Target resource for cost
                                                allocation
                                              type: string
                                            percentage:
                                              description: Percentage of source cost
                                                to allocate to this resource. This
                                                value can be specified to two decimal
                                                places and the total percentage of
                                                all resources in this rule must sum
                                                to 100.00.
