                                      values:
                                        description: Source Resources for cost allocation.
                                          This list cannot contain more than 25 values.
                                        type: array
                                        items:
                                          description: Source resource for cost allocation
                                          type: string
                                        x-ms-identifiers:
                                        - name
                                    required:
                                    - resourceType
                                    - name
                                    - values
                                    description: Common values for resources for cost
                                      allocation
