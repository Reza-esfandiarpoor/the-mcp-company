                                          name: CostAllocationResourceType
                                          modelAsString: true
                                          values:
                                          - value: Dimension
                                            description: Indicates an Azure dimension
                                              such as a subscription id or resource
                                              group name is being used for allocation.
                                            name: Dimension
                                          - value: Tag
                                            description: Allocates cost based on Azure
                                              Tag key value pairs.
                                            name: Tag
                                      name:
                                        description: If resource type is dimension,
                                          this must be either ResourceGroupName or
                                          SubscriptionId. If resource type is tag,
                                          this must be a valid Azure tag
