          "renew", and "release". Use "acquire" and specify the "x-ms-proposed-lease-id"
          and "x-ms-lease-duration" to acquire a new lease. Use "break" to break an
          existing lease. When a lease is broken, the lease break period is allowed
          to elapse, during which time no lease operation except break and release
          can be performed on the file. When a lease is successfully broken, the response
          indicates the interval in seconds until a new lease can be acquired. Use
          "change" and specify the current lease ID in "x-ms-lease-id" and the new
          lease ID in "x-ms-proposed-lease-id" to change the lease ID of an active
          lease. Use "renew" and specify the "x-ms-lease-id" to renew an existing
          lease. Use "release" and specify the "x-ms-lease-id" to release a lease.'
