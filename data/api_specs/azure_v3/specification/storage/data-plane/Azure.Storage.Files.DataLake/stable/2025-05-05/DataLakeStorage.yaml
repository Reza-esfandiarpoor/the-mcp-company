      description: Create and manage a lease to restrict write and delete access to
        the path. This operation supports conditional HTTP requests.  For more information,
        see [Specifying Conditional Headers for Blob Service Operations](https://learn.microsoft.com/rest/api/storageservices/specifying-conditional-headers-for-blob-service-operations).
