openapi: 3.0.0
info:
  description: Azure Data Lake Storage provides storage for Hadoop and other big data
    workloads.
  title: Azure Data Lake Storage REST API
  version: 2025-05-05
  x-ms-code-generation-settings:
    internalConstructors: true
    name: DataLakeStorageClient
    header: MIT
    strictSpecAdherence: false
servers:
- url: '{url}'
  variables:
    url:
      description: The URL of the service account, container, or blob that is the
        target of the desired operation.
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
paths: {}
components:
  parameters:
    Url:
      name: url
      description: The URL of the service account, container, or blob that is the
        target of the desired operation.
      required: true
      x-ms-parameter-location: client
      in: path
      x-ms-skip-url-encoding: true
      schema:
        type: string
    FileSystemResource:
      name: resource
      in: query
      x-ms-parameter-location: client
      description: The value must be "filesystem" for all filesystem operations.
      required: true
      x-ms-enum:
        name: FileSystemResourceType
        modelAsString: false
      schema:
        type: string
        enum:
        - filesystem
    ApiVersionParameter:
      name: x-ms-version
      x-ms-parameter-location: client
      x-ms-client-name: version
      in: header
      required: true
      description: Specifies the version of the operation to use for this request.
      schema:
        type: string
        enum:
        - 2025-05-05
    accountName:
      description: The Azure Storage account name.
      in: path
      name: accountName
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: method
      schema:
        type: string
    dnsSuffix:
      description: The DNS suffix for the Azure Data Lake Storage endpoint.
      in: path
      name: dnsSuffix
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: method
      schema:
        type: string
        default: dfs.core.windows.net
    ClientRequestId:
      name: x-ms-client-request-id
      x-ms-client-name: requestId
      in: header
      required: false
      x-ms-parameter-location: method
      description: Provides a client-generated, opaque value with a 1 KB character
        limit that is recorded in the analytics logs when storage analytics logging
        is enabled.
      schema:
        type: string
    Timeout:
      name: timeout
      in: query
      required: false
      x-ms-parameter-location: method
      description: The timeout parameter is expressed in seconds. For more information,
        see <a href="https://learn.microsoft.com/rest/api/storageservices/setting-timeouts-for-blob-service-operations">Setting
        Timeouts for Blob Service Operations.</a>
      schema:
        type: integer
        minimum: 0
    IfMatch:
      name: If-Match
      x-ms-client-name: ifMatch
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: modified-access-conditions
      description: Specify an ETag value to operate only on blobs with a matching
        value.
      schema:
        type: string
    IfModifiedSince:
      name: If-Modified-Since
      x-ms-client-name: ifModifiedSince
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: modified-access-conditions
      description: Specify this header value to operate only on a blob if it has been
        modified since the specified date/time.
      schema:
        type: string
        format: date-time-rfc1123
    IfNoneMatch:
      name: If-None-Match
      x-ms-client-name: ifNoneMatch
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: modified-access-conditions
      description: Specify an ETag value to operate only on blobs without a matching
        value.
      schema:
        type: string
    IfUnmodifiedSince:
      name: If-Unmodified-Since
      x-ms-client-name: ifUnmodifiedSince
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: modified-access-conditions
      description: Specify this header value to operate only on a blob if it has not
        been modified since the specified date/time.
      schema:
        type: string
        format: date-time-rfc1123
    RecursiveOptional:
      name: recursive
      x-ms-parameter-location: method
      in: query
      description: Required
      required: false
      schema:
        type: boolean
    RecursiveRequired:
      name: recursive
      x-ms-parameter-location: method
      in: query
      description: Required
      required: true
      schema:
        type: boolean
    Continuation:
      name: continuation
      x-ms-parameter-location: method
      in: query
      description: Optional.  When deleting a directory, the number of paths that
        are deleted with each invocation is limited.  If the number of paths to be
        deleted exceeds this limit, a continuation token is returned in this response
        header.  When a continuation token is returned in the response, it must be
        specified in a subsequent invocation of the delete operation to continue deleting
        the directory.
      required: false
      schema:
        type: string
    PathSetAccessControlRecursiveMode:
      name: mode
      in: query
      x-ms-parameter-location: method
      description: Mode "set" sets POSIX access control rights on files and directories,
        "modify" modifies one or more POSIX access control rights  that pre-exist
        on files and directories, "remove" removes one or more POSIX access control
        rights  that were present earlier on files and directories
      required: true
      x-ms-enum:
        name: PathSetAccessControlRecursiveMode
        modelAsString: false
      schema:
        type: string
        enum:
        - set
        - modify
        - remove
    ForceFlag:
      name: forceFlag
      x-ms-parameter-location: method
      in: query
      description: Optional. Valid for "SetAccessControlRecursive" operation. If set
        to false, the operation will terminate quickly on encountering user errors
        (4XX). If true, the operation will ignore user errors and proceed with the
        operation on other sub-entities of the directory. Continuation token will
        only be returned when forceFlag is true in case of user errors. If not set
        the default value is false for this.
      required: false
      schema:
        type: boolean
    Directory:
      name: directory
      x-ms-client-name: Path
      x-ms-parameter-location: method
      in: query
      description: Optional.  Filters results to paths within the specified directory.
        An error occurs if the directory does not exist.
      required: false
      schema:
        type: string
    LeaseIdOptional:
      name: x-ms-lease-id
      x-ms-client-name: leaseId
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: lease-access-conditions
      description: If specified, the operation only succeeds if the resource's lease
        is active and matches this ID.
      schema:
        type: string
    LeaseIdRequired:
      name: x-ms-lease-id
      x-ms-client-name: leaseId
      in: header
      required: true
      x-ms-parameter-location: method
      description: Specifies the current lease ID on the resource.
      schema:
        type: string
    ProposedLeaseIdOptional:
      name: x-ms-proposed-lease-id
      x-ms-client-name: proposedLeaseId
      in: header
      required: false
      x-ms-parameter-location: method
      description: Proposed lease ID, in a GUID string format. The Blob service returns
        400 (Invalid request) if the proposed lease ID is not in the correct format.
        See Guid Constructor (String) for a list of valid GUID string formats.
      schema:
        type: string
    LeaseDuration:
      name: x-ms-lease-duration
      in: header
      description: The lease duration is required to acquire a lease, and specifies
        the duration of the lease in seconds.  The lease duration must be between
        15 and 60 seconds or -1 for infinite lease.
      required: false
      x-ms-parameter-location: client
      schema:
        type: integer
        format: int32
    LeaseDurationMethod:
      name: x-ms-lease-duration
      x-ms-client-name: leaseDuration
      in: header
      description: The lease duration is required to acquire a lease, and specifies
        the duration of the lease in seconds.  The lease duration must be between
        15 and 60 seconds or -1 for infinite lease.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int64
    LeaseAction:
      name: x-ms-lease-action
      x-ms-client-name: leaseAction
      in: header
      x-ms-parameter-location: method
      description: Optional. If "acquire" it will acquire the lease. If "auto-renew"
        it will renew the lease. If "release" it will release the lease only on flush.
        If "acquire-release" it will acquire & complete the operation & release the
        lease once operation is done.
      required: false
      x-ms-enum:
        name: LeaseAction
        modelAsString: false
      schema:
        type: string
        enum:
        - acquire
        - auto-renew
        - release
        - acquire-release
    Prefix:
      name: prefix
      in: query
      description: Filters results to filesystems within the specified prefix.
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    MaxResults:
      name: maxResults
      in: query
      description: An optional value that specifies the maximum number of items to
        return. If omitted or greater than 5,000, the response will include up to
        5,000 items.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        minimum: 1
    Properties:
      name: x-ms-properties
      x-ms-client-name: properties
      description: Optional. User-defined properties to be stored with the filesystem,
        in the format of a comma-separated list of name and value pairs "n1=v1, n2=v2,
        ...", where each value is a base64 encoded string. Note that the string may
        only contain ASCII characters in the ISO-8859-1 character set.  If the filesystem
        exists, any properties not included in the list will be removed.  All properties
        are removed if the header is omitted.  To merge new and existing properties,
        first get all existing properties and the current E-Tag, then make a conditional
        request with the E-Tag and include values for all properties.
      in: header
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    SourceIfMatch:
      name: x-ms-source-if-match
      x-ms-client-name: sourceIfMatch
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: source-modified-access-conditions
      description: Specify an ETag value to operate only on blobs with a matching
        value.
      schema:
        type: string
    SourceIfModifiedSince:
      name: x-ms-source-if-modified-since
      x-ms-client-name: sourceIfModifiedSince
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: source-modified-access-conditions
      description: Specify this header value to operate only on a blob if it has been
        modified since the specified date/time.
      schema:
        type: string
        format: date-time-rfc1123
    SourceIfNoneMatch:
      name: x-ms-source-if-none-match
      x-ms-client-name: sourceIfNoneMatch
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: source-modified-access-conditions
      description: Specify an ETag value to operate only on blobs without a matching
        value.
      schema:
        type: string
    SourceIfUnmodifiedSince:
      name: x-ms-source-if-unmodified-since
      x-ms-client-name: sourceIfUnmodifiedSince
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: source-modified-access-conditions
      description: Specify this header value to operate only on a blob if it has not
        been modified since the specified date/time.
      schema:
        type: string
        format: date-time-rfc1123
    SourceLeaseId:
      name: x-ms-source-lease-id
      x-ms-client-name: sourceLeaseId
      in: header
      required: false
      x-ms-parameter-location: method
      description: A lease ID for the source path. If specified, the source path must
        have an active lease and the lease ID must match.
      schema:
        type: string
    FileSystem:
      name: filesystem
      x-ms-parameter-location: client
      x-ms-client-name: fileSystem
      in: path
      description: The filesystem identifier.
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: ^[$a-z0-9](?!.*--)[-a-z0-9]{1,61}[a-z0-9]$
    Path:
      name: path
      x-ms-parameter-location: client
      in: path
      description: The file or directory path.
      required: true
      schema:
        type: string
    CacheControl:
      name: x-ms-cache-control
      x-ms-client-name: cacheControl
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Optional. Sets the blob's cache control. If specified, this property
        is stored with the blob and returned with a read request.
      schema:
        type: string
    ContentDisposition:
      name: x-ms-content-disposition
      x-ms-client-name: contentDisposition
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Optional. Sets the blob's Content-Disposition header.
      schema:
        type: string
    ContentEncoding:
      name: x-ms-content-encoding
      x-ms-client-name: contentEncoding
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Optional. Sets the blob's content encoding. If specified, this
        property is stored with the blob and returned with a read request.
      schema:
        type: string
    ContentLanguage:
      name: x-ms-content-language
      x-ms-client-name: contentLanguage
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Optional. Set the blob's content language. If specified, this property
        is stored with the blob and returned with a read request.
      schema:
        type: string
    ContentType:
      name: x-ms-content-type
      x-ms-client-name: contentType
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Optional. Sets the blob's content type. If specified, this property
        is stored with the blob and returned with a read request.
      schema:
        type: string
    TransactionalContentMD5:
      name: Content-MD5
      x-ms-client-name: transactionalContentHash
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Specify the transactional md5 for the body, to be validated by
        the service.
      schema:
        type: string
        format: byte
    ContentMD5:
      name: x-ms-content-md5
      x-ms-client-name: contentMD5
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: path-HTTP-headers
      description: Specify the transactional md5 for the body, to be validated by
        the service.
      schema:
        type: string
        format: byte
    ContentCrc64:
      name: x-ms-content-crc64
      x-ms-client-name: transactionalContentCrc64
      in: header
      required: false
      x-ms-parameter-location: method
      description: Specify the transactional crc64 for the body, to be validated by
        the service.
      schema:
        type: string
        format: byte
    StructuredBodyPut:
      name: x-ms-structured-body
      x-ms-client-name: StructuredBodyType
      in: header
      required: false
      x-ms-parameter-location: method
      description: Required if the request body is a structured message. Specifies
        the message schema version and properties.
      schema:
        type: string
    StructuredContentLength:
      name: x-ms-structured-content-length
      x-ms-client-name: StructuredContentLength
      in: header
      required: false
      x-ms-parameter-location: method
      description: Required if the request body is a structured message. Specifies
        the length of the blob/file content inside the message body. Will always be
        smaller than Content-Length.
      schema:
        type: integer
        format: int64
    Umask:
      name: x-ms-umask
      x-ms-client-name: umask
      description: Optional and only valid if Hierarchical Namespace is enabled for
        the account. When creating a file or directory and the parent folder does
        not have a default ACL, the umask restricts the permissions of the file or
        directory to be created.  The resulting permission is given by p bitwise and
        not u, where p is the permission and u is the umask.  For example, if p is
        0777 and u is 0057, then the resulting permission is 0720.  The default permission
        is 0777 for a directory and 0666 for a file.  The default umask is 0027.  The
        umask must be specified in 4-digit octal notation (e.g. 0766).
      in: header
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    Permissions:
      name: x-ms-permissions
      x-ms-client-name: permissions
      description: Optional and only valid if Hierarchical Namespace is enabled for
        the account. Sets POSIX access permissions for the file owner, the file owning
        group, and others. Each class may be granted read, write, or execute permission.  The
        sticky bit is also supported.  Both symbolic (rwxrw-rw-) and 4-digit octal
        notation (e.g. 0766) are supported.
      in: header
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    RenameSource:
      name: x-ms-rename-source
      x-ms-client-name: renameSource
      in: header
      description: 'An optional file or directory to be renamed.  The value must have
        the following format: "/{filesystem}/{path}".  If "x-ms-properties" is specified,
        the properties will overwrite the existing properties; otherwise, the existing
        properties will be preserved. This value must be a URL percent-encoded string.
        Note that the string may only contain ASCII characters in the ISO-8859-1 character
        set.'
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    Owner:
      name: x-ms-owner
      x-ms-client-name: owner
      in: header
      required: false
      description: Optional. The owner of the blob or directory.
      x-ms-parameter-location: method
      schema:
        type: string
    Group:
      name: x-ms-group
      x-ms-client-name: group
      in: header
      required: false
      description: Optional. The owning group of the blob or directory.
      x-ms-parameter-location: method
      schema:
        type: string
    Acl:
      name: x-ms-acl
      description: Sets POSIX access control rights on files and directories. The
        value is a comma-separated list of access control entries. Each access control
        entry (ACE) consists of a scope, a type, a user or group identifier, and permissions
        in the format "[scope:][type]:[id]:[permissions]".
      x-ms-client-name: acl
      in: header
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    Upn:
      name: upn
      in: query
      description: Optional. Valid only when Hierarchical Namespace is enabled for
        the account. If "true", the user identity values returned in the x-ms-owner,
        x-ms-group, and x-ms-acl response headers will be transformed from Azure Active
        Directory Object IDs to User Principal Names.  If "false", the values will
        be returned as Azure Active Directory Object IDs. The default value is false.
        Note that group and application Object IDs are not translated because they
        do not have unique friendly names.
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    Position:
      name: position
      in: query
      description: This parameter allows the caller to upload data in parallel and
        control the order in which it is appended to the file.  It is required when
        uploading data to be appended to the file and when flushing previously uploaded
        data to the file.  The value must be the position where the data is to be
        appended.  Uploaded data is not immediately flushed, or written, to the file.  To
        flush, the previously uploaded data must be contiguous, the position parameter
        must be specified and equal to the length of the file after all data has been
        written, and there must not be a request entity body included with the request.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int64
    RetainUncommittedData:
      name: retainUncommittedData
      in: query
      description: Valid only for flush operations.  If "true", uncommitted data is
        retained after the flush operation completes; otherwise, the uncommitted data
        is deleted after the flush operation.  The default is false.  Data at offsets
        less than the specified position are written to the file when flush succeeds,
        but this optional parameter allows data after the flush position to be retained
        for a future flush operation.
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    Close:
      name: close
      in: query
      description: Azure Storage Events allow applications to receive notifications
        when files change. When Azure Storage Events are enabled, a file changed event
        is raised. This event has a property indicating whether this is the final
        change to distinguish the difference between an intermediate flush to a file
        stream and the final close of a file stream. The close query parameter is
        valid only when the action is "flush" and change notifications are enabled.
        If the value of close is "true" and the flush operation completes successfully,
        the service raises a file change notification with a property indicating that
        this is the final update (the file stream has been closed). If "false" a change
        notification is raised indicating the file has changed. The default is false.
        This query parameter is set to true by the Hadoop ABFS driver to indicate
        that the file stream has been closed."
      required: false
      x-ms-parameter-location: method
      schema:
        type: boolean
    ContentLength:
      name: Content-Length
      in: header
      description: Required for "Append Data" and "Flush Data".  Must be 0 for "Flush
        Data".  Must be the length of the request content in bytes for "Append Data".
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int64
        minimum: 0
    PathExpiryOptions:
      name: x-ms-expiry-option
      x-ms-client-name: ExpiryOptions
      in: header
      required: true
      x-ms-enum:
        name: PathExpiryOptions
        modelAsString: true
      x-ms-parameter-location: method
      description: Required. Indicates mode of the expiry time
      schema:
        type: string
        enum:
        - NeverExpire
        - RelativeToCreation
        - RelativeToNow
        - Absolute
    PathExpiryOptionsOptional:
      name: x-ms-expiry-option
      x-ms-client-name: ExpiryOptions
      in: header
      required: false
      x-ms-enum:
        name: PathExpiryOptions
        modelAsString: true
      x-ms-parameter-location: method
      description: Required. Indicates mode of the expiry time
      schema:
        type: string
        enum:
        - NeverExpire
        - RelativeToCreation
        - RelativeToNow
        - Absolute
    PathExpiryTime:
      name: x-ms-expiry-time
      x-ms-client-name: ExpiresOn
      in: header
      required: false
      x-ms-parameter-location: method
      description: The time to set the blob to expiry
      schema:
        type: string
    UndeleteSource:
      name: x-ms-undelete-source
      x-ms-client-name: UndeleteSource
      in: header
      required: false
      x-ms-parameter-location: method
      description: Only for hierarchical namespace enabled accounts. Optional. The
        path of the soft deleted blob to undelete.
      schema:
        type: string
    Marker:
      name: marker
      in: query
      required: false
      description: A string value that identifies the portion of the list of containers
        to be returned with the next listing operation. The operation returns the
        NextMarker value within the response body if the listing operation did not
        return all containers remaining to be listed with the current page. The NextMarker
        value can be used as the value for the marker parameter in a subsequent call
        to request the next page of list items. The marker value is opaque to the
        client.
      x-ms-parameter-location: method
      schema:
        type: string
    ListBlobsInclude:
      name: include
      in: query
      required: false
      x-ms-parameter-location: method
      description: Include this parameter to specify one or more datasets to include
        in the response.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - copy
          - deleted
          - metadata
          - snapshots
          - uncommittedblobs
          - versions
          - tags
          x-ms-enum:
            name: ListBlobsIncludeItem
            modelAsString: false
    ListBlobsShowOnly:
      name: showonly
      in: query
      required: false
      x-ms-enum:
        name: ListBlobsShowOnly
        modelAsString: false
      x-ms-parameter-location: method
      description: Include this parameter to specify one or more datasets to include
        in the response.
      schema:
        type: string
        enum:
        - deleted
    Delimiter:
      name: delimiter
      description: When the request includes this parameter, the operation returns
        a BlobPrefix element in the response body that acts as a placeholder for all
        blobs whose names begin with the same substring up to the appearance of the
        delimiter character. The delimiter may be a single character or a string.
      x-ms-parameter-location: method
      in: query
      required: false
      schema:
        type: string
    EncryptionKey:
      name: x-ms-encryption-key
      x-ms-client-name: encryptionKey
      in: header
      required: false
      x-ms-parameter-location: method
      x-ms-parameter-grouping:
        name: cpk-info
      description: Optional. Specifies the encryption key to use to encrypt the data
        provided in the request. If not specified, encryption is performed with the
        root account encryption key.  For more information, see Encryption at Rest
        for Azure Storage Services.
      schema:
        type: string
    EncryptionKeySha256:
      name: x-ms-encryption-key-sha256
      x-ms-client-name: encryptionKeySha256
      in: header
      required: false
