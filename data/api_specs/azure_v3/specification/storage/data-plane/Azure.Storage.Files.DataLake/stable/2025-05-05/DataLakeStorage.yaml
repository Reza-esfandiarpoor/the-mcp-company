                for the account. When deleting a directory, the number of paths that
                are deleted with each invocation is limited.  If the number of paths
                to be deleted exceeds this limit, a continuation token is returned
                in this response when the following conditions are met: Delete should
                be on a directory with query parameters "recursive" and "paginated"
