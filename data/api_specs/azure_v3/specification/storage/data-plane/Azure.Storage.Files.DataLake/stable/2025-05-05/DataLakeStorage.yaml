    delete:
      operationId: FileSystem_Delete
      summary: Delete FileSystem
      description: Marks the FileSystem for deletion.  When a FileSystem is deleted,
        a FileSystem with the same identifier cannot be created for at least 30 seconds.
        While the filesystem is being deleted, attempts to create a filesystem with
        the same identifier will fail with status code 409 (Conflict), with the service
        returning additional error information indicating that the filesystem is being
        deleted. All other operations, including operations on any files or directories
        within the filesystem, will fail with status code 404 (Not Found) while the
        filesystem is being deleted. This operation supports conditional HTTP requests.  For
        more information, see [Specifying Conditional Headers for Blob Service Operations](https://learn.microsoft.com/rest/api/storageservices/specifying-conditional-headers-for-blob-service-operations).
