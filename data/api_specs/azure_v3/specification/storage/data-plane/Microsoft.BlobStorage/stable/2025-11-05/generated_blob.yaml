            x-ms-blob-type:
              description: The type of the blob.
              x-ms-enum:
                name: BlobType
                modelAsString: false
                values:
                - name: BlockBlob
                  value: BlockBlob
                  description: The blob is a block blob.
                - name: PageBlob
                  value: PageBlob
                  description: The blob is a page blob.
                - name: AppendBlob
                  value: AppendBlob
                  description: The blob is an append blob.
              schema:
                type: string
                enum:
                - BlockBlob
                - PageBlob
                - AppendBlob
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
