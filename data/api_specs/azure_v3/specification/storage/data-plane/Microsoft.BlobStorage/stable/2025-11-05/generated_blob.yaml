            x-ms-lease-duration:
              description: Specifies the duration of the lease, in seconds, or negative
                one (-1) for a lease that never expires. A non-infinite lease can
                be between 15 and 60 seconds. A lease duration cannot be changed using
                renew or change.
              x-ms-enum:
                name: LeaseDuration
                modelAsString: false
                values:
                - name: Infinite
                  value: infinite
                  description: The lease is of infinite duration.
                - name: Fixed
                  value: fixed
                  description: The lease is of fixed duration.
              schema:
                type: string
                enum:
                - infinite
                - fixed
            x-ms-lease-state:
              description: Lease state of the blob.
              x-ms-enum:
                name: LeaseState
                modelAsString: false
                values:
                - name: Available
                  value: available
                  description: The lease is available.
                - name: Leased
                  value: leased
                  description: The lease is currently leased.
                - name: Expired
                  value: expired
                  description: The lease is expired.
                - name: Breaking
                  value: breaking
                  description: The lease is breaking.
                - name: Broken
                  value: broken
                  description: The lease is broken.
              schema:
