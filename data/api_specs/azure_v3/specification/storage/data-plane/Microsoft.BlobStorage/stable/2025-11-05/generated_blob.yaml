openapi: 3.0.0
info:
  title: Azure Storage Blob service
  version: 2025-11-05
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
servers:
- url: '{url}'
  variables:
    url:
      description: The host name of the blob storage account, e.g. accountName.blob.core.windows.net
      format: uri
      x-ms-skip-url-encoding: true
      default: none
security:
- OAuth2Auth:
  - https://storage.azure.com/.default
tags: []
paths:
  /{containerName}/{blobName}:
    get:
      operationId: Blob_Download
      description: The Download operation reads or downloads a blob from the system,
        including its metadata and properties. You can also call Download to read
        a snapshot.
      parameters:
      - name: x-ms-version
        in: header
        description: Specifies the version of the operation to use for this request.
        required: true
        x-ms-client-name: version
        schema:
          type: string
      - name: x-ms-client-request-id
        in: header
        description: An opaque, globally-unique, client-generated string identifier
          for the request.
        required: false
        x-ms-client-name: clientRequestId
        schema:
          type: string
          format: uuid
      - name: containerName
        in: path
        description: The name of the container.
        required: true
        schema:
          type: string
      - name: blobName
        in: path
        description: The name of the blob.
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 1024
          pattern: ^[a-zA-Z0-9]+(?:/[a-zA-Z0-9]+)*(?:\.[a-zA-Z0-9]+){0,1}$
      - name: snapshot
        in: query
        description: The snapshot parameter is an opaque DateTime value that, when
          present, specifies the blob snapshot to retrieve. For more information on
          working with blob snapshots, see <a href="https://docs.microsoft.com/en-us/rest/api/storageservices/fileservices/creating-a-snapshot-of-a-blob">Creating
          a Snapshot of a Blob.</a>
        required: false
        schema:
          type: string
      - name: versionid
        in: query
        description: The version id parameter is an opaque DateTime value that, when
          present, specifies the version of the blob to operate on. It's for service
          version 2019-10-10 and newer.
        required: false
        x-ms-client-name: versionId
        schema:
          type: string
      - name: timeout
        in: query
        description: The timeout parameter is expressed in seconds. For more information,
          see <a href="https://docs.microsoft.com/en-us/rest/api/storageservices/fileservices/setting-timeouts-for-blob-service-operations">Setting
          Timeouts for Blob Service Operations.</a>
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: Range
        in: header
        description: Return only the bytes of the blob in the specified range.
        required: false
        x-ms-client-name: range
        schema:
          type: string
      - name: x-ms-lease-id
        in: header
        description: If specified, the operation only succeeds if the resource's lease
          is active and matches this ID.
        required: false
        x-ms-client-name: leaseId
        schema:
          type: string
      - name: x-ms-range-get-content-md5
        in: header
        description: When set to true and specified together with the Range, the service
          returns the MD5 hash for the range, as long as the range is less than or
          equal to 4 MB in size.
        required: false
        x-ms-client-name: rangeGetContentMd5
        schema:
          type: boolean
      - name: x-ms-range-get-content-crc64
        in: header
        description: Optional.  When this header is set to true and specified together
          with the Range header, the service returns the CRC64 hash for the range,
          as long as the range is less than or equal to 4 MB in size.
        required: false
        x-ms-client-name: rangeGetContentCrc64
        schema:
          type: boolean
      - name: x-ms-structured-body
        in: header
        description: Specifies the response content should be returned as a structured
          message and specifies the message schema version and properties.
        required: false
        x-ms-client-name: structuredBodyType
        schema:
          type: string
      - name: x-ms-encryption-key
        in: header
        description: Optional.  Version 2019-07-07 and later.  Specifies the encryption
          key to use to encrypt the data provided in the request. If not specified,
          the request will be encrypted with the root account key.
        required: false
        x-ms-client-name: encryptionKey
        schema:
          type: string
      - name: x-ms-encryption-key-sha256
        in: header
        description: Optional.  Version 2019-07-07 and later.  Specifies the SHA256
          hash of the encryption key used to encrypt the data provided in the request.
          This header is only used for encryption with a customer-provided key. If
          the request is authenticated with a client token, this header should be
          specified using the SHA256 hash of the encryption key.
        required: false
        x-ms-client-name: encryptionKeySha256
        schema:
          type: string
      - name: x-ms-encryption-algorithm
        in: header
        description: Optional.  Version 2019-07-07 and later.  Specifies the algorithm
          to use for encryption. If not specified, the default is AES256.
        required: false
        x-ms-enum:
          name: EncryptionAlgorithmType
          modelAsString: false
          values:
          - name: AES256
            value: AES256
            description: The AES256 encryption algorithm.
        x-ms-client-name: encryptionAlgorithm
        schema:
          type: string
          enum:
          - AES256
      - name: x-ms-if-tags
        in: header
        description: Specify a SQL where clause on blob tags to operate only on blobs
          with a matching value.
        required: false
        x-ms-client-name: ifTags
        schema:
          type: string
      - name: If-Match
        in: header
        description: The request should only proceed if an entity matches this string.
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: ifMatch
        schema:
          type: string
      - name: If-None-Match
        in: header
        description: The request should only proceed if no entity matches this string.
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: ifNoneMatch
        schema:
          type: string
      - name: If-Unmodified-Since
        in: header
        description: The request should only proceed if the entity was not modified
          after this time.
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: ifUnmodifiedSince
        schema:
          type: string
          format: date-time
      - name: If-Modified-Since
        in: header
        description: The request should only proceed if the entity was modified after
          this time.
        required: false
        x-ms-parameter-location: method
        x-ms-client-name: ifModifiedSince
        schema:
          type: string
          format: date-time
