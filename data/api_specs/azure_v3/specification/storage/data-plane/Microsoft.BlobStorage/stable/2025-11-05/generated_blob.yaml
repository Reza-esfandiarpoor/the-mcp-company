            x-ms-or:
              description: Optional. Only valid when Object Replication is enabled
                for the storage container and on the source blob of the replication.
                When retrieving this header, it will return the header with the policy
                id and rule id (e.g. x-ms-or-policyid_ruleid), and the value will
                be the status of the replication (e.g. complete, failed).
              schema:
                type: string
            x-ms-or-policy-id:
              description: Optional. Only valid when Object Replication is enabled
