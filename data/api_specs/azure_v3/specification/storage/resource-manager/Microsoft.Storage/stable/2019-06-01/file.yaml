                                        type: array
                                        items:
                                          type: string
                                        description: Required if CorsRule element
                                          is present. A list of response headers to
                                          expose to CORS clients.
                                      allowedHeaders:
                                        type: array
                                        items:
                                          type: string
                                        description: Required if CorsRule element
                                          is present. A list of headers allowed to
                                          be part of the cross-origin request.
