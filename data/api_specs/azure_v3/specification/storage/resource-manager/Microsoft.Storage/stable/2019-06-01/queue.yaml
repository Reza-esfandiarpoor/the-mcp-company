          group. Storage account names must be between 3 and 24 characters in length
          and use numbers and lower-case letters only.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 3
          maxLength: 24
      - name: api-version
        in: query
        required: true
        description: The API version to use for this operation.
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        required: true
        description: The ID of the target subscription.
        schema:
          type: string
          minLength: 1
      - name: queueName
        in: path
        required: true
        description: A queue name must be unique within a storage account and must
          be between 3 and 63 characters.The name must comprise of lowercase alphanumeric
          and dash(-) characters only, it should begin and end with an alphanumeric
          character and it cannot have two consecutive dash(-) characters.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9]([a-z0-9]|(-(?!-))){1,61}[a-z0-9]$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  readOnly: true
                  type: string
                  description: Fully qualified resource ID for the resource. Ex -
                    /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                name:
                  readOnly: true
                  type: string
                  description: The name of the resource
