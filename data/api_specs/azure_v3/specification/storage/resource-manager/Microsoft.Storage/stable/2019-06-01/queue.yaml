                  readOnly: true
                  type: string
                  description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                    or "Microsoft.Storage/storageAccounts"
                properties:
                  x-ms-client-flatten: true
                  x-ms-client-name: QueueProperties
                  description: Queue resource properties.
                  properties:
                    metadata:
                      type: object
                      additionalProperties:
                        type: string
                      description: A name-value pair that represents queue metadata.
                    approximateMessageCount:
                      type: integer
                      readOnly: true
                      description: Integer indicating an approximate number of messages
                        in the queue. This number is not lower than the actual number
                        of messages in the queue, but could be higher.
              title: Resource
              description: Common fields that are returned in the response for all
                Azure Resource Manager resources
              x-ms-azure-resource: true
        description: Queue properties and metadata to be created with
        required: true
      responses:
        '200':
          description: OK -- Creates a queue with the given queue name successfully.
