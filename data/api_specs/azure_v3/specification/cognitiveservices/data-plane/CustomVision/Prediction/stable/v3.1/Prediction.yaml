  /{projectId}/detect/iterations/{publishedName}/image:
    post:
      description: Detect objects in an image and saves the result.
      operationId: ObjectDetector_AnalyzeImage
      parameters:
      - name: projectId
        in: path
        description: The project id.
        required: true
        x-nullable: false
        schema:
          type: string
          format: uuid
      - name: publishedName
        in: path
        description: Specifies the name of the model to evaluate against.
        required: true
        schema:
          type: string
      - name: application
        in: query
        description: Optional. Specifies the name of application using the endpoint.
        required: false
        x-nullable: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageData:
                  description: Binary image data. Supported formats are JPEG, GIF,
                    PNG, and BMP. Supports images up to 4MB.
                  type: string
                  format: binary
              required:
              - imageData
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Result of an image prediction request.
                type: object
                properties:
                  id:
                    format: uuid
                    description: Prediction Id.
                    type: string
                    readOnly: true
                    nullable: false
                  project:
                    format: uuid
                    description: Project Id.
                    type: string
                    readOnly: true
                    nullable: false
                  iteration:
                    format: uuid
                    description: Iteration Id.
                    type: string
                    readOnly: true
                    nullable: false
                  created:
                    format: date-time
                    description: Date this prediction was created.
                    type: string
                    readOnly: true
                    nullable: false
                  predictions:
                    description: List of predictions.
                    type: array
                    items:
                      description: Prediction result.
                      type: object
                      properties:
                        probability:
                          format: float
                          description: Probability of the tag.
                          type: number
                          readOnly: true
                          nullable: false
                        tagId:
                          format: uuid
                          description: Id of the predicted tag.
                          type: string
                          readOnly: true
                          nullable: false
                        tagName:
                          description: Name of the predicted tag.
                          type: string
                          readOnly: true
                          nullable: true
                        boundingBox:
                          description: Bounding box of the prediction.
                          readOnly: true
                          required:
                          - left
                          - top
                          - width
                          - height
                          type: object
                          properties:
                            left:
                              format: float
                              description: Coordinate of the left boundary.
                              type: number
                              readOnly: false
                              nullable: false
                            top:
                              format: float
                              description: Coordinate of the top boundary.
                              type: number
                              readOnly: false
                              nullable: false
                            width:
                              format: float
                              description: Width.
                              type: number
                              readOnly: false
                              nullable: false
                            height:
                              format: float
                              description: Height.
                              type: number
                              readOnly: false
                              nullable: false
                          nullable: true
                        tagType:
                          description: Type of the predicted tag.
                          enum:
                          - Regular
                          - Negative
                          - GeneralProduct
                          type: string
                          readOnly: true
                          x-ms-enum:
                            name: TagType
                            modelAsString: true
                          nullable: true
