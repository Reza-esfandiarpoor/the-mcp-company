        in: path
        description: The project id.
        required: true
        x-nullable: false
        schema:
          type: string
          format: uuid
      - name: publishedName
        in: path
        description: Specifies the name of the model to evaluate against.
        required: true
        schema:
          type: string
      - name: application
        in: query
        description: Optional. Specifies the name of application using the endpoint.
        required: false
        x-nullable: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageData:
                  description: Binary image data. Supported formats are JPEG, GIF,
                    PNG, and BMP. Supports images up to 4MB.
                  type: string
                  format: binary
              required:
              - imageData
        required: true
