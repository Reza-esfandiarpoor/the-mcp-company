openapi: 3.0.0
info:
  title: Speaker Verification API
  version: 2021-09-05
  description: 'The Azure Cognitive Service Speaker Recognition service provides algorithms
    that verify and identify speakers by their unique voice characteristics.

    Speaker Recognition is used to answer the question "who is speaking?"'
servers:
- url: '{endpoint}/speaker-recognition/verification'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apiKeyHeader: []
tags: []
paths:
  /text-dependent/profiles:
    post:
      description: Create a new speaker profile with specified locale.
      operationId: TextDependent_CreateProfile
      summary: Create Profile
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      requestBody:
        content:
          application/json:
            schema:
              description: Speaker profile locale
              type: object
              required:
              - locale
              properties:
                locale:
                  type: string
                  pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                  description: Language identifier consisting of a combination of
                    language code and country code.
                  nullable: false
        description: 'Provide following detail info when creating a new profile.

          Fields  | Description

          ------- | ------------

          locale  | Locale for the language of this speaker profile. A complete supported
          locale list is here: <ul><li>**en-US (American English)**</li></li></ul>'
      responses:
        '201':
          description: Speaker profile created successfully. GUID is returned to reference
            the created profile.
          headers:
            location:
              description: url location of new resource
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Text-Dependent Speaker profile info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  locale:
                    type: string
                    pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                    description: Language identifier consisting of a combination of
                      language code and country code.
                    nullable: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile.\
                      \ Available values are:\n* Enrolling: profile has no voice print\
                      \ and not ready for recognition requests.\n* Training: voice\
                      \ print of profile is being created and can\u2019t be used for\
                      \ recognition at the moment.\n* Enrolled: profile has a voice\
                      \ print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  createdDateTime:
                    type: string
                    format: date-time
                    description: Profile creation datetime.
                  lastUpdatedDateTime:
                    type: string
                    format: date-time
                    description: Last datetime when the profile was updated.
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsCount:
                    type: integer
                    description: Number of enrollment audios needed to complete profile
                      enrollment.
                  modelVersion:
                    type: string
                    format: date
                    description: Date specifying the model assigned to this profile.
                      Format is yyyy-mm-dd. If profile has no enrollments, this value
                      will be empty.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
    get:
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
      description: 'Retrieves a set of profiles.

        Profiles are sorted alphabetically by ProfileId'
      operationId: TextDependent_ListProfiles
      summary: List Profiles
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: query
        name: maxpagesize
        description: The number of profiles to return. Default is 100 and the maximum
          is 500
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Text-Dependent Speaker profile info list
                type: object
                required:
                - value
                properties:
                  value:
                    type: array
                    items:
                      description: Text-Dependent Speaker profile info
                      type: object
                      properties:
                        profileId:
                          type: string
                          description: Unique identifier for profile id (guid).
                          format: uuid
                          nullable: false
                        locale:
                          type: string
                          pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                          description: Language identifier consisting of a combination
                            of language code and country code.
                          nullable: false
                        enrollmentStatus:
                          type: string
                          description: "Status representing the current state of the\
                            \ profile. Available values are:\n* Enrolling: profile\
                            \ has no voice print and not ready for recognition requests.\n\
                            * Training: voice print of profile is being created and\
                            \ can\u2019t be used for recognition at the moment.\n\
                            * Enrolled: profile has a voice print and ready for recognition\
                            \ requests."
                          enum:
                          - Enrolling
                          - Training
                          - Enrolled
                          x-ms-enum:
                            name: TrainingStatusType
                            modelAsString: false
                        createdDateTime:
                          type: string
                          format: date-time
                          description: Profile creation datetime.
                        lastUpdatedDateTime:
                          type: string
                          format: date-time
                          description: Last datetime when the profile was updated.
                        enrollmentsCount:
                          type: integer
                          description: Number of enrollment audios accepted for this
                            profile.
                        enrollmentsLengthInSec:
                          type: number
                          description: Total length of enrollment audios accepted
                            for this profile in seconds.
                        enrollmentsSpeechLengthInSec:
                          type: number
                          description: Summation of pure speech (which is the amount
                            of audio after removing silence and non-speech segments)
                            across all profile enrollments in seconds.
                        remainingEnrollmentsCount:
                          type: integer
                          description: Number of enrollment audios needed to complete
                            profile enrollment.
                        modelVersion:
                          type: string
                          format: date
                          description: Date specifying the model assigned to this
                            profile. Format is yyyy-mm-dd. If profile has no enrollments,
                            this value will be empty.
                  nextLink:
                    type: string
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-dependent/profiles/{profileId}:
