        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Text-Dependent Speaker profile info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  locale:
                    type: string
                    pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                    description: Language identifier consisting of a combination of
                      language code and country code.
                    nullable: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile.\
                      \ Available values are:\n* Enrolling: profile has no voice print\
                      \ and not ready for recognition requests.\n* Training: voice\
                      \ print of profile is being created and can\u2019t be used for\
                      \ recognition at the moment.\n* Enrolled: profile has a voice\
                      \ print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  createdDateTime:
                    type: string
                    format: date-time
                    description: Profile creation datetime.
                  lastUpdatedDateTime:
                    type: string
                    format: date-time
                    description: Last datetime when the profile was updated.
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsCount:
                    type: integer
                    description: Number of enrollment audios needed to complete profile
                      enrollment.
                  modelVersion:
                    type: string
                    format: date
                    description: Date specifying the model assigned to this profile.
                      Format is yyyy-mm-dd. If profile has no enrollments, this value
                      will be empty.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
    delete:
      description: Deletes an existing profile.
      operationId: TextDependent_DeleteProfile
      summary: Delete Profile
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: OK
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-dependent/profiles/{profileId}:reset:
    post:
      description: 'Resets existing profile to its original creation state. The reset
        operation does the following:

        * Updates enrollmentStatus to Enrolling.

        * Updates lastUpdatedDateTime.

        * Updates enrollmentsCount to 0.

        * Updates enrollmentsLength to 0.

        * Updates enrollmentsSpeechLength to 0.

        * Updates remainingEnrollmentsCount to the initial required number.

        * Removes all associated enrollments from storage.

        * Removes chosen passphrase association.

        * Resets value of modelVersion.'
      operationId: TextDependent_ResetProfile
      summary: Reset Profile
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Speaker profile reset successfully. Profile is returned with
            reset values.
          headers:
            Location:
              description: url location of the resource
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Text-Dependent Speaker profile info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  locale:
                    type: string
                    pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                    description: Language identifier consisting of a combination of
                      language code and country code.
                    nullable: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile.\
                      \ Available values are:\n* Enrolling: profile has no voice print\
                      \ and not ready for recognition requests.\n* Training: voice\
                      \ print of profile is being created and can\u2019t be used for\
                      \ recognition at the moment.\n* Enrolled: profile has a voice\
                      \ print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  createdDateTime:
                    type: string
                    format: date-time
                    description: Profile creation datetime.
                  lastUpdatedDateTime:
                    type: string
                    format: date-time
                    description: Last datetime when the profile was updated.
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsCount:
                    type: integer
                    description: Number of enrollment audios needed to complete profile
                      enrollment.
                  modelVersion:
                    type: string
                    format: date
                    description: Date specifying the model assigned to this profile.
                      Format is yyyy-mm-dd. If profile has no enrollments, this value
                      will be empty.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-dependent/profiles/{profileId}/enrollments:
    post:
      description: 'Adds an enrollment to existing profile.

        If the minimum number of requested enrollment audios is reached, a voice print
        is created.

        If the voice print was created before, it gets recreated from all existing
        enrollment audios including the new one.


        Limitations:

        * Minimum audio input length per request is **1 second**

        * Maximum audio input length per request is **10 seconds**

        * Minimum number of enrollments for creating a voiceprint is **3**

        * Maximum number of enrollments for creating a voiceprint is **50**

        * Minimum audio Signal-to-noise ratio (SNR) is **2dB**


        Constraints:

        * First enrollment must match an existing passphrase.

        * All enrollments after the first one, must use the same passphrase used in
        the first enrollment.'
      operationId: TextDependent_CreateEnrollment
      summary: Enroll Profile
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm.
          Supports audio up to 5MB.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                description: Text-Dependent Speaker profile enrollment info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile.\
                      \ Available values are:\n* Enrolling: profile has no voice print\
                      \ and not ready for recognition requests.\n* Training: voice\
                      \ print of profile is being created and can\u2019t be used for\
                      \ recognition at the moment.\n* Enrolled: profile has a voice\
                      \ print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsCount:
                    type: integer
                    description: Number of enrollment audios needed to complete profile
                      enrollment.
                  passPhrase:
                    type: string
                    description: Passphrase associated with this enrollment.
                  audioLengthInSec:
                    type: number
                    description: This enrollment audio length in seconds.
                  audioSpeechLengthInSec:
                    type: number
                    description: This enrollment audio pure speech (which is the amount
                      of audio after removing silence and non-speech segments) length
                      in seconds.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-dependent/profiles/{profileId}:verify:
    post:
      description: 'Verifies existing profiles against input audio.


        Limitations:

        * Minimum audio input length per request is **1 second**

        * Maximum audio input length per request is **10 seconds**

        * Minimum audio Signal-to-noise ratio (SNR) is **10 dB**'
      operationId: TextDependent_VerifyProfile
      summary: Verify Profile
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm.
          Supports audio up to 5MB.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Speaker recognition result
                type: object
                properties:
                  recognitionResult:
                    type: string
                    description: Does audio belong to targeted profile?
                    enum:
                    - accept
                    - reject
                    x-ms-enum:
                      name: ResultType
                      modelAsString: false
                  score:
                    type: number
                    description: A float number indicating the similarity between
                      input audio and targeted voice print. This number must be between
                      0 and 1. A higher number means higher similarity.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-dependent/phrases/{locale}:
    get:
      description: Retrieves list of supported passphrases for a specific locale.
      operationId: TextDependent_ListPhrases
      summary: Pass Phrases
      tags:
      - text-dependent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: locale
        required: true
        x-nullable: false
        description: A combination of language code and country code.
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Pass phrase list
                type: object
                required:
                - value
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        passPhrase:
                          type: string
                          description: Passphrase associated with this enrollment.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-independent/profiles:
    post:
      description: Creates a new speaker profile with specified locale.
      operationId: TextIndependent_CreateProfile
      summary: Create Profile
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      requestBody:
        content:
          application/json:
            schema:
              description: Speaker profile locale
              type: object
              required:
              - locale
              properties:
                locale:
                  type: string
                  pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                  description: Language identifier consisting of a combination of
                    language code and country code.
                  nullable: false
        description: 'Provide following detail info when creating a new profile.

          Fields  | Description

          ------- | ------------

          locale  | Locale for the language of this speaker profile. A complete supported
          locale list is here: <ul><li>**en-US (American English)**</li><li>**es-ES
          (Castilian Spanish)**</li><li>**fr-FR (Standard French)**</li><li>**zh-CN
          (Mandarin Chinese)**</li></ul>'
      responses:
        '201':
          description: Speaker profile created successfully. GUID is returned to reference
            the created profile.
          headers:
            location:
              description: url location of new resource
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Text-Independent Speaker profile info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  locale:
                    type: string
                    pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                    description: Language identifier consisting of a combination of
                      language code and country code.
                    nullable: false
                  profileStatus:
                    type: string
                    description: 'Status representing the current state of the profile.
                      Available values are:

                      * Active: profile is active and can be used if the enrollment
                      status is ''Enrolled''.

                      * Inactive: profile has not been activated and an activation
                      phrase must be submitted.'
                    enum:
                    - Active
                    - Inactive
                    x-ms-enum:
                      name: ProfileStatusType
                      modelAsString: false
                  enrollmentStatus:
                    type: string
