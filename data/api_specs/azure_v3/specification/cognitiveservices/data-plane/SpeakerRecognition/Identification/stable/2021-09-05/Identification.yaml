              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-independent/profiles/{profileId}/enrollments:
    post:
      description: "Adds an enrollment to existing profile.\nThe first enrollment\
        \ must be a predefined activation phrase which can be listed using the /phrases/{locale}\
        \ api.\nIf the minimum number of requested enrollment audios is reached, a\
        \ voice print is created.\nAny further enrollment will be used to improve\
        \ the voice print.\n\nLimitations:\n* Minimum audio input length per request\
        \ is **1 second**\n* Maximum audio input length per request is **120 seconds**\n\
        * Minimum total effective speech length (excluding silence and other non-speech\
        \ frames) for creating a voiceprint is **20 seconds**\n  This limitation can\
        \ be disabled by setting ignoreMinLength to **true**.\n\n* Maximum total audio\
        \ input length allowed for creating a voiceprint is **300 seconds**\n* Minimum\
        \ audio Signal-to-noise ratio (SNR) is **2dB**"
      operationId: TextIndependent_CreateEnrollment
      summary: Enroll Profile
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - in: query
        name: ignoreMinLength
        description: If true, a voice print will be created immediately for this profile
          regardless of how much speech is supplied or stored. Default is false.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm.
          Supports audio up to 5MB.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                description: Speaker profile enrollment info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile\
                      \ enrollment. Available values are:\n* Enrolling: profile has\
                      \ no voice print and not ready for recognition requests.\n*\
                      \ Training: voice print of profile is being created and can\u2019\
                      t be used for recognition at the moment.\n* Enrolled: profile\
                      \ has a voice print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsSpeechLengthInSec:
                    type: number
                    description: Amount of pure speech (which is the amount of audio
                      after removing silence and non-speech segments) needed to complete
                      profile enrollment in seconds.
                  audioLengthInSec:
                    type: number
                    description: This enrollment audio length in seconds.
                  audioSpeechLengthInSec:
                    type: number
                    description: This enrollment audio pure speech (which is the amount
                      of audio after removing silence and non-speech segments) length
                      in seconds.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-independent/profiles:identifySingleSpeaker:
    post:
      description: "Identifies who is speaking in input audio among a list of candidate\
        \ profiles.\n\nLimitations:\n* Minimum audio input length is **1 second**\n\
        * Maximum audio input length is **120 seconds**\n* Minimum candidate speakers\
        \ count is **1**\n* Maximum candidate speakers count is **50**\n* Minimum\
        \ effective speech length (excluding silence and other non-speech frames)\
        \ is **4 seconds**\n  This limitation can be disabled by setting \"ignoreMinLength\"\
        \ to **true**.\n\n* Minimum audio Signal-to-noise ratio (SNR) is **2dB**"
      operationId: TextIndependent_IdentifySingleSpeaker
      summary: Identify Single Speaker Profile
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: query
        name: profileIds
        required: true
        description: Comma-delimited profile IDs. Maximum supported number is 50 IDs.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
      - in: query
        name: ignoreMinLength
        description: If true, the minimum amount of speech needed for identification
          is skipped. Default is false.
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          audio/wav; codecs=audio/pcm:
            schema:
              type: object
              format: file
        description: Binary audio file. Supported formats are audio/wav; codecs=audio/pcm.
          Supports audio up to 5MB.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifiedProfile:
                    description: Object containing data of identified profile.
                    type: object
                    properties:
                      profileId:
                        type: string
                        description: ID of identified of profile. If no candidate
                          is identified as the right speaker, the value is set to
                          empty GUID.
                        format: uuid
                        nullable: false
                      score:
                        type: number
                        description: A float number indicating the similarity between
                          input audio and targeted voice print. This number must be
                          between 0 and 1. A higher number means higher similarity.
                  profilesRanking:
                    description: Object containing data of the top 5 profiles (including
                      identified profile) sorted in descending order by score.
                    type: array
                    items:
                      description: Identified speaker info
                      type: object
                      properties:
                        profileId:
                          type: string
                          description: ID of identified of profile. If no candidate
                            is identified as the right speaker, the value is set to
                            empty GUID.
                          format: uuid
                          nullable: false
                        score:
                          type: number
                          description: A float number indicating the similarity between
                            input audio and targeted voice print. This number must
                            be between 0 and 1. A higher number means higher similarity.
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /text-independent/phrases/{locale}:
    get:
      description: Retrieves list of supported passphrases for a specific locale.
      operationId: TextIndependent_ListActivationPhrases
      summary: Activation Phrases
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
