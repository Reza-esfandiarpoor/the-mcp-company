                      message:
                        type: string
  /text-independent/profiles/{profileId}:reset:
    post:
      description: 'Resets existing profile to its original creation state. The reset
        operation does the following:

        * Updates enrollmentStatus to Enrolling.

        * Updates lastUpdatedDateTime.

        * Updates enrollmentsCount to 0.

        * Updates enrollmentsLength to 0.

        * Updates enrollmentsSpeechLength to 0.

        * Updates remainingEnrollmentsSpeechLength to the required number.

        * Removes all associated enrollments from storage.

        * Removes chosen passphrase association.

        * Resets value of modelVersion.'
      operationId: TextIndependent_ResetProfile
      summary: Reset Profile
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Speaker profile reset successfully. Profile is returned with
            reset values.
          headers:
            location:
              description: url location of the resource
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Text-Independent Speaker profile info
                type: object
                properties:
                  profileId:
                    type: string
                    description: Unique identifier for profile id (guid).
                    format: uuid
                    nullable: false
                  locale:
                    type: string
                    pattern: ^[a-zA-Z]{2}-?[a-zA-Z]{2}$
                    description: Language identifier consisting of a combination of
                      language code and country code.
                    nullable: false
                  profileStatus:
                    type: string
                    description: 'Status representing the current state of the profile
                      activation. Available values are:

                      * Active: profile is active and can be used if the enrollment
                      status is ''Enrolled''.

                      * Inactive: profile has not been activated and an activation
                      phrase must be submitted.'
                    enum:
                    - Active
                    - Inactive
                    x-ms-enum:
                      name: ProfileStatusType
                      modelAsString: false
                  enrollmentStatus:
                    type: string
                    description: "Status representing the current state of the profile\
                      \ enrollment. Available values are:\n* Enrolling: profile has\
                      \ no voice print and not ready for recognition requests.\n*\
                      \ Training: voice print of profile is being created and can\u2019\
                      t be used for recognition at the moment.\n* Enrolled: profile\
                      \ has a voice print and ready for recognition requests."
                    enum:
                    - Enrolling
                    - Training
                    - Enrolled
                    x-ms-enum:
                      name: TrainingStatusType
                      modelAsString: false
                  createdDateTime:
                    type: string
                    format: date-time
                    description: Profile creation datetime.
                  lastUpdatedDateTime:
                    type: string
                    format: date-time
                    description: Last datetime when the profile was updated.
                  enrollmentsCount:
                    type: integer
                    description: Number of enrollment audios accepted for this profile.
                  enrollmentsLengthInSec:
                    type: number
                    description: Total length of enrollment audios accepted for this
                      profile in seconds.
                  enrollmentsSpeechLengthInSec:
                    type: number
                    description: Summation of pure speech (which is the amount of
                      audio after removing silence and non-speech segments) across
                      all profile enrollments in seconds.
                  remainingEnrollmentsSpeechLengthInSec:
                    type: number
                    description: Amount of pure speech (which is the amount of audio
                      after removing silence and non-speech segments) needed to complete
                      profile enrollment in seconds.
                  modelVersion:
                    type: string
                    format: date
                    description: Date specifying the model assigned to this profile.
                      Format is yyyy-mm-dd. If profile has no enrollments, this value
                      will be empty.
        default:
