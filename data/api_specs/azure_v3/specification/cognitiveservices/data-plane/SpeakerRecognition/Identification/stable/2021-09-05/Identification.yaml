              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
    delete:
      description: Deletes an existing profile.
      operationId: TextIndependent_DeleteProfile
      summary: Delete Profile
      tags:
      - text-independent
      parameters:
      - name: api-version
        x-ms-parameter-location: client
        in: query
        required: true
        description: Specifies the version of the operation to use for this request.
        schema:
          type: string
          enum:
          - 2021-09-05
          default: 2021-09-05
      - in: path
        name: profileId
        required: true
        x-nullable: false
        description: Unique identifier for profile id (guid).
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: OK
        default:
          description: Failure
          x-ms-error-response: true
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Speaker error message
                type: object
                required:
                - error
                properties:
                  error:
                    required:
                    - code
                    - message
                    type: object
                    properties:
