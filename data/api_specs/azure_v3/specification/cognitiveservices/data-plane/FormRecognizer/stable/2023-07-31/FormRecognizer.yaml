    DocumentPage:
      description: Content and layout elements extracted from a page from the input.
      type: object
      required:
      - pageNumber
      - spans
      properties:
        pageNumber:
          description: 1-based page number in the input document.
          type: integer
          format: int32
          minimum: 1
        angle:
          description: The general orientation of the content in clockwise direction,
            measured in degrees between (-180, 180].
          type: number
          minimum: -180
          maximum: 180
          exclusiveMinimum: true
        width:
          description: The width of the image/PDF in pixels/inches, respectively.
          type: number
          minimum: 0
        height:
          description: The height of the image/PDF in pixels/inches, respectively.
          type: number
          minimum: 0
        unit:
          description: The unit used by the width, height, and polygon properties.
            For images, the unit is "pixel". For PDF, the unit is "inch".
          type: string
          enum:
          - pixel
          - inch
          x-ms-enum:
            name: LengthUnit
            modelAsString: true
            values:
            - value: pixel
              description: Length unit for image files.
            - value: inch
              description: Length unit for PDF files.
        spans:
          description: Location of the page in the reading order concatenated content.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
        words:
          description: Extracted words from the page.
          type: array
          items:
            $ref: '#/components/schemas/DocumentWord'
        selectionMarks:
          description: Extracted selection marks from the page.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSelectionMark'
        lines:
          description: Extracted lines from the page, potentially containing both
            textual and visual elements.
          type: array
          items:
            $ref: '#/components/schemas/DocumentLine'
        barcodes:
          description: Extracted barcodes from the page.
          type: array
          items:
            $ref: '#/components/schemas/DocumentBarcode'
        formulas:
          description: Extracted formulas from the page.
          type: array
          items:
            $ref: '#/components/schemas/DocumentFormula'
    DocumentWord:
      description: A word object consisting of a contiguous sequence of characters.  For
