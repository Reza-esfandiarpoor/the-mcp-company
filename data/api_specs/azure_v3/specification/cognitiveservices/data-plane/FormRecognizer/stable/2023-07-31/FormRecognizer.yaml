          type: string
        fontStyle:
          description: Font style.
          type: string
          enum:
          - normal
          - italic
          x-ms-enum:
            name: FontStyle
            modelAsString: true
            values:
            - value: normal
              description: Characters are represented normally.
            - value: italic
              description: Characters are visually slanted to the right.
        fontWeight:
          description: Font weight.
          type: string
          enum:
          - normal
          - bold
          x-ms-enum:
            name: FontWeight
            modelAsString: true
            values:
            - value: normal
              description: Characters are represented normally.
            - value: bold
              description: Characters are represented with thicker strokes.
        color:
          description: 'Foreground color in #rrggbb hexadecimal format.'
          type: string
          pattern: ^#[0-9a-f]{6}$
        backgroundColor:
          description: 'Background color in #rrggbb hexadecimal format..'
          type: string
          pattern: ^#[0-9a-f]{6}$
        spans:
          description: Location of the text elements in the concatenated content the
            style applies to.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
        confidence:
          $ref: '#/components/schemas/Confidence'
    DocumentLanguage:
      description: An object representing the detected language for a given text span.
      type: object
      required:
      - locale
      - spans
      - confidence
      properties:
        locale:
          description: Detected language.  Value may an ISO 639-1 language code (ex.
            "en", "fr") or BCP 47 language tag (ex. "zh-Hans").
          type: string
        spans:
          description: Location of the text elements in the concatenated content the
            language applies to.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
        confidence:
          $ref: '#/components/schemas/Confidence'
    Document:
      description: An object describing the location and semantic content of a document.
      type: object
      required:
      - docType
      - spans
      - confidence
      properties:
        docType:
          $ref: '#/components/schemas/DocType'
        boundingRegions:
          description: Bounding regions covering the document.
          type: array
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          description: Location of the document in the reading order concatenated
            content.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
        fields:
          description: Dictionary of named field values.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DocumentField'
        confidence:
          $ref: '#/components/schemas/Confidence'
    DocumentField:
      description: An object representing the content and location of a field value.
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldType'
        valueString:
          description: String value.
          type: string
        valueDate:
          description: Date value in YYYY-MM-DD format (ISO 8601).
          type: string
          format: date
        valueTime:
          description: Time value in hh:mm:ss format (ISO 8601).
          type: string
          format: time
        valuePhoneNumber:
          description: Phone number value in E.164 format (ex. +19876543210).
          type: string
        valueNumber:
          description: Floating point value.
          type: number
        valueInteger:
          description: Integer value.
          type: integer
          format: int64
        valueSelectionMark:
          $ref: '#/components/schemas/DocumentSelectionMarkState'
        valueSignature:
          description: Presence of signature.
          type: string
          enum:
          - signed
          - unsigned
          x-ms-enum:
            name: DocumentSignatureType
            modelAsString: true
            values:
            - value: signed
              description: A signature is detected.
            - value: unsigned
              description: No signatures are detected.
        valueCountryRegion:
          description: 3-letter country code value (ISO 3166-1 alpha-3).
          type: string
        valueArray:
          description: Array of field values.
          type: array
          items:
            $ref: '#/components/schemas/DocumentField'
        valueObject:
          description: Dictionary of named field values.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DocumentField'
        valueCurrency:
          $ref: '#/components/schemas/CurrencyValue'
        valueAddress:
          $ref: '#/components/schemas/AddressValue'
        valueBoolean:
          description: Boolean value.
          type: boolean
        content:
          description: Field content.
          type: string
        boundingRegions:
          description: Bounding regions covering the field.
          type: array
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          description: Location of the field in the reading order concatenated content.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
        confidence:
          $ref: '#/components/schemas/Confidence'
    DocumentFieldType:
      description: Semantic data type of the field value.
      type: string
      enum:
      - string
      - date
      - time
      - phoneNumber
      - number
      - integer
      - selectionMark
      - countryRegion
      - signature
      - array
      - object
      - currency
      - address
      - boolean
      x-ms-enum:
        name: DocumentFieldType
        modelAsString: true
        values:
        - value: string
          description: Plain text.
        - value: date
          description: Date, normalized to ISO 8601 (YYYY-MM-DD) format.
        - value: time
          description: Time, normalized to ISO 8601 (hh:mm:ss) format.
        - value: phoneNumber
          description: Phone number, normalized to E.164 (+{CountryCode}{SubscriberNumber})
            format.
        - value: number
          description: Floating point number, normalized to double precision floating
            point.
        - value: integer
          description: Integer number, normalized to 64-bit signed integer.
        - value: selectionMark
          description: Is field selected?
        - value: countryRegion
          description: Country/region, normalized to ISO 3166-1 alpha-3 format (ex.
            USA).
        - value: signature
          description: Is signature present?
        - value: array
          description: List of subfields of the same type.
        - value: object
          description: Named list of subfields of potentially different types.
        - value: currency
          description: Currency amount with optional currency symbol and unit.
        - value: address
          description: Parsed address.
        - value: boolean
          description: Boolean value, normalized to true or false.
    CurrencyValue:
      description: Currency field value.
      type: object
      required:
      - amount
      properties:
        amount:
          description: Currency amount.
          type: number
          format: double
        currencySymbol:
          description: Currency symbol label, if any.
          type: string
        currencyCode:
          description: Resolved currency code (ISO 4217), if any.
          type: string
    AddressValue:
      description: Address field value.
      type: object
      properties:
        houseNumber:
          description: House or building number.
          type: string
        poBox:
          description: Post office box number.
          type: string
        road:
          description: Street name.
          type: string
        city:
          description: Name of city, town, village, etc.
          type: string
        state:
          description: First-level administrative division.
          type: string
        postalCode:
          description: Postal code used for mail sorting.
          type: string
        countryRegion:
          description: Country/region.
          type: string
        streetAddress:
          description: Street-level address, excluding city, state, countryRegion,
            and postalCode.
          type: string
        unit:
          description: Apartment or office number
          type: string
        cityDistrict:
          description: Districts or boroughs within a city, such as Brooklyn in New
            York City or City of Westminster in London.
          type: string
        stateDistrict:
          description: Second-level administrative division used in certain locales.
          type: string
        suburb:
          description: Unofficial neighborhood name, like Chinatown.
          type: string
        house:
          description: Build name, such as World Trade Center.
          type: string
        level:
          description: Floor number, such as 3F.
          type: string
    DocumentModelId:
      description: Unique document model name.
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    DocumentModelDescription:
      description: Document model description.
      type: string
      maxLength: 4096
    DocumentBuildMode:
      description: Custom document model build mode.
      type: string
      enum:
      - template
      - neural
      x-ms-enum:
        name: DocumentBuildMode
        modelAsString: true
        values:
        - value: template
          description: Target documents with similar visual templates.
        - value: neural
          description: Support documents with diverse visual templates.
    DocType:
      description: Document type name.
      type: string
      minLength: 2
      maxLength: 64
    DocumentClassifierId:
      description: Unique document classifier name.
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    DocumentClassifierDescription:
      description: Document classifier description.
      type: string
      maxLength: 4096
    BoundingPolygon:
      description: Bounding polygon, with coordinates specified relative to the top-left
        of the page. The numbers represent the x, y values of the polygon vertices,
        clockwise from the left (-180 degrees inclusive) relative to the element orientation.
      type: array
      items:
        type: number
        minimum: 0
    BoundingRegion:
      description: Bounding polygon on a specific page of the input.
      type: object
      required:
      - pageNumber
      - polygon
      properties:
        pageNumber:
          description: 1-based page number of page containing the bounding region.
          type: integer
          format: int32
          minimum: 1
        polygon:
          $ref: '#/components/schemas/BoundingPolygon'
    Confidence:
      description: Prediction confidence.
      type: number
      minimum: 0
      maximum: 1
    DocumentSpan:
      description: Contiguous region of the concatenated content property, specified
        as an offset and length.
      type: object
      required:
      - offset
      - length
      properties:
        offset:
          description: Zero-based index of the content represented by the span.
          type: integer
          format: int32
          minimum: 0
        length:
          description: Number of characters in the content represented by the span.
          type: integer
          format: int32
          minimum: 0
    StringIndexType:
      description: Method used to compute string offset and length.
      type: string
      enum:
      - textElements
      - unicodeCodePoint
      - utf16CodeUnit
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - value: textElements
          description: User-perceived display character, or grapheme cluster, as defined
            by Unicode 8.0.0.
        - value: unicodeCodePoint
          description: Character unit represented by a single unicode code point.  Used
            by Python 3.
        - value: utf16CodeUnit
          description: Character unit represented by a 16-bit Unicode code unit.  Used
            by JavaScript, Java, and .NET.
      default: textElements
