openapi: 3.0.0
info:
  title: Form Recognizer Client
  description: Extracts content, layout, and structured data from documents.
  version: 2023-07-31
security:
- apim_key: []
paths:
  /documentModels/{modelId}:analyze:
    post:
      description: Analyzes document with document model.
      operationId: DocumentModels_AnalyzeDocument
      tags:
      - Analysis
      parameters:
      - $ref: '#/components/parameters/PathDocumentModelId'
      - $ref: '#/components/parameters/QueryPages'
      - $ref: '#/components/parameters/QueryLocale'
      - $ref: '#/components/parameters/QueryStringIndexType'
      - $ref: '#/components/parameters/QueryApiVersion'
      - $ref: '#/components/parameters/QueryFeatures'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          application/pdf:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          image/jpeg:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          image/png:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          image/tiff:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          image/bmp:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          image/heif:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          text/html:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema:
              $ref: '#/components/schemas/AnalyzeDocumentRequest'
        description: Analyze request parameters.
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: URL used to track the progress and obtain the result of
                the analyze operation.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /documentModels/{modelId}/analyzeResults/{resultId}:
    get:
      description: Gets the result of document analysis.
      operationId: DocumentModels_GetAnalyzeResult
      tags:
      - Analysis
      parameters:
      - $ref: '#/components/parameters/PathDocumentModelId'
      - $ref: '#/components/parameters/PathResultId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResultOperation'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /documentModels:build:
    post:
      description: Builds a custom document analysis model.
      operationId: DocumentModels_BuildModel
      tags:
      - Creation
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDocumentModelRequest'
        description: Building request parameters.
        required: true
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: Operation result URL.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /documentModels:compose:
    post:
      description: Creates a new document model from document types of existing document
        models.
      operationId: DocumentModels_ComposeModel
      tags:
      - Creation
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeDocumentModelRequest'
        description: Compose request parameters.
        required: true
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: Operation result URL.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /documentModels:authorizeCopy:
    post:
      description: Generates authorization to copy a document model to this location
        with specified modelId and optional description.
      operationId: DocumentModels_AuthorizeModelCopy
      tags:
      - Creation
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeCopyRequest'
        description: Authorize copy request parameters.
        required: true
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyAuthorization'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /documentModels/{modelId}:copyTo:
    post:
      description: Copies document model to the target resource, region, and modelId.
      operationId: DocumentModels_CopyModelTo
      tags:
      - Creation
      parameters:
      - $ref: '#/components/parameters/PathDocumentModelId'
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAuthorization'
        description: Copy to request parameters.
        required: true
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: Operation result URL.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /operations:
    get:
      description: Lists all operations.
      operationId: Miscellaneous_ListOperations
      tags:
      - Operation
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOperationsResponse'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /operations/{operationId}:
    get:
      description: Gets operation info.
      operationId: Miscellaneous_GetOperation
      tags:
      - Operation
      parameters:
      - $ref: '#/components/parameters/PathOperationId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDetails'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /documentModels:
    get:
      description: List all document models
      operationId: DocumentModels_ListModels
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentModelsResponse'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /documentModels/{modelId}:
    get:
      description: Gets detailed document model information.
      operationId: DocumentModels_GetModel
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/PathDocumentModelId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentModelDetails'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      description: Deletes document model.
      operationId: DocumentModels_DeleteModel
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/PathDocumentModelId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '204':
          description: Deleting document model.
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /documentClassifiers:build:
    post:
      description: Builds a custom document classifier.
      operationId: DocumentClassifiers_BuildClassifier
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDocumentClassifierRequest'
        description: Building request parameters.
        required: true
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: Operation result URL.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /documentClassifiers:
    get:
      description: List all document classifiers.
      operationId: DocumentClassifiers_ListClassifiers
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentClassifiersResponse'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /documentClassifiers/{classifierId}:
    get:
      description: Gets detailed document classifier information.
      operationId: DocumentClassifiers_GetClassifier
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/PathDocumentClassifierId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentClassifierDetails'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      description: Deletes document classifier.
      operationId: DocumentClassifiers_DeleteClassifier
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/PathDocumentClassifierId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '204':
          description: Deleting document classifier.
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /documentClassifiers/{classifierId}:analyze:
    post:
      description: Classifies document with document classifier.
      operationId: DocumentClassifiers_ClassifyDocument
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/PathDocumentClassifierId'
      - $ref: '#/components/parameters/QueryStringIndexType'
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          application/pdf:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          image/jpeg:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          image/png:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          image/tiff:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          image/bmp:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          image/heif:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          text/html:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
          application/vnd.openxmlformats-officedocument.presentationml.presentation:
            schema:
              $ref: '#/components/schemas/ClassifyDocumentRequest'
        description: Classify request parameters.
      responses:
        '202':
          description: Request is queued successfully.
          headers:
            Operation-Location:
              description: URL used to track the progress and obtain the result of
                the classification operation.
              schema:
                type: string
                format: url
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
  /documentClassifiers/{classifierId}/analyzeResults/{resultId}:
    get:
      description: Gets the result of document classifier.
      operationId: DocumentClassifiers_GetClassifyResult
      tags:
      - Classifier
      parameters:
      - $ref: '#/components/parameters/PathDocumentClassifierId'
      - $ref: '#/components/parameters/PathResultId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResultOperation'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /info:
    get:
      description: Return information about the current resource.
      operationId: Miscellaneous_GetResourceInfo
      tags:
      - Management
      parameters:
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDetails'
        default:
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
servers:
- url: '{endpoint}/formrecognizer'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for

        example: https://westus2.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      format: url
      x-ms-skip-url-encoding: true
      default: none
components:
  parameters:
    Endpoint:
      name: endpoint
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for

        example: https://westus2.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      required: true
      in: path
      x-ms-skip-url-encoding: true
      schema:
        type: string
        format: url
    QueryApiVersion:
      name: api-version
      description: Requested API version.
      required: true
      in: query
      x-ms-parameter-location: client
      schema:
        type: string
    PathDocumentModelId:
      name: modelId
      description: Unique document model name.
      required: true
      in: path
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    PathDocumentClassifierId:
      name: classifierId
      description: Unique document classifier name.
      required: true
      in: path
      x-ms-parameter-location: method
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._~-]{1,63}$
    PathOperationId:
      name: operationId
      description: Unique operation ID.
      required: true
      in: path
      x-ms-parameter-location: method
      schema:
        type: string
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    PathResultId:
      name: resultId
      description: Analyze operation result ID.
      required: true
      in: path
      x-ms-parameter-location: method
      schema:
        type: string
        format: uuid
        maxLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    QueryPages:
      name: pages
      description: List of 1-based page numbers to analyze.  Ex. "1-3,5,7-9"
      required: false
      in: query
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^(\d+(-\d+)?)(,\s*(\d+(-\d+)?))*$
    QueryLocale:
      name: locale
      description: Locale hint for text recognition and document analysis.  Value
        may contain only the language code (ex. "en", "fr") or BCP 47 language tag
        (ex. "en-US").
      required: false
      in: query
      x-ms-parameter-location: method
      schema:
        type: string
    QueryStringIndexType:
      name: stringIndexType
      description: Method used to compute string offset and length.
      required: false
      in: query
      x-ms-enum:
        name: StringIndexType
        modelAsString: true
        values:
        - value: textElements
          description: User-perceived display character, or grapheme cluster, as defined
            by Unicode 8.0.0.
        - value: unicodeCodePoint
          description: Character unit represented by a single unicode code point.  Used
            by Python 3.
        - value: utf16CodeUnit
          description: Character unit represented by a 16-bit Unicode code unit.  Used
            by JavaScript, Java, and .NET.
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - textElements
        - unicodeCodePoint
        - utf16CodeUnit
        default: textElements
    QueryFeatures:
      name: features
      description: List of optional analysis features.
      required: false
      in: query
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - ocrHighResolution
          - languages
          - barcodes
          - formulas
          - keyValuePairs
          - styleFont
          x-ms-enum:
            name: DocumentAnalysisFeature
            modelAsString: true
            values:
            - value: ocrHighResolution
              description: Perform OCR at a higher resolution to handle documents
                with fine print.
            - value: languages
              description: Enable the detection of the text content language.
            - value: barcodes
              description: Enable the detection of barcodes in the document.
            - value: formulas
              description: Enable the detection of mathematical expressions in the
                document.
            - value: keyValuePairs
              description: Enable the detection of general key value pairs (form fields)
                in the document.
            - value: styleFont
              description: Enable the recognition of various font styles.
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: The secret key for your Azure Cognitive Services subscription.
  schemas:
    AnalyzeDocumentRequest:
      description: Document analysis parameters.
      type: object
      properties:
        urlSource:
          $ref: '#/components/schemas/UrlContentSource'
        base64Source:
          $ref: '#/components/schemas/Base64ContentSource'
    BuildDocumentModelRequest:
      description: Request body to build a new custom document model.
      type: object
      required:
      - modelId
      - buildMode
      properties:
        modelId:
          $ref: '#/components/schemas/DocumentModelId'
        description:
          $ref: '#/components/schemas/DocumentModelDescription'
        buildMode:
          $ref: '#/components/schemas/DocumentBuildMode'
        azureBlobSource:
          $ref: '#/components/schemas/AzureBlobContentSource'
        azureBlobFileListSource:
          $ref: '#/components/schemas/AzureBlobFileListContentSource'
        tags:
          description: List of key-value tag attributes associated with the document
            model.
          type: object
          additionalProperties:
            type: string
    ComposeDocumentModelRequest:
      description: Request body to create a composed document model from component
        document models.
      type: object
      required:
      - modelId
      - componentModels
      properties:
        modelId:
          $ref: '#/components/schemas/DocumentModelId'
        description:
          $ref: '#/components/schemas/DocumentModelDescription'
        componentModels:
          description: List of component document models to compose.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ComponentDocumentModelDetails'
        tags:
          description: List of key-value tag attributes associated with the document
            model.
          type: object
          additionalProperties:
            type: string
    ComponentDocumentModelDetails:
      description: A component of a composed document model.
      type: object
      required:
      - modelId
      properties:
        modelId:
          $ref: '#/components/schemas/DocumentModelId'
    AuthorizeCopyRequest:
      description: Request body to authorize document model copy.
      type: object
      required:
      - modelId
      properties:
        modelId:
          $ref: '#/components/schemas/DocumentModelId'
        description:
          $ref: '#/components/schemas/DocumentModelDescription'
        tags:
          description: List of key-value tag attributes associated with the document
            model.
          type: object
          additionalProperties:
            type: string
    GetOperationsResponse:
      description: List Operations response object.
      type: object
      required:
      - value
      properties:
        value:
          description: List of operations.
          type: array
          items:
            $ref: '#/components/schemas/OperationSummary'
        nextLink:
          description: Link to the next page of operations.
          type: string
          format: url
    OperationDetails:
      description: Get Operation response object.
      type: object
      discriminator:
        propertyName: kind
      required:
      - operationId
      - status
      - createdDateTime
      - lastUpdatedDateTime
      - kind
      - resourceLocation
      properties:
        operationId:
          description: Operation ID
          type: string
        status:
          $ref: '#/components/schemas/OperationStatus'
        percentCompleted:
          description: Operation progress (0-100).
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        createdDateTime:
          description: Date and time (UTC) when the operation was created.
          type: string
          format: date-time
        lastUpdatedDateTime:
          description: Date and time (UTC) when the status was last updated.
          type: string
          format: date-time
        kind:
          description: Type of operation.
          type: string
        resourceLocation:
          description: URL of the resource targeted by this operation.
          type: string
          format: url
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
        tags:
          description: List of key-value tag attributes associated with the document
            model.
          type: object
          additionalProperties:
            type: string
        error:
          $ref: '#/components/schemas/Error'
    DocumentModelBuildOperationDetails:
      $ref: '#/components/schemas/OperationDetails'
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DocumentModelDetails'
      description: Get Operation response object.
      x-ms-discriminator-value: documentModelBuild
    DocumentModelComposeOperationDetails:
      $ref: '#/components/schemas/OperationDetails'
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DocumentModelDetails'
      description: Get Operation response object.
      x-ms-discriminator-value: documentModelCompose
    DocumentModelCopyToOperationDetails:
      $ref: '#/components/schemas/OperationDetails'
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DocumentModelDetails'
      description: Get Operation response object.
      x-ms-discriminator-value: documentModelCopyTo
    GetDocumentModelsResponse:
      description: List document models response object.
      type: object
      required:
      - value
      properties:
        value:
          description: List of document models.
          type: array
          items:
            $ref: '#/components/schemas/DocumentModelSummary'
        nextLink:
          description: Link to the next page of document models.
          type: string
          format: url
    DocumentClassifierBuildOperationDetails:
      $ref: '#/components/schemas/OperationDetails'
      type: object
      properties:
        result:
          $ref: '#/components/schemas/DocumentClassifierDetails'
      description: Get Operation response object.
      x-ms-discriminator-value: documentClassifierBuild
    BuildDocumentClassifierRequest:
      description: Request body to build a new custom document classifier.
      type: object
      required:
      - classifierId
      - docTypes
      properties:
        classifierId:
          $ref: '#/components/schemas/DocumentClassifierId'
        description:
          $ref: '#/components/schemas/DocumentClassifierDescription'
        docTypes:
          description: List of document types to classify against.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ClassifierDocumentTypeDetails'
    GetDocumentClassifiersResponse:
      description: List document classifiers response object.
      type: object
      required:
      - value
      properties:
        value:
          description: List of document classifiers.
          type: array
          items:
            $ref: '#/components/schemas/DocumentClassifierDetails'
        nextLink:
          description: Link to the next page of document classifiers.
          type: string
          format: url
    ClassifyDocumentRequest:
      description: Document classification parameters.
      type: object
      properties:
