        layout.
      type: object
      required:
      - rowCount
      - columnCount
      - cells
      - spans
      properties:
        rowCount:
          description: Number of rows in the table.
          type: integer
          format: int32
          minimum: 1
        columnCount:
          description: Number of columns in the table.
          type: integer
          format: int32
          minimum: 1
        cells:
          description: Cells contained within the table.
          type: array
          items:
            $ref: '#/components/schemas/DocumentTableCell'
        boundingRegions:
          description: Bounding regions covering the table.
          type: array
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          description: Location of the table in the reading order concatenated content.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
    DocumentTableCell:
      description: An object representing the location and content of a table cell.
      type: object
      required:
      - rowIndex
      - columnIndex
      - content
      - spans
      properties:
        kind:
          description: Table cell kind.
          type: string
          enum:
          - content
          - rowHeader
          - columnHeader
          - stubHead
          - description
          default: content
          x-ms-enum:
            name: DocumentTableCellKind
            modelAsString: true
            values:
            - value: content
              description: Contains the main content/data.
            - value: rowHeader
              description: Describes the content of the row.
            - value: columnHeader
              description: Describes the content of the column.
            - value: stubHead
              description: Describes the row headers, usually located at the top left
                corner of a table.
            - value: description
              description: Describes the content in (parts of) the table.
        rowIndex:
          description: Row index of the cell.
          type: integer
          format: int32
        columnIndex:
          description: Column index of the cell.
          type: integer
          format: int32
        rowSpan:
          description: Number of rows spanned by this cell.
          type: integer
          format: int32
          minimum: 1
          default: 1
        columnSpan:
          description: Number of columns spanned by this cell.
          type: integer
          format: int32
          minimum: 1
          default: 1
        content:
          description: Concatenated content of the table cell in reading order.
          type: string
        boundingRegions:
          description: Bounding regions covering the table cell.
          type: array
          items:
            $ref: '#/components/schemas/BoundingRegion'
        spans:
          description: Location of the table cell in the reading order concatenated
            content.
          type: array
          items:
            $ref: '#/components/schemas/DocumentSpan'
