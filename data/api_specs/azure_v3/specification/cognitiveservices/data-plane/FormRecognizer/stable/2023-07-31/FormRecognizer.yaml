      - confidence
      properties:
        content:
          description: Text content of the word.
          type: string
        polygon:
          $ref: '#/components/schemas/BoundingPolygon'
        span:
          $ref: '#/components/schemas/DocumentSpan'
        confidence:
          $ref: '#/components/schemas/Confidence'
    DocumentSelectionMark:
      description: A selection mark object representing check boxes, radio buttons,
