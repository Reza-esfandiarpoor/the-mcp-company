openapi: 3.0.0
info:
  title: Batch Document Translation Client
  version: v1.1
servers:
- url: '{endpoint}/translator/text/batch/v1.1'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- subscription_key: []
paths:
  /batches:
    post:
      tags:
      - Document Translation
      summary: Submit a document translation request to the Document Translation service
      description: "Use this API to submit a bulk (batch) translation request to the\
        \ Document Translation service.\r\nEach request can contain multiple documents\
        \ and must contain a source and destination container for each document.\r\
        \n            \r\nThe prefix and suffix filter (if supplied) are used to filter\
        \ folders. The prefix is applied to the subpath after the container name.\r\
        \n            \r\nGlossaries / Translation memory can be included in the request\
        \ and are applied by the service when the document is translated.\r\n    \
        \        \r\nIf the glossary is invalid or unreachable during translation,\
        \ an error is indicated in the document status.\r\nIf a file with the same\
        \ name already exists at the destination, it will be overwritten. The targetUrl\
        \ for each target language must be unique."
      operationId: DocumentTranslation_StartTranslation
      requestBody:
        content:
          application/json:
            schema:
              description: Translation job submission batch request
              required:
              - inputs
              type: object
              properties:
                inputs:
                  description: The input list of documents or folders containing documents
                  type: array
                  items:
                    description: Definition for the input batch translation request
                    required:
                    - source
                    - targets
                    type: object
                    properties:
                      source:
                        description: Source of the input documents
                        required:
                        - sourceUrl
                        type: object
                        properties:
                          sourceUrl:
                            description: Location of the folder / container or single
                              file with your documents
                            type: string
                          filter:
                            type: object
                            properties:
                              prefix:
                                description: "A case-sensitive prefix string to filter\
                                  \ documents in the source path for translation.\
                                  \ \r\nFor example, when using a Azure storage blob\
                                  \ Uri, use the prefix to restrict sub folders for\
                                  \ translation."
                                type: string
                              suffix:
                                description: "A case-sensitive suffix string to filter\
                                  \ documents in the source path for translation.\
                                  \ \r\nThis is most often use for file extensions"
                                type: string
                          language:
                            description: "Language code\r\nIf none is specified, we\
                              \ will perform auto detect on the document"
                            type: string
                          storageSource:
                            description: Storage Source
                            enum:
                            - AzureBlob
                            type: string
                            x-ms-enum:
                              name: StorageSource
                              modelAsString: true
                              values:
                              - value: AzureBlob
                      targets:
                        description: Location of the destination for the output
                        type: array
                        items:
                          description: Destination for the finished translated documents
                          required:
                          - language
                          - targetUrl
                          type: object
                          properties:
                            targetUrl:
                              description: Location of the folder / container with
                                your documents
                              type: string
                            category:
                              description: Category / custom system for translation
                                request
                              type: string
                            language:
                              description: Target Language
                              type: string
                            glossaries:
                              description: List of Glossary
                              type: array
                              items:
                                description: Glossary / translation memory for the
                                  request
                                required:
                                - format
                                - glossaryUrl
                                type: object
                                properties:
                                  glossaryUrl:
                                    description: "Location of the glossary. \r\nWe\
                                      \ will use the file extension to extract the\
                                      \ formatting if the format parameter is not\
                                      \ supplied.\r\n\r\nIf the translation language\
                                      \ pair is not present in the glossary, it will\
                                      \ not be applied"
                                    type: string
                                  format:
                                    description: Format
                                    type: string
                                  version:
                                    description: Optional Version.  If not specified,
                                      default is used.
                                    type: string
                                  storageSource:
                                    description: Storage Source
                                    enum:
                                    - AzureBlob
                                    type: string
                                    x-ms-enum:
                                      name: StorageSource
                                      modelAsString: true
                                      values:
                                      - value: AzureBlob
                            options:
                              type: object
                              properties:
                                pdfOutputAdditionalFormat:
                                  description: List of possible additional output
                                    formats
                                  enum:
                                  - None
                                  - OpenXmlWord
                                  type: string
                                  x-ms-enum:
                                    name: AdditionalOutputFileFormat
                                    modelAsString: true
                                    values:
                                    - value: None
                                    - value: OpenXmlWord
                            storageSource:
                              description: Storage Source
                              enum:
                              - AzureBlob
                              type: string
                              x-ms-enum:
                                name: StorageSource
                                modelAsString: true
                                values:
                                - value: AzureBlob
                      storageType:
                        description: Storage type of the input documents source string
                        enum:
                        - Folder
                        - File
                        type: string
                        x-ms-enum:
                          name: StorageInputType
                          modelAsString: true
                          values:
                          - value: Folder
                          - value: File
