        description: request details
        required: true
      responses:
        '202':
          description: Successful request and the batch request is created by the
            service.  The header Operation-Location will indicate a status url with
            the operation id.
          headers:
            Operation-Location:
              description: Location of batch the operation
              schema:
                type: string
                format: ''
        default:
          description: Internal Server Error
          x-ms-error-response: true
          content:
            application/json:
              schema:
                description: "Contains unified error information used for HTTP responses\
                  \ across any Cognitive Service. Instances\r\ncan be created either\
                  \ through Microsoft.CloudAI.Containers.HttpStatusExceptionV2 or\
                  \ by returning it directly from\r\na controller."
                type: object
                properties:
                  error:
                    description: This contains an outer error with error code, message,
                      details, target and an inner error with more descriptive details.
                    required:
                    - code
                    - message
                    type: object
                    properties:
                      code:
                        description: Enums containing high level error codes.
                        enum:
                        - InvalidRequest
                        - InvalidArgument
                        - InternalServerError
                        - ServiceUnavailable
                        - ResourceNotFound
                        - Unauthorized
                        - RequestRateTooHigh
                        type: string
                        x-ms-enum:
                          name: TranslationErrorCode
                          modelAsString: true
                          values:
                          - value: InvalidRequest
                          - value: InvalidArgument
                          - value: InternalServerError
                          - value: ServiceUnavailable
                          - value: ResourceNotFound
                          - value: Unauthorized
                          - value: RequestRateTooHigh
                      message:
                        description: Gets high level error message.
                        type: string
                      target:
                        description: "Gets the source of the error. \r\nFor example\
                          \ it would be \"documents\" or \"document id\" in case of\
                          \ invalid document."
                        type: string
                        readOnly: true
                      innerError:
                        description: "New Inner Error format which conforms to Cognitive\
                          \ Services API Guidelines which is available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.\r\
                          \nThis contains required properties ErrorCode, message and\
                          \ optional properties target, details(key value pair), inner\
                          \ error(this can be nested)."
                        required:
                        - code
                        - message
                        type: object
                        properties:
                          code:
                            description: Gets code error string.
                            type: string
                          message:
                            description: Gets high level error message.
                            type: string
                          target:
                            description: "Gets the source of the error. \r\nFor example\
                              \ it would be \"documents\" or \"document id\" in case\
                              \ of invalid document."
                            type: string
                            readOnly: true
                          innerError:
                            description: "New Inner Error format which conforms to\
                              \ Cognitive Services API Guidelines which is available\
                              \ at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.\r\
                              \nThis contains required properties ErrorCode, message\
                              \ and optional properties target, details(key value\
                              \ pair), inner error(this can be nested)."
                            required:
                            - code
                            - message
                            type: object
                            properties:
                              code:
                                description: Gets code error string.
                                type: string
                              message:
                                description: Gets high level error message.
                                type: string
                              target:
                                description: "Gets the source of the error. \r\nFor\
                                  \ example it would be \"documents\" or \"document\
                                  \ id\" in case of invalid document."
                                type: string
                                readOnly: true
                              innerError:
                                description: "New Inner Error format which conforms\
                                  \ to Cognitive Services API Guidelines which is\
                                  \ available at https://microsoft.sharepoint.com/%3Aw%3A/t/CognitiveServicesPMO/EUoytcrjuJdKpeOKIK_QRC8BPtUYQpKBi8JsWyeDMRsWlQ?e=CPq8ow.\r\
                                  \nThis contains required properties ErrorCode, message\
