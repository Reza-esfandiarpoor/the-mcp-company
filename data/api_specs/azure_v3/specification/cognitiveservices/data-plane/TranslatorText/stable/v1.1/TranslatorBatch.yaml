  /batches/{id}/documents:
    get:
      tags:
      - Document Translation
      summary: Returns the status for all documents in a batch document translation
        request
      description: "Returns the status for all documents in a batch document translation\
        \ request.\r\n            \r\nIf the number of documents in the response exceeds\
        \ our paging limit, server-side paging is used.\r\nPaginated responses indicate\
        \ a partial result and include a continuation token in the response. The absence\
        \ of a continuation token means that no additional pages are available.\r\n\
        \            \r\n$top, $skip and $maxpagesize query parameters can be used\
        \ to specify a number of results to return and an offset for the collection.\r\
        \n            \r\n$top indicates the total number of records the user wants\
        \ to be returned across all pages.\r\n$skip indicates the number of records\
        \ to skip from the list of document status held by the server based on the\
        \ sorting method specified.  By default, we sort by descending start time.\r\
        \n$maxpagesize is the maximum items returned in a page.  If more items are\
        \ requested via $top (or $top is not specified and there are more items to\
        \ be returned), @nextLink will contain the link to the next page.\r\n    \
        \        \r\n$orderBy query parameter can be used to sort the returned list\
        \ (ex \"$orderBy=createdDateTimeUtc asc\" or \"$orderBy=createdDateTimeUtc\
        \ desc\").\r\nThe default sorting is descending by createdDateTimeUtc.\r\n\
        Some query parameters can be used to filter the returned list (ex: \"status=Succeeded,Cancelled\"\
        ) will only return succeeded and cancelled documents.\r\ncreatedDateTimeUtcStart\
        \ and createdDateTimeUtcEnd can be used combined or separately to specify\
        \ a range of datetime to filter the returned list by.\r\nThe supported filtering\
        \ query parameters are (status, ids, createdDateTimeUtcStart, createdDateTimeUtcEnd).\r\
        \n            \r\nWhen both $top and $skip are included, the server should\
        \ first apply $skip and then $top on the collection.\r\nNote: If the server\
        \ can't honor $top and/or $skip, the server must return an error to the client\
        \ informing about it instead of just ignoring the query options.\r\nThis reduces\
        \ the risk of the client making assumptions about the data returned."
      operationId: DocumentTranslation_GetDocumentsStatus
      parameters:
      - in: path
        name: id
        description: Format - uuid.  The operation id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: $top
        description: "$top indicates the total number of records the user wants to\
          \ be returned across all pages.\r\n            \r\nClients MAY use $top\
          \ and $skip query parameters to specify a number of results to return and\
          \ an offset into the collection.\r\nWhen both $top and $skip are given by\
          \ a client, the server SHOULD first apply $skip and then $top on the collection.\r\
          \n            \r\nNote: If the server can't honor $top and/or $skip, the\
          \ server MUST return an error to the client informing about it instead of\
          \ just ignoring the query options."
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
      - in: query
        name: $skip
        description: "$skip indicates the number of records to skip from the list\
          \ of records held by the server based on the sorting method specified. \
          \ By default, we sort by descending start time.\r\n            \r\nClients\
          \ MAY use $top and $skip query parameters to specify a number of results\
          \ to return and an offset into the collection.\r\nWhen both $top and $skip\
          \ are given by a client, the server SHOULD first apply $skip and then $top\
          \ on the collection.\r\n            \r\nNote: If the server can't honor\
          \ $top and/or $skip, the server MUST return an error to the client informing\
          \ about it instead of just ignoring the query options."
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          default: 0
      - in: query
        name: $maxpagesize
        description: "$maxpagesize is the maximum items returned in a page.  If more\
          \ items are requested via $top (or $top is not specified and there are more\
          \ items to be returned), @nextLink will contain the link to the next page.\r\
          \n            \r\nClients MAY request server-driven paging with a specific\
          \ page size by specifying a $maxpagesize preference. The server SHOULD honor\
          \ this preference if the specified page size is smaller than the server's\
          \ default page size."
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: ids
        description: Ids to use in filtering
        style: form
        explode: false
        schema:
          type: array
          items:
            format: uuid
            type: string
          maxLength: 25
      - in: query
        name: statuses
        description: Statuses to use in filtering
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          maxLength: 5
      - in: query
        name: createdDateTimeUtcStart
        description: the start datetime to get items after
        schema:
          type: string
          format: date-time
      - in: query
        name: createdDateTimeUtcEnd
        description: the end datetime to get items before
        schema:
          type: string
          format: date-time
      - in: query
        name: $orderBy
        description: 'the sorting query for the collection (ex: ''CreatedDateTimeUtc
          asc'', ''CreatedDateTimeUtc desc'')'
        style: form
