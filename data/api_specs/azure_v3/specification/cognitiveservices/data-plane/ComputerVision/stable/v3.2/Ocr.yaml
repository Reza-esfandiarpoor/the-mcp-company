                - pixel
                - inch
                x-ms-enum:
                  name: TextRecognitionResultDimensionUnit
                  modelAsString: false
                nullable: false
              lines:
                description: A list of recognized text lines.
                type: array
                items:
                  description: An object representing a recognized text line.
                  type: object
                  required:
                  - boundingBox
                  - text
                  - words
                  properties:
                    language:
                      description: The BCP-47 language code of the recognized text
                        line. Only provided where the language of the line differs
                        from the page's.
                      type: string
                    boundingBox:
                      description: Bounding box of a recognized line.
                      type: array
                      items:
                        type: number
                        nullable: false
                    appearance:
                      description: Appearance of the text line.
                      type: object
                      required:
                      - style
                      properties:
                        style:
                          description: An object representing the style of the text
                            line.
                          type: object
                          required:
                          - name
                          - confidence
                          properties:
                            name:
                              description: The text line style name, including handwriting
                                and other.
                              type: string
                              x-ms-enum:
                                name: TextStyle
                                modelAsString: true
                              enum:
                              - other
                              - handwriting
                            confidence:
                              description: The confidence of text line style.
                              type: number
                              format: float
                    text:
                      description: The text content of the line.
                      type: string
                    words:
                      description: List of words in the text line.
                      type: array
                      items:
                        description: An object representing a recognized word.
                        type: object
                        required:
                        - boundingBox
                        - text
                        - confidence
                        properties:
                          boundingBox:
                            description: Bounding box of a recognized word.
                            type: array
                            items:
                              type: number
                              nullable: false
                          text:
                            description: The text content of the word.
                            type: string
                          confidence:
                            description: Qualitative confidence measure.
                            type: number
                            format: float
    Line:
      description: An object representing a recognized text line.
      type: object
      required:
      - boundingBox
      - text
      - words
      properties:
        language:
          description: The BCP-47 language code of the recognized text line. Only
            provided where the language of the line differs from the page's.
          type: string
        boundingBox:
          description: Bounding box of a recognized line.
          type: array
          items:
            type: number
            nullable: false
        appearance:
          description: Appearance of the text line.
          type: object
          required:
          - style
          properties:
            style:
              description: An object representing the style of the text line.
              type: object
