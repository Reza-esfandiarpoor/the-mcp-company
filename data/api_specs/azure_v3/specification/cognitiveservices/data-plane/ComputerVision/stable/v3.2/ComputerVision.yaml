          - Celebrities
          - Landmarks
          x-ms-enum:
            name: DescriptionExclude
            modelAsString: false
          nullable: false
    OcrLanguage:
      name: language
      in: query
      description: The BCP-47 language code of the text to be detected in the image.
        The default value is 'unk'.
      required: false
      x-ms-parameter-location: method
      x-nullable: false
      x-ms-enum:
        name: OcrLanguages
        modelAsString: false
      schema:
        type: string
        enum:
        - unk
        - zh-Hans
        - zh-Hant
        - cs
        - da
        - nl
        - en
        - fi
        - fr
        - de
        - el
        - hu
        - it
        - ja
        - ko
        - nb
