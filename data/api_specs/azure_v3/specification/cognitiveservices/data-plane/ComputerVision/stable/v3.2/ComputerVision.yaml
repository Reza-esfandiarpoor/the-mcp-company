        - pt
        - ru
        - es
        - sv
        - tr
        - ar
        - ro
        - sr-Cyrl
        - sr-Latn
        - sk
        default: unk
    VisualFeatures:
      name: visualFeatures
      in: query
      description: 'A string indicating what visual feature types to return. Multiple
        values should be comma-separated. Valid visual feature types include: Categories
        - categorizes image content according to a taxonomy defined in documentation.
        Tags - tags the image with a detailed list of words related to the image content.
        Description - describes the image content with a complete English sentence.
        Faces - detects if faces are present. If present, generate coordinates, gender
        and age. ImageType - detects if image is clipart or a line drawing. Color
        - determines the accent color, dominant color, and whether an image is black&white.
        Adult - detects if the image is pornographic in nature (depicts nudity or
        a sex act), or is gory (depicts extreme violence or blood). Sexually suggestive
        content (aka racy content) is also detected. Objects - detects various objects
        within an image, including the approximate location. The Objects argument
        is only available in English. Brands - detects various brands within an image,
        including the approximate location. The Brands argument is only available
        in English.'
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
          - ImageType
          - Faces
          - Adult
          - Categories
          - Color
          - Tags
          - Description
          - Objects
          - Brands
          x-ms-enum:
            name: VisualFeatureTypes
            modelAsString: false
          nullable: false
    DetectOrientation:
      name: detectOrientation
      in: query
      description: Whether detect the text orientation in the image. With detectOrientation=true
        the OCR service tries to detect the image orientation and correct it before
        further processing (e.g. if it's upside-down).
      required: true
      x-ms-parameter-location: method
      schema:
        type: boolean
        default: true
