openapi: 3.0.0
info:
  version: '3.2'
  title: Computer Vision Client
  description: The Computer Vision API provides state-of-the-art algorithms to process
    images and return information. For example, it can be used to determine if an
    image contains mature content, or it can be used to find all the faces in an image.  It
    also has other features like estimating dominant and accent colors, categorizing
    the content of images, and describing an image with complete English sentences.  Additionally,
    it can also intelligently generate images thumbnails for displaying large images
    effectively.
servers:
- url: https://westcentralus.api.cognitive.microsoft.com/vision/v3.2
- url: '{Endpoint}/vision/v3.2'
  variables:
    Endpoint:
      description: Supported Cognitive Services endpoints.
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apim_key: []
paths:
  /analyze:
    post:
      description: "This operation extracts a rich set of visual features based on\
        \ the image content.\r\nTwo input methods are supported -- (1) Uploading an\
        \ image or (2) specifying an image URL. Within your request, there is an optional\
        \ parameter to allow you to choose which features to return. By default, image\
        \ categories are returned in the response.\r\nA successful response will be\
        \ returned in JSON. If the request failed, the response will contain an error\
        \ code and a message to help understand what went wrong."
      operationId: AnalyzeImage
      parameters:
      - name: visualFeatures
        in: query
        description: 'A string indicating what visual feature types to return. Multiple
          values should be comma-separated. Valid visual feature types include: Categories
          - categorizes image content according to a taxonomy defined in documentation.
          Tags - tags the image with a detailed list of words related to the image
          content. Description - describes the image content with a complete English
          sentence. Faces - detects if faces are present. If present, generate coordinates,
          gender and age. ImageType - detects if image is clipart or a line drawing.
          Color - determines the accent color, dominant color, and whether an image
          is black&white. Adult - detects if the image is pornographic in nature (depicts
          nudity or a sex act), or is gory (depicts extreme violence or blood). Sexually
          suggestive content (aka racy content) is also detected. Objects - detects
          various objects within an image, including the approximate location. The
          Objects argument is only available in English. Brands - detects various
          brands within an image, including the approximate location. The Brands argument
          is only available in English.'
        required: false
        x-ms-parameter-location: method
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - ImageType
            - Faces
            - Adult
            - Categories
            - Color
            - Tags
            - Description
            - Objects
            - Brands
            x-ms-enum:
              name: VisualFeatureTypes
              modelAsString: false
            nullable: false
      - name: details
        in: query
        description: 'A string indicating which domain-specific details to return.
          Multiple values should be comma-separated. Valid visual feature types include:
          Celebrities - identifies celebrities if detected in the image, Landmarks
          - identifies notable landmarks in the image.'
        required: false
        x-nullable: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Celebrities
            - Landmarks
            x-ms-enum:
              name: Details
              modelAsString: false
            nullable: false
      - name: language
        in: query
        description: The desired language for output generation. If this parameter
          is not specified, the default value is "en". See https://aka.ms/cv-languages
          for list of supported languages.
        required: false
        x-ms-parameter-location: method
        x-nullable: false
        schema:
          type: string
          enum:
          - ar
          - az
          - bg
          - bs
          - ca
          - cs
          - cy
          - da
          - de
          - el
          - en
          - es
          - et
          - eu
          - fi
          - fr
          - ga
          - gl
          - he
          - hi
          - hr
          - hu
          - id
          - it
          - ja
          - kk
          - ko
          - lt
          - lv
          - mk
          - ms
          - nb
          - nl
          - pl
          - prs
          - pt
          - pt-BR
          - pt-PT
          - ro
          - ru
          - sk
          - sl
          - sr-Cyrl
          - sr-Latn
          - sv
          - th
          - tr
          - uk
          - vi
          - zh
          - zh-Hans
          - zh-Hant
          default: en
      - name: descriptionExclude
        in: query
        description: Turn off specified domain models when generating the description.
        required: false
        x-nullable: true
        x-ms-parameter-location: method
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Celebrities
            - Landmarks
            x-ms-enum:
              name: DescriptionExclude
              modelAsString: false
            nullable: false
      - name: model-version
        in: query
        description: 'Optional parameter to specify the version of the AI model. Accepted
          values are: "latest", "2021-04-01", "2021-05-01". Defaults to "latest".'
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^(latest|\d{4}-\d{2}-\d{2})(-preview)?$
          default: latest
      requestBody:
        content:
          application/json:
            schema:
              required:
              - url
              type: object
              properties:
                url:
                  description: Publicly reachable URL of an image.
                  type: string
        description: A JSON document with a URL pointing to the image that is to be
          analyzed.
        required: true
        x-ms-parameter-location: method
        x-ms-client-flatten: true
      responses:
        '200':
          description: "The response include the extracted features in JSON format.\
            \ Here is the definitions for enumeration types:\r\n ClipartType\r\n Non\
            \ - clipart = 0, ambiguous = 1, normal - clipart = 2, good - clipart =\
            \ 3. LineDrawingTypeNon - LineDrawing = 0, LineDrawing = 1."
          content:
            application/json:
              schema:
                description: Result of AnalyzeImage operation.
                type: object
                properties:
                  categories:
                    description: An array indicating identified categories.
                    type: array
                    items:
                      description: An object describing identified category.
                      type: object
                      properties:
                        name:
                          description: Name of the category.
                          type: string
                          nullable: true
                        score:
                          format: double
                          description: Scoring of the category.
                          type: number
                          nullable: false
                        detail:
                          description: Details of the identified category.
                          type: object
                          properties:
                            celebrities:
                              description: An array of celebrities if any identified.
                              type: array
                              items:
                                description: An object describing possible celebrity
                                  identification.
                                type: object
                                properties:
                                  name:
                                    description: Name of the celebrity.
                                    type: string
                                    nullable: true
                                  confidence:
                                    format: double
                                    description: Confidence level for the celebrity
                                      recognition as a value ranging from 0 to 1.
                                    type: number
                                    nullable: false
                                  faceRectangle:
                                    description: Location of the identified face in
                                      the image.
                                    type: object
                                    properties:
                                      left:
                                        format: int32
                                        description: X-coordinate of the top left
                                          point of the face, in pixels.
                                        type: integer
                                        nullable: false
                                      top:
                                        format: int32
                                        description: Y-coordinate of the top left
                                          point of the face, in pixels.
                                        type: integer
                                        nullable: false
                                      width:
                                        format: int32
                                        description: Width measured from the top-left
                                          point of the face, in pixels.
                                        type: integer
                                        nullable: false
                                      height:
                                        format: int32
                                        description: Height measured from the top-left
                                          point of the face, in pixels.
                                        type: integer
                                        nullable: false
                                    nullable: true
                                nullable: true
                              nullable: true
                            landmarks:
                              description: An array of landmarks if any identified.
                              type: array
                              items:
                                description: A landmark recognized in the image.
                                type: object
                                properties:
                                  name:
                                    description: Name of the landmark.
                                    type: string
                                    nullable: true
                                  confidence:
                                    format: double
                                    description: Confidence level for the landmark
                                      recognition as a value ranging from 0 to 1.
                                    type: number
                                    nullable: false
                                nullable: true
                              nullable: true
                          nullable: true
                      nullable: true
                    nullable: true
                  adult:
                    description: An object describing whether the image contains adult-oriented
                      content and/or is racy.
                    type: object
                    properties:
                      isAdultContent:
                        description: A value indicating if the image contains adult-oriented
                          content.
                        type: boolean
                        nullable: false
                      isRacyContent:
                        description: A value indicating if the image is racy.
                        type: boolean
                        nullable: false
                      isGoryContent:
                        description: A value indicating if the image is gory.
                        type: boolean
                        nullable: false
                      adultScore:
                        format: double
                        description: Score from 0 to 1 that indicates how much the
                          content is considered adult-oriented within the image.
                        type: number
                        nullable: false
                      racyScore:
                        format: double
                        description: Score from 0 to 1 that indicates how suggestive
                          is the image.
                        type: number
                        nullable: false
                      goreScore:
                        format: double
                        description: Score from 0 to 1 that indicates how gory is
                          the image.
                        type: number
                        nullable: false
                    nullable: true
                  color:
                    description: An object providing additional metadata describing
                      color attributes.
                    type: object
                    properties:
                      dominantColorForeground:
                        description: Possible dominant foreground color.
                        type: string
                        nullable: true
                      dominantColorBackground:
                        description: Possible dominant background color.
                        type: string
                        nullable: true
                      dominantColors:
                        description: An array of possible dominant colors.
                        type: array
                        items:
                          type: string
                          nullable: true
                        nullable: true
                      accentColor:
                        description: Possible accent color.
                        type: string
                        nullable: true
                      isBWImg:
                        description: A value indicating if the image is black and
                          white.
                        type: boolean
                        nullable: false
                    nullable: true
                  imageType:
                    description: An object providing possible image types and matching
                      confidence levels.
                    type: object
                    properties:
                      clipArtType:
                        format: int32
                        description: Confidence level that the image is a clip art.
                        type: integer
                        nullable: false
                      lineDrawingType:
                        format: int32
                        description: Confidence level that the image is a line drawing.
                        type: integer
                        nullable: false
                    nullable: true
                  tags:
                    description: A list of tags with confidence level.
                    type: array
                    items:
                      description: An entity observation in the image, along with
                        the confidence score.
                      type: object
                      properties:
                        name:
                          description: Name of the entity.
                          type: string
                          nullable: true
                        confidence:
                          format: double
                          description: The level of confidence that the entity was
                            observed.
                          type: number
                          nullable: false
                        hint:
                          description: Optional hint/details for this tag.
                          type: string
                          nullable: true
                      nullable: true
                    nullable: true
                  description:
                    description: A collection of content tags, along with a list of
                      captions sorted by confidence level, and image metadata.
                    type: object
                    properties:
                      tags:
                        description: A collection of image tags.
                        type: array
                        items:
                          type: string
                          nullable: true
                        nullable: true
                      captions:
                        description: A list of captions, sorted by confidence level.
                        type: array
                        items:
                          description: An image caption, i.e. a brief description
                            of what the image depicts.
                          type: object
                          properties:
                            text:
                              description: The text of the caption.
                              type: string
                              nullable: true
                            confidence:
                              format: double
                              description: The level of confidence the service has
                                in the caption.
                              type: number
                              nullable: false
                          nullable: true
                        nullable: true
                    nullable: true
                  faces:
                    description: An array of possible faces within the image.
                    type: array
                    items:
                      description: An object describing a face identified in the image.
                      type: object
                      properties:
                        age:
                          format: int32
                          description: Possible age of the face.
                          type: integer
                          nullable: false
                        gender:
                          description: Possible gender of the face.
                          enum:
                          - Male
                          - Female
                          type: string
                          x-ms-enum:
                            name: Gender
                            modelAsString: false
                          nullable: true
                        faceRectangle:
                          description: Rectangle in the image containing the identified
                            face.
                          type: object
                          properties:
                            left:
                              format: int32
                              description: X-coordinate of the top left point of the
                                face, in pixels.
                              type: integer
                              nullable: false
                            top:
                              format: int32
                              description: Y-coordinate of the top left point of the
                                face, in pixels.
                              type: integer
                              nullable: false
                            width:
                              format: int32
                              description: Width measured from the top-left point
                                of the face, in pixels.
                              type: integer
                              nullable: false
                            height:
                              format: int32
                              description: Height measured from the top-left point
                                of the face, in pixels.
                              type: integer
                              nullable: false
                          nullable: true
                      nullable: true
                    nullable: true
                  objects:
                    description: Array of objects describing what was detected in
                      the image.
                    type: array
                    items:
                      description: An object detected in an image.
                      type: object
                      properties:
                        rectangle:
                          description: Approximate location of the detected object.
                          readOnly: true
                          type: object
                          properties:
                            x:
                              format: int32
                              description: X-coordinate of the top left point of the
                                area, in pixels.
                              type: integer
                              nullable: false
                            y:
                              format: int32
                              description: Y-coordinate of the top left point of the
                                area, in pixels.
                              type: integer
                              nullable: false
                            w:
                              format: int32
                              description: Width measured from the top-left point
                                of the area, in pixels.
                              type: integer
                              nullable: false
                            h:
                              format: int32
                              description: Height measured from the top-left point
                                of the area, in pixels.
                              type: integer
                              nullable: false
                          nullable: false
                        object:
                          description: Label for the object.
                          type: string
                          nullable: true
                        confidence:
                          format: double
                          description: Confidence score of having observed the object
                            in the image, as a value ranging from 0 to 1.
                          type: number
                          nullable: false
                        parent:
                          description: "The parent object, from a taxonomy perspective.\r\
                            \nThe parent object is a more generic form of this object.\
                            \  For example, a 'bulldog' would have a parent of 'dog'."
                          type: object
                          properties:
                            object:
                              description: Label for the object.
                              type: string
                              nullable: true
                            confidence:
                              format: double
                              description: Confidence score of having observed the
                                object in the image, as a value ranging from 0 to
                                1.
                              type: number
                              nullable: false
                            parent:
                              description: "The parent object, from a taxonomy perspective.\r\
                                \nThe parent object is a more generic form of this\
                                \ object.  For example, a 'bulldog' would have a parent\
                                \ of 'dog'."
                              type: object
                              properties:
                                object:
                                  description: Label for the object.
                                  type: string
                                  nullable: true
                                confidence:
                                  format: double
                                  description: Confidence score of having observed
                                    the object in the image, as a value ranging from
                                    0 to 1.
                                  type: number
                                  nullable: false
                                parent:
                                  description: "The parent object, from a taxonomy\
                                    \ perspective.\r\nThe parent object is a more\
                                    \ generic form of this object.  For example, a\
                                    \ 'bulldog' would have a parent of 'dog'."
                                  type: object
                                  properties:
                                    object:
                                      description: Label for the object.
                                      type: string
                                      nullable: true
                                    confidence:
                                      format: double
                                      description: Confidence score of having observed
                                        the object in the image, as a value ranging
                                        from 0 to 1.
                                      type: number
                                      nullable: false
                                  nullable: true
                              nullable: true
                          nullable: true
                      nullable: true
                    nullable: true
                  brands:
                    description: Array of brands detected in the image.
                    type: array
                    items:
                      description: A brand detected in an image.
                      type: object
                      properties:
                        name:
                          description: Label for the brand.
                          type: string
                          readOnly: true
                          nullable: true
                        confidence:
                          format: double
                          description: Confidence score of having observed the brand
                            in the image, as a value ranging from 0 to 1.
                          type: number
                          readOnly: true
                          nullable: false
                        rectangle:
                          description: Approximate location of the detected brand.
                          readOnly: true
                          type: object
                          properties:
                            x:
                              format: int32
                              description: X-coordinate of the top left point of the
                                area, in pixels.
                              type: integer
                              nullable: false
                            y:
                              format: int32
                              description: Y-coordinate of the top left point of the
                                area, in pixels.
                              type: integer
                              nullable: false
                            w:
                              format: int32
                              description: Width measured from the top-left point
                                of the area, in pixels.
                              type: integer
                              nullable: false
                            h:
                              format: int32
                              description: Height measured from the top-left point
                                of the area, in pixels.
                              type: integer
                              nullable: false
                          nullable: false
                      nullable: true
                    nullable: true
                  requestId:
                    description: Id of the REST API request.
                    type: string
                    nullable: true
                  metadata:
                    description: Image metadata.
                    type: object
                    properties:
                      width:
                        format: int32
                        description: Image width, in pixels.
                        type: integer
                        nullable: false
                      height:
                        format: int32
                        description: Image height, in pixels.
                        type: integer
                        nullable: false
                      format:
                        description: Image format.
                        type: string
                        nullable: true
                    nullable: true
                  modelVersion:
                    description: Version of the AI model.
                    type: string
                    pattern: ^(latest|\d{4}-\d{2}-\d{2})(-preview)?$
                    nullable: false
                nullable: true
        default:
          description: Error response.
          content:
            application/json:
              schema:
                description: The API error response.
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    description: Error contents.
                    required:
                    - code
                    - message
                    properties:
                      code:
                        description: The error code.
                        type: string
                        enum:
                        - InvalidRequest
                        - InvalidArgument
                        - InternalServerError
                        - ServiceUnavailable
                        x-ms-enum:
                          name: ComputerVisionErrorCodes
                          modelAsString: true
                      message:
                        description: A message explaining the error reported by the
                          service.
                        type: string
                      innererror:
                        description: Inner error contains more specific information.
                        type: object
                        required:
                        - code
                        - message
                        properties:
                          code:
                            description: The error code.
                            type: string
                            enum:
                            - InvalidImageFormat
                            - UnsupportedMediaType
                            - InvalidImageUrl
                            - NotSupportedFeature
                            - NotSupportedImage
                            - Timeout
                            - InternalServerError
                            - InvalidImageSize
                            - BadArgument
                            - DetectFaceError
                            - NotSupportedLanguage
                            - InvalidThumbnailSize
                            - InvalidDetails
                            - InvalidModel
                            - CancelledRequest
                            - NotSupportedVisualFeature
                            - FailedToProcess
                            - Unspecified
                            - StorageException
                            x-ms-enum:
                              name: ComputerVisionInnerErrorCodeValue
                              modelAsString: true
                          message:
                            type: string
                            description: Error message.
  /describe:
    post:
      description: "This operation generates a description of an image in human readable\
        \ language with complete sentences. The description is based on a collection\
        \ of content tags, which are also returned by the operation. More than one\
        \ description can be generated for each image. Descriptions are ordered by\
        \ their confidence score. Descriptions may include results from celebrity\
        \ and landmark domain models, if applicable.\r\nTwo input methods are supported\
        \ -- (1) Uploading an image or (2) specifying an image URL.\r\nA successful\
        \ response will be returned in JSON. If the request failed, the response will\
        \ contain an error code and a message to help understand what went wrong."
      operationId: DescribeImage
      parameters:
      - name: maxCandidates
        in: query
        description: Maximum number of candidate descriptions to be returned.  The
          default is 1.
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
          default: 1
      - name: language
        in: query
        description: The desired language for output generation. If this parameter
          is not specified, the default value is "en". See https://aka.ms/cv-languages
          for list of supported languages.
        required: false
        x-ms-parameter-location: method
        x-nullable: false
        schema:
          type: string
          enum:
          - ar
          - az
          - bg
          - bs
          - ca
          - cs
          - cy
          - da
          - de
          - el
          - en
          - es
          - et
          - eu
          - fi
          - fr
          - ga
          - gl
          - he
          - hi
          - hr
          - hu
          - id
          - it
          - ja
          - kk
          - ko
          - lt
          - lv
          - mk
          - ms
          - nb
          - nl
          - pl
          - prs
          - pt
          - pt-BR
          - pt-PT
          - ro
          - ru
          - sk
          - sl
          - sr-Cyrl
          - sr-Latn
          - sv
          - th
          - tr
          - uk
          - vi
          - zh
          - zh-Hans
          - zh-Hant
          default: en
      - name: descriptionExclude
        in: query
        description: Turn off specified domain models when generating the description.
        required: false
        x-nullable: true
        x-ms-parameter-location: method
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Celebrities
            - Landmarks
            x-ms-enum:
              name: DescriptionExclude
              modelAsString: false
            nullable: false
      - name: model-version
        in: query
        description: 'Optional parameter to specify the version of the AI model. Accepted
          values are: "latest", "2021-04-01", "2021-05-01". Defaults to "latest".'
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
          pattern: ^(latest|\d{4}-\d{2}-\d{2})(-preview)?$
          default: latest
      requestBody:
        content:
          application/json:
            schema:
              required:
              - url
              type: object
              properties:
                url:
                  description: Publicly reachable URL of an image.
                  type: string
        description: A JSON document with a URL pointing to the image that is to be
          analyzed.
        required: true
        x-ms-parameter-location: method
        x-ms-client-flatten: true
      responses:
        '200':
          description: Image description object.
          content:
            application/json:
              schema:
                description: A collection of content tags, along with a list of captions
                  sorted by confidence level, and image metadata.
                type: object
                properties:
                  description:
                    description: A collection of content tags, along with a list of
                      captions sorted by confidence level, and image metadata.
                    x-ms-client-flatten: true
                    type: object
                    properties:
                      tags:
                        description: A collection of image tags.
                        type: array
                        items:
                          type: string
                          nullable: true
                        nullable: true
                      captions:
                        description: A list of captions, sorted by confidence level.
                        type: array
                        items:
                          description: An image caption, i.e. a brief description
                            of what the image depicts.
                          type: object
                          properties:
                            text:
                              description: The text of the caption.
                              type: string
                              nullable: true
                            confidence:
                              format: double
                              description: The level of confidence the service has
                                in the caption.
                              type: number
                              nullable: false
                          nullable: true
                        nullable: true
                    nullable: true
                  requestId:
                    description: Id of the REST API request.
                    type: string
                    nullable: true
                  metadata:
                    description: Image metadata.
                    type: object
                    properties:
                      width:
                        format: int32
                        description: Image width, in pixels.
                        type: integer
                        nullable: false
                      height:
                        format: int32
                        description: Image height, in pixels.
                        type: integer
                        nullable: false
                      format:
                        description: Image format.
                        type: string
                        nullable: true
                    nullable: true
                  modelVersion:
                    description: Version of the AI model.
                    type: string
                    pattern: ^(latest|\d{4}-\d{2}-\d{2})(-preview)?$
                    nullable: false
                nullable: true
        default:
          description: Error response.
          content:
            application/json:
              schema:
                description: The API error response.
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    description: Error contents.
                    required:
