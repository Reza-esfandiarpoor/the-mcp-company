      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
  schemas:
    ImageAnalysis:
      description: Result of AnalyzeImage operation.
      type: object
      properties:
        categories:
          description: An array indicating identified categories.
          type: array
          items:
            description: An object describing identified category.
            type: object
            properties:
              name:
                description: Name of the category.
                type: string
                nullable: true
              score:
                format: double
                description: Scoring of the category.
                type: number
                nullable: false
              detail:
                description: Details of the identified category.
                type: object
                properties:
                  celebrities:
                    description: An array of celebrities if any identified.
                    type: array
                    items:
                      description: An object describing possible celebrity identification.
                      type: object
                      properties:
                        name:
                          description: Name of the celebrity.
                          type: string
                          nullable: true
                        confidence:
                          format: double
                          description: Confidence level for the celebrity recognition
                            as a value ranging from 0 to 1.
                          type: number
                          nullable: false
                        faceRectangle:
                          description: Location of the identified face in the image.
                          type: object
                          properties:
                            left:
                              format: int32
                              description: X-coordinate of the top left point of the
                                face, in pixels.
                              type: integer
                              nullable: false
                            top:
                              format: int32
                              description: Y-coordinate of the top left point of the
                                face, in pixels.
                              type: integer
                              nullable: false
                            width:
                              format: int32
                              description: Width measured from the top-left point
                                of the face, in pixels.
                              type: integer
                              nullable: false
                            height:
                              format: int32
                              description: Height measured from the top-left point
                                of the face, in pixels.
                              type: integer
                              nullable: false
                          nullable: true
                      nullable: true
                    nullable: true
                  landmarks:
                    description: An array of landmarks if any identified.
                    type: array
                    items:
                      description: A landmark recognized in the image.
                      type: object
                      properties:
                        name:
                          description: Name of the landmark.
                          type: string
                          nullable: true
                        confidence:
                          format: double
                          description: Confidence level for the landmark recognition
                            as a value ranging from 0 to 1.
                          type: number
                          nullable: false
                      nullable: true
                    nullable: true
                nullable: true
            nullable: true
          nullable: true
        adult:
          description: An object describing whether the image contains adult-oriented
            content and/or is racy.
          type: object
          properties:
            isAdultContent:
              description: A value indicating if the image contains adult-oriented
                content.
              type: boolean
              nullable: false
            isRacyContent:
              description: A value indicating if the image is racy.
              type: boolean
              nullable: false
            isGoryContent:
              description: A value indicating if the image is gory.
              type: boolean
              nullable: false
            adultScore:
              format: double
              description: Score from 0 to 1 that indicates how much the content is
                considered adult-oriented within the image.
              type: number
              nullable: false
            racyScore:
              format: double
              description: Score from 0 to 1 that indicates how suggestive is the
                image.
              type: number
              nullable: false
            goreScore:
              format: double
              description: Score from 0 to 1 that indicates how gory is the image.
              type: number
              nullable: false
          nullable: true
        color:
          description: An object providing additional metadata describing color attributes.
          type: object
          properties:
            dominantColorForeground:
              description: Possible dominant foreground color.
              type: string
              nullable: true
            dominantColorBackground:
              description: Possible dominant background color.
              type: string
              nullable: true
            dominantColors:
              description: An array of possible dominant colors.
              type: array
              items:
                type: string
                nullable: true
              nullable: true
            accentColor:
              description: Possible accent color.
              type: string
              nullable: true
            isBWImg:
              description: A value indicating if the image is black and white.
              type: boolean
              nullable: false
          nullable: true
        imageType:
          description: An object providing possible image types and matching confidence
            levels.
          type: object
          properties:
            clipArtType:
              format: int32
              description: Confidence level that the image is a clip art.
              type: integer
              nullable: false
            lineDrawingType:
              format: int32
              description: Confidence level that the image is a line drawing.
              type: integer
              nullable: false
          nullable: true
        tags:
          description: A list of tags with confidence level.
          type: array
          items:
            description: An entity observation in the image, along with the confidence
              score.
            type: object
            properties:
              name:
                description: Name of the entity.
                type: string
                nullable: true
              confidence:
                format: double
                description: The level of confidence that the entity was observed.
                type: number
                nullable: false
              hint:
                description: Optional hint/details for this tag.
                type: string
                nullable: true
            nullable: true
          nullable: true
        description:
          description: A collection of content tags, along with a list of captions
            sorted by confidence level, and image metadata.
          type: object
          properties:
            tags:
              description: A collection of image tags.
              type: array
              items:
                type: string
                nullable: true
              nullable: true
            captions:
              description: A list of captions, sorted by confidence level.
              type: array
              items:
                description: An image caption, i.e. a brief description of what the
                  image depicts.
                type: object
                properties:
                  text:
                    description: The text of the caption.
                    type: string
                    nullable: true
                  confidence:
                    format: double
                    description: The level of confidence the service has in the caption.
                    type: number
                    nullable: false
                nullable: true
              nullable: true
          nullable: true
        faces:
          description: An array of possible faces within the image.
          type: array
          items:
            description: An object describing a face identified in the image.
            type: object
            properties:
              age:
                format: int32
                description: Possible age of the face.
                type: integer
                nullable: false
              gender:
                description: Possible gender of the face.
                enum:
                - Male
                - Female
                type: string
                x-ms-enum:
                  name: Gender
                  modelAsString: false
                nullable: true
              faceRectangle:
                description: Rectangle in the image containing the identified face.
                type: object
                properties:
                  left:
                    format: int32
                    description: X-coordinate of the top left point of the face, in
                      pixels.
                    type: integer
                    nullable: false
                  top:
                    format: int32
                    description: Y-coordinate of the top left point of the face, in
                      pixels.
                    type: integer
                    nullable: false
                  width:
                    format: int32
                    description: Width measured from the top-left point of the face,
                      in pixels.
                    type: integer
                    nullable: false
                  height:
                    format: int32
                    description: Height measured from the top-left point of the face,
                      in pixels.
                    type: integer
