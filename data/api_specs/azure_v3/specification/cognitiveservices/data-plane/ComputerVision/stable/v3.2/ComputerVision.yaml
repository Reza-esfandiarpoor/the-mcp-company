x-ms-paths:
  /analyze?overload=stream:
    post:
      description: "This operation extracts a rich set of visual features based on\
        \ the image content.\r\nTwo input methods are supported -- (1) Uploading an\
        \ image or (2) specifying an image URL. Within your request, there is an optional\
        \ parameter to allow you to choose which features to return. By default, image\
        \ categories are returned in the response.\r\nA successful response will be\
        \ returned in JSON. If the request failed, the response will contain an error\
        \ code and a message to help understand what went wrong."
      operationId: AnalyzeImageInStream
      parameters:
      - $ref: '#/components/parameters/VisualFeatures'
      - name: details
        in: query
        description: 'A string indicating which domain-specific details to return.
          Multiple values should be comma-separated. Valid visual feature types include:
          Celebrities - identifies celebrities if detected in the image, Landmarks
          - identifies notable landmarks in the image.'
        required: false
        x-nullable: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Celebrities
            - Landmarks
            x-ms-enum:
              name: Details
              modelAsString: false
            nullable: false
      - $ref: '#/components/parameters/ServiceLanguage'
      - $ref: '#/components/parameters/DescriptionExclude'
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: "The response include the extracted features in JSON format.\
            \ Here is the definitions for enumeration types:\r\n ClipartType\r\n Non\
            \ - clipart = 0, ambiguous = 1, normal - clipart = 2, good - clipart =\
            \ 3. LineDrawingTypeNon - LineDrawing = 0, LineDrawing = 1."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAnalysis'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /areaOfInterest?overload=stream:
    post:
      description: "This operation returns a bounding box around the most important\
        \ area of the image.\r\nA successful response will be returned in JSON. If\
        \ the request failed, the response contains an error code and a message to\
        \ help determine what went wrong.\r\nUpon failure, the error code and an error\
        \ message are returned. The error code could be one of InvalidImageUrl, InvalidImageFormat,\
        \ InvalidImageSize, NotSupportedImage, FailedToProcess, Timeout, or InternalServerError."
      operationId: GetAreaOfInterestInStream
      parameters:
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: The response includes the extracted area of interest in JSON
            format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaOfInterestResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /describe?overload=stream:
    post:
      description: "This operation generates a description of an image in human readable\
        \ language with complete sentences. The description is based on a collection\
        \ of content tags, which are also returned by the operation. More than one\
        \ description can be generated for each image. Descriptions are ordered by\
        \ their confidence score. Descriptions may include results from celebrity\
        \ and landmark domain models, if applicable.\r\nTwo input methods are supported\
        \ -- (1) Uploading an image or (2) specifying an image URL.\r\nA successful\
        \ response will be returned in JSON. If the request failed, the response will\
        \ contain an error code and a message to help understand what went wrong."
      operationId: DescribeImageInStream
      parameters:
      - name: maxCandidates
        in: query
        description: Maximum number of candidate descriptions to be returned.  The
          default is 1.
        required: false
        x-nullable: true
        schema:
          type: integer
          format: int32
          default: 1
      - $ref: '#/components/parameters/ServiceLanguage'
      - $ref: '#/components/parameters/DescriptionExclude'
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: Image description object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageDescription'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /detect?overload=stream:
    post:
      description: "Performs object detection on the specified image.\r\nTwo input\
        \ methods are supported -- (1) Uploading an image or (2) specifying an image\
        \ URL.\r\nA successful response will be returned in JSON. If the request failed,\
        \ the response will contain an error code and a message to help understand\
        \ what went wrong."
      operationId: DetectObjectsInStream
      parameters:
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: The response include the detected objects in JSON format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /generateThumbnail?overload=stream:
    post:
      description: "This operation generates a thumbnail image with the user-specified\
        \ width and height. By default, the service analyzes the image, identifies\
        \ the region of interest (ROI), and generates smart cropping coordinates based\
        \ on the ROI. Smart cropping helps when you specify an aspect ratio that differs\
        \ from that of the input image.\r\nA successful response contains the thumbnail\
        \ image binary. If the request failed, the response contains an error code\
        \ and a message to help determine what went wrong.\r\nUpon failure, the error\
        \ code and an error message are returned. The error code could be one of InvalidImageUrl,\
        \ InvalidImageFormat, InvalidImageSize, InvalidThumbnailSize, NotSupportedImage,\
        \ FailedToProcess, Timeout, or InternalServerError."
      operationId: GenerateThumbnailInStream
      parameters:
      - name: width
        in: query
        description: Width of the thumbnail, in pixels. It must be between 1 and 1024.
          Recommended minimum of 50.
        required: true
        x-nullable: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
      - name: height
        in: query
        description: Height of the thumbnail, in pixels. It must be between 1 and
          1024. Recommended minimum of 50.
        required: true
        x-nullable: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1024
      - name: smartCropping
        in: query
        description: Boolean flag for enabling smart cropping.
        required: false
        x-nullable: true
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: The generated thumbnail in binary format.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Error response.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /models/{model}/analyze?overload=stream:
    post:
      description: "This operation recognizes content within an image by applying\
        \ a domain-specific model. The list of domain-specific models that are supported\
        \ by the Computer Vision API can be retrieved using the /models GET request.\
        \ Currently, the API provides following domain-specific models: celebrities,\
        \ landmarks.\r\nTwo input methods are supported -- (1) Uploading an image\
        \ or (2) specifying an image URL.\r\nA successful response will be returned\
        \ in JSON.\r\nIf the request failed, the response will contain an error code\
        \ and a message to help understand what went wrong."
      operationId: AnalyzeImageByDomainInStream
      parameters:
      - name: model
        in: path
        description: The domain-specific content to recognize.
        required: true
        x-nullable: true
        schema:
          type: string
      - $ref: '#/components/parameters/ServiceLanguage'
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: Analysis result based on the domain model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainModelResults'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /ocr?overload=stream:
    post:
      description: "Optical Character Recognition (OCR) detects text in an image and\
        \ extracts the recognized characters into a machine-usable character stream.\r\
        \nUpon success, the OCR results will be returned.\r\nUpon failure, the error\
        \ code together with an error message will be returned. The error code can\
        \ be one of InvalidImageUrl, InvalidImageFormat, InvalidImageSize, NotSupportedImage,\
        \ NotSupportedLanguage, or InternalServerError."
      operationId: RecognizePrintedTextInStream
      parameters:
      - $ref: '#/components/parameters/DetectOrientation'
      - $ref: '#/components/parameters/OcrLanguage'
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: The OCR results in the hierarchy of region/line/word. The results
            include text, bounding box for regions, lines and words. The angle, in
            radians, of the detected text with respect to the closest horizontal or
            vertical direction. After rotating the input image clockwise by this angle,
            the recognized text lines become horizontal or vertical. In combination
            with the orientation property it can be used to overlay recognition results
            correctly on the original image, by rotating either the original image
            or recognition results by a suitable angle around the center of the original
            image. If the angle cannot be confidently detected, this property is not
            present. If the image contains text at different angles, only part of
            the text will be recognized correctly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
  /tag?overload=stream:
    post:
      description: "This operation generates a list of words, or tags, that are relevant\
        \ to the content of the supplied image. The Computer Vision API can return\
        \ tags based on objects, living beings, scenery or actions found in images.\
        \ Unlike categories, tags are not organized according to a hierarchical classification\
        \ system, but correspond to image content. Tags may contain hints to avoid\
        \ ambiguity or provide context, for example the tag \"ascomycete\" may be\
        \ accompanied by the hint \"fungus\".\r\nTwo input methods are supported --\
        \ (1) Uploading an image or (2) specifying an image URL.\r\nA successful response\
        \ will be returned in JSON. If the request failed, the response will contain\
        \ an error code and a message to help understand what went wrong."
      operationId: TagImageInStream
      parameters:
      - $ref: '#/components/parameters/ServiceLanguage'
      - $ref: '#/components/parameters/ModelVersion'
      requestBody:
        $ref: '#/components/requestBodies/AnalyzeImageInStreamImage'
      responses:
        '200':
          description: Image tags object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputerVisionErrorResponse'
