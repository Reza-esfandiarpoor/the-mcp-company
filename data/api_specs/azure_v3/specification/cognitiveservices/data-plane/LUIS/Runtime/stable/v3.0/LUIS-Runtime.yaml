openapi: 3.0.0
info:
  title: LUIS Runtime Client
  version: '3.0'
servers:
- url: '{Endpoint}/luis/prediction/v3.0'
  variables:
    Endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apiKeyHeader: []
paths:
  /apps/{appId}/versions/{versionId}/predict:
    get:
      description: Gets the predictions for an application version.
      operationId: Prediction_GetVersionPredictionGET
      parameters:
      - in: path
        name: appId
        description: The application ID.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: versionId
        description: The application version ID.
        required: true
        schema:
          type: string
      - in: query
        name: query
        description: The query to predict.
        required: true
        schema:
          type: string
      - in: query
        name: verbose
        description: Indicates whether to get extra metadata for the entities predictions
          or not.
        schema:
          type: boolean
      - in: query
        name: show-all-intents
        description: Indicates whether to return all the intents in the response or
          just the top intent.
        schema:
          type: boolean
      - in: query
        name: log
        description: Indicates whether to log the endpoint query or not.
        schema:
          type: boolean
      responses:
        '200':
          description: The prediction for the supplied query.
          content:
            application/json:
              schema:
                description: Represents the prediction response.
                required:
                - query
                - prediction
                type: object
                properties:
                  query:
                    description: The query used in the prediction.
                    type: string
                  prediction:
                    description: The prediction of the requested query.
                    required:
                    - topIntent
                    - intents
                    - entities
                    type: object
                    properties:
                      alteredQuery:
                        description: The query after spell checking. Only set if spell
                          check was enabled and a spelling mistake was found.
                        type: string
                      topIntent:
                        description: The name of the top scoring intent.
                        type: string
                      intents:
                        description: A dictionary representing the intents that fired.
                        type: object
                        additionalProperties:
                          description: Represents an intent prediction.
                          type: object
                          properties:
                            score:
                              format: float
                              description: The score of the fired intent.
                              type: number
                            childApp:
                              description: The prediction of the dispatched application.
                              required:
                              - topIntent
                              - intents
                              - entities
                              type: object
                              properties:
                                alteredQuery:
                                  description: The query after spell checking. Only
                                    set if spell check was enabled and a spelling
                                    mistake was found.
                                  type: string
                                topIntent:
                                  description: The name of the top scoring intent.
                                  type: string
                                intents:
                                  description: A dictionary representing the intents
                                    that fired.
                                  type: object
                                  additionalProperties:
                                    description: Represents an intent prediction.
                                    type: object
                                    properties:
                                      score:
                                        format: float
                                        description: The score of the fired intent.
                                        type: number
                                      childApp:
                                        description: The prediction of the dispatched
                                          application.
                                        required:
                                        - topIntent
                                        - intents
                                        - entities
                                        type: object
                                        properties:
                                          alteredQuery:
                                            description: The query after spell checking.
                                              Only set if spell check was enabled
                                              and a spelling mistake was found.
                                            type: string
                                          topIntent:
                                            description: The name of the top scoring
                                              intent.
                                            type: string
                                entities:
                                  description: A dictionary representing the entities
                                    that fired.
                                  type: object
                                  additionalProperties: {}
                                sentiment:
                                  description: The result of the sentiment analysis.
                                  required:
                                  - score
                                  type: object
                                  properties:
                                    label:
                                      description: The label of the sentiment analysis
                                        result.
                                      type: string
                                    score:
                                      format: float
                                      description: The sentiment score of the query.
                                      type: number
                      entities:
                        description: A dictionary representing the entities that fired.
                        type: object
                        additionalProperties: {}
                      sentiment:
                        description: The result of the sentiment analysis.
                        required:
                        - score
                        type: object
                        properties:
                          label:
                            description: The label of the sentiment analysis result.
                            type: string
                          score:
                            format: float
                            description: The sentiment score of the query.
                            type: number
