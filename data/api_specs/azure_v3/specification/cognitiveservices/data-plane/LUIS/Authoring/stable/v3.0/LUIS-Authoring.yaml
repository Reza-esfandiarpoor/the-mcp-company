    FeaturesResponseObject:
      description: Model Features, including Patterns and Phraselists.
      type: object
      properties:
        phraselistFeatures:
          description: List of Phraselist Features.
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: A six-digit ID used for Features.
              name:
                type: string
                description: The name of the Feature.
              isActive:
                description: Indicates if the feature is enabled.
                type: boolean
              enabledForAllModels:
                description: Indicates if the feature is enabled for all models in
                  the application.
                type: boolean
              phrases:
                type: string
                description: A list of comma-separated values.
              isExchangeable:
                description: "An exchangeable phrase list feature are serves as single\
                  \ feature to the LUIS underlying training algorithm. It is used\
                  \ as a lexicon lookup feature where its value is 1 if the lexicon\
                  \ contains a given word or 0 if it doesn\u2019t. Think of an exchangeable\
                  \ as a synonyms list. A non-exchangeable phrase list feature has\
                  \ all the phrases in the list serve as separate features to the\
                  \ underlying training algorithm. So, if you your phrase list feature\
                  \ contains 5 phrases, they will be mapped to 5 separate features.\
                  \ You can think of the non-exchangeable phrase list feature as an\
                  \ additional bag of words that you are willing to add to LUIS existing\
                  \ vocabulary features. Think of a non-exchangeable as set of different\
                  \ words. Default value is true."
                type: boolean
            description: The base class Features-related response objects inherit
              from.
        patternFeatures:
          description: List of Pattern features.
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: A six-digit ID used for Features.
              name:
                type: string
                description: The name of the Feature.
              isActive:
                description: Indicates if the feature is enabled.
                type: boolean
              enabledForAllModels:
                description: Indicates if the feature is enabled for all models in
                  the application.
                type: boolean
              pattern:
                description: The Regular Expression to match.
                type: string
            description: The base class Features-related response objects inherit
              from.
