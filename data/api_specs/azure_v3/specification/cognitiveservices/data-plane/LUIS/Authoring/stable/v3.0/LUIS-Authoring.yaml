x-ms-paths:
  /apps/import?JsonVersion=V2:
    post:
      description: Imports an application to LUIS, the application's structure is
        included in the request body.
      operationId: Apps_ImportV2App
      parameters:
      - name: appName
        in: query
        description: The application name to create. If not specified, the application
          name will be read from the imported object. If the application name already
          exists, an error is returned.
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/LuisAppV2'
      responses:
        '201':
          description: The ID of the imported application.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidResponse'
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apps/import?format=lu:
    post:
      description: Imports an application to LUIS, the application's structure is
        included in the request body.
      operationId: Apps_ImportLuFormat
      parameters:
      - name: appName
        in: query
        description: The application name to create. If not specified, the application
          name will be read from the imported object. If the application name already
          exists, an error is returned.
        schema:
          type: string
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: A LUIS application structure.
        required: true
      responses:
        '201':
          description: The ID of the imported application.
          x-nullable: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidResponse'
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apps/{appId}/versions/import?JsonVersion=V2:
    post:
      description: Imports a new version into a LUIS application.
      operationId: Versions_ImportV2App
      parameters:
      - $ref: '#/components/parameters/AppIdInPath'
      - name: versionId
        in: query
        description: The new versionId to import. If not specified, the versionId
          will be read from the imported object.
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/LuisAppV2'
      responses:
        '201':
          description: The created application version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /apps/{appId}/versions/import?format=lu:
    post:
      description: Imports a new version into a LUIS application.
      operationId: Versions_ImportLuFormat
      parameters:
