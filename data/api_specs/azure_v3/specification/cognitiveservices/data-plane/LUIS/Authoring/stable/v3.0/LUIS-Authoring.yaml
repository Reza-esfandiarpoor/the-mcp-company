      requestBody:
        content:
          application/json:
            schema:
              description: Properties for creating a new LUIS Application
              type: object
              required:
              - culture
              - name
              properties:
                culture:
                  description: 'The culture for the new application. It is the language
                    that your app understands and speaks. E.g.: "en-us". Note: the
                    culture cannot be changed after the app is created.'
                  type: string
                domain:
                  description: 'The domain for the new application. Optional. E.g.:
                    Comics.'
                  type: string
                description:
                  description: Description of the new application. Optional.
                  type: string
                initialVersionId:
                  description: 'The initial version ID. Optional. Default value is:
                    "0.1"'
                  type: string
                usageScenario:
                  description: 'Defines the scenario for the new application. Optional.
                    E.g.: IoT.'
                  type: string
                name:
                  description: The name for the new application.
                  type: string
        description: 'An application containing Name, Description (optional), Culture,
          Usage Scenario (optional), Domain (optional) and initial version ID (optional)
          of the application. Default value for the version ID is "0.1". Note: the
