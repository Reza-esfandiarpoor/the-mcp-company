  /apps/{appId}/versions/{versionId}/train:
    post:
      description: 'Sends a training request for a version of a specified LUIS app.
        This POST request initiates a request asynchronously. To determine whether
        the training request is successful, submit a GET request to get training status.
        Note: The application version is not fully trained unless all the models (intents
        and entities) are trained successfully or are up to date. To verify training
        success, get the training status at least once after training is complete.'
      operationId: Train_TrainVersion
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - in: query
        name: mode
        description: An enum value specifying mode of training.
        schema:
          type: string
      responses:
        '202':
          description: This response indicates the initial training status.
          content:
            application/json:
              schema:
                description: Response model when requesting to train the model.
                type: object
                properties:
                  statusId:
                    description: The train request status ID.
                    type: integer
                  status:
                    description: The Training status.
                    type: string
                    enum:
                    - Queued
                    - InProgress
                    - UpToDate
                    - Fail
                    - Success
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
    get:
      description: Gets the training status of all models (intents and entities) for
        the specified LUIS app. You must call the train API to train the LUIS app
        before you call this API to get training status. "appID" specifies the LUIS
        app ID. "versionId" specifies the version number of the LUIS app. For example,
        "0.1".
      operationId: Train_GetStatus
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: 'A successful response provides an array of training status
            details for a LUIS app that you submitted for training. Each element in
            the response array provides training status for a model (intent or entity)
            in the LUIS app. Note: Training status is not provided for prebuilt entities
            because they are pretrained. The "modelId" property identifies which intent
            or entity the training status corresponds to. To get the name and type
            of each model, use the models API which has a request URL in this format:
            https://westus.api.cognitive.microsoft.com/luis/api/v3.0/apps/{appId}/versions/{versionId}/models
            The details property for each model can contain the following fields:
            "statusId": An integer from 0 to 3 that corresponds to the value of the
            status field. "status": A string with one of the following values: "Success",
            "UpToDate", "InProgress", "Fail". If the status is "Fail", the "failureReason"
            property provides the reason for failure. "exampleCount": The number of
            examples used for training. In the case of the None intent or prebuilt
            domain intents and entities, this number includes example provided internally
            by the system as well as examples you added to your LUIS app. "failureReason":
            A string that indicates the reason training failed.  The value "FewLabels"
            means that no labeled example utterances were provided for training. "trainingDateTime":
            A string indicating the time the model was last trained. The value uses
            the ISO 8601 format for representing times in UTC (Coordinated Universal
            Time) with a UTC designator ("Z"), for example: "2017-08-10T01:08:34Z".'
          content:
            application/json:
              schema:
                description: List of Model Training Infos.
                type: array
                items:
                  description: Model Training Info.
                  type: object
                  properties:
                    modelId:
                      type: string
                      format: uuid
                      description: The ID (GUID) of the model.
                    details:
                      description: Model Training Details.
                      type: object
                      properties:
                        statusId:
                          description: The train request status ID.
                          type: integer
                        status:
                          description: The Training status.
                          type: string
                          enum:
                          - Queued
                          - InProgress
                          - UpToDate
                          - Fail
                          - Success
                        exampleCount:
                          description: The count of examples used to train the model.
                          type: integer
                        trainingDateTime:
                          description: When the model was trained.
                          type: string
                          format: date-time
                        failureReason:
                          description: Reason for the training failure.
                          type: string
            JSON:
              schema:
                description: List of Model Training Infos.
                type: array
                items:
                  description: Model Training Info.
                  type: object
                  properties:
                    modelId:
                      type: string
                      format: uuid
                      description: The ID (GUID) of the model.
                    details:
                      description: Model Training Details.
                      type: object
                      properties:
                        statusId:
                          description: The train request status ID.
                          type: integer
                        status:
                          description: The Training status.
                          type: string
                          enum:
                          - Queued
                          - InProgress
                          - UpToDate
                          - Fail
                          - Success
                        exampleCount:
                          description: The count of examples used to train the model.
                          type: integer
                        trainingDateTime:
                          description: When the model was trained.
                          type: string
                          format: date-time
                        failureReason:
                          description: Reason for the training failure.
                          type: string
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
            JSON:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
