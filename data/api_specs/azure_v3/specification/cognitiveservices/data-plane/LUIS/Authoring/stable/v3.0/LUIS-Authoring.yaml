openapi: 3.0.0
info:
  title: LUIS Authoring Client
  version: '3.0'
servers:
- url: '{Endpoint}/luis/authoring/v3.0'
  variables:
    Endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apiKeyHeader: []
paths:
  /apps/{appId}/versions/{versionId}/phraselists:
    post:
      description: Creates a new phraselist feature in a version of the application.
      operationId: Features_AddPhraseList
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              description: Object model for creating a phraselist model.
              type: object
              properties:
                phrases:
                  description: List of comma-separated phrases that represent the
                    Phraselist.
                  type: string
                name:
                  description: The Phraselist name.
                  type: string
                isExchangeable:
                  description: "An interchangeable phrase list feature serves as a\
                    \ list of synonyms for training. A non-exchangeable phrase list\
                    \ serves as separate features for training. So, if your non-interchangeable\
                    \ phrase list contains 5 phrases, they will be mapped to 5 separate\
                    \ features. You can think of the non-interchangeable phrase list\
                    \ as an additional bag of words to add to LUIS existing vocabulary\
                    \ features. It is used as a lexicon lookup feature where its value\
                    \ is 1 if the lexicon contains a given word or 0 if it doesn\u2019\
                    t.  Default value is true."
                  default: true
                  type: boolean
                enabledForAllModels:
                  description: Indicates if the Phraselist is enabled for all models
                    in the application.
                  default: true
                  type: boolean
        description: A Phraselist object containing Name, comma-separated Phrases
          and the isExchangeable boolean. Default value for isExchangeable is true.
        required: true
      responses:
        '201':
          description: The ID of the created feature.
          content:
            application/json:
              schema:
                description: The ID of the created feature.
                type: integer
                nullable: false
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
    get:
      description: Gets all the phraselist features in a version of the application.
      operationId: Features_ListPhraseLists
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: skip
        in: query
        description: The number of entries to skip. Default value is 0.
        x-ms-parameter-location: method
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: take
        in: query
        description: The number of entries to return. Maximum page size is 500. Default
          is 100.
        x-ms-parameter-location: method
        schema:
          type: integer
          minimum: 0
          maximum: 500
          default: 100
      responses:
        '200':
          description: A list of all phraselist features.
          content:
            application/json:
              schema:
                description: List of Phraselist Features.
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: A six-digit ID used for Features.
                    name:
                      type: string
                      description: The name of the Feature.
                    isActive:
                      description: Indicates if the feature is enabled.
                      type: boolean
                    enabledForAllModels:
                      description: Indicates if the feature is enabled for all models
                        in the application.
                      type: boolean
                    phrases:
                      type: string
                      description: A list of comma-separated values.
                    isExchangeable:
                      description: "An exchangeable phrase list feature are serves\
                        \ as single feature to the LUIS underlying training algorithm.\
                        \ It is used as a lexicon lookup feature where its value is\
                        \ 1 if the lexicon contains a given word or 0 if it doesn\u2019\
                        t. Think of an exchangeable as a synonyms list. A non-exchangeable\
                        \ phrase list feature has all the phrases in the list serve\
                        \ as separate features to the underlying training algorithm.\
                        \ So, if you your phrase list feature contains 5 phrases,\
                        \ they will be mapped to 5 separate features. You can think\
                        \ of the non-exchangeable phrase list feature as an additional\
                        \ bag of words that you are willing to add to LUIS existing\
                        \ vocabulary features. Think of a non-exchangeable as set\
                        \ of different words. Default value is true."
                      type: boolean
                  description: The base class Features-related response objects inherit
                    from.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
  /apps/{appId}/versions/{versionId}/features:
    get:
      description: Gets all the extraction phraselist and pattern features in a version
        of the application.
      operationId: Features_List
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: skip
        in: query
        description: The number of entries to skip. Default value is 0.
        x-ms-parameter-location: method
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: take
        in: query
        description: The number of entries to return. Maximum page size is 500. Default
          is 100.
        x-ms-parameter-location: method
        schema:
          type: integer
          minimum: 0
          maximum: 500
          default: 100
      responses:
        '200':
          description: A list of all phraselist features and a list of all pattern
            features.
          content:
            application/json:
              schema:
                description: Model Features, including Patterns and Phraselists.
                type: object
                properties:
                  phraselistFeatures:
                    description: List of Phraselist Features.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: A six-digit ID used for Features.
                        name:
                          type: string
                          description: The name of the Feature.
                        isActive:
                          description: Indicates if the feature is enabled.
                          type: boolean
                        enabledForAllModels:
                          description: Indicates if the feature is enabled for all
                            models in the application.
                          type: boolean
                        phrases:
                          type: string
                          description: A list of comma-separated values.
                        isExchangeable:
                          description: "An exchangeable phrase list feature are serves\
                            \ as single feature to the LUIS underlying training algorithm.\
                            \ It is used as a lexicon lookup feature where its value\
                            \ is 1 if the lexicon contains a given word or 0 if it\
                            \ doesn\u2019t. Think of an exchangeable as a synonyms\
                            \ list. A non-exchangeable phrase list feature has all\
                            \ the phrases in the list serve as separate features to\
                            \ the underlying training algorithm. So, if you your phrase\
                            \ list feature contains 5 phrases, they will be mapped\
                            \ to 5 separate features. You can think of the non-exchangeable\
                            \ phrase list feature as an additional bag of words that\
                            \ you are willing to add to LUIS existing vocabulary features.\
                            \ Think of a non-exchangeable as set of different words.\
                            \ Default value is true."
                          type: boolean
                      description: The base class Features-related response objects
                        inherit from.
                  patternFeatures:
                    description: List of Pattern features.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: A six-digit ID used for Features.
                        name:
                          type: string
                          description: The name of the Feature.
                        isActive:
                          description: Indicates if the feature is enabled.
                          type: boolean
                        enabledForAllModels:
                          description: Indicates if the feature is enabled for all
                            models in the application.
                          type: boolean
                        pattern:
                          description: The Regular Expression to match.
                          type: string
                      description: The base class Features-related response objects
                        inherit from.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
  /apps/{appId}/versions/{versionId}/phraselists/{phraselistId}:
    get:
      description: Gets phraselist feature info in a version of the application.
      operationId: Features_GetPhraseList
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: phraselistId
        in: path
        description: The ID of the feature to be retrieved.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: A phraselist feature info.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: A six-digit ID used for Features.
                  name:
                    type: string
                    description: The name of the Feature.
                  isActive:
                    description: Indicates if the feature is enabled.
                    type: boolean
                  enabledForAllModels:
                    description: Indicates if the feature is enabled for all models
                      in the application.
                    type: boolean
                  phrases:
                    type: string
                    description: A list of comma-separated values.
                  isExchangeable:
                    description: "An exchangeable phrase list feature are serves as\
                      \ single feature to the LUIS underlying training algorithm.\
                      \ It is used as a lexicon lookup feature where its value is\
                      \ 1 if the lexicon contains a given word or 0 if it doesn\u2019\
                      t. Think of an exchangeable as a synonyms list. A non-exchangeable\
                      \ phrase list feature has all the phrases in the list serve\
                      \ as separate features to the underlying training algorithm.\
                      \ So, if you your phrase list feature contains 5 phrases, they\
                      \ will be mapped to 5 separate features. You can think of the\
                      \ non-exchangeable phrase list feature as an additional bag\
                      \ of words that you are willing to add to LUIS existing vocabulary\
                      \ features. Think of a non-exchangeable as set of different\
                      \ words. Default value is true."
                    type: boolean
                description: The base class Features-related response objects inherit
                  from.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
    put:
      description: Updates the phrases, the state and the name of the phraselist feature
        in a version of the application.
      operationId: Features_UpdatePhraseList
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: phraselistId
        in: path
        description: The ID of the feature to be updated.
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              description: Object model for updating a Phraselist.
              type: object
              properties:
                phrases:
                  description: List of comma-separated phrases that represent the
                    Phraselist.
                  type: string
                name:
                  description: The Phraselist name.
                  type: string
                isActive:
                  description: Indicates if the Phraselist is enabled.
                  default: true
                  type: boolean
                isExchangeable:
                  description: "An exchangeable phrase list feature are serves as\
                    \ single feature to the LUIS underlying training algorithm. It\
                    \ is used as a lexicon lookup feature where its value is 1 if\
                    \ the lexicon contains a given word or 0 if it doesn\u2019t. Think\
                    \ of an exchangeable as a synonyms list. A non-exchangeable phrase\
                    \ list feature has all the phrases in the list serve as separate\
                    \ features to the underlying training algorithm. So, if you your\
                    \ phrase list feature contains 5 phrases, they will be mapped\
                    \ to 5 separate features. You can think of the non-exchangeable\
                    \ phrase list feature as an additional bag of words that you are\
                    \ willing to add to LUIS existing vocabulary features. Think of\
                    \ a non-exchangeable as set of different words. Default value\
                    \ is true."
                  default: true
                  type: boolean
                enabledForAllModels:
                  description: Indicates if the Phraselist is enabled for all models
                    in the application.
                  default: true
                  type: boolean
        description: 'The new values for: - Just a boolean called IsActive, in which
          case the status of the feature will be changed. - Name, Pattern, Mode, and
          a boolean called IsActive to update the feature.'
      responses:
        '200':
          description: Successfully updated phraselist.
          content:
            application/json:
              schema:
                description: Response of an Operation status.
                type: object
                properties:
                  code:
                    type: string
                    description: Status Code.
                    enum:
                    - Failed
                    - FAILED
                    - Success
                    x-ms-enum:
                      modelAsString: true
                      name: OperationStatusType
                  message:
                    type: string
                    description: Status details.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
    delete:
      description: Deletes a phraselist feature from a version of the application.
      operationId: Features_DeletePhraseList
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: phraselistId
        in: path
        description: The ID of the feature to be deleted.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successfully deleted phraselist.
          content:
            application/json:
              schema:
                description: Response of an Operation status.
                type: object
                properties:
                  code:
                    type: string
                    description: Status Code.
                    enum:
                    - Failed
                    - FAILED
                    - Success
                    x-ms-enum:
                      modelAsString: true
                      name: OperationStatusType
                  message:
                    type: string
                    description: Status details.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
  /apps/{appId}/versions/{versionId}/example:
    post:
      description: Adds a labeled example utterance in a version of the application.
      operationId: Examples_Add
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: enableNestedChildren
        in: query
        description: Toggles nested/flat format
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              description: A labeled example utterance.
              type: object
              properties:
                text:
                  description: The example utterance.
                  type: string
                entityLabels:
                  description: The identified entities within the example utterance.
                  items:
                    type: object
                    description: Defines the entity type and position of the extracted
                      entity within the example.
                    required:
                    - entityName
                    - startCharIndex
                    - endCharIndex
                    properties:
                      entityName:
                        description: The entity type.
                        type: string
                      startCharIndex:
                        description: The index within the utterance where the extracted
                          entity starts.
                        type: integer
                      endCharIndex:
                        description: The index within the utterance where the extracted
                          entity ends.
                        type: integer
                      role:
                        description: The role the entity plays in the utterance.
                        type: string
                      children:
                        description: The identified entities within the example utterance.
                        items:
                          type: object
                          description: Defines the entity type and position of the
                            extracted entity within the example.
                          required:
                          - entityName
                          - startCharIndex
                          - endCharIndex
                          properties:
                            entityName:
                              description: The entity type.
                              type: string
                            startCharIndex:
                              description: The index within the utterance where the
                                extracted entity starts.
                              type: integer
                            endCharIndex:
                              description: The index within the utterance where the
                                extracted entity ends.
                              type: integer
                            role:
                              description: The role the entity plays in the utterance.
                              type: string
                            children:
                              description: The identified entities within the example
                                utterance.
                              items:
                                type: object
                                description: Defines the entity type and position
                                  of the extracted entity within the example.
                                required:
                                - entityName
                                - startCharIndex
                                - endCharIndex
                                properties:
                                  entityName:
                                    description: The entity type.
                                    type: string
                                  startCharIndex:
                                    description: The index within the utterance where
                                      the extracted entity starts.
                                    type: integer
                                  endCharIndex:
                                    description: The index within the utterance where
                                      the extracted entity ends.
                                    type: integer
                                  role:
                                    description: The role the entity plays in the
                                      utterance.
                                    type: string
                              type: array
                        type: array
                  type: array
                intentName:
                  description: The identified intent representing the example utterance.
                  type: string
        description: A labeled example utterance with the expected intent and entities.
        required: true
      responses:
        '201':
          description: The ID of the created example utterance.
          content:
            application/json:
              schema:
                description: Response when adding a labeled example utterance.
                type: object
                properties:
                  UtteranceText:
                    description: The example utterance.
                    type: string
                  ExampleId:
                    description: The newly created example ID.
                    type: integer
                    format: int64
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
  /apps/{appId}/versions/{versionId}/examples:
    post:
      description: Adds a batch of labeled example utterances to a version of the
        application.
      operationId: Examples_Batch
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: enableNestedChildren
        in: query
        description: Toggles nested/flat format
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              description: Object model for adding a batch of labeled examples.
              items:
                type: object
                description: A labeled example utterance.
                properties:
                  text:
                    description: The example utterance.
                    type: string
                  entityLabels:
                    description: The identified entities within the example utterance.
                    items:
                      type: object
                      description: Defines the entity type and position of the extracted
                        entity within the example.
                      required:
                      - entityName
                      - startCharIndex
                      - endCharIndex
                      properties:
                        entityName:
                          description: The entity type.
                          type: string
                        startCharIndex:
                          description: The index within the utterance where the extracted
                            entity starts.
                          type: integer
                        endCharIndex:
                          description: The index within the utterance where the extracted
                            entity ends.
                          type: integer
                        role:
                          description: The role the entity plays in the utterance.
                          type: string
                        children:
                          description: The identified entities within the example
                            utterance.
                          items:
                            type: object
                            description: Defines the entity type and position of the
                              extracted entity within the example.
                            required:
                            - entityName
                            - startCharIndex
                            - endCharIndex
                            properties:
                              entityName:
                                description: The entity type.
                                type: string
                              startCharIndex:
                                description: The index within the utterance where
                                  the extracted entity starts.
                                type: integer
                              endCharIndex:
                                description: The index within the utterance where
                                  the extracted entity ends.
                                type: integer
                              role:
                                description: The role the entity plays in the utterance.
                                type: string
                              children:
                                description: The identified entities within the example
                                  utterance.
                                items:
                                  type: object
                                  description: Defines the entity type and position
                                    of the extracted entity within the example.
                                  required:
                                  - entityName
                                  - startCharIndex
                                  - endCharIndex
                                  properties:
                                    entityName:
                                      description: The entity type.
                                      type: string
                                    startCharIndex:
                                      description: The index within the utterance
                                        where the extracted entity starts.
                                      type: integer
                                    endCharIndex:
                                      description: The index within the utterance
                                        where the extracted entity ends.
                                      type: integer
                                    role:
                                      description: The role the entity plays in the
                                        utterance.
                                      type: string
                                type: array
                          type: array
                    type: array
                  intentName:
                    description: The identified intent representing the example utterance.
                    type: string
              type: array
        description: Array of example utterances.
        required: true
      responses:
        '201':
          description: A string array determining which labeled example utterances
            were added successfully.
          content:
            application/json:
              schema:
                description: Response when adding a batch of labeled example utterances.
                type: array
                items:
                  description: Response when adding a batch of labeled example utterances.
                  type: object
                  properties:
                    value:
                      description: Response when adding a labeled example utterance.
                      type: object
                      properties:
                        UtteranceText:
                          description: The example utterance.
                          type: string
                        ExampleId:
                          description: The newly created example ID.
                          type: integer
                          format: int64
                    hasError:
                      type: boolean
                    error:
                      description: Response of an Operation status.
                      type: object
                      properties:
                        code:
                          type: string
                          description: Status Code.
                          enum:
                          - Failed
                          - FAILED
                          - Success
                          x-ms-enum:
                            modelAsString: true
                            name: OperationStatusType
                        message:
                          type: string
                          description: Status details.
        '207':
          description: Indicates that the request was partially successful. The response
            contains a string array indicating the status of each of the added labeled
            example utterances.
          content:
            application/json:
              schema:
                description: Response when adding a batch of labeled example utterances.
                type: array
                items:
                  description: Response when adding a batch of labeled example utterances.
                  type: object
                  properties:
                    value:
                      description: Response when adding a labeled example utterance.
                      type: object
                      properties:
                        UtteranceText:
                          description: The example utterance.
                          type: string
                        ExampleId:
                          description: The newly created example ID.
                          type: integer
                          format: int64
                    hasError:
                      type: boolean
                    error:
                      description: Response of an Operation status.
                      type: object
                      properties:
                        code:
                          type: string
                          description: Status Code.
                          enum:
                          - Failed
                          - FAILED
                          - Success
                          x-ms-enum:
                            modelAsString: true
                            name: OperationStatusType
                        message:
                          type: string
                          description: Status details.
        default:
          description: Error Response.
          content:
            application/json:
              schema:
                description: Error response when invoking an operation on the API.
                type: object
                properties:
                  errorType:
                    type: string
                additionalProperties:
                  type: object
    get:
      description: Returns example utterances to be reviewed from a version of the
        application.
      operationId: Examples_List
      parameters:
      - name: appId
        in: path
        required: true
        description: The application ID.
        x-ms-parameter-location: method
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        description: The version ID.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: skip
        in: query
        description: The number of entries to skip. Default value is 0.
        x-ms-parameter-location: method
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: take
        in: query
        description: The number of entries to return. Maximum page size is 500. Default
          is 100.
        x-ms-parameter-location: method
        schema:
          type: integer
