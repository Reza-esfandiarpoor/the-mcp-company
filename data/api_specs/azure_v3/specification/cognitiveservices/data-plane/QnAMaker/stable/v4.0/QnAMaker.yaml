openapi: 3.0.0
info:
  version: '4.0'
  title: QnAMaker Client
  description: An API for QnAMaker Service
security:
- apim_key: []
paths:
  /endpointSettings:
    get:
      summary: Gets endpoint settings for an endpoint.
      operationId: EndpointSettings_GetSettings
      responses:
        '200':
          description: Response with endpoint settings info in it.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointSettingsDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - EndpointKeys
      summary: Updates endpoint settings for an endpoint.
      operationId: EndpointSettings_UpdateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointSettingsDTO'
        description: Post body of the request.
        required: true
        x-nullable: true
        x-ms-parameter-location: method
      responses:
        '204':
          description: HTTP 204 No Content.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /endpointkeys:
    get:
      summary: Gets endpoint keys for an endpoint
      operationId: EndpointKeys_GetKeys
      responses:
        '200':
          description: Response with endpoint info in it.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointKeysDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /endpointkeys/{keyType}:
    patch:
      tags:
      - EndpointKeys
      summary: Re-generates an endpoint key.
      operationId: EndpointKeys_RefreshKeys
      parameters:
      - $ref: '#/components/parameters/KeyType'
      responses:
        '200':
          description: Details of the endpoint keys generated.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointKeysDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /alterations:
    get:
      tags:
      - Alterations
      summary: Download alterations from runtime.
      operationId: Alterations_Get
      responses:
        '200':
          description: Alterations data.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordAlterationsDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Alterations
      summary: Replace alterations data.
      operationId: Alterations_Replace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WordAlterationsDTO'
        description: New alterations data.
        required: true
        x-nullable: true
        x-ms-parameter-location: method
      responses:
        '204':
          description: HTTP 204 No Content.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /knowledgebases:
    get:
      tags:
      - Knowledgebases
      summary: Gets all knowledgebases for a user.
      operationId: Knowledgebase_ListAll
      responses:
        '200':
          description: Collection of knowledgebases.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgebasesDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operations/{operationId}:
    get:
      tags:
      - Operations
      summary: Gets details of a specific long running operation.
      operationId: Operations_GetDetails
      parameters:
      - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Details of the long running operation.
          x-nullable: true
          headers:
            RetryAfter:
              description: Indicates how long the client should wait before sending
                a follow up request. The header will be present only if the operation
                is running or has not started yet.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /knowledgebases/{kbId}:
    get:
      tags:
      - Knowledgebases
      summary: Gets details of a specific knowledgebase.
      operationId: Knowledgebase_GetDetails
      parameters:
      - $ref: '#/components/parameters/KbId'
      responses:
        '200':
          description: Details of the knowledgebase.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgebaseDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Knowledgebases
      summary: Deletes the knowledgebase and all its data.
      operationId: Knowledgebase_Delete
      parameters:
      - $ref: '#/components/parameters/KbId'
      responses:
        '204':
          description: HTTP 204 No content.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Knowledgebases
      summary: Publishes all changes in test index of a knowledgebase to its prod
        index.
      operationId: Knowledgebase_Publish
      parameters:
      - $ref: '#/components/parameters/KbId'
      responses:
        '204':
          description: HTTP 204 No content.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Knowledgebases
      summary: Replace knowledgebase contents.
      operationId: Knowledgebase_Replace
      parameters:
      - $ref: '#/components/parameters/KbId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKbDTO'
        description: An instance of ReplaceKbDTO which contains list of qnas to be
          uploaded
        required: true
        x-nullable: true
        x-ms-parameter-location: method
      responses:
        '204':
          description: HTTP 204 No content.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Knowledgebases
      summary: Asynchronous operation to modify a knowledgebase.
      operationId: Knowledgebase_Update
      parameters:
      - $ref: '#/components/parameters/KbId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKbOperationDTO'
        description: Post body of the request.
        required: true
        x-nullable: true
        x-ms-parameter-location: method
      responses:
        '202':
          description: Details of the asynchronous operation.
          x-nullable: true
          headers:
            Location:
              description: Relative URI to the target location of the asynchronous
                operation. Client should poll this resource to get status of the operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /knowledgebases/create:
    post:
      tags:
      - Knowledgebases
      summary: Asynchronous operation to create a new knowledgebase.
      operationId: Knowledgebase_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKbDTO'
        description: Post body of the request.
        required: true
        x-nullable: true
        x-ms-parameter-location: method
      responses:
        '202':
          description: Details of the asynchronous operation.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /knowledgebases/{kbId}/{environment}/qna:
    get:
      tags:
      - Knowledgebases
      summary: Download the knowledgebase.
      operationId: Knowledgebase_Download
      parameters:
      - $ref: '#/components/parameters/KbId'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/source'
      - $ref: '#/components/parameters/changedSince'
      responses:
        '200':
          description: Collection of all Q-A in the knowledgebase.
          x-nullable: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QnADocumentsDTO'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
servers:
- url: '{Endpoint}/qnamaker/v4.0'
  variables:
    Endpoint:
      description: Supported Cognitive Services endpoint (e.g., https://< qnamaker-resource-name>
        .api.cognitiveservices.azure.com).
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
components:
  parameters:
    Environment:
      name: environment
      in: path
      required: true
      x-nullable: false
      description: Specifies whether environment is Test or Prod.
      x-ms-enum:
        name: EnvironmentType
        modelAsString: true
      x-ms-parameter-location: method
      schema:
        type: string
        enum:
        - Prod
        - Test
    KbId:
      name: kbId
      in: path
      required: true
      x-nullable: false
      description: Knowledgebase id.
      x-ms-parameter-location: method
      schema:
        type: string
    source:
      name: source
      in: query
      required: false
      x-nullable: false
      description: 'The source property filter to apply. Sample value: Editorial,
        smartLight%20FAQ.tsv .'
      x-ms-parameter-location: method
      schema:
        type: string
    changedSince:
      name: changedSince
      in: query
      required: false
      x-nullable: false
      description: changedSince property is used to return all QnAs created or updated
        after a specific time duration. The user can filter QnAs by seconds (s), minutes
        (m), hours (h) and days (d). The user may use any integral value along with
        the suffix for time. For instance, the value of 5m returns all QnA pairs updated
        or created in the last 5 minutes.
      x-ms-parameter-location: method
      schema:
        type: string
    OperationId:
      name: operationId
      in: path
      required: true
      x-nullable: false
      description: Operation id.
      x-ms-parameter-location: method
      schema:
        type: string
    KeyType:
      name: keyType
      in: path
      required: true
      x-nullable: false
      description: Type of Key
      x-ms-parameter-location: method
      schema:
        type: string
    Endpoint:
      name: Endpoint
      description: Supported Cognitive Services endpoint (e.g., https://< qnamaker-resource-name>
        .api.cognitiveservices.azure.com).
      x-ms-parameter-location: client
      required: true
      in: path
      x-ms-skip-url-encoding: true
      schema:
        type: string
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
  schemas:
    UpdateKbOperationDTO:
      type: object
      description: Contains list of QnAs to be updated
      additionalProperties: false
      properties:
        add:
          $ref: '#/components/schemas/CreateKbInputDTO'
          description: An instance of CreateKbInputDTO for add operation
        delete:
          $ref: '#/components/schemas/DeleteKbContentsDTO'
          description: An instance of DeleteKbContentsDTO for delete Operation
        update:
          $ref: '#/components/schemas/UpdateKbContentsDTO'
          description: An instance of UpdateKbContentsDTO for Update Operation
        enableHierarchicalExtraction:
          type: boolean
          description: Enable hierarchical extraction of Q-A from files and urls.
            The value set during KB creation will be used if this field is not present.
        defaultAnswerUsedForExtraction:
          type: string
          description: Text string to be used as the answer in any Q-A which has no
            extracted answer from the document but has a hierarchy. Required when
            EnableHierarchicalExtraction field is set to True.
          maxLength: 300
          minLength: 1
    UpdateKbContentsDTO:
      type: object
      description: PATCH body schema for Update operation in Update Kb
      additionalProperties: false
      properties:
        name:
          type: string
          description: Friendly name for the knowledgebase.
        qnaList:
          type: array
          description: List of Q-A (UpdateQnaDTO) to be added to the knowledgebase.
          items:
            $ref: '#/components/schemas/UpdateQnaDTO'
        urls:
          type: array
          description: List of existing URLs to be refreshed. The content will be
            extracted again and re-indexed.
          maxLength: 10
          items:
            type: string
    UpdateQnaDTO:
      type: object
      description: PATCH Body schema for Update Qna List
      additionalProperties: false
      properties:
        id:
          type: integer
          description: Unique id for the Q-A
          format: int32
          maximum: 2147483647
          minimum: 0
        answer:
          type: string
          description: Answer text
        source:
          type: string
          description: Source from which Q-A was indexed. eg. https://docs.microsoft.com/en-us/azure/cognitive-services/QnAMaker/FAQs
          maxLength: 300
        questions:
          $ref: '#/components/schemas/UpdateQuestionsDTO'
          description: List of questions associated with the answer.
        metadata:
          $ref: '#/components/schemas/UpdateMetadataDTO'
          description: List of metadata associated with the answer to be updated
        context:
          $ref: '#/components/schemas/UpdateContextDTO'
          description: Context associated with Qna to be updated.
    UpdateQuestionsDTO:
      type: object
      description: PATCH Body schema for Update Kb which contains list of questions
        to be added and deleted
      additionalProperties: false
      properties:
        add:
          type: array
          description: List of questions to be added
          maxLength: 100
          items:
            type: string
        delete:
          type: array
          description: List of questions to be deleted.
          maxLength: 100
          items:
            type: string
    UpdateMetadataDTO:
      type: object
      description: PATCH Body schema to represent list of Metadata to be updated
      additionalProperties: false
      properties:
        delete:
          type: array
          description: List of Metadata associated with answer to be deleted
          maxLength: 100
          items:
            $ref: '#/components/schemas/MetadataDTO'
        add:
          type: array
          description: List of metadata associated with answer to be added
          maxLength: 100
          items:
            $ref: '#/components/schemas/MetadataDTO'
    UpdateContextDTO:
      type: object
      description: Update Body schema to represent context to be updated
      properties:
        promptsToDelete:
          type: array
          description: List of prompts associated with qna to be deleted
          items:
            type: integer
            format: int32
        promptsToAdd:
          type: array
          description: List of prompts to be added to the qna.
          items:
            $ref: '#/components/schemas/PromptDTO'
        isContextOnly:
          type: boolean
          description: 'To mark if a prompt is relevant only with a previous question
            or not.

            true - Do not include this QnA as search result for queries without context

            false - ignores context and includes this QnA in search result'
    DeleteKbContentsDTO:
      type: object
      description: PATCH body schema of Delete Operation in UpdateKb
      additionalProperties: false
      properties:
        ids:
          type: array
          description: List of Qna Ids to be deleted
          items:
            type: integer
            format: int32
        sources:
          type: array
          description: List of sources to be deleted from knowledgebase.
          maxLength: 300
          minLength: 1
          items:
            type: string
    CreateKbInputDTO:
      type: object
      description: Input to create KB.
      additionalProperties: false
      properties:
        qnaList:
          type: array
          description: List of QNA to be added to the index. Ids are generated by
            the service and should be omitted.
          items:
            $ref: '#/components/schemas/QnADTO'
        urls:
          type: array
          description: List of URLs to be added to knowledgebase.
          maxLength: 10
          items:
            type: string
        files:
          type: array
          description: List of files to be added to knowledgebase.
          maxLength: 10
          items:
            $ref: '#/components/schemas/FileDTO'
    QnADocumentsDTO:
      type: object
      description: List of QnADTO
      additionalProperties: false
      properties:
        qnaDocuments:
          type: array
          description: List of answers.
          items:
            $ref: '#/components/schemas/QnADTO'
    CreateKbDTO:
      type: object
      description: Post body schema for CreateKb operation.
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          description: Friendly name for the knowledgebase.
          maxLength: 100
          minLength: 1
        qnaList:
          type: array
          description: List of Q-A (QnADTO) to be added to the knowledgebase. Q-A
            Ids are assigned by the service and should be omitted.
          maxLength: 1000
          items:
            $ref: '#/components/schemas/QnADTO'
        urls:
          type: array
          description: List of URLs to be used for extracting Q-A.
          maxLength: 10
          items:
            type: string
        files:
          type: array
          description: List of files from which to Extract Q-A.
          maxLength: 10
          items:
            $ref: '#/components/schemas/FileDTO'
        enableHierarchicalExtraction:
          type: boolean
          description: Enable hierarchical extraction of Q-A from files and urls.
            Value to be considered False if this field is not present.
        defaultAnswerUsedForExtraction:
          type: string
          description: Text string to be used as the answer in any Q-A which has no
            extracted answer from the document but has a hierarchy. Required when
            EnableHierarchicalExtraction field is set to True.
          maxLength: 300
          minLength: 1
        language:
          type: string
          description: Language of the knowledgebase. Please find the list of supported
            languages <a href="https://aka.ms/qnamaker-languages#languages-supported"
            target="_blank">here</a>.
          maxLength: 100
          minLength: 1
    FileDTO:
      type: object
      description: DTO to hold details of uploaded files.
      additionalProperties: false
      required:
      - fileName
      - fileUri
      properties:
        fileName:
          type: string
          description: File name. Supported file types are ".tsv", ".pdf", ".txt",
            ".docx", ".xlsx".
          maxLength: 200
          minLength: 1
        fileUri:
          type: string
          description: Public URI of the file.
    ReplaceKbDTO:
      type: object
      description: Post body schema for Replace KB operation.
      additionalProperties: false
      required:
      - qnAList
      properties:
        qnAList:
          type: array
          description: List of Q-A (QnADTO) to be added to the knowledgebase. Q-A
            Ids are assigned by the service and should be omitted.
          items:
            $ref: '#/components/schemas/QnADTO'
    QnADTO:
      type: object
      description: Q-A object.
      additionalProperties: false
      required:
      - answer
      - questions
      properties:
        id:
          type: integer
          description: Unique id for the Q-A.
          format: int32
        answer:
          type: string
          description: Answer text
          maxLength: 25000
          minLength: 1
        source:
          type: string
          description: Source from which Q-A was indexed. eg. https://docs.microsoft.com/en-us/azure/cognitive-services/QnAMaker/FAQs
          maxLength: 300
        questions:
          type: array
          description: List of questions associated with the answer.
          maxLength: 100
          minLength: 1
          items:
            type: string
        metadata:
          type: array
          description: List of metadata associated with the answer.
          maxLength: 10
          items:
            $ref: '#/components/schemas/MetadataDTO'
        context:
          $ref: '#/components/schemas/ContextDTO'
          description: Context of a QnA
    ContextDTO:
      type: object
      description: Context associated with Qna.
      properties:
        isContextOnly:
          type: boolean
          description: 'To mark if a prompt is relevant only with a previous question
            or not.

            true - Do not include this QnA as search result for queries without context

            false - ignores context and includes this QnA in search result'
        prompts:
          type: array
          description: List of prompts associated with the answer.
          maxItems: 20
          items:
            $ref: '#/components/schemas/PromptDTO'
    PromptDTO:
      type: object
      description: Prompt for an answer.
      properties:
        displayOrder:
          type: integer
          description: Index of the prompt - used in ordering of the prompts
          format: int32
        qnaId:
          type: integer
          description: Qna id corresponding to the prompt - if QnaId is present, QnADTO
            object is ignored.
          format: int32
        qna:
          $ref: '#/components/schemas/QnADTO'
          description: QnADTO - Either QnaId or QnADTO needs to be present in a PromptDTO
            object
        displayText:
          type: string
          description: Text displayed to represent a follow up question prompt
          maxLength: 200
    MetadataDTO:
      type: object
      description: Name - value pair of metadata.
      additionalProperties: false
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Metadata name.
          maxLength: 100
          minLength: 1
        value:
          type: string
          description: Metadata value.
          maxLength: 500
          minLength: 1
    ErrorResponse:
      type: object
      description: Error response. As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
          description: The error object.
    Error:
      type: object
      description: The error object. As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      additionalProperties: false
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this
            reported error.
          items:
            $ref: '#/components/schemas/Error'
        innerError:
          $ref: '#/components/schemas/InnerErrorModel'
    ErrorCode:
      type: string
      description: Human readable error code.
      x-ms-enum:
        name: ErrorCodeType
        modelAsString: true
      enum:
      - BadArgument
      - Forbidden
      - NotFound
      - KbNotFound
      - Unauthorized
      - Unspecified
      - EndpointKeysError
      - QuotaExceeded
      - QnaRuntimeError
      - SKULimitExceeded
      - OperationNotFound
      - ServiceError
      - ValidationFailure
      - ExtractionFailure
    InnerErrorModel:
      type: object
      description: An object containing more specific information about the error.
        As per Microsoft One API guidelines - https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses.
      additionalProperties: false
      properties:
        code:
          type: string
          description: A more specific error code than was provided by the containing
            error.
        innerError:
          $ref: '#/components/schemas/InnerErrorModel'
    Operation:
      type: object
      description: Record to track long running operation.
      additionalProperties: false
      properties:
        operationState:
          $ref: '#/components/schemas/OperationState'
        createdTimestamp:
          type: string
          description: Timestamp when the operation was created.
        lastActionTimestamp:
          type: string
          description: Timestamp when the current state was entered.
        resourceLocation:
          type: string
          description: Relative URI to the target resource location for completed
            resources.
        userId:
          type: string
          description: User Id
        operationId:
          type: string
          description: Operation Id.
        errorResponse:
          $ref: '#/components/schemas/ErrorResponse'
    OperationState:
      type: string
      description: Enumeration of operation states.
      x-ms-enum:
        name: OperationStateType
        modelAsString: true
      enum:
      - Failed
      - NotStarted
      - Running
      - Succeeded
    KnowledgebasesDTO:
      type: object
      description: Collection of knowledgebases owned by a user.
      additionalProperties: false
      properties:
        knowledgebases:
          type: array
          description: Collection of knowledgebase records.
          items:
            $ref: '#/components/schemas/KnowledgebaseDTO'
    KnowledgebaseDTO:
      type: object
      description: Response schema for CreateKb operation.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Unique id that identifies a knowledgebase.
        hostName:
          type: string
          description: URL host name at which the knowledgebase is hosted.
        lastAccessedTimestamp:
          type: string
          description: Time stamp at which the knowledgebase was last accessed (UTC).
        lastChangedTimestamp:
          type: string
          description: Time stamp at which the knowledgebase was last modified (UTC).
        lastPublishedTimestamp:
          type: string
          description: Time stamp at which the knowledgebase was last published (UTC).
        name:
          type: string
          description: Friendly name of the knowledgebase.
        userId:
          type: string
