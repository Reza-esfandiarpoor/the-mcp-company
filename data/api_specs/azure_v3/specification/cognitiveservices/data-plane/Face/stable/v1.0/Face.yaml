servers:
- url: '{Endpoint}/face/v1.0'
  variables:
    Endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
components:
  parameters:
    returnFaceAttributes:
      name: returnFaceAttributes
      in: query
      description: Analyze and return the one or more specified face attributes in
        the comma-separated string like "returnFaceAttributes=age,gender". The available
        attributes depends on the 'detectionModel' specified. 'detection_01' supports
        age, gender, headPose, smile, facialHair, glasses, emotion, hair, makeup,
        occlusion, accessories, blur, exposure, noise, and qualityForRecognition.
        While 'detection_02' does not support any attributes and 'detection_03' only
        supports mask and qualityForRecognition. Additionally, qualityForRecognition
        is only supported when the 'recognitionModel' is specified as 'recognition_03'
        or 'recognition_04'. Note that each face attribute analysis has additional
        computational and time cost.
      x-ms-parameter-location: method
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          x-ms-enum:
            name: FaceAttributeType
            modelAsString: false
          enum:
          - age
          - gender
          - headPose
          - smile
          - facialHair
          - glasses
          - emotion
          - hair
          - makeup
          - occlusion
          - accessories
          - blur
          - exposure
          - noise
          - mask
          - qualityForRecognition
          nullable: false
    targetFace:
      name: targetFace
      in: query
      description: A face rectangle to specify the target face to be added to a person
        in the format of "targetFace=left,top,width,height". E.g. "targetFace=10,10,100,100".
        If there is more than one face in the image, targetFace is required to specify
        which face to add. No targetFace means there is only one face detected in
        the entire image.
      x-ms-parameter-location: method
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int32
          maxItems: 4
          minItems: 4
          nullable: false
    faceUserData:
      name: userData
      in: query
      description: User-specified data about the face for any purpose. The maximum
        length is 1KB.
      x-ms-parameter-location: method
      required: false
      style: form
      explode: false
      schema:
        type: string
        maxLength: 1024
    faceListId:
      name: faceListId
      in: path
      description: Id referencing a particular face list.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9-_]+$
    personGroupId:
      name: personGroupId
      in: path
      description: Id referencing a particular person group.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9-_]+$
    largeFaceListId:
      name: largeFaceListId
      in: path
      description: Id referencing a particular large face list.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9-_]+$
    largePersonGroupId:
      name: largePersonGroupId
      in: path
      description: Id referencing a particular large person group.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        maxLength: 64
        pattern: ^[a-z0-9-_]+$
    personId:
      name: personId
      in: path
      description: Id referencing a particular person.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        format: uuid
    persistedFaceId:
      name: persistedFaceId
      in: path
      description: Id referencing a particular persistedFaceId of an existing face.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        format: uuid
    applyScope:
      name: applyScope
      description: User specified snapshot apply scopes as a search filter. ApplyScope
        is an array of the target Azure subscription ids for the snapshot, specified
        by the user who created the snapshot by Snapshot - Take.
      in: query
      required: false
      x-ms-parameter-location: method
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          nullable: false
    operationId:
      name: operationId
      in: path
      description: Id referencing a particular take/apply snapshot operation.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        format: uuid
    snapshotId:
      name: snapshotId
      in: path
      description: Id referencing a particular snapshot.
      required: true
      x-ms-parameter-location: method
      style: simple
      schema:
        type: string
        format: uuid
    Endpoint:
      name: Endpoint
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-parameter-location: client
      required: true
      in: path
      x-ms-skip-url-encoding: true
      schema:
        type: string
    recognitionModel:
      name: recognitionModel
      description: Name of recognition model. Recognition model is used when the face
        features are extracted and associated with detected faceIds, (Large)FaceList
        or (Large)PersonGroup. A recognition model name can be provided when performing
        Face - Detect or (Large)FaceList - Create or (Large)PersonGroup - Create.
        The default value is 'recognition_01', if latest model needed, please explicitly
        specify the model you need.
      required: false
      in: query
      x-ms-parameter-location: method
      x-nullable: false
      x-ms-enum:
        name: RecognitionModel
        modelAsString: true
      schema:
        type: string
        enum:
        - recognition_01
        - recognition_02
        - recognition_03
        - recognition_04
        default: recognition_01
    returnRecognitionModel:
      name: returnRecognitionModel
      description: A value indicating whether the operation should return 'recognitionModel'
        in response.
      required: false
      in: query
      x-ms-parameter-location: method
      schema:
        type: boolean
        default: false
    detectionModel:
      name: detectionModel
      description: Name of detection model. Detection model is used to detect faces
        in the submitted image. A detection model name can be provided when performing
        Face - Detect or (Large)FaceList - Add Face or (Large)PersonGroup - Add Face.
        The default value is 'detection_01', if another model is needed, please explicitly
        specify it.
      required: false
      in: query
      x-ms-parameter-location: method
      x-nullable: false
      x-ms-enum:
        name: DetectionModel
        modelAsString: true
      schema:
        type: string
        enum:
        - detection_01
        - detection_02
        - detection_03
        default: detection_01
    returnFaceId:
      name: returnFaceId
      in: query
      x-ms-parameter-location: method
      description: A value indicating whether the operation should return faceIds
        of detected faces. Detecting with this value set to true requires additional
        access approvals at https://aka.ms/facerecognition.
      schema:
        type: boolean
    returnFaceLandmarks:
      name: returnFaceLandmarks
      in: query
      x-ms-parameter-location: method
      description: A value indicating whether the operation should return landmarks
        of the detected faces.
      schema:
        type: boolean
        default: false
    faceIdTimeToLive:
      name: faceIdTimeToLive
      in: query
      x-ms-parameter-location: method
      description: The number of seconds for the faceId being cached. Supported range
        from 60 seconds up to 86400 seconds. The default value is 86400 (24 hours).
      schema:
        type: integer
        minimum: 60
        maximum: 86400
        default: 86400
  requestBodies:
    NameAndUserDataContract:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NameAndUserDataContract'
      description: Request body for person update operation.
      required: true
      x-ms-client-flatten: true
    NameAndUserDataContract2:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NameAndUserDataContract'
      description: Request body for creating new person.
      required: true
      x-ms-client-flatten: true
    UpdateFaceRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateFaceRequest'
      description: Request body for updating persisted face.
      required: true
      x-ms-client-flatten: true
    ImageUrl:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageUrl'
      description: A JSON document with a URL pointing to the image that is to be
        analyzed.
      required: true
      x-ms-parameter-location: method
      x-ms-client-flatten: true
  securitySchemes:
    apim_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
  schemas:
    APIError:
      type: object
      description: Error information returned by the API
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      description: Error body.
      properties:
        code:
          type: string
        message:
          type: string
    DetectedFaces:
      type: array
      items:
        $ref: '#/components/schemas/DetectedFace'
    DetectedFace:
      type: object
      required:
      - faceRectangle
      description: Detected Face object.
      properties:
        faceId:
          type: string
          format: uuid
        recognitionModel:
          $ref: '#/components/schemas/RecognitionModel'
        faceRectangle:
          $ref: '#/components/schemas/FaceRectangle'
        faceLandmarks:
          $ref: '#/components/schemas/FaceLandmarks'
        faceAttributes:
          $ref: '#/components/schemas/FaceAttributes'
    FaceRectangle:
      type: object
      required:
      - width
      - height
      - left
      - top
      description: A rectangle within which a face can be found
      properties:
        width:
          type: integer
          format: int32
          description: The width of the rectangle, in pixels.
        height:
          type: integer
          format: int32
          description: The height of the rectangle, in pixels.
        left:
          type: integer
          format: int32
          description: The distance from the left edge if the image to the left edge
            of the rectangle, in pixels.
        top:
          type: integer
          format: int32
          description: The distance from the top edge if the image to the top edge
            of the rectangle, in pixels.
    Coordinate:
      type: object
      required:
      - x
      - y
      description: Coordinates within an image
      properties:
        x:
          type: number
          description: The horizontal component, in pixels.
        y:
          type: number
          description: The vertical component, in pixels.
    FaceLandmarks:
      type: object
      description: A collection of 27-point face landmarks pointing to the important
        positions of face components.
      properties:
        pupilLeft:
          $ref: '#/components/schemas/Coordinate'
        pupilRight:
          $ref: '#/components/schemas/Coordinate'
        noseTip:
          $ref: '#/components/schemas/Coordinate'
        mouthLeft:
          $ref: '#/components/schemas/Coordinate'
        mouthRight:
          $ref: '#/components/schemas/Coordinate'
        eyebrowLeftOuter:
          $ref: '#/components/schemas/Coordinate'
        eyebrowLeftInner:
          $ref: '#/components/schemas/Coordinate'
        eyeLeftOuter:
          $ref: '#/components/schemas/Coordinate'
        eyeLeftTop:
          $ref: '#/components/schemas/Coordinate'
        eyeLeftBottom:
          $ref: '#/components/schemas/Coordinate'
        eyeLeftInner:
          $ref: '#/components/schemas/Coordinate'
        eyebrowRightInner:
          $ref: '#/components/schemas/Coordinate'
        eyebrowRightOuter:
          $ref: '#/components/schemas/Coordinate'
        eyeRightInner:
          $ref: '#/components/schemas/Coordinate'
        eyeRightTop:
          $ref: '#/components/schemas/Coordinate'
        eyeRightBottom:
          $ref: '#/components/schemas/Coordinate'
        eyeRightOuter:
          $ref: '#/components/schemas/Coordinate'
        noseRootLeft:
          $ref: '#/components/schemas/Coordinate'
        noseRootRight:
          $ref: '#/components/schemas/Coordinate'
        noseLeftAlarTop:
          $ref: '#/components/schemas/Coordinate'
        noseRightAlarTop:
          $ref: '#/components/schemas/Coordinate'
        noseLeftAlarOutTip:
          $ref: '#/components/schemas/Coordinate'
        noseRightAlarOutTip:
          $ref: '#/components/schemas/Coordinate'
        upperLipTop:
          $ref: '#/components/schemas/Coordinate'
        upperLipBottom:
          $ref: '#/components/schemas/Coordinate'
        underLipTop:
          $ref: '#/components/schemas/Coordinate'
        underLipBottom:
          $ref: '#/components/schemas/Coordinate'
    FaceAttributes:
      type: object
      description: Face Attributes
      properties:
        age:
          type: number
          description: Age in years
        gender:
          type: string
          description: Possible gender of the face.
          x-ms-enum:
            name: Gender
            modelAsString: false
          enum:
          - male
          - female
        smile:
          $ref: '#/components/schemas/Level'
        facialHair:
          $ref: '#/components/schemas/FacialHair'
        glasses:
          type: string
          description: Glasses type if any of the face.
          x-ms-enum:
            name: GlassesType
            modelAsString: false
          enum:
          - noGlasses
          - readingGlasses
          - sunglasses
          - swimmingGoggles
        headPose:
          $ref: '#/components/schemas/HeadPose'
        emotion:
          $ref: '#/components/schemas/Emotion'
        hair:
          $ref: '#/components/schemas/Hair'
        makeup:
          $ref: '#/components/schemas/Makeup'
        occlusion:
          $ref: '#/components/schemas/Occlusion'
        accessories:
          $ref: '#/components/schemas/Accessories'
        blur:
          $ref: '#/components/schemas/Blur'
        exposure:
          $ref: '#/components/schemas/Exposure'
        noise:
          $ref: '#/components/schemas/Noise'
        mask:
          $ref: '#/components/schemas/Mask'
        qualityForRecognition:
          type: string
          description: Properties describing the overall image quality regarding whether
            the image being used in the detection is of sufficient quality to attempt
            face recognition on.
          x-ms-enum:
            name: QualityForRecognition
            modelAsString: false
          enum:
          - Low
          - Medium
          - High
    FacialHair:
      type: object
      description: Properties describing facial hair attributes.
      properties:
        moustache:
          $ref: '#/components/schemas/Confidence'
        beard:
          $ref: '#/components/schemas/Confidence'
        sideburns:
          $ref: '#/components/schemas/Confidence'
    HeadPose:
      type: object
      description: Properties indicating head pose of the face.
      properties:
        roll:
          type: number
          nullable: false
        yaw:
          type: number
          nullable: false
        pitch:
          type: number
          nullable: false
    Emotion:
      type: object
      description: Properties describing facial emotion in form of confidence ranging
        from 0 to 1.
      properties:
        anger:
          $ref: '#/components/schemas/Confidence'
        contempt:
          $ref: '#/components/schemas/Confidence'
        disgust:
          $ref: '#/components/schemas/Confidence'
        fear:
          $ref: '#/components/schemas/Confidence'
        happiness:
          $ref: '#/components/schemas/Confidence'
        neutral:
          $ref: '#/components/schemas/Confidence'
        sadness:
          $ref: '#/components/schemas/Confidence'
        surprise:
          $ref: '#/components/schemas/Confidence'
    Hair:
      type: object
