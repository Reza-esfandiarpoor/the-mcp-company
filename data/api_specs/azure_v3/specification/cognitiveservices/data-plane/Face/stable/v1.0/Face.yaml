  /snapshots:
    post:
      description: 'Submit an operation to take a snapshot of face list, large face
        list, person group or large person group, with user-specified snapshot type,
        source object id, apply scope and an optional user data.<br />

        The snapshot interfaces are for users to backup and restore their face data
        from one face subscription to another, inside same region or across regions.
        The workflow contains two phases, user first calls Snapshot - Take to create
        a copy of the source object and store it as a snapshot, then calls Snapshot
        - Apply to paste the snapshot to target subscription. The snapshots are stored
        in a centralized location (per Azure instance), so that they can be applied
        cross accounts and regions.<br />

        Taking snapshot is an asynchronous operation. An operation id can be obtained
        from the "Operation-Location" field in response header, to be used in OperationStatus
        - Get for tracking the progress of creating the snapshot. The snapshot id
        will be included in the "resourceLocation" field in OperationStatus - Get
        response when the operation status is "succeeded".<br />

        Snapshot taking time depends on the number of person and face entries in the
        source object. It could be in seconds, or up to several hours for 1,000,000
        persons with multiple faces.<br />

        Snapshots will be automatically expired and cleaned in 48 hours after it is
        created by Snapshot - Take. User can delete the snapshot using Snapshot -
        Delete by themselves any time before expiration.<br />

        Taking snapshot for a certain object will not block any other operations against
        the object. All read-only operations (Get/List and Identify/FindSimilar/Verify)
        can be conducted as usual. For all writable operations, including Add/Update/Delete
        the source object or its persons/faces and Train, they are not blocked but
        not recommended because writable updates may not be reflected on the snapshot
        during its taking. After snapshot taking is completed, all readable and writable
        operations can work as normal. Snapshot will also include the training results
        of the source object, which means target subscription the snapshot applied
        to does not need re-train the target object before calling Identify/FindSimilar.<br
        />

        * Free-tier subscription quota: 100 take operations per month.

        * S0-tier subscription quota: 100 take operations per day.'
      operationId: Snapshot_Take
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeSnapshotRequest'
        description: Request body for taking a snapshot.
        required: true
        x-ms-client-flatten: true
      responses:
        '202':
          description: The snapshot taking task was queued successfully.
          headers:
            Operation-Location:
              description: Operation location with an operation id used to track the
                progress of taking snapshot. The returned id is the operation id,
                rather than snapshot id. Snapshot id can be obtained only when the
                operation status becomes "succeeded" in OperationStatus - Get.
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: List all accessible snapshots with related information, including
        snapshots that were taken by the user, or snapshots to be applied to the user
        (subscription id was included in the applyScope in Snapshot - Take).
      operationId: Snapshot_List
      parameters:
      - name: type
        description: User specified object type as a search filter.
        in: query
        required: false
        x-ms-enum:
          name: SnapshotObjectType
          modelAsString: false
        schema:
          type: string
          enum:
          - FaceList
          - LargeFaceList
          - LargePersonGroup
          - PersonGroup
      - $ref: '#/components/parameters/applyScope'
      responses:
        '200':
          description: A successful call returns an array of snapshots with snapshot
            information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshots'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /snapshots/{snapshotId}:
    get:
      description: Retrieve information about a snapshot. Snapshot is only accessible
        to the source subscription who took it, and target subscriptions included
        in the applyScope in Snapshot - Take.
      operationId: Snapshot_Get
      parameters:
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: A successful call returns the snapshot's information.
