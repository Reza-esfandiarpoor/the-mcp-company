      operationId: Snapshot_Update
      parameters:
      - $ref: '#/components/parameters/snapshotId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSnapshotRequest'
        description: Request body for updating a snapshot.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      description: Delete an existing snapshot according to the snapshotId. All object
        data and information in the snapshot will also be deleted. Only the source
        subscription who took the snapshot can delete the snapshot. If the user does
        not delete a snapshot with this API, the snapshot will still be automatically
        deleted in 48 hours after creation.
      operationId: Snapshot_Delete
      parameters:
      - $ref: '#/components/parameters/snapshotId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /snapshots/{snapshotId}/apply:
    post:
      description: 'Submit an operation to apply a snapshot to current subscription.
        For each snapshot, only subscriptions included in the applyScope of Snapshot
        - Take can apply it.<br />

        The snapshot interfaces are for users to backup and restore their face data
        from one face subscription to another, inside same region or across regions.
        The workflow contains two phases, user first calls Snapshot - Take to create
        a copy of the source object and store it as a snapshot, then calls Snapshot
        - Apply to paste the snapshot to target subscription. The snapshots are stored
        in a centralized location (per Azure instance), so that they can be applied
        cross accounts and regions.<br />

        Applying snapshot is an asynchronous operation. An operation id can be obtained
        from the "Operation-Location" field in response header, to be used in OperationStatus
        - Get for tracking the progress of applying the snapshot. The target object
        id will be included in the "resourceLocation" field in OperationStatus - Get
        response when the operation status is "succeeded".<br />

        Snapshot applying time depends on the number of person and face entries in
        the snapshot object. It could be in seconds, or up to 1 hour for 1,000,000
        persons with multiple faces.<br />

        Snapshots will be automatically expired and cleaned in 48 hours after it is
        created by Snapshot - Take. So the target subscription is required to apply
        the snapshot in 48 hours since its creation.<br />

        Applying a snapshot will not block any other operations against the target
        object, however it is not recommended because the correctness cannot be guaranteed
        during snapshot applying. After snapshot applying is completed, all operations
        towards the target object can work as normal. Snapshot also includes the training
        results of the source object, which means target subscription the snapshot
        applied to does not need re-train the target object before calling Identify/FindSimilar.<br
        />

        One snapshot can be applied multiple times in parallel, while currently only
        CreateNew apply mode is supported, which means the apply operation will fail
        if target subscription already contains an object of same type and using the
        same objectId. Users can specify the "objectId" in request body to avoid such
        conflicts.<br />

        * Free-tier subscription quota: 100 apply operations per month.

        * S0-tier subscription quota: 100 apply operations per day.'
      operationId: Snapshot_Apply
      parameters:
      - $ref: '#/components/parameters/snapshotId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplySnapshotRequest'
        description: Request body for applying a snapshot.
        required: true
        x-ms-client-flatten: true
      responses:
        '202':
          description: The snapshot applying task was queued successfully.
          headers:
            Operation-Location:
              description: Operation location with an operation id used to track the
                progress of applying the snapshot by OperationStatus - Get.
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /operations/{operationId}:
    get:
      description: Retrieve the status of a take/apply snapshot operation.
      operationId: Snapshot_GetOperationStatus
      parameters:
      - $ref: '#/components/parameters/operationId'
      responses:
        '200':
          description: A successful call returns the snapshot operation's status.
