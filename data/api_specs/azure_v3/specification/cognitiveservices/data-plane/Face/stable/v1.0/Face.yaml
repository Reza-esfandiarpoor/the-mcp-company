openapi: 3.0.0
info:
  version: '1.0'
  title: Face Client
  description: An API for face detection, verification, and identification.
security:
- apim_key: []
paths:
  /findsimilars:
    post:
      description: 'Given query face''s faceId, to search the similar-looking faces
        from a faceId array, a face list or a large face list. faceId array contains
        the faces created by [Face - Detect With Url](https://docs.microsoft.com/rest/api/faceapi/face/detectwithurl)
        or [Face - Detect With Stream](https://docs.microsoft.com/rest/api/faceapi/face/detectwithstream),
        which will expire at the time specified by faceIdTimeToLive after creation.
        A "faceListId" is created by [FaceList - Create](https://docs.microsoft.com/rest/api/faceapi/facelist/create)
        containing persistedFaceIds that will not expire. And a "largeFaceListId"
        is created by [LargeFaceList - Create](https://docs.microsoft.com/rest/api/faceapi/largefacelist/create)
        containing persistedFaceIds that will also not expire. Depending on the input
        the returned similar faces list contains faceIds or persistedFaceIds ranked
        by similarity.

        <br/>Find similar has two working modes, "matchPerson" and "matchFace". "matchPerson"
        is the default mode that it tries to find faces of the same person as possible
        by using internal same-person thresholds. It is useful to find a known person''s
        other photos. Note that an empty list will be returned if no faces pass the
        internal thresholds. "matchFace" mode ignores same-person thresholds and returns
        ranked similar faces anyway, even the similarity is low. It can be used in
        the cases like searching celebrity-looking faces.

        <br/>The ''recognitionModel'' associated with the query face''s faceId should
        be the same as the ''recognitionModel'' used by the target faceId array, face
        list or large face list.

        '
      operationId: Face_FindSimilar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindSimilarRequest'
        description: Request body for Find Similar.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an array of the most similar faces
            represented in faceId if the input parameter is faceIds or persistedFaceId
            if the input parameter is faceListId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarFaces'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /group:
    post:
      description: 'Divide candidate faces into groups based on face similarity.<br
        />

        * The output is one or more disjointed face groups and a messyGroup. A face
        group contains faces that have similar looking, often of the same person.
        Face groups are ranked by group size, i.e. number of faces. Notice that faces
        belonging to a same person might be split into several groups in the result.

        * MessyGroup is a special face group containing faces that cannot find any
        similar counterpart face from original faces. The messyGroup will not appear
        in the result if all faces found their counterparts.

        * Group API needs at least 2 candidate faces and 1000 at most. We suggest
        to try [Face - Verify](https://docs.microsoft.com/rest/api/faceapi/face/verifyfacetoface)
        when you only have 2 candidate faces.

        * The ''recognitionModel'' associated with the query faces'' faceIds should
        be the same.

        '
      operationId: Face_Group
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
        description: Request body for grouping.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns one or more groups of similar faces
            (rank by group size) and a messyGroup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /identify:
    post:
      description: "1-to-many identification to find the closest matches of the specific
        query person face from a person group or large person group.\n<br/> For each
        face in the faceIds array, Face Identify will compute similarities between
        the query face and all the faces in the person group (given by personGroupId)
        or large person group (given by largePersonGroupId), and return candidate
        person(s) for that face ranked by similarity confidence. The person group/large
        person group should be trained to make it ready for identification. See more
        in [PersonGroup - Train](https://docs.microsoft.com/rest/api/faceapi/persongroup/train)
        and [LargePersonGroup - Train](https://docs.microsoft.com/rest/api/faceapi/largepersongroup/train).\n<br/>\n
        \nRemarks:<br />\n* The algorithm allows more than one face to be identified
        independently at the same request, but no more than 10 faces.\n* Each person
        in the person group/large person group could have more than one face, but
        no more than 248 faces.\n* Higher face image quality means better identification
        precision. Please consider high-quality faces: frontal, clear, and face size
        is 200x200 pixels (100 pixels between eyes) or bigger.\n* Number of candidates
        returned is restricted by maxNumOfCandidatesReturned and confidenceThreshold.
        If no person is identified, the returned candidates will be an empty array.\n*
        Try [Face - Find Similar](https://docs.microsoft.com/rest/api/faceapi/face/findsimilar)
        when you need to find similar faces from a face list/large face list instead
        of a person group/large person group.\n* The 'recognitionModel' associated
        with the query faces' faceIds should be the same as the 'recognitionModel'
        used by the target person group or large person group.\n"
      operationId: Face_Identify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyRequest'
        description: Request body for identify operation.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns the identified candidate person(s)
            for each query face.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifyResults'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /verify:
    post:
      description: 'Verify whether two faces belong to a same person or whether one
        face belongs to a person.

        <br/>

        Remarks:<br />

        * Higher face image quality means better identification precision. Please
        consider high-quality faces: frontal, clear, and face size is 200x200 pixels
        (100 pixels between eyes) or bigger.

        * For the scenarios that are sensitive to accuracy please make your own judgment.

        * The ''recognitionModel'' associated with the query faces'' faceIds should
        be the same as the ''recognitionModel'' used by the target face, person group
        or large person group.

        '
      operationId: Face_VerifyFaceToFace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyFaceToFaceRequest'
        description: Request body for face to face verification.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns the verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}/persons:
    post:
      description: Create a new person in a specified person group.
      operationId: PersonGroupPerson_Create
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      requestBody:
        $ref: '#/components/requestBodies/NameAndUserDataContract2'
      responses:
        '200':
          description: A successful call returns a new personId created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: List all persons in a person group, and retrieve person information
        (including personId, name, userData and persistedFaceIds of registered faces
        of the person).
      operationId: PersonGroupPerson_List
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - name: start
        description: Starting person id to return (used to list a range of persons).
        in: query
        required: false
        schema:
          type: string
      - name: top
        description: Number of persons to return starting with the person id indicated
          by the 'start' parameter.
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: A successful call returns an array of person information that
            belong to the person group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Persons'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}/persons/{personId}:
    delete:
      description: Delete an existing person from a person group. The persistedFaceId,
        userData, person name and face feature in the person entry will all be deleted.
      operationId: PersonGroupPerson_Delete
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: Retrieve a person's information, including registered persisted
        faces, name and userData.
      operationId: PersonGroupPerson_Get
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      responses:
        '200':
          description: A successful call returns the person's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      description: Update name or userData of a person.
      operationId: PersonGroupPerson_Update
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      requestBody:
        $ref: '#/components/requestBodies/NameAndUserDataContract'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}/persons/{personId}/persistedfaces/{persistedFaceId}:
    delete:
      description: 'Delete a face from a person in a person group by specified personGroupId,
        personId and persistedFaceId.

        <br /> Adding/deleting faces to/from a same person will be processed sequentially.
        Adding/deleting faces to/from different persons are processed in parallel.'
      operationId: PersonGroupPerson_DeleteFace
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      - $ref: '#/components/parameters/persistedFaceId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: Retrieve information about a persisted face (specified by persistedFaceId,
        personId and its belonging personGroupId).
      operationId: PersonGroupPerson_GetFace
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      - $ref: '#/components/parameters/persistedFaceId'
      responses:
        '200':
          description: A successful call returns target persisted face's information
            (persistedFaceId and userData).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersistedFace'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      description: "Add a face to a person into a person group for face identification
        or verification. To deal with an image contains multiple faces, input face
        can be specified as an image with a targetFace rectangle. It returns a persistedFaceId
        representing the added face. No image will be stored. Only the extracted face
        feature will be stored on server until [PersonGroup PersonFace - Delete](https://docs.microsoft.com/rest/api/faceapi/persongroupperson/deleteface),
        [PersonGroup Person - Delete](https://docs.microsoft.com/rest/api/faceapi/persongroupperson/delete)
        or [PersonGroup - Delete](https://docs.microsoft.com/rest/api/faceapi/persongroup/delete)
        is called.\n<br /> Note persistedFaceId is different from faceId generated
        by [Face - Detect](https://docs.microsoft.com/rest/api/faceapi/face/detectwithurl).\n*
        Higher face image quality means better recognition precision. Please consider
        high-quality faces: frontal, clear, and face size is 200x200 pixels (100 pixels
        between eyes) or bigger.\n* Each person entry can hold up to 248 faces.\n*
        JPEG, PNG, GIF (the first frame), and BMP format are supported. The allowed
        image file size is from 1KB to 6MB.\n* \"targetFace\" rectangle should contain
        one face. Zero or multiple faces will be regarded as an error. If the provided
        \"targetFace\" rectangle is not returned from [Face - Detect](https://docs.microsoft.com/rest/api/faceapi/face/detectwithurl),
        there\u2019s no guarantee to detect and add the face successfully.\n* Out
        of detectable face size (36x36 - 4096x4096 pixels), large head-pose, or large
        occlusions will cause failures.\n* Adding/deleting faces to/from a same person
        will be processed sequentially. Adding/deleting faces to/from different persons
        are processed in parallel."
      operationId: PersonGroupPerson_UpdateFace
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/personId'
      - $ref: '#/components/parameters/persistedFaceId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateFaceRequest'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}:
    put:
      description: 'Create a new person group with specified personGroupId, name,
        user-provided userData and recognitionModel.

        <br /> A person group is the container of the uploaded person data, including
        face recognition features.

        <br /> After creation, use [PersonGroup Person - Create](https://docs.microsoft.com/rest/api/faceapi/persongroupperson/create)
        to add persons into the group, and then call [PersonGroup - Train](https://docs.microsoft.com/rest/api/faceapi/persongroup/train)
        to get this group ready for [Face - Identify](https://docs.microsoft.com/rest/api/faceapi/face/identify).

        <br /> No image will be stored. Only the person''s extracted face features
        and userData will be stored on server until [PersonGroup Person - Delete](https://docs.microsoft.com/rest/api/faceapi/persongroupperson/delete)
        or [PersonGroup - Delete](https://docs.microsoft.com/rest/api/faceapi/persongroup/delete)
        is called.

        <br/>''recognitionModel'' should be specified to associate with this person
        group. The default value for ''recognitionModel'' is ''recognition_01'', if
        the latest model needed, please explicitly specify the model you need in this
        parameter. New faces that are added to an existing person group will use the
        recognition model that''s already associated with the collection. Existing
        face features in a person group can''t be updated to features extracted by
        another version of recognition model.


        Person group quota:

        * Free-tier subscription quota: 1,000 person groups. Each holds up to 1,000
        persons.

        * S0-tier subscription quota: 1,000,000 person groups. Each holds up to 10,000
        persons.

        * to handle larger scale face identification problem, please consider using
        [LargePersonGroup](https://docs.microsoft.com/rest/api/faceapi/largepersongroup).'
      operationId: PersonGroup_Create
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaDataContract'
        description: Request body for creating new person group.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      description: Delete an existing person group. Persisted face features of all
        people in the person group will also be deleted.
      operationId: PersonGroup_Delete
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: Retrieve person group name, userData and recognitionModel. To get
        person information under this personGroup, use [PersonGroup Person - List](https://docs.microsoft.com/rest/api/faceapi/persongroupperson/list).
      operationId: PersonGroup_Get
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      - $ref: '#/components/parameters/returnRecognitionModel'
      responses:
        '200':
          description: A successful call returns the person group's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonGroup'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      description: Update an existing person group's display name and userData. The
        properties which does not appear in request body will not be updated.
      operationId: PersonGroup_Update
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameAndUserDataContract'
        description: Request body for updating person group.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}/training:
    get:
      description: Retrieve the training status of a person group (completed or ongoing).
      operationId: PersonGroup_GetTrainingStatus
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      responses:
        '200':
          description: A successful call returns the person group's training status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingStatus'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups:
    get:
      description: "List person groups\u2019 personGroupId, name, userData and recognitionModel.<br
        />\n* Person groups are stored in alphabetical order of personGroupId.\n*
        \"start\" parameter (string, optional) is a user-provided personGroupId value
        that returned entries have larger ids by string comparison. \"start\" set
        to empty to indicate return from the first item.\n* \"top\" parameter (int,
        optional) specifies the number of entries to return. A maximal of 1000 entries
        can be returned in one call. To fetch more, you can specify \"start\" with
        the last returned entry\u2019s Id of the current call.\n<br />\nFor example,
        total 5 person groups: \"group1\", ..., \"group5\".\n<br /> \"start=&top=\"
        will return all 5 groups.\n<br /> \"start=&top=2\" will return \"group1\",
        \"group2\".\n<br /> \"start=group2&top=3\" will return \"group3\", \"group4\",
        \"group5\".\n"
      operationId: PersonGroup_List
      parameters:
      - name: start
        in: query
        required: false
        description: List person groups from the least personGroupId greater than
          the "start".
        schema:
          type: string
          maxLength: 64
      - name: top
        in: query
        required: false
        description: The number of person groups to list.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1000
      - $ref: '#/components/parameters/returnRecognitionModel'
      responses:
        '200':
          description: A successful call returns an array of person groups and their
            information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonGroups'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /persongroups/{personGroupId}/train:
    post:
      description: Queue a person group training task, the training task may not be
        started immediately.
      operationId: PersonGroup_Train
      parameters:
      - $ref: '#/components/parameters/personGroupId'
      responses:
        '202':
          description: The training task was queued successfully.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /facelists/{faceListId}:
    put:
      description: 'Create an empty face list with user-specified faceListId, name,
        an optional userData and recognitionModel. Up to 64 face lists are allowed
        in one subscription.

        <br /> Face list is a list of faces, up to 1,000 faces, and used by [Face
        - Find Similar](https://docs.microsoft.com/rest/api/faceapi/face/findsimilar).

        <br /> After creation, user should use [FaceList - Add Face](https://docs.microsoft.com/rest/api/faceapi/facelist/addfacefromurl)
        to import the faces. No image will be stored. Only the extracted face features
        are stored on server until [FaceList - Delete](https://docs.microsoft.com/rest/api/faceapi/facelist/delete)
        is called.

        <br /> Find Similar is used for scenario like finding celebrity-like faces,
        similar face filtering, or as a light way face identification. But if the
        actual use is to identify person, please use [PersonGroup](https://docs.microsoft.com/rest/api/faceapi/persongroup)
        / [LargePersonGroup](https://docs.microsoft.com/rest/api/faceapi/largepersongroup)
        and [Face - Identify](https://docs.microsoft.com/rest/api/faceapi/face/identify).

        <br /> Please consider [LargeFaceList](https://docs.microsoft.com/rest/api/faceapi/largefacelist)
        when the face number is large. It can support up to 1,000,000 faces.

        <br />''recognitionModel'' should be specified to associate with this face
        list. The default value for ''recognitionModel'' is ''recognition_01'', if
        the latest model needed, please explicitly specify the model you need in this
        parameter. New faces that are added to an existing face list will use the
        recognition model that''s already associated with the collection. Existing
        face features in a face list can''t be updated to features extracted by another
        version of recognition model.

        Please Refer to [Specify a face recognition model](https://docs.microsoft.com/azure/cognitive-services/face/face-api-how-to-topics/specify-recognition-model).'
      operationId: FaceList_Create
      parameters:
      - $ref: '#/components/parameters/faceListId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaDataContract'
        description: Request body for creating a face list.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    get:
      description: "Retrieve a face list\u2019s faceListId, name, userData, recognitionModel
        and faces in the face list.\n"
      operationId: FaceList_Get
      parameters:
      - $ref: '#/components/parameters/faceListId'
      - $ref: '#/components/parameters/returnRecognitionModel'
      responses:
        '200':
          description: A successful call returns the face list's information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceList'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    patch:
      description: Update information of a face list.
      operationId: FaceList_Update
      parameters:
      - $ref: '#/components/parameters/faceListId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameAndUserDataContract'
        description: Request body for updating a face list.
        required: true
        x-ms-client-flatten: true
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
    delete:
      description: Delete a specified face list.
      operationId: FaceList_Delete
      parameters:
      - $ref: '#/components/parameters/faceListId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /facelists:
    get:
      description: "List face lists\u2019 faceListId, name, userData and recognitionModel.
        <br /> \nTo get face information inside faceList use [FaceList - Get](https://docs.microsoft.com/rest/api/faceapi/facelist/get)\n"
      operationId: FaceList_List
      parameters:
      - $ref: '#/components/parameters/returnRecognitionModel'
      responses:
        '200':
          description: A successful call returns an array of faceList.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceLists'
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
  /facelists/{faceListId}/persistedfaces/{persistedFaceId}:
    delete:
      description: 'Delete a face from a face list by specified faceListId and persistedFaceId.

        <br /> Adding/deleting faces to/from a same face list are processed sequentially
        and to/from different face lists are in parallel.'
      operationId: FaceList_DeleteFace
      parameters:
      - $ref: '#/components/parameters/faceListId'
      - $ref: '#/components/parameters/persistedFaceId'
      responses:
        '200':
          description: A successful call returns an empty response body.
        default:
