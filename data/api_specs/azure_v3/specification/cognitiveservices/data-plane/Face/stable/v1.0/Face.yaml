        or [LargeFaceList - Delete](https://docs.microsoft.com/rest/api/faceapi/largefacelist/delete)
        is called.\n<br /> Note persistedFaceId is different from faceId generated
        by [Face - Detect](https://docs.microsoft.com/rest/api/faceapi/face/detectwithurl).\n*
        Higher face image quality means better recognition precision. Please consider
        high-quality faces: frontal, clear, and face size is 200x200 pixels (100 pixels
        between eyes) or bigger.\n* JPEG, PNG, GIF (the first frame), and BMP format
        are supported. The allowed image file size is from 1KB to 6MB.\n* \"targetFace\"
        rectangle should contain one face. Zero or multiple faces will be regarded
        as an error. If the provided \"targetFace\" rectangle is not returned from
        [Face - Detect](https://docs.microsoft.com/rest/api/faceapi/face/detectwithurl),
        there\u2019s no guarantee to detect and add the face successfully.\n* Out
        of detectable face size (36x36 - 4096x4096 pixels), large head-pose, or large
