        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                description: Image list properties.
                properties:
                  Id:
                    description: Image list ID.
                    type: integer
                  Name:
                    description: Image list name.
                    type: string
                  Description:
                    description: Description for the image list.
                    type: string
                  Metadata:
                    description: Image list metadata.
                    type: object
                    additionalProperties:
                      type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
    delete:
      tags:
      - ListManagementImageLists
      operationId: ListManagementImageLists_Delete
      description: Deletes the image list with listId equal to the passed list ID.
      parameters:
      - name: listId
        in: path
        description: List ID of the image list.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
    put:
      tags:
      - ListManagementImageLists
      operationId: ListManagementImageLists_Update
      description: Updates an image list with listId equal to the passed list ID.
      parameters:
      - name: listId
        in: path
        description: List ID of the image list.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: Content-Type
        description: Content type.
        required: true
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Name:
                  description: Name of the list.
                  type: string
                Description:
                  description: Description of the list.
                  type: string
                Metadata:
                  description: Metadata of the list.
                  type: object
                  additionalProperties:
                    type: string
        description: Schema of the body.
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                description: Image list properties.
                properties:
                  Id:
                    description: Image list ID.
                    type: integer
                  Name:
                    description: Image list name.
                    type: string
                  Description:
                    description: Description for the image list.
                    type: string
                  Metadata:
                    description: Image list metadata.
                    type: object
                    additionalProperties:
                      type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
