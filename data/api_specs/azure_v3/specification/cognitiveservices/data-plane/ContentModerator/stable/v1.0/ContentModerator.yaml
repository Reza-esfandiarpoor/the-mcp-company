openapi: 3.0.0
info:
  title: Content Moderator Client
  version: '1.0'
  description: "You use the API to scan your content as it's generated. Content Moderator\
    \ then processes your content and sends the results, along with relevant information,\
    \ either back to your systems or to the built-in review tool. You can use this\
    \ information to make decisions, like taking it down or sending it to a human\
    \ judge.\r\n\r\nWhen you're using the API, images need to have a minimum of 128\
    \ pixels and a maximum file size of 4 MB. \r\nText can be at most 1,024 characters\
    \ long. \r\nIf the content passed to the text API or the image API exceeds the\
    \ size limits, the API will return an error code that informs you about the issue."
servers:
- url: '{Endpoint}'
  variables:
    Endpoint:
      description: Supported Azure Cognitive Services endpoints (protocol and host
        name, such as https://westus.api.cognitive.microsoft.com).
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apim_key: []
paths:
  /contentmoderator/moderate/v1.0/ProcessImage/FindFaces:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_FindFaces
      description: Returns the list of faces found.
      parameters:
      - name: CacheImage
        in: query
        description: Whether to retain the submitted image for future use. If it's
          omitted, the default is false.
        x-ms-parameter-location: method
        schema:
          type: boolean
      responses:
        '200':
          description: List of faces found.
          content:
            application/json:
              schema:
                description: Request object that contains found faces.
                properties:
                  Status:
                    description: Evaluation status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
                  TrackingId:
                    description: Tracking ID.
                    type: string
                  CacheId:
                    description: Cache ID.
                    type: string
                  Result:
                    description: True if a result was found.
                    type: boolean
                  Count:
                    description: Number of faces found.
                    type: integer
                  AdvancedInfo:
                    description: Advanced info.
                    type: array
                    items:
                      description: Key/value pair object properties.
                      properties:
                        Key:
                          description: Key parameter.
                          type: string
                        Value:
                          description: Value parameter.
                          type: string
                  Faces:
                    description: List of faces.
                    type: array
                    items:
                      description: Coordinates to the found face.
                      properties:
                        Bottom:
                          description: Bottom coordinate.
                          type: integer
                        Left:
                          description: Left coordinate.
                          type: integer
                        Right:
                          description: Right coordinate.
                          type: integer
                        Top:
                          description: Top coordinate.
                          type: integer
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/moderate/v1.0/ProcessImage/OCR:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_OCR
      description: Returns any text found in the image for the specified language.
        If no language is specified in the input, the detection defaults to English.
      parameters:
      - name: language
        in: query
        description: Language of the terms.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: CacheImage
        in: query
        description: Whether to retain the submitted image for future use. If it's
          omitted, the default is false.
        x-ms-parameter-location: method
        schema:
          type: boolean
      - name: enhanced
        in: query
        description: 'When it''s set to true, the image goes through additional processing
          to come with additional candidates.


          The image or TIFF file is not supported when enhanced is set to true.


          Note: This affects the response time.'
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Text found and list of candidate text details.
          content:
            application/json:
              schema:
                description: Contains the text found in an image for the specified
                  language.
                properties:
                  Status:
                    description: Evaluation status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
                  Metadata:
                    description: Array of key/value pairs.
                    type: array
                    items:
                      description: Key/value pair object properties.
                      properties:
                        Key:
                          description: Key parameter.
                          type: string
                        Value:
                          description: Value parameter.
                          type: string
                  TrackingId:
                    description: Tracking ID.
                    type: string
                  CacheId:
                    description: Cache ID.
                    type: string
                  Language:
                    description: ISO 639-3 code.
                    type: string
                  Text:
                    description: Found text.
                    type: string
                  Candidates:
                    description: List of candidate text.
                    type: array
                    items:
                      description: Optical character recognition (OCR) candidate text.
                      properties:
                        Text:
                          description: Text found.
                          type: string
                        Confidence:
                          description: Confidence level.
                          type: number
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/moderate/v1.0/ProcessImage/Evaluate:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_Evaluate
      description: Returns probabilities of the image containing racy or adult content.
      parameters:
      - name: CacheImage
        in: query
        description: Whether to retain the submitted image for future use. If it's
          omitted, the default is false.
        x-ms-parameter-location: method
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Evaluation response object.
                properties:
                  CacheID:
                    description: Cache ID.
                    type: string
                  Result:
                    description: Evaluation result.
                    type: boolean
                  TrackingId:
                    description: Tracking ID.
                    type: string
                  AdultClassificationScore:
                    description: Adult classification score.
                    type: number
                  IsImageAdultClassified:
                    description: Indicates if an image is classified as adult.
                    type: boolean
                  RacyClassificationScore:
                    description: Racy classification score.
                    type: number
                  IsImageRacyClassified:
                    description: Indicates if the image is classified as racy.
                    type: boolean
                  AdvancedInfo:
                    description: Advanced info.
                    type: array
                    items:
                      description: Key/value pair object properties.
                      properties:
                        Key:
                          description: Key parameter.
                          type: string
                        Value:
                          description: Value parameter.
                          type: string
                  Status:
                    description: Evaluation status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/moderate/v1.0/ProcessImage/Match:
    post:
      tags:
      - ImageModeration
      operationId: ImageModeration_Match
      description: "Fuzzily match an image against one of your custom image lists.\
        \ You can create and manage your custom image lists by using <a href=\"/docs/services/578ff44d2703741568569ab9/operations/578ff7b12703741568569abe\"\
        >this API</a>. \r\n\r\nReturns the ID and tags of a matching image.<br/>\r\
        \n<br/>\r\nNote: You must refresh the index on the corresponding image list\
        \ to ensure that additions and removals are reflected in the response."
      parameters:
      - name: listId
        in: query
        description: List ID.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: CacheImage
        in: query
        description: Whether to retain the submitted image for future use. If it's
          omitted, the default is false.
        x-ms-parameter-location: method
        schema:
          type: boolean
      responses:
        '200':
          description: "Supported values for tags are:\r\n<ul>\r\n<li>101: Nudity</li>\r\
            \n<li>102: Sexual Content</li>\r\n<li>201: Alcohol</li>\r\n<li>202: Tobacco</li>\r\
            \n<li>203: Drugs</li>\r\n<li>301: Child Exploitation</li>\r\n<li>401:\
            \ Violence</li>\r\n<li>402: Weapons</li>\r\n<li>403: Gore</li>\r\n<li>501:\
            \ Profanity</li>\r\n<li>502: Vulgarity</li>\r\n</ul>."
          content:
            application/json:
              schema:
                description: Response for a match request.
                properties:
                  TrackingId:
                    description: Tracking ID.
                    type: string
                  CacheID:
                    description: Cache ID.
                    type: string
                  IsMatch:
                    description: Indicates if there is a match.
                    type: boolean
                  Matches:
                    description: Match details.
                    type: array
                    items:
                      description: Match details.
                      properties:
                        Score:
                          description: Confidence score of the image match.
                          type: number
                        MatchId:
                          description: Match ID.
                          type: integer
                        Source:
                          description: Source.
                          type: string
                        Tags:
                          description: Tags for match details.
                          type: array
                          items:
                            type: integer
                        Label:
                          description: Label.
                          type: string
                  Status:
                    description: Evaluation status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/moderate/v1.0/ProcessText/Screen/:
    post:
      tags:
      - TextModeration
      summary: Detect profanity and match against custom and shared blocklists
      description: Detects profanity in more than 100 languages and matches against
        custom and shared blocklists.
      operationId: TextModeration_ScreenText
      parameters:
      - name: language
        in: query
        description: Language of the text.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: autocorrect
        in: query
        required: false
        description: Autocorrect text.
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      - name: PII
        in: query
        description: Detect personal identifiable information.
        required: false
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      - name: listId
        in: query
        description: List ID.
        x-ms-parameter-location: method
        schema:
          type: string
      - name: classify
        description: Classify input.
        in: query
        required: false
        x-ms-parameter-location: method
        schema:
          type: boolean
          default: false
      - name: Content-Type
        description: Content type.
        required: true
        x-ms-client-name: textContentType
        in: header
        schema:
          type: string
          enum:
          - text/plain
          - text/html
          - text/xml
          - text/markdown
      requestBody:
        content:
          text/plain:
            schema:
              type: object
              format: file
          text/html:
            schema:
              type: object
              format: file
          text/xml:
            schema:
              type: object
              format: file
          text/markdown:
            schema:
              type: object
              format: file
        description: Content to screen.
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: Status 200.
          content:
            application/json:
              schema:
                description: Response for a screen text request.
                properties:
                  OriginalText:
                    description: Original text.
                    type: string
                  NormalizedText:
                    description: Normalized text.
                    type: string
                  AutoCorrectedText:
                    description: Autocorrected text.
                    type: string
                  Misrepresentation:
                    description: Misrepresentation text.
                    type: array
                    items:
                      type: string
                  Classification:
                    description: Classification details of the text.
                    properties:
                      Category1:
                        description: Category1 score details of the text. For more
                          details on category classification, see <a href="https://aka.ms/textClassifyCategories">this
                          article</a>.
                        properties:
                          Score:
                            description: Category1 score.
                            type: number
                      Category2:
                        description: Category2 score details of the text. For more
                          details on category classification, see <a href="https://aka.ms/textClassifyCategories">this
                          article</a>.
                        properties:
                          Score:
                            description: Category2 score.
                            type: number
                      Category3:
                        description: Category3 score details of the text. For more
                          details on category classification, see <a href="https://aka.ms/textClassifyCategories">this
                          article</a>.
                        properties:
                          Score:
                            description: Category3 score.
                            type: number
                      ReviewRecommended:
                        description: Review-recommended flag.
                        type: boolean
                  Status:
                    description: Evaluation status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
                  PII:
                    description: Details about personally identifiable information.
                    properties:
                      Email:
                        type: array
                        items:
                          description: Email address details.
                          properties:
                            Detected:
                              description: Detected email address from the input text
                                content.
                              type: string
                            SubType:
                              description: Subtype of the detected email address.
                              type: string
                            Text:
                              description: Email address in the input text content.
                              type: string
                            Index:
                              description: Index (location) of the email address in
                                the input text content.
                              type: integer
                      SSN:
                        type: array
                        items:
                          description: Details about a detected social security number.
                          properties:
                            Text:
                              description: Detected social security number in the
                                input text content.
                              type: string
                            Index:
                              description: Index (location) of the social security
                                number in the input text content.
                              type: integer
                      IPA:
                        type: array
                        items:
                          description: IP address details.
                          properties:
                            SubType:
                              description: Subtype of the detected IP address.
                              type: string
                            Text:
                              description: Detected IP address.
                              type: string
                            Index:
                              description: Index (location) of the IP address in the
                                input text content.
                              type: integer
                      Phone:
                        type: array
                        items:
                          description: Phone property details.
                          properties:
                            CountryCode:
                              description: Country/region code of the detected phone
                                number.
                              type: string
                            Text:
                              description: Detected phone number.
                              type: string
                            Index:
                              description: Index (location) of the phone number in
                                the input text content.
                              type: integer
                      Address:
                        type: array
                        items:
                          description: Address details.
                          properties:
                            Text:
                              description: Detected address.
                              type: string
                            Index:
                              description: Index (location) of the address in the
                                input text content.
                              type: integer
                  Language:
                    description: Language of the input text content.
                    type: string
                  Terms:
                    type: array
                    items:
                      description: Detected term details.
                      properties:
                        Index:
                          description: Index (location) of the detected profanity
                            term in the input text content.
                          type: integer
                        OriginalIndex:
                          description: Original index (location) of the detected profanity
                            term in the input text content.
                          type: integer
                        ListId:
                          description: Matched ID in the term list.
                          type: integer
                        Term:
                          description: Detected profanity term.
                          type: string
                  TrackingId:
                    description: Unique Content Moderator transaction ID.
                    type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/moderate/v1.0/ProcessText/DetectLanguage:
    post:
      tags:
      - TextModeration
      operationId: TextModeration_DetectLanguage
      description: This operation detects the language of input content. It returns
        the <a href="http://www-01.sil.org/iso639-3/codes.asp">ISO 639-3 code</a>
        for the predominant language in the submitted text. More than 110 languages
        are supported.
      parameters:
      - name: Content-Type
        description: Content type.
        required: true
        x-ms-client-name: textContentType
        in: header
        schema:
          type: string
          enum:
          - text/plain
          - text/html
          - text/xml
          - text/markdown
      requestBody:
        content:
          text/plain:
            schema:
              type: object
              format: file
          text/html:
            schema:
              type: object
              format: file
          text/xml:
            schema:
              type: object
              format: file
          text/markdown:
            schema:
              type: object
              format: file
        description: Content to screen.
        required: true
        x-ms-parameter-location: method
      responses:
        '200':
          description: Detected language result.
          content:
            application/json:
              schema:
                description: Detected language result.
                properties:
                  DetectedLanguage:
                    description: Detected language.
                    type: string
                  Status:
                    description: Detected language status.
                    properties:
                      Code:
                        description: Status code.
                        type: integer
                      Description:
                        description: Status description.
                        type: string
                      Exception:
                        description: Exception status.
                        type: string
                  TrackingId:
                    description: Tracking ID.
                    type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/lists/v1.0/imagelists/{listId}:
