                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
    get:
      tags:
      - ListManagementImageLists
      operationId: ListManagementImageLists_GetAllImageLists
      description: Gets all the image lists.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: array
                items:
                  description: Image list properties.
                  properties:
                    Id:
                      description: Image list ID.
                      type: integer
                    Name:
                      description: Image list name.
                      type: string
                    Description:
                      description: Description for the image list.
                      type: string
                    Metadata:
                      description: Image list metadata.
                      type: object
                      additionalProperties:
                        type: string
        default:
          description: Error response.
          content:
            application/json:
              schema:
                type: object
                description: Error information that the API returns.
                properties:
                  Error:
                    type: object
                    description: Error body.
                    properties:
                      Code:
                        type: string
                      Message:
                        type: string
  /contentmoderator/lists/v1.0/imagelists/{listId}/RefreshIndex:
    post:
      tags:
      - ListManagementImageLists
      operationId: ListManagementImageLists_RefreshIndex
      description: Refreshes the index of the list with listId equal to the passed
        list ID.
      parameters:
      - name: listId
        in: path
        description: List ID of the image list.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
