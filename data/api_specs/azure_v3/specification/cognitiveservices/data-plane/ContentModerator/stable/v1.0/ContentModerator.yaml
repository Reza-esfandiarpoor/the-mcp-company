    post:
      tags:
      - Reviews
      operationId: Reviews_CreateReviews
      description: "The created reviews appear for reviewers on your team. As reviewers\
        \ finish reviewing, results of the reviews are posted (that is, HTTP POST)\
        \ on the specified CallBackEndpoint value.\r\n\r\n<h3>CallBack Schemas </h3>\r\
        \n<h4>Review Completion CallBack Sample</h4>\r\n<p>\r\n{<br/>\r\n  \"ReviewId\"\
        : \"<Review ID>\",<br/>\r\n  \"ModifiedOn\": \"2016-10-11T22:36:32.9934851Z\"\
        ,<br/>\r\n  \"ModifiedBy\": \"<Name of the reviewer>\",<br/>\r\n  \"CallBackType\"\
        : \"Review\",<br/>\r\n  \"ContentId\": \"<ContentId value that was specified\
        \ on input>\",<br/>\r\n  \"Metadata\": {<br/>\r\n    \"adultscore\": \"0.xxx\"\
        ,<br/>\r\n    \"a\": \"False\",<br/>\r\n    \"racyscore\": \"0.xxx\",<br/>\r\
        \n    \"r\": \"True\"<br/>\r\n  },<br/>\r\n  \"ReviewerResultTags\": {<br/>\r\
        \n    \"a\": \"False\",<br/>\r\n    \"r\": \"True\"<br/>\r\n  }<br/>\r\n}<br/>\r\
        \n\r\n</p>."
      parameters:
      - name: UrlContentType
        description: Content type.
        required: true
        in: header
        schema:
          type: string
      - name: teamName
        description: Your team name.
        in: path
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: subTeam
        description: Subteam that you want to assign the created review to.
        in: query
        required: false
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Schema of the body.
              items:
                required:
                - Content
                - ContentId
                - Type
                type: object
                description: Schema items of the body.
                properties:
                  Type:
                    description: Type of the content.
                    enum:
                    - Image
                    - Text
                    type: string
