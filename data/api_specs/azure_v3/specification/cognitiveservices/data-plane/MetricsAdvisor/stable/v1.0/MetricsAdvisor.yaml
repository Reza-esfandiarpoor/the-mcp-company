  /alert/anomaly/configurations/{configurationId}/alerts/query:
    post:
      tags:
      - AnomalyAlerting
      summary: Query alerts under anomaly alerting configuration
      operationId: getAlertsByAnomalyAlertingConfiguration
      parameters:
      - in: path
        name: configurationId
        description: anomaly alerting configuration unique id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: $skip
        description: for paging, skipped number
        schema:
          type: integer
          format: int32
      - in: query
        name: $maxpagesize
        description: the maximum number of items in one page
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              required:
              - endTime
              - startTime
              - timeMode
              type: object
              properties:
                startTime:
                  format: date-time
                  description: start time
                  type: string
                endTime:
                  format: date-time
                  description: end time
                  type: string
                timeMode:
                  description: time mode
                  enum:
                  - AnomalyTime
                  - CreatedTime
                  - ModifiedTime
                  type: string
                  x-ms-enum:
                    name: TimeMode
                    modelAsString: true
        description: query alerting result request
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
