openapi: 3.0.0
info:
  title: Metrics Advisor
  description: Microsoft Azure Metrics Advisor REST API (OpenAPI v2)
  version: '1.0'
servers:
- url: '{endpoint}/metricsadvisor/v1.0'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://<resource-name>.cognitiveservices.azure.com).'
      x-ms-parameter-location: client
      x-ms-skip-url-encoding: true
      default: none
security:
- apim_key: []
  ma_api_key: []
paths:
  /stats/latest:
    get:
      tags:
      - Admin
      summary: Get latest usage stats
      operationId: getActiveSeriesCount
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    format: date-time
                    description: The timestamp of the stats
                    type: string
                    readOnly: true
                  activeSeriesCount:
                    format: int32
                    description: The active series count
                    type: integer
                    readOnly: true
                  allSeriesCount:
                    format: int32
                    description: All series count under non deleted data feed
                    type: integer
                    readOnly: true
                  metricsCount:
                    format: int32
                    description: The metrics count under non deleted data feed
                    type: integer
                    readOnly: true
                  dataFeedCount:
                    format: int32
                    description: The count of non deleted data feed
                    type: integer
                    readOnly: true
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
  /alert/anomaly/configurations/{configurationId}:
    get:
      tags:
      - AnomalyAlerting
      summary: Query a single anomaly alerting configuration
      operationId: getAnomalyAlertingConfiguration
      parameters:
      - in: path
        name: configurationId
        description: anomaly alerting configuration unique id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                - hookIds
                - metricAlertingConfigurations
                - name
                type: object
                properties:
                  anomalyAlertingConfigurationId:
                    format: uuid
                    description: anomaly alerting configuration unique id
                    type: string
                    readOnly: true
                  name:
                    description: anomaly alerting configuration name
                    type: string
                  description:
                    description: anomaly alerting configuration description
                    default: ''
                    type: string
                  crossMetricsOperator:
                    description: "cross metrics operator\r\n\r\nshould be specified\
                      \ when setting up multiple metric alerting configurations"
                    enum:
                    - AND
                    - OR
                    - XOR
                    type: string
                    x-ms-enum:
                      name: AnomalyAlertingConfigurationLogicType
                      modelAsString: true
                  splitAlertByDimensions:
                    description: dimensions used to split alert
                    uniqueItems: true
                    type: array
                    items:
                      type: string
                  hookIds:
                    description: hook unique ids
                    uniqueItems: true
                    type: array
                    items:
                      format: uuid
                      type: string
                  metricAlertingConfigurations:
                    description: Anomaly alerting configurations
                    uniqueItems: true
                    type: array
                    items:
                      required:
                      - anomalyDetectionConfigurationId
                      - anomalyScopeType
                      type: object
                      properties:
                        anomalyDetectionConfigurationId:
                          format: uuid
                          description: Anomaly detection configuration unique id
                          type: string
                        anomalyScopeType:
                          description: Anomaly scope
                          enum:
                          - All
                          - Dimension
                          - TopN
                          type: string
                          x-ms-enum:
                            name: AnomalyScope
                            modelAsString: true
                        negationOperation:
                          description: Negation operation
                          default: false
                          type: boolean
                        dimensionAnomalyScope:
                          required:
                          - dimension
                          type: object
                          properties:
                            dimension:
                              description: dimension specified for series group
                              type: object
                              additionalProperties:
                                type: string
                        topNAnomalyScope:
                          required:
                          - minTopCount
                          - period
                          - top
                          type: object
                          properties:
                            top:
                              format: int32
                              description: "top N, value range : [1, +\u221E)"
                              type: integer
                            period:
                              format: int32
                              description: "point count used to look back, value range\
                                \ : [1, +\u221E)"
                              type: integer
                            minTopCount:
                              format: int32
                              description: "min count should be in top N, value range\
                                \ : [1, +\u221E)\r\n\r\nshould be less than or equal\
                                \ to period"
                              type: integer
                        severityFilter:
                          required:
                          - maxAlertSeverity
                          - minAlertSeverity
                          type: object
                          properties:
                            minAlertSeverity:
                              description: min alert severity
                              enum:
                              - Low
                              - Medium
                              - High
                              type: string
                              x-ms-enum:
                                name: Severity
                                modelAsString: true
                            maxAlertSeverity:
                              description: max alert severity
                              enum:
                              - Low
                              - Medium
                              - High
                              type: string
                              x-ms-enum:
                                name: Severity
                                modelAsString: true
                        snoozeFilter:
                          required:
                          - autoSnooze
                          - onlyForSuccessive
                          - snoozeScope
                          type: object
                          properties:
                            autoSnooze:
                              format: int32
                              description: "snooze point count, value range : [0,\
                                \ +\u221E)"
                              type: integer
                            snoozeScope:
                              description: snooze scope
                              enum:
                              - Metric
                              - Series
                              type: string
                              x-ms-enum:
                                name: SnoozeScope
                                modelAsString: true
                            onlyForSuccessive:
                              description: only snooze for successive anomalies
                              type: boolean
                        valueFilter:
                          required:
                          - direction
                          type: object
                          properties:
                            lower:
                              format: double
                              description: "lower bound\r\n\r\nshould be specified\
                                \ when direction is Both or Down"
                              type: number
                            upper:
                              format: double
                              description: "upper bound\r\n\r\nshould be specified\
                                \ when direction is Both or Up"
                              type: number
                            direction:
                              description: value filter direction
                              enum:
                              - Both
                              - Down
                              - Up
                              type: string
                              x-ms-enum:
                                name: Direction
                                modelAsString: true
                            type:
                              description: data used to implement value filter
                              default: Value
                              enum:
                              - Value
                              - Mean
                              type: string
                              x-ms-enum:
                                name: ValueType
                                modelAsString: true
                            metricId:
                              format: uuid
                              description: the other metric unique id used for value
                                filter
                              type: string
                            triggerForMissing:
                              description: "trigger alert when the corresponding point\
                                \ is missing in the other metric\r\n\r\nshould be\
                                \ specified only when using other metric to filter"
                              type: boolean
        default:
          description: Client error or server error (4xx or 5xx)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
