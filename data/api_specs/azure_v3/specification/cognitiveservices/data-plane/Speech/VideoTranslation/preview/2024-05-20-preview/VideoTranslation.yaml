          type: integer
          format: int32
          description: Number of speakers in the video, if not specified, it will
            inherit the value defined in the input of translation creation.
        subtitleMaxCharCountPerSegment:
          type: integer
          format: int32
          description: Subtitle max display character count per segment, if not specified,
            it will inherit the value defined in the input of translation creation.
        exportSubtitleInVideo:
          type: boolean
          description: Export subtitle in video, if not specified, it will inherit
            the value defined in the input of translation creation.
    IterationResult:
      type: object
      description: Iteration result.
      properties:
        translatedVideoFileUrl:
          type: string
          format: uri
          description: Translated video file URL.
        sourceLocaleSubtitleWebvttFileUrl:
          type: string
          format: uri
          description: Source locale subtitle file URL.
        targetLocaleSubtitleWebvttFileUrl:
          type: string
          format: uri
          description: Target locale subtitle file URL.
        metadataJsonWebvttFileUrl:
          type: string
          format: uri
          description: Metadata json webvtt file URL.
        reportFileUrl:
