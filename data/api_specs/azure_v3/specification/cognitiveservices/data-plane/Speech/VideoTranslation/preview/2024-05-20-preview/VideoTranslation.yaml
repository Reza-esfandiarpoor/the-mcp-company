      type: string
      description: Task status.
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      - Canceled
      x-ms-enum:
        name: Status
        modelAsString: true
        values:
        - name: NotStarted
          value: NotStarted
          description: Not started status
        - name: Running
          value: Running
          description: Running status
        - name: Succeeded
          value: Succeeded
          description: Run succeeded status
        - name: Failed
          value: Failed
          description: Run failed status
        - name: Canceled
          value: Canceled
          description: Cancelled status
    Translation:
      type: object
      description: Create translation resource for hosting iterations of translating
        one video file from source locale to target locale.
      properties:
        id:
          $ref: '#/components/schemas/resourceId'
        input:
          $ref: '#/components/schemas/TranslationInput'
        displayName:
          type: string
          description: Translation display name.
        description:
          type: string
          description: Translation description.
        createdDateTime:
          type: string
          format: date-time
          description: The timestamp when the object was created. The timestamp is
            encoded as ISO 8601 date and time format ("YYYY-MM-DDThh:mm:ssZ", see
            https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations).
          readOnly: true
        latestIteration:
          $ref: '#/components/schemas/Iteration'
        latestSucceededIteration:
          $ref: '#/components/schemas/Iteration'
        failureReason:
          type: string
          description: Translation failure reason
          readOnly: true
      required:
      - id
      - input
    TranslationInput:
      type: object
      description: Translation input.
      properties:
        sourceLocale:
          $ref: '#/components/schemas/localeName'
        targetLocale:
          $ref: '#/components/schemas/localeName'
        voiceKind:
          $ref: '#/components/schemas/VoiceKind'
        videoFileUrl:
          type: string
          format: uri
          description: "Translation video file Azure blob url, .mp4 file format, maxmum
            5GB file size and 4 hours video duration. Provide the input media file
            using either videoFileUrl or audioFileUrl, these parameters are mutually
            exclusive\u2014only one of them is required. If both are provided, the
            request will be considered invalid."
        speakerCount:
          type: integer
          format: int32
          description: Number of speakers in the video, if not provided, it will be
            auto-detected from the video file.
        subtitleMaxCharCountPerSegment:
          type: integer
          format: int32
          description: Subtitle max display character count per segment, if not provided,
            it will use the language dependent default value.
        exportSubtitleInVideo:
          type: boolean
          description: Export subtitle in video, if not specified, the default value
            is false, it will not burn subtitle to the translated video file.
      required:
      - sourceLocale
      - targetLocale
      - voiceKind
      - videoFileUrl
    VoiceKind:
      type: string
      description: TTS voice kind.
      enum:
      - PlatformVoice
      - PersonalVoice
      x-ms-enum:
        name: VoiceKind
        modelAsString: true
        values:
        - name: PlatformVoice
          value: PlatformVoice
          description: TTS platform voice
        - name: PersonalVoice
          value: PersonalVoice
          description: TTS personal voice
    WebvttFile:
      type: object
      description: Translation webvtt file.
      properties:
        url:
          type: string
          format: uri
          description: Translation webvtt file url.
        kind:
          $ref: '#/components/schemas/WebvttFileKind'
      required:
      - url
      - kind
    WebvttFileKind:
      type: string
      description: Webvtt file kind.
      enum:
      - SourceLocaleSubtitle
      - TargetLocaleSubtitle
      - MetadataJson
      x-ms-enum:
        name: WebvttFileKind
        modelAsString: true
        values:
        - name: SourceLocaleSubtitle
          value: SourceLocaleSubtitle
          description: Source locale plain text subtitle webvtt file
        - name: TargetLocaleSubtitle
          value: TargetLocaleSubtitle
          description: Target locale plain text subtitle webvtt file
        - name: MetadataJson
          value: MetadataJson
          description: Target locale metadata JSON webvtt file
    localeName:
      type: string
      description: 'Locale name, for example: en-US'
      minLength: 5
      maxLength: 16
      pattern: ^[A-Za-z]{2,4}([_-][A-Za-z]{4})?([_-]([A-Za-z]{2}|[0-9]{3}))?$
    resourceId:
      type: string
      description: Resource ID
      minLength: 3
      maxLength: 64
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
