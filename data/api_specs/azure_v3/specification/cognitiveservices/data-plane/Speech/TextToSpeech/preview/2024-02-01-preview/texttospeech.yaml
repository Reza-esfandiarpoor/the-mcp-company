    put:
      tags:
      - Consent
      description: Creates a new voice talent consent with the provided audio URL.
      operationId: Consents_Create
      parameters:
      - $ref: '#/components/parameters/HeaderOperationId'
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Consent'
        description: consent definition
        required: true
      responses:
        '201':
          description: Created
          headers:
            Operation-Id:
              description: ID of the operation.
              schema:
                type: string
            Operation-Location:
              description: The location of the operation job. Use this URL to monitor
                operation status.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    post:
      tags:
      - Consent
      description: Creates a new voice talent consent with the provided audio file.
      operationId: Consents_Post
      parameters:
      - $ref: '#/components/parameters/HeaderOperationId'
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                projectId:
                  description: The project ID.
                  type: string
                  minLength: 3
                  maxLength: 64
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
                displayName:
                  description: The display name of this consent.
                  type: string
                description:
                  description: Optional description of this consent.
                  type: string
                voiceTalentName:
                  description: The name of voice talent.
                  type: string
                companyName:
                  description: The name of company.
                  type: string
                audiodata:
                  description: An audio file containing the audio data.
                  type: string
                  format: binary
                locale:
                  description: The locale of this consent. Locale code follows BCP-47.
                    You can find the text to speech locale list here https://learn.microsoft.com/azure/ai-services/speech-service/language-support?tabs=tts.
                  type: string
                properties:
                  description: properties.
                  type: string
              required:
              - projectId
              - voiceTalentName
              - companyName
              - audiodata
              - locale
        required: true
      responses:
        '201':
          description: Created
          headers:
            Operation-Id:
              description: ID of the operation.
              schema:
                type: string
            Operation-Location:
              description: The location of the operation job. Use this URL to monitor
                operation status.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consent'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: operation-location
