openapi: 3.0.0
info:
  title: Custom voice API
  description: Custom voice API to create and deploy your voice.
  contact:
    name: Azure AI - Speech Services
    url: https://learn.microsoft.com/azure/ai-services/speech-service/
  version: 2024-02-01-preview
security:
- subscription_key: []
  AADToken: []
paths:
  /projects:
    get:
      tags:
      - Project
      description: Gets a list of projects for the authenticated Speech service resource.
      operationId: Projects_List
      parameters:
      - $ref: '#/components/parameters/QuerySkip'
      - $ref: '#/components/parameters/QueryMaxPageSize'
      - $ref: '#/components/parameters/QueryFilter'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjects'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /projects/{id}:
    get:
      tags:
      - Project
      description: Gets the project identified by the given ID.
      operationId: Projects_Get
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Project
      description: Deletes the project identified by the given ID. All data (like
        consent, training set) in this project will be deleted automatically.
      operationId: Projects_Delete
      parameters:
      - $ref: '#/components/parameters/PathId'
      - in: query
        name: forceDelete
        description: Set this to true if you want to delete a project with model and
          endpoint. Otherwise, the delete operation will fail.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '204':
          description: No Content
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - Project
      description: Creates a new project.
      operationId: Projects_Create
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
        description: project definition
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
