openapi: 3.0.0
info:
  title: Batch synthesis API
  description: Batch synthesis API for text to speech avatar.
  contact:
    name: Cognitive Services - Speech Services
    url: https://docs.microsoft.com/azure/cognitive-services/speech-service/support
  version: 2024-08-01
security:
- subscription_key: []
  AADToken: []
paths:
  /batchsyntheses:
    get:
      tags:
      - BatchSynthesis
      description: Gets the list of batch syntheses.
      operationId: BatchSyntheses_List
      parameters:
      - $ref: '#/components/parameters/QuerySkip'
      - $ref: '#/components/parameters/QueryMaxPageSize'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchSynthesis'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: value
  /batchsyntheses/{id}:
    get:
      tags:
      - BatchSynthesis
      description: Gets the batch synthesis identified by the given ID.
      operationId: BatchSyntheses_Get
      parameters:
      - $ref: '#/components/parameters/SynthesisId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSynthesis'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
      - BatchSynthesis
      description: Creates a batch synthesis job, the max allowed payload content
        length is 500KB.
      operationId: BatchSyntheses_Create
      parameters:
      - $ref: '#/components/parameters/SynthesisId'
      - in: header
        name: Operation-Id
        required: false
        description: ID of the status monitor for the operation. If the Operation-Id
          header matches an existing operation and the request is not identical to
          the prior request, it will fail with a 400 Bad Request.
        schema:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      - $ref: '#/components/parameters/QueryApiVersion'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSynthesis'
        description: Batch synthesis task definition
        required: true
      responses:
        '201':
          description: Created
          headers:
            Operation-Id:
              description: ID of the operation.
              schema:
                type: string
            Operation-Location:
              description: The location of the batch synthesis job.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSynthesis'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-long-running-operation: true
    delete:
      tags:
      - BatchSynthesis
      description: Deletes the batch synthesis identified by the given ID.
      operationId: BatchSyntheses_Delete
      parameters:
      - $ref: '#/components/parameters/SynthesisId'
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '204':
          description: No Content
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /operations/{id}:
    get:
      tags:
      - Operations
      description: Gets operation info.
      operationId: Operations_Get
      parameters:
      - in: path
        name: id
        required: true
        description: The id of the operation
        schema:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      - $ref: '#/components/parameters/QueryApiVersion'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: An error occurred.
          headers:
            x-ms-error-code:
              description: Error code
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
servers:
- url: '{endpoint}/avatar'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://eastus.api.cognitive.microsoft.com).'
      default: none
components:
  parameters:
    QueryApiVersion:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
    QuerySkip:
      name: skip
      in: query
      description: The number of result items to skip.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
        default: 0
    QueryMaxPageSize:
      name: maxpagesize
      in: query
      description: The maximum number of result items to include in a single response.
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    SynthesisId:
      name: id
      in: path
      description: The id of resource.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 3
        maxLength: 64
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
  securitySchemes:
    subscription_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: Provide your cognitive services subscription key here.
    AADToken:
      type: oauth2
      description: These are the [Azure Active Directory OAuth2](https://docs.microsoft.com/azure/active-directory/develop/v1-overview)
        Flows.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            https://cognitiveservices.azure.com/.default: https://cognitiveservices.azure.com/.default
  schemas:
    BatchSynthesis:
      description: Batch synthesis task.
      required:
      - inputKind
      - avatarConfig
      type: object
      properties:
        inputKind:
          $ref: '#/components/schemas/InputKind'
        inputs:
          description: Text or SSML inputs, it's allowed up to 1000 items.
          type: array
          items:
            $ref: '#/components/schemas/BatchSynthesisInput'
        synthesisConfig:
          $ref: '#/components/schemas/BatchSynthesisConfig'
        customVoices:
          description: The custom voice map of voice name and deployment ID .
          type: object
          additionalProperties:
            type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
            minLength: 3
            maxLength: 64
        properties:
          $ref: '#/components/schemas/BatchSynthesisProperties'
        avatarConfig:
          $ref: '#/components/schemas/BatchAvatarConfig'
        outputs:
          $ref: '#/components/schemas/BatchSynthesisOutputs'
        status:
          $ref: '#/components/schemas/Status'
        lastActionDateTime:
          description: The time-stamp when the current status was entered.
          format: date-time
          type: string
          readOnly: true
        id:
          $ref: '#/components/schemas/ResourceId'
        description:
          description: The description of the batch synthesis task.
          type: string
        createdDateTime:
          description: The time-stamp when the object was created.
          format: date-time
          type: string
          readOnly: true
    BatchSynthesisBillingDetails:
      description: Batch synthesis billing details.
      type: object
      properties:
        neuralCharacters:
          format: int64
          description: The number of billable characters for prebuilt neural voices
            in the input file.
          type: integer
        customNeuralCharacters:
          format: int64
          description: The number of billable characters for custom neural voices
            in the input file.
          type: integer
        aoaiCharacters:
          format: int64
          description: The number of billable characters for AOAI voices in the input
            file.
          type: integer
        aoaiHDCharacters:
          format: int64
          description: The number of billable characters for AOAI HD voices in the
            input file.
          type: integer
        talkingAvatarDurationSeconds:
          format: int64
          description: The duration of the talking avatar generated video.
          type: integer
    BatchSynthesisConfig:
      description: Text-to-speech configuration for plain text input.
      required:
      - voice
      type: object
      properties:
        voice:
          description: Voice name for PlainText input. You can find platform voice
            list here https://learn.microsoft.com/azure/ai-services/speech-service/language-support?tabs=tts.
          minLength: 1
          type: string
        style:
          description: Style name for PlainText input.
          type: string
        rate:
          description: Speaking rate for PlainText input. For supported values, see
            https://learn.microsoft.com/azure/ai-services/speech-service/speech-synthesis-markup-voice#adjust-prosody.
          type: string
        pitch:
          description: Pitch for PlainText input. For supported values, see https://learn.microsoft.com/azure/ai-services/speech-service/speech-synthesis-markup-voice#adjust-prosody.
          type: string
        volume:
          description: Volume for PlainText input. For supported values, see https://learn.microsoft.com/azure/ai-services/speech-service/speech-synthesis-markup-voice#adjust-prosody.
          type: string
    BatchSynthesisError:
      description: Batch Synthesis Error.
      type: object
      properties:
        code:
          description: Top level error code
          type: string
        message:
          description: Error message
          type: string
    BatchSynthesisInput:
      description: Batch Synthesis input.
      required:
      - content
      type: object
      properties:
        content:
          description: Input content. It could be SSML or plain text.
          minLength: 1
          type: string
    BatchSynthesisOutputs:
      description: Batch Synthesis output.
      type: object
      properties:
        result:
          description: sas url of the result file. It would be relative path when
            "destinationContainerUrl" is specified.
          type: string
        summary:
          description: Job summary file path will be provided here.
          type: string
    BatchSynthesisProperties:
      description: Detailed properties of batch synthesis task.
      type: object
      properties:
        timeToLiveInHours:
          description: 'How long the batch task will be kept in the system after it
            has completed. Once the batch task reaches the time to live after completion
            (succeeded or failed) it will be automatically deleted. The longest supported
            duration is 744 hours (31 days). The default value is 744 hours. '
          type: integer
          format: int32
          default: 774
        destinationContainerUrl:
          format: uri
          description: The requested destination container. It is an URL with Service
            adhoc SAS to a writeable container in Azure Blob storage.
          type: string
        destinationPath:
          description: The destination path in destination container, default to null,
            it only works when "DestinationContainerUrl" is specified, the final path
            prefix of outputs should be {DestinationPath}/{TaskId}/, or {TaskId} if
            not specified.
          type: string
        sizeInBytes:
          format: int64
          description: The generated video size in bytes.
          type: integer
          readOnly: true
        succeededCount:
          format: int32
          description: The number of succeeded videos.
          type: integer
          readOnly: true
        failedCount:
          format: int32
          description: The number of failed videos.
          type: integer
          readOnly: true
        durationInMilliseconds:
          description: The generated video duration in milliseconds.
          type: integer
          format: int32
          readOnly: true
        billingDetails:
          $ref: '#/components/schemas/BatchSynthesisBillingDetails'
        error:
          $ref: '#/components/schemas/BatchSynthesisError'
    BatchAvatarConfig:
      description: Avatar configuration.
      required:
      - talkingAvatarCharacter
      type: object
      properties:
        talkingAvatarCharacter:
          description: The talking avatar character name.  e.g., Lisa.
          minLength: 1
          type: string
        talkingAvatarStyle:
          description: The talking avatar character style. e.g., casual-sitting.
          type: string
        videoFormat:
          description: The output video format.
          type: string
        videoCodec:
          description: The output video codec.
          type: string
        subtitleType:
          description: The talking avatar subtitle type.
          type: string
        backgroundColor:
          description: The talking avatar background color.
          type: string
        backgroundImage:
          description: The talking avatar background image.
          type: string
        avatarPosition:
          $ref: '#/components/schemas/BatchAvatarCoordinateDefinition'
        avatarSize:
          $ref: '#/components/schemas/BatchAvatarCoordinateDefinition'
        resolution:
          $ref: '#/components/schemas/BatchAvatarCoordinateDefinition'
        videoCrop:
          $ref: '#/components/schemas/BatchAvatarVideoCropDefinition'
        bitrateKbps:
          format: int64
          description: The bitrate of video output settings for talking avatar.
          type: integer
        customized:
          description: Whether the avatar character is a custom avatar or not.
          type: boolean
    BatchAvatarCoordinateDefinition:
      description: Coordinate definition
      type: object
      properties:
        x:
          format: double
          description: Gets or sets the x-axis.
          type: number
        y:
          format: double
          description: Gets or sets the y-axis.
          type: number
    BatchAvatarVideoCropDefinition:
      description: Only keep the region defined by this object in original Avatar
        output video.
      required:
      - bottomRight
      - topLeft
      type: object
      properties:
        topLeft:
          $ref: '#/components/schemas/BatchAvatarCoordinateDefinition'
        bottomRight:
          $ref: '#/components/schemas/BatchAvatarCoordinateDefinition'
    Error:
      description: The error object.
      required:
      - code
      - message
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        target:
          description: The source of the error.
          type: string
        message:
          description: High level error message.
          type: string
        details:
          description: Additional supportive details regarding the error and/or expected
            policies.
          type: array
          items:
            $ref: '#/components/schemas/Error'
        innererror:
          $ref: '#/components/schemas/InnerError'
    ErrorCode:
      description: Top-level error code
      enum:
      - BadRequest
      - BadArgument
      - Unauthorized
      - Forbidden
      - NotFound
      - UnsupportedMediaType
      - TooManyRequests
      - InternalServerError
      - ServiceUnavailable
      type: string
      x-ms-enum:
        name: ErrorCode
        modelAsString: true
    ErrorResponse:
      description: Error response.
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    InnerError:
      description: An object containing more specific information about the error.
      type: object
      properties:
        code:
          description: Detailed error code to help diagnostic.
          type: string
        target:
          description: The source of the error.
          type: string
        message:
          description: Detailed error message.
          type: string
        innererror:
          $ref: '#/components/schemas/InnerError'
    OperationId:
      description: Unique operation ID.
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      minLength: 3
      maxLength: 64
    Operation:
      description: Status of a long running operation.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OperationId'
        status:
          $ref: '#/components/schemas/OperationStatus'
    OperationStatus:
      description: Status of an operation.
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      type: string
      x-ms-enum:
        name: OperationStatus
        modelAsString: true
    PaginatedBatchSynthesis:
      description: Paginated batch synthesis task list
      required:
      - value
      type: object
      properties:
        value:
          description: Batch synthesis tasks.
          type: array
          items:
            $ref: '#/components/schemas/BatchSynthesis'
        nextLink:
          description: Link to next page.
          format: uri
          type: string
    ResourceId:
      description: Resource id
      type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{1,62}[a-zA-Z0-9]$
      minLength: 3
      maxLength: 64
    Status:
      description: Status of a resource.
      enum:
      - NotStarted
      - Running
      - Succeeded
      - Failed
      type: string
      x-ms-enum:
        name: Status
        modelAsString: true
    InputKind:
      description: Input kind.
      enum:
      - PlainText
      - SSML
      type: string
      x-ms-enum:
        name: InputKind
        modelAsString: true
