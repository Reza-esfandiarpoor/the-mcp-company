openapi: 3.0.0
info:
  title: Speech Services API v3.1
  description: Speech Services API v3.1.
  contact:
    name: Cognitive Services - Speech Services
    url: https://docs.microsoft.com/azure/cognitive-services/speech-service/support
  version: v3.1
security:
- api_key: []
- token: []
paths:
  /datasets/locales:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets a list of supported locales for datasets.
      operationId: Datasets_ListSupportedLocales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetLocales'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets a list of datasets for the authenticated subscription.
      operationId: Datasets_List
      parameters:
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      - in: query
        name: filter
        description: "A filtering expression for selecting a subset of the available
          datasets.\r\n            - Supported properties: displayName, description,
          createdDateTime, lastActionDateTime, status, locale, kind.\r\n            -
          Operators:\r\n              - eq, ne are supported for all properties.\r\n
          \             - gt, ge, lt, le are supported for createdDateTime and lastActionDateTime.\r\n
          \             - and, or, not are supported.\r\n            -Example:\r\n
          \            filter=createdDateTime gt 2022-02-01T11:00:00Z and displayName
          eq 'My dataset'"
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDatasets'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
    post:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Uploads and creates a new dataset by getting the data from a specified
        URL or starts waiting for data blocks to be uploaded.
      operationId: Datasets_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dataset'
        description: Definition for the new dataset.
        required: true
      responses:
        '201':
          description: The response contains information about the entity as payload
            and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets/{id}:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets the dataset identified by the given ID.
      operationId: Datasets_Get
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Updates the mutable details of the dataset identified by its ID.
      operationId: Datasets_Update
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdate'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/DatasetUpdate'
        description: The updated values for the dataset.
        required: true
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Deletes the specified dataset.
      operationId: Datasets_Delete
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The dataset was successfully deleted or did not exist.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets/{id}/blocks:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets the list of uploaded blocks for this dataset.
      operationId: Datasets_GetBlocks
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedBlocks'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Upload a block of data for the dataset. The maximum size of the block
        is 8MiB.
      operationId: Datasets_UploadBlock
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: blockid
        description: A valid Base64 string value that identifies the block. Prior
          to encoding, the string must be less than or equal to 64 bytes in size.
          For a given blob, the length of the value specified for the blockid parameter
          must be the same size for each block. Note that the Base64 string must be
          URL-encoded.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        required: true
      responses:
        '201':
          description: The data block was uploaded successfully.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets/upload:
    post:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Uploads data and creates a new dataset.
      operationId: Datasets_Upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                project:
                  description: The optional string representation of the url of a
                    project. If set, the dataset will be associated with that project.
                  type: string
                displayName:
                  description: The name of this dataset (required).
                  type: string
                description:
                  description: Optional description of this dataset.
                  type: string
                locale:
                  description: The locale of this dataset (required).
                  type: string
                kind:
                  description: The kind of the dataset (required). Possible values
                    are "Language", "Acoustic", "Pronunciation", "AudioFiles", "LanguageMarkdown".
                  type: string
                customProperties:
                  description: The optional custom properties of this entity. The
                    maximum allowed key length is 64 characters, the maximum allowed
                    value length is 256 characters and the count of allowed entries
                    is 10.
                  type: string
                data:
                  description: For acoustic datasets, a zip file containing the audio
                    data and a text file containing the transcriptions for the audio
                    data. For language datasets, a text file containing the language
                    or pronunciation data. Required in both cases.
                  type: string
                  format: binary
                email:
                  description: An optional string containing the email address to
                    send email notifications to in case the operation completes. The
                    value will be removed after successfully sending the email.
                  type: string
              required:
              - displayName
              - locale
              - kind
      responses:
        '201':
          description: The response contains information about the entity as payload
            and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
  /datasets/{id}/blocks:commit:
    post:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Commit block list to complete the upload of the dataset.
      operationId: Datasets_CommitBlocks
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CommitBlocksEntry'
        description: The list of blocks that compile the dataset.
        required: true
      responses:
        '200':
          description: The block list is accepted and the data import process can
            continue.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /datasets/{id}/files:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets the files of the dataset identified by the given ID.
      operationId: Datasets_ListFiles
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      - in: query
        name: filter
        description: "A filtering expression for selecting a subset of the available
          files.\r\n            - Supported properties: name, createdDateTime, kind.\r\n
          \           - Operators:\r\n              - eq, ne are supported for all
          properties.\r\n              - gt, ge, lt, le are supported for createdDateTime.\r\n
          \             - and, or, not are supported.\r\n            - Example:\r\n
          \             filter=name eq 'myaudio.wav' and kind eq 'Audio'"
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
  /datasets/{id}/files/{fileId}:
    get:
      tags:
      - 'Custom Speech datasets for model adaptation:'
      summary: Gets one specific file (identified with fileId) from a dataset (identified
        with id).
      operationId: Datasets_GetFile
      parameters:
      - in: path
        name: id
        description: The identifier of the dataset.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        description: The identifier of the file.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/locales:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets a list of supported locales for endpoint creations.
      operationId: Endpoints_ListSupportedLocales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets the list of endpoints for the authenticated subscription.
      operationId: Endpoints_List
      parameters:
      - $ref: '#/components/parameters/skipQueryParameter'
      - $ref: '#/components/parameters/topQueryParameter'
      - in: query
        name: filter
        description: "A filtering expression for selecting a subset of the available
          endpoints.\r\n            - Supported properties: displayName, description,
          createdDateTime, lastActionDateTime, status, locale.\r\n            - Operators:\r\n
          \             - eq, ne are supported for all properties.\r\n              -
          gt, ge, lt, le are supported for createdDateTime and lastActionDateTime.\r\n
          \             - and, or, not are supported.\r\n            - Example:\r\n
          \             filter=locale eq 'en-US'"
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEndpoints'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
    post:
      tags:
      - 'Custom Speech endpoints:'
      summary: Creates a new endpoint.
      operationId: Endpoints_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Endpoint'
        description: The details of the endpoint.
        required: true
      responses:
        '201':
          description: The response contains information about the entity as payload
            and its location as header.
          headers:
            Location:
              description: The location of the created resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/{id}:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets the endpoint identified by the given ID.
      operationId: Endpoints_Get
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - 'Custom Speech endpoints:'
      summary: Deletes the endpoint identified by the given ID.
      operationId: Endpoints_Delete
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The model endpoint was successfully deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - 'Custom Speech endpoints:'
      summary: Updates the metadata of the endpoint identified by the given ID.
      operationId: Endpoints_Update
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointUpdate'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/EndpointUpdate'
        description: The updated values for the endpoint.
        required: true
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/{id}/files/logs:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets the list of audio and transcription logs that have been stored
        for a given endpoint.
      operationId: Endpoints_ListLogs
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      - in: query
        name: skipToken
        description: Token to skip logs that were already retrieved in previous requests.
          Pagination starts from beginning when not defined.
        schema:
          type: string
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
    delete:
      tags:
      - 'Custom Speech endpoints:'
      summary: Deletes the specified audio and transcription logs that have been stored
        for a given endpoint. It deletes all logs before (and including) a specific
        day.
      description: The deletion process is done asynchronously and can take up to
        one day depending on the amount of log files.
      operationId: Endpoints_DeleteLogs
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: endDate
        description: "The end date of the audio logs deletion (specific day, UTC).\r\n
          \           Expected format: \"yyyy-mm-dd\". For instance, \"2019-09-20\"
          results in deleting all logs on September 20h, 2019 and before.\r\n            Deletes
          all existing logs when date is not specified."
        schema:
          type: string
      responses:
        '202':
          description: The logs will be deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/{id}/files/logs/{logId}:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets a specific audio or transcription log for a given endpoint.
      operationId: Endpoints_GetLog
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: logId
        description: The identifier of the log.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - 'Custom Speech endpoints:'
      summary: Deletes one audio or transcription log that have been stored for a
        given endpoint.
      operationId: Endpoints_DeleteLog
      parameters:
      - in: path
        name: id
        description: The identifier of the endpoint.
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: logId
        description: The identifier of the log.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The log was successfully deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/base/{locale}/files/logs:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets the list of audio and transcription logs that have been stored
        when using the default base model of a given language.
      operationId: Endpoints_ListBaseModelLogs
      parameters:
      - in: path
        name: locale
        description: The language used to select the default base model.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      - in: query
        name: skipToken
        description: Token to skip logs that were already retrieved in previous requests.
          Pagination starts from beginning when not defined.
        schema:
          type: string
      - $ref: '#/components/parameters/topQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFiles'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        itemName: values
        nextLinkName: '@nextLink'
    delete:
      tags:
      - 'Custom Speech endpoints:'
      summary: Deletes the specified audio and transcription logs that have been stored
        when using the default base model of a given language. It deletes all logs
        before (and including) a specific day.
      description: Deletion process is done asynchronously and can take up to one
        day depending on the amount of log files.
      operationId: Endpoints_DeleteBaseModelLogs
      parameters:
      - in: path
        name: locale
        description: The language used to select the default base model.
        required: true
        schema:
          type: string
      - in: query
        name: endDate
        description: "The end date of the audio logs deletion (specific day, UTC).\r\n
          \           Expected format: \"yyyy-mm-dd\". For instance, \"2019-09-20\"
          results in deleting all logs on September 20h, 2019 and before.\r\n            Deletes
          all existing logs when date is not specified."
        schema:
          type: string
      responses:
        '202':
          description: The logs will be deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /endpoints/base/{locale}/files/logs/{logId}:
    get:
      tags:
      - 'Custom Speech endpoints:'
      summary: Gets a specific audio or transcription log for the default base model
        in a given language.
      operationId: Endpoints_GetBaseModelLog
      parameters:
      - in: path
        name: locale
        description: The language used to select the default base model.
        required: true
        schema:
          type: string
      - in: path
        name: logId
        description: The identifier of the log.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/sasValidityQueryParameter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - 'Custom Speech endpoints:'
      summary: Deletes one audio or transcription log that have been stored when using
        the default base model of a given language.
      operationId: Endpoints_DeleteBaseModelLog
      parameters:
      - in: path
        name: locale
        description: The language used to select the default base model.
        required: true
        schema:
          type: string
      - in: path
        name: logId
        description: The identifier of the log.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The log was successfully deleted.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /evaluations/locales:
    get:
      tags:
      - 'Custom Speech model evaluations:'
      summary: Gets a list of supported locales for evaluations.
      operationId: Evaluations_ListSupportedLocales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          description: An error occurred.
          content:
