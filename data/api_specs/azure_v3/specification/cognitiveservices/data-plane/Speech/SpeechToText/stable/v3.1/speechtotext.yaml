          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/{id}:ping:
    post:
      tags:
      - 'Custom Speech web hooks:'
      summary: Sends a ping event to the registered URL.
      description: "The request body of the POST request sent to the registered web
        hook URL is of the same shape as in the GET request for a specific hook.\r\nThe
        Swagger Schema ID of the model is WebHookV3.\r\n            \r\nThe request
        will contain a X-MicrosoftSpeechServices-Event header with the value ping.
        If the web hook was registered with\r\na secret it will contain a X-MicrosoftSpeechServices-Signature
        header with an SHA256 hash of the payload with\r\nthe secret as HMAC key.
        The hash is base64 encoded."
      operationId: WebHooks_Ping
      parameters:
      - in: path
        name: id
        description: The identifier of the web hook to ping.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Started trying to send a ping request to the web hook.
          headers:
            Retry-After:
              description: The minimum number of seconds to wait before accessing
                the resource created in this operation.
              schema:
                type: integer
                format: int32
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/{id}:test:
    post:
      tags:
      - 'Custom Speech web hooks:'
      summary: Sends a request for each registered event type to the registered URL.
      description: "The payload will be generated from the last entity that would
        have invoked the web hook. If no entity is present for none of the registered
        event types,\r\nthe POST will respond with 204. If a test request can be made,
        it will respond with 200.\r\nThe request will contain a X-MicrosoftSpeechServices-Event
        header with the respective registered event type.\r\nIf the web hook was registered
        with a secret it will contain a X-MicrosoftSpeechServices-Signature header
        with an SHA256 hash of the payload with\r\nthe secret as HMAC key. The hash
        is base64 encoded."
      operationId: WebHooks_Test
      parameters:
      - in: path
        name: id
        description: The identifier of the web hook to ping.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: A test request with the last entity is sent to the registered
            web hook.
          headers:
            Retry-After:
              description: The minimum number of seconds to wait before accessing
                the resource created in this operation.
              schema:
                type: integer
                format: int32
        '204':
          description: No entity could be found for any event type, so no test request
            is sent to the registered web hook.
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
