              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - 'Custom Speech web hooks:'
      summary: Updates the web hook identified by the given ID.
      description: "If the property secret in the configuration is omitted or contains
        an empty string, future callbacks won't contain X-MicrosoftSpeechServices-Signature\r\nheaders.
        If the property contains a non-empty string, it will be used to create a SHA256
        hash of the payload with the secret as HMAC key. This hash\r\nwill be set
        as X-MicrosoftSpeechServices-Signature header when calling back into the registered
        URL.\r\n            \r\nIf the URL changes,  the web hook will stop receiving
        events until a\r\nchallenge/response is completed. To do this, a request with
        the event type challenge will be made with a query parameter called validationToken.\r\nRespond
        to the challenge with a 200 OK containing the value of the validationToken
        query parameter as the response body. When the challenge/response\r\nis successfully
        completed, the web hook will begin receiving events."
      operationId: WebHooks_Update
      parameters:
      - in: path
        name: id
        description: The identifier of the web hook.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHookUpdate'
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/WebHookUpdate'
        description: The updated values for the web hook.
        required: true
      responses:
        '200':
          description: OK
          headers:
            Retry-After:
              description: The minimum number of seconds to wait for a non terminal
                operation to complete.
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebHook'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
