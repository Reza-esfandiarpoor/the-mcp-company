            is encoded as ISO 8601 date and time format\r\n(\"YYYY-MM-DDThh:mm:ssZ\",
            see https://en.wikipedia.org/wiki/ISO_8601#Combined_date_and_time_representations)."
          type: string
          readOnly: true
    TranscriptionLinks:
      title: TranscriptionLinks
      type: object
      properties:
        files:
          format: uri
          description: The location to get all files of this entity. See operation
            "Transcriptions_ListFiles" for more details.
          type: string
          readOnly: true
    TranscriptionProperties:
      title: TranscriptionProperties
      type: object
      properties:
        diarizationEnabled:
          description: "A value indicating whether diarization (speaker identification)
            is requested. The default value\r\nis `false`.\r\nIf this field is set
            to true and the improved diarization system is configured by specifying\r\n`DiarizationProperties`,
            the improved diarization system will provide diarization for a configurable\r\nrange
            of speakers.\r\nIf this field is set to true and the improved diarization
            system is not enabled (not specifying\r\n`DiarizationProperties`), the
            basic diarization system will distinguish between up to two speakers.\r\nNo
            extra charges are applied for the basic diarization.\r\n            \r\nThe
            basic diarization system is deprecated and will be removed in the next
            major version of the API.\r\nThis `diarizationEnabled` setting will also
            be removed."
          type: boolean
        wordLevelTimestampsEnabled:
          description: "A value indicating whether word level timestamps are requested.
            The default value is\r\n`false`."
          type: boolean
        displayFormWordLevelTimestampsEnabled:
          description: A value indicating whether word level timestamps for the display
            form are requested. The default value is `false`.
          type: boolean
        duration:
          description: "The duration of the transcription. The duration is encoded
            as ISO 8601 duration\r\n(\"PnYnMnDTnHnMnS\", see https://en.wikipedia.org/wiki/ISO_8601#Durations)."
          type: string
          readOnly: true
        channels:
          description: "A collection of the requested channel numbers.\r\nIn the default
            case, the channels 0 and 1 are considered."
          type: array
          items:
            format: int32
            type: integer
        destinationContainerUrl:
          format: uri
          description: "The requested destination container.\r\n### Remarks ###\r\nWhen
            a destination container is used in combination with a `timeToLive`, the
            metadata of a\r\ntranscription will be deleted normally, but the data
            stored in the destination container, including\r\ntranscription results,
            will remain untouched, because no delete permissions are required for
            this\r\ncontainer.<br />\r\nTo support automatic cleanup, either configure
            blob lifetimes on the container, or use \"Bring your own Storage (BYOS)\"\r\ninstead
            of `destinationContainerUrl`, where blobs can be cleaned up."
          type: string
        punctuationMode:
          $ref: '#/components/schemas/PunctuationMode'
        profanityFilterMode:
          $ref: '#/components/schemas/ProfanityFilterMode'
        timeToLive:
          description: "How long the transcription will be kept in the system after
            it has completed. Once the\r\ntranscription reaches the time to live after
            completion (successful or failed) it will be automatically\r\ndeleted.
            Not setting this value or setting it to 0 will disable automatic deletion.
            The longest supported\r\nduration is 31 days.\r\nThe duration is encoded
            as ISO 8601 duration (\"PnYnMnDTnHnMnS\", see https://en.wikipedia.org/wiki/ISO_8601#Durations)."
          type: string
        diarization:
          $ref: '#/components/schemas/DiarizationProperties'
        languageIdentification:
          $ref: '#/components/schemas/LanguageIdentificationProperties'
        email:
          description: "The email address to send email notifications to in case the
            operation completes.\r\nThe value will be removed after successfully sending
            the email."
          type: string
        error:
          $ref: '#/components/schemas/EntityError'
