servers:
- url: '{endpoint}/speechtotext/v3.1'
  variables:
    endpoint:
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
components:
  parameters:
    endpoint:
      in: path
      name: endpoint
      description: 'Supported Cognitive Services endpoints (protocol and hostname,
        for example: https://westus.api.cognitive.microsoft.com).'
      required: true
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      schema:
        type: string
    skipQueryParameter:
      in: query
      name: skip
      description: Number of datasets that will be skipped.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    topQueryParameter:
      in: query
      name: top
      description: Number of datasets that will be included after skipping.
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    sasValidityQueryParameter:
      in: query
      name: sasValidityInSeconds
      description: 'The duration in seconds that an SAS url should be valid. The default
        duration is 12 hours. When using BYOS (https://docs.microsoft.com/en-us/azure/cognitive-services/speech-service/speech-encryption-of-data-at-rest#bring-your-own-storage-byos-for-customization-and-logging):
        A value of 0 means that a plain blob URI without SAS token will be generated.'
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
  securitySchemes:
    api_key:
      type: apiKey
      name: Ocp-Apim-Subscription-Key
      in: header
      description: Provide your cognitive services account key here.
    token:
      type: apiKey
      name: Authorization
      in: header
      description: 'Provide an access token from the JWT returned by the STS of this
        region. Make sure to add the management scope to the token by adding the following
        query string to the STS URL: ?scope=speechservicesmanagement'
  schemas:
    BaseModel:
      $ref: '#/components/schemas/SharedModel'
      type: object
      properties:
        links:
          $ref: '#/components/schemas/BaseModelLinks'
        properties:
          $ref: '#/components/schemas/BaseModelProperties'
      required:
      - displayName
      - locale
      title: BaseModel
    BaseModelDeprecationDates:
      title: BaseModelDeprecationDates
      type: object
      properties:
        adaptationDateTime:
          format: date-time
          description: The date when adaptation becomes deprecated.
          type: string
          readOnly: true
        transcriptionDateTime:
          format: date-time
          description: The date when transcription becomes deprecated.
          type: string
          readOnly: true
    BaseModelFeatures:
      $ref: '#/components/schemas/SharedModelFeatures'
      type: object
      properties:
        supportsAdaptationsWith:
          description: Supported dataset kinds to adapt the model.
          type: array
          items:
            $ref: '#/components/schemas/DatasetKind'
          readOnly: true
      title: BaseModelFeatures
      description: Features supported by the model.
