    post:
      tags:
      - 'Custom Speech web hooks:'
      summary: Creates a new web hook.
      description: "If the property secret in the configuration is present and contains
        a non-empty string, it will be used to create a SHA256 hash of the payload
        with\r\nthe secret as HMAC key. This hash will be set as X-MicrosoftSpeechServices-Signature
        header when calling back into the registered URL.\r\n            \r\nWhen
        calling back into the registered URL, the request will contain a X-MicrosoftSpeechServices-Event
        header containing one of the registered event\r\ntypes. There will be one
        request per registered event type.\r\n            \r\nAfter successfully registering
        the web hook, it will not be usable until a challenge/response is completed.
        To do this, a request with the event type\r\nchallenge will be made with a
        query parameter called validationToken. Respond to the challenge with a 200
        OK containing the value of the validationToken\r\nquery parameter as the response
        body. When the challenge/response is successfully completed, the web hook
        will begin receiving events."
      operationId: WebHooks_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebHook'
        description: The details of the new web hook.
        required: true
      responses:
        '201':
          description: The response contains information about the entity as payload
            and its location as header.
