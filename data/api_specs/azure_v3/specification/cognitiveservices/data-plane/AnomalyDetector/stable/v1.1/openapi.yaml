  /timeseries/entire/detect:
    post:
      operationId: Univariate_DetectUnivariateEntireSeries
      summary: Detect anomalies for the entire series in batch.
      description: 'This operation generates a model with an entire series. Each point
        is detected

        with the same model. With this method, points before and after a certain point

        are used to determine whether it''s an anomaly. The entire detection can give
        the

        user an overall status of the time series.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request of the entire or last anomaly detection.
              properties:
                series:
                  type: array
                  description: 'Time series data points. Points should be sorted by
                    time stamp in ascending

                    order to match the anomaly detection result. If the data is not
                    sorted

                    correctly or there''s a duplicated time stamp, the API won''t
                    work. In such

                    a case, an error message is returned.'
                  items:
                    type: object
                    description: Definition of input time series points.
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: Argument that indicates the time stamp of a data
                          point (ISO8601 format).
                      value:
                        type: number
                        format: float
                        description: Measurement of that point.
                    required:
                    - value
                granularity:
                  description: 'Argument that indicates time granularity. If granularity
                    is not present, the value

                    is none by default. If granularity is none, the time stamp property
                    in the time

                    series point can be absent.'
                  type: string
                  enum:
                  - yearly
                  - monthly
                  - weekly
                  - daily
                  - hourly
                  - minutely
                  - secondly
                  - microsecond
                  - none
                  x-ms-enum:
                    name: TimeGranularity
                    modelAsString: true
                    values:
                    - name: Yearly
                      value: yearly
                    - name: Monthly
                      value: monthly
                    - name: Weekly
                      value: weekly
                    - name: Daily
                      value: daily
                    - name: Hourly
                      value: hourly
                    - name: PerMinute
                      value: minutely
                    - name: PerSecond
                      value: secondly
                    - name: Microsecond
                      value: microsecond
                    - name: None
                      value: none
                customInterval:
                  type: integer
                  format: int32
                  description: 'A custom interval is used to set a nonstandard time
                    interval. For example, if the

                    series is 5 minutes, the request can be set as {"granularity":"minutely",

                    "customInterval":5}.'
                period:
                  type: integer
                  format: int32
                  description: 'Argument that indicates the periodic value of a time
                    series. If the value is null or

                    is not present, the API determines the period automatically.'
                maxAnomalyRatio:
                  type: number
                  format: float
                  description: Argument that indicates an advanced model parameter.
                    It's the maximum anomaly ratio in a time series.
                sensitivity:
                  type: integer
                  format: int32
                  description: 'Argument that indicates an advanced model parameter
                    between 0 and 99. The lower the value

                    is, the larger the margin value is, which means fewer anomalies
                    will be

                    accepted.'
                imputeMode:
                  description: 'Specifies how to deal with missing values in the input
                    series. It''s used

                    when granularity is not "none".'
                  type: string
                  enum:
                  - auto
                  - previous
                  - linear
                  - fixed
                  - zero
                  - notFill
                  x-ms-enum:
                    name: ImputeMode
                    modelAsString: true
                    values:
                    - name: Auto
                      value: auto
                    - name: Previous
                      value: previous
                    - name: Linear
                      value: linear
                    - name: Fixed
                      value: fixed
                    - name: Zero
                      value: zero
                    - name: NotFill
                      value: notFill
                imputeFixedValue:
                  type: number
                  format: float
                  description: 'Specifies the value to fill. It''s used when granularity
                    is not "none"

                    and imputeMode is "fixed".'
              required:
              - series
        description: Method of univariate anomaly detection.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                description: Response of the entire anomaly detection.
                properties:
                  period:
                    type: integer
                    format: int32
                    description: 'Frequency extracted from the series. Zero means
                      no recurrent pattern has been

                      found.'
                  expectedValues:
                    type: array
                    description: 'Expected value for each input point. The index of
                      the

                      array is consistent with the input series.'
                    items:
                      type: number
                      format: float
                  upperMargins:
                    type: array
                    description: 'Upper margin of each input point. UpperMargin is
                      used to

                      calculate upperBoundary, which is equal to expectedValue + (100
                      -

                      marginScale)*upperMargin. Anomalies in the response can be filtered
                      by

                      upperBoundary and lowerBoundary. Adjusting the marginScale value
                      can help filter less

                      significant anomalies on the client side. The index of the array
                      is

                      consistent with the input series.'
                    items:
                      type: number
                      format: float
                  lowerMargins:
                    type: array
                    description: 'Lower margin of each input point. LowerMargin is
                      used to

                      calculate lowerBoundary, which is equal to expectedValue - (100
                      -

                      marginScale)*lowerMargin. Points between the boundary can be
                      marked as normal

                      ones on the client side. The index of the array is consistent
                      with the input

                      series.'
                    items:
                      type: number
                      format: float
                  isAnomaly:
                    type: array
                    description: 'Anomaly properties for each input point. True means
                      an

                      anomaly (either negative or positive) has been detected. The
                      index of the array

                      is consistent with the input series.'
                    items:
                      type: boolean
                  isNegativeAnomaly:
                    type: array
                    description: 'Anomaly status in a negative direction for each
                      input

                      point. True means a negative anomaly has been detected. A negative
                      anomaly

                      means the point is detected as an anomaly and its real value
                      is smaller than

                      the expected one. The index of the array is consistent with
                      the input series.'
                    items:
                      type: boolean
                  isPositiveAnomaly:
                    type: array
                    description: 'Anomaly status in a positive direction for each
                      input

                      point. True means a positive anomaly has been detected. A positive
                      anomaly

                      means the point is detected as an anomaly and its real value
                      is larger than the

                      expected one. The index of the array is consistent with the
                      input series.'
                    items:
                      type: boolean
                  severity:
                    type: array
                    description: 'Severity score for each input point. The larger
                      the value is, the more

                      severe the anomaly is. For normal points, the severity is always
                      0.'
                    items:
                      type: number
                      format: float
                required:
                - period
                - expectedValues
                - upperMargins
                - lowerMargins
                - isAnomaly
                - isNegativeAnomaly
                - isPositiveAnomaly
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: Error code.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
