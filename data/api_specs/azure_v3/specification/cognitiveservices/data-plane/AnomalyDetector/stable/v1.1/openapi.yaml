                description: Time stamp for this anomaly.
              value:
                description: Detailed value of this anomalous time stamp.
                type: object
                properties:
                  isAnomaly:
                    type: boolean
                    description: True if an anomaly is detected at the current time
                      stamp.
                  severity:
                    type: number
                    format: float
                    description: 'Indicates the significance of the anomaly. The higher
                      the severity, the more

                      significant the anomaly is.'
                    minimum: 0
                    maximum: 1
                  score:
                    type: number
                    format: float
                    description: Raw anomaly score of severity, to help indicate the
                      degree of abnormality.
                    minimum: 0
