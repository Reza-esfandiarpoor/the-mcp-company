        granularity:
          description: Granularity is used to verify whether the input series is valid.
          type: string
          enum:
          - yearly
          - monthly
          - weekly
          - daily
          - hourly
          - minutely
          - secondly
          - microsecond
          - none
          x-ms-enum:
            name: TimeGranularity
            modelAsString: true
            values:
            - name: Yearly
              value: yearly
            - name: Monthly
              value: monthly
            - name: Weekly
              value: weekly
            - name: Daily
              value: daily
            - name: Hourly
