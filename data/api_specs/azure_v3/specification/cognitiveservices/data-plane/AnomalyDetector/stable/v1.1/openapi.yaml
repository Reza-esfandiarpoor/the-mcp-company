              value: none
        customInterval:
          type: integer
          format: int32
          description: 'A custom interval is used to set a nonstandard time interval.
            For example, if the

            series is 5 minutes, the request can be set as {"granularity":"minutely",

            "customInterval":5}.'
        period:
          type: integer
          format: int32
          description: 'Argument that indicates the periodic value of a time series.
            If the value is null or

            not present, the API will determine the period automatically.'
        stableTrendWindow:
          type: integer
          format: int32
          description: 'Argument that indicates an advanced model parameter. A default
            stableTrendWindow value will

            be used in detection.'
        threshold:
          type: number
          format: float
          description: 'Argument that indicates an advanced model parameter between
            0.0 and 1.0. The lower the

            value is, the larger the trend error is, which means less change point
            will

            be accepted.'
      required:
      - series
      - granularity
