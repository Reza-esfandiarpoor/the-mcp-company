openapi: 3.0.0
info:
  title: Anomaly Detector
  version: v1.1
  description: 'The Anomaly Detector API detects anomalies automatically in time series
    data.

    It supports both a stateless detection mode and a

    stateful detection mode. In stateless mode, there are three functionalities. Entire

    Detect is for detecting the whole series, with the model trained by the time series.

    Last Detect is for detecting the last point, with the model trained by points
    before.

    ChangePoint Detect is for detecting trend changes in the time series. In stateful

    mode, the user can store time series. The stored time series will be used for

    detection anomalies. In this mode, the user can still use the preceding three

    functionalities by only giving a time range without preparing time series on the

    client side. Besides the preceding three functionalities, the stateful model

    provides group-based detection and labeling services. By using the labeling

    service, the user can provide labels for each detection result. These labels will
    be

    used for retuning or regenerating detection models. Inconsistency detection is

    a kind of group-based detection that finds inconsistencies in

    a set of time series. By using the anomaly detector service, business customers
    can

    discover incidents and establish a logic flow for root cause analysis.'
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
servers:
- url: '{Endpoint}/anomalydetector/{ApiVersion}'
  variables:
    Endpoint:
      description: 'Supported Azure Cognitive Services endpoints (protocol and host
        name, such as

        https://westus2.api.cognitive.microsoft.com).'
      default: none
    ApiVersion:
      description: Api Version
      enum:
      - v1.1
      x-ms-enum:
        name: APIVersion
        modelAsString: true
        values:
        - name: v1_1
          value: v1.1
      default: v1.1
security:
- AnomalyDetectorApiKeyAuth: []
tags: []
paths:
  /multivariate/detect-batch/{resultId}:
    get:
      operationId: Multivariate_GetMultivariateBatchDetectionResult
      summary: Get Multivariate Anomaly Detection Result
      description: 'For asynchronous inference, get a multivariate anomaly detection
        result based on the

        resultId value that the BatchDetectAnomaly API returns.'
      parameters:
      - name: resultId
        in: path
        description: ID of a batch detection result.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                description: Detection results for the resultId value.
                properties:
                  resultId:
                    description: Result identifier that's used to fetch the results
                      of an inference call.
                    type: string
                    format: uuid
                  summary:
                    description: Multivariate anomaly detection status.
                    type: object
                    properties:
                      status:
                        description: Status of detection results.
                        type: string
                        enum:
                        - CREATED
                        - RUNNING
                        - READY
                        - FAILED
                        x-ms-enum:
                          name: MultivariateBatchDetectionStatus
                          modelAsString: true
                          values:
                          - name: Created
                            value: CREATED
                          - name: Running
                            value: RUNNING
                          - name: Ready
                            value: READY
                          - name: Failed
                            value: FAILED
                      errors:
                        type: array
                        description: Error message when detection fails.
                        items:
                          type: object
                          description: Error information that the API returned.
                          properties:
                            code:
                              type: string
                              description: Error code.
                            message:
                              type: string
                              description: Message that explains the error that the
                                service reported.
                          required:
                          - code
                          - message
                      variableStates:
                        type: array
                        description: Variable status.
                        items:
                          type: object
                          description: Variable status.
                          properties:
                            variable:
                              type: string
                              description: Variable name in variable states.
                            filledNARatio:
                              type: number
                              format: float
                              description: Proportion of missing values that need
                                to be filled by fillNAMethod.
                              minimum: 0
                              maximum: 1
                            effectiveCount:
                              type: integer
                              format: int32
                              description: Number of effective data points before
                                fillNAMethod is applied.
                            firstTimestamp:
                              type: string
                              format: date-time
                              description: First valid time stamp with a value of
                                input data.
                            lastTimestamp:
                              type: string
                              format: date-time
                              description: Last valid time stamp with a value of input
                                data.
                      setupInfo:
                        description: 'Detection request for batch inference. This
                          is an asynchronous inference that

                          will need another API to get detection results.'
                        type: object
                        properties:
                          dataSource:
                            type: string
                            format: uri
                            description: 'Source link to the input data to indicate
                              an accessible Azure Storage URI.

                              It either points to an Azure Blob Storage folder or
                              points to a CSV file in

                              Azure Blob Storage, based on your data schema selection.
                              The data schema should

                              be exactly the same as those used in the training phase.
                              The input data must

                              contain at least slidingWindow entries preceding the
                              start time of the data

                              to be detected.'
                          topContributorCount:
                            type: integer
                            format: int32
                            description: Number of top contributed variables for one
                              anomalous time stamp in the response.
                            default: 10
                          startTime:
                            type: string
                            format: date-time
                            description: 'Start date/time of data for detection, which
                              should

                              be in ISO 8601 format.'
                          endTime:
                            type: string
                            format: date-time
                            description: 'End date/time of data for detection, which
                              should

                              be in ISO 8601 format.'
                        required:
                        - dataSource
                        - startTime
                        - endTime
                    required:
                    - status
                    - setupInfo
                  results:
                    type: array
                    description: Detection result for each time stamp.
                    items:
                      type: object
                      description: Anomaly status and information.
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                          description: Time stamp for this anomaly.
                        value:
                          description: Detailed value of this anomalous time stamp.
                          type: object
                          properties:
                            isAnomaly:
                              type: boolean
                              description: True if an anomaly is detected at the current
                                time stamp.
                            severity:
                              type: number
                              format: float
                              description: 'Indicates the significance of the anomaly.
                                The higher the severity, the more

                                significant the anomaly is.'
                              minimum: 0
                              maximum: 1
                            score:
                              type: number
                              format: float
                              description: Raw anomaly score of severity, to help
                                indicate the degree of abnormality.
                              minimum: 0
                              maximum: 2
                            interpretation:
                              type: array
                              description: Interpretation of this anomalous time stamp.
                              items:
                                type: object
                                description: Interpretation of the anomalous time
                                  stamp.
                                properties:
                                  variable:
                                    type: string
                                    description: Variable.
                                  contributionScore:
                                    type: number
                                    format: float
                                    description: 'This score shows the percentage
                                      that contributes to the anomalous time stamp.
                                      It''s a

                                      number between 0 and 1.'
                                  correlationChanges:
                                    description: Correlation changes among the anomalous
                                      variables.
                                    type: object
                                    properties:
                                      changedVariables:
                                        type: array
                                        description: Correlated variables that have
                                          correlation changes under an anomaly.
                                        items:
                                          type: string
                          required:
                          - isAnomaly
                          - severity
                          - score
                        errors:
                          type: array
                          description: Error message for the current time stamp.
                          items:
                            type: object
                            description: Error information that the API returned.
                            properties:
                              code:
                                type: string
                                description: Error code.
                              message:
                                type: string
                                description: Message that explains the error that
                                  the service reported.
                            required:
                            - code
                            - message
                      required:
                      - timestamp
                required:
                - resultId
                - summary
                - results
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: Error code.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Error response.
                properties:
                  code:
                    type: string
                    description: Error code.
                  message:
                    type: string
                    description: Message that explains the error that the service
                      reported.
                required:
                - code
                - message
  /multivariate/models:
    get:
      operationId: Multivariate_ListMultivariateModels
      summary: List Multivariate Models
      description: List models of a resource.
      parameters:
      - name: skip
        in: query
        description: The number of result items to skip.
        required: false
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          default: 0
      - name: top
        in: query
        description: The number of result items to return.
        required: false
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                description: Response of listing models.
                properties:
                  models:
                    type: array
                    description: List of models.
                    items:
                      type: object
                      description: Response of getting a model.
                      properties:
                        modelId:
                          description: Model identifier.
                          type: string
                          format: uuid
                        createdTime:
                          type: string
                          format: date-time
                          description: Date and time (UTC) when the model was created.
                        lastUpdatedTime:
                          type: string
                          format: date-time
                          description: Date and time (UTC) when the model was last
                            updated.
                        modelInfo:
                          description: 'Training result of a model, including its
                            status, errors, and diagnostics

                            information.'
                          type: object
                          properties:
                            dataSource:
                              type: string
                              format: uri
                              description: 'Source link to the input data to indicate
                                an accessible Azure Storage URI.

                                It either points to an Azure Blob Storage folder or
                                points to a CSV file in

                                Azure Blob Storage, based on your data schema selection.'
                            dataSchema:
                              description: 'Data schema of the input data source.
                                The default

                                is OneTable.'
                              type: string
                              enum:
                              - OneTable
                              - MultiTable
                              x-ms-enum:
                                name: DataSchema
                                modelAsString: true
                                values:
                                - name: OneTable
                                  value: OneTable
                                  description: OneTable means that your input data
                                    is in one CSV file, which contains one time stamp
                                    column and several variable columns. The default
                                    DataSchema value is OneTable.
                                - name: MultiTable
                                  value: MultiTable
                                  description: MultiTable means that your input data
                                    is separated in multiple CSV files. Each file
                                    contains one time stamp column and one variable
                                    column, and the CSV file name should indicate
                                    the name of the variable. The default DataSchema
                                    value is OneTable.
                            startTime:
                              type: string
                              format: date-time
                              description: 'Start date/time of training data, which
                                should be

                                in ISO 8601 format.'
                            endTime:
                              type: string
                              format: date-time
                              description: 'End date/time of training data, which
                                should be

                                in ISO 8601 format.'
                            displayName:
                              type: string
                              description: 'Display name of the model. Maximum length
                                is 24

                                characters.'
                              maxLength: 24
                            slidingWindow:
                              type: integer
                              format: int32
                              description: 'Number of previous time stamps that will
                                be used to

                                detect whether the time stamp is an anomaly or not.'
                            alignPolicy:
                              description: Manner of aligning multiple variables.
                              type: object
                              properties:
                                alignMode:
                                  description: 'Field that indicates how to align
                                    different variables to the same

                                    time range.'
                                  type: string
                                  enum:
                                  - Inner
                                  - Outer
                                  x-ms-enum:
                                    name: AlignMode
                                    modelAsString: true
                                fillNAMethod:
                                  description: Field that indicates how missing values
                                    will be filled.
                                  type: string
                                  enum:
                                  - Previous
                                  - Subsequent
                                  - Linear
                                  - Zero
                                  - Fixed
                                  x-ms-enum:
                                    name: FillNAMethod
                                    modelAsString: true
                                paddingValue:
                                  type: number
                                  format: float
                                  description: Field that's required when fillNAMethod
                                    is Fixed.
                            status:
                              description: Model status.
                              readOnly: true
                              type: string
                              enum:
                              - CREATED
                              - RUNNING
                              - READY
                              - FAILED
                              x-ms-enum:
                                name: ModelStatus
                                modelAsString: true
                                values:
                                - name: Created
                                  value: CREATED
                                  description: The model has been created. Training
                                    has been scheduled but not yet started.
                                - name: Running
                                  value: RUNNING
                                  description: The model is being trained.
                                - name: Ready
                                  value: READY
                                  description: The model has been trained and is ready
                                    to be used for anomaly detection.
                                - name: Failed
                                  value: FAILED
                                  description: The model training failed.
                            errors:
                              type: array
                              description: Error messages after failure to create
                                a model.
                              items:
                                type: object
                                description: Error information that the API returned.
                                properties:
                                  code:
                                    type: string
                                    description: Error code.
                                  message:
                                    type: string
                                    description: Message that explains the error that
                                      the service reported.
                                required:
                                - code
                                - message
                              readOnly: true
                            diagnosticsInfo:
                              description: Diagnostics information to help inspect
                                the states of a model or variable.
                              readOnly: true
                              type: object
                              properties:
                                modelState:
                                  description: Model status.
                                  type: object
                                  properties:
                                    epochIds:
                                      type: array
                                      description: 'Number of passes of the entire
                                        training dataset that the

                                        algorithm has completed.'
                                      items:
                                        type: integer
                                        format: int32
                                    trainLosses:
                                      type: array
                                      description: 'List of metrics used to assess
                                        how the model fits the training data for each

                                        epoch.'
                                      items:
                                        type: number
                                        format: float
                                    validationLosses:
                                      type: array
                                      description: 'List of metrics used to assess
                                        how the model fits the validation set for
                                        each

                                        epoch.'
                                      items:
                                        type: number
                                        format: float
                                    latenciesInSeconds:
                                      type: array
                                      description: Latency for each epoch.
                                      items:
                                        type: number
                                        format: float
                                variableStates:
                                  type: array
                                  description: Variable status.
                                  items:
                                    type: object
                                    description: Variable status.
                                    properties:
                                      variable:
                                        type: string
                                        description: Variable name in variable states.
                                      filledNARatio:
                                        type: number
                                        format: float
                                        description: Proportion of missing values
                                          that need to be filled by fillNAMethod.
                                        minimum: 0
                                        maximum: 1
                                      effectiveCount:
                                        type: integer
                                        format: int32
                                        description: Number of effective data points
                                          before fillNAMethod is applied.
                                      firstTimestamp:
                                        type: string
                                        format: date-time
                                        description: First valid time stamp with a
                                          value of input data.
                                      lastTimestamp:
                                        type: string
                                        format: date-time
                                        description: Last valid time stamp with a
                                          value of input data.
                          required:
                          - dataSource
                          - startTime
                          - endTime
                      required:
                      - modelId
                      - createdTime
                      - lastUpdatedTime
                  currentCount:
                    type: integer
                    format: int32
                    description: Number of trained multivariate models.
                  maxCount:
                    type: integer
                    format: int32
                    description: Maximum number of models that can be trained for
                      this Anomaly Detector resource.
                  nextLink:
                    type: string
                    description: Link to fetch more models.
                required:
                - models
                - currentCount
                - maxCount
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: Error code.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Error response.
                properties:
                  code:
                    type: string
                    description: Error code.
                  message:
                    type: string
                    description: Message that explains the error that the service
                      reported.
                required:
                - code
                - message
      x-ms-pageable:
        nextLinkName: nextLink
        itemName: models
    post:
      operationId: Multivariate_TrainMultivariateModel
      summary: Train a Multivariate Anomaly Detection Model
      description: 'Create and train a multivariate anomaly detection model. The request
        must

        include a source parameter to indicate an Azure Blob

        Storage URI that''s accessible to the service. There are two types of data
        input. The Blob Storage URI can point to an Azure Blob

        Storage folder that contains multiple CSV files, where each CSV file has

        two columns, time stamp and variable. Or the Blob Storage URI can point to
        a single blob that contains a CSV file that has all the variables and a

        time stamp column.

        The model object will be created and returned in the response, but the

        training process happens asynchronously. To check the training status, call

        GetMultivariateModel with the modelId value and check the status field in
        the

        modelInfo object.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 'Training result of a model, including its status, errors,
                and diagnostics

                information.'
              properties:
                dataSource:
                  type: string
                  format: uri
                  description: 'Source link to the input data to indicate an accessible
                    Azure Storage URI.

                    It either points to an Azure Blob Storage folder or points to
                    a CSV file in

                    Azure Blob Storage, based on your data schema selection.'
                dataSchema:
                  description: 'Data schema of the input data source. The default

                    is OneTable.'
                  type: string
                  enum:
                  - OneTable
                  - MultiTable
                  x-ms-enum:
                    name: DataSchema
                    modelAsString: true
                    values:
                    - name: OneTable
                      value: OneTable
                      description: OneTable means that your input data is in one CSV
                        file, which contains one time stamp column and several variable
                        columns. The default DataSchema value is OneTable.
                    - name: MultiTable
                      value: MultiTable
                      description: MultiTable means that your input data is separated
                        in multiple CSV files. Each file contains one time stamp column
                        and one variable column, and the CSV file name should indicate
                        the name of the variable. The default DataSchema value is
                        OneTable.
                startTime:
                  type: string
                  format: date-time
                  description: 'Start date/time of training data, which should be

                    in ISO 8601 format.'
                endTime:
                  type: string
                  format: date-time
                  description: 'End date/time of training data, which should be

                    in ISO 8601 format.'
                displayName:
                  type: string
                  description: 'Display name of the model. Maximum length is 24

                    characters.'
                  maxLength: 24
                slidingWindow:
                  type: integer
                  format: int32
                  description: 'Number of previous time stamps that will be used to

                    detect whether the time stamp is an anomaly or not.'
                alignPolicy:
                  description: Manner of aligning multiple variables.
                  type: object
                  properties:
                    alignMode:
                      description: 'Field that indicates how to align different variables
                        to the same

                        time range.'
                      type: string
                      enum:
                      - Inner
                      - Outer
                      x-ms-enum:
                        name: AlignMode
                        modelAsString: true
                    fillNAMethod:
                      description: Field that indicates how missing values will be
                        filled.
                      type: string
                      enum:
                      - Previous
                      - Subsequent
                      - Linear
                      - Zero
                      - Fixed
                      x-ms-enum:
                        name: FillNAMethod
                        modelAsString: true
                    paddingValue:
                      type: number
                      format: float
                      description: Field that's required when fillNAMethod is Fixed.
                status:
                  description: Model status.
                  readOnly: true
                  type: string
                  enum:
                  - CREATED
                  - RUNNING
                  - READY
                  - FAILED
                  x-ms-enum:
                    name: ModelStatus
                    modelAsString: true
                    values:
                    - name: Created
                      value: CREATED
                      description: The model has been created. Training has been scheduled
                        but not yet started.
                    - name: Running
                      value: RUNNING
                      description: The model is being trained.
                    - name: Ready
                      value: READY
                      description: The model has been trained and is ready to be used
                        for anomaly detection.
                    - name: Failed
                      value: FAILED
                      description: The model training failed.
                errors:
                  type: array
                  description: Error messages after failure to create a model.
                  items:
                    type: object
                    description: Error information that the API returned.
                    properties:
                      code:
                        type: string
                        description: Error code.
                      message:
                        type: string
                        description: Message that explains the error that the service
                          reported.
                    required:
                    - code
                    - message
                  readOnly: true
                diagnosticsInfo:
                  description: Diagnostics information to help inspect the states
                    of a model or variable.
                  readOnly: true
                  type: object
                  properties:
                    modelState:
                      description: Model status.
                      type: object
                      properties:
                        epochIds:
                          type: array
                          description: 'Number of passes of the entire training dataset
                            that the

                            algorithm has completed.'
                          items:
                            type: integer
                            format: int32
                        trainLosses:
                          type: array
                          description: 'List of metrics used to assess how the model
                            fits the training data for each

                            epoch.'
                          items:
                            type: number
                            format: float
                        validationLosses:
                          type: array
                          description: 'List of metrics used to assess how the model
                            fits the validation set for each

                            epoch.'
                          items:
                            type: number
                            format: float
                        latenciesInSeconds:
                          type: array
                          description: Latency for each epoch.
                          items:
                            type: number
                            format: float
                    variableStates:
                      type: array
                      description: Variable status.
                      items:
                        type: object
                        description: Variable status.
                        properties:
                          variable:
                            type: string
                            description: Variable name in variable states.
                          filledNARatio:
                            type: number
                            format: float
                            description: Proportion of missing values that need to
                              be filled by fillNAMethod.
                            minimum: 0
                            maximum: 1
                          effectiveCount:
                            type: integer
                            format: int32
                            description: Number of effective data points before fillNAMethod
                              is applied.
                          firstTimestamp:
                            type: string
                            format: date-time
                            description: First valid time stamp with a value of input
                              data.
                          lastTimestamp:
                            type: string
                            format: date-time
                            description: Last valid time stamp with a value of input
                              data.
              required:
              - dataSource
              - startTime
              - endTime
        description: Model information.
        required: true
      responses:
        '201':
          description: The request has succeeded and a new resource has been created
            as a result.
          headers:
            location:
              description: Location and ID of the model.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Response of getting a model.
                properties:
                  modelId:
                    description: Model identifier.
                    type: string
                    format: uuid
                  createdTime:
                    type: string
                    format: date-time
                    description: Date and time (UTC) when the model was created.
                  lastUpdatedTime:
                    type: string
                    format: date-time
                    description: Date and time (UTC) when the model was last updated.
                  modelInfo:
                    description: 'Training result of a model, including its status,
                      errors, and diagnostics

                      information.'
                    type: object
                    properties:
                      dataSource:
                        type: string
                        format: uri
                        description: 'Source link to the input data to indicate an
                          accessible Azure Storage URI.

                          It either points to an Azure Blob Storage folder or points
                          to a CSV file in

                          Azure Blob Storage, based on your data schema selection.'
                      dataSchema:
                        description: 'Data schema of the input data source. The default

                          is OneTable.'
                        type: string
                        enum:
                        - OneTable
                        - MultiTable
                        x-ms-enum:
                          name: DataSchema
                          modelAsString: true
                          values:
                          - name: OneTable
                            value: OneTable
                            description: OneTable means that your input data is in
                              one CSV file, which contains one time stamp column and
                              several variable columns. The default DataSchema value
                              is OneTable.
                          - name: MultiTable
                            value: MultiTable
                            description: MultiTable means that your input data is
                              separated in multiple CSV files. Each file contains
                              one time stamp column and one variable column, and the
                              CSV file name should indicate the name of the variable.
                              The default DataSchema value is OneTable.
                      startTime:
                        type: string
                        format: date-time
                        description: 'Start date/time of training data, which should
                          be

                          in ISO 8601 format.'
                      endTime:
                        type: string
                        format: date-time
                        description: 'End date/time of training data, which should
                          be

                          in ISO 8601 format.'
                      displayName:
                        type: string
                        description: 'Display name of the model. Maximum length is
                          24

                          characters.'
                        maxLength: 24
                      slidingWindow:
                        type: integer
                        format: int32
                        description: 'Number of previous time stamps that will be
                          used to

                          detect whether the time stamp is an anomaly or not.'
                      alignPolicy:
                        description: Manner of aligning multiple variables.
                        type: object
                        properties:
                          alignMode:
                            description: 'Field that indicates how to align different
                              variables to the same

                              time range.'
                            type: string
                            enum:
                            - Inner
                            - Outer
                            x-ms-enum:
                              name: AlignMode
                              modelAsString: true
                          fillNAMethod:
                            description: Field that indicates how missing values will
                              be filled.
                            type: string
                            enum:
                            - Previous
                            - Subsequent
                            - Linear
                            - Zero
                            - Fixed
                            x-ms-enum:
