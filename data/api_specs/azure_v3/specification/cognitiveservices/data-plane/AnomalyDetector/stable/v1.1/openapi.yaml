  /multivariate/models/{modelId}:detect-batch:
    post:
      operationId: Multivariate_DetectMultivariateBatchAnomaly
      summary: Detect Multivariate Anomaly
      description: 'Submit a multivariate anomaly detection task with the modelId
        value of a trained model

        and inference data. The input schema should be the same with the training

        request. The request will finish asynchronously and return a resultId value
        to

        query the detection result. The request should be a source link to indicate
        an

        externally accessible Azure Storage URI that either points to an Azure Blob

        Storage folder or points to a CSV file in Azure Blob Storage.'
      parameters:
      - name: modelId
        in: path
        description: Model identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 'Detection request for batch inference. This is an asynchronous
                inference that

                will need another API to get detection results.'
              properties:
                dataSource:
                  type: string
                  format: uri
                  description: 'Source link to the input data to indicate an accessible
                    Azure Storage URI.

                    It either points to an Azure Blob Storage folder or points to
                    a CSV file in

                    Azure Blob Storage, based on your data schema selection. The data
                    schema should

                    be exactly the same as those used in the training phase. The input
                    data must

                    contain at least slidingWindow entries preceding the start time
                    of the data

                    to be detected.'
                topContributorCount:
                  type: integer
                  format: int32
                  description: Number of top contributed variables for one anomalous
                    time stamp in the response.
                  default: 10
                startTime:
                  type: string
                  format: date-time
                  description: 'Start date/time of data for detection, which should

                    be in ISO 8601 format.'
                endTime:
                  type: string
                  format: date-time
                  description: 'End date/time of data for detection, which should

                    be in ISO 8601 format.'
              required:
              - dataSource
              - startTime
              - endTime
        description: Request of multivariate anomaly detection.
        required: true
      responses:
        '202':
          description: The request has been accepted for processing, but processing
            has not yet completed.
          headers:
            Operation-Id:
              description: ID of the detection result.
              schema:
                type: string
            Operation-Location:
              description: Location of the detection result.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Detection results for the resultId value.
                properties:
                  resultId:
                    description: Result identifier that's used to fetch the results
                      of an inference call.
                    type: string
                    format: uuid
                  summary:
                    description: Multivariate anomaly detection status.
                    type: object
                    properties:
                      status:
                        description: Status of detection results.
                        type: string
                        enum:
                        - CREATED
                        - RUNNING
                        - READY
                        - FAILED
                        x-ms-enum:
                          name: MultivariateBatchDetectionStatus
                          modelAsString: true
                          values:
                          - name: Created
                            value: CREATED
                          - name: Running
                            value: RUNNING
                          - name: Ready
                            value: READY
                          - name: Failed
                            value: FAILED
                      errors:
                        type: array
                        description: Error message when detection fails.
                        items:
                          type: object
                          description: Error information that the API returned.
                          properties:
                            code:
                              type: string
                              description: Error code.
                            message:
                              type: string
                              description: Message that explains the error that the
                                service reported.
                          required:
                          - code
                          - message
                      variableStates:
                        type: array
                        description: Variable status.
                        items:
                          type: object
                          description: Variable status.
                          properties:
                            variable:
                              type: string
                              description: Variable name in variable states.
                            filledNARatio:
                              type: number
                              format: float
                              description: Proportion of missing values that need
                                to be filled by fillNAMethod.
                              minimum: 0
                              maximum: 1
                            effectiveCount:
                              type: integer
                              format: int32
                              description: Number of effective data points before
                                fillNAMethod is applied.
                            firstTimestamp:
                              type: string
                              format: date-time
                              description: First valid time stamp with a value of
                                input data.
                            lastTimestamp:
                              type: string
                              format: date-time
                              description: Last valid time stamp with a value of input
                                data.
                      setupInfo:
                        description: 'Detection request for batch inference. This
                          is an asynchronous inference that

                          will need another API to get detection results.'
                        type: object
                        properties:
                          dataSource:
                            type: string
                            format: uri
                            description: 'Source link to the input data to indicate
                              an accessible Azure Storage URI.

                              It either points to an Azure Blob Storage folder or
                              points to a CSV file in

                              Azure Blob Storage, based on your data schema selection.
                              The data schema should

                              be exactly the same as those used in the training phase.
                              The input data must

                              contain at least slidingWindow entries preceding the
                              start time of the data

                              to be detected.'
                          topContributorCount:
                            type: integer
                            format: int32
                            description: Number of top contributed variables for one
                              anomalous time stamp in the response.
                            default: 10
                          startTime:
                            type: string
                            format: date-time
                            description: 'Start date/time of data for detection, which
                              should

                              be in ISO 8601 format.'
                          endTime:
                            type: string
                            format: date-time
                            description: 'End date/time of data for detection, which
                              should

                              be in ISO 8601 format.'
                        required:
                        - dataSource
                        - startTime
                        - endTime
                    required:
                    - status
                    - setupInfo
                  results:
                    type: array
                    description: Detection result for each time stamp.
                    items:
                      type: object
                      description: Anomaly status and information.
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                          description: Time stamp for this anomaly.
                        value:
                          description: Detailed value of this anomalous time stamp.
                          type: object
                          properties:
                            isAnomaly:
                              type: boolean
                              description: True if an anomaly is detected at the current
                                time stamp.
                            severity:
                              type: number
                              format: float
                              description: 'Indicates the significance of the anomaly.
                                The higher the severity, the more

                                significant the anomaly is.'
                              minimum: 0
                              maximum: 1
                            score:
                              type: number
                              format: float
                              description: Raw anomaly score of severity, to help
                                indicate the degree of abnormality.
                              minimum: 0
                              maximum: 2
                            interpretation:
                              type: array
                              description: Interpretation of this anomalous time stamp.
                              items:
                                type: object
                                description: Interpretation of the anomalous time
                                  stamp.
                                properties:
                                  variable:
                                    type: string
                                    description: Variable.
                                  contributionScore:
                                    type: number
                                    format: float
                                    description: 'This score shows the percentage
                                      that contributes to the anomalous time stamp.
                                      It''s a

                                      number between 0 and 1.'
                                  correlationChanges:
                                    description: Correlation changes among the anomalous
                                      variables.
                                    type: object
                                    properties:
                                      changedVariables:
                                        type: array
                                        description: Correlated variables that have
                                          correlation changes under an anomaly.
                                        items:
                                          type: string
                          required:
                          - isAnomaly
                          - severity
                          - score
                        errors:
                          type: array
                          description: Error message for the current time stamp.
                          items:
                            type: object
                            description: Error information that the API returned.
                            properties:
                              code:
                                type: string
                                description: Error code.
                              message:
                                type: string
                                description: Message that explains the error that
                                  the service reported.
                            required:
                            - code
                            - message
                      required:
                      - timestamp
                required:
                - resultId
                - summary
                - results
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: Error code.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                description: Error response.
                properties:
                  code:
                    type: string
                    description: Error code.
                  message:
                    type: string
                    description: Message that explains the error that the service
                      reported.
                required:
                - code
                - message
