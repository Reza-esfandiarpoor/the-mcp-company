                    - InvalidSeries
                    - InvalidJsonFormat
                    - RequiredGranularity
                    - RequiredSeries
                    - InvalidImputeMode
                    - InvalidImputeFixedValue
                    x-ms-enum:
                      name: AnomalyDetectorErrorCodes
                      modelAsString: true
                  message:
                    type: string
                    description: Message that explains the error that the service
                      reported.
                required:
                - code
                - message
