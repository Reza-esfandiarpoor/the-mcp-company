                  interpretation:
                    type: array
                    description: Interpretation of this anomalous time stamp.
                    items:
                      type: object
                      description: Interpretation of the anomalous time stamp.
                      properties:
                        variable:
                          type: string
                          description: Variable.
                        contributionScore:
                          type: number
