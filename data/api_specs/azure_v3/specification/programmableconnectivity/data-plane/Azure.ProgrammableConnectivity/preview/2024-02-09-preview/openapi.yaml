          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
    DeviceLocationEndpoint:
      type: object
      description: Static endpoint to access the Device Location API family.
      properties:
        location:
          type: string
          description: Static endpoint
          enum:
          - location
          x-ms-enum:
            modelAsString: false
          readOnly: true
      required:
      - location
    DeviceLocationVerificationContent:
      type: object
      description: Request to verify Location
      properties:
        networkIdentifier:
          $ref: '#/components/schemas/NetworkIdentifier'
        latitude:
          type: number
          format: double
          description: Latitude of location to be verified
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          description: Longitude of location to be verified
          minimum: -180
          maximum: 180
        accuracy:
          type: integer
          format: int32
          description: Accuracy expected for location verification in kilometers
          minimum: 2
          maximum: 100
        device:
          $ref: '#/components/schemas/LocationDevice'
      required:
      - networkIdentifier
      - latitude
      - longitude
      - accuracy
      - device
    DeviceLocationVerificationResult:
      type: object
      description: Response verifying location
      properties:
        verificationResult:
          type: boolean
          description: True if the location is in the specified area, False otherwise
      required:
      - verificationResult
    DeviceNetworkRetrievalEndpoint:
      type: object
      description: Static endpoint to access the Device Network API family.
      properties:
        network:
          type: string
          description: Static endpoint
          enum:
          - network
          x-ms-enum:
            modelAsString: false
          readOnly: true
      required:
      - network
    Ipv4Address:
      type: object
      description: IPv4 device indicator
      properties:
        ipv4:
          type: string
          description: An IPv4 address. This may be specified as an exact address,
            or as a subnet in CIDR notation.
        port:
          type: integer
          format: int32
          description: User equipment port.
      required:
      - ipv4
      - port
    Ipv4AddressModel:
      type: object
      description: IPv4 address and port of the device
      properties:
        ipv4Address:
          $ref: '#/components/schemas/Ipv4Address'
    Ipv6Address:
      type: object
      description: IPv6 device indicator
      properties:
        ipv6:
          type: string
          description: An IPv6 address. This may be specified as an exact address,
            or as a subnet in CIDR notation.
        port:
          type: integer
          format: int32
          description: User equipment port.
      required:
      - ipv6
      - port
    Ipv6AddressModel:
      type: object
      description: IPv4 address and port of the device
      properties:
        ipv6Address:
          $ref: '#/components/schemas/Ipv6Address'
    LocationDevice:
      type: object
      description: Device information needed by operator to provide location information.
        Include exactly one of these properties to identify your device.
      properties:
        networkAccessIdentifier:
          type: string
          description: External identifier or network access identifier of the device
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
        ipv4Address:
          $ref: '#/components/schemas/Ipv4Address'
        ipv6Address:
          $ref: '#/components/schemas/Ipv6Address'
    NetworkAccessIdentifierModel:
      type: object
      description: The network access ID/external ID of the device
      properties:
        networkAccessIdentifier:
          type: string
          description: External identifier or network access identifier of the device
    NetworkIdentifier:
      type: object
      description: Identifier for the network to be queried
      properties:
        identifierType:
          type: string
          description: 'The type of identifier for the network. one of: ''IPv4'',
            ''IPv6'', ''MSISDN'', ''NetworkCode'''
        identifier:
          type: string
          description: 'The network identifier, based on the identifierType: an IPv4
            address, an IPv6 address, an MSISDN, or a Network Code.

            A Network Code may be obtained from APC documentation or from the APC
            /Network:retrieve endpoint.'
      required:
      - identifierType
      - identifier
    NetworkRetrievalResult:
      type: object
      description: The network that the device is on.
      properties:
        networkCode:
          type: string
          description: The identifier for the network. This can be used as the networkIdentifier
            for the service APIs.
          pattern: '[a-z0-9-]+$'
      required:
      - networkCode
    NumberDevice:
      type: object
      description: Device information to verify phone number. Include exactly one
        form of phone number.
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
        hashedPhoneNumber:
          type: string
          description: Hashed phone number. SHA-256 (in hexadecimal representation)
            of the mobile phone number in **E.164 format (starting with country code)**.
            Optionally prefixed with '+'.
    NumberVerificationEndpoint:
      type: object
      description: Static endpoint to access Number Verification API family
      properties:
        number:
          type: string
          description: Static endpoint
          enum:
          - number
          x-ms-enum:
            modelAsString: false
          readOnly: true
      required:
      - number
    NumberVerificationResult:
      type: object
      description: Response verifying number of device
      properties:
        verificationResult:
          type: boolean
          description: True if number if the phone number matches the device, False
            otherwise
      required:
      - verificationResult
    NumberVerificationWithCodeContent:
      type: object
      description: Request to verify number of device - second call
      properties:
        apcCode:
          type: string
          description: The code provided by APC in exchange for the operator code.
      required:
      - apcCode
    NumberVerificationWithoutCodeContent:
      type: object
      description: Request to verify number of device - first call
      properties:
        networkIdentifier:
          $ref: '#/components/schemas/NetworkIdentifier'
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
        hashedPhoneNumber:
          type: string
          description: Hashed phone number. SHA-256 (in hexadecimal representation)
            of the mobile phone number in **E.164 format (starting with country code)**.
            Optionally prefixed with '+'.
        redirectUri:
          type: string
          format: uri
          description: Redirect URI to backend application.
      required:
      - networkIdentifier
      - redirectUri
    PhoneNumberModel:
      type: object
      description: The phone number of the device.
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
    SimSwapDevice:
      type: object
      description: Device information needed by operator to find sim swap information.
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
    SimSwapEndpoint:
      type: object
      description: Static endpoint to access the Sim Swap API family
      properties:
        simSwap:
          type: string
          description: Static endpoint
          enum:
          - sim-swap
          x-ms-enum:
            modelAsString: false
          readOnly: true
      required:
      - simSwap
    SimSwapRetrievalContent:
      type: object
      description: Request to retrieve SimSwap date
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
        networkIdentifier:
          $ref: '#/components/schemas/NetworkIdentifier'
      required:
      - networkIdentifier
    SimSwapRetrievalResult:
      type: object
      description: Response with SimSwap date
      properties:
        date:
          type: string
          format: date-time
          description: Datetime of most recent swap for SIM
    SimSwapVerificationContent:
      type: object
      description: Request to verify SimSwap in period
      properties:
        phoneNumber:
          type: string
          description: Phone number in E.164 format (starting with country code),
            and optionally prefixed with '+'
          pattern: ^\+?[0-9]{5,15}$
        maxAgeHours:
          type: integer
          format: int32
          description: Maximum lookback for SimSwap verification
          default: 240
          minimum: 1
          maximum: 2400
        networkIdentifier:
          $ref: '#/components/schemas/NetworkIdentifier'
      required:
      - networkIdentifier
    SimSwapVerificationResult:
      type: object
      description: Response verifying SimSwap in period
      properties:
        verificationResult:
          type: boolean
          description: True if the SIM has swapped in the specified period, False
            otherwise
      required:
      - verificationResult
