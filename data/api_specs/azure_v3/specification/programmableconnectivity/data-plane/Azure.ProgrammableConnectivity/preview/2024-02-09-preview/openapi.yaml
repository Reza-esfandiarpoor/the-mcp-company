openapi: 3.0.0
info:
  title: Programmable Connectivity
  version: 2024-02-09-preview
  description: Azure Programmable Connectivity (APC) provides a unified interface
    to the Network APIs of multiple Telecom Operators. Note that Operators may deprecate
    a Network API with less advance notice than the Azure standard, in which case
    APC will also deprecate that Network API.
  x-typespec-generated:
  - emitter: '@azure-tools/typespec-autorest'
security:
- OAuth2Auth:
  - https://management.azure.com//.default
tags: []
paths:
  /device-location/location:verify:
    post:
      operationId: DeviceLocation_Verify
      description: Verifies whether a device is within a specified location area,
        defined as an accuracy (radius) around a point, specified by longitude and
        latitude.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLocationVerificationContent'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLocationVerificationResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /device-network/network:retrieve:
    post:
      operationId: DeviceNetwork_Retrieve
      description: Retrieves the network a given device is on. Returns network in
        a networkCode format that can be used for other APIs.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkIdentifier'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkRetrievalResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /number-verification/number:verify:
    post:
      operationId: NumberVerification_VerifyWithoutCode
      description: Verifies the phone number (MSISDN) associated with a device. As
        part of the frontend authorization flow, the device is redirected to the operator
        network to authenticate directly.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberVerificationWithoutCodeContent'
        description: Body parameter.
        required: true
      responses:
        '302':
          description: Redirection
          headers:
            location:
              description: The URI of the network's authorization endpoint, which
                should be followed by the front-end application.
              schema:
                type: string
                format: uri
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /sim-swap/sim-swap:retrieve:
    post:
      operationId: SimSwap_Retrieve
      description: Provides timestamp of latest SIM swap
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimSwapRetrievalContent'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimSwapRetrievalResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /sim-swap/sim-swap:verify:
    post:
      operationId: SimSwap_Verify
      description: Verifies if a SIM swap has been performed during a past period
        (defined in the request with 'maxAgeHours' attribute). Returns 'True' if a
        SIM swap has occured.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      - $ref: '#/components/parameters/ApcGatewayIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimSwapVerificationContent'
        description: Body parameter.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
            x-ms-request-id:
              description: An opaque, globally-unique, server-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimSwapVerificationResult'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
