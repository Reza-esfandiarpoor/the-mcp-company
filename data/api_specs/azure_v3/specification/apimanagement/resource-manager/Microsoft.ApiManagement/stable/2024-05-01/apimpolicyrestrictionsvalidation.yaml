info:
  title: ApiManagementClient
  description: REST API for performing policy restrictions on any created/updated
    policies in an Azure API Management deployment.
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
