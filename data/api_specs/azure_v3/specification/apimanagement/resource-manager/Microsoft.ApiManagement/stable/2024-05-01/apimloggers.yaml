          name | filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith,
          endswith |</br>| description | filter | ge, le, eq, ne, gt, lt | substringof,
          contains, startswith, endswith |</br>| loggerType | filter | eq |     |</br>|
