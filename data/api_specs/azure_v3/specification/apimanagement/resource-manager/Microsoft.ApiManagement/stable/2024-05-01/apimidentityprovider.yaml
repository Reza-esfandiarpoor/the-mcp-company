openapi: 3.0.0
info:
  title: ApiManagementClient
  description: Use these REST APIs for performing operations on Identity Provider
    entity associated with your Azure API Management deployment. Setting up an external
    Identity Provider for authentication can help you manage the developer portal
    logins using the OAuth2 flow.
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ApiManagement/service/{serviceName}/identityProviders
  : get:
      tags:
      - IdentityProvider
      operationId: IdentityProvider_ListByService
      description: Lists a collection of Identity Provider configured in the specified
        service instance.
      externalDocs:
        url: https://docs.microsoft.com/en-us/azure/api-management/api-management-howto-aad#how-to-authorize-developer-accounts-using-azure-active-directory
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serviceName
        in: path
        required: true
        description: The name of the API Management service.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lists a collection of Identity Providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - facebook
                              - google
                              - microsoft
                              - twitter
                              - aad
                              - aadB2C
                              x-ms-enum:
                                name: IdentityProviderType
                                modelAsString: true
                                values:
                                - value: facebook
                                  description: Facebook as Identity provider.
                                - value: google
                                  description: Google as Identity provider.
                                - value: microsoft
                                  description: Microsoft Live as Identity provider.
                                - value: twitter
                                  description: Twitter as Identity provider.
                                - value: aad
                                  description: Azure Active Directory as Identity
                                    provider.
                                - value: aadB2C
                                  description: Azure Active Directory B2C as Identity
                                    provider.
                              description: Identity Provider Type identifier.
                            signinTenant:
                              type: string
                              description: The TenantId to use instead of Common when
                                logging into Active Directory
                            allowedTenants:
                              type: array
                              items:
                                type: string
                              maxItems: 32
                              description: List of Allowed Tenants when configuring
                                Azure Active Directory login.
                            authority:
                              type: string
                              description: OpenID Connect discovery endpoint hostname
                                for AAD or AAD B2C.
                            signupPolicyName:
                              type: string
                              description: Signup Policy Name. Only applies to AAD
                                B2C Identity Provider.
                              minLength: 1
                            signinPolicyName:
                              type: string
                              description: Signin Policy Name. Only applies to AAD
                                B2C Identity Provider.
                              minLength: 1
                            profileEditingPolicyName:
                              type: string
                              description: Profile Editing Policy Name. Only applies
                                to AAD B2C Identity Provider.
                              minLength: 1
                            passwordResetPolicyName:
                              type: string
                              description: Password Reset Policy Name. Only applies
                                to AAD B2C Identity Provider.
                              minLength: 1
                            clientLibrary:
                              type: string
                              description: The client library to be used in the developer
                                portal. Only applies to AAD and AAD B2C Identity Provider.
                              minLength: 0
                              maxLength: 16
                            clientId:
                              type: string
                              description: Client Id of the Application in the external
                                Identity Provider. It is App ID for Facebook login,
                                Client ID for Google login, App ID for Microsoft.
                              minLength: 1
                            clientSecret:
                              x-ms-secret: true
                              type: string
                              description: Client secret of the Application in external
                                Identity Provider, used to authenticate login request.
                                For example, it is App Secret for Facebook login,
                                API Key for Google login, Public Key for Microsoft.
                                This property will not be filled on 'GET' operations!
                                Use '/listSecrets' POST request to get the value.
                              minLength: 1
                          description: Identity Provider Base Parameter Properties.
                          required:
                          - clientId
                          x-ms-client-flatten: true
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                    description: Identity Provider configuration values.
                  count:
                    type: integer
                    format: int64
                    description: Total record count number across all pages.
                  nextLink:
                    type: string
                    description: Next page link if any.
                description: List of all the Identity Providers configured on the
                  service instance.
