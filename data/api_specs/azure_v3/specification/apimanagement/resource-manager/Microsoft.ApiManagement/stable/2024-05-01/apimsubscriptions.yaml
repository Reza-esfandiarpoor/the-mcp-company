openapi: 3.0.0
info:
  title: ApiManagementClient
  description: "Use these REST APIs for performing operations on Subscription entity\
    \ associated with your Azure API Management deployment. The Subscription entity\
    \ represents the association between a user and a product in API Management. Products\
    \ contain one or more APIs, and once a product is published, developers can subscribe\
    \ to the product and begin to use the product\u2019s APIs."
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ApiManagement/service/{serviceName}/subscriptions
  : get:
      tags:
      - Subscription
      operationId: Subscription_List
      description: Lists all subscriptions of the API Management service instance.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serviceName
        in: path
        required: true
        description: The name of the API Management service.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      - name: $filter
        in: query
        required: false
        description: '|     Field     |     Usage     |     Supported operators     |     Supported
          functions     |</br>|-------------|-------------|-------------|-------------|</br>|
          name | filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith,
          endswith |</br>| displayName | filter | ge, le, eq, ne, gt, lt | substringof,
          contains, startswith, endswith |</br>| stateComment | filter | ge, le, eq,
          ne, gt, lt | substringof, contains, startswith, endswith |</br>| ownerId
          | filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith, endswith
          |</br>| scope | filter | ge, le, eq, ne, gt, lt | substringof, contains,
          startswith, endswith |</br>| userId | filter | ge, le, eq, ne, gt, lt |
          substringof, contains, startswith, endswith |</br>| productId | filter |
          ge, le, eq, ne, gt, lt | substringof, contains, startswith, endswith |</br>|
          state | filter | eq |     |</br>| user | expand |     |     |</br>'
        schema:
          type: string
      - name: $top
        in: query
        required: false
        description: Number of records to return.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: $skip
        in: query
        required: false
        description: Number of records to skip.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A collection of the Subscription entities for the specified
            API Management service instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          x-ms-client-flatten: true
                          description: Subscription contract properties.
                          type: object
                          properties:
                            ownerId:
                              type: string
                              description: The user resource identifier of the subscription
                                owner. The value is a valid relative URL in the format
                                of /users/{userId} where {userId} is a user identifier.
                            scope:
                              type: string
                              description: Scope like /products/{productId} or /apis
                                or /apis/{apiId}.
                            displayName:
                              type: string
                              description: The name of the subscription, or null if
                                the subscription has no name.
                              minLength: 0
                              maxLength: 100
                            state:
                              type: string
                              description: "Subscription state. Possible states are\
                                \ * active \u2013 the subscription is active, * suspended\
                                \ \u2013 the subscription is blocked, and the subscriber\
                                \ cannot call any APIs of the product, * submitted\
                                \ \u2013 the subscription request has been made by\
                                \ the developer, but has not yet been approved or\
                                \ rejected, * rejected \u2013 the subscription request\
                                \ has been denied by an administrator, * cancelled\
                                \ \u2013 the subscription has been cancelled by the\
                                \ developer or administrator, * expired \u2013 the\
                                \ subscription reached its expiration date and was\
                                \ deactivated."
                              enum:
                              - suspended
                              - active
                              - expired
                              - submitted
                              - rejected
                              - cancelled
                              x-ms-enum:
                                name: SubscriptionState
                                modelAsString: false
                            createdDate:
                              type: string
                              format: date-time
                              description: 'Subscription creation date. The date conforms
                                to the following format: `yyyy-MM-ddTHH:mm:ssZ` as
                                specified by the ISO 8601 standard.

                                '
                              readOnly: true
                            startDate:
                              type: string
                              format: date-time
                              description: 'Subscription activation date. The setting
                                is for audit purposes only and the subscription is
                                not automatically activated. The subscription lifecycle
                                can be managed by using the `state` property. The
                                date conforms to the following format: `yyyy-MM-ddTHH:mm:ssZ`
                                as specified by the ISO 8601 standard.

                                '
                            expirationDate:
                              type: string
                              format: date-time
                              description: 'Subscription expiration date. The setting
                                is for audit purposes only and the subscription is
                                not automatically expired. The subscription lifecycle
                                can be managed by using the `state` property. The
                                date conforms to the following format: `yyyy-MM-ddTHH:mm:ssZ`
                                as specified by the ISO 8601 standard.

                                '
                            endDate:
                              type: string
                              format: date-time
                              description: 'Date when subscription was cancelled or
                                expired. The setting is for audit purposes only and
                                the subscription is not automatically cancelled. The
                                subscription lifecycle can be managed by using the
                                `state` property. The date conforms to the following
                                format: `yyyy-MM-ddTHH:mm:ssZ` as specified by the
                                ISO 8601 standard.

                                '
                            notificationDate:
                              type: string
                              format: date-time
                              description: 'Upcoming subscription expiration notification
                                date. The date conforms to the following format: `yyyy-MM-ddTHH:mm:ssZ`
                                as specified by the ISO 8601 standard.

                                '
                            primaryKey:
                              x-ms-secret: true
                              type: string
                              description: Subscription primary key. This property
                                will not be filled on 'GET' operations! Use '/listSecrets'
                                POST request to get the value.
                              minLength: 1
                              maxLength: 256
                            secondaryKey:
                              x-ms-secret: true
                              type: string
                              description: Subscription secondary key. This property
                                will not be filled on 'GET' operations! Use '/listSecrets'
                                POST request to get the value.
                              minLength: 1
                              maxLength: 256
                            stateComment:
                              type: string
                              description: Optional subscription comment added by
                                an administrator when the state is changed to the
                                'rejected'.
                            allowTracing:
                              type: boolean
                              description: Determines whether tracing is enabled
                              x-apim-code-nillable: true
                          required:
                          - scope
                          - state
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                    description: Page values.
                  count:
                    type: integer
                    format: int64
                    description: Total record count number across all pages.
                  nextLink:
                    type: string
                    description: Next page link if any.
                description: Paged Subscriptions list representation.
