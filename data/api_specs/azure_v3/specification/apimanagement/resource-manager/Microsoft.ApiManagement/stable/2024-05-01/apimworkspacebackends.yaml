                                      description: The client certificate id for the
                                        management endpoint.
                                      type: string
                                    clientCertificatethumbprint:
                                      description: The client certificate thumbprint
                                        for the management endpoint. Will be ignored
                                        if certificatesIds are provided
                                      type: string
