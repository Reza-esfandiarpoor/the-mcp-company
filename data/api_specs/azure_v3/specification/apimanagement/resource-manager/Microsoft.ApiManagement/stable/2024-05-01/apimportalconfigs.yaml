                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          x-ms-client-flatten: true
                          description: The developer portal configuration contract
                            properties.
                          type: object
                          properties:
                            enableBasicAuth:
                              type: boolean
                              description: Enable or disable Basic authentication
                                method.
                              default: true
                            signin:
                              type: object
                              properties:
                                require:
                                  type: boolean
                                  description: Redirect anonymous users to the sign-in
                                    page.
                                  default: false
                            signup:
                              type: object
                              properties:
                                termsOfService:
                                  type: object
                                  description: Terms of service settings.
                                  properties:
                                    text:
                                      type: string
                                      description: A terms of service text.
                                    requireConsent:
                                      type: boolean
                                      description: Ask user for consent to the terms
                                        of service.
                                      default: false
                            delegation:
                              type: object
                              description: The developer portal delegation settings.
                              properties:
                                delegateRegistration:
                                  type: boolean
                                  description: Enable or disable delegation for user
                                    registration.
                                  default: false
                                delegateSubscription:
                                  type: boolean
                                  description: Enable or disable delegation for product
                                    subscriptions.
                                  default: false
                                delegationUrl:
                                  type: string
                                  description: A delegation endpoint URL.
                                validationKey:
                                  x-ms-secret: true
                                  type: string
                                  description: A base64-encoded validation key to
                                    ensure requests originate from Azure API Management
                                    service.
                            cors:
                              type: object
                              description: The developer portal Cross-Origin Resource
                                Sharing (CORS) settings.
                              properties:
                                allowedOrigins:
                                  type: array
                                  items:
                                    type: string
                                  description: Allowed origins, e.g. `https://trusted.com`.
                            csp:
                              type: object
                              description: The developer portal Content Security Policy
                                (CSP) settings.
                              properties:
                                mode:
                                  type: string
                                  description: The mode of the developer portal Content
                                    Security Policy (CSP).
                                  enum:
                                  - enabled
                                  - disabled
                                  - reportOnly
                                  default: disabled
                                  x-ms-enum:
                                    modelAsString: true
                                    name: PortalSettingsCspMode
                                    values:
                                    - value: enabled
                                      description: The browser will block requests
                                        not matching allowed origins.
                                    - value: disabled
                                      description: The browser will not apply the
                                        origin restrictions.
                                    - value: reportOnly
                                      description: The browser will report requests
                                        not matching allowed origins without blocking
                                        them.
                                reportUri:
                                  type: array
                                  items:
                                    type: string
                                  description: The URLs used by the browser to report
                                    CSP violations.
                                allowedSources:
                                  type: array
                                  items:
                                    type: string
                                  description: Allowed sources, e.g. `*.trusted.com`,
                                    `trusted.com`, `https://`.
