openapi: 3.0.0
info:
  title: ApiManagementClient
  description: "Use these REST APIs for performing operations on Product entity associated\
    \ with your Azure API Management deployment. The Product entity represents a product\
    \ in API Management. Products include one or more APIs and their associated terms\
    \ of use. Once a product is published, developers can subscribe to the product\
    \ and begin to use the product\u2019s APIs."
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ApiManagement/service/{serviceName}/products
  : get:
      tags:
      - Product
      operationId: Product_ListByService
      description: Lists a collection of products in the specified service instance.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serviceName
        in: path
        required: true
        description: The name of the API Management service.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      - name: $filter
        in: query
        required: false
        description: '|     Field     |     Usage     |     Supported operators     |     Supported
          functions     |</br>|-------------|-------------|-------------|-------------|</br>|
          name | filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith,
          endswith |</br>| displayName | filter | ge, le, eq, ne, gt, lt | substringof,
          contains, startswith, endswith |</br>| description | filter | ge, le, eq,
          ne, gt, lt | substringof, contains, startswith, endswith |</br>| terms |
          filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith, endswith
          |</br>| state | filter | eq |     |</br>| groups | expand |     |     |</br>'
        schema:
          type: string
      - name: $top
        in: query
        required: false
        description: Number of records to return.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: $skip
        in: query
        required: false
        description: Number of records to skip.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: expandGroups
        in: query
        required: false
        description: When set to true, the response contains an array of groups that
          have visibility to the product. The default is false.
        schema:
          type: boolean
      - name: tags
        in: query
        required: false
        description: Products which are part of a specific tag.
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A Collection of the Product entities for the specified API
            Management service instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          type: object
                          properties:
                            description:
                              type: string
                              description: Product description. May include HTML formatting
                                tags.
                              minLength: 0
                              maxLength: 1000
                            terms:
                              type: string
                              description: Product terms of use. Developers trying
                                to subscribe to the product will be presented and
                                required to accept these terms before they can complete
                                the subscription process.
                            subscriptionRequired:
                              description: Whether a product subscription is required
                                for accessing APIs included in this product. If true,
                                the product is referred to as "protected" and a valid
                                subscription key is required for a request to an API
                                included in the product to succeed. If false, the
                                product is referred to as "open" and requests to an
                                API included in the product can be made without a
                                subscription key. If property is omitted when creating
                                a new product it's value is assumed to be true.
                              type: boolean
                            approvalRequired:
                              description: "whether subscription approval is required.\
                                \ If false, new subscriptions will be approved automatically\
                                \ enabling developers to call the product\u2019s APIs\
                                \ immediately after subscribing. If true, administrators\
                                \ must manually approve the subscription before the\
                                \ developer can any of the product\u2019s APIs. Can\
                                \ be present only if subscriptionRequired property\
                                \ is present and has a value of false."
                              type: boolean
                            subscriptionsLimit:
                              type: integer
                              format: int32
                              description: Whether the number of subscriptions a user
                                can have to this product at the same time. Set to
                                null or omit to allow unlimited per user subscriptions.
                                Can be present only if subscriptionRequired property
                                is present and has a value of false.
                            state:
                              type: string
                              description: whether product is published or not. Published
                                products are discoverable by users of developer portal.
                                Non published products are visible only to administrators.
                                Default state of Product is notPublished.
                              enum:
                              - notPublished
                              - published
                              x-ms-enum:
                                name: ProductState
                                modelAsString: false
                            displayName:
                              type: string
                              description: Product name.
                              minLength: 1
                              maxLength: 300
                          description: Product Entity Base Parameters
                          required:
                          - displayName
                          x-ms-client-flatten: true
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                    description: Page values.
                  count:
                    type: integer
                    format: int64
                    description: Total record count number across all pages.
                  nextLink:
                    type: string
                    description: Next page link if any.
                description: Paged Products list representation.
