                          type: integer
                          format: int64
                          description: Bandwidth consumed.
                        cacheHitCount:
                          type: integer
                          format: int32
                          description: Number of times when content was served from
                            cache policy.
                        cacheMissCount:
                          type: integer
                          format: int32
                          description: Number of times content was fetched from backend.
