        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lists a collection of Report record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name depending on report endpoint specifies
                            product, API, operation or developer name.
                        timestamp:
                          type: string
                          format: date-time
                          description: 'Start of aggregation period. The date conforms
                            to the following format: `yyyy-MM-ddTHH:mm:ssZ` as specified
                            by the ISO 8601 standard.

                            '
                        interval:
                          type: string
                          description: Length of aggregation period.  Interval must
                            be multiple of 15 minutes and may not be zero. The value
                            should be in ISO 8601 format (http://en.wikipedia.org/wiki/ISO_8601#Durations).
                        country:
                          type: string
                          description: Country to which this record data is related.
                        region:
                          type: string
                          description: Country region to which this record data is
                            related.
                        zip:
                          type: string
                          description: Zip code to which this record data is related.
                        userId:
                          readOnly: true
                          type: string
                          description: User identifier path. /users/{userId}
                        productId:
                          readOnly: true
                          type: string
                          description: Product identifier path. /products/{productId}
                        apiId:
                          type: string
                          description: API identifier path. /apis/{apiId}
                        operationId:
                          type: string
                          description: Operation identifier path. /apis/{apiId}/operations/{operationId}
                        apiRegion:
                          type: string
                          description: API region identifier.
                        subscriptionId:
                          type: string
                          description: Subscription identifier path. /subscriptions/{subscriptionId}
                        callCountSuccess:
                          type: integer
                          format: int32
                          description: Number of successful calls. This includes calls
                            returning HttpStatusCode <= 301 and HttpStatusCode.NotModified
                            and HttpStatusCode.TemporaryRedirect
                        callCountBlocked:
                          type: integer
                          format: int32
                          description: Number of calls blocked due to invalid credentials.
                            This includes calls returning HttpStatusCode.Unauthorized
                            and HttpStatusCode.Forbidden and HttpStatusCode.TooManyRequests
