                          type: number
                          format: double
                          description: Average time it took to process request.
                        apiTimeMin:
                          type: number
                          format: double
                          description: Minimum time it took to process request.
                        apiTimeMax:
                          type: number
                          format: double
                          description: Maximum time it took to process request.
                        serviceTimeAvg:
                          type: number
                          format: double
                          description: Average time it took to process request on
                            backend.
                        serviceTimeMin:
                          type: number
                          format: double
                          description: Minimum time it took to process request on
                            backend.
                        serviceTimeMax:
                          type: number
                          format: double
                          description: Maximum time it took to process request on
                            backend.
