openapi: 3.0.0
info:
  title: ApiManagementClient
  description: Use these REST APIs to get the analytics reports associated with your
    Azure API Management deployment.
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ApiManagement/service/{serviceName}/reports/byApi
  : get:
