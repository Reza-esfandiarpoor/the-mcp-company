openapi: 3.0.0
info:
  title: ApiManagementClient
  description: Use these REST APIs for performing operations on User entity in Azure
    API Management deployment. The User entity in API Management represents the developers
    that call the APIs of the products to which they are subscribed.
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ApiManagement/service/{serviceName}/users
  : get:
      tags:
      - User
      operationId: User_ListByService
      description: Lists a collection of registered users in the specified service
        instance.
      parameters:
      - name: resourceGroupName
        in: path
        description: The name of the resource group. The name is case insensitive.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 90
      - name: serviceName
        in: path
        required: true
        description: The name of the API Management service.
        x-ms-parameter-location: method
        schema:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      - name: $filter
        in: query
        required: false
        description: '|     Field     |     Usage     |     Supported operators     |     Supported
          functions     |</br>|-------------|-------------|-------------|-------------|</br>|
          name | filter | ge, le, eq, ne, gt, lt | substringof, contains, startswith,
          endswith |</br>| firstName | filter | ge, le, eq, ne, gt, lt | substringof,
          contains, startswith, endswith |</br>| lastName | filter | ge, le, eq, ne,
          gt, lt | substringof, contains, startswith, endswith |</br>| email | filter
          | ge, le, eq, ne, gt, lt | substringof, contains, startswith, endswith |</br>|
          state | filter | eq |     |</br>| registrationDate | filter | ge, le, eq,
          ne, gt, lt |     |</br>| note | filter | ge, le, eq, ne, gt, lt | substringof,
          contains, startswith, endswith |</br>| groups | expand |     |     |</br>'
        schema:
          type: string
      - name: $top
        in: query
        required: false
        description: Number of records to return.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: $skip
        in: query
        required: false
        description: Number of records to skip.
        x-ms-parameter-location: method
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: expandGroups
        in: query
        description: Detailed Group in response.
        schema:
          type: boolean
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lists a collection of User entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          readOnly: true
                          type: string
                          description: Fully qualified resource ID for the resource.
                            Ex - /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}
                        name:
                          readOnly: true
                          type: string
                          description: The name of the resource
                        type:
                          readOnly: true
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                        properties:
                          type: object
                          properties:
                            state:
                              type: string
                              description: Account state. Specifies whether the user
                                is active or not. Blocked users are unable to sign
                                into the developer portal or call any APIs of subscribed
                                products. Default state is Active.
                              enum:
                              - active
                              - blocked
                              - pending
                              - deleted
                              default: active
                              x-ms-enum:
                                name: UserState
                                modelAsString: true
                                values:
                                - value: active
                                  description: User state is active.
                                - value: blocked
                                  description: User is blocked. Blocked users cannot
                                    authenticate at developer portal or call API.
                                - value: pending
                                  description: User account is pending. Requires identity
                                    confirmation before it can be made active.
                                - value: deleted
                                  description: User account is closed. All identities
                                    and related entities are removed.
                            note:
                              type: string
                              description: Optional note about a user set by the administrator.
                            identities:
                              type: array
                              items:
                                type: object
                                properties:
                                  provider:
                                    type: string
                                    description: Identity provider name.
                                  id:
                                    type: string
                                    description: Identifier value within provider.
                                description: User identity details.
                              description: Collection of user identities.
                            firstName:
                              type: string
                              description: First name.
                            lastName:
                              type: string
                              description: Last name.
                            email:
                              type: string
                              description: Email address.
                            registrationDate:
                              type: string
                              format: date-time
                              description: 'Date of user registration. The date conforms
                                to the following format: `yyyy-MM-ddTHH:mm:ssZ` as
                                specified by the ISO 8601 standard.

                                '
                            groups:
                              readOnly: true
                              type: array
                              items:
                                type: object
                                properties:
                                  displayName:
                                    type: string
                                    description: Group name.
                                    maxLength: 300
                                    minLength: 1
                                  description:
                                    type: string
                                    description: Group description. Can contain HTML
                                      formatting tags.
                                    maxLength: 1000
                                  builtIn:
                                    readOnly: true
                                    type: boolean
                                    description: true if the group is one of the three
                                      system groups (Administrators, Developers, or
                                      Guests); otherwise false.
                                  type:
                                    type: string
                                    description: Group type.
                                    enum:
                                    - custom
                                    - system
                                    - external
                                    x-ms-enum:
                                      name: GroupType
                                      modelAsString: false
                                  externalId:
                                    type: string
                                    description: For external groups, this property
                                      contains the id of the group from the external
                                      identity provider, e.g. for Azure Active Directory
                                      `aad://<tenant>.onmicrosoft.com/groups/<group
                                      object id>`; otherwise the value is null.
                                required:
                                - displayName
                                description: Group contract Properties.
                              x-ms-identifiers:
                              - displayName
                              description: Collection of groups user is part of.
                          description: User Entity Base Parameters set.
                          x-ms-client-flatten: true
                      title: Resource
                      description: Common fields that are returned in the response
                        for all Azure Resource Manager resources
                      x-ms-azure-resource: true
                    description: Page values.
                  count:
                    type: integer
                    format: int64
                    description: Total record count number across all pages.
