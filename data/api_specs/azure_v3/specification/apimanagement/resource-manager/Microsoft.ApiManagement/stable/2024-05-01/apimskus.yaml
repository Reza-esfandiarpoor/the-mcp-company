          description: OK
          content:
            application/json:
              schema:
                properties:
                  value:
                    type: array
                    items:
                      properties:
                        resourceType:
                          readOnly: true
                          type: string
                          description: The type of resource the SKU applies to.
                        name:
                          readOnly: true
                          type: string
                          description: The name of SKU.
                        tier:
                          readOnly: true
                          type: string
