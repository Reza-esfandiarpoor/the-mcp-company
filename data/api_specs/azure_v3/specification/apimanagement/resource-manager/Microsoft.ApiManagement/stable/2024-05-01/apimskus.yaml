                          readOnly: true
                          type: string
                          description: The Size of the SKU.
                        family:
                          readOnly: true
                          type: string
                          description: The Family of this particular SKU.
                        kind:
                          readOnly: true
                          type: string
                          description: The Kind of resources that are supported in
                            this SKU.
                        capacity:
                          readOnly: true
                          description: Specifies the number of virtual machines in
                            the scale set.
                          properties:
                            minimum:
                              type: integer
                              readOnly: true
                              format: int32
                              description: The minimum capacity.
                            maximum:
                              type: integer
                              readOnly: true
                              format: int32
                              description: The maximum capacity that can be set.
                            default:
                              type: integer
                              readOnly: true
                              format: int32
                              description: The default capacity.
                            scaleType:
                              type: string
                              readOnly: true
                              description: The scale type applicable to the sku.
                              enum:
                              - Automatic
                              - Manual
                              - None
                              x-ms-enum:
                                name: ApiManagementSkuCapacityScaleType
                                modelAsString: false
                        locations:
                          type: array
                          readOnly: true
                          items:
                            type: string
