openapi: 3.0.0
info:
  title: ApiManagementClient
  description: SKUs available for Microsoft.ApiManagement
  version: 2024-05-01
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.ApiManagement/skus:
    get:
      tags:
      - Skus
      operationId: ApiManagementSkus_List
      description: Gets the list of Microsoft.ApiManagement SKUs available for your
        Subscription.
      parameters:
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
