            name: TriggerType
            modelAsString: true
        replicaTimeout:
          description: Maximum number of seconds a replica is allowed to run.
          format: int32
          type: integer
        replicaRetryLimit:
          format: int32
          description: Maximum number of retries before failing the job.
          type: integer
        manualTriggerConfig:
          type: object
          description: Manual trigger configuration for a single execution job. Properties
            replicaCompletionCount and parallelism would be set to 1 by default
          properties:
            replicaCompletionCount:
              description: Minimum number of successful replica completions before
                overall job completion.
              format: int32
              type: integer
            parallelism:
              description: Number of parallel replicas of a job that can run at a
                given time.
              format: int32
              type: integer
        scheduleTriggerConfig:
          description: Cron formatted repeating trigger schedule ("* * * * *") for
            cronjobs. Properties completions and parallelism would be set to 1 by
            default
          required:
          - cronExpression
          type: object
          properties:
            replicaCompletionCount:
              description: Minimum number of successful replica completions before
                overall job completion.
              format: int32
              type: integer
            cronExpression:
              description: Cron formatted repeating schedule ("* * * * *") of a Cron
                Job.
              type: string
            parallelism:
              description: Number of parallel replicas of a job that can run at a
                given time.
              format: int32
              type: integer
        eventTriggerConfig:
          type: object
          description: Trigger configuration of an event driven job.
          properties:
            replicaCompletionCount:
              description: Minimum number of successful replica completions before
                overall job completion.
              format: int32
              type: integer
            parallelism:
              description: Number of parallel replicas of a job that can run at a
                given time.
              format: int32
              type: integer
            scale:
              description: Scaling configurations for event driven jobs.
              type: object
              properties:
                pollingInterval:
                  description: Interval to check each event source in seconds. Defaults
                    to 30s
                  format: int32
                  type: integer
                minExecutions:
                  format: int32
                  description: Minimum number of job executions that are created for
                    a trigger, default 0
                  type: integer
                  default: 0
                maxExecutions:
                  format: int32
                  description: Maximum number of job executions that are created for
                    a trigger, default 100.
                  type: integer
                  default: 100
                rules:
                  description: Scaling rules.
                  type: array
                  items:
                    description: Scaling rule.
                    type: object
                    properties:
                      name:
                        description: Scale Rule Name
                        type: string
                      type:
                        description: 'Type of the scale rule

