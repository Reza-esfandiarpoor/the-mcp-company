openapi: 3.0.0
info:
  version: 2025-01-01
  title: ContainerApps API Client
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.App/jobs:
    get:
      tags:
      - Jobs
      summary: Get the Container Apps Jobs in a given subscription.
      operationId: Jobs_ListBySubscription
      parameters:
      - name: subscriptionId
        in: path
        description: The ID of the target subscription.
        required: true
        schema:
          type: string
          minLength: 1
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Container Apps Jobs collection ARM resource.
                required:
                - value
                type: object
                properties:
                  value:
                    description: Collection of resources.
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: arm-id
                          description: Fully qualified resource ID for the resource.
                            E.g. "/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/{resourceProviderNamespace}/{resourceType}/{resourceName}"
                          readOnly: true
                        name:
                          type: string
                          description: The name of the resource
                          readOnly: true
                        type:
                          type: string
                          description: The type of the resource. E.g. "Microsoft.Compute/virtualMachines"
                            or "Microsoft.Storage/storageAccounts"
                          readOnly: true
                        systemData:
                          description: Azure Resource Manager metadata containing
                            createdBy and modifiedBy information.
                          readOnly: true
                          type: object
                          properties:
                            createdBy:
                              type: string
                              description: The identity that created the resource.
                            createdByType:
                              type: string
                              description: The type of identity that created the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            createdAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource creation (UTC).
                            lastModifiedBy:
                              type: string
                              description: The identity that last modified the resource.
                            lastModifiedByType:
                              type: string
                              description: The type of identity that last modified
                                the resource.
                              enum:
                              - User
                              - Application
                              - ManagedIdentity
                              - Key
                              x-ms-enum:
                                name: createdByType
                                modelAsString: true
                            lastModifiedAt:
                              type: string
                              format: date-time
                              description: The timestamp of resource last modification
                                (UTC)
                        tags:
                          type: object
                          description: Resource tags.
                          additionalProperties:
                            type: string
                          x-ms-mutability:
                          - read
                          - create
                          - update
                        location:
                          type: string
                          description: The geo-location where the resource lives
                          x-ms-mutability:
                          - read
                          - create
                        identity:
                          description: Managed identities needed by a container app
                            job to interact with other Azure services to not maintain
                            any secrets or credentials in code.
                          type: object
                          properties:
                            principalId:
                              type: string
                              format: uuid
                              description: The service principal ID of the system
                                assigned identity. This property will only be provided
                                for a system assigned identity.
                              readOnly: true
                            tenantId:
                              type: string
                              format: uuid
                              description: The tenant ID of the system assigned identity.
                                This property will only be provided for a system assigned
                                identity.
                              readOnly: true
                            type:
                              type: string
                              description: Type of managed service identity (where
                                both SystemAssigned and UserAssigned types are allowed).
                              enum:
                              - None
                              - SystemAssigned
                              - UserAssigned
                              - SystemAssigned,UserAssigned
                              x-ms-enum:
                                name: ManagedServiceIdentityType
                                modelAsString: true
                            userAssignedIdentities:
                              type: object
                              title: User-Assigned Identities
                              description: 'The set of user assigned identities associated
                                with the resource. The userAssignedIdentities dictionary
                                keys will be ARM resource ids in the form: ''/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identityName}.
                                The dictionary values can be empty objects ({}) in
                                requests.'
                              additionalProperties:
                                type: object
                                description: User assigned identity properties
                                properties:
                                  principalId:
                                    type: string
                                    format: uuid
                                    description: The principal ID of the assigned
                                      identity.
                                    readOnly: true
                                  clientId:
                                    type: string
                                    format: uuid
                                    description: The client ID of the assigned identity.
                                    readOnly: true
                          required:
                          - type
                        properties:
                          description: Container Apps Job resource specific properties.
                          type: object
                          properties:
                            provisioningState:
                              description: Provisioning state of the Container Apps
                                Job.
                              enum:
                              - InProgress
                              - Succeeded
                              - Failed
                              - Canceled
                              - Deleting
                              type: string
                              readOnly: true
                              x-ms-enum:
                                name: JobProvisioningState
                                modelAsString: true
                            environmentId:
                              description: Resource ID of environment.
                              type: string
                              x-ms-mutability:
                              - create
                              - read
                            workloadProfileName:
                              description: Workload profile name to pin for container
                                apps job execution.
                              type: string
                            configuration:
                              description: Container Apps Job configuration properties.
                              type: object
                              required:
                              - replicaTimeout
                              - triggerType
                              properties:
                                secrets:
                                  description: Collection of secrets used by a Container
                                    Apps Job
                                  type: array
                                  items:
                                    description: Secret definition.
                                    type: object
                                    properties:
                                      name:
                                        description: Secret Name.
                                        type: string
                                      value:
                                        description: Secret Value.
                                        type: string
                                        x-ms-mutability:
                                        - create
                                        - update
                                        x-ms-secret: true
                                      identity:
                                        description: Resource ID of a managed identity
                                          to authenticate with Azure Key Vault, or
                                          System to use a system-assigned identity.
                                        type: string
                                      keyVaultUrl:
                                        description: Azure Key Vault URL pointing
                                          to the secret referenced by the container
                                          app.
                                        type: string
                                  x-ms-identifiers:
                                  - name
                                triggerType:
                                  description: Trigger type of the job
                                  enum:
                                  - Schedule
                                  - Event
                                  - Manual
                                  type: string
                                  default: Manual
                                  x-ms-enum:
                                    name: TriggerType
                                    modelAsString: true
                                replicaTimeout:
                                  description: Maximum number of seconds a replica
                                    is allowed to run.
                                  format: int32
                                  type: integer
                                replicaRetryLimit:
                                  format: int32
                                  description: Maximum number of retries before failing
                                    the job.
                                  type: integer
                                manualTriggerConfig:
                                  type: object
                                  description: Manual trigger configuration for a
                                    single execution job. Properties replicaCompletionCount
                                    and parallelism would be set to 1 by default
                                  properties:
                                    replicaCompletionCount:
                                      description: Minimum number of successful replica
                                        completions before overall job completion.
                                      format: int32
                                      type: integer
                                    parallelism:
                                      description: Number of parallel replicas of
                                        a job that can run at a given time.
                                      format: int32
                                      type: integer
                                scheduleTriggerConfig:
                                  description: Cron formatted repeating trigger schedule
                                    ("* * * * *") for cronjobs. Properties completions
                                    and parallelism would be set to 1 by default
                                  required:
                                  - cronExpression
                                  type: object
                                  properties:
                                    replicaCompletionCount:
                                      description: Minimum number of successful replica
                                        completions before overall job completion.
                                      format: int32
                                      type: integer
                                    cronExpression:
                                      description: Cron formatted repeating schedule
                                        ("* * * * *") of a Cron Job.
                                      type: string
                                    parallelism:
                                      description: Number of parallel replicas of
                                        a job that can run at a given time.
                                      format: int32
                                      type: integer
                                eventTriggerConfig:
                                  type: object
                                  description: Trigger configuration of an event driven
                                    job.
                                  properties:
                                    replicaCompletionCount:
                                      description: Minimum number of successful replica
                                        completions before overall job completion.
                                      format: int32
                                      type: integer
                                    parallelism:
                                      description: Number of parallel replicas of
                                        a job that can run at a given time.
                                      format: int32
                                      type: integer
                                    scale:
                                      description: Scaling configurations for event
                                        driven jobs.
                                      type: object
                                      properties:
                                        pollingInterval:
                                          description: Interval to check each event
                                            source in seconds. Defaults to 30s
                                          format: int32
                                          type: integer
                                        minExecutions:
                                          format: int32
                                          description: Minimum number of job executions
                                            that are created for a trigger, default
                                            0
                                          type: integer
                                          default: 0
                                        maxExecutions:
                                          format: int32
                                          description: Maximum number of job executions
                                            that are created for a trigger, default
                                            100.
                                          type: integer
                                          default: 100
                                        rules:
                                          description: Scaling rules.
                                          type: array
                                          items:
                                            description: Scaling rule.
                                            type: object
                                            properties:
                                              name:
                                                description: Scale Rule Name
                                                type: string
                                              type:
                                                description: 'Type of the scale rule

                                                  eg: azure-servicebus, redis etc.'
                                                type: string
                                              metadata:
                                                description: Metadata properties to
                                                  describe the scale rule.
                                                type: object
                                              auth:
                                                description: Authentication secrets
                                                  for the scale rule.
                                                type: array
                                                items:
                                                  description: Auth Secrets for Scale
                                                    Rule
                                                  type: object
                                                  properties:
                                                    secretRef:
                                                      description: Name of the secret
                                                        from which to pull the auth
                                                        params.
                                                      type: string
                                                    triggerParameter:
                                                      description: Trigger Parameter
                                                        that uses the secret
                                                      type: string
                                              identity:
                                                description: The resource ID of a
                                                  user-assigned managed identity that
                                                  is assigned to the Container App,
                                                  or 'system' for system-assigned
                                                  identity.
                                                type: string
                                registries:
                                  description: Collection of private container registry
                                    credentials used by a Container apps job
                                  type: array
                                  items:
                                    description: Container App Private Registry
                                    type: object
                                    properties:
                                      server:
                                        description: Container Registry Server
                                        type: string
                                      username:
                                        description: Container Registry Username
                                        type: string
                                      passwordSecretRef:
                                        description: The name of the Secret that contains
                                          the registry login password
                                        type: string
                                      identity:
                                        description: A Managed Identity to use to
                                          authenticate with Azure Container Registry.
                                          For user-assigned identities, use the full
                                          user-assigned identity Resource ID. For
                                          system-assigned identities, use 'system'
                                        type: string
                                  x-ms-identifiers:
                                  - server
                                identitySettings:
                                  description: Optional settings for Managed Identities
                                    that are assigned to the Container App Job. If
                                    a Managed Identity is not specified here, default
                                    settings will be used.
                                  type: array
                                  items:
                                    description: Optional settings for a Managed Identity
                                      that is assigned to the Container App.
                                    type: object
                                    required:
                                    - identity
                                    properties:
                                      identity:
                                        description: The resource ID of a user-assigned
                                          managed identity that is assigned to the
                                          Container App, or 'system' for system-assigned
                                          identity.
                                        type: string
                                      lifecycle:
                                        description: Use to select the lifecycle stages
