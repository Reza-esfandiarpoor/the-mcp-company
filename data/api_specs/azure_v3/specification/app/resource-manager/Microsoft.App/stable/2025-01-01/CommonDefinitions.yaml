      type: object
      properties:
        name:
          description: Scale Rule Name
          type: string
        azureQueue:
          description: Azure Queue based scaling.
          type: object
          properties:
            accountName:
              description: Storage account name. required if using managed identity
                to authenticate
              type: string
            queueName:
              description: Queue name.
              type: string
            queueLength:
              format: int32
