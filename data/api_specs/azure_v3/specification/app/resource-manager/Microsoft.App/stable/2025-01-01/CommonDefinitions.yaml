openapi: 3.0.0
info:
  version: 2025-01-01
  title: ContainerApps API Client
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
paths: {}
components:
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    EnvironmentVar:
      description: Container App container environment variable.
      type: object
      properties:
        name:
          description: Environment variable name.
          type: string
        value:
          description: Non-secret environment variable value.
          type: string
        secretRef:
          description: Name of the Container App secret from which to pull the environment
            variable value.
          type: string
    WorkloadProfileName:
      description: Workload profile name for container apps to execute on.
      type: string
    WorkloadProfileType:
      description: Workload profile type for container apps to execute on.
      type: string
    BaseContainer:
      description: Container App base container definition.
      type: object
      properties:
        image:
          description: Container image tag.
          type: string
        name:
          description: Custom container name.
          type: string
        command:
          description: Container start command.
          type: array
          items:
            type: string
        args:
          description: Container start command arguments.
          type: array
          items:
            type: string
        env:
          description: Container environment variables.
          type: array
          items:
            description: Container App container environment variable.
            type: object
            properties:
              name:
                description: Environment variable name.
                type: string
              value:
                description: Non-secret environment variable value.
                type: string
              secretRef:
                description: Name of the Container App secret from which to pull the
                  environment variable value.
                type: string
          x-ms-identifiers:
          - name
        resources:
          description: Container resource requirements.
          type: object
          properties:
            cpu:
              format: double
              description: Required CPU in cores, e.g. 0.5
              type: number
            memory:
              description: Required memory, e.g. "250Mb"
              type: string
            ephemeralStorage:
              description: Ephemeral Storage, e.g. "1Gi"
              type: string
              readOnly: true
        volumeMounts:
          description: Container volume mounts.
          type: array
          items:
            description: Volume mount for the Container App.
            type: object
            properties:
              volumeName:
                description: This must match the Name of a Volume.
                type: string
              mountPath:
                description: Path within the container at which the volume should
                  be mounted.Must not contain ':'.
                type: string
              subPath:
                description: Path within the volume from which the container's volume
                  should be mounted. Defaults to "" (volume's root).
                type: string
          x-ms-identifiers:
          - volumeName
    InitContainer:
      type: object
      properties:
        image:
          description: Container image tag.
          type: string
        name:
          description: Custom container name.
          type: string
        command:
          description: Container start command.
          type: array
          items:
            type: string
        args:
          description: Container start command arguments.
          type: array
          items:
            type: string
        env:
          description: Container environment variables.
          type: array
          items:
            description: Container App container environment variable.
            type: object
            properties:
              name:
                description: Environment variable name.
                type: string
              value:
                description: Non-secret environment variable value.
                type: string
              secretRef:
                description: Name of the Container App secret from which to pull the
                  environment variable value.
                type: string
          x-ms-identifiers:
          - name
        resources:
          description: Container resource requirements.
          type: object
          properties:
            cpu:
              format: double
              description: Required CPU in cores, e.g. 0.5
              type: number
            memory:
              description: Required memory, e.g. "250Mb"
              type: string
            ephemeralStorage:
              description: Ephemeral Storage, e.g. "1Gi"
              type: string
              readOnly: true
        volumeMounts:
          description: Container volume mounts.
          type: array
          items:
            description: Volume mount for the Container App.
            type: object
            properties:
              volumeName:
                description: This must match the Name of a Volume.
                type: string
              mountPath:
                description: Path within the container at which the volume should
                  be mounted.Must not contain ':'.
                type: string
              subPath:
                description: Path within the volume from which the container's volume
                  should be mounted. Defaults to "" (volume's root).
                type: string
          x-ms-identifiers:
          - volumeName
      description: Container App base container definition.
    Container:
      type: object
      properties:
        image:
          description: Container image tag.
          type: string
        name:
          description: Custom container name.
          type: string
        command:
          description: Container start command.
          type: array
          items:
            type: string
        args:
          description: Container start command arguments.
          type: array
          items:
            type: string
        env:
          description: Container environment variables.
          type: array
          items:
            description: Container App container environment variable.
            type: object
            properties:
              name:
                description: Environment variable name.
                type: string
              value:
                description: Non-secret environment variable value.
                type: string
              secretRef:
                description: Name of the Container App secret from which to pull the
                  environment variable value.
                type: string
          x-ms-identifiers:
          - name
        resources:
          description: Container resource requirements.
          type: object
          properties:
            cpu:
              format: double
              description: Required CPU in cores, e.g. 0.5
              type: number
            memory:
              description: Required memory, e.g. "250Mb"
              type: string
            ephemeralStorage:
              description: Ephemeral Storage, e.g. "1Gi"
              type: string
              readOnly: true
        volumeMounts:
          description: Container volume mounts.
          type: array
          items:
            description: Volume mount for the Container App.
            type: object
            properties:
              volumeName:
                description: This must match the Name of a Volume.
                type: string
              mountPath:
                description: Path within the container at which the volume should
                  be mounted.Must not contain ':'.
                type: string
              subPath:
                description: Path within the volume from which the container's volume
                  should be mounted. Defaults to "" (volume's root).
                type: string
          x-ms-identifiers:
          - volumeName
        probes:
          description: List of probes for the container.
          type: array
          items:
            description: Probe describes a health check to be performed against a
              container to determine whether it is alive or ready to receive traffic.
            type: object
            properties:
              failureThreshold:
                description: Minimum consecutive failures for the probe to be considered
                  failed after having succeeded. Defaults to 3. Minimum value is 1.
                  Maximum value is 10.
                type: integer
                format: int32
              httpGet:
                description: HTTPGet specifies the http request to perform.
                type: object
                required:
                - port
                properties:
                  host:
                    description: Host name to connect to, defaults to the pod IP.
                      You probably want to set "Host" in httpHeaders instead.
                    type: string
                  httpHeaders:
                    description: Custom headers to set in the request. HTTP allows
                      repeated headers.
                    type: array
                    items:
                      description: HTTPHeader describes a custom header to be used
                        in HTTP probes
                      type: object
                      required:
                      - name
                      - value
                      properties:
                        name:
                          description: The header field name
                          type: string
                        value:
                          description: The header field value
                          type: string
                    x-ms-identifiers:
                    - name
                  path:
                    description: Path to access on the HTTP server.
                    type: string
                  port:
                    description: Name or number of the port to access on the container.
                      Number must be in the range 1 to 65535. Name must be an IANA_SVC_NAME.
                    type: integer
                    format: int32
                  scheme:
                    description: Scheme to use for connecting to the host. Defaults
                      to HTTP.
                    enum:
                    - HTTP
                    - HTTPS
                    type: string
                    x-ms-enum:
                      name: Scheme
                      modelAsString: true
              initialDelaySeconds:
                description: Number of seconds after the container has started before
                  liveness probes are initiated. Minimum value is 1. Maximum value
                  is 60.
                type: integer
                format: int32
              periodSeconds:
                description: How often (in seconds) to perform the probe. Default
                  to 10 seconds. Minimum value is 1. Maximum value is 240.
                type: integer
                format: int32
              successThreshold:
                description: Minimum consecutive successes for the probe to be considered
                  successful after having failed. Defaults to 1. Must be 1 for liveness
                  and startup. Minimum value is 1. Maximum value is 10.
                type: integer
                format: int32
              tcpSocket:
                description: TCPSocket specifies an action involving a TCP port. TCP
                  hooks not yet supported.
                type: object
                required:
                - port
                properties:
                  host:
                    description: 'Optional: Host name to connect to, defaults to the
                      pod IP.'
                    type: string
                  port:
                    description: Number or name of the port to access on the container.
                      Number must be in the range 1 to 65535. Name must be an IANA_SVC_NAME.
                    type: integer
                    format: int32
              terminationGracePeriodSeconds:
                description: Optional duration in seconds the pod needs to terminate
                  gracefully upon probe failure. The grace period is the duration
                  in seconds after the processes running in the pod are sent a termination
                  signal and the time when the processes are forcibly halted with
                  a kill signal. Set this value longer than the expected cleanup time
                  for your process. If this value is nil, the pod's terminationGracePeriodSeconds
                  will be used. Otherwise, this value overrides the value provided
                  by the pod spec. Value must be non-negative integer. The value zero
                  indicates stop immediately via the kill signal (no opportunity to
                  shut down). This is an alpha field and requires enabling ProbeTerminationGracePeriod
                  feature gate. Maximum value is 3600 seconds (1 hour)
                type: integer
                format: int64
              timeoutSeconds:
                description: Number of seconds after which the probe times out. Defaults
                  to 1 second. Minimum value is 1. Maximum value is 240.
                type: integer
                format: int32
              type:
                description: The type of probe.
                enum:
                - Liveness
                - Readiness
                - Startup
                type: string
                x-ms-enum:
                  name: Type
                  modelAsString: true
          x-ms-identifiers:
          - type
      description: Container App base container definition.
    ContainerResources:
      description: Container App container resource requirements.
      type: object
      properties:
        cpu:
          format: double
          description: Required CPU in cores, e.g. 0.5
          type: number
        memory:
          description: Required memory, e.g. "250Mb"
          type: string
        ephemeralStorage:
          description: Ephemeral Storage, e.g. "1Gi"
          type: string
          readOnly: true
    ContainerAppProbe:
      description: Probe describes a health check to be performed against a container
        to determine whether it is alive or ready to receive traffic.
      type: object
      properties:
        failureThreshold:
          description: Minimum consecutive failures for the probe to be considered
            failed after having succeeded. Defaults to 3. Minimum value is 1. Maximum
            value is 10.
          type: integer
          format: int32
        httpGet:
          description: HTTPGet specifies the http request to perform.
          type: object
          required:
          - port
          properties:
            host:
              description: Host name to connect to, defaults to the pod IP. You probably
                want to set "Host" in httpHeaders instead.
              type: string
            httpHeaders:
              description: Custom headers to set in the request. HTTP allows repeated
                headers.
              type: array
              items:
                description: HTTPHeader describes a custom header to be used in HTTP
                  probes
                type: object
                required:
                - name
                - value
                properties:
                  name:
                    description: The header field name
                    type: string
                  value:
                    description: The header field value
                    type: string
              x-ms-identifiers:
              - name
            path:
              description: Path to access on the HTTP server.
              type: string
            port:
              description: Name or number of the port to access on the container.
                Number must be in the range 1 to 65535. Name must be an IANA_SVC_NAME.
              type: integer
              format: int32
            scheme:
              description: Scheme to use for connecting to the host. Defaults to HTTP.
              enum:
              - HTTP
              - HTTPS
              type: string
              x-ms-enum:
                name: Scheme
                modelAsString: true
        initialDelaySeconds:
          description: Number of seconds after the container has started before liveness
            probes are initiated. Minimum value is 1. Maximum value is 60.
          type: integer
          format: int32
        periodSeconds:
          description: How often (in seconds) to perform the probe. Default to 10
            seconds. Minimum value is 1. Maximum value is 240.
          type: integer
          format: int32
        successThreshold:
          description: Minimum consecutive successes for the probe to be considered
            successful after having failed. Defaults to 1. Must be 1 for liveness
            and startup. Minimum value is 1. Maximum value is 10.
          type: integer
          format: int32
        tcpSocket:
          description: TCPSocket specifies an action involving a TCP port. TCP hooks
            not yet supported.
          type: object
          required:
          - port
          properties:
            host:
              description: 'Optional: Host name to connect to, defaults to the pod
                IP.'
              type: string
            port:
              description: Number or name of the port to access on the container.
                Number must be in the range 1 to 65535. Name must be an IANA_SVC_NAME.
              type: integer
              format: int32
        terminationGracePeriodSeconds:
          description: Optional duration in seconds the pod needs to terminate gracefully
            upon probe failure. The grace period is the duration in seconds after
            the processes running in the pod are sent a termination signal and the
            time when the processes are forcibly halted with a kill signal. Set this
            value longer than the expected cleanup time for your process. If this
            value is nil, the pod's terminationGracePeriodSeconds will be used. Otherwise,
            this value overrides the value provided by the pod spec. Value must be
            non-negative integer. The value zero indicates stop immediately via the
            kill signal (no opportunity to shut down). This is an alpha field and
            requires enabling ProbeTerminationGracePeriod feature gate. Maximum value
            is 3600 seconds (1 hour)
          type: integer
          format: int64
        timeoutSeconds:
          description: Number of seconds after which the probe times out. Defaults
            to 1 second. Minimum value is 1. Maximum value is 240.
          type: integer
          format: int32
        type:
          description: The type of probe.
          enum:
          - Liveness
          - Readiness
          - Startup
          type: string
          x-ms-enum:
            name: Type
            modelAsString: true
    CustomScaleRule:
      description: Container App container Custom scaling rule.
      type: object
      properties:
        type:
          description: 'Type of the custom scale rule

            eg: azure-servicebus, redis etc.'
          type: string
        metadata:
          description: Metadata properties to describe custom scale rule.
          type: object
          additionalProperties:
            type: string
        auth:
          description: Authentication secrets for the custom scale rule.
          type: array
          items:
            description: Auth Secrets for Scale Rule
            type: object
            properties:
              secretRef:
                description: Name of the secret from which to pull the auth params.
                type: string
              triggerParameter:
                description: Trigger Parameter that uses the secret
                type: string
          x-ms-identifiers:
          - triggerParameter
        identity:
          description: The resource ID of a user-assigned managed identity that is
            assigned to the Container App, or 'system' for system-assigned identity.
          type: string
    CustomDomainConfiguration:
      type: object
      description: Configuration properties for apps environment custom domain
      properties:
        customDomainVerificationId:
          description: Id used to verify domain name ownership
          type: string
          readOnly: true
        dnsSuffix:
          type: string
          description: Dns suffix for the environment domain
          x-ms-mutability:
          - create
          - read
        certificateKeyVaultProperties:
          description: Certificate stored in Azure Key Vault.
          type: object
          properties:
            identity:
              description: Resource ID of a managed identity to authenticate with
                Azure Key Vault, or System to use a system-assigned identity.
              type: string
            keyVaultUrl:
              description: URL pointing to the Azure Key Vault secret that holds the
                certificate.
              type: string
              format: uri
        certificateValue:
          format: byte
          description: PFX or PEM blob
          type: string
          x-ms-secret: true
        certificatePassword:
          description: Certificate password
          type: string
          x-ms-secret: true
        expirationDate:
          format: date-time
          description: Certificate expiration date.
          type: string
          readOnly: true
        thumbprint:
          description: Certificate thumbprint.
          type: string
          readOnly: true
        subjectName:
          description: Subject name of the certificate.
          type: string
          readOnly: true
    DefaultErrorResponse:
      description: App Service error response.
      type: object
      properties:
        error:
          description: Error model.
          type: object
          properties:
            code:
              description: Standardized string to programmatically identify the error.
              type: string
              readOnly: true
            message:
              description: Detailed error description and debugging information.
              type: string
              readOnly: true
            target:
              description: Detailed error description and debugging information.
              type: string
              readOnly: true
            details:
              type: array
              description: Details or the error
              items:
                description: Detailed errors.
                type: object
                properties:
                  code:
                    description: Standardized string to programmatically identify
                      the error.
                    type: string
                    readOnly: true
                  message:
                    description: Detailed error description and debugging information.
                    type: string
                    readOnly: true
                  target:
                    description: Detailed error description and debugging information.
                    type: string
                    readOnly: true
                readOnly: true
              x-ms-identifiers:
              - code
            innererror:
              description: More information to debug error.
              type: string
              readOnly: true
          readOnly: true
    HttpScaleRule:
      description: Container App container Http scaling rule.
