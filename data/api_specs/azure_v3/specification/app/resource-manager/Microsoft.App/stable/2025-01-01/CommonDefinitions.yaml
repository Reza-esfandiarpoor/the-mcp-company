                          type: string
                        triggerParameter:
                          description: Trigger Parameter that uses the secret
                          type: string
                    x-ms-identifiers:
                    - triggerParameter
                  identity:
                    description: The resource ID of a user-assigned managed identity
                      that is assigned to the Container App, or 'system' for system-assigned
                      identity.
                    type: string
              tcp:
                description: Tcp requests based scaling.
                type: object
                properties:
                  metadata:
                    description: Metadata properties to describe tcp scale rule.
                    type: object
                    additionalProperties:
                      type: string
                  auth:
                    description: Authentication secrets for the tcp scale rule.
                    type: array
                    items:
                      description: Auth Secrets for Scale Rule
                      type: object
                      properties:
                        secretRef:
                          description: Name of the secret from which to pull the auth
