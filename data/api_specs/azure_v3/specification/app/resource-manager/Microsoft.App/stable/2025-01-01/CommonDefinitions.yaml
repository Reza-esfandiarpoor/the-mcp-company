          type: string
    QueueScaleRule:
      description: Container App container Azure Queue based scaling rule.
      type: object
      properties:
        accountName:
          description: Storage account name. required if using managed identity to
            authenticate
          type: string
        queueName:
          description: Queue name.
          type: string
        queueLength:
          format: int32
          description: Queue length.
          type: integer
        auth:
          description: Authentication secrets for the queue scale rule.
          type: array
          items:
            description: Auth Secrets for Scale Rule
            type: object
            properties:
              secretRef:
                description: Name of the secret from which to pull the auth params.
                type: string
              triggerParameter:
                description: Trigger Parameter that uses the secret
                type: string
          x-ms-identifiers:
          - triggerParameter
        identity:
