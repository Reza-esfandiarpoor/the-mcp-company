    Scale:
      description: Container App scaling configurations.
      type: object
      properties:
        minReplicas:
          format: int32
          description: Optional. Minimum number of container replicas.
          type: integer
        maxReplicas:
          format: int32
          description: Optional. Maximum number of container replicas. Defaults to
            10 if not set.
          type: integer
          default: 10
        cooldownPeriod:
          format: int32
          description: Optional. KEDA Cooldown Period in seconds. Defaults to 300
            seconds if not set.
          type: integer
        pollingInterval:
          format: int32
          description: Optional. KEDA Polling Interval in seconds. Defaults to 30
            seconds if not set.
          type: integer
        rules:
          description: Scaling rules.
          type: array
          items:
            description: Container App container scaling rule.
            type: object
            properties:
              name:
                description: Scale Rule Name
                type: string
              azureQueue:
                description: Azure Queue based scaling.
                type: object
                properties:
                  accountName:
                    description: Storage account name. required if using managed identity
                      to authenticate
                    type: string
                  queueName:
                    description: Queue name.
                    type: string
                  queueLength:
                    format: int32
                    description: Queue length.
                    type: integer
                  auth:
                    description: Authentication secrets for the queue scale rule.
                    type: array
                    items:
                      description: Auth Secrets for Scale Rule
                      type: object
                      properties:
                        secretRef:
                          description: Name of the secret from which to pull the auth
