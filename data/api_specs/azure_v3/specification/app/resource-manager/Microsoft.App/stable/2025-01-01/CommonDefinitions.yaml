                          type: string
                        triggerParameter:
                          description: Trigger Parameter that uses the secret
                          type: string
                    x-ms-identifiers:
                    - triggerParameter
                  identity:
                    description: The resource ID of a user-assigned managed identity
                      that is assigned to the Container App, or 'system' for system-assigned
                      identity.
                    type: string
              custom:
                description: Custom scale rule.
                type: object
                properties:
                  type:
                    description: 'Type of the custom scale rule

                      eg: azure-servicebus, redis etc.'
                    type: string
                  metadata:
                    description: Metadata properties to describe custom scale rule.
                    type: object
                    additionalProperties:
                      type: string
                  auth:
                    description: Authentication secrets for the custom scale rule.
                    type: array
                    items:
                      description: Auth Secrets for Scale Rule
                      type: object
                      properties:
                        secretRef:
                          description: Name of the secret from which to pull the auth
