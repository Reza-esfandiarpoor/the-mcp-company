        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            Operation-Location:
              description: The location for monitoring the operation state.
              schema:
                type: string
                format: uri
            operation-id:
              description: The id of this execution operation.
              schema:
                type: string
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCodeExecutionResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-long-running-operation-options:
        final-state-via: operation-location
      x-ms-long-running-operation: true
  /executions/{executionId}:
    get:
      operationId: CodeExecution_Get
      description: Get the code execution result.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: executionId
        in: path
        description: Session code execution id.
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SessionIdentifier'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCodeExecutionResource'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /files:
    get:
      operationId: SessionResourceFiles_List
      description: List the file resources.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/SessionIdentifier'
      - $ref: '#/components/parameters/SessionResourceFilePathQueryParameter'
      responses:
