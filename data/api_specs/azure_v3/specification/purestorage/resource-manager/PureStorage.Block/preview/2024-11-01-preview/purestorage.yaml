          type: integer
          format: int64
          description: Extra capacity added because of low DRR storage pools; In bytes
        extraUsedCapacityLowUsageRounding:
          type: integer
          format: int64
          description: Extra capacity added when rounding up low-usage pools to 30TiB.
            In bytes
        extraUsedCapacityNonReduciblePlanDiscount:
          type: integer
          format: int64
          description: Extra capacity discounted due to plan forgiving some low-DRR
            usage. In bytes
        totalUsedCapacityBilled:
          type: integer
          format: int64
          description: Total used capacity actually billed. In bytes
        totalUsedCapacityIncludedPlan:
          type: integer
          format: int64
          description: Total used capacity included in plan. In bytes
        totalUsedCapacityOverage:
          type: integer
          format: int64
          description: Total used capacity reported at on-demand price. In bytes
        totalPerformanceReported:
          type: integer
          format: int64
          description: The sum of all performance settings across the pools under
            this reservation. In MB per second
        totalPerformanceIncludedPlan:
          type: integer
          format: int64
          description: Total performance amount included in plan. In bytes per second
        totalPerformanceOverage:
          type: integer
          format: int64
          description: Total performance amount reported at on-demand price. In MB
            per second
