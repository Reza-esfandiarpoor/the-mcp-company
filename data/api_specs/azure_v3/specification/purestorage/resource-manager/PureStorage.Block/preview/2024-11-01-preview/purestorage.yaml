                type: object
                description: Latest billing status for this reservation
                properties:
                  timestamp:
                    type: string
                    description: Timestamp for the latest update of this billing status,
                      in RFC 3339 format
                  totalUsedCapacityReported:
                    type: integer
                    format: int64
                    description: Total used capacity as reported by associated storage
                      pools. In bytes
                  lowDrrPoolCount:
                    type: integer
                    format: int32
                    description: How many associated storage pools reported low data
