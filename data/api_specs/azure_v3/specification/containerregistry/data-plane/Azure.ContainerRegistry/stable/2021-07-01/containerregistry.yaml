openapi: 3.0.0
info:
  title: Azure Container Registry
  description: Metadata API definition for the Azure Container Registry runtime
  version: 2021-07-01
servers:
- url: '{url}'
  variables:
    url:
      x-ms-client-name: loginUri
      description: Registry login URL
      x-ms-skip-url-encoding: true
      x-ms-parameter-location: client
      default: none
security:
- registry_auth: []
  registry_oauth2: []
tags:
- name: ContainerRegistry
  description: Registry Operations
- name: ContainerRegistryBlob
  description: Blob Operations
paths:
  /v2/:
    get:
      tags:
      - Registry
      description: Tells whether this Docker Registry instance supports Docker Registry
        HTTP API v2
      operationId: ContainerRegistry_CheckDockerV2Support
      responses:
        '200':
          description: Successful response. API v2 supported
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
  /v2/{name}/manifests/{reference}:
    get:
      tags:
      - Repository
      description: Get the manifest identified by `name` and `reference` where `reference`
        can be a tag or digest.
      operationId: ContainerRegistry_GetManifest
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: reference
        in: path
        description: A tag or a digest, pointing to a specific image
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: accept
        in: header
        description: Accept header string delimited by comma. For example, application/vnd.docker.distribution.manifest.v2+json
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Returns the requested manifest file in a larger combined group
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemaVersion:
                    type: integer
                    description: Schema version
                  mediaType:
                    type: string
                    description: Media type for this Manifest
                  manifests:
                    type: array
                    description: (ManifestList, OCIIndex) List of V2 image layer information
                    items:
                      x-accessibility: internal
                      properties:
                        mediaType:
                          type: string
                          description: The MIME type of the referenced object. This
                            will generally be application/vnd.docker.image.manifest.v2+json,
                            but it could also be application/vnd.docker.image.manifest.v1+json
                        size:
                          type: integer
                          format: int64
                          description: The size in bytes of the object
                        digest:
                          type: string
                          description: The digest of the content, as defined by the
                            Registry V2 HTTP API Specification
                        platform:
                          description: The platform object describes the platform
                            which the image in the manifest runs on. A full list of
                            valid operating system and architecture values are listed
                            in the Go language documentation for $GOOS and $GOARCH
                          x-accessibility: internal
                          properties:
                            architecture:
                              type: string
                              description: Specifies the CPU architecture, for example
                                amd64 or ppc64le.
                            os:
                              type: string
                              description: The os field specifies the operating system,
                                for example linux or windows.
                            os.version:
                              type: string
                              description: The optional os.version field specifies
                                the operating system version, for example 10.0.10586.
                            os.features:
                              type: array
                              description: The optional os.features field specifies
                                an array of strings, each listing a required OS feature
                                (for example on Windows win32k
                              items:
                                type: string
                            variant:
                              type: string
                              description: The optional variant field specifies a
                                variant of the CPU, for example armv6l to specify
                                a particular CPU variant of the ARM CPU.
                            features:
                              type: array
                              description: The optional features field specifies an
                                array of strings, each listing a required CPU feature
                                (for example sse4 or aes
                              items:
                                type: string
                  config:
                    description: (V2, OCI) Image config descriptor
                    x-accessibility: internal
                    properties:
                      mediaType:
                        type: string
                        description: Layer media type
                      size:
                        type: integer
                        format: int64
                        description: Layer size
                      digest:
                        type: string
                        description: Layer digest
                      urls:
                        type: array
                        description: Specifies a list of URIs from which this object
                          may be downloaded.
                        items:
                          description: Must conform to RFC 3986. Entries should use
                            the http and https schemes, as defined in RFC 7230.
                          type: string
                      annotations:
                        description: Additional information provided through arbitrary
                          metadata.
                        x-accessibility: internal
                        type: object
                        additionalProperties:
                          type: object
                        properties:
                          org.opencontainers.image.created:
                            description: Date and time on which the image was built
                              (string, date-time as defined by https://tools.ietf.org/html/rfc3339#section-5.6)
                            type: string
                            format: date-time
                            x-ms-client-name: Created
                          org.opencontainers.image.authors:
                            description: Contact details of the people or organization
                              responsible for the image.
                            type: string
                            x-ms-client-name: Authors
                          org.opencontainers.image.url:
                            description: URL to find more information on the image.
                            type: string
                            x-ms-client-name: Url
                          org.opencontainers.image.documentation:
                            description: URL to get documentation on the image.
                            type: string
                            x-ms-client-name: Documentation
                          org.opencontainers.image.source:
                            description: URL to get source code for building the image.
                            type: string
                            x-ms-client-name: Source
                          org.opencontainers.image.version:
                            description: Version of the packaged software. The version
                              MAY match a label or tag in the source code repository,
                              may also be Semantic versioning-compatible
                            type: string
                            x-ms-client-name: Version
                          org.opencontainers.image.revision:
                            description: Source control revision identifier for the
                              packaged software.
                            type: string
                            x-ms-client-name: Revision
                          org.opencontainers.image.vendor:
                            description: Name of the distributing entity, organization
                              or individual.
                            type: string
                            x-ms-client-name: Vendor
                          org.opencontainers.image.licenses:
                            description: License(s) under which contained software
                              is distributed as an SPDX License Expression.
                            type: string
                            x-ms-client-name: Licenses
                          org.opencontainers.image.ref.name:
                            description: Name of the reference for a target.
                            type: string
                            x-ms-client-name: Name
                          org.opencontainers.image.title:
                            description: Human-readable title of the image
                            type: string
                            x-ms-client-name: Title
                          org.opencontainers.image.description:
                            description: Human-readable description of the software
                              packaged in the image
                            type: string
                            x-ms-client-name: Description
                        nullable: true
                  layers:
                    type: array
                    description: (V2, OCI) List of V2 image layer information
                    items:
                      description: Docker V2 image layer descriptor including config
                        and layers
                      x-accessibility: internal
                      properties:
                        mediaType:
                          type: string
                          description: Layer media type
                        size:
                          type: integer
                          format: int64
                          description: Layer size
                        digest:
                          type: string
                          description: Layer digest
                        urls:
                          type: array
                          description: Specifies a list of URIs from which this object
                            may be downloaded.
                          items:
                            description: Must conform to RFC 3986. Entries should
                              use the http and https schemes, as defined in RFC 7230.
                            type: string
                        annotations:
                          description: Additional information provided through arbitrary
                            metadata.
                          x-accessibility: internal
                          type: object
                          additionalProperties:
                            type: object
                          properties:
                            org.opencontainers.image.created:
                              description: Date and time on which the image was built
                                (string, date-time as defined by https://tools.ietf.org/html/rfc3339#section-5.6)
                              type: string
                              format: date-time
                              x-ms-client-name: Created
                            org.opencontainers.image.authors:
                              description: Contact details of the people or organization
                                responsible for the image.
                              type: string
                              x-ms-client-name: Authors
                            org.opencontainers.image.url:
                              description: URL to find more information on the image.
                              type: string
                              x-ms-client-name: Url
                            org.opencontainers.image.documentation:
                              description: URL to get documentation on the image.
                              type: string
                              x-ms-client-name: Documentation
                            org.opencontainers.image.source:
                              description: URL to get source code for building the
                                image.
                              type: string
                              x-ms-client-name: Source
                            org.opencontainers.image.version:
                              description: Version of the packaged software. The version
                                MAY match a label or tag in the source code repository,
                                may also be Semantic versioning-compatible
                              type: string
                              x-ms-client-name: Version
                            org.opencontainers.image.revision:
                              description: Source control revision identifier for
                                the packaged software.
                              type: string
                              x-ms-client-name: Revision
                            org.opencontainers.image.vendor:
                              description: Name of the distributing entity, organization
                                or individual.
                              type: string
                              x-ms-client-name: Vendor
                            org.opencontainers.image.licenses:
                              description: License(s) under which contained software
                                is distributed as an SPDX License Expression.
                              type: string
                              x-ms-client-name: Licenses
                            org.opencontainers.image.ref.name:
                              description: Name of the reference for a target.
                              type: string
                              x-ms-client-name: Name
                            org.opencontainers.image.title:
                              description: Human-readable title of the image
                              type: string
                              x-ms-client-name: Title
                            org.opencontainers.image.description:
                              description: Human-readable description of the software
                                packaged in the image
                              type: string
                              x-ms-client-name: Description
                          nullable: true
                  annotations:
                    description: (OCI, OCIIndex) Additional metadata
                    x-accessibility: internal
                    type: object
                    additionalProperties:
                      type: object
                    properties:
                      org.opencontainers.image.created:
                        description: Date and time on which the image was built (string,
                          date-time as defined by https://tools.ietf.org/html/rfc3339#section-5.6)
                        type: string
                        format: date-time
                        x-ms-client-name: Created
                      org.opencontainers.image.authors:
                        description: Contact details of the people or organization
                          responsible for the image.
                        type: string
                        x-ms-client-name: Authors
                      org.opencontainers.image.url:
                        description: URL to find more information on the image.
                        type: string
                        x-ms-client-name: Url
                      org.opencontainers.image.documentation:
                        description: URL to get documentation on the image.
                        type: string
                        x-ms-client-name: Documentation
                      org.opencontainers.image.source:
                        description: URL to get source code for building the image.
                        type: string
                        x-ms-client-name: Source
                      org.opencontainers.image.version:
                        description: Version of the packaged software. The version
                          MAY match a label or tag in the source code repository,
                          may also be Semantic versioning-compatible
                        type: string
                        x-ms-client-name: Version
                      org.opencontainers.image.revision:
                        description: Source control revision identifier for the packaged
                          software.
                        type: string
                        x-ms-client-name: Revision
                      org.opencontainers.image.vendor:
                        description: Name of the distributing entity, organization
                          or individual.
                        type: string
                        x-ms-client-name: Vendor
                      org.opencontainers.image.licenses:
                        description: License(s) under which contained software is
                          distributed as an SPDX License Expression.
                        type: string
                        x-ms-client-name: Licenses
                      org.opencontainers.image.ref.name:
                        description: Name of the reference for a target.
                        type: string
                        x-ms-client-name: Name
                      org.opencontainers.image.title:
                        description: Human-readable title of the image
                        type: string
                        x-ms-client-name: Title
                      org.opencontainers.image.description:
                        description: Human-readable description of the software packaged
                          in the image
                        type: string
                        x-ms-client-name: Description
                    nullable: true
                  architecture:
                    type: string
                    description: (V1) CPU architecture
                  name:
                    type: string
                    description: (V1) Image name
                  tag:
                    type: string
                    description: (V1) Image tag
                  fsLayers:
                    type: array
                    description: (V1) List of layer information
                    items:
                      description: Image layer information
                      x-accessibility: internal
                      properties:
                        blobSum:
                          type: string
                          description: SHA of an image layer
                  history:
                    type: array
                    description: (V1) Image history
                    items:
                      description: A list of unstructured historical data for v1 compatibility
                      x-accessibility: internal
                      properties:
                        v1Compatibility:
                          type: string
                          description: The raw v1 compatibility information
                  signatures:
                    type: array
                    description: (V1) Image signature
                    items:
                      description: Signature of a signed manifest
                      x-accessibility: internal
                      properties:
                        header:
                          description: A JSON web signature
                          x-accessibility: internal
                          properties:
                            jwk:
                              description: JSON web key parameter
                              x-accessibility: internal
                              properties:
                                crv:
                                  type: string
                                  description: crv value
                                kid:
                                  type: string
                                  description: kid value
                                kty:
                                  type: string
                                  description: kty value
                                x:
                                  type: string
                                  description: x value
                                y:
                                  type: string
                                  description: y value
                            alg:
                              type: string
                              description: The algorithm used to sign or encrypt the
                                JWT
                        signature:
                          type: string
                          description: A signature for the image manifest, signed
                            by a libtrust private key
                        protected:
                          type: string
                          description: The signed protected header
                description: Returns the requested manifest file
                x-accessibility: internal
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
    put:
      tags:
      - Repository
      x-ms-long-running-operation: false
      description: Put the manifest identified by `name` and `reference` where `reference`
        can be a tag or digest.
      operationId: ContainerRegistry_CreateManifest
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: reference
        in: path
        description: A tag or a digest, pointing to a specific image
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      requestBody:
        content:
          application/vnd.docker.distribution.manifest.v2+json:
            schema:
              description: Returns the requested manifest file
              x-accessibility: internal
              properties:
                schemaVersion:
                  type: integer
                  description: Schema version
        description: Manifest body, can take v1 or v2 values depending on accept header
        required: true
        x-ms-parameter-location: method
      responses:
        '201':
          description: The manifest is updated
          headers:
            Docker-Content-Digest:
              description: Identifies the docker upload uuid for the current request.
              schema:
                type: string
            Location:
              description: The canonical location url of the uploaded manifest.
              schema:
                type: string
            Content-Length:
              description: The length of the requested blob content.
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema: {}
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
    delete:
      tags:
      - Repository
      description: Delete the manifest identified by `name` and `reference`. Note
        that a manifest can _only_ be deleted by `digest`.
      operationId: ContainerRegistry_DeleteManifest
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: reference
        in: path
        description: Digest of a BLOB
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '202':
          description: The manifest has been deleted
        '404':
          description: The manifest was not found
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
  /v2/{name}/blobs/{digest}:
    get:
      tags:
      - ContainerRegistryBlob
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: digest
        in: path
        description: Digest of a BLOB
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      description: Retrieve the blob from the registry identified by digest.
      operationId: ContainerRegistryBlob_GetBlob
      responses:
        '200':
          description: The blob identified by digest is available. The blob content
            will be present in the body of the response.
          headers:
            Content-Length:
              description: The length of the requested blob content.
              schema:
                type: integer
                format: int64
            Docker-Content-Digest:
              description: Digest of the targeted content for the request.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                description: blob binary data
                type: string
                format: binary
        '307':
          description: The blob identified by digest is available at the provided
            location.
          headers:
            Location:
              description: The location where the layer should be accessible.
              schema:
                type: string
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/octet-stream:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
    head:
      tags:
      - ContainerRegistryBlob
      description: Same as GET, except only the headers are returned.
      operationId: ContainerRegistryBlob_CheckBlobExists
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: digest
        in: path
        description: Digest of a BLOB
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: The blob identified by digest is available. The blob content
            will be present in the body of the response.
          headers:
            Content-Length:
              description: The length of the requested blob content.
              schema:
                type: integer
                format: int64
            Docker-Content-Digest:
              description: Digest of the targeted content for the request.
              schema:
                type: string
        '307':
          description: The blob identified by digest is available at the provided
            location.
          headers:
            Location:
              description: The location where the layer should be accessible.
              schema:
                type: string
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
    delete:
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: digest
        in: path
        description: Digest of a BLOB
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      description: Removes an already uploaded blob.
      tags:
      - ContainerRegistryBlob
      operationId: ContainerRegistryBlob_DeleteBlob
      responses:
        '202':
          description: The blob identified by digest is available. The blob content
            will be present in the body of the response.
          headers:
            Docker-Content-Digest:
              description: Digest of the targeted content for the request.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                description: blob binary data
                type: string
                format: binary
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/octet-stream:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
  /v2/{name}/blobs/uploads/:
    post:
      tags:
      - ContainerRegistryBlob
      description: Mount a blob identified by the `mount` parameter from another repository.
      operationId: ContainerRegistryBlob_MountBlob
      parameters:
      - name: name
        in: path
        description: Name of the image (including the namespace)
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: from
        in: query
        description: Name of the source repository.
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      - name: mount
        description: Digest of blob to mount from the source repository.
        in: query
        required: true
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '201':
          description: The blob has been created in the registry and is available
            at the provided location.
          headers:
            Location:
              description: Provided location for blob
              schema:
                type: string
            Docker-Upload-UUID:
              description: Identifies the docker upload uuid for the current request.
              schema:
                type: string
            Docker-Content-Digest:
              description: Digest of the targeted content for the request.
              schema:
                type: string
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
  /{nextBlobUuidLink}:
    get:
      tags:
      - ContainerRegistryBlob
      parameters:
      - name: nextBlobUuidLink
        x-ms-client-name: location
        description: Link acquired from upload start or previous chunk. Note, do not
          include initial / (must do substring(1) )
        in: path
        required: true
        x-ms-parameter-location: method
        x-ms-skip-url-encoding: true
        schema:
          type: string
      description: Retrieve status of upload identified by uuid. The primary purpose
        of this endpoint is to resolve the current status of a resumable upload.
      operationId: ContainerRegistryBlob_GetUploadStatus
      responses:
        '204':
          description: The upload is known and in progress. The last received offset
            is available in the Range header.
          headers:
            Range:
              description: Range indicating the current progress of the upload.
              schema:
                type: string
            Docker-Upload-UUID:
              description: Identifies the docker upload uuid for the current request.
              schema:
                type: string
        default:
          description: ACR error response describing why the operation failed.
          content:
            application/json:
              schema:
                description: Acr error response describing why the operation failed
                properties:
                  errors:
                    type: array
                    description: Array of detailed error
                    items:
                      description: Error information
                      properties:
                        code:
                          description: Error code
                          type: string
                        message:
                          type: string
                          description: Error message
                        detail:
                          type: object
                          description: Error details
    patch:
      security:
      - registry_auth: []
