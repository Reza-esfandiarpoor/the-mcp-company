    PassFailCriteria:
      type: object
      description: Pass fail criteria for a test.
      properties:
        passFailMetrics:
          type: object
          description: 'Map of id and pass fail metrics { id  : pass fail metrics
            }.'
          additionalProperties:
            $ref: '#/components/schemas/PassFailMetric'
    PassFailMetric:
      type: object
      description: Pass fail metric
      properties:
        clientMetric:
          $ref: '#/components/schemas/PFMetrics'
        aggregate:
          $ref: '#/components/schemas/PassFailAggregationFunction'
        condition:
          type: string
          description: "The comparison operator. Supported types \u2018>\u2019, \u2018<\u2019 "
        requestName:
          type: string
          description: 'Request name for which the Pass fail criteria has to be applied '
        value:
          type: number
          format: double
          description: "The value to compare with the client metric. Allowed values
            - \u2018error : [0.0 ,\n100.0] unit- % \u2019, response_time_ms and latency
            : any integer value unit- ms."
        action:
          type: string
          description: "Action taken after the threshold is met. Default is \u2018continue\u2019."
          default: continue
          enum:
          - continue
          - stop
          x-ms-enum:
            name: PassFailAction
            modelAsString: true
            values:
            - name: continue
              value: continue
              description: Test will continue to run even if pass fail metric criteria
                metric gets failed.
            - name: stop
              value: stop
              description: Test run will stop if pass fail criteria metric is not
                passed.
        actualValue:
          type: number
          format: double
          description: The actual value of the client metric for the test run.
          readOnly: true
        result:
          $ref: '#/components/schemas/PassFailResult'
    PassFailResult:
      type: string
      description: Pass/fail criteria result.
      enum:
      - passed
      - undetermined
      - failed
      x-ms-enum:
        name: PassFailResult
        modelAsString: true
        values:
        - name: passed
          value: passed
          description: Given pass fail criteria metric has passed.
        - name: undetermined
          value: undetermined
          description: Given pass fail criteria metric couldn't determine.
        - name: failed
          value: failed
          description: Given pass fail criteria metric has failed.
