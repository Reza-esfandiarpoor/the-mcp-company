paths:
  /playwrightworkspaces/{workspaceId}/access-tokens:
    get:
      operationId: AccessTokens_List
      description: 'Lists access tokens for the specified workspace ID. Supports OData
        query parameters: $select, $filter, $orderby, $top, and $skip. Default page
        size is 10. Use nextLink in response to fetch additional results. Requires
        Bearer JWT access token provided by Entra ID.'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAccessToken'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /playwrightworkspaces/{workspaceId}/access-tokens/{accessTokenId}:
    get:
      operationId: AccessTokens_Get
      description: Gets an access token for the workspace with the specified access
        token ID. Requires Bearer JWT access token provided by Entra ID.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - name: accessTokenId
        in: path
        description: The access token ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
    put:
      operationId: AccessTokens_CreateOrReplace
      description: Creates an access token for the workspace with the specified access
        token ID and name. The ID and name must be unique among active access tokens
        for the user within a Playwright workspace. Requires Bearer JWT access token
        provided by Entra ID.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - name: accessTokenId
        in: path
        description: The access token ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessToken'
        description: The resource instance.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '201':
          description: The request has succeeded and a new resource has been created
            as a result.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
    delete:
      operationId: AccessTokens_Delete
      description: Deletes an access token for the workspace with the specified access
        token ID. Requires Bearer JWT access token provided by Entra ID.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - name: accessTokenId
        in: path
        description: The access token ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /playwrightworkspaces/{workspaceId}/browsers:
    get:
      operationId: Workspaces_GetBrowsers
      description: Gets remote browsers for the specified workspace ID and redirects
        the client to execute Playwright scripts. Requires Bearer JWT access token
        provided by Entra ID or Playwright Service.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - name: os
        in: query
        description: The operating system for remote script execution.
        required: true
        x-ms-enum:
          name: OS
          modelAsString: true
          values:
          - name: Linux
            value: Linux
            description: Linux operating system.
          - name: Windows
            value: Windows
            description: Windows operating system.
        schema:
          type: string
          enum:
          - Linux
          - Windows
      - name: runId
        in: query
        description: The run ID in GUID format.
        required: false
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '302':
          description: Redirection
          headers:
            location:
              description: The redirect target URL for executing Playwright scripts
                on remote browsers.
              schema:
                type: string
                format: uri
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
  /playwrightworkspaces/{workspaceId}/test-runs:
    get:
      operationId: TestRuns_List
      description: Lists test runs for the specified workspace ID. Supports OData
        query parameters such as $filter and $top. Default page size is 10. Use nextLink
        in response to fetch additional results. Requires Bearer JWT access token
        provided by Entra ID or Playwright Service.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTestRun'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /playwrightworkspaces/{workspaceId}/test-runs/{runId}:
    patch:
      operationId: TestRuns_CreateOrUpdate
      description: Creates or updates a test run for the workspace with the specified
        test run ID. Requires Bearer JWT access token provided by Entra ID or Playwright
        Service.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: workspaceId
        in: path
        description: The workspace ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - name: runId
        in: path
        description: The test run ID in GUID format.
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
      - $ref: '#/components/parameters/Azure.Core.ClientRequestIdHeader'
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/TestRunCreateOrUpdate'
        description: The resource instance.
        required: true
      responses:
        '200':
          description: The request has succeeded.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        '201':
          description: The request has succeeded and a new resource has been created
            as a result.
          headers:
            x-ms-client-request-id:
              description: An opaque, globally-unique, client-generated string identifier
                for the request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRun'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
servers:
- url: '{endpoint}'
  variables:
    endpoint:
      description: 'Playwright Service API endpoint (protocol and hostname) formatted
        as https://{region}.api.playwright.microsoft.com.

        The region corresponds to your Azure Playwright workspace location. You can
        find this value in your Azure Playwright workspace properties under `dataplaneUri`.'
      default: none
components:
  parameters:
    Azure.Core.ClientRequestIdHeader:
      name: x-ms-client-request-id
      in: header
      description: An opaque, globally-unique, client-generated string identifier
        for the request.
      required: false
      x-ms-parameter-location: method
      x-ms-client-name: clientRequestId
      schema:
        type: string
        format: uuid
    Azure.Core.Foundations.ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      x-ms-parameter-location: method
      x-ms-client-name: apiVersion
      schema:
        type: string
        minLength: 1
  securitySchemes:
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          tokenUrl: https://login.microsoftonline.com/common/v2.0/oauth2/token
          scopes:
            https://playwright.microsoft.com/.default: ''
  schemas:
    AccessToken:
      type: object
      description: Model of an access token linked to a workspace.
      properties:
        id:
          type: string
          description: The access token ID in GUID format.
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
          readOnly: true
        name:
          type: string
          description: The access token name.
          minLength: 3
          maxLength: 24
          pattern: ^[a-zA-Z0-9-]{3,24}$
          x-ms-mutability:
          - read
          - create
        jwtToken:
          type: string
          description: The access token value in JWT format.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: The access token creation timestamp in UTC.
          readOnly: true
        expiryAt:
          type: string
          format: date-time
          description: The access token expiration timestamp in UTC.
          x-ms-mutability:
          - read
          - create
        state:
          $ref: '#/components/schemas/AccessTokenState'
      required:
      - id
      - name
      - createdAt
      - expiryAt
      - state
    AccessTokenState:
      type: string
      description: The access token state.
      enum:
      - Active
      - Expired
      x-ms-enum:
        name: AccessTokenState
        modelAsString: true
        values:
        - name: Active
          value: Active
          description: The access token is active and can be used for authentication.
        - name: Expired
          value: Expired
          description: The access token has expired and cannot be used for authentication.
    Azure.Core.Foundations.Error:
      type: object
      description: The error object.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        message:
          type: string
          description: A human-readable representation of the error.
        target:
          type: string
          description: The target of the error.
        details:
          type: array
          description: An array of details about specific errors that led to this
            reported error.
          items:
            $ref: '#/components/schemas/Azure.Core.Foundations.Error'
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
      required:
      - code
      - message
    Azure.Core.Foundations.ErrorResponse:
      type: object
      description: A response containing error details.
      properties:
        error:
          $ref: '#/components/schemas/Azure.Core.Foundations.Error'
      required:
      - error
    Azure.Core.Foundations.InnerError:
      type: object
      description: An object containing more specific information about the error.
        As per Azure REST API guidelines - https://aka.ms/AzureRestApiGuidelines#handling-errors.
      properties:
        code:
          type: string
          description: One of a server-defined set of error codes.
        innererror:
          $ref: '#/components/schemas/Azure.Core.Foundations.InnerError'
    CiConfig:
      type: object
      description: The test run CI configuration.
      properties:
        providerName:
          type: string
          description: The CI provider name.
          x-ms-mutability:
          - read
          - create
        branch:
          type: string
          description: The CI branch name.
          x-ms-mutability:
          - read
          - create
        author:
          type: string
          description: The CI commit author.
          x-ms-mutability:
          - read
          - create
        commitId:
          type: string
          description: The CI commit ID.
          x-ms-mutability:
          - read
          - create
        revisionUrl:
          type: string
          description: The CI revision URL.
          x-ms-mutability:
          - read
          - create
    PagedAccessToken:
      type: object
      description: Paged collection of AccessToken items
      properties:
        value:
          type: array
          description: The AccessToken items on this page
          items:
            $ref: '#/components/schemas/AccessToken'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    PagedTestRun:
      type: object
      description: Paged collection of TestRun items
      properties:
        value:
          type: array
          description: The TestRun items on this page
          items:
            $ref: '#/components/schemas/TestRun'
        nextLink:
          type: string
          format: uri
          description: The link to the next page of items
      required:
      - value
    RunConfig:
      type: object
      description: The run configuration.
      properties:
        framework:
          $ref: '#/components/schemas/RunFramework'
        sdkLanguage:
          $ref: '#/components/schemas/SDKLanguage'
        maxWorkers:
          type: integer
          format: int64
          description: The maximum number of workers required for the test run.
          minimum: 1
          maximum: 500
          x-ms-mutability:
          - read
          - create
    RunFramework:
      type: object
      description: The test run framework information.
      properties:
        name:
          type: string
          description: The framework name.
          x-ms-mutability:
          - read
          - create
        version:
          type: string
          description: The framework version.
          x-ms-mutability:
          - read
          - create
        runnerName:
          type: string
          description: The framework runner name.
          x-ms-mutability:
          - read
          - create
    RunStatus:
      type: string
      description: The test run status.
      enum:
      - RUNNING
      - CLIENT_COMPLETE
      - SERVER_COMPLETE
      x-ms-enum:
        name: RunStatus
        modelAsString: true
        values:
        - name: RUNNING
          value: RUNNING
          description: The test run is currently running.
        - name: CLIENT_COMPLETE
          value: CLIENT_COMPLETE
          description: The test run has completed on the client side.
        - name: SERVER_COMPLETE
          value: SERVER_COMPLETE
          description: The test run has completed on the server side.
    RunSummary:
      type: object
      description: The test run summary.
      properties:
        status:
          $ref: '#/components/schemas/RunStatus'
        billableTime:
          type: integer
          format: int64
          description: The test run billable time in milliseconds.
          readOnly: true
        numBrowserSessions:
          type: integer
          format: int64
          description: The total number of browser sessions allocated to the test
            run.
          readOnly: true
        maxConcurrentBrowserSessions:
          type: integer
          format: int64
          description: The highest number of browser sessions that were running concurrently
            during the test run.
          readOnly: true
        startTime:
          type: string
          format: date-time
          description: The test run start time in UTC.
          readOnly: true
        endTime:
          type: string
          format: date-time
          description: The test run end time in UTC.
          readOnly: true
        duration:
          type: integer
          format: int64
          description: The test run duration in milliseconds.
          readOnly: true
        errorMessages:
          type: array
          description: The list of error messages corresponding to the test run.
          items:
            type: string
          readOnly: true
      required:
      - status
      - startTime
    SDKLanguage:
      type: string
      description: The SDK language used for the test run.
      enum:
      - JAVASCRIPT
      - TYPESCRIPT
      - CSHARP
      x-ms-enum:
        name: SDKLanguage
        modelAsString: true
        values:
        - name: JAVASCRIPT
          value: JAVASCRIPT
          description: JavaScript SDK
        - name: TYPESCRIPT
          value: TYPESCRIPT
          description: TypeScript SDK
        - name: CSHARP
          value: CSHARP
          description: C# SDK
    TestRun:
      type: object
      description: Model of a test run used for tracking purposes.
      properties:
        id:
          type: string
          description: The test run ID in GUID format.
          minLength: 3
          maxLength: 36
          pattern: '[A-Za-z0-9]+(-[A-Za-z0-9]+)+'
          readOnly: true
        displayName:
          type: string
          description: The test run display name.
          minLength: 1
          maxLength: 200
          x-ms-mutability:
          - read
          - update
          - create
        creatorId:
          type: string
          description: The test run creator's ID.
          readOnly: true
        creatorName:
          type: string
          description: The test run creator's name.
          readOnly: true
        config:
          $ref: '#/components/schemas/RunConfig'
        ciConfig:
          $ref: '#/components/schemas/CiConfig'
        summary:
          $ref: '#/components/schemas/RunSummary'
      required:
      - id
      - displayName
      - creatorId
      - summary
    TestRunCreateOrUpdate:
      type: object
      description: Model of a test run used for tracking purposes.
      properties:
        displayName:
          type: string
          description: The test run display name.
          minLength: 1
          maxLength: 200
          x-ms-mutability:
          - read
          - update
          - create
        config:
          $ref: '#/components/schemas/RunConfig'
        ciConfig:
          $ref: '#/components/schemas/CiConfig'
