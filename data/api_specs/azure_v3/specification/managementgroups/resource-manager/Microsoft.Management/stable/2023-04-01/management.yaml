openapi: 3.0.0
info:
  version: 2023-04-01
  title: Management Groups API
  description: "The Azure Management Groups API enables consolidation of multiple\
    \ \nsubscriptions/resources into an organizational hierarchy and centrally \n\
    manage access control, policies, alerting and reporting for those resources.\n"
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: ManagementGroups
  description: "A Management Group is a customer defined scope (grouping mechanism)\
    \ that \nprovides access control (authorization), policy management and reporting.\
    \ \nManagement Groups are organized in a strictly tree-based hierarchy.\n"
- name: Operations
  description: 'Management operations supported by the Microsoft.Management resource
    provider.

    '
- name: Entities
  description: 'A list of entities that belong to the Management Groups.

    '
paths:
  /providers/Microsoft.Management/managementGroups:
    get:
      tags:
      - ManagementGroups
      operationId: ManagementGroups_List
      description: 'List management groups for the authenticated user.

        '
      parameters:
      - name: api-version
        in: query
        required: true
        description: Version of the API to be used with the client request. The current
          version is 2018-01-01-preview.
        schema:
          type: string
      - name: Cache-Control
        in: header
        description: Indicates whether the request should utilize any caches. Populate
          the header with 'no-cache' value to bypass existing caches.
        x-ms-parameter-location: method
        schema:
          type: string
          default: no-cache
      - name: $skiptoken
        in: query
        required: false
        description: "Page continuation token is only used if a previous operation\
          \ returned a partial result. \nIf a previous response contains a nextLink\
          \ element, the value of the nextLink element will include a token parameter\
          \ that specifies a starting point to use for subsequent calls.\n"
        x-ms-parameter-location: method
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: Describes the result of the request to list management
                  groups.
                properties:
                  value:
                    description: The list of management groups.
                    type: array
                    items:
                      description: The management group resource.
                      properties:
                        id:
                          type: string
                          description: The fully qualified ID for the management group.  For
                            example, /providers/Microsoft.Management/managementGroups/0000000-0000-0000-0000-000000000000
                          readOnly: true
                        type:
                          type: string
                          description: The type of the resource. For example, Microsoft.Management/managementGroups
                          readOnly: true
                        name:
                          type: string
                          description: The name of the management group. For example,
                            00000000-0000-0000-0000-000000000000
                          readOnly: true
                        properties:
                          x-ms-client-flatten: true
                          title: Properties
                          description: The generic properties of a management group.
                          type: object
                          properties:
                            tenantId:
                              type: string
                              description: The AAD Tenant ID associated with the management
                                group. For example, 00000000-0000-0000-0000-000000000000
                            displayName:
                              type: string
                              description: The friendly name of the management group.
