      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    databaseName:
      name: databaseName
      description: Unique name of a database in Azure migration hub.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    databaseInstanceName:
      name: databaseInstanceName
      description: Unique name of a database instance in Azure migration hub.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    solutionName:
      name: solutionName
      description: Unique name of a migration solution within a migrate project.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    eventName:
      name: eventName
      description: Unique name of an event within a migrate project.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    continuationToken:
      name: continuationToken
      description: The continuation token.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: string
    pageSize:
      name: pageSize
      description: The number of items to be returned in a single page. This value
        is honored only if it is less than the 100.
      in: query
      required: false
      x-ms-parameter-location: method
      schema:
        type: integer
        format: int32
    virtualDesktopUserName:
      name: virtualDesktopUserName
      description: The ARM name of the webserver to be fetched.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9-]{3,24}$
    webServerId:
      name: webServerId
      description: The ARM name of the virtual desktop user.
      in: path
      x-ms-parameter-location: method
      required: true
      schema:
        type: string
    webSiteName:
      name: webSiteName
      description: The ARM name of the website to be fetched.
      in: path
