openapi: 3.0.0
info:
  title: Microsoft Marketplace Discovery API Keys Management
  description: This API is designed to streamline the process of generating designated
    keys for accessing all Marketplace Catalog APIs. By utilizing a simple POST operation,
    users can effortlessly generate a unique API key, granting  access to Marketplace
    Catalog APIs from version 2023-01-01 and beyond.
  version: 2023-01-01-preview
servers:
- url: https://management.azure.com
paths:
  /subscriptions/{subscriptionId}/providers/Microsoft.Marketplace/keys/{apiKeyAlias}/create:
    post:
      tags:
      - CreateApiKey
      summary: Generates an API key, granting access to the full range of Marketplace
        Catalog APIs. Please note that this API is currently in a preview state and
        requires sign-up to the 'Discovery Api Key Early Access' preview feature using
        a valid Azure subscription. For more information on this process please see
        the documentation for Marketplace Catalog APIs [here](https://learn.microsoft.com/en-us/rest/api/marketplacecatalog/dataplane/products/get?view=rest-marketplacecatalog-dataplane-2023-05-01-preview&tabs=HTTP)
      operationId: CreateApiKey_Post
      parameters:
      - name: apiKeyAlias
        in: path
        required: true
        description: Alias for new API Key. This alias must be unique and contain
          only alphanumeric characters separated by dashes.
        schema:
          type: string
      - name: x-ms-client-tenant-id
        x-originalName: tenantId
        description: The tenant associated with the subscription.
        in: header
        required: true
        x-nullable: true
        schema:
          type: string
      - name: api-version
        in: query
        description: The API version to use for this operation.
        required: true
        schema:
          type: string
          minLength: 1
      - name: subscriptionId
        in: path
        description: The ID of the target subscription. The value must be an UUID.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          x-nullable: false
          description: Returns the newly created API key.
          content:
            application/json:
              schema:
                type: object
                description: ApiKey object containing both the key and its alias.
                properties:
                  keyAlias:
                    description: The API key alias.
                    type: string
                  key:
                    description: The API key to be used when calling relevant Discovery
                      endpoints.
                    type: string
        default:
          description: Microsoft.Marketplace error response describing why the operation
            failed.
          content:
            application/json:
              schema:
                type: object
                title: Error response
                description: Common error response for all Azure Resource Manager
                  APIs to return error details for failed operations. (This also follows
                  the OData error response format.).
                properties:
