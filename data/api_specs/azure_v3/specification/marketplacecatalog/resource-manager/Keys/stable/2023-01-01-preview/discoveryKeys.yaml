        a preview state and requires sign-up to the 'Discovery Api Key Early Access'
        preview feature using a valid Azure subscription. For more information on
        this process please see the documentation for Marketplace Catalog APIs [here](https://learn.microsoft.com/en-us/rest/api/marketplacecatalog/dataplane/products/get?view=rest-marketplacecatalog-dataplane-2023-05-01-preview&tabs=HTTP)
