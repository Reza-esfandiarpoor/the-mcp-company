  /data/legend/interval/{classmapName}:
    get:
      operationId: MapsIntervalLegends_GetByClassmapName
      tags:
      - Map Legends
      summary: Get Interval Legend
      description: 'Generate values and color swatches mapping for a given interval
        classmap.


        Args:

        trim_start (int, optional): Number of items to trim from

        the start of the cmap

        trim_end (int, optional): Number of items to trim from the end of the cmap'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: classmapName
        in: path
        description: classmap name
        required: true
        schema:
          type: string
          maxLength: 500
          pattern: .*
      - name: trim_start
        in: query
        description: Number of items to trim from the start of the cmap
        required: false
        x-ms-client-name: trimStart
        schema:
          type: integer
          format: int32
      - name: trim_end
        in: query
        description: Number of items to trim from the end of the cmap
        required: false
        x-ms-client-name: trimEnd
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: "Interval legend response model.\n\nRepresents a color map
            for intervals, where each interval is defined by:\n- A numeric range `[min,
            max]` representing the interval boundaries.\n- An RGBA color `[red, green,
            blue, alpha]` associated with the interval.\n\nThe response is a 2D array
            of interval definitions, where each element is a pair:\n- The first element
            is an array of two numbers `[min, max]` defining the interval.\n- The
            second element is an array of four numbers `[red, green, blue, alpha]`
            defining the RGBA color.\n\nExample:\n```json\n[\n  [\n    [-2, 0], [0,
            0, 0, 0]\n  ],\n  [\n    [1, 32], [255, 255, 178, 255]\n  ]\n]\n```\nThis
            example defines two intervals:\n- The interval `[-2, 0]` is mapped to
            the color `[0, 0, 0, 0]` (transparent black).\n- The interval `[1, 32]`
            is mapped to the color `[255, 255, 178, 255]` (opaque yellow)."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/IntervalLegendsElement'
        '204':
          description: There is no content to send for this request, but the headers
            may be useful.
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
