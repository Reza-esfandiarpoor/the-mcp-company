              description: XYZ tile addressing scheme with origin at top-left
            - name: tms
              value: tms
              description: TMS tile addressing scheme with origin at bottom-left
        tiles:
          type: array
          description: Array of tile URL templates
          items:
            type: string
        grids:
          type: array
          description: Array of UTFGrid URL templates
          items:
            type: string
        data:
          type: array
          description: Array of data file URL templates
          items:
            type: string
        minzoom:
          type: integer
          format: int32
          description: Minimum zoom level available in the tile set
          maximum: 30
        maxzoom:
          type: integer
          format: int32
          description: Maximum zoom level available in the tile set
          default: 30
          maximum: 30
        bounds:
          type: array
          description: Bounds
          default:
          - -180
          - -90
          - 180
          - 90
          items:
            type: number
            format: float
        center:
          type: array
          description: Default center point [longitude, latitude, zoom] for the tile
            set
          items:
            type: number
            format: float
      required:
      - tiles
    TileJsonScheme:
      type: string
      description: Scheme for tile addressing in TileJSON specification
      enum:
      - xyz
      - tms
      x-ms-enum:
        name: TileJsonScheme
        modelAsString: true
        values:
        - name: xyz
          value: xyz
          description: XYZ tile addressing scheme with origin at top-left
        - name: tms
          value: tms
          description: TMS tile addressing scheme with origin at bottom-left
    TileMatrix:
      type: object
      description: 'Tile Matrix Definition


        A tile matrix, usually corresponding to a particular zoom level of a

        TileMatrixSet.


        ref:

        https://github.com/opengeospatial/2D-Tile-Matrix-Set/blob/master/schemas/tms/2.0/json/tileMatrix.json


        Definition of a tile matrix at a specific zoom level within a tile matrix
        set'
      properties:
        title:
          type: string
          description: Human-readable title of the tile matrix level
        description:
          type: string
          description: Human-readable description of this tile matrix level
        keywords:
          type: array
          description: 'Unordered list of one or more commonly used or formalized
            word(s) or phrase(s)

            used to describe this dataset'
          items:
            type: string
        id:
          type: string
          description: Unique identifier for this tile matrix level, often the zoom
            level
          pattern: ^[-]?[0-9]+$
        scaleDenominator:
          type: number
          format: float
          description: Scale denominator representing the scale of this tile matrix
            level
        cellSize:
          type: number
          format: float
          description: Size of a pixel in map units at this tile matrix level
        cornerOfOrigin:
          $ref: '#/components/schemas/TileMatrixCornerOfOrigin'
        pointOfOrigin:
          type: array
          description: 'Precise position in CRS coordinates of the corner of origin
            (e.g. the top-left

            corner) for this tile matrix. This position is also a corner of the (0,
            0)

            tile. In previous version, this was ''topLeftCorner'' and ''cornerOfOrigin''
            did

            not exist.'
          items:
            type: number
            format: double
        tileWidth:
          type: integer
          format: int32
          description: Pixel width of each tile at this level
          minimum: 1
        tileHeight:
          type: integer
          format: int32
          description: Pixel height of each tile at this level
          minimum: 1
        matrixWidth:
          type: integer
          format: int32
          description: Number of tiles horizontally at this matrix level
          minimum: 1
        matrixHeight:
          type: integer
          format: int32
          description: Number of tiles vertically at this matrix level
          minimum: 1
        variableMatrixWidths:
          type: array
          description: 'Describes the rows that has variable matrix width


            ref: https://github.com/opengeospatial/2D-Tile-Matrix-Set/blob/master/schemas/tms/2.0/json/variableMatrixWidth.json'
          items:
            $ref: '#/components/schemas/VariableMatrixWidth'
      required:
      - id
      - scaleDenominator
      - cellSize
      - pointOfOrigin
      - tileWidth
      - tileHeight
      - matrixWidth
      - matrixHeight
    TileMatrixCornerOfOrigin:
      type: string
      description: 'The corner of the tile matrix (_topLeft_ or _bottomLeft_) used
        as the origin

        for numbering tile rows and columns. This corner is also a corner of the (0,
        0)

        tile.'
      enum:
      - topLeft
      - bottomLeft
      x-ms-enum:
        name: TileMatrixCornerOfOrigin
        modelAsString: true
        values:
        - name: topLeft
          value: topLeft
          description: Origin at the top-left corner (Y increases downward)
        - name: bottomLeft
          value: bottomLeft
          description: Origin at the bottom-left corner (Y increases upward)
    TileMatrixSet:
      type: object
      description: 'https://github.com/opengeospatial/2D-Tile-Matrix-Set/blob/master/schemas/tms/2.0/json/tileMatrixSet.json


        A definition of a tile matrix set following the Tile Matrix Set standard.

        For tileset metadata, such a description (in `tileMatrixSet` property) is
        only

        required for offline use,

        as an alternative to a link with a

        `http://www.opengis.net/def/rel/ogc/1.0/tiling-scheme` relation type.'
      properties:
        title:
          type: string
          description: Human-readable title of the tile matrix set
        description:
          type: string
          description: 'Brief narrative description of this tile matrix set, normally
            available for

            display to a human'
        keywords:
          type: array
          description: 'Unordered list of one or more commonly used or formalized
            word(s) or phrase(s)

            used to describe this tile matrix set'
          items:
            type: string
        id:
          type: string
          description: Unique identifier for the tile matrix set
          pattern: ^[\w\d_\-]+$
        uri:
          type: string
          description: URI reference to the official definition
        orderedAxes:
          type: array
          description: Names of the coordinate axes in order
          items:
            type: string
        crs:
          type: string
          description: Coordinate reference system identifier
        wellKnownScaleSet:
          type: string
          format: uri
          description: URL reference to a standardized scale set
        boundingBox:
          $ref: '#/components/schemas/TileMatrixSetBoundingBox'
        tileMatrices:
          type: array
          description: Array of tile matrices at different zoom levels
          items:
            $ref: '#/components/schemas/TileMatrix'
      required:
      - crs
      - tileMatrices
    TileMatrixSetBoundingBox:
      type: object
      description: Geographic extent of the tile matrix set expressed in the specified
        coordinate reference system
      properties:
        lowerLeft:
          type: array
          description: Lower-left corner coordinates [x, y] of bounding box
          items:
            type: string
        upperRight:
          type: array
          description: Upper-right corner coordinates [x, y] of bounding box
          items:
            type: string
        crs:
          type: string
          description: Coordinate reference system identifier (e.g., 'http://www.opengis.net/def/crs/EPSG/0/3857')
        orderedAxes:
          type: array
          description: Explicit axis order for the CRS coordinates (e.g., ['x', 'y'])
          items:
            type: string
      required:
      - lowerLeft
      - upperRight
    TileSettings:
