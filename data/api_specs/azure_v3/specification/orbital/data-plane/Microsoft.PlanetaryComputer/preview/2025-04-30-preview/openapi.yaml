          value: nearest
          description: Nearest neighbor - fastest method that selects the closest
            pixel value
        - name: bilinear
          value: bilinear
          description: Bilinear interpolation - calculates output values using a weighted
            average of 2x2 input cells
        - name: cubic
          value: cubic
          description: Cubic interpolation - uses a weighted average of 4x4 input
            cells for smoother results
        - name: cubic_spline
          value: cubic_spline
          description: Cubic spline interpolation - similar to cubic but preserves
            edges better
        - name: lanczos
