  /data/mosaic/{searchId}/tiles/{z}/{x}/{y}@{scale}x.{format}:
    get:
      operationId: MosaicsTiles_GetZxyScalexFormat
      tags:
      - Tiles for STAC Collections Mosaics
      summary: Tile
      description: Create map tile.
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - name: searchId
        in: path
        description: Search Id (pgSTAC Search Hash)
        required: true
        schema:
          type: string
          maxLength: 500
          pattern: .*
      - $ref: '#/components/parameters/AssetQueryParameters.assets'
      - $ref: '#/components/parameters/AssetQueryParameters.expression'
      - $ref: '#/components/parameters/AssetQueryParameters.assetBidx'
      - $ref: '#/components/parameters/AssetQueryParameters.assetAsBand'
      - $ref: '#/components/parameters/AssetQueryParameters.nodata'
      - $ref: '#/components/parameters/AssetQueryParameters.unscale'
      - $ref: '#/components/parameters/MosaicSearchQueryParameters.scanLimit'
      - $ref: '#/components/parameters/MosaicSearchQueryParameters.itemsLimit'
      - $ref: '#/components/parameters/MosaicSearchQueryParameters.timeLimit'
      - $ref: '#/components/parameters/MosaicSearchQueryParameters.exitwhenfull'
      - $ref: '#/components/parameters/MosaicSearchQueryParameters.skipcovered'
      - $ref: '#/components/parameters/AlgorithmQueryParameters.algorithm'
      - $ref: '#/components/parameters/AlgorithmQueryParameters.algorithmParams'
      - $ref: '#/components/parameters/ZxyPathParameters.z'
      - $ref: '#/components/parameters/ZxyPathParameters.x'
      - $ref: '#/components/parameters/ZxyPathParameters.y'
      - name: tileMatrixSetId
        in: query
        description: 'Identifier selecting one of the TileMatrixSetId supported (default:

          ''WebMercatorQuad'')'
        required: false
        x-ms-enum:
          name: Tilematrixsetid
          modelAsString: true
          values:
          - name: CanadianNAD83_LCC
            value: CanadianNAD83_LCC
            description: Canadian NAD83 Lambert Conformal Conic projection tile matrix
              set
          - name: EuropeanETRS89_LAEAQuad
            value: EuropeanETRS89_LAEAQuad
            description: European ETRS89 Lambert Azimuthal Equal Area Quad tile matrix
              set
          - name: LINZAntarticaMapTilegrid
            value: LINZAntarticaMapTilegrid
            description: Land Information New Zealand (LINZ) Antarctica Map tile grid
              matrix set
          - name: NZTM2000Quad
            value: NZTM2000Quad
            description: New Zealand Transverse Mercator 2000 Quad tile matrix set
          - name: UPSAntarcticWGS84Quad
            value: UPSAntarcticWGS84Quad
            description: Universal Polar Stereographic Antarctic WGS84 Quad tile matrix
              set
          - name: UPSArcticWGS84Quad
            value: UPSArcticWGS84Quad
            description: Universal Polar Stereographic Arctic WGS84 Quad tile matrix
              set
          - name: UTM31WGS84Quad
            value: UTM31WGS84Quad
            description: Universal Transverse Mercator Zone 31 WGS84 Quad tile matrix
              set
          - name: WGS1984Quad
            value: WGS1984Quad
            description: WGS 1984 Quad tile matrix set
          - name: WebMercatorQuad
            value: WebMercatorQuad
            description: Web Mercator Quad tile matrix set
          - name: WorldCRS84Quad
            value: WorldCRS84Quad
            description: World CRS84 Quad tile matrix set
          - name: WorldMercatorWGS84Quad
            value: WorldMercatorWGS84Quad
            description: World Mercator WGS84 Quad tile matrix set
        schema:
          type: string
          enum:
          - CanadianNAD83_LCC
          - EuropeanETRS89_LAEAQuad
          - LINZAntarticaMapTilegrid
          - NZTM2000Quad
          - UPSAntarcticWGS84Quad
          - UPSArcticWGS84Quad
          - UTM31WGS84Quad
          - WGS1984Quad
          - WebMercatorQuad
          - WorldCRS84Quad
          - WorldMercatorWGS84Quad
          default: WebMercatorQuad
      - name: scale
        in: path
        description: 'Numeric scale factor for the tile. Higher values produce larger
          tiles (default: "1")'
        required: true
        schema:
