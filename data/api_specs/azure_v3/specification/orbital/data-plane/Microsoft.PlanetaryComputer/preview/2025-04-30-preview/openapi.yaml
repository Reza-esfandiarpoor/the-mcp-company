  /stac/collections/{collectionId}/items:
    get:
      operationId: StacItems_GetFeatures
      tags:
      - SpatioTemporal Asset Catalog (STAC) API
      description: 'Fetch features of the feature collection with id `collectionId`.


        Every feature in a dataset belongs to a collection. A dataset may

        consist of multiple feature collections. A feature collection is often a

        collection of features of a similar type, based on a common schema.")'
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/CollectionParameters.collectionId'
      - name: limit
        in: query
        description: 'The optional limit parameter recommends the number of items
          that should be present in the response document.


          If the limit parameter value is greater than advertised limit maximum, the
          server must return the

          maximum possible number of items, rather than responding with an error.


          Only items are counted that are on the first level of the collection in
          the response document.

          Nested objects contained within the explicitly requested items must not
          be counted.


          Minimum = 1. Maximum = 10000. Default = 10.'
        required: false
        schema:
          type: integer
          format: int64
      - name: bbox
        in: query
        description: 'Only features that have a geometry that intersects the bounding
          box are selected.

          The bounding box is provided as four or six numbers, depending on whether
          the

          coordinate reference system includes a vertical axis (height or depth):


          - Lower left corner, coordinate axis 1

          - Lower left corner, coordinate axis 2

          - Minimum value, coordinate axis 3 (optional)

          - Upper right corner, coordinate axis 1

          - Upper right corner, coordinate axis 2

          - Maximum value, coordinate axis 3 (optional)


          The coordinate reference system of the values is WGS 84 longitude/latitude

          (http://www.opengis.net/def/crs/OGC/1.3/CRS84).


          For WGS 84 longitude/latitude the values are in most cases the sequence
          of

          minimum longitude, minimum latitude, maximum longitude and maximum latitude.

          However, in cases where the box spans the antimeridian the first value

          (west-most box edge) is larger than the third value (east-most box edge).


          If the vertical axis is included, the third and the sixth number are

          the bottom and the top of the 3-dimensional bounding box.


          If a feature has multiple spatial geometry properties, it is the decision
          of the

          server whether only a single spatial geometry property is used to determine

          the extent or all relevant geometries.'
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: datetime
        in: query
        description: 'Either a date-time or an interval, open or closed. Date and
          time expressions

          adhere to RFC 3339. Open intervals are expressed using double-dots.


          Examples:


          - A date-time: "2018-02-12T23:20:50Z"

          - A closed interval: "2018-02-12T00:00:00Z/2018-03-18T12:31:12Z"

          - Open intervals: "2018-02-12T00:00:00Z/.." or "../2018-03-18T12:31:12Z"


          Only features that have a temporal property that intersects the value of

          `datetime` are selected.


          If a feature has multiple temporal properties, it is the decision of the

          server whether only a single temporal property is used to determine

          the extent or all relevant temporal properties.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCollection'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
    post:
      operationId: StacItems_Create
      tags:
      - SpatioTemporal Asset Catalog (STAC) API
      description: Create a new STAC item or a set of items in a collection
      parameters:
      - $ref: '#/components/parameters/Azure.Core.Foundations.ApiVersionParameter'
      - $ref: '#/components/parameters/CollectionParameters.collectionId'
      requestBody:
        content:
          application/json:
            schema: {}
        description: 'STAC Item or ItemCollection


          Represents a STAC Item or ItemCollection as defined by the STAC 1.0.0 standard.


          - **Item**: A GeoJSON Feature that represents a single spatiotemporal asset.

          It includes metadata such as geometry, datetime, and links to related assets.

          Example: A satellite image with its metadata.


          - **ItemCollection**: A GeoJSON FeatureCollection that contains multiple
          Items.

          It is used to group multiple related Items together, such as a collection
          of satellite images.


          This union allows the request body to accept either a single Item or a collection
          of Items.'
        required: true
      responses:
        '202':
          description: The request has been accepted for processing, but processing
            has not yet completed.
          headers:
            location:
              description: Url used to monitor the background operation
              schema:
                type: string
                format: uri
            operation-location:
              description: Url used to monitor the background operation
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: An unexpected error response.
          headers:
            x-ms-error-code:
              description: String error code indicating what went wrong.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Azure.Core.Foundations.ErrorResponse'
      x-ms-long-running-operation-options:
        final-state-via: location
      x-ms-long-running-operation: true
