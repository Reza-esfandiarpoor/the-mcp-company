    Resampling:
      type: string
      description: Resampling algorithm to use when reading source raster data at
        different resolutions
      enum:
      - nearest
      - bilinear
      - cubic
      - cubic_spline
      - lanczos
      - average
      - mode
      - gauss
      - rms
      x-ms-enum:
        name: Resampling
        modelAsString: true
        values:
        - name: nearest
          value: nearest
          description: Nearest neighbor - fastest method that selects the closest
            pixel value
        - name: bilinear
          value: bilinear
          description: Bilinear interpolation - calculates output values using a weighted
            average of 2x2 input cells
        - name: cubic
          value: cubic
          description: Cubic interpolation - uses a weighted average of 4x4 input
            cells for smoother results
        - name: cubic_spline
          value: cubic_spline
          description: Cubic spline interpolation - similar to cubic but preserves
            edges better
        - name: lanczos
          value: lanczos
          description: Lanczos windowed sinc resampling - high-quality with minimal
            artifacts
        - name: average
          value: average
          description: Average resampling - calculates the mean of all contributing
            pixels
        - name: mode
          value: mode
          description: Mode resampling - selects the most common value from contributing
            pixels
        - name: gauss
          value: gauss
          description: Gaussian weighted resampling - applies a gaussian weighting
            to contributing pixels
        - name: rms
          value: rms
          description: Root mean square resampling - useful for resampling error or
            deviation grids
