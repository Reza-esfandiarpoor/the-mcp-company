openapi: 3.0.0
info:
  title: RedisManagementClient
  description: REST API for Azure Redis Cache Service.
  version: 2024-11-01
security:
- azure_auth:
  - user_impersonation
paths:
  /providers/Microsoft.Cache/operations:
    get:
      tags:
      - Operations
      description: Lists all of the available REST API operations of the Microsoft.Cache
        provider.
      operationId: Operations_List
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      responses:
        '200':
          description: Success. The response describes the list of operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Cache/CheckNameAvailability:
    post:
      tags:
      - Redis
      operationId: Redis_CheckNameAvailability
      description: Checks that the redis cache name is valid and is not already in
        use.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckNameAvailabilityParameters'
        description: Parameters supplied to the CheckNameAvailability Redis operation.
          The only supported resource type is 'Microsoft.Cache/redis'
        required: true
      responses:
        '200':
          description: Name is available
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/listUpgradeNotifications
  : get:
      tags:
      - Redis
      operationId: Redis_ListUpgradeNotifications
      description: Gets any upgrade notifications for a Redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - name: history
        in: query
        required: true
        description: how many minutes in past to look for upgrade notifications
        schema:
          type: number
          format: double
      responses:
        '200':
          description: All upgrade notifications in given time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}:
    put:
      tags:
      - Redis
      operationId: Redis_Create
      description: Create or replace (overwrite/recreate, with potential downtime)
        an existing Redis cache.
      x-ms-long-running-operation: true
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisCreateParameters'
        description: Parameters supplied to the Create Redis operation.
        required: true
      responses:
        '200':
          description: The existing redis cache was successfully updated. Check provisioningState
            to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisResource'
        '201':
          description: The new redis cache was successfully created. Check provisioningState
            to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisResource'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Redis
      operationId: Redis_Update
      description: Update an existing Redis cache.
      x-ms-long-running-operation: true
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisUpdateParameters'
        description: Parameters supplied to the Update Redis operation.
        required: true
      responses:
        '200':
          description: The existing redis cache was successfully updated. Check provisioningState
            to see detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisResource'
        '202':
          description: The existing redis cache was successfully updated. Check Azure-AsyncOperation
            headers to poll detailed status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisResource'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Redis
      operationId: Redis_Delete
      description: Deletes a Redis cache.
      x-ms-long-running-operation: true
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The redis cache was successfully deleted.
        '202':
          description: The redis cache 'delete' operation was successfully enqueued;
            follow the Location header to poll for final outcome.
        '204':
          description: The redis cache was successfully deleted.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Redis
      operationId: Redis_Get
      description: Gets a Redis cache (resource description).
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: The redis cache was successfully found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisResource'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis:
    get:
      tags:
      - Redis
      operationId: Redis_ListByResourceGroup
      description: Lists all Redis caches in a resource group.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/providers/Microsoft.Cache/redis:
    get:
      tags:
      - Redis
      operationId: Redis_ListBySubscription
      description: Gets all Redis caches in the specified subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/listKeys:
    post:
      tags:
      - Redis
      operationId: Redis_ListKeys
      description: Retrieve a Redis cache's access keys. This operation requires write
        permission to the cache resource.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Lists the keys for the specified Redis cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisAccessKeys'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/regenerateKey:
    post:
      tags:
      - Redis
      operationId: Redis_RegenerateKey
      description: Regenerate Redis cache's access keys. This operation requires write
        permission to the cache resource.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisRegenerateKeyParameters'
        description: Specifies which key to regenerate.
        required: true
      responses:
        '200':
          description: Lists the regenerated keys for Redis Cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisAccessKeys'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/forceReboot:
    post:
      tags:
      - Redis
      operationId: Redis_ForceReboot
      description: Reboot specified Redis node(s). This operation requires write permission
        to the cache resource. There can be potential data loss.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisRebootParameters'
        description: Specifies which Redis node(s) to reboot.
        required: true
      responses:
        '200':
          description: Reboot operation successfully enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisForceRebootResponse'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/import:
    post:
      tags:
      - Redis
      operationId: Redis_ImportData
      x-ms-long-running-operation: true
      description: Import data into Redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRDBParameters'
        description: Parameters for Redis import operation.
        required: true
      responses:
        '200':
          description: Import operation succeeded.
        '202':
          description: Import operation successfully enqueued; follow the Location
            header to poll for final outcome.
        '204':
          description: Import operation succeeded.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/export:
    post:
      tags:
      - Redis
      operationId: Redis_ExportData
      x-ms-long-running-operation: true
      description: Export data from the redis cache to blobs in a container.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRDBParameters'
        description: Parameters for Redis export operation.
        required: true
      responses:
        '200':
          description: Export operation succeeded.
        '202':
          description: Export operation successfully enqueued; follow the Location
            header to poll for final outcome.
        '204':
          description: Export operation succeeded.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{cacheName}/flush:
    post:
      tags:
      - Redis
      operationId: Redis_FlushCache
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
        final-state-schema: ../../../../../common-types/resource-management/v3/types.json#/definitions/OperationStatusResult
      description: Deletes all of the keys in a cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Flush operation succeeded.
          headers:
            Location:
              description: URL to query for the status of the operation.
              schema:
                type: string
            Azure-AsyncOperation:
              description: URL to query for the status of the operation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatusResult'
        '202':
          description: Flush operation successfully enqueued; follow the Location
            header to poll for final outcome.
          headers:
            Location:
              description: URL to query for the status of the operation.
              schema:
                type: string
            Azure-AsyncOperation:
              description: URL to query for the status of the operation.
              schema:
                type: string
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{cacheName}/firewallRules:
    get:
      tags:
      - Redis
      - FirewallRules
      operationId: FirewallRules_List
      description: Gets all firewall rules in the specified redis cache.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      responses:
        '200':
          description: Successfully got the current rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisFirewallRuleListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{cacheName}/firewallRules/{ruleName}
  : put:
      tags:
      - Redis
      - FirewallRules
      operationId: FirewallRules_CreateOrUpdate
      description: Create or update a redis cache firewall rule
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      - name: ruleName
        in: path
        required: true
        description: The name of the firewall rule.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisFirewallRule'
        description: Parameters supplied to the create or update redis firewall rule
          operation.
        required: true
      responses:
        '200':
          description: Resource was successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisFirewallRule'
        '201':
          description: Resource was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisFirewallRule'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Redis
      - FirewallRules
      operationId: FirewallRules_Get
      description: Gets a single firewall rule in a specified redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      - name: ruleName
        in: path
        required: true
        description: The name of the firewall rule.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successfully found the rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisFirewallRule'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Redis
      - FirewallRules
      operationId: FirewallRules_Delete
      description: Deletes a single firewall rule in a specified redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      - name: ruleName
        in: path
        required: true
        description: The name of the firewall rule.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Successfully deleted the rule
        '204':
          description: Successfully deleted the rule
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{cacheName}/patchSchedules:
    get:
      tags:
      - Redis
      - PatchSchedules
      operationId: PatchSchedules_ListByRedisResource
      description: Gets all patch schedules in the specified redis cache (there is
        only one).
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - $ref: '#/components/parameters/CacheNameParameter'
      responses:
        '200':
          description: Successfully got the current patch schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisPatchScheduleListResult'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-pageable:
        nextLinkName: nextLink
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/patchSchedules/{default}
  : put:
      tags:
      - Redis
      - PatchSchedules
      operationId: PatchSchedules_CreateOrUpdate
      description: Create or replace the patching schedule for Redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - name: default
        in: path
        required: true
        description: Default string modeled as parameter for auto generation to work
          correctly.
        x-ms-enum:
          name: defaultName
          modelAsString: true
        schema:
          type: string
          enum:
          - default
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisPatchSchedule'
        description: Parameters to set the patching schedule for Redis cache.
        required: true
      responses:
        '200':
          description: The patch schedule was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisPatchSchedule'
        '201':
          description: The patch schedule was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisPatchSchedule'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Redis
      - PatchSchedules
      operationId: PatchSchedules_Delete
      description: Deletes the patching schedule of a redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the redis cache.
        schema:
          type: string
      - name: default
        in: path
        required: true
        description: Default string modeled as parameter for auto generation to work
          correctly.
        x-ms-enum:
          name: defaultName
          modelAsString: true
        schema:
          type: string
          enum:
          - default
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Success.
        '204':
          description: Success.
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Redis
      - PatchSchedules
      operationId: PatchSchedules_Get
      description: Gets the patching schedule of a redis cache.
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the redis cache.
        schema:
          type: string
      - name: default
        in: path
        required: true
        description: Default string modeled as parameter for auto generation to work
          correctly.
        x-ms-enum:
          name: defaultName
          modelAsString: true
        schema:
          type: string
          enum:
          - default
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Response of get patch schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisPatchSchedule'
        default:
          description: Error response describing why the operation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Cache/redis/{name}/linkedServers/{linkedServerName}
  : put:
      tags:
      - Redis
      operationId: LinkedServer_Create
      x-ms-long-running-operation: true
      description: Adds a linked server to the Redis cache (requires Premium SKU).
      parameters:
      - $ref: '#/components/parameters/ResourceGroupNameParameter'
      - name: name
        in: path
        required: true
        description: The name of the Redis cache.
        schema:
          type: string
      - name: linkedServerName
        in: path
        required: true
        description: The name of the linked server that is being added to the Redis
          cache.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedisLinkedServerCreateParameters'
        description: Parameters supplied to the Create Linked server operation.
        required: true
      responses:
        '200':
          description: The linked server was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisLinkedServerWithProperties'
        '201':
          description: The linked server was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedisLinkedServerWithProperties'
        default:
          description: Error response describing why the operation failed.
          content:
