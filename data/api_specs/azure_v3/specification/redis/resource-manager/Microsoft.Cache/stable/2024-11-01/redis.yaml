servers:
- url: https://management.azure.com
components:
  parameters:
    CacheNameParameter:
      name: cacheName
      in: path
      required: true
      description: The name of the Redis cache.
      x-ms-parameter-location: method
      schema:
        type: string
        pattern: ^([a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]|[a-zA-Z0-9])$
    AccessPolicyNameParameter:
      name: accessPolicyName
      in: path
      required: true
      description: The name of the access policy that is being added to the Redis
        cache.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: ^([a-zA-Z0-9][a-zA-Z0-9- ]*[a-zA-Z0-9]|[a-zA-Z0-9])$
    AccessPolicyAssignmentNameParameter:
      name: accessPolicyAssignmentName
      in: path
      required: true
      description: The name of the access policy assignment.
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: ^([a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9]|[a-zA-Z0-9])$
    ApiVersionParameter:
      name: api-version
      in: query
      description: The API version to use for this operation.
      required: true
      schema:
        type: string
        minLength: 1
    SubscriptionIdParameter:
      name: subscriptionId
      in: path
      description: The ID of the target subscription.
      required: true
      schema:
        type: string
        minLength: 1
    ResourceGroupNameParameter:
      name: resourceGroupName
      in: path
      description: The name of the resource group. The name is case insensitive.
      required: true
      x-ms-parameter-location: method
      schema:
        type: string
        minLength: 1
        maxLength: 90
    PrivateEndpointConnectionName:
      name: privateEndpointConnectionName
      in: path
      required: true
      description: The name of the private endpoint connection associated with the
        Azure resource
      x-ms-parameter-location: method
      schema:
        type: string
  securitySchemes:
    azure_auth:
      type: oauth2
      description: Azure Active Directory OAuth2 Flow.
      flows:
        implicit:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/authorize
          scopes:
            user_impersonation: impersonate your user account
  schemas:
    Sku:
      properties:
        name:
          type: string
          description: 'The type of Redis cache to deploy. Valid values: (Basic, Standard,
            Premium)'
          enum:
          - Basic
          - Standard
          - Premium
          x-ms-enum:
            name: SkuName
            modelAsString: true
        family:
          type: string
          description: 'The SKU family to use. Valid values: (C, P). (C = Basic/Standard,
            P = Premium).'
          enum:
          - C
          - P
          x-ms-enum:
            name: SkuFamily
            modelAsString: true
        capacity:
          type: integer
          format: int32
          description: 'The size of the Redis cache to deploy. Valid values: for C
            (Basic/Standard) family (0, 1, 2, 3, 4, 5, 6), for P (Premium) family
            (1, 2, 3, 4).'
      required:
      - name
      - family
      - capacity
      description: SKU parameters supplied to the create Redis operation.
    RedisCommonProperties:
      properties:
        redisConfiguration:
          type: object
          properties:
            rdb-backup-enabled:
              type: string
              description: Specifies whether the rdb backup is enabled
            rdb-backup-frequency:
              type: string
              description: 'Specifies the frequency for creating rdb backup in minutes.
                Valid values: (15, 30, 60, 360, 720, 1440)'
            rdb-backup-max-snapshot-count:
              type: string
              description: Specifies the maximum number of snapshots for rdb backup
            rdb-storage-connection-string:
              type: string
              description: The storage account connection string for storing rdb file
            aof-backup-enabled:
              type: string
              description: Specifies whether the aof backup is enabled
            aof-storage-connection-string-0:
              type: string
              description: First storage account connection string
            aof-storage-connection-string-1:
              type: string
              description: Second storage account connection string
            maxfragmentationmemory-reserved:
              type: string
              description: Value in megabytes reserved for fragmentation per shard
            maxmemory-policy:
              type: string
              description: The eviction strategy used when your data won't fit within
                its memory limit.
            maxmemory-reserved:
              type: string
              description: Value in megabytes reserved for non-cache usage per shard
                e.g. failover.
            maxmemory-delta:
              type: string
              description: Value in megabytes reserved for non-cache usage per shard
                e.g. failover.
            maxclients:
              type: string
              description: The max clients config
              readOnly: true
            notify-keyspace-events:
              type: string
              description: The keyspace events which should be monitored.
            preferred-data-archive-auth-method:
              type: string
              description: Preferred auth method to communicate to storage account
                used for data archive, specify SAS or ManagedIdentity, default value
                is SAS
              readOnly: true
            preferred-data-persistence-auth-method:
              type: string
              description: Preferred auth method to communicate to storage account
                used for data persistence, specify SAS or ManagedIdentity, default
                value is SAS
            zonal-configuration:
              type: string
              description: Zonal Configuration
              readOnly: true
            authnotrequired:
              type: string
              description: Specifies whether the authentication is disabled. Setting
                this property is highly discouraged from security point of view.
            storage-subscription-id:
              type: string
              description: SubscriptionId of the storage account for persistence (aof/rdb)
                using ManagedIdentity.
            aad-enabled:
              type: string
              description: Specifies whether AAD based authentication has been enabled
                or disabled for the cache
          additionalProperties: {}
          description: 'All Redis Settings. Few possible keys: rdb-backup-enabled,rdb-storage-connection-string,rdb-backup-frequency,maxmemory-delta,
            maxmemory-policy,notify-keyspace-events, aof-backup-enabled, aof-storage-connection-string-0,
            aof-storage-connection-string-1 etc.'
        redisVersion:
          type: string
          description: 'Redis version. This should be in the form ''major[.minor]''
            (only ''major'' is required) or the value ''latest'' which refers to the
            latest stable Redis version that is available. Supported versions: 4.0,
            6.0 (latest). Default value is ''latest''.'
        enableNonSslPort:
          type: boolean
          default: false
          description: Specifies whether the non-ssl Redis server port (6379) is enabled.
        replicasPerMaster:
          type: integer
          format: int32
          description: The number of replicas to be created per primary.
        replicasPerPrimary:
          type: integer
          format: int32
          description: The number of replicas to be created per primary.
        tenantSettings:
          type: object
          additionalProperties:
            type: string
          description: A dictionary of tenant settings
        shardCount:
          type: integer
          format: int32
          description: The number of shards to be created on a Premium Cluster Cache.
        minimumTlsVersion:
          type: string
          description: 'Optional: requires clients to use a specified TLS version
            (or higher) to connect (e,g, ''1.0'', ''1.1'', ''1.2'')'
          enum:
          - '1.0'
          - '1.1'
          - '1.2'
          x-ms-enum:
            name: TlsVersion
            modelAsString: true
        publicNetworkAccess:
          description: Whether or not public endpoint access is allowed for this cache.  Value
            is optional but if passed in, must be 'Enabled' or 'Disabled'. If 'Disabled',
            private endpoints are the exclusive access method. Default value is 'Enabled'
          enum:
          - Enabled
          - Disabled
          default: Enabled
          type: string
          x-ms-enum:
            name: PublicNetworkAccess
            modelAsString: true
        updateChannel:
          type: string
          description: 'Optional: Specifies the update channel for the monthly Redis
            updates your Redis Cache will receive. Caches using ''Preview'' update
            channel get latest Redis updates at least 4 weeks ahead of ''Stable''
            channel caches. Default value is ''Stable''.'
          enum:
          - Stable
          - Preview
          x-ms-enum:
            name: UpdateChannel
            modelAsString: true
        disableAccessKeyAuthentication:
          type: boolean
          description: Authentication to Redis through access keys is disabled when
            set as true. Default value is false.
          default: false
        zonalAllocationPolicy:
          type: string
          description: 'Optional: Specifies how availability zones are allocated to
            the Redis cache. ''Automatic'' enables zone redundancy and Azure will
            automatically select zones based on regional availability and capacity.
            ''UserDefined'' will select availability zones passed in by you using
            the ''zones'' parameter. ''NoZones'' will produce a non-zonal cache. If
