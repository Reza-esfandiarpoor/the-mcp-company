                        \ combination with other groups as this will result in duplicate\
                        \ audit logs.\r\n\r\nFor more information, see [Database-Level\
                        \ Audit Action Groups](https://docs.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions#database-level-audit-action-groups).\r\
                        \n\r\nFor Database auditing policy, specific Actions can also\
                        \ be specified (note that Actions cannot be specified for\
                        \ Server auditing policy). The supported actions to audit\
                        \ are:\r\nSELECT\r\nUPDATE\r\nINSERT\r\nDELETE\r\nEXECUTE\r\
