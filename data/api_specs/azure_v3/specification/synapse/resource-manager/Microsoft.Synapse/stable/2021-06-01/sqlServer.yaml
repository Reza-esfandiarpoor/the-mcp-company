                    auditActionsAndGroups:
                      description: "Specifies the Actions-Groups and Actions to audit.\r\
                        \n\r\nThe recommended set of action groups to use is the following\
                        \ combination - this will audit all the queries and stored\
                        \ procedures executed against the database, as well as successful\
                        \ and failed logins:\r\n\r\nBATCH_COMPLETED_GROUP,\r\nSUCCESSFUL_DATABASE_AUTHENTICATION_GROUP,\r\
