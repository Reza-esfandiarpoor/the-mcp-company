  schemas:
    ServerBlobAuditingPolicyProperties:
      description: Properties of a server blob auditing policy.
      required:
      - state
      type: object
      properties:
        state:
          description: Specifies the state of the policy. If state is Enabled, storageEndpoint
            or isAzureMonitorTargetEnabled are required.
          enum:
          - Enabled
          - Disabled
          type: string
          x-ms-enum:
            name: BlobAuditingPolicyState
            modelAsString: false
        storageEndpoint:
          description: Specifies the blob storage endpoint (e.g. https://MyAccount.blob.core.windows.net).
            If state is Enabled, storageEndpoint or isAzureMonitorTargetEnabled is
            required.
          type: string
        storageAccountAccessKey:
          description: "Specifies the identifier key of the auditing storage account.\
            \ \r\nIf state is Enabled and storageEndpoint is specified, not specifying\
            \ the storageAccountAccessKey will use SQL server system-assigned managed\
            \ identity to access the storage.\r\nPrerequisites for using managed identity\
            \ authentication:\r\n1. Assign SQL Server a system-assigned managed identity\
            \ in Azure Active Directory (AAD).\r\n2. Grant SQL Server identity access\
            \ to the storage account by adding 'Storage Blob Data Contributor' RBAC\
            \ role to the server identity.\r\nFor more information, see [Auditing\
            \ to storage using Managed Identity authentication](https://go.microsoft.com/fwlink/?linkid=2114355)"
          type: string
          x-ms-mutability:
          - create
          - update
        retentionDays:
          format: int32
          description: Specifies the number of days to keep in the audit logs in the
            storage account.
          type: integer
          x-ms-mutability:
          - create
          - read
        auditActionsAndGroups:
          description: "Specifies the Actions-Groups and Actions to audit.\r\n\r\n\
            The recommended set of action groups to use is the following combination\
            \ - this will audit all the queries and stored procedures executed against\
            \ the database, as well as successful and failed logins:\r\n\r\nBATCH_COMPLETED_GROUP,\r\
            \nSUCCESSFUL_DATABASE_AUTHENTICATION_GROUP,\r\nFAILED_DATABASE_AUTHENTICATION_GROUP.\r\
            \n\r\nThis above combination is also the set that is configured by default\
            \ when enabling auditing from the Azure portal.\r\n\r\nThe supported action\
            \ groups to audit are (note: choose only specific groups that cover your\
            \ auditing needs. Using unnecessary groups could lead to very large quantities\
