                                \nDATABASE_PERMISSION_CHANGE_GROUP\r\nDATABASE_PRINCIPAL_CHANGE_GROUP\r\
                                \nDATABASE_PRINCIPAL_IMPERSONATION_GROUP\r\nDATABASE_ROLE_MEMBER_CHANGE_GROUP\r\
                                \nFAILED_DATABASE_AUTHENTICATION_GROUP\r\nSCHEMA_OBJECT_ACCESS_GROUP\r\
                                \nSCHEMA_OBJECT_CHANGE_GROUP\r\nSCHEMA_OBJECT_OWNERSHIP_CHANGE_GROUP\r\
                                \nSCHEMA_OBJECT_PERMISSION_CHANGE_GROUP\r\nSUCCESSFUL_DATABASE_AUTHENTICATION_GROUP\r\
                                \nUSER_CHANGE_PASSWORD_GROUP\r\nBATCH_STARTED_GROUP\r\
                                \nBATCH_COMPLETED_GROUP\r\n\r\nThese are groups that\
                                \ cover all sql statements and stored procedures executed\
                                \ against the database, and should not be used in\
                                \ combination with other groups as this will result\
                                \ in duplicate audit logs.\r\n\r\nFor more information,\
                                \ see [Database-Level Audit Action Groups](https://docs.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions#database-level-audit-action-groups).\r\
                                \n\r\nFor Database auditing policy, specific Actions\
                                \ can also be specified (note that Actions cannot\
                                \ be specified for Server auditing policy). The supported\
                                \ actions to audit are:\r\nSELECT\r\nUPDATE\r\nINSERT\r\
                                \nDELETE\r\nEXECUTE\r\nRECEIVE\r\nREFERENCES\r\n\r\
                                \nThe general form for defining an action to be audited\
                                \ is:\r\n{action} ON {object} BY {principal}\r\n\r\
                                \nNote that <object> in the above format can refer\
                                \ to an object like a table, view, or stored procedure,\
                                \ or an entire database or schema. For the latter\
                                \ cases, the forms DATABASE::{db_name} and SCHEMA::{schema_name}\
