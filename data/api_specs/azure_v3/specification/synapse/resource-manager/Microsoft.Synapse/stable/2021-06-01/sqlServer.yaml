                        \ see [Database-Level Audit Actions](https://docs.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions#database-level-audit-actions)"
                      type: array
                      items:
                        type: string
                      x-ms-mutability:
                      - create
